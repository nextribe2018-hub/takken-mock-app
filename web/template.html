<title>宅建 10分模試</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: ホーム（今の実力・5回セット・論点マップ）→ 試験画面（タイマー＋1問ずつ）→ 結果 → 解説と確認例題3問 */

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-disp);font-weight:800;font-size:1.7rem;margin:0}

.ov{margin:0;font-size:.95rem}

.flow .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ai);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.flow .s{padding-top:3px;font-size:.92rem}

.mchip .no{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;background:var(--ai-soft);color:var(--ai);font-size:.7rem;font-weight:700}

.sync{font-size:.78rem;margin:4px 0 0;color:var(--muted)}
.sync[data-s="ok"]{color:var(--ok)}
.sync[data-s="err"]{color:var(--ng)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:1.4fr .8fr .9fr 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem;font-variant-numeric:tabular-nums}

<div class="wrap" id="app"></div>

<script>
const BANK=__DATA__;
const LESSON=__LESSON__;
BANK.forEach((q,i)=>q.i=i);
{const seen={};BANK.forEach(q=>{let k=q.f+"|"+q.t+"|"+q.ref;seen[k]=(seen[k]||0)+1;if(seen[k]>1)k+="#"+seen[k];q.k=k})}
const BYKEY={};BANK.forEach(q=>BYKEY[q.k]=q);
const FIELDS=[["業法","宅建業法"],["権利","権利関係"],["法令","法令上の制限"],["税他","税・その他"]];
const MIX=[{業法:4,権利:3,法令:2,税他:1},{業法:4,権利:3,法令:2,税他:1},{業法:4,権利:3,法令:2,税他:1},{業法:4,権利:3,法令:1,税他:2},{業法:4,権利:2,法令:1,税他:3}];
const LIMIT=600;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let H=ls.get("tkm-hist",{}); // key -> {n,c,last}
// 旧形式（問題番号キー）を新しいキーに移す
if(Object.keys(H).some(k=>/^\d+$/.test(k))){const nh={};Object.keys(H).forEach(k=>{const q=/^\d+$/.test(k)?BANK[+k]:BYKEY[k];if(q)nh[q.k]=H[k]});H=nh}
let SET=ls.get("tkm-set",{round:0,scores:[]});
let LOG=[]; // 模試の履歴 {at,round,score,sec}
/* ---- server sync (db) ---- */
const SYNC={db:null,ref:null,status:"local",busy:false,dirty:false,timer:null};
function syncLabel(){const el=document.getElementById("sync");if(!el)return;const m={local:"この端末だけに保存中（サーバーに接続できません）",nort:"この端末だけに保存中：この開き方ではサーバー保存が使えません。下の「記録の引き継ぎ」でコピーを取ってください",nodb:"この端末だけに保存中：この画面ではサーバー保存が使えません（アプリの種類による）。下の「記録の引き継ぎ」でコピーを取ってください",nouser:"この端末だけに保存中：ログイン情報を取得できません。下の「記録の引き継ぎ」でコピーを取ってください",loading:"サーバーから読み込み中…",ok:"サーバーに保存済み",saving:"サーバーに保存中…",err:"サーバー保存に失敗しました（この端末には保存済み。次の回答時に再送します）"};el.textContent=m[SYNC.status]||"";el.dataset.s=SYNC.status}
async function push(){
  if(!SYNC.ref){return}
  if(SYNC.busy){SYNC.dirty=true;return}
  SYNC.busy=true;SYNC.status="saving";syncLabel();
  try{await SYNC.ref.set({v:2,hist:H,set:SET,log:LOG.slice(-200),updatedAt:new Date().toISOString()});SYNC.status="ok"}
  catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await SYNC.ref.set({v:2,hist:H,set:SET,log:LOG.slice(-200),updatedAt:new Date().toISOString()});SYNC.status="ok"}catch(e2){SYNC.status="err"}}else SYNC.status="err"}
  SYNC.busy=false;syncLabel();
  if(SYNC.dirty){SYNC.dirty=false;push()}
}
const save=()=>{ls.set("tkm-hist",H);ls.set("tkm-set",SET);ls.set("tkm-log",LOG);clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,600)};
LOG=ls.get("tkm-log",[]);
function mergeHist(a,b){const o={...a};Object.keys(b||{}).forEach(k=>{const x=o[k],y=b[k];o[k]=!x||((y.n||0)>(x.n||0))?y:x});return o}
async function connect(){
  try{
    if(!window.claude||!window.claude.use){SYNC.status="nort";syncLabel();return}
    SYNC.status="loading";syncLabel();
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){SYNC.status=!db?"nodb":"nouser";syncLabel();return}
    SYNC.db=db;SYNC.ref=db.doc("data/users/"+uid+"/progress");
    const snap=await SYNC.ref.get();
    if(snap.exists){const d=snap.data()||{};
      const localHad=Object.keys(H).length>0;
      H=mergeHist(d.hist||{},H);
      if(d.set&&(!localHad||(d.set.scores||[]).length>=(SET.scores||[]).length))SET=JSON.parse(JSON.stringify(d.set));
      const seenAt=new Set((d.log||[]).map(x=>x.at));LOG=[...(d.log||[]),...LOG.filter(x=>!seenAt.has(x.at))].sort((a,b)=>a.at<b.at?-1:1);
      ls.set("tkm-hist",H);ls.set("tkm-set",SET);ls.set("tkm-log",LOG);
      SYNC.status="ok";
      if(localHad)push();
    }else{SYNC.status="ok";if(Object.keys(H).length||LOG.length)await push()}
    syncLabel();
    if(document.getElementById("homeRoot"))home();
  }catch(e){SYNC.status="local";syncLabel()}
}
function render0(){SYNC.status="local";syncLabel()}
const enc=o=>"TKM1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=t=>{t=(t||"").trim().replace(/\s+/g,"");if(!t.startsWith("TKM1:"))throw new Error("形式");return JSON.parse(decodeURIComponent(escape(atob(t.slice(5)))))};
function exportRec(){
  const code=enc({hist:H,set:SET,log:LOG.slice(-200)});
  const n=Object.keys(H).length;
  $("#bk").innerHTML=`<p class="note" id="bkmsg">${n}問分の記録です。下の文字列をすべてコピーして、メモ帳などに保存してください。</p><textarea id="bkt" readonly rows="4" style="width:100%;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)">${code}</textarea>`;
  const ta=$("#bkt");ta.focus();ta.select();
  const done=()=>{$("#bkmsg").textContent=n+"問分の記録をコピーしました。メモ帳などに貼り付けて保存してください。"};
  try{navigator.clipboard.writeText(code).then(done,()=>{try{if(document.execCommand("copy"))done()}catch(e){}})}catch(e){try{if(document.execCommand("copy"))done()}catch(e2){}}
}
function importRec(){
  $("#bk").innerHTML=`<p class="note">保存しておいた文字列（TKM1: で始まる）を貼り付けて「復元する」を押してください。</p><textarea id="bki" rows="4" style="width:100%;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink)"></textarea><div class="row"><button class="btn pri" id="bkgo">復元する</button><span class="note" id="bkerr"></span></div>`;
  $("#bkgo").onclick=()=>{
    let d;try{d=dec($("#bki").value)}catch(e){$("#bkerr").textContent="読み取れませんでした。TKM1: から最後まで、全部を貼り付けてください。";return}
    const hist={};Object.keys(d.hist||{}).forEach(k=>{if(BYKEY[k])hist[k]=d.hist[k]});
    H=mergeHist(H,hist);
    if(d.set&&Array.isArray(d.set.scores)&&(d.set.scores.length>=(SET.scores||[]).length))SET=JSON.parse(JSON.stringify(d.set));
    const seenAt=new Set(LOG.map(x=>x.at));LOG=[...LOG,...(d.log||[]).filter(x=>x&&x.at&&!seenAt.has(x.at))].sort((a,b)=>a.at<b.at?-1:1);
    save();home();
  };
}
const $=s=>document.querySelector(s);
const app=$("#app");
let timerId=null;

/* speech */
const canSpeak=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
const clean=t=>t.replace(/○/g,"まる").replace(/×/g,"ばつ").replace(/㎡/g,"平方メートル").replace(/％|%/g,"パーセント");
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(t));u.lang="ja-JP";const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith("ja"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
let voice=ls.get("tkm-voice",false);

function rec(q,ok){const h=H[q.k]||{n:0,c:0};h.n++;if(ok)h.c++;h.last=ok?1:0;H[q.k]=h}
function prio(q){const h=H[q.k];if(!h)return 0;if(h.last===0)return 1;return 2+h.n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(pool,n,exclude){
  const c=shuffle(pool.filter(q=>!exclude.has(q.i)));
  c.sort((a,b)=>prio(a)-prio(b));
  // spread topics: take best-priority but avoid same topic twice when possible
  const out=[],used=new Set();
  for(const q of c){if(out.length>=n)break;if(!used.has(q.t)){out.push(q);used.add(q.t)}}
  for(const q of c){if(out.length>=n)break;if(!out.includes(q))out.push(q)}
  return out;
}
function topicStats(){
  const m={};
  BANK.forEach(q=>{const k=q.f+"|"+q.t;m[k]=m[k]||{f:q.f,t:q.t,total:0,n:0,c:0,recentWrong:0};const s=m[k];s.total++;const h=H[q.k];if(h){s.n+=h.n;s.c+=h.c;if(h.last===0)s.recentWrong++}});
  return Object.values(m);
}
function state(s){if(!s.n)return 0;const r=s.c/s.n;if(s.recentWrong>0||r<0.6)return 1;if(r<0.8||s.n<5)return 2;return 3}

/* ---------- home ---------- */
/* ---------- 合格の見込み（○×の積み上げから本試験50問の得点を推定） ---------- */
const PASS_LINES=[33,34,35,36,37]; // 例年の合格点は33〜37点。どの点になるかは同じ確率と仮定
const EXAM_N={業法:20,権利:14,法令:8,税他:8};
const FNAME=f=>FIELDS.find(x=>x[0]===f)[1];
function fieldStats(){const o={};FIELDS.forEach(([f])=>o[f]={n:0,c:0,q:0,tot:0});
  BANK.forEach(q=>{const s=o[q.f];s.tot++;const h=H[q.k];if(h){s.n+=h.n;s.c+=h.c;s.q++}});return o}
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gammaS(k,r){if(k<1)return gammaS(k+1,r)*Math.pow(r()||1e-12,1/k);const d=k-1/3,c=1/Math.sqrt(9*d);
  for(;;){let x,v;do{const u1=r()||1e-12,u2=r();x=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);v=1+c*x}while(v<=0);v=v*v*v;const u=r();
    if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u||1e-12)<0.5*x*x+d*(1-v+Math.log(v)))return d*v}}
// ○×の正答率 p から4択1問の正答率を推計（消去法・2択への絞り込みを含む）
// 各肢の判断を3通りに分ける：S＝確信して正しく判定／U＝迷う（○×なら半々で当たる）／W＝確信して誤る
// ○×正答率 p = S + U/2。k＝○×の誤りのうち「迷い」から来る割合（0＝誤りはすべて思い込み、1＝誤りはすべて迷い）
// 4択の解き方：「これが正解」と確信した肢があればその中から、なければ確信して消せなかった（迷う）肢から、それもなければ4肢から選ぶ
function toExam(p,k){if(k==null)k=0.5;if(p<1)k=Math.min(k,p/(1-p));const u=2*(1-p)*k,w=(1-p)*(1-k),s=Math.max(0,p-k*(1-p));const pr=[s,u,w];let P=0;
  for(let i=0;i<81;i++){const st=[i%3,(i/3|0)%3,(i/9|0)%3,(i/27|0)%3];let q=1;for(const x of st)q*=pr[x];if(!q)continue;
    const flag=[],uns=[];st.forEach((x,j)=>{if((j===0&&x===0)||(j>0&&x===2))flag.push(j);if(x===1)uns.push(j)});
    const cand=flag.length?flag:uns.length?uns:[0,1,2,3];if(cand.includes(0))P+=q/cand.length}
  return P}
const SCEN=[{k:0,label:"慎重（誤りはすべて思い込み）"},{k:0.5,label:"標準（誤りの半分は迷い）"},{k:1,label:"消去法が効く（誤りはすべて迷い）"}];
function simulate(st,k){const r=seeded(20261008),S=3000,sc=[];
  for(let i=0;i<S;i++){let x=0;FIELDS.forEach(([f])=>{const s=st[f];const a=gammaS(s.c+1,r),b=gammaS(s.n-s.c+1,r);const p=toExam(a/(a+b),k);for(let j=0;j<EXAM_N[f];j++)if(r()<p)x++});sc.push(x)}
  sc.sort((a,b)=>a-b);const byLine=PASS_LINES.map(t=>sc.filter(x=>x>=t).length/S);
  const exp={};FIELDS.forEach(([f])=>{const s=st[f];exp[f]=EXAM_N[f]*toExam((s.c+1)/(s.n+2),k)});
  return {k,byLine,prob:byLine.reduce((a,b)=>a+b,0)/byLine.length,mean:sc.reduce((a,b)=>a+b,0)/S,lo:sc[Math.floor(S*0.1)],hi:sc[Math.floor(S*0.9)],exp,four:FIELDS.reduce((a,[f])=>a+exp[f],0)/50}}
function passEst(){
  const st=fieldStats();const total=Object.values(st).reduce((a,s)=>a+s.n,0);
  if(total<30)return {ready:false,total,st};
  const scen=SCEN.map(x=>({...x,...simulate(st,x.k)}));const M=scen[1];
  const ox=Object.values(st).reduce((a,s)=>a+s.c,0)/total;
  // 伸ばすと効く分野＝本試験で落としている見込みの点が最も多い分野（標準の見立て）
  const focus=FIELDS.map(([f])=>f).sort((a,b)=>(EXAM_N[b]-M.exp[b])-(EXAM_N[a]-M.exp[a]))[0];
  return {ready:true,total,st,ox,scen,focus,...M};
}

}

/* ---------- exam ---------- */
function startExam(field){
  const qs=[];const ex=new Set();
  if(field){pick(BANK.filter(q=>q.f===field),10,ex).forEach(q=>qs.push(q))}
  else{const mix=MIX[SET.round];FIELDS.forEach(([f])=>{pick(BANK.filter(q=>q.f===f),mix[f],ex).forEach(q=>{qs.push(q);ex.add(q.i)})})}

  const E={qs,ans:Array(qs.length).fill(null),cur:0,left:LIMIT,start:Date.now(),field,label};
  const render=()=>{
    const q=E.qs[E.cur];const m=Math.floor(E.left/60),s=E.left%60;

    <div class="ox"><button class="btn ${E.ans[E.cur]===1?"sel":""}" id="o" ${E.field&&E.ans[E.cur]!=null?"disabled":""}>○</button><button class="btn ${E.ans[E.cur]===0?"sel":""}" id="x" ${E.field&&E.ans[E.cur]!=null?"disabled":""}>×</button></div>
    ${E.field&&E.ans[E.cur]!=null?(()=>{const ok=E.ans[E.cur]===q.a;return `<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答え：${q.a?"○":"×"}　<span class="note">${q.t}　${q.ref==="確認"?"確認問題":q.ref}</span></span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div>`})():""}

  };

function judge(sc){return sc>=8?["j-ok","合格圏"]:sc===7?["j-mid","合格ライン上"]:["j-ng","要復習"]}

    <div class="row"><span class="big">${sc}<span style="font-size:1.2rem"> / 10</span></span><span class="judge ${jc}">${jt}</span></div>

    ${wrongItems.length?`<p class="note">間違えた論点ごとに「解説 → 付随する論点 → 過去問の確認例題3問」の順で復習します。</p>
    <button class="btn pri" id="allw">間違えた${wrongItems.length}論点を復習する</button>
    <div class="row">${wrongItems.map((w,j)=>`<button class="btn" data-w="${j}">${w.key.split("|")[1]}だけ</button>`).join("")}</div>`:`<p>全問正解です。${E.field?"続けて解くと見込みの精度が上がります。":"次の回に進みましょう。"}</p>`}
    <div class="row"><button class="btn" id="home">ホームへ</button><button class="btn" id="nx">${E.field?`もう一度 ${FNAME(E.field)} 10問`:`第${SET.round+1}回へ進む`}</button></div>
  </section>
  ${setHtml}
  <section class="rv">${E.qs.map((q,k)=>{const ok=E.ans[k]===q.a;return `<article class="card"><div class="meta">問${k+1}　${q.t}　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    <div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　あなた：${E.ans[k]==null?"未回答":E.ans[k]?"○":"×"}　答え：${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div></article>`}).join("")}</section>`;
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>startReview([wrongItems[+b.dataset.w]]));
  if(wrongItems.length)$("#allw").onclick=()=>startReview(wrongItems);
  $("#home").onclick=home;$("#nx").onclick=()=>startExam(E.field);
  window.scrollTo(0,0);
}

/* ---------- review: 解説 → 付随論点 → 確認例題3問 ---------- */
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// 間違えた問題と最も関係の深い枝（大項目）を文字の2文字組の重なりで推定する
function bigr(x){const s=String(x).replace(/[\s、。・：（）()「」，,．.0-9０-９]/g,"");const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o}
function overlap(a,b){let n=0;b.forEach(x=>{if(a.has(x))n++});return n}
function cellHtml(x){x=esc(x);if(/^(○|◯|必要|可|あり|できる)/.test(x))return `<span class="o">${x}</span>`;if(/^(×|✕|不要|不可|なし|できない)/.test(x))return `<span class="x">${x}</span>`;return x}
// 間違えた問題に最も関係する枝・項目を推定（2文字組の重なり）
function hitOf(S,missed){
  let b=-1,it=-1;if(!S||!missed)return {b,it};
  const qb=bigr(missed.q.s+missed.q.e);let best=1;
  S.tree.forEach((x,i)=>{const sc=overlap(qb,bigr(x.h+x.items.join("")));if(sc>best){best=sc;b=i}});
  if(b>=0){let bi=0;S.tree[b].items.forEach((x,j)=>{const sc=overlap(qb,bigr(x));if(sc>bi){bi=sc;it=j}})}
  return {b,it};
}
const brHtml=(x,i,hit,tag)=>`<div class="br ${hit.b===i?"hit":""}" id="br-${i}"><h4><span class="no">${i+1}</span>${esc(x.h)}${hit.b===i&&tag?`<span class="tag">${tag}</span>`:""}</h4><ul>${x.items.map((y,j)=>`<li class="${hit.b===i&&hit.it===j?"hit":""}">${esc(y)}</li>`).join("")}</ul></div>`;
const tblHtml=(tb,rows,note)=>`<div><div style="font-weight:700;margin-bottom:6px">${esc(tb.title)}</div><div class="tw"><table class="st"><thead><tr>${tb.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${cellHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${note?`<p class="note" style="margin:4px 0 0">${note}</p>`:""}</div>`;
const missedHtml=missed=>missed?`<article class="card"><div class="meta">あなたが間違えた問題　${missed.q.ref==="確認"?"確認問題":missed.q.ref}</div><p class="stmt">${missed.q.s}</p>
    <div class="res ng"><span class="v">あなた：${missed.your==null?"未回答":missed.your?"○":"×"}　答え：${missed.q.a?"○":"×"}</span><span>${missed.q.e}</span><span class="memo">覚え方：<b>${missed.q.m}</b></span></div></article>`:"";

/* 1段目：間違えた範囲だけに絞った解説＋体系へのリンク */
function focusHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const S=L.sys;const t=key.split("|")[1];
  const qb=missed?bigr(missed.q.s+missed.q.e):null;
  const hit=hitOf(S,missed);
  let body="";
  if(S&&hit.b>=0){body+=brHtml(S.tree[hit.b],hit.b,hit,"間違えた範囲")}
  else{body+=`<ul class="ul">${L.pts.slice(0,4).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
  // 関係する表の行だけを抜き出す
  if(S&&qb){let best=null;
    S.tables.forEach(tb=>{const rs=tb.rows.map((r,i)=>({i,r,sc:overlap(qb,bigr(r.join("")))})).filter(o=>o.sc>=2);
      const top=rs.sort((a,b)=>b.sc-a.sc).slice(0,4).sort((a,b)=>a.i-b.i);const sc=top.reduce((a,o)=>a+o.sc,0);
      if(top.length&&(!best||sc>best.sc))best={tb,top,sc}});
    if(best)body+=tblHtml(best.tb,best.top.map(o=>o.r),best.top.length<best.tb.rows.length?`表の一部（${best.top.length}／${best.tb.rows.length}行）。全体は下の「体系的に学ぶ」で。`:"")}
  // 関係するひっかけ
  let traps=L.traps||[];
  if(qb){const r=traps.map(x=>({x,sc:overlap(qb,bigr(x))})).filter(o=>o.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,2).map(o=>o.x);traps=r.length?r:traps.slice(0,1)}else traps=traps.slice(0,2);
  if(traps.length)body+=`<div class="trap"><b>この範囲のひっかけ</b><ul class="ul">${traps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  const head=S&&hit.b>=0?`${esc(t)}：${esc(S.tree[hit.b].h)}`:`${esc(t)}の要点`;
  const map=S?`<div class="mini">${S.tree.map((x,i)=>`<button class="mchip ${i===hit.b?"on":""}" data-deep="${i}"><span class="no">${i+1}</span>${esc(x.h)}</button>`).join("")}</div>`:"";
  const rel=(L.rel||[]).filter(k=>LESSON[k]);
  return `<article class="card"><div class="meta">間違えた範囲の解説</div><h2>${head}</h2>${body}</article>
  ${S?`<article class="card"><div class="meta">体系的に広げる</div><p class="note" style="margin:0">「${esc(t)}」は全${S.tree.length}項目。項目を押すと、その場所から詳しい解説を開きます。</p>${map}
    <button class="btn deeplink" data-deep="all">${esc(t)}を体系的に学ぶ<span class="sub2">全体像・流れ図・比較表・要点</span></button>
    ${rel.length?`<div><div class="note" style="margin-bottom:6px">${esc(L.bridge||"関連する論点")}</div><div class="mini">${rel.map(k=>`<button class="mchip rel" data-deeprel="${k}">${esc(k.split("|")[1])} →</button>`).join("")}</div></div>`:""}</article>`:""}`;
}

/* 2段目：論点を体系的に深く学ぶページ */
function deepHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const S=L.sys;const [f,t]=key.split("|");
  const hit=hitOf(S,missed);
  let h="";
  if(S){
    h+=`<article class="card"><div class="meta">全体像（体系図）　${FIELDS.find(x=>x[0]===f)[1]}</div><h2>${esc(t)}の全体像</h2><p class="ov">${esc(S.overview)}</p><div class="systree"><div class="sysroot">${esc(t)}</div><div class="sysbr">${S.tree.map((x,i)=>brHtml(x,i,hit,"間違えた範囲")).join("")}</div></div></article>`;
    if(S.flow&&S.flow.steps&&S.flow.steps.length)h+=`<article class="card"><div class="meta">流れで覚える</div><h2>${esc(S.flow.title)}</h2><ol class="flow">${S.flow.steps.map((x,i)=>`<li><span class="n">${i+1}</span><span class="s">${esc(x)}</span></li>`).join("")}</ol></article>`;
    if(S.tables&&S.tables.length)h+=`<article class="card"><div class="meta">比較表・数字</div><div class="tbls">${S.tables.map(tb=>tblHtml(tb,tb.rows,"")).join("")}</div></article>`;
  }
  h+=`<article class="card"><div class="meta">要点のまとめ</div><h2>${esc(t)}の要点</h2><ul class="ul">${L.pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${L.traps&&L.traps.length?`<div class="trap"><b>よく出るひっかけ</b><ul class="ul">${L.traps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}</article>`;
  const rel=(L.rel||[]).filter(k=>LESSON[k]);
  if(rel.length)h+=`<article class="card"><div class="meta">つながる論点</div><p style="margin:0">${esc(L.bridge||"")}</p><div class="mini">${rel.map(k=>`<button class="mchip rel" data-deeprel="${k}">${esc(k.split("|")[1])} →</button>`).join("")}</div></article>`;
  return h;
}
function deepView(key,focus,missed,back,trail){
  trail=trail||[];const t=key.split("|")[1];
  app.innerHTML=`<div class="exam-top"><div><div class="note">体系的に学ぶ${trail.length?"　"+trail.map(k=>esc(k.split("|")[1])).join(" › ")+" ›":""}</div><div style="font-weight:700">${esc(t)}</div></div><button class="btn" id="back">← 復習に戻る</button></div>
  ${deepHtml(key,missed)}
  <div class="row"><button class="btn pri" id="back2">← 復習に戻る</button></div>`;
  $("#back").onclick=back;$("#back2").onclick=back;
  document.querySelectorAll("[data-deeprel]").forEach(b=>b.onclick=()=>deepView(b.dataset.deeprel,-1,null,back,[...trail,key]));
  if(focus>=0){const el=document.getElementById("br-"+focus);if(el){el.classList.add("focus");el.scrollIntoView({block:"center"});return}}
  window.scrollTo(0,0);
}
function startReview(queue){ // queue: [{key, missed?}]
  if(!queue.length){home();return}
  const item=queue[0],rest=queue.slice(1);const key=item.key;const [f,t]=key.split("|");
  app.innerHTML=`<div class="exam-top"><div><div class="note">復習　残り${queue.length}論点</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
  ${missedHtml(item.missed)}
  ${focusHtml(key,item.missed)}
  <div class="row"><button class="btn pri" id="toq">確認例題3問へ</button></div>`;
  $("#home").onclick=home;
  $("#toq").onclick=()=>checkQs(item,rest);
  const back=()=>startReview(queue);
  document.querySelectorAll("[data-deep]").forEach(b=>b.onclick=()=>deepView(key,b.dataset.deep==="all"?-1:+b.dataset.deep,item.missed,back));
  document.querySelectorAll("[data-deeprel]").forEach(b=>b.onclick=()=>deepView(b.dataset.deeprel,-1,null,back,[key]));
  if(voice){const L=LESSON[key];if(L){const S=L.sys,h=hitOf(S,item.missed);speak(h.b>=0?t+"、"+S.tree[h.b].h+"。"+S.tree[h.b].items.join("。"):t+"の要点。"+L.pts.slice(0,4).join("。"))}}
  window.scrollTo(0,0);
}
function checkQs(item,rest){
  const [f,t]=item.key.split("|");
  const ex=new Set(item.missed?[item.missed.q.i]:[]);
  let pool=BANK.filter(q=>q.f===f&&q.t===t);
  let real=pool.filter(q=>q.ref!=="確認");
  const qs=pick(real.length>=3?real:pool,3,ex);
  let k=0,right=0;
  const render=()=>{
    if(k>=qs.length){
      const ok=right===qs.length;
      app.innerHTML=`<section class="card"><h2>${t}　確認例題の結果</h2><div class="row"><span class="big">${right}<span style="font-size:1.2rem"> / ${qs.length}</span></span><span class="judge ${ok?"j-ok":right>=2?"j-mid":"j-ng"}">${ok?"習得":right>=2?"もう一息":"要復習"}</span></div>
      <p class="note">${ok?"この論点は理解できています。":"もう一度、解説を読んでから別の3問に挑戦できます。"}</p>
      <div class="row">${ok?"":`<button class="btn" id="again">解説に戻ってもう一度</button>`}
      ${rest.length?`<button class="btn pri" id="next">次の論点へ（残り${rest.length}）</button>`:`<button class="btn pri" id="nx">第${SET.round+1}回の模試へ</button>`}
      <button class="btn" id="home">ホームへ</button></div></section>`;
      if(!ok)$("#again").onclick=()=>startReview([{key:item.key,missed:item.missed},...rest]);
      if(rest.length)$("#next").onclick=()=>startReview(rest);else $("#nx").onclick=()=>startExam();
      $("#home").onclick=home;window.scrollTo(0,0);return}
    const q=qs[k];
    app.innerHTML=`<div class="exam-top"><div><div class="note">確認例題　${k+1} / ${qs.length}　正解 ${right}</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
    <article class="card"><div class="meta">過去問　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn" id="o">○</button><button class="btn" id="x">×</button></div><div id="res"></div></article>`;
    const go=v=>{$("#o").disabled=$("#x").disabled=true;const ok=v===q.a;if(ok)right++;rec(q,ok);save();
      $("#res").innerHTML=`<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答えは ${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div><div class="row" style="margin-top:10px"><button class="btn pri" id="nx">次へ</button></div>`;
      if(voice)speak((ok?"正解。":"不正解。")+"答えは"+(q.a?"まる":"ばつ")+"。"+q.e);
      $("#nx").onclick=()=>{k++;render();if(voice&&k<qs.length)speak(qs[k].s)};$("#nx").focus()};
    $("#o").onclick=()=>go(1);$("#x").onclick=()=>go(0);$("#home").onclick=home;
    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    window.scrollTo(0,0);
  };
  render();if(voice&&qs.length)speak(qs[0].s);
}
if(canSpeak){try{speechSynthesis.getVoices()}catch(e){}}
home();
connect();
</script>

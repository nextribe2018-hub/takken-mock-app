<title>宅建 10分模試</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: ホーム（今の実力・5回セット・論点マップ）→ 試験画面（タイマー＋1問ずつ）→ 結果 → 解説と確認例題3問 */
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1f2a2e; --muted:#5d6a6e; --line:#d9ded9;
  --ai:#24476b; --ai-soft:#e3ebf3; --ok:#2f7a4b; --ok-soft:#e2f1e7; --ng:#b8402c; --ng-soft:#f8e4df; --warn:#9a6b12; --warn-soft:#f6ecd6;
  --f-disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-disp);font-weight:800;font-size:1.7rem;margin:0}
h2{font-family:var(--f-disp);font-size:1.15rem;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:.88rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-weight:700;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ai)}
.btn.pri{background:var(--ai);color:var(--paper);border-color:var(--ai)}
.btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.slot b{display:block;font-size:1.05rem;font-family:var(--f-disp)}
.slot.now{border-color:var(--ai);background:var(--ai-soft)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kp{background:var(--bg);border-radius:8px;padding:10px 12px}
.kp span{font-size:.78rem;color:var(--muted)} .kp b{display:block;font-size:1.3rem;font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.topics{display:flex;flex-direction:column;gap:14px}
.tgroup h3{font-size:.85rem;margin:0 0 6px;color:var(--muted);letter-spacing:.05em}
.tlist{display:flex;flex-wrap:wrap;gap:6px}
.tp{font:inherit;font-size:.8rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.tp.s0{opacity:.75}
.tp.s1{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.tp.s2{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tp.s3{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.legend{font-size:.75rem;color:var(--muted)}
.exam-top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2;border-bottom:1px solid var(--line)}
.timer{font-family:var(--f-disp);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ng)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:.7rem;display:grid;place-items:center;font-variant-numeric:tabular-nums;cursor:pointer;background:var(--paper);color:var(--ink)}
.dot.ans{background:var(--ai-soft);border-color:var(--ai)}
.dot.cur{outline:2px solid var(--ai)}
.meta{font-size:.75rem;letter-spacing:.05em;color:var(--ai);font-weight:700}
.stmt{font-size:1.05rem;margin:0}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .btn{font-size:1.5rem;padding:10px}
.ox .btn.sel{background:var(--ai);color:var(--paper);border-color:var(--ai)}
.res{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.res.ok{background:var(--ok-soft)} .res.ng{background:var(--ng-soft)}
.v{font-weight:700} .res.ok .v{color:var(--ok)} .res.ng .v{color:var(--ng)}
.memo{font-size:.86rem;color:var(--muted)} .memo b{color:var(--ink)}
.big{font-family:var(--f-disp);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.judge{display:inline-block;font-weight:700;padding:3px 12px;border-radius:999px;font-size:.9rem}
.j-ok{background:var(--ok-soft);color:var(--ok)} .j-mid{background:var(--warn-soft);color:var(--warn)} .j-ng{background:var(--ng-soft);color:var(--ng)}
.rv{display:flex;flex-direction:column;gap:10px}
.ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.trap{background:var(--warn-soft);border-radius:8px;padding:10px 12px}
.trap b{color:var(--warn)}
.relg{display:flex;flex-direction:column;gap:10px}
.relg .ul{font-size:.9rem}
.sync{font-size:.78rem;margin:4px 0 0;color:var(--muted)}
.sync[data-s="ok"]{color:var(--ok)}
.sync[data-s="err"]{color:var(--ng)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:1.4fr .8fr .9fr 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem;font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--muted)}
.confirm{background:var(--ng-soft);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.res{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<div class="wrap" id="app"></div>

<script>
const BANK=__DATA__;
const LESSON=__LESSON__;
BANK.forEach((q,i)=>q.i=i);
{const seen={};BANK.forEach(q=>{let k=q.f+"|"+q.t+"|"+q.ref;seen[k]=(seen[k]||0)+1;if(seen[k]>1)k+="#"+seen[k];q.k=k})}
const BYKEY={};BANK.forEach(q=>BYKEY[q.k]=q);
const FIELDS=[["業法","宅建業法"],["権利","権利関係"],["法令","法令上の制限"],["税他","税・その他"]];
const MIX=[{業法:4,権利:3,法令:2,税他:1},{業法:4,権利:3,法令:2,税他:1},{業法:4,権利:3,法令:2,税他:1},{業法:4,権利:3,法令:1,税他:2},{業法:4,権利:2,法令:1,税他:3}];
const LIMIT=600;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let H=ls.get("tkm-hist",{}); // key -> {n,c,last}
// 旧形式（問題番号キー）を新しいキーに移す
if(Object.keys(H).some(k=>/^\d+$/.test(k))){const nh={};Object.keys(H).forEach(k=>{const q=/^\d+$/.test(k)?BANK[+k]:BYKEY[k];if(q)nh[q.k]=H[k]});H=nh}
let SET=ls.get("tkm-set",{round:0,scores:[]});
let LOG=[]; // 模試の履歴 {at,round,score,sec}
/* ---- server sync (db) ---- */
const SYNC={db:null,ref:null,status:"local",busy:false,dirty:false,timer:null};
function syncLabel(){const el=document.getElementById("sync");if(!el)return;const m={local:"この端末だけに保存中（サーバーに接続できません）",nort:"この端末だけに保存中：この開き方ではサーバー保存が使えません。下の「記録の引き継ぎ」でコピーを取ってください",nodb:"この端末だけに保存中：この画面ではサーバー保存が使えません（アプリの種類による）。下の「記録の引き継ぎ」でコピーを取ってください",nouser:"この端末だけに保存中：ログイン情報を取得できません。下の「記録の引き継ぎ」でコピーを取ってください",loading:"サーバーから読み込み中…",ok:"サーバーに保存済み",saving:"サーバーに保存中…",err:"サーバー保存に失敗しました（この端末には保存済み。次の回答時に再送します）"};el.textContent=m[SYNC.status]||"";el.dataset.s=SYNC.status}
async function push(){
  if(!SYNC.ref){return}
  if(SYNC.busy){SYNC.dirty=true;return}
  SYNC.busy=true;SYNC.status="saving";syncLabel();
  try{await SYNC.ref.set({v:2,hist:H,set:SET,log:LOG.slice(-200),updatedAt:new Date().toISOString()});SYNC.status="ok"}
  catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await SYNC.ref.set({v:2,hist:H,set:SET,log:LOG.slice(-200),updatedAt:new Date().toISOString()});SYNC.status="ok"}catch(e2){SYNC.status="err"}}else SYNC.status="err"}
  SYNC.busy=false;syncLabel();
  if(SYNC.dirty){SYNC.dirty=false;push()}
}
const save=()=>{ls.set("tkm-hist",H);ls.set("tkm-set",SET);ls.set("tkm-log",LOG);clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,600)};
LOG=ls.get("tkm-log",[]);
function mergeHist(a,b){const o={...a};Object.keys(b||{}).forEach(k=>{const x=o[k],y=b[k];o[k]=!x||((y.n||0)>(x.n||0))?y:x});return o}
async function connect(){
  try{
    if(!window.claude||!window.claude.use){SYNC.status="nort";syncLabel();return}
    SYNC.status="loading";syncLabel();
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){SYNC.status=!db?"nodb":"nouser";syncLabel();return}
    SYNC.db=db;SYNC.ref=db.doc("data/users/"+uid+"/progress");
    const snap=await SYNC.ref.get();
    if(snap.exists){const d=snap.data()||{};
      const localHad=Object.keys(H).length>0;
      H=mergeHist(d.hist||{},H);
      if(d.set&&(!localHad||(d.set.scores||[]).length>=(SET.scores||[]).length))SET=JSON.parse(JSON.stringify(d.set));
      const seenAt=new Set((d.log||[]).map(x=>x.at));LOG=[...(d.log||[]),...LOG.filter(x=>!seenAt.has(x.at))].sort((a,b)=>a.at<b.at?-1:1);
      ls.set("tkm-hist",H);ls.set("tkm-set",SET);ls.set("tkm-log",LOG);
      SYNC.status="ok";
      if(localHad)push();
    }else{SYNC.status="ok";if(Object.keys(H).length||LOG.length)await push()}
    syncLabel();
    if(document.getElementById("homeRoot"))home();
  }catch(e){SYNC.status="local";syncLabel()}
}
function render0(){SYNC.status="local";syncLabel()}
const enc=o=>"TKM1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=t=>{t=(t||"").trim().replace(/\s+/g,"");if(!t.startsWith("TKM1:"))throw new Error("形式");return JSON.parse(decodeURIComponent(escape(atob(t.slice(5)))))};
function exportRec(){
  const code=enc({hist:H,set:SET,log:LOG.slice(-200)});
  const n=Object.keys(H).length;
  $("#bk").innerHTML=`<p class="note" id="bkmsg">${n}問分の記録です。下の文字列をすべてコピーして、メモ帳などに保存してください。</p><textarea id="bkt" readonly rows="4" style="width:100%;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)">${code}</textarea>`;
  const ta=$("#bkt");ta.focus();ta.select();
  const done=()=>{$("#bkmsg").textContent=n+"問分の記録をコピーしました。メモ帳などに貼り付けて保存してください。"};
  try{navigator.clipboard.writeText(code).then(done,()=>{try{if(document.execCommand("copy"))done()}catch(e){}})}catch(e){try{if(document.execCommand("copy"))done()}catch(e2){}}
}
function importRec(){
  $("#bk").innerHTML=`<p class="note">保存しておいた文字列（TKM1: で始まる）を貼り付けて「復元する」を押してください。</p><textarea id="bki" rows="4" style="width:100%;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink)"></textarea><div class="row"><button class="btn pri" id="bkgo">復元する</button><span class="note" id="bkerr"></span></div>`;
  $("#bkgo").onclick=()=>{
    let d;try{d=dec($("#bki").value)}catch(e){$("#bkerr").textContent="読み取れませんでした。TKM1: から最後まで、全部を貼り付けてください。";return}
    const hist={};Object.keys(d.hist||{}).forEach(k=>{if(BYKEY[k])hist[k]=d.hist[k]});
    H=mergeHist(H,hist);
    if(d.set&&Array.isArray(d.set.scores)&&(d.set.scores.length>=(SET.scores||[]).length))SET=JSON.parse(JSON.stringify(d.set));
    const seenAt=new Set(LOG.map(x=>x.at));LOG=[...LOG,...(d.log||[]).filter(x=>x&&x.at&&!seenAt.has(x.at))].sort((a,b)=>a.at<b.at?-1:1);
    save();home();
  };
}
const $=s=>document.querySelector(s);
const app=$("#app");
let timerId=null;

/* speech */
const canSpeak=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
const clean=t=>t.replace(/○/g,"まる").replace(/×/g,"ばつ").replace(/㎡/g,"平方メートル").replace(/％|%/g,"パーセント");
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(t));u.lang="ja-JP";const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith("ja"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
let voice=ls.get("tkm-voice",false);

function rec(q,ok){const h=H[q.k]||{n:0,c:0};h.n++;if(ok)h.c++;h.last=ok?1:0;H[q.k]=h}
function prio(q){const h=H[q.k];if(!h)return 0;if(h.last===0)return 1;return 2+h.n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(pool,n,exclude){
  const c=shuffle(pool.filter(q=>!exclude.has(q.i)));
  c.sort((a,b)=>prio(a)-prio(b));
  // spread topics: take best-priority but avoid same topic twice when possible
  const out=[],used=new Set();
  for(const q of c){if(out.length>=n)break;if(!used.has(q.t)){out.push(q);used.add(q.t)}}
  for(const q of c){if(out.length>=n)break;if(!out.includes(q))out.push(q)}
  return out;
}
function topicStats(){
  const m={};
  BANK.forEach(q=>{const k=q.f+"|"+q.t;m[k]=m[k]||{f:q.f,t:q.t,total:0,n:0,c:0,recentWrong:0};const s=m[k];s.total++;const h=H[q.k];if(h){s.n+=h.n;s.c+=h.c;if(h.last===0)s.recentWrong++}});
  return Object.values(m);
}
function state(s){if(!s.n)return 0;const r=s.c/s.n;if(s.recentWrong>0||r<0.6)return 1;if(r<0.8||s.n<5)return 2;return 3}

/* ---------- home ---------- */
function home(){
  clearInterval(timerId);
  const done=Object.keys(H).filter(k=>BYKEY[k]).length;
  let tn=0,tc=0;Object.keys(H).forEach(k=>{if(!BYKEY[k])return;const h=H[k];tn+=h.n;tc+=h.c});
  const rate=tn?Math.round(tc/tn*100):null;
  const r=SET.round;
  const setTotal=SET.scores.reduce((a,b)=>a+b,0);
  const ts=topicStats();
  const weak=ts.filter(s=>state(s)===1).length;
  app.innerHTML=`
  <header id="homeRoot"><h1>宅建 10分模試</h1><p class="sync" id="sync"></p><p class="sub">本試験と同じ分野比率で10問を10分。5回で50問＝1回分の本試験です。</p></header>
  <section class="card">
    <div class="row" style="justify-content:space-between"><h2>今回のセット　第${r+1}回 / 5回</h2><span class="note">${SET.scores.length?`ここまで ${setTotal} / ${SET.scores.length*10}点`:"まだ1回も解いていません"}</span></div>
    <div class="sets">${[0,1,2,3,4].map(k=>`<div class="slot ${k===r?"now":""}">第${k+1}回<b>${SET.scores[k]!=null?SET.scores[k]+"点":"—"}</b>業${MIX[k].業法}権${MIX[k].権利}法${MIX[k].法令}税${MIX[k].税他}</div>`).join("")}</div>
    <div class="row"><button class="btn pri" id="go">第${r+1}回を始める（10問・10分）</button>
    <label class="row note" style="gap:6px"><input type="checkbox" id="vc" ${voice?"checked":""} ${canSpeak?"":"disabled"}> 音声で出題</label></div>
    <p class="note">合格の目安：1回10問中 <b>8問以上</b>で合格圏、7問は合格ライン上（本試験の合格点は近年50点中36〜37点前後）。5回合計で <b>35点</b>が7割、<b>37点以上</b>なら安全圏です。</p>
  </section>
  <section class="card">
    <h2>今の実力</h2>
    <div class="kpi">
      <div class="kp"><span>正答率</span><b>${rate==null?"—":rate+"%"}</b></div>
      <div class="kp"><span>解いた問題</span><b>${done} / ${BANK.length}</b></div>
      ${FIELDS.map(([f,n])=>{let a=0,c=0;BANK.filter(q=>q.f===f).forEach(q=>{const h=H[q.k];if(h){a+=h.n;c+=h.c}});return `<div class="kp"><span>${n}</span><b>${a?Math.round(c/a*100)+"%":"—"}</b></div>`}).join("")}
    </div>
    ${weak?`<button class="btn" id="weakAll">要復習の論点（${weak}件）を解説から復習</button>`:""}
  </section>
  ${LOG.length?`<section class="card"><h2>模試の履歴</h2><div class="hist">${LOG.slice(-10).reverse().map(x=>`<div class="hrow"><span>${x.at.slice(5,10).replace("-","/")} ${x.at.slice(11,16)}</span><span>第${x.round}回</span><b>${x.score} / 10</b><span>${Math.floor(x.sec/60)}分${x.sec%60}秒</span></div>`).join("")}</div><p class="note">直近10回を表示（全${LOG.length}回）。</p></section>`:""}
  <section class="card">
    <h2>論点マップ</h2>
    <p class="legend">押すと、その論点の解説と確認例題3問。<span style="color:var(--ng)">赤＝要復習</span>／<span style="color:var(--warn)">黄＝習得中</span>／<span style="color:var(--ok)">緑＝習得（正答率80%以上・5回以上）</span>／無色＝未着手</p>
    <div class="topics">${FIELDS.map(([f,n])=>`<div class="tgroup"><h3>${n}</h3><div class="tlist">${ts.filter(s=>s.f===f).map(s=>`<button class="tp s${state(s)}" data-k="${s.f}|${s.t}">${s.t}${s.n?` ${Math.round(s.c/s.n*100)}%`:""}</button>`).join("")}</div></div>`).join("")}</div>
  </section>
  <section class="card">
    <h2>記録の引き継ぎ</h2>
    <p class="note">サーバーに保存できない画面では、記録はこの端末の中だけにあり、アプリを閉じると消えることがあります。「記録をコピー」でメモ帳などに貼って保管し、別の端末やあとで「貼り付けて復元」すると続きから再開できます（今の記録と合算します）。</p>
    <div class="row"><button class="btn" id="exp">記録をコピー</button><button class="btn" id="imp">貼り付けて復元</button></div>
    <div id="bk"></div>
  </section>
  <section class="card">
    <div class="row"><button class="btn" id="resetSet">セットを第1回からやり直す</button><button class="btn" id="resetAll">学習記録をすべて消す</button></div>
    <div id="cf"></div>
    <p class="note">上に「サーバーに保存済み」と出ている画面では、学習記録はサーバー（このページ専用のあなた個人の保存領域）に保存され、他の人には見えません。「この端末だけに保存中」と出ている画面では、「記録の引き継ぎ」でコピーを取ってください。問題は過去問の各肢を○×形式に言い換えたもので、出典は「年度-問-肢」で表示します。法改正後の現行法で正誤を確認しています。</p>
  </section>`;
  syncLabel();
  $("#go").onclick=()=>startExam();
  if(canSpeak)$("#vc").onchange=e=>{voice=e.target.checked;ls.set("tkm-voice",voice)};
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>startReview([{key:b.dataset.k}]));
  if(weak)$("#weakAll").onclick=()=>startReview(ts.filter(s=>state(s)===1).map(s=>({key:s.f+"|"+s.t})));
  $("#resetSet").onclick=()=>{SET={round:0,scores:[]};save();home()};
  $("#exp").onclick=exportRec;$("#imp").onclick=importRec;
  $("#resetAll").onclick=()=>{$("#cf").innerHTML=`<div class="confirm row"><span>解いた記録と正答率がすべて消えます。</span><button class="btn" id="yes">消す</button><button class="btn" id="no">やめる</button></div>`;$("#yes").onclick=()=>{H={};SET={round:0,scores:[]};LOG=[];save();home()};$("#no").onclick=()=>$("#cf").innerHTML=""};
  window.scrollTo(0,0);
}

/* ---------- exam ---------- */
function startExam(){
  const mix=MIX[SET.round];const qs=[];const ex=new Set();
  FIELDS.forEach(([f])=>{pick(BANK.filter(q=>q.f===f),mix[f],ex).forEach(q=>{qs.push(q);ex.add(q.i)})});
  const E={qs,ans:Array(qs.length).fill(null),cur:0,left:LIMIT,start:Date.now()};
  const render=()=>{
    const q=E.qs[E.cur];const m=Math.floor(E.left/60),s=E.left%60;
    app.innerHTML=`
    <div class="exam-top"><div><div class="note">第${SET.round+1}回　${E.ans.filter(a=>a!=null).length}/10問 回答済み</div><div class="timer ${E.left<=60?"low":""}" id="tm">${m}:${String(s).padStart(2,"0")}</div></div><button class="btn" id="fin">採点する</button></div>
    <div class="dots">${E.qs.map((_,k)=>`<button class="dot ${E.ans[k]!=null?"ans":""} ${k===E.cur?"cur":""}" data-k="${k}" aria-label="${k+1}問目">${k+1}</button>`).join("")}</div>
    <article class="card"><div class="meta">問${E.cur+1}　${FIELDS.find(x=>x[0]===q.f)[1]}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn ${E.ans[E.cur]===1?"sel":""}" id="o">○</button><button class="btn ${E.ans[E.cur]===0?"sel":""}" id="x">×</button></div>
    <div class="row" style="justify-content:space-between"><button class="btn" id="prev" ${E.cur?"":"disabled"}>前へ</button><button class="btn" id="next">${E.cur<9?"次へ":"採点する"}</button></div></article>
    <div id="cf"></div>`;
    const choose=v=>{E.ans[E.cur]=v;if(E.cur<E.qs.length-1){E.cur++;render();if(voice)speak(E.qs[E.cur].s)}else render()};
    $("#o").onclick=()=>choose(1);$("#x").onclick=()=>choose(0);
    $("#prev").onclick=()=>{E.cur--;render()};
    $("#next").onclick=()=>{if(E.cur<9){E.cur++;render();if(voice)speak(E.qs[E.cur].s)}else askFinish()};
    $("#fin").onclick=askFinish;
    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    document.querySelectorAll(".dot").forEach(d=>d.onclick=()=>{E.cur=+d.dataset.k;render()});
  };
  const askFinish=()=>{const un=E.ans.filter(a=>a==null).length;if(!un){finish();return}
    $("#cf").innerHTML=`<div class="confirm row"><span>未回答が${un}問あります。未回答は不正解になります。</span><button class="btn" id="yes">採点する</button><button class="btn" id="no">続ける</button></div>`;
    $("#yes").onclick=finish;$("#no").onclick=()=>$("#cf").innerHTML=""};
  const finish=()=>{clearInterval(timerId);if(canSpeak)speechSynthesis.cancel();
    const used=LIMIT-E.left;let sc=0;E.qs.forEach((q,k)=>{const ok=E.ans[k]===q.a;if(ok)sc++;rec(q,ok)});
    LOG.push({at:new Date(Date.now()+9*3600e3).toISOString().slice(0,19),round:SET.round+1,score:sc,sec:used});SET.scores[SET.round]=sc;SET.round=(SET.round+1)%5;const setDone=SET.round===0;const setScores=[...SET.scores];if(setDone)SET.scores=[];save();
    result(E,sc,used,setDone?setScores:null)};
  render(); if(voice)speak(E.qs[0].s);
  clearInterval(timerId);
  timerId=setInterval(()=>{E.left--;const t=$("#tm");if(t){t.textContent=Math.floor(E.left/60)+":"+String(E.left%60).padStart(2,"0");if(E.left<=60)t.classList.add("low")}if(E.left<=0){clearInterval(timerId);finish()}},1000);
  window.scrollTo(0,0);
}
function judge(sc){return sc>=8?["j-ok","合格圏"]:sc===7?["j-mid","合格ライン上"]:["j-ng","要復習"]}
function result(E,sc,used,setScores){
  const [jc,jt]=judge(sc);
  const wrongItems=[];const seen=new Set();E.qs.forEach((q,k)=>{if(E.ans[k]!==q.a){const key=q.f+"|"+q.t;if(!seen.has(key)){seen.add(key);wrongItems.push({key,missed:{q,your:E.ans[k]}})}}});
  let setHtml="";
  if(setScores){const tot=setScores.reduce((a,b)=>a+b,0);const sj=tot>=37?["j-ok","安全圏"]:tot>=35?["j-mid","合格ライン（7割）"]:["j-ng","あと"+(35-tot)+"点で7割"];
    setHtml=`<section class="card"><h2>5回セットの合計（本試験1回分）</h2><div class="row"><span class="big">${tot}<span style="font-size:1.2rem"> / 50</span></span><span class="judge ${sj[0]}">${sj[1]}</span></div><p class="note">各回：${setScores.map((s,k)=>`第${k+1}回 ${s}点`).join("　")}</p></section>`}
  app.innerHTML=`
  <section class="card"><h2>第${(SET.round+4)%5+1}回の結果</h2>
    <div class="row"><span class="big">${sc}<span style="font-size:1.2rem"> / 10</span></span><span class="judge ${jc}">${jt}</span></div>
    <p class="note">かかった時間 ${Math.floor(used/60)}分${used%60}秒 / 10分</p>
    ${wrongItems.length?`<p class="note">間違えた論点ごとに「解説 → 付随する論点 → 過去問の確認例題3問」の順で復習します。</p>
    <button class="btn pri" id="allw">間違えた${wrongItems.length}論点を復習する</button>
    <div class="row">${wrongItems.map((w,j)=>`<button class="btn" data-w="${j}">${w.key.split("|")[1]}だけ</button>`).join("")}</div>`:`<p>全問正解です。次の回に進みましょう。</p>`}
    <div class="row"><button class="btn" id="home">ホームへ</button><button class="btn" id="nx">第${SET.round+1}回へ進む</button></div>
  </section>
  ${setHtml}
  <section class="rv">${E.qs.map((q,k)=>{const ok=E.ans[k]===q.a;return `<article class="card"><div class="meta">問${k+1}　${q.t}　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    <div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　あなた：${E.ans[k]==null?"未回答":E.ans[k]?"○":"×"}　答え：${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div></article>`}).join("")}</section>`;
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>startReview([wrongItems[+b.dataset.w]]));
  if(wrongItems.length)$("#allw").onclick=()=>startReview(wrongItems);
  $("#home").onclick=home;$("#nx").onclick=()=>startExam();
  window.scrollTo(0,0);
}

/* ---------- review: 解説 → 付随論点 → 確認例題3問 ---------- */
function lessonHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const [f,t]=key.split("|");
  const relH=(L.rel||[]).filter(k=>LESSON[k]).map(k=>`<div class="kp"><b style="font-size:1rem">${k.split("|")[1]}</b><ul class="ul">${LESSON[k].pts.slice(0,3).map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("");
  return `
  ${missed?`<article class="card"><div class="meta">あなたが間違えた問題　${missed.q.ref==="確認"?"確認問題":missed.q.ref}</div><p class="stmt">${missed.q.s}</p>
    <div class="res ng"><span class="v">あなた：${missed.your==null?"未回答":missed.your?"○":"×"}　答え：${missed.q.a?"○":"×"}</span><span>${missed.q.e}</span><span class="memo">覚え方：<b>${missed.q.m}</b></span></div></article>`:""}
  <article class="card"><div class="meta">解説　${FIELDS.find(x=>x[0]===f)[1]}</div><h2>${t}の要点</h2><ul class="ul">${L.pts.map(x=>`<li>${x}</li>`).join("")}</ul>
    ${L.traps&&L.traps.length?`<div class="trap"><b>よく出るひっかけ</b><ul class="ul">${L.traps.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}</article>
  ${relH?`<article class="card"><div class="meta">付随する論点</div><p style="margin:0">${L.bridge||""}</p><div class="relg">${relH}</div></article>`:""}`;
}
function startReview(queue){ // queue: [{key, missed?}]
  if(!queue.length){home();return}
  const item=queue[0],rest=queue.slice(1);const key=item.key;const [f,t]=key.split("|");
  app.innerHTML=`<div class="exam-top"><div><div class="note">復習　残り${queue.length}論点</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
  ${lessonHtml(key,item.missed)}
  <div class="row"><button class="btn pri" id="toq">確認例題3問へ</button></div>`;
  $("#home").onclick=home;
  $("#toq").onclick=()=>checkQs(item,rest);
  if(voice){const L=LESSON[key];if(L)speak(t+"の要点。"+L.pts.join("。"))}
  window.scrollTo(0,0);
}
function checkQs(item,rest){
  const [f,t]=item.key.split("|");
  const ex=new Set(item.missed?[item.missed.q.i]:[]);
  let pool=BANK.filter(q=>q.f===f&&q.t===t);
  let real=pool.filter(q=>q.ref!=="確認");
  const qs=pick(real.length>=3?real:pool,3,ex);
  let k=0,right=0;
  const render=()=>{
    if(k>=qs.length){
      const ok=right===qs.length;
      app.innerHTML=`<section class="card"><h2>${t}　確認例題の結果</h2><div class="row"><span class="big">${right}<span style="font-size:1.2rem"> / ${qs.length}</span></span><span class="judge ${ok?"j-ok":right>=2?"j-mid":"j-ng"}">${ok?"習得":right>=2?"もう一息":"要復習"}</span></div>
      <p class="note">${ok?"この論点は理解できています。":"もう一度、解説を読んでから別の3問に挑戦できます。"}</p>
      <div class="row">${ok?"":`<button class="btn" id="again">解説に戻ってもう一度</button>`}
      ${rest.length?`<button class="btn pri" id="next">次の論点へ（残り${rest.length}）</button>`:`<button class="btn pri" id="nx">第${SET.round+1}回の模試へ</button>`}
      <button class="btn" id="home">ホームへ</button></div></section>`;
      if(!ok)$("#again").onclick=()=>startReview([{key:item.key,missed:item.missed},...rest]);
      if(rest.length)$("#next").onclick=()=>startReview(rest);else $("#nx").onclick=()=>startExam();
      $("#home").onclick=home;window.scrollTo(0,0);return}
    const q=qs[k];
    app.innerHTML=`<div class="exam-top"><div><div class="note">確認例題　${k+1} / ${qs.length}　正解 ${right}</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
    <article class="card"><div class="meta">過去問　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn" id="o">○</button><button class="btn" id="x">×</button></div><div id="res"></div></article>`;
    const go=v=>{$("#o").disabled=$("#x").disabled=true;const ok=v===q.a;if(ok)right++;rec(q,ok);save();
      $("#res").innerHTML=`<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答えは ${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div><div class="row" style="margin-top:10px"><button class="btn pri" id="nx">次へ</button></div>`;
      if(voice)speak((ok?"正解。":"不正解。")+"答えは"+(q.a?"まる":"ばつ")+"。"+q.e);
      $("#nx").onclick=()=>{k++;render();if(voice&&k<qs.length)speak(qs[k].s)};$("#nx").focus()};
    $("#o").onclick=()=>go(1);$("#x").onclick=()=>go(0);$("#home").onclick=home;
    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    window.scrollTo(0,0);
  };
  render();if(voice&&qs.length)speak(qs[0].s);
}
if(canSpeak){try{speechSynthesis.getVoices()}catch(e){}}
home();
connect();
</script>

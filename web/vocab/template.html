<title>英単語フラッシュ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 既存のWeb版（web/exam-template.html）と同じ答案用紙の1カラム。語はゴシック太字、数字はtabular。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.now{border-color:var(--accent);border-width:2px}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:var(--accent)}
h2{font-family:var(--f-exam);font-size:18px;font-weight:700}
h3{font-size:13px;font-weight:700;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.tag{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:10px;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:16px;min-height:48px}
.choice:active{background:var(--accent-soft)}
.timer{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.timer.low{color:var(--ng)}
.unit{font-size:16px;color:var(--muted);font-weight:600}
.big{font-size:44px;font-weight:800;line-height:1.1}
.word{font-size:38px;font-weight:800;line-height:1.2;letter-spacing:.01em;overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.li:last-child{border-bottom:0}
.li .w{font-weight:700;font-size:17px;min-width:0}
.li .m{color:var(--ink);flex:1.3;min-width:0}
.li .p{font-size:12px;color:var(--muted);margin-left:6px}
.li .x{color:var(--ng);font-size:12px;white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:16px;height:16px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.dot.ok{background:var(--ok-soft);border-color:var(--ok)}
.dot.ng{background:var(--ng-soft);border-color:var(--ng)}
.dot.cur{border-color:var(--ink);border-width:2px}
.judge{display:inline-block;font-weight:700;font-size:14px;padding:4px 10px;border-radius:12px}
.judge.ok{color:var(--ok);background:var(--ok-soft)}.judge.mid{color:var(--warn);background:var(--warn-soft)}.judge.ng{color:var(--ng);background:var(--ng-soft)}
.flash{min-width:110px;text-align:right;font-weight:700}
.flash.ok{color:var(--ok)}.flash.ng{color:var(--ng)}
.confirm{background:var(--warn-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
#sync{font-size:12px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:no-preference){.flash{transition:opacity .2s}}
</style>
<div class="wrap">
  <div class="head"><div class="eyebrow">VOCABULARY FLASH · 30 WORDS / 1 MIN</div><h1>英単語フラッシュ</h1><p class="note" style="margin-top:2px">30語1分で覚えて、1分で答える</p><div id="sync">記録の保存先：この端末のブラウザ</div></div>
  <div id="app"></div>
  <p class="foot">30語を1分で覚えて、1分で意味を4択で答えます。正解するたびに0.5秒延び、得点＝残り秒（切り捨て）＋正解数。300語ごとに、これまでに間違えた語だけで定着テストをします。レベルは TOEIC のスコア目安で、英検・高校・大学は参考です。</p>
</div>
<script>
var LEVELS=__DATA__;
var LEVEL={};LEVELS.forEach(function(l){LEVEL[l.id]=l});
var ROUND=30,MEMO_SEC=60,TEST_SEC=60,BONUS=0.5,FIX_EVERY=300,CHOICES=4;
var LS="vocab-progress-v1";
var ALIAS={jhs:"toeic500",eiken:"toeic600",toeic:"toeic700",march:"toeic800",sokei:"toeic900"}; // 旧レベルid → 新id
var S={v:1,rev:0,at:0,levels:{}};
var ref=null,dirty=false,busy=false,deb=null,fails=0;
var view="levels",cur=null;  // 画面の状態
var app=document.getElementById("app");

/* ---- 記録 ---- */
function emptyLevel(){return {cursor:0,learned:0,lastFix:0,hist:{},log:[]}}
function lp(id){return S.levels[id]||(S.levels[id]=emptyLevel())}
function norm(d){d=d||{};var out={v:1,rev:+d.rev||0,at:+d.at||0,levels:{}};
  Object.keys(d.levels||{}).forEach(function(rid){var id=ALIAS[rid]||rid;if(out.levels[id])return;var v=d.levels[rid]||{};out.levels[id]={cursor:+v.cursor||0,learned:+v.learned||0,lastFix:+v.lastFix||0,hist:(v.hist&&typeof v.hist==="object")?v.hist:{},log:Array.isArray(v.log)?v.log:[]}});return out}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/vocab");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="levels"||view==="level")render()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- ロジック（src/vocab.ts と同じ） ---- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function weakOrder(L,p){
  function miss(w){var h=p.hist[w.w];return h?(h.n-h.c)/h.n+(h.last===0?1:0):0.5}
  return L.words.map(function(w,i){return {w:w,i:i,s:miss(w)}}).sort(function(a,b){return b.s-a.s||a.i-b.i}).map(function(x){return x.w});
}
function nextWords(L,p){var n=L.words.length,start=p.cursor%n,order=p.learned>=n?weakOrder(L,p):L.words,out=[];for(var i=0;i<ROUND&&i<n;i++)out.push(order[(start+i)%n]);return out}
function buildTest(words,L){
  var pool=L.words;
  return shuffle(words).map(function(w){
    var used={};used[w.m]=1;var others=[],g=0;
    while(others.length<CHOICES-1&&g++<500){var o=pool[Math.floor(Math.random()*pool.length)];if(!used[o.m]){used[o.m]=1;others.push(o.m)}}
    var ch=shuffle([w.m].concat(others));return {w:w,choices:ch,a:ch.indexOf(w.m)};
  });
}
function scoreOf(left,correct){return Math.max(0,Math.floor(left+1e-9))+correct}
function apply(p,res){res.forEach(function(x){var h=p.hist[x.w.w]||{n:0,c:0,last:0};p.hist[x.w.w]={n:h.n+1,c:h.c+(x.ok?1:0),last:x.ok?1:0}})}
function makeLog(kind,res,left){var c=res.filter(function(x){return x.ok}).length,asked=res.filter(function(x){return x.answered}).length,l=Math.max(0,Math.round(left*10)/10);
  return {at:Date.now(),kind:kind,score:scoreOf(l,c),correct:c,asked:asked,size:res.length,left:l,wrong:res.filter(function(x){return !x.ok}).map(function(x){return x.w.w})}}
function fixDue(p){return p.learned>0&&p.learned%FIX_EVERY===0&&p.lastFix<p.learned}
function fixWords(L,p){
  return L.words.map(function(w){return {w:w,h:p.hist[w.w]}}).filter(function(x){return x.h&&x.h.c<x.h.n})
    .sort(function(a,b){return (b.h.n-b.h.c)/b.h.n-(a.h.n-a.h.c)/a.h.n||(b.h.last===0?1:0)-(a.h.last===0?1:0)}).slice(0,ROUND).map(function(x){return x.w});
}
function finishRound(id,res,left,repeat){var p=lp(id),L=LEVEL[id];apply(p,res);if(!repeat){p.cursor=(p.cursor+res.length)%L.words.length;p.learned+=res.length}var log=makeLog("round",res,left);p.log.push(log);save();return {log:log,fixDue:fixDue(p)}}
function finishFix(id,res,left){var p=lp(id);apply(p,res);p.lastFix=p.learned;var log=makeLog("fix",res,left);p.log.push(log);save();return {log:log,fixDue:false}}
function stats(L,p){
  var rs=p.log.filter(function(l){return l.kind==="round"}),fx=p.log.filter(function(l){return l.kind==="fix"});
  function avg(a){return a.length?Math.round(a.reduce(function(s,l){return s+l.score},0)/a.length*10)/10:0}
  var hs=Object.keys(p.hist).map(function(k){return p.hist[k]});
  return {rounds:rs.length,best:Math.max.apply(null,[0].concat(rs.map(function(l){return l.score}))),avg:avg(rs),
    total:rs.reduce(function(s,l){return s+l.size},0),totalCorrect:rs.reduce(function(s,l){return s+l.correct},0),
    wrongCount:L.words.filter(function(w){var h=p.hist[w.w];return h&&h.c<h.n}).length,
    mastered:hs.filter(function(h){return h.n>=2&&h.c===h.n}).length,fixes:fx.length,fixAvg:avg(fx)};
}
function judge(score,correct,size){var r=size?correct/size:0;if(r>=0.95&&score>=70)return ["完璧。次の30語へ","ok"];if(r>=0.8)return ["定着しています","ok"];if(r>=0.6)return ["もう一息。間違えた語をもう一度","mid"];return ["要復習。同じ30語をやり直すのがおすすめ","ng"]}

/* ---- 画面 ---- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(sec){sec=Math.max(0,sec);return Math.floor(sec/60)+":"+String(Math.floor(sec%60)).padStart(2,"0")}
function fmt1(sec){return Math.max(0,sec).toFixed(1)}
function dl(at){var d=new Date(at);return (d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
var timer=null;
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function go(v,c){stopTimer();view=v;cur=c||null;render();window.scrollTo(0,0)}
function render(){
  if(view==="levels")levels();else if(view==="level")levelHome();else if(view==="memo")memo();else if(view==="test")test();else if(view==="result")result();
}
function levels(){
  var h='<div class="card"><h2>レベルを選ぶ</h2><p class="note">TOEIC のスコア目安で 500 → 900 の100点刻み。英検・高校・大学は参考です。各300語。</p></div>';
  LEVELS.forEach(function(L){var p=lp(L.id),s=stats(L,p);
    h+='<div class="card tap" data-a="level" data-id="'+L.id+'" role="button" tabindex="0"><div class="row"><h2>'+esc(L.name)+'</h2>'+(fixDue(p)?'<span class="tag">定着テスト</span>':'')+'</div><p class="note">'+esc(L.desc)+'　<span style="color:var(--accent)">参考：'+esc(L.ref)+'</span></p>'+
      '<div class="bar"><i style="width:'+Math.min(100,Math.round(p.learned/L.words.length*100))+'%"></i></div>'+
      '<p class="note">覚えた '+p.learned+'語（'+Math.min(100,Math.round(p.learned/L.words.length*100))+'%）'+(s.rounds?'　最高 '+s.best+'点・平均 '+s.avg+'点・'+s.rounds+'回':'　まだ始めていません')+'</p></div>'});
  app.innerHTML=h;
}
function levelHome(){
  var id=cur.id,L=LEVEL[id],p=lp(id),s=stats(L,p),due=fixDue(p),lap=Math.floor(p.learned/L.words.length)+1,pos=p.cursor;
  var rem=FIX_EVERY-(p.learned%FIX_EVERY);
  var h='<div><button class="btn" data-a="levels">‹ レベル一覧</button></div><div class="head"><h2 style="font-size:22px">'+esc(L.name)+'</h2><p class="note">'+esc(L.desc)+'　参考：'+esc(L.ref)+'</p></div>';
  if(due)h+='<div class="card now"><h2>定着テストの時間です</h2><p>'+p.learned+'語を覚えました。これまでに間違えた語（'+s.wrongCount+'語）から最大30語を、暗記なしで1分テストします。</p><button class="btn pri big" data-a="fix">定着テストを始める</button></div>';
  h+='<div class="card"><h2>'+lap+'周目　'+(pos+1)+'〜'+Math.min(pos+ROUND,L.words.length)+'語目</h2><p class="note">1分で30語を覚える → 1分でテスト。'+(lap>1?'2周目からは間違いの多い語から出ます。':'')+'</p><button class="btn pri big" data-a="start"'+(due?' disabled':'')+'>30語を覚える（1分）</button>'+(due?'<p class="note">先に定着テストを済ませてください。</p>':'')+'</div>';
  h+='<div class="card"><h2>記録</h2><div class="kpis">'+
    '<div class="kpi"><span>最高点</span><b>'+s.best+'</b></div><div class="kpi"><span>平均点</span><b>'+s.avg+'</b></div><div class="kpi"><span>回数</span><b>'+s.rounds+'</b></div>'+
    '<div class="kpi"><span>正解の累計</span><b>'+s.totalCorrect+'<small class="unit">/'+s.total+'</small></b></div><div class="kpi"><span>間違えた語</span><b>'+s.wrongCount+'</b></div><div class="kpi"><span>定着テスト</span><b>'+s.fixes+(s.fixes?'<small class="unit"> 平均'+s.fixAvg+'</small>':'')+'</b></div></div>'+
    '<p class="note">得点＝残り秒＋正解数（例：残り25秒・28問正解 → 53点）。次の定着テストまで あと'+(due?0:rem)+'語。</p>';
  var recent=p.log.slice(-10).reverse();
  if(recent.length){h+='<div class="list">';recent.forEach(function(l){h+='<div class="li"><span class="note">'+dl(l.at)+'　'+(l.kind==="fix"?"定着":"通常")+'</span><span>'+l.score+'点　正解'+l.correct+'/'+l.size+'　残り'+fmt1(l.left)+'秒</span></div>'});h+='</div>'}
  h+='</div>';
  if(s.wrongCount){h+='<div class="card"><h2>間違えた語</h2><p class="note">誤答率の高い順。定着テストはここから出ます。</p><div class="list">';
    fixWords(L,p).forEach(function(w){var x=p.hist[w.w];h+='<div class="li"><span><span class="w">'+esc(w.w)+'</span>　'+esc(w.m)+'</span><span class="note">'+x.c+'/'+x.n+'</span></div>'});h+='</div></div>'}
  h+='<div id="reset"><button class="btn" data-a="askreset">このレベルの記録を消す</button></div>';
  app.innerHTML=h;
}
function memo(){
  var id=cur.id,L=LEVEL[id],p=lp(id),words=cur.words,start=Date.now(),done=false;
  var h='<div class="row"><div><p class="note">'+esc(L.name)+'　覚える 30語</p><div class="timer" id="t">1:00</div></div><button class="btn pri" data-a="totest">テストへ進む</button></div><div class="card"><div class="list">';
  words.forEach(function(w){var x=p.hist[w.w];h+='<div class="li"><span class="w">'+esc(w.w)+'</span><span class="m">'+esc(w.m)+'<span class="p">'+esc(w.p)+'</span></span>'+(x&&x.c<x.n?'<span class="x">前回×</span>':'')+'</div>'});
  h+='</div></div><p class="note">時間になると自動でテストが始まります。</p>';
  app.innerHTML=h;
  cur.finish=function(){if(done)return;done=true;go("test",{id:id,words:words,kind:"round",repeat:cur.repeat})};
  timer=setInterval(function(){var l=MEMO_SEC-(Date.now()-start)/1000;var t=document.getElementById("t");if(t){t.textContent=fmt(Math.ceil(l));t.className="timer"+(l<=10?" low":"")}if(l<=0){stopTimer();cur.finish()}},250);
}
function test(){
  var id=cur.id,L=LEVEL[id],words=cur.words,kind=cur.kind,qs=buildTest(words,L),i=0,bonus=0,start=Date.now(),done=false;
  var res=qs.map(function(q){return {w:q.w,ok:false,answered:false}});
  function leftNow(){return TEST_SEC+bonus-(Date.now()-start)/1000}
  function finish(l){if(done)return;done=true;stopTimer();var r=kind==="fix"?finishFix(id,res,l):finishRound(id,res,l,cur.repeat);go("result",{id:id,words:words,res:res,log:r.log,fixDue:r.fixDue})}
  function draw(flash){
    var q=qs[i],correct=res.filter(function(r){return r.ok}).length;
    var h='<div class="row"><div><p class="note">'+(kind==="fix"?"定着テスト":esc(L.name))+'　'+(i+1)+'/'+qs.length+'問　正解 '+correct+'</p><div class="timer" id="t">'+fmt1(leftNow())+'<span class="unit"> 秒</span></div></div><div class="flash '+(flash||"")+'">'+(flash==="ok"?"正解 +0.5秒":flash==="ng"?"不正解":"&nbsp;")+'</div></div><div class="dots">';
    res.forEach(function(r,k){h+='<span class="dot'+(r.answered?(r.ok?" ok":" ng"):"")+(k===i?" cur":"")+'"></span>'});
    h+='</div><div class="card"><p class="note" style="font-weight:700">意味は？　'+esc(q.w.p)+'</p><div class="word">'+esc(q.w.w)+'</div><div style="display:flex;flex-direction:column;gap:8px">';
    q.choices.forEach(function(c,k){h+='<button class="choice" data-a="ans" data-k="'+k+'">'+(k+1)+'．'+esc(c)+'</button>'});
    h+='</div></div><p class="note">正解で0.5秒延びます。得点＝残り秒（切り捨て）＋正解数。</p>';
    app.innerHTML=h;
  }
  cur.answer=function(k){if(done)return;var q=qs[i],ok=k===q.a;res[i]={w:q.w,ok:ok,answered:true};if(ok)bonus+=BONUS;if(i<qs.length-1){i++;draw(ok?"ok":"ng")}else finish(leftNow())};
  draw();
  timer=setInterval(function(){var l=leftNow();var t=document.getElementById("t");if(t){t.innerHTML=fmt1(l)+'<span class="unit"> 秒</span>';t.className="timer"+(l<=10?" low":"")}if(l<=0)finish(0)},100);
}
function result(){
  var id=cur.id,L=LEVEL[id],p=lp(id),log=cur.log,res=cur.res,s=stats(L,p),wrong=res.filter(function(r){return !r.ok}),j=judge(log.score,log.correct,log.size);
  var isBest=log.kind==="round"&&log.score>=s.best;
  var h='<div class="card"><p class="note" style="font-weight:700">'+(log.kind==="fix"?"定着テスト":esc(L.name))+(isBest?'　<span class="tag">自己ベスト</span>':'')+'</p><div><span class="big">'+log.score+'</span><span class="unit"> 点</span></div>'+
    '<p>残り '+fmt1(log.left)+'秒 ＋ 正解 '+log.correct+'問'+(log.asked<log.size?'（'+(log.size-log.asked)+'問は時間切れ）':'')+'</p><div><span class="judge '+j[1]+'">'+j[0]+'</span></div>'+
    '<p class="note">このレベルの最高 '+s.best+'点・平均 '+s.avg+'点（'+s.rounds+'回）。覚えた語 '+p.learned+'。</p></div>';
  if(cur.fixDue)h+='<div class="card now"><h2>'+p.learned+'語を覚えました</h2><p>これまでに間違えた語だけで、暗記なしの1分テストをして定着を測ります。</p><button class="btn pri big" data-a="fix">定着テストへ</button></div>';
  if(wrong.length){h+='<div class="card"><h2>間違えた語 '+wrong.length+'</h2><div class="list">';wrong.forEach(function(r){h+='<div class="li"><span><span class="w">'+esc(r.w.w)+'</span>　'+esc(r.w.m)+'</span><span class="note">'+(r.answered?"×":"未回答")+'</span></div>'});h+='</div></div>'}
  h+='<div class="btns">'+(!cur.fixDue&&log.kind==="round"?'<button class="btn pri" data-a="start">次の30語へ</button>':'')+(log.kind==="round"?'<button class="btn" data-a="again">同じ30語をもう一度</button>':'')+'<button class="btn" data-a="level">ホームへ</button></div>';
  app.innerHTML=h;
}
function startRound(id){go("memo",{id:id,words:nextWords(LEVEL[id],lp(id))})}
function startFix(id){var ws=fixWords(LEVEL[id],lp(id));if(!ws.length){lp(id).lastFix=lp(id).learned;save();go("level",{id:id});return}go("test",{id:id,words:ws,kind:"fix"})}
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a"),id=cur&&cur.id;
  if(a==="level")go("level",{id:b.getAttribute("data-id")||id});
  else if(a==="levels")go("levels");
  else if(a==="start")startRound(id);
  else if(a==="fix")startFix(id);
  else if(a==="totest")cur.finish();
  else if(a==="ans")cur.answer(+b.getAttribute("data-k"));
  else if(a==="again")go("memo",{id:id,words:cur.words,repeat:true});
  else if(a==="askreset"){document.getElementById("reset").innerHTML='<div class="confirm"><p>'+esc(LEVEL[id].name)+'の記録（'+lp(id).log.length+'回分）を消します。元に戻せません。</p><div class="btns"><button class="btn pri" data-a="reset">消す</button><button class="btn" data-a="noreset">やめる</button></div></div>'}
  else if(a==="reset"){S.levels[id]=emptyLevel();save();go("level",{id:id})}
  else if(a==="noreset")go("level",{id:id});
});
app.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("tap")){e.preventDefault();e.target.click()}});
function start(h){loadLocal();if(h&&h.view&&h.view!=="memo"&&h.view!=="test"){view=h.view;cur=h.cur}render();connect()}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="memo"||view==="test")?{}:{view:view,cur:cur}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>

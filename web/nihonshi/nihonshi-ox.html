曲亭馬琴の読本"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0102","lv":3,"s":"円山応挙は、写生を重んじる画風を始め、円山派の祖となった。","a":1,"e":"円山応挙は、遠近法など西洋画の手法も取り入れ、写生を重んじる写実的な画風を開いて円山派の祖となった。『雪松図屏風』などが代表作である。","m":"写生の円山派＝円山応挙"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0103","lv":3,"s":"『十便十宜図』は、池大雅と円山応挙が合作した南画である。","a":0,"e":"誤り：円山応挙。正しくは池大雅と与謝蕪村の合作である。大雅と蕪村は文人画（南画）を大成した。円山応挙は写生を重んじる円山派の祖で、南画家ではない。","m":"十便十宜図＝大雅・蕪村の合作"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0104","lv":3,"s":"鶴屋南北は、『東海道四谷怪談』を書いた歌舞伎作者である。","a":1,"e":"鶴屋南北（4代目）は化政期の歌舞伎作者で、怪談や庶民の生活の暗い面を題材とした生世話物を得意とし、1825年に『東海道四谷怪談』を書いた。","m":"四谷怪談＝化政の鶴屋南北"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0105","lv":3,"s":"蕉風の復興を唱えた俳人は、小林一茶である。","a":0,"e":"誤り：小林一茶。正しくは与謝蕪村。蕪村は天明期に芭蕉に帰ることを唱え、絵画的な句を詠んだ。一茶は化政期に信濃の農村生活を背景とする庶民的な句を詠んだ俳人である。","m":"蕉風復興＝蕪村、庶民の句＝一茶"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0106","lv":3,"s":"海保青陵は、商業を重視し、藩財政の立て直しを説いた経世家である。","a":1,"e":"海保青陵は、商業や藩による専売制を積極的に評価し、武士も商売を卑しむべきではないと説いた。『稽古談』を著し、藩財政の立て直しに商業を生かす道を示した。","m":"海保青陵＝商業重視の経世論"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0107","lv":2,"s":"寛永期に建てられた桂離宮は、権現造の代表的な建築である。","a":0,"e":"誤り：権現造。正しくは数寄屋造。桂離宮は書院造に茶室の様式を取り入れた数寄屋造の代表で、八条宮家の別荘として寛永期に整えられた。権現造の代表は日光東照宮である。","m":"桂離宮＝数寄屋造、東照宮＝権現造"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0108","lv":3,"s":"本多利明は、鎖国を堅持して海外との交易を禁ずべきだと主張した。","a":0,"e":"誤り：鎖国を堅持して交易を禁ずべき。正しくは本多利明は『経世秘策』『西域物語』で、積極的に海外と交易して国を富ませ、蝦夷地を開発すべきだと説いた。","m":"本多利明＝開国交易・蝦夷地開発"},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0109","lv":1,"s":"福沢諭吉は、『学問のすゝめ』を著し、人間の平等と学問の大切さを説いた。","a":1,"e":"福沢諭吉は1872年から『学問のすゝめ』を刊行し、人は生まれながら平等であり、学問によって身を立てることが大切だと説いた。明六社にも参加し、文明開化の啓蒙思想を広めた。","m":"学問のすゝめ＝福沢諭吉","y":1872},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0110","lv":1,"s":"1872年に出された学制は、アメリカ式の自由主義的な教育を目指し、のちに教育令で改められた。","a":0,"e":"誤り：アメリカ式。正しくは学制はフランスの制度を模範とした中央集権的な制度。アメリカ式の自由主義を採ったのは1879年の教育令。","m":"学制＝仏式、教育令＝米式","y":1872},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0111","lv":1,"s":"森有礼が文部大臣のとき、学校令が出されて、学校体系が整えられた。","a":1,"e":"初代文部大臣の森有礼のもと、1886年に帝国大学令・師範学校令・中学校令・小学校令からなる学校令が公布され、小学校から帝国大学に至る学校体系が整えられた。","m":"1886年学校令＝森有礼","y":1886},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0112","lv":1,"s":"教育に関する勅語（教育勅語）は、1879年に出された。","a":0,"e":"誤り：1879年。正しくは1890年。教育勅語は忠君愛国を国民道徳の基本と示し、学校教育の柱とされた。1879年はアメリカ式の自由な制度をめざした教育令が出された年である。","m":"教育令1879・教育勅語1890","y":1890},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0113","lv":1,"s":"森鷗外は、ドイツ留学の経験を題材に、『舞姫』を著した。","a":1,"e":"森鷗外は陸軍軍医としてドイツに留学し、帰国後の1890年に、留学生とドイツの少女の悲恋を描いた『舞姫』を発表した。浪漫主義文学の先駆けとされる。","m":"舞姫＝軍医鷗外のドイツ体験","y":1890},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0114","lv":1,"s":"夏目漱石は、『舞姫』を著した作家である。","a":0,"e":"誤り：『舞姫』。正しくは夏目漱石の作品は『吾輩は猫である』『坊っちゃん』『こころ』などである。『舞姫』は森鷗外の作品で、漱石と鷗外はともに自然主義とは異なる立場をとった。","m":"漱石＝猫・坊っちゃん"},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0115","lv":1,"s":"北里柴三郎は、破傷風の血清療法を確立した。","a":1,"e":"北里柴三郎はドイツでコッホに学び、1889年に破傷風菌の純粋培養に成功し、翌年に血清療法を確立した。帰国後は伝染病研究所を設立し、のちペスト菌も発見した。","m":"北里＝破傷風の血清療法","y":1890},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0116","lv":1,"s":"志賀潔は、黄熱病の研究で知られる細菌学者である。","a":0,"e":"誤り：黄熱病の研究。正しくは志賀潔は北里柴三郎の伝染病研究所で学び、1897年に赤痢菌を発見した。黄熱病の研究で知られるのは野口英世で、研究中に自らも感染して亡くなった。","m":"志賀＝赤痢菌、野口＝黄熱病","y":1897},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0117","lv":1,"s":"文明開化の風潮のなかで、1872年には太陽暦が採用された。","a":1,"e":"明治政府は1872年に太陽暦の採用を決め、明治5年12月3日を明治6年1月1日とした。あわせて1日24時間制や七曜制も取り入れられ、文明開化の一つとなった。","m":"1872年に太陽暦を採用","y":1872},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0118","lv":1,"s":"1872年に、新橋・横浜間に電信が開通した。","a":0,"e":"誤り：電信。正しくは鉄道。1872年、新橋・横浜間に日本で最初の鉄道が開通した。電信は1869年に東京・横浜間で開通しており、鉄道より先である。","m":"鉄道1872（新橋〜横浜）、電信1869","y":1872},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0119","lv":1,"s":"白樺派は、武者小路実篤や志賀直哉らが活躍した、大正期の文学の流派である。","a":1,"e":"白樺派は、1910年創刊の雑誌『白樺』に集まった武者小路実篤・志賀直哉・有島武郎らの文学者で、人道主義・理想主義を掲げて大正期の文壇の中心となった。","m":"白樺派＝武者小路実篤・志賀直哉","y":1910},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0120","lv":1,"s":"『蟹工船』は、プロレタリア文学の作品で、芥川龍之介が著した。","a":0,"e":"誤り：芥川龍之介。正しくは小林多喜二。『蟹工船』は過酷な労働を描いたプロレタリア文学の代表作で、多喜二は1933年に特高警察の拷問で死亡した。芥川は新思潮派の作家である。","m":"蟹工船＝プロレタリアの小林多喜二","y":1929},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0122","lv":2,"s":"坪内逍遥は、『小説神髄』で写実主義を唱え、日本の近代文学の出発点となった。","a":1,"e":"坪内逍遥は1885年に『小説神髄』を著し、江戸時代の勧善懲悪の物語を批判して、人間の心理や世の中をありのままに描く写実主義を唱えた。近代文学の理論的な出発点である。","m":"写実主義の小説神髄＝坪内逍遥","y":1885},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0123","lv":2,"s":"言文一致体の小説として、『浮雲』を著したのは、尾崎紅葉である。","a":0,"e":"誤り：尾崎紅葉。正しくは二葉亭四迷。二葉亭は逍遥の写実主義を受け、話し言葉に近い言文一致体で『浮雲』を書いた。尾崎紅葉は硯友社を結成し、『金色夜叉』を著した。","m":"言文一致の浮雲＝二葉亭四迷","y":1887},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0124","lv":2,"s":"フェノロサと岡倉天心は、日本美術の復興に努め、東京美術学校の設立に関わった。","a":1,"e":"アメリカ人フェノロサと岡倉天心は、欧化の風潮のなかで軽んじられていた日本の伝統美術を再評価した。1887年に東京美術学校が設立され、天心はのち校長となり、日本美術院も創設した。","m":"伝統美術の復興＝フェノロサと天心","y":1887},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0125","lv":2,"s":"洋画家の黒田清輝は、明治美術会を結成した。","a":0,"e":"誤り：明治美術会。正しくは白馬会。フランスで学んだ黒田清輝は外光派の明るい画風を伝え、1896年に白馬会を結成した。明治美術会は浅井忠らが結成した日本最初の洋画団体である。","m":"黒田清輝＝白馬会、浅井忠＝明治美術会","y":1896},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0126","lv":2,"s":"1907年に、義務教育の年限は6年に延長された。","a":1,"e":"1907年の小学校令改正で、義務教育の年限が4年から6年に延長された。授業料の廃止（1900年）もあって、このころ小学校の就学率は90％をこえていた。","m":"義務教育6年への延長は1907年","y":1907},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0127","lv":2,"s":"1890年代、義務教育の授業料が無償となった。","a":0,"e":"誤り：1890年代。正しくは1900年。小学校令の改正で義務教育の授業料が原則として廃止され、就学率が大きく上がった。1907年には義務教育が6年に延長された。","m":"授業料廃止1900→6年制1907","y":1900},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0128","lv":2,"s":"1903年から、小学校の教科書は、国定制となった。","a":1,"e":"教科書の採用をめぐる贈収賄事件（教科書疑獄事件）をきっかけに、1903年から小学校の教科書は文部省が著作する国定教科書に統一された。国家による教育統制が強まった。","m":"1903年、小学校は国定教科書","y":1903},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0129","lv":2,"s":"久米邦武が『神道は祭天の古俗』を発表して職を追われたのは、昭和期のことである。","a":0,"e":"誤り：昭和期。正しくは1892年（明治）。帝国大学教授の久米邦武は論文が神道家などから非難され、職を追われた。昭和期の1940年に著書が発禁となったのは津田左右吉である。","m":"久米邦武は明治、津田左右吉は昭和","y":1892},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0130","lv":2,"s":"柳田国男は、民俗学を創始し、『遠野物語』を著した。","a":1,"e":"柳田国男は、文字に残されない村々の伝承や習俗を調査し、常民の生活文化を研究する民俗学を確立した。1910年に岩手県遠野地方の伝承をまとめた『遠野物語』を刊行した。","m":"民俗学の柳田国男＝遠野物語","y":1910},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0131","lv":2,"s":"西田幾多郎の『善の研究』は、日本の経済学の代表的な書物である。","a":0,"e":"誤り：経済学。正しくは哲学。西田幾多郎は禅の体験と西洋哲学を結びつけて独自の哲学体系をつくり、『善の研究』を著した。経済学では河上肇が『貧乏物語』を著した。","m":"善の研究＝西田の哲学","y":1911},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0132","lv":2,"s":"1925年に東京で、ラジオ放送が開始された。","a":1,"e":"1925年に東京・大阪・名古屋でラジオ放送が始まり、翌年これらを統合して日本放送協会（NHK）が設立された。新聞・雑誌とともに大衆文化を広める役割を果たした。","m":"ラジオ放送の開始は1925年","y":1925},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0133","lv":2,"s":"岩波文庫の創刊は、円本の流行よりも前のことである。","a":0,"e":"誤り：前。正しくは1926年に改造社が1冊1円の全集を出して円本ブームが起こり、その翌1927年に岩波文庫が創刊された。いずれも書籍の大量出版による大衆文化の広がりを示す。","m":"円本1926→岩波文庫1927","y":1927},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0134","lv":3,"s":"1891年、内村鑑三は、教育勅語への拝礼を拒んだことで、第一高等中学校の教職を追われた。","a":1,"e":"1891年、第一高等中学校の嘱託教員であったキリスト教徒の内村鑑三は、教育勅語の奉読式で拝礼をためらい、不敬だと非難されて職を退いた。キリスト教と国家主義の対立を示す事件である。","m":"内村鑑三不敬事件は1891年","y":1891},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0135","lv":3,"s":"吉野作造は、天皇機関説を唱えて、のち貴族院議員を辞職した。","a":0,"e":"誤り：吉野作造。正しくは美濃部達吉。天皇機関説は1935年に貴族院で攻撃され、美濃部は議員を辞職した。吉野作造は大正期に民本主義を唱え、政党内閣の実現を説いた政治学者である。","m":"機関説＝美濃部、民本主義＝吉野","y":1935},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0136","lv":3,"s":"高峰譲吉は、消化薬のタカジアスターゼを発明し、アドレナリンも発見した。","a":1,"e":"高峰譲吉はアメリカを拠点に研究した化学者で、こうじ菌から消化薬タカジアスターゼを作り、1900年には副腎からアドレナリンを結晶として取り出すことに成功した。","m":"高峰譲吉＝タカジアスターゼ・アドレナリン"},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0137","lv":3,"s":"鈴木梅太郎は、米ぬかからアドレナリンを抽出した。","a":0,"e":"誤り：アドレナリン。正しくはオリザニン（ビタミンB1）。鈴木梅太郎は米ぬかから脚気に効く成分を抽出した。アドレナリンを取り出したのは高峰譲吉である。","m":"鈴木梅太郎＝オリザニン","y":1910},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0138","lv":2,"s":"『みだれ髪』は、与謝野鉄幹が著した歌集である。","a":0,"e":"誤り：与謝野鉄幹。正しくは与謝野晶子。晶子は1901年に情熱的な恋愛の歌を収めた歌集『みだれ髪』を刊行した。夫の鉄幹は雑誌『明星』を主宰し、浪漫主義の詩歌を広めた。","m":"みだれ髪＝晶子、明星＝鉄幹","y":1901},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0139","lv":3,"s":"樋口一葉は、『若菜集』を刊行し、浪漫主義の詩を発表した。","a":0,"e":"誤り：樋口一葉。正しくは島崎藤村。藤村は1897年に浪漫主義の詩集『若菜集』を刊行し、のちに小説『破戒』で自然主義に転じた。樋口一葉は『たけくらべ』『にごりえ』を書いた。","m":"若菜集＝藤村、たけくらべ＝一葉","y":1897},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0140","lv":3,"s":"与謝野晶子は、日露戦争の際に、反戦詩を発表した。","a":1,"e":"日露戦争中の1904年、与謝野晶子は旅順を攻める軍にいた弟を思い、「君死にたまふことなかれ」を雑誌『明星』に発表した。戦争に疑問を投げかける詩として非難も受けた。","m":"君死にたまふことなかれ＝晶子","y":1904},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0141","lv":3,"s":"『赤い鳥』は、大正期に北原白秋が創刊した児童文芸雑誌である。","a":0,"e":"誤り：北原白秋。正しくは鈴木三重吉が1918年に創刊した。芥川龍之介・有島武郎らが童話を、北原白秋らが童謡を寄せ、大正期の児童文学運動の中心となった。","m":"赤い鳥＝鈴木三重吉が創刊","y":1918},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0142","lv":3,"s":"東京駅の設計者は、辰野金吾である。","a":1,"e":"東京駅は辰野金吾の設計で1914年に完成した、赤れんがの駅舎である。辰野はコンドルに学んだ日本人建築家の第一世代で、日本銀行本店も設計した。","m":"東京駅・日銀本店＝辰野金吾","y":1914},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0143","lv":3,"s":"鹿鳴館を設計したのは、辰野金吾である。","a":0,"e":"誤り：辰野金吾。正しくはイギリス人建築家ジョサイア・コンドル。鹿鳴館は1883年に完成した洋風の社交場で、井上馨の欧化政策の象徴である。コンドルは辰野金吾らを育てた。","m":"鹿鳴館＝コンドル、東京駅＝辰野","y":1883},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0144","lv":3,"s":"新島襄は、同志社英学校を設立し、キリスト教主義の教育を行った。","a":1,"e":"アメリカで学んだ新島襄は、1875年に京都で同志社英学校を設立し、キリスト教にもとづく人格教育を行った。のち同志社大学となる。","m":"同志社英学校＝新島襄（京都）","y":1875},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0145","lv":1,"s":"法然は、浄土宗を開き、専修念仏を説いた。","a":1,"e":"法然は、阿弥陀仏の救いを信じてひたすら念仏をとなえれば極楽に往生できるとする専修念仏を説き、浄土宗を開いた。九条兼実の求めで『選択本願念仏集』を著した。","m":"法然＝浄土宗・専修念仏"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0146","lv":1,"s":"親鸞は、浄土宗を開いた。","a":0,"e":"誤り：浄土宗。正しくは浄土真宗（一向宗）。親鸞は法然の弟子で、阿弥陀仏を信じる心を重んじ、悪人こそが救われるという悪人正機を説いた。浄土宗を開いたのは法然である。","m":"師の法然＝浄土宗、親鸞＝浄土真宗"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0147","lv":1,"s":"日蓮は、法華経を重んじ、題目をとなえることで救われると説いた。","a":1,"e":"日蓮は法華経こそ正しい教えであるとし、「南無妙法蓮華経」の題目をとなえれば救われると説いた。1260年には『立正安国論』を北条時頼に提出し、他宗を激しく批判した。","m":"日蓮＝題目・立正安国論","y":1260},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0148","lv":1,"s":"一遍は、踊念仏によって各地で布教し、臨済宗を開いた。","a":0,"e":"誤り：臨済宗。正しくは一遍が開いたのは時宗である。一遍は全国を遊行し、念仏札を配りながら踊念仏で布教した。臨済宗を日本に伝えたのは宋で禅を学んだ栄西である。","m":"一遍＝時宗・遊行と踊念仏"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0149","lv":1,"s":"栄西は宋に渡って禅を学び、臨済宗を日本に伝えた。","a":1,"e":"栄西は2度宋に渡って禅を学び、臨済宗を伝えた。坐禅中に師から与えられる公案を解く修行を重んじ、『興禅護国論』を著した。鎌倉幕府の保護を受け、京都に建仁寺を開いた。","m":"栄西＝臨済宗・興禅護国論"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0150","lv":1,"s":"道元は臨済宗を伝え、永平寺を開いた。","a":0,"e":"誤り：臨済宗。正しくは曹洞宗。道元は宋で禅を学んで帰国し、ひたすら坐禅に打ちこむ只管打坐を説いた。権力から離れて越前に永平寺を開き、『正法眼蔵』を著した。","m":"道元＝曹洞宗・永平寺・只管打坐"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0151","lv":1,"s":"織田信長は、1571年に比叡山延暦寺を焼き討ちした。","a":1,"e":"織田信長は、浅井・朝倉氏に味方した比叡山延暦寺を1571年に焼き討ちした。のち1570年から続いた石山本願寺との戦い（石山合戦）にも勝ち、宗教勢力を屈服させた。","m":"1571年、信長が延暦寺を焼き討ち","y":1571},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0152","lv":1,"s":"キリスト教を日本に最初に伝えたのは、ヴァリニャーノである。","a":0,"e":"誤り：ヴァリニャーノ。正しくはフランシスコ・ザビエル（1549年、鹿児島）。ヴァリニャーノは天正遣欧使節を企画した巡察師。","m":"伝来はザビエル1549","y":1549},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0153","lv":1,"s":"江戸幕府は、島原の乱の後、キリスト教の取締りを強め、寺請制度を設けた。","a":1,"e":"島原の乱（1637〜38年）の後、幕府はキリスト教の取締りを強化し、人々をいずれかの寺院の檀家として寺に証明させる寺請制度を設けた。宗門改帳はのちの戸籍の役割も果たした。","m":"寺請制度で全員を寺の檀家に","y":1637},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0154","lv":1,"s":"明治政府は、神仏分離令を出して、神道と仏教との結びつきを強めた。","a":0,"e":"誤り：結びつきを強めた。正しくは1868年の神仏分離令で、神社から仏像や仏具を取り除かせるなど、神道と仏教を切り離した。これをきっかけに各地で寺院や仏像を壊す廃仏毀釈が起こった。","m":"神仏分離令→廃仏毀釈","y":1868},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0155","lv":1,"s":"1945年、GHQは神道指令を出し、国家と神道の分離を命じた。","a":1,"e":"1945年12月の神道指令で、国家による神社神道への保護・支援が禁じられ、国家神道は解体された。翌年の天皇の人間宣言、日本国憲法の信教の自由と政教分離の規定へとつながった。","m":"神道指令（1945）で国家神道を解体","y":1945},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0156","lv":1,"s":"蓮如は、浄土宗を開き、吉崎に道場をつくった。","a":0,"e":"誤り：浄土宗。正しくは浄土真宗（本願寺派）の中興の祖。法然が開いたのは浄土宗である。蓮如は越前吉崎で布教し、平易な『御文』で教えを説いた。","m":"蓮如＝浄土真宗の中興・御文"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0157","lv":1,"s":"禁教下でひそかに信仰を守り続けた人々は、潜伏キリシタンとよばれる。","a":1,"e":"江戸幕府の禁教のもとでも、長崎や天草などでは仏教徒を装いながら信仰を受け継ぐ人々がいた。1865年には大浦天主堂でフランス人宣教師に信仰を告白した（信徒発見）。","m":"禁教下の信仰者＝潜伏キリシタン"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0158","lv":2,"s":"本地垂迹説は、神は仏が仮に姿を現したものであるとする考え方で、神仏習合を進めた。","a":1,"e":"本地垂迹説は、日本の神は仏・菩薩（本地）が人々を救うために仮に姿を現したもの（権現）だとする考え方で、平安時代中期から広まり神仏習合を進めた。逆に神を主とする説も鎌倉時代に現れた。","m":"本地垂迹＝神は仏の仮の姿"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0159","lv":2,"s":"鎌倉時代の旧仏教側から、法然を批判した人物に、栄西がいる。","a":0,"e":"誤り：栄西。正しくは華厳宗の明恵が『摧邪輪』で法然を批判し、法相宗の貞慶も専修念仏の禁止を求めた。栄西は臨済宗を伝えた僧で、旧仏教側の法然批判者ではない。","m":"法然批判＝明恵・貞慶"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0160","lv":2,"s":"叡尊や忍性は、律宗を再興し、病人や貧しい人々の救済事業に努めた。","a":1,"e":"叡尊は奈良の西大寺を拠点に戒律の復興に努め、弟子の忍性は鎌倉の極楽寺を拠点に、病人や貧しい人々の救済、橋や道の整備などの社会事業を行った。旧仏教側の改革の例である。","m":"叡尊・忍性＝律宗の再興と社会事業"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0161","lv":2,"s":"蘭溪道隆は、北条時宗の招きで来日して、円覚寺を開いた。","a":0,"e":"誤り：蘭溪道隆。正しくは無学祖元。北条時宗は南宋から無学祖元を招き、円覚寺を開いた。蘭溪道隆は北条時頼に招かれて建長寺の開山となった。いずれも鎌倉五山の寺院である。","m":"建長寺＝道隆（時頼）、円覚寺＝祖元（時宗）"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0162","lv":2,"s":"足利義満は、五山の制を整え、京都の相国寺を五山に加えた。","a":1,"e":"足利義満は南宋の官寺の制度にならって五山・十刹の制を整え、自ら建てた相国寺を五山に加えた。このとき南禅寺を五山の上に置き、京都五山と鎌倉五山を定めた。","m":"五山の上に南禅寺、相国寺は義満"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0163","lv":2,"s":"夢窓疎石は、足利義満に重んじられ、天龍寺を開いた。","a":0,"e":"誤り：足利義満。正しくは足利尊氏・直義兄弟に重んじられた。夢窓疎石は後醍醐天皇の冥福を祈るため天龍寺の建立を勧め、その費用を得るために天龍寺船が元に派遣された。","m":"夢窓疎石＝尊氏・天龍寺"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0164","lv":2,"s":"加賀の一向一揆は、1488年に守護の富樫政親を倒した。","a":1,"e":"1488年、加賀の一向宗（浄土真宗）の門徒が国人と結んで守護の富樫政親を倒した。以後約1世紀にわたり、門徒が実質的に国を支配し、百姓の持ちたる国とよばれた。","m":"1488年、加賀の一向一揆が守護を倒す","y":1488},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0165","lv":2,"s":"天文法華の乱では、延暦寺の僧兵が浄土真宗の寺院を焼き払った。","a":0,"e":"誤り：浄土真宗の寺院。正しくは法華宗（日蓮宗）の寺院。京都の町衆に広まった法華宗は法華一揆を結んで勢力をもったが、1536年に延暦寺の僧兵らに攻められ、京都から追われた。","m":"天文法華の乱＝延暦寺が法華宗を攻撃","y":1536},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0166","lv":2,"s":"江戸幕府は、日蓮宗の不受不施派を、幕府の権威に従わないとして弾圧した。","a":1,"e":"日蓮宗の不受不施派は、法華経を信じない者からは布施を受けず、施しもしないという教えを守り、将軍や大名の命令にも従わなかった。そのため幕府はキリスト教と同様に禁止した。","m":"不受不施派は幕府に従わず禁止"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0167","lv":2,"s":"隠元は、明から来日して黄檗宗を伝え、京都の建仁寺を開いた。","a":0,"e":"誤り：京都の建仁寺。正しくは宇治の万福寺を開いた。隠元は17世紀半ばに来日し、明の禅を伝えて黄檗宗を開いた。建仁寺は鎌倉時代に栄西が開いた臨済宗の寺院である。","m":"隠元＝黄檗宗・宇治の万福寺","y":1654},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0168","lv":2,"s":"1613年に、江戸幕府は、禁教令を全国に及ぼした。","a":1,"e":"1612年に幕府は直轄領に禁教令を出し、翌1613年にはこれを全国に広げた。宣教師は国外に追放され、のち高山右近らもマニラへ追われた。信者を見つけるために絵踏も行われた。","m":"禁教令は1612直轄領→1613全国","y":1613},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0169","lv":2,"s":"1587年の豊臣秀吉のバテレン追放令では、南蛮貿易を禁止した。","a":0,"e":"誤り：南蛮貿易を禁止。正しくはバテレン追放令は宣教師の国外退去を命じたが、南蛮貿易は奨励したため、商人とともに宣教師の来日は続き、禁教は不徹底に終わった。","m":"バテレン追放令でも貿易は続けた","y":1587},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0170","lv":3,"s":"島地黙雷ら仏教界は、神道国教化の政策に反対し、信教の自由を主張した。","a":1,"e":"明治初期、政府は神道の国教化を進めたが、浄土真宗の島地黙雷らはこれを批判し、信教の自由と政教分離を主張した。のち仏教各派は大教院から離脱し、国教化政策は行きづまった。","m":"島地黙雷＝信教の自由を主張"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0171","lv":3,"s":"明治政府が発した大教宣布の詔は、仏教の振興を目的とした。","a":0,"e":"誤り：仏教の振興。正しくは1870年の大教宣布の詔は、神道を国教とし、天皇を中心とする国家の考え方を国民に広めることを目的とした。宣教使が各地で教えを説いたが成果は上がらなかった。","m":"大教宣布の詔＝神道の国教化","y":1870},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0172","lv":3,"s":"大日本帝国憲法では、安寧秩序を妨げず、臣民の義務に背かない限りで、信教の自由が認められた。","a":1,"e":"大日本帝国憲法第28条は、安寧秩序を妨げず臣民の義務に背かない限りで信教の自由を認めた。神社は宗教ではないとされ、神社参拝は国民の義務とみなされるようになった。","m":"帝国憲法の信教の自由は条件つき","y":1889},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0173","lv":3,"s":"キリシタン禁制の高札が撤廃されたのは、明治維新直後の1868年である。","a":0,"e":"誤り：1868年。正しくは1873年。諸外国の抗議を受けて高札が撤廃され、キリスト教が黙認された。1868年は五榜の掲示で禁制を継続した年。","m":"キリシタン禁制の高札撤廃は1873年","y":1873},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0174","lv":3,"s":"中山みきは、天理教を開き、民衆に救済を説いた。","a":1,"e":"幕末、大和の農婦中山みきが天理教を開いた。黒住宗忠の黒住教、川手文治郎の金光教とともに、幕末に広まった民衆宗教で、明治期には教派神道として公認された。","m":"天理教＝中山みき（幕末の民衆宗教）","y":1838},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0175","lv":3,"s":"垂加神道は、吉田兼倶が創始した。","a":0,"e":"誤り：吉田兼倶。正しくは山崎闇斎。闇斎は朱子学者で、儒教の考えと神道を結びつけた垂加神道を唱えた。吉田兼倶は室町時代後期に吉田神道（唯一神道）を創始した。","m":"垂加神道＝山崎闇斎、唯一神道＝兼倶"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0176","lv":3,"s":"鎌倉時代、度会家行らによって伊勢神道が体系化された。","a":1,"e":"鎌倉時代末期、伊勢外宮の神官度会家行は、神が本で仏はその仮の姿であるとする神本仏迹説にもとづき伊勢神道（度会神道）を体系化した。本地垂迹説を逆転させた考え方である。","m":"伊勢神道＝度会家行・神本仏迹"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0177","lv":3,"s":"遣唐使として入唐した円仁は、『入唐求法巡礼行記』を著した後、寺門派の祖となった。","a":0,"e":"誤り：寺門派の祖。正しくは山門派の祖。円仁の門流は比叡山延暦寺に拠って山門派とよばれた。寺門派の祖は円珍で、その門流は園城寺（三井寺）に拠った。両派は激しく対立した。","m":"円仁＝山門派、円珍＝寺門派"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0178","lv":3,"s":"貞慶（解脱）は、法然の専修念仏を批判し、法相宗の復興に努めた。","a":1,"e":"法相宗の貞慶（解脱）は、1205年の興福寺奏状を起草して専修念仏の停止を朝廷に求めた。戒律を重んじ、笠置寺に住んで旧仏教の立て直しに努めた。","m":"貞慶＝興福寺奏状・法相宗"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0179","lv":3,"s":"『教行信証』は、日蓮が著した書である。","a":0,"e":"誤り：日蓮。正しくは親鸞。『教行信証』は親鸞が浄土真宗の教えを体系的に述べた主著である。日蓮の主著は北条時頼に提出した『立正安国論』である。","m":"教行信証＝親鸞、立正安国論＝日蓮"},{"f":"文化","t":"仏教史・宗教史","ref":"BK-0180","lv":2,"s":"『喫茶養生記』は、道元が著した、茶の効用を説いた書物である。","a":0,"e":"誤り：道元。正しくは栄西。栄西は宋から茶の種を持ち帰って喫茶の習慣を広め、『喫茶養生記』で茶の効用を説いた。二日酔いの将軍源実朝に茶とこの書を献じたと伝えられる。","m":"喫茶養生記＝栄西、茶を広めた"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0181","lv":3,"s":"『蒙古襲来絵詞』は、元寇で活躍した北条時宗が自らの戦いぶりを描かせた絵巻物である。","a":0,"e":"誤り：北条時宗。正しくは肥後の御家人竹崎季長が、文永・弘安の役での自分の戦いぶりと、恩賞を求めて鎌倉に赴いた経緯を描かせた。元軍の集団戦法や火器も描かれている。","m":"蒙古襲来絵詞＝竹崎季長の戦功","y":1293},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0182","lv":3,"s":"『節用集』は、室町時代に成立した仏教の説話集である。","a":0,"e":"誤り：仏教の説話集。正しくは日常に使う語句をいろは順に並べた国語辞書である。室町時代には『庭訓往来』などの教科書も作られ、地方の武士や庶民にも学問が広がった。","m":"節用集＝いろは引きの辞書"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0183","lv":2,"s":"円覚寺舎利殿は、大仏様の代表的な建築である。","a":0,"e":"誤り：大仏様。正しくは禅宗様（唐様）の代表である。禅宗様は細かい部材を組み、整然とした美しさをもつ。大仏様の代表は重源が再建した東大寺南大門である。","m":"円覚寺舎利殿＝禅宗様"},{"f":"文化","t":"近代の文化と学問・教育","ref":"BK-0184","lv":1,"s":"正岡子規は、俳句や短歌の革新を進め、写生を重んじた。","a":1,"e":"正岡子規は明治中期に雑誌『ホトトギス』に関わって俳句の革新を進め、『歌よみに与ふる書』で短歌の革新も唱えた。ありのままを描く写生を重んじ、高浜虚子らに受け継がれた。","m":"子規＝俳句・短歌の革新と写生"}];
const LESSON={"古代|原始・弥生":{"pts":["旧石器時代は打製石器を使い移動生活。縄文時代は磨製石器・土器・弓矢が加わり、竪穴住居で定住が進んだ。岩宿遺跡で旧石器文化が確認された。","縄文時代は採集・狩猟・漁労が中心で、貝塚が残る。大森貝塚はモース、三内丸山遺跡は縄文前〜中期の大規模集落。","水田稲作は縄文時代の終わりごろ九州北部に伝わり、弥生時代に東北地方まで広まった。弥生土器は薄手で赤褐色、縄文土器は厚手で黒褐色・縄目文様。","弥生時代には石包丁・木製農具・高床倉庫が使われ、環濠集落（吉野ヶ里）や高地性集落など戦いの跡が増えた。","青銅器は祭器（銅鐸は近畿、銅矛は九州北部、平形銅剣は瀬戸内が中心）、鉄器は工具・農具・武器などの実用品として使われた。","墓には甕棺墓・支石墓（北部九州）や方形周溝墓があり、副葬品の差から貧富・身分の差が生じたことが分かる。","中国の史書：『漢書』地理志（百余国）、『後漢書』東夷伝（57年奴国王に印綬）、『魏志』倭人伝（239年卑弥呼に親魏倭王）。"],"traps":["「登呂遺跡は環濠集落」は×。環濠集落は吉野ヶ里、登呂は水田の遺跡（静岡）。","「銅鐸は北部九州、銅矛は近畿」は×。逆で、銅鐸は近畿、銅矛は九州北部が中心。","「卑弥呼は漢委奴国王の印を受けた」は×。卑弥呼は魏の親魏倭王、漢委奴国王は後漢の光武帝が奴国王に与えた。","「107年に帥升が魏に朝貢」は×。後漢の安帝への朝貢。魏への遣使は239年の卑弥呼。","「北海道でも弥生文化が展開」は×。北海道は続縄文文化、南西諸島は貝塚文化。"],"rel":["古代|ヤマト政権と古墳","文化|古代の文化（飛鳥〜国風）"],"bridge":"弥生時代の小国分立と邪馬台国連合の成立が、次のヤマト政権と古墳の登場につながる。","sys":{"overview":"日本列島の人びとの暮らしを、旧石器・縄文・弥生の順に整理する。道具・食料・社会の変化と、中国史書にみえる倭の姿を押さえる。","tree":[{"h":"旧石器時代","items":["打製石器","岩宿遺跡（相沢忠洋）","野尻湖（ナウマン象）"]},{"h":"縄文時代","items":["磨製石器・土器・弓矢","竪穴住居・貝塚","土偶・抜歯・屈葬","三内丸山遺跡・大森貝塚"]},{"h":"弥生時代","items":["稲作・金属器","石包丁・高床倉庫","環濠集落・高地性集落","銅鐸・銅剣・銅矛","吉野ヶ里・登呂"]},{"h":"中国史書の倭","items":["漢書地理志：百余国","後漢書：57年 奴国","魏志倭人伝：239年 卑弥呼"]}],"flow":{"title":"原始から邪馬台国まで","steps":["旧石器：打製石器の狩猟採集","縄文：土器・定住・貝塚","縄文時代の終わり：九州北部に水田稲作が伝わる","弥生：金属器・環濠集落・小国分立","57年：奴国王が後漢から印綬","239年：卑弥呼が魏から親魏倭王"]},"tables":[{"title":"縄文土器と弥生土器","head":["","縄文","弥生"],"rows":[["厚さ","厚手","薄手で硬い"],["文様","縄目など複雑","簡素"],["色","黒褐色","赤褐色"]]},{"title":"青銅器の分布","head":["器","中心地域","用途"],"rows":[["銅鐸","近畿","祭器"],["銅矛","九州北部","祭器"],["平形銅剣","瀬戸内","祭器"]]}]}},"古代|ヤマト政権と古墳":{"pts":["3世紀後半、近畿を中心にヤマト政権が成立。首長は大王。前方後円墳が各地に広がり、政権の勢力範囲を示す。","古墳の副葬品は前期が鏡・玉など呪術的、中期以降は武具・馬具など軍事的。埋葬施設は竪穴式石室から横穴式石室へ。7世紀には前方後円墳が消え、大王墓は八角墳に。","5世紀に倭の五王（讃・珍・済・興・武）が南朝の宋に朝貢。478年の倭王武の上表文は雄略天皇に当たるとされる。","稲荷山鉄剣（埼玉）・江田船山大刀（熊本）の銘にワカタケル大王。王権の勢力が関東から九州に及んだことを示す。","氏姓制度：氏（同族集団）と姓（臣・連・君など）。大臣は蘇我氏などの臣、大連は大伴・物部などの連。","直轄地は屯倉（耕作民は田部）、豪族の私有地は田荘、私有民は部曲。地方豪族は国造に任じられた。","渡来人が漢字・儒教・須恵器・機織などを伝えた。527年の磐井の乱で九州北部への支配が強まった。"],"traps":["「倭の五王が唐に朝貢」は×。南朝の宋。唐の成立は7世紀。","「前期の副葬品は馬具・武具」は×。前期は鏡・玉、中期以降に馬具・武具が増える。","「蘇我・平群は連」は×。臣は蘇我・平群など、連は大伴・物部など。","「稲荷山古墳は熊本」は×。稲荷山は埼玉、江田船山は熊本。","「屯倉は豪族の私有民」は×。屯倉は大王の直轄地、私有民は部曲。"],"rel":["古代|原始・弥生","古代|推古朝と大化改新","文化|古代の文化（飛鳥〜国風）"],"bridge":"古墳の巨大化と氏姓制度が、豪族が大王に従う体制の形成を示す。次は、豪族中心の政治を改めた推古朝と大化改新へつながる。","sys":{"overview":"ヤマト政権の成立から6世紀末までの政治・外交・社会。古墳の変化、倭の五王、氏姓制度、部民・屯倉などを整理する。","tree":[{"h":"古墳","items":["前方後円墳（大仙陵古墳など）","前期：竪穴式石室・鏡玉","後期：横穴式石室・馬具武具","群集墳・装飾古墳","埴輪（円筒・形象）"]},{"h":"対外関係","items":["倭の五王：宋に朝貢","478年 倭王武の上表文","好太王碑：高句麗と交戦","伽耶諸国から鉄を入手"]},{"h":"政治組織","items":["氏姓制度（臣・連）","大臣：蘇我など／大連：大伴・物部","屯倉・田荘・部曲","国造"]},{"h":"6世紀の動き","items":["527年 磐井の乱","仏教公伝（欽明朝）","渡来人の活躍"]}],"flow":{"title":"ヤマト政権の展開","steps":["3世紀後半：ヤマト政権成立・前方後円墳","4世紀：朝鮮半島への進出","5世紀：倭の五王が宋に朝貢","5世紀後半：ワカタケル大王（雄略）","527年：磐井の乱","6世紀：蘇我氏の台頭と仏教公伝"]},"tables":[{"title":"臣と連","head":["姓","代表的な氏","役割"],"rows":[["臣","蘇我・平群・葛城","大臣に就く"],["連","大伴・物部・中臣","大連に就く"]]},{"title":"直轄と私有","head":["区分","土地","民"],"rows":[["大王","屯倉","田部"],["豪族","田荘","部曲"]]}]}},"古代|推古朝と大化改新":{"pts":["592年に推古天皇が即位。甥の厩戸王（聖徳太子）が大臣の蘇我馬子と協力して国家組織の整備を進めた。","603年に冠位十二階（個人の能力で登用、世襲でない）、604年に憲法十七条（官人の心得、仏教を敬え）を制定。","『隋書』では600年に最初の遣使（『日本書紀』には記載なし）。607年に小野妹子を派遣し、国書の「日出づる処の天子」に煬帝は不快を示した。","飛鳥文化は仏教文化で、飛鳥寺（馬子）・法隆寺（斑鳩）、釈迦三尊像（鞍作鳥）などが代表。","645年の乙巳の変で中大兄皇子・中臣鎌足が蘇我蝦夷・入鹿を倒し、孝徳天皇のもと改新が始まった（難波遷都）。","646年の改新の詔：公地公民、国郡制、戸籍・計帳と班田収授、新税制。国博士に高向玄理・旻。","663年、白村江で唐・新羅に敗北。水城・大野城・基肄城・防人を整え、667年に近江大津宮、670年に庚午年籍。"],"traps":["「607年の遣隋使は犬上御田鍬」は×。607年は小野妹子。犬上御田鍬は最初の遣唐使（630年）。","「乙巳の変で倒れたのは馬子と蝦夷」は×。蝦夷と入鹿。","「白村江の相手は高句麗と新羅」は×。唐と新羅。","「憲法十七条は庶民の道徳」は×。豪族・官人の心得。","「評は廃止されて郡に」を改新直後と取り違えない。評は大化後、郡は701年の大宝律令から。"],"rel":["古代|ヤマト政権と古墳","古代|律令国家の成立","文化|古代の文化（飛鳥〜国風）"],"bridge":"推古朝の国家組織の整備と大化改新は、豪族の連合から天皇中心の中央集権へ向かう動きで、次の律令国家の成立につながる。","sys":{"overview":"6世紀末〜7世紀後半の政治改革と外交。推古朝の改革、遣隋使、乙巳の変と改新の詔、白村江の戦いとその後の国内体制を順に整理する。","tree":[{"h":"推古朝","items":["592年 推古天皇即位","603年 冠位十二階","604年 憲法十七条","600・607年 遣隋使"]},{"h":"大化改新","items":["645年 乙巳の変","難波長柄豊碕宮","646年 改新の詔","国博士：高向玄理・旻"]},{"h":"対外危機","items":["663年 白村江の戦い","水城・大野城・基肄城・防人","667年 近江大津宮"]},{"h":"天智朝","items":["664年 甲子の宣","668年 即位","670年 庚午年籍"]}],"flow":{"title":"推古朝から天智朝まで","steps":["592年：推古天皇即位","603年：冠位十二階","604年：憲法十七条","607年：小野妹子を隋へ","645年：乙巳の変","646年：改新の詔","663年：白村江の敗戦","667年：近江大津宮へ遷都","670年：庚午年籍"]},"tables":[{"title":"冠位十二階と憲法十七条","head":["","冠位十二階","憲法十七条"],"rows":[["年","603","604"],["性格","人材登用の制度","官人の心得"],["対象","個人（世襲でない）","豪族・官人"]]}]}},"古代|律令国家の成立":{"pts":["672年の壬申の乱で大海人皇子が大友皇子に勝ち天武天皇。皇族を重く用い、684年に八色の姓を定めた。","持統天皇は689年に飛鳥浄御原令を施行し、690年に庚寅年籍を作り、694年に藤原京へ遷都した。","701年に大宝律令。刑部親王・藤原不比等らが編纂。律は刑罰、令は行政などの規定。718年ごろ養老律令を編纂。","中央は二官（神祇官・太政官）八省。太政官は公卿の合議。地方は国・郡・里（50戸）で、国司は中央から派遣、郡司は地方豪族。","6歳以上の良民男女に口分田を班給（男2段、女は3分の2）。6年ごとに戸籍を作り、班田収授を行う。口分田は売買できない。","租（田1段2束2把、収穫の約3％、地方財源）・調・庸（中央へ運脚）・雑徭（年60日以内）・兵役（軍団、防人）。","官位相当制と蔭位の制。賤民は五色の賤。708年和同開珎、710年平城京遷都（元明天皇）。"],"traps":["「藤原京は710年」は×。藤原京は694年、710年は平城京。","「国司は地方豪族」は×。国司は中央派遣、地方豪族は郡司。","「租は都に納める」は×。租は国衙に納め地方の財源。調・庸が都へ運ばれる。","「雑徭は年10日」は×。年60日以内。10日は歳役（庸で代納）。","「持統は庚午年籍」は×。持統は庚寅年籍（690年）、庚午年籍は天智（670年）。"],"rel":["古代|推古朝と大化改新","古代|奈良時代の政治","古代|荘園と武士の成長"],"bridge":"律令国家は、大化改新の理念を法として具体化したもの。口分田が行き詰まると、次の奈良時代の土地政策（三世一身法・墾田永年私財法）へ進む。","sys":{"overview":"天武・持統朝から大宝律令の完成、平城京遷都まで。律令の仕組み、官制、土地・税制を整理する。","tree":[{"h":"天武・持統","items":["672年 壬申の乱","684年 八色の姓","689年 飛鳥浄御原令","690年 庚寅年籍","694年 藤原京"]},{"h":"中央官制","items":["神祇官","太政官（太政大臣・左右大臣・大納言）","八省（式部・民部・治部など）","大宰府"]},{"h":"地方官制","items":["国司（中央派遣）","郡司（地方豪族）","里（50戸）","駅制・防人"]},{"h":"土地・税","items":["戸籍：6年ごと","班田収授：口分田","租庸調・雑徭","兵役：軍団・防人"]}],"flow":{"title":"律令国家の成立過程","steps":["672年：壬申の乱","684年：八色の姓","689年：飛鳥浄御原令","690年：庚寅年籍","694年：藤原京","701年：大宝律令","708年：和同開珎","710年：平城京"]},"tables":[{"title":"租庸調","head":["税","内容","納め先"],"rows":[["租","田1段2束2把（約3％）","国衙（地方財源）"],["調","特産物","中央（運脚）"],["庸","歳役10日の代納（布）","中央（運脚）"],["雑徭","年60日以内の労役","国司のもと"]]}]}},"古代|奈良時代の政治":{"pts":["710年、元明天皇が平城京に遷都。唐の長安にならった条坊制の都。","土地政策は723年三世一身法（期限つき私有）から743年墾田永年私財法（永久私有、位階で面積制限）へ。初期荘園が広がった。","729年長屋王の変、光明子立后。737年藤原四子が病死し橘諸兄政権（吉備真備・玄昉）。740年藤原広嗣の乱。","聖武天皇は恭仁京・難波・紫香楽を転々とし、741年国分寺建立の詔、743年大仏造立の詔、752年東大寺大仏開眼。","藤原仲麻呂（恵美押勝）は757年に養老律令を施行。764年に挙兵して敗死。続く称徳天皇（孝謙の重祚）は道鏡を重用。","769年宇佐八幡宮神託事件で道鏡の皇位をねらう動きは和気清麻呂らにより阻まれ、光仁天皇が即位（770年）。","712年『古事記』、720年『日本書紀』、713年風土記の編纂命令。753年に鑑真が来日し唐招提寺を創建。"],"traps":["「平城京遷都は桓武」は×。元明。桓武は長岡京・平安京。","「三世一身法は永久私有」は×。期限つき。永久私有は墾田永年私財法。","「広嗣は東国で挙兵」は×。大宰府（九州）。","「764年に挙兵したのは道鏡」は×。藤原仲麻呂。","「『日本書紀』は稗田阿礼の誦習」は×。それは『古事記』。『日本書紀』は舎人親王ら。"],"rel":["古代|律令国家の成立","古代|荘園と武士の成長","文化|古代の文化（飛鳥〜国風）"],"bridge":"奈良時代は、律令国家が土地制度の行き詰まりと藤原氏・僧侶の政争で揺れた時代。次の平安初期で、桓武天皇が政治を立て直す。","sys":{"overview":"710年平城京遷都から770年光仁天皇即位まで。政権の変遷、土地政策、仏教政策、国史編纂を整理する。","tree":[{"h":"土地政策","items":["723年 三世一身法","743年 墾田永年私財法","初期荘園"]},{"h":"政権の変遷","items":["729年 長屋王の変","737年 藤原四子病死","橘諸兄・吉備真備・玄昉","740年 藤原広嗣の乱","764年 恵美押勝の乱","769年 宇佐神託事件"]},{"h":"仏教政策","items":["741年 国分寺・国分尼寺の詔","743年 大仏造立の詔","752年 大仏開眼","753年 鑑真来日"]},{"h":"書物","items":["712年 古事記","713年 風土記","720年 日本書紀"]}],"flow":{"title":"奈良時代の流れ","steps":["710年：平城京遷都","723年：三世一身法","729年：長屋王の変","740年：藤原広嗣の乱","743年：墾田永年私財法・大仏造立の詔","752年：大仏開眼","764年：恵美押勝の乱","769年：宇佐神託事件","770年：光仁天皇即位"]},"tables":[{"title":"三世一身法と墾田永年私財法","head":["","三世一身法","墾田永年私財法"],"rows":[["年","723","743"],["天皇","元正","聖武"],["私有","期限つき","永久"]]},{"title":"藤原四家","head":["家","祖","備考"],"rows":[["南家","武智麻呂",""],["北家","房前","のち摂関家"],["式家","宇合","広嗣の乱"],["京家","麻呂",""]]}]}},"古代|平安初期の政治":{"pts":["桓武天皇は784年に長岡京、794年に平安京へ遷都。勘解由使で国司を監督、健児を置き軍団を廃した。","蝦夷征討：坂上田村麻呂が征夷大将軍となり、802年胆沢城、803年志波城。阿弖流為が降伏。","805年の徳政相論で、藤原緒嗣の意見により軍事（蝦夷征討）と造作（平安京造営）を中止した。","最澄（天台宗・延暦寺）と空海（真言宗・金剛峯寺・東寺）がともに804年に入唐し、密教が広まった。","嵯峨天皇：810年薬子の変（平城太上天皇の変）、蔵人頭・検非違使を置き、弘仁格式を編ませた（のち貞観・延喜とあわせ三代格式）。","藤原氏の台頭：842年承和の変、866年応天門の変の後に良房が摂政、884年に基経が事実上の関白となり（887年に関白）、888年に阿衡の紛議。","宇多天皇は菅原道真を登用。894年遣唐使停止、901年昌泰の変で道真左遷、醍醐天皇の902年延喜の荘園整理令。"],"traps":["「784年に平安京」は×。784年は長岡京、794年が平安京。","「最澄は真言宗」は×。最澄は天台宗、真言宗は空海。","「薬子の変で敗れたのは嵯峨天皇」は×。敗れたのは平城太上天皇。","「徳政相論で継続を主張したのは緒嗣」は×。継続は菅野真道、中止が緒嗣。","「承和の変で伴善男」は×。伴善男は応天門の変（866年）。承和の変は伴健岑・橘逸勢。"],"rel":["古代|奈良時代の政治","古代|摂関政治と国風化","古代|荘園と武士の成長"],"bridge":"平安初期は天皇中心の政治再建の時代だが、藤原北家の他氏排斥が進み、次の摂関政治につながる。","sys":{"overview":"桓武天皇の改革から醍醐天皇の延喜の治まで。遷都、蝦夷政策、新仏教、藤原氏の台頭、遣唐使の停止を整理する。","tree":[{"h":"桓武天皇","items":["長岡京784・平安京794","勘解由使・健児","田村麻呂の蝦夷征討","805年 徳政相論"]},{"h":"嵯峨天皇","items":["810年 薬子の変","蔵人頭・検非違使","弘仁格式"]},{"h":"新仏教","items":["最澄：天台宗・比叡山","空海：真言宗・高野山・東寺","密教"]},{"h":"藤原氏の台頭","items":["842年 承和の変","866年 応天門の変・良房摂政","888年 阿衡の紛議","901年 昌泰の変","969年 安和の変（次の論点）"]}],"flow":{"title":"平安初期の流れ","steps":["784年：長岡京","794年：平安京","802年：胆沢城","805年：徳政相論","810年：薬子の変","842年：承和の変","866年：応天門の変","894年：遣唐使停止","901年：昌泰の変","902年：延喜の荘園整理令"]},"tables":[{"title":"最澄と空海","head":["","最澄","空海"],"rows":[["宗派","天台宗","真言宗"],["本拠","比叡山延暦寺","高野山金剛峯寺・東寺"]]},{"title":"藤原氏の他氏排斥","head":["事件","年","失脚した人"],"rows":[["承和の変","842","伴健岑・橘逸勢"],["応天門の変","866","伴善男"],["昌泰の変","901","菅原道真"],["安和の変","969","源高明"]]}]}},"古代|摂関政治と国風化":{"pts":["藤原北家は他氏排斥を進め、969年安和の変後は摂政・関白がほぼ常置され摂関政治が確立した。道長は内覧・摂政となったが関白にはならなかった。","摂政は幼少の天皇を補佐、関白は成人の天皇を補佐。道長は娘3人を后とし1016年に摂政。頼通は約50年間摂関。","地方では受領が徴税を請け負い、遥任・成功がみられた。988年尾張国郡司百姓等解。田堵が名の耕作を請け負った。","国風文化は仮名文字の発達が特徴。『古今和歌集』『土佐日記』『源氏物語』『枕草子』『蜻蛉日記』などの文学。","浄土教（空也・源信『往生要集』）と末法思想（1052年）。平等院鳳凰堂（頼通、定朝の寄木造）。","貴族の住宅は寝殿造、絵画は大和絵、書は三蹟（小野道風・藤原佐理・藤原行成）。神仏習合・本地垂迹説。","対外関係：894年遣唐使停止後、中国は宋（960年）、渤海は926年に契丹に滅び、朝鮮は高麗。1019年刀伊の入寇。"],"traps":["「摂政は成人の天皇を補佐」は×。成人を補佐するのは関白。","「平等院鳳凰堂は道長」は×。頼通。道長は法成寺。","「源氏物語は清少納言」は×。紫式部。清少納言は枕草子。","「往生要集は空也」は×。源信。","「刀伊の入寇は高麗軍」は×。女真族とみられる刀伊で、藤原隆家らが撃退。"],"rel":["古代|平安初期の政治","古代|荘園と武士の成長","文化|古代の文化（飛鳥〜国風）"],"bridge":"摂関政治のもとで荘園が拡大し、地方では武士が成長して、院政・平氏政権へとつながる。","sys":{"overview":"10〜11世紀の貴族政治と国風文化。摂関政治の仕組み、地方支配の変化、文学・浄土教・美術、対外関係を整理する。","tree":[{"h":"摂関政治","items":["969年 安和の変","道長：外戚・1016年摂政","頼通：平等院","日記『御堂関白記』『小右記』"]},{"h":"地方支配","items":["受領・遥任・成功","田堵・名","尾張国郡司百姓等解988"]},{"h":"国風文化","items":["仮名文字","古今和歌集・土佐日記・源氏物語・枕草子","浄土教・末法思想","寝殿造・大和絵・三蹟"]},{"h":"対外関係","items":["894年 遣唐使停止","907年 唐滅亡・960年 宋成立","926年 渤海滅亡","1019年 刀伊の入寇"]}],"flow":{"title":"摂関政治の確立と国風化","steps":["866年：良房が摂政","884年：基経が事実上の関白（887年に正式）","894年：遣唐使停止","905年：古今和歌集","969年：安和の変","1016年：道長が摂政","1019年：刀伊の入寇","1053年：平等院鳳凰堂"]},"tables":[{"title":"国風文化の作品","head":["作品","作者","ジャンル"],"rows":[["古今和歌集","紀貫之ら","勅撰和歌集"],["土佐日記","紀貫之","日記"],["源氏物語","紫式部","物語"],["枕草子","清少納言","随筆"],["蜻蛉日記","藤原道綱母","日記"]]}]}},"古代|荘園と武士の成長":{"pts":["有力者が開発した土地を貴族・寺社に寄進して寄進地系荘園が成立。領家・本家と現地の荘官（下司）。","不輸の権（租税免除）・不入の権（国司らの立入り拒否）。官省符荘・国免荘。荘園と公領が並ぶ荘園公領制。","延喜（902年）・寛徳（1045年）・延久（1069年、後三条、記録荘園券契所）の荘園整理令。","939年承平・天慶の乱：平将門（関東、新皇）と藤原純友（瀬戸内）。平貞盛・藤原秀郷らが将門を討った。","武士団は家子・郎党を従え、棟梁には源氏・平氏。内裏の警備に滝口の武者。押領使・追捕使も置かれた。","1028年平忠常の乱を源頼信が鎮圧。前九年合戦（1051〜62、源頼義・義家と安倍氏、清原氏の助け）。","後三年合戦（1083〜87、清原氏の内紛に源義家が介入）の後、藤原清衡が奥羽を支配し、奥州藤原氏が平泉に拠った。"],"traps":["「不入の権は租税免除」は×。租税免除は不輸の権。","「純友が関東で新皇」は×。新皇は平将門、純友は瀬戸内。","「後三年合戦後の奥羽は安倍氏」は×。藤原清衡。安倍氏は前九年合戦で滅亡。","「記録荘園券契所は白河天皇」は×。後三条天皇。","「滝口の武者は院の警護」は×。内裏の警備。院の警護は北面の武士。"],"rel":["古代|摂関政治と国風化","中世|院政と平氏政権","古代|平安初期の政治"],"bridge":"荘園の拡大と武士団の成長は、次の院政・平氏政権、さらに鎌倉幕府の成立の土台となる。","sys":{"overview":"10〜11世紀の土地制度の変化と武士の台頭。寄進地系荘園、荘園整理令、地方の反乱、東北の戦いを整理する。","tree":[{"h":"荘園","items":["寄進地系荘園","領家・本家・荘官","不輸・不入の権","荘園整理令（902・1045・1069）"]},{"h":"武士団","items":["家子・郎党","源氏・平氏","滝口の武者","押領使・追捕使"]},{"h":"反乱","items":["939年 平将門の乱","939年 藤原純友の乱","1028年 平忠常の乱"]},{"h":"東北","items":["前九年合戦（1051〜62）","後三年合戦（1083〜87）","奥州藤原氏・平泉"]}],"flow":{"title":"武士の成長","steps":["902年：延喜の荘園整理令","939年：承平・天慶の乱","988年：尾張国郡司百姓等解","1028年：平忠常の乱","1051年：前九年合戦","1069年：延久の荘園整理令","1083年：後三年合戦"]},"tables":[{"title":"不輸の権と不入の権","head":["","内容"],"rows":[["不輸の権","租税を免除される"],["不入の権","国司・検田使らの立入りを拒否"]]},{"title":"東北の戦い","head":["戦い","年","中心人物"],"rows":[["前九年合戦","1051〜62","源頼義・義家、安倍氏、清原氏"],["後三年合戦","1083〜87","源義家、清原氏、藤原清衡"]]}]}},"中世|院政と平氏政権":{"pts":["後三条天皇は摂関家を外戚とせず親政を行い、1069年の延久の荘園整理令で記録荘園券契所を置き、証拠のない荘園を整理した。","白河天皇は1086年に堀河天皇へ譲位して院政を始めた。院庁から出す院宣・院庁下文が国政を動かし、鳥羽・後白河と続いた。","院の側近（院の近臣）には受領層が多く、知行国の制度や荘園の寄進によって院と近臣は経済力を強めた。","院の警護には北面の武士が置かれ、平正盛・忠盛らが院に近づいて中央に進出した。延暦寺（日吉神社の神輿）・興福寺（春日神社の神木）の僧兵は強訴で院に要求した。","1156年の保元の乱は崇徳上皇と後白河天皇の対立に摂関家の内紛が結びついて起こり、清盛・義朝のついた後白河方が勝った。","1159年の平治の乱で平清盛が源義朝・藤原信頼を破り、1167年に武士で初めて太政大臣となった。一族も高位高官を占めた。","平氏は多くの知行国と荘園を基盤に、大輪田泊を修築して日宋貿易を進め、厳島神社を崇拝した。娘徳子は高倉天皇に入内し、孫の安徳天皇が即位した。","1177年の鹿ヶ谷の陰謀、1179年の後白河幽閉（治承三年の政変）で反発が高まり、以仁王の令旨を受けて挙兵が相次ぎ、1185年に壇ノ浦で滅んだ。"],"traps":["院政を始めたのは白河天皇（1086年）。後三条天皇は親政で、院政ではない。","保元の乱では清盛・義朝は同じ後白河方。平治の乱で義朝が敗れ、頼朝は伊豆に流された。","後白河幽閉は治承三年の政変（1179年）、平氏打倒の謀議の発覚は鹿ヶ谷の陰謀（1177年）。","平氏滅亡の地は壇ノ浦（1185年）。一ノ谷（1184年）と混同しない。","院の武士は北面の武士。僧兵の「山法師」は延暦寺、「奈良法師」は興福寺。","八条院領は鳥羽上皇が皇女に伝えた荘園群、長講堂領は後白河法皇の荘園群。"],"rel":["古代|荘園と武士の成長","中世|鎌倉幕府の成立と執権政治","文化|中世の文化（院政期〜東山）"],"bridge":"荘園整理と院政は、摂関政治から武家政権への移り変わりの入口。平氏政権は公家的な性格を残していたため、次の鎌倉幕府成立への流れでその限界が問われる。","sys":{"overview":"摂関政治の後に、上皇が実権を握る院政が行われた。院政期には武士が政争の決着をつけ、平清盛が武家として初めて政権を握った。本論点は後三条から平氏滅亡までを扱う。","tree":[{"h":"後三条天皇","items":["摂関家を外戚としない天皇","延久の荘園整理令（1069）","記録荘園券契所を設置","荘園公領制への土台"]},{"h":"院政","items":["白河（1086）→鳥羽→後白河","院庁下文・院宣が命令書","北面の武士が院を警護","院の近臣は受領層","知行国・院分国で収益を得る","六勝寺（法勝寺など）を白河の地に造営"]},{"h":"保元・平治","items":["保元（1156）：後白河方が勝利","平治（1159）：清盛が義朝を破る","頼朝は伊豆に流刑","清盛の台頭"]},{"h":"平氏政権","items":["清盛が太政大臣（1167）","外戚（徳子→高倉→安徳）","知行国・荘園が基盤","大輪田泊・日宋貿易","厳島神社を崇拝"]},{"h":"平氏の滅亡","items":["鹿ヶ谷の陰謀（1177）","治承三年の政変（1179）","福原遷都（1180）","以仁王の令旨・源氏の挙兵","壇ノ浦で滅亡（1185）"]}],"flow":{"title":"後三条天皇から平氏滅亡まで","steps":["1069 延久の荘園整理令","1086 白河院政の開始","1156 保元の乱","1159 平治の乱","1167 清盛が太政大臣","1179 治承三年の政変","1180 福原遷都・以仁王の令旨","1185 壇ノ浦で平氏滅亡"]},"tables":[{"title":"保元の乱と平治の乱","head":["","保元の乱","平治の乱"],"rows":[["年","1156","1159"],["対立","崇徳上皇・頼長 対 後白河天皇・忠通","信西・清盛 対 信頼・義朝"],["勝者","後白河方（清盛・義朝）","平清盛"],["結果","為義・忠正らが処刑","義朝敗死、頼朝は伊豆へ"]]},{"title":"配流先の混同","head":["人物","配流先"],"rows":[["崇徳上皇（保元）","讃岐"],["後鳥羽上皇（承久）","隠岐"],["順徳上皇（承久）","佐渡"],["後醍醐天皇（元弘）","隠岐"]]}]}},"中世|鎌倉幕府の成立と執権政治":{"pts":["1180年に侍所（別当和田義盛）、1184年に公文所（のち政所、別当大江広元）と問注所（三善康信）を置き、1185年に守護・地頭の設置を認められた。","1192年に頼朝が征夷大将軍となった。主従関係は御恩（本領安堵・新恩給与）と奉公（軍役・京都大番役など）で結ばれた。","守護は国ごとに置かれ、大犯三カ条（京都大番役の催促、謀叛人・殺害人の逮捕）を職務とした。地頭は荘園・公領ごとに置かれ、年貢の徴収・土地管理にあたった。","頼朝の死後、梶原景時・比企能員・和田義盛らが次々と滅び、北条時政・義時が政所別当・侍所別当を兼ねて執権の地位を固めた。","1219年に実朝が暗殺され、源氏将軍が絶えた。1221年の承久の乱では後鳥羽上皇が敗れ、仲恭天皇が廃された。六波羅探題が置かれ、没収地には新補地頭が置かれた（新補率法、1223年）。","3代執権泰時は連署（時房）・評定衆を置き、1232年に御成敗式目（51カ条）を定めた。武家社会の道理と先例にもとづく武士の法である。","5代執権時頼は1247年の宝治合戦で三浦氏を滅ぼし、引付衆を置いた。摂家将軍に続き皇族将軍（宗尊親王、1252年）を迎えた。"],"traps":["政所の初代別当は大江広元、侍所の初代別当は和田義盛、問注所は三善康信。","守護は国単位、地頭は荘園・公領単位。大犯三カ条に年貢徴収は含まれない。","後鳥羽上皇は隠岐、順徳上皇は佐渡、土御門上皇は土佐。","御成敗式目は泰時（1232年）、引付は時頼（1249年）。評定衆は泰時（1225年）。","宝治合戦で滅んだのは三浦氏、和田合戦で滅んだのは和田氏。","御恩は将軍から、奉公は御家人から。"],"rel":["中世|院政と平氏政権","中世|蒙古襲来と鎌倉後期","文化|中世の文化（院政期〜東山）"],"bridge":"頼朝の幕府は御家人との主従関係の上に成り立ち、承久の乱を経て執権政治が確立した。この安定が、蒙古襲来による御家人の窮乏で揺らぐ。","sys":{"overview":"頼朝が1180年代に侍所・公文所・問注所と守護・地頭を整えて幕府を築き、頼朝の死後は北条氏が執権として幕府を動かした。承久の乱で幕府の優位が確立し、泰時・時頼の時期に執権政治が完成した。","tree":[{"h":"幕府の機関","items":["侍所：和田義盛","公文所（のち政所）：大江広元","問注所：三善康信","守護（国ごと）・地頭（荘園・公領ごと）","京都守護（のち六波羅探題）"]},{"h":"主従関係","items":["御恩：本領安堵・新恩給与","奉公：軍役・京都大番役・鎌倉番役","大犯三カ条は守護の職務","地頭は年貢の徴収・土地管理"]},{"h":"北条氏の台頭","items":["十三人の合議制（1199）","比企能員の変（1203）","時政が初代執権","和田合戦（1213）で義時が侍所別当を兼務","実朝暗殺（1219）"]},{"h":"承久の乱","items":["後鳥羽上皇が義時追討を命令（1221）","北条政子の訴えで御家人が結集","六波羅探題の設置","新補地頭の設置","後鳥羽は隠岐、順徳は佐渡"]},{"h":"執権政治の確立","items":["連署・評定衆（1225）","御成敗式目（1232）","宝治合戦（1247）","引付衆（1249）","皇族将軍（1252）"]}],"flow":{"title":"幕府の成立から執権政治の確立まで","steps":["1185 守護・地頭の設置","1192 頼朝が征夷大将軍","1203 時政が初代執権","1213 和田合戦","1221 承久の乱","1225 連署・評定衆","1232 御成敗式目","1247 宝治合戦","1249 引付衆"]},"tables":[{"title":"幕府の主な機関","head":["機関","長官","役割"],"rows":[["侍所","和田義盛","御家人の統率・軍事"],["政所（公文所）","大江広元","一般政務・財政"],["問注所","三善康信","裁判事務"],["六波羅探題","北条氏一族","京都の監視・西国の統轄"]]},{"title":"守護と地頭","head":["","守護","地頭"],"rows":[["置かれる単位","国","荘園・公領"],["任務","大犯三カ条","年貢の徴収・土地管理・治安"]]}]}},"中世|蒙古襲来と鎌倉後期":{"pts":["フビライ・ハンは日本に朝貢を求め、執権北条時宗が拒否した。元は1274年（文永の役）、1281年（弘安の役）と2度襲来した。","文永の役では元軍の集団戦法とてつはうに苦しめられ、弘安の役では東路軍・江南軍が来襲したが、石塁（元寇防塁）と暴風雨で撤退した。","幕府は九州の御家人に異国警固番役を課し、元寇後は博多に鎮西探題（1293年）を置いた。","防衛戦のため十分な恩賞が与えられず、分割相続による所領の細分化や貨幣経済の進展もあり、御家人は窮乏した。","1297年に北条貞時が永仁の徳政令を出し、御家人が売却・質入れした所領を無償で取り戻させ、以後の売買・質入れを禁じたが、効果は一時的で翌年に一部が撤回された。","得宗の権力が強まり、内管領平頼綱が安達泰盛を滅ぼした（霜月騒動、1285年）。貞時は1293年に平頼綱を討った（平禅門の乱）。","悪党が荘園領主・幕府に抵抗し、皇室は持明院統と大覚寺統に分かれ、文保の和談（1317年）で両統迭立の方針が示された。後醍醐天皇は1324年の正中の変、1331年の元弘の変で幕府打倒を図り、1333年に幕府は滅びた。"],"traps":["文永の役は1274年、弘安の役は1281年。","元寇のときの執権は時宗、永仁の徳政令は貞時。","石塁は文永の役の後（1276年〜）に築かれた。","鎮西探題は元寇後、六波羅探題は承久の乱後。","霜月騒動で滅んだのは安達泰盛。三浦泰村は宝治合戦。","鎌倉を攻めたのは新田義貞、六波羅を攻めたのは足利高氏（尊氏）。"],"rel":["中世|鎌倉幕府の成立と執権政治","中世|建武の新政と南北朝","文化|中世の文化（院政期〜東山）"],"bridge":"元寇は幕府の防衛戦で恩賞が出せず、御家人の不満と窮乏を招いた。幕府の求心力の低下が、後醍醐天皇の討幕と建武の新政につながる。","sys":{"overview":"元の2度の襲来を退けたものの、恩賞不足と所領の細分化で御家人が窮乏し、幕府の支配が揺らいだ。得宗専制と悪党の活動、皇統の分裂を背景に、後醍醐天皇の討幕で鎌倉幕府は滅んだ。","tree":[{"h":"元寇","items":["北条時宗が朝貢要求を拒否","文永の役（1274）","弘安の役（1281）","異国警固番役・石塁","鎮西探題（1293）"]},{"h":"御家人の窮乏","items":["分割相続による所領の細分化","恩賞の不足","借上からの借金","永仁の徳政令（1297）","単独相続への移行"]},{"h":"得宗専制","items":["内管領＝得宗の家臣（御内人）の代表","霜月騒動（1285）","平禅門の乱（1293）","北条貞時が得宗","悪党の活動"]},{"h":"倒幕","items":["持明院統と大覚寺統（両統迭立）","正中の変（1324）","元弘の変（1331）","新田義貞が鎌倉を攻略","足利高氏が六波羅探題を攻略（1333）"]}],"flow":{"title":"元寇から鎌倉幕府の滅亡まで","steps":["1274 文永の役","1281 弘安の役","1285 霜月騒動","1293 平禅門の乱・鎮西探題","1297 永仁の徳政令","1317 文保の和談","1324 正中の変","1331 元弘の変","1333 鎌倉幕府の滅亡"]},"tables":[{"title":"文永の役と弘安の役","head":["","文永の役","弘安の役"],"rows":[["年","1274","1281"],["執権","北条時宗","北条時宗"],["元軍","元・高麗軍","東路軍（元・高麗）と江南軍（旧南宋）"],["結果","集団戦法に苦戦、撤退","暴風雨などで大打撃、撤退"]]},{"title":"鎌倉後期の事件","head":["事件","年","中心人物"],"rows":[["霜月騒動","1285","平頼綱が安達泰盛を滅ぼす"],["平禅門の乱","1293","北条貞時が平頼綱を討つ"],["永仁の徳政令","1297","北条貞時"]]}]}},"中世|建武の新政と南北朝":{"pts":["1333年、鎌倉幕府を倒した後醍醐天皇は、院政・摂関・幕府を否定する天皇親政の建武の新政を始めた。","中央に記録所・雑訴決断所・恩賞方・武者所を置き、地方に陸奥将軍府（北畠顕家）・鎌倉将軍府（足利直義）を置いた。恩賞は不公平で、公家優遇のため武士の不満が高まった。","『二条河原落書』は新政の混乱を風刺した。1335年の中先代の乱を鎮圧した足利尊氏は、鎌倉で新政に背いた。","1336年に湊川の戦いで楠木正成が敗死し、尊氏は光明天皇を立て、建武式目で政治方針を示した。後醍醐は吉野に逃れ、南北朝時代となった。","1338年に尊氏が征夷大将軍となった。1350年に観応の擾乱（高師直と足利直義の対立）が起こり、動乱が長期化した。","守護の権限は刈田狼藉の取締り・使節遵行に広がり、1352年に観応の半済令（近江・美濃・尾張、1年限り、年貢の半分）、1368年に応安の半済令（土地そのものを折半）が出された。守護請も広まった。","1392年、3代将軍足利義満が南北朝を合体させた（南朝の後亀山天皇が後小松天皇に神器を渡す）。南朝の正統を説く『神皇正統記』（北畠親房）、足利方の歴史書『梅松論』、軍記物語の『太平記』が成立した。"],"traps":["建武式目は尊氏が定めた施政方針（1336年）。後醍醐の政策ではない。","土地に関する訴訟は雑訴決断所、京都の警備は武者所。","湊川で討死したのは楠木正成、新田義貞は藤島で戦死。","北朝は持明院統（光明）、南朝は大覚寺統（後醍醐）。","半済令の相手は守護（地頭ではない）。観応は年貢の半分、応安は土地の折半。","南北朝合体は義満（1392年）、尊氏の将軍就任は1338年。"],"rel":["中世|蒙古襲来と鎌倉後期","中世|室町幕府と守護大名","文化|中世の文化（院政期〜東山）"],"bridge":"建武の新政の失敗から室町幕府が成立し、南北朝の内乱で守護の力が増した。守護が領国を支配する守護大名への成長が、次の室町幕府の体制を形づくる。","sys":{"overview":"後醍醐天皇の新政は短期間で崩れ、尊氏が京都に幕府を開いた。吉野の南朝と京都の北朝が対立する動乱の中で、守護が大きな権限を持つようになり、義満が1392年に南北朝を合体させた。","tree":[{"h":"建武の新政","items":["天皇親政（1333〜）","記録所・雑訴決断所・恩賞方・武者所","陸奥将軍府・鎌倉将軍府","二条河原落書","武士の不満"]},{"h":"新政の崩壊","items":["中先代の乱（1335）","尊氏の離反","湊川の戦い（1336）","建武式目（1336）","光明天皇を擁立"]},{"h":"南北朝の動乱","items":["吉野の南朝・京都の北朝","尊氏が将軍（1338）","観応の擾乱（1350）","半済令（1352）","懐良親王が九州で活動"]},{"h":"合体","items":["義満（1392）","後亀山から後小松へ神器","両統迭立は実現せず"]}],"flow":{"title":"建武の新政から南北朝合体まで","steps":["1333 建武の新政","1335 中先代の乱","1336 湊川の戦い・建武式目","1338 尊氏が征夷大将軍","1350 観応の擾乱","1352 観応の半済令","1368 応安の半済令","1392 南北朝の合体"]},"tables":[{"title":"建武政権の機関","head":["機関","役割"],"rows":[["記録所","政務"],["雑訴決断所","所領訴訟"],["恩賞方","恩賞"],["武者所","京都の警備"],["陸奥将軍府","東北統治（北畠顕家）"],["鎌倉将軍府","関東統治（足利直義）"]]},{"title":"南朝と北朝","head":["","南朝","北朝"],"rows":[["所在地","吉野","京都"],["皇統","大覚寺統（後醍醐）","持明院統（光明）"],["支える人物","北畠親房・楠木氏","足利尊氏"]]}]}},"中世|室町幕府と守護大名":{"pts":["足利義満は1378年に室町に花の御所を営み、1392年に南北朝を合体させ、1394年に太政大臣となった。","中央は将軍のもと、管領（三管領：細川・斯波・畠山）が補佐し、侍所の長官は所司（四職：赤松・一色・山名・京極）。","地方は関東に鎌倉府（長官は鎌倉公方、補佐は関東管領の上杉氏）を置き、関東8カ国と伊豆・甲斐を管轄させた（1392年に陸奥・出羽も加わる）。九州には九州探題、東北には奥州探題・羽州探題を置いた。","義満は有力守護の抑圧を進め、土岐康行の乱（1390）、明徳の乱（1391、山名氏清）、応永の乱（1399、大内義弘）を鎮めた。","鎌倉府では上杉禅秀の乱（1416）、永享の乱（1438、足利持氏の滅亡）、結城合戦（1440）が起こり、のち古河公方・堀越公方に分かれた。","6代将軍義教は1441年の嘉吉の変で赤松満祐に暗殺され、将軍の権威が揺らいだ。","幕府は御料所・土倉役・酒屋役・段銭・棟別銭・関銭・津料などを財源とした。守護は半済令や守護請を通じて国人を被官にし、守護大名に成長した。"],"traps":["管領は三管領、所司は四職。山名・赤松は四職。","関東管領は上杉氏。足利氏の鎌倉公方の補佐役。","明徳の乱は山名氏清（1391）、応永の乱は大内義弘（1399）。","嘉吉の変で義教を殺したのは赤松満祐（山名持豊ではない）。","永享の乱（1438）は上杉禅秀の乱（1416）より後。","侍所の長官は所司で、管領ではない。"],"rel":["中世|建武の新政と南北朝","中世|室町の外交と経済・惣村","中世|応仁の乱と戦国大名"],"bridge":"義満期に守護大名を抑えて将軍権力が高まったが、義教の暗殺で権威が揺らいだ。守護大名の対立と将軍の後継争いが重なり、応仁の乱に至る。","sys":{"overview":"室町幕府は将軍・管領・有力守護の合議で運営され、守護大名が領国を支配する体制だった。義満が強大な守護を討って将軍権力を高めたが、義教の暗殺で動揺した。","tree":[{"h":"幕府の組織","items":["将軍","管領：細川・斯波・畠山","侍所所司：赤松・一色・山名・京極","鎌倉府（鎌倉公方・関東管領上杉氏、関東8カ国＋伊豆・甲斐）","奥州探題・羽州探題・九州探題"]},{"h":"義満の政策","items":["花の御所（1378）","土岐康行の乱（1390）","明徳の乱（1391）","南北朝合体（1392）","太政大臣（1394）","応永の乱（1399）"]},{"h":"鎌倉府の混乱","items":["上杉禅秀の乱（1416）","永享の乱（1438）","結城合戦（1440）","のち古河公方と堀越公方"]},{"h":"義教と嘉吉の変","items":["義教は専制的政治","嘉吉の変（1441）","赤松満祐が暗殺","嘉吉の徳政一揆"]},{"h":"財政","items":["御料所","土倉役・酒屋役","段銭・棟別銭","関銭・津料"]}],"flow":{"title":"義満から嘉吉の変まで","steps":["1378 花の御所","1391 明徳の乱","1392 南北朝合体","1394 義満が太政大臣","1399 応永の乱","1416 上杉禅秀の乱","1438 永享の乱","1441 嘉吉の変"]},"tables":[{"title":"三管領と四職","head":["","構成","役割"],"rows":[["三管領","細川・斯波・畠山","将軍補佐（管領）"],["四職","赤松・一色・山名・京極","侍所の長官（所司）"]]},{"title":"義満期の乱","head":["乱","年","滅ぼされた人物"],"rows":[["土岐康行の乱","1390","土岐康行"],["明徳の乱","1391","山名氏清"],["応永の乱","1399","大内義弘"]]}]}},"中世|室町の外交と経済・惣村":{"pts":["足利義満は1401年に使節を派遣し、明の皇帝から日本国王に封じられ、1404年から勘合を使う日明貿易（朝貢形式）を始めた。","義持は1411年に貿易を中止し、義教が1432年に再開した。のち大内氏と細川氏が争い、寧波の乱（1523）に勝った大内氏が独占した。","輸入は銅銭・生糸・絹織物・書籍、輸出は銅・硫黄・刀剣・扇など。14〜15世紀の前期倭寇は日本人中心、16世紀の後期倭寇は中国人中心。","朝鮮とは対馬の宗氏が窓口となり、応永の外寇（1419）、三浦の乱（1510）を経て貿易は縮小した。琉球は1429年に尚巴志が統一し、那覇を拠点に中継貿易で栄えた。","蝦夷ヶ島では和人とアイヌの交易が行われ、1457年のコシャマインの戦いを蠣崎氏が鎮圧した。津軽の十三湊は安藤氏の拠点。","惣村は寄合で惣掟を定め、宮座を中心に結束し、地下請・地下検断を行った。団結して土一揆（正長の徳政一揆〈1428〉、嘉吉の徳政一揆〈1441〉）を起こした。","定期市は三斎市から六斎市へ。座、馬借・車借、土倉・酒屋、撰銭令、京都の町衆、堺・博多の自治（会合衆・年行司）などが重要。"],"traps":["日明貿易は朝貢形式。貿易は義満が開始、義持が中止、義教が再開。","寧波の乱で勝ったのは大内氏、堺商人は細川氏、博多商人は大内氏と結ぶ。","三浦は富山浦・乃而浦・塩浦。三浦の乱後は貿易が衰退。","土倉は質屋・金融、酒屋は酒造。ともに高利貸しも行う。","六斎市は月6回、三斎市は月3回。","地下請は惣村が年貢納入を請け負うこと、守護請は守護が請け負うこと。"],"rel":["中世|室町幕府と守護大名","中世|応仁の乱と戦国大名","文化|中世の文化（院政期〜東山）"],"bridge":"貨幣経済の発達と惣村の成長は、土一揆や守護大名の台頭につながり、応仁の乱後の下剋上の社会を準備する。","sys":{"overview":"室町時代は明・朝鮮・琉球との交流が盛んになり、貨幣経済が広まって市場・座・運送業が発達した。農村では惣村が自治を行い、土一揆を起こして幕府や荘園領主に対抗した。","tree":[{"h":"日明貿易","items":["義満が開始（1404）","朝貢形式・勘合","義持が中止（1411）","義教が再開（1432）","寧波の乱（1523）"]},{"h":"朝鮮・琉球・蝦夷","items":["宗氏が日朝貿易の窓口","応永の外寇（1419）・三浦の乱（1510）","琉球王国（1429）・那覇","十三湊（安藤氏）","コシャマインの戦い（1457）"]},{"h":"惣村","items":["寄合・惣掟","宮座","地下請・地下検断","入会地","土一揆"]},{"h":"商工業","items":["三斎市から六斎市","座","馬借・車借","土倉・酒屋","撰銭令","堺・博多の自治"]}],"flow":{"title":"日明貿易の展開","steps":["1401 義満が明に使節","1404 勘合貿易の開始","1411 義持が中止","1432 義教が再開","1523 寧波の乱","16世紀半ば 大内氏滅亡で衰退"]},"tables":[{"title":"日明貿易の輸出入","head":["","品目"],"rows":[["輸入","銅銭・生糸・絹織物・書籍"],["輸出","銅・硫黄・刀剣・扇"]]},{"title":"一揆・自治の用語","head":["用語","内容"],"rows":[["惣掟","惣村の自治の掟"],["地下請（百姓請）","惣村が年貢納入を請け負う"],["地下検断（自検断）","惣村が犯罪を取り締まる"],["宮座","祭礼を担う農民の組織"]]}]}},"中世|応仁の乱と戦国大名":{"pts":["応仁の乱（1467〜77）は8代将軍足利義政の後継争い（義視と義尚）と、畠山・斯波両氏の家督争いに、細川勝元（東軍）と山名持豊（西軍）の対立が加わって起こった。","戦場は京都で、足軽が活躍し、京都は荒廃した。荘園制はさらに崩れ、下剋上の風潮が広がった。細川氏の実権はのち家臣の三好長慶、さらに松永久秀へ移った。","1485年の山城の国一揆、1488年の加賀の一向一揆（富樫政親を倒す）で、国人や農民が自治を行った。","1493年の明応の政変で細川政元が将軍義材を廃し、将軍の権威は衰えた。関東では享徳の乱（1454）で古河公方・堀越公方が並立した。","北条早雲（伊勢宗瑞）が堀越公方を滅ぼして伊豆を奪い、小田原に進出した。斎藤道三・上杉謙信・武田信玄・毛利元就らが各地で台頭した。","戦国大名は分国法（今川仮名目録、朝倉孝景条々、甲州法度之次第、塵芥集など）を定め、喧嘩両成敗・指出検地・貫高制・寄親寄子制で領国を一元支配した。","城下町（一乗谷・小田原など）に家臣を集住させ、鉱山開発や楽市で領国経済を整えた。寺内町・天文法華の乱（1536）も戦国期の動きである。"],"traps":["東軍の大将は細川勝元、西軍の大将は山名持豊（宗全）。","日野富子は子の義尚を推した（義視ではない）。","明応の政変（1493年）は細川政元、応仁の乱の東軍は細川勝元。","山城の国一揆で追放されたのは畠山軍。加賀の一向一揆は浄土真宗。","今川仮名目録は今川氏親、塵芥集は伊達稙宗、甲州法度之次第は武田信玄。","指出検地は自己申告。石高ではなく貫高で表した。"],"rel":["中世|室町幕府と守護大名","中世|室町の外交と経済・惣村","近世|織豊政権"],"bridge":"応仁の乱以後、守護大名に代わって戦国大名が領国を支配する戦国時代となった。この分裂状態を終わらせるのが織豊政権の全国統一である。","sys":{"overview":"応仁の乱で幕府の権威が失われ、守護大名の領国は守護代・国人に奪われた。戦国大名が分国法・検地・城下町などで一円支配を進め、各地で一向一揆なども起こった。","tree":[{"h":"応仁の乱","items":["義政の後継争い（義視・義尚）","畠山・斯波の家督争い","東軍：細川勝元","西軍：山名持豊（宗全）","1467〜77、足軽の活躍"]},{"h":"一揆と自治","items":["山城の国一揆（1485）","加賀の一向一揆（1488）","蓮如の布教","法華一揆（1536）","寺内町"]},{"h":"将軍権威の低下","items":["明応の政変（1493）","細川政元が義材を廃す","享徳の乱（1454）","古河公方・堀越公方"]},{"h":"戦国大名","items":["北条早雲（伊勢宗瑞）","分国法","指出検地・貫高制","寄親・寄子","城下町・楽市"]}],"flow":{"title":"応仁の乱から戦国大名の台頭まで","steps":["1454 享徳の乱","1467 応仁の乱","1477 応仁の乱の終結","1485 山城の国一揆","1488 加賀の一向一揆","1493 明応の政変","16世紀 北条早雲らの台頭","1536 天文法華の乱"]},"tables":[{"title":"主な分国法","head":["分国法","制定者","領国"],"rows":[["今川仮名目録","今川氏親","駿河・遠江"],["朝倉孝景条々","朝倉孝景","越前"],["甲州法度之次第","武田信玄","甲斐"],["塵芥集","伊達稙宗","陸奥"]]},{"title":"応仁の乱の対立","head":["","東軍","西軍"],"rows":[["大将","細川勝元","山名持豊（宗全）"],["将軍家","義政・日野富子・義尚の側","義視（1468年に西軍へ移る）"]]}]}},"近世|織豊政権":{"pts":["信長は桶狭間の戦い（1560）で今川義元を破り、足利義昭を奉じて上洛（1568）。義昭を追放（1573）して室町幕府を事実上滅ぼした。","信長は長篠合戦（1575）で鉄砲を活用し武田勝頼を破り、安土城を拠点に楽市令・関所廃止で商工業を保護した。","信長は比叡山焼き打ち（1571）や石山本願寺との戦いで宗教勢力を抑え、堺を直轄地とした。本能寺の変（1582）で明智光秀に討たれた。","秀吉は山崎の戦い（1582）で光秀、賤ヶ岳の戦い（1583）で柴田勝家を破り、大坂城を本拠とした。関白（1585）・太政大臣（1586）となり豊臣姓を賜る。","秀吉は四国（1585）・九州（1587）・小田原（1590）を平定し天下を統一。バテレン追放令（1587）、海賊取締令・刀狩令（1588）を出した。","太閤検地は石高で土地を表示し、1反＝300歩、京枡に統一。一地一作人の原則で荘園制を否定し、検地帳に耕作者（名請人）を登録した。","人掃令（1591）などで兵農分離・身分の固定が進んだ。朝鮮出兵は文禄の役（1592）と慶長の役（1597）で、秀吉の死（1598）で撤退。"],"traps":["「信長が高野山を焼き打ちした」は×。焼き打ちしたのは比叡山延暦寺。","「バテレン追放令は信長が出した」は×。信長は宣教師を保護し、追放令は秀吉（1587）。","「太閤検地は貫高で表示」は×。石高で統一した。貫高は戦国大名の表示法。","「文禄の役は1597年」は×。文禄1592、慶長1597。","「山崎の戦いで柴田勝家を破った」は×。山崎は明智光秀、賤ヶ岳が柴田勝家。"],"rel":["中世|応仁の乱と戦国大名","近世|江戸幕府の成立と幕藩体制","文化|近世の文化（桃山〜化政）"],"bridge":"織豊政権は戦国の分裂を収め、石高制と兵農分離で近世社会の土台をつくった。次の江戸幕府は、この土台の上に大名統制の仕組みを整える。","sys":{"overview":"信長が旧勢力を倒し統一の基礎を築き、秀吉が検地・刀狩で社会を仕組みから変えて天下を統一した。人物と戦いの対応、秀吉政策の年代が頻出。","tree":[{"h":"信長の事績","items":["桶狭間（1560）今川義元","上洛（1568）→義昭追放（1573）","姉川（1570）朝倉・浅井","長篠（1575）武田勝頼","安土城・楽市令・関所廃止","本能寺の変（1582）"]},{"h":"秀吉の統一","items":["山崎（1582）光秀","賤ヶ岳（1583）柴田勝家","四国（1585）・九州（1587）・小田原（1590）","関白（1585）・太政大臣（1586）","五大老・五奉行"]},{"h":"秀吉の政策","items":["太閤検地：石高・一地一作人","刀狩令（1588）・海賊取締令（1588）","バテレン追放令（1587）","人掃令（1591）"]},{"h":"対外","items":["朝鮮出兵：文禄の役（1592）","慶長の役（1597）","拠点は肥前名護屋城"]}],"flow":{"title":"信長から秀吉の統一まで","steps":["桶狭間の戦い（1560）","足利義昭を奉じて上洛（1568）","室町幕府滅亡（1573）","長篠合戦（1575）","本能寺の変（1582）","山崎の戦い・太閤検地開始（1582）","関白就任（1585）","小田原攻めで統一（1590）"]},"tables":[{"title":"信長と秀吉の政策","head":["項目","信長","秀吉"],"rows":[["商業","楽市令・関所廃止","都市の直轄・貨幣鋳造"],["宗教","延暦寺焼き打ち・宣教師保護","バテレン追放令"],["土地","指出検地","太閤検地（石高）"],["拠点","安土城","大坂城・聚楽第"]]}]}},"近世|江戸幕府の成立と幕藩体制":{"pts":["1600年の関ヶ原の戦いで勝った徳川家康は、1603年に征夷大将軍となり江戸幕府を開いた。1615年の大坂夏の陣で豊臣氏が滅ぶ（元和偃武）。","幕府は将軍と大名が土地の給与を通じて結ばれる幕藩体制。大名は親藩・譜代・外様に分かれ、外様は遠隔地に配置された。","武家諸法度は元和令（1615、秀忠・崇伝起草）と寛永令（1635、家光、参勤交代を制度化）。一国一城令は元和令と同じ1615年に出された。","禁中並公家諸法度（1615）で朝廷を統制。紫衣事件（1627）で朝廷への統制を強化した。京都所司代が朝廷・西国大名を監視。","幕府の職制は老中が政務、若年寄が旗本統括、三奉行（寺社・町・勘定）。大老は臨時。大目付は老中、目付は若年寄の配下。","旗本・御家人は将軍直属の家臣。幕領は郡代・代官が支配。村は名主・組頭・百姓代の村方三役、五人組で連帯責任を負わせた。"],"traps":["「元和令は家光の時」は×。元和令は秀忠、寛永令が家光。","「御三家は尾張・紀伊・加賀」は×。水戸が正しい。","「禁中並公家諸法度は大名統制」は×。大名統制は武家諸法度。","「参勤交代は外様のみ」は×。全大名が対象。","「三奉行に大目付」は×。寺社・町・勘定奉行。","「大老は常置」は×。臨時の職。"],"rel":["近世|織豊政権","近世|江戸初期の外交（鎖国）","近世|文治政治と元禄期"],"bridge":"織豊政権の石高制・兵農分離を受けて、幕府は大名と朝廷を法で統制して体制を固めた。ここから、鎖国と文治政治への展開につながる。","sys":{"overview":"家康が築いた幕藩体制の仕組み。大名の分類、武家諸法度の三つの段階、幕府の職制、朝廷統制、村の仕組みを区別して覚える。","tree":[{"h":"幕府成立","items":["関ヶ原（1600）","将軍就任（1603）","大坂夏の陣（1615）"]},{"h":"大名統制","items":["親藩・譜代・外様","一国一城令（1615）","元和令（秀忠・1615）","寛永令（家光・1635）参勤交代"]},{"h":"朝廷統制","items":["禁中並公家諸法度（1615）","紫衣事件（1627）","京都所司代・武家伝奏"]},{"h":"幕府の職制","items":["老中・若年寄・大老（臨時）","三奉行（寺社・町・勘定）","大目付（老中）・目付（若年寄）","郡代・代官"]},{"h":"村と家臣","items":["旗本・御家人","村方三役・五人組"]}],"flow":{"title":"幕府の成立と大名統制","steps":["関ヶ原の戦い（1600）","家康が将軍（1603）","大坂夏の陣で豊臣氏滅亡（1615）","一国一城令・元和令・禁中並公家諸法度（1615）","紫衣事件（1627）","寛永令で参勤交代を制度化（1635）"]},"tables":[{"title":"武家諸法度","head":["法令","将軍","年","要点"],"rows":[["元和令","秀忠","1615","崇伝起草、城の無断修築禁止"],["寛永令","家光","1635","参勤交代の制度化・大船禁止"]]},{"title":"大名の分類","head":["区分","特徴","例"],"rows":[["親藩","徳川一門","尾張・紀伊・水戸"],["譜代","関ヶ原以前から臣従","井伊・酒井"],["外様","関ヶ原前後に臣従","前田・島津"]]}]}},"近世|江戸初期の外交（鎖国）":{"pts":["家康は朱印船貿易を奨励し、東南アジアに日本町ができた。糸割符制度（1604）でポルトガルの生糸取引を統制した。","1609年に島津氏が琉球を征服し、宗氏は朝鮮と己酉約条（1609）を結んだ。松前藩はアイヌ交易を独占し、シャクシャインの戦い（1669）が起きた。","禁教令は1612年（直轄領）、1613年（全国）。1624年スペイン船の来航禁止、1633年から奉書船以外の渡航禁止、1635年に日本人の海外渡航・帰国の全面禁止。","島原の乱（1637〜38）は天草四郎時貞を首領とし、原城で鎮圧。1639年にポルトガル船の来航を禁止した。","1641年にオランダ商館を平戸から出島へ移し、鎖国が完成。長崎でオランダ・中国、対馬で朝鮮、薩摩で琉球、松前でアイヌと交流する4つの口があった。","宗門改め（寺請制度）でキリスト教を取り締まり、オランダ風説書で海外情報を得た。中国人は唐人屋敷（1689）に居住。"],"traps":["「1624年にオランダ船の来航禁止」は×。スペイン船。","「ヤン=ヨーステンはイギリス人」は×。オランダ人。イギリス人は三浦按針（アダムズ）。","「長崎の貿易国は朝鮮とオランダ」は×。オランダと中国。","「己酉約条は島津氏」は×。対馬の宗氏。","「島原の乱の指導者は由井正雪」は×。天草四郎。","「宗門改めは神社の氏子」は×。寺院の檀家。"],"rel":["近世|江戸幕府の成立と幕藩体制","近世|享保の改革と田沼時代","近代|開国と幕末の動乱"],"bridge":"江戸初期の対外政策は貿易の統制とキリスト教の禁止から鎖国に至った。鎖国下の4つの口は、享保以降の蘭学や、幕末の開国の背景につながる。","sys":{"overview":"朱印船貿易から鎖国の完成までの流れと、鎖国後も維持された4つの窓口を整理する。禁令の年代と、国ごとの禁止・許可が問われる。","tree":[{"h":"朱印船貿易","items":["朱印状・日本町（アユタヤ）","糸割符制度（1604）","三浦按針・ヨーステン"]},{"h":"禁教と鎖国","items":["禁教令（1612・1613）","スペイン船禁止（1624）","奉書船以外の渡航禁止（1633）","海外渡航禁止（1635）","島原の乱（1637〜38）","ポルトガル船禁止（1639）","出島移転（1641）"]},{"h":"4つの口","items":["長崎：オランダ・中国","対馬：朝鮮（己酉約条）","薩摩：琉球（1609）","松前：アイヌ"]},{"h":"統制","items":["宗門改め・寺請","オランダ風説書","唐人屋敷（1689）"]}],"flow":{"title":"鎖国までの流れ","steps":["禁教令（1612・1613）","スペイン船来航禁止（1624）","奉書船以外の海外渡航禁止（1633）","日本人の海外渡航・帰国禁止（1635）","島原の乱（1637〜38）","ポルトガル船来航禁止（1639）","出島にオランダ商館を移す（1641）"]},"tables":[{"title":"4つの口","head":["窓口","担当","相手"],"rows":[["長崎","幕府","オランダ・中国"],["対馬","宗氏","朝鮮"],["薩摩","島津氏","琉球"],["松前","松前氏","アイヌ"]]}]}},"近世|文治政治と元禄期":{"pts":["4代家綱は幼少で将軍となり、保科正之が補佐。由井正雪の慶安の変（1651）後、末期養子の禁を緩和し、殉死を禁止（1663）して武断から文治へ転換した。","5代綱吉は儒学（朱子学）を奨励し、湯島聖堂を建て林信篤を大学頭に任命。武家諸法度天和令（1683）で「文武忠孝」を掲げた。","綱吉は側用人（柳沢吉保）を重用し、生類憐みの令（1685〜）を出した。荻原重秀の貨幣改鋳（1695）で出目を得たが物価が上昇した。","6代家宣・7代家継の正徳の政治は新井白石と間部詮房が主導した。閑院宮家の創設、貨幣の質の回復（正徳小判）、朝鮮国書の将軍呼称を日本国王に改めた。","海舶互市新例（長崎新令・1715）は清船年30隻・オランダ船年2隻に制限し、金銀の流出を防いだ。","白石はシドッチを尋問して『西洋紀聞』『采覧異言』を著した。"],"traps":["「生類憐みの令は吉宗」は×。綱吉。","「新井白石は貨幣の質を落とした」は×。質を落としたのは荻原重秀。","「海舶互市新例は吉宗」は×。白石。","「柳沢吉保を重用したのは家宣」は×。綱吉。家宣は間部詮房。","「末期養子の禁を厳しくした」は×。慶安の変を受けて緩和。","「綱吉は陽明学を重んじた」は×。朱子学。"],"rel":["近世|江戸幕府の成立と幕藩体制","近世|享保の改革と田沼時代","文化|近世の文化（桃山〜化政）"],"bridge":"文治政治は武力による統制から法と儒学による統治へ移る流れ。元禄期の貨幣改鋳による財政悪化が、次の享保の改革につながる。","sys":{"overview":"家綱の文治への転換、綱吉の儒学奨励と側用人政治、家宣・家継の正徳の政治を、将軍と側近、政策で整理する。","tree":[{"h":"家綱","items":["保科正之が補佐","慶安の変（1651）→末期養子の緩和","殉死禁止（1663）","寛文印知（1664）","証人制の廃止（1665）","明暦の大火（1657）"]},{"h":"綱吉","items":["湯島聖堂・林信篤","天和令（1683）","生類憐みの令","側用人・柳沢吉保","荻原重秀の貨幣改鋳（1695）"]},{"h":"家宣・家継","items":["新井白石・間部詮房","閑院宮家","正徳小判","海舶互市新例（1715）","朝鮮国書は日本国王"]}],"flow":{"title":"文治政治の流れ","steps":["家綱：末期養子の緩和・殉死禁止","綱吉：天和令・湯島聖堂","元禄の貨幣改鋳（1695）","家宣・家継：正徳の政治","海舶互市新例（1715）"]},"tables":[{"title":"貨幣政策","head":["人物","政策","結果"],"rows":[["荻原重秀","質を落とす（元禄）","出目・物価上昇"],["新井白石","質を戻す（正徳）","物価安定をねらう"]]}]}},"近世|享保の改革と田沼時代":{"pts":["徳川吉宗は紀伊藩主から8代将軍に就任（1716）。上げ米（1722）、足高の制（1723）、定免法、新田開発で財政を再建した。","相対済し令（1719）は金銭貸借の訴訟を受理しない法令。公事方御定書（1742）で裁判の基準を定め、目安箱から小石川養生所が設けられた。","大岡忠相が町奉行として活躍し、町火消を整備。堂島米市場を公認（1730）。享保の飢饉（1732）は西日本でウンカが原因。","漢訳洋書の輸入を緩和（1720）し、青木昆陽・野呂元丈らが蘭学の基礎を築く。","田沼意次は側用人から老中となり、株仲間を公認して運上・冥加金を徴収。俵物の輸出を奨励し、南鐐二朱銀を発行、印旛沼の干拓、蝦夷地調査を進めた。","田沼期は賄賂の横行が批判され、浅間山噴火（1783）・天明の飢饉（1782〜）で打ちこわしが頻発。家治の死（1786）で失脚した。"],"traps":["「足高の制は田沼」は×。吉宗。","「相対済し令は田畑の売買を禁止」は×。金銀貸借の訴訟を受理しない。","「定免法は毎年収穫を調べる」は×。年貢率を固定。毎年調べるのは検見法。","「俵物は輸入品」は×。俵物は輸出品。","「南鐐二朱銀は秤量貨幣」は×。計数貨幣。","「浅間山噴火は享保の飢饉」は×。天明の飢饉。"],"rel":["近世|文治政治と元禄期","近世|寛政の改革と列強接近","近世|江戸の経済と交通・身分"],"bridge":"享保の改革は農業中心の財政再建、田沼時代は商業重視へ転じた。田沼の失脚後、松平定信が再び緊縮と農村重視に戻る。","sys":{"overview":"吉宗の財政再建（米中心）と、田沼意次の商業重視を対比して整理する。政策名と人物の対応、年代、飢饉の区別が頻出。","tree":[{"h":"享保の改革","items":["上げ米（1722）","足高の制（1723）","定免法","相対済し令（1719）","公事方御定書（1742）","目安箱・小石川養生所","堂島米市場公認（1730）"]},{"h":"享保の改革の周辺","items":["大岡忠相・町火消","洋書輸入緩和（1720）","青木昆陽・サツマイモ","享保の飢饉（1732）"]},{"h":"田沼時代","items":["株仲間公認・運上冥加金","俵物の輸出","南鐐二朱銀（1772）","印旛沼干拓","蝦夷地調査（最上徳内）","天明の飢饉・浅間山噴火"]}],"flow":{"title":"吉宗から田沼まで","steps":["吉宗が将軍に（1716）","相対済し令（1719）","上げ米（1722）","足高の制（1723）","公事方御定書（1742）","田沼意次が老中に","南鐐二朱銀（1772）","天明の飢饉（1782〜）","田沼失脚（1786）"]},"tables":[{"title":"享保と田沼","head":["項目","吉宗","田沼意次"],"rows":[["基本","農業重視・倹約","商業重視"],["財源","年貢・上げ米","運上冥加金"],["貨幣","元文金銀","南鐐二朱銀"],["貿易","洋書輸入緩和","俵物輸出"]]}]}},"近世|寛政の改革と列強接近":{"pts":["松平定信は吉宗の孫で白河藩主。老中首座となり（1787）、享保の改革を手本とした寛政の改革を行った。","囲米、棄捐令（1789）、七分積金、人足寄場、旧里帰農令で農村の復興と江戸の安定をはかった。","寛政異学の禁（1790）で朱子学を正学とし、湯島聖堂の学問所は昌平坂学問所となった（1797）。","出版統制で山東京伝・林子平を処罰。尊号一件などで将軍家斉と対立し、定信は辞職（1793）。","ラクスマンが根室に来航（1792）、レザノフが長崎に来航（1804）。北方探査では近藤重蔵が択捉、間宮林蔵が樺太を探査した。","1799年に東蝦夷地を直轄。フェートン号事件（1808）、ゴローニン事件（1811）が起こり、異国船打払令（1825）が出された。"],"traps":["「ラクスマンは長崎に来航」は×。根室。長崎はレザノフ。","「棄捐令は百姓の借金」は×。旗本・御家人の借金。","「異学の禁は陽明学を正学」は×。朱子学。","「択捉に標柱を建てたのは間宮林蔵」は×。近藤重蔵。","「七分積金は3割積み立て」は×。7割。","「株仲間の解散は定信」は×。水野忠邦（天保）。"],"rel":["近世|享保の改革と田沼時代","近世|天保の改革と藩政改革","近代|開国と幕末の動乱"],"bridge":"寛政の改革は田沼政治の反動として農村重視へ戻した。北方では列強の接近が始まり、天保期の異国船打払令の緩和、幕末の開国につながる。","sys":{"overview":"定信の緊縮政策、学問・出版の統制、ロシアをはじめとする列強の接近を整理する。使節・事件の年代と場所が頻出。","tree":[{"h":"定信の政策","items":["囲米","棄捐令（1789）","七分積金","人足寄場","旧里帰農令","異学の禁（1790）"]},{"h":"統制","items":["出版統制（山東京伝）","林子平『海国兵談』","尊号一件・定信辞職（1793）"]},{"h":"ロシア","items":["ラクスマン（1792・根室）","レザノフ（1804・長崎）","ゴローニン事件（1811）"]},{"h":"北方探査","items":["近藤重蔵・択捉（1798）","間宮林蔵・樺太（1808）","東蝦夷地直轄（1799）"]},{"h":"その他","items":["フェートン号事件（1808）","異国船打払令（1825）"]}],"flow":{"title":"定信から列強接近へ","steps":["定信が老中首座（1787）","棄捐令（1789）","寛政異学の禁（1790）","ラクスマン来航（1792）","定信辞職（1793）","レザノフ来航（1804）","フェートン号事件（1808）","異国船打払令（1825）"]},"tables":[{"title":"ロシア関連","head":["人物","年","場所","結果"],"rows":[["ラクスマン","1792","根室","信牌を与える"],["レザノフ","1804","長崎","通商拒否"],["ゴローニン","1811","国後島","捕らえられる"]]}]}},"近世|天保の改革と藩政改革":{"pts":["天保の飢饉（1833〜）を背景に、大塩平八郎の乱（1837）が起こった。大塩は元大坂町奉行所与力で陽明学者。","モリソン号事件（1837）を批判した渡辺崋山・高野長英が蛮社の獄（1839）で処罰された。","水野忠邦は天保の改革（1841〜）で倹約令、株仲間解散令（1841）、人返しの法（1843）を出し、上知令（1843）の失敗で失脚した。","アヘン戦争（1840〜）後、天保の薪水給与令（1842）で異国船打払令を緩和した。","薩摩藩は調所広郷が黒砂糖の専売で再建。長州藩は村田清風が越荷方を活用。佐賀藩は鍋島直正が均田制・反射炉。水戸藩は徳川斉昭が弘道館を設立。","風俗統制で為永春水・柳亭種彦が処罰され、歌舞伎の三座は浅草の猿若町に移された。"],"traps":["「大塩平八郎は元大坂町奉行」は×。元与力。","「蛮社の獄で杉田玄白らが処罰」は×。崋山と長英。","「人返しの法は出稼ぎ奨励」は×。農村に帰らせる。","「上知令は成功」は×。反対で撤回。","「モリソン号はイギリス軍艦」は×。アメリカ商船。","「薩摩の借金は25年賦」は×。250年賦。"],"rel":["近世|寛政の改革と列強接近","近代|開国と幕末の動乱","文化|近世の文化（桃山〜化政）"],"bridge":"天保の改革は幕府の財政と社会の再建をめざしたが失敗に終わった。一方、雄藩は藩政改革で力をつけ、幕末の政局を動かす力になった。","sys":{"overview":"天保の飢饉と大塩平八郎の乱、水野忠邦の天保の改革、対外政策の転換、雄藩の藩政改革を整理する。","tree":[{"h":"背景","items":["天保の飢饉（1833〜）","大塩平八郎の乱（1837）","モリソン号事件（1837）","蛮社の獄（1839）"]},{"h":"天保の改革","items":["倹約令・風俗統制","株仲間解散令（1841）","人返しの法（1843）","上知令（1843）失敗","印旛沼干拓"]},{"h":"対外","items":["アヘン戦争（1840〜）","薪水給与令（1842）"]},{"h":"藩政改革","items":["薩摩：調所広郷","長州：村田清風・越荷方","佐賀：鍋島直正・均田制","水戸：徳川斉昭・弘道館"]}],"flow":{"title":"天保の改革の流れ","steps":["天保の飢饉（1833〜）","大塩平八郎の乱（1837）","モリソン号事件（1837）","蛮社の獄（1839）","株仲間解散令（1841）","薪水給与令（1842）","人返しの法・上知令（1843）","水野失脚（1843）"]},"tables":[{"title":"雄藩の改革","head":["藩","人物","内容"],"rows":[["薩摩","調所広郷","砂糖専売・250年賦"],["長州","村田清風","越荷方・藩士の借金整理"],["佐賀","鍋島直正","均田制・反射炉"],["水戸","徳川斉昭","弘道館・藤田東湖"]]}]}},"近世|江戸の経済と交通・身分":{"pts":["五街道（東海道・中山道・日光街道・奥州街道・甲州街道）は日本橋を起点とし、関所で入り鉄砲・出女を取り締まった。宿駅には問屋場が置かれ、助郷が課された。","河村瑞賢が東廻り・西廻り航路を整備（1670年代）。江戸・大坂間には菱垣廻船・樽廻船が運航した。","三貨は金（計数貨幣）・銀（秤量貨幣）・銭。江戸は金遣い、上方は銀遣い。大坂は天下の台所で蔵屋敷が置かれ、江戸の三井・大坂の鴻池らが栄えた。","農業は新田開発、備中鍬・千歯扱・踏車・唐箕、金肥（干鰯・〆粕）が普及。宮崎安貞『農業全書』、大蔵永常『農具便利論』。","商品作物（四木三草）が広がり、問屋制家内工業から工場制手工業へ。十組問屋（江戸）・二十四組問屋（大坂）。","身分は武士・百姓・町人。本百姓と水呑百姓、町では家持が町政を担った。田畑永代売買の禁止（1643）、村請制、村八分などの村の仕組み。"],"traps":["「五街道は京都起点」は×。江戸の日本橋。","「東廻り・西廻りは角倉了以」は×。河村瑞賢。","「江戸は銀遣い」は×。江戸は金遣い、上方は銀遣い。","「千歯扱は灌漑」は×。脱穀。灌漑は踏車。","「金肥は自給肥料」は×。購入肥料。","「西廻り航路は津軽海峡」は×。津軽海峡は東廻り。"],"rel":["近世|享保の改革と田沼時代","近世|江戸幕府の成立と幕藩体制","文化|近世の文化（桃山〜化政）"],"bridge":"交通・貨幣・農業・商業の発達は、幕府や藩の財政と社会のありかたを変えた。これが享保以降の改革や、身分秩序のゆらぎにつながる。","sys":{"overview":"陸上・海上交通、貨幣制度、農業・商工業の発達、身分と村・町の仕組みを整理する。航路・貨幣・農具・農書の区別が頻出。","tree":[{"h":"交通","items":["五街道・日本橋起点","関所・入り鉄砲に出女","問屋場・助郷","河村瑞賢の東廻り・西廻り","菱垣廻船・樽廻船"]},{"h":"貨幣・都市","items":["三貨（金・銀・銭）","江戸＝金遣い、上方＝銀遣い","天下の台所・蔵屋敷","両替商・札差"]},{"h":"農業・商工業","items":["備中鍬・千歯扱・踏車・唐箕","金肥（干鰯・〆粕）","農書：農業全書・農具便利論","四木三草","問屋制家内工業"]},{"h":"身分と村・町","items":["本百姓・水呑百姓","村請制・五人組・村八分","町は家持が運営","田畑永代売買の禁止（1643）"]}],"flow":{"title":"流通の発達","steps":["五街道の整備","東廻り・西廻り航路の整備（1670年代）","菱垣廻船・樽廻船","大坂に蔵屋敷が集中","十組問屋・二十四組問屋"]},"tables":[{"title":"農具","head":["農具","用途"],"rows":[["備中鍬","深耕"],["千歯扱","脱穀"],["唐箕","選別"],["踏車","灌漑"]]},{"title":"航路","head":["航路","経路","整備者"],"rows":[["東廻り","酒田→津軽海峡→江戸","河村瑞賢"],["西廻り","酒田→日本海→下関→大坂","河村瑞賢"]]}]}},"近代|開国と幕末の動乱":{"pts":["1853年ペリーが浦賀に来航し、翌1854年の日米和親条約で下田・箱館を開港。補給と漂流民保護が中心で貿易は含まない。","1858年、大老井伊直弼が勅許なしで日米修好通商条約に調印。領事裁判権を認め、関税自主権がない不平等条約。","開港場は神奈川・長崎・新潟・兵庫と箱館。江戸・大坂は開市。最大の輸出品は生糸。","井伊は安政の大獄で反対派を弾圧し、1860年に桜田門外の変で暗殺される。","公武合体（和宮降嫁）から尊攘運動へ。八月十八日の政変・禁門の変で長州が敗れ、四国艦隊下関砲撃で攘夷の不可能を知る。","薩英戦争後は薩摩も開明化し、1866年に坂本龍馬の仲介で薩長同盟。第2次長州征討は幕府軍の敗北。","1867年に大政奉還、同年12月に王政復古の大号令・小御所会議。翌年の鳥羽・伏見で戊辰戦争が始まる。"],"traps":["桜田門外の変は井伊直弼、坂下門外の変は安藤信正。取り違えを狙う問題が多い。","和親条約は下田・箱館、通商条約は横浜（神奈川）など。開港地と条約の対応を入れ替える。","八月十八日の政変で追われたのは長州。会津・薩摩が主導した。","大政奉還は慶喜、第2次長州征討中に死去したのは家茂。将軍の名の入れ替えに注意。","討幕の密勅は薩摩と長州。土佐は大政奉還を建白した側。"],"rel":["近世|寛政の改革と列強接近","近代|明治維新と諸改革","近世|天保の改革と藩政改革"],"bridge":"開国は幕府の権威低下を招き、尊攘運動と倒幕へ展開した。この動きが明治維新と諸改革の前提になる。","sys":{"overview":"ペリー来航から戊辰戦争までの政治過程。条約の内容、事件の主体、薩長の動きを整理する。","tree":[{"h":"開国と条約","items":["日米和親条約（1854）：下田・箱館、片務的最恵国待遇","日米修好通商条約（1858）：自由貿易・領事裁判権・関税自主権なし","安政の五カ国条約：米・蘭・露・英・仏","改税約書（1866）：関税率を約5％へ"]},{"h":"幕府の政策と弾圧","items":["井伊直弼：無勅許調印、安政の大獄","安藤信正：和宮降嫁（公武合体）","五品江戸廻送令（1860）"]},{"h":"尊攘運動と薩長","items":["八月十八日の政変（1863）","禁門の変・四国艦隊下関砲撃（1864）","薩英戦争（1863）","薩長同盟（1866）"]},{"h":"幕府の終わり","items":["大政奉還（1867.10）","王政復古の大号令（1867.12）","鳥羽・伏見の戦い（1868）"]}],"flow":{"title":"開国から戊辰戦争","steps":["1853 ペリー来航","1854 日米和親条約","1858 日米修好通商条約・安政の大獄","1860 桜田門外の変","1863 八月十八日の政変・薩英戦争","1864 禁門の変・四国艦隊砲撃","1866 薩長同盟","1867 大政奉還・王政復古","1868 鳥羽・伏見の戦い"]},"tables":[{"title":"主な事件と中心人物","head":["事件","人物・主体","結果"],"rows":[["桜田門外の変","井伊直弼が暗殺","幕府権威の低下"],["坂下門外の変","安藤信正が負傷","公武合体の挫折"],["八月十八日の政変","会津・薩摩が長州を追放","七卿落ち"],["禁門の変","長州が敗北","第1次長州征討"]]}]}},"近代|明治維新と諸改革":{"pts":["五箇条の誓文（1868）で公議世論の尊重を示し、1869年の版籍奉還、1871年の廃藩置県で中央集権化。","廃藩置県で知藩事は罷免・東京居住となり、府知事・県令を派遣。御親兵が背景。","学制（1872、フランス式）・徴兵令（1873、国民皆兵）・地租改正（1873、地価の3％を金納）が三大改革。","地租改正反対一揆を受け、1877年に地租を2.5％へ引き下げ。","殖産興業は内務省（大久保利通）・工部省が主導し、官営模範工場（富岡製糸場）、新貨条例、郵便制度（前島密）を整備。","1873年の征韓論争に敗れた西郷隆盛らが下野。佐賀の乱・神風連・萩の乱を経て1877年の西南戦争が最後の士族反乱。","国境の画定：樺太・千島交換条約（1875）、琉球処分（1879）、小笠原領有。日朝修好条規（1876）は江華島事件後。"],"traps":["版籍奉還は知藩事が藩を統治、廃藩置県は知藩事罷免。区別が定番。","地租は収穫高・米納ではなく、地価・金納。","樺太・千島交換は、日本が樺太を放棄し千島全島を得る。","岩倉使節団の大使は岩倉具視。留守政府は西郷隆盛。","明治六年の政変で去ったのは征韓派。大久保は政府に残った。"],"rel":["近代|自由民権運動と立憲体制","近代|条約改正と日清戦争","近代|産業革命と社会問題"],"bridge":"明治維新の諸改革は、中央集権と殖産興業で近代国家の骨格をつくり、士族の不満が自由民権運動へつながる。","sys":{"overview":"藩体制の解体、三大改革、殖産興業、外交・国境画定、士族反乱を押さえる。","tree":[{"h":"政治の改革","items":["五箇条の誓文（1868）","版籍奉還（1869）","廃藩置県（1871）","太政官制の改革（正院・左院・右院）"]},{"h":"三大改革","items":["学制（1872）：フランス式","徴兵令（1873）：満20歳以上の男子","地租改正（1873）：地価の3％金納"]},{"h":"殖産興業","items":["内務省（1873）：大久保利通","官営模範工場：富岡製糸場","新貨条例（1871）・郵便制度（前島密）"]},{"h":"外交・士族反乱","items":["岩倉使節団（1871）","征韓論→明治六年の政変（1873）","佐賀の乱（1874）→西南戦争（1877）"]}],"flow":{"title":"維新改革の流れ","steps":["1868 五箇条の誓文","1869 版籍奉還","1871 廃藩置県・岩倉使節団","1872 学制","1873 徴兵令・地租改正・明治六年の政変","1874 佐賀の乱・台湾出兵","1876 日朝修好条規・秩禄処分","1877 西南戦争","1879 琉球処分"]},"tables":[{"title":"版籍奉還と廃藩置県","head":["項目","藩主の扱い","年"],"rows":[["版籍奉還","知藩事に任命（藩を統治）","1869"],["廃藩置県","知藩事を罷免・東京居住","1871"]]},{"title":"士族反乱","head":["反乱","中心人物","年"],"rows":[["佐賀の乱","江藤新平","1874"],["神風連の乱","熊本の敬神党","1876"],["萩の乱","前原一誠","1876"],["西南戦争","西郷隆盛","1877"]]}]}},"近代|自由民権運動と立憲体制":{"pts":["1874年の民撰議院設立建白書（板垣退助ら）が出発点。立志社・愛国社・国会期成同盟（1880）と運動が広がる。","政府は讒謗律・新聞紙条例（1875）、集会条例（1880）で言論を取り締まる。","1881年、開拓使官有物払下げ事件と明治十四年の政変（大隈重信追放）。国会開設の勅諭で1890年開設を公約。","板垣退助が自由党（フランス流）、大隈重信が立憲改進党（イギリス流）を結成。松方財政のデフレで福島・加波山・秩父など事件が相次ぐ。","伊藤博文がドイツ流憲法を学び、井上毅らがロエスレル・モッセの助言で起草。1885年内閣制度、1888年枢密院、1889年大日本帝国憲法発布。","憲法は欽定憲法。天皇が統治権を総攬し、統帥権は独立。臣民の権利は法律の範囲内。帝国議会は貴族院と衆議院（予算先議権）。","第1回総選挙（1890）は直接国税15円以上・満25歳以上の男子、有権者は約1％。超然主義と民党の対立が続く。"],"traps":["政変で追放されたのは大隈重信。イギリス流を主張したのも大隈。","秩父事件は埼玉、福島事件は福島。県名の入れ替えが出る。","枢密院の初代議長は伊藤博文。","民定憲法ではなく欽定憲法。","予算先議権は衆議院。貴族院は公選ではない。","大同団結運動の中心は後藤象二郎。板垣退助ではない。"],"rel":["近代|明治維新と諸改革","近代|条約改正と日清戦争","近代|政党政治と恐慌"],"bridge":"明治維新で成立した政府への批判が民権運動となり、政府は憲法・議会を整えて対応した。議会開設後は条約改正・日清戦争へ進む。","sys":{"overview":"自由民権運動の経過、政党と事件、憲法制定の過程、帝国憲法の特徴を整理する。","tree":[{"h":"民権運動","items":["民撰議院設立建白書（1874）","国会期成同盟（1880）","自由党・立憲改進党（1881・82）"]},{"h":"政府の対応","items":["讒謗律・新聞紙条例・集会条例","明治十四年の政変・国会開設の勅諭","保安条例（1887）"]},{"h":"憲法制定","items":["内閣制度（1885）","枢密院（1888）","大日本帝国憲法（1889）"]},{"h":"帝国憲法の特徴","items":["欽定憲法","天皇の統治権総攬・統帥権独立","臣民の権利は法律の範囲内"]}],"flow":{"title":"民権運動から議会開設","steps":["1874 民撰議院設立建白書","1880 国会期成同盟","1881 明治十四年の政変・勅諭・自由党","1882 立憲改進党・福島事件","1884 秩父事件","1885 内閣制度","1887 保安条例","1889 憲法発布","1890 第1回総選挙・議会開設"]},"tables":[{"title":"二つの政党","head":["政党","党首","性格"],"rows":[["自由党","板垣退助","フランス流・士族と豪農"],["立憲改進党","大隈重信","イギリス流・知識人と都市実業家"]]},{"title":"民権派の事件","head":["事件","場所","年"],"rows":[["福島事件","福島（三島通庸）","1882"],["加波山事件","茨城","1884"],["秩父事件","埼玉","1884"]]}]}},"近代|条約改正と日清戦争":{"pts":["条約改正は井上馨（鹿鳴館・外国人判事案）、大隈重信（大審院に限る外国人判事案）が失敗。","ノルマントン号事件（1886）で領事裁判権への批判が高まり、大津事件（1891）で青木周蔵の交渉が頓挫。","陸奥宗光が1894年に日英通商航海条約で領事裁判権を撤廃（実施1899）。小村寿太郎が1911年に関税自主権を回復。","朝鮮では壬午軍乱（1882）、甲申事変（1884）が起き、天津条約（1885）で日清が撤兵・事前通告を約束。","1894年の甲午農民戦争を機に日清戦争。日本が勝利して1895年に下関条約。","下関条約は朝鮮の独立承認、遼東半島・台湾・澎湖諸島の割譲、賠償金2億両、4港の開港。","三国干渉（露・独・仏）で遼東半島を返還。臥薪嘗胆の世論。賠償金を準備に1897年貨幣法で金本位制。"],"traps":["遼東半島と山東半島の取り違え。割譲は遼東半島。","下関条約の清の全権は李鴻章。袁世凱ではない。","三国干渉はロシア・ドイツ・フランス。イギリスは含まれない。","ノルマントン号事件は領事裁判権。関税自主権とは別。","大津事件の被害者はロシア皇太子。裁判は無期徒刑で司法権の独立が守られた。"],"rel":["近代|自由民権運動と立憲体制","近代|日露戦争と韓国併合","近代|産業革命と社会問題"],"bridge":"条約改正は国内政治と外交の課題で、日清戦争の勝利を経て領事裁判権撤廃が実現する。戦後の賠償金は産業革命を後押しし、列強との対立は日露戦争へ続く。","sys":{"overview":"条約改正の担当者と失敗の理由、朝鮮をめぐる日清対立、下関条約と三国干渉を整理する。","tree":[{"h":"条約改正の経過","items":["井上馨：欧化政策・外国人判事案","大隈重信：大審院に限る外国人判事、爆弾で負傷","青木周蔵：大津事件で中断","陸奥宗光：日英通商航海条約（1894）","小村寿太郎：関税自主権回復（1911）"]},{"h":"朝鮮をめぐる対立","items":["壬午軍乱（1882）","甲申事変（1884）","天津条約（1885）","甲午農民戦争（1894）"]},{"h":"下関条約","items":["朝鮮の独立承認","遼東半島・台湾・澎湖諸島の割譲","賠償金2億両","沙市・重慶・蘇州・杭州の開港"]},{"h":"戦争後","items":["三国干渉・臥薪嘗胆","台湾総督府（初代樺山資紀）","貨幣法（1897）・金本位制"]}],"flow":{"title":"条約改正と戦争","steps":["1882 壬午軍乱","1884 甲申事変","1885 天津条約","1886 ノルマントン号事件","1891 大津事件","1894 日英通商航海条約・日清戦争","1895 下関条約・三国干渉","1899 新条約実施","1911 関税自主権回復"]},"tables":[{"title":"条約改正の担当者","head":["外相","内容","結果"],"rows":[["井上馨","欧化政策・外国人判事任用","反対論で辞職（1887）"],["大隈重信","大審院に限る外国人判事","爆弾で負傷・辞職（1889）"],["陸奥宗光","日英通商航海条約","領事裁判権撤廃（1894）"],["小村寿太郎","日米通商航海条約改正","関税自主権回復（1911）"]]}]}},"近代|日露戦争と韓国併合":{"pts":["義和団事件後の北京議定書（1901）で列国が駐兵権を得る。ロシアは満州を占領し、日英同盟（1902）で日本が対抗。","伊藤博文らは日露協商論。桂内閣は日英同盟を選び、1904年に日露戦争が開戦。","旅順攻略（乃木希典）、日本海海戦（東郷平八郎）で優位に立ち、米大統領仲介でポーツマス条約（1905）。","ポーツマス条約：韓国の指導・監督権承認、旅順・大連の租借権、長春以南の鉄道、南樺太。賠償金なし。","賠償金がなく日比谷焼打ち事件が発生。満鉄を設立（1906、初代総裁後藤新平）。","日韓議定書・第1〜3次日韓協約で韓国を保護国化。統監府（初代伊藤博文）、ハーグ密使事件で高宗退位。","1910年に韓国併合し朝鮮総督府を設置（初代寺内正毅）。土地調査事業、武断政治。"],"traps":["旅順攻略は乃木希典、日本海海戦は東郷平八郎。","統監は伊藤博文、総督は寺内正毅。","第2次日韓協約は外交権、第3次は内政権。","ポーツマス条約で得た鉄道は長春以南のみ。","日英同盟は開戦前に結ばれた。","日露協約は戦後の1907年に第1次、1916年の第4次まで結ばれた。"],"rel":["近代|条約改正と日清戦争","近代|産業革命と社会問題","近代|大正政治と第一次世界大戦"],"bridge":"日清戦争後の三国干渉が日露対立を深め、日露戦争で日本は韓国支配と満州進出を進めた。この延長に大陸政策と第一次世界大戦期の外交がある。","sys":{"overview":"日露開戦までの国際関係、戦争の経過、ポーツマス条約、韓国の保護国化と併合を整理する。","tree":[{"h":"開戦まで","items":["義和団事件・北京議定書（1901）","ロシアの満州占領","日英同盟（1902）"]},{"h":"ポーツマス条約","items":["韓国の指導・監督権","旅順・大連の租借権","長春以南の鉄道","南樺太の割譲","賠償金なし"]},{"h":"韓国支配","items":["日韓議定書（1904）","第1次日韓協約（1904）","第2次日韓協約（1905）：外交権・統監府","第3次日韓協約（1907）：内政権"]},{"h":"併合","items":["韓国併合（1910）","朝鮮総督府・土地調査事業","安重根による伊藤博文暗殺（1909）"]}],"flow":{"title":"日露戦争から併合","steps":["1902 日英同盟","1904 日露戦争・第1次日韓協約","1905 日本海海戦・ポーツマス条約・第2次日韓協約","1906 満鉄設立","1907 ハーグ密使事件・第3次日韓協約","1909 伊藤博文暗殺","1910 韓国併合"]},"tables":[{"title":"日韓協約","head":["協約","年","内容"],"rows":[["第1次","1904","財政・外交に日本人顧問"],["第2次","1905","外交権掌握・統監府"],["第3次","1907","内政権掌握・軍隊解散"]]},{"title":"統監と総督","head":["役職","初代","時期"],"rows":[["韓国統監","伊藤博文","1905〜"],["朝鮮総督","寺内正毅","1910〜"]]}]}},"近代|産業革命と社会問題":{"pts":["松方財政後の企業勃興で産業革命が始まり、軽工業（紡績・製糸）から重工業へ進む。","紡績業：大阪紡績会社（渋沢栄一）、1890年に国産綿糸が輸入を上回り、1897年に輸出が輸入を超える。","製糸業：器械製糸が普及し、1909年に生糸輸出が世界一。豊田佐吉が国産力織機を開発。","重工業：官営八幡製鉄所（1901）が日清戦争の賠償金で建設。大冶鉄鉱石と筑豊石炭。鉄道国有法（1906）。","財閥（三井・三菱・住友・安田）が成長。官営長崎造船所は三菱へ払い下げ。1897年貨幣法で金本位制。","労働問題：労働組合期成会（1897）、治安警察法（1900）、工場法（1911、施行1916）。社会主義は社会民主党（1901）、大逆事件（1910）。","足尾銅山鉱毒事件（田中正造）。農村では寄生地主制が広まり、高率の現物小作料が課された。"],"traps":["八幡製鉄所の建設費は日清戦争の賠償金。日露戦争では賠償金なし。","工場法は公布1911・施行1916。同時ではない。","治安警察法は第2次山県内閣。労働運動を取り締まる法。","貨幣法は金本位制。銀本位制ではない。","『女工哀史』は細井和喜蔵、『日本之下層社会』は横山源之助。","大逆事件で処刑されたのは幸徳秋水。"],"rel":["近代|条約改正と日清戦争","近代|大正政治と第一次世界大戦","近世|江戸の経済と交通・身分"],"bridge":"日清戦争後の賠償金と日露戦争前後の資本蓄積が産業革命を進め、同時に労働問題・社会主義運動・公害を生んだ。大戦景気への土台となる。","sys":{"overview":"産業革命の進展、財閥、労働運動の弾圧と保護、社会運動と公害を整理する。","tree":[{"h":"軽工業","items":["紡績業：大阪紡績会社、綿糸輸出超過（1897）","製糸業：器械製糸、生糸輸出世界一（1909）","豊田佐吉：国産力織機"]},{"h":"重工業","items":["官営八幡製鉄所（1901）","鉄道国有法（1906）","三菱・三井などの財閥"]},{"h":"労働・社会運動","items":["労働組合期成会（1897）","治安警察法（1900）","社会民主党（1901）・日本社会党（1906）","大逆事件（1910）・工場法（1911）"]},{"h":"公害・農村","items":["足尾銅山鉱毒事件・田中正造","谷中村の遊水池化","寄生地主制"]}],"flow":{"title":"産業革命と社会問題","steps":["1882 大阪紡績会社設立","1890 国産綿糸が輸入を上回る","1897 綿糸輸出超過・貨幣法・労働組合期成会","1900 治安警察法","1901 八幡製鉄所操業・社会民主党・田中正造直訴","1906 鉄道国有法","1909 生糸輸出世界一","1910 大逆事件","1911 工場法"]},"tables":[{"title":"社会主義政党","head":["政党","年","経過"],"rows":[["社会民主党","1901","結成直後に禁止"],["日本社会党","1906","翌年禁止"]]},{"title":"労働関連の法","head":["法","年","内容"],"rows":[["治安警察法","1900","労働運動・政治結社を取締り"],["工場法","1911（施行1916）","12歳未満の就業禁止など"]]}]}},"近代|大正政治と第一次世界大戦":{"pts":["第2次西園寺内閣は陸軍の2個師団増設問題で倒れ、第3次桂内閣は第1次護憲運動で総辞職（大正政変、1913）。","山本権兵衛内閣は現役武官制を予備役まで緩和したが、シーメンス事件で退陣。","1914年に日英同盟を理由に参戦。1915年に袁世凱政府へ二十一カ条の要求（加藤高明外相）。最後通牒で受諾。","寺内内閣は西原借款、石井・ランシング協定（1917）。シベリア出兵と米騒動（1918）で退陣。","原敬内閣（1918）は本格的政党内閣。大学令、選挙法改正（直接国税3円・小選挙区制）。","パリ講和会議（西園寺公望）で山東権益を継承、南洋諸島の委任統治。国際連盟では常任理事国。","ワシントン会議：四カ国条約（日英同盟廃棄）、九カ国条約、海軍軍縮（5・5・3）、山東返還。大戦景気で債権国となる。"],"traps":["二十一カ条は袁世凱政府に、加藤高明外相。小村寿太郎ではない。","辞任した陸相は上原勇作。","山東権益はパリで継承、ワシントン会議後に返還。","南洋諸島は赤道以北。","四カ国条約で日英同盟は終了。","民本主義は吉野作造、『中央公論』。主権在民ではない。"],"rel":["近代|日露戦争と韓国併合","近代|政党政治と恐慌","近代|産業革命と社会問題"],"bridge":"大正期は藩閥から政党への政権移行と第一次世界大戦の外交・経済が重なる。戦後の国際協調体制が次の政党政治期につながる。","sys":{"overview":"大正政変、大戦参戦と二十一カ条、原内閣、パリ講和とワシントン体制、大戦景気を整理する。","tree":[{"h":"大正政変","items":["第2次西園寺内閣倒壊（増師問題）","第1次護憲運動","第3次桂内閣総辞職（1913）","山本内閣・シーメンス事件（1914）"]},{"h":"大戦と外交","items":["参戦（1914）","二十一カ条（1915）","西原借款・石井・ランシング協定（1917）","シベリア出兵（1918）"]},{"h":"政党内閣","items":["米騒動（1918）","原敬内閣","大学令・選挙法改正"]},{"h":"戦後体制","items":["パリ講和会議・ヴェルサイユ条約（1919）","国際連盟（1920）","ワシントン会議（1921〜22）"]}],"flow":{"title":"大正期の政治と外交","steps":["1912 第2次西園寺内閣総辞職","1913 大正政変","1914 参戦・シーメンス事件","1915 二十一カ条","1917 西原借款・石井・ランシング協定","1918 シベリア出兵・米騒動・原内閣","1919 パリ講和会議","1921 ワシントン会議開会","1922 九カ国条約・山東返還"]},"tables":[{"title":"ワシントン会議の3条約","head":["条約","内容","影響"],"rows":[["四カ国条約","太平洋の現状維持","日英同盟廃棄"],["九カ国条約","中国の主権尊重・門戸開放","日本の権益に制約"],["海軍軍縮条約","主力艦5・5・3","日本は6割"]]}]}},"近代|政党政治と恐慌":{"pts":["1923年関東大震災。虎の門事件で第2次山本内閣が総辞職し、清浦奎吾の貴族院内閣が第2次護憲運動を招く。","1924年の総選挙で護憲三派（憲政会・政友会・革新倶楽部）が勝利し、加藤高明内閣が成立。","加藤内閣は普通選挙法（1925、満25歳以上の男子）と治安維持法を制定。日ソ基本条約で国交樹立、宇垣軍縮を実施。","憲政の常道：政友会と憲政会（のち民政党）が交代で政権を担当。","1927年の金融恐慌で若槻内閣が倒れ、田中義一内閣がモラトリアム。山東出兵・張作霖爆殺事件（1928）。","田中内閣は三・一五事件・治安維持法改正（死刑追加）・不戦条約。浜口内閣は協調外交（幣原）、ロンドン海軍軍縮条約（統帥権干犯問題）。","浜口内閣の金解禁（1930、旧平価）と世界恐慌で昭和恐慌。重要産業統制法（1931）。"],"traps":["金融恐慌で倒れたのは若槻内閣。田中内閣は恐慌後に成立。","張作霖爆殺は関東軍、田中内閣期。","護憲三派に国民党は含まれず、革新倶楽部。","治安維持法は普通選挙法と同年。最高刑の死刑は1928年追加。","緊急勅令案を否決したのは枢密院。","金解禁は旧平価。新平価ではない。"],"rel":["近代|大正政治と第一次世界大戦","近代|満州事変と日中戦争・太平洋戦争","文化|近代の文化と学問・教育"],"bridge":"政党内閣の時代は、普選と治安維持法、協調外交と大陸政策、金融恐慌と昭和恐慌という矛盾を抱え、満州事変以降の軍部台頭へつながる。","sys":{"overview":"護憲三派内閣と普通選挙、憲政の常道、金融恐慌から昭和恐慌までの経済政策と外交を整理する。","tree":[{"h":"政党内閣の成立","items":["清浦内閣と第2次護憲運動","護憲三派内閣（加藤高明）","憲政の常道"]},{"h":"加藤内閣の政策","items":["普通選挙法（1925）","治安維持法（1925）","日ソ基本条約・宇垣軍縮"]},{"h":"田中内閣","items":["山東出兵・済南事件","張作霖爆殺事件（1928）","治安維持法改正・特高"]},{"h":"恐慌","items":["金融恐慌（1927）・モラトリアム","金解禁（1930）","昭和恐慌・重要産業統制法（1931）"]}],"flow":{"title":"政党政治と恐慌","steps":["1923 関東大震災","1924 護憲三派内閣","1925 普通選挙法・治安維持法・日ソ基本条約","1927 金融恐慌","1928 張作霖爆殺・三・一五事件","1930 金解禁・ロンドン条約","1931 重要産業統制法"]},"tables":[{"title":"護憲三派","head":["政党","党首"],"rows":[["憲政会","加藤高明"],["立憲政友会","高橋是清"],["革新倶楽部","犬養毅"]]},{"title":"憲政の常道の首相","head":["内閣","政党","出来事"],"rows":[["加藤高明・第1次若槻","憲政会","普選・金融恐慌"],["田中義一","政友会","山東出兵"],["浜口雄幸","民政党","金解禁・ロンドン条約"]]}]}},"近代|満州事変と日中戦争・太平洋戦争":{"pts":["1931年柳条湖事件で満州事変。1932年に満州国建国、リットン調査団を経て1933年に国際連盟脱退。","犬養毅内閣の高橋是清は金輸出再禁止・管理通貨制度。五・一五事件（1932）で犬養が暗殺され、政党内閣が終わる。","滝川事件（1933）、天皇機関説事件・国体明徴声明（1935）。二・二六事件（1936）後に現役武官制復活。","1937年盧溝橋事件で日中戦争。南京占領、近衛声明、汪兆銘政権。国家総動員法（1938）、大政翼賛会（1940）。","1940年日独伊三国同盟、1941年日ソ中立条約。南部仏印進駐で米が資産凍結・石油禁輸。","ハル＝ノートを受け、東条内閣が1941年12月に開戦。ミッドウェー（1942）で転機、サイパン陥落（1944）で東条内閣総辞職。","1945年に沖縄戦・原爆・ソ連参戦を経て、ポツダム宣言を受諾。"],"traps":["満州事変の発端は柳条湖、日中戦争は盧溝橋。","二・二六事件は陸軍皇道派、五・一五事件は海軍青年将校。","国際連盟脱退は1933年。","国家総動員法は第1次近衛内閣。","日ソ中立条約は松岡洋右、降伏文書調印は重光葵。","日満議定書は斎藤実内閣。犬養内閣ではない。"],"rel":["近代|政党政治と恐慌","現代|占領と民主化","近代|日露戦争と韓国併合"],"bridge":"恐慌後の軍部台頭と大陸進出が戦争の長期化を招き、敗戦による占領と民主化が現代日本の出発点となる。","sys":{"overview":"満州事変から敗戦までの国内政治・外交・戦時体制・戦局の推移を整理する。","tree":[{"h":"満州事変","items":["柳条湖事件（1931）","満州国（1932）","リットン調査団・連盟脱退（1933）","塘沽停戦協定（1933）"]},{"h":"国内の動き","items":["五・一五事件（1932）","国体明徴声明（1935）","二・二六事件（1936）","大政翼賛会（1940）"]},{"h":"日中戦争","items":["盧溝橋事件（1937）","南京占領（1937.12）","近衛声明（1938）","国家総動員法（1938）"]},{"h":"太平洋戦争","items":["三国同盟（1940）・日ソ中立条約（1941）","南部仏印進駐・石油禁輸","開戦（1941.12）","ポツダム宣言受諾（1945.8）"]}],"flow":{"title":"満州事変から敗戦","steps":["1931 柳条湖事件","1932 満州国・五・一五事件","1933 連盟脱退","1936 二・二六事件","1937 盧溝橋事件","1938 国家総動員法","1940 三国同盟・大政翼賛会","1941 日ソ中立条約・開戦","1942 ミッドウェー","1944 サイパン陥落","1945 ポツダム宣言受諾"]},"tables":[{"title":"事件と主体","head":["事件","主体","年"],"rows":[["柳条湖事件","関東軍","1931"],["五・一五事件","海軍青年将校","1932"],["二・二六事件","陸軍皇道派","1936"],["盧溝橋事件","日中両軍の衝突","1937"]]}]}},"現代|占領と民主化":{"pts":["占領はGHQ（最高司令官マッカーサー）が日本政府に指令・勧告を出す間接統治。沖縄・奄美・小笠原は米軍の直接統治。","最高決定機関は極東委員会（ワシントン）、諮問機関は対日理事会（東京）。","五大改革指令（1945年10月）：婦人参政権・労働組合の助長・教育の自由主義化・圧政的諸制度の撤廃・経済の民主化。","経済の民主化は財閥解体（持株会社整理委員会）・農地改革（第2次で1町歩まで、国が買収して小作人に売渡）・独占禁止法。","日本国憲法は1946年11月3日公布、1947年5月3日施行。教育基本法・民法改正・労働三法も整備された。","東京裁判で東条英機ら7人が絞首刑。公職追放・天皇の人間宣言（1946年1月）も実施された。"],"traps":["極東委員会（ワシントン）と対日理事会（東京）の所在・性格の取り違え。","第1次農地改革（5町歩）と第2次農地改革（1町歩）の混同。無償没収ではなく国の買上げ。","労働三法（組合法・調整法・基準法）の内容と年次の取り違え。","芦田内閣・片山内閣・吉田内閣の事件の帰属（傾斜生産・政令201号など）の入れ替え。"],"rel":["現代|講和と55年体制","現代|高度経済成長","近代|満州事変と日中戦争・太平洋戦争"],"bridge":"占領期の民主化は、講和後の独立と55年体制の前提になる。占領政策の転換（逆コース）が講和・再軍備につながる。","sys":{"overview":"敗戦から1950年ごろまでの占領下で進められた非軍事化・民主化改革。政治・経済・教育・社会の各面の改革と、新憲法の成立を押さえる。","tree":[{"h":"占領の仕組み","items":["GHQ最高司令官：マッカーサー","極東委員会：ワシントン","対日理事会：東京（諮問機関）","間接統治（沖縄・小笠原は直接統治）"]},{"h":"政治・憲法","items":["婦人参政権（1945年12月）","日本国憲法 公布46.11.3／施行47.5.3","地方自治法で知事公選","刑法・民法の改正（家制度廃止）"]},{"h":"経済の民主化と復興","items":["財閥解体：持株会社整理委員会","農地改革：第2次は1町歩・有償買上げ","独占禁止法・過度経済力集中排除法","傾斜生産方式（石炭・鉄鋼）"]},{"h":"労働・教育","items":["労働組合法（1945）","労働関係調整法（1946）","労働基準法（1947）","教育基本法・学校教育法（六三三四制）"]},{"h":"戦争責任・内閣","items":["東京裁判（1946〜48）","公職追放（1946）","片山内閣（社会党首班）","芦田内閣（昭電事件で総辞職）"]}],"flow":{"title":"占領と改革の流れ","steps":["1945.8 ポツダム宣言受諾・マッカーサー着任","1945.10 五大改革指令","1946.1 天皇の人間宣言","1946.11 日本国憲法公布","1947.5 憲法施行・片山内閣","1948 芦田内閣・政令201号"]},"tables":[{"title":"農地改革の比較","head":["改革","基準","特色"],"rows":[["第1次（1945）","不在地主の全小作地・在村地主5町歩超","不徹底"],["第2次（1946〜）","不在地主の全小作地・在村地主1町歩超（北海道4町歩）","国が買収し小作人に売渡"]]},{"title":"労働三法","head":["法律","年","内容"],"rows":[["労働組合法","1945","団結権・団体交渉権・争議権"],["労働関係調整法","1946","争議の斡旋・調停・仲裁"],["労働基準法","1947","労働条件の最低基準"]]}]}},"現代|講和と55年体制":{"pts":["朝鮮戦争（1950年）で警察予備隊が創設され、保安隊（1952年）を経て、MSA協定を受け自衛隊（1954年）が発足した。","サンフランシスコ平和条約は1951年調印・1952年発効。吉田茂が首席全権で、ソ連などは不参加。","条約で朝鮮の独立承認、台湾・千島・南樺太の放棄。沖縄・小笠原は米国施政下に置かれた。","同日に旧日米安保条約を調印。米軍の駐留は認めたが、日本防衛の義務は明記されなかった。","1955年に保守合同で自由民主党、左右社会党の統一で、55年体制が成立した。","鳩山内閣が日ソ共同宣言（1956年）で国交回復し、国連加盟を実現。岸内閣が1960年に新安保条約を結び、安保闘争の末に総辞職した。"],"traps":["日ソ共同宣言は国交回復のみで平和条約は未締結。","旧安保と新安保の違い（防衛義務・事前協議制）を逆にしない。","警察予備隊（1950）・保安隊（1952）・自衛隊（1954）の順序と年次。","奄美（1953）・小笠原（1968）・沖縄（1972）の返還順。"],"rel":["現代|占領と民主化","現代|戦後外交（日米・日中・日韓）","現代|高度経済成長"],"bridge":"講和で独立を回復し、保守合同で55年体制が成立する。日米安保と再軍備は戦後外交の基本となる。","sys":{"overview":"占領の終結から1960年の安保改定まで。独立回復の条件、再軍備の段階、保守合同と55年体制、日ソ国交回復、新安保条約を整理する。","tree":[{"h":"講和","items":["吉田茂が首席全権","ソ連・ポーランド・チェコは不調印","台湾・千島・南樺太の放棄","沖縄・小笠原は米国施政下"]},{"h":"再軍備","items":["警察予備隊1950","保安隊1952","MSA協定・自衛隊1954","防衛庁の設置"]},{"h":"55年体制","items":["保守合同＝自由民主党","左右社会党の統一","鳩山内閣＝日ソ国交回復","国連加盟（1956年12月）"]},{"h":"安保体制","items":["旧安保（1951）：防衛義務なし","日米行政協定→地位協定","新安保（1960）：防衛義務・事前協議","岸内閣は自然成立後に総辞職"]},{"h":"その他","items":["破壊活動防止法（1952）","第五福竜丸事件（1954）","教育委員の公選制廃止（1956）","池田内閣の所得倍増計画"]}],"flow":{"title":"講和から安保改定まで","steps":["1950 朝鮮戦争・警察予備隊","1951 講和・安保条約調印","1952 独立回復・保安隊","1954 自衛隊発足","1955 保守合同","1956 日ソ共同宣言・国連加盟","1960 新安保条約"]},"tables":[{"title":"旧安保と新安保","head":["項目","旧安保（1951）","新安保（1960）"],"rows":[["防衛義務","米国に明記なし","米国の日本防衛義務を明記"],["事前協議","なし","米軍の重要な配置変更等は事前協議"],["期限","なし","10年後は一方の通告で1年後に終了"]]}]}},"現代|高度経済成長":{"pts":["1955〜57年の神武景気、岩戸景気、オリンピック景気、いざなぎ景気（1965〜70年）と続き、1968年にGNPは資本主義国第2位。","1956年の経済白書は「もはや戦後ではない」。池田内閣は1960年に国民所得倍増計画を決定した。","エネルギー革命で石炭から石油へ。三井三池争議（1959〜60年）が象徴する。","1964年に東海道新幹線開通・東京オリンピック・IMF8条国移行・OECD加盟。","農村は過疎、都市は過密。農業基本法（1961年）のもとで兼業化が進んだ。","公害：水俣病・新潟水俣病・四日市ぜんそく・イタイイタイ病。公害対策基本法（1967年）、環境庁（1971年）。"],"traps":["三種の神器（洗濯機・冷蔵庫・白黒テレビ）と3C（自動車・クーラー・カラーテレビ）の取り違え。","公害の場所・原因物質（有機水銀・カドミウム・大気汚染）の入れ替え。","好景気の順序（神武→岩戸→オリンピック→いざなぎ）。","GATT加盟（1955）とIMF8条国・OECD（1964）の混同。"],"rel":["現代|講和と55年体制","現代|石油危機以後・平成","現代|戦後外交（日米・日中・日韓）"],"bridge":"高度成長は石油危機で終わる。公害や過疎・過密の問題は、のちの環境行政や地域政策につながる。","sys":{"overview":"1950年代半ばから1973年ごろまでの高い経済成長。景気の順序、政策、産業・社会の変化、公害問題をまとめて覚える。","tree":[{"h":"景気","items":["神武景気1955〜57","岩戸景気1958〜61","オリンピック景気1962〜64","いざなぎ景気1965〜70"]},{"h":"政策","items":["所得倍増計画（池田・1960）","貿易自由化計画大綱（1960）","全国総合開発計画（1962）","農業基本法（1961）"]},{"h":"国際化","items":["GATT加盟1955","IMF8条国・OECD 1964","GNP世界第2位 1968","大阪万博 1970"]},{"h":"社会の変化","items":["エネルギー革命","過疎・過密・核家族化","国民皆保険・皆年金 1961","革新自治体（美濃部都政）"]},{"h":"公害","items":["水俣病：熊本・有機水銀","新潟水俣病：阿賀野川","四日市ぜんそく：三重・大気","イタイイタイ病：富山・カドミウム"]}],"flow":{"title":"高度成長の主な出来事","steps":["1955 神武景気・GATT加盟","1956 もはや戦後ではない","1960 所得倍増計画","1964 東京五輪・新幹線","1967 公害対策基本法","1968 GNP世界2位","1970 大阪万博"]},"tables":[{"title":"四大公害病","head":["病名","場所","原因"],"rows":[["水俣病","熊本県水俣","有機水銀"],["新潟水俣病","新潟県阿賀野川","有機水銀"],["四日市ぜんそく","三重県四日市","亜硫酸ガス（大気汚染）"],["イタイイタイ病","富山県神通川","カドミウム"]]}]}},"現代|戦後外交（日米・日中・日韓）":{"pts":["日米：旧安保（1951）→新安保（1960）。佐藤内閣は非核三原則を表明し（1967年）、1972年に沖縄返還を実現した。","日韓：日韓基本条約（1965年、佐藤内閣）。韓国政府を朝鮮半島唯一の合法政府と承認し、経済協力を約束した。","日中：日中共同声明（1972年、田中角栄首相）で国交正常化。日中平和友好条約は1978年（福田赳夫内閣）。","日中共同声明で中華人民共和国を中国の唯一の合法政府と承認し、日華平和条約は終了。","日米経済摩擦：繊維→鉄鋼・自動車→半導体。牛肉・オレンジの自由化は1991年。","冷戦後は湾岸戦争（資金提供）、PKO協力法（1992年）、日米安保共同宣言（1996年）、周辺事態法（1999年）。"],"traps":["日中共同声明（1972年・田中）と日中平和友好条約（1978年・福田）の取り違え。","日韓基本条約が承認したのは韓国のみ。請求権問題の位置づけ。","沖縄返還の年（1972年）と協定の年（1971年）、佐藤・ニクソン会談（1969年）。","旧ガイドライン（1978年）と新ガイドライン（1997年）。"],"rel":["現代|講和と55年体制","現代|石油危機以後・平成","近代|日露戦争と韓国併合"],"bridge":"戦後外交は日米同盟を軸に、近隣諸国との国交正常化を進める形で展開した。冷戦後は自衛隊の国際貢献が課題となる。","sys":{"overvie function fieldStats(){const o={};FIELDS.forEach(([f])=>o[f]={n:0,c:0,q:0,tot:0,rn:0,rc:0});
  BANK.forEach(q=>{const s=o[q.f];s.tot++;const h=H[q.k];if(h){s.n+=h.n;s.c+=h.c;s.q++}});
  // 直近：論点ごとの直近10問を分野でまとめる
  Object.keys(R10).forEach(t=>{const f=t.split("|")[0];if(!o[f])return;const r=R10[t];o[f].rn+=r.length;o[f].rc+=(r.match(/1/g)||[]).length});return o}

  topicStats().forEach(s=>{if(!s.rn)return;const r=o[s.f];r.n+=s.rn;r.c+=adjustTopic(s.rc,s.rn,s.c,s.n)*s.rn});
  FIELDS.forEach(([f])=>{const r=o[f],x=st[f];if(!r.n){r.n=x.n;r.c=x.c}r.adj=r.n?r.c/r.n:0});return o}
// 水準ごとの成績：直近10問（RL）を全回答の正答率で補正。直近の記録がない水準は各問の最後の結果で補う
function levelStats(){const o=PASS.levels.map((_,i)=>({lv:i+1,n:0,c:0,rn:0,rc:0,adj:0,cnt:0})),last=o.map(()=>"");

  o.forEach((s,i)=>{const r=RL[String(s.lv)]||last[i].slice(-10);s.rn=r.length;s.rc=(r.match(/1/g)||[]).length;s.adj=adjustTopic(s.rc,s.rn,s.c,s.n);s.cnt=s.rn||s.n});return o}
const EXAM_N=(()=>{const o={};FIELDS.forEach(([f])=>o[f]=0);MIX.forEach(m=>Object.keys(m).forEach(f=>o[f]=(o[f]||0)+m[f]));return o})();

    <article class="card"><div class="meta">問${E.cur+1}　${FIELDS.find(x=>x[0]===q.f)[1]}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn ${E.ans[E.cur]===1?"sel":""}" id="o" ${E.ans[E.cur]!=null?"disabled":""}>○</button><button class="btn ${E.ans[E.cur]===0?"sel":""}" id="x" ${E.ans[E.cur]!=null?"disabled":""}>×</button></div>
    ${E.ans[E.cur]!=null?(()=>{const ok=E.ans[E.cur]===q.a;return `<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答え：${q.a?"○":"×"}　<span class="note">${q.t}　${q.ref==="確認"?"確認問題":q.ref}</span></span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div>`})():""}
    <div class="row" style="justify-content:space-between"><button class="btn" id="prev" ${E.cur?"":"disabled"}>前へ</button><button class="btn ${E.ans[E.cur]!=null?"pri":""}" id="next">${E.cur<E.qs.length-1?"次へ":"採点する"}</button></div></article>
    <div id="cf"></div>`;
    const choose=v=>{
      // 1問ごとにその場で正誤と解説を表示（答えは確定）。10問テスト・分野別とも同じ
      if(E.ans[E.cur]!=null)return;E.ans[E.cur]=v;const q0=E.qs[E.cur];render();if(voice)speak((v===q0.a?"正解。":"不正解。")+"答えは"+(q0.a?"まる":"ばつ")+"。"+q0.e)};
    $("#o").onclick=()=>choose(1);$("#x").onclick=()=>choose(0);
    $("#prev").onclick=()=>{E.cur--;render()};

    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    document.querySelectorAll(".dot").forEach(d=>d.onclick=()=>{E.cur=+d.dataset.k;render()});
  };
  const askFinish=()=>{const un=E.ans.filter(a=>a==null).length;if(!un){finish();return}
    $("#cf").innerHTML=`<div class="confirm row"><span>未回答が${un}問あります。未回答は不正解になります。</span><button class="btn" id="yes">採点する</button><button class="btn" id="no">続ける</button></div>`;
    $("#yes").onclick=finish;$("#no").onclick=()=>$("#cf").innerHTML=""};
  const finish=()=>{clearInterval(timerId);if(canSpeak)speechSynthesis.cancel();
    const used=LIMIT-E.left;let sc=0;E.qs.forEach((q,k)=>{const ok=E.ans[k]===q.a;if(ok)sc++;rec(q,ok)});
    const at=new Date(Date.now()+9*3600e3).toISOString().slice(0,19);
    if(E.field){LOG.push({at,round:0,field:E.field,score:sc,sec:used});save();result(E,sc,used,null);return}
    LOG.push({at,round:SET.round+1,score:sc,sec:used});
    // このセットで出した論点を記録し、セットが終わったら出し切れなかった論点を次のセットへ持ち越す
    SET.topics=[...new Set([...(SET.round===0?[]:SET.topics||[]),...E.qs.map(q=>q.f+"|"+q.t)])];
    SET.scores[SET.round]=sc;SET.round=(SET.round+1)%5;const setDone=SET.round===0;const setScores=[...SET.scores];
    if(setDone){const allT=[...new Set(BANK.map(q=>q.f+"|"+q.t))];SET.carry=allT.filter(k=>!SET.topics.includes(k));SET.topics=[];SET.scores=[]}save();
    result(E,sc,used,setDone?setScores:null)};
  render(); if(voice)speak(E.qs[0].s);
  clearInterval(timerId);
  timerId=setInterval(()=>{E.left--;const t=$("#tm");if(t){t.textContent=Math.floor(E.left/60)+":"+String(E.left%60).padStart(2,"0");if(E.left<=60)t.classList.add("low")}if(E.left<=0){clearInterval(timerId);finish()}},1000);
  window.scrollTo(0,0);

function judge(sc){return sc>=8?["j-ok","合格圏"]:sc===7?["j-mid","合格ライン上"]:["j-ng","要復習"]}
function result(E,sc,used,setScores){

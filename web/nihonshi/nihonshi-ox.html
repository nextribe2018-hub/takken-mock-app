<title>日本史 10分模試</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: ホーム（合格の見込み3水準・5回セット・論点マップ）→ 試験画面（タイマー＋1問ずつ）→ 結果 → 解説と確認例題3問 */
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1f2a2e; --muted:#5d6a6e; --line:#d9ded9;
  --ai:#24476b; --ai-soft:#e3ebf3; --ok:#2f7a4b; --ok-soft:#e2f1e7; --ng:#b8402c; --ng-soft:#f8e4df; --warn:#9a6b12; --warn-soft:#f6ecd6; --or:#b85a16; --or-soft:#fbe5d3;
  --f-disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; --or:#f0a060; --or-soft:#3f2a1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; --or:#f0a060; --or-soft:#3f2a1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-disp);font-weight:800;font-size:1.7rem;margin:0}
h2{font-family:var(--f-disp);font-size:1.15rem;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:.88rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-weight:700;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ai)}
.btn.pri{background:var(--ai);color:var(--paper);border-color:var(--ai)}
.btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.slot b{display:block;font-size:1.05rem;font-family:var(--f-disp)}
.slot.now{border-color:var(--ai);background:var(--ai-soft)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kp{background:var(--bg);border-radius:8px;padding:10px 12px}
.kp span{font-size:.78rem;color:var(--muted)} .kp b{display:block;font-size:1.3rem;font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.topics{display:flex;flex-direction:column;gap:14px}
.tgroup h3{font-size:.85rem;margin:0 0 6px;color:var(--muted);letter-spacing:.05em}
.tlist{display:flex;flex-wrap:wrap;gap:6px}
.tp{font:inherit;font-size:.8rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.tp.t-none{opacity:.75}
.tp.t-perfect{--c:var(--ok);--b:var(--ok);background:var(--ok);border-color:var(--ok);color:var(--paper);font-weight:700}
.tp.t-good{--c:var(--ok);--b:var(--ok-soft)}
.tp.t-mid{--c:var(--warn);--b:var(--warn-soft)}
.tp.t-low{--c:var(--or);--b:var(--or-soft)}
.tp.t-bad{--c:var(--ng);--b:var(--ng-soft)}
.tp.t-good,.tp.t-mid,.tp.t-low,.tp.t-bad{background:var(--b);border-color:var(--c);color:var(--c)}
.tp.few{border-style:dashed;background:color-mix(in srgb,var(--b) 45%,var(--paper));border-color:color-mix(in srgb,var(--c) 55%,var(--paper));font-weight:400}
.tp.t-perfect.few{color:var(--ink);background:color-mix(in srgb,var(--ok) 28%,var(--paper));border-color:var(--ok)}
.tp.few .tpr small{font-weight:700}
.lg{display:inline-block;font-size:.72rem;padding:0 7px;border-radius:999px;border:1px solid var(--line);margin:2px 2px 0 0;cursor:default}
.legend{font-size:.75rem;color:var(--muted)}
.exam-top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2;border-bottom:1px solid var(--line)}
.timer{font-family:var(--f-disp);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ng)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:.7rem;display:grid;place-items:center;font-variant-numeric:tabular-nums;cursor:pointer;background:var(--paper);color:var(--ink)}
.dot.ans{background:var(--ai-soft);border-color:var(--ai)}
.dot.cur{outline:2px solid var(--ai)}
.meta{font-size:.75rem;letter-spacing:.05em;color:var(--ai);font-weight:700}
.stmt{font-size:1.05rem;margin:0}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .btn{font-size:1.5rem;padding:10px}
.ox .btn.sel{background:var(--ai);color:var(--paper);border-color:var(--ai)}
.res{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.res.ok{background:var(--ok-soft)} .res.ng{background:var(--ng-soft)}
.v{font-weight:700} .res.ok .v{color:var(--ok)} .res.ng .v{color:var(--ng)}
.memo{font-size:.86rem;color:var(--muted)} .memo b{color:var(--ink)}
.big{font-family:var(--f-disp);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.judge{display:inline-block;font-weight:700;padding:3px 12px;border-radius:999px;font-size:.9rem}
.j-ok{background:var(--ok-soft);color:var(--ok)} .j-mid{background:var(--warn-soft);color:var(--warn)} .j-ng{background:var(--ng-soft);color:var(--ng)}
.rv{display:flex;flex-direction:column;gap:10px}
.ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.trap{background:var(--warn-soft);border-radius:8px;padding:10px 12px}
.trap b{color:var(--warn)}
.relg{display:flex;flex-direction:column;gap:10px}
.relg .ul{font-size:.9rem}
/* 体系解説：全体像ツリー・流れ図・比較表 */
.ov{margin:0;font-size:.95rem}
.systree{display:flex;flex-direction:column}
.sysroot{align-self:flex-start;background:var(--ai);color:var(--paper);font-weight:700;border-radius:10px;padding:8px 14px;font-family:var(--f-disp);font-size:1.05rem}
.sysbr{position:relative;margin-left:16px;padding:12px 0 0 18px;display:flex;flex-direction:column;gap:10px}
.sysbr::before{content:"";position:absolute;left:0;top:0;bottom:24px;border-left:2px solid var(--line)}
.br{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.br::before{content:"";position:absolute;left:-19px;top:22px;width:18px;border-top:2px solid var(--line)}
.br h4{margin:0 0 4px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.br h4 .no{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--ai-soft);color:var(--ai);font-size:.75rem;font-variant-numeric:tabular-nums}
.br ul{margin:0;padding-left:1.1em;font-size:.88rem;line-height:1.65}
.br.hit{border-color:var(--ng);border-width:2px;background:var(--ng-soft)}
.br.hit::before{border-top-color:var(--ng)}
.br .tag{font-size:.72rem;font-weight:700;color:var(--paper);background:var(--ng);border-radius:999px;padding:1px 8px}
.br li.hit{font-weight:700;color:var(--ng)}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flow li{position:relative;display:flex;gap:12px;align-items:flex-start;padding-bottom:12px}
.flow li:last-child{padding-bottom:0}
.flow li:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;border-left:2px solid var(--ai)}
.flow .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ai);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.flow .s{padding-top:3px;font-size:.92rem}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
.st{border-collapse:collapse;width:100%;font-size:.84rem;line-height:1.5;min-width:100%}
.st caption{text-align:left;font-weight:700;padding:0 0 6px;font-size:.9rem}
.st th{background:var(--ai-soft);color:var(--ink);text-align:left;font-weight:700;padding:7px 9px;white-space:nowrap;border-bottom:1px solid var(--line)}
.st td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}
.st td:first-child{font-weight:700;min-width:6.5em}
.st tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.st .o{color:var(--ok);font-weight:700}.st .x{color:var(--ng);font-weight:700}
.tbls{display:flex;flex-direction:column;gap:14px}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font:inherit;font-size:.82rem;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mchip .no{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;background:var(--ai-soft);color:var(--ai);font-size:.7rem;font-weight:700}
.mchip.on{border-color:var(--ng);background:var(--ng-soft);color:var(--ng);font-weight:700}
.mchip.rel{border-style:dashed;color:var(--ai)}
.deeplink{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-color:var(--ai);color:var(--ai)}
.deeplink::after{content:"→";position:absolute;right:16px}
.deeplink{position:relative;padding-right:36px}
.sub2{font-size:.78rem;font-weight:500;color:var(--muted)}
.br.focus{outline:3px solid var(--ai);outline-offset:2px}
.card>.br::before{display:none}
.tpr{font-size:.92em}.tpr small{opacity:.7;margin-left:1px}
.lbs{display:flex;gap:3px;margin-top:3px}.lb{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;font-size:.7rem;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.lb.okd{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.lb.ngd{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}.lb.mi{border-style:dashed}
.lnk{font:inherit;background:none;border:0;padding:0;color:var(--ai);text-decoration:underline;cursor:pointer;text-align:left}
.exb{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.exb.near{border-color:var(--ai);background:var(--ai-soft)}
.exb p{margin:0}.exb .exp{font-weight:700}
.exb .tag{align-self:flex-start;font-size:.72rem;font-weight:700;color:var(--ai);border:1px solid var(--ai);border-radius:999px;padding:0 8px}
.cpt{color:var(--warn)}
.more{display:flex;flex-direction:column;gap:8px}.more summary{cursor:pointer;color:var(--ai);font-weight:700;padding:4px 0}.more[open]>.exb{margin-top:8px}
.ard{margin:0;display:grid;gap:8px}.ard dt{font-weight:700}.ard dd{margin:0;color:var(--ink)}
.fourcard{font:inherit;color:inherit;background:none;border:0;padding:0;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;cursor:pointer}
.fourcard .fc-l{display:flex;flex-direction:column;gap:2px}.fourcard .fc-t{font-family:var(--f-disp);font-weight:700;font-size:1.15rem}
.fourcard .fc-r{display:flex;flex-direction:column;align-items:flex-end}.fourcard .fc-r .fp{font-size:1.8rem;line-height:1.1}
.fourcard:focus-visible{outline:2px solid var(--ai);outline-offset:4px}
.fp{font-size:1.25rem;font-family:var(--f-disp)}
.vok{color:var(--ok)}.vmid{color:var(--warn)}.vng{color:var(--ng)}
.dot.okd{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.ngd{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.pbar,.mbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i,.mbar i{display:block;height:100%;background:var(--ai);border-radius:999px}
.st tr.focus td{background:var(--warn-soft)}
.fx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fx .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.sync{font-size:.78rem;margin:4px 0 0;color:var(--muted)}
.sync[data-s="ok"]{color:var(--ok)}
.sync[data-s="err"]{color:var(--ng)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:1.4fr .8fr .9fr 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem;font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--muted)}
.confirm{background:var(--ng-soft);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.res{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<script>
const BANK=[{"f":"古代","t":"律令国家の成立","ref":"KO-9001","lv":1,"s":"大宝律令は701年に完成した。","a":1,"e":"（サンプル）大宝律令は701年、文武天皇のもとで完成した。律は刑法、令は行政法などにあたり、これで律令国家の仕組みが整った。","m":"なおい（701）大宝律令","y":701},{"f":"古代","t":"律令国家の成立","ref":"KO-9002","lv":2,"s":"大宝律令の編纂の中心となったのは、刑部親王と藤原不比等である。","a":1,"e":"（サンプル）大宝律令は刑部親王と藤原不比等らが中心となって編纂した。不比等はのちの養老律令の編纂にも関わった。","m":"大宝＝刑部親王＋不比等","y":701},{"f":"古代","t":"律令国家の成立","ref":"KO-9003","lv":2,"s":"律令制で郡を治める郡司には、中央の貴族が任期つきで派遣された。","a":0,"e":"（サンプル）誤り：郡司は中央から派遣されない。正しくは、郡司には地方の豪族が任じられ終身制であった。中央から任期つきで派遣されたのは国司である。","m":"国司は中央・郡司は地元"},{"f":"古代","t":"律令国家の成立","ref":"KO-9004","lv":1,"s":"班田収授法では、口分田は6歳以上の男子にのみ与えられた。","a":0,"e":"（サンプル）誤り：口分田は男子だけではない。正しくは、6歳以上の男女に与えられ、女子は男子の3分の2であった。","m":"口分田 男2段・女はその2/3"},{"f":"古代","t":"律令国家の成立","ref":"KO-9005","lv":3,"s":"庸は、都での労役の代わりに布などを納める税で、正丁などに課された。","a":1,"e":"（サンプル）庸は歳役（都での年10日の労役）の代わりに布などを納める税で、成人男子に課された。調・庸は運脚によって都まで運ばれた。","m":"庸＝労役の代わりに布"},{"f":"古代","t":"律令国家の成立","ref":"KO-9006","lv":3,"s":"八省のうち、文官の人事や大学の管理を担当したのは兵部省である。","a":0,"e":"（サンプル）誤り：兵部省は武官の人事や軍事を担当した。正しくは、文官の人事や大学を担当したのは式部省である。","m":"文官＝式部・武官＝兵部"},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-9001","lv":1,"s":"源頼朝は1185年、守護・地頭の設置を朝廷に認めさせた。","a":1,"e":"（サンプル）1185年、源頼朝は源義経の追討を名目に、国ごとに守護、荘園・公領に地頭を置くことを朝廷に認めさせた。","m":"1185 守護・地頭","y":1185},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-9002","lv":2,"s":"御成敗式目は1232年、執権北条時頼によって制定された。","a":0,"e":"（サンプル）誤り：制定したのは北条時頼ではない。正しくは3代執権北条泰時で、御家人の裁判の基準として51か条を定めた。","m":"1232 泰時の式目51か条","y":1232},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-9003","lv":2,"s":"承久の乱の後、朝廷の監視などのため京都に六波羅探題が置かれた。","a":1,"e":"（サンプル）承久の乱（1221年）の後、幕府は京都に六波羅探題を置き、朝廷の監視と西国御家人の統轄にあたらせた。","m":"承久の乱→六波羅探題","y":1221},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-9004","lv":3,"s":"評定衆は、北条泰時が執権のときに設置された。","a":1,"e":"（サンプル）北条泰時は1225年に評定衆を置き、有力御家人らの合議で政治や裁判を行う体制を整えた。連署も同じ時期に置かれた。","m":"泰時＝連署・評定衆・式目","y":1225},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-9005","lv":3,"s":"引付衆は北条義時が執権のときに設置され、所領に関する訴訟を担当した。","a":0,"e":"（サンプル）誤り：引付衆を置いたのは北条義時ではない。正しくは1249年、5代執権北条時頼が設置し、御家人の所領訴訟の迅速化を図った。","m":"時頼＝引付衆","y":1249},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-9006","lv":1,"s":"承久の乱を起こしたのは後白河上皇である。","a":0,"e":"（サンプル）誤り：後白河上皇ではない。正しくは1221年、後鳥羽上皇が北条義時追討の院宣を出して挙兵したが、幕府軍に敗れた。","m":"承久＝後鳥羽","y":1221},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-9001","lv":1,"s":"享保の改革を行ったのは、5代将軍徳川綱吉である。","a":0,"e":"（サンプル）誤り：綱吉ではない。正しくは享保の改革は8代将軍徳川吉宗が1716年から進めた。綱吉は文治政治・元禄期の将軍である。","m":"享保＝8代吉宗","y":1716},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-9002","lv":1,"s":"徳川吉宗は、庶民の意見を聞くため目安箱を設置した。","a":1,"e":"（サンプル）吉宗は評定所の前に目安箱を置き、庶民の意見を取り入れた。投書をもとに小石川養生所が設けられた。","m":"目安箱→小石川養生所","y":1721},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-9003","lv":3,"s":"上げ米では、参勤交代の江戸在府期間を半年に縮める代わりに、1万石につき100石の米を上納させた。","a":1,"e":"（サンプル）上げ米（1722年）は財政難への対策で、大名に1万石につき100石を上納させ、その代わりに江戸在府期間を半年に短縮した。","m":"上げ米 1万石に100石","y":1722},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-9004","lv":2,"s":"公事方御定書は、田沼意次の時代に編纂された裁判の基準である。","a":0,"e":"（サンプル）誤り：田沼時代ではない。正しくは公事方御定書は徳川吉宗の享保の改革のもとで1742年に完成した、裁判や刑罰の基準である。","m":"御定書＝吉宗","y":1742},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-9005","lv":2,"s":"田沼意次は株仲間を広く公認し、運上や冥加を徴収した。","a":1,"e":"（サンプル）田沼意次は商業の力を利用する政策をとり、株仲間を広く公認して運上・冥加などの営業税を徴収した。","m":"田沼＝株仲間で税"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-9006","lv":3,"s":"田沼意次は蝦夷地の開発を計画し、調査のため間宮林蔵を派遣した。","a":0,"e":"（サンプル）誤り：田沼時代に派遣されたのは間宮林蔵ではない。正しくは最上徳内らで、間宮林蔵の樺太探査は19世紀初め（1808年）である。","m":"田沼の蝦夷地調査＝最上徳内","y":1785},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-9001","lv":1,"s":"1894年、陸奥宗光外相のもとで日英通商航海条約が調印され、領事裁判権が撤廃された。","a":1,"e":"（サンプル）1894年、陸奥宗光外相のもとで日英通商航海条約が結ばれ、領事裁判権の撤廃が実現した。日清戦争の直前のことである。","m":"1894 陸奥で治外法権撤廃","y":1894},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-9002","lv":1,"s":"関税自主権の完全な回復は、1899年に青木周蔵外相のもとで実現した。","a":0,"e":"（サンプル）誤り：1899年・青木周蔵ではない。正しくは関税自主権の完全回復は1911年、小村寿太郎外相のもとで実現した。","m":"1911 小村で関税自主権","y":1911},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-9003","lv":2,"s":"下関条約で、清は遼東半島・台湾・樺太を日本に割譲した。","a":0,"e":"（サンプル）誤り：樺太は含まれない。正しくは下関条約（1895年）で清が割譲したのは遼東半島・台湾・澎湖諸島である。","m":"下関＝遼東・台湾・澎湖","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-9004","lv":2,"s":"三国干渉で遼東半島の返還を求めたのは、ロシア・ドイツ・イギリスである。","a":0,"e":"（サンプル）誤り：イギリスは加わっていない。正しくは三国干渉はロシア・ドイツ・フランスの3国によるもので、日本は遼東半島を清に返還した。","m":"三国干渉＝露・独・仏","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-9005","lv":3,"s":"大隈重信外相は、大審院に外国人判事を任用する案が問題となる中、襲撃されて負傷した。","a":1,"e":"（サンプル）大隈重信外相の改正案は大審院への外国人判事任用を含んでいたため反発を招き、1889年に玄洋社の社員に襲われて負傷し、交渉は中止された。","m":"大隈＝大審院の外国人判事","y":1889},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-9006","lv":3,"s":"大津事件のときの外相は青木周蔵で、事件の責任をとって辞任した。","a":1,"e":"（サンプル）1891年の大津事件でロシア皇太子が負傷し、当時の外相青木周蔵は責任をとって辞任した。これにより交渉は一時中断した。","m":"大津事件→青木辞任","y":1891},{"f":"現代","t":"占領と民主化","ref":"GD-9001","lv":1,"s":"連合国軍最高司令官総司令部（GHQ）の最高司令官は、マッカーサーである。","a":1,"e":"（サンプル）占領期の日本では、マッカーサーを最高司令官とするGHQが日本政府に指令・勧告を出す間接統治の方式がとられた。","m":"GHQ＝マッカーサー・間接統治","y":1945},{"f":"現代","t":"占領と民主化","ref":"GD-9002","lv":1,"s":"日本国憲法は、1947年5月3日に公布された。","a":0,"e":"（サンプル）誤り：1947年5月3日は施行日である。正しくは日本国憲法は1946年11月3日に公布され、1947年5月3日に施行された。","m":"公布11/3・施行5/3","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-9003","lv":3,"s":"第二次農地改革では、在村地主の貸付地は都府県で平均1町歩までとされた。","a":1,"e":"（サンプル）第二次農地改革（1946年）では不在地主の貸付地はすべて、在村地主の貸付地は都府県で平均1町歩（北海道は4町歩）を超える分が買い上げられた。","m":"在村地主1町歩（北海道4）","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-9004","lv":3,"s":"過度経済力集中排除法で指定された企業のうち、実際に分割されたのは11社にとどまった。","a":1,"e":"（サンプル）過度経済力集中排除法（1947年）では325社が指定されたが、占領政策の転換もあって、実際に分割されたのは日本製鉄など11社にとどまった。","m":"集排法 325社→分割11社","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-9005","lv":2,"s":"労働三法のうち、最初に制定されたのは労働基準法である。","a":0,"e":"（サンプル）誤り：最初は労働基準法ではない。正しくは1945年に労働組合法、1946年に労働関係調整法、1947年に労働基準法の順に制定された。","m":"組合→調整→基準","y":1945},{"f":"現代","t":"占領と民主化","ref":"GD-9006","lv":2,"s":"1945年の衆議院議員選挙法改正で、満25歳以上の男女に選挙権が与えられた。","a":0,"e":"（サンプル）誤り：満25歳ではない。正しくは1945年の改正で満20歳以上の男女に選挙権が与えられ、翌年の総選挙で女性議員39人が当選した。","m":"1945 20歳以上の男女","y":1945},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-9001","lv":1,"s":"法隆寺は、蘇我馬子が建立したと伝えられる。","a":0,"e":"（サンプル）誤り：蘇我馬子が建てたのは飛鳥寺である。正しくは法隆寺は厩戸王（聖徳太子）が建立したと伝えられる。","m":"飛鳥寺＝馬子・法隆寺＝厩戸王"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-9002","lv":1,"s":"『古事記』は712年、『日本書紀』は720年に完成した。","a":1,"e":"（サンプル）『古事記』は太安万侶が稗田阿礼の誦習をもとに712年に筆 const ABBR=f=>FIELDS.filter(([g])=>g[0]===f[0]).length>1?f:f[0]; // 5回の内訳の略号（近世・近代は分野名のまま）
function fieldStats(){const o={};FIELDS.forEach(([f])=>o[f]={n:0,c:0,q:0,tot:0,rn:0,rc:0});
  BANK.forEach(q=>{const s=o[q.f];s.tot++;const h=H[q.k];if(h){s.n+=h.n;s.c+=h.c;s.q++}});
  // 直近：論点ごとの直近10問を分野でまとめる
  Object.keys(R10).forEach(t=>{const f=t.split("|")[0];if(!o[f])return;const r=R10[t];o[f].rn+=r.length;o[f].rc+=(r.match(/1/g)||[]).length});return o}
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gammaS(k,r){if(k<1)return gammaS(k+1,r)*Math.pow(r()||1e-12,1/k);const d=k-1/3,c=1/Math.sqrt(9*d);
  for(;;){let x,v;do{const u1=r()||1e-12,u2=r();x=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);v=1+c*x}while(v<=0);v=v*v*v;const u=r();
    if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u||1e-12)<0.5*x*x+d*(1-v+Math.log(v)))return d*v}}
// ○×の正答率 p から4択1問の正答率を推計（消去法・2択への絞り込みを含む。宅建と同じ toExam）
// 各肢の判断：S＝確信して正しく判定／U＝迷う（○×なら半々）／W＝確信して誤る。p = S + U/2、k＝○×の誤りのうち「迷い」の割合
function toExam(p,k){if(k==null)k=0.5;if(p<1)k=Math.min(k,p/(1-p));const u=2*(1-p)*k,w=(1-p)*(1-k),s=Math.max(0,p-k*(1-p));const pr=[s,u,w];let P=0;
  for(let i=0;i<81;i++){const st=[i%3,(i/3|0)%3,(i/9|0)%3,(i/27|0)%3];let q=1;for(const x of st)q*=pr[x];if(!q)continue;
    const flag=[],uns=[];st.forEach((x,j)=>{if((j===0&&x===0)||(j>0&&x===2))flag.push(j);if(x===1)uns.push(j)});
    const cand=flag.length?flag:uns.length?uns:[0,1,2,3];if(cand.includes(0))P+=q/cand.length}
  return P}
const RATE_TABLE={};
function examRateFast(p,k){let t=RATE_TABLE[k];if(!t){t=RATE_TABLE[k]=new Float64Array(1001);for(let i=0;i<=1000;i++)t[i]=toExam(i/1000,k)}return t[Math.round(Math.min(1,Math.max(0,p))*1000)]}
// 直近の極端な不調の補正（src/logic.ts の adjustTopic / adjustedRatesX と同じ）
const ADJ_PRIOR=10,ADJ_FLOOR=0.10;
function adjustTopic(rc,rn,c,n){if(!rn)return n?c/n:0;const all=n?c/n:rc/rn;return Math.max((rc+ADJ_PRIOR*all)/(rn+ADJ_PRIOR),all-ADJ_FLOOR)}
function adjustedRates(){const st=fieldStats();const o={};FIELDS.forEach(([f])=>o[f]={n:0,c:0,raw:st[f].rn?st[f].rc/st[f].rn:null,adj:0});
  topicStats().forEach(s=>{if(!s.rn)return;const r=o[s.f];r.n+=s.rn;r.c+=adjustTopic(s.rc,s.rn,s.c,s.n)*s.rn});
  FIELDS.forEach(([f])=>{const r=o[f],x=st[f];if(!r.n){r.n=x.n;r.c=x.c}r.adj=r.n?r.c/r.n:0});return o}
// 水準ごとの成績：直近10問（RL）を全回答の正答率で補正。直近の記録がない水準は各問の最後の結果で補う
function levelStats(){const o=PASS.levels.map((_,i)=>({lv:i+1,n:0,c:0,rn:0,rc:0,adj:0,cnt:0})),last=o.map(()=>"");
  BANK.forEach(q=>{const s=o[(q.lv||2)-1];if(!s)return;const h=H[q.k];if(h){s.n+=h.n;s.c+=h.c;last[s.lv-1]+=h.last?"1":"0"}});
  o.forEach((s,i)=>{const r=RL[String(s.lv)]||last[i].slice(-10);s.rn=r.length;s.rc=(r.match(/1/g)||[]).length;s.adj=adjustTopic(s.rc,s.rn,s.c,s.n);s.cnt=s.rn||s.n});return o}
const EXAM_N=(()=>{const o={};FIELDS.forEach(([f])=>o[f]=0);MIX.forEach(m=>Object.keys(m).forEach(f=>o[f]=(o[f]||0)+m[f]));return o})();
const passLines=(line,n)=>{const a=Math.ceil(line[0]*n-1e-9),b=Math.ceil(line[1]*n-1e-9);return Array.from({length:b-a+1},(_,i)=>a+i)};
function simulateLevels(inp,k){const N=Object.values(EXAM_N).reduce((a,b)=>a+b,0),lvs=inp.levels,tot=lvs.reduce((a,s)=>a+s.n,0);
  const o=tot?lvs.reduce((a,s)=>a+s.c,0)/tot:0;const cl=p=>Math.min(0.99,Math.max(0.01,p));
  const point=(f,l,af,bl)=>{const F=inp.fields[f],Lv=lvs[l];const a=af!=null?af:(F.c+1)/(F.n+2);const b=Lv.n?(bl!=null?bl:(Lv.c+1)/(Lv.n+2)):o;return cl(a+(Lv.n?b-o:0))};
  return PASS.groups.map(g=>{const r=seeded(PASS.seed),S=PASS.sims;const beta=(a,b)=>{const x=gammaS(a,r),y=gammaS(b,r);return x/(x+y)};
    const cum=g.mix.map((_,i)=>g.mix.slice(0,i+1).reduce((a,b)=>a+b,0));const sc=[];
    for(let i=0;i<S;i++){const bl=lvs.map(s=>s.n?beta(s.c+1,s.n-s.c+1):o);let x=0;
      FIELDS.forEach(([f])=>{const F=inp.fields[f];const af=beta(F.c+1,F.n-F.c+1);const ps=lvs.map((_,l)=>examRateFast(point(f,l,af,bl[l]),k));
        for(let j=0;j<(EXAM_N[f]||0);j++){const u=r();let l=cum.findIndex(c=>u<c);if(l<0)l=cum.length-1;if(r()<ps[l])x++}});sc.push(x)}
    sc.sort((a,b)=>a-b);const lines=passLines(g.line,N);const byLine=lines.map(t=>sc.filter(v=>v>=t).length/S);
    const exp={};FIELDS.forEach(([f])=>{exp[f]=(EXAM_N[f]||0)*g.mix.reduce((a,m,l)=>a+m*toExam(point(f,l),k),0)});
    return {name:g.name,lines,byLine,prob:byLine.reduce((a,b)=>a+b,0)/byLine.length,mean:sc.reduce((a,b)=>a+b,0)/S,lo:sc[Math.floor(S*0.1)],hi:sc[Math.floor(S*0.9)],exp,four:Object.values(exp).reduce((a,b)=>a+b,0)/N}})}
let PE_CACHE=null; // 合格の見込みの計算結果（記録が変わったら save() で破棄）
function passEst(){if(PE_CACHE)return PE_CACHE;return PE_CACHE=passEstRaw()}
function passEstRaw(){
  const fst=fieldStats();const total=Object.values(fst).reduce((a,s)=>a+s.n,0);
  if(total<PASS.minAnswers)return {ready:false,total};
  const adj=adjustedRates(),lst=levelStats();
  const inp={fields:Object.fromEntries(FIELDS.map(([f])=>[f,{n:adj[f].n,c:adj[f].c}])),levels:lst.map(s=>({n:s.cnt,c:s.adj*s.cnt}))};
  const scen=PASS.ks.map(s=>({k:s.k,label:s.label,groups:simulateLevels(inp,s.k)}));const head=scen[PASS.headline];const G=head.groups[PASS.focusGroup];
  // いちばん伸ばせる分野＝focusGroup の大学群・見出しの k で、落とす見込みの点が最も多い分野
  const focus=FIELDS.map(([f])=>f).sort((a,b)=>(EXAM_N[b]-G.exp[b])-(EXAM_N[a]-G.exp[a]))[0];
  return {ready:true,total,fst,adj,lst,scen,head,focus};
}
function passHtml(){
  const P=passEst();
  if(!P.ready)return `<section class="card"><h2>合格の見込み（3水準）</h2><p class="note" style="margin:0">あと <b>${PASS.minAnswers-P.total}問</b> 解くと判定します（${PASS.minAnswers}問以上の回答で表示）。</p><div class="pbar"><i style="width:${Math.round(P.total/PASS.minAnswers*100)}%"></i></div></section>`;
  const pc=x=>Math.round(x*100)+"%";const jt=x=>x>=0.8?"j-ok":x>=0.5?"j-mid":"j-ng";const G=P.head.groups[PASS.focusGroup];

  const lvl=P.lst.map((s,i)=>`${PASS.levels[i]}レベル ${s.rn?pc(s.rc/s.rn):"—"}→<b>${s.cnt?pc(s.adj):"—"}</b>`).join("／");
  const rows=FIELDS.map(([f,n])=>{const s=P.fst[f],e=G.exp[f],N=EXAM_N[f]||0;
    return `<tr class="${f===P.focus?"focus":""}"><td>${n}</td><td><b>${Math.round(P.adj[f].adj*100)}%</b>${s.rn?`<br><small class="note">直近${pc(s.rc/s.rn)}</small>`:""}</td><td>${s.n?pc(s.c/s.n):"—"}</td><td>${N?Math.round(e/N*100)+"%":"—"}</td><td style="white-space:nowrap">${e.toFixed(1)}/${N}</td></tr>`}).join("");

  <div class="kpi" style="grid-template-columns:repeat(3,minmax(0,1fr))">${tiles}</div>

  <div class="tw"><table class="st"><thead><tr><th>4択での解き方</th>${P.head.groups.map(g=>`<th>${g.name}</th>`).join("")}</tr></thead><tbody>${P.scen.map((x,i)=>`<tr class="${i===PASS.headline?"focus":""}"><td>${x.label}（k=${x.k}）</td>${x.groups.map(g=>`<td>${i===PASS.headline?`<b>${pc(g.prob)}</b>`:pc(g.prob)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <p class="note" style="margin:0">合格ライン（4択換算の得点）：${P.head.groups.map(g=>`${g.name} ${g.lines[0]}〜${g.lines[g.lines.length-1]}点`).join("／")}（${PASS.n}点満点。どの点も同じ確率と仮定）</p>
  <div class="tw"><table class="st"><caption>分野別の予想点（${G.name}の水準・標準）</caption><thead><tr><th>分野</th><th>採用</th><th>全体</th><th>推定4択</th><th>予想点</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row"><button class="btn pri" data-fx="${P.focus}">いちばん伸ばせる「${FNAME(P.focus)}」の10問テスト</button></div>
  <p class="note" style="margin:0">目安です（合格を保証するものではありません）。水準ごとの直近10問と分野ごとの直近の正答率を4択に換算し、入試${PASS.n}問を${PASS.sims}回シミュレーションしています（乱数は固定）。大学群ごとの出題の水準と合格ラインは仮の値です。</p></section>`;
}

function startExam(field){
  const qs=[];const ex=new Set();
  if(field){pick(BANK.filter(q=>q.f===field),10,ex).forEach(q=>qs.push(q))}
  else{const mix=MIX[SET.round],need=levelNeeds(mix);FIELDS.forEach(([f])=>{pickCoverLv(BANK.filter(q=>q.f===f),mix[f]||0,ex,need[f]).forEach(q=>{qs.push(q);ex.add(q.i)})})}
  const label=field?FNAME(field)+" 10問":`第${SET.round+1}回`;
  const E={qs,ans:Array(qs.length).fill(null),cur:0,left:LIMIT,start:Date.now(),field,label};
  const render=()=>{
    const q=E.qs[E.cur];const m=Math.floor(E.left/60),s=E.left%60;
    app.innerHTML=`
    <div class="exam-top"><div><div class="note">${E.label}　${E.ans.filter(a=>a!=null).length}/${E.qs.length}問 回答済み</div><div class="timer ${E.left<=60?"low":""}" id="tm">${m}:${String(s).padStart(2,"0")}</div></div><button class="btn" id="fin">採点する</button></div>
    <div class="dots">${E.qs.map((x,k)=>`<button class="dot ${E.ans[k]!=null?(E.ans[k]===x.a?"okd":"ngd"):""} ${k===E.cur?"cur":""}" data-k="${k}" aria-label="${k+1}問目">${k+1}</button>`).join("")}</div>
    <article class="card"><div class="meta">問${E.cur+1}　${FIELDS.find(x=>x[0]===q.f)[1]}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn ${E.ans[E.cur]===1?"sel":""}" id="o" ${E.ans[E.cur]!=null?"disabled":""}>○</button><button class="btn ${E.ans[E.cur]===0?"sel":""}" id="x" ${E.ans[E.cur]!=null?"disabled":""}>×</button></div>
    ${E.ans[E.cur]!=null?(()=>{const ok=E.ans[E.cur]===q.a;return `<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答え：${q.a?"○":"×"}　<span class="note">${q.t}　${q.ref==="確認"?"確認問題":q.ref}</span></span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div>`})():""}
    <div class="row" style="justify-content:space-between"><button class="btn" id="prev" ${E.cur?"":"disabled"}>前へ</button><button class="btn ${E.ans[E.cur]!=null?"pri":""}" id="next">${E.cur<E.qs.length-1?"次へ":"採点する"}</button></div></article>
    <div id="cf"></div>`;
    const choose=v=>{
      // 1問ごとにその場で正誤と解説を表示（答えは確定）。10問テスト・分野別とも同じ
      if(E.ans[E.cur]!=null)return;E.ans[E.cur]=v;const q0=E.qs[E.cur];render();if(voice)speak((v===q0.a?"正解。":"不正解。")+"答えは"+(q0.a?"まる":"ばつ")+"。"+q0.e)};
    $("#o").onclick=()=>choose(1);$("#x").onclick=()=>choose(0);
    $("#prev").onclick=()=>{E.cur--;render()};
    $("#next").onclick=()=>{if(E.cur<E.qs.length-1){E.cur++;render();if(voice)speak(E.qs[E.cur].s)}else askFinish()};
    $("#fin").onclick=askFinish;
    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    document.querySelectorAll(".dot").forEach(d=>d.onclick=()=>{E.cur=+d.dataset.k;render()});
  };
  const askFinish=()=>{const un=E.ans.filter(a=>a==null).length;if(!un){finish();return}
    $("#cf").innerHTML=`<div class="confirm row"><span>未回答が${un}問あります。未回答は不正解になります。</span><button class="btn" id="yes">採点する</button><button class="btn" id="no">続ける</button></div>`;
    $("#yes").onclick=finish;$("#no").onclick=()=>$("#cf").innerHTML=""};
  const finish=()=>{clearInterval(timerId);if(canSpeak)speechSynthesis.cancel();
    const used=LIMIT-E.left;let sc=0;E.qs.forEach((q,k)=>{const ok=E.ans[k]===q.a;if(ok)sc++;rec(q,ok)});
    const at=new Date(Date.now()+9*3600e3).toISOString().slice(0,19);
    if(E.field){LOG.push({at,round:0,field:E.field,score:sc,sec:used});save();result(E,sc,used,null);return}
    LOG.push({at,round:SET.round+1,score:sc,sec:used});
    // このセットで出した論点を記録し、セットが終わったら出し切れなかった論点を次のセットへ持ち越す
    SET.topics=[...new Set([...(SET.round===0?[]:SET.topics||[]),...E.qs.map(q=>q.f+"|"+q.t)])];
    SET.scores[SET.round]=sc;SET.round=(SET.round+1)%5;const setDone=SET.round===0;const setScores=[...SET.scores];
    if(setDone){const allT=[...new Set(BANK.map(q=>q.f+"|"+q.t))];SET.carry=allT.filter(k=>!SET.topics.includes(k));SET.topics=[];SET.scores=[]}save();
    result(E,sc,used,setDone?setScores:null)};
  render(); if(voice)speak(E.qs[0].s);
  clearInterval(timerId);
  timerId=setInterval(()=>{E.left--;const t=$("#tm");if(t){t.textContent=Math.floor(E.left/60)+":"+String(E.left%60).padStart(2,"0");if(E.left<=60)t.classList.add("low")}if(E.left<=0){clearInterval(timerId);finish()}},1000);
  window.scrollTo(0,0);
}
function judge(sc){return sc>=8?["j-ok","合格圏"]:sc===7?["j-mid","合格ライン上"]:["j-ng","要復習"]}
function result(E,sc,used,setScores){
  const [jc,jt]=judge(sc);

  let setHtml="";
  if(setScores){const tot=setScores.reduce((a,b)=>a+b,0);const sj=tot>=37?["j-ok","安全圏"]:tot>=35?["j-mid","合格ライン（7割）"]:["j-ng","あと"+(35-tot)+"点で7割"];
    setHtml=`<section class="card"><h2>5回セットの合計（入試1回分）</h2><div class="row"><span class="big">${tot}<span style="font-size:1.2rem"> / 50</span></span><span class="judge ${sj[0]}">${sj[1]}</span></div><p class="note">各回：${setScores.map((s,k)=>`第${k+1}回 ${s}点`).join("　")}</p></section>`}
  app.innerHTML=`
  <section class="card"><h2>${E.field?E.label+"の結果":`第${(SET.round+4)%5+1}回の結果`}</h2>
    <div class="row"><span class="big">${sc}<span style="font-size:1.2rem"> / ${E.qs.length}</span></span><span class="judge ${jc}">${jt}</span></div>
    <p class="note">かかった時間 ${Math.floor(used/60)}分${used%60}秒 / 10分</p>
    ${wrongItems.length?`<p class="note">間違えた論点ごとに「解説（要点・ひっかけ） → 付随する論点 → 確認例題3問」の順で復習します。</p>
    <button class="btn pri" id="allw">間違えた${wrongItems.length}論点を復習する</button>
    <div class="row">${wrongItems.map((w,j)=>`<button class="btn" data-w="${j}">${w.key.split("|")[1]}だけ</button>`).join("")}</div>`:`<p>全問正解です。${E.field?"続けて解くと見込みの精度が上がります。":"次の回に進みましょう。"}</p>`}
    <div class="row"><button class="btn" id="home">ホームへ</button><button class="btn" id="nx">${E.field?`もう一度 ${FNAME(E.field)} 10問`:`第${SET.round+1}回へ進む`}</button></div>
  </section>
  ${setHtml}
  <section class="rv">${E.qs.map((q,k)=>{const ok=E.ans[k]===q.a;return `<article class="card"><div class="meta">問${k+1}　${q.t}　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    <div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　あなた：${E.ans[k]==null?"未回答":E.ans[k]?"○":"×"}　答え：${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div></article>`}).join("")}</section>`;
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>startReview([wrongItems[+b.dataset.w]]));
  if(wrongItems.length)$("#allw").onclick=()=>startReview(wrongItems);
  $("#home").onclick=home;$("#nx").onclick=()=>startExam(E.field);
  window.scrollTo(0,0);
}

/* ---------- review: 解説（要点・ひっかけ・体系） → 付随論点 → 確認例題3問（1問ごとに正誤と解説） ---------- */
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// 間違えた問題と最も関係の深い枝（大項目）を文字の2文字組の重なりで推定する
function bigr(x){const s=String(x).replace(/[\s、。・：（）()「」，,．.0-9０-９]/g,"");const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o}
function overlap(a,b){let n=0;b.forEach(x=>{if(a.has(x))n++});return n}
function cellHtml(x){x=esc(x);if(/^(○|◯|必要|可|あり|できる)/.test(x))return `<span class="o">${x}</span>`;if(/^(×|✕|不要|不可|なし|できない)/.test(x))return `<span class="x">${x}</span>`;return x}
// 間違えた問題に最も関係する枝・項目を推定（2文字組の重なり）
function hitOf(S,missed){
  let b=-1,it=-1;if(!S||!missed)return {b,it};
  const qb=bigr(missed.q.s+missed.q.e);let best=1;
  S.tree.forEach((x,i)=>{const sc=overlap(qb,bigr(x.h+x.items.join("")));if(sc>best){best=sc;b=i}});
  if(b>=0){let bi=0;S.tree[b].items.forEach((x,j)=>{const sc=overlap(qb,bigr(x));if(sc>bi){bi=sc;it=j}})}
  return {b,it};
}
const brHtml=(x,i,hit,tag)=>`<div class="br ${hit.b===i?"hit":""}" id="br-${i}"><h4><span class="no">${i+1}</span>${esc(x.h)}${hit.b===i&&tag?`<span class="tag">${tag}</span>`:""}</h4><ul>${x.items.map((y,j)=>`<li class="${hit.b===i&&hit.it===j?"hit":""}">${esc(y)}</li>`).join("")}</ul></div>`;
const tblHtml=(tb,rows,note)=>`<div><div style="font-weight:700;margin-bottom:6px">${esc(tb.title)}</div><div class="tw"><table class="st"><thead><tr>${tb.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${cellHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${note?`<p class="note" style="margin:4px 0 0">${note}</p>`:""}</div>`;
const missedHtml=missed=>missed?`<article class="card"><div class="meta">あなたが間違えた問題　${missed.q.ref==="確認"?"確認問題":missed.q.ref}</div><p class="stmt">${missed.q.s}</p>
    <div class="res ng"><span class="v">あなた：${missed.your==null?"未回答":missed.your?"○":"×"}　答え：${missed.q.a?"○":"×"}</span><span>${missed.q.e}</span><span class="memo">覚え方：<b>${missed.q.m}</b></span></div></article>`:"";

/* 1段目：間違えた範囲だけに絞った解説＋体系へのリンク */
// 具体例と周辺知識（src/logic.ts の orderExamples と同じ並べ方）
function orderExamples(L,q){const ex=L.ex||[];if(!q)return ex.map(x=>({ex:x,near:false}));const text=q.s+q.e;
  const sc=ex.map((x,i)=>({x,i,n:x.kw.filter(k=>text.includes(k)).length}));sc.sort((a,b)=>b.n-a.n||a.i-b.i);return sc.map((o,j)=>({ex:o.x,near:j===0&&o.n>0}))}
function exHtml(L,missed){const o=orderExamples(L,missed&&missed.q);if(!o.length)return "";
  return `<article class="card"><div class="meta">具体例で理解する</div>${o.map(({ex,near})=>`<div class="exb${near?" near":""}">${near?`<span class="tag">この問題に近い例</span>`:""}<b>${esc(ex.t)}</b><p>${esc(ex.s)}</p><p class="exp">→ ${esc(ex.p)}</p></div>`).join("")}</article>`}
// 判例：問題に関係する判例を先頭に3件、残りは折りたたみ（src/logic.ts の orderByKw と同じ並べ方）
function orderByKw(list,q){if(!q)return list.map(x=>({item:x,near:false}));const text=q.s+q.e;
  const sc=list.map((x,i)=>({x,i,n:x.kw.filter(k=>text.includes(k)).length}));sc.sort((a,b)=>b.n-a.n||a.i-b.i);return sc.map(o=>({item:o.x,near:o.n>0}))}
function casesHtml(L,missed){const o=orderByKw(L.cases||[],missed&&missed.q);if(!o.length)return "";
  const one=({item:c,near})=>`<div class="exb${near?" near":""}">${near?`<span class="tag">この問題に関係する判例</span>`:""}<b>${esc(c.n)}</b><p><b>事案</b>　${esc(c.f)}</p><p><b>判断</b>　${esc(c.h)}</p><p class="cpt"><b>試験では</b>　${esc(c.pt)}</p></div>`;
  return `<article class="card"><div class="meta">判例で理解する（${o.length}件）</div>${o.slice(0,3).map(one).join("")}${o.length>3?`<details class="more"><summary>ほかの判例も見る（あと${o.length-3}件）</summary>${o.slice(3).map(one).join("")}</details>`:""}</article>`}
function aroundHtml(L){const a=L.around||[];if(!a.length)return "";
  return `<article class="card"><div class="meta">あわせて覚える周辺知識</div><dl class="ard">${a.map(x=>`<dt>${esc(x.h)}</dt><dd>${esc(x.b)}</dd>`).join("")}</dl></article>`}
function focusHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const S=L.sys;const t=key.split("|")[1];
  const qb=missed?bigr(missed.q.s+missed.q.e):null;
  const hit=hitOf(S,missed);
  let body="";
  if(S&&hit.b>=0){body+=brHtml(S.tree[hit.b],hit.b,hit,"間違えた範囲")}
  else{body+=`<ul class="ul">${L.pts.slice(0,4).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
  // 関係する表の行だけを抜き出す
  if(S&&qb){let best=null;
    S.tables.forEach(tb=>{const rs=tb.rows.map((r,i)=>({i,r,sc:overlap(qb,bigr(r.join("")))})).filter(o=>o.sc>=2);
      const top=rs.sort((a,b)=>b.sc-a.sc).slice(0,4).sort((a,b)=>a.i-b.i);const sc=top.reduce((a,o)=>a+o.sc,0);
      if(top.length&&(!best||sc>best.sc))best={tb,top,sc}});
    if(best)body+=tblHtml(best.tb,best.top.map(o=>o.r),best.top.length<best.tb.rows.length?`表の一部（${best.top.length}／${best.tb.rows.length}行）。全体は下の「体系的に学ぶ」で。`:"")}
  // 関係するひっかけ
  let traps=L.traps||[];
  if(qb){const r=traps.map(x=>({x,sc:overlap(qb,bigr(x))})).filter(o=>o.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,2).map(o=>o.x);traps=r.length?r:traps.slice(0,1)}else traps=traps.slice(0,2);
  if(traps.length)body+=`<div class="trap"><b>この範囲のひっかけ</b><ul class="ul">${traps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  const head=S&&hit.b>=0?`${esc(t)}：${esc(S.tree[hit.b].h)}`:`${esc(t)}の要点`;
  const map=S?`<div class="mini">${S.tree.map((x,i)=>`<button class="mchip ${i===hit.b?"on":""}" data-deep="${i}"><span class="no">${i+1}</span>${esc(x.h)}</button>`).join("")}</div>`:"";
  const rel=(L.rel||[]).filter(k=>LESSON[k]);
  return `<article class="card"><div class="meta">間違えた範囲の解説</div><h2>${head}</h2>${body}</article>
  ${exHtml(L,missed)}${casesHtml(L,missed)}${aroundHtml(L)}
  ${S?`<article class="card"><div class="meta">体系的に広げる</div><p class="note" style="margin:0">「${esc(t)}」は全${S.tree.length}項目。項目を押すと、その場所から詳しい解説を開きます。</p>${map}
    <button class="btn deeplink" data-deep="all">${esc(t)}を体系的に学ぶ<span class="sub2">全体像・流れ図・比較表・要点</span></button>
    ${rel.length?`<div><div class="note" style="margin-bottom:6px">${esc(L.bridge||"関連する論点")}</div><div class="mini">${rel.map(k=>`<button class="mchip rel" data-deeprel="${k}">${esc(k.split("|")[1])} →</button>`).join("")}</div></div>`:""}</article>`:""}`;
}

/* 2段目：論点を体系的に深く学ぶページ */
function deepHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const S=L.sys;const [f,t]=key.split("|");
  const hit=hitOf(S,missed);
  let h="";
  if(S){
    h+=`<article class="card"><div class="meta">全体像（体系図）　${FIELDS.find(x=>x[0]===f)[1]}</div><h2>${esc(t)}の全体像</h2><p class="ov">${esc(S.overview)}</p><div class="systree"><div class="sysroot">${esc(t)}</div><div class="sysbr">${S.tree.map((x,i)=>brHtml(x,i,hit,"間違えた範囲")).join("")}</div></div></article>`;
    if(S.flow&&S.flow.steps&&S.flow.steps.length)h+=`<article class="card"><div class="meta">流れで覚える</div><h2>${esc(S.flow.title)}</h2><ol class="flow">${S.flow.steps.map((x,i)=>`<li><span class="n">${i+1}</span><span class="s">${esc(x)}</span></li>`).join("")}</ol></article>`;
    if(S.tables&&S.tables.length)h+=`<article class="card"><div class="meta">比較表・数字</div><div class="tbls">${S.tables.map(tb=>tblHtml(tb,tb.rows,"")).join("")}</div></article>`;
  }
  h+=`<article class="card"><div class="meta">要点のまとめ</div><h2>${esc(t)}の要点</h2><ul class="ul">${L.pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${L.traps&&L.traps.length?`<div class="trap"><b>よく出るひっかけ</b><ul class="ul">${L.traps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}</article>`;
  h+=exHtml(L,missed)+casesHtml(L,missed)+aroundHtml(L);
  const rel=(L.rel||[]).filter(k=>LESSON[k]);
  if(rel.length)h+=`<article class="card"><div class="meta">つながる論点</div><p style="margin:0">${esc(L.bridge||"")}</p><div class="mini">${rel.map(k=>`<button class="mchip rel" data-deeprel="${k}">${esc(k.split("|")[1])} →</button>`).join("")}</div></article>`;
  return h;
}
function deepView(key,focus,missed,back,trail){
  trail=trail||[];const t=key.split("|")[1];
  app.innerHTML=`<div class="exam-top"><div><div class="note">体系的に学ぶ${trail.length?"　"+trail.map(k=>esc(k.split("|")[1])).join(" › ")+" ›":""}</div><div style="font-weight:700">${esc(t)}</div></div><button class="btn" id="back">← 復習に戻る</button></div>
  ${deepHtml(key,missed)}
  <div class="row"><button class="btn pri" id="back2">← 復習に戻る</button></div>`;
  $("#back").onclick=back;$("#back2").onclick=back;
  document.querySelectorAll("[data-deeprel]").forEach(b=>b.onclick=()=>deepView(b.dataset.deeprel,-1,null,back,[...trail,key]));
  if(focus>=0){const el=document.getElementById("br-"+focus);if(el){el.classList.add("focus");el.scrollIntoView({block:"center"});return}}
  window.scrollTo(0,0);
}
function startReview(queue){ // queue: [{key, missed?}]
  if(!queue.length){home();return}
  const item=queue[0],rest=queue.slice(1);const key=item.key;const [f,t]=key.split("|");
  app.innerHTML=`<div class="exam-top"><div><div class="note">復習　残り${queue.length}論点</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
  ${missedHtml(item.missed)}
  ${focusHtml(key,item.missed)}
  <div class="row"><button class="btn pri" id="toq">確認例題3問へ</button></div>`;
  $("#home").onclick=home;
  $("#toq").onclick=()=>checkQs(item,rest);
  const back=()=>startReview(queue);
  document.querySelectorAll("[data-deep]").forEach(b=>b.onclick=()=>deepView(key,b.dataset.deep==="all"?-1:+b.dataset.deep,item.missed,back));
  document.querySelectorAll("[data-deeprel]").forEach(b=>b.onclick=()=>deepView(b.dataset.deeprel,-1,null,back,[key]));
  if(voice){const L=LESSON[key];if(L){const S=L.sys,h=hitOf(S,item.missed);speak(h.b>=0?t+"、"+S.tree[h.b].h+"。"+S.tree[h.b].items.join("。"):t+"の要点。"+L.pts.slice(0,4).join("。"))}}
  window.scrollTo(0,0);
}
function checkQs(item,rest){
  const [f,t]=item.key.split("|");
  const ex=new Set(item.missed?[item.missed.q.i]:[]);
  let pool=BANK.filter(q=>q.f===f&&q.t===t);
  let real=pool.filter(q=>q.ref!=="確認");
  const N=3; // 確認例題の問題数（src/exams.ts の reviewN と同じ）
  const qs=pick(real.length>=N?real:pool,N,ex);
  let k=0,right=0;
  const render=()=>{
    if(k>=qs.length){
      const J=right>=Math.ceil(qs.length*0.8)?["j-ok","習得"]:right>=Math.ceil(qs.length*0.6)?["j-mid","もう一息"]:["j-ng","要復習"];const ok=J[0]==="j-ok";
      app.innerHTML=`<section class="card"><h2>${t}　確認例題の結果</h2><div class="row"><span class="big">${right}<span style="font-size:1.2rem"> / ${qs.length}</span></span><span class="judge ${J[0]}">${J[1]}</span></div>
      <p class="note">${ok?"この論点は理解できています。":"もう一度、解説を読んでから別の3問に挑戦できます。"}</p>
      <div class="row">${ok?"":`<button class="btn" id="again">解説に戻ってもう一度</button>`}
      ${rest.length?`<button class="btn pri" id="next">次の論点へ（残り${rest.length}）</button>`:`<button class="btn pri" id="nx">第${SET.round+1}回の模試へ</button>`}
      <button class="btn" id="home">ホームへ</button></div></section>`;
      if(!ok)$("#again").onclick=()=>startReview([{key:item.key,missed:item.missed},...rest]);
      if(rest.length)$("#next").onclick=()=>startReview(rest);else $("#nx").onclick=()=>startExam();
      $("#home").onclick=home;window.scrollTo(0,0);return}
    const q=qs[k];
    app.innerHTML=`<div class="exam-top"><div><div class="note">確認例題　${k+1} / ${qs.length}　正解 ${right}</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
    <article class="card"><div class="meta">確認例題　${q.ref}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn" id="o">○</button><button class="btn" id="x">×</button></div><div id="res"></div></article>`;
    const go=v=>{$("#o").disabled=$("#x").disabled=true;const ok=v===q.a;if(ok)right++;rec(q,ok);save();
      $("#res").innerHTML=`<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答えは ${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div><div class="row" style="margin-top:10px"><button class="btn pri" id="nx">次へ</button></div>`;
      if(voice)speak((ok?"正解。":"不正解。")+"答えは"+(q.a?"まる":"ばつ")+"。"+q.e);
      $("#nx").onclick=()=>{k++;render();if(voice&&k<qs.length)speak(qs[k].s)};$("#nx").focus()};
    $("#o").onclick=()=>go(1);$("#x").onclick=()=>go(0);$("#home").onclick=home;
    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    window.scrollTo(0,0);
  };
  render();if(voice&&qs.length)speak(qs[0].s);
}
if(canSpeak){try{speechSynthesis.getVoices()}catch(e){}}
home();
connect();
</script>

り、平氏の最盛期には一門の知行国が全国の半分近くに及んだ。","m":"知行国主が国守を推して収益"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0019","lv":2,"s":"平清盛は、源氏との内乱が続くなかの1181年に病没した。","a":1,"e":"清盛は内乱が広がる1181年に熱病で没した。平氏は1183年、源義仲の入京を前に安徳天皇を奉じて都落ちし、西国へ逃れた。","m":"清盛没1181、都落ち1183","y":1181},{"f":"中世","t":"院政と平氏政権","ref":"CH-0020","lv":2,"s":"以仁王は平氏打倒を呼びかける令旨を出し、これを受けて源頼朝や源義仲らが各地で挙兵した。","a":1,"e":"1180年、後白河法皇の皇子以仁王は源頼政とともに挙兵して敗死したが、平氏追討を命じる令旨は諸国の源氏に届いた。これを受けて頼朝・義仲らが挙兵し、治承・寿永の乱が始まった。","m":"以仁王の令旨で頼朝・義仲挙兵","y":1180},{"f":"中世","t":"院政と平氏政権","ref":"CH-0021","lv":2,"s":"白河上皇が鴨川の水・双六の賽と並べて意のままにならないと嘆いたものは、興福寺の僧兵である。","a":0,"e":"誤り：白河上皇が意のままにならないとした山法師は、比叡山延暦寺の僧兵である。正しくは、興福寺の僧兵は奈良法師とよばれ、ともに強訴で院や朝廷を悩ませた。","m":"山法師＝延暦寺、奈良法師＝興福寺"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0022","lv":2,"s":"院政期、院の命令を伝える院宣や院庁から出される院庁下文が、国政に大きな力を持った。","a":1,"e":"院は天皇家の家長として院庁を開き、院宣や院庁下文を出して政治を動かした。正式な官職によらない命令が、太政官の公文書より重んじられるようになった。","m":"院宣・院庁下文が国政を動かす"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0024","lv":2,"s":"鳥羽上皇の后である美福門院の子近衛天皇が早世し、後継を巡る争いが保元の乱の背景となった。","a":1,"e":"1155年に近衛天皇が早世すると後白河天皇が即位し、崇徳上皇は子の重仁親王の即位を望めなくなった。翌年の鳥羽法皇の死が保元の乱の引き金となった。","m":"近衛の死→後白河即位→保元の乱","y":1155},{"f":"中世","t":"院政と平氏政権","ref":"CH-0025","lv":2,"s":"院政期、院に荘園を寄進する例が増え、後白河法皇の持仏堂に由来する荘園群を長講堂領という。","a":1,"e":"院への寄進で皇室領荘園群が成立した。後白河法皇が持仏堂の長講堂に寄せた荘園群が長講堂領で、のち持明院統に伝わった。大覚寺統に伝わった八条院領と並ぶ。","m":"長講堂領＝後白河→持明院統"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0026","lv":2,"s":"院政期、院の近臣には摂関家出身の上級貴族が多く登用された。","a":0,"e":"誤り：院の近臣の中心は摂関家ではない。正しくは、受領を歴任して富を蓄えた中・下級貴族が近臣となり、院に経済的な奉仕をして昇進した。","m":"院の近臣は受領クラス"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0027","lv":3,"s":"保元の乱は後白河天皇方の藤原忠通と崇徳上皇方の藤原頼長が争い、頼長は戦いで受けた傷がもとで死んだ。","a":1,"e":"摂関家では兄の忠通と弟の頼長が対立し、忠通は後白河天皇方、頼長は崇徳上皇方についた。頼長は戦いのさなかに矢を受け、その傷がもとで死去した。","m":"忠通は天皇方、頼長は上皇方","y":1156},{"f":"中世","t":"院政と平氏政権","ref":"CH-0028","lv":3,"s":"保元の乱で敗れた源為義と平忠正は、処刑されずに流罪となった。","a":0,"e":"誤り：為義・忠正は処刑された。正しくは、810年の薬子の変以来、朝廷で行われていなかった死刑がこのとき復活した。崇徳上皇は讃岐に流された。","m":"保元で死刑復活、為義・忠正斬首","y":1156},{"f":"中世","t":"院政と平氏政権","ref":"CH-0030","lv":3,"s":"平清盛が太政大臣に任じられたのは1167年だが、病没までその地位に留まった。","a":0,"e":"誤り：清盛は太政大臣を約3カ月で辞し、翌年出家した。正しくは、官職にとどまらず、出家後も一門を要職につけ、外戚の地位を利用して政権を動かした。","m":"太政大臣は3カ月で辞任","y":1167},{"f":"中世","t":"院政と平氏政権","ref":"CH-0031","lv":3,"s":"1180年、高倉天皇の譲位により安徳天皇が即位し、外祖父の平清盛が実権を握った。","a":1,"e":"1180年、高倉天皇が譲位して3歳の安徳天皇が即位した。前年の政変で院政を止めていた清盛は外祖父として権力の頂点に立ったが、同年に以仁王の挙兵が起こった。","m":"安徳即位1180、清盛は外祖父","y":1180},{"f":"中世","t":"院政と平氏政権","ref":"CH-0032","lv":3,"s":"白河上皇は堀河・鳥羽・崇徳の三代の天皇の時期にわたって院政を行った。","a":1,"e":"白河は1086年の譲位から1129年に没するまで、堀河・鳥羽・崇徳の3代にわたり院政を行った。その後は鳥羽上皇、さらに後白河上皇が院政を続けた。","m":"白河院政は堀河・鳥羽・崇徳","y":1129},{"f":"中世","t":"院政と平氏政権","ref":"CH-0033","lv":3,"s":"保元の乱で敗れた崇徳上皇は、隠岐に流された。","a":0,"e":"誤り：保元の乱で敗れた崇徳上皇は讃岐に流された。正しくは、隠岐に流されたのは承久の乱の後鳥羽上皇と、元弘の変の後醍醐天皇である。","m":"崇徳は讃岐、隠岐は後鳥羽・後醍醐","y":1156},{"f":"中世","t":"院政と平氏政権","ref":"CH-0034","lv":3,"s":"院政期に院が造営した六勝寺は、いずれも平安京の西郊の嵯峨地域に建立された。","a":0,"e":"誤り：六勝寺は平安京の東、鴨川の東の白河の地に建てられた。正しくは、白河天皇の法勝寺をはじめ、天皇家の御願寺として「勝」の字のつく6寺が造営された。","m":"六勝寺は都の東の白河の地"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0035","lv":3,"s":"平清盛が治承三年の政変で解任して流罪とした関白は、藤原忠通であった。","a":0,"e":"誤り：治承三年の政変で清盛が解任・配流した関白は藤原基房である。正しくは、忠通は保元の乱で後白河方についた基房の父で、1164年に没している。","m":"治承三年の政変で基房を配流","y":1179},{"f":"中世","t":"院政と平氏政権","ref":"CH-0036","lv":3,"s":"源義親の乱を追討して院の信任を得た平氏の武士は、平忠盛である。","a":0,"e":"誤り：出雲で反乱した源義親を討ったのは平正盛である。正しくは、子の忠盛は瀬戸内海の海賊追討で功をあげ、鳥羽上皇に昇殿を許された。正盛・忠盛・清盛の3代で平氏は台頭した。","m":"義親追討は正盛→忠盛→清盛","y":1108},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0037","lv":1,"s":"源頼朝は源義経の追捕を名目に、1185年に朝廷から諸国への守護・地頭の設置を認めさせた。","a":1,"e":"1185年、頼朝は義経・行家の追捕を口実に、諸国に守護、荘園・公領に地頭を置く権限を朝廷に認めさせた。幕府の支配が東国から全国へ及ぶ基礎となった。","m":"1185年、義経追捕を口実に守護・地頭","y":1185},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0038","lv":1,"s":"公文所（のち政所）の初代別当には、和田義盛が就いた。","a":0,"e":"誤り：公文所（のち政所）の初代別当は、京都から招かれた下級貴族の大江広元である。正しくは、和田義盛は1180年に置かれた侍所の初代別当で、御家人の統率を担った。","m":"政所は大江広元、侍所は和田義盛","y":1184},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0039","lv":1,"s":"源頼朝は1192年に征夷大将軍に任じられた。","a":1,"e":"1192年、後白河法皇の死後に頼朝は征夷大将軍に任じられた。ただし守護・地頭の設置（1185年）で幕府の支配のしくみはすでに整っていた点も押さえておく。","m":"1192年、頼朝が征夷大将軍に","y":1192},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0040","lv":1,"s":"問注所は御家人の統制や軍事・警察を担当する機関であった。","a":0,"e":"誤り：御家人の統率と軍事・警察を担ったのは侍所である。正しくは、問注所は訴訟の受付と審理を担当する裁判事務の機関で、初代執事は三善康信であった。","m":"問注所＝裁判、侍所＝御家人統率","y":1184},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0041","lv":1,"s":"1221年、後鳥羽上皇が執権北条義時の追討を命じて挙兵したが、幕府軍に敗れた。","a":1,"e":"1221年、後鳥羽上皇は義時追討の命令を出して挙兵した。北条政子が頼朝の恩を説いて御家人を結束させ、泰時・時房の率いる幕府軍が京都を制圧した。","m":"承久の乱1221、政子の訴えで結束","y":1221},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0042","lv":1,"s":"承久の乱に敗れた後鳥羽上皇は、佐渡に流された。","a":0,"e":"誤り：後鳥羽上皇の配流先は隠岐である。正しくは、佐渡に流されたのは順徳上皇で、土御門上皇も土佐（のち阿波）に移った。3上皇の配流は幕府の朝廷に対する優位を示した。","m":"後鳥羽は隠岐、順徳は佐渡","y":1221},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0043","lv":1,"s":"承久の乱ののち、幕府は京都の朝廷を監視し西国の御家人を統轄するため、京都に六波羅探題を置いた。","a":1,"e":"承久の乱後、京都守護に代えて六波羅探題が置かれ、朝廷の監視、京都の警備、西国の御家人の統轄を担った。泰時・時房が最初の探題となり、以後も北条氏一門が任じられた。","m":"乱後に京都の六波羅探題","y":1221},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0044","lv":1,"s":"御成敗式目は、執権北条時頼によって制定された。","a":0,"e":"誤り：御成敗式目は1232年に3代執権北条泰時が定めた。正しくは、北条時頼は5代執権で、1249年に引付衆を置いて裁判の迅速化をはかった人物である。","m":"式目は泰時、引付は時頼","y":1232},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0045","lv":1,"s":"将軍が御家人の先祖伝来の所領を保障したり、手柄に応じて新たな所領を与えたりすることを御恩という。","a":1,"e":"将軍は御家人の先祖伝来の土地を認める本領安堵と、功績に応じて新たな土地を与える新恩給与を行った。これが御恩で、土地を介した主従関係が封建制度の特徴である。","m":"御恩＝本領安堵＋新恩給与"},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0047","lv":1,"s":"北条時政は、2代将軍源頼家が退けられたのち、政所別当として幕府の実権を握り、初代の執権とよばれた。","a":1,"e":"1203年、時政は頼家を退けて実朝を将軍に立て、政所別当として政務を握った。この地位が執権とよばれ、以後は北条氏が受け継いだ。","m":"時政が初代執権（1203）","y":1203},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0048","lv":1,"s":"評定衆は、北条時頼が政治の合議機関として設置した。","a":0,"e":"誤り：評定衆は1225年に北条泰時が置いた合議機関で、有力御家人や政務にすぐれた者が選ばれた。正しくは、北条時頼が新設したのは評定衆の下で訴訟を扱う引付である。","m":"評定衆は泰時、引付は時頼","y":1225},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0049","lv":1,"s":"鎌倉幕府は荘園・公領に地頭を置き、年貢の徴収や土地の管理、治安維持にあたらせた。","a":1,"e":"地頭は荘園・公領ごとに置かれ、年貢の徴収・納入、土地の管理、治安維持にあたった。荘園領主と年貢をめぐって対立することも多く、地頭請や下地中分で解決がはかられた。","m":"地頭は荘園・公領で年貢を扱う"},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0050","lv":2,"s":"守護は大犯三カ条を職務とし、京都大番役の催促と謀叛人・殺害人の逮捕にあたった。","a":1,"e":"大犯三カ条は、京都大番役の催促、謀叛人の逮捕、殺害人の逮捕の三つである。守護は国ごとに置かれ、主に東国出身の有力御家人が任じられて国内の御家人を統率した。","m":"大犯三カ条＝大番・謀叛・殺害"},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0052","lv":2,"s":"頼朝の死後、梶原景時は有力御家人の反発を受けて鎌倉を追われ、のちに滅ぼされた。","a":1,"e":"頼朝の信任を受け侍所の所司を務めた梶原景時は、1199年末に御家人66人の連署で弾劾されて鎌倉を追われ、翌1200年に一族とともに討たれた。頼朝没後の御家人の争いの最初である。","m":"頼朝死後、まず梶原景時が失脚","y":1200},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0053","lv":2,"s":"2代将軍源頼家は、北条時政と対立した比企能員が討たれた事件ののち、伊豆の修禅寺に幽閉された。","a":1,"e":"1203年、頼家の外戚比企能員が時政に討たれ、頼家は将軍職を奪われて伊豆の修禅寺に幽閉され、翌年殺された。弟の実朝が3代将軍に立てられた。","m":"比企の変→頼家は修禅寺へ","y":1203},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0054","lv":2,"s":"和田合戦で和田義盛を滅ぼした北条義時は、政所別当に加えて侍所別当も兼ねた。","a":1,"e":"1213年、義時は侍所別当の和田義盛を挑発して滅ぼし、政所別当とあわせて侍所別当も兼ねた。行政と軍事の両方を握ったことで、執権の地位が固まった。","m":"和田合戦で義時が侍所も兼務","y":1213},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0055","lv":2,"s":"1247年の宝治合戦で、北条時頼が滅ぼした有力御家人は和田義盛である。","a":0,"e":"誤り：1247年の宝治合戦で時頼に滅ぼされたのは三浦泰村の一族である。正しくは、和田義盛は1213年の和田合戦で北条義時に滅ぼされた。時頼は外戚の安達氏と結んで三浦氏を討った。","m":"宝治＝三浦泰村、和田合戦＝義盛","y":1247},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0056","lv":2,"s":"3代将軍源実朝は、頼家の子公暁によって鶴岡八幡宮で暗殺された。","a":1,"e":"1219年、実朝は鶴岡八幡宮で兄頼家の子公暁に殺され、源氏の正統の将軍は3代で絶えた。朝廷と幕府の関係が不安定になり、承久の乱の背景となった。","m":"実朝暗殺1219、鶴岡八幡宮","y":1219},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0057","lv":2,"s":"源氏の将軍が絶えたのち、幕府は後鳥羽上皇の皇子を迎えて、次の将軍とした。","a":0,"e":"誤り：幕府は後鳥羽上皇の皇子を将軍に迎えようとしたが、上皇に拒まれた。正しくは、摂関家の九条家から幼い藤原頼経が迎えられ、のち将軍となった（摂家将軍）。","m":"後鳥羽は拒否→摂家将軍頼経","y":1219},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0058","lv":2,"s":"承久の乱後に新たに置かれた新補地頭の得分は、田11町ごとに1町の免田などを定めた新補率法で保障された。","a":1,"e":"新補率法は1223年に定められ、田畑11町ごとに1町の給田と、1段あたり5升の加徴米を地頭の得分とした。乱後、上皇方から没収した3000余カ所に地頭が置かれた。","m":"新補率法＝11町に1町、段別5升","y":1223},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0059","lv":2,"s":"六波羅探題の長官には、代々、有力御家人の三浦氏があたった。","a":0,"e":"誤り：六波羅探題は北方・南方の2人からなり、北条氏一門が任じられた。正しくは、三浦氏は有力御家人で、1247年の宝治合戦で北条時頼に滅ぼされている。","m":"六波羅探題は北条一門","y":1221},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0060","lv":2,"s":"最初の連署に任命されたのは、北条義時である。","a":0,"e":"誤り：最初の連署は北条時房である。正しくは、1224年に義時が没したあと執権となった泰時が、叔父の時房を連署として補佐役に任じ、合議による政治を進めた。","m":"初代連署は叔父の時房","y":1225},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0061","lv":2,"s":"御成敗式目は、朝廷や荘園領主が支配する公家の社会にも適用され、公家法をなくした。","a":0,"e":"誤り：御成敗式目の効力は幕府の支配が及ぶ範囲に限られた。正しくは、朝廷の公家法や荘園領主の本所法はそのまま存続し、式目は武家社会の先例と道理にもとづく法であった。","m":"式目は武家社会のみ、公家法は存続","y":1232},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0062","lv":2,"s":"御成敗式目は全35カ条からなる。","a":0,"e":"誤り：御成敗式目は全51カ条である。正しくは、頼朝以来の先例と武家社会の道理を基準に、御家人の所領や守護・地頭の職務、裁判の基準を定めた。のち追加法（式目追加）が出された。","m":"式目は51カ条（貞永式目）","y":1232},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0063","lv":3,"s":"1183年、朝廷は寿永二年十月宣旨で、頼朝に東国の支配権を認めた。","a":1,"e":"1183年の寿永二年十月宣旨で、頼朝は東海道・東山道の諸国の支配権を朝廷から認められた。反乱軍だった頼朝の東国支配が公認された点で、幕府成立の重要な一歩とされる。","m":"寿永二年十月宣旨＝東国支配公認","y":1183},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0064","lv":3,"s":"守護・地頭の設置を朝廷に認めさせるため上洛して交渉した人物は、梶原景時である。","a":0,"e":"誤り：1185年に頼朝の代官として上洛し、守護・地頭の設置を朝廷と交渉したのは北条時政である。正しくは、梶原景時は侍所の所司で、頼朝の死後に失脚した人物である。","m":"守護地頭の交渉は北条時政","y":1185},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0065","lv":3,"s":"1189年、奥州藤原氏は源頼朝の軍に攻められて滅亡した。","a":1,"e":"1189年、頼朝は義経をかくまったことを理由に奥州藤原氏を攻めた。泰衡は義経を討って許しを求めたが、頼朝は自ら大軍を率いて平泉を攻め、藤原氏を滅ぼした。","m":"1189年、奥州藤原氏滅亡","y":1189},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0066","lv":3,"s":"1190年に上洛した源頼朝が最初に任じられた官は、征夷大将軍であった。","a":0,"e":"誤り：頼朝は1190年の上洛で権大納言・右近衛大将に任じられたが、まもなく辞任した。正しくは、征夷大将軍に任じられたのは後白河法皇の死後の1192年である。","m":"1190右大将→1192将軍","y":1190},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0067","lv":3,"s":"頼朝の死後、2代将軍頼家の独断を抑えるため、有力御家人13人による合議制が設けられた。","a":1,"e":"1199年に頼朝が没すると、北条時政・義時、大江広元、三善康信ら13人の有力者が訴訟を合議で決める体制がとられ、若い頼家が単独で裁断することが制限された。","m":"頼朝死後に十三人の合議制","y":1199},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0068","lv":3,"s":"守護は荘園・公領ごとに、地頭は国ごとに置かれた。","a":0,"e":"誤り：守護と地頭の設置単位が逆である。正しくは、守護は国ごとに置かれて国内の御家人を統率し、地頭は荘園・公領ごとに置かれて年貢の徴収や土地の管理にあたった。","m":"守護は国、地頭は荘園・公領"},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0070","lv":3,"s":"訴訟を迅速に裁くための引付は、北条泰時が設置した。","a":0,"e":"誤り：引付は1249年に5代執権北条時頼が設けた。正しくは、泰時が置いたのは連署と評定衆で、時頼は評定衆の下に引付衆を置き、御家人の所領訴訟を迅速に処理させた。","m":"引付は時頼、評定衆は泰時","y":1249},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0072","lv":3,"s":"後嵯峨上皇の皇子宗尊親王が最初の皇族将軍となったときの執権は、北条泰時であった。","a":0,"e":"誤り：1252年、後嵯峨上皇の皇子宗尊親王を最初の皇族将軍として迎えたときの執権は北条時頼である。正しくは、泰時は1242年に没していた。時頼は前将軍頼経を京都に送り返している。","m":"皇族将軍1252は時頼の時","y":1252},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0073","lv":1,"s":"元のフビライ・ハンは日本に朝貢を求めたが、執権北条時宗はこれを拒否した。","a":1,"e":"1268年、フビライは高麗を通じて国書を送り、日本に服属を求めた。同年に執権となった北条時宗はこれを退け、九州の防備を固めた。2度の襲来の発端である。","m":"1268年の国書を時宗が拒否","y":1268},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0074","lv":1,"s":"文永の役は1281年、弘安の役は1274年に起こった。","a":0,"e":"誤り：文永の役と弘安の役の年が逆である。正しくは、文永の役が1274年、弘安の役が1281年で、その間に元は南宋を滅ぼし、2度目はより大規模な遠征となった。","m":"文永1274が先、弘安1281が後","y":1281},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0075","lv":1,"s":"1281年の弘安の役では、元軍の船団が暴風雨にあって大きな被害を受け、撤退した。","a":1,"e":"1281年、東路軍と江南軍の大軍が襲来したが、博多湾岸の石塁と御家人の奮戦で上陸を阻まれ、長く海上にとどまるうちに暴風雨で大損害を受けて敗退した。","m":"弘安は石塁と暴風雨で撤退","y":1281},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0076","lv":1,"s":"幕府は、元軍の再襲来に備え、文永の役の前に博多湾沿岸に石塁（元寇防塁）を築かせた。","a":0,"e":"誤り：石塁は文永の役ののち、1276年から博多湾沿岸に築かれた。正しくは、九州の御家人などに分担させて築造し、5年後の弘安の役で元軍の上陸を防ぐ効果をあげた。","m":"石塁は文永の後、弘安に間に合う","y":1276},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0077","lv":1,"s":"肥後の御家人竹崎季長は、元寇での自らの戦いを『蒙古襲来絵詞』に描かせた。","a":1,"e":"肥後の御家人竹崎季長は、文永の役の戦功が認められず、鎌倉に赴いて恩賞奉行の安達泰盛に直訴し、地頭職を得た。こうした経緯を『蒙古襲来絵詞』に描かせた。","m":"竹崎季長＝蒙古襲来絵詞"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0078","lv":1,"s":"永仁の徳政令を出したのは、執権北条時宗である。","a":0,"e":"誤り：1297年に永仁の徳政令を出したのは9代執権北条貞時である。正しくは、時宗は元寇のときの執権で、1284年に没している。","m":"元寇は時宗、徳政令は貞時","y":1297},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0079","lv":1,"s":"永仁の徳政令は、御家人が質入れや売却をした所領を、無償で取り戻せるとした法令である。","a":1,"e":"永仁の徳政令は、御家人が売ったり質に入れたりした所領を無償で取り戻させ、今後の売買・質入れも禁じた。御家人の所領を守ることで幕府の基盤を保とうとした。","m":"永仁の徳政令＝所領の無償取り戻し","y":1297},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0080","lv":1,"s":"九州の軍事・裁判をつかさどる鎮西探題は、承久の乱後に設けられた。","a":0,"e":"誤り：承久の乱後に置かれたのは京都の六波羅探題である。正しくは、鎮西探題は元寇後の1293年、九州の防備強化と御家人の訴訟処理のために博多に置かれ、北条氏一門が任じられた。","m":"鎮西探題は元寇後1293・博多","y":1293},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0081","lv":1,"s":"鎌倉時代後期、荘園領主に従わず、年貢を奪うなど武力で抵抗する武士集団が現れ、悪党とよばれた。","a":1,"e":"鎌倉後期、畿内とその周辺で、荘園領主や幕府に従わず年貢を奪うなどして武力で抵抗する者が現れ、悪党とよばれた。楠木正成のように討幕に加わる者もいた。","m":"悪党＝領主に武力で抵抗"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0082","lv":1,"s":"後醍醐天皇は、持明院統に属していた。","a":0,"e":"誤り：後醍醐天皇は亀山天皇の流れをくむ大覚寺統である。正しくは、持明院統は後深草天皇の系統で、のち足利尊氏が立てた北朝の天皇はこの系統から出た。","m":"後醍醐は大覚寺統（亀山系）"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0083","lv":1,"s":"後醍醐天皇は幕府の打倒を企て、1331年の元弘の変で挙兵したが失敗した。","a":1,"e":"1331年、後醍醐天皇は再び討幕を計画して笠置山にこもったが捕らえられ、翌年隠岐に流された。この間も楠木正成や護良親王らは各地で抵抗を続けた。","m":"元弘の変1331→後醍醐は隠岐","y":1331},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0084","lv":1,"s":"1333年、鎌倉を攻めて北条氏を滅ぼしたのは、足利尊氏（高氏）である。","a":0,"e":"誤り：1333年に鎌倉を攻め落としたのは上野の新田義貞である。正しくは、足利高氏（尊氏）は幕府軍として西上したのち寝返り、京都の六波羅探題を攻め落とした。","m":"鎌倉は新田義貞、六波羅は高氏","y":1333},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0085","lv":1,"s":"鎌倉後期、所領の分割相続が繰り返され、御家人の所領は細分化して、生活が苦しくなった。","a":1,"e":"鎌倉時代の武士は所領を子らに分けて相続したため、代を重ねるごとに一人あたりの所領が小さくなった。元寇の負担と恩賞不足も重なり、御家人の生活は苦しくなった。","m":"分割相続で所領が細分化"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0086","lv":2,"s":"文永の役では、元軍が火薬を使う「てつはう」などを用い、集団戦法で日本軍を苦しめた。","a":1,"e":"1274年の文永の役では、元・高麗軍が集団戦法と、火薬で炸裂する「てつはう」を用いた。一騎打ちに慣れた御家人は苦戦したが、元軍はまもなく撤退した。","m":"文永は集団戦法とてつはう","y":1274},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0088","lv":2,"s":"弘安の役の江南軍は、高麗の兵を主力とする軍であった。","a":0,"e":"誤り：高麗の兵を主力としたのは朝鮮半島から出発した東路軍である。正しくは、江南軍は滅亡した南宋の兵を主力とし、中国の江南から出航した。","m":"東路軍＝元・高麗、江南軍＝旧南宋","y":1281},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0089","lv":2,"s":"幕府は北九州の沿岸の防備のため、九州の御家人に異国警固番役を課した。","a":1,"e":"異国警固番役は、元の襲来に備えて九州の御家人に博多湾岸など北九州の警備を交代で務めさせたもので、文永の役の前から課された。元寇後も続けられ、御家人の負担となった。","m":"異国警固番役＝九州御家人の警備","y":1271},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0090","lv":2,"s":"霜月騒動で、内管領平頼綱が滅ぼした有力御家人は、三浦泰村である。","a":0,"e":"誤り：1285年の霜月騒動で内管領平頼綱に滅ぼされたのは有力御家人の安達泰盛である。正しくは、三浦泰村は1247年の宝治合戦で滅んでいる。この騒動で得宗専制が強まった。","m":"霜月騒動＝頼綱が安達泰盛を討つ","y":1285},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0091","lv":2,"s":"1293年、執権北条貞時は内管領平頼綱を討ち、幕府の実権を取り戻した。","a":1,"e":"1293年、成長した貞時は権勢をふるった内管領平頼綱を討った（平禅門の乱）。こののち貞時は得宗として自ら権力を握り、得宗専制の体制が一層強まった。","m":"平禅門の乱＝貞時が頼綱を討つ","y":1293},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0092","lv":2,"s":"得宗家の家臣である御内人の代表者を、評定衆とよぶ。","a":0,"e":"誤り：得宗家の家臣（御内人）の代表は内管領である。正しくは、評定衆は執権・連署とともに幕府の政務・裁判を合議する機関で、有力御家人が任じられた。","m":"御内人の代表は内管領"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0093","lv":2,"s":"永仁の徳政令では、判決に不服な者が再審を求める越訴も停止された。","a":1,"e":"1297年の徳政令は、所領の取り戻しと売買・質入れの禁止に加え、越訴の停止や、御家人が関わる金銭貸借の訴訟を受理しないことも定めた。訴訟の負担を減らす狙いがあった。","m":"徳政令は越訴の停止も含む","y":1297},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0094","lv":2,"s":"元寇では、幕府は十分な新しい領地を恩賞として与えたため、御家人の不満は小さかった。","a":0,"e":"誤り：元寇は外敵を撃退した防衛戦で、新たな土地は得られなかった。正しくは、幕府は御家人に十分な恩賞を与えられず、多くの犠牲を払った御家人の不満が高まった。","m":"防衛戦で恩賞の土地なし"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0095","lv":2,"s":"鎌倉時代後期には、所領の細分化を防ぐため、単独相続から分割相続への移行が進んだ。","a":0,"e":"誤り：移行の向きが逆である。正しくは、分割相続で所領が細分化したため、嫡子が所領を一括して受け継ぐ単独相続へ移り、庶子は嫡子に従う立場になった。惣領制はこれで崩れていった。","m":"分割相続→単独相続へ"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0096","lv":2,"s":"北条時宗は、宋から来た禅僧無学祖元を招き、円覚寺を建立した。","a":1,"e":"時宗は南宋から渡来した禅僧無学祖元を招き、1282年に鎌倉に円覚寺を建てた。元寇の戦死者を敵味方なく弔う意味もあった。時頼が招いた蘭溪道隆の建長寺と区別する。","m":"円覚寺は時宗と無学祖元","y":1282},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0097","lv":2,"s":"文永の役のときの執権は、北条貞時であった。","a":0,"e":"誤り：文永の役・弘安の役のときの執権は北条時宗である。正しくは、貞時は時宗の子で、霜月騒動・平禅門の乱を経て得宗専制を進め、1297年に永仁の徳政令を出した。","m":"元寇の執権は時宗、子が貞時","y":1274},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0098","lv":2,"s":"鎌倉時代には、畿内を中心に年3回の収穫を行う三毛作が広く行われた。","a":0,"e":"誤り：鎌倉時代に西日本で広まったのは、稲の裏作に麦をつくる二毛作である。正しくは、畿内で三毛作が行われたのは室町時代で、朝鮮の使節の記録にも見える。","m":"鎌倉は二毛作、室町に三毛作"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0099","lv":3,"s":"1275年、元の使者杜世忠らは、鎌倉で処刑された。","a":1,"e":"文永の役の翌年、元は杜世忠らを使者として再び服属を求めたが、時宗は彼らを鎌倉の竜ノ口で処刑した。幕府は徹底抗戦の姿勢を示し、石塁の築造を進めた。","m":"1275年、元使杜世忠を処刑","y":1275},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0101","lv":3,"s":"御家人は、借上とよばれる金融業者から借金するため、所領を質入れ・売却して生活を支えるようになった。","a":1,"e":"御家人は生活のため、借上などの金融業者から所領を担保に借金し、返せずに所領を失うことが多かった。貨幣経済の広がりが窮乏を進め、幕府は永仁の徳政令で対応した。","m":"借上から借金し所領を失う"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0102","lv":3,"s":"永仁の徳政令の結果、御家人の窮乏はたちまち解消された。","a":0,"e":"誤り：永仁の徳政令の効果は一時的だった。正しくは、御家人は以後かえって金を借りにくくなり、経済は混乱した。売買禁止などの条項の一部は翌年に撤回され、窮乏は続いた。","m":"徳政令は一時的、翌年一部撤回","y":1297},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0103","lv":3,"s":"1317年、幕府は文保の和談で、両統迭立の方針を朝廷に示した。","a":1,"e":"1317年、幕府は皇位をめぐる持明院統と大覚寺統の争いに対し、両統が交互に皇位につく両統迭立を提案した（文保の和談）。翌年、大覚寺統の後醍醐天皇が即位した。","m":"文保の和談1317→後醍醐即位","y":1317},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0104","lv":3,"s":"後醍醐天皇は、院政を行いながら討幕を計画した。","a":0,"e":"誤り：後醍醐天皇は院政を行っていない。正しくは、1321年に父の後宇多上皇の院政を停止して天皇親政を始め、記録所を再興し、天皇中心の政治をめざして討幕を計画した。","m":"後醍醐は院政停止→親政","y":1321},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0105","lv":3,"s":"1324年、後醍醐天皇の討幕計画が発覚した事件を正中の変という。","a":1,"e":"1324年、後醍醐天皇の討幕計画は事前に六波羅探題に知られた。天皇は罪を免れたが、側近の日野資朝が佐渡に流された。天皇はこれで討幕をあきらめず、元弘の変を起こした。","m":"正中の変1324、資朝は佐渡","y":1324},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0106","lv":3,"s":"元弘の変に敗れた後醍醐天皇は、佐渡に流された。","a":0,"e":"誤り：元弘の変後に後醍醐天皇が流されたのは隠岐である。正しくは、佐渡に流されたのは承久の乱の順徳上皇や、正中の変の日野資朝などである。天皇は1333年に隠岐を脱出した。","m":"後醍醐は隠岐、脱出して討幕","y":1331},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0107","lv":3,"s":"後醍醐天皇の呼びかけに応じて、河内の楠木正成らが悪党的な武士を率いて、幕府軍と戦った。","a":1,"e":"河内の楠木正成は赤坂城・千早城にこもり、少ない兵で幕府の大軍を長く引きつけた。これに呼応して各地で反幕府の動きが広がり、幕府の滅亡につながった。","m":"楠木正成は赤坂・千早城","y":1333},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0108","lv":3,"s":"鎌倉幕府の滅亡のとき、最後の得宗として鎌倉で自害したのは、北条貞時である。","a":0,"e":"誤り：1333年に鎌倉で一族とともに自害した最後の得宗は北条高時である。正しくは、貞時は高時の父で、1311年に没している。高時は14代執権を務めた。","m":"滅亡時の得宗は北条高時","y":1333},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0109","lv":1,"s":"後醍醐天皇は幕府を滅ぼしたのち、摂政・関白を置かず、天皇が政治を行う新政を始めた。","a":1,"e":"1333年に京都へ戻った後醍醐天皇は、摂政・関白を置かず、院政も幕府も否定して天皇が直接政治を行った。醍醐・村上天皇の延喜・天暦の治を理想とした。","m":"新政は延喜・天暦の治が理想","y":1333},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0110","lv":1,"s":"建武の新政は、武家社会の慣習を重んじ、武士に十分な恩賞を与えたため、武士の支持を広く得た。","a":0,"e":"誤り：建武の新政は公家を重んじ、武士の慣習を軽んじた。正しくは、恩賞の配分は公家や側近に厚く不公平で、多くの武士が新政に失望し、武家政治の再興を望んで足利尊氏のもとに集まった。","m":"公家重視で武士が離反","y":1334},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0111","lv":1,"s":"建武政権の混乱を、京都の二条河原に掲げられた落書が風刺した。","a":1,"e":"1334年ごろ京都の二条河原に掲げられた落書は、夜討・強盗・偽の綸旨の横行や、にわか大名の出現などを並べ、新政下の京都の混乱を皮肉った。作者は不明である。","m":"二条河原落書で新政を風刺","y":1334},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0112","lv":1,"s":"北条時行が起こした中先代の乱を鎮めた足利尊氏は、朝廷の命に従って京都に戻った。","a":0,"e":"誤り：尊氏は乱の鎮圧後も京都に戻らず、鎌倉にとどまって独自に恩賞を与えた。正しくは、こうして新政に反旗をひるがえし、新田義貞の追討軍を破って京都へ攻め上った。","m":"中先代鎮圧後、尊氏は鎌倉で離反","y":1335},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0113","lv":1,"s":"1336年、湊川の戦いで足利尊氏の軍に敗れた楠木正成は、自害した。","a":1,"e":"1336年、九州から東上した足利尊氏の軍は摂津の湊川で楠木正成・新田義貞の軍を破った。正成は弟の正季とともに自害し、尊氏は京都に入った。","m":"湊川1336、楠木正成は自害","y":1336},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0114","lv":1,"s":"建武式目は、後醍醐天皇が政治の基本方針として示したものである。","a":0,"e":"誤り：建武式目は1336年に足利尊氏が示した施政方針である。正しくは、後醍醐天皇の政策ではなく、尊氏が京都を押さえて光明天皇を立てた直後に出され、室町幕府の出発点とされる。","m":"建武式目は尊氏の方針","y":1336},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0115","lv":1,"s":"足利尊氏は京都に光明天皇を立て、吉野に逃れた後醍醐天皇の朝廷と対立した。","a":1,"e":"1336年、尊氏は持明院統の光明天皇を立て、後醍醐天皇は大和の吉野に逃れて正統を主張した。京都の北朝と吉野の南朝が並び立ち、約60年の南北朝の動乱が始まった。","m":"北朝は京都、南朝は吉野","y":1336},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0116","lv":1,"s":"足利尊氏が征夷大将軍に任じられたのは、1392年である。","a":0,"e":"誤り：尊氏が北朝から征夷大将軍に任じられたのは1338年である。正しくは、1392年は3代将軍義満のもとで南北朝が合体した年で、尊氏は1358年に没している。","m":"尊氏将軍1338、合体1392","y":1338},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0117","lv":1,"s":"1392年、3代将軍足利義満のときに南北朝が合体した。","a":1,"e":"1392年、3代将軍足利義満の仲介で、南朝の後亀山天皇が京都に戻り、北朝の後小松天皇に譲位する形で南北朝が合体した。約60年の動乱が終わった。","m":"1392年、義満が南北朝合体","y":1392},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0119","lv":1,"s":"『太平記』は、南北朝の動乱を描いた軍記物語である。","a":1,"e":"『太平記』は、鎌倉幕府の滅亡から南北朝の動乱までを描いた軍記物語で、のちに太平記読みによって語り広められた。南朝方に同情的な記述も多い。","m":"太平記＝南北朝の軍記物語"},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0120","lv":1,"s":"『神皇正統記』を著して南朝の正統性を主張したのは、楠木正成である。","a":0,"e":"誤り：『神皇正統記』の著者は北畠親房である。正しくは、親房は常陸の小田城で戦いながら、神代以来の皇位継承をたどり、南朝こそ正統であると論じた。楠木正成は湊川で自害した武将である。","m":"神皇正統記＝北畠親房","y":1339},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0121","lv":1,"s":"建武政権では、記録所や雑訴決断所、恩賞方、武者所などの中央機関が設けられた。","a":1,"e":"中央には、重要政務を扱う記録所、所領訴訟の雑訴決断所、恩賞を扱う恩賞方、京都の警備にあたる武者所が置かれた。天皇の綸旨が絶対とされ、処理が追いつかなかった。","m":"記録所・雑訴決断所・恩賞方・武者所","y":1333},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0122","lv":2,"s":"中先代の乱は、北条高時の子の時行が鎌倉を占領した事件である。","a":1,"e":"1335年、北条高時の子時行が信濃で挙兵して鎌倉を一時占領した。北条氏（先代）と足利氏（後代）の間に立つ意味で中先代の乱とよぶ。尊氏が鎮圧に向かった。","m":"中先代の乱＝北条時行","y":1335},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0123","lv":2,"s":"建武政権が東北統治のために置いた陸奥将軍府には、新田義貞が派遣された。","a":0,"e":"誤り：陸奥将軍府には、北畠顕家が義良親王を奉じて下った。正しくは、新田義貞は鎌倉を攻め落とした武将で、建武政権では京都にいて、のち尊氏と戦った。","m":"陸奥将軍府は北畠顕家","y":1333},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0125","lv":2,"s":"建武政権で所領に関する訴訟を扱ったのは、武者所である。","a":0,"e":"誤り：所領に関する訴訟を扱ったのは雑訴決断所である。正しくは、武者所は新田義貞らが詰めて京都の警備にあたった機関で、裁判は扱わない。所領争いが多く、雑訴決断所は増員を重ねた。","m":"訴訟は雑訴決断所、警備は武者所","y":1333},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0126","lv":2,"s":"観応の擾乱は、足利尊氏の執事高師直と、尊氏の弟足利直義との対立から起こった。","a":1,"e":"1350年、尊氏の執事高師直と、政務を担った弟直義との対立から観応の擾乱が起こった。のち尊氏と直義の兄弟が争い、両派がそれぞれ南朝と結んだため動乱は長引いた。","m":"観応の擾乱＝師直対直義","y":1350},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0128","lv":2,"s":"九州では、南朝の懐良親王が征西将軍として勢力を広げた。","a":1,"e":"懐良親王は後醍醐天皇の皇子で、征西将軍として九州に下り、菊池氏の支援を得て一時は大宰府を押さえた。のち九州探題の今川了俊に攻められて勢力を失った。","m":"征西将軍懐良親王、菊池氏が支援"},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0129","lv":2,"s":"1352年の観応の半済令は、荘園・公領の年貢の半分を地頭に与えるものである。","a":0,"e":"誤り：半済令で年貢の半分を与えられたのは守護である。正しくは、守護が国内の荘園・公領の年貢の半分を兵粮米として徴収し、配下の武士に分け与えることを認めた。","m":"半済＝守護が年貢の半分を得る","y":1352},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0130","lv":2,"s":"足利尊氏が京都に擁立した光明天皇は、大覚寺統の天皇である。","a":0,"e":"誤り：光明天皇は持明院統である。正しくは、尊氏は後醍醐の大覚寺統と対立する持明院統から天皇を立てた。北朝は持明院統、南朝は大覚寺統という区別になる。","m":"北朝は持明院統、南朝は大覚寺統","y":1336},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0132","lv":2,"s":"荘園領主が守護に年貢の徴収を請け負わせる守護請が広まり、守護による荘園の支配が進んだ。","a":1,"e":"室町時代には、荘園領主が守護に一定額の年貢納入を請け負わせる守護請が広まった。守護は請け負った荘園の実質的な支配者となり、領国化を進めた。","m":"守護請で守護が荘園を侵食"},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0133","lv":2,"s":"新田義貞は、湊川の戦いで楠木正成とともに討死した。","a":0,"e":"誤り：湊川の戦いで自害したのは楠木正成である。正しくは、新田義貞は湊川で敗れて京都に退き、のち北陸に移って1338年に越前の藤島で戦死した。","m":"正成は湊川、義貞は藤島","y":1338},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0134","lv":2,"s":"後醍醐天皇は、1339年に京都で没した。","a":0,"e":"誤り：後醍醐天皇は京都に戻れないまま、1339年に吉野で没した。正しくは、吉野の南朝は皇子の後村上天皇が継ぎ、北畠親房らがこれを支えた。","m":"後醍醐は1339年吉野で没","y":1339},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0135","lv":3,"s":"1352年の観応の半済令は、近江・美濃・尾張の3国を対象に、1年限りで認められた。","a":1,"e":"最初の半済令（1352年）は、戦乱の激しい近江・美濃・尾張の3国に限り、1年限りで本所領の年貢の半分を守護に与えた。のちに対象の国が広がり、期限も守られなくなった。","m":"観応の半済令＝近江・美濃・尾張","y":1352},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0136","lv":3,"s":"京都を逃れた後醍醐天皇が朝廷を開いたのは、河内の千早である。","a":0,"e":"誤り：後醍醐天皇が南朝を開いたのは大和の吉野である。正しくは、千早城は楠木正成が1333年に幕府の大軍を防いだ河内の山城である。","m":"南朝は吉野、千早城は楠木","y":1336},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0137","lv":3,"s":"建武式目は17カ条からなり、尊氏の諮問に是円らが答える形でまとめられた施政方針である。","a":1,"e":"建武式目は、幕府を鎌倉に置くかどうかという問いへの答えと、政治の方針17カ条からなる。明法家の是円（中原章賢）らが尊氏の諮問に答える形で示した。","m":"建武式目は17カ条、是円らが答申","y":1336},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0138","lv":3,"s":"室町幕府の2代将軍は、足利義満である。","a":0,"e":"誤り：室町幕府の2代将軍は尊氏の子の足利義詮である。正しくは、義満は義詮の子で3代将軍となり、幼くして将軍職を継いだため、管領細川頼之が補佐した。","m":"1尊氏・2義詮・3義満","y":1358},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0141","lv":3,"s":"南朝の後亀山天皇は、北朝の後小松天皇に三種の神器を渡して、南北朝を合体させた。","a":1,"e":"1392年の合体では、後亀山天皇が京都に戻り三種の神器を後小松天皇に渡した。合体の条件だった両統の交互の即位は守られず、皇位は北朝系に受け継がれた。","m":"神器は後亀山→後小松","y":1392},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0143","lv":3,"s":"足利尊氏は、夢窓疎石の勧めで後醍醐天皇の冥福を祈る天龍寺を建立した。","a":1,"e":"尊氏・直義は禅僧夢窓疎石に帰依し、その勧めで後醍醐天皇の冥福を祈る天龍寺を建てた。造営費用を得るため、元に天龍寺船が派遣された。","m":"天龍寺は夢窓疎石の勧め"},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0144","lv":3,"s":"鎌倉将軍府には、足利尊氏が成良親王を奉じて下り、東国を治めた。","a":0,"e":"誤り：鎌倉将軍府に成良親王を奉じて下ったのは尊氏の弟の足利直義である。正しくは、尊氏は京都にとどまり、のち中先代の乱の鎮圧のために鎌倉へ下った。","m":"鎌倉将軍府は直義と成良親王","y":1333},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0145","lv":1,"s":"3代将軍足利義満は、京都の室町に花の御所を営み、ここで政治を行った。","a":1,"e":"義満は1378年、京都の室町に壮麗な邸宅（花の御所）を造って政治の拠点とした。幕府の名はこの地名に由来する。義満は晩年には北山第に移った。","m":"1378年、室町の花の御所","y":1378},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0146","lv":1,"s":"管領には、赤松・一色・山名・京極の4氏が交代で任じられた。","a":0,"e":"誤り：管領には細川・斯波・畠山の3氏（三管領）が交代で任じられた。正しくは、赤松・一色・山名・京極の4氏（四職）は侍所の長官である所司に任じられた。","m":"管領は三管領、所司は四職"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0147","lv":1,"s":"鎌倉府は、関東などの統治のために鎌倉に置かれ、その長官は鎌倉公方とよばれた。","a":1,"e":"鎌倉府は関東を治める幕府の出先機関で、長官の鎌倉公方は足利基氏の子孫が世襲した。京都の将軍に匹敵する権限を持ち、のち将軍と対立するようになった。","m":"鎌倉府の長官は鎌倉公方"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0148","lv":1,"s":"鎌倉公方を補佐した関東管領は、足利氏の一族が世襲した。","a":0,"e":"誤り：鎌倉公方を補佐した関東管領は上杉氏が世襲した。正しくは、鎌倉公方が足利氏で、関東管領の上杉氏は幕府と結んで公方と対立することがあり、永享の乱にもつながった。","m":"公方は足利、関東管領は上杉"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0149","lv":1,"s":"1391年の明徳の乱で、守護大名の山名氏清が将軍足利義満に討たれた。","a":1,"e":"1391年、義満は山名氏の一族内の争いにつけこんで山名氏清らを挑発し、京都に攻め込ませて討った（明徳の乱）。山名氏の守護国は大きく減った。","m":"明徳の乱1391＝山名氏清","y":1391},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0150","lv":1,"s":"応永の乱で将軍足利義満に討たれたのは、山名氏清である。","a":0,"e":"誤り：1399年の応永の乱で討たれたのは大内義弘である。正しくは、山名氏清は1391年の明徳の乱で討たれた。義満は有力守護を挑発して討ち、その勢力を削っていった。","m":"明徳は山名、応永は大内","y":1399},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0151","lv":1,"s":"足利義満は、1394年に将軍職を子の義持に譲り、同じ年に太政大臣に就任した。","a":1,"e":"義満は1394年に将軍職を子の義持に譲り、同じ年に太政大臣となった。翌年に出家したが、その後も実権を握り続け、公家と武家の両方の頂点に立った。","m":"1394年、将軍を譲り太政大臣","y":1394},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0152","lv":1,"s":"嘉吉の変で、6代将軍足利義教は、山名持豊に殺された。","a":0,"e":"誤り：1441年の嘉吉の変で義教を殺害したのは播磨の守護赤松満祐である。正しくは、山名持豊（宗全）は幕府軍として赤松氏を討った側で、その功で勢力をのばした。","m":"嘉吉の変で義教を討つ赤松満祐","y":1441},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0153","lv":1,"s":"守護は、任国内の武士を家臣化し、地域の支配権を強めて、守護大名とよばれる存在になった。","a":1,"e":"守護は半済や守護請を利用して荘園・公領を侵し、国内の国人を家臣（被官）に組み込んだ。こうして一国を支配する守護大名へと成長し、守護職も世襲されるようになった。","m":"守護→国人を被官化→守護大名"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0154","lv":1,"s":"室町幕府は、土倉や酒屋から税を取ることはなく、財源は年貢と守護からの献上のみであった。","a":0,"e":"誤り：室町幕府は土倉役・酒屋役を課していた。正しくは、御料所からの収入のほか、土倉役・酒屋役、関所の関銭・津料、臨時の段銭・棟別銭、日明貿易の利益などが財源となった。","m":"財源に土倉役・酒屋役"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0155","lv":1,"s":"守護大名の多くは、幕府の政治に参加するため、領国を離れて京都に住んだ。","a":1,"e":"守護大名は原則として京都に住み、幕府の政治に参加した。領国の支配は守護代に任せたため、のちに守護代や国人が力をつけて守護に取って代わる例が生まれた。","m":"守護は在京、領国は守護代"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0156","lv":1,"s":"奉公衆は、守護大名の家臣団のなかから選ばれた武士集団である。","a":0,"e":"誤り：奉公衆は将軍直属の軍事力である。正しくは、足利氏の一門や有力な国人から選ばれて将軍の身辺を守り、各地の御料所の管理も担った。守護の家臣とは別の組織である。","m":"奉公衆は将軍直属の軍事力"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0157","lv":1,"s":"初代の鎌倉公方は、足利尊氏の弟の足利直義である。","a":0,"e":"誤り：初代鎌倉公方は尊氏の子の足利基氏である。正しくは、尊氏は1349年に基氏を鎌倉に下し、以後その子孫が鎌倉公方を世襲した。直義は観応の擾乱で尊氏と争った弟である。","m":"初代鎌倉公方は尊氏の子基氏","y":1349},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0158","lv":2,"s":"1390年、美濃の守護土岐康行が、足利義満に討たれた。","a":1,"e":"1390年、義満は美濃・尾張・伊勢の守護を兼ねた土岐氏の内紛につけこみ、土岐康行を討った。明徳の乱・応永の乱と続く、有力守護の勢力を削る政策の最初である。","m":"土岐康行の乱1390が最初","y":1390},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0159","lv":2,"s":"山名氏は一族で11カ国の守護を占め、「六分一殿」とよばれた。","a":1,"e":"山名氏は一族で全国66カ国の約6分の1にあたる11カ国の守護を兼ね、六分一殿（六分一衆）とよばれた。義満はこの強大さを警戒し、明徳の乱で勢力を削った。","m":"山名氏11カ国＝六分一殿","y":1391},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0161","lv":2,"s":"応永の乱で、大内義弘は周防の山口で挙兵して敗れた。","a":0,"e":"誤り：大内義弘が挙兵したのは和泉の堺である。正しくは、周防・長門など6カ国の守護を兼ねた義弘は、義満と対立して1399年に堺で挙兵し、敗死した。","m":"応永の乱は大内義弘が堺で挙兵","y":1399},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0162","lv":2,"s":"上杉禅秀の乱は、永享の乱のあとに起こった。","a":0,"e":"誤り：上杉禅秀の乱は1416年、永享の乱は1438年で、禅秀の乱が先である。正しくは、禅秀の乱は鎌倉公方足利持氏に対する前関東管領の反乱で、のちの持氏と幕府の対立の背景となった。","m":"禅秀の乱1416→永享の乱1438","y":1416},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0163","lv":2,"s":"永享の乱で、6代将軍足利義教は、鎌倉公方の足利持氏を討伐した。","a":1,"e":"1438年、幕府に反抗的な鎌倉公方足利持氏と関東管領上杉憲実が対立すると、義教は憲実を助けて持氏を攻め、翌年自害させた（永享の乱）。","m":"永享の乱＝義教が持氏を討つ","y":1438},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0164","lv":2,"s":"嘉吉の変の後に、徳政を求めて起こった土一揆を、正長の徳政一揆という。","a":0,"e":"誤り：嘉吉の変（1441年）直後に起きたのは嘉吉の徳政一揆である。正しくは、正長の徳政一揆は1428年、将軍の代替わりを機に近江の馬借の蜂起から始まった一揆である。","m":"正長1428、嘉吉1441","y":1428},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0165","lv":2,"s":"1428年、近江の馬借の蜂起をきっかけに、正長の徳政一揆が起こった。","a":1,"e":"1428年、近江坂本の馬借の蜂起をきっかけに畿内各地の農民が土倉・酒屋・寺院を襲い、借金の証文を破った。大和の柳生には徳政を記した碑文が残る。","m":"正長の徳政一揆＝近江の馬借から","y":1428},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0166","lv":2,"s":"御料所とは、守護大名が任国に持つ領国のことをいう。","a":0,"e":"誤り：御料所は将軍家の直轄領である。正しくは、幕府は御料所を各地に持ち、奉公衆などに管理させて財源とした。守護大名の領国とは別のものである。","m":"御料所＝将軍家の直轄領"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0167","lv":2,"s":"幕府は、臨時の課税として、田地に課す段銭や家屋に課す棟別銭を、全国に課した。","a":1,"e":"段銭は田地の面積に、棟別銭は家屋の数に応じて臨時に課された税である。即位や内裏の造営など国家的な行事を名目に、幕府が守護を通じて徴収した。","m":"段銭は田、棟別銭は家"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0169","lv":2,"s":"室町幕府の侍所の長官には、管領があたった。","a":0,"e":"誤り：侍所の長官は所司とよばれ、赤松・一色・山名・京極の四職から任じられた。正しくは、管領は将軍を補佐して政務を統轄する職で、三管領から任じられた。","m":"侍所の長官は所司（四職）"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0171","lv":3,"s":"足利義満が京都で営んだ山荘は、東山山荘である。","a":0,"e":"誤り：義満が京都に営んだ山荘は北山第で、舎利殿が金閣として知られる。正しくは、東山山荘は8代将軍足利義政が営み、観音殿が銀閣とよばれる。","m":"北山は義満、東山は義政"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0172","lv":3,"s":"守護には、幕府の裁決を現地で実行する使節遵行の権限が認められた。","a":1,"e":"使節遵行は、幕府の判決を守護が使者を送って現地で強制執行する権限である。刈田狼藉の取締りとともに南北朝期に守護に認められ、守護の国内支配を強めた。","m":"使節遵行＝判決を守護が執行"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0174","lv":3,"s":"上杉禅秀の乱は、前関東管領の上杉禅秀が、鎌倉公方足利持氏に対して起こした乱である。","a":1,"e":"1416年、前関東管領上杉禅秀（氏憲）が鎌倉公方足利持氏に背いて挙兵し、持氏は一時鎌倉を追われた。幕府の援助で乱は鎮められた。","m":"上杉禅秀の乱1416は前関東管領","y":1416},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0175","lv":3,"s":"九州探題の今川了俊は、南朝方の勢力を抑え、九州の平定を進めたが、のち解任された。","a":1,"e":"今川了俊（貞世）は九州探題として下り、懐良親王ら南朝方を抑えて九州をほぼ平定した。しかし強大化を警戒した義満によって1395年に解任された。","m":"九州探題今川了俊、1395年解任","y":1395},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0176","lv":3,"s":"応安の半済令では、守護が得るのは年貢の半分にとどまり、土地そのものの折半は認められなかった。","a":0,"e":"誤り：応安の半済令（1368年）は年貢だけでなく土地そのものを折半させた。正しくは、寺社本所領の土地を守護方と領主方に分ける内容で、天皇家や摂関家の所領、寺社一円領などは除外された。","m":"応安の半済令は土地を折半","y":1368},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0177","lv":3,"s":"結城合戦は、鎌倉公方の足利持氏の遺児を擁した結城氏朝が、幕府に討たれた戦いである。","a":1,"e":"1440年、下総の結城氏朝は永享の乱で滅んだ足利持氏の遺児を擁して挙兵したが、幕府軍に敗れた。遺児は捕らえられ、京都へ送られる途中で殺された。","m":"結城合戦1440＝持氏の遺児","y":1440},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0180","lv":2,"s":"鎌倉府の管轄は、当初、関東8カ国に伊豆・甲斐を加えた10カ国であった。","a":1,"e":"鎌倉府は関東8カ国と伊豆・甲斐の10カ国を管轄した。1392年には陸奥・出羽も管轄に加えられ、東国全体を治める大きな権限を持った。","m":"鎌倉府は関東8カ国＋伊豆・甲斐"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0181","lv":1,"s":"足利義満は、明の皇帝から日本国王に封じられ、1404年から勘合を用いた日明貿易を始めた。","a":1,"e":"義満は明の皇帝から「日本国王」に封じられ、1404年から勘合を用いた貿易を始めた。冊封を受けて臣下として朝貢する形をとることで、正式な通交が認められた。","m":"義満は日本国王、1404年勘合貿易","y":1404},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0182","lv":1,"s":"日明貿易で、日本は明に対等の立場で貿易を行った。","a":0,"e":"誤り：日明貿易は対等な貿易ではない。正しくは、日本国王が明の皇帝に貢物を献上し、返礼の品を受け取る朝貢形式で行われた。のち義持はこの形式を嫌って貿易を中止した。","m":"日明貿易は臣下として朝貢"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0183","lv":1,"s":"日明貿易で日本は、明から銅銭・生糸・絹織物などを輸入した。","a":1,"e":"明からは永楽通宝などの銅銭、生糸・絹織物、書籍・陶磁器などが輸入された。日本からは銅・硫黄・刀剣・扇・漆器などが輸出され、大量の明銭が国内の貨幣流通を支えた。","m":"輸入は銅銭・生糸、輸出は銅・刀剣"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0184","lv":1,"s":"日明貿易を中止したのは、足利義満である。","a":0,"e":"誤り：日明貿易を中止したのは4代将軍足利義持である。正しくは、義満が始めた朝貢形式の貿易を、義持は1411年に中止し、6代義教が1432年に再開した。","m":"義満開始→義持中止→義教再開","y":1411},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0185","lv":1,"s":"14世紀末、李成桂が高麗を倒して朝鮮を建国した。","a":1,"e":"1392年、倭寇の撃退で名をあげた武将李成桂が高麗を倒して朝鮮を建てた。朝鮮は日本に倭寇の禁圧と通交を求め、義満もこれに応じて国交が開かれた。","m":"1392年、李成桂が朝鮮を建国","y":1392},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0186","lv":1,"s":"日朝貿易の窓口となったのは、対馬の大内氏である。","a":0,"e":"誤り：日朝貿易の窓口となったのは対馬の宗氏である。正しくは、宗氏は朝鮮との通交を管理し、渡航の許可にも関わった。大内氏は周防・長門の守護で、日明貿易などに関わった。","m":"日朝貿易の窓口は対馬の宗氏"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0187","lv":1,"s":"1429年、尚巴志が三山を統一して琉球王国を建てた。","a":1,"e":"沖縄本島では北山・中山・南山の三山が分立していたが、1429年に中山王の尚巴志が統一して琉球王国を建てた。首里を王府とし、明や日本と通交した。","m":"1429年、尚巴志が三山統一","y":1429},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0188","lv":1,"s":"琉球王国の中継貿易の中心となった港は、博多である。","a":0,"e":"誤り：琉球王国の中継貿易の拠点は那覇である。正しくは、琉球は那覇を窓口に、明・日本・朝鮮・東南アジアの産物を取り次ぐ中継貿易で栄えた。博多は日本側の貿易港の一つ。","m":"琉球の中継貿易の港は那覇"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0189","lv":1,"s":"惣村では、寄合を開き、掟（惣掟）を定めて自治を運営した。","a":1,"e":"惣村では、おとな・沙汰人などの指導者のもとで寄合を開き、村の掟（惣掟）を定めた。入会地や用水の管理、違反者への処罰も自分たちで行った。","m":"惣村＝寄合で惣掟を定める"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0190","lv":1,"s":"惣村の自治運営の中心は、荘園領主が派遣した代官であった。","a":0,"e":"誤り：惣村は荘園領主の代官ではなく農民自身が運営した。正しくは、名主層や地侍が「おとな」「沙汰人」として中心となり、寄合で物事を決めて村を自治した。","m":"惣村は農民の自治組織"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0191","lv":1,"s":"馬借・車借は、年貢などを運ぶ運送業者であり、近江の坂本などで活動した。","a":1,"e":"馬借は馬の背に荷を載せて、車借は牛車で物資を運ぶ運送業者で、近江の坂本・大津や淀などの交通の要地で活動した。土一揆の先頭に立つこともあった。","m":"馬借・車借＝運送業者"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0192","lv":1,"s":"土倉は、酒造業を営む者の呼称であった。","a":0,"e":"誤り：酒造業を営んだのは酒屋である。正しくは、土倉は質物を土で塗り固めた倉に保管する金融業者で、酒屋も富をもとに高利貸しを兼ねた。幕府はその両方に課税した。","m":"土倉は金融業、酒屋は酒造"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0193","lv":1,"s":"座は、商工業者が同業ごとに組んだ団体で、貴族や寺社に保護された。","a":1,"e":"座は商工業者の同業団体で、公家や寺社を本所として保護を受け、座役を納めるかわりに販売や原料購入の独占権を認められた。大山崎の油座がよく知られる。","m":"座は本所に保護された同業団体"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0194","lv":2,"s":"1401年、足利義満は、祖阿と博多商人肥富を明に派遣し、国交を開いた。","a":1,"e":"1401年、義満は僧の祖阿を正使、博多商人肥富を副使として明に派遣した。翌年、明の使者が来日して義満を日本国王に封じ、正式な国交が開かれた。","m":"1401年、祖阿と肥富を派遣","y":1401},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0195","lv":2,"s":"勘合は、正式な貿易船であることを証明するための札で、倭寇と区別するために使われた。","a":1,"e":"勘合は明が発行した渡航証明の札で、正式な遣明船であることを示した。明は海禁政策をとって民間の貿易を禁じており、倭寇と区別するために勘合の所持を義務づけた。","m":"勘合＝正式な遣明船の証明"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0196","lv":2,"s":"足利義教は、日明貿易の再開を認めず、貿易は途絶えた。","a":0,"e":"誤り：日明貿易は6代将軍足利義教が1432年に再開した。正しくは、義持が1411年に中止したのち、幕府の財政上の利益を重んじた義教によって復活した。","m":"義教が1432年に再開","y":1432},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0197","lv":2,"s":"1523年、寧波で、細川氏と大内氏の貿易船が争った。","a":1,"e":"1523年、明の寧波で、細川氏と結ぶ堺商人と大内氏と結ぶ博多商人の遣明船が争った（寧波の乱）。勘合貿易の主導権をめぐる対立が表面化した事件である。","m":"寧波の乱1523＝細川対大内","y":1523},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0199","lv":2,"s":"応永の外寇は、朝鮮軍が倭寇の根拠地とみて、対馬を攻撃した事件である。","a":1,"e":"1419年、朝鮮は倭寇の根拠地とみなした対馬を兵船で攻撃した（応永の外寇）。日朝貿易は一時中断したが、まもなく宗氏を通じて再開された。","m":"応永の外寇1419＝朝鮮が対馬攻撃","y":1419},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0200","lv":2,"s":"三浦の乱ののち、日朝貿易はむしろ活発になった。","a":0,"e":"誤り：1510年の三浦の乱ののち、日朝貿易は衰えた。正しくは、三浦に住む日本人が朝鮮の統制強化に反発して暴動を起こし、以後朝鮮は貿易を制限した。","m":"三浦の乱1510→日朝貿易衰退","y":1510},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0201","lv":2,"s":"コシャマインの戦いを鎮圧して勢力をのばしたのは、安藤氏である。","a":0,"e":"誤り：コシャマインの戦い（1457年）を鎮圧したのは蠣崎氏の客将武田信広で、蠣崎氏はのちの松前氏である。正しくは、安藤氏は津軽の十三湊を拠点に蝦夷地との交易を行った豪族である。","m":"コシャマインを鎮めた蠣崎氏","y":1457},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0202","lv":2,"s":"津軽の十三湊は、安藤氏の拠点で、蝦夷ヶ島との交易の港として栄えた。","a":1,"e":"津軽の十三湊は安藤（安東）氏の拠点で、日本海交易と蝦夷ヶ島との交易で栄えた。蝦夷ヶ島南部には和人が館を築いて進出し、アイヌとの対立がコシャマインの戦いを生んだ。","m":"津軽の十三湊は安藤氏の拠点"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0203","lv":2,"s":"宮座は、惣村で、神社の祭礼を行うために組織された座である。","a":1,"e":"宮座は村の神社の祭礼を担う村民の組織である。祭礼や行事を共に行うことが村の結束を強め、寄合や一揆の基盤となった。商工業者の座とは性格が異なる。","m":"宮座は村の祭礼を担う組織"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0204","lv":2,"s":"地下請とは、惣村が荘園領主に代わって守護に年貢を納めることをいう。","a":0,"e":"誤り：地下請（百姓請）は、惣村が荘園領主への年貢納入を一括して請け負うことである。正しくは、守護に年貢徴収を請け負わせるのは守護請で、請け負う主体が異なる。","m":"地下請は惣村、守護請は守護"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0205","lv":2,"s":"撰銭令は、悪銭を積極的に流通させるために出された。","a":0,"e":"誤り：撰銭令は悪銭の流通を促すものではない。正しくは、粗悪な銭の受け取りを拒む撰銭が取引を混乱させたため、幕府や戦国大名が良銭と悪銭の交換比率などを定めて撰銭を制限した。","m":"撰銭令＝撰銭を制限する法"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0206","lv":2,"s":"六斎市は、月3回開かれる定期市である。","a":0,"e":"誤り：六斎市は月に6回開かれた定期市である。正しくは、鎌倉時代には月3回の三斎市が一般的だったが、応仁の乱後の商業の発達で回数が増え、六斎市が広まった。","m":"三斎市→六斎市（月6回）"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0207","lv":3,"s":"日明貿易は朝貢形式で行われたため、明の側が滞在費や運搬費などを負担した。","a":1,"e":"朝貢形式では、明が使節の滞在費や運搬費を負担し、献上品を上回る返礼品を与えた。日本側にとっては費用が少なく利益の大きい貿易で、幕府や守護・商人が参加した。","m":"朝貢なので明が費用を負担"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0208","lv":3,"s":"明から輸入された銅銭の永楽通宝は、宋で鋳造された銭である。","a":0,"e":"誤り：永楽通宝は明の永楽帝の時代に鋳造された明銭である。正しくは、宋銭は平安末から鎌倉時代を中心に輸入された銭で、室町時代には宋銭と明銭がともに流通した。","m":"永楽通宝は明銭、宋銭と区別"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0209","lv":3,"s":"癸亥約条により、対馬の宗氏が派遣する歳遣船は、年に50隻に限られた。","a":1,"e":"1443年の癸亥約条で、対馬の宗氏が朝鮮に派遣する歳遣船は年50隻と定められた。応永の外寇後に再開した日朝貿易を、朝鮮が統制しようとしたものである。","m":"癸亥約条1443＝歳遣船50隻","y":1443},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0210","lv":3,"s":"日朝貿易で日本人が居住・貿易を許された三浦は、富山浦・乃而浦・仁川である。","a":0,"e":"誤り：三浦は富山浦・乃而浦・塩浦の3港である。正しくは、朝鮮は日本人の来航をこの3港に限り、倭館を置いて交易させた。仁川は三浦に含まれない。","m":"三浦＝富山浦・乃而浦・塩浦"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0211","lv":3,"s":"堺では会合衆とよばれる有力商人が、自治を行った。","a":1,"e":"堺は会合衆とよばれる豪商の合議で運営され、周囲に濠をめぐらせて自衛した。博多も年行司とよばれる豪商が自治を行い、ともに勘合貿易などで富を蓄えた。","m":"堺は会合衆、博多は年行司"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0212","lv":3,"s":"堺は大内氏と、博多は細川氏と結んで、勘合貿易に参加した。","a":0,"e":"誤り：結びつきが逆である。正しくは、堺商人は細川氏と、博多商人は大内氏と結んで遣明船を出した。この対立が1523年の寧波の乱となり、勝った大内氏が貿易を握った。","m":"堺は細川、博多は大内"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0213","lv":3,"s":"嘉吉の徳政一揆では、一揆の要求を受けて幕府がはじめて徳政令を出した。","a":1,"e":"1441年、嘉吉の変で将軍が殺された混乱のなか、代替わりの徳政を求める土一揆が京都を包囲した。幕府は要求に応じて徳政令を出し、のちには分一銭をとって徳政を認めた。","m":"嘉吉の徳政一揆で幕府が徳政令","y":1441},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0214","lv":3,"s":"地下検断（自検断）とは、荘園領主が惣村内の犯罪を取り締まる制度である。","a":0,"e":"誤り：地下検断（自検断）は、惣村が村内の犯罪を自ら取り締まって裁くことである。正しくは、領主の警察・裁判権を排除する動きで、惣村の自治の高まりを示している。","m":"地下検断は惣村が自ら裁く"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0215","lv":3,"s":"京都では、町衆とよばれる商工業者が自治組織をつくり、祇園祭を復興させた。","a":1,"e":"京都の町衆は町ごとに自治組織をつくり、月行事を選んで運営した。応仁の乱で途絶えた祇園祭は、町衆によって山鉾巡行が復興された。","m":"京都の町衆が祇園祭を復興"},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0216","lv":3,"s":"16世紀に活動した後期倭寇は、日本人を中心とする集団であった。","a":0,"e":"誤り：16世紀の後期倭寇は中国人が中心であった。正しくは、14〜15世紀の前期倭寇は日本人中心で朝鮮半島沿岸を襲い、後期倭寇は明の海禁政策に反発した中国人の密貿易者が多くを占めた。","m":"前期は日本人、後期は中国人中心"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0217","lv":1,"s":"応仁の乱は、8代将軍足利義政の後継をめぐる対立などを背景に、1467年に始まった。","a":1,"e":"義政の弟義視と、妻日野富子が産んだ義尚の後継争いに、畠山・斯波両家の家督争いと、細川勝元・山名持豊の勢力争いが重なって、1467年に応仁の乱が起こった。","m":"応仁の乱1467、後継争いが発端","y":1467},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0218","lv":1,"s":"応仁の乱では、細川勝元が西軍、山名持豊（宗全）が東軍の大将となった。","a":0,"e":"誤り：東西の大将が逆である。正しくは、東軍の大将は管領家の細川勝元、西軍の大将は山名持豊（宗全）で、西軍の陣が置かれた場所から京都の「西陣」の地名が生まれた。","m":"東軍細川、西軍山名（西陣）","y":1467},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0219","lv":1,"s":"応仁の乱では、軽装で集団戦を行う足軽が活躍した。","a":1,"e":"足軽は軽装で機動力のある雑兵で、応仁の乱で大量に雇われた。放火や略奪も行ったため、一条兼良は『樵談治要』で彼らを厳しく批判した。京都の多くは焼け野原となった。","m":"足軽が活躍し京都荒廃"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0220","lv":1,"s":"応仁の乱は、1467年に始まり、1493年まで続いた。","a":0,"e":"誤り：応仁の乱は1477年に終わった。正しくは、主な大名が領国に引き揚げて約11年で戦いは終わったが、決着はつかず、戦乱は地方へ広がった。1493年は明応の政変の年である。","m":"応仁の乱1467〜1477の11年","y":1477},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0221","lv":1,"s":"下の者が実力で上の者に取って代わる風潮を、下剋上という。","a":1,"e":"下剋上は、身分の下の者が実力で上の者をしのぐ風潮をいう。応仁の乱後、守護代や国人が守護を倒したり、一揆が守護を追い出したりする動きが広がった。","m":"下剋上＝下が上をしのぐ"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0222","lv":1,"s":"1488年に守護富樫政親を倒した加賀の一向一揆は、浄土宗の信者が中心であった。","a":0,"e":"誤り：加賀の一向一揆の中心は浄土真宗（一向宗）の門徒である。正しくは、本願寺の蓮如の布教で北陸に門徒が広がり、門徒の国人・農民が守護富樫政親を倒した。","m":"一向一揆＝浄土真宗の門徒","y":1488},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0223","lv":1,"s":"1485年、山城の国一揆では、国人や農民が守護畠山氏の軍を国外に退去させた。","a":1,"e":"1485年、南山城で争う畠山政長・義就の両軍に対し、国人や農民が一揆を結んで国外への退去を求め、実現させた。以後約8年間、国人の合議で山城の南部を治めた。","m":"山城の国一揆1485＝畠山軍を退去","y":1485},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0224","lv":1,"s":"北条早雲は、堀越公方を滅ぼして伊豆を支配したのち、近江国を本拠とした。","a":0,"e":"誤り：北条早雲（伊勢宗瑞）は伊豆を奪ったのち、相模の小田原に進出して本拠とした。正しくは、子の氏綱以降の北条氏（後北条氏）は小田原を中心に関東へ勢力を広げた。","m":"早雲は伊豆→相模の小田原"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0225","lv":1,"s":"戦国大名は、領国を支配するため、分国法（家法）を定めた。","a":1,"e":"戦国大名は家臣団の統制や領国の支配のために分国法（家法）を定めた。私的な争いを禁じる喧嘩両成敗や、他国との私的な通信・婚姻の制限などが含まれる。","m":"分国法で家臣と領国を統制"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0226","lv":1,"s":"分国法の「甲州法度之次第」を定めたのは、朝倉孝景である。","a":0,"e":"誤り：「甲州法度之次第」を定めたのは甲斐の武田信玄（晴信）である。正しくは、越前の朝倉孝景が定めたのは「朝倉孝景条々」で、家臣の一乗谷への集住などを命じた。","m":"甲州法度は武田、条々は朝倉"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0227","lv":1,"s":"越前の朝倉氏は、一乗谷に城下町を築いた。","a":1,"e":"越前の朝倉氏は一乗谷を本拠として城下町を築き、家臣を集住させた。京都から公家や文化人も訪れて地方の文化の中心となった。発掘調査で町並みが明らかになっている。","m":"朝倉氏の城下町は一乗谷"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0228","lv":1,"s":"毛利元就は、甲斐を本拠とした戦国大名である。","a":0,"e":"誤り：毛利元就は安芸の国人から出て、大内氏・尼子氏を倒し中国地方を支配した戦国大名である。正しくは、甲斐を本拠としたのは武田信玄である。","m":"毛利は安芸、武田は甲斐"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0229","lv":1,"s":"戦国大名は、自らの領国を一円的に支配し、独自の法や家臣団編成によって国を治めた。","a":1,"e":"戦国大名は幕府の権威に頼らず実力で領国を支配した。荘園領主の権利を否定して領国内の土地と人を直接把握し、検地や分国法で一円的な支配を進めた点が守護大名と異なる。","m":"戦国大名は領国を一円支配"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0230","lv":2,"s":"畠山氏・斯波氏の家督争いは、応仁の乱の背景の一つとなった。","a":1,"e":"管領家の畠山氏では政長と義就、斯波氏では義敏と義廉が家督を争った。それぞれが細川勝元・山名持豊と結んだことで、将軍家の後継問題と結びついて大乱になった。","m":"畠山・斯波の家督争いも背景","y":1467},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0231","lv":2,"s":"日野富子は、義視を足利義政の後継とすることを推した。","a":0,"e":"誤り：日野富子が将軍に推したのは自ら産んだ義尚である。正しくは、義政は当初弟の義視を後継に定めていたが、翌年義尚が生まれたため、義尚を推す富子と義視が対立した。","m":"富子は実子義尚を推す","y":1467},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0232","lv":2,"s":"応仁の乱で京都が荒廃すると、多くの公家や僧が地方に下り、地方に文化を伝えた。","a":1,"e":"京都が荒廃すると、公家や禅僧が戦乱を避けて地方の大名を頼った。大内氏の山口などでは京都の文化が取り入れられ、地方に学問や文化が広まった。","m":"戦乱を避けた公家が地方へ"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0233","lv":2,"s":"明応の政変で、10代将軍足利義材を追放したのは、細川勝元である。","a":0,"e":"誤り：明応の政変で将軍義材（のち義稙）を廃したのは細川政元である。正しくは、勝元は政元の父で応仁の乱の東軍の大将であり、1473年に没している。","m":"明応の政変は政元（勝元の子）","y":1493},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0236","lv":2,"s":"加賀の一向一揆は、守護の富樫氏を倒し、その後、約1世紀にわたって「百姓の持ちたる国」とよばれる自治を行った。","a":1,"e":"1488年、加賀の一向一揆は守護富樫政親を倒し、以後約1世紀にわたり門徒の国人・農民が国を治めた。その様子は「百姓の持ちたる国」とたとえられた。","m":"加賀1488、百姓の持ちたる国","y":1488},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0237","lv":2,"s":"浄土真宗の布教を進めた蓮如は、日蓮宗の僧である。","a":0,"e":"誤り：蓮如は浄土真宗本願寺の僧である。正しくは、越前の吉崎を拠点に、平易な御文で教えを広め、門徒を講に組織した。日蓮宗は京都の町衆に広まった別の宗派である。","m":"蓮如は浄土真宗、御文で布教"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0240","lv":2,"s":"今川仮名目録は、今川氏親が定めた分国法で、喧嘩両成敗を規定した。","a":1,"e":"今川仮名目録は駿河・遠江の今川氏親が1526年に定め、子の義元が追加を加えた。争った者を理由を問わず双方とも処罰する喧嘩両成敗の規定がある。","m":"今川仮名目録＝氏親、喧嘩両成敗"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0241","lv":2,"s":"伊達稙宗が制定した分国法は、今川仮名目録である。","a":0,"e":"誤り：伊達稙宗が定めた分国法は塵芥集である。正しくは、塵芥集は陸奥の伊達氏の分国法で条数が最も多く、今川仮名目録は駿河の今川氏親が定めた。","m":"伊達＝塵芥集、今川＝仮名目録"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0242","lv":2,"s":"戦国大名は、領国の収入を、貫高ではなく、石高で統一して表した。","a":0,"e":"誤り：戦国大名は土地の収入を銭の額に換算した貫高で表した。正しくは、貫高をもとに家臣の軍役や農民の年貢を定めた（貫高制）。米の量で表す石高制は豊臣秀吉の太閤検地からである。","m":"戦国は貫高、太閤検地で石高"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0243","lv":3,"s":"戦国大名の寄親・寄子制では、有力な家臣（寄親）に新たに召し抱えた家臣（寄子）を預け、軍事力を整えた。","a":1,"e":"寄親・寄子制は、有力家臣（寄親）に下級の家臣（寄子）を預けて組織する制度である。地侍などを家臣団に組み込み、集団で戦う軍事組織として編成した。","m":"寄親に寄子を預ける軍事編成"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0244","lv":3,"s":"戦国大名が行った指出検地は、役人が実地に測量して土地の面積を調べるものであった。","a":0,"e":"誤り：指出検地は、家臣や村に土地の面積・収入などを書き出させて提出させる方式である。正しくは、役人が実地に測量するのは太閤検地などで、指出検地は自己申告にもとづいていた。","m":"指出は自己申告、太閤は実測"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0245","lv":3,"s":"戦国大名は、領国内の商工業者を城下町に集め、座の特権を廃止する楽市を行うなど、経済政策を進めた。","a":1,"e":"戦国大名は城下町に家臣や商工業者を集め、座の特権や市場の税を廃する楽市令を出して自由な商取引を促した。関所の撤廃や鉱山の開発も進め、領国の経済力を高めた。","m":"楽市で城下町の商業を振興"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0246","lv":3,"s":"朝倉孝景条々では、家臣は農村に居住し、領国の城下町に集住してはならないと定めた。","a":0,"e":"誤り：朝倉孝景条々は、家臣に一乗谷への集住を命じた。正しくは、有力な家臣が領国内に城を構えることを禁じ、城下に住まわせて大名の統制を強めようとした。","m":"朝倉は家臣を一乗谷に集住"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0247","lv":3,"s":"応仁の乱のなかで、足利義視は一時、西軍に迎えられた。","a":1,"e":"義視は乱の初め東軍の側にいたが、1468年に西軍に迎えられ、西軍の将軍のような立場に立った。そのため将軍家の後継争いと東西の対立の関係は乱の途中で入れ替わった。","m":"義視は東→西軍へ移る"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0248","lv":3,"s":"甲斐の武田信玄が、信濃の川中島で戦った相手は、今川義元である。","a":0,"e":"誤り：川中島で武田信玄と戦ったのは越後の上杉謙信（長尾景虎）である。正しくは、今川義元は駿河・遠江を支配し、1560年の桶狭間の戦いで織田信長に討たれた。","m":"川中島は武田信玄対上杉謙信"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0249","lv":3,"s":"享徳の乱の後、鎌倉公方の足利成氏が古河に移って古河公方となり、幕府は足利政知を堀越に派遣した。","a":1,"e":"享徳の乱で鎌倉公方足利成氏は下総の古河に移り、古河公方とよばれた。幕府は将軍義政の兄弟の足利政知を送ったが、鎌倉に入れず伊豆の堀越にとどまり、堀越公方となった。","m":"古河公方は成氏、堀越公方は政知","y":1454},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0250","lv":3,"s":"天文法華の乱で、京都の法華宗寺院を焼き討ちにしたのは、興福寺の僧兵である。","a":0,"e":"誤り：1536年の天文法華の乱で京都の日蓮宗（法華宗）寺院を焼き打ちしたのは延暦寺の僧兵である。正しくは、京都の町衆に広まった法華一揆が勢力を強め、これを延暦寺が攻撃した。","m":"天文法華の乱＝延暦寺が法華宗を攻撃","y":1536},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0251","lv":3,"s":"浄土真宗の本願寺を中心とする、石山や山科の寺内町は、信者が集住し、商工業者の町として発展した。","a":1,"e":"浄土真宗の寺院を中心に、門徒や商工業者が集まって寺内町が形成された。山科本願寺や石山本願寺の周りの町が代表的で、濠や土塁で囲まれ、自治的に運営された。","m":"寺内町＝本願寺中心の町"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0252","lv":3,"s":"四国を統一した戦国大名は、島津氏である。","a":0,"e":"誤り：四国をほぼ統一したのは土佐の長宗我部元親である。正しくは、島津氏は薩摩を拠点に九州のほぼ全域に勢力を広げたが、のち豊臣秀吉に降伏した。","m":"四国は長宗我部、九州は島津"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0253","lv":2,"s":"鳥羽上皇が皇女に伝えた皇室領荘園群を、長講堂領という。","a":0,"e":"誤り：鳥羽上皇が皇女八条院（暲子内親王）に伝えた荘園群は八条院領である。正しくは、長講堂領は後白河法皇が集めた荘園群で、両者は皇室領の二大荘園群である。","m":"鳥羽→八条院領、後白河→長講堂領"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0254","lv":3,"s":"延暦寺の僧兵は、春日神社の神木をかついで京都に強訴した。","a":0,"e":"誤り：春日神社の神木をかついだのは興福寺の僧兵である。正しくは、延暦寺の僧兵は日吉神社の神輿をかついで強訴した。神仏の権威を背に、朝廷や院に要求を通そうとした。","m":"興福寺＝春日の神木、延暦寺＝日吉の神輿"},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0255","lv":1,"s":"御家人が交代で京都の皇居や院の御所の警備にあたる奉公を、鎌倉番役という。","a":0,"e":"誤り：京都の警備にあたる奉公は京都大番役である。正しくは、鎌倉番役は将軍の御所がある鎌倉の警備を交代で務めるもので、ともに御家人の重要な奉公であった。","m":"京都は大番役、鎌倉は鎌倉番役"},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0256","lv":2,"s":"1185年に設置が認められた地頭は、当初、平家没官領や謀叛人の所領などに限って置かれた。","a":1,"e":"頼朝が設置を認められた地頭は、当初は平家から没収した所領や謀叛人の所領が中心だった。承久の乱後に上皇方の所領にも新補地頭が置かれ、地頭は西国へ広がった。","m":"地頭は平家没官領から→乱後に西国","y":1185},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0257","lv":3,"s":"承久の乱後、幕府は仲恭天皇を退位させ、後堀河天皇を即位させた。","a":1,"e":"乱後、幕府は3上皇を配流しただけでなく、幼い仲恭天皇を廃して後堀河天皇を立てた。皇位の継承にも幕府が関与するようになり、公武の力関係が大きく変わった。","m":"乱後、仲恭を廃し後堀河を擁立","y":1221},{"f":"中世","t":"鎌倉幕府の成立と執権政治","ref":"CH-0258","lv":2,"s":"鎌倉時代の武士の一族は、惣領が庶子を率いて軍役を務め、所領は分割して相続された。","a":1,"e":"鎌倉時代の武士は、一族の長である惣領が庶子をまとめて幕府への軍役や奉公を担う惣領制をとった。所領は女子を含む子に分割相続され、女性が地頭になることもあった。","m":"惣領制＋分割相続（女子も）"},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0259","lv":2,"s":"元は、弘安の役の前に南宋を滅ぼしていた。","a":1,"e":"元は1279年に南宋を滅ぼし、その兵力も日本遠征に動員した。弘安の役で江南軍の主力が旧南宋の兵だったのはこのためで、文永の役より大規模な遠征となった。","m":"1279年南宋滅亡→1281年弘安","y":1279},{"f":"中世","t":"蒙古襲来と鎌倉後期","ref":"CH-0260","lv":3,"s":"高麗の三別抄は元に抵抗を続け、元の日本遠征を遅らせる一因となった。","a":1,"e":"三別抄は高麗の軍事組織で、元に服属した高麗王朝に反発して珍島・済州島で抵抗を続けた。1273年に鎮圧されたのち、元は翌1274年に文永の役を起こした。","m":"三別抄の抵抗1273→文永の役","y":1273},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0261","lv":2,"s":"『梅松論』は、足利氏の立場から南北朝の動乱を記した歴史書である。","a":1,"e":"『梅松論』は足利尊氏が政権を得るまでの経緯を武家側から記した。南朝の正統を説く北畠親房の『神皇正統記』と対照的な立場で、軍記物語の『太平記』とも区別する。","m":"梅松論は足利方、神皇正統記は南朝"},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0262","lv":3,"s":"後醍醐天皇は大内裏の造営を計画し、その費用を地頭などに負担させようとした。","a":1,"e":"後醍醐天皇は天皇の権威を示すため大内裏の造営を計画し、費用として地頭などに収入の一部を課そうとした。紙幣の発行も計画したが、武士の負担を増やし反発を招いた。","m":"大内裏造営の負担で武士が反発","y":1334},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0263","lv":2,"s":"室町幕府は、田の稲を実力で刈り取る刈田狼藉を取り締まる権限を、地頭に与えた。","a":0,"e":"誤り：刈田狼藉の取締りの権限は守護に与えられた。正しくは、幕府は南北朝の動乱の中で守護の権限を広げ、大犯三カ条に加えて刈田狼藉の取締りや使節遵行を認めた。","m":"刈田狼藉の取締りは守護の権限"},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0264","lv":2,"s":"建武政権は所領の所有を認めるのに天皇の綸旨を必要としたため、訴えが殺到して混乱した。","a":1,"e":"後醍醐天皇は土地の所有の確認には綸旨が必要だとしたため、武士の慣習と合わず、京都に人々が押し寄せて処理が滞った。のちに方針を改めたが、偽の綸旨も出回った。","m":"所領安堵に綸旨→混乱","y":1333},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0265","lv":3,"s":"建武政権の初め、後醍醐天皇の皇子護良親王は征夷大将軍に任じられた。","a":1,"e":"護良親王は討幕で活躍し、1333年に征夷大将軍となったが、足利尊氏と対立して失脚し、鎌倉に送られた。中先代の乱の混乱の中で足利直義の命により殺害された。","m":"護良親王は新政で征夷大将軍","y":1333},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0266","lv":3,"s":"南北朝の動乱が長引いた背景には、惣領制が崩れ、一族内の対立が南朝・北朝への分属と結びついたことがある。","a":1,"e":"単独相続への移行で惣領と庶子の対立が深まり、一族の一方が北朝につくと他方は南朝につくことが多かった。地方武士それぞれの利害が動乱を長引かせた。","m":"惣領制の解体が動乱を長期化"},{"f":"中世","t":"建武の新政と南北朝","ref":"CH-0267","lv":3,"s":"南北朝の動乱期には、地方の武士（国人）が地縁で結びつく国人一揆が各地で結ばれた。","a":1,"e":"国人は血縁による惣領制にかわって、近隣の武士どうしが契約を結ぶ国人一揆で結束した。守護の支配に対抗したり、地域の秩序を自分たちで守ったりする力となった。","m":"血縁の惣領制→地縁の国人一揆"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0268","lv":2,"s":"6代将軍足利義教は、有力守護の家督相続に介入するなど専制的な政治を行い、人々に恐れられた。","a":1,"e":"義教は将軍権力の強化をめざし、守護家の相続に口を出したり、反抗的な守護を処罰したりした。強圧的な政治は恐れられ、赤松満祐に殺される嘉吉の変を招いた。","m":"義教の専制→嘉吉の変"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0269","lv":2,"s":"鎌倉府は幕府とほぼ同じ組織を持ち、しだいに京都の幕府と対立するようになった。","a":1,"e":"鎌倉府は政所・侍所などをそなえた小さな幕府で、関東の武士を独自に支配した。鎌倉公方はしばしば将軍職をうかがい、足利持氏のときに幕府との対立が決定的になった。","m":"鎌倉府は小幕府、京都と対立"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0270","lv":3,"s":"足利義満は、朝廷が持っていた京都の市政権や、諸国に段銭を課す権限などを幕府の手に収めた。","a":1,"e":"南北朝の動乱で朝廷の力が衰えるなか、義満は京都の警察・裁判・商業課税などの市政権や、全国に段銭を課す権限を朝廷から吸収し、全国的な統一政権を整えた。","m":"義満は朝廷の権限を吸収"},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0271","lv":3,"s":"嘉吉の変で将軍を殺害した赤松満祐は、領国の播磨で幕府軍に討たれた。","a":1,"e":"1441年、赤松満祐は義教を自邸に招いて殺害し、播磨に帰って抵抗したが、山名持豊らの幕府軍に攻められ自害した。赤松氏の領国の多くは山名氏の手に移った。","m":"満祐は播磨で討たれ山名が台頭","y":1441},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0272","lv":3,"s":"享徳の乱は、鎌倉公方足利成氏が関東管領上杉憲忠を殺害したことから始まった。","a":1,"e":"1454年、成氏が憲忠を謀殺すると上杉氏との全面的な戦いになり、関東は応仁の乱より早く戦乱の時代に入った。成氏は下総古河に移り古河公方とよばれた。","m":"享徳の乱＝成氏が上杉憲忠を殺害","y":1454},{"f":"中世","t":"室町幕府と守護大名","ref":"CH-0273","lv":2,"s":"石清水八幡宮でのくじ引きによって将軍に選ばれたのは、足利義政である。","a":0,"e":"誤り：くじ引きで選ばれたのは6代将軍足利義教である。正しくは、4代義持が後継を決めずに没したため、弟たちの中からくじで選ばれた。義政は義教の子で8代将軍である。","m":"くじ引き将軍は6代義教","y":1428},{"f":"中世","t":"室町の外交と経済・惣村","ref":"CH-0274","lv":2,"s":"勘合貿易は、16世紀半ばに大内氏が滅亡すると断絶した。","a":1,"e":"寧波の乱ののち大内氏が勘合貿易を独占したが、1551年に大内義隆が家臣の陶晴賢に倒されると、勘合貿易は途絶えた。こののち倭寇の活動が再び盛んになった。","m":"大内氏滅亡で勘合貿易断絶","y":1551},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0275","lv":3,"s":"細川氏が握った幕府の実権は、やがて家臣の三好長慶に移り、さらにその家臣の松永久秀が台頭した。","a":1,"e":"明応の政変ののち細川氏が畿内の実権を握ったが、家臣の三好長慶が主家をしのぎ、長慶の死後は家臣の松永久秀が力をふるった。下剋上が幕府の中枢でも進んだ。","m":"細川→三好長慶→松永久秀"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0276","lv":3,"s":"山城の国一揆では、国人たちが宇治の平等院に集まり、国の掟を定めた。","a":1,"e":"1486年、国一揆に加わった国人らは宇治の平等院で集会を開き、国中掟法を定めた。月行事を選んで南山城を自治し、一揆による支配は約8年間続いた。","m":"国一揆は平等院で掟を制定","y":1486},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0277","lv":2,"s":"斎藤道三は、美濃の守護土岐氏を追放して美濃を支配した。","a":1,"e":"斎藤道三は美濃の守護土岐氏の家臣から身を起こし、主君の土岐頼芸を追放して美濃を奪った。家臣が主家を倒す下剋上の代表例とされる。","m":"道三は土岐氏を追い美濃を奪う"},{"f":"中世","t":"応仁の乱と戦国大名","ref":"CH-0278","lv":2,"s":"越後の守護代の家から出た長尾景虎は、関東管領上杉氏の名跡を継いで上杉謙信と名乗った。","a":1,"e":"長尾景虎は越後の守護代の家から台頭し、北条氏に追われた関東管領上杉憲政から上杉の姓と関東管領職を譲られた。のち上杉謙信と名乗り、武田信玄と川中島で戦った。","m":"長尾景虎→上杉謙信（関東管領）"},{"f":"近世","t":"織豊政権","ref":"KS-0001","lv":1,"s":"織田信長は1560年、桶狭間の戦いで今川義元を破った。","a":1,"e":"駿河・遠江・三河を支配した今川義元が尾張へ進軍したところを、信長が少数の兵で急襲して討ち取った。この勝利で信長は尾張を固め、のちに三河の徳川家康と同盟を結んで美濃攻略へ向かう。","m":"1560 桶狭間、今川を破り台頭","y":1560},{"f":"近世","t":"織豊政権","ref":"KS-0002","lv":1,"s":"織田信長は1575年、長篠合戦で鉄砲を活用して武田勝頼の軍を破った。","a":1,"e":"信長・家康の連合軍は、馬防柵の内側に多数の鉄砲を配置して武田勝頼の軍を退けた。鉄砲の大量使用が戦い方を変えた例として扱われ、勝頼はこの敗戦で力を失い、1582年に武田氏は滅んだ。","m":"長篠＝鉄砲で武田勝頼に勝つ","y":1575},{"f":"近世","t":"織豊政権","ref":"KS-0003","lv":1,"s":"織田信長は1573年、室町幕府の将軍足利義昭を京都から追放した。","a":1,"e":"1568年に信長に擁立されて将軍となった義昭は、のち信長と対立して反信長勢力を結集した。信長は1573年に義昭を京都から追い出し、これをもって室町幕府は事実上滅亡したとされる。","m":"1573 義昭追放＝幕府の終わり","y":1573},{"f":"近世","t":"織豊政権","ref":"KS-0004","lv":1,"s":"織田信長は1571年、高野山を焼き打ちした。","a":0,"e":"誤り：高野山。正しくは比叡山延暦寺。延暦寺は浅井・朝倉方について信長と敵対したため、1571年に焼き打ちされた。信長は一向一揆や石山本願寺とも戦い、宗教勢力の武力を抑えた。","m":"延暦寺＝浅井・朝倉に味方し焼かれる","y":1571},{"f":"近世","t":"織豊政権","ref":"KS-0005","lv":1,"s":"豊臣秀吉は山崎の戦いで明智光秀を破り、信長の後継の座を固めた。","a":1,"e":"1582年の本能寺の変を知った秀吉は、毛利氏と講和して中国地方から急いで引き返し、山崎の戦いで明智光秀を破った。主君の仇を討ったことで、織田家臣団の中で主導権を握るきっかけとなった。","m":"中国大返し→山崎で光秀","y":1582},{"f":"近世","t":"織豊政権","ref":"KS-0006","lv":1,"s":"本能寺の変で織田信長を討ったのは柴田勝家である。","a":0,"e":"誤り：柴田勝家。正しくは明智光秀。光秀は1582年に京都の本能寺で信長を襲った。柴田勝家は信長の重臣で、変の後は秀吉と対立し、1583年の賤ヶ岳の戦いで敗れて越前で自害した。","m":"本能寺＝光秀、賤ヶ岳＝勝家","y":1582},{"f":"近世","t":"織豊政権","ref":"KS-0007","lv":1,"s":"豊臣秀吉は1585年、征夷大将軍に任じられた。","a":0,"e":"誤り：征夷大将軍。正しくは関白。秀吉は朝廷の官職を利用して全国支配の正統性を得ようとし、1585年に関白、翌1586年に太政大臣となり豊臣の姓を受けた。将軍となったのは徳川家康である。","m":"秀吉は関白・太政大臣","y":1585},{"f":"近世","t":"織豊政権","ref":"KS-0008","lv":1,"s":"豊臣秀吉は1590年、小田原の北条氏を滅ぼして全国を統一した。","a":1,"e":"秀吉は大軍で小田原城を包囲して北条氏を降伏させ、同年に伊達政宗ら東北の大名も服属させた（奥州平定）。これで全国統一が完成し、北条氏の旧領には徳川家康が移された。","m":"1590 小田原攻め＝統一完成","y":1590},{"f":"近世","t":"織豊政権","ref":"KS-0009","lv":1,"s":"太閤検地では、土地の生産力を米の量（石高）で表した。","a":1,"e":"太閤検地では、田畑の面積を測り、等級ごとの標準収穫量（石盛）を掛けて石高を算出した。以後、年貢も大名の軍役も石高を基準に決められ、石高制が近世社会の土台となった。","m":"太閤検地＝石高で一元化"},{"f":"近世","t":"織豊政権","ref":"KS-0011","lv":1,"s":"豊臣秀吉は1588年に刀狩令を出し、農民から刀・槍などの武器を取り上げた。","a":1,"e":"刀狩令は百姓が刀・脇差・弓・槍・鉄砲などを持つことを禁じ、一揆を防ぐとともに百姓を農業に専念させるねらいがあった。翌々年の人掃令とあわせ、兵農分離を進める政策と位置づけられる。","m":"刀狩＝一揆防止・兵農分離","y":1588},{"f":"近世","t":"織豊政権","ref":"KS-0012","lv":1,"s":"豊臣秀吉による朝鮮出兵のうち、文禄の役は1597年に始まった。","a":0,"e":"誤り：1597年。正しくは1592年。1592年の文禄の役で朝鮮に出兵したが、李舜臣の水軍や明の援軍に苦しみ休戦した。講和交渉が決裂して1597年に再び出兵したのが慶長の役である。","m":"文禄1592→講和失敗→慶長1597","y":1592},{"f":"近世","t":"織豊政権","ref":"KS-0013","lv":1,"s":"豊臣秀吉は1587年にバテレン追放令を出し、宣教師の国外退去を命じた。","a":1,"e":"九州平定の際、大村純忠が長崎をイエズス会に寄進していたことを知った秀吉は、1587年に宣教師の国外退去を命じた。ただし南蛮貿易は続けたため、禁教の効果は徹底しなかった。","m":"バテレン追放＝九州平定の年","y":1587},{"f":"近世","t":"織豊政権","ref":"KS-0014","lv":2,"s":"織田信長は安土城下に楽市令を出して、商工業者の自由な営業を認めた。","a":1,"e":"信長は1577年、安土城下に楽市令を出し、座の独占や市場税を免除して商工業者を呼び集めた。楽市は今川氏・六角氏など他の戦国大名も行っており、城下町の発展を図る政策だった。","m":"安土の楽市＝座の特権否定","y":1577},{"f":"近世","t":"織豊政権","ref":"KS-0015","lv":2,"s":"織田信長は堺を直轄地として、経済力と鉄砲生産の拠点を握った。","a":1,"e":"堺は会合衆による自治で知られた貿易港だったが、信長は1569年までに屈服させて直轄地とした。堺の財力と鉄砲の生産・入手ルートを押さえたことが、信長の軍事力を支えた。","m":"堺を屈服＝財力と鉄砲を握る","y":1569},{"f":"近世","t":"織豊政権","ref":"KS-0016","lv":2,"s":"織田信長は領内の関所を廃止して、物資の流通を促した。","a":1,"e":"中世の関所は寺社や公家が通行税をとる場で、流通の妨げとなっていた。信長は領国内の関所を撤廃して人と物の移動を円滑にし、楽市令とともに商業の活性化をめざした。","m":"関所撤廃＋楽市＝流通の活性化"},{"f":"近世","t":"織豊政権","ref":"KS-0017","lv":2,"s":"織田信長は姉川の戦いで、武田信玄・勝頼の軍を破った。","a":0,"e":"誤り：武田氏。正しくは浅井長政・朝倉義景の連合軍。1570年、信長は家康と組んで近江の姉川で浅井・朝倉を破った。武田勝頼を破ったのは1575年の長篠合戦である。","m":"姉川＝浅井・朝倉、長篠＝武田","y":1570},{"f":"近世","t":"織豊政権","ref":"KS-0018","lv":2,"s":"豊臣秀吉は大坂城を築いて本拠とし、石山本願寺の跡地を利用した。","a":1,"e":"石山本願寺は信長と11年にわたって戦った一向宗の拠点で、1580年に退去した。その跡地に秀吉は1583年から大坂城を築き、交通と商業の要地である大坂を政権の本拠とした。","m":"石山本願寺跡に大坂城","y":1583},{"f":"近世","t":"織豊政権","ref":"KS-0019","lv":2,"s":"豊臣秀吉は1587年に島津氏を降して四国を平定した。","a":0,"e":"誤り：四国。正しくは九州。秀吉は1587年に薩摩の島津義久を降して九州を平定した。四国は1585年、長宗我部元親を降して平定している。順序は四国→九州→小田原。","m":"四国1585→九州1587→小田原1590","y":1587},{"f":"近世","t":"織豊政権","ref":"KS-0021","lv":2,"s":"太閤検地では、一つの土地に複数の権利者が重なって存在することが認められた。","a":0,"e":"誤り：複数の権利者を認めた。正しくは一地一作人の原則で否定した。1つの土地に耕作者1人を検地帳に登録し、荘園以来の重なり合った権利を整理した。これにより荘園制は最終的に解体された。","m":"一地一作人＝荘園制の解体"},{"f":"近世","t":"織豊政権","ref":"KS-0022","lv":2,"s":"1591年、豊臣秀吉は人掃令を出して、武士・農民・町人の身分を固定させた。","a":1,"e":"1591年の人掃令（身分統制令）は、武家奉公人が百姓・町人になることや、百姓が商人・職人になることを禁じた。翌1592年には全国の戸口調査も命じられ、身分ごとの把握が進んだ。","m":"1591 人掃令＝身分の移動禁止","y":1591},{"f":"近世","t":"織豊政権","ref":"KS-0023","lv":2,"s":"豊臣秀吉は1588年に海賊取締令を出し、海上での略奪行為を禁じた。","a":1,"e":"海賊取締令は、瀬戸内などの海賊衆の活動を禁じ、海上を秀吉の支配下に置くための法令。刀狩令と同じ1588年に出され、倭寇の取り締まりにもつながった。","m":"1588＝刀狩令と海賊取締令","y":1588},{"f":"近世","t":"織豊政権","ref":"KS-0024","lv":2,"s":"豊臣秀吉は賤ヶ岳の戦いで明智光秀を破った。","a":0,"e":"誤り：明智光秀。正しくは柴田勝家。賤ヶ岳の戦い（1583年）は、信長の後継をめぐる秀吉と勝家の争い。光秀を破ったのは前年1582年の山崎の戦いである。","m":"山崎＝光秀、賤ヶ岳＝勝家","y":1583},{"f":"近世","t":"織豊政権","ref":"KS-0025","lv":2,"s":"豊臣秀吉は小牧・長久手の戦いで徳川家康と戦ったのち、和睦して臣従させた。","a":1,"e":"1584年、信長の次男織田信雄と結んだ家康は、尾張の小牧・長久手で秀吉軍と戦い局地戦では優位に立った。しかし秀吉が信雄と単独講和したため戦いは終わり、家康はのちに上洛して臣従した。","m":"小牧・長久手＝家康と引き分け","y":1584},{"f":"近世","t":"織豊政権","ref":"KS-0026","lv":2,"s":"織田信長は1568年、足利義昭を奉じて上洛した。","a":1,"e":"信長は1568年、越前の朝倉氏のもとにいた足利義昭を迎えて京都に入り、義昭を15代将軍に就けた。将軍の権威を利用して畿内を押さえたが、やがて両者は対立する。","m":"1568 義昭を立てて上洛","y":1568},{"f":"近世","t":"織豊政権","ref":"KS-0027","lv":3,"s":"信長が義昭を追放した後、元号は天正に改められた。","a":1,"e":"1573年に義昭を京都から追放した後、信長の求めで元号が元亀から天正に改められた。天正は1592年まで続き、太閤検地が「天正の石直し」とよばれるなど、織豊政権期の代名詞となっている。","m":"義昭追放→元亀から天正へ","y":1573},{"f":"近世","t":"織豊政権","ref":"KS-0028","lv":3,"s":"太閤検地では、1反を360歩とした。","a":0,"e":"誤り：360歩。正しくは300歩。太閤検地では6尺3寸四方を1歩、300歩を1反とし、面積の単位を小さくした。あわせて枡を京枡に統一し、全国で同じ基準による測量が可能になった。","m":"1反300歩・京枡に統一"},{"f":"近世","t":"織豊政権","ref":"KS-0029","lv":3,"s":"清洲会議で信長の後継者に決まったのは、信長の三男の信孝である。","a":0,"e":"誤り：信孝。正しくは信長の孫の三法師（のちの秀信）。清洲会議では秀吉が三法師を推して後見の立場を得た。信孝を推した柴田勝家との対立は、翌年の賤ヶ岳の戦いにつながった。","m":"清洲会議＝三法師を立てた秀吉","y":1582},{"f":"近世","t":"織豊政権","ref":"KS-0030","lv":3,"s":"朝鮮出兵の際、秀吉は大坂城を前線の本営とした。","a":0,"e":"誤り：大坂城。正しくは肥前の名護屋城。秀吉は朝鮮に近い肥前（佐賀県）の名護屋に城を築き、全国の大名を集めて出兵の本営とした。周辺には諸大名の陣屋が建ち並んだ。","m":"出兵の本営＝肥前名護屋城","y":1592},{"f":"近世","t":"織豊政権","ref":"KS-0031","lv":3,"s":"太閤検地は、山崎の戦いの後の1582年に山城で始まった。","a":1,"e":"太閤検地は1582年、山崎の戦いに勝った直後の山城国で始まり、その後秀吉の支配が広がるにつれて各地で行われた。天正年間の検地であることから「天正の石直し」ともよばれる。","m":"太閤検地＝1582年の山城から","y":1582},{"f":"近世","t":"織豊政権","ref":"KS-0032","lv":3,"s":"晩年の秀吉は徳川家康らを五大老、石田三成らを五奉行として、幼い秀頼を支える体制をつくった。","a":1,"e":"五大老は家康・前田利家ら有力大名、五奉行は石田三成ら秀吉の側近で政務の実務を担った。幼い秀頼を守るための体制だったが、秀吉の死後は家康と三成の対立が深まり関ヶ原の戦いに至った。","m":"五大老＝大名、五奉行＝実務","y":1598},{"f":"近世","t":"織豊政権","ref":"KS-0033","lv":3,"s":"天正遣欧使節は、キリシタン大名の伊達政宗が派遣した。","a":0,"e":"誤り：伊達政宗。正しくは大友義鎮（宗麟）・有馬晴信・大村純忠の3人。1582年、イエズス会のヴァリニャーノの勧めで4人の少年をローマに送った。伊達政宗が派遣したのは慶長遣欧使節である。","m":"天正遣欧＝九州の3大名","y":1582},{"f":"近世","t":"織豊政権","ref":"KS-0034","lv":3,"s":"1588年、秀吉は後水尾天皇を聚楽第に迎え、大名に忠誠を誓わせた。","a":0,"e":"誤り：後水尾天皇。正しくは後陽成天皇。1588年、秀吉は京都の聚楽第に後陽成天皇を迎え、諸大名に天皇と秀吉への忠誠を誓わせた。後水尾天皇は江戸初期の天皇で、紫衣事件で知られる。","m":"聚楽第＝後陽成、紫衣＝後水尾","y":1588},{"f":"近世","t":"織豊政権","ref":"KS-0035","lv":3,"s":"太閤検地の検地帳に名請人として登録されたのは、村の庄屋に限られた。","a":0,"e":"誤り：庄屋に限られた。正しくは実際に耕作する百姓。検地帳に名請人として記された百姓は土地の耕作権を認められる一方、年貢を納める義務を負った。これが本百姓の基礎となる。","m":"名請人＝耕作者＝年貢負担者"},{"f":"近世","t":"織豊政権","ref":"KS-0036","lv":3,"s":"秀吉は、刀狩で集めた武器を東大寺の大仏造営の釘に使うと称した。","a":0,"e":"誤り：東大寺。正しくは方広寺。秀吉は京都東山に方広寺の大仏を造営しており、刀狩で集めた武器はその釘やかすがいに使うと説明した。方広寺の鐘銘はのち大坂の陣の口実にもなった。","m":"刀狩の名目＝方広寺の大仏","y":1588},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0037","lv":1,"s":"徳川家康は1603年に征夷大将軍に任じられ、江戸に幕府を開いた。","a":1,"e":"関ヶ原の勝利で実権を握った家康は、1603年に征夷大将軍に任じられ江戸に幕府を開いた。わずか2年後の1605年に将軍職を子の秀忠に譲り、将軍職が徳川家の世襲であることを示した。","m":"1603 家康将軍→1605 秀忠へ","y":1603},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0038","lv":1,"s":"1600年の関ヶ原の戦いで、徳川家康は石田三成らの西軍を破った。","a":1,"e":"秀吉の死後、五大老筆頭の家康と五奉行の石田三成が対立し、1600年に美濃の関ヶ原で東軍と西軍が戦った。東軍が勝ち、三成らは処刑され、西軍の大名は改易・減封された。","m":"関ヶ原＝家康の東軍が勝つ","y":1600},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0039","lv":1,"s":"大坂夏の陣で自害した豊臣氏の当主は、豊臣秀次である。","a":0,"e":"誤り：秀次。正しくは豊臣秀頼。秀頼は1615年の大坂夏の陣で母の淀殿とともに自害し、豊臣氏は滅んだ。秀次は秀吉の甥で関白を継いだが、1595年に謀反の疑いで切腹させられた。","m":"大坂の陣で滅ぶ＝秀頼","y":1615},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0040","lv":1,"s":"1615年、幕府は一国一城令を出して、大名の居城を領国に1つに限った。","a":1,"e":"一国一城令は、大名が居城以外の城を壊すよう命じた法令で、大坂夏の陣の直後に出された。大名の軍事拠点を減らして幕府への反抗を難しくし、同年の武家諸法度とともに大名統制の柱となった。","m":"1615 一国一城令＝城は1つ","y":1615},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0041","lv":1,"s":"武家諸法度（元和令）は、3代将軍徳川家光のときに出された。","a":0,"e":"誤り：家光。正しくは2代将軍徳川秀忠。元和令は大坂の陣直後の1615年、秀忠のもとで出された。家光のときの1635年に出されたのが寛永令で、参勤交代が制度として定められた。","m":"元和令＝秀忠、寛永令＝家光","y":1615},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0042","lv":1,"s":"3代将軍徳川家光のとき、武家諸法度（寛永令）で参勤交代が制度化された。","a":1,"e":"寛永令（1635年）は、大名に1年おきに江戸と国元を往復させる参勤交代を義務とし、500石積以上の大船の建造も禁じた。往復と江戸滞在の費用は大名財政の大きな負担となった。","m":"寛永令＝参勤交代・大船禁止","y":1635},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0043","lv":1,"s":"参勤交代は、外様大名のみに課された制度である。","a":0,"e":"誤り：外様大名のみ。正しくは親藩・譜代も含む大名全体が対象。原則は1年ごとの江戸と国元の往復だが、水戸藩のように江戸に常住する定府の大名や、半年交代の関東の大名などの例外もあった。","m":"参勤交代は全大名が対象","y":1635},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0044","lv":1,"s":"将軍直属の家臣のうち、1万石未満で将軍に謁見できる者を旗本、できない者を御家人という。","a":1,"e":"旗本・御家人はいずれも知行1万石未満の将軍直属の家臣。将軍に直接会える御目見以上が旗本、御目見以下が御家人である。1万石以上で将軍と主従関係を結ぶ者は大名とよばれた。","m":"御目見以上＝旗本、以下＝御家人"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0045","lv":1,"s":"御三家とは、尾張・紀伊・加賀の3家をいう。","a":0,"e":"誤り：加賀。正しくは水戸。御三家は家康の子を祖とする尾張・紀伊・水戸の3家で、将軍の跡継ぎが絶えたときに将軍を出す役割をもった。加賀の前田氏は最大の外様大名である。","m":"御三家＝尾張・紀伊・水戸"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0046","lv":1,"s":"京都所司代は、朝廷の監視と西国大名の監察を担当した。","a":1,"e":"京都所司代は朝廷と公家の監視、京都の市政、西国大名の監察を担った重職で、譜代大名が任じられた。大坂には大坂城代が置かれ、ともに西日本支配の要とされた。","m":"京都所司代＝朝廷と西国を監視"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0047","lv":1,"s":"1615年、幕府は禁中並公家諸法度を定めて、天皇や公家の行動を規制した。","a":1,"e":"禁中並公家諸法度は、天皇は学問を第一とすること、公家の席次、紫衣の許可などを定め、朝廷の政治的な動きを封じる法令だった。違反があれば幕府が処分できる仕組みで、のちの紫衣事件の根拠となった。","m":"禁中並公家諸法度＝朝廷統制","y":1615},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0049","lv":1,"s":"幕府は江戸・京都・大坂などの重要都市や主要な鉱山を直轄地とした。","a":1,"e":"幕府の直轄領（幕領）は約400万石にのぼった。さらに江戸・京都・大坂・長崎などの重要都市と、佐渡・石見・伊豆などの主要鉱山を直轄し、貨幣の鋳造権も握って経済的な基盤とした。","m":"幕領400万石＋都市・鉱山"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0050","lv":2,"s":"譜代大名は、関ヶ原の戦いの前後に徳川氏に従った大名である。","a":0,"e":"誤り：前後に従った。正しくは関ヶ原の戦い以前から徳川氏の家臣であった大名。関ヶ原の前後に従った大名は外様大名とよばれる。譜代は石高は小さいが要地に置かれ幕政を担った。","m":"譜代＝古くから、外様＝関ヶ原前後"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0051","lv":2,"s":"老中などの幕閣には、外様大名が多く登用された。","a":0,"e":"誤り：外様。正しくは譜代大名。老中や若年寄などの幕府の要職は譜代大名から選ばれ、外様大名は石高が大きくても幕政に参加できなかった。親藩も原則として幕政の役職には就かなかった。","m":"幕府の要職＝譜代大名"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0052","lv":2,"s":"外様大名には加賀の前田氏や薩摩の島津氏のような大藩が多かったが、幕府は江戸から遠い地に配置した。","a":1,"e":"加賀の前田、薩摩の島津、仙台の伊達など外様には大藩が多かった。幕府はこれらを江戸から離れた地方に置き、要地には親藩・譜代を配置して監視させた。大名の配置そのものが統制の手段だった。","m":"外様＝大藩だが遠隔地に配置"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0053","lv":2,"s":"三奉行とは、寺社奉行・町奉行・大目付をいう。","a":0,"e":"誤り：大目付。正しくは勘定奉行。三奉行は寺社奉行・町奉行・勘定奉行で、寺社奉行は将軍直属で譜代大名、町奉行と勘定奉行は老中の配下で旗本が就いた。大目付は大名を監察する役職。","m":"三奉行＝寺社・町・勘定"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0054","lv":2,"s":"大老は幕府の常置の職で、老中の上に置かれた。","a":0,"e":"誤り：常置の職。正しくは必要に応じて置かれた臨時の職。大老は老中の上に立つ最高職で、定員は1名。酒井忠清・堀田正俊・井伊直弼などが就いた。ふだんの幕政は老中の合議で運営された。","m":"大老＝臨時・定員1名"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0055","lv":2,"s":"勘定奉行は、幕府の財政と、直轄領の民政を担当した。","a":1,"e":"勘定奉行は幕府の財政と年貢の徴収を担当し、幕領の郡代・代官を指揮した。寺社奉行・町奉行とともに評定所で重要な裁判にも加わった。旗本が就く役職の中では最も重要なものの一つである。","m":"勘定奉行＝財政と幕領の支配"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0056","lv":2,"s":"幕府の直轄領には、郡代や代官が派遣されて支配にあたった。","a":1,"e":"幕領は勘定奉行のもとで郡代と代官が治め、年貢の徴収や治安維持を行った。郡代は関東・美濃・飛騨・西国など広い地域を管轄した。大名領では大名が独自に領民を支配した。","m":"幕領＝郡代・代官が支配"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0057","lv":2,"s":"村では、百姓を5戸ほどで組み合わせる五人組をつくり、年貢納入や犯罪防止に連帯責任を負わせた。","a":1,"e":"五人組は近隣の数戸を一組とし、年貢を納めることや犯罪の防止に共同で責任を負わせた制度。キリシタンの取り締まりにも使われ、互いの監視を通じて幕府や藩が村を統制する仕組みだった。","m":"五人組＝年貢と治安の連帯責任"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0058","lv":2,"s":"村の運営は、名主（庄屋）・組頭・百姓代の村方三役が担った。","a":1,"e":"名主（関西では庄屋、東北では肝煎）は村の長、組頭はその補佐、百姓代は百姓の代表として名主らを監視した。村方三役は本百姓から選ばれ、年貢の割り当てや村の運営を担った。","m":"名主・組頭・百姓代＝村方三役"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0059","lv":2,"s":"大坂夏の陣の後、元号が元和に改められ、戦乱の終結を意味する元和偃武とよばれた。","a":1,"e":"1615年の大坂夏の陣で豊臣氏が滅ぶと、元号が慶長から元和に改められた。応仁の乱以来の戦乱が終わったことを、武器を収めるという意味の「偃武」の語で表して元和偃武という。","m":"元和偃武＝戦乱の終わり","y":1615},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0060","lv":2,"s":"幕府は大名に対して軍役を課したが、城や河川の普請は課さなかった。","a":0,"e":"誤り：課さなかった。正しくは普請役も課した。大名は石高に応じた軍役を負担し、平時には江戸城の修築や河川の改修などの御手伝普請を命じられた。これらは大名の財政を圧迫した。","m":"大名の負担＝軍役と普請役"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0061","lv":2,"s":"将軍は大名に領地を保障し、大名は軍役などで将軍に奉仕する主従関係が結ばれていた。","a":1,"e":"将軍は大名に領知を与え、大名は軍役や普請役などで将軍に奉仕した。この主従関係を軸に、幕府と藩がそれぞれ土地と人民を支配する体制を幕藩体制という。藩の内政は大名に任された。","m":"領知の保障と軍役＝幕藩体制"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0062","lv":3,"s":"無断で広島城を修築した罪で改易されたのは、加藤忠広である。","a":0,"e":"誤り：加藤忠広。正しくは福島正則。正則は1619年、広島城を無断で修築したことが元和令違反とされ改易された。加藤忠広は肥後熊本の大名で、1632年に改易されている。","m":"広島城の無断修築＝福島正則","y":1619},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0063","lv":3,"s":"関東に領地をもつ大名の参勤交代の在府期間は2年と定められた。","a":0,"e":"誤り：2年。正しくは半年。参勤交代では多くの大名が江戸と国元に1年ずつ住んだが、江戸に近い関東の大名は半年ごとに交代した。対馬の宗氏のように数年に一度の例外もあった。","m":"関東の大名＝半年交代"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0064","lv":3,"s":"武家諸法度の元和令は、林羅山が起草した。","a":0,"e":"誤り：林羅山。正しくは以心崇伝。臨済宗の僧である崇伝は家康の外交・宗教政策の顧問で、元和令や禁中並公家諸法度を起草した。林羅山は朱子学者で、寛永令の起草に関わった。","m":"元和令＝崇伝、寛永令＝羅山","y":1615},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0065","lv":3,"s":"紫衣事件では、後水尾天皇が幕府に相談なく与えた紫衣の勅許を幕府が問題とし、大徳寺の沢庵らを処罰した。","a":1,"e":"1627年、幕府は後水尾天皇が幕府に相談なく与えた紫衣の勅許を無効とした。抗議した大徳寺の沢庵らは1629年に流罪となった。朝廷の決定より幕府の法度が優先することを示した事件である。","m":"紫衣事件＝法度が勅許に優越","y":1627},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0066","lv":3,"s":"禁中並公家諸法度が出された1615年当時の天皇は、後陽成天皇である。","a":0,"e":"誤り：後陽成。正しくは後水尾天皇。後水尾天皇は1611年に即位し、紫衣事件の後の1629年に、秀忠の孫にあたる明正天皇に譲位した。後陽成天皇は秀吉の聚楽第に行幸した天皇である。","m":"1615年の天皇＝後水尾","y":1615},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0067","lv":3,"s":"朝廷側で幕府との連絡にあたった役職は、武家伝奏である。","a":1,"e":"武家伝奏は公家から2名が選ばれ、幕府の指示を朝廷に伝え、朝廷の意向を幕府に伝える役割を担った。幕府側の京都所司代と組んで、朝廷を統制する仕組みの一部となった。","m":"武家伝奏＝朝廷側の連絡役"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0068","lv":3,"s":"大名の監察にあたった大目付は、若年寄の配下に置かれた。","a":0,"e":"誤り：若年寄。正しくは老中の配下。大目付は老中のもとで大名を監察し、目付は若年寄のもとで旗本・御家人を監察した。老中は大名、若年寄は旗本・御家人を担当するという分担と対応している。","m":"大目付＝老中、目付＝若年寄"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0069","lv":3,"s":"大名は、妻子を江戸に住まわせることを義務づけられた。","a":1,"e":"大名の妻子は江戸の藩邸に住むことを義務づけられ、事実上の人質となった。参勤交代とあわせ、大名を江戸に結びつけて反抗を防ぐ役割を果たした。関所で出女が厳しく調べられたのもこのためである。","m":"大名の妻子＝江戸で人質"},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0070","lv":3,"s":"元和令は、2代将軍秀忠が伏見城に諸大名を集めて発布した。","a":1,"e":"元和令は大坂夏の陣の直後の1615年7月、伏見城に集めた諸大名の前で示された。新しい城の建設や無断の修築、大名どうしの無許可の婚姻などを禁じ、違反した大名は改易の対象とした。","m":"元和令＝伏見城で発布","y":1615},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0071","lv":3,"s":"旗本・御家人のうち、知行地を与えられる者を蔵米取という。","a":0,"e":"誤り：蔵米取。正しくは地方知行取。知行地を与えられ、そこから年貢を取る者を地方知行取という。蔵米取は幕府の蔵から米を支給される者で、時代が下るほどこちらが多くなった。","m":"知行地＝地方知行、米＝蔵米取"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0072","lv":1,"s":"徳川家康は朱印状を与えて海外貿易を奨励し、朱印船貿易が盛んになった。","a":1,"e":"家康は海外渡航を許可する朱印状を大名や商人に与え、東南アジアとの貿易を保護した。朱印船はルソン・トンキン・シャムなどに渡り、各地に日本人が住む日本町が生まれた。","m":"朱印状＝幕府公認の渡航許可"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0073","lv":1,"s":"山田長政はシャム（タイ）のアユタヤで日本町の首長として活躍した。","a":1,"e":"山田長政は駿河出身で、シャムのアユタヤ日本町の長となり、日本人の傭兵隊を率いて王室に仕えた。朱印船貿易の時代、東南アジア各地に日本人が進出したことを示す代表的な人物である。","m":"アユタヤ日本町＝山田長政"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0074","lv":1,"s":"島原の乱（1637〜38年）では、天草四郎時貞が一揆勢の中心となった。","a":1,"e":"島原（松倉氏）・天草（寺沢氏）では重い年貢とキリシタン弾圧が続き、1637年に百姓やキリシタンが少年の天草四郎時貞を首領に蜂起した。一揆勢は原城に立てこもり、翌年に鎮圧された。","m":"島原・天草一揆＝天草四郎","y":1637},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0076","lv":1,"s":"1639年、幕府はポルトガル船の来航を禁止した。","a":1,"e":"島原の乱で幕府はキリスト教への警戒を強め、1639年に布教と結びつきの強いポルトガル船の来航を禁じた。貿易はオランダと中国に限られ、1641年の出島移転で鎖国の体制が整った。","m":"1639 ポルトガル船来航禁止","y":1639},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0077","lv":1,"s":"1624年、幕府はオランダ船の来航を禁止した。","a":0,"e":"誤り：オランダ船。正しくはスペイン船。フィリピンを拠点に布教を進めるスペインの来航を1624年に禁じた。オランダは布教を行わなかったため、鎖国後も長崎で貿易を許された唯一のヨーロッパの国となった。","m":"1624 スペイン、1639 ポルトガル","y":1624},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0078","lv":1,"s":"朝鮮は将軍の代替わりなどに、朝鮮通信使を江戸へ派遣した。","a":1,"e":"朝鮮出兵で断絶した国交は、対馬の宗氏の仲介で1607年に回復した。朝鮮からの使節は初め回答兼刷還使とよばれ、のち通信使として主に将軍の代替わりを祝うために来日した。","m":"通信使＝将軍の代替わりに来日"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0079","lv":1,"s":"琉球王国を征服したのは、松前藩である。","a":0,"e":"誤り：松前藩。正しくは薩摩藩（島津氏）。1609年、島津家久は家康の許可を得て琉球を攻め、尚寧王を捕らえて服属させた。松前藩は蝦夷地のアイヌとの交易を独占した藩である。","m":"琉球＝薩摩、アイヌ＝松前","y":1609},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0080","lv":1,"s":"対馬の宗氏は朝鮮との間で己酉約条を結び、貿易を再開した。","a":1,"e":"1609年の己酉約条で、対馬藩は朝鮮との貿易を独占的に認められた。釜山に倭館が置かれ、対馬からの貿易船の数も定められた。宗氏は朝鮮外交の実務も担い、藩財政を朝鮮貿易に頼った。","m":"己酉約条＝宗氏・釜山の倭館","y":1609},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0081","lv":1,"s":"鎖国下の長崎では、朝鮮とオランダのみが貿易を許された。","a":0,"e":"誤り：朝鮮。正しくは中国（明・清）。長崎で幕府が直接管理したのはオランダ船と中国船の貿易だった。朝鮮とは対馬藩、琉球とは薩摩藩、アイヌとは松前藩を通じて交流した。","m":"長崎＝オランダと中国"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0082","lv":1,"s":"イギリス人のウィリアム・アダムズは、家康に仕えて三浦按針と名乗った。","a":1,"e":"1600年に豊後に漂着したオランダ船リーフデ号の乗組員で、イギリス人のアダムズは家康の外交・貿易の顧問となった。相模の三浦に領地を与えられ、水先案内人を意味する按針から三浦按針と名乗った。","m":"アダムズ＝英・三浦按針","y":1600},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0083","lv":1,"s":"ヤン＝ヨーステンはイギリス人で、家康の外交顧問となった。","a":0,"e":"誤り：イギリス人。正しくはオランダ人。ヤン＝ヨーステンはリーフデ号の乗組員で、アダムズとともに家康に仕えた。江戸の屋敷地が「八重洲」の地名の由来とされる。イギリス人はアダムズである。","m":"ヨーステン＝蘭、アダムズ＝英","y":1600},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0084","lv":2,"s":"1635年、幕府は日本人の海外渡航と、海外からの帰国を全面的に禁止した。","a":1,"e":"1635年、日本人の海外渡航と、すでに海外にいる日本人の帰国が全面的に禁止された。朱印船貿易はこれで終わり、東南アジアの日本町は日本との往来が断たれて衰退した。","m":"1635 渡航・帰国の全面禁止","y":1635},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0085","lv":2,"s":"1641年、オランダ商館は平戸から長崎の出島に移された。","a":1,"e":"出島はもともとポルトガル人を収容するために長崎に築かれた人工の島だった。1639年のポルトガル船来航禁止で空いた出島に、1641年に平戸のオランダ商館が移され、鎖国体制が完成した。","m":"1641 平戸→出島へ商館移転","y":1641},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0086","lv":2,"s":"島原の乱の原因の一つは、領主による重税とキリシタンへの弾圧であった。","a":1,"e":"島原の領主松倉氏と天草の領主寺沢氏は、城の普請などのために重い年貢を取り立て、キリシタンを厳しく弾圧した。凶作も重なり、百姓とキリシタン、旧領主の家臣だった牢人が一揆に加わった。","m":"重税＋弾圧＋凶作＝島原の乱","y":1637},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0087","lv":2,"s":"糸割符制度は、オランダ商人が持ち込む生糸の価格を統制する制度である。","a":0,"e":"誤り：オランダ商人。正しくはポルトガル商人。1604年、京都・堺・長崎の特定商人に糸割符仲間をつくらせ、ポルトガル船の生糸を一括購入させた。のち江戸・大坂も加わり五カ所商人となった。","m":"糸割符＝ポルトガル生糸の統制","y":1604},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0088","lv":2,"s":"イギリスは、長崎に商館を開いた。","a":0,"e":"誤り：長崎。正しくは平戸。イギリスは1613年に平戸に商館を開いたが、オランダとの競争に敗れて1623年に撤退した。オランダも1609年に平戸に商館を開き、1641年に出島へ移っている。","m":"英も蘭も商館は平戸から","y":1613},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0089","lv":2,"s":"朱印船貿易で日本が主に輸入したのは銀である。","a":0,"e":"誤り：銀。正しくは中国産の生糸や絹織物など。当時の日本は石見銀山などで産出した銀を大量に輸出しており、世界の銀産出の大きな割合を占めた。銀は輸出品、生糸は輸入品と整理する。","m":"輸出＝銀、輸入＝生糸"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0092","lv":2,"s":"江戸時代の外交には、長崎・対馬・薩摩・松前の4つの窓口があった。","a":1,"e":"鎖国下でも、長崎（オランダ・中国）、対馬（朝鮮）、薩摩（琉球）、松前（アイヌ）の4つの窓口を通じて外国や異民族との交流が続いた。幕府は長崎を直轄し、他の3つは藩に任せた。","m":"4つの口＝長崎・対馬・薩摩・松前"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0093","lv":2,"s":"琉球は、将軍の代替わりごとに慶賀使、琉球国王の代替わりごとに謝恩使を江戸に派遣した。","a":1,"e":"琉球は薩摩の支配下に入ったが王国としての形は残され、使節を江戸に送った。将軍の代替わりには慶賀使、琉球国王の代替わりには謝恩使が派遣され、異国風の服装で行列することが求められた。","m":"慶賀使＝将軍、謝恩使＝国王"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0094","lv":2,"s":"中国人は、1689年に長崎の唐人屋敷に居住させられた。","a":1,"e":"中国人は当初長崎の町に雑居していたが、密貿易を防ぐため1689年に唐人屋敷に集められた。オランダ人の出島と同様、居住地を限定して管理する政策だった。1685年には中国船の貿易額も制限された。","m":"1689 唐人屋敷に中国人を集める","y":1689},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0095","lv":2,"s":"オランダ商館長は、海外の情勢を記したオランダ風説書を幕府に提出した。","a":1,"e":"オランダ風説書はオランダ商館長が入港のたびに提出した海外事情の報告書で、長崎の通詞が翻訳して幕府に届けた。鎖国下で幕府が世界の動きを知る主要な手段で、アヘン戦争の情報もこれで伝わった。","m":"風説書＝幕府の海外情報源"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0096","lv":2,"s":"1609年、家康はオランダに貿易を許可し、平戸に商館が開かれた。","a":1,"e":"オランダ東インド会社の船は1609年に家康から貿易を許され、平戸に商館を開いた。オランダは布教を伴わない貿易に徹したため、鎖国後もヨーロッパで唯一来航を許された。","m":"1609 オランダ、平戸に商館","y":1609},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0098","lv":3,"s":"1669年、松前藩に抵抗して蜂起したアイヌの首長はコシャマインである。","a":0,"e":"誤り：コシャマイン。正しくはシャクシャイン。1669年、松前藩の不利な交易に反発したアイヌがシャクシャインを中心に蜂起したが、鎮圧された。コシャマインの戦いは室町時代の1457年である。","m":"1457コシャマイン、1669シャクシャイン","y":1669},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0099","lv":3,"s":"琉球は、島津氏に征服されたのちも、明・清との朝貢関係を続けた。","a":1,"e":"琉球は薩摩の支配を受けつつ、中国への朝貢と冊封を続けた。薩摩は琉球を通じた中国貿易で利益を得るため、王国の形を残した。このため琉球は日本と中国の両方に属する状態となった。","m":"琉球＝薩摩支配＋中国へ朝貢"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0101","lv":3,"s":"朝鮮通信使は、江戸時代を通じて毎年来日した。","a":0,"e":"誤り：毎年。正しくは江戸時代を通じて12回。通信使は主に将軍の代替わりの際に来日し、400〜500人規模の一行が江戸まで旅をした。最後の1811年は対馬で応接され、江戸には来なかった。","m":"通信使は江戸時代に計12回"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0102","lv":3,"s":"1612年の禁教令は、まず幕府直轄領に出され、翌年に全国に拡大された。","a":1,"e":"1612年、まず幕領でキリスト教が禁じられ、翌1613年に全国に広げられた。1614年には高山右近ら信者と宣教師がマニラやマカオに追放され、1622年には長崎で大規模な処刑（元和の大殉教）が行われた。","m":"1612幕領→1613全国の禁教","y":1612},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0103","lv":3,"s":"1630年、キリスト教に関係する漢訳洋書の輸入が禁止された。","a":1,"e":"1630年、キリスト教に関係する漢訳洋書の輸入が禁じられた（寛永の禁書令）。中国で宣教師が漢文に訳した西洋の書物を通じて布教が広がるのを防ぐためで、のち1720年に吉宗が緩和した。","m":"1630 禁書→1720 吉宗が緩和","y":1630},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0104","lv":3,"s":"宗門改めでは、領民は神社の氏子として登録された。","a":0,"e":"誤り：神社の氏子。正しくは寺院の檀家。宗門改めでは、すべての人がいずれかの寺の檀家となり、寺がキリシタンでないことを証明した（寺請制度）。これが宗門改帳として戸籍の役割も果たした。","m":"宗門改め＝寺請・檀家"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0105","lv":3,"s":"朱印船貿易で活躍した商人には、京都の角倉了以や茶屋四郎次郎がいた。","a":1,"e":"朱印船貿易では、京都の角倉了以・茶屋四郎次郎、摂津の末吉孫左衛門、長崎の末次平蔵らの豪商が活躍した。島津・松浦・有馬などの西国大名も朱印状を得て船を出した。","m":"朱印船の豪商＝角倉・茶屋・末次"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0106","lv":3,"s":"島原の乱で一揆勢は、島原城に立てこもった。","a":0,"e":"誤り：島原城。正しくは原城。一揆勢は廃城となっていた原城跡に約3万人で立てこもった。幕府は老中松平信綱を派遣し、オランダ船にも砲撃させるなどして、1638年に兵糧攻めで陥落させた。","m":"一揆勢の籠城＝廃城の原城跡","y":1638},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0107","lv":1,"s":"4代将軍徳川家綱を補佐した保科正之は、文治主義への転換を支えた。","a":1,"e":"家光の死後、11歳で将軍となった家綱を、叔父で会津藩主の保科正之が補佐した。大名の改易を減らし、末期養子の禁の緩和や殉死の禁止を進めて、武力による威圧から法と儀礼による統治へ転換させた。","m":"家綱の補佐＝保科正之"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0108","lv":1,"s":"1651年の由井正雪らの事件を受け、幕府は末期養子の禁止をいっそう厳しくした。","a":0,"e":"誤り：厳しくした。正しくは緩和した。慶安の変の背景には、大名の改易で生じた多数の牢人の不満があった。幕府は50歳未満の大名が死の直前に養子を迎えることを認め、改易と牢人の増加を抑えた。","m":"慶安の変→末期養子の禁を緩和","y":1651},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0109","lv":1,"s":"5代将軍徳川綱吉は、湯島に聖堂を建てて儒学（朱子学）を奨励した。","a":1,"e":"綱吉は儒学を好み、1690年に林家の孔子廟を湯島に移して湯島聖堂とし、林信篤（鳳岡）を大学頭に任じた。主従や親子の秩序を重んじる朱子学の考えを、武家社会の支配に生かそうとした。","m":"綱吉＝湯島聖堂・朱子学","y":1690},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0110","lv":1,"s":"生類憐みの令は、8代将軍徳川吉宗が出した。","a":0,"e":"誤り：吉宗。正しくは5代将軍綱吉。1685年ごろから犬をはじめとする生き物の殺生を禁じる法令を繰り返し出した。極端な運用で民衆を苦しめ、綱吉の死後に6代家宣がすぐ廃止した。","m":"生類憐み＝綱吉、廃止＝家宣","y":1685},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0111","lv":1,"s":"荻原重秀は、貨幣の質を落として発行する元禄の貨幣改鋳を行った。","a":1,"e":"綱吉の時代、金銀の産出減少と寺社造営などで財政が悪化した。勘定吟味役の荻原重秀は金の含有量を減らした元禄小判を発行して差益を得たが、貨幣の価値が下がり物価が上昇した。","m":"荻原重秀＝元禄小判で質を下げる","y":1695},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0112","lv":1,"s":"6代将軍徳川家宣は、新井白石を登用して政治を行った。","a":1,"e":"家宣は甲府藩主の時代から儒学者新井白石を侍講としており、将軍となると側用人間部詮房とともに重用した。白石は将軍の権威を高め、儒学の理念に基づく政治をめざした。","m":"家宣・家継＋白石＝正徳の政治"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0113","lv":1,"s":"海舶互市新例は、徳川吉宗が出した貿易制限令である。","a":0,"e":"誤り：吉宗。正しくは新井白石。1715年、白石は長崎貿易で金銀が大量に流出していることを問題とし、来航する船の数と取引額を制限する海舶互市新例を出させた。長崎新令・正徳新令ともいう。","m":"海舶互市新例＝白石・1715","y":1715},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0114","lv":1,"s":"新井白石は、金銀の含有量を減らした貨幣を発行した。","a":0,"e":"誤り：減らした。正しくは慶長小判と同じ品位に戻した。白石は元禄の改鋳で上がった物価を抑えるため、1714年に良質の正徳小判を発行した。質を落としたのは元禄期の荻原重秀である。","m":"荻原は下げ、白石は戻す","y":1714},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0115","lv":1,"s":"家綱のとき、殉死が禁止された。","a":1,"e":"1663年、家綱は武家諸法度の発布の際に殉死の禁止を口頭で伝えた。主君の死後も家臣は新しい主君に仕えるべきだとし、主人個人ではなく家に奉公する秩序を重んじる方向を示した。","m":"1663 家綱が殉死を禁止","y":1663},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0116","lv":1,"s":"綱吉は、側用人の柳沢吉保を重用した。","a":1,"e":"側用人は将軍の命令を老中に伝え、老中の意見を将軍に取り次ぐ役職。綱吉は館林藩主時代からの家臣柳沢吉保を側用人として重用し、のち大老格に昇らせた。将軍の側近が政治を左右する時代となった。","m":"綱吉の側用人＝柳沢吉保"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0118","lv":1,"s":"家宣・家継の時期の政治を、正徳の政治という。","a":1,"e":"家宣・家継の時代は、新井白石と側用人間部詮房が政治を主導した。元号から正徳の政治（正徳の治）とよばれ、貨幣の改良、貿易の制限、将軍の権威を高める儀礼の整備が行われた。","m":"正徳の政治＝白石・間部"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0119","lv":1,"s":"白石の建議により、新しい宮家として閑院宮家が創設された。","a":1,"e":"天皇家の血筋が絶えるのを防ぎ、朝廷との協調を図るため、白石の建議で1710年に閑院宮家が創設された。のち閑院宮家から光格天皇が即位しており、この宮家の重要性はのちに明らかになった。","m":"閑院宮家＝白石の建議・1710","y":1710},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0120","lv":2,"s":"保科正之は、3代将軍家光の異母弟で、会津藩主であった。","a":1,"e":"保科正之は2代将軍秀忠の子で、家光の異母弟にあたる。信濃高遠の保科家の養子となり、のち会津藩主となった。家綱を補佐し、藩政では家訓十五か条を定めて会津藩の基礎を築いた。","m":"保科正之＝秀忠の子・家光の弟"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0121","lv":2,"s":"1651年、由井正雪らが幕府転覆を企てた慶安の変が起こった。","a":1,"e":"1651年、家光の死去直後に兵学者由井正雪と丸橋忠弥らが幕府の転覆を計画したが、事前に発覚した。改易で増えた牢人の不満が背景にあり、幕府は大名の改易を減らす方向に転じた。","m":"慶安の変＝由井正雪・牢人","y":1651},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0122","lv":2,"s":"綱吉は、林信篤を大学頭に任じて、儒学の振興をはかった。","a":1,"e":"林家は林羅山以来、幕府の儒学を担ってきた家。綱吉は1691年に林信篤を大学頭に任じ、以後この地位は林家が受け継いだ。林家は湯島聖堂の学問所を管理し、のちの昌平坂学問所につながる。","m":"大学頭＝林信篤から林家が世襲"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0123","lv":2,"s":"元禄の貨幣改鋳では、幕府は出目という差益を得た。","a":1,"e":"出目は、金銀の含有量を減らした新しい貨幣と古い貨幣を交換することで生じる差益のこと。元禄の改鋳では幕府に約500万両の収入をもたらしたが、貨幣価値の低下で物価が上がった。","m":"出目＝改鋳による差益","y":1695},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0125","lv":2,"s":"新井白石は、朝鮮国書での将軍の呼称を日本国王から日本国大君に改めさせた。","a":0,"e":"誤り：日本国王から大君。正しくは日本国大君から日本国王に改めさせた。白石は将軍が日本を代表する君主であることを示そうとした。吉宗の代には再び日本国大君に戻された。","m":"白石＝大君を日本国王に"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0126","lv":2,"s":"海舶互市新例は、金銀の海外流出を防ぐために貿易額を制限した。","a":1,"e":"長崎貿易の支払いで大量の金銀が海外に流出していたため、白石は1715年に海舶互市新例を出し、清船・オランダ船の来航数と貿易額を制限した。不足分は銅や俵物で支払う方針がのちに強まった。","m":"海舶互市新例＝金銀流出の防止","y":1715},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0127","lv":2,"s":"間部詮房は、家宣・家継の側用人として白石とともに政治を支えた。","a":1,"e":"間部詮房はもと猿楽師の出身で、家宣の甲府藩主時代からの家臣。家宣が将軍になると側用人となり、白石とともに政治を進めた。幼い家継の時代も補佐したが、吉宗の就任で退けられた。","m":"家宣の側用人＝間部詮房"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0128","lv":2,"s":"綱吉は、服忌令を出して、近親者の死去の際の服喪・忌引の日数を定めた。","a":1,"e":"服忌令（1684年）は、近親者が亡くなったときの喪に服する期間と、けがれを避けて出仕を控える日数を定めた。生類憐みの令とともに、殺生や死を忌む考え方を社会に広める役割を果たした。","m":"服忌令＝服喪・忌引の日数"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0129","lv":2,"s":"綱吉は将軍となる前、甲府藩主であった。","a":0,"e":"誤り：甲府。正しくは上野の館林藩主。綱吉は家光の子で、兄の家綱に子がなかったため館林から迎えられて5代将軍となった。甲府藩主から6代将軍となったのは綱吉の甥の家宣である。","m":"館林→綱吉、甲府→家宣"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0131","lv":2,"s":"家綱の時代には、幕府が大名に領知朱印状を一斉に交付した。","a":1,"e":"1664年、家綱は全国の大名に一斉に領知朱印状などを発給した（寛文印知）。将軍の代替わりに全大名との主従関係を文書で確認する手続きで、将軍の権威が個人より制度に支えられるようになったことを示す。","m":"寛文印知＝領知を一斉に保障","y":1664},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0132","lv":2,"s":"綱吉の将軍就任当初、大老として綱吉を補佐したのは柳沢吉保である。","a":0,"e":"誤り：柳沢吉保。正しくは堀田正俊。綱吉は就任当初、大老堀田正俊を重用して「天和の治」とよばれる政治を行った。正俊が1684年に江戸城内で刺殺された後、側用人柳沢吉保が力を伸ばした。","m":"初め大老堀田正俊、のち柳沢"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0133","lv":3,"s":"1657年の明暦の大火は、江戸の大半を焼いた。","a":1,"e":"1657年の明暦の大火は江戸市街の大半と江戸城本丸を焼き、死者は10万人に及んだとされる。復興では大名屋敷や寺社が郊外に移され、火除地や広小路を設けるなど都市の再編が進んだ。","m":"明暦の大火→火除地・広小路","y":1657},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0134","lv":3,"s":"殉死の禁止が武家諸法度に明文化されたのは、寛永令である。","a":0,"e":"誤り：寛永令。正しくは天和令（1683年）。殉死は1663年に口頭で禁じられ、綱吉の天和令で武家諸法度の条文に加えられた。天和令では末期養子の禁の緩和も条文化されている。","m":"殉死禁止の条文化＝天和令","y":1683},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0135","lv":3,"s":"綱吉の武家諸法度では、冒頭の文武弓馬の道が文武忠孝に改められた。","a":1,"e":"天和令は第1条を「文武弓馬の道」から「文武忠孝を励まし、礼儀を正すべき事」に改めた。武芸よりも主君への忠と親への孝、礼儀を重んじる姿勢を示し、文治政治を象徴する改定とされる。","m":"天和令＝弓馬から忠孝へ","y":1683},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0137","lv":3,"s":"新井白石は、宣教師シドッチを尋問し、『西洋紀聞』を著した。","a":1,"e":"1708年、イタリア人宣教師シドッチが布教のため屋久島に潜入して捕らえられた。白石は江戸でシドッチを尋問し、得た知識をもとに『西洋紀聞』と世界地理書『采覧異言』を著した。","m":"シドッチ尋問→西洋紀聞","y":1709},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0138","lv":3,"s":"海舶互市新例では、清船の来航は年間10隻、オランダ船は年間5隻と定められた。","a":0,"e":"誤り：清船10隻・オランダ船5隻。正しくは清船年30隻・オランダ船年2隻。貿易額も清は銀6000貫、オランダは銀3000貫に制限した。来航船を減らすことで金銀の流出を抑えようとした。","m":"新例＝清30隻・蘭2隻","y":1715},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0140","lv":3,"s":"綱吉は、江戸の中野に大規模な犬小屋を設けた。","a":1,"e":"生類憐みの令のもとで江戸では野犬の扱いが問題となり、1695年に中野などに大規模な犬小屋が設けられ、多数の犬が収容された。その費用は江戸の町人や周辺の村に課され、大きな負担となった。","m":"中野の犬小屋＝町人の負担"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0141","lv":3,"s":"1651年の緩和では、末期養子が認められたのは50歳以上の当主に限られた。","a":0,"e":"誤り：50歳以上。正しくは50歳未満の当主。それまで死の直前の養子は認められず、跡継ぎのいない大名家は断絶した。50歳未満なら認めることで改易を減らし、牢人の増加を防ごうとした。","m":"末期養子の緩和＝50歳未満","y":1651},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0143","lv":1,"s":"徳川吉宗は紀伊藩主から将軍となり、享保の改革を行った。","a":1,"e":"7代家継が8歳で亡くなり将軍家の血筋が絶えたため、御三家の紀伊藩主吉宗が1716年に8代将軍となった。吉宗は間部詮房・新井白石を退け、家康の時代を理想として財政の立て直しを進めた。","m":"紀伊藩主吉宗→8代・享保の改革","y":1716},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0144","lv":1,"s":"吉宗は上げ米を行い、大名から米を献上させた。","a":1,"e":"1722年、吉宗は財政難を乗り切るための臨時策として、大名に石高に応じて米を上納させた。代わりに参勤交代の江戸滞在を短くしており、将軍が大名に負担軽減を約束した点で異例の政策だった。","m":"上げ米＝大名から米を臨時徴収","y":1722},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0145","lv":1,"s":"吉宗は目安箱を設けて、庶民の意見を聞いた。","a":1,"e":"1721年、評定所の門前に目安箱を置き、庶民の意見や訴えを投書させた。吉宗自身が開封して読んだとされ、投書から小石川養生所の設置や江戸の防火対策が実現した。","m":"目安箱＝庶民の投書を政治に","y":1721},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0146","lv":1,"s":"吉宗は公事方御定書を定めて、裁判・刑罰の基準とした。","a":1,"e":"公事方御定書は、それまでの判例や法令を整理して裁判の基準を成文化したもの。上巻は警察・訴訟関係の法令、下巻は判例に基づく刑罰規定で、下巻は「御定書百箇条」とよばれた。","m":"公事方御定書＝裁判の基準を成文化","y":1742},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0147","lv":1,"s":"足高の制は、老中田沼意次が定めた制度である。","a":0,"e":"誤り：田沼意次。正しくは徳川吉宗。1723年に定められた足高の制は、役職ごとに基準の石高を決め、それに満たない者が就任したとき在職中だけ不足分を支給した。家柄にとらわれない人材登用をねらった。","m":"足高の制＝吉宗の人材登用","y":1723},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0148","lv":1,"s":"享保の飢饉は西日本を中心に起こり、ウンカの大発生が原因の一つであった。","a":1,"e":"1732年、西日本でイナゴやウンカが大量に発生して稲が枯れ、多くの餓死者が出た。米価が急騰し、翌1733年には江戸で米商人の高間伝兵衛が打ちこわしを受けた。江戸で最初の打ちこわしとされる。","m":"享保の飢饉＝西日本・ウンカ","y":1732},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0149","lv":1,"s":"相対済し令は、田畑の売買を禁じる法令である。","a":0,"e":"誤り：田畑の売買。正しくは金銀貸借の訴訟を幕府が受け付けず、当事者間で解決させる法令。訴訟が急増して評定所の事務が滞っていたことが背景にある。田畑の売買禁止は1643年の田畑永代売買の禁止令。","m":"相対済し令＝金公事を受理しない","y":1719},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0150","lv":1,"s":"田沼意次は、株仲間を積極的に公認して、運上・冥加金を徴収した。","a":1,"e":"田沼意次は年貢だけに頼る財政を改め、商業の利益を取り込もうとした。株仲間の結成を広く認めて営業の独占を保障する代わりに、運上・冥加という営業税を納めさせ、幕府の収入増をはかった。","m":"株仲間公認→運上・冥加"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0151","lv":1,"s":"田沼意次は、農業を重視して、商業を抑える政策をとった。","a":0,"e":"誤り：商業を抑えた。正しくは商業を重視した。田沼は株仲間の公認、銅座などの専売制、俵物の輸出奨励、南鐐二朱銀の発行など、商業や流通から収入を得る政策を進めた。農業重視は享保・寛政の改革。","m":"田沼＝商業重視、吉宗・定信＝農業"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0152","lv":1,"s":"天明の飢饉は、浅間山の噴火も重なって、東北地方を中心に大きな被害を出した。","a":1,"e":"1782年からの冷害に、1783年の浅間山の大噴火による降灰が重なり、東北地方を中心に多くの餓死者が出た（天明の飢饉）。各地で一揆や打ちこわしが続き、田沼の政治への批判が強まった。","m":"天明の飢饉＝冷害＋浅間山噴火","y":1782},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0154","lv":1,"s":"田沼意次は、南鐐二朱銀を発行した。","a":1,"e":"1772年に発行された南鐐二朱銀は、良質の銀貨でありながら「8枚で小判1両」と額面が刻まれた。重さを量る従来の銀貨と異なり、金貨の単位で使える銀貨で、金を中心とする貨幣の一本化をめざした。","m":"南鐐二朱銀＝金の単位の銀貨","y":1772},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0155","lv":1,"s":"田沼意次は、11代将軍徳川家斉の側用人から老中となった。","a":0,"e":"誤り：家斉。正しくは10代将軍家治。田沼意次は9代家重の小姓から出世し、家治のもとで側用人を経て1772年に老中となった。1786年に家治が死去すると失脚し、翌年11代家斉のもとで松平定信が老中となった。","m":"田沼＝家重に仕え家治の老中"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0156","lv":2,"s":"足高の制は、役職の基準の石高に満たない者に、在職中だけ不足分を補う制度である。","a":1,"e":"例えば町奉行の基準が3000石なら、500石の旗本が就任すると在職中だけ2500石を加えた。退任すれば元の石高に戻るため、幕府は支出を抑えつつ、家禄の低い有能な人物を要職に就けることができた。","m":"足高＝在職中だけ差額を支給","y":1723},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0158","lv":2,"s":"上げ米の代わりに、参勤交代での江戸在府期間が半年に短縮された。","a":1,"e":"上げ米と引き換えに、参勤交代の江戸在府期間は1年から半年に短縮された。大名の負担を減らす代わりに米を出させる取引で、財政が持ち直した1730年に上げ米は停止され、参勤交代も元に戻った。","m":"上げ米の見返り＝在府半年","y":1722},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0159","lv":2,"s":"定免法とは、一定期間、年貢率を固定する徴収法である。","a":1,"e":"定免法は、過去数年間の収穫量の平均から年貢率を決め、一定期間は豊作・凶作にかかわらず同じ率で徴収する方法。幕府の年貢収入を安定させ、年貢率の引き上げにも用いられた。","m":"定免法＝一定期間年貢率を固定","y":1722},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0161","lv":2,"s":"大岡忠相は町奉行として、江戸の町火消の整備を進めた。","a":1,"e":"大岡忠相は吉宗に抜擢されて江戸町奉行となり、町人による町火消を組織して、いろは47組（のち48組）を整えた。のちには寺社奉行に昇進し、大名にまで取り立てられた。","m":"大岡忠相＝町奉行・町火消"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0162","lv":2,"s":"目安箱の投書を受けて、小石川養生所が設けられた。","a":1,"e":"1722年、町医者小川笙船の目安箱への投書をきっかけに、小石川薬園の中に養生所が設けられた。貧しい病人を無料で治療する施設で、目安箱が実際の政策につながった例として知られる。","m":"小石川養生所＝投書から実現","y":1722},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0163","lv":2,"s":"田沼意次は、干しあわびなどの俵物の輸出を奨励して、金銀の流入をはかった。","a":1,"e":"俵物は干しあわび・ふかひれ・いりこ（干しなまこ）など、俵に詰めて輸出した海産物。中国料理の高級食材として清で需要が高く、田沼はこれを輸出して金銀の流出を抑え、逆に流入させようとした。","m":"俵物＝清向け海産物の輸出"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0166","lv":2,"s":"吉宗は、漢訳洋書の輸入を緩和して、キリスト教関係の書物も輸入可能とした。","a":0,"e":"誤り：キリスト教関係の書物も。正しくはキリスト教に関係しない書物に限った。吉宗は実学を重視し、1720年に漢訳洋書の輸入制限を緩めた。これが青木昆陽・野呂元丈の蘭学学習につながった。","m":"1720 洋書緩和、キリスト教除く","y":1720},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0168","lv":2,"s":"田沼意次は、工藤平助の意見を参考にして、蝦夷地の調査や開発を進めた。","a":1,"e":"仙台藩医の工藤平助は『赤蝦夷風説考』でロシアの南下を警告し、蝦夷地の開発とロシアとの交易を説いた。田沼はこれを受けて1785年に最上徳内らを蝦夷地調査に派遣したが、失脚で中止された。","m":"工藤平助の献策→蝦夷地調査"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0169","lv":3,"s":"上げ米は、石高1万石につき100石の米を納めさせた。","a":1,"e":"上げ米の額は石高1万石につき100石で、全体で年18万7000石ほどになった。幕府の年貢収入の1割強に相当し、財政危機を一時的にしのぐのに役立った。","m":"上げ米＝1万石につき100石","y":1722},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0170","lv":3,"s":"公事方御定書は、1742年に制定された。","a":1,"e":"公事方御定書は、吉宗の命で老中松平乗邑らが編纂し、1742年に完成した。以後の幕府の裁判の基準となり、一般には公開されない法典だったが、写本を通じて諸藩の法にも影響を与えた。","m":"1742 公事方御定書の完成","y":1742},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0172","lv":3,"s":"青木昆陽は、吉宗の命でサツマイモの栽培を研究した。","a":1,"e":"青木昆陽は吉宗に登用され、甘藷（サツマイモ）の栽培法をまとめた『蕃薯考』を著した。サツマイモ

認めた。","a":0,"e":"誤り：満20歳以上のすべての男女。正しくは満25歳以上の男子に納税額の条件なしで選挙権を与えた。女性の参政権は認められず、1945年の選挙法改正で満20歳以上の男女に拡大された。","m":"普選は25歳以上の男子","y":1925},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0267","lv":1,"s":"普通選挙法は、1925年に加藤高明内閣のもとで成立した。","a":1,"e":"1925年、加藤高明内閣は納税資格を撤廃する普通選挙法を成立させた。同じ年に治安維持法も成立しており、選挙権の拡大と社会運動の取締りが一体で進められた。","m":"普通選挙法は加藤内閣","y":1925},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0268","lv":1,"s":"1925年、普通選挙法と同じ年に、治安維持法が制定された。","a":1,"e":"治安維持法は、普通選挙の実施で無産政党の勢力が伸びることや、日ソ国交樹立で共産主義の影響が強まることを警戒して1925年に制定された。国体の変革や私有財産制度の否認を目的とする結社を処罰した。","m":"治安維持法は普選と同年","y":1925},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0270","lv":1,"s":"1925年に、日ソ基本条約が結ばれ、日本とソ連の間に国交が樹立された。","a":1,"e":"1925年、加藤高明内閣の外相幣原喜重郎のもとで日ソ基本条約が結ばれ、ソ連と国交を樹立した。日本はシベリア出兵後も占領していた北樺太から撤兵した。","m":"日ソ基本条約で国交樹立（1925）","y":1925},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0271","lv":1,"s":"1927年の金融恐慌で総辞職したのは、田中義一内閣である。","a":0,"e":"誤り：田中義一内閣。正しくは第1次若槻礼次郎内閣。経営が破綻した台湾銀行を緊急勅令で救済しようとしたが、枢密院に否決されて総辞職した。田中義一内閣はその後に成立して恐慌を収めた。","m":"金融恐慌で倒れたのは若槻","y":1927},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0272","lv":1,"s":"浜口雄幸内閣は、1930年に金輸出解禁（金解禁）を実施した。","a":1,"e":"浜口内閣の蔵相井上準之助は、緊縮財政と産業合理化で物価を下げ、1930年1月に金輸出解禁を実施した。為替相場を安定させ、国際競争力を高めて輸出を伸ばすことがねらいだった。","m":"金解禁は浜口内閣・1930","y":1930},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0273","lv":1,"s":"1930年のロンドン海軍軍縮条約を結んだのは、犬養毅内閣である。","a":0,"e":"誤り：犬養毅内閣。正しくは浜口雄幸内閣で、元首相若槻礼次郎を首席全権として調印した。補助艦の総保有量を対米約7割とした。犬養内閣は満州事変後の1931年12月に成立した内閣である。","m":"ロンドン条約は浜口内閣","y":1930},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0274","lv":1,"s":"1930年から、世界恐慌の影響と金解禁の影響が重なって、日本は昭和恐慌に陥った。","a":1,"e":"1929年にアメリカで始まった世界恐慌の影響と、旧平価での金解禁による円高・デフレが重なり、輸出が激減して日本は深刻な昭和恐慌に陥った。企業の倒産や賃下げ、失業が広がった。","m":"昭和恐慌は金解禁＋世界恐慌","y":1930},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0275","lv":1,"s":"張作霖爆殺事件を起こしたのは、朝鮮軍の将校である。","a":0,"e":"誤り：朝鮮軍の将校。正しくは関東軍参謀の河本大作らで、満州の直接支配をねらい、1928年に奉天近郊で張作霖の列車を爆破した。真相は国民に知らされず「満州某重大事件」と呼ばれた。","m":"張作霖爆殺は関東軍（1928）","y":1928},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0276","lv":2,"s":"1923年の虎の門事件の責任をとって、第2次山本権兵衛内閣は総辞職した。","a":1,"e":"1923年12月、帝国議会の開院式に向かう摂政裕仁親王（のちの昭和天皇）が、虎の門付近で無政府主義者の難波大助に狙撃された。第2次山本内閣は責任をとって総辞職した。","m":"虎の門事件で山本内閣が総辞職","y":1923},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0277","lv":2,"s":"清浦奎吾内閣は、閣僚の大部分を貴族院議員から選んだため、批判を浴びた。","a":1,"e":"1924年に成立した清浦奎吾内閣は、陸・海・外相を除く閣僚を貴族院議員から選んだ。政党を無視した特権内閣として批判され、憲政会・政友会・革新倶楽部が第2次護憲運動を起こした。","m":"清浦内閣は貴族院中心の特権内閣","y":1924},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0278","lv":2,"s":"第2次護憲運動を受けた1924年の総選挙で、護憲三派が勝利した。","a":1,"e":"清浦内閣は政友本党の支持を頼りに衆議院を解散したが、1924年5月の総選挙で護憲三派が圧勝した。清浦内閣は総辞職し、第一党となった憲政会の加藤高明が組閣した。","m":"1924総選挙で護憲三派が圧勝","y":1924},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0279","lv":2,"s":"護憲三派とは、憲政会・立憲政友会・立憲国民党のことである。","a":0,"e":"誤り：立憲国民党。正しくは犬養毅の率いる革新倶楽部。護憲三派は加藤高明の憲政会、高橋是清の立憲政友会、革新倶楽部である。立憲国民党は第1次護憲運動のときの犬養の政党で、1922年に解党した。","m":"三派は憲政会・政友会・革新倶楽部","y":1924},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0280","lv":2,"s":"幣原喜重郎外相は、中国に対して内政不干渉を原則とする協調外交を進めた。","a":1,"e":"幣原喜重郎は加藤・若槻・浜口・第2次若槻の各内閣で外相を務め、ワシントン体制のもとで英米と協調し、中国の内政には干渉しない方針をとった。軍部や政友会からは軟弱外交と批判された。","m":"幣原外交は協調・内政不干渉","y":1924},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0281","lv":2,"s":"加藤高明内閣のもとで、山梨半造陸相は、陸軍の4個師団を削減する軍縮を行った。","a":0,"e":"誤り：山梨半造。正しくは宇垣一成。1925年に4個師団を廃止し、浮いた経費で装備を近代化した。山梨半造は1922〜23年に師団を減らさず兵員を削減する山梨軍縮を行った陸相である。","m":"4個師団削減は宇垣軍縮","y":1925},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0283","lv":2,"s":"田中義一内閣は、金融恐慌に対して、井上準之助蔵相のもとで3週間のモラトリアム（支払猶予令）を出した。","a":0,"e":"誤り：井上準之助。正しくは高橋是清蔵相で、日本銀行から巨額の救済融資も行って取付け騒ぎを鎮めた。井上準之助は浜口内閣の蔵相として1930年に金解禁を行った。","m":"モラトリアムは高橋是清蔵相","y":1927},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0284","lv":2,"s":"田中義一内閣は、居留民保護を名目に山東出兵を行い、国民政府軍の北伐に干渉した。","a":1,"e":"田中義一内閣は、蔣介石の国民革命軍による北伐が華北に迫ると、日本人居留民の保護を名目に1927〜28年の3度にわたり山東省に出兵し、1928年には済南で国民革命軍と衝突した。","m":"山東出兵は田中内閣（1927〜28）","y":1927},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0285","lv":2,"s":"張作霖爆殺事件のときの首相は、浜口雄幸である。","a":0,"e":"誤り：浜口雄幸。正しくは田中義一。田中首相は関東軍の首謀者を厳しく処分すると天皇に報告しながら軽い処分で済ませたため、天皇の不信を買い、1929年に総辞職した。浜口内閣はその後に成立した。","m":"張作霖爆殺時は田中内閣","y":1928},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0286","lv":2,"s":"浜口雄幸内閣は、金解禁にあたって、旧平価（円の旧来の価値）で行った。","a":1,"e":"浜口内閣は金解禁を、実際の円の価値より高い旧平価（100円＝約49.85ドル）で行った。円高になって輸出商品が割高となり、世界恐慌と重なって正貨の大量流出と深刻な不況を招いた。","m":"金解禁は円高の旧平価で実施","y":1930},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0287","lv":2,"s":"三・一五事件では、政府が無政府主義者らを一斉に検挙した。","a":0,"e":"誤り：無政府主義者。正しくは日本共産党員。1928年の第1回普通選挙で無産政党が8議席を得ると、田中内閣は3月15日に共産党員を一斉に検挙した。翌1929年にも四・一六事件で大量検挙を行った。","m":"三・一五は共産党員を検挙","y":1928},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0288","lv":2,"s":"ロンドン海軍軍縮条約の調印をめぐり、野党や海軍の一部は政府が統帥権を干犯したと批判した。","a":1,"e":"浜口内閣は、海軍軍令部の反対を押し切ってロンドン海軍軍縮条約に調印した。立憲政友会や軍令部、右翼は、兵力量の決定は天皇の統帥権に属するとして政府を攻撃した。浜口首相は同年、東京駅で狙撃された。","m":"ロンドン条約で統帥権干犯問題","y":1930},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0289","lv":2,"s":"浜口雄幸は、立憲政友会の総裁として首相に就任した。","a":0,"e":"誤り：立憲政友会。正しくは1927年に憲政会と政友本党が合同してできた立憲民政党の総裁である。政友会の総裁は田中義一、その死後は犬養毅が継いだ。","m":"浜口は民政党（1929）","y":1929},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0290","lv":3,"s":"普通選挙法の成立で、有権者は約300万人から約1240万人へ、約4倍に増えた。","a":1,"e":"1925年の普通選挙法で納税資格がなくなり、有権者は約330万人から約1240万人に増え、全人口の約20％となった。この選挙法による最初の総選挙は1928年に行われた。","m":"普選で有権者は約4倍に","y":1925},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0292","lv":3,"s":"1928年、田中義一内閣は緊急勅令によって治安維持法を改正し、最高刑を死刑に引き上げた。","a":1,"e":"田中内閣は治安維持法の改正案を議会に出したが成立しなかったため、1928年に緊急勅令で改正した。最高刑を死刑とし、結社の目的を知りながら活動を助けた者も処罰できるようにした。","m":"1928年緊急勅令で死刑を追加","y":1928},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0293","lv":3,"s":"1927年に、台湾銀行の救済のための緊急勅令案を否決したのは、貴族院である。","a":0,"e":"誤り：貴族院。正しくは天皇の最高諮問機関である枢密院。若槻内閣の幣原外交に不満をもつ枢密院は、鈴木商店に融資して経営難に陥った台湾銀行を救う緊急勅令案を否決し、内閣は総辞職した。","m":"緊急勅令を否決したのは枢密院","y":1927},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0295","lv":3,"s":"1931年に制定された重要産業統制法は、カルテルの結成を認めた法律である。","a":1,"e":"昭和恐慌のなか、浜口内閣は1931年に重要産業統制法を制定し、指定した産業でカルテルの結成を認めて生産量や価格の協定を進めさせた。統制経済の先がけとなった。","m":"重要産業統制法でカルテル容認","y":1931},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0296","lv":3,"s":"パリ不戦条約の「人民ノ名ニ於テ」という文言が、天皇主権に反すると国内で批判された。","a":1,"e":"1928年、田中内閣はパリで不戦条約に調印し、国家の政策の手段としての戦争を放棄することを約束した。条文中の「其ノ各自ノ人民ノ名ニ於テ」が天皇主権に反すると批判され、政府はこの部分を日本には適用しないと宣言して批准した。","m":"不戦条約の「人民の名において」","y":1928},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0297","lv":3,"s":"関東大震災後、後藤新平を総裁とする帝都復興院が設けられ、東京の復興計画が進められた。","a":1,"e":"関東大震災後、第2次山本内閣の内相後藤新平が総裁を兼ねて帝都復興院が設けられた。大規模な復興計画は予算の削減で縮小されたが、昭和通りなどの幹線道路や公園が整備された。","m":"帝都復興院の総裁は後藤新平","y":1923},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0298","lv":3,"s":"1928年の済南事件は、日本軍が上海で国民革命軍と衝突した事件である。","a":0,"e":"誤り：上海。正しくは山東省の済南。1928年、第2次山東出兵中の日本軍が北伐中の国民革命軍と衝突した。この事件で中国の反日感情は強まった。","m":"済南事件は山東省（1928）","y":1928},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0299","lv":3,"s":"1928年の第1回普通選挙が実施されたときの首相は、浜口雄幸である。","a":0,"e":"誤り：浜口雄幸。正しくは田中義一（立憲政友会）。1928年の第1回普通選挙では、政友会と民政党がほぼ同数で並び、無産政党も8名が当選した。田中内閣は直後に三・一五事件を起こした。","m":"第1回普選は田中内閣","y":1928},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0300","lv":1,"s":"1931年9月、関東軍が奉天郊外の柳条湖で南満州鉄道の線路を爆破し、満州事変が始まった。","a":1,"e":"1931年9月18日、関東軍参謀の石原莞爾・板垣征四郎らは奉天郊外の柳条湖で満鉄線路を爆破し、中国軍の仕業として軍事行動を始めた。関東軍は半年ほどで満州の主要地域を占領した。","m":"満州事変は柳条湖事件から","y":1931},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0302","lv":1,"s":"1932年、日本は清朝最後の皇帝溥儀を執政として、満州国の建国を宣言した。","a":1,"e":"1932年3月、関東軍は清朝最後の皇帝溥儀を執政として満州国を建国させた。実権は関東軍と日本人官吏が握る傀儡国家で、1934年に帝政に移行して溥儀は皇帝となった。","m":"満州国の執政は溥儀（1932）","y":1932},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0304","lv":1,"s":"1932年の五・一五事件で、海軍青年将校らが首相の犬養毅を暗殺した。","a":1,"e":"1932年5月15日、海軍青年将校らが首相官邸を襲い犬養毅を射殺した。後継には海軍大将斎藤実が選ばれて挙国一致内閣を組織し、1924年以来の政党内閣は終わった。","m":"五・一五で犬養暗殺、政党内閣終わる","y":1932},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0305","lv":1,"s":"二・二六事件を起こしたのは、海軍の青年将校たちである。","a":0,"e":"誤り：海軍の青年将校。正しくは陸軍の皇道派青年将校で、1936年2月26日に約1400人の兵を率いて首相官邸などを襲い、高橋是清蔵相・斎藤実内大臣らを殺害した。反乱は鎮圧され、統制派が陸軍の主導権を握った。","m":"二・二六は陸軍皇道派（1936）","y":1936},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0306","lv":1,"s":"1937年7月の盧溝橋事件をきっかけに、日中戦争が始まった。","a":1,"e":"1937年7月7日、北京郊外の盧溝橋付近で日中両軍が衝突した。第1次近衛文麿内閣は当初不拡大方針をとったが兵力を増派し、8月には上海にも戦火が広がって全面戦争となった。","m":"盧溝橋事件で日中戦争（1937）","y":1937},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0307","lv":1,"s":"国家総動員法は、東条英機内閣のときに制定された。","a":0,"e":"誤り：東条英機内閣。正しくは第1次近衛文麿内閣で、1938年に制定された。戦争遂行のため、議会の承認なしに勅令で労働力・物資などを統制・動員する権限を政府に与えた。","m":"国家総動員法は近衛内閣","y":1938},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0308","lv":1,"s":"1940年、第2次近衛文麿内閣のもとで、政党が解散して大政翼賛会が結成された。","a":1,"e":"1940年、近衛文麿を中心に強力な一国一党をめざす新体制運動が起こり、立憲政友会・立憲民政党などの政党は自ら解散した。結成された大政翼賛会は首相を総裁とする上意下達の組織となった。","m":"大政翼賛会で政党解散","y":1940},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0309","lv":1,"s":"日独伊三国同盟は、太平洋戦争が始まった後に結ばれた。","a":0,"e":"誤り：太平洋戦争が始まった後。正しくは開戦前の1940年9月、第2次近衛内閣のときに結ばれた。ほぼ同時に北部仏印に進駐しており、アメリカは屑鉄の対日輸出禁止などで対抗し日米関係は悪化した。","m":"三国同盟は開戦前の1940年","y":1940},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0310","lv":1,"s":"日本は1941年4月に、ソ連との間で日ソ中立条約を結んだ。","a":1,"e":"1941年4月、松岡洋右外相はモスクワで日ソ中立条約に調印した。北方の安全を確保して南方へ進出するねらいだったが、同年6月に独ソ戦が始まり、国際関係の前提は大きく崩れた。","m":"日ソ中立条約は1941年4月","y":1941},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0311","lv":1,"s":"1941年12月8日、日本軍はハワイの真珠湾を攻撃し、太平洋戦争が始まった。","a":1,"e":"1941年12月8日、日本陸軍はイギリス領マレー半島に上陸し、海軍はハワイの真珠湾を奇襲した。東条英機内閣は米英に宣戦を布告し、日中戦争と合わせて大東亜戦争と呼んだ。","m":"真珠湾攻撃は1941年12月8日","y":1941},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0312","lv":1,"s":"1942年のミッドウェー海戦で、日本海軍はアメリカ海軍に大勝した。","a":0,"e":"誤り：大勝した。正しくは1942年6月の海戦で主力空母4隻と多くの艦載機を失って大敗した。これを境に日本は太平洋での主導権を失い、同年8月からのガダルカナル島の戦いでも敗れた。","m":"ミッドウェーで大敗（1942）","y":1942},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0313","lv":1,"s":"1945年8月、日本はポツダム宣言を受諾して連合国に降伏した。","a":1,"e":"1945年8月14日、鈴木貫太郎内閣は御前会議でポツダム宣言の受諾を決めて連合国に通告し、翌15日に天皇のラジオ放送で国民に知らせた。9月2日に降伏文書に調印した。","m":"ポツダム宣言受諾は1945年8月","y":1945},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0314","lv":2,"s":"国際連盟総会は、満州国を認めない勧告案を採択し、日本代表の松岡洋右は退場した。","a":1,"e":"1933年2月の国際連盟総会は、リットン報告書に基づき、満州国を認めず日本軍の満鉄付属地内への撤兵を求める勧告案を42対1で可決した。全権松岡洋右は退場し、日本は翌3月に脱退を通告した。","m":"総会は42対1で勧告案","y":1933},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0315","lv":2,"s":"日本が国際連盟脱退を通告したのは、満州事変が起こった1931年である。","a":0,"e":"誤り：1931年。正しくは1933年3月。満州事変の翌1932年にリットン調査団が報告書をまとめ、1933年2月の連盟総会が勧告案を可決したのを受けて脱退を通告した。脱退は1935年に発効した。","m":"連盟脱退の通告は1933年","y":1933},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0316","lv":2,"s":"犬養毅内閣の高橋是清蔵相は、金輸出を再禁止して管理通貨制度へ移行した。","a":1,"e":"1931年12月に成立した犬養毅内閣の蔵相高橋是清は、ただちに金輸出を再禁止し、円の金兌換も停止した。日本は金本位制を離れて管理通貨制度へ移り、円安を利用して輸出を伸ばした。","m":"高橋是清が金再禁止（1931）","y":1931},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0317","lv":2,"s":"高橋是清蔵相は、公共事業を拡大して、赤字国債を日本銀行に引き受けさせた。","a":1,"e":"高橋是清蔵相は赤字国債を日本銀行に引き受けさせて財源とし、軍事費と農村救済の時局匡救事業に支出した。景気は回復したが、のちに軍事費の抑制を図って陸軍と対立した。","m":"高橋財政は国債の日銀引受","y":1932},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0318","lv":2,"s":"1933年の滝川事件は、東京帝国大学の教授が、自由主義的な刑法学説を理由に休職処分を受けた事件である。","a":0,"e":"誤り：東京帝国大学。正しくは京都帝国大学の滝川幸辰教授で、文相鳩山一郎が休職処分とした。東京帝国大学の美濃部達吉の天皇機関説が攻撃されたのは1935年である。","m":"滝川事件は京大・鳩山文相","y":1933},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0319","lv":2,"s":"二・二六事件の後に成立した広田弘毅内閣は、軍部大臣現役武官制を復活させた。","a":1,"e":"二・二六事件の後に成立した広田弘毅内閣は、1936年に陸海軍大臣を現役の大将・中将に限る制度を復活させた。陸軍の意に反する内閣は組閣できなくなり、軍の政治的発言力が強まった。","m":"広田内閣は現役武官制復活","y":1936},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0320","lv":2,"s":"二・二六事件で殺害された大蔵大臣は、井上準之助である。","a":0,"e":"誤り：井上準之助。正しくは高橋是清。高橋は軍事費の抑制を図って陸軍の反感を買っていた。井上準之助は金解禁を行った元蔵相で、1932年の血盟団事件で暗殺された。","m":"二・二六で高橋是清蔵相が死去","y":1936},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0321","lv":2,"s":"1936年、日本は第1次近衛文麿内閣のもとで、ドイツと日独防共協定を結んだ。","a":0,"e":"誤り：第1次近衛文麿内閣。正しくは二・二六事件後に成立した広田弘毅内閣。コミンテルンに共同で対抗する協定で、1937年にイタリアが加わって日独伊三国防共協定となった。","m":"日独防共協定は広田内閣","y":1936},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0322","lv":2,"s":"1940年、日本は重慶の国民政府に対抗させるため、汪兆銘を首班とする新国民政府を南京に樹立させた。","a":1,"e":"日本は重慶に移った蔣介石の国民政府に対抗させるため、国民党の要人汪兆銘を重慶から脱出させ、1940年に南京に新国民政府を樹立させた。しかし汪政権は民衆の支持を得られず、戦争は終わらなかった。","m":"汪兆銘の新政府は南京（1940）","y":1940},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0323","lv":2,"s":"1938年の近衛声明「国民政府を対手とせず」は、第2次近衛内閣が出した。","a":0,"e":"誤り：第2次近衛内閣。正しくは第1次近衛内閣で、1938年1月に声明を出し、蔣介石の国民政府との和平交渉を自ら閉ざした。同年11月には戦争の目的を東亜新秩序の建設とする声明を出した。","m":"対手とせずは第1次近衛","y":1938},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0324","lv":2,"s":"1939年のノモンハン事件で、日本軍はソ連・モンゴル軍に勝利した。","a":0,"e":"誤り：勝利した。正しくは満州国とモンゴルの国境紛争で、ソ連軍の戦車・航空機に大損害を受けた。この敗北で陸軍の北進論は後退し、南方へ進出する南進論が強まった。","m":"ノモンハンは日本の敗北","y":1939},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0325","lv":2,"s":"独ソ不可侵条約の締結に衝撃を受け、平沼騏一郎内閣は「欧州情勢は複雑怪奇」として総辞職した。","a":1,"e":"1939年、平沼騏一郎内閣はドイツとの軍事同盟を交渉していたが、そのドイツがソ連と不可侵条約を結んだ。対ソ戦を想定していた外交方針は破綻し、平沼内閣は「欧州情勢は複雑怪奇」と述べて総辞職した。","m":"独ソ不可侵で平沼内閣総辞職","y":1939},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0326","lv":2,"s":"1941年の南部仏印進駐の後、アメリカは在米日本資産を凍結し、石油の対日輸出を禁止した。","a":1,"e":"1941年7月、第3次近衛内閣が南部仏印に進駐すると、アメリカは在米日本資産を凍結し、8月には石油の対日輸出を禁止した。英・中・蘭も同調し、ABCD包囲陣と呼ばれた。","m":"南部仏印進駐→石油禁輸","y":1941},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0327","lv":2,"s":"ハル＝ノートは、日本に中国からの撤兵を求めなかった。","a":0,"e":"誤り：撤兵を求めなかった。正しくは1941年11月の米国務長官ハルの提案で、中国・仏印からの全面撤兵、汪兆銘政権の否認、三国同盟の実質的な破棄などを求めた。東条内閣はこれを最後通牒とみなし開戦を決めた。","m":"ハル＝ノートは全面撤兵要求","y":1941},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0328","lv":2,"s":"1943年、戦局の悪化で、文科系の大学生などの徴兵猶予が停止され、学徒出陣が始まった。","a":1,"e":"1943年、兵力不足を補うため文科系学生の徴兵猶予が停止され、学生が陸海軍に入隊した。同年10月には東京の明治神宮外苑競技場で出陣学徒の壮行会が開かれた。","m":"学徒出陣は1943年","y":1943},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0329","lv":3,"s":"1933年の塘沽停戦協定で、満州事変が事実上、終結した。","a":1,"e":"1933年5月、日本は中国と塘沽停戦協定を結び、満州事変は軍事的に終息した。河北省東部に非武装地帯が設けられ、中国は事実上満州国の存在を黙認する形となった。","m":"塘沽停戦協定で満州事変終息","y":1933},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0330","lv":3,"s":"満州国を承認した日満議定書は、犬養毅内閣のもとで調印された。","a":0,"e":"誤り：犬養毅内閣。正しくは五・一五事件の後に成立した斎藤実内閣で、1932年9月に調印して満州国を承認した。犬養首相は満州国の承認に慎重で、中国との交渉による解決を模索していた。","m":"日満議定書は斎藤内閣","y":1932},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0331","lv":3,"s":"1935年、天皇機関説が問題となり、岡田啓介内閣は国体明徴声明を出した。","a":1,"e":"1935年、美濃部達吉の天皇機関説が貴族院で国体に反すると攻撃され、軍部・右翼・政友会の一部が排撃運動を起こした。岡田啓介内閣は国体明徴声明を出して機関説を否定し、美濃部は貴族院議員を辞した。","m":"国体明徴声明は岡田内閣（1935）","y":1935},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0332","lv":3,"s":"1937年、日中戦争の開始後に、国民党と共産党は第2次国共合作を成立させた。","a":1,"e":"1936年の西安事件をきっかけに内戦停止の動きが進み、盧溝橋事件後の1937年9月、国民党と共産党が第2次国共合作を成立させて抗日民族統一戦線を結んだ。日本は長期戦に引き込まれた。","m":"第2次国共合作で抗日統一戦線","y":1937},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0333","lv":3,"s":"1943年、東条英機内閣は東京で大東亜会議を開き、占領地域の代表を集めた。","a":1,"e":"1943年11月、東条英機内閣は満州国・汪兆銘政権・タイ・ビルマ・フィリピンなどの代表を東京に集めて大東亜会議を開き、大東亜共栄圏の結束を示す大東亜共同宣言を出した。","m":"大東亜会議は東条内閣（1943）","y":1943},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0334","lv":3,"s":"血盟団事件で暗殺されたのは、首相の犬養毅である。","a":0,"e":"誤り：首相の犬養毅。正しくは前蔵相井上準之助と三井合名理事長団琢磨。井上日召の率いる血盟団は「一人一殺」を唱えて1932年2〜3月に暗殺を行った。犬養毅は同年の五・一五事件で殺害された。","m":"血盟団は井上準之助・団琢磨","y":1932},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0335","lv":3,"s":"日ソ中立条約を結んだときの外務大臣は、重光葵である。","a":0,"e":"誤り：重光葵。正しくは松岡洋右。松岡は1933年の国際連盟総会での全権でもあり、外相として三国同盟も推進した。重光葵は1945年9月に政府代表として降伏文書に調印した外相である。","m":"日ソ中立条約は松岡洋右","y":1941},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0336","lv":3,"s":"サイパン島が陥落した後、総辞職したのは近衛文麿内閣である。","a":0,"e":"誤り：近衛文麿内閣。正しくは東条英機内閣。1944年7月にマリアナ諸島のサイパン島が陥落すると、本土が米軍の爆撃圏に入り、責任を問われた東条内閣は総辞職して小磯国昭内閣に代わった。","m":"サイパン陥落で東条内閣倒壊","y":1944},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0337","lv":3,"s":"日本軍による南京の占領は、1938年末のことである。","a":0,"e":"誤り：1938年末。正しくは1937年12月。上海を攻略した日本軍は首都南京を占領し、その際に多数の中国人捕虜や住民を殺害した（南京事件）。国民政府は漢口、ついで重慶に移って抗戦を続けた。","m":"南京占領は1937年12月","y":1937},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0338","lv":3,"s":"1862年の文久の改革で、一橋慶喜は政事総裁職に、松平慶永は将軍後見職に任じられた。","a":0,"e":"誤り：役職が逆。正しくは一橋慶喜が将軍後見職、松平慶永が政事総裁職。島津久光が勅使を伴って幕府に改革を迫ったもので、京都守護職には会津藩主松平容保が就いた。","m":"慶喜は後見職、慶永は総裁職","y":1862},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0339","lv":3,"s":"文久の改革では、参勤交代が3年に1度に緩められ、大名の妻子の帰国も認められた。","a":1,"e":"島津久光の要求を受けた1862年の文久の改革で、参勤交代は3年に1度・在府100日に緩和され、妻子の帰国も許された。大名の負担は軽くなったが、幕府の統制力は弱まった。","m":"文久の改革で参勤交代を3年1度に","y":1862},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0340","lv":1,"s":"日米和親条約を結んだときに幕府の政治を主導していた老中首座は、井伊直弼である。","a":0,"e":"誤り：井伊直弼。正しくは老中首座阿部正弘。阿部はペリー来航を朝廷に報告し大名にも意見を求めた。井伊直弼は1858年に大老となり、通商条約に調印した人物である。","m":"和親は阿部正弘、通商は井伊直弼","y":1854},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0341","lv":2,"s":"開港後の金貨流出を防ぐため、幕府は金の含有量を増やした万延小判を発行した。","a":0,"e":"誤り：含有量を増やした。正しくは金の含有量を大幅に減らした。日本の金銀比価が海外と異なり金が流出したため品位を下げたが、貨幣価値が下がって物価高騰に拍車をかけた。","m":"万延小判は金を減らして流出防止","y":1860},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0342","lv":1,"s":"1872年に開通した日本最初の鉄道は、大阪・神戸間を結ぶものであった。","a":0,"e":"誤り：大阪・神戸間。正しくは新橋・横浜間。イギリスの技術と資金の援助を受けて官営で建設された。大阪・神戸間はその後1874年に開通した。","m":"最初の鉄道は新橋・横浜（1872）","y":1872},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0343","lv":3,"s":"1876年の廃刀令は、軍人・警察官を含むすべての者に帯刀を禁じた。","a":0,"e":"誤り：軍人・警察官を含むすべての者。正しくは大礼服着用者と軍人・警察官などを除いて帯刀を禁じた。同年の秩禄処分と合わせて士族の特権を奪い、神風連の乱などの原因となった。","m":"廃刀令は軍人・警官などを除く","y":1876},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0344","lv":1,"s":"板垣退助が郷里の高知で片岡健吉らとつくった政治結社は、愛国社である。","a":0,"e":"誤り：愛国社。正しくは立志社。立志社は1874年に高知で結成され、翌1875年に大阪で全国組織の愛国社がつくられた。地方の結社から全国組織へという流れを押さえる。","m":"高知の立志社→大阪の愛国社","y":1874},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0345","lv":2,"s":"1880年、国会期成同盟の請願運動の高まりに対し、政府は保安条例を定めて政治集会・結社を規制した。","a":0,"e":"誤り：保安条例。正しくは集会条例。集会条例は政治集会の届出制や警察官の解散権を定め、軍人・教員・生徒の参加を禁じた。保安条例は1887年に民権派を東京から追放した法令である。","m":"1880集会条例、1887保安条例","y":1880},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0346","lv":3,"s":"1892年の第2回総選挙で内務大臣品川弥二郎が激しい選挙干渉を行ったのは、第2次伊藤博文内閣のときである。","a":0,"e":"誤り：第2次伊藤博文内閣。正しくは第1次松方正義内閣。民党の進出を抑えようとした干渉で死傷者が出たが、民党の優勢は崩れなかった。品川は責任を問われて辞任した。","m":"選挙干渉は松方内閣の品川弥二郎","y":1892},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0347","lv":1,"s":"日清戦争が始まったときの内閣総理大臣は、山県有朋である。","a":0,"e":"誤り：山県有朋。正しくは伊藤博文（第2次伊藤内閣）で、外相は陸奥宗光。山県は第1軍司令官として出征した。伊藤は講和でも全権となり下関条約に調印した。","m":"日清戦争は第2次伊藤内閣・陸奥外相","y":1894},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0348","lv":2,"s":"青木周蔵外相の条約改正交渉は、ノルマントン号事件によって中断した。","a":0,"e":"誤り：ノルマントン号事件。正しくは1891年の大津事件で、青木は責任をとって外相を辞任した。ノルマントン号事件は1886年に起こり、井上馨の改正交渉期に世論を刺激した事件である。","m":"青木の交渉は大津事件で中断","y":1891},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0349","lv":3,"s":"1899年の改正条約の実施にともない、外国人居留地が廃止され、外国人が国内に住んで営業できる内地雑居が認められた。","a":1,"e":"領事裁判権の撤廃と引き換えに、外国人の居住・旅行・営業を開港場の居留地に限る制限がなくなった。内地雑居については、外国人との競争を心配する反対論もあった。","m":"1899年、居留地廃止・内地雑居","y":1899},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0350","lv":3,"s":"壬午軍乱の後、朝鮮の閔氏政権は日本に接近し、清から距離を置くようになった。","a":0,"e":"誤り：日本に接近した。正しくは乱を鎮圧した清に依存を強めた（事大党）。これに対し日本と結んで近代化を急ぐ金玉均らの独立党が、1884年に甲申事変を起こした。","m":"壬午後、閔氏は清へ傾く","y":1882},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0351","lv":2,"s":"1904年の日韓議定書で、日本は韓国の外交権を奪い統監府を置いた。","a":0,"e":"誤り：外交権を奪い統監府を置いた。正しくは日露開戦直後に結ばれ、日本が軍事上必要な土地を自由に使用できることなどを認めさせた。外交権の剝奪と統監府の設置は1905年の第2次日韓協約である。","m":"日韓議定書は軍事拠点の確保","y":1904},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0352","lv":3,"s":"1910年の韓国併合条約は、第1次西園寺公望内閣のときに結ばれた。","a":0,"e":"誤り：第1次西園寺公望内閣。正しくは第2次桂太郎内閣で、統監寺内正毅が韓国首相李完用と調印した。桂は第1次内閣でも日英同盟・日露戦争を担った。","m":"韓国併合は第2次桂内閣","y":1910},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0353","lv":3,"s":"1907年に解散させられた韓国軍の兵士が加わったことで、反日の義兵運動は急速に衰退した。","a":0,"e":"誤り：急速に衰退した。正しくは元兵士が加わって義兵運動は激化し全国に広がった。日本は軍隊を出して1909年ごろまでに鎮圧し、翌年の併合へ進んだ。","m":"軍隊解散で義兵運動は激化","y":1907},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0354","lv":1,"s":"産業革命期の製糸業や紡績業では、農村出身の若い女性労働者（女工）が多く働いていた。","a":1,"e":"製糸・紡績工場の労働者の大半は、貧しい小作農家などから出稼ぎに来た若い女性だった。賃金は安く、寄宿舎に住みこんで長時間労働や昼夜二交代制で働かされた。","m":"繊維工業を支えたのは若い女工"},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0355","lv":1,"s":"1882年に設立された大阪紡績会社は、手回しのガラ紡を用いた小規模な工場であった。","a":0,"e":"誤り：手回しのガラ紡を用いた小規模工場。正しくはイギリス製の紡績機と蒸気機関を用いた1万錘規模の大工場で、昼夜二交代で操業した。ガラ紡は臥雲辰致が発明した国産の簡単な紡績機である。","m":"大阪紡績は蒸気力の1万錘工場","y":1882},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0356","lv":2,"s":"1880年代後半に鉄道・紡績を中心とする会社設立ブーム（企業勃興）が起こったのは、大隈財政によるインフレの最中であった。","a":0,"e":"誤り：大隈財政によるインフレの最中。正しくは松方財政で紙幣整理が進み、物価が安定して金利が下がった後である。銀本位制の確立も株式会社の設立を促した。","m":"松方財政のあとに企業勃興"},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0357","lv":2,"s":"1903年に農商務省がまとめた工場労働者の調査報告書は、『日本之下層社会』である。","a":0,"e":"誤り：『日本之下層社会』。正しくは『職工事情』。工場法の立案のために農商務省が工場の実態を調べたもの。『日本之下層社会』は1899年に横山源之助が個人で著した報告である。","m":"農商務省は職工事情、横山は下層社会","y":1903},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0358","lv":3,"s":"日本最初の工場ストライキとされる1886年の争議は、大阪の紡績工場の男性労働者が起こした。","a":0,"e":"誤り：大阪の紡績工場の男性労働者。正しくは山梨県甲府の雨宮製糸工場の女工たちで、労働時間の延長と賃下げに反対して仕事を放棄した。製糸女工の過酷な労働条件を示す事件である。","m":"初のストは甲府雨宮製糸の女工","y":1886},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0359","lv":2,"s":"治安警察法は、女性が政治集会に参加したり政治結社に加入したりすることを認めていた。","a":0,"e":"誤り：認めていた。正しくは第5条で女性の政治結社への加入と政治集会への参加を禁じた。1922年、新婦人協会の運動で政治集会への参加だけが認められた。","m":"治安警察法5条は女性の政治活動禁止","y":1900},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0360","lv":1,"s":"日本が第一次世界大戦に参戦したときの首相は、原敬である。","a":0,"e":"誤り：原敬。正しくは大隈重信（第2次大隈内閣）で、外相加藤高明が参戦を主導した。原敬内閣が成立したのは大戦末期の1918年9月である。","m":"参戦は第2次大隈内閣・加藤外相","y":1914},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0361","lv":2,"s":"第一次世界大戦で日本は、ドイツの根拠地であった山東半島の青島を占領した。","a":1,"e":"日本はドイツの租借地膠州湾の中心青島を攻略し、海軍は赤道以北のドイツ領南洋諸島も占領した。翌年、この占領を背景に中国に二十一カ条の要求を突きつけた。","m":"大戦で青島と南洋諸島を占領","y":1914},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0362","lv":3,"s":"シベリア出兵で日本軍は、他の連合国軍とともに1920年までにすべて撤兵した。","a":0,"e":"誤り：他国とともに1920年までに撤兵。正しくは米英などが1920年に撤兵した後も駐留を続け、1922年にようやく撤兵した。多額の戦費と死傷者を出し、内外から批判を受けた。","m":"シベリア撤兵は日本だけ遅れ1922","y":1922},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0363","lv":1,"s":"第2次護憲運動によって倒された内閣は、山本権兵衛内閣である。","a":0,"e":"誤り：山本権兵衛内閣。正しくは清浦奎吾内閣。貴族院中心の特権内閣を政党が批判した。山本内閣が倒れたのは、1914年のシーメンス事件と1923年の虎の門事件のときである。","m":"第1次護憲は桂、第2次護憲は清浦","y":1924},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0364","lv":2,"s":"1927年の金融恐慌は、蔵相井上準之助が議会で銀行の破綻を口にした失言をきっかけに始まった。","a":0,"e":"誤り：井上準之助。正しくは若槻内閣の蔵相片岡直温で、東京渡辺銀行が破綻したと議会で述べたことから取付け騒ぎが起こった。井上準之助は浜口内閣の蔵相として金解禁を行った。","m":"金融恐慌は片岡蔵相の失言から","y":1927},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0365","lv":3,"s":"金融恐慌では、鈴木商店に巨額の融資をしていた日本銀行が経営危機に陥った。","a":0,"e":"誤り：日本銀行。正しくは台湾銀行。大戦後に経営が悪化した総合商社鈴木商店への不良債権を抱えた。日本銀行は、田中内閣のモラトリアムのもとで各銀行に巨額の救済融資を行った側である。","m":"鈴木商店の破綻で台湾銀行が危機","y":1927},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0366","lv":2,"s":"昭和恐慌の時期、アメリカ向けの生糸輸出が急増したため、養蚕農家の収入は大きく増えた。","a":0,"e":"誤り：輸出が急増し収入が増えた。正しくはアメリカの不況で生糸輸出が激減し、繭の価格が暴落した。米価も下がり、翌1931年の東北の大凶作も重なって農村は深刻な農業恐慌に陥った。","m":"昭和恐慌で生糸輸出激減・繭価暴落","y":1930},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0367","lv":2,"s":"満州事変が始まったときの首相は、犬養毅である。","a":0,"e":"誤り：犬養毅。正しくは第2次若槻礼次郎内閣（立憲民政党）。若槻内閣は不拡大方針をとったが関東軍を抑えられず、閣内不一致で1931年12月に総辞職し、政友会の犬養内閣に代わった。","m":"事変勃発は第2次若槻内閣","y":1931},{"f":"近代","t":"満州事変と日中戦争・太平洋戦争","ref":"KD-0368","lv":1,"s":"満州事変を調査するため国際連盟が派遣した調査団の団長は、ハルである。","a":0,"e":"誤り：ハル。正しくはイギリスのリットン。リットン調査団の報告書は、日本の満州での権益には一定の理解を示しつつ、満州国の独立は認めなかった。ハルは1941年に対日要求を示した米国務長官である。","m":"満州事変の調査はリットン調査団","y":1932},{"f":"現代","t":"占領と民主化","ref":"GD-0001","lv":1,"s":"連合国軍最高司令官として占領政策を指揮したのはマッカーサーである。","a":1,"e":"マッカーサーは1945年8月に厚木に到着し、東京に置かれたGHQ（連合国軍最高司令官総司令部）の長として、日本政府に指令・勧告を出す間接統治の方式で占領政策を進めた。","m":"占領のトップはマッカーサー（GHQ）","y":1945},{"f":"現代","t":"占領と民主化","ref":"GD-0002","lv":1,"s":"占領政策の最高決定機関である極東委員会は、東京に置かれた。","a":0,"e":"誤り：東京。正しくはワシントン。極東委員会は連合国11か国で構成されワシントンに置かれ、東京に置かれたのは諮問機関の対日理事会。","m":"極東委員会＝ワシントン","y":1945},{"f":"現代","t":"占領と民主化","ref":"GD-0003","lv":1,"s":"1945年末の選挙法改正により、20歳以上の男女に選挙権が認められた。","a":1,"e":"1945年12月の衆議院議員選挙法改正で、選挙権は満20歳以上の男女に拡大された。翌1946年4月の総選挙では39人の女性議員が誕生した。五大改革指令の婦人参政権にあたる。","m":"45年12月、20歳以上の男女に選挙権","y":1945},{"f":"現代","t":"占領と民主化","ref":"GD-0004","lv":1,"s":"農地改革では、国が地主の小作地を無償で没収し、小作人に分け与えた。","a":0,"e":"誤り：無償で没収。正しくは国が地主から土地を買い上げ、小作人に安く売り渡した。第二次農地改革で不在地主の全小作地などが対象となった。","m":"国が買い上げて小作人へ売渡","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0005","lv":1,"s":"日本国憲法は、1946年11月3日に公布された。","a":1,"e":"日本国憲法は1946年11月3日に公布され、半年後の1947年5月3日に施行された。国民主権・基本的人権の尊重・平和主義が三原則である。","m":"公布11/3・施行5/3","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0006","lv":1,"s":"日本国憲法は、1946年5月3日に施行された。","a":0,"e":"誤り：1946年5月3日。正しくは1947年5月3日。日本国憲法は1946年11月3日に公布され、その半年後に施行された。施行日は現在の憲法記念日、公布日は文化の日である。","m":"公布46年11/3・施行47年5/3","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0007","lv":1,"s":"教育基本法と学校教育法により、六・三・三・四の新学制が定められた。","a":1,"e":"1947年に教育基本法と学校教育法が制定され、小学校6年・中学校3年・高校3年・大学4年の新学制となった。義務教育は小・中の9年に延長され、男女共学も原則となった。","m":"47年の教育二法で六・三・三・四制","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0008","lv":1,"s":"労働者の団結権・団体交渉権・争議権を保障した法律は、労働基準法である。","a":0,"e":"誤り：労働基準法。正しくは労働組合法（1945年）。労働基準法（1947年）は労働時間など労働条件の最低基準を定めた法律で、労働関係調整法（1946年）とあわせて労働三法という。","m":"団結＝組合法、労働条件＝基準法","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0009","lv":1,"s":"財閥解体は、持株会社整理委員会が財閥の株式を譲り受けて売却する形で進められた。","a":1,"e":"1946年に発足した持株会社整理委員会が、三井・三菱などの財閥本社や財閥家族から株式を譲り受けて一般に売り出し、財閥による企業支配を断ち切った。経済民主化の柱の一つである。","m":"株を集めて売る＝持株会社整理委員会","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0010","lv":1,"s":"天皇が自らの神格を否定する、いわゆる人間宣言を出したのは、1948年のことである。","a":0,"e":"誤り：1948年。正しくは1946年1月1日。年頭の詔書で天皇は自らを現御神とする考えを否定した。翌年施行の日本国憲法では、天皇は日本国と国民統合の象徴と位置づけられた。","m":"人間宣言は1946年元日の詔書","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0011","lv":1,"s":"極東国際軍事裁判では、東条英機ら7人に絞首刑が言い渡された。","a":1,"e":"極東国際軍事裁判（東京裁判）は1946年に開廷し、1948年に東条英機・広田弘毅ら7人に絞首刑の判決が下った。広田は唯一の文官出身の死刑者で、他の被告は終身禁錮などとされた。","m":"東京裁判の死刑は東条ら7人","y":1948},{"f":"現代","t":"占領と民主化","ref":"GD-0012","lv":1,"s":"1945年10月、GHQは幣原内閣に対し、天皇制の廃止を含む五大改革指令を口頭で伝えた。","a":0,"e":"誤り：天皇制の廃止。正しくは婦人参政権の付与・労働組合の助長・教育の自由主義化・圧政的諸制度の撤廃・経済の民主化の5項目。","m":"五大改革は天皇廃止を含まず","y":1945},{"f":"現代","t":"占領と民主化","ref":"GD-0013","lv":1,"s":"民法の改正により、戸主権を中心とする家制度が廃止された。","a":1,"e":"1947年の民法改正で、戸主が家族を統率する戸主制度や長男の単独相続（家督相続）が廃止された。婚姻や相続は個人の尊厳と男女の本質的平等にもとづく形に改められた。","m":"民法改正で戸主制・家督相続が消える","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0014","lv":2,"s":"対日理事会は、マッカーサーの諮問機関として東京に設置された。","a":1,"e":"対日理事会はアメリカ・ソ連・中国・英連邦の代表で構成され、東京でGHQの諮問に応じた。占領政策の最高決定機関はワシントンの極東委員会で、両者の所在と性格を区別したい。","m":"諮問＝対日理事会（東京）","y":1945},{"f":"現代","t":"占領と民主化","ref":"GD-0015","lv":2,"s":"占領政策は、沖縄を含む全国で、日本政府を通じた間接統治により行われた。","a":0,"e":"誤り：沖縄を含む全国。正しくは本土は日本政府を通じた間接統治、沖縄・奄美・小笠原などはアメリカ軍による直接の軍政下に置かれた。この違いが講和後の返還問題につながった。","m":"本土は間接統治、沖縄は米軍が直接統治","y":1945},{"f":"現代","t":"占領と民主化","ref":"GD-0016","lv":2,"s":"1946年の第1次農地改革案は不徹底とされ、GHQの勧告を受けて第2次農地改革が行われた。","a":1,"e":"幣原内閣の第1次案（不在地主の全小作地と在村地主の5町歩超）は不十分とされ、対日理事会の勧告で在村地主1町歩までとする第2次案が実施された。","m":"第1次は不徹底→第2次","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0017","lv":2,"s":"第2次農地改革で、在村地主の保有できる小作地は北海道を除き5町歩までとされた。","a":0,"e":"誤り：5町歩。正しくは1町歩（北海道は4町歩）。5町歩は不徹底とされた第1次改革案の基準である。第2次改革では自作農創設特別措置法により国が小作地を強制的に買い上げた。","m":"第1次5町歩→第2次1町歩","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0018","lv":2,"s":"過度経済力集中排除法で指定された企業は325社にのぼったが、実際に分割されたのは11社にとどまった。","a":1,"e":"1947年の過度経済力集中排除法は325社を指定したが、占領政策の転換で緩和され、実際に分割されたのは日本製鉄・三菱重工業など11社である。","m":"325社指定・分割11社","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0019","lv":2,"s":"独占禁止法は、財閥の復活を防ぐ目的で1947年に制定され、カルテルを例外なく認めた。","a":0,"e":"誤り：カルテルを例外なく認めた。正しくはカルテル・トラストなどの不当な取引制限や持株会社を原則禁止した。公正取引委員会が運用する。","m":"独禁法は原則カルテル禁止","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0020","lv":2,"s":"公職追放では、軍国主義者や超国家主義者のほか、政治家・経済界・言論界の指導者も対象となった。","a":1,"e":"1946年の公職追放令で、戦争協力者とみなされた約21万人が公職から退けられた。軍人や国家主義者だけでなく、政治家・財界人・言論人も含まれ、鳩山一郎も対象となった。","m":"公職追放は政治家・財界・言論界まで","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0021","lv":2,"s":"労働組合法が制定されると、労働者の団結が禁じられ、官公庁を中心に組合は解散を命じられた。","a":0,"e":"誤り：団結が禁じられた。正しくは団結権・団体交渉権・争議権が保障され、組合の結成が進んだ。1947年の二・一ストはGHQの命令で中止された。","m":"労働組合法は団結を認めた法律","y":1945},{"f":"現代","t":"占領と民主化","ref":"GD-0022","lv":2,"s":"1947年の二・一ゼネストは、GHQの命令により直前に中止された。","a":1,"e":"官公庁の労働者を中心に1947年2月1日に予定された全国ゼネストは、前日にマッカーサーの命令で中止された。占領軍が労働運動の行き過ぎを抑え始めたことを示す出来事である。","m":"二・一ゼネストはGHQ命令で中止","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0023","lv":2,"s":"日本国憲法の草案作成は、日本政府の憲法問題調査委員会が作成した案がそのまま採用された。","a":0,"e":"誤り：そのまま採用。正しくは松本烝治らの政府案が保守的であったため、GHQが示したマッカーサー草案をもとに政府案がまとめられた。","m":"松本案は却下→GHQ草案","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0024","lv":2,"s":"日本国憲法は、大日本帝国憲法の改正手続に従い、帝国議会の審議を経て成立した。","a":1,"e":"GHQ草案をもとにした政府の改正案は、大日本帝国憲法第73条の改正手続に従い、衆議院・貴族院で修正のうえ可決され、枢密院の審議も経て公布された。新憲法は形式上は帝国憲法の改正である。","m":"形式は帝国憲法の改正手続","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0025","lv":2,"s":"1947年、教育基本法の制定とともに、天皇への忠誠を教育の基本とする教育勅語が改めて重視された。","a":0,"e":"誤り：改めて重視された。正しくは教育基本法が民主主義教育の理念を示し、教育勅語は1948年に衆参両院の決議で排除・失効が確認された。忠君愛国を柱とする教育は否定された。","m":"勅語は48年に国会決議で失効","y":1948},{"f":"現代","t":"占領と民主化","ref":"GD-0026","lv":2,"s":"1947年、地方自治法が制定され、都道府県知事が公選制となった。","a":1,"e":"1947年の地方自治法で、都道府県知事や市町村長は住民の直接選挙で選ばれることになった。地方行政と警察を握っていた内務省は同年末に廃止され、地方分権が進められた。","m":"地方自治法で知事公選・内務省廃止","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0027","lv":3,"s":"1947年4月の総選挙では日本社会党が第一党となり、片山哲が民主党・国民協同党と連立内閣を組織した。","a":1,"e":"日本国憲法施行直前の1947年4月の総選挙で社会党が第一党となり、片山哲が民主党・国民協同党と連立内閣をつくった。社会党首班の内閣は日本で初めてであった。","m":"片山内閣＝社会・民主・国協の連立","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0029","lv":3,"s":"芦田均内閣は、昭和電工事件を契機として1948年に総辞職した。","a":1,"e":"民主党総裁の芦田均が連立内閣を組織したが、復興金融金庫の融資をめぐる昭和電工事件で閣僚らが逮捕され、1948年10月に総辞職した。","m":"芦田内閣は昭電疑獄で倒壊","y":1948},{"f":"現代","t":"占領と民主化","ref":"GD-0030","lv":3,"s":"傾斜生産方式は、繊維・食料品などの軽工業に資源を重点的に配分する政策であった。","a":0,"e":"誤り：軽工業。正しくは石炭・鉄鋼などの基幹産業に資材と資金を集中的に投入した。1946年末に第1次吉田内閣が決定し、復興金融金庫の融資が支えたが、インフレを悪化させた。","m":"傾斜生産＝石炭・鉄鋼に集中投入","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0031","lv":3,"s":"1947年の刑法改正により、不敬罪や姦通罪が廃止された。","a":1,"e":"1947年の刑法改正で天皇や皇室に対する不敬罪、また姦通罪が廃止された。民法改正と合わせ、新憲法の理念に沿う法整備が進んだ。","m":"刑法改正で不敬罪・姦通罪を廃止","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0032","lv":3,"s":"警察制度の民主化により、1947年の警察法で全国の警察は国家警察に一本化された。","a":0,"e":"誤り：国家警察に一本化。正しくは国家地方警察と市町村の自治体警察に分けて分権化した。1954年の新警察法で都道府県警察に再編された。","m":"47年警察法は国家地方警察と自治体警察","y":1947},{"f":"現代","t":"占領と民主化","ref":"GD-0033","lv":3,"s":"1948年、極東国際軍事裁判では、被告のうち松岡洋右・永野修身が公判中に病死した。","a":1,"e":"東京裁判の被告28人のうち、松岡洋右と永野修身は公判中に病死し、大川周明は精神障害を理由に免訴となった。判決を受けた25人全員が有罪とされた。","m":"松岡・永野は判決前に病死","y":1948},{"f":"現代","t":"占領と民主化","ref":"GD-0034","lv":3,"s":"労働関係調整法は、労働者の最低賃金を保障する目的で、1946年に制定された。","a":0,"e":"誤り：最低賃金の保障。正しくは労働争議の予防・解決のため、労働委員会による斡旋・調停・仲裁を定めた法律である（1946年）。","m":"調整法＝争議の斡旋・調停","y":1946},{"f":"現代","t":"占領と民主化","ref":"GD-0035","lv":3,"s":"公務員の争議行為を禁じる政令201号は、芦田内閣のときに出された。","a":1,"e":"1948年、GHQの指示により政令201号が公布され、公務員の争議権が否定された。国家公務員法の改正でも同趣旨が定められた。","m":"政令201号は芦田内閣（1948年）","y":1948},{"f":"現代","t":"占領と民主化","ref":"GD-0036","lv":3,"s":"1946年の戦後初の総選挙で、日本進歩党が第一党となり、吉田茂が組閣した。","a":0,"e":"誤り：日本進歩党。正しくは日本自由党が第一党となった。総裁の鳩山一郎が公職追放されたため、吉田茂が後継総裁となり、自由党と進歩党の連立で第1次吉田内閣を組織した。","m":"46年選挙の第一党は日本自由党","y":1946},{"f":"現代","t":"講和と55年体制","ref":"GD-0037","lv":1,"s":"サンフランシスコ平和条約が調印されたときの日本の首席全権は吉田茂であった。","a":1,"e":"1951年9月、サンフランシスコ講和会議で吉田茂首相が首席全権として平和条約に調印した。同じ日に日米安全保障条約にも調印し、日本は西側陣営の一員として独立する道を選んだ。","m":"講和の首席全権は吉田茂首相","y":1951},{"f":"現代","t":"講和と55年体制","ref":"GD-0038","lv":1,"s":"サンフランシスコ平和条約には、ソ連を含む全交戦国が署名した。","a":0,"e":"誤り：全交戦国が署名。正しくはソ連・ポーランド・チェコスロヴァキアは調印せず、インド・ビルマ・中国は会議に招かれなかった。単独講和に近い形となった。","m":"講和会議に出たソ連は調印せず","y":1951},{"f":"現代","t":"講和と55年体制","ref":"GD-0039","lv":1,"s":"朝鮮戦争の勃発を受けて、1950年に警察予備隊が創設された。","a":1,"e":"1950年6月に朝鮮戦争が始まると、在日米軍が朝鮮半島へ出動した穴を埋めるため、GHQの指令で警察予備隊が置かれた。のち保安隊を経て自衛隊となる再軍備の出発点である。","m":"朝鮮戦争の年に警察予備隊","y":1950},{"f":"現代","t":"講和と55年体制","ref":"GD-0040","lv":1,"s":"自衛隊は、1950年に警察予備隊から改組されて発足した。","a":0,"e":"誤り：1950年。正しくは1954年。警察予備隊（1950年）→保安隊（1952年）→自衛隊（1954年）の順に改編された。","m":"予備隊50→保安隊52→自衛隊54","y":1954},{"f":"現代","t":"講和と55年体制","ref":"GD-0041","lv":1,"s":"1955年、日本民主党と自由党が合同して自由民主党が結成された。","a":1,"e":"1955年11月、日本民主党と自由党が合同して自由民主党が結成された（保守合同）。同年10月の左右社会党の統一に対抗する動きで、以後の自民・社会二大政党の構図が生まれた。","m":"民主党＋自由党＝自民党（1955）","y":1955},{"f":"現代","t":"講和と55年体制","ref":"GD-0042","lv":1,"s":"日ソ共同宣言により、日本とソ連は国交を回復し、日本は平和条約も結んだ。","a":0,"e":"誤り：平和条約も結んだ。正しくは国交回復のみで、領土問題が解決せず平和条約は未締結である。日本の国連加盟が実現するきっかけとなった。","m":"日ソは国交のみ・平和条約なし","y":1956},{"f":"現代","t":"講和と55年体制","ref":"GD-0043","lv":1,"s":"日本が国際連合に加盟したのは、日ソ共同宣言の調印後の1956年である。","a":1,"e":"国連加盟はソ連の拒否権に阻まれていたが、1956年10月の日ソ共同宣言で国交が回復したことでソ連の支持が得られ、同年12月に日本の加盟が承認された。","m":"日ソ国交回復→同年12月に国連加盟","y":1956},{"f":"現代","t":"講和と55年体制","ref":"GD-0044","lv":1,"s":"日米安全保障条約の改定で、新条約を調印したのは池田勇人内閣であった。","a":0,"e":"誤り：池田勇人。正しくは岸信介内閣。1960年1月に新安保条約に調印し、批准をめぐる安保闘争の混乱の責任をとって、条約の自然成立後に総辞職した。池田内閣はその後継である。","m":"新安保の調印は岸信介内閣","y":1960},{"f":"現代","t":"講和と55年体制","ref":"GD-0045","lv":1,"s":"1954年、アメリカの水爆実験により第五福竜丸が被災し、原水爆禁止運動が高まった。","a":1,"e":"ビキニ環礁での水爆実験で漁船第五福竜丸が被曝し、これをきっかけに原水爆禁止署名運動が広がった。翌年第1回原水爆禁止世界大会が開かれた。","m":"ビキニ事件→原水禁運動","y":1954},{"f":"現代","t":"講和と55年体制","ref":"GD-0046","lv":1,"s":"日米相互防衛援助協定（MSA協定）の締結後、保安隊が設けられた。","a":0,"e":"誤り：締結後に保安隊。正しくはMSA協定（1954年）を受けて自衛隊が発足し、防衛庁が設置された。保安隊は1952年に警察予備隊から改組された。","m":"MSA協定（54年）→自衛隊・防衛庁","y":1954},{"f":"現代","t":"講和と55年体制","ref":"GD-0047","lv":1,"s":"1950年代半ば、自由民主党が与党、日本社会党が最大野党という政治構造が成立した。","a":1,"e":"1955年の左右社会党の統一と保守合同により、自民党が政権を握り、社会党が議席の約3分の1を占めて改憲を阻む構図ができた。これを55年体制とよび、1993年まで続いた。","m":"自民与党・社会野党＝55年体制","y":1955},{"f":"現代","t":"講和と55年体制","ref":"GD-0048","lv":1,"s":"1960年の新安保条約では、アメリカ軍の日本防衛義務が明記されなかった。","a":0,"e":"誤り：明記されなかった。正しくは新安保条約でアメリカの日本防衛義務が明記された。防衛義務がなかったのは旧安保条約である。","m":"防衛義務は新安保で明記","y":1960},{"f":"現代","t":"講和と55年体制","ref":"GD-0050","lv":2,"s":"サンフランシスコ平和条約で、日本は朝鮮の独立を承認し、台湾・千島列島・南樺太を放棄した。","a":1,"e":"条約で日本は朝鮮の独立承認、台湾・澎湖諸島、千島列島、南樺太などの放棄を認めた。沖縄・小笠原は米国の施政権下に置かれた。","m":"台湾・千島・南樺太を放棄","y":1951},{"f":"現代","t":"講和と55年体制","ref":"GD-0051","lv":2,"s":"サンフランシスコ平和条約により、沖縄と小笠原諸島は日本に返還された。","a":0,"e":"誤り：返還された。正しくは沖縄・小笠原はアメリカの施政権下に置かれた。小笠原は1968年、沖縄は1972年に返還された。","m":"返還は小笠原68・沖縄72","y":1951},{"f":"現代","t":"講和と55年体制","ref":"GD-0052","lv":2,"s":"平和条約の発効により、日本は1952年に独立を回復し、GHQは廃止された。","a":1,"e":"サンフランシスコ平和条約は1952年4月28日に発効し、日本は主権を回復した。これにより連合国の占領は終わり、GHQも廃止された。ただし沖縄などはアメリカの施政権下に残った。","m":"52年4月28日、条約発効で独立","y":1952},{"f":"現代","t":"講和と55年体制","ref":"GD-0053","lv":2,"s":"ドッジ・ラインで設定された単一為替レートは、1ドル＝308円であった。","a":0,"e":"誤り：308円。正しくは360円。1949年のドッジ・ラインで均衡予算とともに1ドル＝360円の単一為替レートが設定された。","m":"単一為替レートは360円","y":1949},{"f":"現代","t":"講和と55年体制","ref":"GD-0054","lv":2,"s":"1952年のメーデー事件を契機に、破壊活動防止法が制定された。","a":1,"e":"1952年5月1日、皇居前広場でデモ隊と警官隊が衝突した血のメーデー事件が起こった。これを受けて同年、暴力的な破壊活動を行う団体を規制する破壊活動防止法が成立した。","m":"血のメーデー（52年）→破防法","y":1952},{"f":"現代","t":"講和と55年体制","ref":"GD-0055","lv":2,"s":"1954年の新警察法で、警察は市町村単位の自治体警察に再編された。","a":0,"e":"誤り：自治体警察に再編。正しくは自治体警察を廃止して都道府県警察に一本化し、警察庁が全体を統轄する中央集権的なしくみに改めた。占領期の分権的な警察制度からの転換である。","m":"54年新警察法で都道府県警察へ","y":1954},{"f":"現代","t":"講和と55年体制","ref":"GD-0056","lv":2,"s":"鳩山一郎内閣は、日ソ国交回復を実現した一方で、憲法改正を目指した。","a":1,"e":"鳩山内閣は1956年に日ソ共同宣言を結んだ。また自主憲法の制定を掲げたが、衆議院で改憲発議に必要な3分の2に届かなかった。","m":"鳩山＝日ソ回復・改憲志向","y":1956},{"f":"現代","t":"講和と55年体制","ref":"GD-0058","lv":2,"s":"1956年、公選制だった教育委員を任命制に改める新教育委員会法が制定された。","a":1,"e":"1956年、鳩山一郎内閣は教育委員を住民の選挙で選ぶ公選制を廃止し、地方公共団体の長が議会の同意を得て任命する制度に改めた。占領期の改革を見直す動きの一つである。","m":"56年、教育委員は公選から任命へ","y":1956},{"f":"現代","t":"講和と55年体制","ref":"GD-0059","lv":2,"s":"新安保条約は、衆議院で強行採決されたのち、参議院の議決を経て成立した。","a":0,"e":"誤り：参議院の議決を経て。正しくは参議院の議決がないまま、衆議院の可決から30日後に自然成立した。強行採決に反発する安保闘争が広がり、岸内閣は成立後に総辞職した。","m":"新安保は参院の議決なく自然成立","y":1960},{"f":"現代","t":"講和と55年体制","ref":"GD-0060","lv":2,"s":"1960年の安保闘争では、国会を取り巻く大規模なデモが連日行われた。","a":1,"e":"1960年、新安保条約の強行採決に反対して、社会党・総評・全学連や一般市民が国会を連日取り囲んだ。デモ隊の東大生が死亡し、アイゼンハワー大統領の来日も中止された。","m":"安保闘争＝国会を囲む大規模デモ","y":1960},{"f":"現代","t":"講和と55年体制","ref":"GD-0061","lv":2,"s":"1950年のレッド・パージでは、占領軍の指示を受け、公務員のみが解雇された。","a":0,"e":"誤り：公務員のみ。正しくは官公庁に加え、新聞・放送などの報道機関や民間企業でも共産党員とその同調者が職場を追われた。朝鮮戦争前後の占領政策の転換（逆コース）の一例である。","m":"レッドパージは民間企業も対象","y":1950},{"f":"現代","t":"講和と55年体制","ref":"GD-0062","lv":2,"s":"1952年、吉田茂内閣は日米行政協定を結び、駐留米軍の基地使用や費用分担を定めた。","a":1,"e":"安保条約にもとづく日米行政協定（1952年）で、日本は駐留米軍に基地を提供し、その費用を分担することになった。1960年の新安保条約にあわせて日米地位協定に改められた。","m":"行政協定（52）→地位協定（60）","y":1952},{"f":"現代","t":"講和と55年体制","ref":"GD-0063","lv":3,"s":"1951年の平和条約調印の際、日米安全保障条約は、日本側全権で吉田茂のみが署名した。","a":1,"e":"平和条約調印と同じ日、場所を米軍施設に移して日米安全保障条約が署名された。日本側の全権は吉田茂だけが署名し、他の全権は署名しなかった。","m":"安保条約に署名したのは吉田ただ一人","y":1951},{"f":"現代","t":"講和と55年体制","ref":"GD-0064","lv":3,"s":"サンフランシスコ平和条約の日本全権団には、日本社会党の代表も加わっていた。","a":0,"e":"誤り：加わっていた。正しくは社会党は講和のあり方をめぐり全権団への参加を拒否した。全権団は与党と一部の中道勢力などで構成された。","m":"社会党は全権団に不参加","y":1951},{"f":"現代","t":"講和と55年体制","ref":"GD-0065","lv":3,"s":"1951年、日本社会党は、平和条約には賛成し安保条約には反対する右派と、両条約に反対する左派に分裂した。","a":1,"e":"講和は全交戦国との全面講和か西側との単独講和かが争点となった。社会党は両条約に反対する左派と、平和条約のみ賛成の右派に分かれて分裂し、1955年に再統一した。","m":"右派は平和条約のみ賛成、左派は両方反対","y":1951},{"f":"現代","t":"講和と55年体制","ref":"GD-0066","lv":3,"s":"1953年に日本へ返還されたのは、小笠原諸島である。","a":0,"e":"誤り：小笠原諸島。正しくは奄美群島。平和条約後、アメリカの施政下にあった島々のうち、奄美は1953年、小笠原は1968年、沖縄は1972年の順に日本に返還された。","m":"返還順は奄美53→小笠原68→沖縄72","y":1953},{"f":"現代","t":"講和と55年体制","ref":"GD-0067","lv":3,"s":"日ソ共同宣言では、ソ連が歯舞群島・色丹島の引き渡しに同意する旨が記されたが、平和条約締結後とされた。","a":1,"e":"共同宣言で、平和条約の締結後に歯舞・色丹を日本に引き渡すと明記されたが、国後・択捉をめぐる対立のため平和条約は未締結である。","m":"歯舞・色丹は条約締結後","y":1956},{"f":"現代","t":"講和と55年体制","ref":"GD-0068","lv":3,"s":"自衛隊の発足と同時に、文民統制のため防衛省が設置された。","a":0,"e":"誤り：防衛省。正しくは防衛庁。1954年に自衛隊の発足とともに総理府の外局として防衛庁が置かれた。防衛庁が防衛省に昇格したのは2007年である。","m":"防衛庁54年→防衛省2007年","y":1954},{"f":"現代","t":"講和と55年体制","ref":"GD-0069","lv":3,"s":"1952年の日華平和条約は、日本が台湾の中華民国政府と結んだ平和条約である。","a":1,"e":"サンフランシスコ平和条約と同年に日本は台湾の中華民国政府と日華平和条約を結んだ。1972年の日中共同声明で効力を失った。","m":"日華平和条約1952","y":1952},{"f":"現代","t":"講和と55年体制","ref":"GD-0070","lv":3,"s":"造船疑獄で批判を受けた鳩山一郎内閣は、1954年に総辞職した。","a":0,"e":"誤り：鳩山一郎内閣。正しくは吉田茂内閣。1954年の造船疑獄で指揮権発動が批判され、長期政権に対する不満も高まって吉田内閣は総辞職し、日本民主党の鳩山一郎内閣が成立した。","m":"造船疑獄で吉田内閣が退陣","y":1954},{"f":"現代","t":"講和と55年体制","ref":"GD-0071","lv":3,"s":"1960年の新安保条約には、在日米軍の装備や配置の重要な変更に関する事前協議制が盛り込まれた。","a":1,"e":"新安保条約にともなう交換公文で、在日米軍の配置や装備の重要な変更、日本からの戦闘作戦行動には事前協議を行うことが定められた。旧安保条約にはなかったしくみである。","m":"新安保で事前協議制を導入","y":1960},{"f":"現代","t":"講和と55年体制","ref":"GD-0072","lv":3,"s":"日米安全保障条約は、1960年に調印されたのが最初であり、改定は行われていない。","a":0,"e":"誤り：最初であり改定なし。正しくは旧安保条約（1951年）が1960年に全面改定された。有効期間10年の後は自動延長となった。","m":"旧安保1951→全面改定で新安保1960","y":1960},{"f":"現代","t":"高度経済成長","ref":"GD-0073","lv":1,"s":"1960年に池田勇人内閣が決定した国民所得倍増計画は、10年間で国民所得を2倍にすることを目標とした。","a":1,"e":"安保闘争後に成立した池田内閣は、政治から経済へと国民の関心を移し、10年で所得を倍にする計画を掲げた。実際は計画より早く達成された。","m":"所得倍増は10年で2倍","y":1960},{"f":"現代","t":"高度経済成長","ref":"GD-0075","lv":1,"s":"1964年に東海道新幹線が開通し、東京と大阪の間が約4時間で結ばれた。","a":1,"e":"東京オリンピック開幕直前の1964年10月、東京と新大阪を結ぶ東海道新幹線が開業し、所要時間は当初約4時間であった。高度成長期の交通網整備を象徴する出来事である。","m":"新幹線は東京五輪の直前（64年10月）","y":1964},{"f":"現代","t":"高度経済成長","ref":"GD-0076","lv":1,"s":"高度経済成長期にはエネルギー源が石油から石炭へと転換した。","a":0,"e":"誤り：石油から石炭へ。正しくは石炭から石油へ転換した（エネルギー革命）。三井三池炭鉱の争議（1959〜60年）が象徴的である。","m":"エネルギー革命は石炭→石油","y":1960},{"f":"現代","t":"高度経済成長","ref":"GD-0077","lv":1,"s":"四大公害病の一つであるイタイイタイ病は、富山県の神通川流域で発生した。","a":1,"e":"イタイイタイ病は、岐阜県の三井金属鉱業神岡鉱山から流れ出たカドミウムが原因で、下流の富山県神通川流域で発生した。1971年の判決で原告が勝訴した。","m":"イタイイタイ病＝富山・カドミウム","y":1968},{"f":"現代","t":"高度経済成長","ref":"GD-0078","lv":1,"s":"四日市ぜんそくは、熊本県の八代海沿岸で、化学工場の廃水が原因で起きた。","a":0,"e":"誤り：熊本県・廃水。正しくは三重県四日市の石油コンビナートによる大気汚染が原因。熊本県の水俣病が有機水銀の廃水による公害である。","m":"四日市＝三重・大気汚染","y":1960},{"f":"現代","t":"高度経済成長","ref":"GD-0079","lv":1,"s":"1967年に公害対策基本法が制定され、1971年には環境庁が発足した。","a":1,"e":"公害の深刻化を受けて、1967年に公害対策基本法が制定され、1971年には佐藤栄作内閣のもとで公害行政を一元化する環境庁が発足した。順序は基本法が先である。","m":"公害対策基本法67→環境庁71","y":1971},{"f":"現代","t":"高度経済成長","ref":"GD-0080","lv":1,"s":"高度成長期に、人口の都市への集中が進んだ結果、農村では過密が、都市では過疎が問題となった。","a":0,"e":"誤り：農村で過密、都市で過疎。正しくは農村で過疎、都市で過密が問題となった。若年層が都市へ流出し、農家は兼業化が進んだ。","m":"農村＝過疎、都市＝過密","y":1960},{"f":"現代","t":"高度経済成長","ref":"GD-0081","lv":1,"s":"1968年、日本の国民総生産（GNP）は、資本主義国のなかでアメリカに次ぐ第2位となった。","a":1,"e":"高度経済成長の結果、日本の国民総生産（GNP）は1968年に西ドイツを抜き、資本主義国のなかでアメリカに次ぐ第2位となった。いざなぎ景気のさなかの出来事である。","m":"68年、GNPが西独を抜き資本主義国2位","y":1968},{"f":"現代","t":"高度経済成長","ref":"GD-0082","lv":1,"s":"「もはや戦後ではない」と記した『経済白書』が出されたのは、1960年のことである。","a":0,"e":"誤り：1960年。正しくは1956年。神武景気（1955〜57年）の好況のなかで経済白書が述べた言葉である。1960年は所得倍増計画の発表年。","m":"もはや戦後ではない＝1956","y":1956},{"f":"現代","t":"高度経済成長","ref":"GD-0083","lv":1,"s":"電気洗濯機・電気冷蔵庫・白黒テレビは、三種の神器と呼ばれて普及した。","a":1,"e":"1950年代後半から家庭電化が進み、三種の神器が普及した。1960年代後半には自動車・クーラー・カラーテレビの3Cが続いた。","m":"三種の神器＝洗・冷・テレビ","y":1958},{"f":"現代","t":"高度経済成長","ref":"GD-0084","lv":1,"s":"日本万国博覧会は、1964年に東京で開催された。","a":0,"e":"誤り：1964年・東京。正しくは1970年・大阪（千里丘陵）。日本万国博覧会は「人類の進歩と調和」をテーマに開かれた。1964年に東京で開かれたのはオリンピックである。","m":"五輪は64年東京、万博は70年大阪","y":1970},{"f":"現代","t":"高度経済成長","ref":"GD-0085","lv":1,"s":"1961年に国民皆保険・皆年金の体制が整い、社会保障制度が拡充した。","a":1,"e":"1958年の国民健康保険法改正と1959年の国民年金法により、1961年にすべての国民が医療保険と年金に加入する国民皆保険・皆年金が実現した。高度成長期の社会保障の拡充である。","m":"1961年、国民皆保険・皆年金","y":1961},{"f":"現代","t":"高度経済成長","ref":"GD-0086","lv":2,"s":"農業基本法は、農業と他産業との所得格差を縮めることを目的として、1961年に制定された。","a":1,"e":"農業基本法（1961年）は選択的拡大と農業構造の改善を掲げたが、兼業化が進んで農業の担い手は減り、農家の後継者不足が深刻化した。","m":"農業基本法（1961）＝所得格差の是正","y":1961},{"f":"現代","t":"高度経済成長","ref":"GD-0087","lv":2,"s":"1959〜60年の三井三池炭鉱争議は、人員整理に反対する労働者側の全面的な勝利で終結した。","a":0,"e":"誤り：労働者側の全面的な勝利。正しくは労働者側の敗北に終わった。石炭から石油へのエネルギー革命が進むなか、炭鉱の閉山や人員整理が相次ぎ、石炭産業は衰えた。","m":"三池争議は労働者側の敗北","y":1960},{"f":"現代","t":"高度経済成長","ref":"GD-0088","lv":2,"s":"1964年、日本はIMF8条国へ移行し、OECDにも加盟した。","a":1,"e":"1964年、日本は国際収支を理由に為替制限ができないIMF8条国に移行し、同年に経済協力開発機構（OECD）にも加盟して、資本の自由化を進める先進国の一員となった。","m":"64年、IMF8条国移行とOECD加盟","y":1964},{"f":"現代","t":"高度経済成長","ref":"GD-0089","lv":2,"s":"日本のGATT加盟は、1964年の東京オリンピックの後であった。","a":0,"e":"誤り：1964年の後。正しくは1955年。GATT加盟は神武景気の始まりと同じ頃で、1964年はIMF8条国移行・OECD加盟の年である。","m":"GATT加盟は1955年","y":1955},{"f":"現代","t":"高度経済成長","ref":"GD-0090","lv":2,"s":"新潟水俣病は、阿賀野川流域で、昭和電工の工場廃水が原因で発生した。","a":1,"e":"新潟水俣病は、昭和電工鹿瀬工場の廃水に含まれる有機水銀が原因で、新潟県の阿賀野川流域で発生した。第二水俣病ともよばれ、1971年の判決で原告が勝訴した。","m":"新潟水俣病＝阿賀野川・昭和電工","y":1965},{"f":"現代","t":"高度経済成長","ref":"GD-0091","lv":2,"s":"四大公害訴訟は、1960年代前半に原告の勝訴が相次いで確定した。","a":0,"e":"誤り：1960年代前半。正しくは1971〜73年に四大公害訴訟の判決が出され、いずれも被害者側が勝訴した。公害を生んだ企業の責任が明確にされ、環境行政の転機となった。","m":"四大公害訴訟の判決は1971〜73年","y":1971},{"f":"現代","t":"高度経済成長","ref":"GD-0092","lv":2,"s":"1960年代、東京都などで革新系首長が当選し、革新自治体が各地に広がった。","a":1,"e":"公害や福祉への関心の高まりを背景に、社会党・共産党などが支持する首長が各地で当選した。1967年に美濃部亮吉が東京都知事となり、革新自治体が広がった。","m":"美濃部都政（67年）＝革新自治体","y":1967},{"f":"現代","t":"高度経済成長","ref":"GD-0093","lv":2,"s":"高度経済成長を牽引したのは、繊維などの軽工業であった。","a":0,"e":"誤り：繊維などの軽工業。正しくは鉄鋼・造船・石油化学などの重化学工業が成長を牽引した。臨海部に石油化学コンビナートが建設され、のちに自動車や家電も成長した。","m":"成長の主役は重化学工業","y":1965},{"f":"現代","t":"高度経済成長","ref":"GD-0094","lv":2,"s":"米の生産過剰を背景に、1970年から米の生産調整（減反政策）が本格的に始まった。","a":1,"e":"食生活の変化で米の消費が減る一方、食糧管理制度のもとで政府が米を買い入れたため米が余った。そこで1970年から作付けを減らす生産調整（減反政策）が本格化した。","m":"米あまりで1970年から減反","y":1970},{"f":"現代","t":"高度経済成長","ref":"GD-0095","lv":2,"s":"いざなぎ景気は、岩戸景気よりも前の好景気であった。","a":0,"e":"誤り：前。正しくは後。神武景気（1955〜57）→岩戸景気（1958〜61）→オリンピック景気（1962〜64）→いざなぎ景気（1965〜70）の順。","m":"神武→岩戸→五輪→いざなぎ","y":1965},{"f":"現代","t":"高度経済成長","ref":"GD-0096","lv":2,"s":"1962年に策定された全国総合開発計画は、地域間の格差是正を目標に掲げた。","a":1,"e":"1962年の全国総合開発計画は、地域間の均衡ある発展を目標に、拠点開発方式を採用した。新産業都市などを指定して地方の工業化をはかったが、太平洋ベルト地帯への集中は続いた。","m":"全総（62年）は拠点開発で格差是正","y":1962},{"f":"現代","t":"高度経済成長","ref":"GD-0097","lv":2,"s":"日本の大学で学生運動が激化した1968〜69年には、東京大学の入試が中止されなかった。","a":0,"e":"誤り：中止されなかった。正しくは東大紛争の影響で1969年度の東京大学の入試は中止された。1960年代末の大学紛争は、大学運営への不満やベトナム反戦の気運を背景に全国へ広がった。","m":"東大入試中止は1969年度","y":1969},{"f":"現代","t":"高度経済成長","ref":"GD-0098","lv":3,"s":"1968年の小笠原諸島の返還は、佐藤栄作内閣のもとで実現した。","a":1,"e":"佐藤栄作内閣は「沖縄の祖国復帰なくして戦後は終わらない」と述べて返還交渉を進め、1968年に小笠原諸島、1972年に沖縄の返還を実現した。","m":"小笠原（68）・沖縄（72）は佐藤内閣","y":1968},{"f":"現代","t":"高度経済成長","ref":"GD-0099","lv":3,"s":"水俣病の原因となった物質は、カドミウムである。","a":0,"e":"誤り：カドミウム。正しくは有機水銀（メチル水銀）。水俣病はチッソ水俣工場の廃水が原因である。カドミウムによる公害は、富山県神通川流域のイタイイタイ病である。","m":"水俣＝有機水銀、イタイ＝カドミウム","y":1956},{"f":"現代","t":"高度経済成長","ref":"GD-0100","lv":3,"s":"1969年には、東名高速道路が全線開通した。","a":1,"e":"東名高速道路は1969年に全線開通し、先に全通していた名神高速道路（1965年）とつながって東京から大阪・神戸までが高速道路で結ばれた。自動車輸送の時代を象徴する。","m":"名神65→東名69で東京〜大阪","y":1969},{"f":"現代","t":"高度経済成長","ref":"GD-0101","lv":3,"s":"高度経済成長期に、家計では「3C」と呼ばれるカラーテレビ・クーラー・電気冷蔵庫が普及した。","a":0,"e":"誤り：電気冷蔵庫。正しくは3Cは自動車（カー）・クーラー・カラーテレビで、1960年代後半から普及した。電気冷蔵庫は電気洗濯機・白黒テレビとともに1950年代後半の三種の神器である。","m":"3C＝カー・クーラー・カラーテレビ","y":1966},{"f":"現代","t":"高度経済成長","ref":"GD-0102","lv":3,"s":"水俣病の患者が公式に確認されたのは1956年である。","a":1,"e":"水俣病は1956年に熊本県水俣市で公式に確認された。原因はチッソ水俣工場の廃水中の有機水銀であったが、政府が公害と認めたのは1968年で、対応の遅れが被害を広げた。","m":"水俣病の公式確認は1956年","y":1956},{"f":"現代","t":"高度経済成長","ref":"GD-0103","lv":3,"s":"高度成長期の産業構造では、第一次産業の就業人口が増加し、第二次産業が減少した。","a":0,"e":"誤り：第一次増加・第二次減少。正しくは第一次産業の就業者が大きく減り、第二次・第三次産業が増加した。農村から都市への人口移動が背景にある。","m":"農業など一次産業の就業者は減少","y":1960},{"f":"現代","t":"高度経済成長","ref":"GD-0105","lv":3,"s":"1960年代には、団地・ニュータウンが各地に建設され、家族は大家族化が進んだ。","a":0,"e":"誤り：大家族化。正しくは核家族化が進んだ。都市に移った若い世代が団地などに住み、夫婦と未婚の子どもからなる世帯が増えた。農村では人口流出による過疎が問題になった。","m":"団地の暮らし＝核家族化","y":1960},{"f":"現代","t":"高度経済成長","ref":"GD-0106","lv":3,"s":"1960年の貿易自由化計画大綱を受けて、日本は段階的に輸入の自由化を進めた。","a":1,"e":"1960年、政府は貿易・為替自由化計画大綱を決定し、輸入品目の自由化率を段階的に引き上げた。GATTやIMFの求めに応じた開放経済体制への移行であり、1964年のIMF8条国移行へつながる。","m":"60年の大綱から貿易自由化","y":1960},{"f":"現代","t":"高度経済成長","ref":"GD-0108","lv":2,"s":"高度経済成長を主導したのは政府の財政支出であり、民間の設備投資は低調であった。","a":0,"e":"誤り：財政支出・低調。正しくは旺盛な民間設備投資と技術革新が成長を主導した。高い貯蓄率や安価な石油、豊富な労働力も背景にある。","m":"成長の主役は民間設備投資","y":1960},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0109","lv":1,"s":"日韓基本条約は、1965年に佐藤栄作内閣のもとで調印された。","a":1,"e":"1965年、佐藤栄作内閣は日韓基本条約を結び、韓国との国交を正常化した。韓国政府を朝鮮にある唯一の合法的な政府と確認し、あわせて請求権・経済協力協定なども結ばれた。","m":"日韓基本条約は1965年・佐藤内閣","y":1965},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0110","lv":1,"s":"日中共同声明は、1972年に福田赳夫首相と周恩来首相が調印した。","a":0,"e":"誤り：福田赳夫。正しくは田中角栄。1972年9月に訪中した田中首相が周恩来首相と日中共同声明に調印し、国交を正常化した。福田赳夫内閣は1978年に日中平和友好条約を結んだ。","m":"72年の共同声明は田中角栄","y":1972},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0111","lv":1,"s":"沖縄の施政権は、1972年に日本へ返還された。","a":1,"e":"1969年の佐藤・ニクソン会談で返還が合意され、1971年の沖縄返還協定にもとづいて、1972年5月15日に沖縄の施政権が日本に返還された。ただし広大な米軍基地は残された。","m":"沖縄の本土復帰は1972年5月","y":1972},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0112","lv":1,"s":"日中平和友好条約は、田中角栄内閣のもとで1972年に結ばれた。","a":0,"e":"誤り：田中角栄内閣・1972年。正しくは福田赳夫内閣・1978年。1972年は田中内閣が日中共同声明で国交を正常化した年で、平和友好条約はその6年後に結ばれた。","m":"72共同声明（田中）→78条約（福田）","y":1978},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0113","lv":1,"s":"佐藤栄作首相は、非核三原則の提唱などが評価され、ノーベル平和賞を受賞した。","a":1,"e":"佐藤栄作首相は「持たず、作らず、持ち込ませず」の非核三原則を表明し、沖縄返還も実現した。退任後の1974年にノーベル平和賞を受賞した。","m":"非核三原則の佐藤栄作が平和賞","y":1974},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0114","lv":1,"s":"日本は、湾岸戦争の際に、自衛隊を戦闘部隊として多国籍軍に派遣した。","a":0,"e":"誤り：戦闘部隊として派遣。正しくは多国籍軍に総額130億ドルの資金を提供し、停戦後に海上自衛隊の掃海艇をペルシア湾に派遣した。この経験が翌年のPKO協力法の制定につながった。","m":"湾岸戦争は資金提供と戦後の掃海","y":1991},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0115","lv":1,"s":"宮沢喜一内閣のもとで、国連平和維持活動（PKO）協力法が成立した。","a":1,"e":"1992年、宮沢喜一内閣のもとでPKO協力法が成立し、自衛隊が国連カンボジア暫定統治機構に派遣された。自衛隊の部隊が国連の平和維持活動に参加する初めての例となった。","m":"PKO協力法は1992年・宮沢内閣","y":1992},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0116","lv":1,"s":"日中共同声明で、日本は台湾の中華民国政府を中国の正統政府と承認した。","a":0,"e":"誤り：中華民国政府を承認。正しくは中華人民共和国政府を中国の唯一の合法政府と承認した。これにともない日本は台湾の中華民国と断交し、日華平和条約は終了したものとされた。","m":"共同声明で認めたのは中華人民共和国","y":1972},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0117","lv":1,"s":"2002年、小泉純一郎首相が北朝鮮を訪問して金正日総書記と会談し、平壌宣言に署名した。","a":1,"e":"2002年、小泉純一郎首相が平壌を訪れ、金正日総書記と初の日朝首脳会談を行って日朝平壌宣言に署名した。北朝鮮は日本人拉致を認め、被害者5人が帰国した。","m":"02年小泉訪朝＝日朝平壌宣言","y":2002},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0118","lv":1,"s":"日ソ共同宣言により、日ソ間の国交が回復したのは、1965年である。","a":0,"e":"誤り：1965年。正しくは1956年。鳩山一郎首相が訪ソして日ソ共同宣言に調印し、国交を回復した。1965年は日韓基本条約で韓国と国交を正常化した年である。","m":"日ソ56年・日韓65年","y":1956},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0119","lv":1,"s":"1971年、アメリカのニクソン大統領がドルと金の交換停止を発表し、日本に衝撃を与えた。","a":1,"e":"1971年8月、ニクソン大統領が金とドルの交換停止を発表した（ドル＝ショック）。同年末に1ドル＝308円への切り上げが行われ、1973年には円は変動相場制へ移行した。","m":"71年金ドル交換停止→73年変動相場制","y":1971},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0120","lv":1,"s":"日米間の貿易摩擦の対象となったのは、繊維・牛肉・オレンジなどで、自動車は対象とならなかった。","a":0,"e":"誤り：自動車は対象とならなかった。正しくは1980年代に自動車や半導体も貿易摩擦の対象となり、日本は対米輸出の自主規制やアメリカでの現地生産で対応した。繊維は1970年前後の摩擦の品目である。","m":"80年代の摩擦は自動車・半導体","y":1980},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0122","lv":2,"s":"日韓基本条約と同時に、日本は韓国に対して無償・有償の経済協力を行うことを約束した。","a":1,"e":"日韓請求権・経済協力協定で、日本は無償3億ドル・有償2億ドルの経済協力を行うことになった。請求権問題は解決済みとされた。","m":"日韓請求権協定＝経済協力","y":1965},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0123","lv":2,"s":"日韓基本条約では、日本は北朝鮮政府も含めた朝鮮半島全体の政府を承認した。","a":0,"e":"誤り：北朝鮮政府も含めた。正しくは韓国政府を朝鮮にある唯一の合法的な政府と確認した。そのため北朝鮮とは国交がないままで、2002年の平壌宣言でも正常化は実現していない。","m":"日韓条約が認めたのは韓国政府のみ","y":1965},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0124","lv":2,"s":"1972年の日中共同声明で、中国は日本に対する戦争賠償の請求を放棄した。","a":1,"e":"1972年の日中共同声明で、中国は日本に対する戦争賠償の請求を放棄すると表明した。日本側は過去の戦争で中国国民に重大な損害を与えた責任を痛感し、深く反省すると述べた。","m":"共同声明で中国は賠償請求を放棄","y":1972},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0125","lv":2,"s":"日中平和友好条約には、第三国の覇権に反対する反覇権条項は盛り込まれなかった。","a":0,"e":"誤り：盛り込まれなかった。正しくはアジア・太平洋地域等で覇権を求めず、他国の覇権にも反対するという反覇権条項が盛り込まれた。ソ連が警戒した。","m":"平和友好条約＝反覇権条項","y":1978},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0126","lv":2,"s":"1969年の日米首脳会談で、核抜き・本土並みを前提とした1972年の沖縄返還の合意に至った。","a":1,"e":"1969年の佐藤栄作首相とニクソン大統領の共同声明で、安保条約を維持したうえで、核兵器を撤去し本土と同様に安保条約を適用する形での1972年の返還が合意された。","m":"69年佐藤・ニクソン会談で返還合意","y":1969},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0127","lv":2,"s":"非核三原則を守るとする国会決議は、沖縄返還が実現した後の1972年以降に採択された。","a":0,"e":"誤り：返還後。正しくは返還前年の1971年、沖縄返還協定の国会承認の際に衆議院が非核三原則を守る決議を行った。原則そのものは1967年に佐藤首相が国会で表明していた。","m":"非核三原則の国会決議は1971年","y":1971},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0128","lv":2,"s":"1960年代、日本は中華民国との外交関係を保ちつつ、中国との間でLT貿易を進めた。","a":1,"e":"国交のない中華人民共和国との間で、1962年に廖承志と高碕達之助が覚書を交わし、政府保証つきの半官半民の貿易が始まった。両者の頭文字からLT貿易とよばれる。","m":"LT貿易＝廖・高碕の覚書貿易","y":1962},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0129","lv":2,"s":"日米防衛協力のための指針（ガイドライン）が最初に定められたのは、冷戦終結後の1997年である。","a":0,"e":"誤り：1997年。正しくは1978年。冷戦期の1978年に最初の指針が合意され、1997年には周辺事態を念頭に置いた新指針に改められた。","m":"最初のガイドラインは1978年","y":1978},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0130","lv":2,"s":"中曽根康弘内閣は、防衛費をGNPの1％以内に抑える方針を撤廃した。","a":1,"e":"防衛費をGNPの1％以内に抑える方針は1976年に三木武夫内閣が定めた。中曽根康弘内閣は1987年度予算でこの枠をこえ、総額明示方式に改めた。","m":"1％枠は三木が設定、中曽根が撤廃","y":1987},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0132","lv":2,"s":"1999年、小渕恵三内閣のもとで、周辺事態安全確保法が成立した。","a":1,"e":"新ガイドラインの実効性を確保するため、1999年に周辺事態法が成立し、日本周辺での有事の際の米軍への後方支援が定められた。","m":"周辺事態法は小渕内閣","y":1999},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0133","lv":2,"s":"2001年のテロ対策特別措置法は、小泉内閣の下で、自衛隊をイラクに派遣するために制定された。","a":0,"e":"誤り：イラクに派遣。正しくはアメリカの同時多発テロを受け、インド洋で米軍等の後方支援を行うために制定。イラク派遣はイラク復興支援特措法（2003年）による。","m":"テロ特措法＝インド洋給油","y":2001},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0134","lv":3,"s":"沖縄返還協定は、1971年に調印され、返還は1972年5月に実現した。","a":1,"e":"沖縄返還協定は1971年6月に調印され、翌1972年5月15日に発効して沖縄の本土復帰が実現した。協定の調印と実際の返還は年がずれることに注意したい。","m":"返還協定71年・本土復帰72年","y":1971},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0135","lv":3,"s":"旧日米安全保障条約は、サンフランシスコ平和条約の調印から約1年後に調印された。","a":0,"e":"誤り：約1年後。正しくは同日（1951年9月8日）。平和条約と安保条約はともに同日に調印され、1952年4月28日に同時に発効した。","m":"平和条約と安保は同日調印","y":1951},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0136","lv":3,"s":"日米貿易摩擦では、1988年に牛肉・オレンジの輸入自由化に合意し、1991年に実施された。","a":1,"e":"日米農産物交渉の結果、牛肉・オレンジの輸入自由化が決まり、1991年から自由化された。1993年にはウルグアイ・ラウンドで米の部分開放が決まった。","m":"牛肉・オレンジは1991年自由化","y":1991},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0137","lv":3,"s":"日米構造協議は、日米の貿易摩擦が深刻化する以前の1950年代に始まった。","a":0,"e":"誤り：1950年代。正しくは1989年に始まった。アメリカは貿易不均衡の原因として日本の流通制度や系列取引などの閉鎖性を問題にし、大規模小売店舗法の見直しなどが進められた。","m":"日米構造協議は1989年から","y":1989},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0138","lv":3,"s":"1967年、佐藤内閣は武器輸出三原則を表明し、共産圏などへの武器輸出を認めない方針を示した。","a":1,"e":"1967年、佐藤内閣は共産圏諸国、国連決議で武器輸出が禁じられた国、国際紛争の当事国やそのおそれのある国への武器輸出を認めない武器輸出三原則を表明した。","m":"武器輸出三原則は1967年・佐藤内閣","y":1967},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0139","lv":3,"s":"日中国交正常化の際、日華平和条約は有効なまま維持され、台湾との外交関係も継続した。","a":0,"e":"誤り：有効なまま維持され外交関係も継続。正しくは日中共同声明にともない日華平和条約は終了したものとされ、台湾の中華民国との国交は断たれた。民間の実務関係は続いている。","m":"72年、日華平和条約は終了","y":1972},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0141","lv":3,"s":"日韓基本条約と同時に結ばれた協定で、両国間の請求権の問題は、今後の交渉に委ねるとされた。","a":0,"e":"誤り：今後の交渉に委ねる。正しくは日韓請求権・経済協力協定で、日本の経済協力と引きかえに請求権の問題は完全かつ最終的に解決されたと定められた。ただし個人の請求をめぐる解釈は両国で対立している。","m":"請求権は65年協定で解決済みとされた","y":1965},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0142","lv":3,"s":"1996年の日米安全保障共同宣言では、日米同盟をアジア太平洋地域の安定の基礎として再確認した。","a":1,"e":"1996年、橋本龍太郎首相とクリントン大統領が日米安全保障共同宣言を発表し、冷戦後の日米安保をアジア太平洋地域の安定の基礎と位置づけ直した。翌年に新ガイドラインが策定された。","m":"96年共同宣言で安保を再定義","y":1996},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0143","lv":3,"s":"PKO協力法に基づく自衛隊の最初の海外派遣先は、東ティモールである。","a":0,"e":"誤り：東ティモール。正しくはカンボジア（1992年）。国連カンボジア暫定統治機構（UNTAC）に自衛隊の部隊が派遣された。","m":"最初のPKOはカンボジア","y":1992},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0144","lv":2,"s":"1969年の沖縄返還合意により、返還後の沖縄からアメリカ軍基地はすべて撤去されることになった。","a":0,"e":"誤り：すべて撤去。正しくは安保条約を維持したまま、核抜き・本土並みの返還とされたため、広大な米軍基地は返還後も沖縄に残った。基地負担は今日まで続く課題である。","m":"核抜き・本土並みでも基地は残った","y":1969},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0145","lv":1,"s":"1973年の第四次中東戦争を機に石油危機が起こり、日本では物価が急騰した。","a":1,"e":"OAPECが石油の減産や禁輸を行い、原油価格が大幅に上昇した。日本は狂乱物価に見舞われ、1974年には戦後初のマイナス成長となった。","m":"第一次石油危機は1973年","y":1973},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0146","lv":1,"s":"石油危機の後、日本経済は引き続き10％前後の高度成長を続けた。","a":0,"e":"誤り：高度成長を続けた。正しくは1974年に戦後初めて実質経済成長率がマイナスとなり、高度経済成長は終わった。以後は年数％の安定成長の時代に移った。","m":"74年マイナス成長で高度成長が終わる","y":1974},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0147","lv":1,"s":"中曽根康弘内閣は、電電公社・専売公社・国鉄の民営化を進めた。","a":1,"e":"第二次臨時行政調査会の答申を受けて、中曽根内閣は1985年に電電公社をNTT、専売公社をJTに、1987年に国鉄を分割してJR各社に民営化した。行財政改革の柱である。","m":"三公社民営化は中曽根内閣","y":1987},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0148","lv":1,"s":"消費税が日本で初めて導入されたのは、1997年の橋本内閣のときである。","a":0,"e":"誤り：橋本内閣・1997年。正しくは竹下登内閣・1989年で、税率は3％であった。橋本内閣が1997年に行ったのは税率の5％への引き上げで、導入と引き上げを区別したい。","m":"消費税導入は竹下内閣（89年・3％）","y":1989},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0149","lv":1,"s":"1989年に昭和天皇が死去し、元号が平成に改められた。","a":1,"e":"1989年1月7日に昭和天皇が亡くなり、翌8日から元号は平成となった。同年には消費税の導入や、米ソ首脳による冷戦終結の宣言（マルタ会談）もあった。","m":"1989年、昭和から平成へ","y":1989},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0150","lv":1,"s":"バブル経済とは、1980年代後半に低金利と金余りを背景に、地価や株価が急落した状態をいう。","a":0,"e":"誤り：急落した。正しくは地価や株価が実体経済からかけ離れて異常に高騰した状態をいう。1990年代初めに金融引き締めなどで価格が急落し、バブル経済は崩壊した。","m":"バブル＝高騰、崩壊＝暴落","y":1986},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0151","lv":1,"s":"1993年の総選挙で自民党が過半数割れし、細川護熙を首相とする非自民連立内閣が成立した。","a":1,"e":"1993年の総選挙で自民党が過半数を割り、日本新党の細川護熙を首相とする非自民8党派の連立内閣が成立した。1955年以来の自民党の長期政権が終わり、55年体制は崩壊した。","m":"93年細川内閣で55年体制が終わる","y":1993},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0152","lv":1,"s":"1995年に発生した阪神・淡路大震災は、兵庫県を中心に被害が出て、同じ年にはJR福知山線の脱線事故も起きた。","a":0,"e":"誤り：福知山線脱線事故が同年。正しくは1995年にはオウム真理教による地下鉄サリン事件が起きた。福知山線事故は2005年である。","m":"95年＝阪神震災・サリン","y":1995},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0153","lv":1,"s":"小泉純一郎内閣は、郵政民営化を掲げ、2005年の総選挙で大勝した。","a":1,"e":"小泉首相は郵政民営化法案が参議院で否決されると衆議院を解散し、2005年の総選挙（郵政選挙）で自民党が大勝した。その後、郵政民営化法が成立した。","m":"小泉首相＝郵政民営化と郵政選挙","y":2005},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0155","lv":1,"s":"1985年に成立した男女雇用機会均等法は、雇用における男女の差別を禁じる法律である。","a":1,"e":"女子差別撤廃条約の批准に向けて、1985年に男女雇用機会均等法が成立し、翌年施行された。当初は募集・採用などでの差別禁止が努力義務にとどまり、1997年の改正で禁止規定となった。","m":"均等法は1985年成立・86年施行","y":1985},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0157","lv":1,"s":"1997年、橋本龍太郎内閣のもとで消費税率が5％に引き上げられた。","a":1,"e":"橋本龍太郎内閣は財政再建をめざして1997年に消費税率を3％から5％に引き上げた。同年には北海道拓殖銀行や山一証券が破綻し、景気は再び悪化した。","m":"97年、橋本内閣が消費税5％","y":1997},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0158","lv":2,"s":"1973年の石油危機では、物価高騰のなかで、トイレットペーパーの買いだめなどの騒ぎが起こった。","a":1,"e":"第1次石油危機で原油価格が約4倍に上がり、物価が急上昇する狂乱物価となった。品不足を恐れた人々によるトイレットペーパーや洗剤の買いだめ騒動も起こった。","m":"狂乱物価でトイレットペーパー騒動","y":1973},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0159","lv":2,"s":"1970年代後半以降、日本の産業は、鉄鋼や造船などの重厚長大型産業へ重点を移し、省エネ化を進めた。","a":0,"e":"誤り：重厚長大型へ重点を移した。正しくはME（マイクロエレクトロニクス）化を進めて、省エネ・軽薄短小型の加工組立型産業（自動車・電機）へ重点を移した。","m":"石油危機後は省エネ・ME化で軽薄短小へ","y":1975},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0160","lv":2,"s":"ロッキード事件では、田中角栄元首相が受託収賄罪などで起訴された。","a":1,"e":"アメリカのロッキード社が航空機の売り込みのために日本の政界に工作資金を渡した汚職事件で、1976年に田中角栄元首相が逮捕・起訴された。政治と金の問題が大きく問われた。","m":"ロッキード事件で田中元首相逮捕","y":1976},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0161","lv":2,"s":"1976年のロッキード事件のときの首相は、福田赳夫であった。","a":0,"e":"誤り：福田赳夫。正しくは三木武夫。三木内閣は事件の真相解明に積極的に取り組んだが、自民党内の反発（三木おろし）を招き、1976年の総選挙で敗れて退陣した。","m":"ロッキード事件時の首相は三木","y":1976},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0162","lv":2,"s":"1985年のプラザ合意以降、円高が急速に進み、日本は円高不況に陥った。","a":1,"e":"1985年、先進5か国（G5）がドル高是正で合意し（プラザ合意）、急速な円高が進んで輸出産業が打撃を受けた（円高不況）。その対策の低金利政策がバブル経済の一因となった。","m":"プラザ合意→円高不況→バブル","y":1985},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0163","lv":2,"s":"1989〜90年、日本銀行は地価や株価の高騰を抑えるため、公定歩合を引き下げ続けた。","a":0,"e":"誤り：引き下げ続けた。正しくは公定歩合を段階的に引き上げた。大蔵省による不動産融資の総量規制も重なり、1990年代初めに株価・地価が急落してバブル経済は崩壊した。","m":"バブル退治は利上げ＋総量規制","y":1990},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0164","lv":2,"s":"1994年の政治改革関連法により、衆議院に小選挙区比例代表並立制が導入された。","a":1,"e":"細川内閣のもとで1994年に政治改革関連法が成立し、衆議院の選挙制度が中選挙区制から小選挙区比例代表並立制に改められた。あわせて政党交付金の制度も導入された。","m":"94年、小選挙区比例代表並立制","y":1994},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0165","lv":2,"s":"村山富市内閣は、日本社会党と新生党を中心とする連立内閣であった。","a":0,"e":"誤り：社会党と新生党を中心。正しくは自民党・社会党・新党さきがけの連立（自社さ政権）。長く対立してきた自民・社会両党が手を組み、社会党委員長の村山が首相となった。","m":"村山内閣＝自民・社会・さきがけ","y":1994},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0166","lv":2,"s":"1995年、村山富市首相は戦後50年にあたり、植民地支配と侵略への反省を述べる談話を発表した。","a":1,"e":"戦後50年の1995年、村山富市首相は談話を発表し、植民地支配と侵略によってアジア諸国の人々に多大な損害と苦痛を与えたことに、痛切な反省とおわびを表明した。","m":"戦後50年の村山談話（1995）","y":1995},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0167","lv":2,"s":"1997年、山一証券と北海道拓殖銀行が経営破綻したが、金融機関への公的資金の投入は行われなかった。","a":0,"e":"誤り：公的資金の投入は行われなかった。正しくは金融システムの安定のため、1998年以降大手銀行などに公的資金が注入された。同年には日本長期信用銀行なども破綻した。","m":"金融危機に公的資金を注入","y":1998},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0168","lv":2,"s":"2009年の総選挙で民主党が勝利し、鳩山由紀夫を首相とする政権が成立した。","a":1,"e":"2009年の総選挙で民主党が大勝し、民主党・社会民主党・国民新党の連立による鳩山由紀夫内閣が成立した。選挙による本格的な政権交代は戦後初めてといわれる。","m":"2009年、民主党の鳩山内閣へ交代","y":2009},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0169","lv":2,"s":"2000年に始まった介護保険制度は、75歳以上の高齢者のみを対象としていた。","a":0,"e":"誤り：75歳以上のみ。正しくは40歳以上の人が保険料を納めて加入し、介護が必要と認定された人がサービスを受ける制度である。高齢化の進行を受けて2000年に始まった。","m":"介護保険は2000年・40歳以上が加入","y":2000},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0170","lv":3,"s":"1973年には、田中内閣のもとで老人医療費無料化が行われ、福祉元年と呼ばれた。","a":1,"e":"石油危機の直前、1973年に福祉元年と称して老人医療費の無料化などが行われた。しかし石油危機後の不況で財政が悪化し、見直された。","m":"1973年は福祉元年、直後に石油危機","y":1973},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0171","lv":3,"s":"第二次臨時行政調査会の会長は、経団連会長の稲山嘉寛であった。","a":0,"e":"誤り：稲山嘉寛。正しくは元経団連会長の土光敏夫。1981年に発足した第二次臨時行政調査会は「増税なき財政再建」を掲げ、三公社の民営化などを答申して中曽根内閣の行政改革を導いた。","m":"第二次臨調の会長は土光敏夫","y":1981},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0172","lv":3,"s":"1980年代、日本の自動車メーカーは、アメリカとの貿易摩擦を背景に、アメリカでの現地生産を進めた。","a":1,"e":"1981年から日本は対米自動車輸出の自主規制を行い、さらにプラザ合意後の円高も背景に、自動車メーカーはアメリカに工場を建てて現地生産を広げた。貿易摩擦をやわらげる狙いがあった。","m":"自動車摩擦→自主規制と現地生産","y":1981},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0173","lv":3,"s":"日本の株価（日経平均）が最高値を記録したのは、1980年代前半であった。","a":0,"e":"誤り：1980年代前半。正しくは1989年末で、日経平均株価は約3万8900円の最高値を記録した。翌年から株価は急落し、地価も下がってバブル経済は崩壊へ向かった。","m":"株価の最高値は1989年末","y":1989},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0174","lv":3,"s":"1989年、竹下内閣は、リクルート事件の影響で消費税導入後に退陣した。","a":1,"e":"竹下登内閣は1989年4月に消費税を導入したが、政治家や官僚に未公開株が渡ったリクルート事件で国民の不信が高まり、同年6月に総辞職した。","m":"竹下内閣はリクルート事件で退陣","y":1989},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0175","lv":3,"s":"1997年に京都で開かれた会議で採択された京都議定書は、日本に対して温室効果ガスの削減義務を課さなかった。","a":0,"e":"誤り：削減義務を課さなかった。正しくは先進国に温室効果ガスの削減目標を義務づけ、日本は1990年比で6％の削減を約束した。1997年の地球温暖化防止京都会議で採択された。","m":"京都議定書で日本は6％削減","y":1997},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0176","lv":3,"s":"2001年の中央省庁再編では、1府22省庁が1府12省庁に再編された。","a":1,"e":"橋本龍太郎内閣の行政改革をもとに、2001年に1府22省庁が1府12省庁に再編された。内閣府が新設され、首相の指導力を強める狙いがあった。","m":"2001年、1府22省庁→1府12省庁","y":2001},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0177","lv":3,"s":"1990年の湾岸危機の時、海部俊樹首相は、日本の自衛隊を中東に派遣する法律を成立させた。","a":0,"e":"誤り：法律を成立させた。正しくは自衛隊の派遣を可能にする国連平和協力法案を提出したが、反対が強く廃案となった。日本は資金協力が中心となり、のちPKO協力法が成立した。","m":"海部内閣の国連平和協力法案は廃案","y":1990},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0178","lv":3,"s":"小泉内閣は、2001年に発足し、不良債権処理と規制緩和を柱とする構造改革を進めた。","a":1,"e":"2001年に発足した小泉純一郎内閣は「聖域なき構造改革」を掲げ、銀行の不良債権処理、規制緩和、道路公団や郵政事業の民営化などを進めた。","m":"小泉＝聖域なき構造改革","y":2001},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0179","lv":2,"s":"細川護熙内閣の連立与党には、日本共産党も含まれていた。","a":0,"e":"誤り：日本共産党も含まれていた。正しくは日本新党・新生党・社会党・公明党・民社党・新党さきがけなどの連立で、共産党は参加しなかった。","m":"細川連立に共産党は不参加","y":1993},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0180","lv":3,"s":"電電公社が民営化されてJT、専売公社が民営化されてNTTとなった。","a":0,"e":"誤り：電電公社がJT、専売公社がNTT。正しくは電電公社がNTT、専売公社がJT（日本たばこ産業）。ともに1985年に民営化された。","m":"電電＝NTT、専売＝JT","y":1985},{"f":"現代","t":"占領と民主化","ref":"GD-0181","lv":3,"s":"1949年のシャウプ勧告は、間接税を中心とする税制への転換を求めた。","a":0,"e":"誤り：間接税を中心。正しくは所得税などの直接税を中心とする税制を勧告した。ドッジ・ラインによる財政引き締めとあわせ、インフレを抑えて経済を安定させるねらいがあった。","m":"シャウプ勧告＝直接税中心","y":1949},{"f":"現代","t":"講和と55年体制","ref":"GD-0182","lv":2,"s":"1955年の左右社会党の統一は、自由民主党の結成より後に行われた。","a":0,"e":"誤り：自由民主党の結成より後。正しくは1955年10月に社会党が統一し、これに対抗して同年11月に保守合同で自由民主党が結成された。社会党の統一が先である。","m":"10月社会党統一→11月自民党結成","y":1955},{"f":"現代","t":"講和と55年体制","ref":"GD-0183","lv":1,"s":"1950年、労働組合の全国組織として日本労働組合総評議会（総評）が結成された。","a":1,"e":"総評は1950年、GHQの後押しも受けて共産党系の組合に対抗する形で結成された。しかしまもなく左傾化し、社会党を支持して安保闘争や春闘を主導する労働運動の中心となった。","m":"1950年総評結成、のち社会党を支持","y":1950},{"f":"現代","t":"高度経済成長","ref":"GD-0184","lv":1,"s":"1955年ごろから1973年ごろまでの高度経済成長期の実質経済成長率は、年平均約3％であった。","a":0,"e":"誤り：年平均約3％。正しくは年平均10％前後の高い成長が続いた。民間の設備投資や技術革新が成長を支え、1973年の石油危機で高度経済成長は終わった。","m":"高度成長は年平均約10％","y":1955},{"f":"現代","t":"高度経済成長","ref":"GD-0185","lv":3,"s":"消費者の利益を守るため、1968年に消費者保護基本法が制定された。","a":1,"e":"高度成長期には大量消費が進む一方、欠陥商品や有害な食品添加物などの被害が問題になった。こうした中で1968年に消費者保護基本法が制定され、消費者運動も広がった。","m":"1968年、消費者保護基本法","y":1968},{"f":"現代","t":"高度経済成長","ref":"GD-0186","lv":3,"s":"1970年のいわゆる公害国会では、公害関係の法律の整備が見送られた。","a":0,"e":"誤り：整備が見送られた。正しくは公害関係の14の法律が成立し、公害対策基本法から経済の発展との調和をうたう条項が削除された。翌1971年に環境庁が発足した。","m":"70年公害国会で14法成立","y":1970},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0187","lv":2,"s":"1974年、田中角栄首相の東南アジア歴訪の際、タイやインドネシアで反日暴動が起こった。","a":1,"e":"日本企業の急速な進出や経済的な結びつきの強まりに対する反発から、田中首相の訪問先で反日暴動が起こった。のち福田赳夫内閣は1977年に福田ドクトリンを示し、関係改善をはかった。","m":"74年田中首相の東南アジア訪問で反日暴動","y":1974},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0188","lv":2,"s":"1993年のGATTウルグアイ・ラウンドで、日本は米の全面的な輸入自由化に合意した。","a":0,"e":"誤り：全面的な輸入自由化。正しくは細川内閣が米の部分開放（ミニマム・アクセス）を受け入れた。米の輸入が関税化されたのは1999年である。","m":"93年は米の部分開放（ミニマム・アクセス）","y":1993},{"f":"現代","t":"戦後外交（日米・日中・日韓）","ref":"GD-0189","lv":3,"s":"2003年、イラク復興支援特別措置法が制定され、自衛隊がイラクに派遣された。","a":1,"e":"小泉内閣は、イラク戦争後の復興支援のため2003年にイラク復興支援特別措置法を制定し、陸上自衛隊をサマワに派遣した。戦闘が続く地域への初の派遣として議論をよんだ。","m":"イラク特措法（03年）でサマワへ","y":2003},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0190","lv":1,"s":"第2次石油危機は、1973年の第四次中東戦争をきっかけに起こった。","a":0,"e":"誤り：1973年の第四次中東戦争。正しくは1979年のイラン革命をきっかけに起こった。第四次中東戦争によるのは第1次石油危機で、日本は省エネの進展で第2次の打撃を比較的軽く抑えた。","m":"第1次は中東戦争、第2次はイラン革命","y":1979},{"f":"現代","t":"石油危機以後・平成","ref":"GD-0191","lv":2,"s":"2011年に東日本大震災が起きたときの首相は、自由民主党の麻生太郎であった。","a":0,"e":"誤り：自由民主党の麻生太郎。正しくは民主党の菅直人。2009年の政権交代後、鳩山由紀夫に続いて菅直人が首相となり、震災と福島第一原子力発電所の事故への対応にあたった。","m":"震災時は民主党の菅直人内閣","y":2011},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0001","lv":1,"s":"法隆寺金堂の釈迦三尊像は、渡来人の子孫である鞍作鳥（止利仏師）の作とされる。","a":1,"e":"法隆寺金堂の釈迦三尊像は、聖徳太子の冥福を祈って623年に造られたとされ、光背の銘に鞍作鳥の名がみえる。面長の顔や左右対称の厳しい表情など、中国の北魏様式の影響が強い。","m":"釈迦三尊像＝鞍作鳥・北魏様式","y":623},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0002","lv":1,"s":"法隆寺の玉虫厨子は、白鳳文化の工芸品である。","a":0,"e":"誤り：白鳳文化。正しくは飛鳥文化。玉虫厨子は宮殿の形をした仏具で、透かし彫りの金具の下に玉虫の羽を敷き、台座や扉には仏教説話の絵が描かれている。","m":"玉虫厨子・天寿国繍帳は飛鳥文化"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0003","lv":1,"s":"『古事記』は稗田阿礼が誦習した内容を、太安万侶が筆録して712年に完成した。","a":1,"e":"天武天皇の命で稗田阿礼がよみならった帝紀・旧辞を、元明天皇の命を受けた太安万侶が筆録し、712年に『古事記』として完成した。神代から推古天皇までを記し、漢字の音訓を交えて書かれた。","m":"阿礼がよみ、安万侶が書いた古事記","y":712},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0004","lv":1,"s":"『日本書紀』は712年に成立し、漢文体の編年体で書かれた。","a":0,"e":"誤り：712年。正しくは720年。『日本書紀』は舎人親王らが編纂した最初の正史で、六国史の第一である。712年に成立したのは太安万侶が筆録した『古事記』である。","m":"古事記712・日本書紀720","y":720},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0005","lv":1,"s":"最澄は比叡山に延暦寺を建て、天台宗を開いた。","a":1,"e":"最澄は804年に遣唐使とともに入唐して天台の教えを学び、翌年帰国して天台宗を開いた。比叡山延暦寺を拠点とし、のちに大乗戒壇の設立を朝廷に求めた。","m":"最澄＝天台宗・比叡山延暦寺","y":806},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0006","lv":1,"s":"空海は高野山に延暦寺を建て、真言宗を開いた。","a":0,"e":"誤り：延暦寺。正しくは金剛峰寺。空海は唐で密教を学んで真言宗を開き、嵯峨天皇から高野山を与えられて金剛峰寺を建てた。京都の教王護国寺（東寺）も拠点とした。延暦寺は最澄の寺である。","m":"空海＝真言宗・高野山金剛峰寺","y":816},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0007","lv":1,"s":"『源氏物語』は、藤原道長の時代に紫式部が著した。","a":1,"e":"紫式部は一条天皇の中宮彰子（藤原道長の娘）に仕え、光源氏を主人公とする長編物語『源氏物語』を著した。かな文字の普及が女性による文学の隆盛を支えた国風文化の代表作である。","m":"源氏物語＝彰子に仕えた紫式部","y":1008},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0008","lv":1,"s":"『枕草子』は、紫式部が著した随筆である。","a":0,"e":"誤り：紫式部。正しくは清少納言。清少納言は一条天皇の皇后定子に仕え、宮廷生活を鋭い感覚でつづった。紫式部は中宮彰子に仕えて『源氏物語』を書いた。","m":"枕草子＝定子に仕えた清少納言","y":1000},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0009","lv":1,"s":"平等院鳳凰堂は、藤原頼通が宇治に建てた阿弥陀堂である。","a":1,"e":"藤原頼通は父道長から譲られた宇治の別荘を寺に改め、1053年に阿弥陀堂（鳳凰堂）を建てた。本尊の阿弥陀如来像は定朝が寄木造で作った。末法思想を背景とする浄土教の建築である。","m":"鳳凰堂＝頼通の阿弥陀堂・定朝の仏像","y":1053},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0010","lv":1,"s":"『万葉集』は、平安時代前期に醍醐天皇の命で編集された勅撰和歌集である。","a":0,"e":"誤り：『万葉集』。正しくは『古今和歌集』。醍醐天皇の命で編まれた最初の勅撰和歌集は『古今和歌集』である。『万葉集』は奈良時代に成立した現存最古の歌集で、勅撰ではない。","m":"万葉集＝奈良・古今集＝醍醐"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0011","lv":1,"s":"東大寺の大仏は、聖武天皇の大仏造立の詔により造られた。","a":1,"e":"聖武天皇は743年に紫香楽宮で大仏造立の詔を出した。のち平城京の東大寺で造立が続けられ、民衆に慕われた行基も協力して、752年に開眼供養が行われた。","m":"大仏造立の詔は聖武天皇（743年）","y":743},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0012","lv":1,"s":"浄土教は、鎌倉時代になって初めて貴族のあいだに広まった。","a":0,"e":"誤り：鎌倉時代になって初めて。正しくは平安時代中ごろから、空也・源信の布教や末法思想で貴族に広まった。法然・親鸞は鎌倉新仏教。","m":"浄土教は平安中期から"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0013","lv":1,"s":"天平文化は、唐の文化の影響を強く受けた国際的な文化であった。","a":1,"e":"天平文化は、遣唐使がもたらした盛唐の文化の影響を強く受けた。正倉院の宝物には西アジアやインドに起源をもつ品もあり、シルクロードを通じた国際性がみられる。","m":"天平文化＝盛唐の影響・国際色"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0014","lv":2,"s":"『凌雲集』『文華秀麗集』『経国集』は、嵯峨天皇らのもとで編まれた勅撰漢詩集である。","a":1,"e":"9世紀前半、嵯峨天皇や淳和天皇のもとで『凌雲集』『文華秀麗集』『経国集』の勅撰漢詩集が編まれた。文章によって国家を治めるという文章経国の思想が背景にある。","m":"凌雲・文華秀麗・経国＝勅撰漢詩集"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0015","lv":2,"s":"唐招提寺は、鑑真が開いた寺院で、金堂は平安時代初期の代表的建築である。","a":0,"e":"誤り：平安時代初期。正しくは奈良時代（天平文化）の建築である。唐招提寺は来日した唐僧鑑真が759年に開いた律宗の寺で、金堂は天平の代表的な建築。鑑真和上像も伝わる。","m":"唐招提寺＝鑑真・天平の金堂","y":759},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0016","lv":2,"s":"興福寺の阿修羅像は、乾漆造の仏像である。","a":1,"e":"興福寺の阿修羅像は八部衆像の一つで、天平文化の乾漆像である。乾漆像は粘土などの原型に麻布を漆で貼り重ねて作る。同じ時期には粘土で作る塑像も盛んであった。","m":"天平の仏像＝乾漆像と塑像"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0017","lv":2,"s":"一木造の仏像が盛んにつくられたのは、天平文化の時期である。","a":0,"e":"誤り：天平文化。正しくは弘仁・貞観文化。1本の木から主要部分を彫り出す一木造が盛んになり、神護寺薬師如来像などが代表である。天平文化の仏像は乾漆像・塑像が中心であった。","m":"一木造は弘仁・貞観文化"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0018","lv":2,"s":"弘仁・貞観文化では、密教が広まり、曼荼羅や不動明王像がつくられた。","a":1,"e":"最澄・空海がもたらした密教の影響で、加持祈禱による現世利益が貴族に重んじられた。仏の世界を図示した曼荼羅や、不動明王などの神秘的な仏像・仏画が数多く作られた。","m":"密教の広まり＝曼荼羅・不動明王"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0019","lv":2,"s":"『往生要集』は、念仏による極楽往生の方法を説いた書で、空也が著した。","a":0,"e":"誤り：空也。正しくは源信（恵心僧都）。源信は985年に『往生要集』を著し、極楽往生のための念仏の方法を説いた。空也は10世紀半ばに京の市で念仏を勧めた僧で、市聖とよばれた。","m":"往生要集＝源信、市聖＝空也","y":985},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0020","lv":2,"s":"寄木造は、仏像をいくつかの部材に分けてつくる技法で、定朝が完成させた。","a":1,"e":"寄木造は、仏像の体をいくつかの部材に分けて彫り、組み合わせる技法である。11世紀に定朝が完成させ、大きな仏像を効率よく作れるようになった。平等院鳳凰堂の阿弥陀如来像が代表作。","m":"寄木造を完成させたのは定朝"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0021","lv":2,"s":"国風文化では、貴族の住居として書院造が成立した。","a":0,"e":"誤り：書院造。正しくは寝殿造。国風文化期の貴族は、白木造・檜皮葺の寝殿を中心に池や庭を配した寝殿造の住宅に住んだ。書院造は室町時代の東山文化のころに成立した。","m":"国風は寝殿造、東山は書院造"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0022","lv":2,"s":"『古今和歌集』は、醍醐天皇の命で紀貫之らが撰進した最初の勅撰和歌集である。","a":1,"e":"905年ごろ、醍醐天皇の命で紀貫之・紀友則らが『古今和歌集』を編んだ。最初の勅撰和歌集で、紀貫之がかなで序文を書いた。これ以後、勅撰和歌集の編纂が続いた。","m":"古今集＝醍醐天皇の命・紀貫之ら","y":905},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0023","lv":2,"s":"法隆寺金堂の壁画は、飛鳥文化の絵画に分類される。","a":0,"e":"誤り：飛鳥文化。正しくは白鳳文化。法隆寺金堂壁画はインドや西域の影響を受けた仏教絵画で、高松塚古墳壁画とともに白鳳期の代表である。1949年の火災で大きく損なわれた。","m":"金堂壁画・高松塚壁画は白鳳"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0024","lv":2,"s":"『風土記』は、元明天皇の命で諸国の地誌として編まれ、現存するのは出雲国のものがほぼ完本である。","a":1,"e":"713年、元明天皇の命で諸国の産物や地名の由来、伝承などをまとめた地誌が編まれた。現存するのは出雲・常陸・播磨・豊後・肥前の5か国分で、ほぼ完全に残るのは『出雲国風土記』である。","m":"風土記は出雲がほぼ完全に残る","y":713},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0025","lv":2,"s":"空海が庶民にも教育を開放するために開いた学校は、弘文院である。","a":0,"e":"誤り：弘文院。正しくは綜芸種智院。空海は庶民にも開かれた学校として京都に綜芸種智院を設けた。弘文院は和気氏が一族の子弟のために設けた大学別曹である。","m":"庶民の学校＝空海の綜芸種智院","y":828},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0026","lv":3,"s":"大学別曹として、藤原氏は勧学院、和気氏は弘文院、橘氏は学館院を設けた。","a":1,"e":"平安初期、有力な氏族は一族の子弟が大学で学ぶための寄宿施設として大学別曹を設けた。藤原氏の勧学院、和気氏の弘文院、橘氏の学館院、在原氏の奨学院などがある。","m":"勧学院＝藤原、弘文院＝和気"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0027","lv":3,"s":"懐風藻は、平安時代初期の勅撰漢詩集で、嵯峨天皇の時代に成立した。","a":0,"e":"誤り：平安時代初期の勅撰漢詩集。正しくは奈良時代の751年に成立した現存最古の漢詩集で、勅撰ではない。嵯峨天皇のころの勅撰漢詩集には『凌雲集』などがある。","m":"懐風藻＝奈良時代の最古の漢詩集","y":751},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0028","lv":3,"s":"薬師寺東塔は、各層に裳階をつけた三重塔で、外観が六重の塔のように見える。","a":1,"e":"薬師寺東塔は三重塔だが、各層に裳階とよばれるひさし状の構造がつくため、屋根が六重に重なって見える。大小の屋根が交互に重なる独特の姿で知られる。","m":"三重塔＋裳階で六重に見える"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0029","lv":3,"s":"『日本霊異記』は、紀貫之が著した仏教説話集である。","a":0,"e":"誤り：紀貫之。正しくは薬師寺の僧景戒。『日本霊異記』は平安初期に成立した日本最古の仏教説話集で、因果応報の考えを説く。紀貫之は『土佐日記』の作者である。","m":"日本霊異記＝景戒の仏教説話"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0030","lv":3,"s":"空海の『三教指帰』は、儒教・道教・仏教の優劣を論じて仏教を最上とした書である。","a":1,"e":"『三教指帰』は若き日の空海が797年に著した書で、儒教・道教・仏教を登場人物の議論の形で比べ、仏教が最もすぐれていると論じた。空海の出家の決意を示す作品とされる。","m":"三教指帰＝空海、仏教が最上","y":797},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0031","lv":3,"s":"小野道風・藤原佐理・藤原行成の三人は、三筆とよばれた。","a":0,"e":"誤り：三筆。正しくは三跡（三蹟）。小野道風・藤原佐理・藤原行成は国風文化期に優美な和様の書を確立した。三筆は唐風の書にすぐれた嵯峨天皇・空海・橘逸勢である。","m":"三筆＝唐風（弘仁）、三跡＝和様"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0032","lv":3,"s":"『新撰姓氏録』は、嵯峨天皇の命で編まれ、京・畿内の氏族を出自により分類した。","a":1,"e":"『新撰姓氏録』は嵯峨天皇の命で815年に成立し、京と畿内の約1200の氏族を、皇族から分かれた皇別、神の子孫とする神別、渡来系の諸蕃に分けてその系譜を記した。","m":"新撰姓氏録＝皇別・神別・諸蕃","y":815},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0033","lv":3,"s":"天寿国繍帳は、白鳳文化の遺品で、聖徳太子の死を悼んで作られた。","a":0,"e":"誤り：白鳳文化。正しくは飛鳥文化の遺品である。天寿国繍帳は聖徳太子の死後、妃の橘大郎女が太子が往生した天寿国のようすを刺繍で表させたと伝えられ、中宮寺に残る。","m":"天寿国繍帳＝飛鳥・中宮寺"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0034","lv":3,"s":"空也は、京の市中で念仏を勧め、市聖とよばれた。","a":1,"e":"10世紀半ば、空也は京の市中で人々に念仏を勧め、市聖とよばれた。のちの源信の『往生要集』とともに、貴族から庶民にまで浄土教が広まるきっかけとなった。","m":"市で念仏を説いた空也＝市聖"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0035","lv":3,"s":"『伊勢物語』は、紀貫之の作とされる歌物語である。","a":0,"e":"誤り：紀貫之。正しくは作者未詳で、在原業平を思わせる男の和歌を中心に構成される。紀貫之は『土佐日記』『古今和歌集』に関わった。","m":"伊勢物語＝業平を思わせる男"},{"f":"文化","t":"古代の文化（飛鳥〜国風）","ref":"BK-0036","lv":2,"s":"『土佐日記』は、紫式部が女性に仮託して、かな文で記した日記である。","a":0,"e":"誤り：紫式部。正しくは紀貫之。紀貫之は土佐守の任期を終えて京へ帰る旅を、女性の筆者に仮託してかな文でつづった。かなで書かれた日記文学の先駆けである。","m":"土佐日記＝貫之が女性を装う","y":935},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0037","lv":1,"s":"『新古今和歌集』は、後鳥羽上皇の命で藤原定家らが編集した勅撰和歌集である。","a":1,"e":"『新古今和歌集』は後鳥羽上皇の命で藤原定家・藤原家隆らが編纂し、1205年に成立した。技巧をこらした優美で象徴的な歌風が特色で、西行や慈円らの歌も多く収められている。","m":"新古今＝後鳥羽上皇の命・藤原定家ら","y":1205},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0038","lv":1,"s":"『平家物語』は、南北朝の動乱を描いた軍記物語である。","a":0,"e":"誤り：南北朝の動乱。正しくは平氏の栄華と滅亡を描いた軍記物語で、琵琶法師が平曲として語り広めた。南北朝の動乱を描いた軍記物語は『太平記』である。","m":"平家物語＝平氏の興亡、太平記＝南北朝"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0039","lv":1,"s":"東大寺南大門は、重源が宋の建築様式を取り入れて再建した大仏様の建築である。","a":1,"e":"1180年の平重衡による南都焼打ちで焼けた東大寺を、重源が宋人陳和卿の協力を得て再建した。南大門は宋の様式を取り入れた大仏様（天竺様）で、豪快な構造が特色である。","m":"東大寺南大門＝重源の大仏様","y":1199},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0040","lv":1,"s":"東大寺南大門の金剛力士像は、定朝の作である。","a":0,"e":"誤り：定朝。正しくは運慶・快慶ら。東大寺南大門の金剛力士像は1203年に慶派の仏師が短期間で造った、写実的で力強い鎌倉彫刻の代表作である。定朝は平安中期の仏師。","m":"南大門の金剛力士像＝運慶・快慶","y":1203},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0041","lv":1,"s":"『徒然草』は、吉田兼好（兼好法師）が著した随筆である。","a":1,"e":"『徒然草』は兼好法師（吉田兼好）が鎌倉末期に著した随筆で、無常観を基調に、鋭い観察で人間や社会を論じている。『方丈記』（鴨長明）とあわせて中世の代表的な随筆である。","m":"徒然草＝鎌倉末の兼好法師"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0042","lv":1,"s":"『方丈記』は、兼好法師が書いた随筆で、世の無常を述べている。","a":0,"e":"誤り：兼好法師。正しくは鴨長明。『方丈記』は1212年に成立し、平安末の大火・飢饉・地震などの災害を記して世の無常を述べた。兼好法師は『徒然草』の作者である。","m":"方丈記＝鴨長明、徒然草＝兼好","y":1212},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0043","lv":1,"s":"北山文化を代表する建築である金閣は、足利義満が建てた。","a":1,"e":"足利義満は京都北山の山荘に金閣を建てた。初層は寝殿造風、上層は禅宗様という公家と武家・禅宗の文化を融合した建築で、北山文化を象徴する。のち鹿苑寺となった。","m":"金閣＝義満・北山文化"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0044","lv":1,"s":"銀閣は、足利義満が京都の北山に建てた建築である。","a":0,"e":"誤り：足利義満・北山。正しくは足利義政が京都の東山山荘に建てた。銀閣は東山文化の代表建築で、のち慈照寺となった。同じ敷地の東求堂同仁斎は書院造の初期の例である。","m":"銀閣＝義政・東山文化"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0045","lv":1,"s":"世阿弥は、能を大成し、『風姿花伝』を著した。","a":1,"e":"観阿弥・世阿弥父子は足利義満の保護を受け、猿楽能を芸術性の高い能に大成した。世阿弥は能の理論書『風姿花伝』（花伝書）を著し、幽玄の美を重んじた。","m":"能を大成した世阿弥＝風姿花伝"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0046","lv":1,"s":"雪舟は、水墨画を大成し、『秋冬山水図』を描いた画家で、狩野派の祖である。","a":0,"e":"誤り：狩野派の祖。正しくは狩野派の祖は狩野正信である。雪舟は明に渡って画法を学んだ禅僧で、帰国後に日本的な水墨山水画を大成した。正信の子の元信が狩野派の画風を確立した。","m":"雪舟＝水墨画、狩野派の祖＝正信"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0047","lv":1,"s":"『太平記』は、南北朝の動乱を描いた軍記物語である。","a":1,"e":"『太平記』は後醍醐天皇の討幕計画から南北朝の動乱までを描いた軍記物語である。のちに太平記読みとよばれる語り手によって広まり、民衆にも親しまれた。","m":"太平記＝南北朝の動乱の軍記"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0048","lv":1,"s":"『吾妻鏡』は、平安時代の貴族が記した日記である。","a":0,"e":"誤り：平安時代の貴族の日記。正しくは鎌倉幕府が編纂した歴史書で、源頼朝の挙兵から13世紀半ばまでの幕府の出来事を日記の形で記している。鎌倉時代研究の基本史料である。","m":"吾妻鏡＝鎌倉幕府の歴史書"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0049","lv":1,"s":"『愚管抄』は、慈円が歴史を道理で説明しようとして著した歴史書である。","a":1,"e":"慈円は摂関家出身の天台座主で、承久の乱の直前に『愚管抄』を著した。歴史の移り変わりを道理によって説明し、後鳥羽上皇の倒幕計画をいさめる意図があったとされる。","m":"愚管抄＝慈円が道理で歴史を説く","y":1220},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0050","lv":2,"s":"『神皇正統記』は、北畠親房が南朝の正統性を主張するために著した。","a":1,"e":"北畠親房は南北朝の動乱のなか、常陸の小田城で『神皇正統記』を著した。神代からの皇位継承をたどり、南朝こそ正統であると主張した。","m":"神皇正統記＝北畠親房・南朝正統"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0051","lv":2,"s":"狂言は、能と能の合間に演じられた、歌と舞を中心とする劇である。","a":0,"e":"誤り：歌と舞を中心とする劇。正しくは日常の会話を用いたせりふ中心の喜劇で、民衆の生活や大名・僧などへの風刺を題材とした。歌と舞を中心とする歌舞劇は能である。","m":"能＝歌舞劇、狂言＝せりふの喜劇"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0052","lv":2,"s":"一遍上人絵伝は、一遍の布教の様子を描いた絵巻物である。","a":1,"e":"『一遍上人絵伝』は時宗の開祖一遍の生涯と布教の旅を描いた絵巻物で、1299年に弟子の聖戒が詞書を書き、円伊が絵を描いた。踊念仏のようすや市・街道の風景も描かれている。","m":"一遍上人絵伝＝遊行と踊念仏","y":1299},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0053","lv":2,"s":"鎌倉時代に発達した似絵の代表作として、『蒙古襲来絵詞』が知られる。","a":0,"e":"誤り：『蒙古襲来絵詞』。正しくは伝源頼朝像（神護寺）など。似絵は藤原隆信・信実らが描いた写実的な肖像画。蒙古襲来絵詞は竹崎季長の戦功を描く絵巻。","m":"似絵＝藤原隆信・信実"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0054","lv":2,"s":"枯山水の庭園として、京都の龍安寺石庭が知られる。","a":1,"e":"枯山水は、水を使わず石と砂で山や川の風景を表した庭園で、禅の精神を反映している。龍安寺石庭や大徳寺大仙院庭園が代表で、東山文化のころに発達した。","m":"石と砂の庭＝枯山水（龍安寺）"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0055","lv":2,"s":"『菟玖波集』を編んで連歌を和歌と並ぶ地位に高めたのは、宗祇である。","a":0,"e":"誤り：宗祇。正しくは二条良基。南北朝期に『菟玖波集』を編み連歌の規則を整えた。宗祇は東山文化期に『新撰菟玖波集』を編んだ。","m":"菟玖波集＝二条良基（南北朝）"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0056","lv":2,"s":"宗祇は連歌を大成し、『新撰菟玖波集』を編んだ。","a":1,"e":"宗祇は東山文化期の連歌師で、正風連歌を確立して『新撰菟玖波集』を編んだ。各地の大名を訪ね歩いて連歌を広め、弟子らと詠んだ『水無瀬三吟百韻』でも知られる。","m":"新撰菟玖波集＝宗祇の正風連歌"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0057","lv":2,"s":"山崎宗鑑は、『新撰菟玖波集』を編んだ連歌師である。","a":0,"e":"誤り：『新撰菟玖波集』。正しくは『犬筑波集』。山崎宗鑑は、より自由でこっけいな俳諧連歌を始めた人物で、のちの俳諧の源流となった。『新撰菟玖波集』は宗祇が編んだ。","m":"山崎宗鑑＝犬筑波集・俳諧連歌"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0058","lv":2,"s":"東求堂同仁斎は、書院造の代表的な建築である。","a":1,"e":"東求堂同仁斎は、足利義政が東山山荘に建てた持仏堂の一室で、付書院と違い棚を備えた四畳半の書斎である。畳を敷きつめた書院造の初期の例で、のちの和風住宅の源流となった。","m":"東求堂同仁斎＝初期の書院造"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0059","lv":2,"s":"五山文学は、禅僧が、かな文で書いた文学である。","a":0,"e":"誤り：かな文。正しくは漢詩文。五山の禅僧は中国の文化に通じ、義堂周信・絶海中津らが漢詩文を作った。五山の僧は外交文書の作成など室町幕府の顧問としても活躍した。","m":"五山文学＝禅僧の漢詩文"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0060","lv":2,"s":"足利学校は、関東管領上杉憲実が再興して、学問の中心となった。","a":1,"e":"下野の足利学校は、1439年ごろ関東管領上杉憲実が書籍を寄進するなどして再興した。全国から僧や武士が集まって儒学や易学を学び、宣教師から坂東の大学と紹介された。","m":"足利学校を再興＝上杉憲実","y":1439},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0061","lv":2,"s":"一条兼良は、吉田神道を大成し、神道を中心とする教えを説いた。","a":0,"e":"誤り：一条兼良。正しくは吉田神道（唯一神道）を大成したのは吉田兼倶である。一条兼良は有職故実や古典に通じた公家の学者で、『公事根源』や将軍足利義尚に献じた『樵談治要』を著した。","m":"唯一神道は吉田兼倶、兼良は有職故実"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0062","lv":3,"s":"『梁塵秘抄』は、後白河法皇が当時流行の今様を集めた歌謡集である。","a":1,"e":"後白河法皇は当時庶民の間で流行していた歌謡である今様を愛好し、自ら学んでその歌詞を集め、『梁塵秘抄』を編んだ。院政期の文化に庶民文化が取り入れられた例である。","m":"今様を集めた梁塵秘抄＝後白河"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0063","lv":3,"s":"中尊寺金色堂は、奥州藤原氏のうち、藤原秀衡が建立した。","a":0,"e":"誤り：藤原秀衡。正しくは藤原清衡。初代清衡が平泉に中尊寺金色堂を建て、内部には清衡・基衡・秀衡の3代の遺体が納められた。地方に広がった浄土教の建築である。","m":"金色堂は初代清衡が建立","y":1124},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0064","lv":3,"s":"『今昔物語集』は、インド・中国・日本の説話を収めた説話集である。","a":1,"e":"『今昔物語集』は院政期に成立した説話集で、天竺（インド）・震旦（中国）・本朝（日本）の千余りの説話を収める。日本の部分には武士や庶民の生活も生き生きと描かれている。","m":"今昔物語集＝天竺・震旦・本朝"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0065","lv":3,"s":"『金槐和歌集』は、後鳥羽上皇の和歌を集めた歌集である。","a":0,"e":"誤り：後鳥羽上皇。正しくは源実朝。鎌倉幕府3代将軍の実朝は藤原定家に和歌を学び、万葉調の力強い歌を多く残して『金槐和歌集』にまとめた。後鳥羽上皇は『新古今和歌集』を命じた。","m":"金槐和歌集＝将軍源実朝"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0066","lv":3,"s":"村田珠光は、侘茶の創始者とされ、のちの茶の湯の基礎をつくった。","a":1,"e":"村田珠光は、茶会での精神的な交わりを重んじ、簡素な茶室で茶を味わう侘茶を始めた。侘茶は武野紹鷗に受け継がれ、桃山時代に千利休によって大成された。","m":"侘茶は珠光→紹鷗→利休"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0067","lv":3,"s":"池坊専慶は、いけばな（立花）の名手として知られた。","a":1,"e":"池坊専慶は京都六角堂（頂法寺）の僧で、東山文化期に立花の名手として評判となった。座敷を飾る生け花は、書院造の床の間の発達とともに広まり、のちに池坊が華道の家元となった。","m":"立花の名手＝池坊専慶"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0068","lv":3,"s":"『庭訓往来』は、手紙文の形で、日常に必要な知識を記した教科書である。","a":1,"e":"『庭訓往来』は、手紙文の形で武士や庶民の生活に必要な語句や知識を学べるようにした往来物で、室町時代に成立し、江戸時代の寺子屋でも教科書として使われた。","m":"庭訓往来＝手紙形式の教科書"},{"f":"文化","t":"中世の文化（院政期〜東山）","ref":"BK-0069","lv":3,"s":"『元亨釈書』は、日本の仏教の歴史を、かな文でまとめた書物である。","a":0,"e":"誤り：かな文。正しくは漢文。『元亨釈書』は臨済僧の虎関師錬が1322年に著した日本最初の仏教通史で、僧の伝記や寺院の歴史を漢文でまとめている。","m":"元亨釈書＝虎関師錬の漢文仏教史","y":1322},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0073","lv":1,"s":"狩野永徳は、桃山文化を代表する障壁画の画家で、『唐獅子図屏風』を描いた。","a":1,"e":"狩野永徳は織田信長・豊臣秀吉に仕え、安土城や大坂城、聚楽第の障壁画を描いた。金地に濃い彩色で描く濃絵の豪壮な画風が桃山文化を代表し、『唐獅子図屏風』が知られる。","m":"唐獅子図屏風＝狩野永徳"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0074","lv":1,"s":"俵屋宗達は、寛永期に活躍した装飾画家で、『唐獅子図屏風』を描いた。","a":0,"e":"誤り：『唐獅子図屏風』。正しくは宗達の代表作は『風神雷神図屏風』である。宗達は大和絵の伝統を生かした装飾的な画風で琳派の源流となった。『唐獅子図屏風』は桃山期の狩野永徳の作品。","m":"宗達＝風神雷神図屏風"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0075","lv":1,"s":"井原西鶴は、町人の生活を描いた浮世草子を著し、『日本永代蔵』などを残した。","a":1,"e":"井原西鶴は元禄期の大坂の町人で、俳諧から転じて浮世草子を書いた。町人の恋愛を描く好色物や、金銭をめぐる生活を描く町人物があり、『日本永代蔵』『世間胸算用』が後者の代表である。","m":"西鶴＝浮世草子・日本永代蔵"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0076","lv":1,"s":"近松門左衛門は、浮世草子の作家で、『好色一代男』を著した。","a":0,"e":"誤り：浮世草子の作家・『好色一代男』。正しくはこれは井原西鶴にあたる。近松門左衛門は人形浄瑠璃や歌舞伎の脚本を書き、心中物の『曽根崎心中』や時代物の『国性爺合戦』で知られる。","m":"近松＝浄瑠璃・曽根崎心中"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0077","lv":1,"s":"松尾芭蕉は、元禄期に蕉風俳諧を確立し、『奥の細道』を著した。","a":1,"e":"松尾芭蕉は、言葉遊びの多かった俳諧を、さび・しおりなどを重んじる芸術性の高い蕉風俳諧に高めた。東北・北陸をめぐる旅の紀行文『奥の細道』を著した。","m":"芭蕉＝蕉風俳諧・奥の細道"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0078","lv":1,"s":"葛飾北斎は、『東海道五十三次』を描いた浮世絵師である。","a":0,"e":"誤り：『東海道五十三次』。正しくは『富嶽三十六景』。北斎は富士山をさまざまな場所から描いた。『東海道五十三次』は歌川広重の作で、ともに化政文化を代表する風景版画である。","m":"北斎＝富嶽、広重＝東海道"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0079","lv":1,"s":"杉田玄白・前野良沢らは、オランダ語の解剖書を翻訳し、『解体新書』を刊行した。","a":1,"e":"杉田玄白・前野良沢らはオランダ語の解剖書『ターヘル＝アナトミア』を苦心して翻訳し、1774年に『解体新書』として刊行した。苦労は玄白の『蘭学事始』に記され、蘭学発展の契機となった。","m":"解体新書＝玄白・良沢（1774）","y":1774},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0080","lv":1,"s":"本居宣長は、『古事記伝』を著して、儒学の立場から古典を研究した。","a":0,"e":"誤り：儒学の立場。正しくは国学の立場。宣長は『古事記』を研究して『古事記伝』を著し、儒教や仏教の影響を除いた日本古来の精神を探った。","m":"宣長＝国学・古事記伝"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0081","lv":1,"s":"十返舎一九は、『東海道中膝栗毛』を著し、庶民の人気を集めた。","a":1,"e":"十返舎一九の『東海道中膝栗毛』は、弥次郎兵衛と喜多八が東海道を旅する滑稽本で、化政期に庶民の間で大流行した。寺子屋の普及による識字率の向上や貸本屋がその背景にある。","m":"膝栗毛＝一九の滑稽本"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0082","lv":1,"s":"伊能忠敬は、蝦夷地を探検して、樺太が島であることを確認した。","a":0,"e":"誤り：樺太が島であることの確認。正しくは伊能忠敬は全国を測量して『大日本沿海輿地全図』を作った。樺太が島と確認したのは間宮林蔵。","m":"伊能＝測量、間宮＝樺太"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0083","lv":1,"s":"日光東照宮は、徳川家康を祀る、権現造の霊廟建築である。","a":1,"e":"日光東照宮は徳川家康をまつる霊廟で、3代将軍家光のときに大規模に建て替えられた。本殿と拝殿を石の間でつなぐ権現造で、陽明門などに華やかな彫刻と彩色がほどこされている。","m":"日光東照宮＝家康をまつる権現造"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0084","lv":1,"s":"出雲阿国は、江戸時代の初め、能を始めた。","a":0,"e":"誤り：能を始めた。正しくは出雲阿国は17世紀初めに京都でかぶき踊りを始め、女歌舞伎として流行した。のち風紀を理由に女歌舞伎・若衆歌舞伎が禁じられ、野郎歌舞伎となった。","m":"出雲阿国＝かぶき踊り"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0085","lv":1,"s":"狩野探幽は、江戸幕府の御用絵師として活躍した。","a":1,"e":"狩野探幽は永徳の孫で、江戸幕府の御用絵師となった。江戸に拠点を移して狩野派を幕府や大名に仕える画派として繁栄させ、大徳寺方丈襖絵などを残した。","m":"探幽＝江戸幕府の御用絵師"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0086","lv":2,"s":"尾形光琳は、京都の裕福な呉服商の家に生まれ、『燕子花図屏風』を描いた。","a":1,"e":"尾形光琳は京都の呉服商雁金屋に生まれ、俵屋宗達の装飾的な画風を発展させて琳派を形づくった。『燕子花図屏風』『紅白梅図屏風』が代表作で、元禄文化を代表する。","m":"光琳＝燕子花図・紅白梅図"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0087","lv":2,"s":"菱川師宣は、浮世絵の祖とされ、『富嶽三十六景』を描いた。","a":0,"e":"誤り：『富嶽三十六景』。正しくは『見返り美人図』。菱川師宣は元禄期に版画の浮世絵を始め、浮世絵の祖とされる。『富嶽三十六景』は化政期の葛飾北斎の作品である。","m":"師宣＝浮世絵の祖・見返り美人"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0088","lv":2,"s":"宮崎安貞は、農業技術をまとめた『農業全書』を著した。","a":1,"e":"宮崎安貞は元禄期の農学者で、明の農書を参考に、各地を歩いて得た経験をもとに1697年に『農業全書』を著した。日本で最初の体系的な農書とされ、広く読まれた。","m":"農業全書＝元禄の宮崎安貞","y":1697},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0089","lv":2,"s":"関孝和は、元禄期に、貞享暦を作り、天文学を発達させた。","a":0,"e":"誤り：貞享暦を作った。正しくは関孝和は和算を大成し、『発微算法』を著した。貞享暦を作ったのは渋川春海で、中国の暦を修正して日本独自の暦とし、幕府の天文方に任じられた。","m":"和算＝関孝和、貞享暦＝渋川春海"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0090","lv":2,"s":"荻生徂徠は、古文辞学を唱え、『政談』で幕政の改革を論じた。","a":1,"e":"荻生徂徠は古文辞学を唱え、古典の言葉を当時の意味で理解することを重んじた。8代将軍徳川吉宗の諮問に答えて『政談』を著し、武士の土着などを説いた。弟子に太宰春台がいる。","m":"徂徠＝古文辞学・政談"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0091","lv":2,"s":"伊藤仁斎は、古義学を唱え、陽明学を学んで知行合一を説いた。","a":0,"e":"誤り：陽明学を学んで知行合一を説いた。正しくは伊藤仁斎は京都の古義堂で、『論語』『孟子』の原典から孔子・孟子の本来の教えを学ぶ古義学を唱えた。知行合一は中江藤樹らの陽明学である。","m":"古義学＝仁斎、陽明学＝藤樹"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0092","lv":2,"s":"石田梅岩は、心学を説き、商人の営利活動を正当化した。","a":1,"e":"石田梅岩は京都で心学（石門心学）を説き、商人の利益は武士の俸禄と同じく正当なものであると主張した。正直と倹約を重んじる教えは、町人の生活倫理として広まった。","m":"梅岩の心学＝商いの利益は正当"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0093","lv":2,"s":"安藤昌益は、『自然真営道』で、身分制度の存続を支持した。","a":0,"e":"誤り：身分制度の存続を支持。正しくは安藤昌益は『自然真営道』で、すべての人が耕作して生活する自然世を理想とし、武士が農民から収奪する封建社会を厳しく批判した。","m":"安藤昌益＝万人直耕・封建批判"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0094","lv":2,"s":"平田篤胤は、復古神道を唱え、幕末の尊王論に影響を与えた。","a":1,"e":"平田篤胤は本居宣長の没後の門人を名のり、国学を神道と結びつけた復古神道を唱えた。その思想は地方の豪農や神職に広まり、幕末の尊王攘夷運動に影響を与えた。","m":"篤胤の復古神道→幕末の尊王論"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0095","lv":2,"s":"賀茂真淵は、『古事記伝』を著して古典研究を進めた。","a":0,"e":"誤り：賀茂真淵。正しくは『古事記伝』は本居宣長の著作である。賀茂真淵は『万葉集』を研究して『万葉考』を著し、古代の精神を探った国学者で、宣長はその門人である。","m":"真淵＝万葉考、宣長＝古事記伝"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0096","lv":2,"s":"鈴木春信は、多色刷りの錦絵を始め、浮世絵の発展に貢献した。","a":1,"e":"鈴木春信は1765年ごろ、多くの色を重ねて摺る多色刷りの版画（錦絵）を始めた。これにより浮世絵は色彩豊かになり、大量に作られて庶民にも広まった。","m":"多色刷りの錦絵＝鈴木春信"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0097","lv":2,"s":"東洲斎写楽は、美人画で知られる浮世絵師である。","a":0,"e":"誤り：美人画。正しくは東洲斎写楽は、歌舞伎役者の顔を大きく描いた大首絵の役者絵で知られる。約10か月の短い期間に作品を残した。美人画の大首絵で知られるのは喜多川歌麿である。","m":"写楽＝役者絵、歌麿＝美人画"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0098","lv":3,"s":"『解体新書』の翻訳に主導的な役割を果たした前野良沢は、オランダ語に通じていた。","a":1,"e":"前野良沢は中津藩の医師で、青木昆陽にオランダ語を学び、長崎にも遊学した。『解体新書』の翻訳では語学力を生かして中心的な役割を果たしたが、訳者として名を出さなかった。","m":"解体新書の訳の中心＝前野良沢","y":1774},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0099","lv":3,"s":"塙保己一は、幕府の援助を受けず、独力で和学講談所を設けて『群書類従』を編集した。","a":0,"e":"誤り：幕府の援助を受けず。正しくは塙保己一は幕府の援助を受けて和学講談所を設け、古代以来の書物を分類・収録した『群書類従』を編集・刊行した。盲目の国学者として知られる。","m":"塙保己一＝和学講談所・群書類従"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0100","lv":3,"s":"上田秋成は、『雨月物語』を著した読本作者である。","a":1,"e":"上田秋成は国学者でもあった読本作者で、中国の怪異小説などを素材に『雨月物語』を著した。読本は文章を中心に読ませる小説で、のちの曲亭馬琴らに受け継がれた。","m":"雨月物語＝上田秋成の読本"},{"f":"文化","t":"近世の文化（桃山〜化政）","ref":"BK-0101","lv":3,"s":"『南総里見八犬伝』の作者は、山東京伝である。","a":0,"e":"誤り：山東京伝。正しくは曲亭馬琴（滝沢馬琴）。『南総里見八犬伝』は勧善懲悪の読本である。山東京伝は洒落本作者で、寛政の改革の出版統制で処罰された。","m":"八犬伝＝

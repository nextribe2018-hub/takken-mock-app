<title>日本史 10分模試</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: ホーム（合格の見込み3水準・5回セット・論点マップ）→ 試験画面（タイマー＋1問ずつ）→ 結果 → 解説と確認例題3問 */
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1f2a2e; --muted:#5d6a6e; --line:#d9ded9;
  --ai:#24476b; --ai-soft:#e3ebf3; --ok:#2f7a4b; --ok-soft:#e2f1e7; --ng:#b8402c; --ng-soft:#f8e4df; --warn:#9a6b12; --warn-soft:#f6ecd6; --or:#b85a16; --or-soft:#fbe5d3;
  --f-disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; --or:#f0a060; --or-soft:#3f2a1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; --or:#f0a060; --or-soft:#3f2a1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-disp);font-weight:800;font-size:1.7rem;margin:0}
h2{font-family:var(--f-disp);font-size:1.15rem;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:.88rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-weight:700;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ai)}
.btn.pri{background:var(--ai);color:var(--paper);border-color:var(--ai)}
.btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.slot b{display:block;font-size:1.05rem;font-family:var(--f-disp)}
.slot.now{border-color:var(--ai);background:var(--ai-soft)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kp{background:var(--bg);border-radius:8px;padding:10px 12px}
.kp span{font-size:.78rem;color:var(--muted)} .kp b{display:block;font-size:1.3rem;font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.topics{display:flex;flex-direction:column;gap:14px}
.tgroup h3{font-size:.85rem;margin:0 0 6px;color:var(--muted);letter-spacing:.05em}
.tlist{display:flex;flex-wrap:wrap;gap:6px}
.tp{font:inherit;font-size:.8rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.tp.t-none{opacity:.75}
.tp.t-perfect{--c:var(--ok);--b:var(--ok);background:var(--ok);border-color:var(--ok);color:var(--paper);font-weight:700}
.tp.t-good{--c:var(--ok);--b:var(--ok-soft)}
.tp.t-mid{--c:var(--warn);--b:var(--warn-soft)}
.tp.t-low{--c:var(--or);--b:var(--or-soft)}
.tp.t-bad{--c:var(--ng);--b:var(--ng-soft)}
.tp.t-good,.tp.t-mid,.tp.t-low,.tp.t-bad{background:var(--b);border-color:var(--c);color:var(--c)}
.tp.few{border-style:dashed;background:color-mix(in srgb,var(--b) 45%,var(--paper));border-color:color-mix(in srgb,var(--c) 55%,var(--paper));font-weight:400}
.tp.t-perfect.few{color:var(--ink);background:color-mix(in srgb,var(--ok) 28%,var(--paper));border-color:var(--ok)}
.tp.few .tpr small{font-weight:700}
.lg{display:inline-block;font-size:.72rem;padding:0 7px;border-radius:999px;border:1px solid var(--line);margin:2px 2px 0 0;cursor:default}
.legend{font-size:.75rem;color:var(--muted)}
.exam-top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2;border-bottom:1px solid var(--line)}
.timer{font-family:var(--f-disp);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ng)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:.7rem;display:grid;place-items:center;font-variant-numeric:tabular-nums;cursor:pointer;background:var(--paper);color:var(--ink)}
.dot.ans{background:var(--ai-soft);border-color:var(--ai)}
.dot.cur{outline:2px solid var(--ai)}
.meta{font-size:.75rem;letter-spacing:.05em;color:var(--ai);font-weight:700}
.stmt{font-size:1.05rem;margin:0}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .btn{font-size:1.5rem;padding:10px}
.ox .btn.sel{background:var(--ai);color:var(--paper);border-color:var(--ai)}
.res{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.res.ok{background:var(--ok-soft)} .res.ng{background:var(--ng-soft)}
.v{font-weight:700} .res.ok .v{color:var(--ok)} .res.ng .v{color:var(--ng)}
.memo{font-size:.86rem;color:var(--muted)} .memo b{color:var(--ink)}
.big{font-family:var(--f-disp);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.judge{display:inline-block;font-weight:700;padding:3px 12px;border-radius:999px;font-size:.9rem}
.j-ok{background:var(--ok-soft);color:var(--ok)} .j-mid{background:var(--warn-soft);color:var(--warn)} .j-ng{background:var(--ng-soft);color:var(--ng)}
.rv{display:flex;flex-direction:column;gap:10px}
.ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.trap{background:var(--warn-soft);border-radius:8px;padding:10px 12px}
.trap b{color:var(--warn)}
.relg{display:flex;flex-direction:column;gap:10px}
.relg .ul{font-size:.9rem}
/* 体系解説：全体像ツリー・流れ図・比較表 */
.ov{margin:0;font-size:.95rem}
.systree{display:flex;flex-direction:column}
.sysroot{align-self:flex-start;background:var(--ai);color:var(--paper);font-weight:700;border-radius:10px;padding:8px 14px;font-family:var(--f-disp);font-size:1.05rem}
.sysbr{position:relative;margin-left:16px;padding:12px 0 0 18px;display:flex;flex-direction:column;gap:10px}
.sysbr::before{content:"";position:absolute;left:0;top:0;bottom:24px;border-left:2px solid var(--line)}
.br{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.br::before{content:"";position:absolute;left:-19px;top:22px;width:18px;border-top:2px solid var(--line)}
.br h4{margin:0 0 4px;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.br h4 .no{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--ai-soft);color:var(--ai);font-size:.75rem;font-variant-numeric:tabular-nums}
.br ul{margin:0;padding-left:1.1em;font-size:.88rem;line-height:1.65}
.br.hit{border-color:var(--ng);border-width:2px;background:var(--ng-soft)}
.br.hit::before{border-top-color:var(--ng)}
.br .tag{font-size:.72rem;font-weight:700;color:var(--paper);background:var(--ng);border-radius:999px;padding:1px 8px}
.br li.hit{font-weight:700;color:var(--ng)}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flow li{position:relative;display:flex;gap:12px;align-items:flex-start;padding-bottom:12px}
.flow li:last-child{padding-bottom:0}
.flow li:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;border-left:2px solid var(--ai)}
.flow .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ai);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.flow .s{padding-top:3px;font-size:.92rem}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
.st{border-collapse:collapse;width:100%;font-size:.84rem;line-height:1.5;min-width:100%}
.st caption{text-align:left;font-weight:700;padding:0 0 6px;font-size:.9rem}
.st th{background:var(--ai-soft);color:var(--ink);text-align:left;font-weight:700;padding:7px 9px;white-space:nowrap;border-bottom:1px solid var(--line)}
.st td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}
.st td:first-child{font-weight:700;min-width:6.5em}
.st tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.st .o{color:var(--ok);font-weight:700}.st .x{color:var(--ng);font-weight:700}
.tbls{display:flex;flex-direction:column;gap:14px}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font:inherit;font-size:.82rem;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mchip .no{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;background:var(--ai-soft);color:var(--ai);font-size:.7rem;font-weight:700}
.mchip.on{border-color:var(--ng);background:var(--ng-soft);color:var(--ng);font-weight:700}
.mchip.rel{border-style:dashed;color:var(--ai)}
.deeplink{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-color:var(--ai);color:var(--ai)}
.deeplink::after{content:"→";position:absolute;right:16px}
.deeplink{position:relative;padding-right:36px}
.sub2{font-size:.78rem;font-weight:500;color:var(--muted)}
.br.focus{outline:3px solid var(--ai);outline-offset:2px}
.card>.br::before{display:none}
.tpr{font-size:.92em}.tpr small{opacity:.7;margin-left:1px}
.lbs{display:flex;gap:3px;margin-top:3px}.lb{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;font-size:.7rem;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.lb.okd{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.lb.ngd{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}.lb.mi{border-style:dashed}
.lnk{font:inherit;background:none;border:0;padding:0;color:var(--ai);text-decoration:underline;cursor:pointer;text-align:left}
.exb{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.exb.near{border-color:var(--ai);background:var(--ai-soft)}
.exb p{margin:0}.exb .exp{font-weight:700}
.exb .tag{align-self:flex-start;font-size:.72rem;font-weight:700;color:var(--ai);border:1px solid var(--ai);border-radius:999px;padding:0 8px}
.cpt{color:var(--warn)}
.more{display:flex;flex-direction:column;gap:8px}.more summary{cursor:pointer;color:var(--ai);font-weight:700;padding:4px 0}.more[open]>.exb{margin-top:8px}
.ard{margin:0;display:grid;gap:8px}.ard dt{font-weight:700}.ard dd{margin:0;color:var(--ink)}
.fourcard{font:inherit;color:inherit;background:none;border:0;padding:0;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;cursor:pointer}
.fourcard .fc-l{display:flex;flex-direction:column;gap:2px}.fourcard .fc-t{font-family:var(--f-disp);font-weight:700;font-size:1.15rem}
.fourcard .fc-r{display:flex;flex-direction:column;align-items:flex-end}.fourcard .fc-r .fp{font-size:1.8rem;line-height:1.1}
.fourcard:focus-visible{outline:2px solid var(--ai);outline-offset:4px}
.fp{font-size:1.25rem;font-family:var(--f-disp)}
.vok{color:var(--ok)}.vmid{color:var(--warn)}.vng{color:var(--ng)}
.dot.okd{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.ngd{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.pbar,.mbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i,.mbar i{display:block;height:100%;background:var(--ai);border-radius:999px}
.st tr.focus td{background:var(--warn-soft)}
.fx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fx .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.sync{font-size:.78rem;margin:4px 0 0;color:var(--muted)}
.sync[data-s="ok"]{color:var(--ok)}
.sync[data-s="err"]{color:var(--ng)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:1.4fr .8fr .9fr 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem;font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--muted)}
.confirm{background:var(--ng-soft);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.res{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<script>
const BANK=[{"f":"古代","t":"原始・弥生","ref":"KO-0001","lv":1,"s":"旧石器時代の人々は、石を打ち欠いてつくる打製石器を主に使っていた。","a":1,"e":"旧石器時代は打製石器を用いた時代で、ナイフ形石器や尖頭器を槍先などにして大型動物を狩った。石を磨いて仕上げる磨製石器が広く使われるのは縄文時代からである。","m":"旧石器は打ち欠き、縄文で磨く"},{"f":"古代","t":"原始・弥生","ref":"KO-0002","lv":1,"s":"日本列島で稲作が始まり、水田が各地に広がったのは縄文時代の初めである。","a":0,"e":"誤り：縄文時代の初め。正しくは水田稲作は縄文時代の終わりごろ九州北部に伝わり、弥生時代に東北地方まで広がった。縄文時代の初めは狩猟・採集・漁労が生活の中心だった。","m":"水田稲作の広がり＝弥生時代"},{"f":"古代","t":"原始・弥生","ref":"KO-0003","lv":1,"s":"縄文時代の人々は、煮炊きや貯蔵のために縄目の文様をもつ土器を用いた。","a":1,"e":"縄文土器は低温で焼いた厚手で黒褐色の土器で、縄目の文様をもつものが多い。煮炊きができるようになり、木の実のあく抜きなど食べられる物の幅が大きく広がった。","m":"縄目・厚手・煮炊き＝縄文土器"},{"f":"古代","t":"原始・弥生","ref":"KO-0004","lv":1,"s":"弥生土器は縄文土器よりも厚手で、複雑な縄目文様が特徴である。","a":0,"e":"誤り：厚手で縄目文様。正しくは弥生土器は高温で焼かれた薄手で硬い赤褐色の土器で、文様は簡素である。用途に応じて甕・壺・高杯などが作られた。厚手で縄目文様をもつのは縄文土器。","m":"弥生土器は薄手・赤褐色・簡素"},{"f":"古代","t":"原始・弥生","ref":"KO-0005","lv":1,"s":"群馬県の岩宿遺跡の発掘によって、日本列島に旧石器時代の文化があったことが確認された。","a":1,"e":"相沢忠洋が関東ローム層から打製石器を見つけ、1949年の発掘調査で更新世の地層に人々の生活の跡があることが確かめられた。それまで日本に旧石器時代の文化はないと考えられていた。","m":"岩宿のローム層から打製石器","y":1949},{"f":"古代","t":"原始・弥生","ref":"KO-0006","lv":1,"s":"登呂遺跡は、弥生時代の水田跡や集落跡が見つかった佐賀県の遺跡である。","a":0,"e":"誤り：佐賀県。正しくは登呂遺跡は静岡県静岡市にあり、弥生時代後期の水田跡や住居・倉庫の跡が見つかった。佐賀県にある代表的な弥生遺跡は、環濠集落の吉野ヶ里遺跡である。","m":"登呂は静岡、吉野ヶ里は佐賀"},{"f":"古代","t":"原始・弥生","ref":"KO-0007","lv":1,"s":"佐賀県の吉野ヶ里遺跡は、周囲に濠をめぐらせた弥生時代の大規模な集落跡である。","a":1,"e":"吉野ヶ里遺跡は濠で囲まれた大規模な環濠集落で、物見やぐらとみられる建物の跡も見つかった。弥生時代に集落どうしの争いが起こり、防御を固める必要があったことを示している。","m":"環濠と物見やぐら＝吉野ヶ里"},{"f":"古代","t":"原始・弥生","ref":"KO-0008","lv":1,"s":"青森県の三内丸山遺跡は、弥生時代の稲作集落として知られる。","a":0,"e":"誤り：弥生時代の稲作集落。正しくは三内丸山遺跡は縄文時代前期〜中期の大規模な集落跡で、大型の掘立柱建物の跡やクリ林を管理した跡が見つかり、縄文人の定住生活の規模を示した。","m":"三内丸山は縄文の巨大集落"},{"f":"古代","t":"原始・弥生","ref":"KO-0009","lv":1,"s":"アメリカ人モースは大森貝塚を発掘し、日本の考古学研究の端緒を開いた。","a":1,"e":"モースは1877年に来日したアメリカの動物学者で、東京の大森貝塚を発掘した。貝塚は縄文人がごみを捨てた場所で、土器や骨角器が出土し、当時の食生活を知る手がかりとなる。","m":"モースが掘った大森貝塚","y":1877},{"f":"古代","t":"原始・弥生","ref":"KO-0010","lv":1,"s":"弥生時代には、稲穂を摘み取る道具として石包丁が用いられた。","a":1,"e":"石包丁は稲の穂先だけを摘み取る磨製石器で、穂首刈りに使われた。弥生時代の稲作では木製の鍬や鋤で田を耕し、収穫した稲は高床倉庫や貯蔵穴に蓄えた。","m":"穂首刈りに使う石包丁"},{"f":"古代","t":"原始・弥生","ref":"KO-0011","lv":1,"s":"『漢書』地理志には、倭人が百余国に分かれ、楽浪郡に定期的に使者を送っていたと記されている。","a":1,"e":"『漢書』地理志は前漢の歴史を記した書物で、紀元前1世紀ごろの倭が百余りの小国に分かれ、朝鮮半島に置かれた楽浪郡へ定期的に使者を送っていたことを伝える。倭の様子を伝える早い記録である。","m":"漢書地理志：百余国が楽浪郡へ"},{"f":"古代","t":"原始・弥生","ref":"KO-0012","lv":1,"s":"旧石器時代の人々は、竪穴住居を中心とする定住集落をつくって暮らしていた。","a":0,"e":"誤り：竪穴住居の定住集落。正しくは旧石器時代の人々は獲物を追って移動しながら暮らし、簡単なテント式の小屋や洞穴を住まいとした。竪穴住居に住む定住生活が広がるのは縄文時代である。","m":"旧石器は移動生活、縄文で定住"},{"f":"古代","t":"原始・弥生","ref":"KO-0013","lv":1,"s":"銅鐸は、弥生時代に豊作を祈るなどの祭りに用いられたと考えられる青銅製の祭器である。","a":1,"e":"銅鐸はもとは音を鳴らす鐘だったが、しだいに大型化して見るための祭器となった。弥生時代の青銅器は、武器の形をしたものも含めて、主に豊作を祈る祭りに使われた。","m":"銅鐸は鳴らす鐘から見る祭器へ"},{"f":"古代","t":"原始・弥生","ref":"KO-0014","lv":2,"s":"後漢の光武帝は、倭の奴国の王に印綬を授けた。","a":1,"e":"『後漢書』東夷伝によれば、57年に倭の奴国王が後漢の都洛陽に使いを送り、光武帝から印綬を授けられた。江戸時代に志賀島で見つかった金印がこの印にあたると考えられている。","m":"57年、奴国王に光武帝の印綬","y":57},{"f":"古代","t":"原始・弥生","ref":"KO-0015","lv":2,"s":"倭国王帥升らが生口160人を献上して朝貢した相手は、魏の皇帝である。","a":0,"e":"誤り：魏の皇帝。正しくは107年に倭国王帥升らが生口160人を献じた相手は後漢の安帝である（『後漢書』東夷伝）。魏への遣使は3世紀の邪馬台国の卑弥呼のときのこと。","m":"帥升は後漢の安帝へ生口","y":107},{"f":"古代","t":"原始・弥生","ref":"KO-0016","lv":2,"s":"卑弥呼は239年に魏へ使者を送り、「親魏倭王」の称号と銅鏡100枚などを授けられた。","a":1,"e":"『魏志』倭人伝によると、邪馬台国の女王卑弥呼は239年に魏へ使いを送り、「親魏倭王」の称号と金印、銅鏡100枚などを与えられた。卑弥呼は鬼道とよばれる呪術で人々を治めた。","m":"卑弥呼は239年「親魏倭王」","y":239},{"f":"古代","t":"原始・弥生","ref":"KO-0017","lv":2,"s":"弥生時代の銅剣・銅矛は近畿地方を中心に、銅鐸は北部九州を中心に分布した。","a":0,"e":"誤り：近畿に銅剣・銅矛、九州に銅鐸。正しくは銅矛は九州北部、平形銅剣は瀬戸内海沿岸、銅鐸は近畿を中心に分布する。地域ごとに異なる青銅の祭器を用いる文化圏があったと考えられる。","m":"矛は九州、鐸は近畿が中心"},{"f":"古代","t":"原始・弥生","ref":"KO-0018","lv":2,"s":"縄文時代には、呪術的な意味をもつと考えられる土偶が作られた。","a":1,"e":"土偶は女性をかたどったものが多く、豊かな実りや子孫の繁栄を祈るまじないに使われたと考えられる。縄文時代には石棒や抜歯の風習など、呪術的な習俗が多くみられる。","m":"土偶・石棒は縄文の祈り"},{"f":"古代","t":"原始・弥生","ref":"KO-0019","lv":2,"s":"縄文時代の漁労では、釣針や銛など主に青銅製の道具が用いられた。","a":0,"e":"誤り：青銅製。正しくは縄文時代の漁労では、シカの角や獣の骨で作った骨角器の釣針・銛・やすが使われ、丸木舟で外洋にも出た。青銅器が日本列島に伝わるのは弥生時代である。","m":"縄文の漁労は骨角器と丸木舟"},{"f":"古代","t":"原始・弥生","ref":"KO-0020","lv":2,"s":"弥生時代には、集落間の戦いが激しくなり、見晴らしのよい丘などに高地性集落が営まれた。","a":1,"e":"弥生時代中期以降、瀬戸内海沿岸から近畿にかけて、山頂や丘の上に高地性集落が営まれた。濠をめぐらせた環濠集落とともに、集落間の争いが激しくなったことを示すと考えられる。","m":"高地性集落と環濠は争いの証"},{"f":"古代","t":"原始・弥生","ref":"KO-0021","lv":2,"s":"方形周溝墓は、縄文時代に東北地方で営まれた墓の形式である。","a":0,"e":"誤り：縄文時代の東北地方。正しくは方形周溝墓は弥生時代に近畿地方などで広まった墓で、方形の盛り土のまわりに溝をめぐらせる。弥生時代後期には各地に大型の墳丘墓も現れた。","m":"方形周溝墓は弥生の墓"},{"f":"古代","t":"原始・弥生","ref":"KO-0022","lv":2,"s":"卑弥呼の死後、男王が立つと国内が乱れたため、台与（壱与）が女王に立てられた。","a":1,"e":"『魏志』倭人伝によると、卑弥呼の死後に男王が立ったが国中が従わずに争いとなり、一族の少女台与（壱与）が王となって治まった。台与も中国の晋に使いを送ったとされる。","m":"卑弥呼の後継は少女の台与"},{"f":"古代","t":"原始・弥生","ref":"KO-0023","lv":2,"s":"縄文時代には弓矢が使われるようになり、ニホンシカやイノシシなどの動きの速い中小動物が狩られた。","a":1,"e":"氷期が終わって大型動物が姿を消し、動きの速い中小動物が増えたため、縄文時代には弓矢が普及した。矢じりには黒曜石やサヌカイトなどで作った石鏃が使われた。","m":"中小動物を狙う弓矢と石鏃"},{"f":"古代","t":"原始・弥生","ref":"KO-0024","lv":2,"s":"日本列島が現在のような島々になったのは、約1万年前の氷期が始まったためである。","a":0,"e":"誤り：氷期が始まった。正しくは約1万年余り前に氷期が終わって気候が温暖になり、海面が上昇して日本列島は大陸から切り離された。氷期には大陸と陸続きで、大型動物が渡ってきていた。","m":"温暖化と海面上昇で列島に"},{"f":"古代","t":"原始・弥生","ref":"KO-0025","lv":2,"s":"長野県の野尻湖遺跡では、ナウマン象などの化石とともに旧石器時代の石器が見つかっている。","a":1,"e":"長野県の野尻湖底からはナウマンゾウやオオツノジカの化石が石器や骨器とともに出土し、旧石器時代の人々が大型動物を狩っていた様子がうかがえる。これらの動物は陸続きの大陸から渡ってきた。","m":"野尻湖でナウマンゾウ狩り"},{"f":"古代","t":"原始・弥生","ref":"KO-0026","lv":2,"s":"弥生時代の鉄器は、銅器と異なり祭祀用の道具として主に用いられた。","a":0,"e":"誤り：祭祀用が主。正しくは弥生時代の鉄器は斧・鎌などの工具や農具、武器といった実用品として使われた。祭りの道具として主に用いられたのは、銅鐸や銅矛などの青銅器である。","m":"鉄は実用品、青銅は祭器"},{"f":"古代","t":"原始・弥生","ref":"KO-0027","lv":3,"s":"『魏志』倭人伝には、邪馬台国には大人と下戸の身分差があり、租税や刑罰の制度もあったと記されている。","a":1,"e":"『魏志』倭人伝は、邪馬台国に大人と下戸という身分の差があり、租税を納めるしくみや刑罰、市があったと記す。小国の連合であっても、一定の統治のしくみが整っていたことがわかる。","m":"倭人伝：大人と下戸、租税と市"},{"f":"古代","t":"原始・弥生","ref":"KO-0028","lv":3,"s":"卑弥呼が魏に使いを送ったとき、その窓口となったのは楽浪郡である。","a":0,"e":"誤り：楽浪郡。正しくは窓口は帯方郡で、3世紀初めに遼東の公孫氏が楽浪郡の南部を分けて設けた郡である。楽浪郡は前漢が置いた郡で、紀元前1世紀ごろの倭の小国が使いを送った先。","m":"前漢は楽浪郡、魏は帯方郡","y":239},{"f":"古代","t":"原始・弥生","ref":"KO-0029","lv":3,"s":"福岡県の志賀島では、江戸時代に「漢委奴国王」と刻まれた金印が発見された。","a":1,"e":"「漢委奴国王」の金印は1784年に福岡県の志賀島で農民が掘り出したと伝わる。57年に光武帝が奴国王に授けた印にあたると考えられ、蛇の形のつまみ（鈕）をもつ。","m":"志賀島の金印は1784年発見","y":1784},{"f":"古代","t":"原始・弥生","ref":"KO-0030","lv":3,"s":"島根県の加茂岩倉遺跡からは、銅剣358本がまとまって出土した。","a":0,"e":"誤り：加茂岩倉遺跡から銅剣358本。正しくは銅剣358本が出たのは同じ島根県の荒神谷遺跡で、加茂岩倉遺跡からは銅鐸39個がまとまって出土した。出雲地方に有力な勢力があったことを示す。","m":"荒神谷は銅剣、加茂岩倉は銅鐸"},{"f":"古代","t":"原始・弥生","ref":"KO-0031","lv":3,"s":"弥生時代の人々は、収穫した稲を湿気やネズミから守るため、高床倉庫に貯蔵した。","a":1,"e":"高床倉庫は柱で床を高くした倉で、湿気やネズミの害から収穫した稲を守った。弥生時代には地面に掘った貯蔵穴も使われ、登呂遺跡などで倉庫の跡が見つかっている。","m":"稲の保管は湿気よけの高床倉庫"},{"f":"古代","t":"原始・弥生","ref":"KO-0032","lv":3,"s":"弥生時代、北海道では水田稲作が定着し、本州と同じ弥生文化が展開した。","a":0,"e":"誤り：水田稲作が定着。正しくは北海道には稲作が広まらず、狩猟・漁労を中心とする続縄文文化が続いた。沖縄など南西諸島でも、貝塚文化とよばれる食料採取の文化が続いた。","m":"北は続縄文、南は貝塚文化"},{"f":"古代","t":"原始・弥生","ref":"KO-0033","lv":3,"s":"黒曜石は産地が限られ、その石器が遠く離れた地域で見つかることから、旧石器・縄文時代にも交易があったことが分かる。","a":1,"e":"黒曜石は長野県の和田峠や伊豆諸島の神津島、隠岐などに産地が限られる。産地から遠く離れた地域からも出土するので、旧石器・縄文時代にも広い範囲で物の交易があったことがわかる。","m":"黒曜石の分布は交易の証拠"},{"f":"古代","t":"原始・弥生","ref":"KO-0034","lv":3,"s":"支石墓は弥生時代の近畿地方で広く営まれた墓の形式である。","a":0,"e":"誤り：近畿地方。正しくは支石墓は朝鮮半島の影響を受けた墓で、弥生時代の九州北部にみられる。九州北部では大きな甕に遺体を納める甕棺墓も多く、副葬品の差から有力者の出現がわかる。","m":"支石墓・甕棺墓は九州北部"},{"f":"古代","t":"原始・弥生","ref":"KO-0035","lv":3,"s":"奈良県の纏向遺跡は、古墳時代初めごろの大規模な集落跡で、初期ヤマト政権の中心地とみられている。","a":1,"e":"纏向遺跡は奈良盆地東南部にある3世紀の大規模な遺跡で、計画的に配置された建物跡が見つかった。近くには出現期の大型前方後円墳である箸墓古墳があり、ヤマト政権の成立を考える手がかりとなる。","m":"纏向と箸墓は初期ヤマトの舞台"},{"f":"古代","t":"原始・弥生","ref":"KO-0036","lv":2,"s":"縄文時代の死者は、多くが手足を伸ばした伸展葬で葬られた。","a":0,"e":"誤り：伸展葬。正しくは縄文時代には手足を折り曲げて葬る屈葬が多かった。死者の霊が災いをもたらすのを恐れたためとする見方がある。縄文時代には成人の儀礼などとして抜歯の風習もみられた。","m":"縄文の葬法は手足を曲げる屈葬"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0037","lv":1,"s":"古墳時代の代表的な墳形は、円形と方形を組み合わせた前方後円墳である。","a":1,"e":"前方後円墳は円形と方形の墳丘を組み合わせた形で、3世紀中ごろから後半に近畿で出現し、やがて東北南部から九州まで広がった。同じ形の古墳の広がりは、ヤマト政権の勢力範囲を示す。","m":"前方後円墳の広がり＝政権の広がり"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0038","lv":1,"s":"大阪府堺市にある大仙陵古墳（伝仁徳天皇陵）は、日本最大規模の前方後円墳である。","a":1,"e":"大仙陵古墳は大阪府堺市の百舌鳥古墳群にあり、墳丘の長さが400メートルを大きく超える日本最大の古墳である。5世紀には河内に巨大古墳が集中し、大王の強い権力を物語る。","m":"最大は百舌鳥の大仙陵古墳"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0039","lv":1,"s":"倭の五王は、唐の皇帝に使者を送って称号を求めた。","a":0,"e":"誤り：唐。正しくは5世紀の倭の五王は中国南朝の宋に使いを送り、朝鮮半島南部での立場を有利にするため称号を求めた。唐の建国は618年で、五王の時代よりずっと後である。","m":"倭の五王は南朝の宋へ"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0040","lv":1,"s":"古墳の墳丘の上や周囲には、円筒や人物・家などの形の埴輪が並べられた。","a":1,"e":"埴輪は古墳の墳丘やまわりに並べられた素焼きの焼き物で、円筒埴輪と、家・器財・人物・動物などをかたどった形象埴輪がある。墳丘を区画し、葬送の儀礼の場を飾る役割をもった。","m":"埴輪は円筒埴輪と形象埴輪"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0041","lv":1,"s":"古墳の副葬品は、前期には馬具や武具が中心で、後期には鏡や玉などが中心だった。","a":0,"e":"誤り：前期が馬具・武具、後期が鏡や玉。正しくは前期の副葬品は銅鏡・玉・腕輪形石製品など呪術的な宝器が中心で、中期以降は鉄製の武器・武具や馬具が増え、被葬者の武人的な性格が強まった。","m":"前期は鏡と玉、のちに馬具と武具"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0042","lv":1,"s":"朝鮮半島から渡来した人々は、漢字や儒教、須恵器の製作などの新しい技術や文化を伝えた。","a":1,"e":"朝鮮半島から渡来した人々は、鉄器の生産、機織り、須恵器の製作などの技術や、漢字・儒教を伝えた。ヤマト政権は彼らを韓鍛冶部・錦織部・陶作部などの集団に組織して、技術を役立てた。","m":"渡来人が伝えた技術と文字"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0043","lv":1,"s":"ヤマト政権の首長は大王とよばれ、各地の豪族を従えた。","a":1,"e":"ヤマト政権は3世紀後半ごろ近畿の有力豪族を中心に形成された政治連合で、その首長は大王とよばれた。5世紀には大王の権力が強まり、関東から九州までの地方豪族を従えるようになった。","m":"天皇の称号より前は「大王」"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0044","lv":1,"s":"氏姓制度では、蘇我氏や平群氏などの有力豪族が連の姓を与えられ、政権の中枢を担った。","a":0,"e":"誤り：蘇我氏・平群氏が連。正しくは蘇我・平群・葛城など地名を氏の名とする有力豪族は臣、大伴・物部など職務を氏の名とする豪族は連の姓をもった。その最有力者が大臣・大連となった。","m":"地名の臣（蘇我）、職務の連（物部）"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0045","lv":1,"s":"氏姓制度では、豪族が同族集団の氏に属し、大王から政治的地位を示す姓を与えられた。","a":1,"e":"氏は血縁などで結ばれた豪族の集団で、氏上が氏人を率いた。姓は臣・連・君・直など大王から与えられた称号で、氏の家柄や地位を示し、ヤマト政権の身分秩序を形づくった。","m":"氏は集団、姓は家柄の称号"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0046","lv":1,"s":"埼玉県の稲荷山古墳から出土した鉄剣には、ワカタケル大王の名とみられる文字が刻まれていた。","a":1,"e":"稲荷山古墳の鉄剣銘には「辛亥年」と「獲加多支鹵大王」の文字があり、471年に雄略天皇にあたる大王に仕えた人物が作らせたと考えられる。5世紀後半に王権の影響が関東に及んでいたことを示す。","m":"稲荷山の鉄剣は埼玉、辛亥年","y":471},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0047","lv":1,"s":"527年、筑紫国造磐井が新羅と結んでヤマト政権に反乱を起こしたが、鎮圧された。","a":1,"e":"筑紫国造磐井は新羅と結び、朝鮮半島へ向かうヤマト政権の軍の進路をふさいで反乱を起こしたが、翌年に鎮圧された。乱の後、政権は九州北部に屯倉を置くなど地方支配を強めた。","m":"527年、筑紫の磐井が新羅と結ぶ","y":527},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0048","lv":1,"s":"高句麗の好太王碑には、倭が朝鮮半島に進出して高句麗と戦ったことが記されている。","a":1,"e":"好太王碑は414年に高句麗が建てた碑で、4世紀末から5世紀初めにかけて倭の軍が朝鮮半島に渡り、高句麗と戦ったことを記す。倭が鉄資源などを求めて半島に深く関わっていたことがわかる。","m":"高句麗の好太王碑に倭との戦い","y":414},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0049","lv":1,"s":"ヤマト政権の成立期には、古墳はまだ築かれず、権力者は大型の銅鐸で権威を示した。","a":0,"e":"誤り：古墳が築かれず銅鐸で権威を示した。正しくはヤマト政権の成立期には大型の前方後円墳が築かれ、古墳が権力の象徴となった。銅鐸は弥生時代の祭器で、古墳時代には作られなくなった。","m":"権威の象徴は銅鐸から古墳へ"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0050","lv":2,"s":"倭王武は478年に宋の皇帝へ上表文を送り、高句麗の無道をうったえた。","a":1,"e":"倭王武は478年に宋の皇帝へ上表文を送り、祖先が東西の諸国を平定してきたことを述べて、高句麗の圧迫を訴えた。武は雄略天皇にあたり、ワカタケル大王と同じ人物とみられる。","m":"478年、倭王武の上表文","y":478},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0051","lv":2,"s":"倭の五王の名は、讃・珍・済・興・武であり、最後の王の武は雄略天皇に当たると考えられている。","a":1,"e":"『宋書』倭国伝には、5世紀に宋へ使いを送った讃・珍・済・興・武の5人の倭王が記される。済・興・武は允恭・安康・雄略天皇にあたるとされるが、讃と珍にあたる天皇については説が分かれる。","m":"五王は讃・珍・済・興・武"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0052","lv":2,"s":"ヤマト政権の直轄地は屯倉とよばれ、その耕作民は田部とよばれた。","a":1,"e":"屯倉は大王が直接支配した土地で、そこを耕す人々を田部といった。これに対して豪族の私有地は田荘、私有民は部曲とよばれ、大化改新では公地公民の方針のもとで廃止がめざされた。","m":"屯倉と田部は大王の土地と民"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0053","lv":2,"s":"ヤマト政権は、地方の有力豪族を国造に任命し、その地域の支配を認めた。","a":1,"e":"6世紀ごろ、ヤマト政権は服属した地方豪族を国造に任じ、その地方の支配を認めた。国造は特産物を貢ぎ、子女を舎人や采女として大王に仕えさせた。国造の支配域はのちの郡のもとになった。","m":"地方豪族＝国造、貢納と奉仕"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0054","lv":2,"s":"人物や馬などをかたどった埴輪が最も盛んに作られたのは、古墳時代前期である。","a":0,"e":"誤り：古墳時代前期。正しくは前期の埴輪は円筒埴輪や家形埴輪などが中心で、人物・馬などの形象埴輪は中期から後期にかけて盛んに作られた。埴輪の人物像から当時の服装や風俗がわかる。","m":"人物埴輪は中期〜後期"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0055","lv":2,"s":"古墳の埋葬施設は、前期の竪穴式石室から、後期には横穴式石室へと変化した。","a":1,"e":"前期・中期の古墳は、墳丘の上から棺を納めて封じる竪穴式石室が中心だった。6世紀には入口と通路をもつ横穴式石室が広まり、家族などをあとから葬る追葬ができるようになった。","m":"竪穴式から追葬できる横穴式へ"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0056","lv":2,"s":"6世紀以降、小規模な古墳が密集してつくられる群集墳は、天皇家だけが築造した。","a":0,"e":"誤り：天皇家だけ。正しくは6世紀以降の群集墳は、小規模な円墳などが狭い範囲に密集したもので、有力農民層まで古墳を築いた。ヤマト政権が彼らを直接支配に組み込もうとしたことを示すとされる。","m":"群集墳は有力農民の墓"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0057","lv":2,"s":"ヤマト政権は、鉄資源を求めて朝鮮半島南部の新羅と同盟し、百済と対立した。","a":0,"e":"誤り：新羅と同盟し百済と対立。正しくは倭は鉄資源を確保するため伽耶諸国や百済と結び、高句麗・新羅と対抗した。伽耶は鉄の産地で、562年までに新羅に併合された。","m":"倭は百済・伽耶と結ぶ"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0058","lv":2,"s":"渡来人のうち秦氏は養蚕や機織を、漢氏は文書の作成や記録などを担当した。","a":1,"e":"ヤマト政権は渡来人を技術や職務ごとの集団に組織した。秦氏は養蚕・機織り、東漢氏は文筆や記録・財政を担当したと伝えられ、文字を扱う史部として政権の実務を支えた者も多い。","m":"秦は機織り、漢は文筆"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0059","lv":2,"s":"古墳時代には、熱湯に手を入れさせ、やけどの有無で真偽を判断する盟神探湯が行われた。","a":1,"e":"古墳時代の人々は自然の神々を祭り、豊作を祈る祈年の祭りや収穫を感謝する新嘗の祭りを行った。鹿の骨を焼いて吉凶を占う太占や、裁判の手段とされた盟神探湯などの呪術的風習もあった。","m":"盟神探湯と太占は古墳の呪術"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0060","lv":2,"s":"百済の王から仏教が公式に伝えられたのは、推古天皇の時代である。","a":0,"e":"誤り：推古天皇の時代。正しくは仏教は6世紀の欽明天皇のとき、百済の聖明王から仏像・経典が贈られて公式に伝わった（538年説と552年説がある）。推古朝は仏教が保護され寺院が建てられた時期である。","m":"仏教公伝は欽明朝、百済から"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0061","lv":2,"s":"ヤマト政権の有力者は、大和盆地から河内平野に勢力を伸ばし、5世紀には河内に巨大古墳を営んだ。","a":1,"e":"5世紀には大阪平野に百舌鳥古墳群や古市古墳群が営まれ、大仙陵古墳や誉田御廟山古墳などの巨大古墳が築かれた。大王の権力が強まり、河内にも拠点を置いたと考えられている。","m":"5世紀の巨大古墳は河内"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0062","lv":3,"s":"熊本県の江田船山古墳から出土した大刀にも、ワカタケル大王を示すとされる銘文がある。","a":1,"e":"熊本県の江田船山古墳の大刀銘にも、ワカタケル大王と読める文字がある。埼玉県の稲荷山古墳の鉄剣とあわせ、5世紀後半には大王の勢力が関東から九州中部まで及んでいたことがわかる。","m":"東は稲荷山、西は江田船山"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0063","lv":3,"s":"7世紀に入っても、大王の墓として大型の前方後円墳がつくられ続けた。","a":0,"e":"誤り：つくられ続けた。正しくは前方後円墳は6世紀末から7世紀初めにかけて各地でつくられなくなり、7世紀中ごろからは大王の墓として八角墳が営まれた。豪族は方墳や円墳を築いた。","m":"7世紀の大王墓は八角墳"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0064","lv":3,"s":"倭王武は、宋から「安東大将軍倭王」などの称号を得た。","a":1,"e":"倭王武は宋から、倭・新羅・任那などの諸軍事を統べる安東大将軍・倭王の称号を認められた。中国皇帝の権威を借りて、朝鮮半島南部での軍事的な立場を高めようとしたのである。","m":"武の称号は安東大将軍","y":478},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0065","lv":3,"s":"磐井の乱を鎮圧した将軍は、蘇我稲目である。","a":0,"e":"誤り：蘇我稲目。正しくは磐井の乱を鎮めたのは大連の物部麁鹿火である。蘇我稲目は6世紀中ごろの大臣で、仏教の受け入れを主張して大連の物部尾輿と対立した。","m":"磐井を討ったのは物部麁鹿火"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0066","lv":3,"s":"磐井の乱ののち、磐井の子は糟屋屯倉を大王に献上した。","a":1,"e":"『日本書紀』によれば、磐井の乱の後、磐井の子の葛子は罪をのがれるため糟屋屯倉を献上した。乱を機に、ヤマト政権は各地に屯倉を設けて地方への支配を強めていった。","m":"磐井の子が糟屋屯倉を献上"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0067","lv":3,"s":"蘇我氏は軍事を、大伴氏・物部氏は財政を担当して政権を支えた。","a":0,"e":"誤り：蘇我氏が軍事、大伴・物部氏が財政。正しくは蘇我氏は渡来人と結んで朝廷の財政を担い、大伴氏・物部氏は軍事を担った。6世紀には大伴金村が失脚し、蘇我氏と物部氏が対立した。","m":"蘇我は財政、大伴・物部は軍事"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0068","lv":3,"s":"奈良県の箸墓古墳は、3世紀に築かれた初期の大型前方後円墳の一つである。","a":1,"e":"箸墓古墳は奈良盆地東南部の纏向遺跡の近くにある墳丘長約280メートルの前方後円墳で、3世紀中ごろから後半に築かれた出現期の大型古墳である。古墳時代の始まりを示す代表例とされる。","m":"出現期の巨大古墳は箸墓"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0069","lv":3,"s":"大阪府の大仙陵古墳は、奈良盆地東南部の古墳群に属する。","a":0,"e":"誤り：奈良盆地東南部。正しくは大仙陵古墳は大阪府堺市の百舌鳥古墳群に属する5世紀の古墳である。奈良盆地東南部には箸墓古墳など出現期の古墳が集まり、巨大古墳の中心が大和から河内へ移ったことがわかる。","m":"3世紀は大和、5世紀は河内"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0070","lv":3,"s":"福岡県の沖ノ島では、4世紀後半から国家的な祭祀が行われたとされる。","a":1,"e":"玄界灘の孤島である沖ノ島では、4世紀後半から航海の安全などを祈る祭祀が行われ、銅鏡・鉄器・金製の指輪など朝鮮半島や中国から来た品も奉納された。「海の正倉院」ともよばれる。","m":"沖ノ島は航海安全の祭祀"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0071","lv":3,"s":"朝鮮半島から運ばれた鉄素材である鉄鋌は、おもに弥生時代の墓の副葬品として出土する。","a":0,"e":"誤り：弥生時代の墓。正しくは鉄鋌は5世紀ごろの古墳から多く出土する板状の鉄素材で、伽耶など朝鮮半島南部から運ばれた。倭が鉄を求めて朝鮮半島と深く結びついていたことを示す。","m":"鉄鋌は5世紀古墳の鉄素材"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0072","lv":1,"s":"古墳時代に朝鮮半島から製法が伝わった、灰色で硬い土器を土師器という。","a":0,"e":"誤り：土師器。正しくは灰色で硬い土器は須恵器で、5世紀ごろに渡来人がのぼり窯で高温で焼く技術を伝えた。土師器は弥生土器の系統を引く赤褐色の素焼きの土器である。","m":"灰色で硬い須恵器、赤い土師器"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0073","lv":2,"s":"6世紀に百済から渡来した五経博士は、仏教の経典を伝えた。","a":0,"e":"誤り：仏教の経典。正しくは五経博士は儒教の経典（易・詩・書・礼・春秋の五経）を講じる学者で、6世紀に百済から交代で派遣された。仏教の公式な伝来は欽明天皇のときの百済の聖明王による。","m":"五経博士は儒教を伝える"},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0074","lv":3,"s":"稲荷山古墳出土の鉄剣に刻まれたワカタケル大王は、仁徳天皇に比定されている。","a":0,"e":"誤り：仁徳天皇。正しくはワカタケル大王は雄略天皇に比定され、『宋書』の倭王武と同じ人物と考えられている。仁徳天皇は、大仙陵古墳に葬られたと伝えられる大王である。","m":"ワカタケル＝雄略＝倭王武","y":471},{"f":"古代","t":"ヤマト政権と古墳","ref":"KO-0075","lv":2,"s":"仏教の受け入れをめぐり、蘇我氏は反対し、物部氏は賛成した。","a":0,"e":"誤り：蘇我氏が反対、物部氏が賛成。正しくは渡来人と結ぶ蘇我氏が受け入れに賛成し、伝統的な神の祭りを重んじる物部氏が反対した。この対立は587年に蘇我馬子が物部守屋を滅ぼして決着した。","m":"崇仏の蘇我、排仏の物部"},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0076","lv":1,"s":"推古天皇のもとで、厩戸王（聖徳太子）は大臣の蘇我馬子と協力して国家組織の整備を進めた。","a":1,"e":"崇峻天皇の死後、592年に推古天皇が即位した。天皇の甥の厩戸王は大臣の蘇我馬子と協力し、冠位十二階や憲法十七条を定めるなど、王権を中心とする国家づくりを進めた。","m":"推古・厩戸王・馬子の協力体制"},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0077","lv":1,"s":"603年、才能や功績に応じて個人に位を与える冠位十二階が定められた。","a":1,"e":"冠位十二階は徳・仁・礼・信・義・智をそれぞれ大小に分けた12の位で、冠の色などで区別した。氏ごとに世襲される姓とは別に、個人の才能や功績に応じて与え、人材の登用をめざした。","m":"603年、個人に与える冠位","y":603},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0078","lv":1,"s":"604年に定められた憲法十七条は、役人の守るべき心構えを示したものである。","a":1,"e":"憲法十七条は、豪族たちに国家に仕える役人としての心構えを説いた訓戒で、和を重んじることから始まる。仏教を敬うことや、天皇の命令に従うことを求めている。","m":"604年、役人の心得十七条","y":604},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0079","lv":1,"s":"607年に遣隋使として隋へ派遣されたのは、犬上御田鍬である。","a":0,"e":"誤り：犬上御田鍬。正しくは607年の遣隋使は小野妹子で、翌年来日した隋の使者裴世清を送って再び隋に渡った。犬上御田鍬は614年の遣隋使に加わり、630年には最初の遣唐使となった。","m":"607年は小野妹子、630年は犬上","y":607},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0080","lv":1,"s":"蘇我馬子は、日本で最初の本格的な寺院である飛鳥寺を建立した。","a":1,"e":"飛鳥寺（法興寺）は蘇我馬子が6世紀末に飛鳥に建てた氏寺で、百済から僧や寺院を造る工人・瓦工が招かれて造営された。本格的な伽藍をもつ最初の寺院で、本尊の飛鳥大仏が今に残る。","m":"最初の本格寺院＝馬子の飛鳥寺"},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0081","lv":1,"s":"聖徳太子が奈良の斑鳩に建てた寺は、飛鳥寺である。","a":0,"e":"誤り：飛鳥寺。正しくは厩戸王が斑鳩に建てたのは法隆寺（斑鳩寺）で、難波には四天王寺を建てたと伝えられる。『日本書紀』は法隆寺が670年に焼けたと記し、現在の建物はその後の再建とされる。","m":"斑鳩の法隆寺、難波の四天王寺"},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0082","lv":1,"s":"645年、中大兄皇子と中臣鎌足らは、蘇我蝦夷・入鹿を倒した。","a":1,"e":"645年、中大兄皇子は中臣鎌足や蘇我倉山田石川麻呂と結んで蘇我入鹿を殺害し、父の蝦夷も自害して蘇我氏の本家は滅んだ（乙巳の変）。孝徳天皇が即位し、政治改革が始まった。","m":"645年、乙巳の変で蘇我本家滅ぶ","y":645},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0083","lv":1,"s":"推古朝を中心とする7世紀前半の仏教文化は、白鳳文化とよばれる。","a":0,"e":"誤り：白鳳文化。正しくは推古朝を中心とする7世紀前半の文化は飛鳥文化で、飛鳥寺や法隆寺、止利仏師の仏像が代表である。白鳳文化は天武・持統天皇の時代を中心とする7世紀後半の文化。","m":"推古は飛鳥文化、天武・持統は白鳳"},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0084","lv":1,"s":"大化改新では、土地と人民を国家が直接支配する公地公民制の方針が示された。","a":1,"e":"646年の改新の詔は、皇族や豪族が私有していた田荘・部曲を廃止し、土地と人民を国家が支配する公地公民の方針を示した。ただし詔の文章には、のちの時代の手が加わっているとみられる。","m":"改新の詔の柱は公地公民","y":646},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0085","lv":1,"s":"大化改新ののち、孝徳天皇は都を飛鳥から難波に移した。","a":1,"e":"乙巳の変ののち即位した孝徳天皇は、都を飛鳥から難波に移し、難波長柄豊碕宮を造営した。中大兄皇子は皇太子として実権を握り、中央集権的な国家づくりを進めた。","m":"孝徳天皇と難波長柄豊碕宮","y":645},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0086","lv":1,"s":"663年、倭は百済の復興を助けるため唐・新羅の連合軍と戦い、白村江で大敗した。","a":1,"e":"660年に百済が唐・新羅に滅ぼされると、倭は百済の復興を助けるため大軍を送ったが、663年に白村江で唐・新羅の連合軍に大敗した。以後、倭は朝鮮半島から手を引き、国内の防衛と体制整備を急いだ。","m":"663年、白村江で唐・新羅に敗北","y":663},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0087","lv":1,"s":"中臣鎌足は、死の直前に天智天皇から橘の姓を与えられた。","a":0,"e":"誤り：橘の姓。正しくは鎌足は669年に亡くなる直前、大織冠とともに藤原の姓を与えられ、藤原氏の祖となった。橘の姓は8世紀に県犬養三千代とその子の葛城王（橘諸兄）が与えられたもの。","m":"鎌足は藤原、諸兄は橘","y":669},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0088","lv":1,"s":"中大兄皇子は667年、都を近江大津宮に移した。","a":1,"e":"白村江で敗れた後、中大兄皇子は唐・新羅の侵攻に備えて西日本の防備を固め、667年に都を飛鳥から琵琶湖のほとりの近江大津宮に移した。翌年ここで即位して天智天皇となった。","m":"667年、近江大津宮へ","y":667},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0089","lv":2,"s":"推古天皇は、史上初の女性の天皇であった。","a":1,"e":"推古天皇は欽明天皇の娘で、敏達天皇の皇后だった。592年に飛鳥の豊浦宮で即位した最初の女性の天皇で、こののち7〜8世紀には皇極（斉明）・持統など女性の天皇が続いた。","m":"初の女帝推古、592年即位","y":592},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0090","lv":2,"s":"大化改新の新政府では、中臣鎌足が右大臣に任じられた。","a":0,"e":"誤り：右大臣。正しくは中臣鎌足は内臣として中大兄皇子を補佐した。新政府の左大臣は阿倍内麻呂、右大臣は乙巳の変に協力した蘇我倉山田石川麻呂で、実権は皇太子の中大兄皇子が握った。","m":"鎌足は内臣、石川麻呂は右大臣","y":645},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0091","lv":2,"s":"憲法十七条には、仏教を厚く敬うことが定められている。","a":1,"e":"憲法十七条の第2条は「篤く三宝を敬え」とし、仏・法（教え）・僧の三つを敬うよう説く。第3条では天皇の命令に必ず従うよう求めており、仏教の思想と王権中心の国家観が組み合わされている。","m":"第二条「篤く三宝を敬え」","y":604},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0092","lv":2,"s":"607年の遣隋使の国書には「日出づる処の天子」とあり、隋の皇帝は無礼として不快を示した。","a":1,"e":"『隋書』倭国伝によると、607年の国書は倭王を「日出づる処の天子」と記し、煬帝は無礼だと不快を示した。倭は臣従しない立場を示そうとしたとみられ、隋は高句麗と争っていたため国交は続いた。","m":"日出づる処の国書に煬帝不快","y":607},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0093","lv":2,"s":"高向玄理・旻・南淵請安は、630年の最初の遣唐使に従って唐に渡った留学生・留学僧である。","a":0,"e":"誤り：630年の遣唐使。正しくは彼らは608年、裴世清の帰国に同行した小野妹子の遣隋使とともに隋に渡った。長く中国に滞在して隋の滅亡と唐の成立を見聞し、帰国後の改新政治に影響を与えた。","m":"玄理・旻・請安は608年に隋へ","y":608},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0094","lv":2,"s":"法隆寺金堂の釈迦三尊像は、渡来系の仏師鞍作鳥（止利仏師）の作とされる。","a":1,"e":"法隆寺金堂の釈迦三尊像は、623年に鞍作鳥（止利仏師）が造ったと光背の銘文に記される。中国の北魏の様式を受けた、正面から見ることを重んじる左右対称で厳しい表情の金銅像である。","m":"釈迦三尊は止利、北魏様式","y":623},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0095","lv":2,"s":"蘇我入鹿は、643年に聖徳太子の子である山背大兄王の一族を滅ぼした。","a":1,"e":"蘇我入鹿は643年、厩戸王の子で皇位継承の有力候補だった山背大兄王を斑鳩に攻め、一族を自害に追い込んだ。この専横が中大兄皇子らの反発を招き、2年後の乙巳の変につながった。","m":"643年、入鹿が山背大兄王を討つ","y":643},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0096","lv":2,"s":"646年の改新の詔には、戸籍・計帳を作り、班田収授を行う方針が含まれていた。","a":1,"e":"改新の詔は、公地公民、地方の行政区画と軍事・交通の制度、戸籍・計帳の作成と班田収授、新しい税制の4か条からなる。いずれも、のちの律令制で整えられる制度の方向を示した。","m":"改新の詔：戸籍・計帳と班田","y":646},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0097","lv":2,"s":"大化改新ののち、高向玄理と旻は国博士に任じられ、政治顧問となった。","a":1,"e":"国博士は改新政府の政治顧問で、隋・唐に長く留学した高向玄理と僧の旻が任じられた。彼らが持ち帰った中国の政治制度の知識が、中央集権的な国家づくりに生かされた。","m":"改新の国博士は玄理と旻","y":645},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0098","lv":3,"s":"大化改新後に置かれた地方の行政単位は、7世紀後半の木簡には「郡」と記されている。","a":0,"e":"誤り：「郡」。正しくは藤原宮跡などから出土した7世紀後半の木簡には「評」と書かれ、701年の大宝律令から「郡」の字に改められたことがわかった。改新の詔の文章に後世の手が加わったことを示す。","m":"大宝律令までは「評」","y":701},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0099","lv":2,"s":"白村江の戦いののち、九州北部に防人が置かれ、水城が築かれた。","a":1,"e":"白村江の敗戦後、唐・新羅の侵攻に備えて、対馬・壱岐・筑紫に防人とのろし台（烽）が置かれた。664年には大宰府の北に、土塁と堀からなる水城が築かれた。","m":"白村江の後に防人・烽・水城","y":664},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0100","lv":2,"s":"斉明天皇は百済救援の軍を指揮するため九州に赴き、筑紫の朝倉宮で亡くなった。","a":1,"e":"斉明天皇は、660年に滅んだ百済の復興を支援するため、661年に中大兄皇子とともに九州へ下ったが、筑紫の朝倉宮で亡くなった。倭はその後も出兵を続け、663年の白村江の戦いに至った。","m":"斉明は朝倉宮で没、661年","y":661},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0101","lv":2,"s":"天智天皇の時代の670年には、初めての全国的な戸籍である庚午年籍が作られた。","a":1,"e":"庚午年籍は天智天皇が670年に作らせた最初の全国的な戸籍で、氏姓を確かめる根本台帳として永久保存とされた。律令制の戸籍は6年ごとに作り直されたが、庚午年籍だけは特別に扱われた。","m":"670年の庚午年籍は永久保存","y":670},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0102","lv":2,"s":"中大兄皇子は斉明天皇の死後、ただちに即位し、近江大津宮で政治を行った。","a":0,"e":"誤り：ただちに即位。正しくは中大兄皇子は斉明天皇の死後も長く即位せず、皇太子のまま政務をとる称制を続けた。近江大津宮に移った翌年の668年に即位して天智天皇となった。","m":"称制を経て668年に天智即位","y":668},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0103","lv":3,"s":"607年の遣隋使に対し、隋の側からは文帝の使者として裴世清が来日した。","a":0,"e":"誤り：文帝。正しくは608年に小野妹子とともに来日した裴世清は煬帝の使者である。文帝は隋を建てた初代皇帝で600年の遣使のときの皇帝、煬帝はその子の2代皇帝である。","m":"裴世清は2代煬帝の使者","y":608},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0104","lv":3,"s":"推古朝に、厩戸王と蘇我馬子は『天皇記』『国記』を編んだと伝えられる。","a":1,"e":"『日本書紀』によれば、620年に厩戸王と蘇我馬子は『天皇記』『国記』などの歴史書を編んだ。乙巳の変の際に蝦夷の邸宅とともに焼かれたが、『国記』は運び出されたと伝えられる。いずれも現存しない。","m":"620年、天皇記・国記の編纂","y":620},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0105","lv":3,"s":"乙巳の変の際、蘇我入鹿が暗殺された場所は、難波長柄豊碕宮である。","a":0,"e":"誤り：難波長柄豊碕宮。正しくは蘇我入鹿が殺されたのは皇極天皇の飛鳥板蓋宮で、朝鮮諸国の使いを迎える儀式の場だった。難波長柄豊碕宮は乙巳の変の後に孝徳天皇が営んだ宮である。","m":"入鹿暗殺は飛鳥板蓋宮","y":645},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0106","lv":3,"s":"皇極天皇は孝徳天皇に譲位したのち、再び即位して斉明天皇となった。","a":1,"e":"皇極天皇は乙巳の変の直後に弟の孝徳天皇へ譲位した。孝徳天皇が難波で亡くなると、655年に再び即位して斉明天皇となった。退位した天皇が再び位につくことを重祚といい、これが最初の例である。","m":"皇極が重祚して斉明に（初例）","y":655},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0107","lv":3,"s":"白村江の戦いは、朝鮮半島南部の洛東江の河口付近で行われた。","a":0,"e":"誤り：洛東江。正しくは白村江は朝鮮半島西部を流れる錦江の河口付近で、百済の旧都に近い。洛東江は半島南東部を流れる川で、その流域には伽耶諸国があった。","m":"白村江は錦江の河口付近","y":663},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0108","lv":3,"s":"664年の甲子の宣では、冠位を26階に増やし、氏上を定めるとともに豪族の領有民を確認した。","a":1,"e":"白村江の敗戦後、中大兄皇子は豪族の協力を得るため、664年に冠位を26階とし、各氏の代表者である氏上を定めた。豪族の領有民（民部・家部）も認め、豪族を国家の秩序の中に組み込もうとした。","m":"664年の甲子の宣、冠位26階","y":664},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0109","lv":3,"s":"大野城や基肄城は、白村江の戦いの後に対馬に築かれた朝鮮式山城である。","a":0,"e":"誤り：対馬。正しくは大野城・基肄城は大宰府の北と南の山に築かれた朝鮮式山城で、亡命した百済の貴族が築造を指導した。対馬には金田城、瀬戸内海から畿内にかけては屋島城や高安城が置かれた。","m":"大野・基肄は大宰府を守る","y":665},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0110","lv":3,"s":"京都の広隆寺は、蘇我馬子が建てた氏寺である。","a":0,"e":"誤り：蘇我馬子。正しくは京都の広隆寺は渡来系の秦河勝が建てたと伝わる寺で、木造の弥勒菩薩半跏思惟像で知られる。蘇我馬子の氏寺は飛鳥の飛鳥寺（法興寺）である。","m":"広隆寺は秦河勝の寺、弥勒像"},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0111","lv":3,"s":"中宮寺の半跏思惟像は、北魏様式の影響を受けた釈迦三尊像として知られる。","a":0,"e":"誤り：釈迦三尊像。正しくは中宮寺の半跏思惟像は弥勒菩薩（寺伝では如意輪観音）とされる木像で、やわらかな表情をもつ。北魏様式の釈迦三尊像は、法隆寺金堂にある止利仏師の作である。","m":"中宮寺は弥勒の半跏思惟像"},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0112","lv":1,"s":"蘇我馬子は587年に物部守屋を滅ぼし、592年には推古天皇を暗殺させた。","a":0,"e":"誤り：推古天皇。正しくは592年に蘇我馬子が暗殺させたのは崇峻天皇で、その後に推古天皇が即位した。馬子は物部氏を滅ぼしたのち、大臣として推古朝の政治を支えた。","m":"馬子が殺させたのは崇峻天皇","y":592},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0113","lv":3,"s":"『隋書』によれば、600年に倭の使者が隋に派遣されたが、この遣使は『日本書紀』には記されていない。","a":1,"e":"『隋書』倭国伝は600年に倭王の使いが来たと記すが、『日本書紀』には607年の小野妹子の派遣が最初の遣隋使として書かれている。600年の遣使のときの隋の皇帝は初代の文帝である。","m":"最初の遣隋使600年は『隋書』だけ","y":600},{"f":"古代","t":"推古朝と大化改新","ref":"KO-0114","lv":3,"s":"憲法十七条の全文は、『続日本紀』に収められている。","a":0,"e":"誤り：『続日本紀』。正しくは憲法十七条の全文は720年に完成した『日本書紀』の推古天皇12年（604年）の条に載る。『続日本紀』は文武天皇から桓武天皇の時代までを記した、六国史の2番目の正史。","m":"十七条の出典は日本書紀","y":604},{"f":"古代","t":"律令国家の成立","ref":"KO-0115","lv":1,"s":"672年、大海人皇子は大友皇子を破り、のちに即位して天武天皇となった。","a":1,"e":"天智天皇の死後、弟の大海人皇子は吉野から東国に入って兵を集め、天智の子の大友皇子が率いる近江朝廷を倒した（壬申の乱）。東国の豪族の支持が勝因で、即位した天武天皇の権威は大いに高まった。","m":"672年壬申の乱、大海人が勝利","y":672},{"f":"古代","t":"律令国家の成立","ref":"KO-0116","lv":1,"s":"壬申の乱に勝った大海人皇子は、近江大津宮で即位して天武天皇となった。","a":0,"e":"誤り：近江大津宮。正しくは天武天皇は都を飛鳥に戻し、673年に飛鳥浄御原宮で即位した。近江大津宮は天智天皇の都で、壬申の乱で敗れた大友皇子の近江朝廷があった場所である。","m":"天武は飛鳥浄御原宮で即位","y":673},{"f":"古代","t":"律令国家の成立","ref":"KO-0117","lv":1,"s":"694年、持統天皇は唐の都城制にならった本格的な都、藤原京に遷都した。","a":1,"e":"藤原京は大和三山に囲まれた地に造られた、条坊制をもつ日本最初の本格的な都城で、持統天皇が694年に遷都した。持統・文武・元明の3代の都となり、710年に平城京へ移された。","m":"694年、持統の藤原京","y":694},{"f":"古代","t":"律令国家の成立","ref":"KO-0118","lv":1,"s":"律令制の地方区分で、都の周辺の国々は七道とよばれた。","a":0,"e":"誤り：七道。正しくは都の周辺の大和・山城・摂津・河内などの国々は畿内とよばれ、それ以外の地方は東海道・東山道・北陸道・山陰道・山陽道・南海道・西海道の七道に分けられた。","m":"都の周辺は畿内、他は七道","y":710},{"f":"古代","t":"律令国家の成立","ref":"KO-0119","lv":1,"s":"701年に完成した大宝律令は、刑部親王や藤原不比等らによって編まれた。","a":1,"e":"大宝律令は刑部親王や藤原不比等らが編纂し、701年に完成した。刑法の律と行政法の令がそろった最初の法典で、これにより天皇を中心とする中央集権的な国家のしくみが整った。","m":"701年大宝律令、刑部親王と不比等","y":701},{"f":"古代","t":"律令国家の成立","ref":"KO-0120","lv":2,"s":"律令制のもとで、京の行政・警察などをつかさどる役所として弾正台が置かれた。","a":0,"e":"誤り：弾正台。正しくは京の行政・警察・司法は左京職・右京職がつかさどった。弾正台は役人の不正や風俗を取り締まる監察の役所で、太政官の八省とは別に置かれた。","m":"京は京職、監察は弾正台","y":701},{"f":"古代","t":"律令国家の成立","ref":"KO-0121","lv":1,"s":"律令のうち、律は刑罰についての規定、令は行政などについての規定である。","a":1,"e":"律は今の刑法にあたり、令は役所の組織や役人の勤務、税や土地の制度などを定めた。律令の制定後に出された追加・修正の法令を格、施行のための細かい規則を式という。","m":"律は刑法、令は行政法"},{"f":"古代","t":"律令国家の成立","ref":"KO-0122","lv":1,"s":"中央の官制は、祭祀を担当する神祇官と、政務を担当する太政官の二官のもとに八省が置かれた。","a":1,"e":"中央には神々の祭りを担う神祇官と、国政を統轄する太政官の二官が置かれた。太政官の下には中務・式部・治部・民部・兵部・刑部・大蔵・宮内の八省があって実務を分担した。","m":"二官（神祇・太政）と八省"},{"f":"古代","t":"律令国家の成立","ref":"KO-0123","lv":1,"s":"地方は国・郡・里に分けられ、国司には現地の有力豪族が任命された。","a":0,"e":"誤り：現地の有力豪族。正しくは国司は中央の貴族が任期を限って派遣され、国府（国衙）で政務をとった。現地の有力豪族（旧国造など）が任じられ、終身で郡を治めたのは郡司である。","m":"国司は中央から派遣、郡司は地元"},{"f":"古代","t":"律令国家の成立","ref":"KO-0124","lv":1,"s":"戸籍にもとづき、6歳以上の男女に口分田が班給され、死ぬと国に返された。","a":1,"e":"班田収授法では、6年ごとに作られる戸籍にもとづき、6歳以上の男女に口分田を与え、死ぬと国に返させた。人々の生活を保障するとともに、租を確実に取るためのしくみである。","m":"6歳以上に口分田、死後収公"},{"f":"古代","t":"律令国家の成立","ref":"KO-0125","lv":1,"s":"口分田は私有地であり、自由に売買することができた。","a":0,"e":"誤り：私有地で自由に売買できた。正しくは口分田は国から貸し与えられた田で、売買は禁じられ、死後には収公された。土地の私有が認められるのは三世一身法や墾田永年私財法による墾田からである。","m":"口分田は売買禁止、死後収公"},{"f":"古代","t":"律令国家の成立","ref":"KO-0126","lv":1,"s":"調と庸は、人々が都まで運んで納める税で、運ぶ役は運脚とよばれた。","a":1,"e":"調は絹・布や地方の特産物を、庸は労役の代わりに布などを納める税で、どちらも成人男子に課され中央政府の財源となった。都まで運ぶ運脚も農民の負担で、道中の食料も自分で用意した。","m":"調・庸は都まで農民が運脚"},{"f":"古代","t":"律令国家の成立","ref":"KO-0127","lv":1,"s":"律令制のもとで、貴族や官人は位階に応じた官職に任じられた。","a":1,"e":"律令制では、役人は位階を与えられ、その位にふさわしい官職に任じられる官位相当制がとられた。位階に応じて田や封戸・禄などが支給され、上級貴族ほど経済的な特権が大きかった。","m":"位階に対応する官職＝官位相当制"},{"f":"古代","t":"律令国家の成立","ref":"KO-0128","lv":2,"s":"租は、収穫した稲を都に運んで中央政府に納める税である。","a":0,"e":"誤り：都に運んで中央政府に納める。正しくは租は口分田などの収穫から稲を納める税で、諸国の正倉に蓄えられ、主に地方の財源となった。都まで運ばれて中央の財源となったのは調・庸である。","m":"租は地方へ、調・庸は都へ"},{"f":"古代","t":"律令国家の成立","ref":"KO-0129","lv":2,"s":"庸は、歳役10日の代わりに布などを納める税である。","a":1,"e":"庸は都で年10日働く歳役の代わりに、布（庸布）などを納める税で、成年男子に課された。調とともに都へ運ばれて中央の財源となり、衛士や仕丁の食料などにあてられた。","m":"庸は歳役10日の代わり"},{"f":"古代","t":"律令国家の成立","ref":"KO-0130","lv":2,"s":"雑徭は、国司のもとで年に10日以内の労役を課すものである。","a":0,"e":"誤り：年に10日以内。正しくは雑徭は国司が国内の土木工事などに農民を使う労役で、年60日以内とされた。年10日の労役は歳役で、実際にはその代わりに庸を納めた。","m":"雑徭60日、歳役10日"},{"f":"古代","t":"律令国家の成立","ref":"KO-0131","lv":2,"s":"太政官は、太政大臣・左大臣・右大臣・大納言などの公卿が合議して政務を行った。","a":1,"e":"太政官では太政大臣・左大臣・右大臣・大納言などの公卿が合議して重要な政務を決め、天皇の裁可を得て実施した。太政大臣は適任者がいなければ置かない官とされ、ふだんは左大臣が中心となった。","m":"太政官は公卿の合議で決定"},{"f":"古代","t":"律令国家の成立","ref":"KO-0132","lv":2,"s":"大宰府は、九州一帯を統轄するとともに、外交や防衛を担当した。","a":1,"e":"大宰府は筑前に置かれ、西海道（九州）の諸国を統轄するとともに、外国使節の応接や沿岸の防衛を担当した。「遠の朝廷」とよばれ、のちには菅原道真がここに左遷された。","m":"大宰府は九州統轄と外交・防衛"},{"f":"古代","t":"律令国家の成立","ref":"KO-0133","lv":2,"s":"律令制のもとで、兵士の一部は衛士として都の警備にあたり、一部は防人として九州の防衛にあたった。","a":1,"e":"律令制では成年男子の3〜4人に1人が兵士とされ、諸国の軍団で訓練を受けた。その一部は衛士として1年間宮城の警備にあたり、また防人として3年間九州北部の防衛についた。","m":"都の衛士、九州の防人"},{"f":"古代","t":"律令国家の成立","ref":"KO-0134","lv":2,"s":"蔭位の制により、高い位をもつ者の子や孫は、一定の位階を得られる特権を持った。","a":1,"e":"蔭位の制では、五位以上の貴族の子と三位以上の貴族の孫は、21歳になると親や祖父の位階に応じた位を与えられた。上級貴族の子孫は高い地位につきやすく、貴族の家柄が固定化していった。","m":"蔭位で貴族の子孫を優遇"},{"f":"古代","t":"律令国家の成立","ref":"KO-0135","lv":2,"s":"氏姓制度を再編する八色の姓は、天智天皇が制定した。","a":0,"e":"誤り：天智天皇。正しくは八色の姓は684年に天武天皇が定め、真人・朝臣・宿禰など8つの姓で豪族を新たに序列化した。皇族に近い氏を上位に置き、天皇中心の身分秩序を作った。","m":"684年八色の姓は天武","y":684},{"f":"古代","t":"律令国家の成立","ref":"KO-0136","lv":2,"s":"690年に持統天皇のもとで作られた戸籍は、庚午年籍である。","a":0,"e":"誤り：庚午年籍。正しくは690年の戸籍は庚寅年籍で、飛鳥浄御原令にもとづいて作られ、以後6年ごとの造籍と班田が行われるようになった。庚午年籍は670年に天智天皇が作った戸籍。","m":"670庚午（天智）、690庚寅（持統）","y":690},{"f":"古代","t":"律令国家の成立","ref":"KO-0137","lv":2,"s":"飛鳥浄御原令は、持統天皇のときに施行された。","a":1,"e":"飛鳥浄御原令は天武天皇が編纂を始め、天武の死後の689年に持統天皇が施行した。令だけで律は施行されなかったとみられ、律と令がそろうのは701年の大宝律令である。","m":"浄御原令は689年、持統が施行","y":689},{"f":"古代","t":"律令国家の成立","ref":"KO-0138","lv":2,"s":"戸籍は10年ごとに作られ、6年ごとに班田が行われた。","a":0,"e":"誤り：10年ごと。正しくは戸籍は6年ごとに作られ、班田もそれにあわせて6年ごとに行われた。一方、調・庸を取るための台帳である計帳は毎年作られた。","m":"戸籍は6年ごと、計帳は毎年"},{"f":"古代","t":"律令国家の成立","ref":"KO-0139","lv":2,"s":"賤民には、陵戸・官戸・公奴婢・家人・私奴婢の五種があり、五色の賤とよばれた。","a":1,"e":"律令制の身分は良民と賤民に分かれ、賤民は陵戸・官戸・家人・公奴婢・私奴婢の五色の賤とされた。奴婢は売買の対象とされ、口分田も良民より少なかった。賤民は人口の数％程度とみられる。","m":"賤民は五色の賤（奴婢など）"},{"f":"古代","t":"律令国家の成立","ref":"KO-0140","lv":3,"s":"口分田の面積は、良民の男子が2段、女子はその3分の2であった。","a":1,"e":"口分田は良民の男子に2段、女子にはその3分の2の1段120歩が与えられた。家人・私奴婢には良民の男女それぞれの3分の1が与えられた。班田の年に6歳以上の者が対象となった。","m":"男2段、女はその3分の2"},{"f":"古代","t":"律令国家の成立","ref":"KO-0141","lv":3,"s":"租の税率は、田1段につき稲2束2把で、収穫の約10％にあたった。","a":0,"e":"誤り：約10％。正しくは租は田1段につき稲2束2把で、収穫のおよそ3％にあたる比較的軽い税だった。農民にとって重かったのは、調・庸や雑徭、兵役など成年男子に課される負担である。","m":"租は1段2束2把、約3％"},{"f":"古代","t":"律令国家の成立","ref":"KO-0142","lv":3,"s":"和同開珎は708年に鋳造された。","a":1,"e":"708年、武蔵国から銅が献上されたのを機に年号を和銅と改め、和同開珎を鋳造した。政府は711年に蓄銭叙位令を出して流通を促したが、使われたのは主に京・畿内とその周辺に限られた。","m":"708年和銅、和同開珎","y":708},{"f":"古代","t":"律令国家の成立","ref":"KO-0143","lv":3,"s":"里は、50戸を1里とし、郡は100戸を基準に編成された。","a":0,"e":"誤り：郡は100戸。正しくは50戸を1里（のちに郷）とし、いくつかの里をまとめて郡、郡を集めて国とした。郡は含む里の数によって大郡から小郡まで等級が分けられた。","m":"50戸で1里、里を集めて郡"},{"f":"古代","t":"律令国家の成立","ref":"KO-0144","lv":3,"s":"大宝律令は、唐の永徽律令を手本として作られたとされる。","a":1,"e":"大宝律令は唐の永徽律令を手本としたが、日本の実情に合わせて改めた点も多い。たとえば祭祀を担う神祇官を太政官と並ぶ官庁として置いたことは、唐にはない日本独自の特徴である。","m":"唐の永徽律令を手本に"},{"f":"古代","t":"律令国家の成立","ref":"KO-0145","lv":3,"s":"八省のうち、官吏の人事・教育を担当したのは治部省である。","a":0,"e":"誤り：治部省。正しくは役人の人事や大学の運営は式部省が担当した。治部省は貴族の家柄や婚姻、仏事、外国使節の接待などを、民部省は戸籍や租税を担当した。","m":"人事は式部、仏事・外交は治部"},{"f":"古代","t":"律令国家の成立","ref":"KO-0146","lv":3,"s":"律で定められた最も重い罪は八虐とよばれ、謀反・大逆などが含まれた。","a":1,"e":"八虐は律に定めた特に重い罪で、天皇に危害を加えようとする謀反、天皇の陵墓や宮殿を壊そうとする大逆、尊属を殺す悪逆、不孝などが含まれる。貴族でも刑の減免が認められなかった。","m":"謀反・大逆などの八虐"},{"f":"古代","t":"律令国家の成立","ref":"KO-0147","lv":3,"s":"駅制では、官道に約30里（約16キロメートル）ごとに駅家が置かれ、役人の移動と通信に使われた。","a":1,"e":"都と各地の国府を結ぶ官道には、原則として約30里（約16km）ごとに駅家が置かれ、駅馬が備えられた。公用の役人が駅鈴を示して利用し、各郡には伝馬も置かれた。","m":"30里ごとに駅家と駅馬"},{"f":"古代","t":"律令国家の成立","ref":"KO-0148","lv":2,"s":"律令制のもとで、良民の男子にも女子にも同じように調・庸が課された。","a":0,"e":"誤り：女子にも調・庸。正しくは調・庸や雑徭、兵役は成年男子にだけ課された。女子にも口分田は与えられたので租は負担したが、人に課される税は男子が中心だった。","m":"調・庸・雑徭は男子だけ"},{"f":"古代","t":"律令国家の成立","ref":"KO-0149","lv":2,"s":"防人は、おもに九州の農民から選ばれて北部九州の防衛にあたった。","a":0,"e":"誤り：九州の農民。正しくは防人はおもに東国の兵士から送られ、3年交代で対馬・壱岐・筑紫などの防衛にあたった。家族と別れる防人の嘆きは、『万葉集』の防人歌に残されている。","m":"防人は東国から、万葉集に歌","y":664},{"f":"古代","t":"律令国家の成立","ref":"KO-0150","lv":3,"s":"和同開珎を鋳造させた天皇は、天武天皇である。","a":0,"e":"誤り：天武天皇。正しくは和同開珎は708年、元明天皇のときに鋳造された。天武天皇のころには富本銭が作られており、奈良県の飛鳥池遺跡から鋳造の跡が見つかった。","m":"和同開珎は元明、富本銭は天武","y":708},{"f":"古代","t":"奈良時代の政治","ref":"KO-0151","lv":1,"s":"710年に元明天皇が遷都した平城京は、唐の長安にならって造られた。","a":1,"e":"平城京は唐の都長安にならい、碁盤目状に区画する条坊制をとった都で、北部中央に天皇の住まいと役所が集まる平城宮が置かれた。元明天皇が藤原京から遷都し、784年の長岡京遷都まで主な都となった。","m":"710年、長安にならう平城京","y":710},{"f":"古代","t":"奈良時代の政治","ref":"KO-0152","lv":2,"s":"平城京では、中央を南北に通る朱雀大路の東側を右京、西側を左京とよんだ。","a":0,"e":"誤り：東側を右京、西側を左京。正しくは北の宮から南を向いた天皇から見て、東側が左京、西側が右京となる。平城京には東に張り出した外京もあり、興福寺などが置かれた。","m":"南を向いて東が左京、西が右京","y":710},{"f":"古代","t":"奈良時代の政治","ref":"KO-0153","lv":1,"s":"723年の三世一身法は、新たに開墾した土地の私有を、期限つきで認めた。","a":1,"e":"人口の増加で口分田が不足したため、723年に三世一身法が出され、開墾した田を期限つきで私有することが認められた。しかし期限が近づくと耕作がおこたられ、田は再び荒れてしまった。","m":"723年、期限つきの私有","y":723},{"f":"古代","t":"奈良時代の政治","ref":"KO-0154","lv":2,"s":"遣唐使とともに唐に渡った阿倍仲麻呂は、帰国して橘諸兄の政権で活躍した。","a":0,"e":"誤り：帰国して活躍。正しくは阿倍仲麻呂は唐の朝廷に仕え、帰国の船が難破して日本に戻れず、唐で亡くなった。ともに留学した吉備真備と僧玄昉は帰国し、橘諸兄政権で重く用いられた。","m":"仲麻呂は唐で没、真備は帰国"},{"f":"古代","t":"奈良時代の政治","ref":"KO-0155","lv":1,"s":"743年の墾田永年私財法により、開墾した土地の私有が永久に認められた。","a":1,"e":"743年の墾田永年私財法で開墾地の永久私有が認められた。政府は耕地を増やして田からの収入を確保しようとしたが、資力のある貴族・寺院が大規模に開墾し、公地公民の原則はくずれ始めた。","m":"743年、墾田の永久私有","y":743},{"f":"古代","t":"奈良時代の政治","ref":"KO-0156","lv":1,"s":"墾田永年私財法は、桓武天皇のときに出された。","a":0,"e":"誤り：桓武天皇。正しくは墾田永年私財法は743年、聖武天皇のときに出され、政権の中心は橘諸兄だった。同じ年に大仏造立の詔も出された。桓武天皇は8世紀末に長岡京・平安京へ遷都した天皇。","m":"743年は聖武天皇、大仏の詔も","y":743},{"f":"古代","t":"奈良時代の政治","ref":"KO-0157","lv":1,"s":"聖武天皇は741年に、国ごとに国分寺・国分尼寺を建てるよう命じた。","a":1,"e":"聖武天皇は疫病や反乱で社会が不安定になる中、仏教の力で国を守る鎮護国家の考えから、741年に国分寺建立の詔を出した。国分寺には金光明最勝王経を置き、僧が国家の安泰を祈った。","m":"741年国分寺の詔、鎮護国家","y":741},{"f":"古代","t":"奈良時代の政治","ref":"KO-0158","lv":1,"s":"聖武天皇が建立を命じた大仏は、西大寺に造られた。","a":0,"e":"誤り：西大寺。正しくは盧舎那仏の大仏は平城京の東大寺に造られ、東大寺は全国の国分寺の中心となる総国分寺とされた。西大寺は称徳天皇が建てた寺である。","m":"大仏は総国分寺の東大寺","y":752},{"f":"古代","t":"奈良時代の政治","ref":"KO-0159","lv":1,"s":"752年、東大寺の大仏の開眼供養が行われた。","a":1,"e":"平城京に戻った後、大仏の造立は東大寺で進められ、752年に孝謙天皇や聖武太上天皇が臨席して開眼供養が盛大に行われた。インド出身の僧菩提僊那が開眼の導師をつとめた。","m":"752年、東大寺大仏開眼","y":752},{"f":"古代","t":"奈良時代の政治","ref":"KO-0160","lv":1,"s":"行基は民衆に仏教を説き、大仏造立にも協力した僧である。","a":1,"e":"行基は民衆に仏教を説き、橋や池、用水路などの社会事業を進めた僧で、はじめは僧尼令に反するとして朝廷に弾圧された。のちに大仏造立に協力して民衆の支持を集め、大僧正に任じられた。","m":"社会事業の行基、のち大僧正"},{"f":"古代","t":"奈良時代の政治","ref":"KO-0161","lv":1,"s":"鑑真は百済から来日した僧で、唐招提寺を創建した。","a":0,"e":"誤り：百済。正しくは鑑真は唐の高僧で、渡航に何度も失敗し失明しながらも753年に来日した。東大寺に戒壇を設けて正式な授戒の制度を伝え、のちに唐招提寺を開いた。","m":"唐僧鑑真が戒律を伝える","y":753},{"f":"古代","t":"奈良時代の政治","ref":"KO-0162","lv":1,"s":"『古事記』は、稗田阿礼が誦習した内容を太安万侶が筆録して712年にまとめた。","a":1,"e":"『古事記』は、天武天皇が稗田阿礼に読み習わせた帝紀・旧辞を太安万侶が筆録し、712年に元明天皇に献上した書である。神話から推古天皇までを、漢字の音と訓を交えた文章で記す。","m":"712年古事記、阿礼と安万侶","y":712},{"f":"古代","t":"奈良時代の政治","ref":"KO-0163","lv":1,"s":"『日本書紀』は、稗田阿礼の誦習をもとに太安万侶が筆録して完成した。","a":0,"e":"誤り：『日本書紀』。正しくは稗田阿礼が読み習い太安万侶が筆録したのは『古事記』である。『日本書紀』は舎人親王らが720年に完成させた、漢文の編年体で書かれた最初の正史（六国史の第一）。","m":"書紀は720年、舎人親王","y":720},{"f":"古代","t":"奈良時代の政治","ref":"KO-0164","lv":2,"s":"729年、長屋王は藤原氏らの策謀で自殺に追い込まれた。","a":1,"e":"藤原不比等の死後に政権を握った左大臣長屋王は、729年に謀反の疑いをかけられて自害に追い込まれた（長屋王の変）。藤原氏による策謀とされ、こののち光明子が皇后に立てられた。","m":"729年、長屋王の変","y":729},{"f":"古代","t":"奈良時代の政治","ref":"KO-0165","lv":2,"s":"光明子が皇后に立てられたのは、藤原仲麻呂の策による。","a":0,"e":"誤り：藤原仲麻呂。正しくは光明子の立后は、不比等の子の武智麻呂・房前・宇合・麻呂の藤原四子が長屋王を倒して実現した。皇族以外から立てられた初めての皇后である。仲麻呂は武智麻呂の子。","m":"光明子の立后は藤原四子","y":729},{"f":"古代","t":"奈良時代の政治","ref":"KO-0166","lv":2,"s":"737年、天然痘の流行で藤原四子が相次いで病死し、橘諸兄が政権の中心となった。","a":1,"e":"737年、天然痘の大流行で藤原四子が相次いで亡くなり、皇族出身の橘諸兄が政権を握った。藤原氏の勢力は一時後退し、これに不満をもつ藤原広嗣が740年に反乱を起こした。","m":"737年天然痘で四子死去","y":737},{"f":"古代","t":"奈良時代の政治","ref":"KO-0167","lv":2,"s":"橘諸兄の政権では、唐から帰国した吉備真備と玄昉が登用された。","a":1,"e":"橘諸兄は、遣唐使とともに唐で学んで帰国した吉備真備と僧玄昉を重く用いた。これに反発した藤原広嗣は二人の排除を求めて挙兵した。真備はのちに右大臣まで昇った。","m":"諸兄は真備と玄昉を重用"},{"f":"古代","t":"奈良時代の政治","ref":"KO-0168","lv":2,"s":"藤原広嗣は740年、東国で挙兵して吉備真備・玄昉の排除を求めた。","a":0,"e":"誤り：東国。正しくは藤原広嗣は大宰府の次官（大宰少弐）として赴任していた九州で挙兵したが、政府軍に鎮圧された。乱の最中から聖武天皇は平城京を離れ、恭仁京などへ都を移した。","m":"740年、広嗣は九州で挙兵","y":740},{"f":"古代","t":"奈良時代の政治","ref":"KO-0169","lv":2,"s":"聖武天皇は、恭仁京・難波宮・紫香楽宮と、都を転々と移した。","a":1,"e":"藤原広嗣の乱が起こると、聖武天皇は平城京を離れて恭仁京に移り、さらに難波宮・紫香楽宮へと都を転々とした。社会不安の中で、国分寺建立や大仏造立の詔もこの時期に出された。","m":"恭仁・難波・紫香楽を転々","y":740},{"f":"古代","t":"奈良時代の政治","ref":"KO-0170","lv":2,"s":"養老律令は、718年に編纂され、ただちに施行された。","a":0,"e":"誤り：ただちに施行。正しくは養老律令は718年ごろ藤原不比等らが編纂したが、すぐには施行されず、757年に孫の藤原仲麻呂が施行した。内容は大宝律令と大きくは変わらないとされる。","m":"養老律令は757年、仲麻呂が施行","y":757},{"f":"古代","t":"奈良時代の政治","ref":"KO-0171","lv":2,"s":"藤原仲麻呂は淳仁天皇を立て、恵美押勝の名を賜って権力を握った。","a":1,"e":"藤原仲麻呂は叔母の光明皇太后の信任を得て勢力を伸ばし、758年に淳仁天皇を即位させて恵美押勝の名を与えられた。光明皇太后の死後、道鏡を寵愛する孝謙上皇と対立した。","m":"仲麻呂＝恵美押勝、淳仁を擁立","y":758},{"f":"古代","t":"奈良時代の政治","ref":"KO-0172","lv":2,"s":"764年に挙兵して敗れたのは、僧の道鏡である。","a":0,"e":"誤り：道鏡。正しくは764年に挙兵して近江で敗死したのは藤原仲麻呂（恵美押勝）で、孝謙上皇が重用する道鏡を除こうとしたことが原因だった。道鏡は乱後に太政大臣禅師、ついで法王となった。","m":"764年、恵美押勝の乱","y":764},{"f":"古代","t":"奈良時代の政治","ref":"KO-0173","lv":2,"s":"769年、宇佐八幡宮の神託を利用して道鏡が皇位につこうとしたが、和気清麻呂らに阻まれた。","a":1,"e":"称徳天皇の信任を得て法王となった道鏡は、宇佐八幡の神託を利用して皇位につこうとしたが、和気清麻呂が神託を確かめて阻止した。称徳天皇の死後、道鏡は失脚し、光仁天皇が即位した。","m":"宇佐八幡神託事件と和気清麻呂","y":769},{"f":"古代","t":"奈良時代の政治","ref":"KO-0174","lv":2,"s":"722年、政府は口分田の不足に対処するため、百万町歩の開墾計画を立てた。","a":1,"e":"人口の増加や浮浪・逃亡で口分田が不足したため、政府は722年に百万町歩の開墾計画を立てたが、ほとんど成果はなかった。翌723年には三世一身法を出し、開墾地の私有を認めて開墾を促した。","m":"722年百万町歩、723年三世一身","y":722},{"f":"古代","t":"奈良時代の政治","ref":"KO-0175","lv":2,"s":"国分尼寺には、国分寺と異なり法華経が重んじられ、都の国分尼寺は法華寺である。","a":1,"e":"国分寺には金光明最勝王経、国分尼寺には法華経が置かれ、正式な寺名もそれぞれの経にちなんでつけられた。大和では東大寺が総国分寺、光明皇后ゆかりの法華寺が総国分尼寺とされた。","m":"尼寺は法華経、総尼寺は法華寺"},{"f":"古代","t":"奈良時代の政治","ref":"KO-0176","lv":3,"s":"三世一身法では、既存の灌漑施設を利用して開墾した場合は本人一代の私有が認められた。","a":1,"e":"三世一身法では、新たに池や溝などの灌漑施設を作って開墾した者には本人・子・孫の三代、すでにある施設を使った者には本人一代の私有を認めた。期限を過ぎると田は収公された。","m":"新設は三世、既存は一代","y":723},{"f":"古代","t":"奈良時代の政治","ref":"KO-0177","lv":3,"s":"墾田永年私財法では、身分にかかわらず開墾面積に制限がなかった。","a":0,"e":"誤り：制限がなかった。正しくは墾田永年私財法では、位階に応じて一位の500町から庶民の10町まで、開墾できる面積の上限が決められた。国司への申請も必要で、上限の高い貴族ほど有利だった。","m":"墾田の上限は位階で500〜10町","y":743},{"f":"古代","t":"奈良時代の政治","ref":"KO-0178","lv":3,"s":"墾田永年私財法のあと、貴族や寺社は周辺の農民を使って大規模に開墾を進め、初期荘園を形成した。","a":1,"e":"墾田永年私財法の後、東大寺などの大寺院や貴族は、国司・郡司の協力を得て付近の農民や浮浪人を使い、大規模な開墾を進めた。こうして成立した荘園を初期荘園といい、多くは10世紀までに衰えた。","m":"初期荘園は大寺院・貴族の開墾","y":743},{"f":"古代","t":"奈良時代の政治","ref":"KO-0179","lv":3,"s":"藤原房前は、のちに式家とよばれる家の祖となった。","a":0,"e":"誤り：式家。正しくは房前は北家の祖である。藤原不比等の4人の子が家を分け、武智麻呂が南家、房前が北家、宇合が式家、麻呂が京家の祖となった。平安時代に摂関家として栄えたのは北家である。","m":"南は武智麻呂、北は房前"},{"f":"古代","t":"奈良時代の政治","ref":"KO-0180","lv":3,"s":"藤原広嗣は、藤原宇合の子である。","a":1,"e":"藤原広嗣は式家の宇合の子で、大宰少弐として九州に赴任していた。橘諸兄政権で重用された吉備真備・玄昉の排除を求めて740年に挙兵したが、鎮圧されて処刑された。","m":"広嗣は式家・宇合の子","y":740},{"f":"古代","t":"奈良時代の政治","ref":"KO-0181","lv":3,"s":"称徳天皇は、孝謙天皇とは別の人物で、淳仁天皇の死後に即位した。","a":0,"e":"誤り：別の人物。正しくは称徳天皇は孝謙天皇が再び位についた姿（重祚）である。孝謙天皇は淳仁天皇に譲位したが、恵美押勝の乱の後に淳仁を廃し、764年に重祚した。","m":"孝謙が重祚して称徳天皇に","y":764},{"f":"古代","t":"奈良時代の政治","ref":"KO-0182","lv":3,"s":"称徳天皇の死後、道鏡は下野薬師寺の別当に左遷された。","a":1,"e":"770年に称徳天皇が亡くなると、後ろ盾を失った道鏡は下野国（栃木県）の薬師寺に追われた。藤原百川らは天智天皇の孫の光仁天皇を立て、仏教政治の改革と財政の引き締めを進めた。","m":"道鏡は下野薬師寺へ、770年","y":770},{"f":"古代","t":"奈良時代の政治","ref":"KO-0183","lv":3,"s":"蝦夷との境界に近い多賀城は、現在の秋田県に置かれた。","a":0,"e":"誤り：秋田県。正しくは多賀城は現在の宮城県多賀城市に724年ごろ置かれ、陸奥国府と鎮守府が置かれた。日本海側の出羽国には秋田城が設けられ、ともに蝦夷支配の拠点となった。","m":"太平洋側の多賀城、日本海側の秋田城","y":724},{"f":"古代","t":"奈良時代の政治","ref":"KO-0184","lv":3,"s":"大仏造立の詔は、紫香楽宮で出された。","a":1,"e":"743年、聖武天皇は近江の紫香楽宮で大仏造立の詔を出し、工事もそこで始められた。都が平城京に戻ると工事は東大寺に移され、752年に開眼供養が行われた。","m":"大仏の詔は紫香楽宮で","y":743},{"f":"古代","t":"奈良時代の政治","ref":"KO-0185","lv":3,"s":"『風土記』は、国ごとの地誌として、元正天皇の713年に編纂が命じられた。","a":0,"e":"誤り：元正天皇。正しくは713年に風土記の編纂を命じたのは元明天皇である。諸国の産物、地名の由来、伝承などを記させたもので、常陸・出雲・播磨・豊後・肥前のものが残り、出雲国風土記がほぼ完全に伝わる。","m":"713年元明、風土記の命令","y":713},{"f":"古代","t":"奈良時代の政治","ref":"KO-0186","lv":2,"s":"聖武天皇が恭仁京などを経て平城京に都を戻したのは、752年の大仏開眼の後である。","a":0,"e":"誤り：752年の大仏開眼の後。正しくは平城京に戻ったのは745年で、大仏の造立もその後に東大寺で進められた。740年の藤原広嗣の乱をきっかけに、聖武天皇は約5年間都を転々とした。","m":"740年に出て745年に平城へ","y":745},{"f":"古代","t":"平安初期の政治","ref":"KO-0187","lv":1,"s":"桓武天皇は、784年に長岡京へ、794年に平安京へ都を移した。","a":1,"e":"桓武天皇は、奈良の寺院勢力から離れて政治を立て直すため、784年に長岡京へ遷都した。しかし造営の責任者藤原種継の暗殺などで工事は進まず、794年に平安京に移った。","m":"784長岡京、794平安京","y":794},{"f":"古代","t":"平安初期の政治","ref":"KO-0188","lv":1,"s":"最澄と空海が唐に渡ったのは、菅原道真の建議で遣唐使が停止された後のことである。","a":0,"e":"誤り：遣唐使停止の後。正しくは最澄と空海は804年の遣唐使に同行して唐に渡った。最澄は翌年、空海は806年に帰国して新しい仏教を伝えた。遣唐使の派遣停止はその約90年後の894年である。","m":"804年に入唐、894年に停止","y":804},{"f":"古代","t":"平安初期の政治","ref":"KO-0189","lv":1,"s":"坂上田村麻呂は征夷大将軍に任じられ、蝦夷との戦いで成果を上げた。","a":1,"e":"桓武天皇は東北地方の蝦夷を支配に組み込むため大軍を送り、797年に坂上田村麻呂を征夷大将軍に任じた。田村麻呂は北上川流域に進出して城柵を築き、律令国家の支配を北へ広げた。","m":"797年、田村麻呂が征夷大将軍","y":797},{"f":"古代","t":"平安初期の政治","ref":"KO-0190","lv":1,"s":"桓武天皇の時代に、坂上田村麻呂が戦った蝦夷の指導者は磐井である。","a":0,"e":"誤り：磐井。正しくは坂上田村麻呂に降伏した胆沢地方の蝦夷の族長は阿弖流為である。磐井は527年に九州北部で反乱を起こした筑紫国造で、時代も地域もまったく異なる。","m":"田村麻呂に降った阿弖流為","y":802},{"f":"古代","t":"平安初期の政治","ref":"KO-0191","lv":1,"s":"最澄は唐に渡って天台宗を学び、帰国後に比叡山延暦寺を拠点とした。","a":1,"e":"最澄は804年に遣唐使とともに唐に渡り、天台の教えを学んで翌年帰国し、天台宗を開いた。比叡山延暦寺を拠点とし、東大寺の戒壇とは別に、独自の大乗戒壇の設立を朝廷に求めた。","m":"最澄＝天台宗・比叡山延暦寺","y":805},{"f":"古代","t":"平安初期の政治","ref":"KO-0192","lv":1,"s":"空海が嵯峨天皇から与えられ、真言宗の根本道場とした京都の寺院は、延暦寺である。","a":0,"e":"誤り：延暦寺。正しくは空海は823年に嵯峨天皇から平安京の東寺（教王護国寺）を与えられ、密教の道場とした。延暦寺は最澄が比叡山に開いた天台宗の寺である。","m":"空海は東寺、最澄は延暦寺","y":823},{"f":"古代","t":"平安初期の政治","ref":"KO-0193","lv":1,"s":"空海は唐で密教を学び、帰国して真言宗を開き、高野山に金剛峯寺を建てた。","a":1,"e":"空海は唐の長安で密教を学んで帰国し、真言宗を開いた。816年に嵯峨天皇から紀伊の高野山を与えられて金剛峯寺を建てた。密教は加持祈禱によって災いを除くとされ、貴族の間に広まった。","m":"空海＝真言宗・高野山金剛峯寺","y":816},{"f":"古代","t":"平安初期の政治","ref":"KO-0194","lv":1,"s":"勘解由使は、国司の交替の際の事務の引き継ぎを監督するために置かれた。","a":1,"e":"勘解由使は桓武天皇が置いた令外官で、国司が交代するとき、後任者が前任者に出す解由状を審査した。国司の不正をふせぎ、地方政治を引き締めることがねらいだった。","m":"国司交替を監督する勘解由使"},{"f":"古代","t":"平安初期の政治","ref":"KO-0195","lv":1,"s":"検非違使は、京都の治安維持や裁判を担当する令外官である。","a":1,"e":"検非違使は嵯峨天皇のころ京の治安を守るために置かれ、のちには裁判も行うようになった。警察と司法の権限をあわせもち、京職・弾正台・刑部省などの職務を吸収していった。","m":"京の警察・裁判は検非違使"},{"f":"古代","t":"平安初期の政治","ref":"KO-0196","lv":1,"s":"810年の薬子の変で、天皇の座を巡って敗れたのは嵯峨天皇である。","a":0,"e":"誤り：嵯峨天皇。正しくは810年の平城太上天皇の変（薬子の変）で敗れたのは平城上皇で、出家した。上皇の寵愛を受けた藤原薬子は自害し、兄の藤原仲成は殺された。勝ったのは嵯峨天皇の側である。","m":"薬子の変で平城上皇が敗北","y":810},{"f":"古代","t":"平安初期の政治","ref":"KO-0197","lv":1,"s":"藤原良房は、臣下として初めて摂政の地位についた。","a":1,"e":"藤原良房は858年に孫の清和天皇を9歳で即位させて事実上の摂政となり、866年の応天門の変ののち正式に摂政に任じられた。皇族以外で摂政となったのは良房が最初である。","m":"臣下で初めての摂政は良房","y":866},{"f":"古代","t":"平安初期の政治","ref":"KO-0198","lv":1,"s":"菅原道真の提案で、遣唐使は894年に新たに派遣された。","a":0,"e":"誤り：新たに派遣された。正しくは894年に遣唐大使に任じられた菅原道真が、唐の衰えと渡航の危険を理由に派遣の停止を建議し、受け入れられた。こうして遣唐使は事実上終わった。","m":"894年、道真の建議で遣唐使停止","y":894},{"f":"古代","t":"平安初期の政治","ref":"KO-0199","lv":2,"s":"桓武天皇は、平安京遷都にあたって、奈良の大寺院を平安京内に移すことを積極的に認めた。","a":0,"e":"誤り：積極的に認めた。正しくは桓武天皇は、奈良時代に仏教勢力が政治に介入した反省から、奈良の大寺院を新京に移すことを認めなかった。平安京に置かれた官寺は東寺と西寺だけだった。","m":"平安京には東寺・西寺だけ","y":794},{"f":"古代","t":"平安初期の政治","ref":"KO-0200","lv":2,"s":"805年の徳政相論で、桓武天皇は藤原緒嗣の意見を採用し、蝦夷征討と平安京の造営を中止した。","a":1,"e":"805年、桓武天皇は参議の藤原緒嗣と菅野真道に政治の得失を議論させた（徳政相論）。緒嗣は民の苦しみの原因は軍事と造作であると主張し、天皇はこれを受け入れて蝦夷征討と平安京造営を打ち切った。","m":"徳政相論で軍事と造作を中止","y":805},{"f":"古代","t":"平安初期の政治","ref":"KO-0201","lv":2,"s":"藤原基経が関白として政治を主導したのは、醍醐天皇の時代である。","a":0,"e":"誤り：醍醐天皇。正しくは基経は884年に光孝天皇のもとで事実上の関白となり、887年に宇多天皇が正式に関白に任じた。基経は891年に亡くなり、醍醐天皇の時代には子の時平が左大臣となった。","m":"基経は光孝・宇多の関白","y":887},{"f":"古代","t":"平安初期の政治","ref":"KO-0202","lv":2,"s":"軍団が廃止されたのち、郡司の子弟などから兵を選ぶ健児の制が採用された。","a":1,"e":"農民の兵役の負担が重く兵士の質も低かったため、桓武天皇は792年に東北・九州などを除いて軍団を廃止した。代わりに郡司の子弟などから弓馬に優れた者を選んで健児とし、国府の守りなどにあてた。","m":"792年、軍団を廃して健児","y":792},{"f":"古代","t":"平安初期の政治","ref":"KO-0203","lv":2,"s":"810年の薬子の変の際、嵯峨天皇は蔵人頭を置いて、天皇の命令を迅速に伝えさせた。","a":1,"e":"平城上皇と対立した嵯峨天皇は、810年に天皇の命令を早く確実に伝えるため蔵人所を設け、長官の蔵人頭に信頼する側近を任じた。蔵人頭は天皇の秘書として機密に関わり、のちに出世の道となった。","m":"薬子の変で蔵人頭を設置","y":810},{"f":"古代","t":"平安初期の政治","ref":"KO-0204","lv":2,"s":"842年の承和の変では、伴健岑・橘逸勢らが処罰され、藤原良房が勢力を伸ばした。","a":1,"e":"842年、皇太子恒貞親王に仕える伴健岑と橘逸勢が謀反を企てたとして流罪となり、恒貞親王も皇太子を廃された（承和の変）。良房の甥の道康親王が皇太子となり、北家の地位が強まった。","m":"842年承和の変、伴健岑・橘逸勢","y":842},{"f":"古代","t":"平安初期の政治","ref":"KO-0205","lv":2,"s":"866年の承和の変で、伴善男が失脚した。","a":0,"e":"誤り：承和の変。正しくは866年に伴善男が失脚したのは応天門の変で、善男は応天門に放火した罪で流罪となった。承和の変は842年の事件で、伴健岑・橘逸勢が処罰された。","m":"善男は応天門、健岑は承和","y":866},{"f":"古代","t":"平安初期の政治","ref":"KO-0206","lv":2,"s":"桓武天皇は、畿内で6年ごとに行うことになっていた班田を12年に1回に改め、班田の実施をはかった。","a":1,"e":"8世紀末には戸籍の偽りや浮浪・逃亡が増え、6年ごとの班田は滞りがちになった。桓武天皇は畿内で班田を12年に1回（一紀一班）に改めて確実に実施させようとしたが、9世紀には班田はさらに行われなくなった。","m":"班田は12年に1回（一紀一班）","y":801},{"f":"古代","t":"平安初期の政治","ref":"KO-0207","lv":2,"s":"宇多天皇のとき、藤原基経が関白の職をめぐって対立する阿衡の紛議が起こった。","a":1,"e":"887年に即位した宇多天皇は基経を関白に任じる勅書を出したが、その中の「阿衡」という語を実権のない地位の意味だとして基経が政務を拒んだ。天皇は勅書を撤回し、関白の地位の重さが示された。","m":"阿衡の紛議で関白の力を示す","y":888},{"f":"古代","t":"平安初期の政治","ref":"KO-0208","lv":2,"s":"宇多天皇は、基経の死後、摂政・関白を置かず、菅原道真を登用した。","a":1,"e":"891年に基経が亡くなると、宇多天皇は摂政・関白を置かずに自ら政治を行い、学者の菅原道真を重く用いて藤原氏をおさえた。この方針は醍醐天皇の初期にも受けつがれた。","m":"宇多天皇が道真を登用","y":891},{"f":"古代","t":"平安初期の政治","ref":"KO-0209","lv":2,"s":"901年、菅原道真は藤原時平の策謀で大宰府に左遷された。","a":1,"e":"菅原道真は醍醐天皇のもとで昇進を重ねたが、901年、藤原時平に娘婿の皇子を即位させようとしたと訴えられ、大宰府に左遷された（昌泰の変）。道真は2年後に大宰府で亡くなり、のちに天神として祭られた。","m":"901年昌泰の変、道真左遷","y":901},{"f":"古代","t":"平安初期の政治","ref":"KO-0210","lv":2,"s":"醍醐天皇は、延喜の荘園整理令を出し、最後の班田を行った後、律令制の復興に成功した。","a":0,"e":"誤り：復興に成功した。正しくは醍醐天皇は902年に延喜の荘園整理令を出し、班田も命じて律令制の立て直しを図ったが、効果は乏しかった。班田が行われた記録は、このころを最後にみられなくなる。","m":"延喜の改革も律令は戻らず","y":902},{"f":"古代","t":"平安初期の政治","ref":"KO-0211","lv":2,"s":"弘仁格式・貞観格式・延喜格式を総称して、三代格式という。","a":1,"e":"格は律令の規定を補ったり改めたりする法令、式は律令や格を施行するための細則である。9世紀から10世紀にかけて弘仁・貞観・延喜の三代格式が編まれ、律令を改めずに実情に合わせる手段となった。","m":"弘仁・貞観・延喜の三代格式"},{"f":"古代","t":"平安初期の政治","ref":"KO-0212","lv":2,"s":"三代格式のうち、最初に編まれたのは貞観格式である。","a":0,"e":"誤り：貞観格式。正しくは最初に編まれたのは嵯峨天皇のときの弘仁格式で、次いで清和天皇のときに貞観格式、醍醐天皇のときに延喜格式が作られた。延喜式はほぼ完全な形で伝わる。","m":"嵯峨の弘仁格式が最初","y":820},{"f":"古代","t":"平安初期の政治","ref":"KO-0213","lv":3,"s":"802年に胆沢城、803年に志波城が築かれ、蝦夷への支配の拠点となった。","a":1,"e":"坂上田村麻呂は802年に北上川中流域に胆沢城を築き、多賀城から鎮守府を移した。翌803年にはさらに北に志波城を築き、律令国家の支配を現在の岩手県中部まで広げた。","m":"802年胆沢城、803年志波城","y":802},{"f":"古代","t":"平安初期の政治","ref":"KO-0214","lv":3,"s":"胆沢城は、現在の秋田県に築かれた、蝦夷の支配の拠点である。","a":0,"e":"誤り：秋田県。正しくは胆沢城は現在の岩手県奥州市に築かれ、鎮守府が置かれた。秋田県には奈良時代に出羽国の秋田城が置かれ、日本海側の拠点となった。","m":"胆沢城は岩手、秋田城は出羽","y":802},{"f":"古代","t":"平安初期の政治","ref":"KO-0215","lv":3,"s":"勘解由使や検非違使は、律令に規定のない官職で、令外官とよばれる。","a":1,"e":"令外官は令に規定がなく、新たな必要に応じて設けられた官職をいう。奈良時代の中納言・参議、平安初期の征夷大将軍・勘解由使・蔵人頭・検非違使などがあり、律令制を実情に合わせる役割を果たした。","m":"令に定めのない新設官＝令外官"},{"f":"古代","t":"平安初期の政治","ref":"KO-0216","lv":3,"s":"嵯峨天皇の時代の811年に蝦夷征討を行い、成果をあげたのは坂上田村麻呂である。","a":0,"e":"誤り：坂上田村麻呂。正しくは811年の征討を指揮したのは文室綿麻呂で、この後は大規模な蝦夷征討は行われなくなった。田村麻呂は桓武天皇の時代に胆沢城・志波城を築いた武官である。","m":"811年の征討は文室綿麻呂","y":811},{"f":"古代","t":"平安初期の政治","ref":"KO-0217","lv":3,"s":"阿弖流為は、802年に坂上田村麻呂に降伏した蝦夷の指導者である。","a":1,"e":"阿弖流為は胆沢地方の蝦夷を率い、朝廷軍を破ったこともある族長だったが、802年に坂上田村麻呂に降伏した。田村麻呂は助命を願ったが、阿弖流為は都の近くで処刑された。","m":"802年、阿弖流為が降伏","y":802},{"f":"古代","t":"平安初期の政治","ref":"KO-0218","lv":3,"s":"藤原冬嗣は蔵人頭に任じられ、藤原北家の勢力伸張の基礎を築いた。","a":1,"e":"藤原冬嗣は嵯峨天皇の信任を得て蔵人頭となり、のちに左大臣に昇った。娘の順子を仁明天皇のきさきとし、子の良房が北家の勢力をさらに伸ばす基礎を作った。","m":"冬嗣は蔵人頭、子は良房","y":810},{"f":"古代","t":"平安初期の政治","ref":"KO-0219","lv":3,"s":"令の官撰の注釈書である『令義解』は、嵯峨天皇のときに編纂された。","a":0,"e":"誤り：嵯峨天皇。正しくは『令義解』は淳和天皇の命で清原夏野らが編み、833年に完成した養老令の公式の注釈書で、翌年施行された。9世紀後半には惟宗直本が私的な注釈書『令集解』をまとめた。","m":"令義解は淳和天皇・清原夏野","y":833},{"f":"古代","t":"平安初期の政治","ref":"KO-0220","lv":3,"s":"昌泰の変のとき、菅原道真は右大臣、藤原時平は左大臣の地位にあった。","a":1,"e":"昌泰の変の当時、菅原道真は右大臣、藤原時平は左大臣で、ともに醍醐天皇を補佐していた。学者の家柄から出た道真の異例の昇進は、藤原氏など他の貴族の反感を買っていた。","m":"道真は右大臣、時平は左大臣","y":901},{"f":"古代","t":"平安初期の政治","ref":"KO-0221","lv":3,"s":"藤原種継暗殺事件の実行犯とされて処罰されたのは、桓武天皇の弟の早良親王である。","a":0,"e":"誤り：実行犯。正しくは785年に長岡京造営の責任者藤原種継を暗殺した実行犯とされたのは大伴継人らで、早良親王は関与を疑われて皇太子を廃された。親王は淡路へ送られる途中で亡くなった。","m":"種継暗殺の実行犯は大伴氏","y":785},{"f":"古代","t":"平安初期の政治","ref":"KO-0222","lv":3,"s":"平城上皇の寵愛を受けた藤原薬子は、式家の藤原種継の娘である。","a":1,"e":"藤原薬子と兄の仲成は、長岡京の造営中に暗殺された式家の藤原種継の子である。薬子の変で二人が滅びたため式家は勢いを失い、嵯峨天皇に重用された北家が台頭するきっかけとなった。","m":"薬子・仲成は式家種継の子","y":810},{"f":"古代","t":"平安初期の政治","ref":"KO-0223","lv":3,"s":"嵯峨天皇は、桓武天皇の孫である。","a":0,"e":"誤り：孫。正しくは嵯峨天皇は桓武天皇の子で、兄の平城天皇から譲位を受けて809年に即位した。次の淳和天皇も桓武天皇の子で、9世紀前半には桓武の子が相次いで即位した。","m":"桓武の子が平城・嵯峨・淳和","y":809},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0224","lv":1,"s":"藤原氏の北家は、他氏族を次々に退けて、朝廷での勢力を強めていった。","a":1,"e":"藤原北家は、承和の変（842年）、応天門の変（866年）、昌泰の変（901年）、安和の変（969年）などで、伴氏・橘氏・紀氏・菅原氏など他氏の有力者を次々に退け、朝廷を主導するようになった。","m":"北家の他氏排斥の4事件"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0225","lv":1,"s":"摂政は、成人した天皇に代わって政務を取り仕切る職である。","a":0,"e":"誤り：成人した天皇。正しくは摂政は天皇が幼いときなどに代わって政務をとる職で、成人した天皇の後見として政務を補佐するのが関白である。天皇の外戚となった藤原氏がこれらの職を独占した。","m":"摂政は幼帝、関白は成人の天皇"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0226","lv":1,"s":"藤原道長は、娘を次々と天皇のきさきとして、天皇の外戚としての権力を握った。","a":1,"e":"藤原道長は、彰子を一条天皇、妍子を三条天皇、威子を後一条天皇のきさきとし、天皇の外祖父として権力を握った。摂関政治では、母方の実家が天皇の養育や後見を担う慣習が権力の基盤だった。","m":"娘を后にして外戚となる","y":1016},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0227","lv":1,"s":"日本の風景や風俗を題材にした、国風文化を代表するやわらかな絵画を水墨画という。","a":0,"e":"誤り：水墨画。正しくは国風文化の絵画は大和絵で、屏風や襖の絵、のちには絵巻物にも描かれた。水墨画は中国から伝わり、鎌倉・室町時代に禅宗文化とともに広まった絵画である。","m":"国風の絵は大和絵、水墨は禅宗"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0228","lv":1,"s":"藤原頼通は、宇治の別荘を寺院に改め、平等院鳳凰堂を建立した。","a":1,"e":"藤原頼通は道長の子で、後一条・後朱雀・後冷泉の3代約50年にわたって摂政・関白をつとめた。末法思想の広まりを背景に、宇治の別荘を寺に改めて平等院とし、1053年に阿弥陀堂の鳳凰堂を建てた。","m":"頼通が宇治に平等院鳳凰堂","y":1053},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0229","lv":1,"s":"平安時代には、漢字をもとにひらがなとカタカナが作られた。","a":1,"e":"9世紀から10世紀にかけて、漢字をもとに音を表す仮名文字が広まった。仮名によって日本人の感情や感覚を自由に書き表せるようになり、和歌や物語・日記などの仮名文学が発達した。","m":"仮名文字が国風文学を支える"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0230","lv":1,"s":"『源氏物語』の作者は清少納言である。","a":0,"e":"誤り：清少納言。正しくは『源氏物語』の作者は一条天皇の中宮彰子に仕えた紫式部で、光源氏を主人公に宮廷貴族の生活を描いた長編物語である。清少納言は皇后定子に仕えた女房である。","m":"源氏物語は彰子に仕えた紫式部"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0231","lv":1,"s":"清少納言は随筆『枕草子』を著し、宮廷生活を鋭い観察で描いた。","a":1,"e":"清少納言は一条天皇の皇后定子に仕えた女房で、宮廷生活や自然を鋭い感覚で記した随筆『枕草子』を著した。外戚の地位を争う貴族は、娘のもとに教養ある女房を集めて宮廷サロンをつくった。","m":"枕草子は清少納言、定子に仕える"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0232","lv":1,"s":"『古今和歌集』は、醍醐天皇の命で紀貫之らが編んだ最初の勅撰和歌集である。","a":1,"e":"『古今和歌集』は905年に醍醐天皇の命で紀貫之らが編んだ最初の勅撰和歌集である。貫之の書いた仮名序は和歌論として名高く、和歌が漢詩と並ぶ公的な文学と認められたことを示す。","m":"905年古今和歌集、最初の勅撰","y":905},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0233","lv":1,"s":"浄土教は、阿弥陀仏を信仰し、死後に極楽浄土に生まれ変わることを願う教えである。","a":1,"e":"浄土教は阿弥陀仏を信じて念仏をとなえ、来世に極楽浄土へ生まれ変わることを願う教えである。社会不安が強まった10世紀以降に広まり、貴族は阿弥陀堂を建て、来迎図を描かせた。","m":"阿弥陀を信じ極楽往生を願う"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0234","lv":1,"s":"『往生要集』を著して浄土教を広めたのは、空也である。","a":0,"e":"誤り：空也。正しくは985年に『往生要集』を著したのは天台宗の僧源信（恵心僧都）で、極楽往生のための念仏の方法を説いた。空也は10世紀半ばに京の市中で念仏を説き、市聖とよばれた。","m":"往生要集は源信、市聖は空也","y":985},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0235","lv":1,"s":"貴族の住宅は、寝殿造とよばれる様式で建てられた。","a":1,"e":"寝殿造は貴族の住宅様式で、中央の寝殿を南向きに建て、東西や北に対屋を置いて渡殿で結び、南の庭に池を設けた。室内は板敷きで、屏風や几帳で仕切り、大和絵の屏風が飾られた。","m":"寝殿と対屋と池＝寝殿造"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0236","lv":1,"s":"受領は、任国に赴任して、徴税の責任を請け負う国司の最上席の者である。","a":1,"e":"10世紀以降、国司は一定の税を中央に納めれば任国の支配をほぼ任されるようになった。任国に赴いた最上席の国司を受領といい、権限を利用して財産をたくわえる者も多かった。","m":"受領は任国の徴税請負人"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0237","lv":2,"s":"969年の安和の変で失脚したのは、菅原道真である。","a":0,"e":"誤り：菅原道真。正しくは969年の安和の変で左大臣源高明が謀反の疑いで大宰府に左遷された。高明は醍醐天皇の子で、娘婿の為平親王の即位が警戒された。道真が左遷されたのは901年の昌泰の変。","m":"969年安和の変、源高明","y":969},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0238","lv":2,"s":"安和の変のあと、摂政・関白がほぼ常に置かれるようになった。","a":1,"e":"安和の変で藤原氏の他氏排斥はほぼ完了し、以後は摂政・関白がほぼ常に置かれた。権力争いは藤原北家の内部に移り、兼通・兼家兄弟や道長・伊周の争いが起こった。","m":"安和の変以後、摂関が常置","y":969},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0239","lv":2,"s":"藤原道長は、後一条天皇の外祖父として摂政となった。","a":1,"e":"道長は1016年、娘の彰子が生んだ後一条天皇が即位すると摂政となった。翌年には摂政を子の頼通に譲ったが、その後も太政大臣などとして実権を握り続けた。","m":"1016年、後一条の摂政","y":1016},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0240","lv":2,"s":"藤原道長の日記は『小右記』である。","a":0,"e":"誤り：『小右記』。正しくは道長の日記は『御堂関白記』で、現存する最古の自筆の日記として知られる。『小右記』は右大臣藤原実資の日記で、道長の時代の政治を批判的に記している。","m":"御堂関白記は道長、小右記は実資"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0241","lv":2,"s":"成功は、私財を出して朝廷の造営を助け、その代わりに官職を得る制度である。","a":1,"e":"成功は、私財を出して朝廷の儀式や寺社の造営を請け負い、その見返りに官職を得ることをいう。同じ官職に再び任じられる重任も行われ、利益の大きい受領の地位を求めて成功する者が多かった。","m":"私財で官職を得る成功"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0242","lv":2,"s":"遥任の国司は、任国に赴任して、現地で徴税を行った。","a":0,"e":"誤り：任国に赴任して現地で徴税。正しくは遥任は国司が任国に赴かず、京にとどまって収入だけを得るもので、現地には代理人の目代を送り、在庁官人に実務を任せた。任国に赴く最上席の国司が受領である。","m":"遥任は京にいて目代を送る"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0243","lv":2,"s":"田堵は、国司から田地の耕作を請け負い、租税の納入に責任を持った有力農民である。","a":1,"e":"10世紀ごろ、国司は公領を名という単位に分け、その耕作と納税を有力農民に請け負わせた。この請負人を田堵といい、大規模に経営する者は大名田堵とよばれた。のちに名主へと発展した。","m":"名の耕作を請け負う田堵"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0244","lv":2,"s":"三蹟とよばれる書の名手には、橘逸勢が含まれる。","a":0,"e":"誤り：橘逸勢。正しくは国風文化を代表する和様の書の名手は小野道風・藤原佐理・藤原行成で、三蹟とよばれる。橘逸勢は嵯峨天皇・空海とともに唐風の書の名手として三筆とよばれた。","m":"唐風の三筆、和様の三蹟"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0245","lv":2,"s":"『土佐日記』は、紀貫之が仮名で書いた日記文学である。","a":1,"e":"『土佐日記』は紀貫之が土佐守の任期を終えて京に帰るまでの旅を、女性の筆に託して仮名で書いた日記である。仮名による日記文学の始まりとされ、のちの女性の日記文学に影響を与えた。","m":"土佐日記は貫之、女性に託す","y":935},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0246","lv":2,"s":"『大鏡』は、軍記物語の一つである。","a":0,"e":"誤り：軍記物語。正しくは『大鏡』は院政期に成立した歴史物語で、老人が語る対話形式で藤原道長の栄華を批判もまじえて描く。歴史物語には道長を賛美する『栄花物語』もある。軍記物語は『将門記』など。","m":"大鏡は歴史物語、道長を描く"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0247","lv":2,"s":"平等院鳳凰堂の阿弥陀如来像は、定朝が寄木造の技法で制作した。","a":1,"e":"鳳凰堂の阿弥陀如来像は仏師定朝の作で、体の部分を別々に作って組み合わせる寄木造の技法による。分業で大きな像を効率よく作ることができ、多くの阿弥陀像の需要に応えた。","m":"定朝の寄木造、鳳凰堂の阿弥陀","y":1053},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0248","lv":2,"s":"1052年から末法の世に入るという考えが広まり、浄土教の信仰が高まった。","a":1,"e":"末法思想は、釈迦の死後、正法・像法の時代を経て仏法が衰える末法の世が来るという考えで、日本では1052年に末法に入るとされた。社会の乱れとも重なり、浄土教が広く信仰された。","m":"1052年から末法に入る","y":1052},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0249","lv":2,"s":"本地垂迹説とは、日本の神が本来の姿で、仏はその仮の姿であるという考えである。","a":0,"e":"誤り：神が本来の姿で仏が仮の姿。正しくは本地垂迹説は、仏や菩薩が本来の姿（本地）で、日本の神はその仮に現れた姿（垂迹）とする考え。逆の考えは鎌倉時代に伊勢神道などで唱えられた。","m":"本地は仏、垂迹は神の姿"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0250","lv":3,"s":"藤原道長は、一条天皇のもとで内覧として天皇に出す文書を先に見る立場に立ち、権力を固めた。","a":1,"e":"995年に兄の道隆・道兼が相次いで亡くなると、道長は甥の伊周との争いに勝ち、内覧の宣旨を受けた。内覧は関白に準じる職で、道長はこれと左大臣を兼ねて朝廷を主導した。","m":"道長は内覧と左大臣で主導","y":995},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0251","lv":3,"s":"道長は、娘の威子の立后を祝う宴で「この世をば我が世とぞ思ふ望月の」と詠んだ。","a":1,"e":"1018年、道長の娘威子が後一条天皇の中宮となり、道長の娘3人がそろって后の地位を占めた。その祝宴で道長が詠んだ望月の歌は、藤原実資の日記『小右記』に記録されている。","m":"1018年、望月の歌","y":1018},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0252","lv":3,"s":"1019年の刀伊の入寇では、高麗の軍が九州北部に侵入した。","a":0,"e":"誤り：高麗の軍。正しくは1019年に対馬・壱岐から九州北部を襲ったのは、沿海州地方の女真族とみられる刀伊である。大宰権帥の藤原隆家が九州の武士を指揮して撃退した。","m":"1019年刀伊の入寇、女真族","y":1019},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0253","lv":3,"s":"『日本往生極楽記』を著して、極楽往生をとげた人々の伝記をまとめたのは源信である。","a":0,"e":"誤り：源信。正しくは『日本往生極楽記』は10世紀後半に慶滋保胤が著した最初の往生伝である。源信は『往生要集』で念仏の方法を説いた。往生伝は浄土教が貴族に広まる助けとなった。","m":"往生伝は慶滋保胤、要集は源信"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0254","lv":3,"s":"10世紀前半に渤海を滅ぼしたのは、契丹（遼）である。","a":1,"e":"中国東北部の渤海は日本と使節を交わしていたが、926年に契丹（遼）に滅ぼされた。朝鮮半島では935年に高麗が新羅を滅ぼし、中国では907年に唐が滅んだ。東アジアの変動の中で日本の外交は消極的になった。","m":"926年、渤海は契丹に滅ぶ","y":926},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0255","lv":3,"s":"平安中期の日本は、宋と正式な国交を結び、国使の往来が盛んであった。","a":0,"e":"誤り：正式な国交を結んだ。正しくは日本は宋と正式な国交を開かず、宋の商人が博多などに来航して貿易を行った。僧の奝然や成尋らは、許可を得て宋に渡った。","m":"宋とは国交なし、商人と僧"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0256","lv":3,"s":"『蜻蛉日記』は、藤原道綱の母が記した日記文学である。","a":1,"e":"『蜻蛉日記』は藤原兼家の妻の一人である藤原道綱の母が、夫の訪れを待つ生活の苦しみをつづった日記で、女性による仮名日記の早い例である。一夫多妻の婚姻の中での女性の心情を伝える。","m":"蜻蛉日記は藤原道綱の母"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0257","lv":3,"s":"『更級日記』は、紫式部の作である。","a":0,"e":"誤り：紫式部。正しくは『更級日記』は菅原孝標の女が少女時代から晩年までを回想した日記で、物語にあこがれた様子が書かれている。紫式部の作品は『源氏物語』と『紫式部日記』である。","m":"更級日記は菅原孝標の女"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0258","lv":3,"s":"1045年、後冷泉天皇のときに寛徳の荘園整理令が出された。","a":1,"e":"1045年の寛徳の荘園整理令は、前任の国司の任期中以後に成立した新しい荘園を停止させるものだった。延喜の荘園整理令以後も整理令はたびたび出されたが、国司まかせで十分な成果はあがらなかった。","m":"1045年、寛徳の荘園整理令","y":1045},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0259","lv":1,"s":"漢字の一部をとって作られた仮名文字は、ひらがなである。","a":0,"e":"誤り：ひらがな。正しくは漢字の一部をとったのはカタカナで、経典を読むときの読み方を書き込む記号などから発達した。ひらがなは漢字の草書体をくずして作られ、和歌や物語に多く使われた。","m":"一部をとるカタカナ、くずすひらがな"},{"f":"古代","t":"摂関政治と国風化","ref":"KO-0260","lv":2,"s":"平安時代の貴族の正装は、男性が束帯、女性が直衣である。","a":0,"e":"誤り：女性が直衣。正しくは女性の正装は女房装束（いわゆる十二単）である。直衣は男性貴族の日常着で、男性の正装は束帯、それを簡略にしたものに衣冠があった。","m":"男は束帯、女は女房装束"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0261","lv":1,"s":"地方の有力者は、開発した土地を国司の圧迫から守るため、中央の貴族や寺社に寄進した。","a":1,"e":"開発領主は国司の圧迫をのがれるため、所領を中央の貴族や寺社に寄進して保護を求めた。開発領主自身は荘官となって現地の支配を続け、一定の年貢を寄進先に納めた。こうした荘園を寄進地系荘園という。","m":"国司から守るため中央へ寄進"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0262","lv":1,"s":"不入の権とは、荘園が国家への租税を免除される権利である。","a":0,"e":"誤り：租税を免除される権利。正しくは租税の免除は不輸の権である。不入の権は、国司が派遣する検田使などの役人の立ち入りを拒む権利で、これらを得た荘園は国司の支配から離れていった。","m":"不輸は免税、不入は立入り拒否"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0263","lv":1,"s":"939年、平将門は関東で反乱を起こし、新皇と称した。","a":1,"e":"平将門は桓武平氏の一族で、下総を拠点に一族と争ううちに国司とも対立し、939年に常陸・下野・上野の国府を攻め落として関東の大半を支配し、新皇と名のった。朝廷は東国の武士の力でこれを鎮めた。","m":"939年、将門が新皇を称す","y":939},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0264","lv":1,"s":"桓武平氏は、清和天皇の子孫が臣籍に下り、平の姓を名のった一族である。","a":0,"e":"誤り：清和天皇の子孫。正しくは桓武平氏は、桓武天皇の曾孫の高望王が平の姓を与えられ、上総介として関東に下ったことに始まる。清和天皇の子孫を祖とするのは清和源氏である。","m":"平氏は桓武、源氏は清和"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0265","lv":1,"s":"平将門の乱と藤原純友の乱を、あわせて承平・天慶の乱という。","a":1,"e":"939年ごろ、東国の平将門の乱と西国の藤原純友の乱がほぼ同じ時期に起こり、これらを承平・天慶の乱という。朝廷は地方の武士の力を借りてようやく鎮圧し、武士の実力が認められるきっかけとなった。","m":"東の将門、西の純友＝承平・天慶","y":939},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0266","lv":1,"s":"前九年合戦では、源頼義・義家父子が東北の豪族安倍氏と戦った。","a":1,"e":"1051年、陸奥の豪族安倍氏が国司と争うと、源頼義が陸奥守として派遣され、子の義家とともに安倍頼時・貞任父子と戦った。12年に及ぶ戦いの末、1062年に安倍氏を滅ぼした（前九年合戦）。","m":"前九年合戦は頼義・義家と安倍氏","y":1051},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0267","lv":1,"s":"後三年合戦ののち、奥羽を支配したのは安倍氏である。","a":0,"e":"誤り：安倍氏。正しくは後三年合戦で勝ち残った藤原清衡が奥羽の支配を受けつぎ、平泉を拠点とした。安倍氏は前九年合戦で滅び、その後奥羽で勢力をもった清原氏も内紛で衰えた。","m":"後三年の後は清衡が平泉に","y":1087},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0268","lv":1,"s":"奥州藤原氏は、平泉を拠点に東北地方に勢力を築いた。","a":1,"e":"奥州藤原氏は3代約100年にわたり、陸奥の平泉を拠点に奥羽を支配した。奥羽で産出する金や馬などで富を得て、京都の文化を積極的に取り入れ、中尊寺や毛越寺などの寺院を建てた。","m":"金と馬の富で栄えた平泉"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0269","lv":2,"s":"11世紀以降、国衙の実務は、現地の有力者から選ばれた在庁官人が担うようになった。","a":1,"e":"遥任が増えると国司は任国に目代を送るだけとなり、国衙の行政は地元の豪族や開発領主から選ばれた在庁官人が世襲的に担った。在庁官人の多くは武士でもあり、のちに鎌倉幕府の御家人となる者もいた。","m":"国衙を動かす在庁官人"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0270","lv":1,"s":"武士の棟梁として、源氏とともに有力になったのは、藤原氏である。","a":0,"e":"誤り：藤原氏。正しくは武士団を束ねる武家の棟梁となったのは、清和源氏と桓武平氏である。地方の武士は、貴族の血を引く源氏や平氏を棟梁として仰ぎ、大きな武士団にまとまっていった。","m":"武家の棟梁は源氏と平氏"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0271","lv":1,"s":"988年、尾張国の郡司・百姓らが、国司の藤原元命の不正を訴えた。","a":1,"e":"988年、尾張国の郡司や百姓が、国守藤原元命の不法な徴税や暴政を31か条にわたって朝廷に訴えた（尾張国郡司百姓等解）。元命は翌年解任され、受領の横暴を示す史料として知られる。","m":"988年、尾張の国守元命を訴える","y":988},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0272","lv":1,"s":"記録荘園券契所を設けて荘園整理を行った天皇は、白河天皇である。","a":0,"e":"誤り：白河天皇。正しくは1069年に延久の荘園整理令を出し、記録荘園券契所を設けて荘園の証拠書類を審査させたのは後三条天皇である。白河天皇はその子で、1086年に譲位して院政を始めた。","m":"後三条の記録荘園券契所","y":1069},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0273","lv":1,"s":"平安時代には、荘園と、国司が支配する公領（国衙領）が並び立つ体制が形づくられた。","a":1,"e":"11世紀後半には、荘園と国司が支配する公領（国衙領）がならび立つ荘園公領制が形づくられた。公領も郡・郷・保などに分けられて郡司・郷司・保司が管理し、荘園と似た構造となった。","m":"荘園と公領が並ぶ荘園公領制"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0274","lv":2,"s":"荘園の領主のうち、開発領主から寄進を受けた者を領家、さらに上位の寄進先を本家という。","a":1,"e":"寄進を受けた貴族・寺社は領家となり、領家がさらに保護を求めて皇族や摂関家などに寄進すると、その寄進先は本家となった。領家・本家のうち、荘園の実質的な支配権をもつ方を本所という。","m":"領家の上に本家、実権者が本所"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0275","lv":2,"s":"清和源氏の祖とされ、藤原純友の乱の鎮圧にも加わったのは源満仲である。","a":0,"e":"誤り：源満仲。正しくは清和源氏の祖とされるのは清和天皇の孫の源経基で、平将門の謀反を朝廷に訴え、藤原純友の乱では追討に加わった。満仲は経基の子である。","m":"清和源氏の祖は源経基","y":941},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0276","lv":2,"s":"不輸の権をもつ荘園には、太政官符や民部省符で認められた官省符荘がある。","a":1,"e":"不輸の権は、中央の太政官や民部省が出す太政官符・民部省符で認められた官省符荘と、国司が認めた国免荘とに分けられた。国免荘の免税はその国司の任期中だけ有効で、後任の国司に否定されることもあった。","m":"中央公認の官省符荘、国司の国免荘"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0277","lv":2,"s":"平忠常は1028年に房総で反乱を起こし、源頼信がこれを鎮めて東国に源氏が進出した。","a":1,"e":"1028年、房総半島で平忠常が反乱を起こすと、追討使の平直方は鎮められず、代わった源頼信が戦わずに降伏させた。これにより清和源氏が東国の武士との関係を深め、勢力を広げる基礎ができた。","m":"1028年、忠常の乱を頼信が鎮圧","y":1028},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0278","lv":2,"s":"前九年合戦で源頼義を助けて安倍氏を滅ぼしたのは、藤原清衡である。","a":0,"e":"誤り：藤原清衡。正しくは前九年合戦で苦戦する源頼義を助けたのは、出羽の豪族清原武則である。清衡は安倍氏の血を引き、のちに清原氏の内紛を後三年合戦で勝ち抜いた人物である。","m":"前九年の援軍は清原氏","y":1062},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0279","lv":2,"s":"後三年合戦は、清原氏の内紛から起こり、源義家が藤原清衡を助けた。","a":1,"e":"前九年合戦後に奥羽で勢力をもった清原氏に家督争いが起こると、陸奥守源義家が介入し、清衡を助けて家衡らを滅ぼした（後三年合戦）。これにより清衡が奥羽の実権を握った。","m":"後三年合戦は清原氏の内紛","y":1083},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0280","lv":2,"s":"滝口の武者は、院の御所を警護するために設けられた。","a":0,"e":"誤り：院の御所。正しくは滝口の武者は9世紀末、宇多天皇のころに置かれ、内裏の清涼殿の近くで警備にあたった武士である。院の御所を警護したのは、白河上皇が置いた北面の武士である。","m":"内裏の滝口、院の北面"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0281","lv":2,"s":"藤原純友は、もと伊予の国司の役人（掾）で、瀬戸内海の海賊を率いて反乱を起こした。","a":1,"e":"藤原純友はもと伊予の国司の三等官（掾）で、任期後も現地にとどまり、瀬戸内海の海賊を率いて反乱を起こした。伊予の国府や大宰府を襲ったが、941年に朝廷が送った追捕使の軍に鎮圧された。","m":"純友は伊予の掾、瀬戸内の海賊","y":939},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0282","lv":2,"s":"平将門を討ったのは、源頼義である。","a":0,"e":"誤り：源頼義。正しくは平将門を940年に討ったのは、将門のいとこの平貞盛と下野の豪族藤原秀郷である。源頼義は約100年後の11世紀半ばに、前九年合戦で安倍氏と戦った武士。","m":"将門を討った貞盛と秀郷","y":940},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0283","lv":2,"s":"延久の荘園整理令では、摂関家の荘園は審査の対象から除外された。","a":0,"e":"誤り：除外された。正しくは延久の荘園整理令では、1045年以後の新しい荘園や証拠書類の不明な荘園が停止され、摂関家の荘園も例外とされなかった。摂関家を外戚としない後三条天皇だからこそ強く進められた。","m":"延久の整理令は摂関家領も対象","y":1069},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0284","lv":2,"s":"平安中期には、反乱の鎮圧のため、地方に押領使や追捕使が任命された。","a":1,"e":"10世紀には地方の治安が乱れ、朝廷や国司は反乱や盗賊を鎮めるため、武芸に優れた者を押領使・追捕使に任じた。これらは令外官で、のちに国ごとに置かれることもあり、武士が公的な地位を得る足がかりとなった。","m":"押領使・追捕使で武士が公職に"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0285","lv":3,"s":"平将門は下総の猿島を拠点として、常陸の国府を襲い、その後関東の諸国を従えた。","a":1,"e":"平将門は下総国の猿島（現在の茨城県南西部）を本拠とした。939年、常陸の国司と対立した豪族を助けて常陸国府を襲い、その後下野・上野の国府も占領して関東の大半を支配した。","m":"将門の本拠は下総の猿島","y":939},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0286","lv":3,"s":"藤原純友が反乱の根拠地とした場所は、下総の猿島である。","a":0,"e":"誤り：下総の猿島。正しくは藤原純友は伊予の日振島（現在の愛媛県宇和島市）を拠点とし、瀬戸内海で海賊を率いた。下総の猿島は平将門の本拠地で、東西の乱の根拠地を取り違えやすい。","m":"純友は日振島、将門は猿島","y":939},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0287","lv":3,"s":"前九年合戦は1051年から1062年にかけて、後三年合戦は1083年から1087年にかけて起こった。","a":1,"e":"前九年合戦は1051年から1062年まで、後三年合戦は1083年から1087年までの戦いである。前者は安倍氏、後者は清原氏との戦いで、いずれも源氏が東国武士を率いて関わり、源氏の名声が高まった。","m":"前九年1051〜、後三年1083〜","y":1051},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0288","lv":3,"s":"902年の延喜の荘園整理令は、すでに成立していたものを含め、すべての荘園を停止するものだった。","a":0,"e":"誤り：すべての荘園を停止。正しくは延喜の荘園整理令は、勅旨田の設置や院宮王臣家による山野の囲い込みなど新たな土地の占有を禁じたもので、証拠の確かな以前からの荘園は認めた。","m":"延喜の整理令は新規の占有を禁止","y":902},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0289","lv":3,"s":"源義家は、後三年合戦のあと、朝廷から恩賞が出なかったため、私財で部下に恩賞を与えた。","a":1,"e":"朝廷は後三年合戦を義家の私的な戦いとみなし、恩賞を与えなかった。義家は自分の財産で従った東国の武士に恩賞を与え、源氏と東国武士との主従の結びつきが強まった。","m":"義家は私財で恩賞、東国武士と結ぶ","y":1087},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0290","lv":3,"s":"奥州藤原氏の初代は藤原基衡で、2代が清衡、3代が秀衡である。","a":0,"e":"誤り：初代が基衡。正しくは奥州藤原氏の初代は清衡、2代は基衡、3代は秀衡である。秀衡の死後、子の泰衡のときに、1189年に源頼朝に攻められて滅んだ。","m":"清衡→基衡→秀衡→泰衡"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0291","lv":3,"s":"中尊寺金色堂は、奥州藤原氏の初代藤原清衡が建立した。","a":1,"e":"中尊寺金色堂は1124年に藤原清衡が建てた阿弥陀堂で、内外に金箔を押し、螺鈿などで飾られている。須弥壇の下には奥州藤原氏3代の遺体が納められ、浄土教が地方に広まったことを示す。","m":"清衡の金色堂、1124年","y":1124},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0292","lv":3,"s":"荘園・公領で、百姓は年貢のほかに、公事や夫役を負担した。","a":1,"e":"荘園や公領の農民は、田地の面積に応じて米などの年貢を納めたほか、手工業品や特産物を出す公事、労働力を提供する夫役を負担した。名の経営を任された有力農民は名主とよばれた。","m":"年貢・公事・夫役の三負担"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0293","lv":3,"s":"公領の郡司・郷司は、中央から派遣された官人である。","a":0,"e":"誤り：中央から派遣。正しくは公領の郡司・郷司・保司には、開発領主などの地元の有力者が任命され、荘園の荘官と同様に現地を支配した。中央から派遣されたのは国司（受領）やその目代である。","m":"郡司・郷司は地元の有力者"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0294","lv":1,"s":"武士団では、主人と血縁関係のある一族を郎党、血縁のない従者を家子とよんだ。","a":0,"e":"誤り：一族を郎党、従者を家子。正しくは主人と血縁関係のある一族が家子、血縁のない従者が郎党（郎等）である。武士団の長はこれらを率い、さらに大きな武士団は源氏・平氏などの棟梁のもとに集まった。","m":"血縁の家子、従者の郎党"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0295","lv":2,"s":"清和源氏の源満仲は、近江国を本拠として摂関家に仕えた。","a":0,"e":"誤り：近江国。正しくは源満仲は摂津国の多田を本拠とし、多田源氏とよばれた。摂関家に仕えて武力で奉仕し、子の頼光・頼信も摂関家と結んで、清和源氏が中央で地位を築く基礎を作った。","m":"源満仲は摂津の多田が本拠"},{"f":"古代","t":"荘園と武士の成長","ref":"KO-0296","lv":3,"s":"969年の安和の変で、源高明の謀反を密告したのは平貞盛である。","a":0,"e":"誤り：平貞盛。正しくは安和の変のきっかけは源満仲らの密告で、清和源氏は藤原北家に協力して中央での地位を築いた。平貞盛は平将門を討った武士で、その子孫から伊勢平氏が出た。","m":"安和の変を密告した源満仲","y":969},{"f":"中世","t":"院政と平氏政権","ref":"CH-0001","lv":1,"s":"白河天皇は幼い堀河天皇に位を譲り、上皇として政治の実権を握る院政を始めた。","a":1,"e":"白河天皇は1086年、幼い堀河天皇に譲位して院庁で政治を続けた。摂関家の外戚関係に左右されず、天皇家の家長として国政を動かす形がここに始まった。","m":"白河→堀河譲位で院政開始","y":1086},{"f":"中世","t":"院政と平氏政権","ref":"CH-0002","lv":1,"s":"摂関家を外戚としない後三条天皇は、譲位後に上皇として院政を行い荘園整理を進めた。","a":0,"e":"誤り：後三条天皇は在位中に親政を行い、1072年に譲位して翌年没したため院政は行っていない。正しくは、院政を始めたのは子の白河天皇（1086年）である。","m":"後三条は親政、院政は白河から","y":1072},{"f":"中世","t":"院政と平氏政権","ref":"CH-0003","lv":1,"s":"保元の乱は、崇徳上皇と後白河天皇の対立に摂関家の内紛が結びついて起こり、後白河天皇方が勝利した。","a":1,"e":"鳥羽法皇の死後、崇徳上皇・藤原頼長と後白河天皇・藤原忠通が対立した。天皇方は平清盛・源義朝らの武士を動員して勝ち、武士の実力が政争を決める時代を開いた。","m":"保元＝後白河・忠通の勝ち","y":1156},{"f":"中世","t":"院政と平氏政権","ref":"CH-0004","lv":1,"s":"平治の乱では源義朝が平清盛を破り、政権を握った。","a":0,"e":"誤り：平治の乱で勝ったのは平清盛である。正しくは、清盛が藤原信頼・源義朝を破り、義朝は敗走中に殺され、子の頼朝は伊豆に流された。","m":"平治の勝者は清盛、頼朝は伊豆へ","y":1159},{"f":"中世","t":"院政と平氏政権","ref":"CH-0005","lv":1,"s":"平清盛は武士としてはじめて太政大臣に任じられた。","a":1,"e":"1167年、清盛は武士として初めて太政大臣となり、一族も公卿や殿上人に多く昇った。武家が朝廷の官職の頂点に立ったが、政権のしくみは貴族的な性格を残していた。","m":"1167年、武士初の太政大臣","y":1167},{"f":"中世","t":"院政と平氏政権","ref":"CH-0006","lv":1,"s":"平氏は源義経らに追われ、1185年に一ノ谷の戦いで滅亡した。","a":0,"e":"誤り：1185年に平氏が滅んだのは長門の壇ノ浦の戦いで、幼い安徳天皇も入水した。正しくは、一ノ谷の戦いは前年1184年に平氏が敗れた戦いである。","m":"一ノ谷1184→屋島→壇ノ浦1185","y":1185},{"f":"中世","t":"院政と平氏政権","ref":"CH-0007","lv":1,"s":"1180年、平清盛は都を摂津の福原に移したが、反平氏の動きが強まり、まもなく京都に戻った。","a":1,"e":"1180年、清盛は摂津の福原へ都を移したが、貴族や寺社の反発に加え源氏の挙兵が相次いだため、同じ年のうちに京都へ戻した。福原は大輪田泊に近い平氏の拠点である。","m":"福原遷都は1180年、同年還都","y":1180},{"f":"中世","t":"院政と平氏政権","ref":"CH-0008","lv":1,"s":"平清盛は娘の徳子を後白河天皇に入れて外戚となり、孫の安徳天皇を即位させた。","a":0,"e":"誤り：徳子が入内したのは後白河の子の高倉天皇である。正しくは、清盛は徳子を高倉天皇の中宮とし、二人の子の安徳天皇を即位させて外祖父となった。","m":"徳子→高倉の中宮→安徳の母","y":1171},{"f":"中世","t":"院政と平氏政権","ref":"CH-0009","lv":1,"s":"後三条天皇は延久の荘園整理令を出し、記録荘園券契所を置いて荘園の証拠書類を審査させた。","a":1,"e":"後三条天皇は1069年に延久の荘園整理令を出し、記録荘園券契所で荘園の証拠書類を審査した。摂関家の荘園も対象となり、基準に合わないものは停止された。","m":"延久の整理令＝記録荘園券契所","y":1069},{"f":"中世","t":"院政と平氏政権","ref":"CH-0010","lv":1,"s":"白河上皇は院の警護のため、新たに南面の武士を置いた。","a":0,"e":"誤り：南面の武士という組織はない。正しくは、白河上皇が院の御所の北側に詰めさせた北面の武士で、平正盛ら武士が院と結びついて中央に進出するきっかけになった。","m":"院の警護は北面の武士"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0011","lv":1,"s":"平清盛は摂津の大輪田泊を修築し、宋との貿易を積極的に進めた。","a":1,"e":"清盛は摂津の大輪田泊を修築して宋の商船を畿内近くまで招き入れた。瀬戸内海航路を整えて日宋貿易を進め、その利益が知行国・荘園とならぶ平氏の経済基盤となった。","m":"大輪田泊を修築して日宋貿易"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0012","lv":1,"s":"日宋貿易で日本が宋に輸出した主な品は、宋銭や陶磁器であった。","a":0,"e":"誤り：宋銭・陶磁器・書籍などは宋からの輸入品である。正しくは、日本は金・水銀・硫黄・刀剣などを輸出した。宋銭は国内で広く流通し、貨幣経済を進めた。","m":"宋銭は輸入、金・硫黄は輸出"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0013","lv":1,"s":"平氏は瀬戸内海の航路の守護神として、安芸の厳島神社を厚く崇拝した。","a":1,"e":"安芸の厳島神社は瀬戸内海の航海を守る神として平氏に崇敬された。清盛は社殿を整え、一門の繁栄を願って美しく装飾した平家納経を奉納した。","m":"平氏の信仰は安芸の厳島神社"},{"f":"中世","t":"院政と平氏政権","ref":"CH-0014","lv":2,"s":"平治の乱では、後白河上皇の近臣信西（藤原通憲）が藤原信頼・源義朝らに襲われて自害した。","a":1,"e":"1159年、藤原信頼・源義朝は清盛が熊野詣で都を離れたすきに挙兵し、後白河上皇の近臣信西を自害に追い込んだ。しかし帰京した清盛に敗れた。","m":"平治＝清盛留守に信西を討つ","y":1159},{"f":"中世","t":"院政と平氏政権","ref":"CH-0015","lv":2,"s":"保元の乱では、平清盛と源義朝が敵味方に分かれ、親子兄弟も二つに割れて戦った。","a":0,"e":"誤り：清盛と義朝はともに後白河天皇方で戦った。正しくは、一族が分裂したのは源氏（義朝と父為義）や平氏（清盛と叔父忠正）で、敗れた為義・忠正は処刑された。","m":"清盛・義朝はともに天皇方","y":1156},{"f":"中世","t":"院政と平氏政権","ref":"CH-0016","lv":2,"s":"1177年、後白河法皇の近臣らが平氏打倒を謀って発覚した事件を鹿ヶ谷の陰謀という。","a":1,"e":"1177年、後白河法皇の近臣藤原成親や僧俊寛らが京都東山の鹿ヶ谷で平氏打倒を謀ったとして処罰された。法皇と清盛の対立が表面化した事件である。","m":"鹿ヶ谷1177、成親・俊寛ら","y":1177},{"f":"中世","t":"院政と平氏政権","ref":"CH-0017","lv":2,"s":"1179年に清盛が後白河法皇を幽閉して院政を停止した事件を、鹿ヶ谷の陰謀という。","a":0,"e":"誤り：法皇の幽閉は鹿ヶ谷の陰謀ではない。正しくは、1179年の事件は治承三年の政変で、清盛は関白を流罪にして多くの官職を一門で占めた。鹿ヶ谷の陰謀は1177年である。","m":"鹿ヶ谷1177→政変1179","y":1179},{"f":"中世","t":"院政と平氏政権","ref":"CH-0018","lv":2,"s":"知行国の制度では、上皇や貴族などが知行国主として国の収益を得て、近親者を国守に任じた。","a":1,"e":"知行国主は一国の支配権を与えられ、子弟や近親者を国守に任じて収益を得た。院政期に上皇・貴族・寺社に広が

はやせ地でも育つ救荒作物として関東に普及した。昆陽はのちにオランダ語も学んでいる。","m":"青木昆陽＝甘藷・蕃薯考"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0173","lv":3,"s":"南鐐二朱銀は、重さを量って使う秤量貨幣として流通した。","a":0,"e":"誤り：秤量貨幣。正しくは計数貨幣。それまでの丁銀・豆板銀は重さを量って使う秤量貨幣だったが、南鐐二朱銀は枚数で数えて使った。銀貨を金貨の体系に組み込むねらいがあった。","m":"南鐐二朱銀＝枚数で使う銀貨","y":1772},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0175","lv":3,"s":"『赤蝦夷風説考』の著者は、林子平である。","a":0,"e":"誤り：林子平。正しくは仙台藩医の工藤平助。林子平は『三国通覧図説』『海国兵談』を著し、海防の必要を説いて寛政の改革で処罰された。2人とも仙台にゆかりがあるため混同しやすい。","m":"赤蝦夷＝工藤、海国兵談＝林"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0176","lv":3,"s":"吉宗は、大坂の堂島米市場を公認した。","a":1,"e":"大坂の堂島では諸藩の蔵米の取引が行われていた。吉宗は米価が下がると武士の収入が減るため、1730年に堂島米市場を公認して米価の調整をはかった。米価対策に苦心した吉宗は「米公方」とよばれた。","m":"堂島米市場公認＝米価対策","y":1730},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0178","lv":1,"s":"松平定信は白河藩主から老中となり、1787年から寛政の改革を行った。","a":1,"e":"定信は天明の飢饉の際に白河藩で領民から餓死者を出さなかったと評価され、1787年の江戸の打ちこわしの直後に老中首座となった。11代家斉の補佐役として、田沼時代の政治の立て直しを進めた。","m":"1787 白河藩主定信が老中首座","y":1787},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0179","lv":1,"s":"寛政の改革では、飢饉に備えて各地に米を蓄えさせる囲米が行われた。","a":1,"e":"天明の飢饉の教訓から、定信は大名に1万石につき50石の米を蓄えさせ、各地に社倉・義倉をつくらせた。凶作時に米を放出して飢饉を防ぐ備えで、農村の荒廃を食い止めることがねらいだった。","m":"囲米＝飢饉に備えた米の備蓄"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0180","lv":1,"s":"棄捐令は、旗本・御家人の札差からの借金を帳消しにした。","a":1,"e":"札差は旗本・御家人の蔵米を担保に金を貸しており、多くの武士が借金に苦しんでいた。1789年の棄捐令は札差に古い貸金を放棄させたが、札差がその後の貸し出しを渋ったため、武士はかえって困った。","m":"棄捐令＝札差への借金を帳消し","y":1789},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0182","lv":1,"s":"寛政異学の禁で、幕府の学問所では朱子学が正学とされ、それ以外の講義が禁止された。","a":1,"e":"1790年、定信は林家の学問所で朱子学以外の儒学（古学・陽明学など）を講じることを禁じた。幕府が支える学問所の内容を統一するもので、諸藩や民間の学問まで禁じたわけではない点に注意。","m":"異学の禁＝学問所は朱子学のみ","y":1790},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0184","lv":1,"s":"七分積金は、江戸の町費を節約して積み立てさせ、飢饉などに備える制度である。","a":1,"e":"七分積金は、江戸の町々に町入用（町の経費）を節約させ、節約分の7割を積み立てさせた制度。新設の江戸町会所が運用し、飢饉や災害のときに貧しい町人を救う資金とした。","m":"七分積金＝節約分7割・町会所"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0185","lv":1,"s":"人足寄場は、江戸の石川島に設けられた、無宿人の収容施設である。","a":1,"e":"1790年、定信は火付盗賊改の長谷川平蔵の進言で、江戸の石川島に人足寄場を設けた。無宿人や軽い罪を犯した者を収容し、大工などの職業技術を身につけさせて社会復帰を促す施設だった。","m":"人足寄場＝石川島・長谷川平蔵","y":1790},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0186","lv":1,"s":"1792年、ロシア使節ラクスマンが根室に来航し、通商を求めた。","a":1,"e":"ロシア使節ラクスマンは、漂流民大黒屋光太夫らを送り届けて根室に来航し、通商を求めた。幕府は交渉の場を長崎とし、長崎への入港許可証である信牌を与えて帰国させた。","m":"1792 ラクスマン・根室・信牌","y":1792},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0188","lv":1,"s":"林子平は『海国兵談』を著し、海防の必要を説いて処罰された。","a":1,"e":"仙台の林子平は『海国兵談』で、海に囲まれた日本は外国からの侵攻に備え海防を強めるべきだと説いた。しかし幕政への批判とみなされ、1792年に版木を没収されて蟄居を命じられた。","m":"海国兵談＝海防論で処罰"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0189","lv":1,"s":"1804年に長崎に来航して通商を求めたロシア使節は、ラクスマンである。","a":0,"e":"誤り：ラクスマン。正しくはレザノフ。レザノフはラクスマンが得た信牌を持って長崎に来航したが、幕府は通商を拒否した。これに反発したロシア側が樺太や択捉を攻撃し、日露関係は緊張した。","m":"1792根室ラクスマン、1804長崎レザノフ","y":1804},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0190","lv":1,"s":"松平定信は、寛政の改革で株仲間を解散させた。","a":0,"e":"誤り：定信。正しくは天保の改革の水野忠邦。株仲間解散令は1841年。定信は田沼時代の商業重視を改め、農村の復興を重視したが、株仲間そのものは廃止していない。","m":"株仲間解散＝天保・水野"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0191","lv":2,"s":"松平定信は、8代将軍吉宗の孫にあたる人物である。","a":1,"e":"定信は御三卿の田安家に生まれた吉宗の孫で、陸奥白河藩主松平家の養子となった。祖父吉宗の享保の改革を手本に、緊縮財政と農村の復興を柱とする寛政の改革を行った。","m":"定信＝田安家出身・吉宗の孫"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0193","lv":2,"s":"寛政の改革では、倹約令が出され、風俗を取り締まる統制が強められた。","a":1,"e":"定信は武士にも町人にも質素倹約を求め、贅沢な衣服や菓子を禁じた。出版や風俗にも厳しく、政治を風刺する黄表紙や遊里を描く洒落本を取り締まった。厳しさが反感を買い、風刺の狂歌も詠まれた。","m":"倹約令＋出版・風俗の統制"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0195","lv":2,"s":"山東京伝は、洒落本の出版が風俗を乱すとして処罰された。","a":1,"e":"1791年、山東京伝は洒落本を書いたとして手鎖の刑を受け、版元の蔦屋重三郎も財産の半分を没収された。黄表紙作者の恋川春町も処罰を受けている。寛政の出版統制の代表例である。","m":"山東京伝＝洒落本で手鎖の刑"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0196","lv":2,"s":"寛政異学の禁ののち、湯島聖堂の学問所は幕府直轄の昌平坂学問所となった。","a":1,"e":"湯島聖堂の学問所は林家の私塾として出発したが、1797年に幕府直営の昌平坂学問所（昌平黌）となった。寛政異学の禁とあわせ、朱子学を幕府の正学とする体制が整えられた。","m":"1797 昌平坂学問所＝幕府直営","y":1797},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0197","lv":2,"s":"旧里帰農令は、農村から江戸に出てきた者を、江戸に定住させる法令である。","a":0,"e":"誤り：定住させる。正しくは農村に帰らせる。旧里帰農令（1790年）は、江戸に出てきた農民に旅費や農具代を与えて帰村を勧めた。強制ではなかったため効果は小さく、天保の人返しの法は強制力を強めた。","m":"旧里帰農令＝帰村を奨励","y":1790},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0199","lv":2,"s":"ラクスマンが送り届けた漂流民は、大黒屋光太夫である。","a":1,"e":"伊勢の船頭大黒屋光太夫は嵐でアリューシャン列島に漂着し、ロシアの首都で女帝エカチェリーナ2世に謁見した。ラクスマンに伴われて帰国し、その見聞は桂川甫周の『北槎聞略』にまとめられた。","m":"光太夫＝ラクスマンと帰国","y":1792},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0200","lv":2,"s":"択捉島に標柱を建てたのは、間宮林蔵である。","a":0,"e":"誤り：間宮林蔵。正しくは近藤重蔵。近藤重蔵は1798年に最上徳内らと択捉島を探査し、「大日本恵登呂府」の標柱を建てた。間宮林蔵は1808年から樺太を探査し、大陸との間の海峡を確認した。","m":"択捉＝近藤重蔵、樺太＝間宮","y":1798},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0201","lv":2,"s":"1808年、イギリス軍艦のフェートン号が長崎に侵入し、乱暴を働く事件が起きた。","a":1,"e":"ナポレオン戦争で、オランダはフランスの支配下にあった。敵対するイギリスの軍艦フェートン号はオランダ船を追って長崎に入り、薪水・食料を要求して去った。長崎奉行松平康英は責任をとって自害した。","m":"フェートン号＝英艦・長崎","y":1808},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0202","lv":2,"s":"1799年、幕府は東蝦夷地を直轄にした。","a":1,"e":"ロシアの接近に備え、幕府は1799年に東蝦夷地を直轄とし、1802年に箱館奉行を置いた。1807年には西蝦夷地も直轄として蝦夷地全体を支配し、松前藩は陸奥に移された（1821年に復帰）。","m":"1799東蝦夷→1807全蝦夷地直轄","y":1799},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0203","lv":3,"s":"寛政異学の禁は、1790年に出された。","a":1,"e":"1790年の寛政異学の禁は、湯島聖堂の学問所での朱子学以外の講義を禁じた。柴野栗山・尾藤二洲・岡田寒泉（のち古賀精里）の「寛政の三博士」が教官となり、朱子学による人材の育成が進められた。","m":"1790 異学の禁・寛政の三博士","y":1790},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0204","lv":3,"s":"棄捐令は、天明4年（1784）以降の借金を帳消しにした。","a":0,"e":"誤り：天明4年以降。正しくは天明4年（1784年）以前。棄捐令はそれ以前の古い借金を帳消しにし、それより新しい借金は利子を下げて年賦返済とした。すべての借金を消したわけではない。","m":"棄捐令＝1784年以前の分を破棄","y":1789},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0205","lv":3,"s":"尊号一件で将軍と対立した松平定信は、1793年に老中を辞した。","a":1,"e":"光格天皇が父に太上天皇の尊号を贈ろうとしたが、定信は皇位につかなかった者への尊号は認められないと拒否した。将軍家斉も実父への同様の待遇を望んでいたため、定信との関係が悪化し、1793年に辞職した。","m":"尊号一件→1793 定信辞職","y":1793},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0206","lv":3,"s":"異国船打払令（無二念打払令）は、イギリス船のみを対象としていた。","a":0,"e":"誤り：イギリス船のみ。正しくは清・オランダ以外の外国船すべて。フェートン号事件や、イギリス船員の常陸・薩摩への上陸事件を受け、1825年に外国船を見つけ次第ためらわず撃退するよう命じた。","m":"打払令＝清・蘭以外すべて撃退","y":1825},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0207","lv":3,"s":"ゴローニン事件は、国後島で、ロシア軍艦長ゴローニンが幕府の役人に捕らえられた事件である。","a":1,"e":"1811年、千島を測量中のロシア軍艦長ゴローニンが国後島で幕府の役人に捕らえられ、箱館・松前に監禁された。報復としてロシア側が高田屋嘉兵衛を捕らえたが、交渉で1813年に双方が釈放された。","m":"1811 ゴローニン・国後島","y":1811},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0208","lv":3,"s":"林子平は、『三国通覧図説』と『赤蝦夷風説考』を著した。","a":0,"e":"誤り：『赤蝦夷風説考』。正しくは『海国兵談』。林子平の著書は朝鮮・琉球・蝦夷地を図示した『三国通覧図説』と海防を説く『海国兵談』で、『赤蝦夷風説考』は工藤平助の著書である。","m":"林子平＝三国通覧図説・海国兵談"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0210","lv":3,"s":"ゴローニンの釈放に尽力した高田屋嘉兵衛は、松前藩の藩士である。","a":0,"e":"誤り：藩士。正しくは淡路出身の廻船商人。嘉兵衛は箱館を拠点に択捉航路を開いた。1812年にロシア側に捕らえられたが、ロシアで信頼を得て交渉の仲立ちをし、ゴローニンの釈放に尽力した。","m":"高田屋嘉兵衛＝箱館の廻船商人","y":1812},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0211","lv":3,"s":"間宮林蔵は、樺太が島であることを確認した。","a":1,"e":"間宮林蔵は1808年から翌年にかけて樺太を探査し、樺太が大陸と離れた島であることを確認した。大陸との間の海峡は、のちにシーボルトが紹介して間宮海峡とよばれるようになった。","m":"間宮林蔵＝樺太は島と確認","y":1808},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0212","lv":1,"s":"水野忠邦は、1841年から天保の改革を行った。","a":1,"e":"1841年に大御所家斉が死去すると、老中首座の水野忠邦は12代将軍家慶のもとで改革に着手した。享保・寛政の改革を手本とし、内憂（飢饉と一揆）と外患（列強の接近）に対応しようとした。","m":"1841 家斉の死後に水野が改革","y":1841},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0213","lv":1,"s":"1837年、元大坂町奉行所与力の大塩平八郎が、大坂で反乱を起こした。","a":1,"e":"天保の飢饉で大坂でも餓死者が出るなか、町奉行所は米を江戸へ回送し、豪商は買い占めを続けた。元与力で陽明学者の大塩平八郎は1837年に門弟や農民と挙兵し、幕府の直轄都市に大きな衝撃を与えた。","m":"1837 大坂で元与力大塩が挙兵","y":1837},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0215","lv":1,"s":"モリソン号事件を批判した渡辺崋山・高野長英らが、蛮社の獄で処罰された。","a":1,"e":"1837年、日本人漂流民を乗せたアメリカ商船モリソン号が浦賀と山川で砲撃された。これを批判した渡辺崋山と高野長英は、1839年の蛮社の獄で処罰された。蘭学者への弾圧として知られる。","m":"蛮社の獄＝崋山と長英","y":1839},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0217","lv":1,"s":"水野忠邦は、株仲間解散令を出して、物価の引き下げをはかった。","a":1,"e":"水野は物価高の原因を株仲間による流通の独占にあると考え、1841年に株仲間の解散を命じた。しかし実際には、生産地の商人が大坂を通さず直接売るようになったことが物価高の背景にあり、効果はなかった。","m":"1841 株仲間解散＝物価対策","y":1841},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0218","lv":1,"s":"人返しの法は、農村から江戸への出稼ぎを奨励する法令である。","a":0,"e":"誤り：奨励。正しくは農村から江戸への出稼ぎや移住を禁じ、江戸に住む農民を帰らせる法令。寛政の旧里帰農令が帰村を勧めたのに対し、人返しの法は強制的に帰農させた点が異なる。","m":"旧里帰農＝勧め、人返し＝強制","y":1843},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0219","lv":1,"s":"上知令は、江戸・大坂周辺を幕府直轄地にしようとしたが、反対で失敗した。","a":1,"e":"1843年の上知令は、江戸・大坂周辺の大名・旗本領を幕府直轄地とし、代わりの土地を与える計画だった。財政の強化と海防の拠点づくりをねらったが、大名・旗本の強い反対で撤回され、水野は失脚した。","m":"上知令の失敗→水野失脚","y":1843},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0221","lv":1,"s":"天保の薪水給与令は、アヘン戦争での清の敗北を知った幕府が出した。","a":1,"e":"1840年からのアヘン戦争で清がイギリスに敗れたことを知った幕府は、異国船を撃退し続ければ戦争になると恐れた。1842年、打払令をやめ、漂着した外国船には燃料や水・食料を与えて帰すことにした。","m":"アヘン戦争→1842 薪水給与令","y":1842},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0222","lv":1,"s":"天保の薪水給与令は、1825年に出された。","a":0,"e":"誤り：1825年。正しくは1842年。1825年に出されたのは外国船の撃退を命じた異国船打払令。天保の薪水給与令はそれを緩める法令で、1806年の文化の撫恤令と同じ方針への復帰でもあった。","m":"1825 打払令→1842 薪水給与令","y":1842},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0223","lv":1,"s":"薩摩藩では、調所広郷が黒砂糖の専売などで財政再建を進めた。","a":1,"e":"薩摩藩は500万両に及ぶ借金を抱えていた。調所広郷は借金の返済を事実上棚上げし、奄美三島の黒砂糖の専売を強化し、琉球を通じた中国との貿易も拡大して財政を立て直した。","m":"薩摩＝調所広郷・黒砂糖専売"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0224","lv":1,"s":"長州藩では、村田清風が藩財政の改革を行った。","a":1,"e":"長州藩は約8万貫の借金に苦しんでいた。村田清風は藩士の借金を整理し、紙・蠟の専売制を改め、下関に越荷方を置いて他国の廻船相手に金融と倉庫業を営み、藩の収入を増やした。","m":"長州＝村田清風・越荷方"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0225","lv":2,"s":"大塩平八郎の乱は、「救民」の旗を掲げて起こされた。","a":1,"e":"大塩平八郎は「救民」と書いた旗を掲げ、蔵書を売って得た金を貧民に配ったうえで挙兵した。豪商の屋敷を焼き打ちしたが、乱は半日ほどで鎮圧された。乱は各地に波及し、越後では生田万の乱が起こった。","m":"大塩の乱＝「救民」の旗","y":1837},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0226","lv":2,"s":"モリソン号は、イギリスの軍艦である。","a":0,"e":"誤り：イギリスの軍艦。正しくはアメリカの商船。モリソン号は日本人漂流民の送還と通商を目的に1837年に来航したが、異国船打払令に基づき浦賀と山川で砲撃された。乗組員に武装の意図はなかった。","m":"モリソン号＝米国の商船","y":1837},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0227","lv":2,"s":"渡辺崋山は『慎機論』、高野長英は『戊戌夢物語』で幕府の対外政策を批判した。","a":1,"e":"モリソン号の打ち払いを知った崋山は『慎機論』、長英は『戊戌夢物語』を著し、幕府の対応を批判した。1839年、2人は幕府批判の罪で処罰された（蛮社の獄）。崋山は蟄居中に自害した。","m":"崋山＝慎機論、長英＝夢物語","y":1838},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0228","lv":2,"s":"為永春水は、天保の改革の出版統制で処罰された。","a":1,"e":"天保の改革では風俗を乱すとして出版が統制され、人情本作者の為永春水が手鎖の刑を受け、合巻『偐紫田舎源氏』の作者柳亭種彦も処罰された。寛政の改革の山東京伝と区別して覚える。","m":"天保＝春水・種彦、寛政＝京伝"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0229","lv":2,"s":"株仲間の解散により、流通は円滑になり物価が下がった。","a":0,"e":"誤り：流通が円滑になり物価が下がった。正しくは流通がかえって混乱し、物価は下がらなかった。株仲間による流通の仕組みが崩れた一方、物価高の根本原因は別にあったため、解散は逆効果に終わった。","m":"株仲間解散＝流通が混乱","y":1841},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0230","lv":2,"s":"水野忠邦は、印旛沼の干拓を再開した。","a":1,"e":"印旛沼の干拓は田沼時代に始まったが、1786年の大洪水で中止された。水野は新田開発と江戸湾への水路確保をめざして1843年に再開したが、自らの失脚で再び中止となった。","m":"印旛沼干拓＝田沼と水野が挑む"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0231","lv":2,"s":"水野忠邦は風俗統制の一環として、江戸の歌舞伎の三座を日本橋に移転させた。","a":0,"e":"誤り：日本橋。正しくは浅草の猿若町。天保の改革では芝居が風俗を乱すとされ、江戸の中心にあった中村座・市村座・森田座の三座が、郊外の浅草に移された。寄席の数も大きく減らされた。","m":"江戸三座を浅草猿若町へ"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0232","lv":2,"s":"上知令は、江戸・大坂の周囲約10里四方を直轄地にしようとした。","a":1,"e":"上知令は江戸・大坂のそれぞれ周囲約10里四方の土地を幕府直轄地にしようとした。この地域には年貢率の高い豊かな領地が多く、対象となった大名・旗本が強く反発した。","m":"上知令＝江戸・大坂の10里四方","y":1843},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0233","lv":2,"s":"薩摩藩の調所広郷は、琉球との貿易を通じて財政を再建した。","a":1,"e":"薩摩藩は琉球を支配していたため、琉球と中国の朝貢貿易を利用して中国の産物を手に入れることができた。調所広郷はこの貿易を拡大して利益を上げ、黒砂糖の専売とともに財政再建の柱とした。","m":"薩摩＝琉球経由の中国貿易"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0234","lv":2,"s":"越荷方は、佐賀藩に置かれた金融・倉庫業の役所である。","a":0,"e":"誤り：佐賀藩。正しくは長州藩。越荷方は下関を通る他国の廻船の積荷（越荷）を担保に資金を貸し、荷物を保管したり買い取ったりした。北前船の航路の要地である下関の位置を生かした事業だった。","m":"越荷方＝長州藩・下関の金融"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0235","lv":2,"s":"佐賀藩では、藩主の鍋島直正が均田制を行い、反射炉を築いた。","a":1,"e":"鍋島直正は小作地を地主から取り上げて小作人に分け与える均田制で本百姓を立て直した。また1850年に日本で初めて反射炉を築き、鉄製の大砲を製造して藩の軍事力を高めた。","m":"佐賀＝鍋島直正・均田制・反射炉"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0236","lv":2,"s":"水戸藩の藩政改革を主導した藩主は、鍋島直正である。","a":0,"e":"誤り：鍋島直正。正しくは徳川斉昭。水戸藩主の斉昭は藤田東湖・会沢安らを登用して改革を進め、藩校弘道館を開いた。ただし保守派との対立が激しく、改革は十分な成果を上げられなかった。","m":"水戸＝徳川斉昭、佐賀＝鍋島直正"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0237","lv":3,"s":"大塩平八郎は、陽明学を学んだ学者であった。","a":1,"e":"大塩平八郎は陽明学者として私塾洗心洞を開いていた。陽明学は知ることと行うことを一体とみる知行合一を説き、現実の不正を正す実践を重んじた。朱子学を正学とした幕府の立場とは異なる。","m":"大塩＝陽明学・洗心洞","y":1837},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0239","lv":3,"s":"人返しの法は、1843年に出された。","a":1,"e":"人返しの法は1843年に出され、上知令と同じ年にあたる。天保の飢饉で荒れた農村を立て直すため、江戸に流れ込んだ農民を帰村させ、新たに村を出ることも禁じた。","m":"1843＝人返しの法と上知令","y":1843},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0240","lv":3,"s":"上知令に反対した人々のなかには、老中土井利位がいた。","a":1,"e":"上知令には対象となった大名・旗本だけでなく、自らの領地が含まれる老中土井利位も反対した。幕閣内でも支持を失った水野は1843年に罷免され、上知令は撤回された。","m":"上知令に老中土井利位も反対","y":1843},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0241","lv":3,"s":"渡辺崋山らは、尚歯会に集まって蘭学を学んだ。","a":1,"e":"尚歯会は、渡辺崋山・高野長英らが参加した学者の集まりで、初めは飢饉対策などを話し合った。のち海外事情の研究も進め、幕府の対外政策に批判的になった。蛮社の獄はこの会への弾圧でもある。","m":"尚歯会＝崋山・長英の研究会"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0242","lv":3,"s":"渡辺崋山は、鳴滝塾でシーボルトに学んだ。","a":0,"e":"誤り：渡辺崋山。正しくは高野長英。長英は長崎でシーボルトの鳴滝塾に学んだ医者・蘭学者である。崋山は三河田原藩の家老で、画家としても知られた。2人は尚歯会でともに活動した。","m":"鳴滝塾＝長英、崋山＝田原藩家老"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0243","lv":3,"s":"株仲間は、水野忠邦の在職中に再興された。","a":0,"e":"誤り：水野の在職中。正しくは水野の失脚後の1851年に、老中阿部正弘のもとで再興を許可された。株仲間の解散で流通が混乱したことを受けた措置で、天保の改革が失敗したことを示している。","m":"株仲間の再興＝1851年","y":1851},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0244","lv":3,"s":"薩摩藩の財政を再建した調所広郷は、藩の借金を25年賦で返済することとした。","a":0,"e":"誤り：25年賦。正しくは250年賦。調所広郷は三都の商人からの借金500万両を、無利子・250年賦で返す条件を一方的に認めさせた。事実上の踏み倒しで、これにより藩財政は立ち直った。","m":"薩摩の借金＝250年賦"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0245","lv":3,"s":"水戸藩の徳川斉昭は、藩校の弘道館を設立した。","a":1,"e":"水戸藩主徳川斉昭は1841年に藩校弘道館を開き、文武の教育を行った。藤田東湖や会沢安らの水戸学は尊王攘夷の考え方を説き、幕末の志士たちに大きな影響を与えた。","m":"斉昭＝弘道館・水戸学"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0246","lv":3,"s":"モリソン号事件は、異国船打払令が出される前に起こった。","a":0,"e":"誤り：出される前。正しくは出された後。異国船打払令は1825年、モリソン号事件は1837年である。打払令に基づいてモリソン号が砲撃され、それを批判した崋山・長英が1839年に処罰された。","m":"1825打払令→1837モリソン号","y":1837},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0247","lv":1,"s":"江戸時代の五街道は、江戸の日本橋を起点としていた。","a":1,"e":"東海道・中山道・甲州道中・日光道中・奥州道中の五街道は、いずれも江戸の日本橋を起点とし、幕府の道中奉行が管理した。江戸を中心とする道路網は、参勤交代や幕府の命令の伝達を支えた。","m":"五街道＝日本橋起点・道中奉行"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0249","lv":1,"s":"江戸時代には街道に関所が置かれ、入り鉄砲と出女が厳しく取り締まられた。","a":1,"e":"箱根や碓氷などの関所では、江戸に持ち込まれる鉄砲と、江戸から出る女性が特に厳しく調べられた。江戸で人質となっている大名の妻子の脱出と、江戸での武装蜂起を防ぐためだった。","m":"入鉄砲に出女＝謀反の防止"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0250","lv":1,"s":"江戸と大坂を結ぶ航路では、菱垣廻船や樽廻船が活躍した。","a":1,"e":"江戸は大消費地だったが、日用品の多くは上方で生産された。江戸と大坂を結ぶ南海路では、木綿・油・醤油など多様な品を運ぶ菱垣廻船と、酒を専門に運び始めた樽廻船が競い合った。","m":"南海路＝菱垣廻船と樽廻船"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0251","lv":1,"s":"東廻り航路と西廻り航路を整備した商人は、角倉了以である。","a":0,"e":"誤り：角倉了以。正しくは河村瑞賢。瑞賢は幕府の命で、1671年に東廻り航路、1672年に西廻り航路を整備し、東北・北陸の年貢米を江戸や大坂へ大量に運べるようにした。角倉了以は河川の開削で知られる。","m":"東廻り・西廻り＝河村瑞賢","y":1671},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0252","lv":1,"s":"大坂は商業の中心として、「天下の台所」とよばれた。","a":1,"e":"大坂には諸藩の蔵屋敷が集まり、年貢米や特産物が売りさばかれて全国の物資と資金が集中した。このため「天下の台所」とよばれた。江戸は「将軍のお膝元」、京都は朝廷と伝統工芸の都市だった。","m":"大坂＝蔵屋敷が集まる天下の台所"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0253","lv":1,"s":"大坂には、諸藩が年貢米や特産物を売るための蔵屋敷が置かれた。","a":1,"e":"蔵屋敷は諸藩が大坂や江戸に置いた倉庫兼取引所で、年貢米などの蔵物を保管・販売した。商品の売却を担う蔵元、代金の出納を担う掛屋には、多くの場合大坂の有力商人が任じられた。","m":"蔵屋敷＝蔵元・掛屋が担う"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0254","lv":1,"s":"江戸は銀遣い、上方は金遣いであった。","a":0,"e":"誤り：銀遣いと金遣いが逆。正しくは江戸は金遣い、上方は銀遣い。東日本では金貨、西日本では銀貨が主に取引に使われたため、両者の交換を扱う両替商が重要な役割を果たした。","m":"東の金遣い、西の銀遣い"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0255","lv":1,"s":"江戸時代の三貨のうち、銭は主に少額の取引に使われた。","a":1,"e":"江戸時代の貨幣は金・銀・銭の三貨。銭は寛永通宝などの銅銭で、日常の少額の買い物に用いられた。寛永通宝は1636年から大量に鋳造され、中国からの輸入銭に頼った中世の状態から脱した。","m":"銭＝寛永通宝・少額取引"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0256","lv":1,"s":"本百姓は、田畑を所有して年貢を納める百姓である。","a":1,"e":"本百姓は検地帳に登録され、田畑・屋敷を持って年貢・諸役を負担する百姓で、村の正式な構成員として寄合に参加した。幕府や藩は年貢の担い手である本百姓の維持を重視した。","m":"本百姓＝高持・年貢負担者"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0257","lv":1,"s":"水呑百姓は、大きな田畑を持ち、村の運営に参加した。","a":0,"e":"誤り：大きな田畑を持ち。正しくは田畑を持たない無高の百姓。水呑百姓は地主の土地を借りる小作や日雇いで暮らし、村の運営にはほとんど参加できなかった。村の運営は本百姓が担った。","m":"水呑百姓＝無高・小作で生計"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0258","lv":1,"s":"1643年、田畑永代売買の禁止令が出された。","a":1,"e":"田畑永代売買の禁止令は、寛永の飢饉の後の1643年に出された。百姓が田畑を売って没落し、一部に土地が集中するのを防ぎ、年貢を負担する本百姓を維持することが目的だった。","m":"1643 田畑永代売買の禁止","y":1643},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0260","lv":2,"s":"宿場には問屋場が置かれ、人馬の継ぎ立てや荷物の運搬を担った。","a":1,"e":"宿駅（宿場）には問屋場が置かれ、幕府の公用の荷物や書状を次の宿まで人馬で運んだ（継飛脚・伝馬）。宿には大名が泊まる本陣・脇本陣や、一般の旅人が泊まる旅籠もあった。","m":"問屋場＝人馬の継ぎ立て"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0261","lv":2,"s":"年貢の納入は、村が責任を持つ村請制で行われた。","a":1,"e":"村請制では、年貢・諸役は個々の百姓ではなく村全体に割り当てられ、村が責任をもって納めた。名主らが各戸に割り振って取りまとめた。村の自治を利用して支配する仕組みだった。","m":"村請制＝年貢は村単位で納入"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0262","lv":2,"s":"千歯扱は、田に水をくみ入れる灌漑用の農具である。","a":0,"e":"誤り：灌漑用。正しくは脱穀用。千歯扱は細い歯の間に稲穂を通して籾を落とす道具で、作業効率を大きく高めた。灌漑には踏車、深く耕すには備中鍬、籾の選別には唐箕が使われた。","m":"千歯扱＝脱穀、踏車＝灌漑"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0263","lv":2,"s":"金肥とは、人糞尿や草木灰などの自給肥料のことである。","a":0,"e":"誤り：自給肥料。正しくは金で購入する肥料。干鰯・〆粕・油粕などがあり、木綿などの商品作物の栽培に使われた。刈敷・草木灰・下肥などの自給肥料と区別する。金肥の普及は貨幣経済の浸透を示す。","m":"金肥＝干鰯・油粕など購入肥料"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0264","lv":2,"s":"『農具便利論』は、宮崎安貞が著した農書である。","a":0,"e":"誤り：宮崎安貞。正しくは大蔵永常。大蔵永常は19世紀前半に『農具便利論』『広益国産考』を著し、農具や商品作物を紹介した。宮崎安貞は17世紀末に『農業全書』を著した人物である。","m":"農具便利論・広益国産考＝永常"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0265","lv":2,"s":"四木三草は、幕府・藩が奨励した商品作物である。","a":1,"e":"四木は桑・楮・漆・茶、三草は麻・藍・紅花をさす。養蚕・製紙・漆器・染料などの原料となり、藩が専売にして財源とすることも多かった。商品作物の栽培は農村に貨幣経済を広げた。","m":"四木三草＝代表的な商品作物"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0266","lv":2,"s":"札差は、旗本・御家人の蔵米の受け取りと売却を代行した。","a":1,"e":"札差は江戸の浅草蔵前で、旗本・御家人の代わりに幕府の蔵から蔵米を受け取り、換金した商人。蔵米を担保に金貸しも行って巨利を得た。棄捐令はこの札差への借金を対象とした。","m":"札差＝蔵米の受取・換金"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0267","lv":2,"s":"問屋制家内工業は、問屋が原料や道具を貸して家内で生産させる形態である。","a":1,"e":"問屋制家内工業は、問屋が農家に原料や道具を前貸しし、できた製品を買い取る形態。18世紀に広がり、19世紀には作業場に労働者を集めて分業させる工場制手工業（マニュファクチュア）も現れた。","m":"問屋制＝原料前貸し→工場制へ"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0268","lv":2,"s":"三井高利の越後屋は、掛け売りを基本とした呉服店である。","a":0,"e":"誤り：掛け売り。正しくは現金掛け値なし。当時の呉服店は得意先に後払いで売るのが普通だったが、越後屋は店頭で定価・現金払いで販売して庶民の客を集めた。両替商も営み、のちの三井につながる。","m":"越後屋＝現金掛け値なし"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0269","lv":2,"s":"町では、借家人の店借が町役人を務めた。","a":0,"e":"誤り：店借。正しくは地主・家持。町の運営は町人のうち土地や家屋を持つ者が担い、名主・月行事などの町役人を出した。店借（借家人）や地借は町の運営には参加できなかった。","m":"町政＝家持、店借は不参加"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0270","lv":2,"s":"百姓一揆では、首謀者を隠す傘連判状が用いられた。","a":1,"e":"傘連判状は、参加者の名前を円形に放射状に書き連ね、誰が首謀者か分からないようにした文書。一揆の指導者は厳罰に処されたため、全員が対等な立場で団結していることを示す意味もあった。","m":"傘連判状＝円形の署名で首謀者隠し"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0271","lv":2,"s":"宮崎安貞は、農業の技術を説いた『農業全書』を著した。","a":1,"e":"宮崎安貞の『農業全書』（1697年）は、中国の農書を参考にしつつ、自ら各地を歩いて得た知見をもとに作物の栽培法をまとめた。日本で初めての体系的な農書として、広く読まれた。","m":"農業全書＝宮崎安貞・17世紀末"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0273","lv":3,"s":"河村瑞賢が整備した西廻り航路は、出羽の酒田から日本海を通り、大坂に至る。","a":1,"e":"西廻り航路は出羽の酒田から日本海を南下し、下関から瀬戸内海を通って大坂に至り、さらに江戸へ向かった。日本海沿岸の米を上方に運ぶ大動脈となり、のちに北前船が活躍した。","m":"西廻り＝酒田→下関→大坂","y":1672},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0276","lv":3,"s":"金貨は計数貨幣、銀貨は秤量貨幣として用いられた。","a":1,"e":"小判などの金貨は額面が決まっており枚数で数える計数貨幣、丁銀・豆板銀などの銀貨は重さを量って使う秤量貨幣だった。単位も金は両・分・朱、銀は貫・匁と異なり、交換には相場が立った。","m":"金＝数える、銀＝量る"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0277","lv":3,"s":"大坂の鴻池は、札差として知られる豪商である。","a":0,"e":"誤り：札差。正しくは両替商。鴻池は大坂の酒造業から始まり、両替商として大名への貸付（大名貸）で巨富を築いた。札差は江戸の浅草蔵前で旗本・御家人の蔵米を扱った商人である。","m":"鴻池＝大坂の両替商・大名貸"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0278","lv":3,"s":"二十四組問屋は、江戸に置かれた問屋の仲間である。","a":0,"e":"誤り：江戸。正しくは大坂。大坂から江戸へ荷を送る問屋の仲間が大坂の二十四組問屋、それを受け取る江戸の問屋の仲間が十組問屋である。菱垣廻船の運航をめぐって両者が結びついた。","m":"大坂＝二十四組、江戸＝十組"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0279","lv":3,"s":"村では、掟に違反した者に対し、村八分という制裁が行われた。","a":1,"e":"村には寄合で定めた村掟があり、違反した者には村八分などの制裁が科された。村八分は火事と葬式を除いて交際を断つものとされ、共同作業の多い村では生活に大きな打撃となった。","m":"村八分＝村掟違反への制裁"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0280","lv":3,"s":"助郷は、宿駅の人馬が不足する際に、周辺の村に課された負担である。","a":1,"e":"参勤交代や公用の通行が増えると、宿場の人馬だけでは足りなくなった。そこで周辺の村に人馬の提供を命じたのが助郷で、農繁期の負担が重く、助郷の増加に反対する一揆も起こった。","m":"助郷＝宿場周辺の村の負担"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0281","lv":3,"s":"小物成は、田畑に課された本年貢の別称である。","a":0,"e":"誤り：本年貢。正しくは山野河海の利用や副業などに課された雑税。田畑・屋敷にかかる本年貢は本途物成とよばれた。ほかに村の石高に応じて課す高掛物や、労働を課す夫役などがあった。","m":"本途物成＝本年貢、小物成＝雑税"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0282","lv":3,"s":"三都とは、江戸・大坂・名古屋をさす。","a":0,"e":"誤り：名古屋。正しくは京都。三都は江戸・大坂・京都をさす。江戸は政治の中心、大坂は商業の中心、京都は朝廷があり西陣織などの高級手工業が発達した文化の都市だった。","m":"三都＝江戸・大坂・京都"},{"f":"近世","t":"織豊政権","ref":"KS-0283","lv":1,"s":"織田信長が1576年から築いた安土城は、尾張に位置する。","a":0,"e":"誤り：尾張。正しくは近江。信長は琵琶湖の東岸の安土に城を築き、京都に近く東国と北陸を結ぶ交通の要地を本拠とした。天守をもつ壮大な城で、城下には楽市令が出された。","m":"安土城＝近江・琵琶湖の東岸","y":1576},{"f":"近世","t":"織豊政権","ref":"KS-0284","lv":2,"s":"織田信長と石山戦争を戦った石山本願寺は、浄土宗の本山である。","a":0,"e":"誤り：浄土宗。正しくは浄土真宗（一向宗）。顕如を中心とする石山本願寺は各地の一向一揆と連携して11年間信長と戦い、1580年に講和して石山を退去した。跡地にはのちに大坂城が築かれた。","m":"石山本願寺＝浄土真宗・顕如","y":1580},{"f":"近世","t":"江戸幕府の成立と幕藩体制","ref":"KS-0285","lv":1,"s":"老中を補佐し、主に旗本・御家人を統轄した役職は大目付である。","a":0,"e":"誤り：大目付。正しくは若年寄。若年寄は老中に次ぐ役職で譜代大名から選ばれ、旗本・御家人を指揮した。大目付は老中の配下で大名を監察する役職で、旗本から任じられた。","m":"旗本・御家人を統轄＝若年寄"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0286","lv":1,"s":"絵踏は、キリスト教徒でないことを証明させるため、仏像を踏ませるものであった。","a":0,"e":"誤り：仏像。正しくはキリストやマリアの像を刻んだ踏絵。九州の長崎などで毎年行われ、踏めない者をキリシタンとして摘発した。寺請制度とならぶキリスト教取り締まりの手段だった。","m":"絵踏＝キリスト・マリア像を踏む"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0287","lv":2,"s":"オランダ商館長は定期的に江戸へ参府し、天皇に拝謁した。","a":0,"e":"誤り：天皇。正しくは将軍。オランダ商館長は貿易を許されたお礼として江戸に参府し、将軍に拝謁して献上品を贈った。初めは毎年、1790年以降は4年に1度となった。","m":"商館長の江戸参府＝将軍に拝謁"},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0288","lv":2,"s":"支倉常長を慶長遣欧使節としてヨーロッパへ派遣したのは、薩摩の島津家久である。","a":0,"e":"誤り：島津家久。正しくは仙台藩主伊達政宗。政宗はメキシコ（ノビスパン）との直接貿易をめざして1613年に支倉常長を送り出した。常長はローマ教皇に会ったが、通商の目的は果たせなかった。","m":"慶長遣欧使節＝伊達政宗・支倉","y":1613},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0289","lv":3,"s":"1633年、幕府は奉書船以外の日本船の海外渡航を禁止した。","a":1,"e":"奉書船とは、朱印状に加えて老中が発給する奉書を持った船。1631年に奉書船制度が始まり、1633年にはそれ以外の渡航が禁じられた。渡航の統制は段階的に強められ、1635年の全面禁止に至る。","m":"1633 奉書船以外の渡航禁止","y":1633},{"f":"近世","t":"江戸初期の外交（鎖国）","ref":"KS-0290","lv":3,"s":"1610年、徳川家康がノビスパン（メキシコ）へ派遣した京都の商人は、角倉了以である。","a":0,"e":"誤り：角倉了以。正しくは田中勝介。家康はスペイン領メキシコとの通商を望み、前年に漂着した前フィリピン総督の帰国にあわせて田中勝介を派遣した。通商は実現しなかった。","m":"ノビスパン派遣＝田中勝介","y":1610},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0291","lv":1,"s":"明暦の大火（1657年）は、5代将軍綱吉の時代の出来事である。","a":0,"e":"誤り：綱吉。正しくは4代将軍家綱。家綱の初期に起きた明暦の大火の復興費用は、幕府財政を悪化させる一因となった。綱吉が将軍となったのは1680年である。","m":"明暦の大火＝家綱の時代","y":1657},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0292","lv":2,"s":"新井白石は、古学派の荻生徂徠に学んだ朱子学者である。","a":0,"e":"誤り：荻生徂徠。正しくは朱子学者の木下順庵。白石は順庵の推薦で甲府藩主時代の家宣に仕えた。荻生徂徠は古文辞学派の学者で、柳沢吉保や吉宗に仕え、白石とは考えが対立した。","m":"白石の師＝朱子学者木下順庵"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0293","lv":2,"s":"新井白石は、朝鮮通信使の待遇を以前より豪華にした。","a":0,"e":"誤り：豪華にした。正しくは簡素化した。白石は1711年の通信使来日の際、接待の費用が膨大であることを問題とし、待遇を簡素にして経費を減らした。国書の将軍の呼称も日本国王に改めた。","m":"白石＝通信使の待遇を簡素化","y":1711},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0294","lv":3,"s":"新井白石が世界の地理を記した著書は、『読史余論』である。","a":0,"e":"誤り：『読史余論』。正しくは『采覧異言』。『読史余論』は白石が家宣への講義をもとに、公家政権から武家政権への移り変わりを独自の時代区分で論じた歴史書である。","m":"世界地理＝采覧異言、歴史＝読史余論"},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0295","lv":3,"s":"明暦の大火で焼失した江戸城の天守は、その後再建されなかった。","a":1,"e":"保科正之は、天守は実戦では役に立たず、町の復興を優先すべきだと主張した。このため天守台は築き直されたが天守は建てられなかった。武力の誇示より民政を重んじる文治政治の姿勢を示す例とされる。","m":"大火の後、天守より町の復興","y":1657},{"f":"近世","t":"文治政治と元禄期","ref":"KS-0296","lv":3,"s":"家綱の時代、大名が重臣の子弟を人質として江戸に差し出す証人制が強化された。","a":0,"e":"誤り：強化された。正しくは1665年に廃止された。大名の重臣の子を人質として江戸に置かせる証人制は、幕府と大名の関係が安定したため不要とされた。殉死の禁止と並ぶ家綱期の文治政策である。","m":"1665 証人制の廃止","y":1665},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0297","lv":1,"s":"享保の改革では、財政再建のために新田開発が禁止された。","a":0,"e":"誤り：禁止された。正しくは奨励された。吉宗は1722年に日本橋に高札を立てて、町人の資金による新田開発（町人請負新田）を呼びかけた。耕地の拡大で年貢収入を増やそうとした。","m":"享保の改革＝新田開発を奨励","y":1722},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0298","lv":2,"s":"吉宗は、野呂元丈と青木昆陽にスペイン語を学ばせた。","a":0,"e":"誤り：スペイン語。正しくはオランダ語。吉宗は実用的な学問を重んじ、漢訳洋書の輸入緩和に続いて両者にオランダ語の習得を命じた。これがのちの蘭学の発展の出発点となった。","m":"元丈・昆陽＝オランダ語を学ぶ","y":1740},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0299","lv":2,"s":"吉宗は物価を統制するため、商人の仲間組織を一律に禁止した。","a":0,"e":"誤り：一律に禁止した。正しくは仲間組織を公認した。吉宗は商人に仲間を結成させ、仲間を通じて物価や流通を統制しようとした。株仲間を積極的に増やし税を取ったのは田沼意次である。","m":"吉宗も仲間を公認し物価統制"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0300","lv":2,"s":"田沼意次は、長崎貿易で銅の輸出を制限して国内の銅を確保した。","a":0,"e":"誤り：輸出を制限した。正しくは輸出を奨励した。田沼は銅座を設けて銅を集め、俵物とともに長崎貿易の輸出品とした。輸出を増やすことで金銀の流出を抑え、逆に流入させようとした。","m":"田沼＝銅と俵物の輸出奨励"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0301","lv":2,"s":"田沼意次の子で若年寄の田沼意知は、江戸城内で旗本に斬られて死去した。","a":1,"e":"1784年、若年寄の田沼意知は江戸城内で旗本佐野政言に斬られて死去した。民衆は佐野を「世直し大明神」とたたえたとされ、田沼政治への反感の強さを示した。意次の勢力が衰える契機となった。","m":"意知の刺殺＝田沼政治の陰り","y":1784},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0302","lv":2,"s":"工藤平助は『赤蝦夷風説考』で、ロシアとの交易を禁じるよう主張した。","a":0,"e":"誤り：交易を禁じる。正しくはロシアとの交易と蝦夷地の開発を説いた。工藤平助はロシアの南下に対し、蝦夷地を開発して国力を高め、交易で利益を得るべきだとした。田沼はこれを受け蝦夷地を調査させた。","m":"赤蝦夷風説考＝交易と開発を説く"},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0303","lv":3,"s":"吉宗は1736年、元文の改鋳で貨幣の質を引き上げた。","a":0,"e":"誤り：質を引き上げた。正しくは質を落とした。米価が下がって武士の収入が減っていたため、吉宗は品位を下げた元文金銀を発行して通貨量を増やし、米価を含む物価を引き上げようとした。","m":"元文の改鋳＝質を下げ米価を上げる","y":1736},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0304","lv":3,"s":"上げ米の制は、享保の改革が終わるまで継続された。","a":0,"e":"誤り：改革が終わるまで継続。正しくは1730年に停止された。新田開発や定免法で年貢収入が増え財政が持ち直したため、上げ米は1722年からわずか9年ほどでやめられ、参勤交代の在府期間も元に戻った。","m":"上げ米は1730年に停止","y":1730},{"f":"近世","t":"享保の改革と田沼時代","ref":"KS-0305","lv":3,"s":"南鐐二朱銀は、4枚で金1両に相当した。","a":0,"e":"誤り：4枚。正しくは8枚。二朱は1両の8分の1にあたるため、南鐐二朱銀8枚で小判1両と交換できた。金の単位は1両＝4分＝16朱である。銀貨を金貨の単位で表した点が画期的だった。","m":"南鐐二朱銀8枚＝小判1両","y":1772},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0306","lv":1,"s":"松平定信は、10代将軍家治のもとで老中首座となった。","a":0,"e":"誤り：家治。正しくは11代将軍家斉。家治の死後に田沼意次が失脚し、1787年、15歳で将軍となった家斉のもとで定信が老中首座に就いた。のち将軍補佐も兼ねた。","m":"定信＝家斉のもとで老中首座","y":1787},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0307","lv":1,"s":"松平定信は、寛政の改革を田沼意次の政治を手本として進めた。","a":0,"e":"誤り：田沼意次の政治。正しくは祖父吉宗の享保の改革。定信は田沼時代の商業重視や賄賂の横行を批判し、倹約と農村の復興を重んじる享保の改革の路線に戻そうとした。","m":"寛政の改革の手本＝享保の改革"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0308","lv":1,"s":"1825年の異国船打払令は、外国船に燃料や食料を与えて穏便に帰すよう命じた。","a":0,"e":"誤り：燃料や食料を与えて帰す。正しくはためらわずに撃退する。燃料や食料を与えて帰す方針は、1806年の文化の撫恤令や、アヘン戦争後の1842年の天保の薪水給与令のものである。","m":"打払令＝撃退、薪水給与令＝給与","y":1825},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0309","lv":2,"s":"レザノフは、ラクスマンが受け取った信牌を持って長崎に来航した。","a":1,"e":"1804年、ロシア使節レザノフは、ラクスマンが与えられた長崎入港の許可証（信牌）を持って長崎に来た。しかし幕府は通商を拒否して半年ほど待たせたうえで帰国させ、ロシアとの関係は悪化した。","m":"信牌を持つレザノフ＝長崎へ","y":1804},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0310","lv":2,"s":"将軍職を譲った後も家斉が実権を握り続けた時期を、元禄時代という。","a":0,"e":"誤り：元禄時代。正しくは大御所時代。家斉は1837年に将軍職を家慶に譲ったが、1841年に死去するまで大御所として実権を握った。文化・文政期を含めた家斉の時代は、化政文化が栄えた時期でもある。","m":"家斉の実権＝大御所時代"},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0311","lv":2,"s":"国後島で捕らえられたゴローニンは、幕府によって処刑された。","a":0,"e":"誤り：処刑された。正しくは1813年に釈放された。ロシア側に捕らえられた高田屋嘉兵衛が帰国して両国の仲介にあたり、ロシアが日本を攻撃した件について謝罪したことで、ゴローニンは解放された。","m":"ゴローニン＝嘉兵衛の仲介で釈放","y":1813},{"f":"近世","t":"寛政の改革と列強接近","ref":"KS-0312","lv":3,"s":"尊号一件で光格天皇が太上天皇の尊号を贈ろうとした相手は、天皇の実母である。","a":0,"e":"誤り：実母。正しくは実父の閑院宮典仁親王。光格天皇は閑院宮家から即位したため、父は皇位についていなかった。定信は先例がないとして尊号を認めず、朝廷と幕府の関係は緊張した。","m":"尊号一件＝実父典仁親王への尊号","y":1789},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0313","lv":1,"s":"大塩平八郎の乱が起こった背景には、享保の飢饉があった。","a":0,"e":"誤り：享保の飢饉。正しくは天保の飢饉。1833年ごろからの天保の飢饉で米価が上がり、各地で一揆・打ちこわしが続発した。享保の飢饉は約100年前の1732年に西日本で起きた飢饉である。","m":"大塩の乱の背景＝天保の飢饉","y":1837},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0314","lv":2,"s":"蛮社の獄で処罰された渡辺崋山は、長州藩の家老であった。","a":0,"e":"誤り：長州藩。正しくは三河の田原藩。崋山は小藩の家老として海防にも関心を寄せ、蘭学を学んで海外事情を研究した。画家としても優れ、『鷹見泉石像』などの肖像画を残している。","m":"崋山＝三河田原藩の家老","y":1839},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0315","lv":1,"s":"水野忠邦は、田沼意次の政治を手本として天保の改革を進めた。","a":0,"e":"誤り：田沼意次の政治。正しくは享保・寛政の改革。水野は倹約令や風俗の統制、農村の再建など、吉宗や松平定信の政策にならった。田沼の商業重視とは逆の方向である。","m":"天保の改革の手本＝享保・寛政"},{"f":"近世","t":"天保の改革と藩政改革","ref":"KS-0316","lv":3,"s":"1837年、越後柏崎で大塩平八郎の門弟と称して陣屋を襲った国学者は、平田篤胤である。","a":0,"e":"誤り：平田篤胤。正しくは生田万。生田万は平田篤胤に学んだ国学者で、大塩の乱に呼応して桑名藩の柏崎陣屋を襲った。大塩の乱が全国に影響を与えたことを示す事件である。","m":"柏崎の乱＝国学者生田万","y":1837},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0317","lv":1,"s":"江戸時代の宿駅で、大名が宿泊した施設を旅籠という。","a":0,"e":"誤り：旅籠。正しくは本陣（予備として脇本陣）。本陣は大名や公家、幕府の役人が泊まる施設で、宿場の有力者が経営した。旅籠は一般の旅人が泊まる宿で、食事つきであった。","m":"大名＝本陣、庶民＝旅籠"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0318","lv":1,"s":"干鰯は、牛馬の糞尿を乾燥させてつくった肥料である。","a":0,"e":"誤り：牛馬の糞尿。正しくはイワシなどを乾燥させた魚肥。干鰯は九十九里浜などで大量に生産され、上方や関東の木綿栽培などに使われた。購入して使う金肥の代表である。","m":"干鰯＝イワシの魚肥・金肥"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0319","lv":2,"s":"19世紀には、尾張の綿織物業や桐生・足利の絹織物業などで工場制手工業がみられた。","a":1,"e":"工場制手工業（マニュファクチュア）は、作業場に奉公人を集めて分業と協業で生産する形態。19世紀に大坂周辺や尾張の綿織物業、北関東の桐生・足利の絹織物業などで行われ、問屋制家内工業より進んだ形とされる。","m":"工場制手工業＝尾張・桐生・足利"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0320","lv":3,"s":"旗本・御家人の蔵米を扱う札差は、主に大坂の堂島に店を構えた。","a":0,"e":"誤り：大坂の堂島。正しくは江戸の浅草蔵前。札差は浅草の幕府の米蔵の前に店を並べ、旗本・御家人の蔵米の受け取りと換金を代行した。大坂の堂島は諸藩の蔵米を取引する米市場があった場所である。","m":"札差＝江戸の浅草蔵前"},{"f":"近世","t":"江戸の経済と交通・身分","ref":"KS-0321","lv":3,"s":"唐箕は、稲を脱穀するための農具である。","a":0,"e":"誤り：脱穀。正しくは選別。唐箕は手回しの羽根で風を起こし、籾と籾殻やごみを重さの違いで選り分ける農具。脱穀には千歯扱、穀粒の大きさで選別するには千石簁が使われた。","m":"唐箕＝風で選別、千歯扱＝脱穀"},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0001","lv":1,"s":"1853年、アメリカ使節ペリーが軍艦を率いて浦賀に来航し、開国を求める大統領の国書を提出した。","a":1,"e":"ペリーは1853年に江戸湾口の浦賀へ来航し、フィルモア大統領の国書を渡した。幕府は回答を翌年に延ばし、1854年の再来航で日米和親条約が結ばれた。","m":"ペリー来航1853、浦賀","y":1853},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0002","lv":1,"s":"1854年の日米和親条約で、下田と横浜の2港が開港された。","a":0,"e":"誤り：横浜。正しくは下田と箱館の2港。横浜（神奈川）が開港されたのは1858年の日米修好通商条約による。和親条約と通商条約の開港地を混同しないこと。","m":"和親は下田・箱館（1854）","y":1854},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0003","lv":1,"s":"日米修好通商条約は、大老井伊直弼の主導のもと、孝明天皇の勅許を得ないまま調印された。","a":1,"e":"井伊直弼は1858年、勅許を得ないまま修好通商条約に調印した。無勅許調印と将軍継嗣問題への反発が強まり、井伊は安政の大獄で反対派を処罰した。","m":"勅許なし調印は井伊（1858）","y":1858},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0004","lv":1,"s":"日米和親条約によって、日本は自由貿易を開始した。","a":0,"e":"誤り：自由貿易を開始。正しくは和親条約は燃料・食料の供給、漂流民の救助、下田・箱館の開港などが中心で、貿易の開始は1858年の日米修好通商条約からである。","m":"和親＝補給、通商＝貿易","y":1854},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0005","lv":1,"s":"井伊直弼は安政の大獄で反対派を弾圧し、長州藩士の吉田松陰も処刑された。","a":1,"e":"安政の大獄（1858〜59年）では、長州藩士吉田松陰や福井藩士橋本左内らが死罪となり、一橋派の大名や公家も隠居・謹慎とされた。この弾圧が桜田門外の変を招いた。","m":"安政の大獄で松陰・左内が死罪","y":1859},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0006","lv":1,"s":"1860年、桜田門外の変で暗殺されたのは老中安藤信正である。","a":0,"e":"誤り：老中安藤信正。正しくは大老井伊直弼。安藤信正は1862年の坂下門外の変で水戸浪士らに襲われ負傷し、失脚した。桜田門外と坂下門外の区別が頻出。","m":"桜田門＝井伊、坂下門＝安藤","y":1860},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0007","lv":1,"s":"薩長同盟は、土佐藩出身の坂本龍馬らの仲介によって1866年に結ばれた。","a":1,"e":"対立していた薩摩・長州は、土佐出身の坂本龍馬・中岡慎太郎の仲介で1866年に提携した。第2次長州征討を前に長州を支える軍事同盟で、倒幕勢力の中心となった。","m":"薩長同盟は坂本龍馬の仲介（1866）","y":1866},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0008","lv":1,"s":"1867年、大政奉還を行って政権を朝廷に返上した将軍は徳川家茂である。","a":0,"e":"誤り：徳川家茂。正しくは15代将軍徳川慶喜。家茂は14代で、1866年に第2次長州征討の陣中（大坂城）で病死した。慶喜は1867年10月に大政奉還を上表した。","m":"大政奉還は慶喜（1867）","y":1867},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0009","lv":1,"s":"1867年12月の王政復古の大号令により、幕府・摂政・関白が廃止され、天皇親政が宣言された。","a":1,"e":"1867年12月の王政復古の大号令で幕府と摂政・関白が廃止され、総裁・議定・参与の三職が置かれた。大政奉還後も残っていた慶喜の影響力を排除するねらいがあった。","m":"王政復古で三職を設置","y":1867},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0010","lv":1,"s":"戊辰戦争は、1868年の鳥羽・伏見の戦いをきっかけに始まった。","a":1,"e":"1868年1月、京都南郊の鳥羽・伏見で旧幕府軍が新政府軍に敗れ、戊辰戦争が始まった。江戸城無血開城、会津戦争を経て、1869年の箱館五稜郭の戦いで終わった。","m":"戊辰戦争の発端は鳥羽・伏見","y":1868},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0011","lv":1,"s":"生麦事件の報復としてイギリス艦隊と交戦したのは長州藩である。","a":0,"e":"誤り：長州藩。正しくは薩摩藩。1862年の生麦事件の報復として1863年に薩英戦争が起こった。長州藩は1864年に四国艦隊下関砲撃事件で欧米艦隊と戦った。","m":"生麦・薩英は薩摩（1863）","y":1863},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0012","lv":1,"s":"開港後の貿易では、茶が最大の輸出品であった。","a":0,"e":"誤り：茶。正しくは生糸が最大の輸出品で、茶・蚕卵紙がこれに次いだ。輸入は毛織物・綿織物が中心で、相手国はイギリスが最大。生糸の輸出急増は国内の品不足と物価高騰を招いた。","m":"輸出1位は生糸、茶は2位","y":1860},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0013","lv":1,"s":"長州藩は1863年、攘夷決行の日に下関海峡を通過する外国船を砲撃した。","a":1,"e":"長州藩は朝廷が定めた攘夷期限の1863年5月10日、下関海峡を通る外国船を砲撃した。その報復として翌1864年、英仏米蘭の四国艦隊が下関砲台を攻撃・占領した。","m":"長州の攘夷は下関砲撃","y":1863},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0014","lv":1,"s":"日米修好通商条約の交渉をアメリカ側で担当したのは、ペリーである。","a":0,"e":"誤り：ペリー。正しくは初代駐日総領事ハリス。ハリスは1856年に下田へ着任し、下田奉行井上清直・目付岩瀬忠震らと通商条約の交渉を進めた。ペリーが結んだのは1854年の和親条約である。","m":"通商条約の交渉役はハリス","y":1858},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0015","lv":2,"s":"日米修好通商条約は、日本に関税自主権がなく、アメリカ人の領事裁判権を認める不平等な内容を含んでいた。","a":1,"e":"通商条約は、関税を相手国と協議して定める協定関税制（関税自主権の欠如）と、外国人を本国の領事が裁く領事裁判権を認めた。この二点の改正が明治の外交課題となった。","m":"関税自主権なし・領事裁判権","y":1858},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0016","lv":2,"s":"安政の五カ国条約を結んだ相手国には、アメリカ・オランダ・ロシア・イギリス・ドイツが含まれる。","a":0,"e":"誤り：ドイツ。正しくはフランス。安政の五カ国条約の相手は米・蘭・露・英・仏である。ドイツ（プロイセン）と条約を結んだのは1861年で、安政の五カ国には含まれない。","m":"五カ国は米蘭露英仏（1858）","y":1858},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0017","lv":2,"s":"1860年の五品江戸廻送令は、生糸などの輸出品をいったん江戸の問屋を通すよう命じた法令である。","a":1,"e":"五品江戸廻送令は雑穀・水油・蠟・呉服・生糸の5品を江戸の問屋経由とし、流通の統制と物価抑制をねらった。しかし在郷商人の反発と列国の抗議で効果は上がらなかった。","m":"五品＝雑穀・水油・蠟・呉服・生糸","y":1860},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0018","lv":2,"s":"公武合体政策の一環として、孝明天皇の妹和宮が14代将軍徳川家茂に嫁いだ。","a":1,"e":"老中安藤信正は朝廷と幕府の融和（公武合体）で幕府権威の回復を図り、孝明天皇の妹和宮を将軍家茂に嫁がせた。尊攘派は反発し、1862年の坂下門外の変が起こった。","m":"和宮降嫁は公武合体（1862）","y":1862},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0019","lv":2,"s":"和宮の降嫁を進めた老中は堀田正睦である。","a":0,"e":"誤り：堀田正睦。正しくは安藤信正（久世広周とともに推進）。堀田正睦は1858年に通商条約の勅許を求めて上京したが、孝明天皇の許可を得られなかった老中である。","m":"和宮は安藤、勅許求めは堀田","y":1862},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0020","lv":2,"s":"1863年の八月十八日の政変で、長州藩を中心とする尊王攘夷派が京都から追放された。","a":1,"e":"1863年8月18日、会津藩と薩摩藩が公武合体派の公家と結んで朝廷の実権を握り、長州藩勢力と三条実美ら急進派公家7人を京都から追った（七卿落ち）。","m":"八一八は長州追放（1863）","y":1863},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0021","lv":2,"s":"1864年の禁門（蛤御門）の変で、長州藩は会津・薩摩藩などの兵に敗れた。","a":1,"e":"前年の政変と池田屋事件で京都を追われた長州藩は、1864年に勢力回復をめざして御所周辺で戦ったが、会津・薩摩藩に敗れた。長州は朝敵とされ、第1次長州征討を受けた。","m":"禁門の変で長州敗北（1864）","y":1864},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0022","lv":2,"s":"1864年の四国艦隊下関砲撃事件で、英・仏・米・蘭の連合艦隊が長州藩の砲台を攻撃した。","a":1,"e":"1864年、英・仏・米・蘭の四国艦隊が前年の外国船砲撃への報復として下関砲台を攻撃・占領した。攘夷の不可能を知った長州藩は、のち軍備の近代化と倒幕へ向かう。","m":"四国＝英仏米蘭（1864）","y":1864},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0023","lv":2,"s":"第2次長州征討では、幕府軍が長州軍を圧倒して勝利した。","a":0,"e":"誤り：幕府軍が圧倒して勝利。正しくは高杉晋作らの指導する長州軍に各地で敗れ、1866年に将軍家茂が死去したのを理由に撤兵した。幕府の権威失墜が決定的となった。","m":"第2次長州征討は幕府の敗北","y":1866},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0024","lv":2,"s":"大政奉還は、土佐藩の後藤象二郎・山内容堂らの建白を受けて将軍徳川慶喜が決断した。","a":1,"e":"土佐藩の後藤象二郎は前藩主山内容堂（豊信）を通じて、慶喜に政権返上を建白した。慶喜はこれを受け入れ、徳川家中心の新体制（公議政体）を残そうとして大政奉還を行った。","m":"土佐の建白→大政奉還","y":1867},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0025","lv":2,"s":"王政復古の大号令の当日夜の小御所会議で、徳川慶喜に辞官納地を求めることが決められた。","a":1,"e":"王政復古の大号令が出た夜の小御所会議で、慶喜に内大臣の辞任と領地の一部返上（辞官納地）を命じることが決まった。これに旧幕府側が反発し、鳥羽・伏見の戦いへ進んだ。","m":"小御所会議で辞官納地","y":1867},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0026","lv":2,"s":"薩長同盟に際して、長州側の代表として交渉に当たったのは高杉晋作である。","a":0,"e":"誤り：高杉晋作。正しくは木戸孝允（桂小五郎）。薩摩側は西郷隆盛・小松帯刀らで、坂本龍馬が仲介した。高杉晋作は奇兵隊を組織し、藩内の主導権を握った人物である。","m":"長州の代表は木戸孝允","y":1866},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0027","lv":2,"s":"1866年の改税約書により、輸入関税率が従来より大幅に引き下げられた。","a":1,"e":"列国は1865年の条約勅許と兵庫開港延期の見返りとして、1866年に改税約書を結ばせた。輸入税は一律に約5％へ下がり、外国製品が流入しやすい不利な貿易となった。","m":"改税約書で関税5％（1866）","y":1866},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0028","lv":3,"s":"日米和親条約では、日本はアメリカに対して片務的な最恵国待遇を与えた。","a":1,"e":"最恵国待遇は、他国に与えた有利な条件を相手国にも自動的に認めるもの。和親条約では日本だけがこれを負い、アメリカは負わない片務的な形だった。通商条約にも引き継がれた。","m":"和親条約は片務的最恵国待遇","y":1854},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0029","lv":3,"s":"日露和親条約では、択捉島と得撫島の間に国境が引かれ、樺太は国境を定めず両国民の雑居地とされた。","a":1,"e":"1855年の日露和親条約で、千島列島は択捉島以南を日本領、得撫島以北をロシア領とし、樺太は境界を定めず雑居地とした。開港地は下田・箱館・長崎の3港である。","m":"千島は択捉まで日本、樺太は雑居","y":1855},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0031","lv":3,"s":"将軍継嗣問題では、井伊直弼ら南紀派が紀伊藩主の徳川慶福を推し、慶福が14代将軍家茂となった。","a":1,"e":"13代将軍家定の後継をめぐり、井伊直弼ら南紀派は紀伊藩主徳川慶福を、松平慶永・島津斉彬ら一橋派は一橋慶喜を推した。井伊の大老就任で慶福（家茂）に決まった。","m":"南紀派は慶福、一橋派は慶喜","y":1858},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0032","lv":3,"s":"1860年、日米修好通商条約の批准書交換のため遣米使節が派遣され、咸臨丸がそれに随行した。","a":1,"e":"1860年、新見正興を正使とする遣米使節が米艦ポーハタン号で渡米し、ワシントンで批准書を交換した。幕府軍艦咸臨丸も随行して、日本人の手で初めて太平洋を横断した。","m":"遣米使節に咸臨丸随行","y":1860},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0033","lv":3,"s":"咸臨丸で太平洋を横断した一行には、のちに『西洋事情』を著す福沢諭吉が加わっていた。","a":1,"e":"咸臨丸には軍艦奉行木村喜毅や勝海舟が乗り組み、福沢諭吉も木村の従者として加わった。福沢はこの渡米などの経験をもとに、のち『西洋事情』を著して欧米の制度を紹介した。","m":"咸臨丸に勝海舟と福沢諭吉","y":1860},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0034","lv":3,"s":"第2次長州征討の最中に病死した将軍は、13代の徳川家定である。","a":0,"e":"誤り：13代の徳川家定。正しくは14代の徳川家茂で、1866年に大坂城で病死した。家定は1858年に没し、その後継をめぐって将軍継嗣問題が起こった。","m":"長州征討中に病死したのは家茂","y":1866},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0035","lv":3,"s":"1867年、薩摩・長州両藩に討幕の密勅が下されたが、同日に慶喜が大政奉還を上表したため実行されなかった。","a":1,"e":"1867年10月、岩倉具視・大久保利通らの工作で薩長両藩に討幕の密勅が出されたが、同じ日に慶喜が大政奉還を上表したため、討幕の名目が失われ実行されなかった。","m":"密勅と大政奉還は同時期","y":1867},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0036","lv":3,"s":"長州藩では高杉晋作が、武士・庶民からなる奇兵隊を組織した。","a":1,"e":"高杉晋作は1863年、藩士だけでなく農民・町人も加えた奇兵隊を組織した。1864年末には奇兵隊などの諸隊を率いて挙兵し、保守派から藩の実権を奪って倒幕へ転換させた。","m":"奇兵隊は高杉晋作（1863）","y":1863},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0038","lv":3,"s":"安政の大獄では、長州藩士の橋本左内が処刑された。","a":0,"e":"誤り：長州藩士。正しくは福井藩士。橋本左内は藩主松平慶永に仕えて一橋慶喜の擁立に奔走し、安政の大獄で死罪となった。同じく処刑された吉田松陰が長州藩士である。","m":"左内は福井藩士、松陰は長州藩士","y":1859},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0040","lv":2,"s":"日米修好通商条約により、江戸と大坂が開港場とされた。","a":0,"e":"誤り：江戸・大坂を開港場とした。正しくは江戸・大坂は開市（外国人の居住・取引を認める）で、開港場は神奈川・長崎・新潟・兵庫と箱館である。実際には神奈川の代わりに横浜が開かれた。","m":"江戸・大坂は開市、他は開港","y":1858},{"f":"近代","t":"開国と幕末の動乱","ref":"KD-0042","lv":3,"s":"討幕の密勅は、薩摩藩と土佐藩に対して下された。","a":0,"e":"誤り：土佐藩。正しくは薩摩藩と長州藩。土佐藩は大政奉還を建白して武力によらない政権移行を図った立場で、討幕派とは路線が異なった。","m":"密勅は薩長、土佐は大政奉還","y":1867},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0043","lv":1,"s":"1868年に発表された五箇条の誓文は、広く会議を興し万機公論に決すべきことを国是として示した。","a":1,"e":"五箇条の誓文は1868年3月、天皇が神々に誓う形で出され、公議世論の尊重や開国和親を方針とした。由利公正・福岡孝弟の案を木戸孝允が修正した。同じ時に庶民向けには五榜の掲示が出た。","m":"五箇条は公議世論の尊重","y":1868},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0044","lv":1,"s":"廃藩置県は、1869年に実施された。","a":0,"e":"誤り：1869年。正しくは1871年。1869年に行われたのは、藩主が土地（版）と人民（籍）を朝廷に返す版籍奉還である。版籍奉還→廃藩置県の順を押さえる。","m":"版籍奉還1869・廃藩置県1871","y":1871},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0045","lv":1,"s":"廃藩置県によって藩は廃止され、中央から府知事・県令が派遣される体制となった。","a":1,"e":"1871年の廃藩置県で藩は廃止されて府県となり、中央から府知事・県令が派遣された。旧藩の税は政府に入り、軍事・徴税の権限が中央に集まって中央集権体制が整った。","m":"廃藩置県で中央集権（1871）","y":1871},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0046","lv":1,"s":"1872年に学制が公布され、国民皆学をめざして全国に小学校を設ける方針が示された。","a":1,"e":"1872年の学制はフランスの学区制にならい、身分・性別に関係なく国民すべてが学ぶ国民皆学を掲げた。しかし授業料や学校建設費は住民負担で、反対一揆も起こった。","m":"学制1872、国民皆学","y":1872},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0047","lv":1,"s":"1873年の徴兵令では、華族と士族のみが兵役の義務を負った。","a":0,"e":"誤り：華族と士族のみ。正しくは満20歳以上の男子に士族・平民の別なく兵役を課す国民皆兵を原則とした。ただし戸主や代人料納入者などの免役規定が多かった。","m":"徴兵令は国民皆兵（1873）","y":1873},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0048","lv":1,"s":"地租改正では、土地の所有者に地券を交付し、地価の3％を現金で納めさせた。","a":1,"e":"1873年の地租改正条例で、課税基準を収穫高から地価に改め、地券所有者に地価の3％を金納させた。豊凶に関係なく一定の税収が入り、政府財政は安定した。","m":"地租＝地価の3％金納","y":1873},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0050","lv":1,"s":"1873年に設置された内務省の初代内務卿は、大隈重信である。","a":0,"e":"誤り：大隈重信。正しくは大久保利通。内務省は1873年の明治六年の政変後に設けられ、殖産興業・警察・地方行政を担当した。大久保はここを拠点に政府の実権を握った。","m":"内務省は大久保利通（1873）","y":1873},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0051","lv":1,"s":"殖産興業の一環として、群馬県に官営模範工場の富岡製糸場が設けられた。","a":1,"e":"富岡製糸場は1872年、フランス人技師ブリューナの指導で群馬県に開業した官営模範工場である。輸出の中心である生糸の品質を高め、器械製糸の技術を各地に広めるねらいがあった。","m":"富岡製糸場は官営（1872）","y":1872},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0052","lv":1,"s":"岩倉具視を大使とする使節団は、条約改正の予備交渉を目的に欧米へ派遣されたが、改正には成功しなかった。","a":1,"e":"1871年に出発した岩倉使節団は、大久保利通・木戸孝允・伊藤博文らを副使とし、条約改正の予備交渉をめざしたが成功せず、欧米の制度・産業の視察が主な成果となった。","m":"岩倉使節団は改正失敗","y":1871},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0053","lv":1,"s":"征韓論をめぐる対立で敗れた西郷隆盛・板垣退助らは、1873年に政府を去った。","a":1,"e":"岩倉使節団の留守中に西郷隆盛らは朝鮮への使節派遣（征韓論）を決めたが、帰国した大久保利通らが内治優先を唱えて覆した。西郷・板垣・江藤らは1873年に参議を辞した。","m":"征韓論敗れ西郷下野（1873）","y":1873},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0054","lv":1,"s":"1877年の西南戦争を起こした士族反乱の中心人物は、江藤新平である。","a":0,"e":"誤り：江藤新平。正しくは西郷隆盛。江藤新平は1874年の佐賀の乱の指導者。西南戦争は鹿児島の私学校生らが西郷を擁して挙兵した最大で最後の士族反乱である。","m":"西南は西郷、佐賀は江藤","y":1877},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0055","lv":1,"s":"秩禄処分により、華族・士族への家禄の支給は廃止され、代わりに金禄公債証書が与えられた。","a":1,"e":"1876年の秩禄処分で家禄の支給を全廃し、数年分の禄に当たる金禄公債証書を与えた。家禄は政府歳出の約3割を占めており、その削減がねらいだったが、多くの士族が困窮した。","m":"秩禄処分＝金禄公債（1876）","y":1876},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0056","lv":2,"s":"1869年の版籍奉還では、藩主が土地と人民を朝廷に返上し、旧藩主は知藩事に任命された。","a":1,"e":"1869年、薩長土肥4藩主の上表を先がけに諸藩主が版籍を返上し、そのまま知藩事に任命された。藩主が藩を治める実態は変わらず、2年後の廃藩置県で本格的な中央集権化が進んだ。","m":"版籍奉還は知藩事任命","y":1869},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0057","lv":2,"s":"廃藩置県が行われると、旧藩主は引き続き知藩事として藩の統治に当たった。","a":0,"e":"誤り：知藩事として統治を継続。正しくは廃藩置県で知藩事は罷免され、東京に住むよう命じられた。各府県には政府が任命した府知事・県令が派遣された。","m":"廃藩で知藩事は罷免（1871）","y":1871},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0058","lv":2,"s":"廃藩置県は、薩摩・長州・肥前3藩から集めた御親兵を背景に断行された。","a":0,"e":"誤り：肥前。正しくは薩摩・長州・土佐の3藩。政府はこの3藩の兵約1万人を御親兵として集め、反抗に備えて1871年7月に一挙に藩を廃止した。御親兵はのち近衛兵となる。","m":"御親兵は薩摩・長州・土佐の兵","y":1871},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0059","lv":2,"s":"学制は、ドイツの学校制度を模範として定められた。","a":0,"e":"誤り：ドイツ。正しくはフランスの学区制を模範とした。1879年の教育令はアメリカの制度にならって学制の画一性を改め、のち1886年の学校令ではドイツ流の国家主義的性格が強まった。","m":"学制はフランス式（1872）","y":1872},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0060","lv":2,"s":"地租改正条例の発布に先立ち、土地の売買を認めて所有権を示す地券が発行された。","a":1,"e":"1872年、政府は田畑永代売買の禁を解いて土地の売買を認め、所有者に地券（壬申地券）を交付した。地券で所有者を確定したことが、所有者から地租を取る地租改正の前提となった。","m":"地券で所有者に納税義務","y":1873},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0061","lv":2,"s":"北海道には開拓使が置かれ、士族授産と防備を兼ねた屯田兵制度が導入された。","a":1,"e":"1869年に蝦夷地を北海道と改めて開拓使を置き、黒田清隆らが開発を進めた。1874年に屯田兵制度を設け、士族に開拓とロシアへの備えを担わせた。1876年には札幌農学校も開校した。","m":"北海道は開拓使と屯田兵","y":1874},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0062","lv":2,"s":"1879年、琉球藩が廃止されて沖縄県が置かれた。","a":1,"e":"政府は1872年に琉球王国を琉球藩として国王尚泰を藩王とし、1879年に軍隊・警官を送って藩を廃し沖縄県を置いた（琉球処分）。清はこれを認めず、帰属問題が日清間に残った。","m":"琉球処分1879沖縄県","y":1879},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0063","lv":2,"s":"1874年の台湾出兵は、琉球漂流民が殺害された事件を理由に、朝鮮へ出兵したものである。","a":0,"e":"誤り：朝鮮。正しくは台湾。1871年に琉球の漂流民が台湾で殺害された事件を理由に、政府は1874年に台湾へ出兵した。清はイギリスの調停で事実上の賠償金を支払った。","m":"台湾出兵は琉球漂流民殺害が口実","y":1874},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0064","lv":2,"s":"日朝修好条規（1876年）は、江華島事件をきっかけに結ばれた。","a":1,"e":"1875年、日本の軍艦雲揚号が朝鮮の江華島付近で挑発して砲撃戦となった（江華島事件）。日本はこれを口実に開国を迫り、翌1876年に日朝修好条規を結ばせた。","m":"江華島事件→日朝修好条規","y":1876},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0065","lv":2,"s":"樺太・千島交換条約では、日本は千島全島を放棄し、樺太を領有した。","a":0,"e":"誤り：千島全島を放棄し樺太を領有。正しくは日本が樺太をロシア領と認め、代わりに千島全島を日本領とした。全権は駐露公使の榎本武揚である。","m":"樺太放棄・千島獲得（1875）","y":1875},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0066","lv":2,"s":"1871年の新貨条例により、通貨単位が円・銭・厘とされる十進法の貨幣制度が定められた。","a":1,"e":"1871年の新貨条例で円・銭・厘の十進法を採用し、両・分・朱の四進法を改めた。金本位制をたてまえとしたが、開港場では銀貨が使われ、実際には金銀複本位制に近かった。","m":"新貨条例＝円・銭・厘","y":1871},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0067","lv":2,"s":"郵便制度を建議し、1871年に創業を実現させたのは渋沢栄一である。","a":0,"e":"誤り：渋沢栄一。正しくは前島密。前島は1871年に官営の郵便制度を発足させ、全国均一料金の制度を整えた。渋沢栄一は第一国立銀行や大阪紡績会社の設立に関わった実業家である。","m":"郵便は前島密（1871）","y":1871},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0068","lv":2,"s":"岩倉使節団で全権大使を務めたのは、西郷隆盛である。","a":0,"e":"誤り：西郷隆盛。正しくは岩倉具視。西郷隆盛・板垣退助・大隈重信らは国内に残る留守政府を担い、学制・徴兵令・地租改正などの改革を進めた。","m":"使節は岩倉、留守は西郷","y":1871},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0069","lv":3,"s":"地租改正反対一揆の激化を受け、政府は1877年に地租を地価の3％から2％に引き下げた。","a":0,"e":"誤り：2％。正しくは2.5％。1876年に茨城・三重などで大規模な反対一揆が起こり、士族反乱との結びつきを恐れた政府は1877年1月に税率を下げた。「竹槍でドンと突き出す二分五厘」と詠まれた。","m":"一揆で地租3％→2.5％","y":1877},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0070","lv":3,"s":"1873年の徴兵令には、代人料270円を納めると兵役を免れる規定があり、実際は富裕層に有利であった。","a":1,"e":"徴兵令には戸主・嗣子・官吏・学生などの免役規定と、270円の代人料を納めれば兵役を免れる規定があり、実際に兵役を担ったのは農家の二男・三男が中心だった。","m":"徴兵令に代人料270円","y":1873},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0071","lv":3,"s":"徴兵告諭にある「血税」の語が誤解され、各地で徴兵反対の血税一揆が起こった。","a":1,"e":"1872年の徴兵告諭は兵役を「血税」と表現した。これを文字どおり血を取られると受け取る者もおり、徴兵制への不満とあいまって、西日本を中心に血税一揆が起こった。","m":"血税一揆は徴兵反対（1873）","y":1873},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0072","lv":3,"s":"日朝修好条規は、日本の領事裁判権を認め、日本商人の取引品に対する関税を免除するなどの不平等な内容を持っていた。","a":1,"e":"日朝修好条規は、朝鮮に釜山ほか2港（のち元山・仁川）を開かせ、日本の領事裁判権を認めさせた。付属の取決めで日本の輸出入品の関税免除も定められ、朝鮮に不利な条約であった。","m":"日朝条規は朝鮮に不平等","y":1876},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0073","lv":3,"s":"日朝修好条規では、朝鮮が清の宗主権のもとにあることが明記された。","a":0,"e":"誤り：清の宗主権を明記。正しくは第1条で朝鮮を「自主の邦」と規定した。清と朝鮮の宗属関係を否定し、日本が朝鮮へ進出するためのねらいがあった。","m":"条規は朝鮮＝自主の邦","y":1876},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0074","lv":3,"s":"1876年、廃刀令や士族の特権廃止に反発して、熊本で神風連（敬神党）の乱が起こった。","a":1,"e":"1876年の廃刀令と秩禄処分に反発した熊本の敬神党（神風連）が挙兵し、熊本鎮台を襲った。これに呼応して福岡で秋月の乱、山口で前原一誠の萩の乱が起こった。","m":"神風連は熊本（1876）","y":1876},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0075","lv":3,"s":"秩禄処分では、金禄公債証書の元本が一括して現金で支払われた。","a":0,"e":"誤り：元本を一括して現金で支払った。正しくは金禄公債証書を交付し、利子を支払いながら元本を年次の抽選で償還した。利子だけでは生活できず、公債を手放す士族が多かった。","m":"金禄公債は年次償還（1876）","y":1876},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0076","lv":3,"s":"1871年の太政官制の改革で、太政官に正院・左院・右院が置かれた。","a":1,"e":"1871年の廃藩置県後、太政官は正院・左院・右院の三院制となった。正院は太政大臣・参議らによる最高機関、左院は立法の諮問機関、右院は各省の長官・次官の協議機関である。","m":"正院・左院・右院（1871）","y":1871},{"f":"近代","t":"明治維新と諸改革","ref":"KD-0078","lv":3,"s":"1874年に佐賀の乱を起こしたのは、前原一誠である。","a":0,"e":"誤り：前原一誠。正しくは前参議の江藤新平。佐賀の乱は1874年に起こった最初の大規模な士族反乱で、江藤は処刑された。前原一誠は1876年に萩の乱を起こした。","m":"佐賀は江藤、萩は前原","y":1874},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0079","lv":1,"s":"1874年、板垣退助らが民撰議院設立建白書を左院に提出し、国会の開設を求めた。","a":1,"e":"1874年、征韓論で下野した板垣退助・後藤象二郎・江藤新平・副島種臣らが左院に建白書を出し、少数の官僚による政治（有司専制）を批判した。新聞で公表され運動の口火となった。","m":"民撰議院建白は板垣ら","y":1874},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0081","lv":1,"s":"1881年、政府は国会開設の勅諭を出し、1890年に国会を開くことを約束した。","a":1,"e":"1881年、開拓使官有物払下げ事件で政府批判が高まるなか、政府は大隈重信を追放すると同時に国会開設の勅諭を出した。1890年の国会開設を約束して運動の鎮静化を図った。","m":"勅諭1881、国会は1890","y":1881},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0082","lv":1,"s":"明治十四年の政変で政府から追放されたのは、伊藤博文である。","a":0,"e":"誤り：伊藤博文。正しくは大隈重信。大隈は即時の国会開設とイギリス流の議院内閣制を主張し、払下げ事件への関与を疑われて罷免された。政府は伊藤博文を中心に再編された。","m":"政変で追放は大隈重信","y":1881},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0083","lv":1,"s":"板垣退助は、国会開設の勅諭が出されたのち、自由党を結成してその総理（党首）となった。","a":1,"e":"板垣退助は勅諭直後の1881年10月、自由党を結成して総理となった。フランス流の急進的な自由主義を掲げ、士族や地方の豪農が主な支持層であった。","m":"自由党は板垣退助（1881）","y":1881},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0084","lv":1,"s":"立憲改進党は、福沢諭吉を党首として結成された政党である。","a":0,"e":"誤り：福沢諭吉。正しくは大隈重信。立憲改進党は1882年に結成され、イギリス流の漸進的な議会政治をめざした。慶応義塾出身者など知識人や都市の実業家に支持された。","m":"改進党は大隈重信（1882）","y":1882},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0085","lv":1,"s":"伊藤博文はヨーロッパに渡って憲法を調査し、おもにドイツ（プロイセン）流の憲法理論を学んだ。","a":1,"e":"伊藤博文は1882年に渡欧し、ベルリン大学のグナイスト、ウィーン大学のシュタインから君主権の強いドイツ流の憲法理論を学んだ。帰国後、制度取調局を設けて準備に当たった。","m":"伊藤はドイツ流を学ぶ","y":1882},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0086","lv":1,"s":"大日本帝国憲法は、1889年2月11日に発布された。","a":1,"e":"大日本帝国憲法は1889年2月11日、黒田清隆内閣のときに天皇が定めて国民に与える欽定憲法として発布され、翌1890年11月の第1回帝国議会の開会とともに施行された。","m":"帝国憲法1889発布","y":1889},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0087","lv":1,"s":"大日本帝国憲法は、国民の代表が制定した民定憲法であった。","a":0,"e":"誤り：民定憲法。正しくは天皇が制定して国民に与える欽定憲法。草案は伊藤博文らが非公開で作成し、天皇の諮問機関である枢密院で審議された。国民の代表は制定に関わっていない。","m":"帝国憲法は欽定憲法（1889）","y":1889},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0088","lv":1,"s":"第1回衆議院議員総選挙（1890年）では、直接国税15円以上を納める満25歳以上の男子に選挙権が与えられた。","a":1,"e":"1889年の衆議院議員選挙法で、選挙権は直接国税15円以上を納める満25歳以上の男子に限られた。有権者は全人口の約1％で、地租を納める地主層が中心だった。","m":"1890選挙は国税15円・25歳男子","y":1890},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0089","lv":1,"s":"1885年に創設された内閣制度で、初代内閣総理大臣になったのは山県有朋である。","a":0,"e":"誤り：山県有朋。正しくは伊藤博文。1885年に太政官制を廃して内閣制度をつくり、伊藤が初代首相となった。2代は黒田清隆、3代が山県有朋である。","m":"初代首相は伊藤博文（1885）","y":1885},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0090","lv":1,"s":"1890年に出された教育勅語は、忠君愛国を基本とする道徳教育の方針を示した。","a":1,"e":"教育勅語は1890年、第1次山県内閣のときに出され、井上毅・元田永孚らが起草した。忠君愛国と儒教的な徳目を教育の基本とし、学校の式典で奉読された。","m":"教育勅語1890・忠君愛国","y":1890},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0091","lv":1,"s":"1885年に内閣制度が創設され、太政官制は廃止された。","a":1,"e":"1885年、太政大臣・左右大臣・参議などからなる太政官制を廃して内閣制度が設けられた。各省の長官が国務大臣として内閣を構成し、宮中には内大臣・宮内大臣を置いて府中と区別した。","m":"内閣制度は1885に創設","y":1885},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0092","lv":1,"s":"大日本帝国憲法下の貴族院は、選挙によって選ばれた議員だけで構成された。","a":0,"e":"誤り：選挙で選ばれた議員だけ。正しくは皇族・華族の議員と、天皇が任命する勅任議員（勅選議員・多額納税者議員）で構成された。公選の議員で構成されたのは衆議院である。","m":"貴族院は皇族・華族・勅任議員","y":1890},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0093","lv":2,"s":"1880年、愛国社が中心となって東京で国会期成同盟が結成され、国会開設の請願運動を全国に広げた。","a":0,"e":"誤り：東京。正しくは大阪。愛国社の呼びかけで大阪に各地の民権結社の代表が集まり結成した。政府は請願書を受理せず、同年に集会条例を定めて政治集会を規制した。","m":"国会期成同盟は大阪で結成（1880）","y":1880},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0094","lv":2,"s":"讒謗律・新聞紙条例は、1881年の国会開設の勅諭が出された後に制定された。","a":0,"e":"誤り：勅諭の後。正しくは1875年の制定で、国会開設の勅諭より前である。政府は漸次立憲政体樹立の詔を出す一方、讒謗律・新聞紙条例で民権派の政府批判を取り締まった。","m":"讒謗律・新聞紙条例は1875","y":1875},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0095","lv":2,"s":"開拓使官有物払下げ事件では、薩摩出身の開拓長官黒田清隆が官有物を安価で関係者に払い下げようとして批判された。","a":1,"e":"開拓長官黒田清隆が、開拓使の官有物を同じ薩摩出身の五代友厚らに安く払い下げようとして世論の激しい非難を浴びた。政府は払下げを中止し、大隈追放と国会開設の勅諭で事態を収めた。","m":"払下げは黒田清隆（1881）","y":1881},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0096","lv":2,"s":"松方正義の財政政策（松方財政）では、紙幣整理が進められたが、デフレにより農村が不況に陥った。","a":1,"e":"大蔵卿松方正義は増税と歳出削減で不換紙幣を整理し、日本銀行を設けて銀本位制を整えた。物価が急落して米・繭の価格が下がり、自作農の没落と民権派の激化事件を招いた。","m":"松方財政はデフレ（1882）","y":1882},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0097","lv":2,"s":"秩父事件は、福島県で起きた自由党員・農民の蜂起である。","a":0,"e":"誤り：福島県。正しくは埼玉県の秩父地方。1884年、松方デフレで困窮した農民が困民党を組織し、負債の延納などを求めて蜂起した。軍隊が出動して鎮圧された。","m":"秩父は埼玉、福島事件は福島","y":1884},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0098","lv":2,"s":"1887年、政府は保安条例を公布し、民権派を東京から退去させた。","a":1,"e":"1887年、三大事件建白運動で民権派が東京に集まると、第1次伊藤内閣は保安条例を出し、尾崎行雄・中江兆民ら約570人を皇居から3里の外へ追放した。","m":"保安条例で東京追放（1887）","y":1887},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0099","lv":2,"s":"黒田清隆首相は、政府は政党の意向に左右されず超然として政策を進めるべきだと演説した（超然主義）。","a":1,"e":"1889年、憲法発布の翌日に黒田清隆首相は、政府は政党の動向に左右されず超然として政治を行うと演説した。初期議会では、この超然主義の政府と民党が予算をめぐって対立した。","m":"超然主義は黒田首相（1889）","y":1889},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0100","lv":2,"s":"枢密院の初代議長には、黒田清隆が就任した。","a":0,"e":"誤り：黒田清隆。正しくは伊藤博文。1888年、憲法草案を審議するため天皇の諮問機関として枢密院が置かれ、伊藤は首相を黒田に譲って初代議長となった。","m":"枢密院議長は伊藤博文","y":1888},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0101","lv":2,"s":"憲法草案の起草にあたり、伊藤博文のもとで井上毅らが働き、ドイツ人顧問ロエスレルらの助言を受けた。","a":1,"e":"伊藤博文のもとで井上毅・伊東巳代治・金子堅太郎が、ドイツ人顧問ロエスレルの助言を受けて草案を作成した。作業は神奈川県夏島の伊藤の別荘などで秘密裏に進められた。","m":"起草は伊藤・井上毅＋ロエスレル","y":1887},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0102","lv":2,"s":"大日本帝国憲法のもとで、陸海軍の統帥権は天皇に属し、内閣や議会から独立していた。","a":1,"e":"帝国憲法では陸海軍の作戦・用兵を指揮する統帥権が天皇にあり、参謀本部・軍令部が直接補佐して内閣は関与できなかった。この統帥権の独立が昭和期の軍部の台頭につながった。","m":"統帥権は内閣から独立","y":1889},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0103","lv":2,"s":"帝国議会では、予算案は貴族院が先に審議する先議権を持っていた。","a":0,"e":"誤り：貴族院。正しくは衆議院に予算先議権があった。それ以外の権限で両院は対等で、予算が成立しない場合は前年度の予算を執行できたため、議会の予算審議権には限界があった。","m":"予算先議権は衆議院にある","y":1890},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0104","lv":2,"s":"民権派の植木枝盛は、人民主権的な内容をもつ私擬憲法「東洋大日本国国憲按」を起草した。","a":1,"e":"自由民権運動のなかで各地に私擬憲法がつくられた。植木枝盛の「東洋大日本国国憲按」は主権在民の考えに立ち、抵抗権・革命権まで認めた。交詢社の案は穏健なイギリス流だった。","m":"植木枝盛の私擬憲法（1881）","y":1881},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0106","lv":3,"s":"1882年の福島事件では、県令三島通庸の圧政に対して自由党員の河野広中らが検挙された。","a":1,"e":"福島県令三島通庸は、会津地方の道路工事に住民を強制的に動員した。反対する農民と自由党員を弾圧し、1882年に県会議長河野広中らを検挙した。最初の激化事件とされる。","m":"福島事件は三島通庸・河野","y":1882},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0107","lv":3,"s":"加波山事件は、1884年に茨城県で起きた自由党急進派の蜂起事件である。","a":1,"e":"1884年、栃木県令三島通庸の暗殺を企てた自由党急進派が茨城県の加波山で挙兵し、鎮圧された。激化事件が続くなか、同年10月に自由党は解党し、12月には立憲改進党の大隈も離党した。","m":"加波山事件は茨城県（1884）","y":1884},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0108","lv":3,"s":"1880年代後半、旧民権派の再結集をめざす大同団結運動の中心となったのは、板垣退助である。","a":0,"e":"誤り：板垣退助。正しくは後藤象二郎。1886年ごろ星亨らが旧自由党・改進党系の再結集を呼びかけ、後藤が中心となって運動を広げた。後藤はのち黒田内閣に入閣し、運動は分裂した。","m":"大同団結は後藤象二郎が中心","y":1886},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0109","lv":3,"s":"三大事件建白運動では、地租軽減・言論集会の自由・外交失策の挽回の3項目が要求された。","a":1,"e":"1887年、井上馨外相の条約改正案への反発をきっかけに、民権派は地租の軽減、言論・集会の自由、外交失策の挽回を求める建白書を元老院に出した。政府は保安条例で抑えた。","m":"三大事件＝地租・言論・外交","y":1887},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0110","lv":3,"s":"大日本帝国憲法では、臣民の権利は「法律ノ範囲内」で認められたにとどまった。","a":1,"e":"帝国憲法は言論・集会・結社や信教の自由などを臣民の権利として認めたが、「法律ノ範囲内」の条件がつき、法律で制限できた。人が生まれながらに持つ権利とする日本国憲法とは異なる。","m":"臣民の権利は法律の範囲内","y":1889},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0111","lv":3,"s":"民法典論争では、穂積八束が旧民法の早期施行を主張する断行派の中心であった。","a":0,"e":"誤り：断行派。正しくは延期派。ボアソナードが起草したフランス流の民法に対し、穂積八束は「民法出デテ忠孝亡ブ」と論じて家族道徳を損なうと批判した。1892年に施行延期が決まった。","m":"穂積八束は延期派（1892）","y":1892},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0113","lv":3,"s":"皇室典範は、帝国議会の審議を経て制定された。","a":0,"e":"誤り：議会の審議を経た。正しくは1889年に憲法と同時に、議会の関与なしに定められた。皇位継承や摂政など皇室の制度を定めた法で、憲法と同格とされて帝国議会は改正できなかった。","m":"皇室典範は議会審議なし","y":1889},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0114","lv":3,"s":"伊藤博文の主導で、1888年に市制・町村制、1890年に府県制・郡制が整えられた。","a":0,"e":"誤り：伊藤博文。正しくは内務大臣山県有朋。ドイツ人顧問モッセの助言を受けて地方制度を整え、地方の有力者に自治を担わせつつ政府の統制下に置いた。","m":"地方制度は山県有朋とモッセ","y":1888},{"f":"近代","t":"自由民権運動と立憲体制","ref":"KD-0115","lv":3,"s":"明治十四年の政変で、イギリス流の議院内閣制の早期導入を主張したのは伊藤博文であった。","a":0,"e":"誤り：伊藤博文。正しくは大隈重信。大隈はイギリス流の議院内閣制と早期の国会開設を求める意見書を出した。伊藤博文・岩倉具視らは君主権の強いドイツ流の憲法を構想していた。","m":"イギリス流は大隈、ドイツ流は伊藤","y":1881},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0116","lv":1,"s":"日清戦争は、朝鮮で起きた甲午農民戦争（東学党の乱）をきっかけに、日清両国が出兵して始まった。","a":1,"e":"1894年、朝鮮で東学を信仰する農民が甲午農民戦争を起こすと、朝鮮政府の要請で清が出兵し、日本も天津条約の事前通告を経て出兵した。乱の収束後も両軍は撤兵せず開戦に至った。","m":"甲午農民戦争→日清戦争","y":1894},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0117","lv":1,"s":"下関条約で、清側の全権として日本と交渉したのは袁世凱である。","a":0,"e":"誤り：袁世凱。正しくは李鴻章。1895年、下関の春帆楼で日本全権伊藤博文・陸奥宗光と講和会議を開いた。袁世凱は当時、朝鮮に駐在して清の影響力を強めていた人物である。","m":"下関条約は伊藤・陸奥と李鴻章","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0118","lv":1,"s":"下関条約で清は、遼東半島・台湾・澎湖諸島を日本に譲り渡した。","a":1,"e":"1895年の下関条約で、清は朝鮮の独立承認、遼東半島・台湾・澎湖諸島の割譲、賠償金2億両の支払い、4港の開港などを認めた。遼東半島はその直後の三国干渉で返還させられた。","m":"遼東半島・台湾・澎湖諸島","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0120","lv":1,"s":"三国干渉では、ロシア・ドイツ・フランスが日本に遼東半島の返還を勧告した。","a":1,"e":"ロシア・ドイツ・フランスは、遼東半島の領有が清の首都を脅かし朝鮮の独立を有名無実にするとして返還を勧告した。日本は対抗する力がなく、還付報償金と引き換えに受け入れた。","m":"三国干渉は露独仏（1895）","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0122","lv":1,"s":"1886年のノルマントン号事件は、領事裁判権の撤廃を求める世論を高めた。","a":1,"e":"1886年、イギリス船ノルマントン号が紀州沖で沈没し、船員は脱出したが日本人乗客は全員死亡した。領事裁判で船長は当初無罪、のち禁錮3か月の軽い刑で、領事裁判権の撤廃を求める声が強まった。","m":"ノルマントン号で領事裁判批判","y":1886},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0123","lv":1,"s":"欧化政策の一環として、鹿鳴館で外国人を接待したのは、外務卿の陸奥宗光である。","a":0,"e":"誤り：陸奥宗光。正しくは外務卿（のち外相）井上馨。井上は鹿鳴館で舞踏会を開くなど欧化政策を進めて条約改正交渉を有利にしようとしたが、皮相な欧化として国内の批判を浴びた。","m":"鹿鳴館外交は井上馨（1883）","y":1883},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0124","lv":1,"s":"陸奥宗光外相の下で、1894年に日英通商航海条約が結ばれ、領事裁判権が撤廃された。","a":1,"e":"陸奥宗光外相は、日清戦争の開戦直前の1894年7月に日英通商航海条約に調印し、領事裁判権を撤廃した。ロシアの南下を警戒するイギリスが日本に歩み寄ったことが背景にある。","m":"陸奥宗光は領事裁判権撤廃","y":1894},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0125","lv":1,"s":"関税自主権を完全に回復したのは、陸奥宗光外相である。","a":0,"e":"誤り：陸奥宗光。正しくは小村寿太郎外相で、1911年に日米通商航海条約を改正して関税自主権を完全に回復した。陸奥宗光は1894年に領事裁判権を撤廃した外相である。","m":"関税自主権は小村寿太郎","y":1911},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0126","lv":1,"s":"1891年の大津事件で、大審院長の児島惟謙は、司法権の独立を守る立場をとった。","a":1,"e":"1891年、滋賀県大津でロシア皇太子が警備の巡査に襲われた。政府は皇室に対する罪を適用して死刑にするよう圧力をかけたが、大審院長児島惟謙は担当判事に通常の刑法の適用を求めた。","m":"大津事件は児島惟謙（1891）","y":1891},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0127","lv":1,"s":"大津事件で襲撃されたのは、来日したイギリス皇太子である。","a":0,"e":"誤り：イギリス皇太子。正しくはロシア皇太子ニコライ（のちの皇帝ニコライ2世）。巡査津田三蔵が切りつけた。この事件で青木周蔵外相は引責辞任し、条約改正交渉は中断した。","m":"大津事件の被害者はロシア皇太子","y":1891},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0128","lv":1,"s":"日清戦争で日本は清に勝利し、台湾を領有して台湾総督府を置いた。","a":1,"e":"下関条約で台湾を得た日本は1895年に台湾総督府を置き、初代総督に海軍大将樺山資紀を任じた。住民の激しい抵抗を軍隊で鎮圧し、総督は軍人が務めて強い権限を持った。","m":"台湾総督府で統治（1895）","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0129","lv":2,"s":"壬午軍乱は、金玉均ら開化派が日本の支援を受けて起こしたクーデタである。","a":0,"e":"誤り：金玉均ら開化派のクーデタ。正しくは1882年、閔氏政権に不満を持つ兵士が大院君を担いで起こした反乱で、日本公使館も襲われた。金玉均らのクーデタは1884年の甲申事変である。","m":"壬午＝兵士、甲申＝開化派","y":1882},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0130","lv":2,"s":"1884年の甲申事変では、金玉均ら開化派（独立党）が日本公使館の支援を受けてクーデタを起こしたが、清軍に鎮圧された。","a":1,"e":"清仏戦争で清が劣勢になった1884年、金玉均・朴泳孝ら独立党は日本公使館の支援でクーデタを起こした。しかし袁世凱の率いる清軍に鎮圧され、金玉均らは日本へ亡命した。","m":"甲申事変は金玉均ら（1884）","y":1884},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0131","lv":2,"s":"1885年の天津条約で、日清両国は朝鮮から撤兵し、将来出兵する際は事前に通告することを定めた。","a":1,"e":"甲申事変後の1885年、伊藤博文と李鴻章が天津条約を結び、日清両国の朝鮮からの撤兵と、将来出兵する場合の相互の事前通告を定めた。1894年の出兵もこの規定に基づいて行われた。","m":"天津条約は撤兵と事前通告","y":1885},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0132","lv":2,"s":"天津条約は、日本と朝鮮の間で結ばれた条約である。","a":0,"e":"誤り：日本と朝鮮。正しくは日本と清の条約で、伊藤博文と李鴻章が調印した。日朝間では、壬午軍乱後に済物浦条約、甲申事変後に漢城条約が結ばれている。","m":"天津条約は日清間（1885）","y":1885},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0133","lv":2,"s":"日英通商航海条約で日本は領事裁判権の撤廃に成功したが、関税自主権の完全回復には至らなかった。","a":1,"e":"1894年の改正では領事裁判権を撤廃し、関税率を引き上げたが、関税自主権は一部の回復にとどまった。完全な回復は1911年、小村寿太郎外相による日米通商航海条約の改正で実現した。","m":"1894は領事裁判権のみ","y":1894},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0134","lv":2,"s":"日清戦争の期間中、天皇を中心とする大本営は東京に置かれた。","a":0,"e":"誤り：東京。正しくは広島。1894年9月、大本営は大陸への出兵拠点である宇品港に近い広島に移り、明治天皇も広島に入った。臨時の第7議会も広島で開かれ、戦費を承認した。","m":"日清戦争の大本営は広島","y":1894},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0135","lv":2,"s":"日清戦争の賠償金は、金本位制の導入（貨幣法）の準備金に用いられた。","a":1,"e":"日清戦争の賠償金は軍備拡張に多くが使われたが、一部は金準備に充てられ、1897年の貨幣法で金本位制が確立した。欧米の金本位国との為替が安定し、外資の導入も容易になった。","m":"賠償金→貨幣法1897","y":1897},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0136","lv":2,"s":"下関条約で日本が受け取った賠償金は約3億両である。","a":0,"e":"誤り：約3億両。正しくは2億両（当時の日本円で約3億1000万円）。これとは別に遼東半島の返還代償として3000万両を受け取った。賠償金は軍備拡張や八幡製鉄所の建設などに使われた。","m":"賠償金は2億両（1895）","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0137","lv":2,"s":"三国干渉を受けて、日本国内ではロシアへの復讐をめざす「臥薪嘗胆」が合言葉となった。","a":1,"e":"「臥薪嘗胆」は、薪の上に寝て苦い肝をなめ復讐を誓う中国の故事に由来する。遼東半島を返還させたロシアへの反感を合言葉とし、政府は増税をしながら軍備拡張を進めた。","m":"臥薪嘗胆は三国干渉後","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0138","lv":2,"s":"井上馨外相の改正案は、外国人判事の任用を含んでいたため、政府内外から批判を受けて頓挫した。","a":1,"e":"井上馨の改正案は、外国人に内地を開放し、裁判所に外国人判事を任用するという内容だった。法律顧問ボアソナードや農商務相谷干城が国家主権を損なうと反対し、1887年に交渉は中止された。","m":"井上案は外国人判事で挫折","y":1887},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0139","lv":2,"s":"大隈重信外相の改正案は、外国人判事を大審院に限って任用する内容で、反対派の玄洋社員来島恒喜に襲撃された。","a":1,"e":"大隈重信外相は国別交渉を進めたが、大審院への外国人判事任用が新聞報道で知られると反対が強まった。1889年、玄洋社員来島恒喜が爆弾を投げて大隈は右脚を失い、交渉は中止された。","m":"大隈は爆弾で負傷・辞職","y":1889},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0140","lv":2,"s":"1871年の日清修好条規は、日本だけが清で領事裁判権を持つ不平等条約であった。","a":0,"e":"誤り：日本だけが領事裁判権を持つ不平等条約。正しくは互いに領事裁判権を認め合う対等条約で、伊達宗城と李鴻章が調印した。日本が欧米と結んだ条約とは性格が異なる。","m":"日清修好条規は相互承認の対等条約","y":1871},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0141","lv":2,"s":"下関条約は、朝鮮が清の宗主権のもとにあることを日本が承認する内容を含んでいた。","a":0,"e":"誤り：宗主権を日本が承認。正しくは清に朝鮮の独立を承認させた。清と朝鮮の宗属関係を断ち、日本が朝鮮に勢力を広げるねらいがあった。朝鮮は1897年に国号を大韓帝国と改めた。","m":"下関条約で朝鮮の独立承認","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0142","lv":3,"s":"下関条約では、沙市・重慶・蘇州・杭州の4港が新たに開かれ、清は日本に開港場での製造業を認めた。","a":1,"e":"下関条約では揚子江流域の沙市・重慶・蘇州・杭州の開港と、開港場で日本人が工場を営む権利が定められた。最恵国待遇により欧米列強も同じ権利を得て、中国への資本進出が進んだ。","m":"沙市・重慶・蘇州・杭州を開港","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0143","lv":3,"s":"遼東半島を清へ返還した日本は、その代償として清から5000万両を受け取った。","a":0,"e":"誤り：5000万両。正しくは3000万両の還付報償金。下関条約の賠償金2億両と合わせ、日清戦争で清から得た金額は2億3000万両に達した。","m":"返還の代償は3000万両","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0144","lv":3,"s":"陸奥宗光外相が調印した日英通商航海条約の実施は、1899年である。","a":1,"e":"日英通商航海条約は1894年に調印され、5年後の1899年に他国との改正条約とともに実施された。これにより領事裁判権は撤廃され、外国人居留地も廃止された。","m":"日英通商航海条約の実施は1899年","y":1899},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0146","lv":3,"s":"初代台湾総督として赴任したのは、児玉源太郎である。","a":0,"e":"誤り：児玉源太郎。正しくは樺山資紀。児玉源太郎は1898年に第4代総督となり、民政局長（のち民政長官）後藤新平とともに土地調査や鉄道建設などの統治体制を整えた。","m":"初代台湾総督は樺山資紀","y":1895},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0147","lv":3,"s":"甲申事変の事後処理として日朝間で結ばれたのは、済物浦条約である。","a":0,"e":"誤り：済物浦条約。正しくは漢城条約（1885年）。済物浦条約は1882年の壬午軍乱の事後処理として結ばれ、日本は公使館の護衛のための駐兵権を得た。","m":"壬午＝済物浦、甲申＝漢城","y":1885},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0148","lv":3,"s":"日清戦争の黄海海戦で、日本艦隊は清の北洋艦隊を破り、制海権を握った。","a":1,"e":"1894年9月、日本の連合艦隊は黄海で清の北洋艦隊を破り、制海権を握って陸軍の大陸進出を支えた。1895年2月、威海衛に逃れた北洋艦隊は日本軍の攻撃で降伏した。","m":"黄海海戦で北洋艦隊を破る","y":1894},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0149","lv":3,"s":"福沢諭吉の「脱亜論」は、雑誌『国民之友』に発表された。","a":0,"e":"誤り：『国民之友』。正しくは福沢諭吉が創刊した新聞『時事新報』。1885年、甲申事変の失敗を受けて、日本はアジアの隣国と手を切り欧米列強と同じ道を進むべきだと論じた。『国民之友』は徳富蘇峰の雑誌。","m":"脱亜論は時事新報（1885）","y":1885},{"f":"近代","t":"条約改正と日清戦争","ref":"KD-0150","lv":3,"s":"大津事件の裁判で、大審院は津田三蔵に大逆罪を適用して死刑を言い渡した。","a":0,"e":"誤り：大逆罪を適用して死刑。正しくは一般人に対する謀殺未遂罪を適用して無期徒刑とした。政府は皇室に対する罪の適用を求めたが、大審院長児島惟謙が司法権の独立を守った。","m":"大津事件は無期徒刑（1891）","y":1891},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0152","lv":1,"s":"日露戦争は、1904年2月に日本がロシアに宣戦して始まった。","a":1,"e":"ロシアが満州から撤兵せず韓国にも進出すると、日露交渉は決裂した。日本は1904年2月、旅順のロシア艦隊などを攻撃し、10日に宣戦を布告した。開戦時の首相は桂太郎である。","m":"日露戦争の開戦は1904","y":1904},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0153","lv":1,"s":"日英同盟は、日露戦争が終わった後に結ばれた。","a":0,"e":"誤り：日露戦争の後。正しくは開戦前の1902年。義和団事件後もロシアが満州を占領し続けたため、第1次桂太郎内閣はイギリスと同盟を結んでロシアに対抗した。","m":"日英同盟は開戦の前（1902）","y":1902},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0154","lv":1,"s":"日露戦争の日本海海戦では、東郷平八郎の率いる連合艦隊がバルチック艦隊を破った。","a":1,"e":"1905年5月、東郷平八郎の率いる連合艦隊は、ヨーロッパから回航してきたロシアのバルチック艦隊を対馬沖で撃滅した。この勝利がアメリカの仲介による講和を後押しした。","m":"日本海海戦は東郷平八郎","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0155","lv":1,"s":"旅順を攻略した陸軍の司令官は、東郷平八郎である。","a":0,"e":"誤り：東郷平八郎。正しくは第3軍司令官の乃木希典。多くの死傷者を出して1905年1月に旅順要塞を陥落させた。東郷平八郎は連合艦隊司令長官として日本海海戦を指揮した。","m":"旅順は乃木、海戦は東郷","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0156","lv":1,"s":"ポーツマス条約は、アメリカ大統領セオドア＝ローズヴェルトの仲介によって結ばれた。","a":1,"e":"日本は戦力・財力の限界に達し、ロシアも国内で革命運動が起こって、ともに戦争の継続が難しくなった。米大統領セオドア＝ローズヴェルトの斡旋で1905年に米国ポーツマスで講和した。","m":"ポーツマスは米大統領の仲介","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0157","lv":1,"s":"ポーツマス条約で、日本はロシアから多額の賠償金を得た。","a":0,"e":"誤り：多額の賠償金を得た。正しくは賠償金はまったく得られなかった。増税に耐えて戦争を支えた国民は不満を強め、講和反対の集会から日比谷焼打ち事件が起こった。","m":"ポーツマスは賠償金なし","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0158","lv":1,"s":"ポーツマス条約で、日本は南樺太の領有を認められた。","a":1,"e":"ポーツマス条約で、ロシアは北緯50度以南の樺太（南樺太）とその付属の島々を日本に譲った。1875年の樺太・千島交換条約でロシア領となっていた樺太の南半分が日本領に戻った形である。","m":"南樺太は日本領に（1905）","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0159","lv":1,"s":"ポーツマス条約に賠償金の規定がないことに国民が反発し、東京で日比谷焼打ち事件が起こった。","a":1,"e":"1905年9月、講和条約に反対する国民大会が東京の日比谷公園で開かれ、群衆が内相官邸や交番、政府系の新聞社などを焼き打ちした。政府は戒厳令を出して軍隊で鎮圧した。","m":"日比谷焼打ちは講和反対","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0160","lv":1,"s":"日露戦争の際、非戦論を唱えて平民社を創立したのは、徳富蘇峰である。","a":0,"e":"誤り：徳富蘇峰。正しくは幸徳秋水・堺利彦。二人は主戦論に転じた万朝報を退社し、1903年に平民社をつくって週刊『平民新聞』で非戦論を説いた。徳富蘇峰は『国民新聞』で戦争を支持した。","m":"平民社は幸徳秋水・堺利彦","y":1903},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0161","lv":1,"s":"1910年の韓国併合により、日本は韓国を植民地とし、朝鮮総督府を置いた。","a":1,"e":"1910年の韓国併合条約で韓国は日本の領土とされ、国号は朝鮮に改められた。統治機関として朝鮮総督府が置かれ、初代総督には陸軍大臣寺内正毅が就いた。総督は陸海軍の大将から選ばれた。","m":"韓国併合1910・朝鮮総督府","y":1910},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0162","lv":1,"s":"初代の韓国統監として赴任したのは、寺内正毅である。","a":0,"e":"誤り：寺内正毅。正しくは伊藤博文。第2次日韓協約で統監府が置かれ、伊藤が初代統監となった。寺内正毅は韓国併合後の初代朝鮮総督である。","m":"統監は伊藤、総督は寺内","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0163","lv":1,"s":"1906年、日本はポーツマス条約で得た鉄道を経営するため、南満州鉄道株式会社を設立した。","a":1,"e":"ポーツマス条約で得た長春・旅順間の鉄道を経営するため、1906年に半官半民の国策会社として南満州鉄道株式会社が設立された。鉄道のほか撫順炭鉱などを経営し、満州進出の中核となった。","m":"満鉄は1906年に半官半民で設立","y":1906},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0164","lv":1,"s":"1909年にハルビン駅で伊藤博文を暗殺したのは、金玉均である。","a":0,"e":"誤り：金玉均。正しくは韓国の独立運動家安重根。1909年、統監を辞めて枢密院議長となっていた伊藤博文はハルビン駅で狙撃された。金玉均は甲申事変の指導者で1894年に上海で暗殺された。","m":"伊藤暗殺は安重根（1909）","y":1909},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0165","lv":2,"s":"義和団事件の後に結ばれた北京議定書で、清は賠償金を支払い、列国は北京周辺に軍隊を駐留する権利を得た。","a":1,"e":"義和団が北京の公使館を包囲すると、日本など8か国が共同出兵して鎮圧した（北清事変）。1901年の北京議定書で清は4億5000万両の賠償金を払い、列国は公使館の守備兵の駐留権を得た。","m":"北京議定書で駐兵権（1901）","y":1901},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0166","lv":2,"s":"日英同盟は、ロシアの南下に対抗する目的で、日本とイギリスが結んだ軍事同盟である。","a":1,"e":"義和団事件後もロシアが満州を占領し続けたため、清での権益を守りたいイギリスと、韓国での優位を確保したい日本が1902年に同盟した。イギリスは「光栄ある孤立」を捨てた。","m":"日英同盟はロシアに対抗","y":1902},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0167","lv":2,"s":"伊藤博文は日英同盟に慎重で、ロシアとの協調（日露協商）を模索した。","a":1,"e":"元老の伊藤博文・井上馨は、満州をロシア、韓国を日本の勢力範囲とする満韓交換による日露協商を主張した。これに対し桂太郎首相・小村寿太郎外相はイギリスとの同盟を選んだ。","m":"伊藤は日露協商論（1901）","y":1901},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0168","lv":2,"s":"日露戦争の戦費の多くは、外債の発行によってまかなわれた。","a":1,"e":"日露戦争の戦費約17億円のうち約4割は外債で、日銀副総裁高橋是清がイギリス・アメリカで募集した。残りの多くも国内の増税と内国債でまかなわれ、戦後の財政を圧迫した。","m":"戦費は外債・高橋是清","y":1904},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0169","lv":2,"s":"ポーツマス条約で、日本はロシアから沿海州を割譲された。","a":0,"e":"誤り：沿海州を割譲された。正しくは沿海州とカムチャツカ沿岸の漁業権を得ただけである。ポーツマス条約で日本が得た領土は北緯50度以南の樺太に限られる。","m":"沿海州は漁業権のみ（1905）","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0170","lv":2,"s":"ポーツマス条約で、ロシアは日本の韓国に対する指導・監督権を認めた。","a":1,"e":"ポーツマス条約の第1条で、ロシアは韓国に対する日本の指導・監督・保護の権利を認めた。この承認を得て、日本は同じ年に第2次日韓協約を結び韓国を保護国とした。","m":"韓国の指導・監督権を承認","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0171","lv":2,"s":"南満州鉄道株式会社の初代総裁は、児玉源太郎である。","a":0,"e":"誤り：児玉源太郎。正しくは後藤新平。後藤は台湾総督府の民政長官として植民地経営に実績をあげ、満鉄の初代総裁となった。児玉源太郎は台湾総督・満州軍総参謀長を務めた軍人である。","m":"満鉄の初代総裁は後藤新平","y":1906},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0172","lv":2,"s":"第2次日韓協約により、日本は韓国の外交権を奪い、漢城に統監府を設置した。","a":1,"e":"1905年の第2次日韓協約（韓国保護条約）で日本は韓国の外交権を奪い、漢城に統監府を置いた。韓国は保護国となり、初代統監に伊藤博文が就いた。","m":"第2次日韓協約で外交権・統監府","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0174","lv":2,"s":"ハーグ密使事件を契機に、韓国皇帝高宗は退位させられ、第3次日韓協約で韓国軍が解散された。","a":1,"e":"1907年、高宗はハーグの万国平和会議に密使を送り、保護国化の不当を訴えたが、列国に無視された。日本は高宗を退位させ、第3次日韓協約で内政権を握り、韓国軍を解散させた。","m":"ハーグ密使→高宗退位","y":1907},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0175","lv":2,"s":"桂・タフト協定で、日本の韓国支配とアメリカのハワイ支配が、相互に承認された。","a":0,"e":"誤り：ハワイ。正しくはフィリピン。1905年、桂太郎首相と米陸軍長官タフトが覚書を交わした。同年の第2次日英同盟とあわせ、韓国を保護国とする国際的な条件が整った。","m":"桂・タフトは韓国とフィリピン","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0176","lv":2,"s":"韓国併合後、朝鮮総督府は土地調査事業を実施し、朝鮮の土地所有関係を調査した。","a":1,"e":"朝鮮総督府は1910〜18年に土地調査事業を行い、土地所有者を確定して地税を徴収する基礎を固めた。申告しなかった土地や所有者が不明確な土地は接収され、東洋拓殖会社などに払い下げられた。","m":"土地調査事業は併合後の総督府","y":1910},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0177","lv":2,"s":"日露協約は、日露戦争が始まる前に結ばれた。","a":0,"e":"誤り：日露戦争が始まる前。正しくは戦後の1907年に第1次が結ばれた。戦争で争った日露は、アメリカの満州進出に備えて協調に転じ、満州や内蒙古の勢力範囲を分け合った。","m":"日露協約は戦後の1907","y":1907},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0178","lv":3,"s":"1905年の第2次日英同盟では、適用範囲がインドにまで拡大された。","a":1,"e":"1905年の改定で、同盟の適用範囲はインドまで広がり、片方が1国と戦う場合も相手国が参戦する攻守同盟に強化された。イギリスは日本の韓国保護国化を認めた。","m":"第2次日英同盟はインドまで","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0179","lv":3,"s":"日露戦争に際し、非戦論を唱えたキリスト教徒の内村鑑三は、戦争を支持する主戦論に転じた。","a":0,"e":"誤り：主戦論に転じた。正しくは内村鑑三はキリスト教の立場から非戦論を貫いた。勤めていた万朝報が主戦論に転じると、幸徳秋水・堺利彦とともに退社した。","m":"内村鑑三は非戦論を貫く","y":1903},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0180","lv":3,"s":"ポーツマス条約で、日本はロシアから旅順・大連の租借権を譲り受けた。","a":1,"e":"ポーツマス条約で日本は、ロシアが清から租借していた旅順・大連など遼東半島南部の租借権を譲り受けた。この地域を関東州と呼び、1906年に関東都督府を置いて統治した。","m":"旅順・大連の租借権→関東州","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0181","lv":3,"s":"ポーツマス条約で日本は、東清鉄道の全線の権利を得た。","a":0,"e":"誤り：東清鉄道の全線。正しくは長春から旅順までの支線と付属の炭鉱などの利権に限られた。長春以北はロシアが引き続き経営し、日本が得た鉄道は南満州鉄道株式会社が経営した。","m":"鉄道の権利は長春以南","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0182","lv":3,"s":"日比谷焼打ち事件に際して、政府は東京市と周辺に戒厳令を出した。","a":1,"e":"1905年9月の日比谷焼打ち事件で、政府は東京市と周辺に戒厳令を出し軍隊で鎮圧した。第1次桂内閣は翌年退陣した。民衆の直接行動が政治を動かす大正期の運動の先がけとされる。","m":"日比谷焼打ちに戒厳令","y":1905},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0183","lv":3,"s":"第1次日韓協約で、日本は韓国政府に外交顧問として目賀田種太郎を推薦して受け入れさせた。","a":0,"e":"誤り：外交顧問。正しくは目賀田種太郎は財政顧問で、外交顧問はアメリカ人スティーブンスである。1904年の第1次日韓協約は、日本が推薦する顧問を財政・外交に置かせた。","m":"財政は目賀田、外交はスティーブンス","y":1904},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0184","lv":3,"s":"伊藤博文が暗殺されたのは、ソウル（漢城）の駅前であった。","a":0,"e":"誤り：ソウル。正しくは満州のハルビン駅。1909年、ロシア蔵相ココフツォフと会談するために訪れた伊藤博文が安重根に狙撃された。日本はこの事件の翌年に韓国併合を行った。","m":"暗殺の地はハルビン（1909）","y":1909},{"f":"近代","t":"日露戦争と韓国併合","ref":"KD-0185","lv":3,"s":"1907年の第1次日露協約では、満州を日露で南北に分けて勢力範囲とすることが、秘密条項で定められた。","a":1,"e":"1907年の第1次日露協約では、公開条約で現状維持を約し、秘密協約で北満州をロシア、南満州を日本の勢力範囲とし、外蒙古と韓国についても互いの利益を認め合った。協約は1916年の第4次まで続いた。","m":"日露協約は満州を分割","y":1907},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0188","lv":1,"s":"日本の産業革命は、紡績業・製糸業などの軽工業から始まった。","a":1,"e":"日本の産業革命は1880年代後半の企業勃興に始まり、日清戦争前後に紡績・製糸などの軽工業で機械生産が広がった。日露戦争前後には製鉄・造船などの重工業が発展した。","m":"産業革命は軽工業から重工業へ","y":1890},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0189","lv":1,"s":"官営八幡製鉄所は、日露戦争の賠償金を使って建設された。","a":0,"e":"誤り：日露戦争の賠償金。正しくは日清戦争の賠償金。軍備拡張と鉄鋼の国産化をめざして建設された。日露戦争のポーツマス条約では賠償金が得られなかった。","m":"八幡製鉄所は日清の賠償金","y":1901},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0190","lv":1,"s":"八幡製鉄所は福岡県に建設された官営の製鉄所で、1901年に操業を開始した。","a":1,"e":"八幡製鉄所は1897年に建設が始まり、ドイツの技術を導入して1901年に操業を開始した。福岡県が選ばれたのは筑豊炭田に近く、大陸から鉄鉱石を運びやすかったためである。","m":"八幡製鉄所は福岡・1901","y":1901},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0191","lv":1,"s":"大阪紡績会社を設立したのは、岩崎弥太郎である。","a":0,"e":"誤り：岩崎弥太郎。正しくは渋沢栄一。大阪紡績会社は1882年に設立され、1883年から蒸気機関とイギリス製紡績機で1万錘規模の操業を始めた。岩崎弥太郎は三菱の創始者である。","m":"大阪紡績は渋沢栄一（1882）","y":1882},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0193","lv":1,"s":"1911年に制定された工場法は、年少者や女性の労働時間を制限するなど、労働者保護を定めた最初の法律である。","a":1,"e":"工場法は1911年、第2次桂太郎内閣のときに成立した日本初の労働者保護法である。12歳未満の就業禁止、女性・年少者の労働時間を12時間までとし深夜業を禁止したが、適用範囲は狭かった。","m":"工場法1911は初の労働者保護法","y":1911},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0194","lv":1,"s":"足尾銅山鉱毒事件で、天皇に直訴を試みたのは幸徳秋水である。","a":0,"e":"誤り：幸徳秋水。正しくは田中正造。衆議院議員として足尾鉱毒問題を議会で追及した田中は、1901年に議員を辞して明治天皇に直訴を試みた。直訴状の文案は幸徳秋水が書いた。","m":"直訴は田中正造（1901）","y":1901},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0195","lv":1,"s":"高野房太郎・片山潜らは、1897年に労働組合期成会を結成して、労働組合の結成を促した。","a":1,"e":"1897年、アメリカで労働運動を学んだ高野房太郎が片山潜らと労働組合期成会を結成し、鉄工組合や日本鉄道矯正会などの組合結成を指導した。1900年の治安警察法で活動は衰えた。","m":"労働組合期成会1897","y":1897},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0196","lv":1,"s":"1900年の治安警察法は、労働者の団結権を認めて労働運動を保護した法律である。","a":0,"e":"誤り：団結権を認めて保護した。正しくは労働者の団結や同盟罷業（ストライキ）の誘惑・扇動を禁じ、政治結社や集会を警察の取締りの下に置いた。労働運動はこの法で大きく後退した。","m":"治安警察法は取締法（1900）","y":1900},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0197","lv":1,"s":"1910年に大逆事件が起こり、幸徳秋水ら社会主義者が処刑された。","a":1,"e":"1910年、明治天皇の暗殺を計画したとして多数の社会主義者・無政府主義者が検挙され、翌1911年に幸徳秋水ら12名が処刑された。以後、社会主義運動は「冬の時代」を迎えた。","m":"大逆事件は幸徳秋水ら","y":1910},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0199","lv":1,"s":"鉄道国有法は、国有鉄道を民間会社に払い下げて、鉄道の民営化を進める法律である。","a":0,"e":"誤り：民営化を進めた。正しくは主要な私鉄17社を買収して国有化する法律である。1906年に第1次西園寺公望内閣が軍事・経済上の必要から制定し、鉄道の約9割が国有となった。","m":"鉄道国有法は国有化（1906）","y":1906},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0200","lv":1,"s":"日本の産業界では、三井・三菱・住友・安田などの財閥が、さまざまな産業を支配する存在となった。","a":1,"e":"三井・三菱などの政商は、官営事業の払下げを受けて鉱山や造船などに進出し、金融・商業・鉱工業を一族で経営する財閥へ成長した。のちに持株会社による支配の形を整えた。","m":"四大財閥は三井・三菱・住友・安田","y":1909},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0202","lv":2,"s":"綿糸の輸出量が輸入量を上回ったのは、1897年のことである。","a":1,"e":"大阪紡績会社の成功で大規模な紡績会社が次々に生まれた。1890年に綿糸の国内生産が輸入を上回り、日清戦争後の中国・朝鮮への輸出増加で1897年には輸出が輸入を上回った。","m":"綿糸は1890生産超、1897輸出超","y":1897},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0204","lv":2,"s":"製糸業では、器械製糸が普及して品質が向上し、1909年には生糸の輸出量が世界一となった。","a":1,"e":"製糸業では座繰製糸に代わって長野県諏訪地方などで器械製糸が広がり、アメリカ向けの輸出が伸びた。1909年に日本は清を抜いて世界最大の生糸輸出国となった。","m":"生糸輸出は1909年世界一","y":1909},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0205","lv":2,"s":"1897年に国産の木製動力織機を発明したのは、臥雲辰致である。","a":0,"e":"誤り：臥雲辰致。正しくは豊田佐吉。安価な国産力織機は農村の中小の織物業者に普及した。臥雲辰致は明治初期に簡単な紡績機ガラ紡を発明した人物である。","m":"力織機は豊田佐吉、ガラ紡は臥雲","y":1897},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0206","lv":2,"s":"八幡製鉄所では、中国の大冶鉄山の鉄鉱石と福岡県の筑豊炭田の石炭が主な原料として使われた。","a":1,"e":"八幡製鉄所は、中国の大冶鉄山の鉄鉱石と近くの筑豊炭田の石炭を主な原料とした。日本は大冶鉄山を経営する漢冶萍公司に借款を与えて鉄鉱石を確保した。","m":"大冶鉄鉱石＋筑豊石炭","y":1901},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0208","lv":2,"s":"1900年、第2次山県有朋内閣は治安警察法を制定し、労働運動や社会運動を取り締まった。","a":1,"e":"1900年、第2次山県有朋内閣は治安警察法を定め、労働者の団結・ストライキの扇動を禁じ、政治結社・集会を警察の取締りの下に置いた。高まりつつあった労働運動は後退した。","m":"治安警察法は山県内閣","y":1900},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0210","lv":2,"s":"1901年、片山潜・幸徳秋水・安部磯雄らは社会民主党を結成したが、結成直後に禁止された。","a":1,"e":"1901年、安部磯雄・片山潜・幸徳秋水・木下尚江らが日本初の社会主義政党として社会民主党を結成した。しかし第4次伊藤内閣は治安警察法により結成直後に解散を命じた。","m":"社会民主党は結成直後に禁止","y":1901},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0211","lv":2,"s":"1906年に日本社会党が結成されたのは、第2次桂太郎内閣のときである。","a":0,"e":"誤り：第2次桂内閣。正しくは第1次西園寺公望内閣。社会主義に比較的寛容な西園寺内閣のもとで、日本社会党が初めての合法的な社会主義政党として結成されたが、翌1907年に解散を命じられた。","m":"日本社会党は西園寺内閣","y":1906},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0212","lv":2,"s":"足尾銅山の鉱毒は、古河市兵衛が経営する銅山から渡良瀬川に流れ出し、流域の農漁業に大きな被害を与えた。","a":1,"e":"古河市兵衛の経営する足尾銅山では、精錬で出る鉱毒が渡良瀬川に流れ込み、1890年代に流域の田畑や漁業に大きな被害が出た。日本の公害問題の原点とされる。","m":"足尾鉱毒は古河・渡良瀬川","y":1890},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0213","lv":2,"s":"鉱毒問題の対策として、政府は渡良瀬川下流の谷中村を遊水池にする計画を進め、村を廃止した。","a":1,"e":"政府は鉱毒対策として渡良瀬川下流に遊水池をつくることにし、1907年に栃木県谷中村を強制的に廃村とした。田中正造は谷中村に移り住み、残留した住民とともに抵抗を続けた。","m":"谷中村は遊水池に（1907）","y":1907},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0214","lv":2,"s":"農村では、地主が小作人に土地を貸して高率の現物小作料を取る寄生地主制が広まった。","a":1,"e":"松方デフレなどで土地を手放した農民が小作人となり、地主は収穫の約半分に及ぶ現物小作料を受け取った。地主は小作料収入を株式などに投資し、自らは耕作しない寄生地主となった。","m":"寄生地主制は高率現物小作料","y":1900},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0215","lv":2,"s":"貨幣法（1897年）を制定したときの大蔵大臣は、高橋是清である。","a":0,"e":"誤り：高橋是清。正しくは松方正義で、第2次松方内閣の首相が蔵相を兼ねて貨幣法を制定した。高橋是清は日露戦争の外債募集や、昭和期の金輸出再禁止で知られる。","m":"貨幣法は松方正義（1897）","y":1897},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0216","lv":3,"s":"工場法は、常時15人以上を雇用する工場を対象とし、12歳未満の就業を禁止した。","a":1,"e":"工場法は常時15人以上の職工を使う工場だけに適用され、12歳未満の就業を禁止し、女性と15歳未満の年少者の労働時間を1日12時間までとした。小さな工場は対象外だった。","m":"工場法は15人以上・12歳未満禁止","y":1911},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0217","lv":3,"s":"工場法は、1911年の公布と同時に施行された。","a":0,"e":"誤り：公布と同時に施行。正しくは1911年に公布され、資本家の反対で施行は1916年にずれこんだ。製糸業などには例外規定が設けられ、14時間労働が認められるなど不十分な内容だった。","m":"工場法は公布1911・施行1916","y":1916},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0218","lv":3,"s":"日本鉄道会社は、1881年に設立された日本初の官営鉄道会社である。","a":0,"e":"誤り：官営。正しくは華族の資金を中心に設立された最初の民営鉄道会社。上野・青森間を1891年に全通させ、その成功が私鉄ブームを生んだ。1906年の鉄道国有法で国有化された。","m":"日本鉄道会社は民営鉄道第1号","y":1881},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0219","lv":3,"s":"1898年には、日本鉄道会社の機関方（機関士）がストライキを行い、労働運動が活発となった。","a":1,"e":"1898年、日本鉄道の機関方（機関士）が待遇改善を求めてストライキを行い、要求の多くを認めさせた。これをきっかけに日本鉄道矯正会という労働組合が結成された。","m":"日本鉄道スト1898→矯正会","y":1898},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0220","lv":3,"s":"大逆事件の後、特別高等警察（特高）が設置され、社会主義運動への取り締まりが強化された。","a":1,"e":"大逆事件の翌1911年、警視庁に特別高等課が置かれ、社会主義者などの思想・言論を取り締まった。特高は1928年に全道府県に設けられ、戦時期には思想統制の中心となった。","m":"大逆事件の翌年に特高設置","y":1911},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0221","lv":3,"s":"『女工哀史』を著して紡績女工の労働の実態を告発したのは、横山源之助である。","a":0,"e":"誤り：横山源之助。正しくは細井和喜蔵で、1925年に紡績工場での自らの体験をもとに刊行した。横山源之助は1899年に『日本之下層社会』を著し、都市の貧民や工場労働者の実態を報告した。","m":"女工哀史は細井和喜蔵","y":1925},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0222","lv":3,"s":"1897年の貨幣法は、銀本位制を確立した法律である。","a":0,"e":"誤り：銀本位制。正しくは金本位制。日本は松方財政期の1885年から銀本位制だったが、銀価格の下落に対応し、日清戦争の賠償金を準備金として金本位制に移った。","m":"貨幣法は金本位制（1897）","y":1897},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0223","lv":3,"s":"三菱は、政府から官営長崎造船所の払い下げを受け、造船業を中心に発展した。","a":1,"e":"1884年以降、政府は財政難から鉱山・工場などの官営事業を払い下げた。三菱は1887年に長崎造船所の払下げを受け、海運から造船業に進出し、のち重工業の中心企業となった。","m":"長崎造船所→三菱（1887）","y":1887},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0224","lv":3,"s":"日本銀行は、1882年に大隈重信が設立し、のちに兌換銀行券を発行した。","a":0,"e":"誤り：大隈重信。正しくは大蔵卿松方正義。1882年に中央銀行として日本銀行を設立し、1885年から銀と交換できる兌換銀行券を発行して銀本位制を整えた。","m":"日銀の設立は松方正義","y":1882},{"f":"近代","t":"産業革命と社会問題","ref":"KD-0225","lv":3,"s":"三井合名会社の設立（1909年）に見られるように、財閥は持株会社を頂点とするコンツェルンへと発展した。","a":1,"e":"三井は1909年、一族が出資する三井合名会社を持株会社として設立し、銀行・物産・鉱山などの直系会社を株式所有によって支配した。こうした形態をコンツェルンという。","m":"三井合名は財閥のコンツェルン化","y":1909},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0226","lv":1,"s":"第一次世界大戦で日本は、日英同盟を理由にドイツに宣戦布告し、連合国側で参戦した。","a":1,"e":"1914年8月、第2次大隈重信内閣は、外相加藤高明の主導で日英同盟を理由にドイツに宣戦した。東アジアのドイツ権益を奪って大陸での地位を高めるねらいがあった。","m":"日英同盟を口実にドイツへ宣戦","y":1914},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0228","lv":1,"s":"1915年、日本は中国の袁世凱政府に対して、二十一カ条の要求を突きつけた。","a":1,"e":"1915年、第2次大隈内閣は袁世凱政府に二十一カ条の要求を出した。山東省のドイツ権益の継承、南満州・東部内蒙古の権益強化、旅順・大連の租借期限延長などを求め、最後通牒で大部分を認めさせた。","m":"二十一カ条は対袁世凱","y":1915},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0229","lv":1,"s":"対華二十一カ条の要求を、外務大臣として推し進めたのは小村寿太郎である。","a":0,"e":"誤り：小村寿太郎。正しくは第2次大隈内閣の外相加藤高明。小村寿太郎はポーツマス条約の全権で、1911年に関税自主権を回復した外相であり、1911年に死去している。","m":"二十一カ条は加藤高明外相","y":1915},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0230","lv":1,"s":"第一次世界大戦中の好況（大戦景気）で、日本は債務国から債権国へ転換した。","a":1,"e":"大戦でヨーロッパ製品がアジア市場から退き、日本は綿織物などの輸出を伸ばした。世界的な船舶不足で海運・造船業も好況となり、日本は約11億円の債務国から27億円以上の債権国に転じた。","m":"大戦景気で債務国→債権国","y":1915},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0231","lv":1,"s":"1918年の米騒動は、米価の高騰を背景に富山県から全国に広がり、寺内正毅内閣の退陣につながった。","a":1,"e":"シベリア出兵を見越した米の買占めなどで米価が急騰し、1918年夏に富山県から米の安売りを求める騒動が始まって全国に広がった。寺内内閣は軍隊で鎮圧したが、責任をとって総辞職した。","m":"米騒動は富山から全国へ","y":1918},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0232","lv":1,"s":"原敬内閣は、陸軍・海軍・外務の各大臣以外をすべて立憲政友会の党員で組織した、本格的な政党内閣である。","a":1,"e":"1918年に成立した原敬内閣は、陸相・海相・外相以外の閣僚を立憲政友会の党員で占めた本格的な政党内閣である。衆議院第一党の総裁が首相となった点が画期的であった。","m":"原敬内閣は本格的政党内閣","y":1918},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0233","lv":1,"s":"原敬は爵位をもつ華族の出身で、貴族院議員として首相に就任した。","a":0,"e":"誤り：華族・貴族院議員。正しくは原敬は爵位をもたず、衆議院に議席をもつ政友会総裁として首相となった。そのため「平民宰相」と呼ばれ、国民から歓迎された。","m":"原敬は平民宰相（1918）","y":1918},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0234","lv":1,"s":"第1次護憲運動は、尾崎行雄・犬養毅らを中心に起こり、第3次桂太郎内閣を総辞職に追い込んだ。","a":1,"e":"1912年末、第3次桂内閣の成立に対し、立憲政友会の尾崎行雄と立憲国民党の犬養毅らが「閥族打破・憲政擁護」を掲げて運動を起こした。民衆が議会を包囲し、桂内閣は1913年2月に退陣した（大正政変）。","m":"護憲運動で桂内閣退陣","y":1913},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0235","lv":1,"s":"吉野作造が唱えた民本主義は、国民主権の実現を求める主張であった。","a":0,"e":"誤り：国民主権の実現を求めた。正しくは主権が天皇にあるか国民にあるかは問わず、政治の目的を民衆の福利に置き、政策決定は民衆の意向によるべきだとした。帝国憲法の枠内での民主主義論である。","m":"民本主義は主権を問わず","y":1916},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0236","lv":1,"s":"1921〜22年のワシントン会議では、海軍の主力艦の保有を制限する軍縮条約が結ばれた。","a":1,"e":"1921〜22年のワシントン会議で海軍軍縮条約が結ばれ、米・英・日・仏・伊の主力艦の保有量が制限された。日本は加藤友三郎を首席全権とし、財政負担の軽減のため受け入れた。","m":"ワシントン会議で主力艦制限","y":1922},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0237","lv":1,"s":"パリ講和会議に日本の首席全権として出席したのは、原敬である。","a":0,"e":"誤り：原敬。正しくは元老の西園寺公望で、牧野伸顕らが次席全権として同行した。原敬は当時の首相である。日本は会議で人種差別撤廃案を提出したが採択されなかった。","m":"パリ講和の全権は西園寺","y":1919},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0238","lv":1,"s":"日本は国際連盟が設立されると、その常任理事国となった。","a":1,"e":"1920年に国際連盟が発足すると、日本はイギリス・フランス・イタリアとともに常任理事国となった。提唱国のアメリカは上院の反対で加盟しなかった。","m":"連盟の常任理事国に日本","y":1920},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0240","lv":2,"s":"陸軍2個師団の増設要求が通らず、陸相を辞任して第2次西園寺内閣を総辞職に追い込んだのは、山県有朋である。","a":0,"e":"誤り：山県有朋。正しくは陸相上原勇作。2個師団増設が財政難を理由に拒まれると、上原は単独で天皇に辞表を出し、陸軍は後任を推薦しなかった。山県は陸軍を背後で支えた元老である。","m":"辞任した陸相は上原勇作","y":1912},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0241","lv":2,"s":"軍部大臣現役武官制を利用した陸軍の辞職により、第2次西園寺公望内閣は総辞職した。","a":1,"e":"陸海軍大臣を現役の大将・中将に限る軍部大臣現役武官制のもとでは、軍が大臣を出さなければ内閣は組織できなかった。1912年、陸軍はこの制度を使って第2次西園寺内閣を倒した。","m":"現役武官制で内閣倒壊","y":1912},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0242","lv":2,"s":"第1次山本権兵衛内閣は、軍部大臣現役武官制を強化して、軍部の政治的発言力を高めた。","a":0,"e":"誤り：強化した。正しくは任用資格を予備役・後備役の大将・中将にまで広げて緩和した。同じ時に文官任用令も改正し、政党員が高級官僚に就く道を広げた。","m":"山本内閣は現役武官制を緩和","y":1913},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0243","lv":2,"s":"1914年、海軍高官の汚職を暴いたシーメンス事件の責任をとって、山本権兵衛内閣は総辞職した。","a":1,"e":"1914年、ドイツのシーメンス社などから海軍高官が賄賂を受け取っていたことが発覚した。海軍出身の山本首相への批判が高まり、貴族院が予算を削ったため内閣は総辞職した。","m":"シーメンス事件で山本内閣倒壊","y":1914},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0244","lv":2,"s":"二十一カ条の要求では、日本は山東省にあったドイツ権益を引き継ぐことを求めた。","a":1,"e":"二十一カ条の第1号は、ドイツが山東省に持っていた権益を日本が継承することを中国に認めさせるものだった。日本は大戦中の1914年にすでに青島などを占領していた。","m":"山東のドイツ権益を要求","y":1915},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0245","lv":2,"s":"日本は、二十一カ条の要求を最後通牒なしの交渉で中国に受け入れさせた。","a":0,"e":"誤り：最後通牒なしで受け入れさせた。正しくは1915年5月7日に最後通牒を出し、中国政府は9日に第5号（日本人顧問の採用など）を除いて受け入れた。中国では5月9日が国恥記念日とされた。","m":"二十一カ条は最後通牒","y":1915},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0246","lv":2,"s":"寺内正毅内閣は、袁世凱政権に巨額の借款（西原借款）を与えて、中国での影響力を強めようとした。","a":0,"e":"誤り：袁世凱政権。正しくは段祺瑞政権。袁世凱は1916年に死去しており、寺内内閣は私設秘書西原亀三を通じて北京の段祺瑞政権に約1億4500万円を貸し付けた。大半は回収できなかった。","m":"西原借款は寺内内閣→段祺瑞","y":1917},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0247","lv":2,"s":"1917年の石井・ランシング協定で、アメリカは日本の中国における特殊権益を認めた。","a":1,"e":"1917年、石井菊次郎特使と米国務長官ランシングが協定を結んだ。中国の領土保全・門戸開放を確認するとともに、アメリカは中国における日本の特殊権益を認めた。1923年に廃棄された。","m":"石井・ランシング協定は特殊権益","y":1917},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0248","lv":2,"s":"ワシントン会議の四カ国条約により、日英同盟は継続されることになった。","a":0,"e":"誤り：日英同盟は継続された。正しくは四カ国条約の成立で日英同盟は廃棄された。米・英・日・仏が太平洋の島々の領土を互いに尊重することを約束した条約で、日本の進出を警戒するアメリカの意向が働いた。","m":"四カ国条約で日英同盟終了","y":1921},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0249","lv":2,"s":"九カ国条約では、中国の主権尊重・領土保全・門戸開放・機会均等が定められた。","a":1,"e":"1922年の九カ国条約は、中国の主権尊重・領土保全・門戸開放・機会均等を約束した。これにより石井・ランシング協定は廃棄され、日本の中国進出は国際的に制約された。","m":"九カ国条約は中国の主権尊重","y":1922},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0250","lv":2,"s":"ヴェルサイユ条約で、日本は赤道以北のドイツ領南洋諸島の委任統治権を得た。","a":1,"e":"1919年のヴェルサイユ条約で、日本は山東省の旧ドイツ権益を継承し、赤道以北の旧ドイツ領南洋諸島を国際連盟の委任統治領とした。南洋庁を置いてパラオなどを統治した。","m":"南洋諸島は委任統治（1919）","y":1919},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0251","lv":2,"s":"ヴェルサイユ条約で、日本は山東省の旧ドイツ権益を中国に返還した。","a":0,"e":"誤り：中国に返還した。正しくはヴェルサイユ条約で日本の継承が認められた。これに反発した中国では五・四運動が起こり、中国は条約に調印しなかった。返還はワシントン会議中の1922年である。","m":"山東返還は1922年","y":1919},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0252","lv":2,"s":"原敬内閣は選挙法を改正して、納税資格を直接国税3円以上に引き下げ、小選挙区制を導入した。","a":1,"e":"原内閣は1919年に選挙法を改正し、選挙権の納税資格を直接国税10円以上から3円以上に引き下げ、小選挙区制を導入した。普通選挙の要求には時期尚早として応じなかった。","m":"原は納税3円・小選挙区制","y":1919},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0253","lv":3,"s":"1918年、寺内正毅内閣は大学令を公布し、公立・私立大学を正式な大学として認めた。","a":0,"e":"誤り：寺内正毅内閣。正しくは原敬内閣。大学令で帝国大学のほかに公立・私立大学と単科大学が認められ、慶應義塾・早稲田などが大学に昇格した。原内閣は高等教育の拡充を進めた。","m":"大学令は原内閣（1918）","y":1918},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0254","lv":3,"s":"桂太郎は第1次護憲運動のさなかに、新党（立憲同志会）の結成に動き出した。","a":1,"e":"1913年、第3次桂太郎は政友会に対抗するため新党の結成を表明したが、内閣はまもなく総辞職し、桂も同年に死去した。新党は同年末、加藤高明を総裁として立憲同志会として発足した。","m":"桂の新党は立憲同志会","y":1913},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0255","lv":3,"s":"米騒動は、1918年に富山県魚津の漁村の女性たちの行動をきっかけに、全国に拡大した。","a":1,"e":"1918年7月、富山県魚津町などの漁民の妻たちが、米の県外への積み出しを止めようと集まった。新聞が「越中女一揆」と報じて騒動は全国の都市や炭鉱に広がった。","m":"米騒動の発端は富山県魚津","y":1918},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0257","lv":3,"s":"ワシントン会議の際、日中間で山東懸案解決条約が結ばれ、日本は山東の旧ドイツ権益を中国に返還した。","a":1,"e":"ワシントン会議の際、米英の仲介で日中が交渉し、1922年に山東懸案解決条約を結んだ。日本はヴェルサイユ条約で得た膠州湾租借地などを中国に返還し、山東鉄道も中国に売り渡した。","m":"山東返還は1922年の条約","y":1922},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0258","lv":3,"s":"ワシントン海軍軍縮条約で、日本の主力艦の保有比率はアメリカ・イギリスと同率とされた。","a":0,"e":"誤り：米英と同率。正しくは米・英・日・仏・伊の主力艦保有比率を5：5：3：1.67：1.67とし、日本は米英の6割とされた。海軍軍令部には対米7割を求める不満が残った。","m":"主力艦比率は米英5・日本3","y":1922},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0259","lv":3,"s":"吉野作造が民本主義を論じたのは、雑誌『国民之友』においてである。","a":0,"e":"誤り：『国民之友』。正しくは総合雑誌『中央公論』。吉野作造は1916年に民本主義を説く論文を発表し、普通選挙と政党内閣の実現を訴えた。『国民之友』は明治期に徳富蘇峰が出した雑誌である。","m":"民本主義は『中央公論』（1916）","y":1916},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0260","lv":3,"s":"天皇機関説を唱えて憲法を解釈したのは、上杉慎吉である。","a":0,"e":"誤り：上杉慎吉。正しくは美濃部達吉。統治権は法人である国家にあり、天皇はその最高機関として憲法に従って統治権を行使すると説き、政党政治を理論的に支えた。上杉慎吉は天皇主権説の立場から反論した。","m":"天皇機関説は美濃部達吉","y":1912},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0261","lv":3,"s":"平塚らいてうは市川房枝らと、女性の政治活動の自由などを求めて新婦人協会を設立した。","a":1,"e":"1920年、平塚らいてう・市川房枝・奥むめおらが新婦人協会を結成し、女性の政治活動を禁じた治安警察法第5条の改正などを求めた。1922年に政治集会への参加が認められた。","m":"新婦人協会は平塚・市川","y":1920},{"f":"近代","t":"大正政治と第一次世界大戦","ref":"KD-0262","lv":3,"s":"被差別部落の解放をめざす全国水平社は、東京で結成された。","a":0,"e":"誤り：東京。正しくは京都。1922年、西光万吉らが京都で全国水平社を結成し、差別された人々自身の力で解放をめざすと宣言した。政府の融和政策に頼らない運動であった。","m":"全国水平社は京都で結成（1922）","y":1922},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0263","lv":1,"s":"1923年9月、関東大震災が発生し、東京・横浜などが大きな被害を受けた。","a":1,"e":"1923年9月1日、関東地方南部を大地震が襲い、東京・横浜は火災で壊滅的な被害を受けた。混乱のなか、朝鮮人が暴動を起こすという流言から多数の朝鮮人・中国人が殺害された。","m":"関東大震災は1923年9月1日","y":1923},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0264","lv":1,"s":"関東大震災の直後に首相として復興や治安に当たったのは、加藤高明である。","a":0,"e":"誤り：加藤高明。正しくは第2次山本権兵衛内閣で、震災の翌日に成立し、戒厳令の施行や支払猶予令などで対応した。加藤高明は1924年に護憲三派内閣を組織した人物である。","m":"震災時の首相は山本権兵衛","y":1923},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0265","lv":1,"s":"1924年、第2次護憲運動を経た総選挙の結果、憲政会総裁の加藤高明を首相とする内閣が成立した。","a":1,"e":"第2次護憲運動を経た1924年の総選挙で第一党となった憲政会の総裁加藤高明が首相となった。政友会・革新倶楽部と連立し、以後、衆議院の多数党が政権を担う慣行（憲政の常道）が続いた。","m":"護憲三派内閣の首相は加藤高明","y":1924},{"f":"近代","t":"政党政治と恐慌","ref":"KD-0266","lv":1,"s":"1925年の普通選挙法は、満20歳以上のすべての男女に選挙権を

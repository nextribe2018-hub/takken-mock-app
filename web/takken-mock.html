しなければならない。","a":1,"e":"建物の滅失の登記は滅失の日から1か月以内に申請しなければならない（不動産登記法57条）。","m":"建物滅失登記は1か月以内"},{"f":"権利","t":"不動産登記法","ref":"R05-14-2","s":"登記簿の附属書類のうち、Aが所有権移転の登記を申請した際の申請書については、何人も、正当な理由の有無にかかわらず、手数料を納付すれば閲覧することができる。","a":0,"e":"申請書の閲覧は、請求人に正当な理由があると認められる部分に限られる（不動産登記法121条3項）。","m":"申請書閲覧は正当理由が必要"},{"f":"権利","t":"不動産登記法","ref":"R04-14-2","s":"AがBに甲土地を売却し、資格者代理人に依頼して所有権移転の登記を申請する場合には、登記義務者Aの登記識別情報を提供する必要はない。","a":0,"e":"資格者代理人による申請でも登記識別情報の提供は必要であり、正当な理由がある場合に限り不要となる（不動産登記法22条）。","m":"代理人申請でも識別情報必要"},{"f":"権利","t":"不動産登記法","ref":"R03s-14-1","s":"Aが表題登記のされていない甲土地の所有権を取得した場合、Aは、その所有権の取得の日から1か月以内に、甲土地の表題登記を申請しなければならない。","a":1,"e":"表題登記のない土地の所有権取得者には1か月以内の表題登記の申請義務がある（不動産登記法36条）。","m":"土地表題登記は1か月以内"},{"f":"権利","t":"不動産登記法","ref":"R02s-14-2","s":"Aが所有する甲土地に、所有権の登記以外の権利に関する登記がされているときは、Aは、甲土地について分筆の登記をすることができない。","a":0,"e":"そのような制限があるのは合筆の登記であり、分筆の登記はすることができる（不動産登記法41条）。","m":"制限は合筆、分筆はOK"},{"f":"権利","t":"相続","ref":"R04-02-1","s":"Aには子B及びCがいる。Bは、Aの生前であっても、家庭裁判所の許可を受ければ、将来のAの相続についての遺留分を放棄することができる。","a":1,"e":"相続開始前の遺留分の放棄は家庭裁判所の許可を受けたときに限り効力を生ずる（民法1049条1項）。","m":"生前の遺留分放棄は家裁許可"},{"f":"権利","t":"相続","ref":"R04-02-2","s":"Aには子B及びCがいる。Bは、Aの生前に、家庭裁判所に対して将来のAの相続についての相続放棄の申述をすることはできない。","a":1,"e":"相続放棄は相続開始後にのみでき、生前の相続放棄は認められない（民法915条・938条）。","m":"相続放棄は生前不可"},{"f":"権利","t":"相続","ref":"R04-02-3","s":"Aには子B及びCがいる。Bが、Aの生前に家庭裁判所の許可を受けて遺留分を放棄した場合、Bは、その後に開始したAの相続において遺産を相続する権利を失う。","a":0,"e":"遺留分を放棄しても相続人の地位は失わず、遺産を相続することはできる。","m":"遺留分放棄≠相続放棄"},{"f":"権利","t":"相続","ref":"R04-02-4","s":"Aが遺言で全財産を友人Dに遺贈して死亡し、Aの相続人がAの配偶者Bと兄Cである場合、兄弟姉妹であるCには遺留分がない。","a":1,"e":"遺留分は兄弟姉妹以外の相続人にのみ認められる（民法1042条）。","m":"兄弟姉妹に遺留分なし"},{"f":"権利","t":"相続","ref":"R02-08-2","s":"Aの子Bが既に死亡しており、Bの子CもAより先に死亡していた場合において、その後Aが死亡したときは、Cの子DがAの相続人となることはない。","a":0,"e":"直系卑属には再代襲が認められ、ひ孫が相続人となる（民法887条3項）。","m":"子の系統は再代襲あり"},{"f":"権利","t":"相続","ref":"R02-08-4","s":"Aの相続人となるべき弟B及びBの子Cが、いずれもAの相続開始以前に死亡していた場合、Cの子DがAの相続人となることはない。","a":1,"e":"兄弟姉妹の代襲はその子（甥・姪）までで、再代襲はない（民法889条2項）。","m":"兄弟姉妹は甥姪まで"},{"f":"権利","t":"相続","ref":"R07-05-エ","s":"Aが死亡し、その相続人が子B及びDであった場合において、Bが家庭裁判所に申述して相続の放棄をしたときは、Bの子CがBを代襲してAの相続人となる。","a":0,"e":"代襲原因は相続開始以前の死亡・欠格・廃除であり、相続放棄は代襲原因とならない（民法887条2項）。","m":"放棄は代襲しない"},{"f":"権利","t":"相続","ref":"R01-06-1","s":"Aが死亡し、その相続人が子B及びCである場合、Aは、生前に作成した遺言によって、B及びCによる遺産の分割を禁止することはできない。","a":0,"e":"被相続人は遺言で相続開始から5年を超えない期間を定めて遺産分割を禁止できる（民法908条）。","m":"遺言で分割禁止5年まで"},{"f":"権利","t":"相続","ref":"R05-07-1","s":"Aが死亡し、配偶者Bが遺産分割によってAの所有していた居住建物について配偶者居住権を取得した場合において、その存続期間を定めなかったときは、存続期間は20年となる。","a":0,"e":"存続期間の定めがなければ配偶者の終身の間となる（民法1030条）。","m":"配偶者居住権は原則終身"},{"f":"権利","t":"賃貸借","ref":"R02s-06-3","s":"Aが所有する甲建物をBが賃借して居住している場合において、Aが甲建物をDに売却したときは、AD間に特段の合意がない限り、賃貸人たる地位はDに移転する。","a":1,"e":"対抗要件を備えた賃貸不動産が譲渡されると、賃貸人たる地位は原則として譲受人に移転する（民法605条の2）。","m":"売買で貸主の地位も移転"},{"f":"法令","t":"都市計画法","ref":"R05-15-1","s":"市街化調整区域は、そのまま土地利用を整序することなく放置すれば、将来における一体の都市としての整備に支障が生じるおそれがある区域として、都市計画に定められるものである。","a":0,"e":"記述は準都市計画区域の考え方に近い。市街化調整区域は「市街化を抑制すべき区域」である。","m":"調整区域＝市街化を抑制"},{"f":"法令","t":"都市計画法","ref":"H30-16-3","s":"都市計画区域について区域区分を定めた場合、市街化区域については少なくとも用途地域を定めるものとし、市街化調整区域については原則として用途地域を定めないものとする。","a":1,"e":"市街化区域は用途地域必須、市街化調整区域は原則として定めない。","m":"市街化区域は用途地域必須"},{"f":"法令","t":"都市計画法","ref":"R05-15-2","s":"高度利用地区は、用途地域内の市街地における土地の合理的かつ健全な高度利用を図るため、都市計画に建築物の高さの最低限度を定める地区である。","a":0,"e":"高度利用地区で定めるのは容積率の最高・最低限度、建蔽率の最高限度、建築面積の最低限度等。高さを定めるのは高度地区。","m":"高さは高度地区"},{"f":"法令","t":"都市計画法","ref":"R04-15-3","s":"用途地域内に高度地区を定める場合には、高度地区に関する都市計画において、建築物の容積率の最高限度又は最低限度を定めるものとされている。","a":0,"e":"高度地区で定めるのは建築物の高さの最高限度又は最低限度。容積率は高度利用地区。","m":"高度地区＝高さだけ"},{"f":"法令","t":"都市計画法","ref":"R01-15-1","s":"高度地区は、用途地域内において市街地の環境を維持し、又は土地利用の増進を図るため、建築物の高さの最高限度又は最低限度を定める地区である。","a":1,"e":"高度地区は用途地域内で高さの最高限度又は最低限度を定める。","m":"高度地区は高さ上下"},{"f":"法令","t":"都市計画法","ref":"R05-15-3","s":"特定用途制限地域は、用途地域が定められている土地の区域内において、その良好な環境の形成又は保持のため、制限すべき特定の建築物等の用途の概要を定める地域である。","a":0,"e":"特定用途制限地域は用途地域が定められていない区域（市街化調整区域を除く）に定める。","m":"特定用途制限＝用途地域の外"},{"f":"法令","t":"都市計画法","ref":"R04-15-2","s":"準都市計画区域は都市計画区域外に指定される区域であるが、この準都市計画区域についても、都市計画に特別用途地区を定めることができる。","a":1,"e":"準都市計画区域では用途地域・特別用途地区・高度地区（最高限度）・景観地区・風致地区等を定められる。","m":"準都計でも特別用途地区OK"},{"f":"法令","t":"都市計画法","ref":"R02s-15-4","s":"準都市計画区域は都市計画区域外に指定される区域であるため、準都市計画区域については、都市計画に高度地区を定めることができない。","a":0,"e":"準都市計画区域でも高度地区（高さの最高限度）は定められる。定められないのは高度利用地区。","m":"準都計：高度地区○高度利用×"},{"f":"法令","t":"都市計画法","ref":"H28-16-2","s":"準都市計画区域は都市計画区域外に指定される区域であるが、この準都市計画区域については、市街地における火災の危険を防除するため、都市計画に準防火地域を定めることができる。","a":0,"e":"準都市計画区域には防火地域・準防火地域を定めることはできない。","m":"準都計に防火系なし"},{"f":"法令","t":"都市計画法","ref":"R06-15-2","s":"準都市計画区域については、その区域内に用途地域が定められている場合であっても、都市計画に市街地開発事業を定めることはできない。","a":1,"e":"準都市計画区域には都市施設は定められるが、市街地開発事業は定められない。","m":"準都計に市街地開発事業なし"},{"f":"法令","t":"都市計画法","ref":"R06-15-1","s":"都市計画区域外の区域であっても、特に必要があるときは、当該都市計画区域外の区域に道路や公園などの都市施設に関する都市計画を定めることができる。","a":1,"e":"都市施設は特に必要があるときは都市計画区域外にも定められる。","m":"都市施設は区域外もOK"},{"f":"法令","t":"都市計画法","ref":"R06-15-4","s":"地区計画は、用途地域が定められている土地の区域内においてのみ定めることができ、また、地区計画を定める際には、地区整備計画も必ず定めなければならない。","a":0,"e":"地区計画は一定の場合用途地域外にも定められ、地区整備計画は特別な事情があれば定めなくてもよい。","m":"地区計画は用途地域外もOK"},{"f":"法令","t":"都市計画法","ref":"R03-15-4","s":"地区計画の区域内において、建築物の建築等に関する事項を詳細に定める地区整備計画においては、建築物の建蔽率の最高限度を定めることができる。","a":1,"e":"地区整備計画では建蔽率の最高限度、容積率の最高・最低限度、高さ等を定められる。","m":"地区整備計画で建蔽率OK"},{"f":"法令","t":"都市計画法","ref":"R03-15-3","s":"地区計画の区域内において定められる地区整備計画においては、当該区域について区域区分を決定するかどうかを定めることができる。","a":0,"e":"区域区分の有無は都市計画区域マスタープランで定める事項で、地区整備計画の内容ではない。","m":"区域区分はマスタープラン"},{"f":"法令","t":"都市計画法","ref":"R06-15-3","s":"準住居地域は、道路の沿道としての地域の特性にふさわしい業務の利便の増進を図りつつ、これと調和した住居の環境を保護するため定める地域である。","a":1,"e":"準住居地域の定義そのもの。","m":"準住居＝沿道"},{"f":"法令","t":"開発許可","ref":"R04-16-1","s":"市街化区域内において、市街地再開発事業の施行として行う開発行為で、その規模が1haであるものについては、都道府県知事の許可を受けなければならない。","a":0,"e":"市街地再開発事業・土地区画整理事業・都市計画事業の施行として行う開発行為は規模を問わず許可不要。","m":"〇〇事業の施行は許可不要"},{"f":"法令","t":"開発許可","ref":"R03-16-4","s":"区域区分が定められていない都市計画区域内において、土地区画整理事業の施行として行う開発行為で、その規模が8,000㎡であるものについては、都道府県知事の許可を受けなければならない。","a":0,"e":"土地区画整理事業の施行として行う開発行為は区域・規模を問わず許可不要。","m":"区画整理事業は許可不要"},{"f":"法令","t":"開発許可","ref":"R06-16-3","s":"市街化調整区域内において、都市計画事業の施行として行う開発行為については、その規模にかかわらず、都道府県知事の許可を受けなければならない。","a":0,"e":"都市計画事業の施行として行う開発行為は許可不要。","m":"都市計画事業は許可不要"},{"f":"法令","t":"開発許可","ref":"R04-16-2","s":"区域区分が定められていない都市計画区域内において、博物館の建築の用に供する目的で行う8,000㎡の開発行為については、都道府県知事の許可を受ける必要はない。","a":1,"e":"博物館・図書館・公民館・駅舎・変電所など公益上必要な建築物のための開発行為は許可不要。","m":"図書館・公民館・博物館は不要"},{"f":"法令","t":"開発許可","ref":"R03-16-1","s":"市街化区域内において、都市公園法に規定する公園施設である建築物の建築の用に供する目的で行う5,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":0,"e":"公園施設は公益上必要な建築物にあたり、開発許可は不要。","m":"公園施設は公益で不要"},{"f":"法令","t":"開発許可","ref":"R06-16-1","s":"市街化区域内において、病院の建築の用に供する目的で行う1,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":1,"e":"病院・学校・社会福祉施設は公益上の例外に当たらない。市街化区域で1,000㎡以上なので許可必要。","m":"病院・学校は例外にならない"},{"f":"法令","t":"開発許可","ref":"R03-16-2","s":"首都圏整備法に規定する既成市街地内にある市街化区域において、住宅の建築の用に供する目的で行う800㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":1,"e":"三大都市圏の既成市街地等にある市街化区域では500㎡以上で許可が必要。","m":"三大都市圏は500㎡"},{"f":"法令","t":"開発許可","ref":"R03-16-3","s":"準都市計画区域内において、商業施設の建築の用に供する目的で行う2,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":0,"e":"準都市計画区域は3,000㎡未満なら許可不要。","m":"準都計は3,000㎡未満不要"},{"f":"法令","t":"開発許可","ref":"H29-17-3","s":"都市計画区域外の区域内において、変電所の建築の用に供する目的で行う1,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":0,"e":"変電所は公益上必要な建築物で許可不要。なお区域外は1ha未満でも不要。","m":"区域外は1ha以上"},{"f":"法令","t":"開発許可","ref":"R06-16-2","s":"開発行為を伴わずに建築物を建築する場合であっても、その規模が1,000㎡以上であるときは、その建築について開発許可を受けなければならない。","a":0,"e":"開発許可は開発行為（区画形質の変更）について必要。開発行為を伴わない建築には不要。","m":"区画形質の変更がなければ不要"},{"f":"法令","t":"開発許可","ref":"R05-16-1","s":"開発許可を申請しようとする者は、あらかじめ、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。","a":1,"e":"既存の関係公共施設の管理者とは協議＋同意、新設公共施設の管理者となる者とは協議が必要。","m":"既存は同意、新設は協議"},{"f":"法令","t":"開発許可","ref":"R02-16-3","s":"開発許可を受けた開発行為により設置された公共施設は、工事完了の公告の日の翌日において、原則として、その公共施設の存する市町村の管理に属する。","a":1,"e":"他の法律や協議で別段の定めがない限り、市町村の管理に属する。","m":"公共施設は原則市町村管理"},{"f":"法令","t":"開発許可","ref":"R02-16-4","s":"開発許可を受けた者から当該開発区域内の土地の所有権その他工事を施行する権原を取得した者は、都道府県知事の承認を受けて、開発許可に基づく地位を承継することができる。","a":1,"e":"特定承継は知事の承認が必要。相続等の一般承継は当然に承継。","m":"特定承継は承認、相続は当然"},{"f":"法令","t":"開発許可","ref":"R06-16-4","s":"都道府県知事から開発許可を受けた者は、開発登録簿に、開発許可の年月日や予定建築物の用途などの必要事項を自ら登録しなければならない。","a":0,"e":"開発登録簿に登録するのは都道府県知事。","m":"登録簿は知事が作る"},{"f":"法令","t":"開発許可","ref":"R04-16-3","s":"主として自己の業務の用に供する施設の建築の用に供する目的で行う開発行為にあっては、開発区域内に土砂災害警戒区域内の土地を含んではならない。","a":0,"e":"自己業務用で含めないのは災害危険区域・土砂災害特別警戒区域等（レッドゾーン）。土砂災害警戒区域は対象外。","m":"レッドは特別警戒区域"},{"f":"法令","t":"開発許可","ref":"R04-16-4","s":"市街化調整区域内における開発行為は、市街化を促進するおそれがあるか否かにかかわらず、開発審査会の議を経れば、都道府県知事が許可をすることができる。","a":0,"e":"開発審査会の議を経て許可できるのは、市街化を促進するおそれがなく、市街化区域内で行うことが困難又は著しく不適当と認めるもの。","m":"審査会も促進おそれなしが前提"},{"f":"法令","t":"建築基準法","ref":"R06-17-1","s":"高さ25ｍの建築物を建築する場合には、周囲の状況によって安全上支障がない場合を除き、有効に避雷設備を設けなければならない。","a":1,"e":"高さ20ｍを超える建築物には原則として避雷設備が必要。","m":"避雷は20ｍ超"},{"f":"法令","t":"建築基準法","ref":"R06-17-2","s":"特定行政庁は、違反建築物について緊急の必要があるため仮に使用禁止の命令をする場合であっても、意見書の提出先等を記載した通知書を所有者等に交付しなければならない。","a":0,"e":"緊急の必要がある場合は、通知書交付等の手続によらず仮に使用禁止・使用制限を命じられる。","m":"緊急なら手続省略"},{"f":"法令","t":"建築基準法","ref":"R06-17-3","s":"防火地域内において、床面積300㎡の共同住宅について増築をする場合、その増築に係る部分の床面積の合計が10㎡以内であっても、建築確認を受ける必要がある。","a":1,"e":"10㎡以内の増改築・移転で確認不要となるのは防火・準防火地域外の場合のみ。","m":"防火地域は10㎡以内でも確認"},{"f":"法令","t":"建築基準法","ref":"H27-17-1","s":"防火地域及び準防火地域外において建築物を改築する場合で、その改築に係る部分の床面積の合計が10㎡以内であるときは、建築確認を受ける必要はない。","a":1,"e":"防火・準防火地域外での10㎡以内の増築・改築・移転は確認不要。","m":"地域外の10㎡以内は不要"},{"f":"法令","t":"建築基準法","ref":"R06-17-4","s":"建築物の所有者が、既存の劇場の用途を変更して床面積の合計が500㎡の映画館とする場合においては、両者は政令で定める類似の用途相互間の変更に当たるため、建築主事等の建築確認を受ける必要はない。","a":1,"e":"劇場・映画館・演芸場等の類似用途間の変更は確認不要。","m":"類似用途間は確認不要"},{"f":"法令","t":"建築基準法","ref":"H29-18-4","s":"既存のホテルの用途を変更して、その用途に供する部分の床面積の合計が300㎡の共同住宅とする場合においては、特殊建築物相互間の用途変更であるため、建築主事等の建築確認を受ける必要はない。","a":0,"e":"200㎡超の特殊建築物への用途変更は、類似用途でない限り確認が必要。ホテルと共同住宅は類似用途でない。","m":"200㎡超の特殊建築物へは確認"},{"f":"法令","t":"建築基準法","ref":"R04-17-2","s":"延べ面積が500㎡を超える建築物であっても、その建築物が都市計画区域及び準都市計画区域の外に所在する場合には、当該建築物について大規模の修繕を行うに当たり、建築確認を受ける必要はない。","a":0,"e":"階数2以上又は延べ面積200㎡超の新2号建築物（500㎡超の特殊建築物等も同様）は、都市計画区域の内外を問わず全国で大規模修繕に建築確認が必要。","m":"新2号は区域外も確認"},{"f":"法令","t":"建築基準法","ref":"R02-17-1","s":"鉄骨造、地上2階建て、延べ面積200㎡の共同住宅について大規模の修繕を行おうとする場合においては、その所在地のいかんにかかわらず、工事に着手する前に建築確認を受けなければならない。","a":1,"e":"2階以上の建築物は新2号建築物として、大規模修繕・模様替にも確認が必要。","m":"2階以上は修繕も確認"},{"f":"法令","t":"建築基準法","ref":"R04-17-1","s":"建築基準法の改正により、現に存する建築物が改正後の規定に適合しなくなった場合には、当該建築物は違反建築物となり、所有者は速やかに改正後の規定に適合するよう改修しなければならない。","a":0,"e":"既存不適格建築物には改正後の規定は適用されず、違反建築物とはならない（増改築時等に適合が必要）。","m":"既存不適格は違反でない"},{"f":"法令","t":"建築基準法","ref":"R04-17-4","s":"地方公共団体が条例で災害危険区域を指定した場合において、当該区域内においては、建築基準法の規定により、住居の用に供する建築物の建築は条例の内容にかかわらず一律に禁止される。","a":0,"e":"住居用建築物の禁止その他の制限は条例で定めるもので、一律禁止ではない。","m":"災害危険区域は条例で制限"},{"f":"法令","t":"建築基準法","ref":"R05-17-3","s":"建築物が防火地域及び準防火地域にわたる場合においては、原則として、その建築物の全部について、規制の緩やかな準防火地域内の建築物に関する規定が適用される。","a":0,"e":"原則として全部に厳しい方の防火地域の規定が適用される。","m":"またがりは厳しい方"},{"f":"法令","t":"建築基準法","ref":"R03-17-3","s":"防火地域又は準防火地域内にある建築物で、外壁が防火構造であるものについては、その外壁を隣地境界線に接して設けることができる旨が建築基準法に定められている。","a":0,"e":"隣地境界線に接して設けられるのは外壁が耐火構造の建築物。","m":"隣地に接するのは耐火構造"},{"f":"法令","t":"建築基準法","ref":"R05-17-4","s":"建築物を建築する場合において、石綿をあらかじめ添加した建築材料については、石綿を飛散又は発散させるおそれがないものとして国土交通大臣が定めたもの又は大臣の認定を受けたものを除き、使用してはならない。","a":1,"e":"石綿等の飛散・発散による衛生上の支障防止のための規定。","m":"石綿添加材は原則禁止"},{"f":"法令","t":"建築基準法","ref":"R06-18-1","s":"映画館で客席部分の床面積の合計が300㎡のものは、第二種住居地域内においては建築することができないが、準住居地域内においては特定行政庁の許可を受けなくても建築することができる。","a":0,"e":"準住居地域で建築できる映画館は客席200㎡未満のみ。300㎡は準住居地域でも建築不可。","m":"準住居の映画館は200㎡未満"},{"f":"法令","t":"建築基準法","ref":"R04-18-1","s":"第一種低層住居専用地域内においては、良好な住居の環境を保護するため、神社、寺院及び教会は、特定行政庁の許可を受けた場合を除き、建築することができない。","a":0,"e":"神社・寺院・教会はすべての用途地域で建築できる。","m":"宗教施設は全地域OK"},{"f":"法令","t":"建築基準法","ref":"R01-18-2","s":"工業地域内においては、幼保連携型認定こども園は、保育所と同様に、特定行政庁の許可を受けなくても建築することができ、用途地域による建築制限を受けることはない。","a":1,"e":"幼保連携型認定こども園は保育所と同様に全用途地域で建築可能。","m":"保育所系は全地域OK"},{"f":"法令","t":"建築基準法","ref":"R06-18-4","s":"都市計画において定められた建蔽率の限度が10分の8とされている地域内で、かつ、防火地域内にある耐火建築物については、特定行政庁の許可を受けた場合に限り、建蔽率の制限が適用されない。","a":0,"e":"この場合は許可なしで当然に建蔽率制限が適用されない。","m":"80％＋防火＋耐火で無制限"},{"f":"法令","t":"建築基準法","ref":"R05-18-1","s":"都市計画において定められた建蔽率の限度が10分の6の準防火地域内にある準耐火建築物で、街区の角にある敷地として特定行政庁が指定するものの内にある建築物については、建蔽率の限度に10分の2を加えた数値が限度となる。","a":1,"e":"準防火地域内の耐火・準耐火建築物等で＋1/10、角地で＋1/10、合計＋2/10。","m":"防火＋角地で2/10加算"},{"f":"法令","t":"建築基準法","ref":"R05-18-4","s":"日影による中高層の建築物の高さの制限の対象区域外にある建築物については、冬至日において対象区域内の土地に日影を生じさせるものであっても、当該制限の適用を受けることはない。","a":0,"e":"対象区域外でも高さ10ｍ超で冬至日に対象区域内に日影を生じさせるものは規制を受ける。","m":"区域外でも10ｍ超は対象"},{"f":"法令","t":"建築基準法","ref":"R02s-18-4","s":"田園住居地域内の建築物については、第一種低層住居専用地域内の建築物と異なり、北側の前面道路又は隣地との関係についての建築物の各部分の高さの制限（北側斜線制限）は適用されない。","a":0,"e":"北側斜線制限は低層住居専用地域・田園住居地域・中高層住居専用地域に適用される。","m":"北側斜線は低層・田園・中高層"},{"f":"法令","t":"建築基準法","ref":"H30-19-1","s":"田園住居地域内においては、建築物の高さは、一定の場合を除き、10ｍ又は12ｍのうち当該地域に関する都市計画において定められた建築物の高さの限度を超えてはならない。","a":1,"e":"第一種・第二種低層住居専用地域と田園住居地域には絶対高さ制限（10ｍ又は12ｍ）がある。","m":"低層・田園は10ｍか12ｍ"},{"f":"法令","t":"盛土規制法","ref":"R06-19-1","s":"都道府県知事は、宅地造成、特定盛土等又は土石の堆積に伴う災害の防止のための基礎調査を行うため必要があるときは、他人の占有する土地に立ち入ることができ、当該土地の占有者は、正当な理由がない限り、これを拒み、又は妨げてはならない。","a":1,"e":"基礎調査のための立入りは認められ、占有者は正当な理由なく拒み、妨げてはならない。","m":"基礎調査の立入りは拒めない"},{"f":"法令","t":"盛土規制法","ref":"R02s-19-3","s":"都道府県知事又はその命じた者が、基礎調査のために他人の占有する土地に立ち入ったことにより他人に損失を与えた場合においては、都道府県は、その損失を受けた者に対して、通常生ずべき損失を補償しなければならない。","a":1,"e":"立入りによる損失は、都道府県が通常生ずべき損失を補償しなければならない。","m":"立入りの損失は都道府県が補償"},{"f":"法令","t":"盛土規制法","ref":"R06-19-3","s":"宅地造成等工事規制区域内において、許可を要する宅地造成等に関する工事を行おうとする工事主は、当該工事に着手した日から2週間以内に、工事の施行に係る土地の周辺地域の住民に対し、工事の内容を周知させるための措置を講じれば足りる。","a":0,"e":"周知措置は許可申請の前に、あらかじめ講じなければならない。着手後では遅い。","m":"住民周知は申請前にあらかじめ"},{"f":"法令","t":"盛土規制法","ref":"R06-19-4","s":"特定盛土等規制区域内において、一定規模の特定盛土等に関する工事を行おうとする工事主は、許可を要する場合を除き、当該工事に着手する日の30日前までに、工事の計画を都道府県知事に届け出なければならない。","a":1,"e":"特定盛土等規制区域では一定規模の工事は届出制で、工事着手日の30日前までに知事へ届け出る。","m":"特定盛土区域は30日前届出"},{"f":"法令","t":"盛土規制法","ref":"R07-19-2","s":"宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害が生じないよう、その土地を常時安全な状態に維持するよう努めなければならないのは、土地の所有者等ではなく、工事主及び工事施行者である。","a":0,"e":"努力義務を負うのは土地の所有者・管理者・占有者である。工事主等に限られない。","m":"安全維持の努力は所有者等"},{"f":"法令","t":"盛土規制法","ref":"R07-19-4","s":"宅地造成等工事規制区域内において宅地造成等に関する工事の許可を受けた工事主は、当該許可に係る工事の現場の見やすい場所に、主務省令で定めるところにより、所定の事項を記載した標識を掲げなければならない。","a":1,"e":"許可を受けた工事主には、工事現場への標識掲示義務がある。","m":"許可工事は現場に標識"},{"f":"法令","t":"盛土規制法","ref":"R05-19-1","s":"都道府県知事は、宅地造成又は特定盛土等に伴う災害で相当数の居住者等に危害を生ずるものの発生のおそれが大きい一団の造成宅地の区域であれば、宅地造成等工事規制区域内の土地であっても、造成宅地防災区域として指定することができる。","a":0,"e":"造成宅地防災区域は、宅地造成等工事規制区域内の土地には指定できない。","m":"防災区域は規制区域の外だけ"},{"f":"法令","t":"盛土規制法","ref":"R04-19-1","s":"宅地造成等工事規制区域内の土地において、高さが2ｍを超える擁壁や排水施設の全部又は一部の除却の工事を行おうとする者は、一定の場合を除き、工事に着手する日の14日前までに、その旨を都道府県知事に届け出なければならない。","a":1,"e":"許可不要な除却工事でも、擁壁（2m超）・排水施設等の除却は着手日の14日前までに知事へ届出が必要。","m":"擁壁・排水の除却は14日前"},{"f":"法令","t":"盛土規制法","ref":"R03-19-3","s":"都道府県知事は、その地方の気候、風土又は地勢の特殊性により、政令で定める技術的基準のみによっては災害の防止の目的を達し難いと認める場合においては、規則で、宅地造成等に関する工事の技術的基準を強化し、又は必要な技術的基準を付加することができる。","a":1,"e":"都道府県知事は、一定の場合、規則で政令の技術的基準を強化・付加できる。","m":"知事は規則で基準を上乗せ可"},{"f":"法令","t":"盛土規制法","ref":"R02s-19-1","s":"宅地造成等工事規制区域は、国土交通大臣が、宅地造成、特定盛土等又は土石の堆積に伴う災害の防止に関する基本方針に基づき、関係都道府県知事の意見を聴いたうえで指定する。","a":0,"e":"宅地造成等工事規制区域を指定するのは都道府県知事（指定都市等の長）である。","m":"規制区域の指定は知事"},{"f":"法令","t":"盛土規制法","ref":"R03s-19-1","s":"宅地造成等工事規制区域及び特定盛土等規制区域のいずれにも指定されていない区域内において盛土を行う場合であっても、その盛土が一定規模以上のものであるときは、工事主は、都道府県知事に届け出なければならない。","a":0,"e":"規制区域・特定盛土等規制区域の外で行う工事には、盛土規制法上の許可も届出も不要。","m":"区域外は許可も届出も不要"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-1","s":"土地区画整理事業の施行者が仮換地を指定した場合において、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。","a":1,"e":"仮換地指定の効力発生日から換地処分公告日まで、従前と同内容で仮換地を使用収益できる。","m":"仮換地で従前どおり使える"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-4","s":"土地区画整理事業の施行者は、仮換地を指定する場合において、その仮換地に使用又は収益の障害となる物件が存するときその他特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を、仮換地の指定の効力発生の日と別に定めることができる。","a":1,"e":"施行者は特別の事情があれば、使用収益開始日を別に定めることができる。","m":"特別事情なら開始日を別に"},{"f":"法令","t":"土地区画整理法","ref":"H30-21-4","s":"土地区画整理事業の施行者が仮換地を指定する場合において、その仮換地について使用又は収益を開始することができる日は、特別の事情の有無にかかわらず、仮換地の指定の効力発生の日と同じ日としなければならない。","a":0,"e":"特別の事情があるときは、施行者は使用収益開始日を別に定めることができる。","m":"開始日は必ず同日、ではない"},{"f":"法令","t":"土地区画整理法","ref":"R07-20-3","s":"土地区画整理事業の施行者が仮換地の使用又は収益を開始することができる日を別に定めたことにより、従前の宅地及び仮換地のいずれも使用収益できずに損失を受けた者がある場合においては、施行者はその者に対して通常生ずべき損失を補償しなければならない。","a":1,"e":"開始日を別に定めたため使用収益できず損失を受けた者には、施行者が損失補償をする。","m":"開始日ずれの損失は施行者補償"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-2","s":"土地区画整理事業における換地処分は、施行者が、換地計画において定められた関係事項を官報又は公報により公告することによって行うものとされ、関係権利者への通知は要しない。","a":0,"e":"換地処分は関係権利者に換地計画で定めた事項を通知して行う。公告は換地処分があった旨の公告である。","m":"換地処分は通知で行う"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-3","s":"土地区画整理事業の換地計画において保留地として定められた土地は、換地処分の公告があった日の翌日において、施行者が取得し、施行者はこれを処分して事業費に充てることができる。","a":1,"e":"保留地は換地処分公告の翌日に施行者が取得する。","m":"保留地は公告翌日に施行者へ"},{"f":"法令","t":"土地区画整理法","ref":"R05-20-1","s":"土地区画整理事業の換地計画において定められた清算金は、換地処分の公告があった日の翌日において確定し、施行者はこれを徴収し、又は交付することとなる。","a":1,"e":"清算金は換地処分公告の翌日において確定する。","m":"清算金は公告翌日に確定"},{"f":"法令","t":"土地区画整理法","ref":"R04-20-4","s":"土地区画整理事業において換地処分の公告があった後に、換地の所有権が第三者に移転した場合であっても、確定した清算金の徴収又は交付に関する権利義務は、当然には新たな所有者に移転しない。","a":1,"e":"清算金は換地処分時点の所有者との間で確定し、その後の譲受人には当然には承継されない。","m":"清算金は処分時の所有者"},{"f":"法令","t":"土地区画整理法","ref":"R05-20-4","s":"土地区画整理組合が施行する土地区画整理事業において、組合が施行地区内の宅地について仮換地を指定しようとする場合には、あらかじめ、土地区画整理審議会の同意を得なければならない。","a":0,"e":"組合施行では総会（総代会）の同意を得る。審議会は公的施行の場合に置かれる。","m":"組合は総会、審議会は公的施行"},{"f":"法令","t":"土地区画整理法","ref":"R03-20-3","s":"土地区画整理組合が施行する土地区画整理事業の施行地区内において、事業の施行の障害となるおそれがある建築物の新築を行おうとする者は、当該組合の許可を受ければ足り、他の許可を受ける必要はない。","a":0,"e":"建築行為等の許可権者は施行者ではなく、知事等（市の区域内は市長）である。","m":"建築制限の許可は知事等"},{"f":"法令","t":"土地区画整理法","ref":"R02-20-3","s":"土地区画整理組合は、事業に要する経費に充てるため組合員に賦課金を課する場合において、定款で定めれば、賦課金の額を宅地の位置や地積等にかかわらず組合員全員について一律の額とすることができる。","a":0,"e":"賦課金は宅地の位置・地積等を考慮して公平に定めなければならない。","m":"賦課金は公平に、一律不可"},{"f":"法令","t":"農地法","ref":"R05-21-1","s":"農地の所有者が死亡し、相続人以外の者に対する特定遺贈によりその農地の所有権を取得する場合には、受遺者は農地法第3条第1項の許可を受ける必要がある。","a":1,"e":"相続や相続人への特定遺贈は許可不要だが、相続人以外への特定遺贈は3条許可が必要。","m":"相続人以外への遺贈は許可要"},{"f":"法令","t":"農地法","ref":"R03-21-1","s":"遺産分割により農地の所有権を取得した者は、農地法第3条第1項の許可を受ける必要はないが、遅滞なく、その農地の存する市町村の農業委員会にその旨を届け出なければならない。","a":1,"e":"遺産分割による取得は許可不要。ただし遅滞なく農業委員会へ届け出る必要がある。","m":"遺産分割は許可不要・届出要"},{"f":"法令","t":"農地法","ref":"R05-21-2","s":"農業者が、自己の所有する農地4アールを、自らの耕作の事業のための農業用施設の敷地に転用しようとする場合には、農地法第4条第1項の許可を受ける必要はない。","a":0,"e":"許可不要となる農業用施設への転用は2アール未満に限られる。4アールなら4条許可が必要。","m":"農業用施設は2a未満のみ不要"},{"f":"法令","t":"農地法","ref":"R05-21-3","s":"農地の所有者と買主が耕作目的で農地の売買契約を締結したが、農地法第3条第1項の許可を受けていない場合には、当該売買契約による所有権移転の効力は生じない。","a":1,"e":"許可を受けない権利移動は効力を生じない。","m":"無許可売買は効力なし"},{"f":"法令","t":"農地法","ref":"R04-21-2","s":"農地所有適格法人の要件を満たしていない株式会社は、いかなる場合であっても、耕作の目的で農地を借り入れることについて農地法第3条第1項の許可を受けることができない。","a":0,"e":"適格法人でない法人も、一定の要件を満たせば3条許可を受けて農地を借り入れられる。","m":"適格法人以外も借りるのは可"},{"f":"法令","t":"農地法","ref":"R04-21-1","s":"耕作目的で農地の使用貸借による権利の設定を受けた者は、その登記がなくても、農地の引渡しを受けていれば、その後にその農地について物権を取得した第三者に対抗することができる。","a":0,"e":"引渡しで対抗できるのは農地の賃貸借である。使用貸借には適用されない。","m":"引渡し対抗は賃貸借だけ"},{"f":"法令","t":"農地法","ref":"R04-21-3","s":"農地法の規定に違反して農地を転用した者がいる場合において、都道府県知事等が行う原状回復等の措置命令の対象には、当該転用に係る工事を請け負った者は含まれない。","a":0,"e":"原状回復等の命令は、違反転用者だけでなく工事の請負人・下請人にも出せる。","m":"請負人も原状回復命令の対象"},{"f":"法令","t":"農地法","ref":"R06-21-4","s":"農地の賃貸借の当事者は、農事調停による場合等一定の場合を除き、都道府県知事の許可を受けなければ、賃貸借の解除をし、解約の申入れをし、又は更新をしない旨の通知をしてはならない。","a":1,"e":"賃貸借の解除・解約申入れ等は原則知事の許可が必要（農事調停による場合等は除く）。","m":"賃貸借解約は知事許可"},{"f":"法令","t":"農地法","ref":"R03s-21-3","s":"登記簿上の地目が宅地とされている土地であれば、現況が耕作の目的に供されている農地であっても、その土地の売買や転用について農地法の規制を受けることはない。","a":0,"e":"農地か否かは登記簿の地目ではなく現況で判断する。","m":"農地かは現況で判断"},{"f":"法令","t":"農地法","ref":"R02-21-2","s":"市街化区域内にある農地を住宅の敷地に転用する場合には、転用した後に遅滞なく農業委員会に届け出れば、農地法第4条第1項の許可を受ける必要はない。","a":0,"e":"市街化区域内の特例は、あらかじめ（転用前に）農業委員会へ届け出ることが要件。","m":"市街化区域は事前届出"},{"f":"法令","t":"農地法","ref":"R07-21-4","s":"法人の代表者が、その法人の業務に関し、農地法第4条第1項の許可を受けずに農地を転用した場合には、行為者のほか、その法人にも罰金刑が科されるが、その上限は300万円である。","a":0,"e":"4条・5条違反等の法人重科は1億円以下の罰金である。","m":"法人罰金は1億円以下"},{"f":"法令","t":"農地法","ref":"R03-21-4","s":"都道府県が病院の用に供するため農地を取得しようとする場合においては、都道府県と都道府県知事等との協議が成立することをもって、農地法第5条第1項の許可があったものとみなされる。","a":1,"e":"国・都道府県等が一定の目的で転用目的取得をする場合、協議成立で許可があったものとみなされる。","m":"国・県は協議成立で許可みなし"},{"f":"法令","t":"国土利用計画法","ref":"R06-22-1","s":"市街化調整区域内に所在する4,000㎡の土地について、土地の所有者が対価を得て第三者のために地上権を設定する契約を締結した場合には、当該地上権者は事後届出を行わなければならない。","a":0,"e":"市街化調整区域の届出対象面積は5,000㎡以上。4,000㎡なら不要。","m":"調整区域は5,000㎡以上"},{"f":"法令","t":"国土利用計画法","ref":"R03s-22-1","s":"都市計画区域外に所在する12,000㎡の土地について、土地の所有者が対価を得て第三者のために地上権を設定する契約を締結した場合には、当該地上権者は事後届出を行わなければならない。","a":1,"e":"対価を伴う地上権設定は土地売買等の契約に当たり、区域外は10,000㎡以上で届出対象。","m":"区域外は1万㎡以上"},{"f":"法令","t":"国土利用計画法","ref":"R06-22-2","s":"一定面積以上の土地について土地の交換契約を締結した場合において、当事者間で交換差金の授受がないときは、届出対象面積の要件を満たしていても、事後届出を行う必要はない。","a":0,"e":"交換も対価のある契約として土地売買等の契約に当たり、面積要件を満たせば届出が必要。","m":"交換は金銭なしでも対象"},{"f":"法令","t":"国土利用計画法","ref":"R06-22-3","s":"土地売買等の契約を締結した者が、必要な事後届出を行わなかった場合において、都道府県知事はその者に対して勧告をすることができるにとどまり、無届出について罰則の適用はない。","a":0,"e":"無届出は罰則（6月以下の拘禁刑又は100万円以下の罰金）の対象となる。","m":"無届出は罰則あり"},{"f":"法令","t":"国土利用計画法","ref":"R05-22-1","s":"国から一定面積以上の土地を購入する売買契約を締結した場合には、当事者の一方が国であるため、その面積にかかわらず、権利取得者は事後届出を行う必要はない。","a":1,"e":"当事者の一方又は双方が国等である場合は、事後届出は不要。","m":"国等が当事者なら届出不要"},{"f":"法令","t":"国土利用計画法","ref":"R05-22-3","s":"一定面積以上の土地について土地売買等の契約を締結した場合には、売主と買主は、共同して、契約締結日から起算して2週間以内に、都道府県知事に事後届出を行わなければならない。","a":0,"e":"事後届出をするのは権利取得者（買主等）のみで、売主に義務はない。","m":"届出は権利取得者だけ"},{"f":"法令","t":"国土利用計画法","ref":"R04-22-2","s":"国土利用計画法に基づく事後届出においては、土地の利用目的は届出事項とされているが、土地売買等の契約に係る土地に関する権利の移転又は設定の対価の額は届出事項とされていない。","a":0,"e":"対価の額も届出事項である。ただし勧告は利用目的についてのみ行う。","m":"対価の額も届出事項"},{"f":"法令","t":"国土利用計画法","ref":"R04-22-3","s":"市街化調整区域内において、Aが一団の土地である甲土地3,500㎡と乙土地2,500㎡を、それぞれ別の所有者から別々の売買契約により購入した場合には、Aは事後届出を行わなければならない。","a":1,"e":"一団の土地は合計6,000㎡で判定し、調整区域の5,000㎡以上に当たるため届出が必要。","m":"一団の土地は合計で判定"},{"f":"法令","t":"国土利用計画法","ref":"R04-22-4","s":"事後届出を受けた都道府県知事が土地の利用目的について勧告をしたにもかかわらず、届出をした者がその勧告に従わなかった場合には、当該土地売買等の契約は無効となる。","a":0,"e":"勧告に従わないときは公表されることがあるが、契約の効力には影響しない。","m":"勧告違反でも契約は有効"},{"f":"法令","t":"国土利用計画法","ref":"R03-22-1","s":"土地売買等の契約を締結した権利取得者は、事後届出が必要な場合には、契約を締結した日の翌日から起算して3週間以内に、所定の事項を都道府県知事に届け出ればよい。","a":0,"e":"事後届出の期限は契約締結日から起算して2週間以内である。","m":"事後届出は2週間以内"},{"f":"法令","t":"国土利用計画法","ref":"R02-22-1","s":"市街化調整区域内に所在する6,000㎡の土地について、売買の予約を締結した場合には、本契約を締結していなくても、予約上の権利者は事後届出を行わなければならない。","a":1,"e":"予約も土地売買等の契約に含まれ、5,000㎡以上なので届出が必要。","m":"予約も届出対象"},{"f":"法令","t":"国土利用計画法","ref":"R07-22-4","s":"市街化区域内の一団の土地のうち、Aが1,200㎡を購入するとともに、これに隣接する1,300㎡を所有者から無償で借り受けた場合には、Aは事後届出を行う必要はない。","a":1,"e":"無償の賃借は対価がなく対象外。購入分1,200㎡は2,000㎡未満なので届出不要。","m":"無償の貸借は面積に含めない"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R05-24-3","s":"不動産取得税は、不動産の取得に対し、当該不動産の所在する市町村において、当該不動産の取得者に課する税であり、市町村の条例で税率等が定められる。","a":0,"e":"不動産取得税は都道府県税。不動産所在の都道府県が取得者に課する。","m":"取得税は都道府県"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R05-24-4","s":"不動産取得税は、市町村や特別区が不動産を取得した場合には、その取得の目的や不動産の用途にかかわらず、これらの者に対して課することができない。","a":1,"e":"国・都道府県・市町村・特別区等には不動産取得税を課することができない（人的非課税）。","m":"国・自治体は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H30-24-1","s":"不動産取得税の納税義務者は、不動産を取得した日の翌日から起算して3か月以内に、当該不動産の所在する都道府県に対して税額を申告し、これを納付しなければならない。","a":0,"e":"不動産取得税は普通徴収（納税通知書による納付）で、申告納付ではない。","m":"取得税は普通徴収"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H30-24-3","s":"相続により土地や家屋を取得した場合には、その取得は形式的な所有権の移転等に当たるため、取得した不動産の価格にかかわらず、不動産取得税は課されない。","a":1,"e":"相続・法人の合併など形式的な移転は非課税。","m":"相続・合併は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02-24-4","s":"共有物の分割により不動産を取得した場合には、当該不動産の取得者の分割前の当該共有物に係る持分の割合を超えない部分の取得については、不動産取得税は課されない。","a":1,"e":"持分を超えない部分は形式的取得として非課税。超過部分は課税。","m":"持分内の分割は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R04-24-1","s":"固定資産税の徴収については、市町村は、納税通知書を納税者に交付する方法ではなく、給与所得に係る住民税と同様に、特別徴収の方法によらなければならないとされている。","a":0,"e":"固定資産税は普通徴収（納税通知書による）。","m":"固定資産税も普通徴収"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R04-24-3","s":"固定資産税の賦課期日は、地方税法に定めがなく、当該固定資産の所在する市町村の条例で定める日とされており、市町村ごとに異なる日を定めることができる。","a":0,"e":"賦課期日は地方税法で当該年度の初日の属する年の1月1日と定められている。","m":"賦課期日は1月1日"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R04-24-4","s":"固定資産税の課税対象となる土地や家屋が第三者に賃貸されている場合には、当該固定資産税は、所有者ではなく、その固定資産を現に使用している賃借人に対して課される。","a":0,"e":"賃借人は納税義務者とならない。原則は所有者に課税。","m":"賃借人には課税なし"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R01-24-4","s":"質権又は100年より永い存続期間の定めのある地上権の目的である土地については、その所有者ではなく、その質権者又は地上権者が固定資産税の納税義務者となる。","a":1,"e":"質権者・100年超の地上権者は所有者に代わり固定資産税の納税義務者となる。","m":"質権・百年地上権は例外"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02s-24-3","s":"固定資産税の納期は、4月、7月、12月及び2月中において、当該市町村の条例で定めるが、特別の事情がある場合においては、これと異なる納期を定めることができる。","a":1,"e":"原則4月・7月・12月・2月中で条例で定め、特別の事情があれば異なる納期も可。","m":"納期は変更可"},{"f":"税他","t":"印紙税・登録免許税","ref":"R05-23-1","s":"土地の売買契約において、売主、買主及び媒介をした宅地建物取引業者がそれぞれ1通ずつ保存するために同一内容の契約書を3通作成した場合には、その3通すべてが印紙税の課税文書となる。","a":1,"e":"仲介人保存分も含め、同一内容を2通以上作成すればすべて課税文書。","m":"仲介人保存分も課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R04-23-1","s":"土地の譲渡に関する基本的事項を合意し、後日正式な本契約書を作成することとして作成した覚書は、契約の成立を証するものであっても、印紙税は課されない。","a":0,"e":"仮契約書・覚書でも契約の成立を証すれば課税文書となる。","m":"覚書・仮契約も課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R04-23-3","s":"既に締結されている土地の賃貸借契約について、その契約期間を変更することを証するために作成した覚書は、重要な事項を変更するものとして、印紙税の課税文書となる。","a":1,"e":"契約期間など重要事項を変更する文書は課税文書となる。","m":"重要事項変更は課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R05-23-3","s":"時価2,000万円の土地を無償で譲渡することを内容とする贈与契約書を作成した場合には、当該契約書の記載金額は2,000万円として印紙税が課される。","a":0,"e":"贈与は対価がないため「記載金額のない」譲渡契約書として扱う（200円）。","m":"贈与は記載金額なし"},{"f":"税他","t":"印紙税・登録免許税","ref":"R05-23-4","s":"当初5,000万円と記載された土地の売買契約書について、売買金額を1,000万円減額する旨を記載した変更契約書を作成した場合には、当該変更契約書の記載金額は1,000万円となる。","a":0,"e":"減額の変更契約書は記載金額のない文書として扱う。増額なら増加額が記載金額。","m":"減額変更は金額なし"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02-23-3","s":"国と株式会社が共同で土地の売買契約書を2通作成し、それぞれが1通ずつ保存する場合には、当該株式会社が保存する契約書については、印紙税は課されない。","a":1,"e":"会社が保存する文書は国が作成したものとみなされ非課税となる。","m":"国作成とみなす分は非課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02-23-4","s":"建物の所有を目的とする土地の賃貸借契約書に、返還されない権利金の額と月額賃料の額がともに記載されている場合には、印紙税の課税標準となる記載金額は権利金の額のみとなる。","a":1,"e":"土地賃借権設定契約書の記載金額は権利金等の返還されない金額。賃料は含まない。","m":"賃料は記載金額外"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02s-23-3","s":"個人が土地を購入し、売買による所有権の移転登記を受ける場合において、当該登記に係る登録免許税の課税標準は、当該土地の売買契約書に記載された実際の取引価格とされている。","a":0,"e":"不動産の課税標準は登記時の価額で、固定資産課税台帳の価格がある場合はそれを基礎とする。","m":"課税標準は台帳価格"},{"f":"税他","t":"印紙税・登録免許税","ref":"R03s-23-3","s":"個人が一定の要件を満たす住宅用家屋を取得し、所有権の移転登記について登録免許税の税率の軽減措置の適用を受ける場合には、その敷地である土地の所有権の移転登記についても同様に当該軽減措置が適用される。","a":0,"e":"この軽減措置は住宅用家屋の登記が対象で、敷地の土地には適用されない。","m":"家屋のみ対象"},{"f":"税他","t":"印紙税・登録免許税","ref":"H30-23-2","s":"住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置は、個人が当該住宅用家屋を交換により取得した場合には、他の要件を満たしていても適用されない。","a":1,"e":"適用は売買又は競落による取得に限られる。交換・贈与・相続は対象外。","m":"売買・競落のみ"},{"f":"税他","t":"所得税・譲渡","ref":"R03-23-2","s":"個人が土地建物を譲渡した場合における譲渡所得の金額の計算上、取得費には、その資産の取得に要した金額は含まれるが、その資産の設備費や改良費は含まれない。","a":0,"e":"取得費には取得に要した金額のほか設備費・改良費も含まれる。","m":"改良費も取得費"},{"f":"税他","t":"所得税・譲渡","ref":"R03-23-1","s":"総合課税の対象となる譲渡所得の金額の計算上、短期譲渡所得と長期譲渡所得がある場合には、譲渡所得の特別控除額は、まず短期譲渡所得の金額から控除し、残額を長期譲渡所得の金額から控除する。","a":1,"e":"総合課税の譲渡所得の特別控除50万円は短期分から先に控除する。","m":"控除は短期から"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-2","s":"建物の所有を目的とする借地権の設定に際して受け取った権利金の額が、その土地の価額の10分の5を超える場合には、その権利金は譲渡所得ではなく不動産所得として課税される。","a":0,"e":"一定の場合、借地権設定の対価は譲渡所得として課税される。","m":"権利金5/10超は譲渡"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-3","s":"不動産業者である個人が、営利を目的として継続的に行う土地の譲渡により生ずる所得は、事業所得や雑所得ではなく、譲渡所得として所得税が課税される。","a":0,"e":"営利目的で継続的に行う譲渡は事業所得（又は雑所得）となる。","m":"業としての売買は事業"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-4","s":"個人が相続により取得した土地を譲渡した場合において、その土地の取得費は、被相続人の取得費を引き継ぐのではなく、相続の時におけるその土地の価額によるものとされている。","a":0,"e":"相続で取得した資産は被相続人の取得費・取得時期を引き継ぐ。","m":"相続は取得費引継ぎ"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-1","s":"個人が所有する別荘など、生活に通常必要でない資産について災害により損失を受けた場合には、その損失の金額は、その年分又はその翌年分の譲渡所得の金額の計算上控除するものとされている。","a":1,"e":"生活に通常必要でない資産の災害損失は、その年・翌年の譲渡所得の金額から控除する。","m":"別荘損失は譲渡から"},{"f":"税他","t":"所得税・譲渡","ref":"R01-23-3","s":"個人が居住用財産を譲渡した場合において、その譲渡の相手方が自己の孫であるときは、その孫と同居していないときであっても、居住用財産の譲渡所得の3,000万円特別控除の適用を受けることはできない。","a":1,"e":"配偶者・直系血族への譲渡は同居の有無にかかわらず3,000万円控除の対象外。","m":"直系血族へは不可"},{"f":"税他","t":"所得税・譲渡","ref":"R01-23-1","s":"個人が収用等により居住用財産を譲渡した場合において、収用等の場合の5,000万円特別控除の適用を受けるときは、その控除後の譲渡益について、居住用財産を譲渡した場合の軽減税率の特例を重ねて適用することができる。","a":1,"e":"5,000万円控除後の残額に軽減税率の特例を適用できる。","m":"収用控除と軽減税率は併用"},{"f":"税他","t":"所得税・譲渡","ref":"R06-23-1","s":"個人が居住用財産を譲渡し、その譲渡について居住用財産を譲渡した場合の軽減税率の特例の適用を受けた場合において、同じ年に新たに取得した住宅を居住の用に供したときは、その住宅について住宅ローン控除の適用を受けることはできない。","a":1,"e":"居住年等に軽減税率特例など一定の譲渡特例を受けると住宅ローン控除は不可。","m":"軽減税率とローン控除は×"},{"f":"税他","t":"所得税・譲渡","ref":"R06-23-2","s":"個人が居住用財産を譲渡し、居住用財産の買換え等の場合の譲渡損失の損益通算の特例の適用を受けた場合には、新たに取得した住宅について住宅ローン控除の適用を受けることはできない。","a":0,"e":"譲渡損失の損益通算・繰越控除の特例とは併用できる。","m":"損失特例とは併用可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R04-25-1","s":"土地鑑定委員会は、標準地の単位面積当たりの正常な価格を判定したときは、標準地の所在地、単位面積当たりの価格及び価格判定の基準日のほか、標準地の地積及び形状についても官報で公示しなければならない。","a":1,"e":"所在地・単位面積当たり価格・価格判定基準日・地積・形状等を官報で公示する。","m":"地積・形状も公示"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R04-25-2","s":"地価公示法における正常な価格とは、土地について自由な取引が行われるとした場合に通常成立すると認められる価格をいい、当該土地に建物がある場合には、その建物が存するものとして算定する。","a":0,"e":"建物や地上権等がある場合は、それらが存しないものとして算定する（更地価格）。","m":"正常価格は更地前提"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02s-25-1","s":"土地鑑定委員会が標準地を選定するに当たり、その土地に地上権その他使用収益を制限する権利が存する場合であっても、その土地を標準地として選定することができる。","a":1,"e":"地上権等があっても選定可能。価格はそれが存しないものとして求める。","m":"地上権付きも選定可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02s-25-3","s":"土地鑑定委員会は、標準地の正常な価格を判定したときは、標準地の単位面積当たりの価格のほか、当該標準地の地積に応じた価格の総額についても官報で公示しなければならない。","a":0,"e":"公示するのは単位面積当たりの価格で、総額は公示事項ではない。","m":"総額は公示しない"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R01-25-4","s":"標準地は、土地鑑定委員会が、自然的及び社会的条件からみて類似の利用価値を有すると認められる地域において、土地の利用状況、環境等が特に良好と認められる一団の土地について選定する。","a":0,"e":"自然的・社会的条件からみて類似する地域で、環境等が通常と認められる土地から選定。","m":"標準地は通常の土地"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R03s-25-2","s":"不動産鑑定士は、公示区域内の土地について鑑定評価を行う場合において、当該土地の正常な価格を求めるときは、公示価格と実際の取引価格を規準としなければならない。","a":0,"e":"不動産鑑定士が規準とするのは公示価格のみ。","m":"規準は公示価格だけ"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R05-25-2","s":"不動産の鑑定評価における原価法は、対象不動産が建物又は建物及びその敷地である場合に適用されるものであり、対象不動産が土地のみである場合には、いかなる場合においても適用することができない。","a":0,"e":"造成地・埋立地など再調達原価を適切に求められれば土地にも適用できる。","m":"造成地なら原価法可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R06-25-3","s":"不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用を前提として把握される価格を標準として形成されるが、これを不動産の価格に関する諸原則のうち適合の原則という。","a":0,"e":"これは最有効使用の原則。適合の原則は周辺環境への適合をいう。","m":"最高度＝最有効使用"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R06-25-4","s":"不動産の鑑定評価における収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求める手法であり、賃貸用不動産又は賃貸以外の事業の用に供する不動産の価格を求める場合に特に有効である。","a":1,"e":"純収益の現在価値の総和を求める手法で、賃貸用・事業用不動産に特に有効。","m":"収益還元は賃貸に有効"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02-25-3","s":"特殊価格とは、一般的に市場性を有しない不動産について、その利用現況等を前提とした経済価値を適正に表示する価格をいい、その例としては、文化財の指定を受けた建造物等が挙げられる。","a":1,"e":"特殊価格は市場性を有しない不動産の経済価値。文化財等が典型例。","m":"文化財は特殊価格"},{"f":"税他","t":"住宅金融支援機構","ref":"R05-46-2","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において、民間金融機関が貸し付けた住宅ローン債権のうち、新築住宅の建設又は購入に必要な資金の貸付けに係るもののみを買取りの対象としている。","a":0,"e":"中古住宅の購入資金に係る債権も買取りの対象。","m":"中古も買取対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R04-46-1","s":"独立行政法人住宅金融支援機構の証券化支援事業（買取型）において譲受けの対象となる貸付債権には、住宅の建設に付随する土地又は借地権の取得に必要な資金の貸付けに係るものは含まれない。","a":0,"e":"住宅の建設・購入に付随する土地・借地権の取得資金も対象に含まれる。","m":"付随の土地も対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R06-46-1","s":"独立行政法人住宅金融支援機構の証券化支援事業（買取型）において譲受けの対象となる貸付債権には、住宅の購入に付随する当該住宅の改良に必要な資金の貸付けに係るものは含まれない。","a":0,"e":"住宅購入に付随する当該住宅の改良資金も対象に含まれる。","m":"付随の改良も対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R07-46-2","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において、自ら居住する住宅のための貸付債権のほか、賃貸住宅の建設又は購入に必要な資金の貸付けに係る債権についても譲受けの対象としている。","a":0,"e":"対象は本人又は親族が居住する住宅のための貸付債権。賃貸住宅は対象外。","m":"賃貸住宅は対象外"},{"f":"税他","t":"住宅金融支援機構","ref":"R05-46-4","s":"独立行政法人住宅金融支援機構は、マンション管理組合や区分所有者に対し、マンションの共用部分の改良に必要な資金の貸付けを行うことを業務として行っている。","a":1,"e":"マンション管理組合等への共用部分改良資金の直接融資は機構の業務。","m":"マンション共用部融資"},{"f":"税他","t":"住宅金融支援機構","ref":"R04-46-2","s":"独立行政法人住宅金融支援機構は、団体信用生命保険業務として、貸付けを受けた者が死亡した場合だけでなく、重度障害の状態となった場合にも、支払われる保険金を当該貸付けに係る債務の弁済に充当している。","a":1,"e":"死亡のほか重度障害の場合の保険金も債務弁済に充当する業務を行う。","m":"団信は重度障害も"},{"f":"税他","t":"住宅金融支援機構","ref":"R04-46-4","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において買い取った住宅ローン債権を担保としてMBS（資産担保証券）を発行することにより、債券市場から資金を調達している。","a":1,"e":"買取型で買い取った住宅ローン債権を担保にMBSを発行し資金調達する。","m":"買取型はMBS発行"},{"f":"税他","t":"住宅金融支援機構","ref":"R02-46-2","s":"独立行政法人住宅金融支援機構が行う、災害により滅失した住宅に代わるべき建築物の建設又は購入に必要な資金の貸付けについては、元金据置期間を設けることができない。","a":0,"e":"災害復興建築物の貸付金は元金据置期間を設けることができる。","m":"災害復興は据置可"},{"f":"税他","t":"住宅金融支援機構","ref":"R07-46-3","s":"独立行政法人住宅金融支援機構は、高齢者が自ら居住する住宅について行うバリアフリー工事に必要な資金の貸付けについて、貸付けを受けた者の死亡時に一括して償還する方法をとることができる制度を設けている。","a":1,"e":"高齢者向け返済特例制度として死亡時一括償還が設けられている。","m":"高齢者は死亡時一括"},{"f":"税他","t":"住宅金融支援機構","ref":"R06-46-3","s":"独立行政法人住宅金融支援機構は、民間金融機関が貸し付けた住宅ローンについて住宅融資保険を引き受けることにより、民間金融機関による住宅資金の供給を支援している。","a":1,"e":"住宅融資保険により民間金融機関の住宅資金供給を支援している。","m":"融資保険で民間支援"},{"f":"税他","t":"景品表示法","ref":"R04-47-1","s":"宅地建物取引業者が新聞折込チラシに分譲住宅の広告を掲載する場合において、駅からの徒歩による所要時間は、道路距離80ｍにつき1分間を要するものとして算出し、1分未満の端数が生じたときは切り捨てて表示しなければならない。","a":0,"e":"1分未満の端数は切り上げる。","m":"徒歩80m1分切上げ"},{"f":"税他","t":"景品表示法","ref":"R04-47-2","s":"宅地建物取引業者が、既に売買契約が成立している物件をインターネット広告に掲載し続けた場合であっても、顧客からの問合せがあった際に契約済みである旨を説明すれば、不当表示には当たらない。","a":0,"e":"契約済み物件の掲載はおとり広告に当たり、事後に説明しても不当表示となる。","m":"契約済み掲載はおとり"},{"f":"税他","t":"景品表示法","ref":"R05-47-1","s":"宅地建物取引業者が広告に掲載した物件が実際に存在するものであっても、その業者に当該物件を取引する意思がない場合には、その表示は不当表示に当たる。","a":1,"e":"実際には取引する意思がない物件の表示はおとり広告として禁止される。","m":"意思なき広告はおとり"},{"f":"税他","t":"景品表示法","ref":"R04-47-4","s":"宅地建物取引業者が建築条件付土地の取引について広告をする場合には、取引の対象が土地である旨、建築請負契約を締結すべき期限等の条件の内容及び条件が成就しなかったときの措置の内容を明示しなければならない。","a":1,"e":"対象が土地である旨、条件の内容、条件不成就時の措置を明示する必要がある。","m":"建築条件付は3点明示"},{"f":"税他","t":"景品表示法","ref":"R07-47-1","s":"宅地建物取引業者が分譲団地の広告を行う場合において、団地と最寄駅との間の道路距離又は所要時間は、団地内の最も近い区画又は最も遠い区画のいずれか一方を起点として算出した数値を表示すれば足りる。","a":0,"e":"最も近い区画と最も遠い区画を起点とした数値の両方を表示する。","m":"団地は近遠両方"},{"f":"税他","t":"景品表示法","ref":"R03s-47-4","s":"宅地建物取引業者が中古マンションの広告を行う場合において、修繕積立金が住戸により異なり、全ての住戸の修繕積立金を示すことが困難であるときは、最低額及び最高額のみで表示することができる。","a":1,"e":"全住戸の表示が困難なときは最低額と最高額のみで表示できる。平均額は不可。","m":"最低と最高のみ"},{"f":"税他","t":"景品表示法","ref":"R06-47-2","s":"宅地建物取引業者が土地の売買の広告を行う場合において、当該土地上に古家が存在するときであっても、現地を見れば古家の存在が容易に分かるのであれば、広告においてその旨を明示する必要はない。","a":0,"e":"古家・廃屋等が存在するときはその旨を明示しなければならない。","m":"古家は必ず明示"},{"f":"税他","t":"景品表示法","ref":"R06-47-4","s":"宅地建物取引業者が建物の売買の広告を行う場合において、当該建物が建築工事完了後1年以上経過していても、一度も居住の用に供されたことがないものであれば、「新築」と表示することができる。","a":0,"e":"新築は建築工事完了後1年未満で、かつ居住の用に供されたことがないもの。","m":"新築は1年未満未使用"},{"f":"税他","t":"景品表示法","ref":"R07-47-3","s":"宅地建物取引業者が物件の広告を行う場合において、新設予定の鉄道の駅については、当該路線の運行主体が公表したものに限り、その新設予定時期を明示して表示することができる。","a":1,"e":"運行主体が公表したものに限り、新設予定時期を明示して表示できる。","m":"新駅は公表分のみ"},{"f":"税他","t":"景品表示法","ref":"R02s-47-2","s":"宅地建物取引業者が物件の広告を行う場合において、取引態様については、「売主」、「貸主」、「代理」又は「媒介（仲介）」の別をこれらの用語を用いて表示しなければならない。","a":1,"e":"取引態様はこれらの用語で明示する。「直販」等は不可。","m":"態様は4用語"},{"f":"税他","t":"土地・建物","ref":"R05-49-2","s":"谷底低地に軟弱層が厚く堆積している所では、地震の際に軟弱層によって地震動が吸収されるため、周辺の台地に比べて地震動が小さくなり、被害も小さくなる傾向がある。","a":0,"e":"軟弱層が厚い所では地震動が増幅され揺れが大きくなる。","m":"軟弱層は揺れ増幅"},{"f":"税他","t":"土地・建物","ref":"R05-49-1","s":"河川の両側に形成される自然堤防の後背湿地側の縁は、砂が緩く堆積していて地下水位も浅いため、地震の際に液状化被害が生じやすい地盤である。","a":1,"e":"砂が緩く堆積し地下水位が浅いため液状化しやすい。","m":"後背湿地側は液状化"},{"f":"税他","t":"土地・建物","ref":"R04-49-2","s":"河川の下流部や海岸沿いに広がる低地は、一般に地盤が安定しており洪水や地震などの自然災害に対して強いことから、防災的見地から住宅地として好ましい土地であるといえる。","a":0,"e":"低地は軟弱地盤が多く、洪水・地震・津波等の災害リスクが高い。","m":"低地は災害に弱い"},{"f":"税他","t":"土地・建物","ref":"R04-49-1","s":"台地は一般に水はけが良く住宅地として適しているが、台地上の浅い谷は、豪雨時には周囲から水が集まり、一時的に浸水することがあるので注意を要する。","a":1,"e":"台地上でも浅い谷には水が集まり浸水することがある。","m":"台地の谷は浸水注意"},{"f":"税他","t":"土地・建物","ref":"R01-49-3","s":"台地・段丘は、農地として利用されることが多く、都市的な土地利用も多いが、一般に水はけが悪く地盤も軟弱であることから、自然災害に対して安全度の低い所である。","a":0,"e":"台地・段丘は水はけが良く地盤も安定し、自然災害に対して安全度が高い。","m":"台地は安全度高い"},{"f":"税他","t":"土地・建物","ref":"R05-50-3","s":"鉄筋コンクリート構造において、鉄筋とコンクリートを一体化するためには、表面に突起のある異形棒鋼よりも、表面が平滑な丸鋼を用いる方が優れている。","a":0,"e":"表面に突起のある異形棒鋼の方が付着力が高く一体化に優れる。","m":"異形棒鋼が付着良"},{"f":"税他","t":"土地・建物","ref":"R04-50-4","s":"木造建築物の壁の構造において、柱を壁の中に隠す大壁ではなく柱を露出させる真壁のみで構成するのが洋風構造であり、大壁のみで構成するのが和風構造である。","a":0,"e":"真壁は和風、大壁は洋風。両者を併用する場合もある。","m":"真壁＝和、大壁＝洋"},{"f":"税他","t":"土地・建物","ref":"R06-50-3","s":"ブレース構造は、柱と梁で囲まれた部分に斜材（筋かい）を入れて地震力等による建築物の変形を抑える構造であり、ラーメン構造など他の構造と併用されることはない。","a":0,"e":"ブレース構造はラーメン構造等と併用されることがある。","m":"ブレースは併用可"},{"f":"税他","t":"土地・建物","ref":"R06-50-4","s":"建築物の構造のうち壁式構造は、板状の壁体と床版を一体として箱形の構造体を構成するものであり、原則として柱や梁を用いず、壁で荷重を支える構造である。","a":1,"e":"壁式構造は壁と床で箱形をつくり、柱・梁を用いない構造。","m":"壁式は柱梁なし"},{"f":"税他","t":"土地・建物","ref":"R02-50-3","s":"建築物の基礎のうち直接基礎の形式として、建物の底部全体を一枚の鉄筋コンクリートの版で支えるように設けるものを布基礎といい、地盤が比較的軟弱な場合などに用いられる。","a":0,"e":"底部全体に設けるのはべた基礎。布基礎は壁体等の下に連続して設ける。","m":"全体＝べた、壁下＝布"}];
const LESSON={"業法|免許":{"pts":["自ら当事者として売買・交換、または売買・交換・貸借の代理・媒介を業として行うには免許が必要。自ら貸主・転貸は宅建業に当たらない。","事務所が1つの都道府県内のみなら数に関係なく知事免許、2以上の都道府県に事務所を置くなら国土交通大臣免許。物件所在地は無関係。","免許の有効期間は5年。更新申請は満了日の90日前から30日前まで。満了日までに処分がなければ従前の免許は処分まで効力を有する。","免許権者は免許（更新を含む）に条件を付けられ、条件違反は任意的取消事由。免許は一身専属で、合併・相続によっても承継されない。","廃業等の届出は30日以内。死亡は相続人が死亡を知った日から、合併消滅は消滅法人の代表役員だった者がその日から届け出る。","破産・解散・廃止の届出は破産管財人・清算人・業者本人等。死亡・合併は事実発生時、それ以外は届出時に免許が失効する。","免許失効後も、一般承継人等は締結済み取引を結了する目的の範囲内で宅建業者とみなされる（76条）。"],"traps":["「他県の物件を扱うので大臣免許への免許換えが必要」と出たら×。区分は事務所の所在地だけで決まる。","「相続人は死亡の日から30日以内に届出」と出たら×。正しくは死亡を知った日から30日以内。","「合併後の会社が届出をすれば免許を承継できる」と出たら×。免許は承継されず、新たに免許を受ける必要がある。"],"rel":["業法|免許の基準","業法|監督・罰則","業法|宅建士"],"bridge":"免許は「誰が・どこで営業するか」の入口の手続、免許の基準は「免許を受けられない人」の中身。取消や失効後の処理は監督・罰則とつながる。"},"業法|免許の基準":{"pts":["拘禁刑以上の刑に処せられ、執行を終わり又は受けなくなった日から5年を経過しない者は欠格。罪の種類は問わない。","罰金刑が欠格となるのは宅建業法違反、傷害・暴行・脅迫等の暴力系の罪、背任罪などに限られ、執行終了等から5年間。","拘留・科料は欠格事由にならない。控訴・上告中で刑が確定していない間も「刑に処せられた」に当たらない。","執行猶予期間中は欠格だが、猶予期間を満了すれば刑の言渡しが効力を失い、5年を待たずに直ちに免許を受けられる。","不正手段による免許取得・業務停止事由で情状が特に重い・業務停止処分違反で免許を取り消された者は取消しの日から5年間欠格。","破産手続開始決定を受けて復権を得ない者、暴力団員等（脱退後5年を経過しない者を含む）、心身の故障で業務を適正に行えない者は欠格。","法人は役員（非常勤・相談役等を含む）や政令で定める使用人（支店長等）に欠格者がいれば免許を受けられない。専任宅建士は審査対象外。"],"traps":["「非常勤の取締役だから会社の免許に影響しない」と出たら×。非常勤でも役員として審査対象になる。","「執行猶予期間が満了しても、その日から5年を経過しないと免許を受けられない」と出たら×。満了で直ちに受けられる。","「所得税法違反の罰金で免許が取り消される」と出たら×。罰金で欠格となる罪は宅建業法違反・暴力系・背任等に限られる。"],"rel":["業法|免許","業法|宅建士","業法|監督・罰則"],"bridge":"宅建士の登録欠格もほぼ同じ構造だが、未成年者の扱いや事務禁止処分中の登録消除など宅建士特有の事由がある。該当すれば監督・罰則の必要的取消につながる。"},"業法|宅建士":{"pts":["登録は試験を行った都道府県知事に申請する。住所地や勤務地は関係なく、2年以上の実務経験か国土交通大臣の登録実務講習修了が必要。","登録の移転は他県の業者の事務所に従事する（予定）場合に「できる」任意の手続で、事務禁止処分期間中は申請できない。","氏名・住所・本籍、勤務先業者の商号・名称・免許証番号に変更があれば、専任かどうかを問わず遅滞なく変更の登録を申請する。","宅建士証の有効期間は5年。交付・更新の際は登録先知事が指定する講習（交付申請前6か月以内）を受講する。試験合格後1年以内の交付は講習免除。","宅建士証は取引関係者から請求があれば提示し、重要事項説明の際は請求がなくても提示する。住所欄へのシール貼付や旧姓併記が認められる。","事務禁止処分を受けたら速やかに交付知事へ宅建士証を提出し、効力を失ったら速やかに返納する。違反は10万円以下の過料。","営業に関し成年者と同一の行為能力を有しない未成年者は登録できないが、営業許可等で同一の行為能力があれば登録できる。"],"traps":["「他県の業者の専任宅建士になるには登録の移転をしなければならない」と出たら×。登録の移転は任意。","「専任でない宅建士は勤務先が変わっても変更の登録は不要」と出たら×。勤務先業者は登録事項で専任かを問わない。","「宅建士証の更新では国土交通大臣が指定する講習を受講」と出たら×。登録先の都道府県知事が指定する講習。"],"rel":["業法|免許の基準","業法|事務所・案内所","業法|重要事項説明"],"bridge":"登録欠格は免許の基準と似ているが別制度。宅建士の独占業務は35条の説明と35条・37条書面への記名で、専任宅建士の設置数は事務所・案内所の規制で決まる。"},"業法|営業保証金":{"pts":["主たる事務所1,000万円、従たる事務所1か所ごとに500万円を、全事務所分まとめて主たる事務所の最寄りの供託所に供託する。","金銭のほか有価証券も可。評価額は国債100%、地方債・政府保証債90%、その他の有価証券80%。","供託後、供託書の写しを添付して免許権者に届け出た後でなければ事業を開始できない。新設事務所分も供託・届出後に業務開始。","免許後3か月以内に届出がなければ免許権者は催告しなければならず、催告到達から1か月以内に届出がなければ免許を取り消せる。","主たる事務所移転で供託所が変わったとき、金銭のみなら保管替えを請求し、有価証券を含むなら新たに供託する（二重供託後に取戻し）。","還付を受けられるのは業者と宅建業の取引をした者で宅建業者を除く。還付で不足したら通知を受けた日から2週間以内に不足額を供託する。","取戻しには6か月以上の公告が必要（一部の事務所廃止も同じ）。保証協会加入時・保管替え時・取戻し事由発生から10年経過時は公告不要。"],"traps":["「国債は額面の90%、地方債は80%で評価」と出たら×。国債100%、地方債90%、その他80%。","「免許失効による取戻しの公告期間は3か月」と出たら×。還付請求権者への公告は6か月を下らない期間が必要。","「金銭のみで供託していても移転先の供託所に新たに供託し直す」と出たら×。金銭のみなら保管替えの請求。"],"rel":["業法|保証協会","業法|住宅瑕疵担保履行法","業法|免許"],"bridge":"保証協会は営業保証金に代わる制度で、分担金は60万・30万と小さく金銭のみ。還付の限度額は営業保証金相当額で同じだが、公告や期限の細部が異なる。"},"業法|保証協会":{"pts":["弁済業務保証金分担金は主たる事務所60万円、その他の事務所1か所につき30万円で、金銭のみ。加入しようとする日までに納付する。","加入後に事務所を新設したときは、その日から2週間以内に追加の分担金を納付する。怠ると社員の地位を失う。","保証協会は分担金の受領日から1週間以内に、同額の弁済業務保証金を法務大臣及び国土交通大臣が定める供託所に供託する。","還付の限度額は、その社員が社員でなければ供託すべき営業保証金相当額。社員となる前に取引した者（宅建業者を除く）も対象。","還付を受けるには保証協会の認証が必要で、認証事務は認証申出書の受理の順序に従って処理する。","還付後、保証協会は大臣の通知から2週間以内に還付額を供託し、社員は協会の通知から2週間以内に還付充当金を納付する。","社員の地位を失ったら1週間以内に営業保証金を供託する。分担金返還の公告（6か月以上）は社員の地位を失った場合のみで、一部事務所廃止なら不要。"],"traps":["「分担金を国債証券で納付できる」と出たら×。分担金は金銭のみ（協会が供託する弁済業務保証金は有価証券も可）。","「分担金は加入した日から1週間以内に納付」と出たら×。加入しようとする日までに納付する。","「納付した弁済業務保証金の額の範囲内で弁済を受けられる」と出たら×。限度は営業保証金相当額。"],"rel":["業法|営業保証金","業法|監督・罰則","業法|住宅瑕疵担保履行法"],"bridge":"営業保証金は業者自身が主たる事務所最寄りに供託、保証協会は協会が供託し業者は分担金を納める。期限は「2週間」と「1週間」が入り混じるので主体ごとに整理する。"},"業法|事務所・案内所":{"pts":["事務所とは本店・支店・継続的に業務を行い契約締結権限を持つ使用人を置く場所。本店は常に事務所、支店は宅建業を営む場合のみ。登記の有無は無関係。","事務所ごとに業務従事者5人に1人以上の成年の専任宅建士を置く。契約行為等を行う案内所等は1人以上。不足は2週間以内に補充等の措置。","事務所には標識・報酬額の掲示、帳簿・従業者名簿の備付けが必要。案内所等には標識のみ必要で、報酬額の掲示は不要。","帳簿は事業年度末に閉鎖し閉鎖後5年間（自ら売主の新築住宅は10年間）、従業者名簿は最終記載日から10年間保存する。電子保存も可。","契約行為等（申込み受付を含む）を行う案内所等は、業務開始の10日前までに免許権者と所在地の知事の双方に届け出る。","業者本人や法人の役員が宅建士であれば、主として業務に従事する事務所等で成年者である専任宅建士とみなされる（未成年でも可）。","全従業者に従業者証明書を携帯させなければならず、宅建士証で代用することはできない。取引関係者の請求があれば提示する。"],"traps":["「事務所に免許証を掲示しなければならない」と出たら×。掲示義務は標識と報酬額で、免許証はない。","「専任宅建士の不足は30日以内に補充すれば足りる」と出たら×。不足したら2週間以内に補充等の措置を執る。","「契約をしない案内所には標識不要」と出たら×。標識はすべての案内所等に必要、不要なのは専任宅建士と届出。"],"rel":["業法|宅建士","業法|クーリング・オフ","業法|免許"],"bridge":"専任宅建士を置く「契約行為等を行う案内所」は、クーリング・オフの「事務所等」と重なる。テント張りの案内所など土地に定着しない場所は事務所等に当たらない点も比較される。"},"業法|業務上の規制":{"pts":["勧誘に先立ち、業者の商号・名称、勧誘者の氏名、契約締結の勧誘目的である旨を告げなければならない。","相手方が契約を締結しない意思を示した後の再勧誘は禁止。担当者を替えても同じ。迷惑を覚える時間の電話・訪問も禁止。","手付の貸付け・分割受領・後払いなどの信用供与による契約誘引は禁止され、契約が成立しなくても誘引した時点で違反。","正当な理由なく判断に必要な時間を与えることを拒むこと、申込み撤回時に受領済みの預り金の返還を拒むことは禁止。","業者・従業者は正当な理由なく業務上知り得た秘密を漏らしてはならず、廃業後・退職後も続く。本人の承諾や裁判での証言は正当な理由。","宅建業法上の割賦販売は、引渡し後1年以上の期間にわたり2回以上に分割して代金を受領することを条件とする販売をいう。","宅地建物の売買及びその代理・媒介は犯罪収益移転防止法の特定取引で、取引時確認や記録の保存が必要。"],"traps":["「勧誘前に自分の氏名を告げれば商号は告げなくてよい」と出たら×。商号・氏名・目的のすべてを告げる。","「契約が成立しなかったので手付貸付けの申出は違反でない」と出たら×。誘引行為自体が違反。","「依頼者の承諾があっても秘密を漏らせない」と出たら×。本人の承諾は正当な理由に当たる。"],"rel":["業法|広告","業法|8種制限","業法|監督・罰則"],"bridge":"手付の貸付けは禁止だが手付の減額は信用供与に当たらず可。手付の額の上限や性質は8種制限で規律され、違反の重さは監督・罰則で問われる。"},"業法|広告":{"pts":["未完成物件は開発許可・建築確認等の処分があった後でなければ広告できない。この広告開始時期の制限は売買だけでなく貸借にも及ぶ。","契約締結時期の制限（処分前の売買・交換の契約禁止）は貸借には適用されない。広告と契約で範囲が異なる。","確認後に変更確認を申請中なら、変更予定である旨と当初の確認内容を併記すれば広告できる。確認申請中の表示では広告できない。","所在・規模・形質、利用の制限、環境・交通、代金・借賃、代金の融資等について、著しく事実に相違する表示や誤認させる表示は禁止。","誇大広告は広告した時点で違反で、取引成立や問合せの有無は問わない。成約済み物件の掲載継続もおとり広告として違反。","誇大広告等は監督処分の対象で、6か月以下の拘禁刑又は100万円以下の罰金（併科あり）が科され得る。","取引態様の別は広告のたびに明示し、注文を受けたときにも改めて遅滞なく明示する。自ら貸主の募集広告は業法の規制外。"],"traps":["「建築確認申請中と明示すれば広告できる」と出たら×。確認を受けるまで広告できない。","「確認前でも貸借の媒介の広告はできる」と出たら×。広告開始時期の制限は貸借にも及ぶ。","「問合せや申込みがなければ誇大広告でも違反でない」と出たら×。広告をした時点で違反が成立する。"],"rel":["税他|景品表示法","業法|報酬","業法|監督・罰則"],"bridge":"広告の表示ルールは景品表示法・公正競争規約でも細かく規制される。依頼者の依頼による広告料金は報酬とは別に受領できる点は報酬の論点で問われる。"},"業法|媒介契約":{"pts":["34条の2の規制は宅地建物の売買・交換の媒介・代理に適用され、貸借の媒介には適用されない。相手が宅建業者でも書面交付は必要。","契約後遅滞なく業者が記名押印した書面を交付する（依頼者の承諾で電磁的方法も可）。宅建士の記名は不要。","専任・専属専任の有効期間は3か月以内で、超える定めは3か月に短縮。更新は依頼者の申出による場合のみで、自動更新特約は無効。","業務処理状況の報告は専任が2週間に1回以上、専属専任が1週間に1回以上（休業日を含む）。方法は口頭でもよい。","指定流通機構への登録は専任が契約日から7日以内、専属専任が5日以内（いずれも休業日を除く）。登録証明書は遅滞なく依頼者に引き渡す。","申込みがあれば種類を問わず遅滞なく依頼者に報告する。価額に意見を述べるときは根拠を示す（方法自由・費用請求不可）。","書面には売買すべき価額、既存建物の建物状況調査を実施する者のあっせんに関する事項（あっせん無しでもその旨）等を記載する。"],"traps":["「専任媒介の登録期限は休業日を含めて7日以内」と出たら×。休業日を除いて7日以内。","「一般媒介なら書面に売買すべき価額の記載は不要」と出たら×。価額は全媒介契約の必要的記載事項。","「依頼者の申出がなければ自動更新する特約は有効」と出たら×。更新は依頼者の申出がある場合に限る。"],"rel":["業法|報酬","業法|重要事項説明","業法|37条書面"],"bridge":"媒介契約書は業者の記名押印で依頼者（売主側が多い）に交付、35条書面と37条書面は宅建士の記名が必要。誰が何に記名し誰に交付するかで混同しやすい。"},"業法|重要事項説明":{"pts":["契約成立までに、宅建士が宅建士証を提示（請求不要）のうえ記名した35条書面を交付して、買主・借主等に説明する。売主・貸主への説明は不要。","相手方が宅建業者なら書面交付のみで説明は不要。相手方の承諾があれば電磁的方法での提供やIT重説も可だが、宅建士証の提示は省略できない。","既存建物では1年以内（共同住宅等は2年以内）の建物状況調査の有無と結果の概要を、売買・貸借とも説明する。","建築・維持保全の書類（検査済証・設計図書等）の保存状況は既存建物の売買・交換のみ説明。存在しなければその旨を説明する。","水害ハザードマップ上の所在地、造成宅地防災区域・土砂災害警戒区域・津波災害警戒区域内である旨は、売買・貸借を問わず説明する。","石綿調査の記録があればその内容、旧耐震（昭和56年5月31日以前着工）の耐震診断があればその内容を説明。業者に調査義務はない。","登記された権利（抹消予定でも）、代金以外の金銭の額と目的、契約解除、損害賠償予定・違約金、手付金等保全措置、担保責任の履行確保措置等を説明。"],"traps":["「代金の額・支払時期」「引渡しの時期」を重要事項として説明と出たら×。これらは37条書面の記載事項。","「IT重説なら相手方の承諾で宅建士証の提示を省略できる」と出たら×。画面上で視認できるよう提示が必要。","「水害ハザードマップの説明は貸借では不要」と出たら×。売買・交換・貸借いずれも必要。"],"rel":["業法|37条書面","業法|宅建士","業法|住宅瑕疵担保履行法"],"bridge":"35条は契約前に買主・借主へ説明（宅建士必須）、37条は契約後に両当事者へ交付（説明不要）。記載事項の振り分けが頻出で、引渡し時期・代金は37条側。"},"業法|37条書面":{"pts":["契約成立後遅滞なく、契約当事者双方（自ら当事者なら相手方）に交付する。関与した業者全員に交付義務があり、相手方の承諾でも省略不可。","宅建士の記名が必要（専任でなくてよい、押印は不要）。説明義務はなく、交付は宅建士でない従業者でもよい。","相手方が宅建業者でも交付・宅建士の記名・必要的記載事項は省略できない。相手方の承諾があれば電磁的方法での提供も可。","必要的記載事項は当事者の氏名・住所、物件特定表示、代金・借賃の額と支払時期・方法、引渡し時期、売買では移転登記の申請時期など。","既存建物の売買・交換では、構造耐力上主要な部分等の状況について当事者双方が確認した事項が必要的記載事項（貸借は不要）。","任意的記載事項（解除、損害賠償予定・違約金、代金等以外の金銭、危険負担、担保責任特約、租税公課の負担等）は定めがあれば記載。","代金等以外の金銭は額・授受の時期・目的のすべてを記載する。未完成建物は重説で使用した図書の交付で特定表示に代えられる。"],"traps":["「37条書面は宅建士に内容を説明させなければならない」と出たら×。記名は必要だが説明義務はない。","「定めがなければ『定めなし』と記載する」と出たら×。任意的記載事項は定めがなければ記載不要。","「登記された抵当権の内容を37条書面に記載」と出たら×。登記された権利は35条書面の説明事項。"],"rel":["業法|重要事項説明","業法|媒介契約","業法|クーリング・オフ"],"bridge":"35条は契約前に説明、37条は契約後に交付で説明不要。クーリング・オフの告知書面は宅建士の記名不要で、書面ごとに記名の主体と要否を比較して覚える。"},"業法|クーリング・オフ":{"pts":["宅建業者が自ら売主、買主が宅建業者でない売買で、事務所等以外の場所で申込み・契約をした場合に適用される。申込み場所で判断する。","事務所等には、事務所、契約行為等を行う土地に定着した案内所、媒介・代理業者の事務所等、買主が自ら申し出た自宅・勤務先が含まれる。","業者から書面で告げられた日から起算して8日を経過するか、引渡しを受け、かつ代金全部を支払ったときはできなくなる。","告知・撤回等は書面で行い、電磁的方法は不可。撤回等の効力は書面を発した時に生じる（発信主義）。告知書面に宅建士の記名は不要。","業者は損害賠償・違約金を請求できず、受領した手付金その他の金銭を速やかに全額返還する。","クーリング・オフの規定に反する買主に不利な特約は無効。期間を8日より長くするなど買主に有利な特約は有効。","テント張りなど土地に定着しない案内所や喫茶店・ホテルのロビー、業者の申出による買主の自宅・勤務先は事務所等に当たらない。"],"traps":["「買主の承諾があれば告知・撤回を電磁的方法で行える」と出たら×。書面に限られる。","「解除の効力は書面が業者に到達した時に生じる」と出たら×。書面を発した時に生じる。","「引渡しを受けたらクーリング・オフできない」と出たら×。引渡し＋代金全額支払の両方が必要。"],"rel":["業法|8種制限","業法|事務所・案内所","業法|37条書面"],"bridge":"クーリング・オフは8種制限の一つで、業者が売主・買主が非業者の取引に限られる。「事務所等」の範囲は専任宅建士を置く案内所の規制とセットで覚える。"},"業法|8種制限":{"pts":["8種制限は宅建業者が自ら売主、買主が宅建業者でない場合のみ適用。業者間取引には適用されない。","損害賠償額の予定と違約金は合算して代金の2/10以内。超える部分は無効。予定がなければ実損額を請求できる。","手付は代金の2/10以内で、常に解約手付となる。相手方の履行着手前なら、買主は放棄、売主業者は倍額の現実の提供で解除できる。","担保責任の通知期間を「引渡しから2年以上」とする特約以外で民法より買主に不利な特約は無効。無効なら民法の原則（知った時から1年）に戻る。","手付金等保全措置は未完成物件で代金の5%超又は1,000万円超、完成物件で10%超又は1,000万円超のとき、受領前に講じる。","未完成物件の保全措置は保証委託契約か保証保険契約のみ、完成物件はこれに指定保管機関の手付金等寄託契約が加わる。講じなければ買主は支払拒否できる。","他人物・未完成物件の売買は原則禁止（停止条件付取得契約は不可）。割賦販売の解除は30日以上の書面催告が必要、代金の3/10超受領後は所有権留保不可。"],"traps":["「担保責任を引渡しから1年とする特約は有効」と出たら×。2年以上でなければ無効。","「売主業者は手付と同額を返還すれば解除できる」と出たら×。倍額を現実に提供する必要がある。","「業者間取引でも損害賠償予定は2割まで」と出たら×。8種制限は業者間には適用されない。"],"rel":["業法|クーリング・オフ","権利|売買・契約不適合","業法|住宅瑕疵担保履行法"],"bridge":"8種制限は民法の売買・契約不適合の原則を買主有利に修正するもの。新築住宅の構造部分の10年責任は品確法・履行法の資力確保措置とセットで出る。"},"業法|報酬":{"pts":["売買の媒介の上限は、代金（税抜）200万円以下5%、200万円超400万円以下4%、400万円超3%。400万円超は「3%＋6万円」で計算し消費税を加える。","代理は媒介の2倍以内。同一取引で双方から受領する場合も合計で媒介報酬の2倍以内に収める。","代金800万円以下の宅地建物（低廉な空家等）の売買・交換の媒介は、事前に依頼者と合意すれば売主・買主それぞれから30万円（＋税）まで受領できる（2024年改正）。代理はその2倍以内。","貸借の媒介は双方合計で借賃1か月分（＋税）以内。居住用建物は承諾がない限り依頼者の一方から0.5か月分（＋税）まで。","長期の空家等（1年超不使用等）の貸借の媒介は、事前合意により貸主・借主合計で借賃2か月分（＋税）まで受領できる特例があるが、居住用の借主からは通常どおり0.5か月分（＋税）が上限。","居住用以外の建物の貸借で権利金の授受があれば、権利金を売買代金とみなして計算できる。居住用建物には適用されない。","報酬とは別に受領できるのは、依頼者の依頼による広告料金と、依頼者の特別の依頼による費用で事前に承諾を得たものだけ。"],"traps":["「双方の承諾があれば居住用貸借で合計1か月分超を受領できる」と出たら×。合計1か月分（＋税）が上限（長期の空家等の特例を除く）。","「低廉な空家等の特例は売主からの報酬のみ」と出たら×。2024年改正で買主からの媒介報酬にも適用される。","「契約書作成費用を報酬とは別に受領できる」と出たら×。通常業務の費用は報酬に含まれる。"],"rel":["業法|媒介契約","業法|広告","業法|監督・罰則"],"bridge":"報酬は媒介契約に基づく成功報酬で、上限超過は業務停止処分や罰則の対象。依頼者の依頼による広告料金のみ別途受領できる点が広告の論点と交差する。"},"業法|監督・罰則":{"pts":["必要的取消は欠格事由該当、不正手段による免許取得、業務停止事由で情状が特に重い、業務停止処分違反、免許後1年以内の事業不開始・1年以上休止など。","免許の条件違反、事務所の所在地等を確知できず公告から30日を経過しても申出がない場合は任意的取消。","指示・業務停止は免許権者のほか業務地の知事もできるが、免許取消は免許権者だけができる。業務停止は1年以内の期間。","監督処分の前には聴聞が必要で、審理は公開で行う。業務停止と免許取消は公告が必要、指示処分は公告不要。","国土交通大臣が消費者保護に関わる規定違反で大臣免許業者を処分する場合は、あらかじめ内閣総理大臣に協議する。","無免許営業・名義貸し・不正免許取得・業務停止違反は3年以下の拘禁刑か300万円以下の罰金（併科あり）、法人は1億円以下の罰金。","重要な事項の不告知・不実告知は2年以下の拘禁刑等、誇大広告は6か月以下の拘禁刑等。報酬額不掲示・標識不掲示は50万円以下の罰金。"],"traps":["「免許の条件違反は必ず取り消さなければならない」と出たら×。取り消すことが「できる」任意的取消。","「業務停止処分をしたときは公告不要」と出たら×。業務停止・免許取消は公告が必要で、不要なのは指示処分だけ。","「知事が大臣免許業者を処分するとき内閣総理大臣と協議」と出たら×。協議が必要なのは国土交通大臣が処分する場合。"],"rel":["業法|免許の基準","業法|免許","業法|宅建士"],"bridge":"必要的取消の多くは免許の基準（欠格事由）と表裏一体。宅建士に対する監督（指示・事務禁止・登録消除）も同じ構造なので並べて覚える。"},"業法|住宅瑕疵担保履行法":{"pts":["宅建業者が自ら売主となり、宅建業者でない買主に新築住宅を引き渡す場合に、保証金の供託か保険契約締結による資力確保措置が必要。","対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵。これらの免責特約は品確法上無効で、資力確保義務は残る。","保証金は主たる事務所の最寄りの供託所に供託。販売戸数の算定では床面積55㎡以下の住宅は2戸をもって1戸と数える。","保険契約は国土交通大臣指定の保険法人と締結し、引渡しから10年以上有効でなければならない。買主の承諾があっても短縮できない。","基準日（毎年3月31日）ごとに、基準日から3週間以内に資力確保措置の状況を免許権者に届け出る。","届出をしないと、基準日の翌日から起算して50日を経過した日以後、新たに自ら売主となる新築住宅の売買契約を締結できない。","供託する場合は契約締結までに供託所の所在地等を書面（承諾があれば電磁的方法）で説明する。保険付き住宅は指定住宅紛争処理機関を利用できる。"],"traps":["「買主が宅建業者でも資力確保措置が必要」と出たら×。資力確保措置は買主が宅建業者でない場合に限られる。","「保証金は販売した新築住宅の所在地の最寄りの供託所に供託」と出たら×。主たる事務所の最寄りの供託所。","「床面積25㎡以下は3戸を1戸と数える」と出たら×。55㎡以下は2戸をもって1戸。"],"rel":["業法|8種制限","業法|営業保証金","業法|重要事項説明"],"bridge":"8種制限の担保責任特約制限が「特約の効力」の問題なのに対し、履行法は責任を確実に果たすための「お金の手当て」。供託先が主たる事務所最寄りという点は営業保証金と共通。"},"権利|意思表示・行為能力":{"pts":["通謀虚偽表示は当事者間で無効。ただし無効を善意の第三者に対抗できず、第三者は無過失や登記を要しない（94条2項）。","錯誤は無効でなく取消し。重要な錯誤が要件で、動機の錯誤はその事情が法律行為の基礎とされていると表示されていた場合に限る。","表意者に重過失があると錯誤取消しはできない。ただし相手方が悪意・重過失のとき又は共通錯誤のときは取り消せる。","詐欺取消しは善意無過失の第三者に対抗できない。第三者詐欺は相手方が詐欺を知り又は知ることができたときに限り取り消せる。","強迫による取消しは、第三者が善意無過失でも対抗できる。第三者による強迫でも相手方の善意・悪意を問わず取り消せる。","成年は18歳。未成年者の行為は法定代理人の同意が必要だが、単に権利を得・義務を免れる行為や許可された営業は単独でできる。","成年被後見人の行為は後見人の同意があっても取り消せる（日用品の購入等を除く）。制限行為能力者が詐術を用いたときは取消し不可。"],"traps":["「錯誤による意思表示は無効」と出たら×。2020年改正後は取消しで、善意無過失の第三者には対抗できない。","「虚偽表示の第三者は善意無過失でなければ保護されない」と出たら×。94条2項は善意で足り、登記も不要。","「強迫の取消しは善意無過失の第三者に対抗できない」と出たら×。保護されないのは詐欺の場合で、強迫は対抗できる。"],"rel":["権利|代理","権利|物権変動・対抗"],"bridge":"代理では意思表示の瑕疵を原則として代理人について判断する。取消し前の第三者は意思表示の規定で、取消し後の第三者は登記の先後（177条）で処理する。"},"権利|代理":{"pts":["代理人は行為能力者であることを要しない。制限行為能力者が代理人としてした行為は、行為能力の制限を理由に取り消せない。","自己契約・双方代理は無権代理とみなす。ただし債務の履行と本人があらかじめ許諾した行為は有効（108条）。","代理権濫用は、相手方が代理人の目的を知り又は知ることができたとき無権代理とみなす（107条）。","任意代理人は本人の許諾又はやむを得ない事由があるときのみ復代理人を選任可。法定代理人は自己の責任でいつでも選任できる。","代理権は本人の死亡、代理人の死亡・破産手続開始・後見開始で消滅する。任意代理では本人の破産手続開始でも消滅する。","無権代理の追認は契約時にさかのぼって効力を生ずる。相手方は催告でき、本人が期間内に確答しなければ追認拒絶とみなす。","表見代理（代理権授与表示・権限外・代理権消滅後）は相手方の善意無過失が必要。無権代理人の責任は相手方が選択できる。"],"traps":["「双方代理は本人の許諾があっても無効」と出たら×。あらかじめ許諾した行為や債務の履行は有効となる。","「無権代理の追認は追認の時から効力を生ずる」と出たら×。別段の意思表示がない限り契約時にさかのぼる。","「善意の相手方は表見代理を主張できる」と出たら要注意。表見代理は善意だけでなく無過失も必要で、過失があれば不成立。"],"rel":["権利|意思表示・行為能力","権利|相続"],"bridge":"代理行為の瑕疵は代理人を基準に判断し、意思表示の規定がそのまま使われる。無権代理と相続では、本人が相続すれば追認拒絶でき、無権代理人が単独相続すれば追認拒絶できない。"},"権利|時効":{"pts":["所有権の取得時効は、所有の意思をもって平穏・公然に占有し、占有開始時に善意無過失なら10年、それ以外は20年で完成する。","所有の意思は占有取得の原因（権原）で客観的に決まる。賃借人は何年占有しても原則として所有権を時効取得できない。","前の占有者の占有を併合でき、その場合は瑕疵も承継する。善意無過失は最初の占有者の占有開始時で判断する。","債権は、権利行使できることを知った時から5年、行使できる時から10年で時効消滅する。生命・身体侵害の損害賠償は後者が20年。","裁判上の請求は終了まで完成猶予、確定判決等で権利が確定すれば更新。確定せず終了したときは終了から6か月完成猶予にとどまる。","催告は6か月間の完成猶予のみで、猶予中の再度の催告に効力はない。承認は更新事由で、処分の行為能力・権限は不要。","時効は当事者（保証人・物上保証人・第三取得者等）が援用して初めて確定する。時効の利益は完成前に放棄できない。"],"traps":["「後順位抵当権者は先順位の被担保債権の消滅時効を援用できる」と出たら×。順位上昇は反射的利益で援用権者でない。","「時効完成を知らずに承認した債務者は時効を援用できる」と出たら×。判例は信義則上援用できないとする。","「途中で他人の物と知った占有者は所有の意思を失う」と出たら×。善意・悪意は占有開始時で判断し、所有の意思は失わない。"],"rel":["権利|物権変動・対抗","権利|保証・連帯債務"],"bridge":"時効取得者は時効完成前の第三者には登記なく対抗でき、完成後の第三者とは対抗関係になる。保証人は主債務の時効を援用でき、主債務者の時効利益放棄の効果は保証人に及ばない。"},"権利|物権変動・対抗":{"pts":["不動産物権の得喪変更は、登記がなければ第三者に対抗できない（177条）。二重譲渡の優劣は契約の先後でなく登記の先後で決まる。","177条の第三者は登記の欠缺を主張する正当な利益を有する者。不法占拠者・無権利者・背信的悪意者には登記なく対抗できる。","単なる悪意者は第三者に当たる。背信的悪意者からの転得者も、自身が背信的悪意者でなければ177条の第三者として保護される。","取消し前の第三者は意思表示の規定で処理し、取消し後の第三者とは登記の先後で決まる。解除後の第三者も登記の先後。","解除前の第三者は、善意・悪意を問わず権利保護要件として登記を備えれば保護される（545条1項ただし書）。","時効取得者は完成前の第三者には登記不要、完成後の第三者とは登記の先後。相続人が法定相続分を超える部分は登記なく対抗できない。","共同相続人の1人が勝手に単独名義で登記し譲渡しても、他の相続人の持分について譲受人は権利を取得できない（登記に公信力なし）。"],"traps":["「先に売買契約をした買主は登記がなくても後の買主に優先する」と出たら×。優劣は登記の先後で決まる。","「悪意の第二買主には登記なく対抗できる」と出たら×。単なる悪意者は177条の第三者で、対抗できないのは背信的悪意者のみ。","「解除前の第三者は善意であれば登記なしで保護される」と出たら×。善意悪意不問だが、登記は必要。"],"rel":["権利|不動産登記法","権利|意思表示・行為能力","権利|時効"],"bridge":"177条は「登記がなければ対抗できない」という実体法のルールで、不動産登記法はその登記の申請手続を定める。取消し・解除・時効・相続の各場面で、第三者が出現した時期により処理が変わる。"},"権利|共有・相隣":{"pts":["保存行為は各共有者が単独ででき、管理行為（軽微な変更、土地5年・建物3年以内の賃貸借等を含む）は持分の価格の過半数で決する。","形状又は効用の著しい変更を伴う変更には共有者全員の同意が必要。所在等不明共有者がいれば裁判所の決定で残りの共有者で決められる。","各共有者は共有物の全部を持分に応じて使用できる。共有者の1人が単独占有していても、他の共有者は当然には明渡請求できない。","共有者が持分を放棄し又は相続人なく死亡したとき、その持分は他の共有者に帰属する。分割禁止特約は5年以内（更新可）。","隣地使用権は一定目的のため必要な範囲で認められるが、住家への立入りは居住者の承諾が必要。原則あらかじめ通知する。","越境した竹木の根は自ら切り取れる。枝は所有者に切除させるのが原則だが、催告後相当期間内に切除しない等の場合は自ら切り取れる。","他の土地に囲まれ公道に通じない土地の所有者は囲繞地を通行できる。分割・一部譲渡で生じた袋地は他の分割者の土地のみ無償で通行できる。"],"traps":["「共有物の変更はすべて共有者全員の同意が必要」と出たら×。形状・効用の著しい変更を伴わない軽微な変更は持分の過半数で足りる。","「隣地の枝はいかなる場合も自ら切り取れない」と出たら×。催告後相当期間内に切除されない、所有者不明、急迫の事情の場合は可。","「持分を放棄した共有者の持分は国庫に帰属する」と出たら×。他の共有者に帰属する（255条）。"],"rel":["権利|区分所有法","権利|相続"],"bridge":"区分所有建物の共用部分にも共有の考え方があるが、変更・管理の決議は区分所有法の集会決議で行う。遺産共有も共有の一種で、相続開始から10年経過後は共有物分割手続でも分割できる場合がある。"},"権利|抵当権・担保":{"pts":["抵当権は付加一体物に及び、設定当時の従物（判例）や建物抵当権では借地権にも及ぶ。果実には債務不履行後に及ぶ。","物上代位は売却代金・賃料・保険金など目的物の価値代替物に及び、払渡し・引渡し前に差押えが必要。","利息その他の定期金は、満期となった最後の2年分についてのみ抵当権を行使できる。後順位者等がいなければ制限されない。","法定地上権は、設定時に土地上に建物があり、土地と建物が同一所有者で、競売により別々の所有者となった場合に成立する。","抵当権者に対抗できない建物賃借人は、買受人の買受けの時から6か月間明渡しが猶予される。土地の賃借人には適用されない。","抵当権消滅請求は第三取得者が競売開始決定の効力発生前にでき、主たる債務者・保証人やその承継人はできない。","根抵当権は極度額の範囲で担保し、元本確定前の被担保債権の範囲変更・債務者変更に後順位抵当権者等の承諾は不要。"],"traps":["「更地に抵当権設定後に建てた建物にも法定地上権が成立する」と出たら×。設定時に建物が存在することが要件。","「一括競売をした抵当権者は建物の代価からも優先弁済を受けられる」と出たら×。一括競売は任意で、優先弁済は土地の代価のみ。","「物上代位は差押えなしに保険金に及ぶ」と出たら×。払渡し・引渡し前に抵当権者自らが差し押さえる必要がある。"],"rel":["権利|借地","権利|賃貸借","権利|保証・連帯債務"],"bridge":"建物の抵当権は従たる権利である借地権に及び、抵当権登記後の賃借人は買受人に対抗できない。保証人は債務者の財産から回収する人的担保、抵当権は物から優先弁済を受ける物的担保である。"},"権利|債務不履行・解除":{"pts":["履行遅滞の時期は、確定期限は期限到来時、不確定期限は到来後に請求を受けた時か到来を知った時の早い方、期限なしは請求時。","損害賠償には債務者の帰責事由が必要。履行遅滞中に当事者双方の責めに帰さない不能が生じたときは債務者の帰責事由とみなす。","原始的不能でも契約は無効とならず、債務不履行による損害賠償を請求できる（412条の2第2項）。","金銭債務は不可抗力をもって抗弁とできず、損害の証明も不要。損害賠償額は約定利率がなければ法定利率による（変動制）。","解除に債務者の帰責事由は不要。ただし不履行が債権者の帰責事由によるときは解除できない（543条）。","催告解除は相当期間を定めて催告し、期間経過時の不履行が軽微なときは解除できない（541条ただし書）。","全部の履行不能・明確な履行拒絶、定期行為の期間経過などは無催告で解除できる（542条）。解除しても損害賠償請求は可能。"],"traps":["「解除には債務者の責めに帰すべき事由が必要」と出たら×。2020年改正で不要となった。損害賠償との違いに注意。","「不確定期限の債務は期限到来の時から遅滞となる」と出たら×。請求を受けた時か到来を知った時のいずれか早い時から。","「原始的不能の契約は無効」と出たら×。契約は有効で、履行に代わる損害賠償を請求できる。"],"rel":["権利|売買・契約不適合","権利|物権変動・対抗"],"bridge":"契約不適合責任の解除・損害賠償は債務不履行の一般規定（541・542条、415条）によるため要件は共通。解除前・解除後の第三者の扱いは物権変動・対抗の論点となる。"},"権利|売買・契約不適合":{"pts":["引き渡された目的物が種類・品質・数量に関して契約に適合しないとき、買主は追完（修補・代替物・不足分の引渡し）を請求できる。","代金減額請求は原則として相当期間を定めた追完の催告が必要。追完不能・明確な追完拒絶などの場合は無催告で減額請求できる。","契約不適合を理由に、債務不履行の一般規定により損害賠償請求（売主の帰責事由が必要）と解除（帰責事由不要）ができる。","不適合が買主の帰責事由によるときは、追完・代金減額・解除のいずれも請求できない。","種類・品質の不適合は、買主が知った時から1年以内に通知しなければ権利を失う。売主が悪意・重過失なら制限なし。数量・権利は対象外。","担保責任を負わない特約も有効だが、売主が知りながら告げなかった事実や自ら設定・譲渡した権利は免責されない（572条）。","手付は解約手付と推定され、相手方が履行に着手するまで、買主は手付を放棄、売主は倍額を現実に提供して解除できる。"],"traps":["「1年以内に請求しなければならない」と出たら×。知った時から1年以内の「通知」で足り、数量不足には適用されない。","「契約目的を達成できなければ解除できない」と出たら×。催告解除は不適合が軽微でなければ可能。目的達成不能は無催告解除の要件。","「売主は自分が履行に着手していれば手付解除できない」と出たら×。基準は相手方の履行着手で、自ら着手していても解除可。"],"rel":["権利|債務不履行・解除","業法|8種制限","権利|不法行為・請負・委任"],"bridge":"民法では担保責任の免責特約も有効だが、宅建業者が自ら売主の8種制限では引渡しから2年以上とする通知期間特約を除き買主に不利な特約は無効。請負の不適合責任も売買の規定を準用する。"},"権利|保証・連帯債務":{"pts":["保証契約は書面（電磁的記録を含む）でしなければ効力を生じない。保証債務は主たる債務に付従する。","保証債務は元本・利息・違約金・損害賠償等に及ぶ。契約後に主債務の目的・態様が加重されても保証人の負担は加重されない。","通常の保証人には催告の抗弁権・検索の抗弁権があるが、連帯保証人にはない。連帯保証人には分別の利益もない。","個人根保証契約は極度額を定めなければ無効。事業用貸金等の個人保証は原則、契約前1か月以内の公正証書による意思表示が必要。","連帯債務で他の債務者に効力が及ぶ（絶対効）のは弁済・更改・相殺・混同。請求・免除・時効完成は原則として相対効。","他の連帯債務者が反対債権を有するときは、その者の負担部分の限度で履行を拒めるのみで、代わりに相殺はできない。","弁済した連帯債務者は、弁済額が自己の負担部分を超えなくても、各自の負担部分の割合に応じて求償できる（442条）。"],"traps":["「連帯債務者の1人への履行の請求は他の債務者にも効力を生ずる」と出たら×。2020年改正で請求は相対効となった。","「口頭の合意だけで保証契約が成立する」と出たら×。保証契約は書面又は電磁的記録でしなければ効力を生じない。","「連帯保証人は催告の抗弁権を有する」と出たら×。連帯保証人は催告・検索の抗弁権をいずれも有しない。"],"rel":["権利|抵当権・担保","権利|時効"],"bridge":"保証は人的担保、抵当権は物的担保で、保証人も物上保証人も弁済すれば求償できる。主債務の時効は保証人が援用でき、主債務者の承認による更新は保証人にも及ぶ（付従性）。"},"権利|不法行為・請負・委任":{"pts":["不法行為の損害賠償請求権は、損害及び加害者を知った時から3年（生命・身体侵害は5年）、不法行為の時から20年で時効消滅する。","使用者は事業の執行についての被用者の加害行為に責任を負う。使用者から被用者への求償、被用者から使用者への逆求償も相当額で認められる。","工作物責任は占有者が第一次的に負い、占有者が損害発生防止に必要な注意をしたときは所有者が無過失責任を負う。","請負人の契約不適合責任は、注文者が不適合を知った時から1年以内に通知が必要。注文者の材料・指図による不適合は原則責任なし。","注文者は仕事完成前ならいつでも損害を賠償して解除できる。完成前に解除等されても、注文者が受ける利益の割合に応じて報酬請求できる。","受任者は有償・無償を問わず善管注意義務を負う。報酬は特約がなければ請求できず、委任事務の中途終了なら履行割合に応じ請求できる。","委任は各当事者がいつでも解除できる。相手方に不利な時期の解除等は損害賠償が必要。委任者・受任者の死亡・破産で終了する。"],"traps":["「無償の受任者は自己の財産と同一の注意で足りる」と出たら×。委任は無償でも善管注意義務。自己の財産と同一の注意は無償寄託。","「工作物の所有者は過失がなければ責任を負わない」と出たら×。所有者の工作物責任は無過失責任。","「請負の不適合は引渡し時から1年以内に通知」と出たら×。起算点は注文者が不適合を知った時。"],"rel":["権利|売買・契約不適合","権利|時効"],"bridge":"請負の契約不適合責任は売買の規定を準用し、追完・減額・解除・損害賠償の枠組みは共通。不法行為の時効は一般の債権（5年・10年）と期間・起算点が異なる。"},"権利|賃貸借":{"pts":["民法上の賃貸借の存続期間は最長50年。借地借家法が適用される建物所有目的の土地賃貸借・建物賃貸借には別の規律がある。","賃貸人は修繕義務を負う（賃借人の帰責事由による場合を除く）。通知後相当期間修繕しない場合や急迫の事情では賃借人が修繕できる。","必要費は直ちに償還請求でき、有益費は賃貸借終了時に価格の増加が現存する場合に、支出額か増加額を賃貸人が選択して償還する。","無断譲渡・転貸は解除事由だが、背信的行為と認めるに足りない特段の事情があれば解除できない（判例）。","適法な転借人は賃貸人に直接義務を負う。合意解除は転借人に対抗できないが、債務不履行解除権があったときは対抗できる。","敷金は明渡し時に未払債務を控除して返還する。明渡しが先履行で、賃借人から敷金を未払賃料に充当するよう請求はできない。","賃借人は通常損耗・経年変化を除き原状回復義務を負う。対抗要件ある賃貸不動産の譲渡で賃貸人の地位は譲受人に移転する。"],"traps":["「賃借人は敷金を未払賃料に充てるよう請求できる」と出たら×。充当できるのは賃貸人のみ。","「無断転貸があれば賃貸人は常に解除できる」と出たら×。背信的行為と認めるに足りない特段の事情があれば解除できない。","「通常損耗も原状回復の対象」と出たら×。通常の使用収益で生じた損耗・経年変化は原状回復義務の対象外。"],"rel":["権利|借家","権利|借地","権利|物権変動・対抗"],"bridge":"建物賃貸借や建物所有目的の土地賃貸借には借地借家法が優先し、民法の規定は補充的に適用される。譲受人が賃貸人の地位を賃借人に主張するには所有権移転登記が必要。"},"権利|借地":{"pts":["借地権は建物所有目的の地上権又は土地賃借権。存続期間は30年以上で、定めがなければ30年。短い定めも30年となる。","合意更新の期間は最初の更新で20年以上、2回目以降は10年以上。建物がある場合の更新請求・使用継続には地主の正当事由ある異議が必要。","借地権は借地上の建物の登記で対抗でき、登記は借地権者本人名義であることが必要。滅失しても一定事項を掲示すれば2年間対抗できる。","更新がないとき借地権者は建物買取請求ができる。第三者が建物を取得し地主が譲渡を承諾しないときも買取請求できる。","地代の増減請求は可能。一定期間増額しない特約は有効だが、減額しない特約は無効で、減額請求できる。","一般定期借地権は50年以上で書面（電磁的記録含む）により、更新なし・建物築造による延長なし・買取請求なしを定められる。","事業用定期借地権は専ら事業用（居住用不可）で10年以上50年未満、公正証書による。建物譲渡特約付借地権は30年以上。"],"traps":["「家族名義の建物登記でも借地権を対抗できる」と出たら×。判例は借地権者本人名義の登記を要求する。","「事業用定期借地権は書面であれば公正証書でなくてもよい」と出たら×。事業用定期借地権の設定契約は公正証書によらなければならない。","「地代を減額しない特約は有効」と出たら×。増額しない特約のみ有効で、減額しない特約があっても減額請求できる。"],"rel":["権利|借家","権利|賃貸借","権利|物権変動・対抗"],"bridge":"借家は建物の引渡しで、借地は借地上の建物の登記で対抗力を得る。民法の賃貸借（最長50年）と異なり、借地権は30年以上で更新も保護される。"},"権利|借家":{"pts":["建物賃貸借は登記がなくても建物の引渡しで対抗できる。普通借家・定期借家のいずれにも適用される。","期間1年未満の普通借家は期間の定めがないものとみなす。賃貸人からの解約申入れは正当事由が必要で、申入れから6か月で終了する。","期間満了の1年前から6か月前までに更新拒絶等の通知をしないと、従前と同一条件（期間の定めなし）で更新したものとみなす。","定期借家は書面（電磁的記録含む）で契約し、事前に契約書とは別の書面で更新がない旨を説明する必要がある（承諾を得て電磁的方法も可）。","期間1年以上の定期借家では、期間満了の1年前から6か月前までに終了の通知をしなければ終了を賃借人に対抗できない。","床面積200㎡未満の居住用定期借家で、やむを得ない事情により使用困難なら賃借人は解約申入れでき、1か月後に終了する。","造作買取請求権は特約で排除できる。居住用建物の賃借人が相続人なく死亡したときは同居の事実上の配偶者等が承継する。"],"traps":["「定期建物賃貸借は公正証書でしなければならない」と出たら×。書面又は電磁的記録で足りる。","「造作買取請求権を排除する特約は無効」と出たら×。造作買取請求権の規定は任意規定で、排除特約は有効。","「定期借家でも賃料減額請求権は排除できない」と出たら×。賃料改定特約があれば借賃増減請求の規定は適用されない。"],"rel":["権利|借地","権利|賃貸借","業法|重要事項説明"],"bridge":"借家は建物の引渡しで対抗力を得るが、借地は建物登記が必要。定期借家の事前説明は賃貸人の義務で、宅建業者の重要事項説明とは別物（業者が代理する場合は兼ねられる）。"},"権利|区分所有法":{"pts":["共用部分は区分所有者全員の共有に属し、各共有者の持分は規約に別段の定めがない限り専有部分の床面積の割合による。","共用部分の保存行為は各共有者が単独でできる。負担は規約に別段の定めがない限り持分に応じて負う。","規約で管理者を共用部分の所有者（管理所有）とできる。管理者は少なくとも毎年1回集会を招集しなければならない。","規約・集会決議は区分所有者の特定承継人にも効力を生じ、占有者も建物等の使用方法について区分所有者と同一の義務を負う。","規約の設定・変更・廃止は集会の特別決議による。一部の区分所有者の権利に特別の影響を及ぼすときはその者の承諾が必要。","最初に専有部分の全部を所有する者は、公正証書で規約共用部分・規約敷地・敷地利用権の分離処分等に関する規約を設定できる。","議事録には議長及び集会に出席した区分所有者2人が署名する。招集手続は区分所有者全員の同意があれば省略できる。"],"traps":["「分譲業者は公正証書で法定共用部分を定める規約を設定できる」と出たら×。公正証書で設定できるのは規約共用部分等の一定事項のみ。","「集会の決議は買主など特定承継人には及ばない」と出たら×。規約・集会決議は特定承継人にも効力を生ずる。","「共用部分の持分は専有部分の価格の割合による」と出たら×。原則は床面積割合（内法で計算）で、規約で別段の定めも可。"],"rel":["権利|共有・相隣","業法|重要事項説明"],"bridge":"共用部分の管理には民法の共有規定でなく区分所有法の集会決議が適用される。区分所有建物の売買では、規約の定め（専用使用権・管理費等）が重要事項説明の追加項目になる。"},"権利|不動産登記法":{"pts":["表示に関する登記は1か月以内の申請義務がある（新築建物の表題登記、建物の滅失登記など）。登記官は職権でもできる。","権利に関する登記は登記権利者と登記義務者の共同申請が原則。判決・相続・合併・相続人への遺贈は単独申請できる。","相続登記は2024年4月から義務化。相続による取得を知った日から3年以内に申請が必要で、正当な理由なく怠ると過料の対象となる。","申請期限内に相続人である旨を申し出る相続人申告登記により、相続登記の申請義務を履行したものとみなされる。","所有権の登記名義人の住所・氏名の変更登記も2026年4月から義務化され、変更日から2年以内に申請しなければならない。","共同申請では登記義務者の登記識別情報の提供が必要。資格者代理人による申請でも、提供できない正当な理由がない限り省略できない。","所有権登記名義人等が異なる土地や、地目・地番区域が異なる土地は合筆できない。分筆は原則として申請によりできる。"],"traps":["「相続人以外への遺贈による所有権移転登記は受遺者が単独で申請できる」と出たら×。単独申請は相続人への遺贈に限る。","「権利に関する登記には一般に申請義務がない」と出たら要注意。相続登記・住所等変更登記は申請義務がある。","「建物の合併の登記は抵当権者も申請できる」と出たら×。申請人は表題部所有者又は所有権の登記名義人に限られる。"],"rel":["権利|物権変動・対抗","権利|相続"],"bridge":"物権変動の対抗要件が登記で、不動産登記法はその申請手続を定める。相続の効果は民法、相続登記の申請義務と期限は不動産登記法と分けて押さえる。"},"権利|相続":{"pts":["法定相続分は、配偶者と子で各1/2、配偶者と直系尊属で2/3と1/3、配偶者と兄弟姉妹で3/4と1/4。","代襲原因は相続開始以前の死亡・欠格・廃除で、相続放棄は含まれない。子の系統は再代襲あり、兄弟姉妹は甥・姪までで再代襲なし。","相続放棄・限定承認は自己のために相続開始を知った時から3か月以内に家庭裁判所に申述する。限定承認は共同相続人全員で行う。","遺留分は兄弟姉妹以外に認められ、総体的遺留分は直系尊属のみが相続人なら1/3、それ以外は1/2。侵害額は金銭で請求する。","遺留分の放棄は相続開始前でも家庭裁判所の許可で可能だが、相続放棄は相続開始前にはできない。遺留分放棄後も相続人の地位は残る。","自筆証書遺言は全文・日付・氏名を自書し押印するが、財産目録は自書不要（各頁に署名押印）。法務局で保管すれば検認不要。","配偶者居住権は遺産分割・遺贈等で取得し、期間の定めがなければ終身。遺言で5年を超えない期間で遺産分割を禁止できる。"],"traps":["「相続放棄をした者の子が代襲相続する」と出たら×。相続放棄は代襲原因にならない。","「兄弟姉妹にも遺留分がある」と出たら×。遺留分は兄弟姉妹以外の相続人にのみ認められる。","「遺留分を放棄した者は相続人でなくなる」と出たら×。遺留分を放棄しても相続はでき、相続放棄とは別の制度。"],"rel":["権利|不動産登記法","権利|物権変動・対抗","税他|所得税・譲渡"],"bridge":"相続で取得した不動産は3年以内の相続登記が義務で、法定相続分を超える取得は登記がなければ第三者に対抗できない。譲渡所得では相続人が被相続人の取得費・取得時期を引き継ぐ。"},"法令|都市計画法":{"pts":["都市計画区域は原則都道府県が指定（2以上の都府県にわたる場合は国土交通大臣）。区域外にも準都市計画区域を指定できる。","市街化区域はすでに市街地を形成している区域とおおむね10年以内に優先的・計画的に市街化を図るべき区域、市街化調整区域は市街化を抑制すべき区域。","市街化区域には少なくとも用途地域を定め、市街化調整区域には原則として用途地域を定めない。用途地域は13種類。","高度地区は用途地域内で高さの最高限度・最低限度を定め、高度利用地区は容積率の最高・最低限度、建蔽率の最高限度等を定める。","特定用途制限地域は、用途地域が定められていない土地の区域（市街化調整区域を除く）に定める。","準都市計画区域では用途地域・特別用途地区・特定用途制限地域・高度地区（最高限度）・景観地区・風致地区等を定められる。","地区計画は用途地域内のほか一定の用途地域外にも定められ、地区整備計画区域内での建築等は着手30日前までに市町村長へ届出。"],"traps":["「準都市計画区域に高度利用地区・防火地域を定められる」と出たら×。準都市計画区域で高度利用地区・防火地域・準防火地域は定められない。","「高度地区では容積率の最高限度を定める」と出たら×。高度地区は高さ、容積率を定めるのは高度利用地区。","「都市施設は都市計画区域外に定めることはできない」と出たら×。特に必要があるときは区域外にも定められる。"],"rel":["法令|開発許可","法令|建築基準法"],"bridge":"都市計画法で決めた区域区分が開発許可の要否面積を、用途地域が建築基準法の用途制限・建蔽率・容積率を決める。都市計画で枠を作り、開発許可と建築確認で個々の行為を規制する。"},"法令|開発許可":{"pts":["開発行為は、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更。建築のみなら許可不要。","許可不要の規模は市街化区域1,000㎡未満（三大都市圏の一定区域は500㎡未満）、非線引き・準都市計画区域3,000㎡未満、区域外1ha未満。","市街化区域以外では農林漁業用建築物・農林漁業者の住宅のための開発行為は許可不要。市街化区域では規模要件で判断する。","駅舎・図書館・公民館・変電所など公益上必要な建築物や、都市計画事業・土地区画整理事業等の施行として行う開発行為は許可不要。","申請前に既存の関係公共施設の管理者と協議し同意を得る。新設される公共施設の管理者となる者とは協議が必要。","工事完了公告前は原則建築不可だが、工事用仮設建築物、知事が支障なしと認めたもの、開発に同意していない土地所有者等の建築は可。","相続等の一般承継人は地位を当然に承継し、特定承継は知事の承認が必要。自己業務用でも災害レッドゾーンは原則除外される。"],"traps":["「病院・学校の建築のための開発行為は公益上必要なので許可不要」と出たら×。病院・学校・社会福祉施設は公益の例外に当たらない。","「土地の区画形質の変更を伴わない建築にも開発許可が必要」と出たら×。開発許可は開発行為についてのもの。","「市街化区域内の農業用倉庫のための開発行為は規模を問わず許可不要」と出たら×。農林漁業用の例外は市街化区域外のみ。"],"rel":["法令|都市計画法","法令|盛土規制法","法令|土地区画整理法"],"bridge":"開発許可の要否面積は都市計画法の区域区分で決まる。開発許可を受けた土地は盛土規制法の許可を受けたものとみなされ、土地区画整理事業の施行として行う開発行為は許可不要。"},"法令|建築基準法":{"pts":["2025年4月改正で、階数2以上又は延べ面積200㎡超の建築物（新2号）は全国で新築・大規模修繕・模様替に建築確認が必要。","防火・準防火地域外での10㎡以内の増築・改築・移転は確認不要。200㎡超の特殊建築物への用途変更は類似用途間を除き確認が必要。","建築物の敷地は幅員4m以上の道路に2m以上接しなければならない。2項道路は原則として道路中心線から2m後退した線が境界。","防火地域内の耐火建築物等（建蔽率8/10の地域以外）・準防火地域内の耐火・準耐火建築物等で+1/10、角地で+1/10緩和される。","建蔽率8/10の地域内で防火地域内にある耐火建築物等は建蔽率制限が適用されない。前面道路12m未満なら容積率は道路幅員で制限される。","建築物が防火地域と準防火地域等にわたるときは原則全部に厳しい方を適用。用途制限は敷地の過半の属する地域による。","第一種・第二種低層住居専用地域・田園住居地域は10m又は12mの絶対高さ制限があり、北側斜線は低層・中高層住居専用・田園住居地域に適用。"],"traps":["「防火地域内でも10㎡以内の増築なら確認不要」と出たら×。10㎡以内の確認不要は防火・準防火地域外に限る。","「神社・寺院は工業専用地域では建築できない」と出たら×。神社・寺院・教会、保育所、診療所等は全用途地域で建築可。","「都市計画区域外の木造2階建ての新築は確認不要」と出たら×。2025年改正後は新2号建築物として全国で確認が必要。"],"rel":["法令|都市計画法","法令|開発許可"],"bridge":"用途地域や防火地域は都市計画法で定め、そこでの具体的な建築制限は建築基準法が定める。開発許可は土地の造成段階、建築確認は個々の建築物の段階の規制。"},"法令|盛土規制法":{"pts":["宅地造成等工事規制区域・特定盛土等規制区域は都道府県知事（指定都市・中核市はその長）が基礎調査をもとに指定する。","宅地造成等工事規制区域内で一定規模の宅地造成・特定盛土等・土石の堆積を行う工事主は、着手前に知事の許可を受けなければならない。","許可対象は、盛土で高さ1m超の崖、切土で高さ2m超の崖、盛土切土合わせ高さ2m超の崖、盛土で高さ2m超、面積500㎡超など。","許可申請前に、工事主は周辺住民へ説明会の開催等の周知措置を講じなければならない。許可後は工事現場に標識を掲示する。","特定盛土等規制区域内では一定規模の工事は着手日の30日前までに知事へ届出が必要。大規模な工事は許可が必要となる。","宅地造成等工事規制区域内で高さ2m超の擁壁・排水施設等の除却工事を行う者は、許可不要の場合でも着手日の14日前までに知事へ届け出る。","規制区域内の土地の所有者・管理者・占有者は、災害が生じないよう常時安全な状態に維持するよう努めなければならない。"],"traps":["「造成宅地防災区域は宅地造成等工事規制区域内にも指定できる」と出たら×。規制区域内の土地には指定できない。","「周知措置は工事着手後に行えばよい」と出たら×。許可申請の前にあらかじめ講じなければならない。","「規制区域外の盛土にも盛土規制法の届出が必要」と出たら×。規制区域・特定盛土等規制区域の外では許可も届出も不要。"],"rel":["法令|開発許可","法令|農地法"],"bridge":"規制区域内で都市計画法の開発許可を受けた工事は盛土規制法の許可を受けたものとみなされる。農地での盛土も宅地造成等の対象となり得て、農地転用許可とは別に許可が問題となる。"},"法令|土地区画整理法":{"pts":["施行者は個人・組合・区画整理会社・地方公共団体・国土交通大臣・機構等。組合設立には7人以上で定款・事業計画を定め知事の認可が必要。","組合施行区域内の宅地の所有者・借地権者はすべて組合員となる。未登記の借地権は施行者への申告がなければ存在しないものとみなす。","事業計画の決定等の公告後、換地処分公告までの間、施行区域内で建築や土地の形質変更等をするには知事等（市の区域内は市長）の許可が必要。","仮換地指定の効力発生日から換地処分公告の日まで、従前の宅地の権利者は仮換地を従前と同じ内容で使用収益でき、従前の宅地は使用できない。","仮換地の使用収益開始日を別に定めることができ、そのため使用収益できず損失を受けた者には施行者が損失補償する。","換地処分は関係権利者に換地計画で定めた事項を通知して行い、公告日の終了時に仮換地指定の効力が消滅し、翌日に換地が従前の宅地とみなされる。","清算金と保留地の取得は換地処分公告の翌日に確定・効力発生する。換地処分後は施行者が遅滞なく登記所に通知し換地処分の登記を行う。"],"traps":["「施行区域内の建築行為は施行者の許可を受ける」と出たら×。許可権者は知事等（市の区域内は市長）で、施行者ではない。","「組合施行の仮換地指定には土地区画整理審議会の意見を聴く」と出たら×。組合施行は総会等の同意で、審議会は公的施行の場合。","「清算金は換地処分後に土地を買った者に当然承継される」と出たら×。換地処分時の所有者との間で確定する。"],"rel":["法令|都市計画法","法令|開発許可"],"bridge":"土地区画整理事業は都市計画で定める市街地開発事業の一つで、施行区域は都市計画法で決まる。その施行として行う開発行為は区域・規模を問わず開発許可が不要となる。"},"法令|農地法":{"pts":["農地か否かは登記簿上の地目でなく現況で判断する。一時的に耕作していない休耕地も農地に当たる。","3条（権利移動）は農業委員会、4条（転用）・5条（転用目的の権利移動）は知事等（指定市町村は市町村長）の許可が必要。","相続・遺産分割・相続人への特定遺贈は許可不要だが、農業委員会への届出が必要。相続人以外への特定遺贈は3条許可が必要。","市街化区域内の農地は、あらかじめ農業委員会に届け出れば4条・5条許可が不要。3条にはこの特例はない。","2アール未満の農業用施設への自己転用は4条許可不要。国・都道府県等の一定の転用は協議成立で許可があったものとみなす。","許可のない権利移動・転用目的の権利移動は効力を生じない。違反転用者・工事請負人等に原状回復等を命じられる。","農地の賃貸借は引渡しで対抗でき、解除・解約申入れ等には原則知事の許可が必要。適格法人以外の法人も一定要件で借りられる。"],"traps":["「市街化区域内なら3条の権利移動も届出で足りる」と出たら×。市街化区域の届出特例は4条・5条のみ。","「登記簿の地目が山林なら耕作していても農地法の適用はない」と出たら×。現況で判断する。","「相続人以外への特定遺贈も許可不要」と出たら×。相続人以外への特定遺贈は3条許可が必要。"],"rel":["法令|国土利用計画法","法令|都市計画法"],"bridge":"農地法3条許可を受ける場合は国土法の事後届出が不要。市街化区域では4条・5条許可に代えて届出で足り、都市計画の区域区分が手続を左右する。"},"法令|国土利用計画法":{"pts":["事後届出は、土地売買等の契約を締結した権利取得者（買主等）が、契約締結日から起算して2週間以内に市町村長経由で知事に行う。","届出対象面積は、市街化区域2,000㎡以上、その他の都市計画区域5,000㎡以上、都市計画区域外10,000㎡以上。","土地売買等の契約は対価を得て所有権・地上権・賃借権を移転・設定する契約で、予約や交換も含む。贈与・相続・無償の賃借は対象外。","買主側が一団の土地を取得する場合は合計面積で判断する（買いの一団）。個々の契約が小さくても合計が基準以上なら届出必要。","当事者の一方又は双方が国・地方公共団体等の場合、民事調停による場合、農地法3条許可を受ける場合などは事後届出不要。","届出事項には対価の額も含むが、知事の勧告は土地の利用目的についてのみ行い、届出から3週間以内にする。","勧告に従わないと公表されることがあるが契約は有効。無届は6か月以下の拘禁刑又は100万円以下の罰金の対象（契約は有効）。"],"traps":["「売主と買主が共同で事後届出をする」と出たら×。届出義務者は権利取得者（買主等）のみで、売主に義務はない。","「勧告に従わなければ契約は無効」と出たら×。公表されることがあるだけで、無届・勧告不服従でも契約は有効。","「対価の額が著しく不適正なら勧告できる」と出たら×。事後届出の勧告は利用目的についてのみ。"],"rel":["法令|農地法","法令|都市計画法"],"bridge":"事後届出の対象面積は都市計画法の区域区分（市街化区域・その他の区域・区域外）で決まる。農地法3条許可を受ける取引は国土法の事後届出が不要となる。"},"税他|不動産取得税・固定資産税":{"pts":["不動産取得税は都道府県が不動産の取得者に課す。有償・無償や登記の有無を問わず、家屋の改築で価格が増加した場合も課税。","相続・法人の合併・共有物分割（持分を超えない部分）などの形式的な移転は非課税。国・地方公共団体等には課税できない。","不動産取得税の課税標準は固定資産課税台帳の価格。免税点は土地10万円、家屋は建築1戸23万円・その他1戸12万円未満。","固定資産税は市町村が1月1日（賦課期日）時点の固定資産課税台帳上の所有者に課す。年の途中で売却しても納税義務者は変わらない。","質権者・100年より長い存続期間の地上権者は、所有者に代わり固定資産税の納税義務者となる。賃借人は納税義務者にならない。","住宅用地の課税標準は、200㎡以下の小規模住宅用地は価格の1/6、それを超える部分は1/3とする特例がある。","いずれも普通徴収（納税通知書）。固定資産税の納期は原則4月・7月・12月・2月中で、特別の事情があれば条例で別に定められる。"],"traps":["「不動産取得税は申告納付である」と出たら×。不動産取得税・固定資産税とも普通徴収。","「相続による取得にも不動産取得税が課される」と出たら×。相続は形式的移転で非課税。贈与・交換は課税。","「4月1日の所有者に固定資産税が課される」と出たら×。賦課期日は1月1日で、その時点の所有者に課す。"],"rel":["税他|印紙税・登録免許税","税他|地価公示・鑑定評価"],"bridge":"不動産取得税・固定資産税・登録免許税はいずれも固定資産課税台帳の価格を課税標準の基礎にする。地価公示価格とは別の評価制度である。"},"税他|印紙税・登録免許税":{"pts":["不動産の譲渡契約書、地上権・土地賃借権の設定・譲渡契約書、請負契約書、金銭消費貸借契約書は課税文書。建物賃貸借契約書は非課税。","契約の成立を証する文書なら仮契約書・覚書も課税文書。同一内容で複数作成すれば、仲介人保存分も含め各通が課税される。","土地賃借権設定の記載金額は権利金等の返還されない金額で、賃料・敷金は含まない。贈与契約書は記載金額のない文書となる。","国等と私人が共同作成した文書は、私人が保存するものは国等が作成したものとみなされ非課税、国等が保存するものは課税。","印紙の貼付漏れは過怠税（原則納付すべき額の3倍、自主的申出で1.1倍）。消印のない場合も過怠税が課される。","登録免許税は登記を受ける者が連帯して納付する。不動産の課税標準は登記時の価額で、固定資産課税台帳の価格を基礎とする。","住宅用家屋の軽減税率特例は、個人が自己居住用に取得し床面積50㎡以上、取得後1年以内の登記等が要件。敷地の土地には適用されない。"],"traps":["「建物の賃貸借契約書は印紙税の課税文書」と出たら×。課税文書となるのは土地の賃借権設定契約書で、建物賃貸借は非課税。","「住宅用家屋の所有権移転登記の軽減は贈与・相続でも適用」と出たら×。売買又は競落による取得に限られる。","「減額の変更契約書は減額後の金額が記載金額」と出たら×。減額の変更契約書は記載金額のない文書となる。"],"rel":["税他|不動産取得税・固定資産税","権利|不動産登記法"],"bridge":"登録免許税は登記という手続にかかる国税で、不動産取得税は取得にかかる地方税。課税標準は同じく固定資産課税台帳の価格を基礎とする。"},"税他|所得税・譲渡":{"pts":["譲渡所得は譲渡した年の1月1日時点で所有期間5年超なら長期、5年以下なら短期。相続・贈与では被相続人等の取得費・取得時期を引き継ぐ。","取得費には購入代金のほか設備費・改良費を含む。営利目的で継続的に行う譲渡は事業所得又は雑所得となる。","居住用財産の3,000万円特別控除は所有期間を問わない。配偶者・直系血族・生計を一にする親族等への譲渡には適用されない。","居住しなくなった日から3年を経過する日の属する年の12月31日までの譲渡なら適用可。前年・前々年に同特例等を受けていると不可。","所有期間10年超の居住用財産は、3,000万円控除後の金額に軽減税率の特例を併用できる。収用等の5,000万円控除後も同様。","居住用財産の譲渡損失の損益通算・繰越控除の特例は、住宅ローン控除と併用することができる。","居住年等に3,000万円控除や軽減税率の特例などを受けると、住宅ローン控除は適用されない。"],"traps":["「同居していない配偶者への譲渡なら3,000万円控除を受けられる」と出たら×。配偶者・直系血族への譲渡は同居の有無を問わず不可。","「所有期間は譲渡日現在で判定する」と出たら×。長期・短期は譲渡した年の1月1日現在の所有期間で判定する。","「3,000万円特別控除は所有期間10年超が要件」と出たら×。所有期間要件はなく、10年超が要件なのは軽減税率の特例。"],"rel":["権利|相続","税他|不動産取得税・固定資産税"],"bridge":"相続で取得した不動産は被相続人の取得費・取得時期を引き継ぎ、長期・短期の判定もそれによる。不動産取得税は取得時に、所得税は譲渡益に課される。"},"税他|地価公示・鑑定評価":{"pts":["土地鑑定委員会が都市計画区域その他の公示区域内の標準地について、毎年1月1日の正常な価格を判定し官報で公示する。","標準地は自然的・社会的条件からみて類似する地域で、土地の利用状況・環境等が通常と認められる一団の土地から選定する。","正常な価格の判定は2人以上の不動産鑑定士の鑑定評価を求めて行う。建物や地上権等があっても存しないものとして（更地として）求める。","公示事項は所在地、単位面積当たりの価格、価格判定の基準日、地積・形状、周辺の状況等。総額は公示しない。","不動産鑑定士は公示区域内の土地の鑑定評価で公示価格を規準としなければならない。一般の土地取引は指標とするよう努める。","鑑定評価は原価法・取引事例比較法・収益還元法を併用する。原価法は造成地・埋立地等の土地にも適用できる。","価格は正常価格・限定価格・特定価格・特殊価格に分かれる。特殊価格は文化財等の市場性を有しない不動産の価格。"],"traps":["「標準地の公示価格は総額で公示される」と出たら×。公示されるのは単位面積当たりの価格。","「地上権が設定された土地は標準地に選定できない」と出たら×。選定でき、価格は地上権が存しないものとして求める。","「原価法は土地には適用できない」と出たら×。再調達原価を適切に求められる造成地・埋立地には適用できる。"],"rel":["税他|不動産取得税・固定資産税","法令|国土利用計画法"],"bridge":"地価公示は土地取引の指標となる正常価格で、固定資産税等の評価額とは別の制度。国土法の事後届出の対価は届出事項だが、勧告対象は利用目的のみ。"},"税他|住宅金融支援機構":{"pts":["証券化支援業務（買取型）は、民間金融機関の住宅ローン債権を買い取り、これを担保にMBSを発行して資金調達する。","買取対象は本人又は親族が居住する住宅の建設・購入資金の貸付債権で、中古住宅や付随する土地・借地権、購入に付随する改良資金も含む。賃貸住宅は対象外。","住宅融資保険業務では、民間金融機関の住宅ローンについて保険を引き受け、民間による住宅資金の供給を支援する。","直接融資は原則民間が困難な分野に限られ、災害復興建築物、マンション共用部分の改良（管理組合等への融資）などが対象。","団体信用生命保険業務で、債務者の死亡のほか重度障害の場合も保険金を債務の弁済に充当する。","災害復興建築物の貸付金では元金据置期間を設けられる。高齢者向け返済特例として死亡時一括償還制度がある。"],"traps":["「賃貸住宅の建設資金の貸付債権も買取対象」と出たら×。買取対象は本人又は親族が居住する住宅に係る債権。","「中古住宅の購入資金は買取対象外」と出たら×。新築に限られず中古住宅購入資金も対象。","「機構は一般の個人向け住宅ローンを広く直接融資する」と出たら×。直接融資は災害関連など政策上必要な分野に限られる。"],"rel":["税他|景品表示法","税他|土地・建物"],"bridge":"機構は住宅ローンの資金供給を担う制度で、免除科目の中で景品表示法・土地建物と並ぶ5問免除の一角。数字より業務の対象・範囲の理解が問われる。"},"税他|景品表示法":{"pts":["徒歩所要時間は道路距離80mにつき1分で計算し、1分未満の端数は1分に切り上げる。起点は物件の区画のうち駅に最も近い地点等。","新築は建築工事完了後1年未満で、かつ居住の用に供されたことがないもの。この要件を満たさない物件に「新築」と表示することはできない。","取引する意思のない物件や契約済み物件を表示するおとり広告は不当表示。事後に説明しても違反となる。","取引態様は売主・貸主・代理・媒介（仲介）の用語で明示する。「直販」等の表示では明示とならない。","分譲住宅等で全区画の価格表示が困難なときは、最低価格・最高価格と最多価格帯・その価格帯の数を表示できる。平均額は不可。","建築条件付土地は、対象が土地である旨、条件の内容、条件不成就時の措置（受領金全額返還等）を明示する。","古家・廃屋等がある土地はその旨を明示。新設予定の駅は運行主体が公表したものに限り、新設予定時期を明示して表示できる。"],"traps":["「徒歩所要時間の1分未満の端数は切り捨てる」と出たら×。1分未満の端数は切り上げる。","「すぐ訂正すればおとり広告にならない」と出たら×。契約済み物件の掲載はそれ自体が不当表示。","「価格は平均価格で表示すればよい」と出たら×。最低・最高価格（及び最多価格帯）で表示し、平均額は認められない。"],"rel":["業法|広告","税他|住宅金融支援機構"],"bridge":"宅建業法の広告規制（誇大広告の禁止・取引態様の明示・広告開始時期）と景品表示法・公正競争規約は内容が重なるが、根拠法と監督の仕組みが異なる。"},"税他|土地・建物":{"pts":["台地・段丘は水はけが良く地盤も安定し、宅地として安全度が高い。ただし台地上の浅い谷は浸水しやすく、縁辺部は崖崩れに注意。","低地は軟弱地盤が多く、洪水・地震・津波等の災害リスクが高い。自然堤防は周辺の後背低地より比較的安全。","埋立地・干拓地のうち干拓地は海面より低いことが多く危険度が高い。旧河道や砂の緩い埋立地は液状化しやすい。","扇状地は山麓部で土石流等に注意。軟弱層が厚い地域では地震動が増幅され揺れが大きくなる。","鉄筋コンクリートは異形棒鋼の方が付着力が高い。コンクリートは中性化すると鉄筋が錆びやすくなるため、かぶり厚さが重要。","壁式構造は柱・梁を用いず壁と床で箱形をつくる構造。ブレース構造はラーメン構造等と併用されることがある。","べた基礎は建物底部全体に設け、布基礎は壁体等の下に連続して設ける。木造の真壁は和風、大壁は洋風の仕上げ。"],"traps":["「台地上ならどこでも浸水の危険はない」と出たら×。台地上の浅い谷は水が集まり浸水することがある。","「布基礎は建物底部全体にコンクリートを打つ基礎」と出たら×。底部全体はべた基礎、布基礎は壁下に連続。","「異形棒鋼より丸鋼の方が付着力が高い」と出たら×。表面に突起のある異形棒鋼の方が付着力が高い。"],"rel":["法令|盛土規制法","業法|重要事項説明"],"bridge":"盛土・切土の崖や擁壁の安全は盛土規制法で規制され、地形の危険性の理解と結び付く。水害ハザードマップ上の位置や土砂災害警戒区域は重要事項説明の対象となる。"}};

}

  const relH=(L.rel||[]).filter(k=>LESSON[k]).map(k=>`<div class="kp"><b style="font-size:1rem">${k.split("|")[1]}</b><ul class="ul">${LESSON[k].pts.slice(0,3).map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("");

    ${L.traps&&L.traps.length?`<div class="trap"><b>よく出るひっかけ</b><ul class="ul">${L.traps.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}</article>
  ${relH?`<article class="card"><div class="meta">付随する論点</div><p style="margin:0">${L.bridge||""}</p><div class="relg">${relH}</div></article>`:""}`;
}
function startReview(queue){ // queue: [{key, missed?}]
  if(!queue.length){home();return}

  app.innerHTML=`<div class="exam-top"><div><div class="note">復習　残り${queue.length}論点</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>

  $("#home").onclick=home;
  $("#toq").onclick=()=>checkQs(item,rest);
  if(voice){const L=LESSON[key];if(L)speak(t+"の要点。"+L.pts.join("。"))}
  window.scrollTo(0,0);
}
function checkQs(item,rest){
  const [f,t]=item.key.split("|");
  const ex=new Set(item.missed?[item.missed.q.i]:[]);
  let pool=BANK.filter(q=>q.f===f&&q.t===t);
  let real=pool.filter(q=>q.ref!=="確認");
  const qs=pick(real.length>=3?real:pool,3,ex);
  let k=0,right=0;
  const render=()=>{
    if(k>=qs.length){
      const ok=right===qs.length;
      app.innerHTML=`<section class="card"><h2>${t}　確認例題の結果</h2><div class="row"><span class="big">${right}<span style="font-size:1.2rem"> / ${qs.length}</span></span><span class="judge ${ok?"j-ok":right>=2?"j-mid":"j-ng"}">${ok?"習得":right>=2?"もう一息":"要復習"}</span></div>
      <p class="note">${ok?"この論点は理解できています。":"もう一度、解説を読んでから別の3問に挑戦できます。"}</p>
      <div class="row">${ok?"":`<button class="btn" id="again">解説に戻ってもう一度</button>`}
      ${rest.length?`<button class="btn pri" id="next">次の論点へ（残り${rest.length}）</button>`:`<button class="btn pri" id="nx">第${SET.round+1}回の模試へ</button>`}
      <button class="btn" id="home">ホームへ</button></div></section>`;
      if(!ok)$("#again").onclick=()=>startReview([{key:item.key,missed:item.missed},...rest]);
      if(rest.length)$("#next").onclick=()=>startReview(rest);else $("#nx").onclick=()=>startExam();
      $("#home").onclick=home;window.scrollTo(0,0);return}
    const q=qs[k];
    app.innerHTML=`<div class="exam-top"><div><div class="note">確認例題　${k+1} / ${qs.length}　正解 ${right}</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
    <article class="card"><div class="meta">過去問　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn" id="o">○</button><button class="btn" id="x">×</button></div><div id="res"></div></article>`;
    const go=v=>{$("#o").disabled=$("#x").disabled=true;const ok=v===q.a;if(ok)right++;rec(q,ok);save();
      $("#res").innerHTML=`<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答えは ${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div><div class="row" style="margin-top:10px"><button class="btn pri" id="nx">次へ</button></div>`;
      if(voice)speak((ok?"正解。":"不正解。")+"答えは"+(q.a?"まる":"ばつ")+"。"+q.e);
      $("#nx").onclick=()=>{k++;render();if(voice&&k<qs.length)speak(qs[k].s)};$("#nx").focus()};
    $("#o").onclick=()=>go(1);$("#x").onclick=()=>go(0);$("#home").onclick=home;
    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    window.scrollTo(0,0);
  };
  render();if(voice&&qs.length)speak(qs[0].s);
}
if(canSpeak){try{speechSynthesis.getVoices()}catch(e){}}
home();
connect();
</script>

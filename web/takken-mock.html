分を超える部分は登記が必要（899条の2）","相続放棄の効果は登記なく対抗できる（判例）","無断単独登記の譲受人は他相続人の持分を取得しない","相続登記の申請義務：知った日から3年以内"]}],"flow":{"title":"二重譲渡の対抗関係の判定","steps":["相手は当事者・前主か（なら登記不要）","相手は無権利者・不法占拠者か（なら登記不要）","相手は背信的悪意者か（なら登記不要）","上記以外は177条の第三者（悪意者も含む）","先に登記を備えた方が優先","取消し・解除・時効は第三者の出現時期も確認"]},"tables":[{"title":"登記なしで対抗できるか","head":["相手方","登記なしで対抗"],"rows":[["二重譲渡の他方の譲受人（悪意含む）","×"],["背信的悪意者","○"],["背信的悪意者からの善意の転得者","×"],["不法占拠者・無権利者","○"],["前主・前々主（順次譲渡）","○"],["差押債権者","×"],["対抗力ある借地人（賃貸人の地位主張）","×"]]},{"title":"第三者の出現時期と処理","head":["場面","前の第三者","後の第三者"],"rows":[["詐欺・錯誤取消し","善意無過失なら保護","登記の先後"],["強迫取消し","保護されない","登記の先後"],["虚偽表示","善意なら保護（登記不要）","—"],["解除","登記があれば保護","登記の先後"],["取得時効","登記なく対抗可","登記の先後"]]}]}},"権利|共有・相隣":{"pts":["保存行為は各共有者が単独ででき、管理行為（軽微な変更、土地5年・建物3年以内の賃貸借等を含む）は持分の価格の過半数で決する。","形状又は効用の著しい変更を伴う変更には共有者全員の同意が必要。所在等不明共有者がいれば裁判所の決定で残りの共有者で決められる。","各共有者は共有物の全部を持分に応じて使用できる。共有者の1人が単独占有していても、他の共有者は当然には明渡請求できない。","共有者が持分を放棄し又は相続人なく死亡したとき、その持分は他の共有者に帰属する。分割禁止特約は5年以内（更新可）。","隣地使用権は一定目的のため必要な範囲で認められるが、住家への立入りは居住者の承諾が必要。原則あらかじめ通知する。","越境した竹木の根は自ら切り取れる。枝は所有者に切除させるのが原則だが、催告後相当期間内に切除しない等の場合は自ら切り取れる。","他の土地に囲まれ公道に通じない土地の所有者は囲繞地を通行できる。分割・一部譲渡で生じた袋地は他の分割者の土地のみ無償で通行できる。"],"traps":["「共有物の変更はすべて共有者全員の同意が必要」と出たら×。形状・効用の著しい変更を伴わない軽微な変更は持分の過半数で足りる。","「隣地の枝はいかなる場合も自ら切り取れない」と出たら×。催告後相当期間内に切除されない、所有者不明、急迫の事情の場合は可。","「持分を放棄した共有者の持分は国庫に帰属する」と出たら×。他の共有者に帰属する（255条）。"],"rel":["権利|区分所有法","権利|相続"],"bridge":"区分所有建物の共用部分にも共有の考え方があるが、変更・管理の決議は区分所有法の集会決議で行う。遺産共有も共有の一種で、相続開始から10年経過後は共有物分割手続でも分割できる場合がある。","sys":{"overview":"物権編の所有権の章。共有物に関する行為を保存・管理・変更に分けて決め方を押さえ、2023年4月施行の改正（軽微変更、所在等不明共有者、隣地使用権、枝の切取り、管理命令制度）と相隣関係の数字を整理する。","tree":[{"h":"共有の基本","items":["各共有者は全部を持分に応じて使用できる","使用する共有者は超過分の対価償還義務あり","持分の処分は各自自由","持分放棄・相続人なく死亡→他の共有者に帰属","単独占有者に当然には明渡請求できない（判例）"]},{"h":"行為の区分","items":["保存行為：各共有者が単独で可","管理行為：持分の価格の過半数","軽微な変更：持分の価格の過半数","著しい変更：共有者全員の同意","短期賃貸借（土地5年・建物3年以内）は管理"]},{"h":"不明共有者","items":["所在等不明共有者：裁判所の決定で除外可","賛否不明共有者：管理行為のみ除外可","不明共有者の持分の取得・譲渡の制度あり","遺産共有は相続開始から10年経過が必要"]},{"h":"分割","items":["各共有者はいつでも分割請求できる","分割禁止特約は5年以内（更新可）","協議が調わなければ裁判で分割","現物・賠償・競売による分割"]},{"h":"相隣関係","items":["隣地使用権：原則あらかじめ通知","住家への立入りは居住者の承諾が必要","越境した根は自ら切り取れる","枝は催告後相当期間内に切除なし等で自ら切除","ライフライン設備の設置・使用権"]},{"h":"通行・距離等","items":["袋地所有者は囲繞地を通行できる（償金必要）","分割・一部譲渡の袋地は残余地のみ無償通行","建物は境界線から50cm以上離す","1m未満の窓・縁側には目隠しが必要","所有者不明・管理不全の土地建物の管理命令"]}],"flow":{"title":"共有物の行為の決め方","steps":["持分の処分か→各共有者が単独で可","現状維持の保存行為か→単独で可","形状・効用の著しい変更か→全員の同意","それ以外の管理・軽微変更→持分価格の過半数","使用中の共有者に特別の影響→その承諾が必要","不明共有者がいれば裁判所の決定で除外"]},"tables":[{"title":"共有物の行為と要件","head":["行為","要件","例"],"rows":[["保存","単独","不実登記の抹消請求・修繕"],["管理","持分価格の過半数","管理者選任・使用者の決定"],["短期賃貸借","持分価格の過半数","土地5年・建物3年以内"],["軽微な変更","持分価格の過半数","著しい変更を伴わない工事"],["著しい変更","全員の同意","造成・全体の売却"],["持分の処分","単独","持分の売却・抵当権設定"]]},{"title":"相隣関係の数字・要件","head":["項目","ルール"],"rows":[["越境した根","自ら切り取れる"],["越境した枝","原則所有者に切除させる"],["枝を自ら切れる場合","催告後相当期間・所有者不明・急迫"],["隣地の住家への立入り","居住者の承諾が必要"],["建物と境界線","50cm以上離す"],["窓・縁側の目隠し","境界線から1m未満"],["囲繞地通行","償金必要・損害最少の場所"],["分割による袋地","残余地のみ・無償"]]},{"title":"不明共有者の扱い","head":["対象","管理","変更"],"rows":[["所在等不明共有者","○ 除外可","○ 除外可"],["賛否不明共有者","○ 除外可","×"],["通常（不明者なし）","持分価格の過半数","全員の同意"]]}]}},"権利|抵当権・担保":{"pts":["抵当権は付加一体物に及び、設定当時の従物（判例）や建物抵当権では借地権にも及ぶ。果実には債務不履行後に及ぶ。","物上代位は売却代金・賃料・保険金など目的物の価値代替物に及び、払渡し・引渡し前に差押えが必要。","利息その他の定期金は、満期となった最後の2年分についてのみ抵当権を行使できる。後順位者等がいなければ制限されない。","法定地上権は、設定時に土地上に建物があり、土地と建物が同一所有者で、競売により別々の所有者となった場合に成立する。","抵当権者に対抗できない建物賃借人は、買受人の買受けの時から6か月間明渡しが猶予される。土地の賃借人には適用されない。","抵当権消滅請求は第三取得者が競売開始決定の効力発生前にでき、主たる債務者・保証人やその承継人はできない。","根抵当権は極度額の範囲で担保し、元本確定前の被担保債権の範囲変更・債務者変更に後順位抵当権者等の承諾は不要。"],"traps":["「更地に抵当権設定後に建てた建物にも法定地上権が成立する」と出たら×。設定時に建物が存在することが要件。","「一括競売をした抵当権者は建物の代価からも優先弁済を受けられる」と出たら×。一括競売は任意で、優先弁済は土地の代価のみ。","「物上代位は差押えなしに保険金に及ぶ」と出たら×。払渡し・引渡し前に抵当権者自らが差し押さえる必要がある。"],"rel":["権利|借地","権利|賃貸借","権利|保証・連帯債務"],"bridge":"建物の抵当権は従たる権利である借地権に及び、抵当権登記後の賃借人は買受人に対抗できない。保証人は債務者の財産から回収する人的担保、抵当権は物から優先弁済を受ける物的担保である。","sys":{"overview":"物権編の担保物権。中心は抵当権で、効力の及ぶ範囲、物上代位、優先弁済の範囲（最後の2年分）、法定地上権、第三取得者・賃借人の保護、根抵当権との違いを押さえる。留置権・先取特権・質権との性質比較も出る。","tree":[{"h":"担保物権","items":["法定：留置権・先取特権","約定：質権・抵当権","共通性質：付従性・随伴性・不可分性","物上代位性は留置権にない"]},{"h":"効力の範囲","items":["付加一体物、設定当時の従物（判例）","建物抵当権は借地権にも及ぶ（判例）","果実は債務不履行後に及ぶ","利息等は満期となった最後の2年分","物上代位：差押えを払渡し前にする"]},{"h":"法定地上権","items":["設定時に土地上に建物が存在","設定時に土地と建物が同一所有者","土地・建物の一方又は双方に抵当権","競売で別々の所有者になる","更地に後で建てた建物→不成立"]},{"h":"利害関係人","items":["代価弁済：抵当権者の請求に応じて支払う","抵当権消滅請求：第三取得者から請求","消滅請求は競売の差押えの効力発生前まで","債務者・保証人・その承継人は消滅請求不可","建物賃借人は買受けから6か月明渡猶予"]},{"h":"一括競売等","items":["更地抵当後の建物も一括競売できる（任意）","優先弁済は土地の代価のみ","登記した賃貸借も抵当権者全員の同意＋登記で対抗可","順位の変更は登記が効力要件"]},{"h":"根抵当権","items":["一定範囲の不特定債権を極度額まで担保","利息等は極度額まで全部担保（2年制限なし）","確定前の範囲・債務者変更に後順位の承諾不要","元本確定期日は定めた日から5年以内","設定者の確定請求は設定から3年経過後"]}],"flow":{"title":"法定地上権の成立判定","steps":["抵当権設定時に土地上に建物があったか","設定時に土地と建物が同一所有者だったか","土地・建物の一方又は双方に抵当権があるか","競売で土地と建物の所有者が別になったか","全て○なら法定地上権が成立","更地なら一括競売（任意）を検討"]},"tables":[{"title":"抵当権と根抵当権","head":["項目","抵当権","根抵当権"],"rows":[["被担保債権","特定の債権","一定範囲の不特定債権"],["付従性・随伴性","あり","元本確定前はなし"],["利息の担保","最後の2年分","極度額まで全部"],["範囲・債務者の変更","—","確定前は可・承諾不要"],["元本確定期日","—","5年以内"],["確定請求（設定者）","—","設定から3年経過後"]]},{"title":"第三取得者・賃借人の保護","head":["制度","誰から","ポイント"],"rows":[["代価弁済","抵当権者の請求","代価支払で抵当権消滅"],["抵当権消滅請求","第三取得者","競売の差押えの効力発生前"],["明渡猶予","建物賃借人","買受けから6か月・土地は対象外"],["同意の登記","賃借人","全抵当権者の同意＋登記で対抗"]]},{"title":"担保物権の性質","head":["種類","物上代位","優先弁済"],"rows":[["留置権","×","×"],["先取特権","○","○"],["質権","○","○"],["抵当権","○","○"]]}]}},"権利|債務不履行・解除":{"pts":["履行遅滞の時期は、確定期限は期限到来時、不確定期限は到来後に請求を受けた時か到来を知った時の早い方、期限なしは請求時。","損害賠償には債務者の帰責事由が必要。履行遅滞中に当事者双方の責めに帰さない不能が生じたときは債務者の帰責事由とみなす。","原始的不能でも契約は無効とならず、債務不履行による損害賠償を請求できる（412条の2第2項）。","金銭債務は不可抗力をもって抗弁とできず、損害の証明も不要。損害賠償額は約定利率がなければ法定利率による（変動制）。","解除に債務者の帰責事由は不要。ただし不履行が債権者の帰責事由によるときは解除できない（543条）。","催告解除は相当期間を定めて催告し、期間経過時の不履行が軽微なときは解除できない（541条ただし書）。","全部の履行不能・明確な履行拒絶、定期行為の期間経過などは無催告で解除できる（542条）。解除しても損害賠償請求は可能。"],"traps":["「解除には債務者の責めに帰すべき事由が必要」と出たら×。2020年改正で不要となった。損害賠償との違いに注意。","「不確定期限の債務は期限到来の時から遅滞となる」と出たら×。請求を受けた時か到来を知った時のいずれか早い時から。","「原始的不能の契約は無効」と出たら×。契約は有効で、履行に代わる損害賠償を請求できる。"],"rel":["権利|売買・契約不適合","権利|物権変動・対抗"],"bridge":"契約不適合責任の解除・損害賠償は債務不履行の一般規定（541・542条、415条）によるため要件は共通。解除前・解除後の第三者の扱いは物権変動・対抗の論点となる。","sys":{"overview":"債権総論の中心。履行遅滞の時期、損害賠償（帰責事由が必要）と解除（帰責事由不要）の要件の違い、催告解除と無催告解除の区別、解除の効果（原状回復・第三者保護）を2020年改正後のルールで押さえる。","tree":[{"h":"履行遅滞","items":["確定期限：期限到来時","不確定期限：請求時か知った時の早い方","期限の定めなし：請求を受けた時","不法行為の賠償債務：不法行為時から"]},{"h":"履行不能","items":["原始的不能でも契約は有効（412条の2）","遅滞中の不能は債務者の帰責事由とみなす","債権者は反対給付の履行を拒める（危険負担）","債権者の帰責事由による不能→反対給付拒絶不可"]},{"h":"損害賠償","items":["債務者の帰責事由が必要","通常損害＋予見すべき特別損害","債権者の過失は過失相殺","賠償額の予定ができる"]},{"h":"金銭債務","items":["不可抗力をもって抗弁とできない","損害の証明不要","約定利率がなければ法定利率","法定利率は3年ごと見直し（2026年4月〜も年3%）"]},{"h":"解除の要件","items":["債務者の帰責事由は不要","債権者の帰責事由による不履行→解除不可","催告解除：相当期間を定めて催告","期間経過時の不履行が軽微なら解除不可","全部不能・明確な履行拒絶は無催告解除"]},{"h":"解除の効果","items":["原状回復義務（双方の同時履行）","金銭は受領時から利息を付す","物は果実・使用利益も返還","解除しても損害賠償請求できる","当事者複数なら全員から又は全員に"]}],"flow":{"title":"解除から原状回復まで","steps":["債務不履行の発生（債権者の帰責事由なし）","無催告解除事由か（全部不能・明確な拒絶等）","該当しなければ相当期間を定めて催告","期間経過時の不履行が軽微でないか","解除の意思表示（撤回不可）","原状回復：金銭は受領時から利息を付す","解除前の第三者は登記があれば保護"]},"tables":[{"title":"履行遅滞となる時期","head":["期限","遅滞の時期"],"rows":[["確定期限","期限到来時"],["不確定期限","請求時か知った時の早い方"],["期限の定めなし","請求を受けた時"],["不法行為の損害賠償","不法行為時（請求不要）"]]},{"title":"損害賠償と解除の要件","head":["項目","損害賠償","解除"],"rows":[["債務者の帰責事由","必要","不要"],["債権者の帰責事由","過失相殺","解除不可"],["催告","不要","原則必要"],["軽微な不履行","請求可","催告解除不可"],["原始的不能","請求可","無催告で可"]]},{"title":"無催告解除できる場合","head":["事由","解除"],"rows":[["債務の全部が履行不能","○ 全部"],["全部の履行拒絶を明確に表示","○ 全部"],["定期行為で時期を経過","○ 全部"],["一部不能・一部拒絶で目的不達","○ 全部"],["一部不能・一部拒絶","○ その一部"]]}]}},"権利|売買・契約不適合":{"pts":["引き渡された目的物が種類・品質・数量に関して契約に適合しないとき、買主は追完（修補・代替物・不足分の引渡し）を請求できる。","代金減額請求は原則として相当期間を定めた追完の催告が必要。追完不能・明確な追完拒絶などの場合は無催告で減額請求できる。","契約不適合を理由に、債務不履行の一般規定により損害賠償請求（売主の帰責事由が必要）と解除（帰責事由不要）ができる。","不適合が買主の帰責事由によるときは、追完・代金減額・解除のいずれも請求できない。","種類・品質の不適合は、買主が知った時から1年以内に通知しなければ権利を失う。売主が悪意・重過失なら制限なし。数量・権利は対象外。","担保責任を負わない特約も有効だが、売主が知りながら告げなかった事実や自ら設定・譲渡した権利は免責されない（572条）。","手付は解約手付と推定され、相手方が履行に着手するまで、買主は手付を放棄、売主は倍額を現実に提供して解除できる。"],"traps":["「1年以内に請求しなければならない」と出たら×。知った時から1年以内の「通知」で足り、数量不足には適用されない。","「契約目的を達成できなければ解除できない」と出たら×。催告解除は不適合が軽微でなければ可能。目的達成不能は無催告解除の要件。","「売主は自分が履行に着手していれば手付解除できない」と出たら×。基準は相手方の履行着手で、自ら着手していても解除可。"],"rel":["権利|債務不履行・解除","業法|8種制限","権利|不法行為・請負・委任"],"bridge":"民法では担保責任の免責特約も有効だが、宅建業者が自ら売主の8種制限では引渡しから2年以上とする通知期間特約を除き買主に不利な特約は無効。請負の不適合責任も売買の規定を準用する。","sys":{"overview":"債権各論の売買。契約不適合責任の4つの救済（追完・代金減額・損害賠償・解除）の要件の違いと、通知期間（知った時から1年）を押さえる。手付・買戻し・他人物売買や、宅建業法の8種制限・品確法との違いも頻出。","tree":[{"h":"契約不適合","items":["種類・品質・数量・権利の不適合","売主の帰責事由は損害賠償のみ必要","買主の帰責事由なら追完・減額・解除不可","媒介業者は担保責任を負わない"]},{"h":"4つの救済","items":["追完：修補・代替物・不足分の引渡し","代金減額：原則として追完の催告が必要","損害賠償：債務不履行の一般規定（415条）","解除：541・542条、軽微なら催告解除不可"]},{"h":"期間制限","items":["種類・品質：知った時から1年以内に通知","売主が悪意・重過失なら1年制限なし","数量・権利の不適合は1年制限の対象外","別に消滅時効（知った時5年・引渡し等から10年）"]},{"h":"特約","items":["担保責任免除特約も原則有効","知りながら告げない事実は免責されない","自ら設定・譲渡した権利も免責されない","業者が売主：通知期間を引渡しから2年以上は可"]},{"h":"手付","items":["解約手付と推定","買主は放棄、売主は倍額を現実に提供","相手方の履行着手まで解除できる","手付解除では損害賠償請求できない"]},{"h":"その他","items":["他人物売買も有効、売主は取得して移転","権利を失うおそれ→代金支払拒絶可（576条）","引渡し後の滅失・損傷は買主の負担（567条）","買戻し期間は10年以内、定めなし→5年以内"]}],"flow":{"title":"買主の救済手段の順","steps":["不適合が買主の帰責事由によらないか確認","まず追完（修補・代替物・不足分）を請求","追完の催告後も相当期間内に追完なし","代金減額請求か催告解除（軽微でなければ）","追完不能・明確な拒絶→無催告で減額・解除","売主に帰責事由あれば損害賠償も併せて請求","種類・品質は知った時から1年以内に通知"]},"tables":[{"title":"4つの救済手段","head":["手段","売主の帰責","催告","買主の帰責"],"rows":[["追完請求","不要","—","×"],["代金減額","不要","原則必要","×"],["損害賠償","必要","—","過失相殺"],["解除","不要","原則必要","×"]]},{"title":"期間制限の整理","head":["場面","期間"],"rows":[["種類・品質の不適合","知った時から1年以内に通知"],["売主が悪意・重過失","1年制限なし"],["数量・権利の不適合","1年制限なし（消滅時効のみ）"],["宅建業者が自ら売主","引渡しから2年以上の特約可"],["新築住宅（品確法）","構造耐力上主要部分等10年"]]},{"title":"手付解除の可否","head":["状況","手付解除"],"rows":[["相手方が履行に着手前","○"],["自分だけが履行に着手","○"],["相手方が履行に着手後","×"],["売主：倍額を口頭で提供のみ","×（現実の提供が必要）"]]}]}},"権利|保証・連帯債務":{"pts":["保証契約は書面（電磁的記録を含む）でしなければ効力を生じない。保証債務は主たる債務に付従する。","保証債務は元本・利息・違約金・損害賠償等に及ぶ。契約後に主債務の目的・態様が加重されても保証人の負担は加重されない。","通常の保証人には催告の抗弁権・検索の抗弁権があるが、連帯保証人にはない。連帯保証人には分別の利益もない。","個人根保証契約は極度額を定めなければ無効。事業用貸金等の個人保証は原則、契約前1か月以内の公正証書による意思表示が必要。","連帯債務で他の債務者に効力が及ぶ（絶対効）のは弁済・更改・相殺・混同。請求・免除・時効完成は原則として相対効。","他の連帯債務者が反対債権を有するときは、その者の負担部分の限度で履行を拒めるのみで、代わりに相殺はできない。","弁済した連帯債務者は、弁済額が自己の負担部分を超えなくても、各自の負担部分の割合に応じて求償できる（442条）。"],"traps":["「連帯債務者の1人への履行の請求は他の債務者にも効力を生ずる」と出たら×。2020年改正で請求は相対効となった。","「口頭の合意だけで保証契約が成立する」と出たら×。保証契約は書面又は電磁的記録でしなければ効力を生じない。","「連帯保証人は催告の抗弁権を有する」と出たら×。連帯保証人は催告・検索の抗弁権をいずれも有しない。"],"rel":["権利|抵当権・担保","権利|時効"],"bridge":"保証は人的担保、抵当権は物的担保で、保証人も物上保証人も弁済すれば求償できる。主債務の時効は保証人が援用でき、主債務者の承認による更新は保証人にも及ぶ（付従性）。","sys":{"overview":"債権総論の「多数当事者の債権債務」に属し、保証は人的担保の中心。保証人の抗弁・個人保証の保護、連帯債務の絶対効と求償を押さえれば得点できる。","tree":[{"h":"保証の成立","items":["書面又は電磁的記録でなければ無効","主債務が無効なら保証も無効（付従性）","債権譲渡で保証も移る（随伴性）","主債務者の承諾なくても保証人になれる"]},{"h":"保証の範囲","items":["元本・利息・違約金・損害賠償に及ぶ","後の主債務加重は保証人に及ばない","売買解除時の代金返還義務にも及ぶ（判例）","主債務者の時効更新は保証人にも及ぶ"]},{"h":"保証人の抗弁","items":["催告の抗弁権：まず主債務者へ請求せよ","検索の抗弁権：執行容易な財産から執行せよ","分別の利益：保証人数で頭割り","連帯保証人には上の3つがいずれもない"]},{"h":"個人保証の保護","items":["個人根保証は極度額の定めがないと無効","事業用貸金の個人保証は1か月内の公正証書","公正証書不要：取締役・過半数株主等","期限の利益喪失は知った時から2か月内に通知"]},{"h":"連帯債務","items":["各自が全額の履行義務を負う","絶対効：弁済・更改・相殺・混同","請求・免除・時効完成は相対効","他人の反対債権は負担部分まで履行拒絶のみ"]},{"h":"求償","items":["連帯債務：負担部分以下の弁済でも割合求償","保証人：弁済後に主債務者へ求償","事前・事後の通知を怠ると求償が制限"]}],"flow":null,"tables":[{"title":"保証・連帯保証・連帯債務","head":["項目","普通保証","連帯保証","連帯債務"],"rows":[["補充性","あり","なし","なし"],["催告の抗弁権","○","×","×"],["検索の抗弁権","○","×","×"],["分別の利益","○","×","―"],["書面の要否","必要","必要","不要"],["付従性","○","○","×（独立の債務）"]]},{"title":"連帯債務の影響関係","head":["1人に生じた事由","他の債務者への効力"],"rows":[["弁済・代物弁済","絶対効（全員消滅）"],["更改","絶対効"],["相殺（援用した場合）","絶対効"],["混同","絶対効"],["履行の請求","相対効（特約で絶対効可）"],["免除","相対効"],["時効の完成","相対効"]]},{"title":"個人保証の数字","head":["ルール","内容"],"rows":[["個人根保証の極度額","定めなければ無効"],["事業用貸金の個人保証","締結前1か月以内に公正証書"],["期限の利益喪失の通知","知った時から2か月以内"],["保証契約の方式","書面又は電磁的記録"]]}]}},"権利|不法行為・請負・委任":{"pts":["不法行為の損害賠償請求権は、損害及び加害者を知った時から3年（生命・身体侵害は5年）、不法行為の時から20年で時効消滅する。","使用者は事業の執行についての被用者の加害行為に責任を負う。使用者から被用者への求償、被用者から使用者への逆求償も相当額で認められる。","工作物責任は占有者が第一次的に負い、占有者が損害発生防止に必要な注意をしたときは所有者が無過失責任を負う。","請負人の契約不適合責任は、注文者が不適合を知った時から1年以内に通知が必要。注文者の材料・指図による不適合は原則責任なし。","注文者は仕事完成前ならいつでも損害を賠償して解除できる。完成前に解除等されても、注文者が受ける利益の割合に応じて報酬請求できる。","受任者は有償・無償を問わず善管注意義務を負う。報酬は特約がなければ請求できず、委任事務の中途終了なら履行割合に応じ請求できる。","委任は各当事者がいつでも解除できる。相手方に不利な時期の解除等は損害賠償が必要。委任者・受任者の死亡・破産で終了する。"],"traps":["「無償の受任者は自己の財産と同一の注意で足りる」と出たら×。委任は無償でも善管注意義務。自己の財産と同一の注意は無償寄託。","「工作物の所有者は過失がなければ責任を負わない」と出たら×。所有者の工作物責任は無過失責任。","「請負の不適合は引渡し時から1年以内に通知」と出たら×。起算点は注文者が不適合を知った時。"],"rel":["権利|売買・契約不適合","権利|時効"],"bridge":"請負の契約不適合責任は売買の規定を準用し、追完・減額・解除・損害賠償の枠組みは共通。不法行為の時効は一般の債権（5年・10年）と期間・起算点が異なる。","sys":{"overview":"民法債権各論の契約（請負・委任）と法定債権（不法行為）にまたがる論点。時効期間の数字、使用者・工作物責任の構造、請負と委任の報酬・解除・注意義務の違いが得点源。","tree":[{"h":"一般不法行為","items":["故意・過失による権利侵害で損害賠償","賠償は金銭が原則、遅滞は不法行為時から","過失相殺は裁判所の任意（必ずではない）","悪意・人身侵害の賠償債務は加害者から相殺不可"]},{"h":"特殊不法行為","items":["使用者責任：事業の執行についての加害","使用者→被用者の求償、逆求償も相当額","工作物責任：占有者→所有者（無過失責任）","共同不法行為者は連帯して全額を負う"]},{"h":"不法行為の時効","items":["知った時から3年（生命・身体は5年）","不法行為の時から20年","建物の安全性欠如は設計・施工者も責任（判例）"]},{"h":"請負","items":["報酬は仕事の目的物の引渡しと同時払","不適合は知った時から1年以内に通知","注文者の材料・指図による不適合は原則免責","完成前は注文者が損害賠償して解除可","未完成でも利益の割合に応じ報酬請求可"]},{"h":"委任","items":["有償・無償問わず善管注意義務","報酬は特約がなければ請求不可","中途終了は履行割合に応じ報酬請求可","費用の前払・償還請求ができる","いつでも解除可、不利な時期は損害賠償"]},{"h":"委任の終了事由","items":["委任者：死亡・破産","受任者：死亡・破産・後見開始","終了後も急迫の事情があれば必要な処分"]}],"flow":null,"tables":[{"title":"損害賠償請求権の時効","head":["種類","主観的起算点","客観的起算点"],"rows":[["一般の債権","知った時から5年","行使可能時から10年"],["人の生命・身体（債務不履行）","知った時から5年","行使可能時から20年"],["不法行為（物損等）","知った時から3年","不法行為時から20年"],["不法行為（生命・身体）","知った時から5年","不法行為時から20年"]]},{"title":"請負と委任の比較","head":["項目","請負","委任"],"rows":[["目的","仕事の完成","事務の処理"],["報酬","当然に有償","特約がなければ無償"],["報酬の時期","引渡しと同時","事務履行後（後払）"],["中途終了の報酬","利益の割合に応じ可","履行割合に応じ可"],["解除","注文者が完成前に可","各当事者いつでも可"],["契約不適合責任","○（売買準用）","×（債務不履行で処理）"]]},{"title":"特殊不法行為の責任者","head":["類型","第一次責任","免責の可否"],"rows":[["使用者責任","使用者","選任監督に注意で免責（実際上困難）"],["工作物責任","占有者","必要な注意をすれば免責"],["工作物責任（二次）","所有者","免責なし（無過失責任）"],["注文者の責任","原則負わない","注文・指図に過失あれば負う"]]}]}},"権利|賃貸借":{"pts":["民法上の賃貸借の存続期間は最長50年。借地借家法が適用される建物所有目的の土地賃貸借・建物賃貸借には別の規律がある。","賃貸人は修繕義務を負う（賃借人の帰責事由による場合を除く）。通知後相当期間修繕しない場合や急迫の事情では賃借人が修繕できる。","必要費は直ちに償還請求でき、有益費は賃貸借終了時に価格の増加が現存する場合に、支出額か増加額を賃貸人が選択して償還する。","無断譲渡・転貸は解除事由だが、背信的行為と認めるに足りない特段の事情があれば解除できない（判例）。","適法な転借人は賃貸人に直接義務を負う。合意解除は転借人に対抗できないが、債務不履行解除権があったときは対抗できる。","敷金は明渡し時に未払債務を控除して返還する。明渡しが先履行で、賃借人から敷金を未払賃料に充当するよう請求はできない。","賃借人は通常損耗・経年変化を除き原状回復義務を負う。対抗要件ある賃貸不動産の譲渡で賃貸人の地位は譲受人に移転する。"],"traps":["「賃借人は敷金を未払賃料に充てるよう請求できる」と出たら×。充当できるのは賃貸人のみ。","「無断転貸があれば賃貸人は常に解除できる」と出たら×。背信的行為と認めるに足りない特段の事情があれば解除できない。","「通常損耗も原状回復の対象」と出たら×。通常の使用収益で生じた損耗・経年変化は原状回復義務の対象外。"],"rel":["権利|借家","権利|借地","権利|物権変動・対抗"],"bridge":"建物賃貸借や建物所有目的の土地賃貸借には借地借家法が優先し、民法の規定は補充的に適用される。譲受人が賃貸人の地位を賃借人に主張するには所有権移転登記が必要。","sys":{"overview":"民法債権各論の典型契約の一つで、借地借家法の土台となる一般ルール。修繕・費用償還・転貸・敷金・賃貸人の地位移転を押さえ、使用貸借との違いも整理すれば得点できる。","tree":[{"h":"成立・期間","items":["諾成契約（書面不要）","存続期間は最長50年（超えれば50年）","期間の定めなし：土地1年・建物3か月で終了","処分権限のない者：土地5年・建物3年まで"]},{"h":"賃貸人の義務","items":["修繕義務（賃借人の帰責事由は除く）","通知後相当期間修繕なし→賃借人が修繕可","急迫の事情があれば賃借人が直ちに修繕可","必要費は直ちに償還請求"]},{"h":"賃借人の義務","items":["賃料支払（一部滅失等で当然減額）","用法遵守・善管注意で保管","通常損耗・経年変化を除き原状回復","損害賠償・費用償還は返還から1年以内"]},{"h":"譲渡・転貸","items":["無断譲渡・転貸は原則解除可","背信性なしの特段の事情なら解除不可","転借人は賃貸人に直接義務を負う","合意解除は転借人に対抗不可（例外あり）"]},{"h":"対抗・地位移転","items":["賃借権の登記で第三者に対抗","対抗要件あり→譲受人に地位が当然移転","譲受人の賃料請求には所有権移転登記要","敷金・費用償還債務も譲受人が承継"]},{"h":"敷金","items":["明渡し時に未払債務を控除して返還","明渡しが先履行（同時履行ではない）","賃借人から充当請求はできない","賃借権譲渡時は旧賃借人に返還"]}],"flow":{"title":"終了から敷金返還まで","steps":["期間満了・解約申入れ・解除で終了","賃借人が建物を明け渡す（先履行）","通常損耗を除き原状回復","未払賃料・損害を敷金から控除","残額を賃借人に返還"]},"tables":[{"title":"必要費と有益費","head":["項目","必要費","有益費"],"rows":[["例","雨漏り修理","改良工事"],["請求時期","直ちに","賃貸借終了時"],["償還額","支出額","支出額か増加額（賃貸人選択）"],["期間の猶予","なし","裁判所が許与できる"],["請求期限","返還から1年以内","返還から1年以内"]]},{"title":"賃貸借と使用貸借","head":["項目","賃貸借","使用貸借"],"rows":[["対価","有償","無償"],["契約の性質","諾成","諾成"],["修繕義務","貸主が負う","貸主は負わない"],["通常の必要費","貸主が負担","借主が負担"],["借主の死亡","相続される","終了する"],["第三者への対抗","登記等で可","不可"]]},{"title":"転貸借の終了と転借人","head":["原賃貸借の終了原因","転借人に対抗"],"rows":[["賃借人の債務不履行解除","○（催告不要）"],["合意解除","×"],["合意解除（不履行解除権あり）","○"],["期間満了（借家）","通知後6か月で対抗可"]]}]}},"権利|借地":{"pts":["借地権は建物所有目的の地上権又は土地賃借権。存続期間は30年以上で、定めがなければ30年。短い定めも30年となる。","合意更新の期間は最初の更新で20年以上、2回目以降は10年以上。建物がある場合の更新請求・使用継続には地主の正当事由ある異議が必要。","借地権は借地上の建物の登記で対抗でき、登記は借地権者本人名義であることが必要。滅失しても一定事項を掲示すれば2年間対抗できる。","更新がないとき借地権者は建物買取請求ができる。第三者が建物を取得し地主が譲渡を承諾しないときも買取請求できる。","地代の増減請求は可能。一定期間増額しない特約は有効だが、減額しない特約は無効で、減額請求できる。","一般定期借地権は50年以上で書面（電磁的記録含む）により、更新なし・建物築造による延長なし・買取請求なしを定められる。","事業用定期借地権は専ら事業用（居住用不可）で10年以上50年未満、公正証書による。建物譲渡特約付借地権は30年以上。"],"traps":["「家族名義の建物登記でも借地権を対抗できる」と出たら×。判例は借地権者本人名義の登記を要求する。","「事業用定期借地権は書面であれば公正証書でなくてもよい」と出たら×。事業用定期借地権の設定契約は公正証書によらなければならない。","「地代を減額しない特約は有効」と出たら×。増額しない特約のみ有効で、減額しない特約があっても減額請求できる。"],"rel":["権利|借家","権利|賃貸借","権利|物権変動・対抗"],"bridge":"借家は建物の引渡しで、借地は借地上の建物の登記で対抗力を得る。民法の賃貸借（最長50年）と異なり、借地権は30年以上で更新も保護される。","sys":{"overview":"民法の賃貸借・地上権の特別法である借地借家法のうち、建物所有目的の土地利用を扱う。存続期間と更新、対抗要件、建物買取請求、定期借地権3種の数字を押さえれば得点できる。","tree":[{"h":"存続期間","items":["当初30年以上（定めなし・短い定めは30年）","合意更新：1回目20年以上","2回目以降10年以上","一時使用目的は期間・更新の規定なし"]},{"h":"更新","items":["建物ありで更新請求→同一条件で更新（期間除く）","期間満了後の使用継続も同様","地主は遅滞なく異議＋正当事由で阻止","正当事由：必要性・経過・利用状況・立退料"]},{"h":"建物の滅失・再築","items":["承諾ある再築：承諾日等から20年延長","更新後の無承諾再築→地主は解約申入れ可","解約申入れから3か月で借地権消滅","更新後の滅失→借地権者も解約申入れ可"]},{"h":"対抗要件","items":["借地権の登記又は借地上の建物の登記","建物登記は借地権者本人名義が必要","表示登記でも可（判例）","滅失時は掲示で2年間対抗可"]},{"h":"建物買取・譲渡","items":["更新なし→借地権者が時価で買取請求","無承諾の建物取得者も地主へ買取請求","譲渡転貸は裁判所の代諾許可の制度あり","地代先取特権は最後の2年分"]},{"h":"定期借地権","items":["一般定期：50年以上・書面","事業用定期：10年以上50年未満・公正証書","建物譲渡特約付：30年以上","事業用は居住用建物（賃貸マンション）不可"]}],"flow":{"title":"期間満了〜建物買取請求","steps":["借地権の存続期間が満了","建物ありで更新請求or土地使用を継続","地主が遅滞なく異議を述べるか","異議に正当事由があるか","異議なし・正当事由なし→更新","正当事由あり→更新なく借地権消滅","借地権者が建物を時価で買取請求"]},"tables":[{"title":"借地権の種類","head":["種類","存続期間","方式"],"rows":[["普通借地権","30年以上","制限なし"],["一般定期借地権","50年以上","書面・電磁的記録"],["事業用定期借地権","10年以上50年未満","公正証書"],["建物譲渡特約付借地権","30年以上","制限なし"],["一時使用目的","規定なし","制限なし"]]},{"title":"普通借地と定期借地","head":["項目","普通借地","一般定期","事業用定期"],"rows":[["更新","○","×（特約）","×"],["再築による延長","○","×（特約）","×"],["建物買取請求","○","×（特約）","×"],["居住用建物","○","○","×"]]},{"title":"地代増減の特約","head":["特約","効力"],"rows":[["一定期間増額しない","有効"],["一定期間減額しない","無効（減額請求可）"],["協議不調の増額請求","相当額を払えば足りる"],["裁判確定後の差額","年1割の利息付き精算"]]}]}},"権利|借家":{"pts":["建物賃貸借は登記がなくても建物の引渡しで対抗できる。普通借家・定期借家のいずれにも適用される。","期間1年未満の普通借家は期間の定めがないものとみなす。賃貸人からの解約申入れは正当事由が必要で、申入れから6か月で終了する。","期間満了の1年前から6か月前までに更新拒絶等の通知をしないと、従前と同一条件（期間の定めなし）で更新したものとみなす。","定期借家は書面（電磁的記録含む）で契約し、事前に契約書とは別の書面で更新がない旨を説明する必要がある（承諾を得て電磁的方法も可）。","期間1年以上の定期借家では、期間満了の1年前から6か月前までに終了の通知をしなければ終了を賃借人に対抗できない。","床面積200㎡未満の居住用定期借家で、やむを得ない事情により使用困難なら賃借人は解約申入れでき、1か月後に終了する。","造作買取請求権は特約で排除できる。居住用建物の賃借人が相続人なく死亡したときは同居の事実上の配偶者等が承継する。"],"traps":["「定期建物賃貸借は公正証書でしなければならない」と出たら×。書面又は電磁的記録で足りる。","「造作買取請求権を排除する特約は無効」と出たら×。造作買取請求権の規定は任意規定で、排除特約は有効。","「定期借家でも賃料減額請求権は排除できない」と出たら×。賃料改定特約があれば借賃増減請求の規定は適用されない。"],"rel":["権利|借地","権利|賃貸借","業法|重要事項説明"],"bridge":"借家は建物の引渡しで対抗力を得るが、借地は建物登記が必要。定期借家の事前説明は賃貸人の義務で、宅建業者の重要事項説明とは別物（業者が代理する場合は兼ねられる）。","sys":{"overview":"借地借家法の建物賃貸借部分で、民法の賃貸借を修正し借家人を保護する。引渡しによる対抗力、更新拒絶と正当事由、解約申入れの期間、定期借家の要件と中途解約が得点源。","tree":[{"h":"適用・対抗","items":["建物の賃貸借全般に適用（一時使用除く）","引渡しで第三者に対抗（普通・定期共通）","譲受人には敷金返還債務も承継"]},{"h":"期間・更新","items":["1年未満の期間は定めなしとみなす","期間満了1年前〜6か月前に更新拒絶通知","通知なし→同一条件で法定更新（期間なし）","満了後の使用継続に遅滞なく異議が必要"]},{"h":"解約申入れ","items":["賃貸人から：正当事由要・6か月で終了","賃借人から：民法により3か月で終了","正当事由は立退料の申出で補完される"]},{"h":"定期借家","items":["書面又は電磁的記録で契約","契約書とは別の書面で事前説明","1年以上：1年前〜6か月前に終了通知","200㎡未満居住用はやむを得ず中途解約可","賃料改定特約で増減請求を排除可"]},{"h":"その他の保護","items":["造作買取請求（特約で排除可）","相続人なし→事実上の配偶者等が承継","転借人：原賃貸借終了の通知後6か月","取壊し予定建物：取壊し時終了特約（書面）"]}],"flow":{"title":"更新拒絶〜明渡し","steps":["期間満了1年前〜6か月前に通知","賃貸人の通知には正当事由が必要","通知なし・正当事由なし→法定更新","満了後の使用継続→遅滞なく異議","終了→造作買取請求（排除特約なし時）","明渡し後に敷金を精算・返還"]},"tables":[{"title":"普通借家と定期借家","head":["項目","普通借家","定期借家"],"rows":[["契約方式","制限なし","書面・電磁的記録"],["事前説明書面","不要","必要（別書面）"],["1年未満の期間","定めなしとみなす","有効"],["更新","あり（正当事由）","なし"],["賃料減額しない特約","無効","有効"],["賃借人の中途解約","特約による","200㎡未満居住用は可"]]},{"title":"借家の期間・数字","head":["場面","期間"],"rows":[["更新拒絶・終了通知","満了1年前〜6か月前"],["賃貸人の解約申入れ","6か月後に終了"],["賃借人の解約申入れ","3か月後に終了"],["定期借家の中途解約","申入れ1か月後に終了"],["遅れた終了通知","通知から6か月後に対抗可"],["転借人への終了通知","通知から6か月後に終了"]]},{"title":"特約の有効・無効","head":["特約","効力"],"rows":[["造作買取請求権の排除","有効"],["一定期間増額しない","有効"],["減額しない（普通借家）","無効"],["賃料改定特約（定期借家）","有効"],["正当事由なく更新しない","無効（普通借家）"]]}]}},"権利|区分所有法":{"pts":["共用部分は区分所有者全員の共有に属し、各共有者の持分は規約に別段の定めがない限り専有部分の床面積の割合による。","共用部分の保存行為は各共有者が単独でできる。負担は規約に別段の定めがない限り持分に応じて負う。","規約で管理者を共用部分の所有者（管理所有）とできる。管理者は少なくとも毎年1回集会を招集しなければならない。","規約・集会決議は区分所有者の特定承継人にも効力を生じ、占有者も建物等の使用方法について区分所有者と同一の義務を負う。","規約の設定・変更・廃止は集会の特別決議による。一部の区分所有者の権利に特別の影響を及ぼすときはその者の承諾が必要。","最初に専有部分の全部を所有する者は、公正証書で規約共用部分・規約敷地・敷地利用権の分離処分等に関する規約を設定できる。","議事録には議長及び集会に出席した区分所有者2人が署名する。招集手続は区分所有者全員の同意があれば省略できる。"],"traps":["「分譲業者は公正証書で法定共用部分を定める規約を設定できる」と出たら×。公正証書で設定できるのは規約共用部分等の一定事項のみ。","「集会の決議は買主など特定承継人には及ばない」と出たら×。規約・集会決議は特定承継人にも効力を生ずる。","「共用部分の持分は専有部分の価格の割合による」と出たら×。原則は床面積割合（内法で計算）で、規約で別段の定めも可。"],"rel":["権利|共有・相隣","業法|重要事項説明"],"bridge":"共用部分の管理には民法の共有規定でなく区分所有法の集会決議が適用される。区分所有建物の売買では、規約の定め（専用使用権・管理費等）が重要事項説明の追加項目になる。","sys":{"overview":"民法の共有の特別法で、マンションの専有部分・共用部分・敷地と管理組合運営を定める。2026年4月施行の改正で集会決議は原則「出席者の多数決」（定足数あり）となり、所在等不明者の除外や建替え要件の緩和が入った。決議要件の数字が得点源。","tree":[{"h":"専有・共用","items":["専有部分：構造上・利用上独立した部分","法定共用部分：廊下・階段室等","規約共用部分：集会室等、登記で対抗","持分は専有部分の床面積割合（内法）"]},{"h":"共用部分の管理","items":["保存行為：各共有者が単独で可","管理行為：出席者の過半数（普通決議）","重大な変更：出席者の3/4（人数は規約で減可）","耐震・外壁・配管・バリアフリー等は出席者の2/3","費用負担・収益は持分に応じる"]},{"h":"敷地・分離処分","items":["専有部分と敷地利用権の分離処分は原則禁止","規約で分離処分を可能にできる","最初の全部所有者は公正証書で一定の規約"]},{"h":"規約","items":["設定・変更・廃止は出席者の3/4","特別の影響を受ける者の承諾が必要","特定承継人にも効力、占有者も使用方法拘束","管理者等が保管し、利害関係人は閲覧可"]},{"h":"管理者・集会","items":["管理者は毎年1回以上集会を招集","1/5以上で招集請求（規約で減可）","通知は1週間前（建替えは2か月前）","通知には全ての議案の要領を示す","定足数：区分所有者・議決権の各過半数の出席","全員同意で招集手続を省略可","議事録：議長＋出席者2人が署名"]},{"h":"義務違反・建替え","items":["停止請求の訴え：普通決議","使用禁止・競売等：出席者の3/4＋弁明の機会","建替え：全体の4/5（一定の事由で3/4）","大規模滅失の復旧：出席者の3/4","所在等不明者は裁判所の決定で母数から除外"]}],"flow":{"title":"集会の招集〜議事録","steps":["管理者が招集（毎年1回以上）","1/5以上の請求でも招集","会日の1週間前までに通知","全員同意なら招集手続を省略可","定足数（各過半数の出席）を満たし決議","議長＋出席者2人が議事録に署名"]},"tables":[{"title":"主な決議要件","head":["事項","決議要件","規約で別段"],"rows":[["共用部分の管理","出席者の過半数","○"],["共用部分の重大変更","出席者の3/4（一定事由2/3）","人数のみ過半数まで減"],["規約の設定・変更・廃止","出席者の3/4","×"],["管理組合法人の設立","出席者の3/4","×"],["使用禁止・競売請求","出席者の3/4","×"],["大規模滅失の復旧","出席者の3/4","×"],["建替え","全体の4/5（一定事由3/4）","×"]]},{"title":"集会の数字","head":["項目","内容"],"rows":[["決議の定足数","区分所有者・議決権の各過半数"],["定期集会","毎年1回以上"],["少数区分所有者の招集請求","1/5以上（規約で減可）"],["招集通知","1週間前（規約で伸縮可）"],["招集通知の記載","全議案の要領を示す"],["建替え決議の通知","2か月前（規約で伸長のみ）"],["建替えの説明会","会日の1か月前まで"],["議事録の署名","議長＋出席者2人"]]},{"title":"単独・集会・承諾の区別","head":["行為","方法"],"rows":[["共用部分の保存行為","各自単独"],["小規模滅失の復旧","決議前は各自単独可"],["規約変更で特別の影響","その者の承諾必要"],["招集手続の省略","区分所有者全員の同意"],["書面・電磁的方法の決議","全員の承諾が必要"],["所在等不明区分所有者","裁判所の決定で母数から除外"]]}]}},"権利|不動産登記法":{"pts":["表示に関する登記は1か月以内の申請義務がある（新築建物の表題登記、建物の滅失登記など）。登記官は職権でもできる。","権利に関する登記は登記権利者と登記義務者の共同申請が原則。判決・相続・合併・相続人への遺贈は単独申請できる。","相続登記は2024年4月から義務化。相続による取得を知った日から3年以内に申請が必要で、正当な理由なく怠ると過料の対象となる。","申請期限内に相続人である旨を申し出る相続人申告登記により、相続登記の申請義務を履行したものとみなされる。","所有権の登記名義人の住所・氏名の変更登記も2026年4月から義務化され、変更日から2年以内に申請しなければならない。","共同申請では登記義務者の登記識別情報の提供が必要。資格者代理人による申請でも、提供できない正当な理由がない限り省略できない。","所有権登記名義人等が異なる土地や、地目・地番区域が異なる土地は合筆できない。分筆は原則として申請によりできる。"],"traps":["「相続人以外への遺贈による所有権移転登記は受遺者が単独で申請できる」と出たら×。単独申請は相続人への遺贈に限る。","「権利に関する登記には一般に申請義務がない」と出たら要注意。相続登記・住所等変更登記は申請義務がある。","「建物の合併の登記は抵当権者も申請できる」と出たら×。申請人は表題部所有者又は所有権の登記名義人に限られる。"],"rel":["権利|物権変動・対抗","権利|相続"],"bridge":"物権変動の対抗要件が登記で、不動産登記法はその申請手続を定める。相続の効果は民法、相続登記の申請義務と期限は不動産登記法と分けて押さえる。","sys":{"overview":"民法の物権変動の対抗要件である登記の手続法。表示登記と権利登記の区別、共同申請と単独申請の例外、相続登記・住所等変更登記の申請義務、合筆・分筆の制限が得点源。","tree":[{"h":"登記簿の構成","items":["表題部：物理的現況（所在・地目・床面積等）","権利部甲区：所有権に関する事項","権利部乙区：所有権以外の権利（抵当権等）","何人も手数料で登記事項証明書を請求可"]},{"h":"表示に関する登記","items":["表題登記・滅失登記等は1か月以内に申請","登記官は職権でも登記できる","一部地目変更の土地は職権で分筆可","合筆制限：所有者・地目・地番区域の相違"]},{"h":"権利に関する登記","items":["原則は共同申請（権利者＋義務者）","単独：判決・相続・合併・相続人への遺贈","買戻し特約は10年経過で権利者単独抹消","仮登記は義務者の承諾があれば単独可"]},{"h":"申請義務","items":["相続登記：知った日から3年以内","相続人申告登記で義務履行とみなす","住所・氏名変更：変更日から2年以内","正当な理由なく怠ると過料","施行前の住所変更は2028年3月末までに申請"]},{"h":"添付情報","items":["登記原因証明情報","登記義務者の登記識別情報（代理でも要）","提供不可→事前通知か本人確認情報","所有権登記義務者は印鑑証明書（書面申請）"]}],"flow":{"title":"権利の登記申請の流れ","steps":["登記原因（売買・相続等）が発生","申請方式を判断（共同か単独か）","申請情報と添付情報を準備","書面又はオンラインで登記所に申請","登記官が審査し登記を実行","新名義人に登記識別情報を通知"]},"tables":[{"title":"申請義務と期限","head":["登記","期限","義務違反"],"rows":[["土地・建物の表題登記","1か月以内","過料"],["建物の滅失登記","1か月以内","過料"],["地目・床面積等の変更","1か月以内","過料"],["相続による所有権移転","知った日から3年","10万円以下の過料"],["住所・氏名の変更","変更日から2年","5万円以下の過料"],["売買等の所有権移転","義務なし","―"]]},{"title":"単独申請できる登記","head":["登記","単独申請"],"rows":[["相続・法人の合併","○"],["相続人への遺贈","○"],["相続人以外への遺贈","×（共同申請）"],["判決による登記","○"],["登記名義人の住所等変更","○"],["10年経過後の買戻し特約抹消","○"],["仮登記（義務者の承諾書）","○"]]},{"title":"合筆・分筆の可否","head":["状況","合筆","分筆"],"rows":[["所有者が異なる","×","―"],["地目・地番区域が異なる","×","―"],["所有権以外の権利登記あり","原則×","○"],["一部が別地目になった","―","職権でも可"]]}]}},"権利|相続":{"pts":["法定相続分は、配偶者と子で各1/2、配偶者と直系尊属で2/3と1/3、配偶者と兄弟姉妹で3/4と1/4。","代襲原因は相続開始以前の死亡・欠格・廃除で、相続放棄は含まれない。子の系統は再代襲あり、兄弟姉妹は甥・姪までで再代襲なし。","相続放棄・限定承認は自己のために相続開始を知った時から3か月以内に家庭裁判所に申述する。限定承認は共同相続人全員で行う。","遺留分は兄弟姉妹以外に認められ、総体的遺留分は直系尊属のみが相続人なら1/3、それ以外は1/2。侵害額は金銭で請求する。","遺留分の放棄は相続開始前でも家庭裁判所の許可で可能だが、相続放棄は相続開始前にはできない。遺留分放棄後も相続人の地位は残る。","自筆証書遺言は全文・日付・氏名を自書し押印するが、財産目録は自書不要（各頁に署名押印）。法務局で保管すれば検認不要。","配偶者居住権は遺産分割・遺贈等で取得し、期間の定めがなければ終身。遺言で5年を超えない期間で遺産分割を禁止できる。"],"traps":["「相続放棄をした者の子が代襲相続する」と出たら×。相続放棄は代襲原因にならない。","「兄弟姉妹にも遺留分がある」と出たら×。遺留分は兄弟姉妹以外の相続人にのみ認められる。","「遺留分を放棄した者は相続人でなくなる」と出たら×。遺留分を放棄しても相続はでき、相続放棄とは別の制度。"],"rel":["権利|不動産登記法","権利|物権変動・対抗","税他|所得税・譲渡"],"bridge":"相続で取得した不動産は3年以内の相続登記が義務で、法定相続分を超える取得は登記がなければ第三者に対抗できない。譲渡所得では相続人が被相続人の取得費・取得時期を引き継ぐ。","sys":{"overview":"民法第5編の相続法で、相続人と相続分、承認・放棄、遺産分割、遺言、遺留分、配偶者居住権からなる。法定相続分と遺留分の数字、代襲の可否、期間制限を押さえれば得点できる。","tree":[{"h":"相続人","items":["配偶者は常に相続人","第1順位子→第2直系尊属→第3兄弟姉妹","代襲原因：死亡・欠格・廃除（放棄は×）","子は再代襲あり、兄弟姉妹は甥姪まで"]},{"h":"相続分","items":["配偶者と子：1/2ずつ","配偶者と直系尊属：2/3と1/3","配偶者と兄弟姉妹：3/4と1/4","半血の兄弟姉妹は全血の1/2"]},{"h":"承認・放棄","items":["知った時から3か月以内に選択","放棄・限定承認は家庭裁判所に申述","限定承認は共同相続人全員で","財産処分・期間経過で単純承認とみなす","相続開始前の放棄はできない"]},{"h":"遺産分割","items":["協議→調停→審判","効力は相続開始時に遡る","遺言で5年以内の分割禁止可","開始10年後は原則法定相続分で分割"]},{"h":"遺言","items":["15歳以上で作成可、いつでも撤回可","自筆：全文・日付・氏名自書＋押印","財産目録は自書不要（各頁署名押印）","公正証書・法務局保管の自筆は検認不要"]},{"h":"遺留分・居住権","items":["兄弟姉妹以外、全体で1/2（尊属のみ1/3）","侵害額は金銭で請求（1年・10年）","開始前の遺留分放棄は家裁許可で可","配偶者居住権：定めなければ終身","配偶者短期居住権：最低6か月"]}],"flow":{"title":"相続開始〜登記・遺留分","steps":["被相続人の死亡で相続開始","相続人・遺産・遺言の有無を調査","3か月内に承認・限定承認・放棄","遺言があれば検認（不要な方式あり）","遺産分割協議（不調なら調停・審判）","知った日から3年内に相続登記","侵害があれば遺留分侵害額請求"]},"tables":[{"title":"法定相続分と遺留分","head":["相続人","法定相続分","個別の遺留分"],"rows":[["配偶者のみ","全部","1/2"],["配偶者＋子","1/2・1/2","1/4・1/4"],["配偶者＋直系尊属","2/3・1/3","1/3・1/6"],["配偶者＋兄弟姉妹","3/4・1/4","1/2・なし"],["子のみ","全部","1/2"],["直系尊属のみ","全部","1/3"],["兄弟姉妹のみ","全部","なし"]]},{"title":"相続放棄と遺留分放棄","head":["項目","相続放棄","遺留分放棄"],"rows":[["開始前","×","○（家裁の許可）"],["開始後","3か月内に家裁へ申述","自由（意思表示）"],["相続人の地位","初めから相続人でない","相続人のまま"],["代襲相続","生じない","―"],["他の相続人への影響","相続分が増える","増えない"]]},{"title":"遺言の方式","head":["項目","自筆証書","公正証書"],"rows":[["作成者","本人が自書","公証人"],["証人","不要","2人以上"],["検認","必要（法務局保管は不要）","不要"],["財産目録","自書不要（署名押印）","―"]]}]}},"法令|都市計画法":{"pts":["都市計画区域は原則都道府県が指定（2以上の都府県にわたる場合は国土交通大臣）。区域外にも準都市計画区域を指定できる。","市街化区域はすでに市街地を形成している区域とおおむね10年以内に優先的・計画的に市街化を図るべき区域、市街化調整区域は市街化を抑制すべき区域。","市街化区域には少なくとも用途地域を定め、市街化調整区域には原則として用途地域を定めない。用途地域は13種類。","高度地区は用途地域内で高さの最高限度・最低限度を定め、高度利用地区は容積率の最高・最低限度、建蔽率の最高限度等を定める。","特定用途制限地域は、用途地域が定められていない土地の区域（市街化調整区域を除く）に定める。","準都市計画区域では用途地域・特別用途地区・特定用途制限地域・高度地区（最高限度）・景観地区・風致地区等を定められる。","地区計画は用途地域内のほか一定の用途地域外にも定められ、地区整備計画区域内での建築等は着手30日前までに市町村長へ届出。"],"traps":["「準都市計画区域に高度利用地区・防火地域を定められる」と出たら×。準都市計画区域で高度利用地区・防火地域・準防火地域は定められない。","「高度地区では容積率の最高限度を定める」と出たら×。高度地区は高さ、容積率を定めるのは高度利用地区。","「都市施設は都市計画区域外に定めることはできない」と出たら×。特に必要があるときは区域外にも定められる。"],"rel":["法令|開発許可","法令|建築基準法"],"bridge":"都市計画法で決めた区域区分が開発許可の要否面積を、用途地域が建築基準法の用途制限・建蔽率・容積率を決める。都市計画で枠を作り、開発許可と建築確認で個々の行為を規制する。","sys":{"overview":"法令上の制限の土台となる法律。区域（都市計画区域・準都市計画区域・区域区分）→地域地区→都市施設・市街地開発事業・地区計画→決定手続→都市計画制限の順で整理し、どの区域に何を定められるかを押さえる。","tree":[{"h":"区域の指定","items":["都市計画区域：原則都道府県が指定","2以上の都府県にわたる区域は国土交通大臣","準都市計画区域：区域外に都道府県が指定","区域区分（線引き）は都市計画区域のみ"]},{"h":"区域区分","items":["市街化区域：既成市街地＋概ね10年以内に市街化","市街化調整区域：市街化を抑制すべき区域","市街化区域は用途地域を必ず定める","調整区域は原則用途地域を定めない"]},{"h":"地域地区","items":["用途地域13種：住居系8・商業系2・工業系3","高度地区：高さの最高・最低限度","高度利用地区：容積率・建蔽率・建築面積","特定用途制限地域：用途地域外（調整区域除く）","防火・準防火地域は準都市計画区域に不可"]},{"h":"施設・事業","items":["都市施設：特に必要なら区域外にも可","市街化区域・非線引区域は道路・公園・下水道必須","住居系用途地域には義務教育施設も定める","市街地開発事業：市街化区域か非線引区域のみ"]},{"h":"地区計画","items":["用途地域内＋一定の用途地域外に定められる","地区整備計画は特別な事情があれば省略可","建築等は着手30日前までに市町村長へ届出","勧告はできるが許可制ではない"]},{"h":"都市計画制限","items":["都市計画施設等の区域内の建築は知事等の許可","2階以下・地階なしで移転容易なら必ず許可","事業地内の建築・土地形質変更は知事等の許可","事業地内の有償譲渡は施行者へ事前届出"]}],"flow":{"title":"都市計画の決定手続","steps":["原案作成（必要に応じ公聴会等）","決定しようとする旨を公告し2週間縦覧","住民・利害関係人が意見書を提出","都市計画審議会の議を経る","市町村決定は知事に協議（都道府県は一定で大臣同意）","決定を告示（告示の日から効力）","図書を公衆の縦覧に供する"]},"tables":[{"title":"準都市計画区域で定められるか","head":["地域地区等","可否"],"rows":[["用途地域・特別用途地区","○"],["特定用途制限地域","○"],["高度地区","○（最高限度のみ）"],["景観地区・風致地区","○"],["高度利用地区","×"],["防火地域・準防火地域","×"],["区域区分・市街地開発事業","×"],["地区計画","×"],["都市施設","○"]]},{"title":"高度地区と高度利用地区","head":["項目","高度地区","高度利用地区"],"rows":[["定める場所","用途地域内","用途地域内"],["定める内容","高さの最高・最低限度","容積率の最高・最低限度等"],["その他","—","建蔽率の最高限度・建築面積の最低限度"],["準都市計画区域","最高限度のみ○","×"]]},{"title":"用途地域の分類","head":["系統","用途地域"],"rows":[["住居系（8）","一低・二低・一中高・二中高"],["住居系（続き）","一住・二住・準住居・田園住居"],["商業系（2）","近隣商業・商業"],["工業系（3）","準工業・工業・工業専用"]]}]}},"法令|開発許可":{"pts":["開発行為は、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更。建築のみなら許可不要。","許可不要の規模は市街化区域1,000㎡未満（三大都市圏の一定区域は500㎡未満）、非線引き・準都市計画区域3,000㎡未満、区域外1ha未満。","市街化区域以外では農林漁業用建築物・農林漁業者の住宅のための開発行為は許可不要。市街化区域では規模要件で判断する。","駅舎・図書館・公民館・変電所など公益上必要な建築物や、都市計画事業・土地区画整理事業等の施行として行う開発行為は許可不要。","申請前に既存の関係公共施設の管理者と協議し同意を得る。新設される公共施設の管理者となる者とは協議が必要。","工事完了公告前は原則建築不可だが、工事用仮設建築物、知事が支障なしと認めたもの、開発に同意していない土地所有者等の建築は可。","相続等の一般承継人は地位を当然に承継し、特定承継は知事の承認が必要。自己業務用でも災害レッドゾーンは原則除外される。"],"traps":["「病院・学校の建築のための開発行為は公益上必要なので許可不要」と出たら×。病院・学校・社会福祉施設は公益の例外に当たらない。","「土地の区画形質の変更を伴わない建築にも開発許可が必要」と出たら×。開発許可は開発行為についてのもの。","「市街化区域内の農業用倉庫のための開発行為は規模を問わず許可不要」と出たら×。農林漁業用の例外は市街化区域外のみ。"],"rel":["法令|都市計画法","法令|盛土規制法","法令|土地区画整理法"],"bridge":"開発許可の要否面積は都市計画法の区域区分で決まる。開発許可を受けた土地は盛土規制法の許可を受けたものとみなされ、土地区画整理事業の施行として行う開発行為は許可不要。","sys":{"overview":"都市計画法のうち、土地の造成（区画形質の変更）段階の規制。開発行為の定義→許可不要の例外（規模・農林漁業・公益・事業）→申請手続→完了公告前後の建築制限の順に押さえれば得点できる。","tree":[{"h":"開発行為","items":["建築物・特定工作物のための区画形質の変更","第一種特定工作物：コンクリートプラント等","第二種：ゴルフコース（規模不問）","第二種：1ha以上の野球場・遊園地・墓園等","区画形質の変更なしの建築は許可不要"]},{"h":"許可不要","items":["区域ごとの規模未満（市街化1,000㎡未満等）","市街化区域外の農林漁業用建築物・農家住宅","駅舎・図書館・公民館・変電所等の公益施設","都市計画事業・区画整理事業等の施行として","非常災害の応急措置・通常の管理行為等"]},{"h":"申請・許可","items":["既存公共施設の管理者と協議し同意","新設公共施設の管理者となる者と協議","申請は書面、処分も遅滞なく文書で","33条技術基準：全区域に適用","34条立地基準：市街化調整区域のみ"]},{"h":"許可後","items":["知事が開発登録簿に登録・閲覧","軽微な変更は届出、その他の変更は許可","廃止は遅滞なく知事へ届出","一般承継は当然、特定承継は知事の承認"]},{"h":"建築制限","items":["完了公告前：原則建築不可（例外3つ）","公告後：予定建築物以外は原則不可","用途地域が定められていれば公告後の制限なし","調整区域の開発区域外の建築も原則許可"]}],"flow":{"title":"開発許可の流れ","steps":["公共施設管理者と協議・同意","知事へ書面で許可申請","許可・不許可を文書で通知","開発登録簿に登録","工事完了を知事へ届出・検査","検査済証交付→工事完了公告","公共施設は翌日原則市町村管理へ"]},"tables":[{"title":"許可不要となる規模","head":["区域","許可不要の規模"],"rows":[["市街化区域","1,000㎡未満"],["三大都市圏の既成市街地等","500㎡未満"],["市街化調整区域","規模の例外なし"],["非線引都市計画区域","3,000㎡未満"],["準都市計画区域","3,000㎡未満"],["都市計画区域・準都計区域外","1ha未満"]]},{"title":"主な例外と区域","head":["例外","市街化区域","それ以外"],"rows":[["農林漁業用建築物・農家住宅","×（規模で判断）","○不要"],["駅舎・図書館・公民館・変電所","○不要","○不要"],["病院・学校・社会福祉施設","×必要","×必要"],["区画整理・都市計画事業の施行","○不要","○不要"],["非常災害の応急措置","○不要","○不要"]]},{"title":"完了公告前に建築できる例外","head":["例外","可否"],"rows":[["工事用の仮設建築物","○"],["知事が支障ないと認めたもの","○"],["開発に不同意の土地所有者等","○"],["上記以外","×"]]}]}},"法令|建築基準法":{"pts":["2025年4月改正で、階数2以上又は延べ面積200㎡超の建築物（新2号）は全国で新築・大規模修繕・模様替に建築確認が必要。","防火・準防火地域外での10㎡以内の増築・改築・移転は確認不要。200㎡超の特殊建築物への用途変更は類似用途間を除き確認が必要。","建築物の敷地は幅員4m以上の道路に2m以上接しなければならない。2項道路は原則として道路中心線から2m後退した線が境界。","防火地域内の耐火建築物等（建蔽率8/10の地域以外）・準防火地域内の耐火・準耐火建築物等で+1/10、角地で+1/10緩和される。","建蔽率8/10の地域内で防火地域内にある耐火建築物等は建蔽率制限が適用されない。前面道路12m未満なら容積率は道路幅員で制限される。","建築物が防火地域と準防火地域等にわたるときは原則全部に厳しい方を適用。用途制限は敷地の過半の属する地域による。","第一種・第二種低層住居専用地域・田園住居地域は10m又は12mの絶対高さ制限があり、北側斜線は低層・中高層住居専用・田園住居地域に適用。"],"traps":["「防火地域内でも10㎡以内の増築なら確認不要」と出たら×。10㎡以内の確認不要は防火・準防火地域外に限る。","「神社・寺院は工業専用地域では建築できない」と出たら×。神社・寺院・教会、保育所、診療所等は全用途地域で建築可。","「都市計画区域外の木造2階建ての新築は確認不要」と出たら×。2025年改正後は新2号建築物として全国で確認が必要。"],"rel":["法令|都市計画法","法令|開発許可"],"bridge":"用途地域や防火地域は都市計画法で定め、そこでの具体的な建築制限は建築基準法が定める。開発許可は土地の造成段階、建築確認は個々の建築物の段階の規制。","sys":{"overview":"都市計画で決めた用途地域等の中で、個々の建築物を規制する法律。建築確認（2025年改正の新2号・新3号）→単体規定→集団規定（道路・用途・建蔽率・容積率・高さ・防火）の順に整理し、数字と例外を押さえる。","tree":[{"h":"建築確認","items":["1号：特殊建築物で用途200㎡超","新2号：階数2以上又は延べ200㎡超","新3号：平屋かつ200㎡以下（区域内のみ）","防火・準防火外の10㎡以内増改築等は不要","200㎡超の特殊建築物への用途変更は必要"]},{"h":"単体規定","items":["高さ20m超：避雷設備","高さ31m超：非常用の昇降機","住宅居室の採光1/7以上（照明等で1/10可）","換気に有効な開口は床面積の1/20以上","石綿添加建材は原則使用禁止"]},{"h":"道路・接道","items":["道路は幅員4m以上（指定区域は6m）","敷地は道路に2m以上接する","2項道路は中心線から2m後退","道路内には原則建築不可（地下等除く）"]},{"h":"用途制限","items":["敷地の過半が属する地域の制限を適用","神社・診療所・保育所等は全地域で可","住宅は工業専用地域のみ不可","大学・病院は低層系・田園・工業・工専で不可"]},{"h":"建蔽率・容積率","items":["防火内の耐火等・準防火内の準耐火等+1/10","角地+1/10、両方で+2/10","8/10地域・防火内の耐火等は制限なし","前面道路12m未満は幅員×4/10又は6/10","敷地が地域にまたがれば加重平均"]},{"h":"高さ・防火","items":["低層住専・田園：絶対高さ10m又は12m","北側斜線：低層・田園・中高層住専","日影規制：商業・工業・工専は対象外","防火地域：3階以上又は100㎡超は耐火等","準防火：4階以上又は1,500㎡超は耐火等"]}],"flow":{"title":"建築確認〜使用開始","steps":["建築主事等に確認申請","確認済証の交付（35日／7日以内）","着工（特定工程は中間検査）","工事完了から4日以内に完了検査申請","受理から7日以内に検査","検査済証の交付","1号・2号は検査済証後に使用開始"]},"tables":[{"title":"2025年改正後の確認対象","head":["区分","範囲","確認が必要な行為"],"rows":[["1号","特殊建築物200㎡超","全国：新築・増改築・大規模修繕等"],["新2号","階数2以上又は延べ200㎡超","全国：新築・増改築・大規模修繕等"],["新3号","平屋かつ延べ200㎡以下","区域内：新築・増改築・移転"],["用途変更","200㎡超の特殊建築物へ","類似用途間は不要"]]},{"title":"主な用途制限","head":["建築物","建築できない地域"],"rows":[["神社・寺院・診療所・保育所","なし（全地域で可）"],["住宅・共同住宅","工業専用地域"],["小・中・高校","工業・工業専用"],["大学・病院","一低・二低・田園・工業・工専"],["ホテル・旅館","一低〜二中高・田園・工業・工専"],["映画館（客席200㎡未満）","一低〜二住・田園・工業・工専"],["映画館（客席200㎡以上）","近商・商業・準工以外"]]},{"title":"建蔽率の緩和","head":["条件","緩和"],"rows":[["防火地域内の耐火建築物等","+1/10"],["準防火地域内の耐火・準耐火等","+1/10"],["特定行政庁指定の角地","+1/10"],["上記の防火系＋角地","+2/10"],["8/10地域かつ防火内の耐火等","制限なし"]]}]}},"法令|盛土規制法":{"pts":["宅地造成等工事規制区域・特定盛土等規制区域は都道府県知事（指定都市・中核市はその長）が基礎調査をもとに指定する。","宅地造成等工事規制区域内で一定規模の宅地造成・特定盛土等・土石の堆積を行う工事主は、着手前に知事の許可を受けなければならない。","許可対象は、盛土で高さ1m超の崖、切土で高さ2m超の崖、盛土切土合わせ高さ2m超の崖、盛土で高さ2m超、面積500㎡超など。","許可申請前に、工事主は周辺住民へ説明会の開催等の周知措置を講じなければならない。許可後は工事現場に標識を掲示する。","特定盛土等規制区域内では一定規模の工事は着手日の30日前までに知事へ届出が必要。大規模な工事は許可が必要となる。","宅地造成等工事規制区域内で高さ2m超の擁壁・排水施設等の除却工事を行う者は、許可不要の場合でも着手日の14日前までに知事へ届け出る。","規制区域内の土地の所有者・管理者・占有者は、災害が生じないよう常時安全な状態に維持するよう努めなければならない。"],"traps":["「造成宅地防災区域は宅地造成等工事規制区域内にも指定できる」と出たら×。規制区域内の土地には指定できない。","「周知措置は工事着手後に行えばよい」と出たら×。許可申請の前にあらかじめ講じなければならない。","「規制区域外の盛土にも盛土規制法の届出が必要」と出たら×。規制区域・特定盛土等規制区域の外では許可も届出も不要。"],"rel":["法令|開発許可","法令|農地法"],"bridge":"規制区域内で都市計画法の開発許可を受けた工事は盛土規制法の許可を受けたものとみなされる。農地での盛土も宅地造成等の対象となり得て、農地転用許可とは別に許可が問題となる。","sys":{"overview":"旧宅地造成等規制法を改正・改称し2023年5月に施行された法律。規制区域の指定（2種類）→許可・届出が必要な規模→許可手続と検査→その他の届出→監督・造成宅地防災区域の順に整理し、数字と届出期限を押さえる。","tree":[{"h":"区域の指定","items":["指定権者：知事（指定都市・中核市は市長）","宅地造成等工事規制区域：市街地・集落等","特定盛土等規制区域：上記以外で危険な区域","造成宅地防災区域：宅造工事規制区域外","基礎調査の立入り損失は都道府県が補償"]},{"h":"対象行為","items":["宅地造成：宅地以外を宅地にする造成","特定盛土等：宅地・農地等での盛土等","土石の堆積：一定期間の仮置き","農地・森林での盛土も対象になり得る"]},{"h":"規制区域","items":["一定規模以上は着手前に知事の許可","申請前に周辺住民へ説明会等の周知","許可後は現場に標識を掲示","開発許可を受ければ許可を受けたものとみなす"]},{"h":"特定盛土区域","items":["一定規模は着手30日前までに知事へ届出","大規模（高さ5m超等）は許可","許可後の手続は規制区域と同様"]},{"h":"その他の届出","items":["区域指定時に工事中：指定日から21日以内","2m超の擁壁・排水施設の除却：14日前","公共施設用地を宅地に転用：14日以内"]},{"h":"監督・義務","items":["所有者・管理者・占有者は安全維持の努力義務","知事は所有者等に勧告・改善命令","原因行為者にも改善命令を出せる","知事は規則で技術的基準を強化・付加可"]}],"flow":{"title":"許可〜完了検査","steps":["周辺住民へ説明会等の周知措置","知事へ許可申請","許可（条件付けも可）","現場に標識を掲示して着工","特定工程の中間検査・定期報告","完了後に完了検査を申請","検査済証の交付"]},"tables":[{"title":"許可・届出が必要な規模","head":["行為","規制区域：許可","特定盛土区域：許可"],"rows":[["盛土で生じる崖","高さ1m超","高さ2m超"],["切土で生じる崖","高さ2m超","高さ5m超"],["盛土＋切土の崖","高さ2m超","高さ5m超"],["崖を生じない盛土","高さ2m超","高さ5m超"],["盛土・切土の面積","500㎡超","3,000㎡超"],["土石の堆積","2m超かつ300㎡超／500㎡超","5m超かつ1,500㎡超／3,000㎡超"]]},{"title":"届出の期限","head":["場面","期限","届出先"],"rows":[["特定盛土区域の中規模工事","着手30日前まで","知事"],["区域指定時に工事中","指定日から21日以内","知事"],["2m超擁壁・排水施設の除却","着手14日前まで","知事"],["公共施設用地→宅地転用","転用から14日以内","知事"]]},{"title":"区域の違い","head":["項目","規制区域","特定盛土区域"],"rows":[["対象地","市街地・集落等","それ以外の危険区域"],["中規模工事","許可","届出（30日前）"],["大規模工事","許可","許可"],["区域外","許可・届出とも不要","許可・届出とも不要"]]}]}},"法令|土地区画整理法":{"pts":["施行者は個人・組合・区画整理会社・地方公共団体・国土交通大臣・機構等。組合設立には7人以上で定款・事業計画を定め知事の認可が必要。","組合施行区域内の宅地の所有者・借地権者はすべて組合員となる。未登記の借地権は施行者への申告がなければ存在しないものとみなす。","事業計画の決定等の公告後、換地処分公告までの間、施行区域内で建築や土地の形質変更等をするには知事等（市の区域内は市長）の許可が必要。","仮換地指定の効力発生日から換地処分公告の日まで、従前の宅地の権利者は仮換地を従前と同じ内容で使用収益でき、従前の宅地は使用できない。","仮換地の使用収益開始日を別に定めることができ、そのため使用収益できず損失を受けた者には施行者が損失補償する。","換地処分は関係権利者に換地計画で定めた事項を通知して行い、公告日の終了時に仮換地指定の効力が消滅し、翌日に換地が従前の宅地とみなされる。","清算金と保留地の取得は換地処分公告の翌日に確定・効力発生する。換地処分後は施行者が遅滞なく登記所に通知し換地処分の登記を行う。"],"traps":["「施行区域内の建築行為は施行者の許可を受ける」と出たら×。許可権者は知事等（市の区域内は市長）で、施行者ではない。","「組合施行の仮換地指定には土地区画整理審議会の意見を聴く」と出たら×。組合施行は総会等の同意で、審議会は公的施行の場合。","「清算金は換地処分後に土地を買った者に当然承継される」と出たら×。換地処分時の所有者との間で確定する。"],"rel":["法令|都市計画法","法令|開発許可"],"bridge":"土地区画整理事業は都市計画で定める市街地開発事業の一つで、施行区域は都市計画法で決まる。その施行として行う開発行為は区域・規模を問わず開発許可が不要となる。","sys":{"overview":"都市計画で定める市街地開発事業の一つ。施行者と組合→建築行為等の制限→換地計画→仮換地→換地処分とその効果→登記の順に事業の時間軸で整理し、許可権者と効果の発生時点を押さえる。","tree":[{"h":"施行者","items":["個人・組合・区画整理会社（民間施行）","都道府県・市町村・大臣・機構等（公的施行）","組合：7人以上で定款・事業計画、知事認可","設立は所有者・借地権者の各2/3以上同意","組合員：区域内の所有者・借地権者全員"]},{"h":"建築等制限","items":["事業計画等の公告〜換地処分公告まで","建築・形質変更・重量物設置等が対象","許可権者は知事（市の区域は市長）","施行者の許可ではない点に注意"]},{"h":"換地計画","items":["照応の原則：位置・地積・環境等が照応","保留地：事業費に充てる土地","清算金で不均衡を金銭調整","公的施行は審議会の意見を聴く"]},{"h":"仮換地","items":["指定は書面通知、効力発生日を定める","権利者は仮換地を従前同様に使用収益","従前の宅地は使用収益できない","使用収益開始日を別に定められる（補償あり）","組合施行は総会等の同意、公的は審議会"]},{"h":"換地処分","items":["権利者に換地計画の事項を通知して行う","原則は工事全部の完了後","公告日の終了時：仮換地の効力消滅","公告の翌日：換地が従前の宅地とみなされる","翌日：清算金確定・保留地を施行者取得"]},{"h":"登記","items":["施行者が遅滞なく登記所へ通知","施行者が換地処分の登記を申請・嘱託","登記完了まで原則他の登記不可"]}],"flow":{"title":"土地区画整理事業の流れ","steps":["組合設立認可・事業計画決定の公告","施行地区内の建築等は知事等の許可制","換地計画の作成・認可","仮換地の指定（効力発生日に使用開始）","工事の実施","換地処分の通知→知事が公告","公告翌日に換地確定・換地処分の登記"]},"tables":[{"title":"換地処分公告の効果","head":["時点","効果"],"rows":[["公告日の終了時","仮換地指定の効力が消滅"],["公告日の終了時","換地を定めない従前地の権利消滅"],["公告日の翌日","換地が従前の宅地とみなされる"],["公告日の翌日","清算金が確定"],["公告日の翌日","保留地を施行者が取得"],["公告日の翌日","公共施設は原則市町村管理"]]},{"title":"施行者による違い","head":["項目","組合施行","公的施行"],"rows":[["根拠","定款・事業計画","施行規程・事業計画"],["仮換地指定の手続","総会等の同意","審議会の意見"],["施行場所","都市計画区域内","施行区域内（都市計画事業）"],["建築制限の許可権者","知事等","知事等（大臣施行は大臣）"]]},{"title":"仮換地指定の効果","head":["土地","使用収益できる者"],"rows":[["仮換地","従前の宅地の権利者"],["従前の宅地","権利者は不可（施行者が管理）"],["仮換地の元の権利者","効力発生日から使用不可"],["開始日を別に定めた場合","損失は施行者が補償"]]}]}},"法令|農地法":{"pts":["農地か否かは登記簿上の地目でなく現況で判断する。一時的に耕作していない休耕地も農地に当たる。","3条（権利移動）は農業委員会、4条（転用）・5条（転用目的の権利移動）は知事等（指定市町村は市町村長）の許可が必要。","相続・遺産分割・相続人への特定遺贈は許可不要だが、農業委員会への届出が必要。相続人以外への特定遺贈は3条許可が必要。","市街化区域内の農地は、あらかじめ農業委員会に届け出れば4条・5条許可が不要。3条にはこの特例はない。","2アール未満の農業用施設への自己転用は4条許可不要。国・都道府県等の一定の転用は協議成立で許可があったものとみなす。","許可のない権利移動・転用目的の権利移動は効力を生じない。違反転用者・工事請負人等に原状回復等を命じられる。","農地の賃貸借は引渡しで対抗でき、解除・解約申入れ等には原則知事の許可が必要。適格法人以外の法人も一定要件で借りられる。"],"traps":["「市街化区域内なら3条の権利移動も届出で足りる」と出たら×。市街化区域の届出特例は4条・5条のみ。","「登記簿の地目が山林なら耕作していても農地法の適用はない」と出たら×。現況で判断する。","「相続人以外への特定遺贈も許可不要」と出たら×。相続人以外への特定遺贈は3条許可が必要。"],"rel":["法令|国土利用計画法","法令|都市計画法"],"bridge":"農地法3条許可を受ける場合は国土法の事後届出が不要。市街化区域では4条・5条許可に代えて届出で足り、都市計画の区域区分が手続を左右する。","sys":{"overview":"農地・採草放牧地の権利移動と転用を規制する法律。農地の判定（現況主義）→3条・4条・5条の許可と例外→市街化区域の届出特例→違反の効果→賃貸借の保護の順に、3つの条文を比較で押さえる。","tree":[{"h":"農地の判定","items":["登記地目でなく現況で判断","休耕地も農地に当たる","採草放牧地：3条・5条の対象、4条は対象外","家庭菜園は農地に当たらない"]},{"h":"3条 権利移動","items":["許可権者：農業委員会","相続・遺産分割・相続人への特定遺贈は不要","相続等で取得した者は農業委員会へ届出","市街化区域の届出特例はない","下限面積要件は2023年4月に廃止"]},{"h":"4条 転用","items":["許可権者：知事（指定市町村は市町村長）","2a未満の農業用施設への転用は不要","国・都道府県等は協議成立で許可みなし","市街化区域：事前に農業委員会へ届出"]},{"h":"5条 転用目的","items":["転用目的の権利移動・設定が対象","許可権者は4条と同じ","市街化区域：事前届出で許可不要","許可がなければ契約は効力を生じない"]},{"h":"違反・罰則","items":["3条・5条違反の契約は無効","違反転用には原状回復等の命令","命令は工事請負人・下請人にも可","法人の4・5条違反は1億円以下の罰金"]},{"h":"賃貸借","items":["引渡しで第三者に対抗可（使用貸借は不可）","解除・解約申入れ等は原則知事の許可","一般法人も一定要件で借りられる","抵当権の設定は許可不要"]}],"flow":{"title":"5条転用許可の流れ","steps":["市街化区域内なら農業委員会へ事前届出","区域外は農業委員会経由で知事等に申請","農業委員会が意見を付して送付","知事等が許可・不許可を判断","許可後に契約が効力を生じ転用可能"]},"tables":[{"title":"3条・4条・5条の比較","head":["項目","3条","4条","5条"],"rows":[["内容","権利移動","自己転用","転用目的の権利移動"],["許可権者","農業委員会","知事等","知事等"],["市街化区域の特例","なし","事前届出","事前届出"],["無許可の効果","無効","原状回復等","無効・原状回復等"],["採草放牧地","対象","対象外","対象"]]},{"title":"許可不要となる主な場面","head":["場面","3条","4条・5条"],"rows":[["相続・遺産分割","○不要（届出）","—"],["相続人以外への特定遺贈","×必要","—"],["2a未満の農業用施設","—","4条のみ不要"],["国・都道府県等","○不要","協議成立でみなし"],["土地収用","○不要","○不要"],["抵当権の設定","○不要","—"]]},{"title":"罰則","head":["違反","個人","法人"],"rows":[["3条違反","3年以下拘禁刑又は300万円以下","300万円以下の罰金"],["4条・5条違反","3年以下拘禁刑又は300万円以下","1億円以下の罰金"]]}]}},"法令|国土利用計画法":{"pts":["事後届出は、土地売買等の契約を締結した権利取得者（買主等）が、契約締結日から起算して2週間以内に市町村長経由で知事に行う。","届出対象面積は、市街化区域2,000㎡以上、その他の都市計画区域5,000㎡以上、都市計画区域外10,000㎡以上。","土地売買等の契約は対価を得て所有権・地上権・賃借権を移転・設定する契約で、予約や交換も含む。贈与・相続・無償の賃借は対象外。","買主側が一団の土地を取得する場合は合計面積で判断する（買いの一団）。個々の契約が小さくても合計が基準以上なら届出必要。","当事者の一方又は双方が国・地方公共団体等の場合、民事調停による場合、農地法3条許可を受ける場合などは事後届出不要。","届出事項には対価の額も含むが、知事の勧告は土地の利用目的についてのみ行い、届出から3週間以内にする。","勧告に従わないと公表されることがあるが契約は有効。無届は6か月以下の拘禁刑又は100万円以下の罰金の対象（契約は有効）。"],"traps":["「売主と買主が共同で事後届出をする」と出たら×。届出義務者は権利取得者（買主等）のみで、売主に義務はない。","「勧告に従わなければ契約は無効」と出たら×。公表されることがあるだけで、無届・勧告不服従でも契約は有効。","「対価の額が著しく不適正なら勧告できる」と出たら×。事後届出の勧告は利用目的についてのみ。"],"rel":["法令|農地法","法令|都市計画法"],"bridge":"事後届出の対象面積は都市計画法の区域区分（市街化区域・その他の区域・区域外）で決まる。農地法3条許可を受ける取引は国土法の事後届出が不要となる。","sys":{"overview":"大規模な土地取引を届出・許可で監視する法律。試験の中心は事後届出で、土地売買等の契約の範囲→届出対象面積（区域区分で決まる）→届出不要の例外→勧告と効果の順に押さえる。事前届出・許可制は概要でよい。","tree":[{"h":"制度の全体","items":["原則：事後届出制","注視区域・監視区域：事前届出制","規制区域：許可制（不許可は買取請求）","監視区域は規則で届出面積を引下げ可"]},{"h":"売買等の契約","items":["所有権・地上権・賃借権の移転・設定","対価があることが要件","売買・交換・予約・代物弁済は該当","贈与・相続・時効・抵当権設定は非該当"]},{"h":"届出面積","items":["市街化区域：2,000㎡以上","その他の都市計画区域：5,000㎡以上","都市計画区域外：1ha以上","買主側の一団の土地は合計で判断"]},{"h":"届出手続","items":["届出者は権利取得者（買主等）のみ","契約締結日から2週間以内","市町村長を経由して知事へ","対価の額・利用目的等を届出"]},{"h":"届出不要","items":["当事者の一方又は双方が国・地方公共団体等","民事調停による契約","農地法3条許可を受ける場合","面積が基準未満・対価なし"]},{"h":"勧告・効果","items":["勧告は利用目的についてのみ","届出から3週間以内（延長可）","不服従は公表されることがある","無届・不服従でも契約は有効","無届は6月以下拘禁刑又は100万円以下罰金"]}],"flow":{"title":"事後届出の流れ","steps":["土地売買等の契約を締結","2週間以内に権利取得者が届出","市町村長を経由して知事へ","知事が利用目的を審査","3週間以内に勧告又は助言","不服従なら公表（契約は有効）"]},"tables":[{"title":"事後届出の対象面積","head":["区域","届出が必要な面積"],"rows":[["市街化区域","2,000㎡以上"],["市街化調整区域","5,000㎡以上"],["非線引都市計画区域","5,000㎡以上"],["準都市計画区域","1ha以上"],["都市計画区域外","1ha以上"]]},{"title":"土地売買等の契約か","head":["取引","該当"],"rows":[["売買・売買の予約","○"],["交換（差金なしでも）","○"],["対価ある地上権・賃借権設定","○"],["贈与・相続・遺産分割","×"],["無償の賃借・使用貸借","×"],["抵当権・質権の設定","×"],["時効取得","×"]]},{"title":"事後届出と事前届出","head":["項目","事後届出","事前届出"],"rows":[["区域","注視・監視・規制区域以外","注視区域・監視区域"],["届出者","権利取得者のみ","当事者双方"],["時期","契約後2週間以内","契約前"],["勧告の対象","利用目的のみ","対価の額・利用目的"],["一団の判定","買主側のみ","売主・買主双方"],["勧告の期限","届出から3週間以内","届出から6週間以内"]]}]}},"税他|不動産取得税・固定資産税":{"pts":["不動産取得税は都道府県が不動産の取得者に課す。有償・無償や登記の有無を問わず、家屋の改築で価格が増加した場合も課税。","相続・法人の合併・共有物分割（持分を超えない部分）などの形式的な移転は非課税。国・地方公共団体等には課税できない。","不動産取得税の課税標準は固定資産課税台帳の価格。免税点（2026年4月1日以後の取得）は土地16万円、家屋は建築1戸66万円・その他1戸34万円未満。","固定資産税は市町村が1月1日（賦課期日）時点の固定資産課税台帳上の所有者に課す。年の途中で売却しても納税義務者は変わらない。","質権者・100年より長い存続期間の地上権者は、所有者に代わり固定資産税の納税義務者となる。賃借人は納税義務者にならない。","住宅用地の課税標準は、200㎡以下の小規模住宅用地は価格の1/6、それを超える部分は1/3とする特例がある。","いずれも普通徴収（納税通知書）。固定資産税の納期は原則4月・7月・12月・2月中で、特別の事情があれば条例で別に定められる。"],"traps":["「不動産取得税は申告納付である」と出たら×。不動産取得税・固定資産税とも普通徴収。","「相続による取得にも不動産取得税が課される」と出たら×。相続は形式的移転で非課税。贈与・交換は課税。","「4月1日の所有者に固定資産税が課される」と出たら×。賦課期日は1月1日で、その時点の所有者に課す。"],"rel":["税他|印紙税・登録免許税","税他|地価公示・鑑定評価"],"bridge":"不動産取得税・固定資産税・登録免許税はいずれも固定資産課税台帳の価格を課税標準の基礎にする。地価公示価格とは別の評価制度である。","sys":{"overview":"地方税のうち不動産に関わる2税。不動産取得税（都道府県・取得時に1回）と固定資産税（市町村・毎年1月1日の所有者）を、課税主体→納税義務者→非課税→課税標準と特例→税率・免税点→徴収の順で比較して押さえる。","tree":[{"h":"不取：課税","items":["都道府県が不動産の取得者に課す","有償・無償、登記の有無を問わない","改築で価格増加した場合も課税","新築家屋は最初の使用・譲渡時に取得とみなす","未使用で6か月経過でも取得とみなす（業者1年）"]},{"h":"不取：非課税","items":["相続・法人の合併等の形式的移転","共有物分割（持分を超えない部分）","国・地方公共団体等の取得","贈与・交換・売買は課税"]},{"h":"不取：計算","items":["課税標準：固定資産課税台帳の価格","宅地等の課税標準1/2（2027年3月まで）","新築住宅は1,200万円控除（50〜240㎡）","税率：本則4%、土地・住宅3%（同上）","免税点：土地16万・家屋建築66万・他34万円"]},{"h":"固：課税","items":["市町村が課す（東京23区は都）","1月1日時点の台帳上の所有者に課税","年途中で売却しても納税義務者は不変","質権者・100年超の地上権者が納税義務者","賃借人は納税義務者にならない"]},{"h":"固：計算","items":["課税標準：台帳価格（3年ごと評価替え）","住宅用地200㎡以下は1/6、超部分1/3","標準税率1.4%","免税点：土地30万・家屋20万円","新築住宅は3年度（中高層耐火5年度）1/2"]},{"h":"徴収・不服","items":["両税とも普通徴収（納税通知書）","固定資産税の納期：4・7・12・2月","特別の事情があれば条例で別の納期","価格の不服は固定資産評価審査委員会"]}],"flow":null,"tables":[{"title":"2税の比較","head":["項目","不動産取得税","固定資産税"],"rows":[["課税主体","都道府県","市町村"],["課税時期","取得時に1回","毎年（賦課期日1月1日）"],["納税義務者","取得者","1月1日の台帳所有者"],["課税標準","台帳価格","台帳価格"],["税率","4%（土地・住宅3%）","標準1.4%"],["免税点（土地）","16万円未満","30万円未満"],["免税点（家屋）","建築66万・他34万円未満","20万円未満"],["徴収方法","普通徴収","普通徴収"]]},{"title":"主な特例","head":["特例","内容"],"rows":[["不取：宅地等","課税標準×1/2"],["不取：新築住宅","1,200万円控除（50〜240㎡）"],["不取：住宅用土地","税額から一定額を減額"],["固：小規模住宅用地","200㎡以下は価格×1/6"],["固：一般住宅用地","200㎡超部分は価格×1/3"],["固：新築住宅","120㎡まで税額1/2（3年度・中高層5年度）"]]},{"title":"不動産取得税の課否","head":["取得の原因","課税"],"rows":[["売買・交換","○"],["贈与","○"],["家屋の新築・増改築","○"],["相続・法人の合併","×"],["共有物分割（持分内）","×"],["国・地方公共団体の取得","×"]]}]}},"税他|印紙税・登録免許税":{"pts":["不動産の譲渡契約書、地上権・土地賃借権の設定・譲渡契約書、請負契約書、金銭消費貸借契約書は課税文書。建物賃貸借契約書は非課税。","契約の成立を証する文書なら仮契約書・覚書も課税文書。同一内容で複数作成すれば、仲介人保存分も含め各通が課税される。","土地賃借権設定の記載金額は権利金等の返還されない金額で、賃料・敷金は含まない。贈与契約書は記載金額のない文書となる。","国等と私人が共同作成した文書は、私人が保存するものは国等が作成したものとみなされ非課税、国等が保存するものは課税。","印紙の貼付漏れは過怠税（原則納付すべき額の3倍、自主的申出で1.1倍）。消印のない場合も過怠税が課される。","登録免許税は登記を受ける者が連帯して納付する。不動産の課税標準は登記時の価額で、固定資産課税台帳の価格を基礎とする。","住宅用家屋の軽減税率特例は、個人が自己居住用に取得し床面積50㎡以上、取得後1年以内の登記等が要件。敷地の土地には適用されない。"],"traps":["「建物の賃貸借契約書は印紙税の課税文書」と出たら×。課税文書となるのは土地の賃借権設定契約書で、建物賃貸借は非課税。","「住宅用家屋の所有権移転登記の軽減は贈与・相続でも適用」と出たら×。売買又は競落による取得に限られる。","「減額の変更契約書は減額後の金額が記載金額」と出たら×。減額の変更契約書は記載金額のない文書となる。"],"rel":["税他|不動産取得税・固定資産税","権利|不動産登記法"],"bridge":"登録免許税は登記という手続にかかる国税で、不動産取得税は取得にかかる地方税。課税標準は同じく固定資産課税台帳の価格を基礎とする。","sys":{"overview":"いずれも不動産取引に伴う国税。印紙税は契約書等の文書に、登録免許税は登記に課される。課税文書の範囲と記載金額の決め方、登録免許税の課税標準と住宅用家屋の軽減要件が得点源。","tree":[{"h":"印紙税の対象","items":["不動産譲渡契約書・地上権/土地賃借権の設定譲渡","請負契約書・金銭消費貸借契約書","売上代金の受取書（5万円未満は非課税）","建物賃貸借・抵当権設定の契約書は課税対象外","仮契約書・覚書・変更契約書も課税対象"]},{"h":"記載金額","items":["土地賃借権設定は返還されない権利金等","賃料・敷金・保証金は含めない","贈与・減額変更は記載金額のない文書(200円)","増額変更は増加額が記載金額","交換は高い方の価額（差金のみ記載なら差金）"]},{"h":"納税義務者等","items":["課税文書の作成者（共同作成は連帯納付）","国等と私人の共同作成は私人保存分が非課税","同一内容の複数通は各通が課税（仲介人分も）","消費税額の区分記載があれば税抜額で判定"]},{"h":"納付・過怠税","items":["印紙を貼付し消印して納付","貼付漏れは納付額の3倍（本来分含む）","自主的申出なら1.1倍","消印漏れは消印のない印紙の額面相当"]},{"h":"登録免許税","items":["登記を受ける者が連帯して納付する国税","課税標準は固定資産課税台帳の価格が基礎","抵当権設定の課税標準は債権金額","本則：売買移転2%・相続0.4%・保存0.4%","土地の売買移転は1.5%（2029年3月まで）"]},{"h":"住宅用家屋軽減","items":["個人が自己居住用に新築・取得","床面積50㎡以上","新築・取得後1年以内に登記","移転は売買・競落のみ（贈与・交換不可）","敷地の土地には適用なし","適用期限は2027年3月31日まで"]}],"flow":{"title":"印紙税の判定手順","steps":["契約の成立・変更を証する文書か確認","課税文書の号別（譲渡・請負等）を判定","非課税文書・国等の作成文書か確認","記載金額を決める（権利金・増加額等）","税額表で税額を確認（金額なしは200円）","印紙を貼付し消印する"]},"tables":[{"title":"文書ごとの課税関係","head":["文書","課税","記載金額"],"rows":[["土地売買契約書","○","売買金額"],["土地賃借権設定契約書","○","権利金等（賃料除く）"],["建物賃貸借契約書","×","―"],["贈与契約書","○","記載金額なし(200円)"],["増額の変更契約書","○","増加額"],["減額の変更契約書","○","記載金額なし"],["交換契約書","○","高い方の価額"],["抵当権設定契約書","×","―"]]},{"title":"登録免許税の税率","head":["登記","本則","住宅用家屋の軽減"],"rows":[["所有権保存","0.4%","0.15%"],["売買による移転","2%","0.3%"],["土地の売買による移転","2%","適用なし（土地特例1.5%）"],["相続による移転","0.4%","適用なし"],["贈与・交換による移転","2%","適用なし"],["抵当権設定","0.4%","0.1%"]]},{"title":"住宅用家屋軽減の要件","head":["要件","内容"],"rows":[["取得者","個人のみ"],["用途","自己の居住用"],["床面積","50㎡以上"],["登記時期","新築・取得後1年以内"],["取得原因(移転)","売買・競落のみ"],["中古住宅","新耐震基準適合が必要"],["対象","家屋のみ（土地×）"]]}]}},"税他|所得税・譲渡":{"pts":["譲渡所得は譲渡した年の1月1日時点で所有期間5年超なら長期、5年以下なら短期。相続・贈与では被相続人等の取得費・取得時期を引き継ぐ。","取得費には購入代金のほか設備費・改良費を含む。営利目的で継続的に行う譲渡は事業所得又は雑所得となる。","居住用財産の3,000万円特別控除は所有期間を問わない。配偶者・直系血族・生計を一にする親族等への譲渡には適用されない。","居住しなくなった日から3年を経過する日の属する年の12月31日までの譲渡なら適用可。前年・前々年に同特例等を受けていると不可。","所有期間10年超の居住用財産は、3,000万円控除後の金額に軽減税率の特例を併用できる。収用等の5,000万円控除後も同様。","居住用財産の譲渡損失の損益通算・繰越控除の特例は、住宅ローン控除と併用することができる。","居住年等に3,000万円控除や軽減税率の特例などを受けると、住宅ローン控除は適用されない。"],"traps":["「同居していない配偶者への譲渡なら3,000万円控除を受けられる」と出たら×。配偶者・直系血族への譲渡は同居の有無を問わず不可。","「所有期間は譲渡日現在で判定する」と出たら×。長期・短期は譲渡した年の1月1日現在の所有期間で判定する。","「3,000万円特別控除は所有期間10年超が要件」と出たら×。所有期間要件はなく、10年超が要件なのは軽減税率の特例。"],"rel":["権利|相続","税他|不動産取得税・固定資産税"],"bridge":"相続で取得した不動産は被相続人の取得費・取得時期を引き継ぎ、長期・短期の判定もそれによる。不動産取得税は取得時に、所得税は譲渡益に課される。","sys":{"overview":"所得税のうち不動産の譲渡益に課される分離課税の譲渡所得が出題の中心。長期・短期の判定、取得費、居住用財産の特例（3,000万円控除・軽減税率・買換え・譲渡損失）の要件と併用関係を押さえれば得点できる。","tree":[{"h":"所得区分","items":["土地建物の譲渡は分離課税の譲渡所得","営利目的の継続的譲渡は事業所得・雑所得","借地権設定の権利金が土地価額の1/2超→譲渡所得","別荘等の災害損失はその年・翌年の譲渡所得から控除"]},{"h":"長期と短期","items":["譲渡年の1月1日で所有期間5年超→長期","5年以下→短期","相続・贈与は取得時期・取得費を引き継ぐ","長期：所得税15%＋住民税5%","短期：所得税30%＋住民税9%"]},{"h":"計算","items":["譲渡収入−(取得費＋譲渡費用)−特別控除","取得費に設備費・改良費を含む","取得費は収入金額の5%（概算）でも可","譲渡損失は原則他の所得と通算不可"]},{"h":"居住用の特例","items":["3,000万円特別控除（所有期間不問）","10年超所有の軽減税率（6,000万円以下部分）","買換え特例（2027年12月までの譲渡）","譲渡損失の損益通算・繰越控除（3年）","収用等は5,000万円特別控除"]},{"h":"適用除外","items":["配偶者・直系血族への譲渡は不可","生計を一にする親族・同族会社等も不可","前年・前々年に同特例を受けていると不可","居住しなくなって3年目の年末まで適用可"]},{"h":"併用関係","items":["3,000万円控除＋軽減税率は併用○","3,000万円控除と買換え特例は選択","譲渡損失の特例＋住宅ローン控除は併用○","3,000万円等を受けると住宅ローン控除×"]}],"flow":{"title":"譲渡所得の計算手順","steps":["所得区分を判定（譲渡か事業・雑か）","1月1日時点の所有期間で長期・短期を判定","譲渡収入金額を確定する","取得費（不明なら5%）と譲渡費用を控除","特別控除（3,000万円等）を差し引く","税率を適用（軽減税率の可否を確認）"]},"tables":[{"title":"居住用財産の特例比較","head":["特例","所有期間","主な要件"],"rows":[["3,000万円控除","不問","親族等への譲渡は不可"],["軽減税率","10年超","3,000万円控除と併用可"],["買換え特例","10年超","居住10年以上・1億円以下"],["譲渡損失の特例","5年超","住宅ローン控除と併用可"],["収用5,000万円控除","不問","軽減税率と併用可"]]},{"title":"税率の整理","head":["区分","所得税","住民税"],"rows":[["短期（5年以下）","30%","9%"],["長期（5年超）","15%","5%"],["軽減（6,000万以下）","10%","4%"],["軽減（6,000万超）","15%","5%"]]},{"title":"住宅ローン控除との関係","head":["譲渡側の特例","ローン控除"],"rows":[["3,000万円特別控除","×"],["軽減税率の特例","×"],["買換え特例","×"],["譲渡損失の損益通算・繰越","○"]]}]}},"税他|地価公示・鑑定評価":{"pts":["土地鑑定委員会が都市計画区域その他の公示区域内の標準地について、毎年1月1日の正常な価格を判定し官報で公示する。","標準地は自然的・社会的条件からみて類似する地域で、土地の利用状況・環境等が通常と認められる一団の土地から選定する。","正常な価格の判定は2人以上の不動産鑑定士の鑑定評価を求めて行う。建物や地上権等があっても存しないものとして（更地として）求める。","公示事項は所在地、単位面積当たりの価格、価格判定の基準日、地積・形状、周辺の状況等。総額は公示しない。","不動産鑑定士は公示区域内の土地の鑑定評価で公示価格を規準としなければならない。一般の土地取引は指標とするよう努める。","鑑定評価は原価法・取引事例比較法・収益還元法を併用する。原価法は造成地・埋立地等の土地にも適用できる。","価格は正常価格・限定価格・特定価格・特殊価格に分かれる。特殊価格は文化財等の市場性を有しない不動産の価格。"],"traps":["「標準地の公示価格は総額で公示される」と出たら×。公示されるのは単位面積当たりの価格。","「地上権が設定された土地は標準地に選定できない」と出たら×。選定でき、価格は地上権が存しないものとして求める。","「原価法は土地には適用できない」と出たら×。再調達原価を適切に求められる造成地・埋立地には適用できる。"],"rel":["税他|不動産取得税・固定資産税","法令|国土利用計画法"],"bridge":"地価公示は土地取引の指標となる正常価格で、固定資産税等の評価額とは別の制度。国土法の事後届出の対価は届出事項だが、勧告対象は利用目的のみ。","sys":{"overview":"地価公示法と不動産鑑定評価基準から1問。土地鑑定委員会が毎年1月1日の正常な価格を公示する流れと公示事項、鑑定評価の3手法と価格の種類・価格原則を押さえれば得点できる。","tree":[{"h":"地価公示の主体","items":["土地鑑定委員会（国土交通省に置かれる）","公示区域：都市計画区域その他の区域","国土法の規制区域は除く","基準日は毎年1月1日"]},{"h":"標準地の選定","items":["自然的・社会的条件が類似する地域","利用状況・環境等が通常と認められる土地","地上権等があっても選定可能"]},{"h":"正常な価格","items":["2人以上の不動産鑑定士の鑑定評価","自由な取引で通常成立する価格","建物・地上権等は存しないものとして算定","公示は単位面積当たりの価格（総額×）"]},{"h":"公示の効力","items":["一般の土地取引：指標とするよう努める","不動産鑑定士：公示価格を規準とする義務","公共事業用地の取得価格も規準とする"]},{"h":"鑑定評価手法","items":["原価法→積算価格（造成地等の土地も可）","取引事例比較法→比準価格","収益還元法→収益価格（自用不動産も可）","複数手法を併用するのが原則"]},{"h":"価格の種類","items":["正常価格：通常の市場価格","限定価格：隣地併合など市場が限定","特定価格：証券化・早期売却など","特殊価格：文化財等、市場性なし"]},{"h":"価格の諸原則","items":["最有効使用：最も効果的な使い方を前提","変動・予測：価格は常に変動し将来を予測","代替・競争：代わりの物件と比べて決まる","適合・均衡：環境との適合、内部の均衡"]}],"flow":{"title":"地価公示の流れ","steps":["土地鑑定委員会が標準地を選定","2人以上の不動産鑑定士が鑑定評価","委員会が審査・調整し1月1日の価格を判定","所在地・単位面積当たり価格等を官報で公示","関係市町村長に書面・図面を送付","市町村の事務所で一般の閲覧に供する"]},"tables":[{"title":"鑑定評価の3手法","head":["手法","求める価格","ポイント"],"rows":[["原価法","積算価格","再調達原価−減価修正"],["取引事例比較法","比準価格","事情補正・時点修正を行う"],["収益還元法","収益価格","純収益の現在価値の総和"]]},{"title":"価格の種類","head":["種類","内容","例"],"rows":[["正常価格","合理的な市場での価格","通常の売買"],["限定価格","市場が相対的に限定","隣地の併合・借地人の底地買取"],["特定価格","正常価格の前提を欠く","証券化・民事再生の早期売却"],["特殊価格","市場性を有しない","文化財の建造物"]]},{"title":"公示事項かどうか","head":["事項","公示"],"rows":[["標準地の所在地","○"],["単位面積当たりの価格","○"],["価格判定の基準日","○"],["地積・形状","○"],["周辺の土地の利用現況","○"],["価格の総額","×"]]}]}},"税他|住宅金融支援機構":{"pts":["証券化支援業務（買取型）は、民間金融機関の住宅ローン債権を買い取り、これを担保にMBSを発行して資金調達する。","買取対象は本人又は親族が居住する住宅の建設・購入資金の貸付債権で、中古住宅や付随する土地・借地権、購入に付随する改良資金も含む。賃貸住宅は対象外。","住宅融資保険業務では、民間金融機関の住宅ローンについて保険を引き受け、民間による住宅資金の供給を支援する。","直接融資は原則民間が困難な分野に限られ、災害復興建築物、マンション共用部分の改良（管理組合等への融資）などが対象。","団体信用生命保険業務で、債務者の死亡のほか重度障害の場合も保険金を債務の弁済に充当する。","災害復興建築物の貸付金では元金据置期間を設けられる。高齢者向け返済特例として死亡時一括償還制度がある。"],"traps":["「賃貸住宅の建設資金の貸付債権も買取対象」と出たら×。買取対象は本人又は親族が居住する住宅に係る債権。","「中古住宅の購入資金は買取対象外」と出たら×。新築に限られず中古住宅購入資金も対象。","「機構は一般の個人向け住宅ローンを広く直接融資する」と出たら×。直接融資は災害関連など政策上必要な分野に限られる。"],"rel":["税他|景品表示法","税他|土地・建物"],"bridge":"機構は住宅ローンの資金供給を担う制度で、免除科目の中で景品表示法・土地建物と並ぶ5問免除の一角。数字より業務の対象・範囲の理解が問われる。","sys":{"overview":"5問免除科目の1問。機構は民間の住宅ローン供給を支える独立行政法人で、証券化支援（買取型・保証型）が中心業務。買取対象債権の範囲と、直接融資が政策上必要な分野に限られる点を押さえれば得点できる。","tree":[{"h":"機構の性格","items":["独立行政法人（旧住宅金融公庫の業務を承継）","民間金融機関の住宅資金供給を支援","一般の住宅ローン直接融資は原則行わない"]},{"h":"証券化支援","items":["買取型：債権を買い取りMBSを発行","保証型：民間ローンの債務を保証","対象：本人・親族が住む住宅の資金","中古住宅・付随する土地/借地権も対象","購入に付随する改良資金も対象"]},{"h":"保険・保証","items":["住宅融資保険：民間ローンに保険を引受","団体信用生命保険：死亡・重度障害で弁済"]},{"h":"直接融資","items":["災害復興建築物・災害予防の資金","マンション共用部分の改良（管理組合等）","子育て・高齢者向け賃貸住宅の建設等","高齢者のバリアフリー等の改良資金"]},{"h":"返済上の配慮","items":["災害復興の貸付は元金据置期間を設定可","高齢者向けの死亡時一括償還制度","経済事情の変動による返済条件の変更"]}],"flow":{"title":"証券化支援(買取型)","steps":["民間金融機関が個人に長期固定ローンを融資","機構が当該住宅ローン債権を買い取る","機構が債権を信託し担保とする","MBSを発行し投資家から資金を調達","調達資金で次の債権買取りに充てる"]},"tables":[{"title":"買取型の対象債権","head":["資金の内容","対象"],"rows":[["自ら居住する新築住宅","○"],["親族が居住する住宅","○"],["中古住宅の購入","○"],["付随する土地・借地権取得","○"],["購入に付随する改良資金","○"],["賃貸住宅の建設・購入","×"],["投資用・事業用物件","×"]]},{"title":"業務の区分","head":["業務","区分","主な内容"],"rows":[["証券化支援（買取型）","間接","債権買取・MBS発行"],["証券化支援（保証型）","間接","民間ローンの保証"],["住宅融資保険","間接","民間ローンに保険"],["団体信用生命保険","付随","死亡・重度障害で弁済"],["災害復興融資","直接","据置期間の設定可"],["マンション共用部分改良","直接","管理組合等に融資"]]}]}},"税他|景品表示法":{"pts":["徒歩所要時間は道路距離80mにつき1分で計算し、1分未満の端数は1分に切り上げる。起点は物件の区画のうち駅に最も近い地点等。","新築は建築工事完了後1年未満で、かつ居住の用に供されたことがない function mergeHist(a,b){const o={...a};Object.keys(b||{}).forEach(k=>{const x=o[k],y=b[k];o[k]=!x||((y.n||0)>(x.n||0))?y:x});return o}
async function connect(){

    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);

    SYNC.db=db;SYNC.ref=db.doc("data/users/"+uid+"/progress");

}

function rec(q,ok){const h=H[q.k]||{n:0,c:0};h.n++;if(ok)h.c++;h.last=ok?1:0;H[q.k]=h}

function pick(pool,n,exclude){
  const c=shuffle(pool.filter(q=>!exclude.has(q.i)));
  c.sort((a,b)=>prio(a)-prio(b));

  const out=[],used=new Set();

}

function bigr(x){const s=String(x).replace(/[\s、。・：（）()「」，,．.0-9０-９]/g,"");const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o}
function overlap(a,b){let n=0;b.forEach(x=>{if(a.has(x))n++});return n}
function cellHtml(x){x=esc(x);if(/^(○|◯|必要|可|あり|できる)/.test(x))return `<span class="o">${x}</span>`;if(/^(×|✕|不要|不可|なし|できない)/.test(x))return `<span class="x">${x}</span>`;return x}
function sysHtml(key,missed){
  const S=(LESSON[key]||{}).sys;if(!S)return "";const t=key.split("|")[1];
  let hitB=-1,hitI=-1;
  if(missed){const qb=bigr(missed.q.s+missed.q.e);let best=1;
    S.tree.forEach((b,i)=>{const sc=overlap(qb,bigr(b.h+b.items.join("")));if(sc>best){best=sc;hitB=i}});
    if(hitB>=0){let bi=0;S.tree[hitB].items.forEach((it,j)=>{const sc=overlap(qb,bigr(it));if(sc>bi){bi=sc;hitI=j}})}}
  const tree=`<div class="systree"><div class="sysroot">${esc(t)}</div><div class="sysbr">${S.tree.map((b,i)=>`<div class="br ${i===hitB?"hit":""}"><h4><span class="no">${i+1}</span>${esc(b.h)}${i===hitB?`<span class="tag">間違えた問題はここ</span>`:""}</h4><ul>${b.items.map((it,j)=>`<li class="${i===hitB&&j===hitI?"hit":""}">${esc(it)}</li>`).join("")}</ul></div>`).join("")}</div></div>`;
  const flow=S.flow&&S.flow.steps&&S.flow.steps.length?`<article class="card"><div class="meta">流れで覚える</div><h2>${esc(S.flow.title)}</h2><ol class="flow">${S.flow.steps.map((x,i)=>`<li><span class="n">${i+1}</span><span class="s">${esc(x)}</span></li>`).join("")}</ol></article>`:"";
  const tbls=S.tables&&S.tables.length?`<article class="card"><div class="meta">比較表・数字</div><div class="tbls">${S.tables.map(tb=>`<div><div style="font-weight:700;margin-bottom:6px">${esc(tb.title)}</div><div class="tw"><table class="st"><thead><tr>${tb.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${tb.rows.map(r=>`<tr>${r.map(c=>`<td>${cellHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`).join("")}</div></article>`:"";
  return `<article class="card"><div class="meta">全体像（体系図）</div><h2>${esc(t)}の全体像</h2><p class="ov">${esc(S.overview)}</p>${tree}</article>${flow}${tbls}`;
}
function lessonHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const [f,t]=key.split("|");
  const relH=(L.rel||[]).filter(k=>LESSON[k]).map(k=>`<div class="kp"><b style="font-size:1rem">${k.split("|")[1]}</b><ul class="ul">${LESSON[k].pts.slice(0,3).map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("");
  return `
  ${missed?`<article class="card"><div class="meta">あなたが間違えた問題　${missed.q.ref==="確認"?"確認問題":missed.q.ref}</div><p class="stmt">${missed.q.s}</p>
    <div class="res ng"><span class="v">あなた：${missed.your==null?"未回答":missed.your?"○":"×"}　答え：${missed.q.a?"○":"×"}</span><span>${missed.q.e}</span><span class="memo">覚え方：<b>${missed.q.m}</b></span></div></article>`:""}
  ${sysHtml(key,missed)}
  <article class="card"><div class="meta">要点のまとめ　${FIELDS.find(x=>x[0]===f)[1]}</div><h2>${t}の要点</h2><ul class="ul">${L.pts.map(x=>`<li>${x}</li>`).join("")}</ul>
    ${L.traps&&L.traps.length?`<div class="trap"><b>よく出るひっかけ</b><ul class="ul">${L.traps.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}</article>
  ${relH?`<article class="card"><div class="meta">付随する論点</div><p style="margin:0">${L.bridge||""}</p><div class="relg">${relH}</div></article>`:""}`;
}
function startReview(queue){ // queue: [{key, missed?}]
  if(!queue.length){home();return}
  const item=queue[0],rest=queue.slice(1);const key=item.key;const [f,t]=key.split("|");
  app.innerHTML=`<div class="exam-top"><div><div class="note">復習　残り${queue.length}論点</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
  ${lessonHtml(key,item.missed)}
  <div class="row"><button class="btn pri" id="toq">確認例題3問へ</button></div>`;
  $("#home").onclick=home;
  $("#toq").onclick=()=>checkQs(item,rest);
  if(voice){const L=LESSON[key];if(L)speak(t+"の要点。"+L.pts.join("。"))}
  window.scrollTo(0,0);
}
function checkQs(item,rest){
  const [f,t]=item.key.split("|");
  const ex=new Set(item.missed?[item.missed.q.i]:[]);
  let pool=BANK.filter(q=>q.f===f&&q.t===t);
  let real=pool.filter(q=>q.ref!=="確認");
  const qs=pick(real.length>=3?real:pool,3,ex);
  let k=0,right=0;
  const render=()=>{
    if(k>=qs.length){
      const ok=right===qs.length;
      app.innerHTML=`<section class="card"><h2>${t}　確認例題の結果</h2><div class="row"><span class="big">${right}<span style="font-size:1.2rem"> / ${qs.length}</span></span><span class="judge ${ok?"j-ok":right>=2?"j-mid":"j-ng"}">${ok?"習得":right>=2?"もう一息":"要復習"}</span></div>
      <p class="note">${ok?"この論点は理解できています。":"もう一度、解説を読んでから別の3問に挑戦できます。"}</p>
      <div class="row">${ok?"":`<button class="btn" id="again">解説に戻ってもう一度</button>`}
      ${rest.length?`<button class="btn pri" id="next">次の論点へ（残り${rest.length}）</button>`:`<button class="btn pri" id="nx">第${SET.round+1}回の模試へ</button>`}
      <button class="btn" id="home">ホームへ</button></div></section>`;
      if(!ok)$("#again").onclick=()=>startReview([{key:item.key,missed:item.missed},...rest]);
      if(rest.length)$("#next").onclick=()=>startReview(rest);else $("#nx").onclick=()=>startExam();
      $("#home").onclick=home;window.scrollTo(0,0);return}
    const q=qs[k];
    app.innerHTML=`<div class="exam-top"><div><div class="note">確認例題　${k+1} / ${qs.length}　正解 ${right}</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
    <article class="card"><div class="meta">過去問　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn" id="o">○</button><button class="btn" id="x">×</button></div><div id="res"></div></article>`;
    const go=v=>{$("#o").disabled=$("#x").disabled=true;const ok=v===q.a;if(ok)right++;rec(q,ok);save();
      $("#res").innerHTML=`<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答えは ${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div><div class="row" style="margin-top:10px"><button class="btn pri" id="nx">次へ</button></div>`;
      if(voice)speak((ok?"正解。":"不正解。")+"答えは"+(q.a?"まる":"ばつ")+"。"+q.e);
      $("#nx").onclick=()=>{k++;render();if(voice&&k<qs.length)speak(qs[k].s)};$("#nx").focus()};
    $("#o").onclick=()=>go(1);$("#x").onclick=()=>go(0);$("#home").onclick=home;
    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    window.scrollTo(0,0);
  };
  render();if(voice&&qs.length)speak(qs[0].s);
}
if(canSpeak){try{speechSynthesis.getVoices()}catch(e){}}
home();
connect();
</script>

る（公正競争規約）。","m":"改装は内容と時期を明示"},{"f":"税他","t":"景品表示法","ref":"H24-47-3","s":"宅建業者の不動産広告で周辺のデパートやスーパーなどの商業施設を表示する場合、現に利用できる施設でなければ一切表示することはできない。","a":0,"e":"工事中などで将来確実に利用できると認められる施設は、整備予定時期を明示すれば表示できる。","m":"将来の施設は予定時期で"},{"f":"税他","t":"景品表示法","ref":"H24-47-4","s":"有効な利用が阻害される著しい不整形の土地であっても、現地を見ればその形状が分かる場合には、広告でその旨を表示しなくてもよい。","a":0,"e":"著しい不整形画地や地盤面が2段以上の土地などは、その旨を明示しなければならない。現地で分かっても同じ。","m":"不整形地は必ず明示"},{"f":"税他","t":"土地・建物","ref":"H24-49-1","s":"台地は一般に水はけがよく地盤も安定しており、低地に比べて、洪水や地震などの自然災害に対する安全度が高い土地とされている。","a":1,"e":"台地は水はけがよく地盤も安定しており、低地に比べて洪水や地震に対する安全性が高い。","m":"台地は安全・低地は注意"},{"f":"税他","t":"土地・建物","ref":"H24-49-2","s":"台地や段丘の上にある浅い谷の小さな池や沼を埋め立てた土地は、地下に水を含んだ地層があるため、地震の際に液状化が起こるおそれがある。","a":1,"e":"台地上でも、浅い谷の池沼を埋め立てた所は地下水位が高く、液状化や不同沈下のおそれがある。","m":"台地でも埋立地は要注意"},{"f":"税他","t":"土地・建物","ref":"H24-49-3","s":"丘陵地帯で地下水位が深く、砂質土でできている地盤は、地下水位が浅い低地の砂地盤と同様に、地震の際に液状化が起こる可能性が高い。","a":0,"e":"液状化は砂地盤で、かつ地下水位が浅い所で起きやすい。地下水位が深ければ起こりにくい。","m":"液状化は砂＋浅い地下水"},{"f":"税他","t":"土地・建物","ref":"H24-49-4","s":"崖崩れは降雨や豪雨によって発生することが多いので、崖のすぐ近くの場所に建つ住宅では、梅雨や台風の時期に特に注意が必要である。","a":1,"e":"崖崩れは大雨で地盤が緩んだときに起こりやすく、梅雨や台風の時期は特に注意が必要。","m":"崖は雨の季節に注意"},{"f":"税他","t":"土地・建物","ref":"H24-50-1","s":"鉄筋コンクリート造の建物で、時間の経過とともに表面からコンクリートの中性化が進んでも、構造体の耐久性や寿命には影響しない。","a":0,"e":"アルカリ性のコンクリートが中性化すると内部の鉄筋が錆びやすくなり、耐久性や寿命が低下する。","m":"中性化で鉄筋が錆びる"},{"f":"税他","t":"土地・建物","ref":"H24-50-2","s":"木造建物の寿命は、柱や梁などの構造材として使われている木材の乾燥状態や、シロアリなどに対する防虫対策の有無によって影響を受ける。","a":1,"e":"木材は乾燥している方が強度が大きく、腐朽や虫害を防ぐ対策も建物の寿命を左右する。","m":"木材は乾燥が命"},{"f":"税他","t":"土地・建物","ref":"H24-50-3","s":"鉄筋コンクリート造における「かぶり厚さ」とは、鉄筋の表面から、その鉄筋を覆っているコンクリートの表面までの最短距離をいう。","a":1,"e":"かぶり厚さは鉄筋表面からコンクリート表面までの最短距離。部位ごとの最小値が建築基準法施行令で定められている。","m":"かぶり厚さは最短距離"},{"f":"税他","t":"土地・建物","ref":"H24-50-4","s":"鉄骨造は不燃構造であるが、火熱を受けると耐力が低下するため、耐火構造とするには鉄骨を耐火材料で覆うなどの措置が必要である。","a":1,"e":"鋼材は燃えないが高温になると強度が大きく落ちる。耐火構造にするには耐火被覆が必要。","m":"鉄骨は熱に弱い→被覆"},{"f":"権利","t":"意思表示・行為能力","ref":"H25-01-1","s":"意思表示に、法律行為の目的と取引上の社会通念に照らして重要な錯誤があった場合、その意思表示は無効となると民法に定められている。","a":0,"e":"改正民法では、重要な錯誤による意思表示は無効ではなく、取り消すことができる（95条1項）。","m":"錯誤は取消し"},{"f":"権利","t":"売買・契約不適合","ref":"H25-01-3","s":"引き渡された目的物の数量が契約の内容に適合しない場合、買主は原則として、追完の催告をすることなく直ちに代金の減額を請求できる。","a":0,"e":"代金減額請求は、原則として相当の期間を定めて追完を催告し、期間内に追完がないときにできる（563条1項）。","m":"減額はまず追完の催告"},{"f":"権利","t":"意思表示・行為能力","ref":"H25-02-1","s":"父母と意思疎通ができない生まれたばかりの乳児であっても、権利の主体として、相続や贈与などによって不動産の所有者となることができる。","a":1,"e":"権利能力は出生によって取得する（3条1項）。意思能力がなくても権利の主体として不動産を所有できる。","m":"権利能力は出生から"},{"f":"権利","t":"意思表示・行為能力","ref":"H25-02-2","s":"法定代理人から営業を許可された未成年者が、その営業のための商品の仕入れについて売買契約を結ぶには、父母のどちらかの同意が必要である。","a":0,"e":"営業を許可された未成年者は、その営業に関しては成年者と同一の行為能力を有し、単独で契約できる（6条1項）。","m":"営業許可なら単独でOK"},{"f":"権利","t":"代理","ref":"H25-02-4","s":"未成年の子C・Dの親権者である母が、CとDの両方を代理して遺産分割協議をした場合、その協議は、C・Dが成年後に追認しない限り、C・Dに効力を生じない。","a":1,"e":"子どうしの利益が相反するため特別代理人が必要（826条2項）。親権者がした代理は無権代理となり、追認がなければ効力がない。","m":"利益相反は特別代理人"},{"f":"権利","t":"共有・相隣","ref":"H25-03-1","s":"他の土地に囲まれて公道に通じない土地の所有者は、周囲の土地を通行できるが、通行の場所と方法は、必要で、かつ周囲の土地にとって損害が最も少ないものを選ばなければならない。","a":1,"e":"袋地の所有者の通行の場所・方法は、必要があり、かつ他の土地のために損害が最も少ないものに限られる（211条1項）。","m":"通行は損害最小の場所"},{"f":"権利","t":"共有・相隣","ref":"H25-03-2","s":"共有物の分割によって公道に通じない土地が生じた場合、その土地の所有者は、他の分割者の所有地を償金を支払うことなく通行できる。","a":1,"e":"分割で袋地が生じたときは、他の分割者の土地のみを通行でき、償金は不要（213条1項）。","m":"分割の袋地は無償通行"},{"f":"権利","t":"時効","ref":"H25-03-4","s":"隣地の所有者が自分の使用のために開設した通路を、袋地の所有者が継続して利用していれば、袋地の所有者はその通路について通行地役権を時効取得できる。","a":0,"e":"通行地役権の時効取得には、通路の開設が要役地（袋地）の所有者によって行われたことが必要（判例）。","m":"通路は自分で開設が必要"},{"f":"権利","t":"抵当権・担保","ref":"H25-04-1","s":"建物の賃借人が造作買取請求権を行使した場合、賃借人は造作代金の支払を受けるまで、建物を留置して明渡しを拒むことができる。","a":0,"e":"造作代金債権は造作に関して生じた債権で建物に関する債権ではないため、建物を留置できない（判例）。","m":"造作代金で建物は留置不可"},{"f":"権利","t":"抵当権・担保","ref":"H25-04-2","s":"不動産の二重譲渡で第二買主が先に登記を備えた場合、第一買主は、売主から損害賠償を受けるまで、その不動産を留置して第二買主への明渡しを拒むことができる。","a":0,"e":"売主への損害賠償債権は物に関して生じた債権ではなく、第一買主は第二買主に対して留置権を主張できない（判例）。","m":"二重譲渡の負けは留置不可"},{"f":"権利","t":"抵当権・担保","ref":"H25-04-3","s":"債務不履行で賃貸借契約を解除された賃借人が、その後も占有を続けている間に建物に有益費を支出した場合、償還を受けるまで建物を留置できる。","a":0,"e":"権原がないと知りながら占有中に支出した費用では留置権は認められない（295条2項の類推、判例）。","m":"不法占有中の費用は留置不可"},{"f":"権利","t":"抵当権・担保","ref":"H25-04-4","s":"建物の賃借人が建物に必要費を支出した場合でも、賃借人は、建物所有者とは別の第三者が所有している敷地まで留置することはできない。","a":1,"e":"必要費償還請求権は建物に関して生じた債権で、留置できるのは建物に限られる。第三者所有の敷地には及ばない。","m":"留置できるのは建物だけ"},{"f":"権利","t":"抵当権・担保","ref":"H25-05-1","s":"抵当権者は、被担保債権について債務不履行が生じる前であっても、抵当不動産の賃料債権に物上代位して差し押さえることができる。","a":0,"e":"物上代位による差押えは担保権の実行に当たるため、被担保債権の債務不履行（弁済期到来）後でなければできない（371条参照）。","m":"賃料代位は不履行後"},{"f":"権利","t":"抵当権・担保","ref":"H25-05-2","s":"借地上の建物に抵当権が設定された場合、特段の事情がない限り、その抵当権の効力は、建物だけでなく敷地についての借地権にも及ぶ。","a":1,"e":"借地権は建物所有のための従たる権利で、建物の抵当権の効力は借地権にも及ぶ（判例）。","m":"建物と借地権はセット"},{"f":"権利","t":"抵当権・担保","ref":"H25-05-3","s":"抵当権者は、抵当不動産が不法に占有されている場合、その占有によって不動産の価値の実現が妨げられるときであっても、占有者に妨害排除を請求することはできない。","a":0,"e":"不法占有で競売価格の実現が妨げられ優先弁済権の行使が困難なときは、抵当権者は妨害排除を請求できる（判例）。","m":"不法占有には妨害排除OK"},{"f":"権利","t":"抵当権・担保","ref":"H25-05-4","s":"抵当権の順位は、登記をした後であっても、各抵当権者の合意と利害関係人の承諾があれば変更できるが、その変更は登記しなければ効力を生じない。","a":1,"e":"順位の変更は抵当権者の合意と利害関係人の承諾で可能。登記が効力発生要件（374条）。","m":"順位変更は登記で効力"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H25-06-1","s":"1,500万円の債務について、Cが全額の連帯保証をし、DとEが物上保証人となっている。Cが全額を弁済した場合、CはD・Eの抵当権を実行して1,500万円全額を回収できる。","a":0,"e":"保証人と物上保証人の間では頭数で負担し各500万円。Cが代位できるのは1,000万円で、D・Eには不動産価格の割合で配分（501条3項4号）。","m":"保証人と物上保証人は頭数"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H25-06-2","s":"1,500万円の債務について、Cが全額の連帯保証をし、DとEが物上保証人となっている。Dの抵当権が実行されて全額が弁済された場合、DはCに対し1,000万円まで代位できる。","a":0,"e":"保証人1人と物上保証人2人なので頭数で3等分。DがCに代位できるのはCの負担部分500万円まで（501条3項4号）。","m":"3人なら3等分"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H25-06-3","s":"物上保証人Dの担保不動産を第三者が買い受けた後に、連帯保証人Cが債権者に全額を弁済した場合、Cはその第三取得者に対して代位することができない。","a":0,"e":"保証人は弁済により、物上保証人から担保不動産を取得した第三取得者に対しても代位できる。改正で付記登記も不要になった。","m":"保証人は第三取得者に代位OK"},{"f":"権利","t":"保証・連帯債務","ref":"H25-07-1","s":"期間の定めのある建物賃貸借について極度額を定めて個人が保証人となった場合、反対の趣旨をうかがわせる特段の事情がない限り、保証人は更新後の賃借人の債務も保証する。","a":1,"e":"判例は更新後の債務にも保証が及ぶとする。改正後、個人の賃貸保証は根保証として極度額の定めが必要（465条の2）。","m":"保証は更新後にも及ぶ"},{"f":"権利","t":"保証・連帯債務","ref":"H25-07-3","s":"建物賃貸借の保証人の責任は、更新後の未払賃料には及ぶが、賃借人が故意や過失で建物を損傷したことによる損害賠償債務には及ばない。","a":0,"e":"賃貸借の保証は賃借人の債務全般が対象で、建物を損傷した損害賠償債務にも及ぶ（極度額の範囲内）。","m":"損害賠償も保証の範囲"},{"f":"権利","t":"保証・連帯債務","ref":"H25-07-4","s":"建物賃貸借の保証人は、賃貸人が保証債務の履行を請求することが信義則に反すると認められる場合には、更新後の賃借人の債務について保証責任を負わない。","a":1,"e":"判例は、賃貸人の保証債務の請求が信義則に反する場合には保証人は責任を免れるとしている。","m":"信義則違反なら責任なし"},{"f":"権利","t":"不法行為・請負・委任","ref":"H25-08-1","s":"隣人Bが、倒壊しそうなA所有の建物について、Aの承諾を得ずに倒壊防止の最小限の緊急措置をとった場合、Bはその費用をAに請求することができない。","a":0,"e":"義務なく他人のために事務を管理する事務管理にあたり、本人のために有益な費用を支出すれば償還を請求できる（702条）。","m":"事務管理の費用は請求OK"},{"f":"権利","t":"賃貸借","ref":"H25-08-2","s":"建物所有を目的とする土地の賃借人が、建物を建てるために石垣や擁壁の設置、盛土、杭打ちなどを行うには、必ず賃貸人の承諾を得なければならない。","a":0,"e":"建物の建築に通常伴う土地の工事は、借地人の利用権の範囲内として賃貸人の承諾なく行える。","m":"建築に伴う造成は承諾不要"},{"f":"権利","t":"賃貸借","ref":"H25-08-3","s":"賃貸人が修繕義務を履行しない場合、賃借人は、使用収益にどの程度の支障が生じているかにかかわらず、賃料全額の支払を拒むことができる。","a":0,"e":"賃料全額の支払を拒めるのは、使用収益が全くできないなど支障が著しい場合に限られる（判例）。","m":"全額拒否は支障が重大な時"},{"f":"権利","t":"賃貸借","ref":"H25-08-4","s":"賃貸人が賃貸物の保存に必要な修繕をしようとする場合、その工事で使用収益に支障が生じるとしても、賃借人はこれを拒むことができない。","a":1,"e":"賃貸人が賃貸物の保存に必要な行為をするときは、賃借人は拒めない（606条2項）。","m":"保存のための修繕は拒めない"},{"f":"権利","t":"不法行為・請負・委任","ref":"H25-09-1","s":"A社の従業員Bが勤務中に社用車を運転中、Dの車と衝突し、双方に過失があった。Aが同乗者Cの損害を全額賠償した場合、AはDに対し、Dの過失割合に応じて求償できる。","a":1,"e":"BとDは共同不法行為者。使用者Aが全額賠償すれば、他方の加害者Dにその負担部分を求償できる（判例）。","m":"共同不法行為は過失割合で"},{"f":"権利","t":"不法行為・請負・委任","ref":"H25-09-2","s":"従業員Bが勤務中の事故で第三者に損害を与え、使用者Aがその損害を全額賠償した場合、AはBに対して一切求償することができない。","a":0,"e":"使用者は被用者に求償できる（715条3項）。ただし判例上、信義則上相当と認められる限度に制限される。","m":"被用者へは信義則の限度で"},{"f":"権利","t":"不法行為・請負・委任","ref":"H25-09-3","s":"A社の従業員Bが勤務中に起こした事故がBと相手方運転者Dの双方の過失による場合、Bの車の同乗者Cは、AとBには賠償請求できるが、Dには請求できない。","a":0,"e":"BとDは共同不法行為者として連帯して責任を負う（719条）。CはA・B・Dのいずれにも全額を請求できる。","m":"被害者は誰にでも全額"},{"f":"権利","t":"不法行為・請負・委任","ref":"H25-09-4","s":"A社の従業員Bが勤務中に起こした事故で相手方Dが損害を受けた場合、Dは使用者Aに賠償請求できるので、加害者であるB本人には請求できない。","a":0,"e":"使用者責任が成立しても被用者本人の不法行為責任（709条）は消えない。DはAにもBにも請求できる。","m":"使用者責任でも本人に請求可"},{"f":"権利","t":"相続","ref":"H25-10-1","s":"Aが死亡し、相続人が妻B、子C、Aより先に死亡した子Dの子E、前婚の子Fである場合、C・E・Fの法定相続分はそれぞれ6分の1である。","a":1,"e":"配偶者が2分の1。残り2分の1を子C、代襲相続人E、前婚の子Fで等分し各6分の1（900条、901条）。","m":"配偶者半分・残りを子で等分"},{"f":"権利","t":"相続","ref":"H25-10-2","s":"Aが「甲土地を子Cに相続させる」旨の遺言をした場合、特段の事情がない限り、甲土地は遺産分割を経ることなく、Aの死亡時にCが取得する。","a":1,"e":"特定財産承継遺言は遺産分割方法の指定とされ、相続開始と同時に承継される（判例）。法定相続分を超える部分の対抗には登記が必要。","m":"相続させる遺言は即取得"},{"f":"権利","t":"相続","ref":"H25-10-3","s":"Aが「全財産を子Dに相続させる」旨の遺言をしたが、DがAより先に死亡した場合、Dの子Eが当然に代襲して全財産を取得する。","a":0,"e":"受益者が遺言者より先に死亡すれば、特段の事情がない限りその遺言は効力を生じない（判例）。Eが当然に引き継ぐことはない。","m":"先に死ねば遺言は空振り"},{"f":"権利","t":"相続","ref":"H25-10-4","s":"被相続人が相続人の一人に特定の土地を遺贈する意思表示をした場合、遺贈の相手方が相続人であるため、その遺贈は無効となるとされる。","a":0,"e":"相続人に対しても遺贈をすることができる。相続人であることを理由に遺贈が無効になることはない。","m":"相続人への遺贈も有効"},{"f":"権利","t":"賃貸借","ref":"H25-11-1","s":"建物の賃借人が賃貸人の承諾を得ずに転貸した場合、賃貸人は、背信的行為と認めるに足りない特段の事情があるかどうかにかかわらず、契約を解除できる。","a":0,"e":"無断転貸でも、賃貸人に対する背信的行為と認めるに足りない特段の事情があれば解除できない（判例）。","m":"背信性なければ解除不可"},{"f":"権利","t":"賃貸借","ref":"H25-11-2","s":"賃貸人の承諾を得て建物が転貸されている場合でも、賃借人の債務不履行を理由に賃貸借契約が解除されたときは、賃貸人は転借人に建物の明渡しを請求できる。","a":1,"e":"債務不履行解除は転借人に対抗できる（613条3項ただし書）。合意解除は原則として対抗できない。","m":"不履行解除は転借人に対抗可"},{"f":"権利","t":"借家","ref":"H25-11-4","s":"定期建物賃貸借に賃料改定の特約がある場合、経済事情の変動により賃料が不相当となっても、賃借人は借賃の減額を請求することができない。","a":1,"e":"定期建物賃貸借では、賃料改定に関する特約があれば借賃増減額請求の規定（32条）は適用されない（38条）。","m":"定期借家は改定特約が優先"},{"f":"権利","t":"借地","ref":"H25-12-1","s":"ゴルフ場の経営を目的とする土地の賃貸借契約には、そのすべての土地について、借地借家法の地代等増減額請求の規定が適用される。","a":0,"e":"借地借家法の借地権は建物所有を目的とする土地の賃借権等。ゴルフ場経営目的の賃貸借には適用されない（2条）。","m":"建物目的でなければ対象外"},{"f":"権利","t":"借地","ref":"H25-12-2","s":"借地上に建物がある場合に借地権者が契約の更新を請求したとき、借地権設定者が遅滞なく異議を述べれば、正当事由がなくても契約は更新されない。","a":0,"e":"建物がある場合の更新請求に対する異議は、正当事由がなければ認められない（5条、6条）。","m":"異議には正当事由が必要"},{"f":"権利","t":"借地","ref":"H25-12-3","s":"二筆の土地を借りて、一方に登記された建物を所有し、他方は庭として使っているにすぎない場合、庭の土地の借地権には、建物登記による対抗力は及ばない。","a":1,"e":"建物登記による対抗力（10条1項）は、その建物が建っている土地にしか及ばない（判例）。","m":"対抗力は建物のある土地だけ"},{"f":"権利","t":"借地","ref":"H25-12-4","s":"当初の存続期間中に借地上の建物が滅失し、借地権設定者の承諾を得て残存期間を超えて存続する建物を築造した場合、借地権は承諾日と築造日のいずれか早い日から20年間存続する。","a":1,"e":"承諾ある再築では、承諾日と築造日の早い方から20年存続（残存期間が長ければその期間）（7条1項）。","m":"再築承諾で早い方から20年"},{"f":"権利","t":"区分所有法","ref":"H25-13-1","s":"区分所有者の承諾を得て専有部分を占有する賃借人は、集会の目的事項に利害関係があるときは、集会に出席して議決権を行使することができる。","a":0,"e":"占有者は利害関係があれば集会に出席して意見を述べられるが、議決権は持たない（区分所有法44条1項）。","m":"占有者は意見だけ、票なし"},{"f":"権利","t":"区分所有法","ref":"H25-13-2","s":"区分所有建物の集会では、規約に別段の定めがなく別段の決議もない場合、管理者または集会を招集した区分所有者の1人が議長となる。","a":1,"e":"議長は原則として管理者か招集した区分所有者の1人。規約や集会の決議で別に定めることもできる（41条）。","m":"議長は管理者か招集者"},{"f":"権利","t":"区分所有法","ref":"H25-13-3","s":"区分所有建物の管理者は、区分所有者の集会において、毎年1回一定の時期に、自らが行った事務に関する報告をしなければならない。","a":1,"e":"管理者は毎年1回一定の時期に、集会で自分が行った事務について報告する義務を負う（43条）。","m":"管理者は年1回報告"},{"f":"権利","t":"区分所有法","ref":"H25-13-4","s":"一部の区分所有者のみの共用に供されるべきことが明らかな一部共用部分は、規約に別段の定めがない限り、区分所有者全員の共有に属する。","a":0,"e":"一部共用部分は、原則としてそれを共用すべき区分所有者だけの共有に属する（11条1項ただし書）。","m":"一部共用は使う人だけ"},{"f":"権利","t":"不動産登記法","ref":"H25-14-1","s":"表題部所有者または所有権の登記名義人が死亡したときは、その相続人その他の一般承継人が、被相続人に代わって表示に関する登記を申請することができる。","a":1,"e":"表示に関する登記の申請権は一般承継人に引き継がれ、相続人等が申請できる（不動産登記法30条）。","m":"表示登記は相続人もOK"},{"f":"権利","t":"不動産登記法","ref":"H25-14-2","s":"共有物分割禁止の定めに係る権利の変更の登記は、当該権利の共有者であるすべての登記名義人が共同して申請しなければならない。","a":1,"e":"共有者全員に影響する登記なので、全登記名義人が共同して申請する必要がある（65条）。","m":"分割禁止の変更は全員で"},{"f":"権利","t":"不動産登記法","ref":"H25-14-3","s":"敷地権付き区分建物の表題部所有者から所有権を取得した者は、敷地権の登記名義人の承諾を得ることなく、自己名義で所有権保存登記を申請することができる。","a":0,"e":"この保存登記は敷地権の移転も伴うため、敷地権の登記名義人の承諾が必要となる（74条2項）。","m":"敷地権付きは承諾必要"},{"f":"権利","t":"不動産登記法","ref":"H25-14-4","s":"所有権に関する仮登記に基づく本登記は、登記上の利害関係を有する第三者がいる場合、その第三者の承諾があるときに限り申請することができる。","a":1,"e":"本登記をすると第三者の登記が抹消されるため、利害関係人の承諾が必要となる（109条1項）。","m":"仮登記→本登記は承諾"},{"f":"法令","t":"都市計画法","ref":"H25-15-1","s":"都市計画施設の区域内で建築物を建築しようとする者は原則として知事等の許可を要するが、都市計画事業の施行として行う行為については許可は不要である。","a":1,"e":"都市計画施設等の区域内の建築は原則許可制だが、軽易な行為や都市計画事業の施行として行う行為などは例外となる（53条）。","m":"施設区域は例外あり"},{"f":"法令","t":"都市計画法","ref":"H25-15-2","s":"特定用途制限地域は、用途地域内において、良好な環境の形成又は保持のため制限すべき特定の建築物等の用途の概要を定める地域である。","a":0,"e":"特定用途制限地域は、用途地域が定められていない土地の区域（市街化調整区域を除く）内に定める（9条）。","m":"特定用途は用途地域外"},{"f":"法令","t":"都市計画法","ref":"H25-15-3","s":"都市計画事業の認可の告示後、事業地内で事業の施行の障害となるおそれがある建築物の建築を行う者は、軽易な行為であっても知事等の許可を受けなければならない。","a":1,"e":"事業地内の制限は都市計画施設の区域内より厳しく、軽易な行為の例外がない（65条1項）。","m":"事業地内は例外なし"},{"f":"法令","t":"都市計画法","ref":"H25-15-4","s":"一定の条件に該当する土地の区域の地区計画には、劇場・店舗等の大規模集客施設の整備による商業等の利便増進を図るため、開発整備促進区を定めることができる。","a":1,"e":"開発整備促進区は、大規模集客施設の立地を誘導するために地区計画に定めることができる（12条の5第4項）。","m":"大規模集客は開発整備促進区"},{"f":"法令","t":"開発許可","ref":"H25-16-1","s":"都市計画法上の開発行為とは、主として建築物の建築を目的とする土地の区画形質の変更をいい、特定工作物の建設を目的とするものは含まれない。","a":0,"e":"開発行為は、建築物の建築または特定工作物の建設の用に供する目的で行う区画形質の変更をいう（4条12項）。","m":"特定工作物も開発行為"},{"f":"法令","t":"開発許可","ref":"H25-16-2","s":"市街化調整区域内で建築物の建築を目的として行う開発行為であっても、その規模が300㎡と小規模であれば、開発許可を受ける必要はない。","a":0,"e":"市街化調整区域には規模による許可不要の例外がなく、小規模でも原則として開発許可が必要となる。","m":"調整区域は面積不問"},{"f":"法令","t":"開発許可","ref":"H25-16-3","s":"市街化区域内において、医療法人が設置する診療所の建築を目的として1,500㎡の開発行為を行う場合、開発許可を受ける必要がある。","a":1,"e":"市街化区域では1,000㎡以上で許可が必要。診療所などの医療施設は公益上必要な建築物の例外に当たらない。","m":"診療所は公益例外でない"},{"f":"法令","t":"開発許可","ref":"H25-16-4","s":"非常災害のため必要な応急措置として行う開発行為であれば、市街化調整区域内で3,000㎡の規模であっても開発許可は不要である。","a":1,"e":"非常災害の応急措置として行う開発行為は、区域や規模にかかわらず開発許可が不要（29条1項10号）。","m":"非常災害は許可不要"},{"f":"法令","t":"建築基準法","ref":"H25-17-ア","s":"居室の天井の高さは2.1m以上でなければならず、一室で天井の高さが異なる部分がある場合は、その最も低い部分の高さで判断する。","a":0,"e":"天井の高さが異なる居室では、その平均の高さが2.1m以上あればよい（建築基準法施行令21条）。","m":"天井高は平均で2.1m"},{"f":"法令","t":"建築基準法","ref":"H25-17-イ","s":"3階建ての共同住宅では、1階を含む各階のバルコニーの周囲に、安全上必要な高さ1.1m以上の手すり壁、さく又は金網を設けなければならない。","a":0,"e":"手すり壁等の設置が必要なのは屋上広場と2階以上の階のバルコニー等で、1階は対象外（施行令126条）。","m":"手すりは2階以上"},{"f":"法令","t":"建築基準法","ref":"H25-17-ウ","s":"居室内で衛生上の支障を生ずるおそれがある物質として建築材料等の規制対象となるのは、石綿のほかにはホルムアルデヒドのみである。","a":0,"e":"石綿以外に政令で定める物質は、クロルピリホスとホルムアルデヒドの2つである（法28条の2）。","m":"シックハウスは2物質"},{"f":"法令","t":"建築基準法","ref":"H25-17-エ","s":"建築基準法上、火災時の消防活動に用いる非常用の昇降機の設置が原則として義務づけられるのは、高さが20mを超える建築物である。","a":0,"e":"非常用の昇降機は高さ31m超の建築物に必要。高さ20m超で必要となるのは避雷設備である（法34条、33条）。","m":"非常用EV31m・避雷20m"},{"f":"法令","t":"建築基準法","ref":"H25-18-1","s":"延べ面積が1,000㎡を超える建築物について、地方公共団体は条例で、その敷地が接すべき道路の幅員や接道長さに関して必要な制限を付加することができる。","a":1,"e":"特殊建築物、階数3以上、延べ面積1,000㎡超などの建築物は、条例で接道の制限を付加できる。緩和はできない（法43条3項）。","m":"条例は付加のみ"},{"f":"法令","t":"建築基準法","ref":"H25-18-2","s":"都市計画で建蔽率の限度が10分の8とされている地域内で、かつ防火地域内にある耐火建築物については、建蔽率の制限は適用されない。","a":1,"e":"建蔽率8/10の地域で防火地域内にある耐火建築物等には、建蔽率の制限が適用されない（法53条6項1号）。","m":"8割×防火×耐火で無制限"},{"f":"法令","t":"建築基準法","ref":"H25-18-3","s":"第二種中高層住居専用地域と近隣商業地域にまたがって建築物がある場合、その過半が近隣商業地域にあれば、建築物全体に北側斜線制限は適用されない。","a":0,"e":"斜線制限は建築物の部分ごとに地域で判断し、第二種中高層住居専用地域にある部分には北側斜線制限が適用される。","m":"斜線は部分ごと"},{"f":"法令","t":"建築基準法","ref":"H25-18-4","s":"第一種低層住居専用地域と準住居地域にまたがる敷地で、その過半が準住居地域にある場合、作業場の床面積が100㎡の自動車修理工場を建築することができる。","a":1,"e":"用途制限は敷地の過半が属する地域の規定による。準住居地域では作業場150㎡以下の自動車修理工場を建築できる。","m":"用途は過半の地域で"},{"f":"法令","t":"盛土規制法","ref":"H25-19-1","s":"宅地造成等工事規制区域内で行う宅地造成等に関する工事のうち、高さ4mの擁壁の設置工事は、政令で定める資格を有する者の設計によらなければならない。","a":0,"e":"資格者の設計が必要なのは、高さ5m超の擁壁や、盛土・切土の面積が1,500㎡超の土地の排水施設の工事である。","m":"資格者設計は5m超"},{"f":"法令","t":"盛土規制法","ref":"H25-19-2","s":"宅地造成等工事規制区域内の宅地において、面積600㎡、高さ1.5mの崖を生ずる切土を行う場合、工事主は原則として都道府県知事の許可を受けなければならない。","a":1,"e":"切土の崖が2m以下でも、面積が500㎡を超えれば宅地造成に当たり、知事の許可が必要となる（盛土規制法12条）。","m":"500㎡超は許可"},{"f":"法令","t":"盛土規制法","ref":"H25-19-3","s":"宅地造成等工事規制区域内の宅地において、面積300㎡、高さ1.5mの崖を生ずる盛土を行う場合、工事主は原則として都道府県知事の許可を受けなければならない。","a":1,"e":"盛土で高さ1mを超える崖を生ずる場合は、面積が500㎡以下でも宅地造成に当たり許可が必要となる。","m":"盛土の崖は1m超"},{"f":"法令","t":"盛土規制法","ref":"H25-19-4","s":"都道府県知事は、宅地造成等工事規制区域内の土地について災害防止のため必要があるときは、所有者・管理者・占有者・工事主・工事施行者に擁壁等の設置等を勧告できる。","a":1,"e":"土地の保全のため、知事は所有者等や工事主・工事施行者に対し必要な措置を勧告できる（盛土規制法22条2項）。","m":"勧告の相手は5者"},{"f":"法令","t":"土地区画整理法","ref":"H25-20-1","s":"個人施行者は、規準または規約に別段の定めがあれば、換地計画に係る区域の全部について工事が完了する前でも換地処分を行うことができる。","a":1,"e":"換地処分は原則として工事完了後だが、規準・規約・定款等に別段の定めがあれば完了前でもよい（103条2項）。","m":"換地処分は原則完了後"},{"f":"法令","t":"土地区画整理法","ref":"H25-20-2","s":"土地区画整理事業の換地処分は、施行者が、換地計画で定められた関係事項を官報等で公告することによって行うものとされている。","a":0,"e":"換地処分は関係権利者に換地計画の関係事項を通知して行う。公告は処分後に知事等が行うもの（103条）。","m":"換地処分は通知で"},{"f":"法令","t":"土地区画整理法","ref":"H25-20-3","s":"土地区画整理事業の個人施行者が、事業費に充てるため換地計画において保留地を定めようとする場合には、土地区画整理審議会の同意を得なければならない。","a":0,"e":"土地区画整理審議会は公的施行の場合に置かれるもので、個人施行には存在しないため同意は不要。","m":"個人施行に審議会なし"},{"f":"法令","t":"土地区画整理法","ref":"H25-20-4","s":"土地区画整理事業の個人施行者が仮換地を指定する場合、従前の宅地の所有者の同意は必要だが、仮換地となるべき宅地の所有者の同意は不要である。","a":0,"e":"個人施行者は、従前の宅地と仮換地となるべき宅地の双方の所有者等の同意を得なければならない（98条3項）。","m":"個人は双方の同意"},{"f":"法令","t":"農地法","ref":"H25-21-1","s":"農地法3条の許可を得て農地を賃借し引渡しを受けた賃借人は、賃借権の登記がなくても、その後に当該農地の所有権を取得した第三者に賃借権を対抗できる。","a":1,"e":"農地・採草放牧地の賃貸借は、登記がなくても引渡しがあれば第三者に対抗できる（農地法16条）。","m":"農地賃借は引渡しで対抗"},{"f":"法令","t":"農地法","ref":"H25-21-2","s":"登記簿上の地目が雑種地である土地は、現に耕作の目的に供されていたとしても、農地法上の農地には該当せず、同法の規制は及ばない。","a":0,"e":"農地に当たるかは登記簿上の地目ではなく現況で判断するため、耕作されていれば農地となる。","m":"農地は現況で判断"},{"f":"法令","t":"農地法","ref":"H25-21-3","s":"国または都道府県が学校の用地とするために農地を取得する場合、都道府県知事等との協議が成立すれば、農地法5条の許可があったものとみなされる。","a":1,"e":"国・都道府県等が学校・病院・庁舎等のために転用目的で取得する場合は、協議の成立で許可があったとみなされる。","m":"国・県は協議でOK"},{"f":"法令","t":"農地法","ref":"H25-21-4","s":"市街化調整区域内の農地を相続により取得した者が、その農地を自己の住宅用地に転用する場合には、原則として農地法4条の許可を受けなければならない。","a":1,"e":"相続による取得に3条許可は不要（届出は必要）だが、その後の転用には4条許可が要る。調整区域に届出の特例はない。","m":"相続後の転用は4条"},{"f":"法令","t":"国土利用計画法","ref":"H25-22-2","s":"都市計画区域内にある甲県所有の7,000㎡の土地を甲県から買い受けた者は、国土利用計画法23条の事後届出を行う必要はない。","a":1,"e":"当事者の一方が国・地方公共団体等である取引は、事後届出の対象外となる（国土利用計画法23条2項3号）。","m":"国等が当事者なら不要"},{"f":"税他","t":"印紙税・登録免許税","ref":"H25-23-1","s":"土地譲渡契約書に貼り付けた収入印紙を、契約当事者本人ではなく代理人や従業者の印章・署名で消印しても、印紙税を納付したことにはならない。","a":0,"e":"消印は文書の作成者本人のほか、代理人・使用人その他の従業者の印章や署名で行ってもよい。","m":"消印は従業者でもOK"},{"f":"税他","t":"印紙税・登録免許税","ref":"H25-23-2","s":"記載金額2,000万円の土地売買契約書を3通作成し、売主・買主・媒介した宅建業者が1通ずつ保存する場合、宅建業者が保存する契約書には印紙税は課されない。","a":0,"e":"媒介業者は契約当事者ではないが、その保存する契約書も課税文書として印紙税の対象になる。","m":"仲介業者保存分も課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"H25-23-3","s":"1通の契約書に土地の譲渡契約（4,000万円）と建物の建築請負契約（5,000万円）を区分して記載した場合、印紙税の記載金額は5,000万円となる。","a":1,"e":"譲渡と請負の金額を区分記載した場合、請負金額の方が大きければその金額が記載金額となる。","m":"混合契約は高い方"},{"f":"税他","t":"印紙税・登録免許税","ref":"H25-23-4","s":"請負金額2,200万円（うち消費税額等200万円）と区分記載した建物の工事請負契約書について、印紙税の記載金額は2,100万円となる。","a":0,"e":"消費税額等が区分記載されている場合は税抜の金額が記載金額となり、本問では2,000万円である。","m":"消費税区分なら税抜"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H25-24-1","s":"固定資産の評価に関する事務を補助する固定資産評価員について、国会議員や地方団体の議会の議員であっても、市町村長が選任すればこれを兼ねることができる。","a":0,"e":"評価の公正を確保するため、国会議員や地方団体の議会の議員は固定資産評価員を兼ねることができない。","m":"議員は評価員になれない"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H25-24-2","s":"登記所は、土地または建物の表示に関する登記をしたときは、30日以内にその旨を当該土地・家屋の所在地の市町村長に通知しなければならない。","a":0,"e":"固定資産税は市町村が課すため登記所は通知義務を負うが、その期限は10日以内である（地方税法382条1項）。","m":"登記所通知は10日"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H25-24-3","s":"住宅用地のうち小規模住宅用地（住宅1戸につき200㎡以下の部分）に対する固定資産税の課税標準は、価格の3分の1の額とされる。","a":0,"e":"小規模住宅用地は価格の6分の1、200㎡を超える一般住宅用地の部分は価格の3分の1となる。","m":"小規模1/6・一般1/3"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H25-24-4","s":"固定資産税の滞納者が督促を受け、督促状を発した日から起算して10日を経過した日までに完納しないときは、市町村の徴税吏員は滞納者の財産を差し押さえなければならない。","a":1,"e":"督促後10日を経過しても完納されない場合、徴税吏員には滞納者の財産を差し押さえる義務がある（地方税法373条）。","m":"督促10日で差押え"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H25-25-1","s":"地価公示法の目的は、都市計画区域等において標準地の周辺の土地の取引価格を公示することにより、適正な地価の形成に寄与することにある。","a":0,"e":"地価公示は標準地の正常な価格を公示するもので、周辺の土地の取引価格を公示するものではない（1条）。","m":"公示は標準地の正常価格"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H25-25-2","s":"地価公示の標準地は、土地鑑定委員会が、自然的・社会的条件からみて類似の地域内で、使用・収益を制限する権利が存しない一団の土地から選定する。","a":0,"e":"権利が存しないことは選定要件ではない。地上権等があっても、それがないものとして正常な価格を判定する。","m":"権利付きでも標準地OK"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H25-25-3","s":"公示価格を規準とするとは、対象土地と類似の利用価値を有する1以上の標準地との位置・地積・環境等を比較し、両者の価格に均衡を保たせることをいう。","a":1,"e":"条文どおりの定義で、標準地と対象土地の諸要因を比較して価格の均衡を図ることをいう（11条）。","m":"規準＝比較して均衡"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H25-25-4","s":"不動産鑑定士は標準地の鑑定評価にあたり、近傍類地の取引価格、地代等から算定される推定価格、造成費用の推定額のいずれかを勘案すれば足りる。","a":0,"e":"取引価格・地代等・造成費用から算定される3つの推定価格をすべて勘案しなければならない（4条）。","m":"3手法すべて勘案"},{"f":"業法","t":"免許の基準","ref":"H25-26-1","s":"法人である宅建業者A社の代表取締役が道路交通法違反により罰金刑に処せられても、それを理由にA社の免許が取り消されることはない。","a":1,"e":"罰金刑で欠格となるのは宅建業法違反や暴力的な犯罪等に限られ、道路交通法違反は含まれない。","m":"道交法の罰金はセーフ"},{"f":"業法","t":"免許の基準","ref":"H25-26-2","s":"宅建業者B社の支店の代表者である政令で定める使用人が脅迫罪により罰金刑に処せられた場合でも、B社の免許が取り消されることはない。","a":0,"e":"脅迫罪の罰金刑は欠格事由で、政令で定める使用人が該当すれば法人の免許は取り消される（66条）。","m":"政令使用人の欠格も影響"},{"f":"業法","t":"免許の基準","ref":"H25-26-3","s":"宅建業者C社の非常勤の取締役が凶器準備集合罪により罰金刑に処せられた場合、非常勤であることから、C社の免許が取り消されることはない。","a":0,"e":"非常勤でも役員に当たる。凶器準備集合罪の罰金刑は欠格事由なので、C社の免許は取り消される。","m":"非常勤でも役員"},{"f":"業法","t":"免許の基準","ref":"H25-26-4","s":"宅建業者D社の代表取締役が法人税法違反により拘禁刑に処せられた場合、刑の全部の執行猶予が付されていれば、D社の免許が取り消されることはない。","a":0,"e":"拘禁刑以上の刑は罪名を問わず欠格事由で、執行猶予中も該当する。猶予期間が満了すれば欠格から外れる。","m":"執行猶予中もアウト"},{"f":"業法","t":"営業保証金","ref":"H25-27-1","s":"不正の手段により免許を受けたことを理由に免許を取り消された宅建業者であっても、所定の手続を経れば営業保証金を取り戻すことができる。","a":1,"e":"免許取消の理由を問わず、営業をやめるなら還付請求の公告等の手続を経て取り戻せる（30条）。","m":"取消でも取戻しOK"},{"f":"業法","t":"免許","ref":"H25-27-2","s":"信託業法の免許を受けた信託会社は、国土交通大臣に届け出ることで宅建業を営むことができ、宅建業法の免許取消処分の規定は適用されない。","a":1,"e":"信託会社は届出により国土交通大臣免許の業者とみなされ、免許取消の規定は適用されない（77条）。","m":"信託会社は届出で営業"},{"f":"業法","t":"営業保証金","ref":"H25-27-3","s":"本店を移転して最寄りの供託所が変わった場合、国債証券のみで営業保証金を供託している宅建業者は、遅滞なく保管替えを請求しなければならない。","a":0,"e":"保管替えは金銭のみで供託している場合に限られる。有価証券を含むときは新たに供託し直す（29条）。","m":"保管替えは金銭のみ"},{"f":"業法","t":"営業保証金","ref":"H25-27-4","s":"取引の相手方への還付により営業保証金に不足が生じた場合、宅建業者は不足を生じた日から2週間以内に不足額を供託しなければならない。","a":0,"e":"起算点は不足を生じた日ではなく、免許権者から不足額を供託すべき旨の通知を受けた日である（28条）。","m":"通知から2週間"},{"f":"業法","t":"媒介契約","ref":"H25-28-ア","s":"専任媒介契約に基づき売買契約を成立させた宅建業者は、登録番号・取引価格・契約成立年月日に加え、売主及び買主の氏名も指定流通機構に通知しなければならない。","a":0,"e":"成約時の通知事項は登録番号・取引価格・契約成立年月日の3つで、当事者の氏名は含まれない。","m":"成約通知に氏名なし"},{"f":"業法","t":"媒介契約","ref":"H25-28-イ","s":"宅地の売却の媒介を依頼された宅建業者は、依頼者に対し売買すべき価額について意見を述べるときは、その根拠を明らかにしなければならない。","a":1,"e":"価額や評価額について意見を述べる際は根拠の明示が必要（34条の2第2項）。口頭で示してもよい。","m":"価格意見は根拠つき"},{"f":"業法","t":"媒介契約","ref":"H25-28-ウ","s":"宅地の売却に関する専任媒介契約の有効期間は依頼者の申出により更新できるが、更新後の有効期間も更新の時から3か月を超えることができない。","a":1,"e":"専任媒介の有効期間は3か月以内。更新には依頼者の申出が必要で、更新後も3か月が上限となる。","m":"専任は3か月・申出更新"},{"f":"業法","t":"重要事項説明","ref":"H25-29-1","s":"宅建業者でない売主と宅建業者である買主が媒介なしに宅地の売買契約を締結する場合、買主である宅建業者が重要事項の説明義務を負う。","a":0,"e":"重要事項説明は取得する側に対して売主側の業者等が行うもの。買主業者には説明義務がない。","m":"説明は取得者に向けて"},{"f":"業法","t":"重要事項説明","ref":"H25-29-2","s":"建物の貸借の媒介において、建物の管理が管理会社に委託されている場合、その管理会社の商号・名称と主たる事務所の所在地を借主に説明しなければならない。","a":1,"e":"管理の委託先の商号・名称と主たる事務所の所在地は、区分所有建物か否かを問わず説明事項となる。","m":"管理会社名は説明"},{"f":"業法","t":"重要事項説明","ref":"H25-29-3","s":"売主・買主ともに宅建業者である区分所有建物の売買では、35条書面に修繕積立金の額を記載すれば、その滞納額を記載する必要はない。","a":0,"e":"業者間でも35条書面の交付は必要で、修繕積立金等の滞納があればその額も記載しなければならない。","m":"業者間でも書面は必要"},{"f":"業法","t":"重要事項説明","ref":"H25-29-4","s":"売主・買主ともに宅建業者である区分所有建物の売買では、売主業者は買主業者に対し、営業保証金を供託した供託所等について説明しなければならない。","a":0,"e":"供託所等の説明は宅建業者でない相手方に対して行うもので、相手方が業者なら不要（35条の2）。","m":"供託所説明は業者不要"},{"f":"業法","t":"重要事項説明","ref":"H25-30-1","s":"自ら売主となる宅建業者は、買主も宅建業者である場合、重要事項の説明は行う必要があるが、35条書面の交付は省略することができる。","a":0,"e":"逆である。業者間では説明は不要だが、宅建士が記名した35条書面の交付は省略できない。","m":"業者間は書面だけ"},{"f":"業法","t":"重要事項説明","ref":"H25-30-2","s":"重要事項の説明をする宅建士が、相手方の請求がないため宅建士証を提示しなかった場合、20万円以下の罰金に処せられることがある。","a":0,"e":"説明時の宅建士証の提示は請求がなくても必要。違反した場合の罰則は10万円以下の過料（86条）。","m":"提示義務違反は過料"},{"f":"業法","t":"重要事項説明","ref":"H25-30-3","s":"昭和56年5月31日以前に新築された建物の貸借の媒介において、当該建物が耐震診断を受けていても、その内容を説明する必要はない。","a":0,"e":"旧耐震基準の建物で耐震診断を受けたものは、貸借の場合でもその内容を説明しなければならない。","m":"旧耐震の診断は説明"},{"f":"業法","t":"重要事項説明","ref":"H25-30-4","s":"宅地または建物が津波防災地域づくりに関する法律による津波災害警戒区域内にあるときは、売買・貸借を問わず、その旨を説明しなければならない。","a":1,"e":"津波災害警戒区域内である旨は、売買・交換・貸借のすべてで重要事項の説明対象となる。","m":"津波警戒区域は全取引"},{"f":"業法","t":"37条書面","ref":"H25-31-ア","s":"宅建業者が自ら貸主として建物の賃貸借契約を締結した場合、宅建業法上、遅滞なく借主に対して37条書面を交付しなければならない。","a":0,"e":"自ら貸主となる行為は宅建業に当たらず、宅建業法の適用がないため37条書面の交付義務はない。","m":"自ら貸主は業法対象外"},{"f":"業法","t":"37条書面","ref":"H25-31-イ","s":"宅建業者が建物の売買を媒介して契約が成立した場合、売主及び買主の双方に対して、遅滞なく37条書面を交付しなければならない。","a":1,"e":"媒介や代理をした業者は、契約の各当事者に37条書面を交付する義務がある（37条1項）。","m":"37条書面は双方へ"},{"f":"業法","t":"37条書面","ref":"H25-31-ウ","s":"宅建業者が媒介した売買契約に天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を37条書面に記載しなければならない。","a":1,"e":"不可抗力による損害の負担（危険負担）の定めは任意的記載事項で、定めがあれば記載が必要。","m":"危険負担は定めあれば記載"},{"f":"業法","t":"37条書面","ref":"H25-31-エ","s":"宅建業者が自ら売主として宅地を売却する場合、買主も宅建業者であれば、相手方の保護が不要であるため37条書面の交付を省略できる。","a":0,"e":"37条書面は業者間取引でも交付が必要。業者間で適用除外となるのは8種制限などに限られる。","m":"業者間でも37条書面"},{"f":"業法","t":"広告","ref":"H25-32-ア","s":"宅建業者は、建築確認を受ける前の工事完了前の賃貸住宅について、取引態様を媒介と明示すれば、借主を募集する広告をすることができる。","a":0,"e":"未完成物件の広告開始時期の制限は貸借にも及び、建築確認等の処分前は広告できない（33条）。","m":"広告は確認後・貸借も"},{"f":"業法","t":"業務上の規制","ref":"H25-32-イ","s":"宅建業者は、建築確認を受ける前の工事完了前の賃貸住宅について、貸主から代理を依頼され、借主と賃貸借契約を締結することができる。","a":1,"e":"契約締結時期の制限は売買・交換のみで、貸借の代理・媒介には適用されない（36条）。","m":"貸借の契約は確認前OK"},{"f":"業法","t":"業務上の規制","ref":"H25-32-ウ","s":"宅建業者は、建築確認を受けた工事完了前の建売住宅について、売主から専任媒介を依頼され、広告や売買契約の媒介を行うことができる。","a":1,"e":"建築確認等の処分があれば、未完成物件でも広告や売買契約の締結・媒介を行うことができる。","m":"確認後なら売買OK"},{"f":"業法","t":"広告","ref":"H25-32-エ","s":"宅建業者は、建築確認を受ける前の工事完了前の建売住宅について、取引態様を媒介と明示すれば、販売広告をすることができる。","a":0,"e":"未完成物件は建築確認等の処分前は取引態様を問わず広告できず、媒介と明示しても違反となる（33条）。","m":"確認前は広告不可"},{"f":"業法","t":"重要事項説明","ref":"H25-33-1","s":"宅建業者が自ら売主として分譲マンションを売却する場合、管理組合の総会の議決権に関する事項を、管理規約を添付して説明しなければならない。","a":0,"e":"管理組合の総会の議決権に関する事項は、区分所有建物の重要事項の説明事項に含まれていない。","m":"議決権は説明不要"},{"f":"業法","t":"重要事項説明","ref":"H25-33-2","s":"分譲マンションの売買の媒介において、共用部分に関する規約の定めがまだ案の段階であるときは、その案の内容を説明しなければならない。","a":1,"e":"共用部分に関する規約の定めは、案の段階であってもその案の内容を説明する必要がある。","m":"規約案でも説明"},{"f":"業法","t":"重要事項説明","ref":"H25-33-3","s":"宅建業者がマンション1戸の貸借の媒介を行う場合、容積率や建蔽率に関する制限があるときは、その概要を借主に説明しなければならない。","a":0,"e":"建物の貸借では容積率・建蔽率の制限は説明対象外。借主が建物を建てることはないため。","m":"貸借に容積・建蔽なし"},{"f":"業法","t":"重要事項説明","ref":"H25-33-4","s":"建物の貸借の媒介において、借賃以外に授受される金銭の定めがあるときは、その額・授受の目的に加え、保管方法も説明しなければならない。","a":0,"e":"説明が必要なのは借賃以外の金銭の額と授受の目的のみで、その保管方法は説明事項ではない。","m":"保管方法は不要"},{"f":"業法","t":"クーリング・オフ","ref":"H25-34-1","s":"宅建業者Aが自ら売主となる宅地の売買で、買主Bが自ら指定した喫茶店で申込み・契約をし、翌日に解除を申し出た場合、Aは受領済みの手付金等の返還を拒める。","a":0,"e":"喫茶店は事務所等に当たらず解除できる。解除されたら売主は受領した金銭を速やかに全額返還する。","m":"喫茶店は解除できる"},{"f":"業法","t":"クーリング・オフ","ref":"H25-34-2","s":"宅建業者が売主の宅地売買で、月曜日にホテルのロビーで申込み・契約をし、同日書面でクーリング・オフについて告げられた買主は、翌週の火曜日まで解除できる。","a":0,"e":"告げられた日を含めて8日以内なので、期限は翌週の月曜日。火曜日では期限を過ぎている。","m":"告知日を含めて8日"},{"f":"業法","t":"クーリング・オフ","ref":"H25-34-3","s":"買主が自ら指定した、売主業者から代理・媒介の依頼を受けていないハウスメーカーの事務所で契約し、告知の6日後に解除の書面を発した場合、解除できる。","a":1,"e":"代理・媒介の依頼を受けていない他社の事務所は事務所等に当たらず、8日以内の書面発信で解除できる。","m":"無関係の他社はOK"},{"f":"業法","t":"クーリング・オフ","ref":"H25-34-4","s":"テント張りの案内所で申込みをし、後日売主業者の事務所で契約して代金全額を支払った買主は、引渡し前でもクーリング・オフによる解除はできない。","a":0,"e":"テント張りの案内所は事務所等に当たらない。代金全額の支払いに加え引渡しも受けるまでは解除できる。","m":"引渡し＋全額で終了"},{"f":"業法","t":"37条書面","ref":"H25-35-ア","s":"宅建業者が建物の貸借を媒介して契約を成立させたときは、37条書面に借主の保証人の氏名及び住所を必ず記載しなければならない。","a":0,"e":"保証人の氏名・住所は37条書面の記載事項に含まれない。貸借では当事者・物件・借賃・引渡時期などが必要的記載事項。","m":"保証人は37条に不要"},{"f":"業法","t":"37条書面","ref":"H25-35-イ","s":"宅建業者が建物の貸借を媒介して契約を成立させたときは、当事者に交付する37条書面に建物の引渡しの時期を必ず記載しなければならない。","a":1,"e":"引渡しの時期は貸借でも37条書面の必要的記載事項。なお35条の重要事項説明の対象ではない点と区別する。","m":"引渡時期は37条だけ"},{"f":"業法","t":"37条書面","ref":"H25-35-ウ","s":"宅建業者が建物の貸借を媒介して契約を成立させたときは、37条書面に借賃の額とその支払の時期及び方法を必ず記載しなければならない。","a":1,"e":"借賃の額・支払の時期・支払の方法は、貸借の37条書面の必要的記載事項とされている（37条2項）。","m":"借賃は額・時期・方法"},{"f":"業法","t":"37条書面","ref":"H25-35-エ","s":"宅建業者が建物の貸借の媒介で契約を成立させたときは、37条書面に自らが受領する媒介報酬の額を必ず記載しなければならない。","a":0,"e":"報酬額は37条書面の記載事項ではない。報酬額の記載は売買・交換の媒介契約書（34条の2）の話で、貸借には及ばない。","m":"報酬額は37条に不要"},{"f":"業法","t":"37条書面","ref":"H25-35-オ","s":"建物の貸借の媒介で借賃以外の金銭の授受の定めがあるとき、37条書面にはその額・授受の時期・目的を記載すれば足り、授受の方法までは記載を要しない。","a":1,"e":"借賃以外の金銭は「額・授受の時期・目的」が記載事項で、「方法」は含まれない（37条2項3号）。","m":"他の金銭は額・時期・目的"},{"f":"業法","t":"重要事項説明","ref":"H25-36-1","s":"宅建業者が宅地売買の媒介で契約直前に私道負担に気づいた場合、重要事項説明が済んでいれば、追加説明をせず37条書面に記載して交付すれば足りる。","a":0,"e":"私道負担は重要事項で、契約成立前に説明が必要。37条書面への記載で代えることはできない。","m":"私道負担は契約前に"},{"f":"業法","t":"営業保証金","ref":"H25-36-2","s":"宅建業者が自ら売主となる宅地の売買で、契約成立後に37条書面に供託所等を記載して説明すれば、契約前に供託所等の説明をしなくても違反とならない。","a":0,"e":"供託所等の説明は、宅建業者でない相手方に対し契約が成立するまでに行う必要がある（35条の2）。","m":"供託所説明は契約前"},{"f":"業法","t":"37条書面","ref":"H25-36-3","s":"建物の貸借の媒介で、37条書面に記名した宅建士が不在のときは、宅建士でない従業者に37条書面を借主へ交付させても違反とならない。","a":1,"e":"37条書面への記名は宅建士が行う必要があるが、書面の交付や説明は宅建士でなくてもよい。","m":"交付は誰でもOK"},{"f":"業法","t":"37条書面","ref":"H25-36-4","s":"宅建業者間の宅地売買を媒介した宅建業者は、契約不適合責任についての特約があっても、業者間取引であれば37条書面への記載を省略できる。","a":0,"e":"契約不適合責任の定めは任意的記載事項で、業者間取引でも定めがあれば37条書面に記載が必要。","m":"業者間も記載必要"},{"f":"業法","t":"報酬","ref":"H25-37-ア","s":"税込5,500万円（うち土地2,200万円）の土地付建物の売買で、課税事業者である売主の代理業者が356万4,000円、買主の媒介業者が178万2,000円を受領しても違反しない。","a":0,"e":"本体5,200万円での代理報酬の上限は356万4,000円。1つの取引での両業者の合計もこの額が上限で、超過する。","m":"合計は代理の上限まで"},{"f":"業法","t":"報酬","ref":"H25-37-イ","s":"税込5,500万円（うち土地2,200万円）の土地付建物の売買で、売主側の代理業者が230万円、買主側の媒介業者が関係者の了承を得て150万円を受領しても違反しない。","a":0,"e":"合計380万円は上限の356万4,000円（課税事業者）を超える。依頼者らの了承があっても上限は超えられない。","m":"了承あっても上限超えNG"},{"f":"業法","t":"報酬","ref":"H25-37-ウ","s":"媒介業者が、買主の特別の依頼による遠隔地の現地調査に要した費用を事前に買主の承諾を得て受領することは、報酬の上限額とは別に認められる。","a":1,"e":"依頼者の特別の依頼で発生し、事前に負担の承諾を得た費用は、報酬とは別に受領できる（報酬告示）。","m":"特別依頼の実費は別"},{"f":"業法","t":"8種制限","ref":"H25-38-ア","s":"宅建業者が自ら売主となり業者でない買主に中古住宅を売る場合、雨漏り・シロアリ害・構造耐力上主要な部分の不適合に限り、引渡しから2年以内の通知で責任を負う特約は有効である。","a":0,"e":"責任の対象を一部の不適合に限定する特約は、民法より買主に不利なため無効となる（40条）。","m":"責任範囲の限定は無効"},{"f":"業法","t":"8種制限","ref":"H25-38-イ","s":"宅建業者が自ら売主となり業者でない買主と代金3,500万円の新築マンションの売買をする場合、損害賠償の予定額と違約金の合計を700万円とする特約は有効である。","a":1,"e":"損害賠償額の予定と違約金の合計は代金の2割まで。3,500万円の2割は700万円なので有効（38条）。","m":"予定＋違約金で2割"},{"f":"業法","t":"8種制限","ref":"H25-38-ウ","s":"宅建業者が自ら売主となり手付金と中間金を受領した場合、相手方の履行着手前なら買主は支払済みの手付金と中間金を放棄して解除できるとする特約は有効である。","a":0,"e":"買主が手付に加え中間金まで放棄しなければ解除できないのは、買主に不利なため無効（39条3項）。","m":"買主に不利な手付特約は無効"},{"f":"業法","t":"保証協会","ref":"H25-39-1","s":"保証協会は、社員が取り扱った取引に関する相手方等からの苦情の解決について、申出及びその解決の結果を社員に周知させなければならない。","a":1,"e":"苦情の解決は保証協会の必須業務の一つで、申出と解決結果を社員に周知する義務がある（64条の5）。","m":"苦情は社員に周知"},{"f":"業法","t":"保証協会","ref":"H25-39-2","s":"宅建業者が保証協会の社員となった場合、その旨を免許権者に報告する義務を負うのは、保証協会ではなく加入した宅建業者自身である。","a":0,"e":"新たに社員が加入したときや社員の地位を失ったとき、免許権者に報告するのは保証協会である（64条の4）。","m":"報告するのは協会"},{"f":"業法","t":"保証協会","ref":"H25-39-3","s":"弁済業務保証金の還付があった場合、還付に係る社員は、保証協会の通知を受けて、還付充当金を直接供託所に供託しなければならない。","a":0,"e":"社員は還付充当金を供託所ではなく保証協会に納付する。期限は通知を受けた日から2週間以内（64条の10）。","m":"還付充当金は協会へ"},{"f":"業法","t":"保証協会","ref":"H25-39-4","s":"保証協会に加入しようとする宅建業者は、加入した日から2週間以内に、政令で定める額の弁済業務保証金分担金を保証協会に納付すればよい。","a":0,"e":"弁済業務保証金分担金は、加入しようとする日までに金銭で納付しなければならない（64条の9）。","m":"分担金は加入日まで"},{"f":"業法","t":"8種制限","ref":"H25-40-1","s":"宅建業者が自ら売主として未完成の建物を宅建業者でない買主に売却し、代金の5%を超える手付金を受け取る場合、保全措置として指定保管機関による保管を選ぶこともできる。","a":0,"e":"未完成物件で使える保全措置は銀行等の保証と保険事業者の保証保険だけ。指定保管機関による保管は完成物件に限られる（宅建業法41条・41条の2）。","m":"未完成は保証と保険だけ"},{"f":"業法","t":"8種制限","ref":"H25-40-2","s":"宅建業者Aが売主となり、販売代理を宅建業者Cに任せて一般の買主に未完成マンションを売る場合、AかCのどちらかが保全措置を講じれば、Aは代金の5%を超える手付金を受け取れる。","a":0,"e":"保全措置を講じる義務を負うのは自ら売主となる宅建業者A。代理業者Cが講じても義務を果たしたことにはならない（41条）。","m":"保全するのは売主業者"},{"f":"業法","t":"8種制限","ref":"H25-40-3","s":"宅建業者が自ら売主となり、宅建業者である買主に未完成の建物（代金5,000万円）を売る場合、保全措置を講じないまま引渡し前に500万円の手付金を受け取ることができる。","a":1,"e":"手付金等の保全措置は8種制限の一つで、買主も宅建業者である業者間取引には適用されない（78条2項）。","m":"業者間に8種制限なし"},{"f":"業法","t":"8種制限","ref":"H25-40-4","s":"宅建業者が自ら売主として一般の買主に代金4,000万円の未完成マンションを売り、手付金100万円を受け取った後に中間金200万円を受け取る場合、手付金が代金の5%以内なので保全措置は不要である。","a":0,"e":"中間金も手付金等に含まれる。合計300万円が代金の5%（200万円）を超えるので、中間金を受け取る前に保全措置が必要（41条）。","m":"中間金も合算して判定"},{"f":"業法","t":"事務所・案内所","ref":"H25-41-1","s":"宅建業者が事務所ごとに備える業務に関する帳簿は、紙で作成しなければならず、パソコンのハードディスク等に記録して必要に応じ紙に印刷できる状態にしておく方法で代えることはできない。","a":0,"e":"帳簿は電磁的記録で備えることも認められる。必要時に紙面に表示できれば、帳簿への記載に代えられる。","m":"帳簿はデータ保存OK"},{"f":"業法","t":"事務所・案内所","ref":"H25-41-2","s":"宅建業者は、事務所ごとに公衆の見やすい場所へ国土交通省令で定める標識を掲げなければならないが、免許証を事務所に掲げる義務はない。","a":1,"e":"事務所に掲示義務があるのは国土交通省令で定める標識であり（法50条1項）、免許証の掲示義務はない。","m":"掲げるのは標識だけ"},{"f":"業法","t":"事務所・案内所","ref":"H25-41-3","s":"宅建業者は、事務所ごとに備える帳簿について、取引があった月の翌月1日までに、その月にした取引の内容をまとめて記載すれば足りる。","a":0,"e":"帳簿には取引のあったつど、所定の事項を記載しなければならない（法49条）。月ごとのまとめ記載は不可。","m":"帳簿は取引のつど"},{"f":"業法","t":"業務上の規制","ref":"H25-41-4","s":"宅建業者の従業者が宅地建物取引士であって宅建士証を携帯している場合には、宅建業者はその者に従業者証明書を携帯させる必要はない。","a":0,"e":"従業者証明書は宅建士証で代用できない。宅建士である従業者にも携帯させる必要がある（法48条1項）。","m":"宅建士証は代わりにならぬ"},{"f":"業法","t":"免許","ref":"H25-43-1","s":"甲県内にのみ事務所を置く甲県知事免許の宅建業者が、乙県所在の宅地の売買を媒介するには、国土交通大臣への免許換えを申請しなければならない。","a":0,"e":"免許換えが必要なのは事務所の設置状況が変わる場合。知事免許でも全国の物件を取引でき、乙県に事務所がなければ不要。","m":"知事免許でも全国OK"},{"f":"業法","t":"監督・罰則","ref":"H25-43-2","s":"甲県知事免許の宅建業者が乙県内での業務について乙県知事から指示処分を受けたときは、業者自身がその旨を甲県知事に届け出なければならない。","a":0,"e":"業者に届出義務はない。処分をした乙県知事が、遅滞なく免許権者である甲県知事に通知する仕組み。","m":"処分した知事が通知"},{"f":"業法","t":"免許の基準","ref":"H25-43-3","s":"法人の政令で定める使用人（支店長）が覚醒剤取締法違反で拘禁刑に処され、執行終了から5年を経ていないときは、その者が役員でなくても法人は免許を受けられない。","a":1,"e":"役員だけでなく政令使用人に欠格事由がある場合も法人は免許を受けられない（宅建業法5条1項）。","m":"政令使用人の欠格も波及"},{"f":"業法","t":"免許の基準","ref":"H25-43-4","s":"宅地建物取引業に関し不正又は不誠実な行為をするおそれが明らかな者は、宅建業法違反で罰金刑に処せられたことがなくても免許を受けられない。","a":1,"e":"「不正・不誠実な行為をするおそれが明らかな者」は刑罰の有無と関係なく独立の欠格事由（5条1項）。","m":"おそれが明らか＝欠格"},{"f":"業法","t":"宅建士","ref":"H25-44-ア","s":"甲県知事の登録を受けている宅地建物取引士が破産手続開始の決定を受けて復権を得ない者となった場合、本人がその日から30日以内に甲県知事へ届け出なければならない。","a":1,"e":"破産の場合の届出は本人が30日以内に登録知事へ行う（法21条）。変更の登録の「遅滞なく」と区別する。","m":"破産は本人30日"},{"f":"業法","t":"宅建士","ref":"H25-44-イ","s":"宅地建物取引士証の交付を受けようとする者は、原則として、交付申請の90日前から30日前までの間に行われる都道府県知事指定の講習を受講しなければならない。","a":0,"e":"法定講習は交付申請前6か月以内に行われるものを受講する（法22条の2第2項）。合格後1年以内等は不要。","m":"講習は申請前6か月"},{"f":"業法","t":"宅建士","ref":"H25-44-ウ","s":"宅建業者が交付する35条書面及び37条書面への記名は、その事務所に置かれる成年者である専任の宅地建物取引士が行わなければならない。","a":0,"e":"記名は宅建士であればよく、専任である必要はない。35条書面と37条書面の記名者が同じである必要もない。","m":"記名は専任でなくてよい"},{"f":"業法","t":"宅建士","ref":"H25-44-エ","s":"事務禁止処分を受けた宅地建物取引士は、宅建士証の交付を受けた都道府県知事に速やかに宅建士証を提出しなければならず、怠ると10万円以下の過料に処せられることがある。","a":1,"e":"事務禁止処分を受けたら交付を受けた知事へ宅建士証を提出する（法22条の2第7項）。違反は10万円以下の過料。","m":"事務禁止→証を提出"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H25-45-1","s":"宅建業者が自ら売主として新築住宅を売る場合、買主が宅建業者ではない建設業者であれば、売主は資力確保措置（保証金の供託または保険契約の締結）を講じる必要はない。","a":0,"e":"資力確保措置が不要になるのは買主が宅建業者の場合だけ。建設業者でも宅建業者でなければ措置が必要（住宅瑕疵担保履行法2条・11条）。","m":"不要なのは買主が宅建業者"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H25-45-2","s":"新築住宅を売った宅建業者が基準日に係る資力確保措置の状況を届け出なかったときは、基準日から3週間を経過した日以後、新たに自ら売主となる新築住宅の売買契約を締結できなくなる。","a":0,"e":"届出をしないと、基準日の翌日から起算して50日を経過した日以後、新たな売買契約を締結できなくなる。3週間ではない（13条）。","m":"届出なし→50日後から禁止"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H25-45-3","s":"住宅販売瑕疵担保保証金を供託している宅建業者は、供託所の所在地等を記載した書面の交付と説明を、新築住宅の引渡しまでに行えば足りる。","a":0,"e":"供託所の所在地等の説明と書面交付は、売買契約を締結するまでに行う必要がある。引渡しまでではない（15条）。","m":"供託所説明は契約締結前"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H25-45-4","s":"住宅販売瑕疵担保保証金の額を算定する際の販売新築住宅の合計戸数は、床面積55㎡以下の住宅については2戸をもって1戸と数える。","a":1,"e":"保証金の額の基礎となる戸数の算定では、床面積55㎡以下の住宅は2戸で1戸と数える（11条3項・施行令）。","m":"55㎡以下は2戸で1戸"},{"f":"税他","t":"住宅金融支援機構","ref":"H25-46-1","s":"住宅金融支援機構は、住宅の建設・購入に付随する土地や借地権の取得資金に係る金融機関の貸付債権については、譲受けの対象としていない。","a":0,"e":"証券化支援事業の譲受け対象には、住宅の建設・購入に付随する土地や借地権の取得資金に係る貸付債権も含まれる。","m":"付随する土地資金も対象"},{"f":"税他","t":"住宅金融支援機構","ref":"H25-46-2","s":"住宅金融支援機構は、地震などの災害によって住宅が滅失した場合、それに代わる建築物の建設や購入に必要な資金について、金融機関を通さず直接融資を行っている。","a":1,"e":"機構は原則として直接融資をしないが、災害復興住宅の資金などは例外として直接融資の対象としている。","m":"災害復興は直接融資"},{"f":"税他","t":"住宅金融支援機構","ref":"H25-46-3","s":"住宅金融支援機構は、団体信用生命保険業務として、貸付けを受けた者が死亡した場合などに支払われる生命保険金を、その者の住宅ローン債務の弁済に充てる業務を行っている。","a":1,"e":"機構は団体信用生命保険業務を行い、死亡等の際に支払われる保険金で残りの住宅ローンを弁済する仕組みを運営している。","m":"団信で残債を弁済"},{"f":"税他","t":"住宅金融支援機構","ref":"H25-46-4","s":"住宅金融支援機構の証券化支援事業（買取型）で買い取る貸付債権には、本人が住む住宅だけでなく、親族が住む住宅の建設・購入資金に係るものも含まれる。","a":1,"e":"買取型の対象は、申込者本人のほか、その親族が居住する住宅の建設・購入資金に係る貸付債権も含まれる。","m":"親族の住む家もOK"},{"f":"税他","t":"景品表示法","ref":"H25-47-1","s":"宅建業者が物件の周囲の状況を示す完成予想図に、実際には存在しない商業施設を描き込む場合でも、予想図である旨を明示していれば不当表示にはならない。","a":0,"e":"完成予想図で周囲の状況を表す場合も現況に反する表示はできない。実在しない施設は、予想図と明示しても表示できない（表示規約）。","m":"ない施設は描けない"},{"f":"税他","t":"景品表示法","ref":"H25-47-2","s":"宅建業者が土地の広告で地目を表示する場合、登記簿上の地目と現況の地目が異なっていても、登記簿上の地目だけを表示すれば足り、現況の地目を併記する必要はない。","a":0,"e":"地目は登記簿の記載を表示し、現況と異なるときは現況の地目も併せて表示しなければならない（表示規約施行規則）。","m":"地目違えば現況も併記"},{"f":"税他","t":"景品表示法","ref":"H25-47-3","s":"中古マンションの広告で管理費を表示する場合、1戸当たりの月額を示すのが原則だが、住戸ごとに額が異なり全住戸分の表示が困難なときは、最低額と最高額だけを示すことができる。","a":1,"e":"管理費は1戸当たりの月額を表示する。全住戸分の表示が困難なときは最低額と最高額のみの表示も認められる（表示規約施行規則）。","m":"管理費は最低と最高でも可"},{"f":"税他","t":"景品表示法","ref":"H25-47-4","s":"宅建業者が建物を広告する場合、建築後1年未満の建物であれば、すでに人が住んだことがあっても、広告で「新築」と表示することができる。","a":0,"e":"「新築」と表示できるのは、建築後1年未満で、かつ居住の用に供されたことがない建物に限られる（表示規約18条）。","m":"新築は1年未満＋未入居"},{"f":"税他","t":"土地・建物","ref":"H25-49-1","s":"日本の国土を、山地・丘陵地・火山地からなる山地と、台地・低地からなる平地に分けると、山地が国土の約75%を占め、平地は約25%にとどまる。","a":1,"e":"日本の国土は山地が約4分の3を占め、台地・低地からなる平地は約4分の1にとどまる。","m":"国土の3/4は山"},{"f":"税他","t":"土地・建物","ref":"H25-49-2","s":"日本の火山地は国土の約7%を占め、なだらかな地形の所もあるが、土質が悪く水利に乏しいため、山林や原野のまま残っている所が多い。","a":1,"e":"火山地は国土の約7%で、土質が悪く水利に乏しいため、山林や原野のままの所が多い。","m":"火山地は水利に乏しい"},{"f":"税他","t":"土地・建物","ref":"H25-49-3","s":"日本の台地・段丘は国土の約12%を占め、一般に水はけがよく地盤も安定しているため、低地に比べて宅地などの土地利用に適している。","a":1,"e":"台地・段丘は国土の約12%で、一般に水はけがよく地盤が安定しており、宅地などの土地利用に適する。","m":"台地は安定して宅地向き"},{"f":"税他","t":"土地・建物","ref":"H25-49-4","s":"日本の低地は国土の約25%を占め、平坦で利用しやすいうえ、洪水や津波、地震による液状化などの災害の危険度は低い土地である。","a":0,"e":"低地は国土の約13%で、洪水・津波・液状化などの災害危険度が高い。面積も危険度も誤り。","m":"低地は災害に弱い"},{"f":"税他","t":"土地・建物","ref":"H25-50-1","s":"建物の耐震構造とは、柱・はり・耐震壁などで建物自体の強度や粘り強さを高め、地震の揺れに建物全体で耐えられるようにする構造である。","a":1,"e":"耐震構造は柱・はり・耐震壁などの構造体を強くして、地震のエネルギーに耐える方式である。","m":"耐震は強さで耐える"},{"f":"税他","t":"土地・建物","ref":"H25-50-2","s":"建物の免震構造とは、建物の基礎と上部構造の間に積層ゴムなどの免震装置を入れ、地震の揺れが上部の建物に伝わりにくくする構造である。","a":1,"e":"免震構造は積層ゴム等の免震装置で揺れを吸収し、上部の建物に伝わる揺れを小さくする。","m":"免震は揺れを伝えない"},{"f":"税他","t":"土地・建物","ref":"H25-50-3","s":"建物の制震構造とは、制震ダンパーなどの装置を柱・はり・壁に組み込み、地震のエネルギーを吸収して建物の揺れを制御する構造である。","a":1,"e":"制震構造はダンパー等で揺れのエネルギーを吸収する方式で、揺れが大きくなりやすい高層建物に有効。","m":"制震はダンパーで吸収"},{"f":"税他","t":"土地・建物","ref":"H25-50-4","s":"現行の耐震基準を満たさない既存不適格建築物の耐震補強の方法としては、制震構造や免震構造を用いることは適しておらず、行われていない。","a":0,"e":"既存建物の耐震補強として、制震改修や免震改修を用いることは適しており、実際に行われている。","m":"既存の補強にも免震・制震"},{"f":"権利","t":"賃貸借","ref":"H26-01-1","s":"賃借人が賃貸人に無断で賃借物を転貸した場合でも、それが賃貸人に対する背信的行為と認めるに足りない特段の事情があるときは、賃貸人は契約を解除できない。","a":1,"e":"民法612条2項は無断転貸で解除できるとするが、判例は信頼関係を壊さない特段の事情があれば解除を認めない。","m":"信頼関係破壊なければ解除不可"},{"f":"権利","t":"債務不履行・解除","ref":"H26-01-2","s":"売買などの契約の当事者は、相手方に債務不履行があった場合に支払う損害賠償の額を、あらかじめ契約で予定しておくことができる。","a":1,"e":"損害賠償額の予定は民法420条1項に定められている。違約金も賠償額の予定と推定される（同条3項）。","m":"賠償額は予定できる"},{"f":"権利","t":"債務不履行・解除","ref":"H26-01-4","s":"特別の事情によって生じた損害は、当事者がその事情を予見すべきであったときに限り、債務不履行による損害賠償として請求できる。","a":1,"e":"特別損害は、当事者がその事情を予見すべきであった場合に賠償の対象となる（民法416条2項、改正後は「予見すべき」）。","m":"特別損害は予見すべきなら"},{"f":"権利","t":"代理","ref":"H26-02-1","s":"Bが代理権なくAの代理人としてCと契約し、Aが後にこれを追認したときは、別段の意思表示がない限り、その契約は追認をした時から効力を生じる。","a":0,"e":"追認は、別段の意思表示がない限り、契約の時にさかのぼって効力を生じる（民法116条）。","m":"追認は契約時にさかのぼる"},{"f":"権利","t":"代理","ref":"H26-02-3","s":"代理人は行為能力者であることを要しないが、委任による代理人が代理権を与えられた後に後見開始の審判を受けたときは、その代理権は消滅する。","a":1,"e":"制限行為能力者も代理人になれる（102条）。ただし代理人の後見開始の審判は代理権の消滅原因である（111条1項2号）。","m":"代理人の後見開始で消滅"},{"f":"権利","t":"代理","ref":"H26-02-4","s":"代理人が相手方にした意思表示について、錯誤や詐欺の有無によって効力が左右される場合、その事実の有無は本人と代理人のどちらを基準にするか本人が選んで決めることができる。","a":0,"e":"意思表示の瑕疵などの事実の有無は、原則として代理人を基準に判断する（民法101条1項）。本人が選ぶことはできない。","m":"瑕疵は代理人で判断"},{"f":"権利","t":"物権変動・対抗","ref":"H26-03-1","s":"無権利者から土地を買い受けた者が、売主を所有者だと過失なく信じて占有を始めた場合、即時取得によって直ちにその土地の所有権を取得する。","a":0,"e":"即時取得（民法192条）は動産の取引にだけ適用され、土地や建物などの不動産には適用されない。","m":"即時取得は動産だけ"},{"f":"権利","t":"時効","ref":"H26-03-2","s":"土地の所有者が20年間、その土地を使用せず所有権を全く行使しなかった場合、その土地の所有権は消滅時効によって当然に消滅する。","a":0,"e":"所有権は消滅時効にかからない（民法166条2項は所有権以外の財産権を対象とする）。","m":"所有権は時効で消えない"},{"f":"権利","t":"時効","ref":"H26-03-3","s":"買主が売主に対して有する契約不適合を理由とする損害賠償請求権は、消滅時効の対象となり、目的物の引渡しを受けた時から10年を経過すると時効により消滅し得る。","a":1,"e":"担保責任に基づく損害賠償請求権にも消滅時効の規定が適用され、判例は引渡し時から進行するとする（民法166条1項2号）。","m":"担保責任も引渡しから10年"},{"f":"権利","t":"時効","ref":"H26-03-4","s":"賃貸借契約に基づいて他人の土地を20年間平穏かつ公然と占有し続けた賃借人は、取得時効によってその土地の所有権を取得できる。","a":0,"e":"所有権の取得時効には所有の意思が必要。賃借人の占有は性質上所有の意思がないので時効取得できない（民法162条）。","m":"賃借人に所有の意思なし"},{"f":"権利","t":"抵当権・担保","ref":"H26-04-1","s":"根抵当権は、極度額の限度で、債権者と債務者の間に生じるあらゆる範囲の不特定の債権を担保するものとして設定することができる。","a":0,"e":"根抵当権では担保する債権の範囲を一定の種類の取引などで定める必要があり、包括根抵当は認められない（民法398条の2）。","m":"包括根抵当は禁止"},{"f":"権利","t":"抵当権・担保","ref":"H26-04-2","s":"A所有の土地にCの債務を担保する根抵当権を設定した場合、根抵当権者がこれを第三者に対抗するには、登記に加えて債務者Cの異議をとどめない承諾が必要である。","a":0,"e":"根抵当権も抵当権と同じく登記によって第三者に対抗できる。債務者の承諾は不要（民法177条）。","m":"根抵当も登記で対抗"},{"f":"権利","t":"抵当権・担保","ref":"H26-04-3","s":"自分の土地に他人の債務のための抵当権を設定した物上保証人は、抵当権が実行される場合、債権者に対してまず債務者に催告するよう請求できる。","a":0,"e":"物上保証人には保証人のような催告の抗弁権がない。抵当権でも根抵当権でも同じである。","m":"物上保証人に催告の抗弁なし"},{"f":"権利","t":"抵当権・担保","ref":"H26-04-4","s":"普通抵当権の抵当権者は他の抵当権者にその順位を譲渡できるが、元本確定前の根抵当権者は、他の抵当権者に順位を譲渡することができない。","a":1,"e":"普通抵当権は順位の譲渡ができる（376条）が、元本確定前の根抵当権はできない（398条の11）。","m":"確定前根抵当は順位譲渡不可"},{"f":"権利","t":"不法行為・請負・委任","ref":"H26-06-2","s":"建築業者が建てた建物に基本的な安全性を損なう欠陥がある場合、その建物を転得した買主は、建築業者に過失があれば、契約関係がなくても不法行為に基づく損害賠償を請求できる。","a":1,"e":"判例は、設計・施工者が建物の基本的な安全性に配慮する注意義務を怠った場合、居住者等に不法行為責任を負うとする（最判平19.7.6）。","m":"基本的安全性→不法行為"},{"f":"権利","t":"不法行為・請負・委任","ref":"H26-06-3","s":"建物の欠陥による不法行為に基づく損害賠償請求権は、被害者が欠陥の存在を知った時から1年以内に行使しなければ、時効により消滅する。","a":0,"e":"不法行為の損害賠償請求権は、損害と加害者を知った時から3年（人身は5年）、不法行為の時から20年で時効消滅する（724条・724条の2）。","m":"不法行為は3年・20年"},{"f":"権利","t":"不法行為・請負・委任","ref":"H26-06-4","s":"請負で完成した建物に重大な契約不適合があり契約の目的を達成できない場合でも、目的物が建物である以上、注文者は請負契約を解除することができない。","a":0,"e":"改正前は建物の請負は解除できなかったが、この規定（旧635条）は削除され、今は一般の解除の規定で解除できる。","m":"建物請負も解除できる"},{"f":"権利","t":"賃貸借","ref":"H26-07-1","s":"借地上の建物を所有する借地人が、地主に無断でその建物を第三者に賃貸した場合、地主は土地の無断転貸を理由に借地契約を解除できる。","a":0,"e":"判例は、借地上の建物を賃貸しても土地を転貸したことにはならないとする。よって無断転貸を理由に解除できない。","m":"建物の賃貸≠土地の転貸"},{"f":"権利","t":"賃貸借","ref":"H26-07-2","s":"土地を賃借して地上の建物を自己名義で登記している借地人は、第三者がその土地を不法占拠しているときは、借地権に基づいて妨害の停止を請求できる。","a":1,"e":"対抗要件を備えた不動産賃借人は、不法占拠者に対して妨害の停止や返還を請求できる（民法605条の4）。","m":"対抗力ある賃借人は排除可"},{"f":"権利","t":"賃貸借","ref":"H26-07-3","s":"賃貸人の承諾を得て土地が転貸された後、原賃貸借が賃借人の債務不履行により解除された場合、賃貸人はその解除を転借人に対抗できない。","a":0,"e":"債務不履行解除は転借人に対抗でき、賃貸人は転借人に明渡しを求められる（判例・民法613条3項ただし書）。","m":"債務不履行解除は転借人に対抗可"},{"f":"権利","t":"賃貸借","ref":"H26-07-4","s":"建物所有目的で土地を賃借している者は、賃料の支払時期について特約がない場合、毎月末日までに翌月分の賃料を支払わなければならない。","a":0,"e":"特約がなければ賃料は後払いで、宅地や建物は毎月末に当月分を支払う（民法614条）。","m":"賃料は月末に当月分"},{"f":"権利","t":"不法行為・請負・委任","ref":"H26-08-1","s":"不法行為による損害賠償請求権の消滅時効の起算点である「損害を知った時」とは、被害者が損害の発生を現実に認識した時をいう。","a":1,"e":"判例は、「損害を知った時」を被害者が損害の発生を現実に認識した時と解している（民法724条1号）。","m":"知った時＝現実に認識"},{"f":"権利","t":"不法行為・請負・委任","ref":"H26-08-2","s":"不法行為による損害賠償債務の履行が遅れたことによって生じる遅延損害金の債権は、不法行為の時から10年を経過すると時効により消滅する。","a":0,"e":"遅延損害金債権も不法行為による損害賠償請求権と同様に扱われ、724条の期間（3年・20年）による。10年ではない。","m":"遅延損害金も3年・20年"},{"f":"権利","t":"不法行為・請負・委任","ref":"H26-08-3","s":"土地の不法占拠によって日々損害が発生する場合、消滅時効は不法占拠が終わった時から一括して進行し、日々の損害ごとに別々に進行することはない。","a":0,"e":"継続的な不法行為では、日々発生する損害ごとに、それを知った時から別々に消滅時効が進行する（判例）。","m":"日々の損害は別々に進行"},{"f":"権利","t":"不法行為・請負・委任","ref":"H26-08-4","s":"不法行為の加害者が海外に住んでいる間は、不法行為の時から20年という損害賠償請求権の消滅時効の期間は進行せず、帰国後に進行する。","a":0,"e":"加害者が海外にいても20年の期間は進行する。海外在住は時効の完成猶予・更新の事由ではない（724条2号）。","m":"海外在住でも20年は進む"},{"f":"権利","t":"意思表示・行為能力","ref":"H26-09-1","s":"成年被後見人が第三者との間で建物の贈与を受ける契約を自ら結んだ場合、成年後見人は、その契約を後から取り消すことができない。","a":0,"e":"成年被後見人の行為は、日用品の購入など日常生活に関する行為を除き取り消すことができる（民法9条）。贈与を受ける契約も同じ。","m":"日用品以外は取消可"},{"f":"権利","t":"意思表示・行為能力","ref":"H26-09-2","s":"成年後見人が成年被後見人に代わって、成年被後見人が住んでいる居住用の建物やその敷地を売却する場合、家庭裁判所の許可は必要ない。","a":0,"e":"成年被後見人の居住用の建物や敷地を売却するには、家庭裁判所の許可が必要（民法859条の3）。","m":"居住用は家裁の許可"},{"f":"権利","t":"意思表示・行為能力","ref":"H26-09-3","s":"未成年者に未成年後見人が付いている場合、その未成年後見人は、自分が後見している未成年者について、家庭裁判所に後見開始の審判を請求することはできない。","a":0,"e":"後見開始の審判を請求できる者には、本人・配偶者などのほか未成年後見人も含まれる（民法7条）。","m":"未成年後見人も請求可"},{"f":"権利","t":"意思表示・行為能力","ref":"H26-09-4","s":"成年後見人は家庭裁判所が選任するが、未成年後見人は、家庭裁判所の選任のほか、未成年者に対して最後に親権を行う者が遺言で指定することもできる。","a":1,"e":"成年後見人は家庭裁判所が選任する（843条）。未成年後見人は最後の親権者が遺言で指定でき（839条）、指定がなければ家裁が選任する。","m":"未成年後見人は遺言指定も"},{"f":"権利","t":"相続","ref":"H26-10-1","s":"被相続人に子も直系尊属もおらず、長年同居した内縁の妻と兄弟姉妹がいる場合、内縁の妻も相続人として相続財産の一部を取得する。","a":0,"e":"相続人となる配偶者は法律上の配偶者に限られ、内縁の妻は相続人にならない（民法890条）。","m":"内縁の妻は相続人でない"},{"f":"権利","t":"相続","ref":"H26-10-2","s":"兄弟姉妹が相続人となる場合、父母の一方のみを同じくする兄弟姉妹の相続分は、父母の双方を同じくする兄弟姉妹の相続分の2分の1である。","a":1,"e":"父母の一方のみを同じくする兄弟姉妹の相続分は、双方を同じくする兄弟姉妹の2分の1（民法900条4号）。","m":"半血は全血の半分"},{"f":"権利","t":"相続","ref":"H26-10-3","s":"被相続人の兄弟姉妹が相続開始前に死亡していたときは、その兄弟姉妹の子、つまり被相続人のおい・めいが代襲して相続人となる。","a":1,"e":"兄弟姉妹にも代襲相続が認められ、その子が代襲する。ただし再代襲はない（民法889条2項・887条2項）。","m":"兄弟の代襲はおい・めいまで"},{"f":"権利","t":"相続","ref":"H26-10-4","s":"相続人が異母兄B、全血の弟Cの子F・G、全血の弟Dの子Hの4人のとき、法定相続分はBが5分の1、F・Gが各5分の1、Hが5分の2である。","a":1,"e":"B:C:D＝1:2:2で、Bは5分の1、C分の5分の2をF・Gが等分し、D分の5分の2をHが取得する（民法900条・901条）。","m":"半血1:全血2で按分"},{"f":"権利","t":"借地","ref":"H26-11-1","s":"建物所有目的の土地賃貸借で存続期間を60年と定めると60年となるが、資材置場目的の土地賃貸借で60年と定めると存続期間は50年となる。","a":1,"e":"借地権は30年以上なら定めた期間となる（借地借家法3条）。建物所有目的でなければ民法が適用され、上限は50年（民法604条）。","m":"借地は上限なし、民法は50年"},{"f":"権利","t":"賃貸借","ref":"H26-11-2","s":"資材置場とする目的で土地を賃借した者は、その賃借権の登記をしても、後にその土地を買い受けた第三者に賃借権を対抗する方法はない。","a":0,"e":"不動産の賃借権は登記をすれば、その後に物権を取得した第三者に対抗できる（民法605条）。","m":"賃借権も登記で対抗"},{"f":"権利","t":"借地","ref":"H26-11-3","s":"建物所有目的の土地賃貸借で期間を定めないと存続期間は30年となるが、資材置場目的の土地賃貸借で期間を定めないと、解約申入れから1年で終了し得る。","a":1,"e":"期間の定めのない借地権は30年（借地借家法3条）。民法の土地賃貸借は解約申入れから1年で終了する（民法617条1項1号）。","m":"借地30年、民法は申入れ1年"},{"f":"権利","t":"賃貸借","ref":"H26-11-4","s":"期間の定めのある土地の賃貸借では、中途解約できる旨の特約や当事者の合意がない限り、賃借人は期間内に一方的に解約することはできない。","a":1,"e":"期間の定めがある賃貸借は、解約権を留保した場合（民法618条）や合意解約を除き、期間中の一方的な解約はできない。","m":"期間ありは中途解約不可"},{"f":"権利","t":"借家","ref":"H26-12-1","s":"借地借家法の定期建物賃貸借契約は書面によって締結しなければならないが、その書面は公正証書に限られず、通常の契約書でもよい。","a":1,"e":"定期建物賃貸借は公正証書による等書面で契約する必要があるが、公正証書以外の書面でもよい（借地借家法38条1項）。","m":"定期借家は書面、公正証書不要"},{"f":"権利","t":"借家","ref":"H26-12-2","s":"借地借家法の定期建物賃貸借で存続期間を3か月など1年未満と定めた場合、その賃貸借は期間の定めがない建物賃貸借とみなされる。","a":0,"e":"1年未満を期間の定めのないものとみなす規定（29条1項）は定期建物賃貸借には適用されず、定めた期間となる（38条1項）。","m":"定期借家は1年未満OK"},{"f":"権利","t":"借家","ref":"H26-12-3","s":"定期建物賃貸借の賃貸人が行う、契約の更新がなく期間満了で終了する旨の事前説明は、賃貸借契約書の中にその旨を記載して説明すれば足りる。","a":0,"e":"事前説明は契約書とは別個の独立した書面を交付して行う必要がある（借地借家法38条3項、判例）。","m":"説明は契約書と別の書面で"},{"f":"権利","t":"借家","ref":"H26-12-4","s":"定期建物賃貸借で、賃貸人が契約前に、更新がない旨を記載した書面を交付（承諾を得た電磁的方法による提供を含む）して説明しなかったときは、更新がない旨の定めは無効となる。","a":1,"e":"書面を交付して事前に説明しなかった場合、更新がない旨の定めは無効になる（借地借家法38条5項）。","m":"説明なし→普通借家に"},{"f":"権利","t":"区分所有法","ref":"H26-13-1","s":"区分所有者の団体は区分所有者全員で当然に構成されるが、その団体が管理組合法人になれるのは、区分所有者が30人以上の場合に限られる。","a":0,"e":"管理組合法人の成立に人数要件はない。集会の特別決議と登記で法人になれる（区分所有法47条1項）。","m":"法人化に人数要件なし"},{"f":"権利","t":"区分所有法","ref":"H26-13-2","s":"専有部分が数人の共有に属する場合、集会の招集通知は議決権を行使すべき者に、その者が定められていなければ共有者のいずれか1人にすればよい。","a":1,"e":"共有者は議決権行使者を1人定める。招集通知はその者に、定めがなければ共有者の1人にすれば足りる（35条2項）。","m":"共有者の1人に通知でOK"},{"f":"権利","t":"区分所有法","ref":"H26-13-3","s":"建物の価格の2分の1以下に相当する部分が滅失した場合、規約に別段の定めがなければ、各区分所有者は滅失した共用部分を復旧できるが、復旧の決議があった後はできない。","a":1,"e":"小規模滅失では各区分所有者が復旧できるが、復旧決議や建替え決議があった後は単独で復旧できない（61条1項）。","m":"決議後は単独復旧不可"},{"f":"権利","t":"区分所有法","ref":"H26-13-4","s":"区分所有建物の規約を保管する管理者が、正当な理由なく利害関係人による規約の閲覧を拒んだときは、20万円以下の過料に処せられる。","a":1,"e":"規約の保管者は正当な理由なく閲覧を拒めず、違反すると20万円以下の過料となる（33条2項・71条）。","m":"閲覧拒否は過料20万"},{"f":"権利","t":"不動産登記法","ref":"H26-14-1","s":"土地の地目変更や建物の表題登記など、表示に関する登記を申請する場合には、申請情報と併せて、登記原因を証する情報を提供しなければならない。","a":0,"e":"登記原因証明情報の提供が必要なのは権利に関する登記。表示に関する登記では不要（不動産登記法61条）。","m":"表示登記に原因証明不要"},{"f":"権利","t":"不動産登記法","ref":"H26-14-2","s":"新たに生じた土地や表題登記がない土地の所有権を取得した者は、その所有権の取得の日から1か月以内に表題登記を申請しなければならない。","a":1,"e":"表題登記のない土地を取得した者は、取得の日から1か月以内に表題登記を申請する義務がある（不動産登記法36条）。","m":"土地の表題登記は1か月"},{"f":"権利","t":"不動産登記法","ref":"H26-14-3","s":"信託の登記の申請は、その信託に係る権利の保存・設定・移転または変更の登記の申請と別々にすることはできず、同時にしなければならない。","a":1,"e":"信託の登記は、信託に係る権利の保存等の登記と同時に申請しなければならない（不動産登記法98条1項）。","m":"信託登記は同時申請"},{"f":"権利","t":"不動産登記法","ref":"H26-14-4","s":"仮登記は、仮登記の登記義務者の承諾があるときは、登記義務者と共同でなくても、仮登記の登記権利者が単独で申請することができる。","a":1,"e":"仮登記は、登記義務者の承諾がある場合や仮登記を命ずる処分がある場合、権利者が単独で申請できる（107条1項）。","m":"義務者の承諾で単独申請"},{"f":"法令","t":"都市計画法","ref":"H26-15-1","s":"地区計画は、用途地域が定められている土地の区域だけでなく、用途地域が定められていない土地の区域のうち一定の区域にも定めることができる。","a":1,"e":"地区計画は用途地域内のほか、用途地域が定められていない区域でも一定の要件を満たせば定められる（都市計画法12条の5）。","m":"地区計画は用途地域外も可"},{"f":"法令","t":"都市計画法","ref":"H26-15-2","s":"高度利用地区は、用途地域内において、市街地における土地の合理的かつ健全な高度利用と都市機能の更新を図るために定める地区である。","a":1,"e":"高度利用地区は用途地域内に定め、容積率の最高・最低限度などを定める（都市計画法9条19項）。","m":"高度利用地区は用途地域内"},{"f":"法令","t":"都市計画法","ref":"H26-15-3","s":"都市計画区域外に指定される準都市計画区域については、都市計画に土地区画整理事業などの市街地開発事業を定めることができる。","a":0,"e":"市街地開発事業は市街化区域または区域区分のない都市計画区域内で定める。準都市計画区域では定められない（13条1項13号）。","m":"準都計に市街地開発事業なし"},{"f":"法令","t":"都市計画法","ref":"H26-15-4","s":"高層住居誘導地区は、第一種住居地域・第二種住居地域・準住居地域のほか、近隣商業地域や準工業地域のうち一定の区域にも定めることができる。","a":1,"e":"高層住居誘導地区は、容積率40/10または50/10と定められた第一種・第二種住居、準住居、近隣商業、準工業地域に定める（9条17項）。","m":"高層住居は住居系＋近商・準工"},{"f":"法令","t":"開発許可","ref":"H26-16-ア","s":"市街化調整区域内で国が病院の建築を目的として行う1,500㎡の開発行為は、都市計画法の開発許可、またはそれに代わる協議が必要である。","a":1,"e":"病院は公益上必要な建築物の例外に当たらない。国が行う場合は協議が成立すれば許可があったものとみなされる（都市計画法34条の2）。","m":"病院は公益例外でない"},{"f":"法令","t":"開発許可","ref":"H26-16-イ","s":"市街化区域内で農業を営む者が自ら居住する住宅の建築を目的として行う1,200㎡の開発行為は、開発許可を受ける必要がない。","a":0,"e":"農林漁業者の住宅の例外は市街化区域外の話。市街化区域では1,000㎡以上なら許可が必要（29条1項1号・2号）。","m":"農家住宅例外は市街化区域外"},{"f":"法令","t":"開発許可","ref":"H26-16-ウ","s":"区域区分が定められていない都市計画区域で公民館の建築を目的として行う4,000㎡の開発行為は、開発許可を受ける必要がない。","a":1,"e":"公民館は公益上必要な建築物に当たり、面積にかかわらず開発許可は不要（都市計画法29条1項3号）。","m":"公民館は許可不要"},{"f":"法令","t":"建築基準法","ref":"H26-17-1","s":"住宅の居室には、原則として、採光のための窓その他の開口部を、その居室の床面積の7分の1以上となるように設けなければならない。","a":1,"e":"住宅の居室の採光に有効な開口部は、原則として床面積の7分の1以上必要（建築基準法28条1項）。","m":"住宅の採光は1/7"},{"f":"法令","t":"建築基準法","ref":"H26-17-2","s":"建築基準法の建築確認は、建築物の新築・増築・改築や大規模の修繕などを行う場合に必要であり、建築物の移転は建築確認の対象に含まれない。","a":0,"e":"建築確認の対象となる「建築」には新築・増築・改築・移転が含まれる（建築基準法2条13号・6条1項）。","m":"移転も建築に含む"},{"f":"法令","t":"建築基準法","ref":"H26-17-3","s":"高さ15mの建築物には、周囲の状況によって安全上支障がない場合を除き、建築基準法上、落雷に備えて避雷設備を設けなければならない。","a":0,"e":"避雷設備の設置が義務づけられるのは、高さ20mを超える建築物である（建築基準法33条）。","m":"避雷設備は20m超"},{"f":"法令","t":"建築基準法","ref":"H26-17-4","s":"準防火地域内にある建築物の屋上に看板を設ける場合、建築基準法上、その主要な部分を不燃材料で造り、または覆わなければならない。","a":0,"e":"屋上の看板等を不燃材料で造る義務は防火地域内の規制で、準防火地域にはない（建築基準法64条）。","m":"看板の不燃化は防火地域"},{"f":"法令","t":"建築基準法","ref":"H26-18-1","s":"床面積の合計が10,000㎡を超える店舗の用途に供する建築物は、特定行政庁の許可を受けた場合などを除き、工業地域内に建築することができない。","a":1,"e":"1万㎡超の店舗・飲食店等は近隣商業・商業・準工業地域でのみ建築でき、工業地域では原則不可（建築基準法48条・別表第2）。","m":"大規模店舗は工業地域不可"},{"f":"法令","t":"建築基準法","ref":"H26-18-2","s":"学校を新築する場合、建築基準法の用途制限に適合するだけでなく、都市計画によってその敷地の位置が決定されていなければならない。","a":0,"e":"都市計画で敷地の位置の決定が必要なのは卸売市場・火葬場・ごみ焼却場などで、学校は不要（建築基準法51条）。","m":"位置決定は火葬場など"},{"f":"法令","t":"建築基準法","ref":"H26-18-3","s":"特別用途地区内では、地方公共団体は、条例で用途制限を強化できるほか、国土交通大臣の承認を得て条例で用途制限を緩和することもできる。","a":1,"e":"特別用途地区では条例で用途制限を強化でき、大臣の承認を得れば緩和もできる（建築基準法49条2項）。","m":"特別用途地区は承認で緩和"},{"f":"法令","t":"建築基準法","ref":"H26-18-4","s":"建蔽率の限度が10分の8とされている地域外で、かつ防火地域内にある耐火建築物については、建蔽率の限度に10分の1を加えた数値が限度となる。","a":1,"e":"防火地域内の耐火建築物等は、建蔽率8/10の地域外なら1/10が加算される（建築基準法53条3項1号）。","m":"防火地域の耐火は＋1/10"},{"f":"法令","t":"盛土規制法","ref":"H26-19-1","s":"宅地造成等工事規制区域内で、農地を宅地にするために切土を行い、面積600㎡・高さ3mの崖を生じさせる工事をする者は、原則として都道府県知事の許可を受けなければならない。","a":1,"e":"切土で高さ2m超の崖を生じる工事や、面積500㎡超の工事は許可が必要。本問は両方に当たる。","m":"切土2m超・500㎡超は許可"},{"f":"法令","t":"盛土規制法","ref":"H26-19-2","s":"宅地造成等工事規制区域内の工事について盛土規制法の許可を受けた工事主が、その許可に付された条件に違反した場合、都道府県知事はその許可を取り消すことができる。","a":1,"e":"不正の手段で許可を受けた場合や、許可に付した条件に違反した場合、知事は許可を取り消せる。","m":"条件違反は許可取消し"},{"f":"法令","t":"盛土規制法","ref":"H26-19-3","s":"都道府県知事が規制区域の指定などのための基礎調査で他人の土地に立ち入ろうとする場合、その土地の占有者は、正当な理由がない限り立入りを拒んだり妨げたりしてはならない。","a":1,"e":"基礎調査のための立入りは、正当な理由がない限り拒めない。立ち入る者は身分証明書を携帯する。","m":"調査の立入りは拒めない"},{"f":"法令","t":"盛土規制法","ref":"H26-19-4","s":"盛土規制法の許可を受けた工事主が工事の計画を変更しようとするときは、軽微な変更であるかどうかを問わず、都道府県知事に届け出れば足りる。","a":0,"e":"計画の変更は原則として改めて知事の許可が必要。届出で足りるのは軽微な変更だけ（盛土規制法16条）。","m":"変更は許可、軽微は届出"},{"f":"法令","t":"土地区画整理法","ref":"H26-20-1","s":"換地計画において、宅地の所有者の申出または同意により換地を定めないこととされた宅地については、補償金ではなく清算金によって金銭的な調整が行われる。","a":1,"e":"申出・同意があれば換地を定めないことができ、その宅地は清算金で調整する（法90条・94条）。","m":"換地なし→清算金"},{"f":"法令","t":"土地区画整理法","ref":"H26-20-2","s":"土地区画整理組合が施行する土地区画整理事業において換地計画を定めようとするときは、市町村長の認可を受けなければならない。","a":0,"e":"組合などの民間施行者が換地計画を定めるときに必要なのは都道府県知事の認可（法86条）。","m":"換地計画は知事の認可"},{"f":"法令","t":"土地区画整理法","ref":"H26-20-3","s":"換地処分の公告があった後は、施行者による変動の登記がされる前であっても、関係権利者は施行地区内の土地について自由に登記を申請することができる。","a":0,"e":"公告後は施行者が遅滞なく変動の登記を申請・嘱託し、それまでは原則として他の登記はできない（法107条）。","m":"登記はまず施行者"},{"f":"法令","t":"土地区画整理法","ref":"H26-20-4","s":"土地区画整理事業で設置された公共施設は、換地処分の公告があった日の翌日から、原則としてその公共施設が所在する市町村の管理に属する。","a":1,"e":"公共施設は換地処分の公告の翌日に、原則としてその所在する市町村の管理に属する（法106条）。","m":"公共施設は翌日市町村へ"},{"f":"法令","t":"農地法","ref":"H26-21-1","s":"農地法3条1項の許可を受けたうえで、農地の所有権移転を目的とする停止条件付売買契約に基づく仮登記を申請する場合でも、買主は農業委員会に届出をしなければならない。","a":0,"e":"3条許可を受けていれば届出は不要。届出が要るのは相続など許可不要で権利を取得した場合（法3条の3）。","m":"許可済みなら届出不要"},{"f":"法令","t":"農地法","ref":"H26-21-2","s":"市街化区域内にある農地を耕作の目的で競売により取得する場合であっても、その買受人は、農地法3条1項の許可を受ける必要がある。","a":1,"e":"競売でも耕作目的の権利取得は3条許可の対象。市街化区域内の届出特例は4条・5条だけの制度。","m":"3条に市街化特例なし"},{"f":"法令","t":"農地法","ref":"H26-21-3","s":"農業者が住宅を改築する資金を借り入れるため、自己所有の農地に抵当権を設定する場合、農地法3条1項の許可を受ける必要はない。","a":1,"e":"抵当権の設定は耕作する権利の移転を伴わず、3条の許可が必要な権利移動に当たらない。","m":"抵当権設定は許可不要"},{"f":"法令","t":"農地法","ref":"H26-21-4","s":"山林を開墾して現に畑として耕作している土地であっても、登記簿上の地目が山林のままであれば、その土地は農地法上の農地には当たらない。","a":0,"e":"農地かどうかは登記簿の地目ではなく土地の現況で判断し、現に耕作されていれば農地に当たる（法2条1項）。","m":"農地は現況で判断"},{"f":"法令","t":"国土利用計画法","ref":"H26-22-1","s":"国土利用計画法23条の事後届出では、土地の利用目的のほか、土地売買等の契約による対価の額も都道府県知事への届出事項に含まれる。","a":1,"e":"事後届出でも対価の額は届出事項。ただし知事が勧告できるのは利用目的の変更だけ（法23条・24条）。","m":"対価は届出、勧告は目的"},{"f":"税他","t":"印紙税・登録免許税","ref":"H26-23-1","s":"個人が自己の住宅用家屋とその敷地を取得した場合、住宅用家屋の所有権移転登記に係る登録免許税の税率の軽減措置は、敷地の土地の所有権移転登記にも適用される。","a":0,"e":"この軽減措置の対象は住宅用家屋の登記だけで、敷地の土地の所有権移転登記には適用されない。","m":"軽減は家屋だけ"},{"f":"税他","t":"印紙税・登録免許税","ref":"H26-23-2","s":"個人が取得した家屋を自らは住まず従業員の社宅として使う場合でも、住宅用家屋の所有権移転登記に係る登録免許税の軽減措置の適用を受けられる。","a":0,"e":"対象は個人が自己の居住の用に供する家屋に限られ、社宅として使う家屋には適用されない。","m":"自分が住む家だけ"},{"f":"税他","t":"印紙税・登録免許税","ref":"H26-23-3","s":"住宅用家屋の所有権移転登記に係る登録免許税の軽減措置は、以前にこの措置の適用を受けたことがある者でも、要件を満たせば再び適用を受けられる。","a":1,"e":"この軽減措置には適用回数の制限がなく、過去に使っていても要件を満たせば何度でも適用を受けられる。","m":"軽減は何度でも"},{"f":"税他","t":"印紙税・登録免許税","ref":"H26-23-4","s":"一定の耐震基準を満たす住宅用家屋であっても、床面積が50㎡未満であれば、所有権移転登記に係る登録免許税の軽減措置は適用されない。","a":1,"e":"自己居住用、取得後1年以内の登記、床面積50㎡以上などの要件をすべて満たす必要があり、50㎡未満は不可。","m":"床面積50㎡以上"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H26-24-1","s":"不動産取得税は、取得された不動産が所在する市町村が課する税であり、その徴収は納税通知書を交付する普通徴収の方法によって行われる。","a":0,"e":"不動産取得税を課すのは都道府県で、市町村ではない。徴収方法が普通徴収である点は正しい。","m":"取得税は都道府県"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H26-24-2","s":"共有物の分割により不動産を取得した場合、取得者の分割前の持分の割合を超えない部分の取得については、不動産取得税は課されない。","a":1,"e":"持分の範囲内の分割取得は形式的な所有権の移転にすぎず、非課税とされる（地方税法73条の7）。","m":"持分内の分割は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H26-24-4","s":"個人が相続により土地や建物を取得した場合には、その取得者に対して、取得した不動産の価格を課税標準として不動産取得税が課される。","a":0,"e":"相続・包括遺贈・法人の合併による取得は形式的な移転として非課税（地方税法73条の7）。","m":"相続は取得税なし"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H26-25-1","s":"地価公示において、土地鑑定委員会は標準地の単位面積当たりの価格を公示するが、標準地全体の価格の総額を官報で公示する必要はない。","a":1,"e":"公示するのは標準地の単位面積当たりの価格などで、総額は公示事項ではない（地価公示法6条）。","m":"公示は1㎡単価"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H26-25-2","s":"地上権など土地の使用または収益を制限する権利が存する土地は、土地鑑定委員会が地価公示法上の標準地として選定することができない。","a":0,"e":"正常な価格はそうした権利がないものとして求めるため、権利が付いた土地でも標準地に選定できる（法2条）。","m":"権利付きでも標準地OK"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H26-25-3","s":"標準地の鑑定評価を行った不動産鑑定士は、評価額が前年の公示価格と同じであれば、その旨を申告することで鑑定評価書の提出に代えることができる。","a":0,"e":"価格が前年と同じでも、鑑定評価書を土地鑑定委員会に提出しなければならない（法5条）。","m":"前年同額でも提出"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H26-25-4","s":"不動産鑑定士が標準地の鑑定評価を行うときは、近傍類地の取引価格を基本とし、地代等から算定される価格や造成費用は必要に応じて勘案すれば足りる。","a":0,"e":"取引価格・地代等からの推定価格・造成費用の3つを総合的に勘案しなければならない（法4条）。","m":"3つを勘案"},{"f":"業法","t":"免許","ref":"H26-26-ア","s":"Aが所有する商業ビルをBが借り受け、各フロアを不特定多数の者に反復継続して転貸する場合、AもBも宅地建物取引業の免許を受ける必要はない。","a":1,"e":"自ら貸主として貸す・転貸する行為は宅建業の「取引」に当たらず、AもBも免許は不要。","m":"自ら貸借は免許不要"},{"f":"業法","t":"免許","ref":"H26-26-イ","s":"所有するマンション30戸の分譲を宅建業者Cに代理させ、不特定多数の者に反復継続して販売する所有者Dは、宅地建物取引業の免許を受ける必要がない。","a":0,"e":"代理業者に任せても、D自身が売主として反復継続して売る以上、宅建業に当たり免許が必要。","m":"代理任せでも売主は要免許"},{"f":"業法","t":"免許","ref":"H26-26-ウ","s":"Eが転売目的で反復継続して宅地を購入する場合、その売主が国など宅建業法の適用がない者に限られていれば、Eは宅地建物取引業の免許を受ける必要がない。","a":0,"e":"Eは購入した宅地を不特定多数に反復継続して売ることになり免許が必要。仕入先が国でも関係ない。","m":"仕入先が国でも要免許"},{"f":"業法","t":"免許","ref":"H26-26-エ","s":"借金の返済にあてるため、自己所有の宅地を10区画に分けて不特定多数の者に反復継続して売却するFは、宅地建物取引業の免許を受ける必要がない。","a":0,"e":"目的が借金返済であっても、不特定多数への反復継続した売却は宅建業に当たり免許が必要。","m":"売る目的は問わない"},{"f":"業法","t":"事務所・案内所","ref":"H26-27-1","s":"商業登記簿に登記されていない営業所であっても、継続的に業務を行える施設を有し、契約締結権限を持つ者を置いている場所は、宅建業法上の事務所に当たる。","a":1,"e":"事務所に当たるかは業務の実態で判断し、商業登記の有無は関係ない（施行令1条の2）。","m":"事務所は実態で判断"},{"f":"業法","t":"免許","ref":"H26-27-2","s":"国土交通大臣または都道府県知事は、宅地建物取引業の免許に条件を付すことができ、免許の更新をする際にも条件を付すことができる。","a":1,"e":"免許権者は免許に条件を付けることができ、免許の更新の際にも同様に条件を付けられる（法3条の2）。","m":"免許に条件OK"},{"f":"業法","t":"免許","ref":"H26-27-3","s":"宅建業者である法人が株主総会の決議により解散した場合は、その法人の役員であった者が、解散の日から30日以内に免許権者へ届け出なければならない。","a":0,"e":"解散の届出義務者は清算人。役員であった者が届け出るのは合併で消滅した場合（法11条）。","m":"解散は清算人が届出"},{"f":"業法","t":"免許","ref":"H26-27-4","s":"宅地建物取引業の免許を申請中の者は、売買契約の締結を免許取得後に行うのであれば、宅地の売買に関する新聞広告を出すことができる。","a":0,"e":"免許を受けていない者が宅建業を営む目的で広告することは禁止され、申請中でも同じ（法12条2項）。","m":"申請中は広告不可"},{"f":"業法","t":"事務所・案内所","ref":"H26-28-1","s":"国土交通大臣免許の宅建業者が、他の業者の分譲の媒介のため乙県内に申込みを受ける案内所を設ける場合、業務開始の10日前までに国土交通大臣と乙県知事に届け出なければならない。","a":1,"e":"申込み等を受ける案内所の届出は、免許権者と所在地の知事の両方へ業務開始10日前までに行う（法50条2項）。","m":"届出は免許権者＋所在地知事"},{"f":"業法","t":"事務所・案内所","ref":"H26-28-2","s":"マンション分譲の売主である宅建業者Aは、自ら案内所を設けず販売を他の業者の媒介に任せた場合でも、マンションの所在する場所に標識を掲げなければならない。","a":1,"e":"一団の建物の分譲では、売主の業者は物件の所在場所に標識を掲げる。案内所の届出とは別の義務。","m":"売主は現地に標識"},{"f":"業法","t":"事務所・案内所","ref":"H26-28-3","s":"宅建業者が申込みを受ける案内所を設置した場合、その案内所で業務に従事する者5人に1人以上の割合で、成年者である専任の宅建士を置かなければならない。","a":0,"e":"申込み等を受ける案内所に置く専任の宅建士は1人以上で足りる。5人に1人は事務所の基準（法31条の3）。","m":"案内所は1人以上"},{"f":"業法","t":"事務所・案内所","ref":"H26-28-4","s":"売主Aと媒介業者Cが共同で設置した申込みを受ける案内所に、Aが成年者である専任の宅建士を1人置いていれば、Cは別に専任の宅建士を置く必要はない。","a":1,"e":"共同で設置した案内所では、いずれかの業者が専任の宅建士を1人以上置いていれば足りる。","m":"共同案内所は誰か1人"},{"f":"業法","t":"営業保証金","ref":"H26-29-1","s":"これから宅地建物取引業を始めようとする者は、免許を受ける前に、主たる事務所の最寄りの供託所に営業保証金を供託しなければならない。","a":0,"e":"営業保証金は免許を受けた後に供託し、その旨を届け出てから事業を開始する（法25条）。","m":"免許→供託→届出→開業"},{"f":"業法","t":"営業保証金","ref":"H26-29-2","s":"宅建業者が、営業保証金として供託している国債証券を金銭に差し替えるため新たに金銭を供託した場合は、遅滞なく免許権者に届け出なければならない。","a":1,"e":"供託物の差替え（変換）をしたときも、遅滞なく供託書の写しを添えて免許権者に届け出る。","m":"差替えも届出"},{"f":"業法","t":"営業保証金","ref":"H26-29-3","s":"事業開始後に従たる事務所を新設した宅建業者は、その従たる事務所の最寄りの供託所に、1か所につき500万円の営業保証金を供託すればよい。","a":0,"e":"追加の営業保証金も、主たる事務所の最寄りの供託所に供託する（法26条・25条）。","m":"供託先はいつも本店最寄り"},{"f":"業法","t":"営業保証金","ref":"H26-29-4","s":"金銭と有価証券で営業保証金を供託している宅建業者が主たる事務所を移転し最寄りの供託所が変わった場合、営業保証金の保管替えを請求することができる。","a":0,"e":"保管替えは金銭だけで供託している場合に限られ、有価証券を含むときは移転先で新たに供託する（法29条）。","m":"保管替えは金銭だけ"},{"f":"業法","t":"広告","ref":"H26-30-1","s":"工事完了前の新築分譲マンションについて、建築確認を受ける前であっても、売買契約を締結しないのであれば、宅建業者は販売の広告をすることができる。","a":0,"e":"建築確認などの処分の前は、契約の締結だけでなく広告もできない（法33条・36条）。","m":"確認前は広告も不可"},{"f":"業法","t":"広告","ref":"H26-30-2","s":"宅建業者が宅地の形質について実際よりも著しく優良と誤認させる広告をした場合、その広告で注文がなく取引が成立しなくても、監督処分や罰則の対象となる。","a":1,"e":"誇大広告は表示をした時点で違反となり、注文の有無や取引の成否は関係ない（法32条）。","m":"誇大広告は出した時点で違反"},{"f":"業法","t":"広告","ref":"H26-30-3","s":"宅建業者が広告で取引態様の別を明示していれば、その広告を見た者から注文を受けたときに、改めて取引態様の別を明示する必要はない。","a":0,"e":"取引態様の別の明示は、広告をするときと注文を受けたときの両方で必要（法34条）。","m":"広告時と注文時の両方"},{"f":"業法","t":"広告","ref":"H26-30-4","s":"一団の宅地の販売を数回に分けて広告する場合、取引態様の別は最初の広告で明示すれば、2回目以降の広告では省略することができる。","a":0,"e":"取引態様の別は、同じ物件の広告であっても、広告をするたびに明示しなければならない（法34条1項）。","m":"広告のたびに明示"},{"f":"業法","t":"8種制限","ref":"H26-31-ア","s":"宅建業者Aが自ら売主として業者でないBと宅地の売買契約を結ぶ場合、契約不適合を通知すべき期間を引渡しの日から3年間とする特約は無効となる。","a":0,"e":"通知期間を引渡しから2年以上とする特約は有効。3年はこの基準を満たすので有効（法40条）。","m":"引渡しから2年以上ならOK"},{"f":"業法","t":"8種制限","ref":"H26-31-イ","s":"宅建業者Aが自ら売主として、市に払下げを申請中の旧道路敷を含む宅地を業者でないBに売る場合、払下げ申請中であることを説明すれば売買契約を締結できる。","a":0,"e":"払下げ前の部分は他人物で取得が確実とはいえない。説明しても自ら売主として契約できない（法33条の2）。","m":"払下げ申請中は他人物"},{"f":"業法","t":"8種制限","ref":"H26-31-ウ","s":"宅建業者Aが自ら売主として業者でないBと結んだ売買契約に、手付放棄による解除は契約後30日以内に限る旨の特約があれば、30日経過後はAが履行に着手していなくてもBは解除できない。","a":0,"e":"相手方が履行に着手するまで手付解除できるとする規定より買主に不利な特約は無効（法39条3項）。","m":"不利な手付特約は無効"},{"f":"業法","t":"媒介契約","ref":"H26-32-ア","s":"宅建業者Aが宅地の売却について専任媒介契約を結んだ場合でも、依頼者Bから指定流通機構に登録しないでほしいと頼まれたときは、登録をしなくてよい。","a":0,"e":"専任媒介では指定流通機構への登録が義務で、依頼者の希望を理由に省略できない（法34条の2第5項）。","m":"専任は登録必須"},{"f":"業法","t":"媒介契約","ref":"H26-32-イ","s":"宅建業者Aに宅地の売却の媒介を依頼した者が宅建業者である場合は、Aは媒介契約の内容を記載した書面を依頼者に交付しなくてもよい。","a":0,"e":"媒介契約書面の交付は業者間でも省略できない。業者間で適用が除外されるのは8種制限（法78条2項）。","m":"業者間でも書面必要"},{"f":"業法","t":"媒介契約","ref":"H26-32-ウ","s":"専任媒介契約に、有効期間が満了したときは自動的に更新する旨の特約を定めておけば、依頼者からの申出がなくても契約は更新される。","a":0,"e":"専任媒介の更新は依頼者の申出がある場合に限られ、自動更新の特約は無効（法34条の2第4項）。","m":"自動更新は無効"},{"f":"業法","t":"媒介契約","ref":"H26-32-エ","s":"依頼者が他の業者を明示する義務がある一般媒介契約では、明示していない業者の媒介で売買契約が成立したときの措置を、媒介契約書面に記載しなければならない。","a":1,"e":"明示型の一般媒介では、明示していない業者の媒介で成立した場合の措置が媒介契約書面の記載事項となる。","m":"明示型は違反時の措置"},{"f":"業法","t":"8種制限","ref":"H26-33-1","s":"宅建業者Aが自ら売主として宅建業者Bに工事完了前の建物を5,000万円で売る場合、保全措置を講じずに手付金1,000万円を受領しても、宅建業法に違反しない。","a":1,"e":"業者間の取引には8種制限が適用されないため、手付金等の保全措置も不要（法78条2項）。","m":"業者間は保全不要"},{"f":"業法","t":"8種制限","ref":"H26-33-2","s":"宅建業者Aが自ら売主として業者でないCに工事完了前の建物を5,000万円で売る場合、保全措置を講じれば、手付金として1,000万円を受領することができる。","a":1,"e":"手付は代金の2割（1,000万円）まで。未完成物件で代金の5％（250万円）を超えるので保全措置が必要。","m":"手付は代金の2割まで"},{"f":"業法","t":"8種制限","ref":"H26-33-3","s":"宅建業者Aが業者でないDに工事完了前の建物を5,000万円で売り、手付金100万円を保全なしで受領した後、中間金500万円を受領する場合は、500万円分だけ保全措置を講じればよい。","a":0,"e":"保全措置はすでに受け取った分を含む手付金等の全額が対象。合計600万円分の保全が必要（法41条）。","m":"保全は累計額で"},{"f":"業法","t":"8種制限","ref":"H26-33-4","s":"工事完了前の建物を業者でない買主に自ら売主として売る宅建業者は、買主への所有権移転登記をした後であれば、保全措置を講じずに中間金を受領できる。","a":1,"e":"買主への所有権移転の登記がされたときは、手付金等の保全措置は不要となる（法41条1項ただし書）。","m":"移転登記後は保全不要"},{"f":"業法","t":"重要事項説明","ref":"H26-34-1","s":"建物の売買の媒介で、売主に耐震診断の記録の有無を照会したが判明しなかった場合、宅建業者は自ら耐震診断を実施して、その結果を説明しなければならない。","a":0,"e":"記録の有無を照会しても分からなければ、その旨を説明すれば足り、業者が自ら診断する義務はない。","m":"耐震診断は照会で足りる"},{"f":"業法","t":"重要事項説明","ref":"H26-34-3","s":"新築住宅の売買の媒介で、売主が住宅販売瑕疵担保保証金を供託する場合は措置の概要を説明する必要があるが、保険契約を締結する場合は説明は不要である。","a":0,"e":"供託でも保険契約でも、契約不適合責任の履行に関する措置の概要は重要事項として説明が必要。","m":"供託も保険も説明"},{"f":"業法","t":"重要事項説明","ref":"H26-34-4","s":"区分所有建物の貸借の媒介では、専有部分の用途その他の利用制限に関する規約の定めは説明が必要だが、専用使用権に関する規約の定めは説明しなくてよい。","a":1,"e":"貸借で説明が必要なのは専有部分の利用制限の規約。専用使用権の規約は売買・交換の説明事項。","m":"貸借は利用制限だけ"},{"f":"業法","t":"重要事項説明","ref":"H26-35-1","s":"宅建業者が宅地の売買を媒介する場合、宅建士は、買主の自宅において重要事項説明書を交付し、重要事項の説明を行うこともできる。","a":1,"e":"重要事項の説明や重要事項説明書の交付を行う場所に制限はなく、買主の自宅で行ってもよい。","m":"重説の場所は自由"},{"f":"業法","t":"重要事項説明","ref":"H26-35-2","s":"売買の対象建物に抵当権の登記がある場合、売買契約の日までにその登記が抹消される予定であっても、重要事項としてその内容を説明しなければならない。","a":1,"e":"登記された権利の種類・内容は説明事項で、抹消予定でも説明を省略できない（法35条1項1号）。","m":"抹消予定でも説明"},{"f":"業法","t":"重要事項説明","ref":"H26-35-3","s":"宅建士証の有効期間が満了している者は、重要事項の説明をすることはできないが、重要事項説明書に宅建士として記名することはできる。","a":0,"e":"有効期間が切れた宅建士証では宅建士としての事務はできず、重要事項の説明も記名もできない。","m":"期限切れは記名も不可"},{"f":"業法","t":"重要事項説明","ref":"H26-35-4","s":"宅建業者が宅地の割賦販売の媒介を行う場合は、割賦販売価格だけでなく、現金販売価格についても重要事項として説明しなければならない。","a":1,"e":"割賦販売では現金販売価格、割賦販売価格、頭金・賦払金の額と支払の時期・方法を説明する（法35条2項）。","m":"割賦は現金価格も"},{"f":"業法","t":"重要事項説明","ref":"H26-36-1","s":"宅建業者の代表取締役であれば、宅建士の資格を持っていなくても、建物の貸借の媒介において借主に重要事項の説明をすることができる。","a":0,"e":"重要事項の説明は宅建士にさせなければならず、代表者でも宅建士でなければ説明できない（法35条）。","m":"重説は宅建士だけ"},{"f":"業法","t":"重要事項説明","ref":"H26-36-2","s":"建物の貸借の媒介で、広告に記載した事項と重なる部分については重要事項の説明を省略し、入居後に重要事項説明書を借主の郵便受けに入れておけばよい。","a":0,"e":"広告に載せた事項でも説明は省略できず、契約成立前に宅建士が宅建士証を示して説明する必要がある。","m":"広告済みでも説明要"},{"f":"業法","t":"重要事項説明","ref":"H26-36-3","s":"重要事項説明書の作成を担当した宅建士が急に対応できなくなった場合、別の宅建士が説明書に記名し、宅建士証を示して説明をしても宅建業法に違反しない。","a":1,"e":"説明・記名をする宅建士は専任である必要も作成者である必要もなく、宅建士証を示せば誰でもよい。","m":"説明する宅建士は誰でも"},{"f":"業法","t":"重要事項説明","ref":"H26-36-4","s":"建物の貸借の申込みを受けた時点で契約を成立させ、後日、重要事項説明書を兼ねた契約書を借主に送付して返送してもらう方法は、宅建業法に違反しない。","a":0,"e":"重要事項の説明は契約成立前に宅建士が行う必要があり、契約後に書面を送るだけでは足りない。","m":"重説は契約前"},{"f":"業法","t":"報酬","ref":"H26-37-ア","s":"宅建業者が居住用建物の貸借の媒介で、依頼者の依頼によらずに広告をした場合でも、その広告が契約の成立に役立ったときは、報酬とは別に広告料を受け取ることができる。","a":0,"e":"報酬と別に受け取れる広告料は、依頼者の依頼による特別の広告の実費に限られる（報酬告示）。","m":"広告料は依頼があってこそ"},{"f":"業法","t":"報酬","ref":"H26-37-イ","s":"代金4,000万円の宅地売買で、売主の代理をした業者Aが277万2,000円、買主の媒介をした業者Bが138万6,000円を受け取ることができる（A・Bはともに消費税課税事業者）。","a":0,"e":"1つの取引に複数の業者が関与しても、報酬の合計は代理の上限277万2,000円以内でなければならない。","m":"合計は代理の上限まで"},{"f":"業法","t":"報酬","ref":"H26-37-ウ","s":"居住用建物の賃貸借で貸主側の業者Aと借主側の業者Bが共同で媒介した場合、双方の承諾があれば、A・Bはそれぞれ借賃の1.1か月分を受け取れる（A・Bは課税事業者）。","a":0,"e":"貸借の媒介報酬は、関与した業者全員の合計で借賃の1.1か月分（課税事業者）が上限。","m":"貸借は合計1か月分"},{"f":"業法","t":"クーリング・オフ","ref":"H26-38-2","s":"宅建業者が自ら売主となる宅地の売買で、業者でない買主Bが自ら指定した喫茶店で買受けの申込みをした場合、Bはクーリング・オフによる解除をすることができない。","a":0,"e":"解除できなくなる買主指定の場所は自宅か勤務する場所に限られ、喫茶店は含まれない。","m":"指定OKは自宅・勤務先"},{"f":"業法","t":"クーリング・オフ","ref":"H26-38-3","s":"買主Bが売主業者Aの仮設テント張りの案内所で買受けの申込みをし、後日Aの事務所で売買契約を結んだ場合、事務所で契約しているので、Bはクーリング・オフできない。","a":0,"e":"申込みと契約の場所が違うときは申込みの場所で判断する。テント張りの案内所は解除が制限される場所ではない。","m":"場所は申込みで判断"},{"f":"業法","t":"クーリング・オフ","ref":"H26-38-4","s":"宅建業者が自ら売主となる宅地の売買で、クーリング・オフができる期間を、書面で告げられた日から14日間とする特約を定めた場合、その特約は有効である。","a":1,"e":"告知の日から8日間という法定期間より買主に有利な特約は有効となる（法37条の2第4項）。","m":"有利な特約は有効"},{"f":"業法","t":"保証協会","ref":"H26-39-1","s":"還付充当金を納付しなかったため保証協会の社員の地位を失った宅建業者は、事業を続けるには、地位を失った日から1週間以内に営業保証金を供託しなければならない。","a":1,"e":"社員の地位を失った業者は、1週間以内に営業保証金を供託しなければならない（法64条の15）。","m":"地位喪失→1週間で供託"},{"f":"業法","t":"保証協会","ref":"H26-39-2","s":"保証協会は、社員から弁済業務保証金分担金の納付を受けたときは、その日から2週間以内に、その額に相当する弁済業務保証金を供託しなければならない。","a":0,"e":"保証協会は分担金の納付を受けた日から1週間以内に弁済業務保証金を供託する（法64条の7）。","m":"保証協会の供託は1週間"},{"f":"業法","t":"保証協会","ref":"H26-39-3","s":"弁済業務保証金の還付があったときは、保証協会は、その社員または社員であった者に対し、還付額に相当する還付充当金を納付するよう通知しなければならない。","a":1,"e":"還付があると保証協会は社員等に還付充当金の納付を通知し、社員等は通知から2週間以内に納付する（法64条の10）。","m":"還付→充当金を通知"},{"f":"業法","t":"保証協会","ref":"H26-39-4","s":"宅建業者が保証協会の社員となる前に宅建業に関する取引をした相手方は、その取引から生じた債権について、弁済業務保証金から弁済を受けることはできない。","a":0,"e":"社員となる前の取引の相手方（宅建業者を除く）も、弁済業務保証金から弁済を受けられる（法64条の8）。","m":"加入前の取引も対象"},{"f":"業法","t":"37条書面","ref":"H26-40-ア","s":"宅建業者が自ら売主として業者でない買主に新築住宅を売る場合、契約不適合責任の履行に関する保証保険契約の締結などの措置の定めがあるときは、その内容を37条書面に記載しなければならない。","a":1,"e":"売買では、契約不適合責任の履行に関する保証保険契約等の措置の定めがあれば37条書面に記載する。","m":"担保措置の定めは記載"},{"f":"業法","t":"37条書面","ref":"H26-40-イ","s":"宅建業者が売買契約の成立後に37条書面を交付するときは、宅建士に記名させるとともに、その書面の内容を宅建士に説明させなければならない。","a":0,"e":"37条書面に必要なのは宅建士の記名で、説明は義務づけられていない。説明義務があるのは重要事項。","m":"37条は記名のみ"},{"f":"業法","t":"37条書面","ref":"H26-40-ウ","s":"宅建業者が自ら売主として宅建業者である買主に宅地を売る場合でも、37条書面には宅地の引渡しの時期を記載しなければならない。","a":1,"e":"引渡しの時期は37条書面に必ず記載する事項で、宅建業者間の取引でも記載を省略できない。","m":"37条は業者間も適用"},{"f":"業法","t":"37条書面","ref":"H26-40-エ","s":"建物の売買の媒介で、租税その他の公課の負担に関する定めがあるときは、宅建業者はその内容を37条書面に記載しなければならない。","a":1,"e":"売買・交換では、公租公課の負担に関する定めがあれば、その内容を37条書面に記載する。","m":"公租公課は定めあれば記載"},{"f":"業法","t":"事務所・案内所","ref":"H26-41-1","s":"他の業者が行う一団の宅地分譲の媒介を案内所で行う宅建業者は、その案内所に専任の宅建士を置く必要がない場合でも標識を掲げ、そこにクーリング・オフ制度の適用がある旨を表示する。","a":1,"e":"申込み等を受けない案内所でも標識は必要で、その標識にはクーリング・オフ制度の適用がある旨を表示する。","m":"宅建士なし案内所はCO表示"},{"f":"業法","t":"業務上の規制","ref":"H26-41-2","s":"宅建業者の従業者が、買う意思がないと明確に告げた相手方に対しても、勧誘の担当者を別の従業者に替えれば、同じ業者が再び勧誘することは許される。","a":0,"e":"契約を締結しない意思を示した相手方への勧誘継続は禁止され、担当者を替えても同じ業者なら違反となる。","m":"担当替えても勧誘不可"},{"f":"業法","t":"業務上の規制","ref":"H26-41-3","s":"宅建業者が、売買の媒介を依頼した他の宅建業者への報酬の支払を正当な理由なく不当に遅らせる行為は、宅建業法の不当な履行遅延の禁止に違反する。","a":0,"e":"不当な履行遅延の禁止の対象は、登記・引渡し・取引の対価の支払で、業者への報酬は含まれない（法44条）。","m":"遅延禁止は登記・引渡し・対価"},{"f":"業法","t":"業務上の規制","ref":"H26-41-4","s":"宅建業者が事務所ごとに備える従業者名簿には、退職した従業者について、その事務所の従業者でなくなった年月日まで記載する必要はない。","a":0,"e":"従業者名簿には、従業者となった年月日だけでなく従業者でなくなった年月日も記載する（法48条3項）。","m":"退職日も名簿に"},{"f":"業法","t":"37条書面","ref":"H26-42-ア","s":"売主である宅建業者Aが業者Bの媒介で売買契約を結んだ場合、Bの宅建士が37条書面に記名すれば、Aは自社の宅建士に記名させる必要はない。","a":0,"e":"取引に関与した業者はそれぞれ37条書面の交付義務を負い、各自の宅建士に記名させる必要がある。","m":"関与業者全員が記名"},{"f":"業法","t":"37条書面","ref":"H26-42-イ","s":"事業用定期借地権を設定する契約を公正証書で締結した場合、宅建業者が別途作成する37条書面には、宅建士の記名は不要である。","a":0,"e":"契約を公正証書で締結しても、37条書面を交付する以上、宅建士の記名は省略できない。","m":"公正証書でも記名要"},{"f":"業法","t":"37条書面","ref":"H26-42-ウ","s":"買主が自宅を一定額以上で売却できなかったときは契約を無条件で解除できる旨の定めがある売買契約では、その内容を37条書面に記載しなければならない。","a":1,"e":"契約の解除に関する定めがあるときは、その内容は37条書面の記載事項となる（法37条1項7号）。","m":"解除の定めは記載"},{"f":"業法","t":"業務上の規制","ref":"H26-43-1","s":"宅建業者が、契約当日に手付金の一部しか用意できない買主に対し、残額を分割して受け取ることにして売買契約の締結を誘引することは、宅建業法に違反する。","a":1,"e":"手付の分割受領は手付について信用を供与して契約を誘引する行為で、禁止されている（法47条3号）。","m":"手付の分割は誘引禁止"},{"f":"業法","t":"業務上の規制","ref":"H26-43-2","s":"宅建業者が事前の連絡なしに投資用マンションの勧誘のため顧客宅を訪問しても、勧誘に先立って業者名・勧誘者の氏名・勧誘目的を告げれば、宅建業法に違反しない。","a":1,"e":"勧誘前に商号等・氏名・勧誘目的を告げていれば、事前連絡のない訪問勧誘自体は禁止されていない。","m":"名乗れば訪問勧誘OK"},{"f":"業法","t":"業務上の規制","ref":"H26-43-3","s":"宅建業者が土地の所有者に電話で売却を勧誘し、売る意思がないと告げられた場合でも、翌日であれば改めて勧誘することは宅建業法上許される。","a":0,"e":"契約を締結しない意思を示した相手方への勧誘継続は禁止され、日を改めても違反となる。","m":"断られたら勧誘終了"},{"f":"業法","t":"業務上の規制","ref":"H26-43-4","s":"宅建業者が、実際には存在しない幹線道路の建設計画を挙げて、この宅地は確実に値上がりすると説明して勧誘することは、宅建業法に違反する。","a":1,"e":"将来の値上がりなどについて断定的判断を提供して勧誘することは禁止されている（法47条の2）。","m":"確実に上がるはNG"},{"f":"業法","t":"監督・罰則","ref":"H26-44-ア","s":"甲県知事免許の宅建業者が乙県内で宅建業法32条に違反する誇大広告をした場合、乙県知事もその業者に対して業務停止処分をすることができる。","a":1,"e":"指示処分・業務停止処分は、免許権者のほか業務を行った地を管轄する知事もできる（法65条）。","m":"業務地知事も停止OK"},{"f":"業法","t":"監督・罰則","ref":"H26-44-イ","s":"甲県知事免許の宅建業者が乙県内に設けた申込みを受ける案内所に専任の宅建士を置かなかった場合、乙県知事はその業者に指示処分をすることができる。","a":1,"e":"業務を行った地の知事も、その区域内での違反について指示処分ができる（法65条3項）。","m":"業務地知事も指示OK"},{"f":"業法","t":"監督・罰則","ref":"H26-44-ウ","s":"免許権者は、宅建業者の事務所の所在地を確知できないときは、その旨を公告し、公告の日から30日を経過しても申出がなければ免許を取り消すことができる。","a":1,"e":"所在不明の業者は公告から30日経過で免許を取り消せる。取消しができるのは免許権者だけ（法67条）。","m":"所在不明は公告30日"},{"f":"業法","t":"監督・罰則","ref":"H26-44-エ","s":"国土交通大臣免許の宅建業者が甲県知事から受けた業務停止処分に違反した場合、甲県知事はその業者の免許を取り消さなければならない。","a":0,"e":"業務停止処分違反は必ず取り消す事由だが、免許を取り消せるのは免許権者の国土交通大臣だけ（法66条）。","m":"取消しは免許権者だけ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H26-45-1","s":"新築住宅を引き渡した宅建業者が基準日に係る資力確保措置の届出をしなかった場合、基準日の翌日から起算して50日を経過した日以後は、新たに自ら売主となる新築住宅の売買契約を締結できない。","a":1,"e":"届出は基準日から3週間以内。しないと基準日の翌日から50日を経過した日以後は新たな売買契約が禁止される。","m":"基準日翌日から50日"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H26-45-2","s":"新築住宅の売買の媒介をした宅建業者も、住宅販売瑕疵担保保証金の供託または住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。","a":0,"e":"資力確保措置の義務を負うのは自ら売主となる宅建業者で、媒介をしただけの業者は負わない。","m":"義務は売主業者だけ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H26-45-3","s":"宅建業者が資力確保措置として住宅販売瑕疵担保責任保険契約を締結する場合、その保険料は新築住宅の買主が支払うものとされている。","a":0,"e":"保険契約は売主の宅建業者が保険法人と締結するもので、保険料も買主ではなく宅建業者が支払う。","m":"保険料は売主業者"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H26-45-4","s":"住宅販売瑕疵担保保証金を供託する宅建業者は、売買契約を締結するまでに、買主に対し供託所の所在地等を記載した書面を交付して説明しなければならない。","a":1,"e":"供託所の所在地等の説明は契約締結前に書面（買主の承諾があれば電磁的方法も可）で行う（履行法15条）。","m":"供託所は契約前に説明"},{"f":"税他","t":"住宅金融支援機構","ref":"H26-46-1","s":"独立行政法人住宅金融支援機構は、地震に対する安全性を高めることを主な目的とする住宅の改良について、その工事に必要な資金を自ら貸し付ける業務を行っている。","a":1,"e":"耐震改修のための改良資金は、民間では対応しにくいため機構の直接融資業務の対象とされている。","m":"耐震リフォームは直接融資"},{"f":"税他","t":"住宅金融支援機構","ref":"H26-46-2","s":"住宅金融支援機構の証券化支援事業（買取型）では、住宅の建設・購入資金の貸付債権は買い取るが、住宅の購入に付随するその住宅の改良資金に係る貸付債権は買取りの対象外である。","a":0,"e":"住宅の購入に付随するその住宅の改良資金に係る貸付債権も、買取型の譲受けの対象に含まれる。","m":"付随の改良資金も買取対象"},{"f":"税他","t":"住宅金融支援機構","ref":"H26-46-3","s":"住宅金融支援機構は、高齢者が自ら居住する住宅について、高齢者の家庭に適した居住性能・居住環境とするための改良に必要な資金の貸付けを業務として行っている。","a":1,"e":"高齢者が自ら住む住宅のバリアフリー等の改良資金は、機構の直接融資業務に含まれる。","m":"高齢者向け改良は直接融資"},{"f":"税他","t":"住宅金融支援機構","ref":"H26-46-4","s":"住宅金融支援機構は、市街地の土地の合理的な利用に寄与する一定の建築物の建設に必要な資金を、民間金融機関を通さず自ら貸し付ける業務を行っている。","a":1,"e":"市街地の土地の合理的利用に資する建築物の建設資金の貸付けは、機構の直接融資業務の一つである。","m":"市街地の合理的利用も融資"},{"f":"税他","t":"景品表示法","ref":"H26-47-1","s":"宅建業者が広告で、建築基準法の採光・換気の基準を満たす窓等がない部屋であっても、居室として使える十分な広さがあれば「居室」と表示してよい。","a":0,"e":"採光・換気の基準を満たさない部屋は、広さにかかわらず「納戸」等と表示する必要があり、居室とは表示できない（表示規約）。","m":"窓不足なら納戸"},{"f":"税他","t":"景品表示法","ref":"H26-47-2","s":"分譲マンションの広告で、修繕積立金が住戸ごとに異なり全住戸分を示すのが困難な場合は、全住戸の平均額だけを表示すれば足りる。","a":0,"e":"全住戸の額を示すのが困難なときに認められるのは最低額と最高額の表示であり、平均額では足りない。管理費も同様（表示規約）。","m":"困難なら最低と最高"},{"f":"税他","t":"景品表示法","ref":"H26-47-3","s":"私道負担部分を含む新築住宅の広告では、私道負担面積が全体の5%以下であれば、私道負担がある旨を示すだけでその面積は表示しなくてよい。","a":0,"e":"私道負担部分がある場合は、割合の大小にかかわらずその面積を表示しなければならない（表示規約）。","m":"私道負担は面積も"},{"f":"税他","t":"景品表示法","ref":"H26-47-4","s":"建築工事に着手した後、相当の期間工事を中断していた新築分譲マンションを広告するときは、着工した時期と中断していた期間を明瞭に表示しなければならない。","a":1,"e":"工事を長く中断していた新築住宅・分譲マンションは、着工時期と中断期間の両方を明示する必要がある（表示規約）。","m":"中断物件は着工と期間"},{"f":"税他","t":"土地・建物","ref":"H26-49-1","s":"かつて川が流れていた旧河道は、地盤が軟弱で水はけも悪いことが多く、地震や洪水による災害を受ける危険度が高い土地とされている。","a":1,"e":"旧河道は低く軟弱な地盤であることが多く、地震時の揺れ・液状化や浸水の危険が大きい。","m":"旧河道は災害に弱い"},{"f":"税他","t":"土地・建物","ref":"H26-49-2","s":"地盤の液状化は、地下水位の高いゆるい砂質地盤などの地盤の条件と、地震の揺れの強さや継続時間などの揺れ方の組合せによって発生することがある。","a":1,"e":"液状化は、地下水位が高くゆるい砂地盤に強い揺れが加わり、砂粒の結びつきが失われたときに起こりやすい。","m":"液状化は砂地盤×揺れ"},{"f":"税他","t":"土地・建物","ref":"H26-49-3","s":"海に面した沿岸地域は、津波や高潮による被害を受けやすいため、宅地を選ぶ際には、その土地の標高や避難経路を確認しておくことが重要である。","a":1,"e":"沿岸部は津波や高潮で浸水する危険があるため、宅地の標高や避難経路をあらかじめ把握しておくことが大切である。","m":"沿岸は標高と避難路"},{"f":"税他","t":"土地・建物","ref":"H26-49-4","s":"台地や丘陵は一般に水はけがよく地盤も安定しているので、その縁辺部であっても、豪雨などによる崖崩れに対しては安全な土地といえる。","a":0,"e":"台地・丘陵自体は安定しているが、縁辺部は豪雨による崖崩れの危険があり安全とはいえない。","m":"台地の縁は崖崩れ注意"},{"f":"税他","t":"土地・建物","ref":"H26-50-1","s":"鉄筋コンクリート造の建物で、表面のコンクリートにひび割れが生じると、そこから雨水が浸入して内部の鉄筋が腐食する原因となる。","a":1,"e":"コンクリートはアルカリ性で鉄筋の錆を防いでいるが、ひび割れから水や空気が入ると鉄筋が腐食しやすくなる。","m":"ひび割れ→鉄筋が錆びる"},{"f":"税他","t":"土地・建物","ref":"H26-50-2","s":"建築材料として用いられるモルタルは、セメントと水に加えて、細骨材である砂及び粗骨材である砂利を練り混ぜて作られる材料である。","a":0,"e":"モルタルはセメント・水・砂を練り混ぜたもので砂利は含まない。砂利まで含むのはコンクリート。","m":"モルタルに砂利なし"},{"f":"税他","t":"土地・建物","ref":"H26-50-3","s":"鉄筋コンクリート等のコンクリートに用いる骨材のうち、砂のように粒の細かいものを細骨材といい、砂利のように粒の粗いものを粗骨材という。","a":1,"e":"骨材は粒の大きさで区別され、砂のような細かいものが細骨材、砂利のような粗いものが粗骨材に当たる。","m":"砂は細、砂利は粗"},{"f":"税他","t":"土地・建物","ref":"H26-50-4","s":"建物の躯体などに用いられるコンクリートは、セメントと水に、細骨材である砂と粗骨材である砂利の両方を加えて練り混ぜて作られる。","a":1,"e":"コンクリートはセメント・水・砂・砂利から成る。モルタル（砂利なし）との違いを押さえる。","m":"コンクリは砂利入り"},{"f":"権利","t":"保証・連帯債務","ref":"H27-01-3","s":"併存的債務引受は、債権者と引受人となる者との契約によってすることができ、元の債務者は引受け後も債務を免れず、引受人と連帯して債務を負う。","a":1,"e":"併存的債務引受は債権者と引受人の契約で可能で、引受人は債務者と連帯して同一債務を負う（民法470条）。","m":"併存的は連帯して負う"},{"f":"権利","t":"意思表示・行為能力","ref":"H27-02-3","s":"AがBと通謀して甲土地を仮装譲渡しB名義にした後、虚偽表示について善意のBの債権者Cが甲土地を差し押さえた場合、AはAB間の売買の無効をCに主張できない。","a":1,"e":"虚偽表示の目的物を差し押さえた債権者は「第三者」に当たり、善意なら保護される（民法94条2項）。","m":"差押債権者も第三者"},{"f":"権利","t":"賃貸借","ref":"H27-03-4","s":"建物の使用貸借の貸主は、特約がなければ、その建物を使用貸借の目的として特定した時の状態で引き渡すことを約したものと推定される。","a":1,"e":"使用貸借には贈与者の引渡義務の規定が準用され、特定時の状態での引渡しが推定される（民法596条・551条）。","m":"無償は特定時の状態でOK"},{"f":"権利","t":"物権変動・対抗","ref":"H27-05-1","s":"甲建物の所有者Aが隣家に住み、甲建物の出入口を常に監視して第三者の侵入を容易に制止できる状態にあれば、錠をかけて鍵を持っていなくても、Aは甲建物を占有しているといえる。","a":1,"e":"判例上、隣家から監視し侵入を制止できる状況なら、鍵や標札がなくても家屋の所持（占有）が認められる。","m":"見張れば占有あり"},{"f":"権利","t":"物権変動・対抗","ref":"H27-05-3","s":"Dが丙土地を他人のために代理して占有している場合でも、第三者にその占有を妨害されたときは、Dはその第三者に対して占有保持の訴えを提起できる。","a":1,"e":"占有保持の訴えは占有者が提起でき、他人のために占有する代理占有者（占有代理人）も含まれる（民法197条・198条）。","m":"代理占有者も訴えOK"},{"f":"権利","t":"物権変動・対抗","ref":"H27-05-4","s":"占有を奪われた者は、占有を奪った者からその物を譲り受けた特定承継人に対しても、侵奪の事実を知っていたか否かにかかわらず、占有回収の訴えを提起できる。","a":0,"e":"侵奪者の特定承継人に対しては、その承継人が侵奪の事実を知っていたときに限り提起できる（民法200条2項）。","m":"善意の承継人には不可"},{"f":"権利","t":"抵当権・担保","ref":"H27-06-2","s":"抵当不動産の被担保債権について連帯保証人となっている者は、その抵当不動産を買い受けて所有権を取得すれば、抵当権者に対して抵当権消滅請求をすることができる。","a":0,"e":"主たる債務者・保証人（連帯保証人を含む）とその承継人は、抵当権消滅請求をすることができない（民法380条）。","m":"保証人は消滅請求不可"},{"f":"権利","t":"抵当権・担保","ref":"H27-06-3","s":"抵当不動産の所有権を買い受けた第三者が、抵当権者の請求に応じてその代価を抵当権者に弁済したときは、抵当権はその第三者のために消滅する。","a":1,"e":"代価弁済の規定である。抵当権者の請求に応じて代価を弁済すれば抵当権は消滅する（民法378条）。","m":"請求に応じ代価弁済"},{"f":"権利","t":"抵当権・担保","ref":"H27-06-4","s":"更地に抵当権を設定した後にその土地上に建物が築造された場合、抵当権者は土地とともに建物を競売できるが、優先弁済を受けられるのは土地の代価についてのみである。","a":1,"e":"一括競売の規定である。建物も競売できるが、優先弁済権は土地の代価に限られる（民法389条）。","m":"一括競売は土地分だけ優先"},{"f":"権利","t":"抵当権・担保","ref":"H27-07-2","s":"甲土地にB一番抵当（債権2,000万円）、C二番（2,400万円）、D三番（4,000万円）があり競売代金5,400万円を配当する。BがDのために抵当権の順位を譲渡した場合、Bは800万円の配当を受ける。","a":0,"e":"順位譲渡ではB・Dの配当分合計3,000万円をDが先に受け、譲渡したBの配当は0円となる（民法376条）。","m":"順位譲渡は譲渡人ゼロ"},{"f":"権利","t":"抵当権・担保","ref":"H27-07-4","s":"甲土地にB一番抵当（債権2,000万円）、C二番（2,400万円）、D三番（4,000万円）があり競売代金5,400万円を配当する。BがDのために抵当権の順位を放棄した場合、Bは1,000万円の配当を受ける。","a":1,"e":"順位放棄ではB・Dの配当分合計3,000万円を債権額の割合1:2で分け、Bは1,000万円となる。","m":"順位放棄は債権額で按分"},{"f":"権利","t":"賃貸借","ref":"H27-09-3","s":"土地の賃借人が賃貸人に無断で転貸した場合でも、賃貸人に対する背信行為と認めるに足りない特段の事情があるときは、賃貸人は無断転貸を理由に賃貸借契約を解除できない。","a":1,"e":"判例は信頼関係破壊の法理を採り、背信行為と認めるに足りない特段の事情があれば解除を認めない（民法612条）。","m":"背信性なければ解除不可"},{"f":"権利","t":"賃貸借","ref":"H27-09-4","s":"土地の賃貸人が賃借人と賃貸借を合意解除した場合、その当時賃貸人が賃借人の債務不履行による解除権を有していたときを除き、適法な転借人に合意解除の効果を対抗できない。","a":1,"e":"適法な転貸借では、合意解除は原則として転借人に対抗できない（民法613条3項）。","m":"合意解除は転借人に対抗不可"},{"f":"権利","t":"相続","ref":"H27-10-2","s":"自筆証書遺言の押印は、署名の下になされていなければ有効とはならず、遺言書本文に押印がなく封筒の封じ目にだけ押印があるものは無効である。","a":0,"e":"押印の場所に法律上の制限はなく、判例は封筒の封じ目の押印でも有効としている（民法968条）。","m":"押印の場所は自由"},{"f":"権利","t":"借家","ref":"H27-11-3","s":"AがCと甲建物の賃貸借契約を結んだ後、Bとも同じ建物の賃貸借契約を結び、Bに甲建物を引き渡した。Cが賃借権の登記も引渡しも受けていなければ、CはBに賃借権を対抗できない。","a":1,"e":"建物賃借権の対抗要件は登記か引渡しである（借地借家法31条）。先に引渡しを受けたBが優先する。","m":"先に引渡しを受けた方が勝ち"},{"f":"権利","t":"借家","ref":"H27-12-4","s":"期間5年の普通建物賃貸借において、賃貸人も賃借人も契約期間中は中途解約できない旨の特約を定めた場合、その特約は借地借家法に反し無効である。","a":0,"e":"期間の定めがある普通借家では、もともと中途解約権留保の特約がなければ中途解約できず、その旨の特約も有効である。","m":"普通借家の解約不可特約は有効"},{"f":"権利","t":"区分所有法","ref":"H27-13-3","s":"区分所有建物の集会の議事録が書面で作成されているときは、議長及び集会に出席した区分所有者の1人がこれに署名しなければならない。","a":0,"e":"書面の議事録には、議長と集会に出席した区分所有者の2人が署名しなければならない（区分所有法42条3項）。","m":"議事録署名は議長＋2人"},{"f":"権利","t":"不動産登記法","ref":"H27-14-2","s":"登記簿の附属書類のうち、土地所在図や地積測量図などの図面以外のものの閲覧は、請求人に正当な理由があると認められる部分に限り請求できる。","a":1,"e":"図面は誰でも閲覧できるが、それ以外の附属書類は正当な理由がある部分に限り閲覧できる（不動産登記法121条）。","m":"図面以外は正当理由"},{"f":"法令","t":"建築基準法","ref":"H27-17-2","s":"都市計画区域及び準都市計画区域の外において、木造3階建ての建築物を新築しようとする場合には、建築確認を受ける必要がある。","a":1,"e":"階数2以上の建築物（新2号建築物）の新築は、区域の内外を問わず建築確認が必要である（建築基準法6条1項）。","m":"2階建て以上は全国で確認"},{"f":"法令","t":"建築基準法","ref":"H27-17-3","s":"事務所として使用している建築物の用途を変更して、その用途部分の床面積の合計が500㎡のホテルとする場合には、建築確認を受ける必要はない。","a":0,"e":"用途変更で200㎡超の特殊建築物（ホテル）とする場合は、建築確認が必要である（建築基準法87条1項）。","m":"200㎡超の特建へ変更は確認"},{"f":"法令","t":"建築基準法","ref":"H27-17-4","s":"映画館の用途に供する建築物で、その用途部分の床面積の合計が300㎡であるものを改築する場合には、建築確認を受ける必要がある。","a":1,"e":"映画館は特殊建築物で200㎡を超えるため、改築でも建築確認が必要である（建築基準法6条1項1号）。","m":"映画館300㎡改築は確認"},{"f":"業法","t":"免許の基準","ref":"H27-27-1","s":"A社が不正手段による免許取消しの聴聞の公示後、処分前に相当の理由なく合併で消滅した場合、公示日の50日前にA社の取締役を退任していたBは、消滅日から5年間免許を受けられない。","a":1,"e":"聴聞公示日前60日以内に役員だった者は、法人の消滅日から5年間は欠格となる（宅建業法5条1項）。","m":"公示前60日以内の役員も欠格"},{"f":"業法","t":"免許の基準","ref":"H27-27-3","s":"営業に関し成年者と同一の行為能力を有しない未成年者Fの法定代理人Gが背任罪で罰金刑に処せられた場合、Fは、刑の執行が終わってから5年間は免許を受けられない。","a":1,"e":"未成年者は法定代理人の欠格事由で判断し、背任罪の罰金刑は欠格事由に当たる（宅建業法5条1項）。","m":"法定代理人の欠格が及ぶ"},{"f":"業法","t":"免許の基準","ref":"H27-27-4","s":"H社の取締役Iが暴力団員であることが判明して免許を取り消された場合、その後Iが退任しても、H社は取消しの日から5年を経過しなければ免許を受けられない。","a":0,"e":"役員の欠格による取消しには5年の制限はなく、欠格者Iが退任すればH社は直ちに免許を受けられる。","m":"欠格役員が辞めれば即OK"},{"f":"業法","t":"クーリング・オフ","ref":"H27-34-3","s":"宅建業者Aが自ら売主として事務所等以外の場所で業者でないBと建物の売買契約を締結し、クーリング・オフの告知書面を交付していない。Bが引渡しを受けたが代金の一部しか払っていなければ、Bは解除できる。","a":1,"e":"告知がないため8日の期間は進行せず、引渡しと代金全額支払の両方がそろうまでは解除できる（宅建業法37条の2）。","m":"引渡し＋全額払いまでOK"},{"f":"業法","t":"クーリング・オフ","ref":"H27-34-4","s":"宅建業者が自ら売主となる売買で、買主がクーリング・オフにより契約を解除した場合に売主業者が損害賠償を請求できる旨の特約を定めれば、その請求は有効にできる。","a":0,"e":"クーリング・オフでは売主は損害賠償・違約金を請求できず、買主に不利な特約は無効となる（宅建業法37条の2）。","m":"クーリングオフに損害賠償なし"},{"f":"業法","t":"クーリング・オフ","ref":"H27-39-1","s":"宅建業者Aが自ら売主となる契約で、クーリング・オフについて書面で告げられた業者でないBが、告げられた日から7日目に解除の書面を発送し、9日目にAに到達した場合、Bは契約を解除できる。","a":1,"e":"クーリング・オフの解除は書面を発した時に効力を生じる（発信主義）ため、8日以内の発送なら有効である。","m":"クーリングオフは発信主義"},{"f":"業法","t":"8種制限","ref":"H27-39-2","s":"宅建業者Aが自ら売主として業者でないBと建物の売買契約を結ぶ際、「Aは建物の契約不適合について一切責任を負わない」旨の特約を定めた場合、その特約は有効である。","a":0,"e":"買主に不利な担保責任の特約は無効。例外は通知期間を引渡しから2年以上とするものだけである（宅建業法40条）。","m":"責任ゼロ特約は無効"},{"f":"業法","t":"8種制限","ref":"H27-39-4","s":"宅建業者Aが自ら売主として業者でないBと宅地を売買する場合、契約不適合の通知期間を「売買契約を締結した日から2年間」とする特約は有効である。","a":0,"e":"有効な特約は通知期間を「引渡しの日から」2年以上とするもの。契約締結日起算は無効（宅建業法40条）。","m":"起算点は引渡し"},{"f":"業法","t":"8種制限","ref":"H27-40-ア","s":"宅建業者Aが自ら売主として業者でないBと完成建物を売買し手付金を受領した。「Aが履行に着手するまでは、Bは代金の1割を支払えば解除できる」との特約は有効である。","a":0,"e":"手付は解約手付とされ、買主は手付放棄で解除できる。それより買主に不利な特約は無効（宅建業法39条）。","m":"手付放棄より不利は無効"},{"f":"権利","t":"意思表示・行為能力","ref":"H28-02-2","s":"被保佐人が不動産を売却するには保佐人の同意が必要であるが、他人からの贈与の申込みを拒絶することは被保佐人に不利益がないので、保佐人の同意は不要である。","a":0,"e":"贈与の申込みの拒絶も保佐人の同意を要する行為として列挙されている（民法13条1項7号）。","m":"贈与の拒絶も同意必要"},{"f":"権利","t":"意思表示・行為能力","ref":"H28-02-3","s":"成年後見人が成年被後見人に代わって、その居住の用に供する建物を売却する場合、後見監督人の同意があれば家庭裁判所の許可は不要である。","a":0,"e":"居住用不動産の処分には家庭裁判所の許可が必要で、後見監督人の同意では代わらない（民法859条の3）。","m":"居住用は家裁の許可"},{"f":"権利","t":"物権変動・対抗","ref":"H28-03-1","s":"AがBに甲土地を売却した後、同じ甲土地をCにも売却した場合、Cは、Bより先に代金を支払っていれば、所有権移転登記を備えていなくてもBに所有権を主張できる。","a":0,"e":"二重譲渡では先に登記を備えた方が優先し、代金支払の先後は関係ない（民法177条）。","m":"二重譲渡は登記で決まる"},{"f":"権利","t":"抵当権・担保","ref":"H28-04-1","s":"A所有の甲土地とその上のA所有の建物のうち甲土地に抵当権を設定した後、Aが建物をCに売却し、抵当権の実行でDが甲土地を買い受けた場合、Cは法定地上権を主張できる。","a":1,"e":"設定時に土地上に建物があり同一所有者であれば、その後建物が譲渡されても法定地上権が成立する（民法388条）。","m":"設定時の同一所有で判断"},{"f":"権利","t":"抵当権・担保","ref":"H28-04-3","s":"A所有の甲土地の第1順位抵当権者Bと第2順位抵当権者Eが抵当権の順位を変更するには、抵当権設定者であるAの同意を得なければならない。","a":0,"e":"順位変更は抵当権者間の合意と利害関係人の承諾、登記で行い、設定者の同意は不要である（民法374条）。","m":"順位変更に設定者不要"},{"f":"権利","t":"抵当権・担保","ref":"H28-04-4","s":"Aが甲土地にBのための抵当権を設定した後、甲土地をFに売却した場合、Fは、民法所定の書面をBに送付して抵当権消滅請求をすることができる。","a":1,"e":"抵当不動産の所有権を取得した第三者は、所定の書面を送付して抵当権消滅請求ができる（民法379条・383条）。","m":"第三取得者は消滅請求OK"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H28-05-1","s":"AのBに対する譲渡制限特約付き債権を、特約を知るCが譲り受け、さらに特約を知らず重過失もないDがCから譲り受けた。この場合、BはDに対し特約を理由に履行を拒むことができる。","a":0,"e":"譲渡制限特約があっても譲渡は有効で、履行を拒めるのは悪意・重過失の譲受人その他の第三者に対してだけ。Dは善意無重過失なので拒めない（民法466条）。","m":"善意無重過失には拒めない"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H28-05-2","s":"AがBに対する債権をCに譲渡し、Aからの譲渡通知はまだBに届いていないが、Bが譲渡を承諾した。この場合でも、BはCからの請求に対し弁済を拒むことができる。","a":0,"e":"債務者への対抗要件は、譲渡人の通知か債務者の承諾のどちらかで足りる。Bが承諾した以上、Cは対抗要件を備えている（民法467条1項）。","m":"通知か承諾、どちらか一つ"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H28-05-3","s":"AがBとの将来の取引から発生する、まだ生じていない債権をCに譲渡した。取引の種類・金額・期間などで対象債権が特定されていれば、こ

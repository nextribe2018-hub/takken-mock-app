りる（盛土規制法21条4項）。","m":"工事なし転用は14日以内届出"},{"f":"法令","t":"盛土規制法","ref":"R02-19-4","s":"盛土規制法の許可を受けた宅地造成等に関する工事について、工事施行者を変更する場合は軽微な変更に当たり、改めて許可を受ける必要はなく、遅滞なく都道府県知事に届け出れば足りる。","a":1,"e":"工事施行者の変更は軽微な変更とされ、許可は不要で、遅滞なく都道府県知事に届け出ればよい（盛土規制法16条1項ただし書・2項）。","m":"施行者変更は軽微→届出"},{"f":"業法","t":"宅建士","ref":"R02-28-1","s":"宅地建物取引士資格試験に合格した者は、合格の日から10年以内に宅地建物取引士資格登録の申請をしなければ、その合格は無効となり、登録を受けるには再度試験に合格する必要がある。","a":0,"e":"合格に有効期限はなく、不正受験による取消しなどがない限り、合格は一生有効で、いつでも登録を申請できる。","m":"合格は一生有効"},{"f":"業法","t":"宅建士","ref":"R02-28-3","s":"宅地建物取引士は、重要事項の説明をするときは相手方の請求がなくても宅地建物取引士証を提示しなければならず、それ以外の場面でも取引の関係者から請求があったときは提示しなければならない。","a":1,"e":"重要事項説明時は請求がなくても提示（35条4項）、それ以外は取引の関係者から請求があれば提示する（22条の4）。","m":"重説時は自動・他は請求で提示"},{"f":"業法","t":"宅建士","ref":"R02-28-4","s":"甲県知事から乙県知事に登録の移転を受けた宅地建物取引士が、乙県知事から宅地建物取引士証の交付を受ける場合には、乙県知事が指定する法定講習を受講しなければならない。","a":0,"e":"登録の移転に伴う宅建士証の交付では法定講習は不要（22条の2第2項ただし書）。有効期間は従前の残存期間となる。","m":"移転に伴う交付は講習不要"},{"f":"業法","t":"媒介契約","ref":"R02-29-ア","s":"宅地建物取引業者Aが売主Bと専任媒介契約を締結し、物件を指定流通機構に登録したときは、Aは指定流通機構が発行する登録を証する書面を遅滞なくBに引き渡さなければならない。","a":1,"e":"指定流通機構が発行する登録を証する書面は、遅滞なく依頼者に引き渡す（34条の2第6項）。提示だけでは足りない。","m":"登録証明書は遅滞なく引渡し"},{"f":"業法","t":"媒介契約","ref":"R02-29-ウ","s":"宅地建物取引業者Aが住宅の売主Bと専任媒介契約を締結する場合、Bの要望に基づくときに限っては、有効期間の満了時に契約を自動的に更新する旨の特約を定めることができる。","a":0,"e":"専任媒介契約の更新は依頼者の申出がある場合に限られ、自動更新の特約は依頼者の要望があっても定められない（34条の2第4項）。","m":"専任の自動更新は不可"},{"f":"業法","t":"媒介契約","ref":"R02-29-エ","s":"宅地建物取引業者Aが住宅の売主Bと専属専任媒介契約を締結したときは、AはBに対し、当該媒介契約に係る業務の処理状況を少なくとも1週間に1回以上報告しなければならない。","a":1,"e":"専属専任は1週間に1回以上、専任は2週間に1回以上の報告が必要（34条の2第9項）。","m":"専属専任は週1回報告"},{"f":"業法","t":"報酬","ref":"R02-30-2","s":"宅建業者が居住用建物の貸借を媒介する場合、依頼者の一方から受け取る報酬は、報酬請求時までにその依頼者の承諾を得ていれば借賃の1.1か月分まで受け取ることができる。","a":0,"e":"居住用建物の貸借では一方から0.55か月分が原則。1.1か月分まで受け取るには媒介の依頼を受ける時点で承諾が必要。","m":"承諾は依頼を受ける時に"},{"f":"業法","t":"報酬","ref":"R02-30-3","s":"課税事業者の宅建業者が店舗用建物の貸借を媒介し、借賃月額25万円（税抜）、権利金330万円（税込）で契約が成立した場合、依頼者の一方から受け取れる報酬の上限は30万8,000円である。","a":0,"e":"権利金は税抜300万円を代金とみなし14万円＋税＝15万4,000円。借賃基準27万5,000円の方が大きく、これが上限。","m":"権利金計算と借賃の大きい方"},{"f":"業法","t":"報酬","ref":"R02-30-4","s":"宅建業者が事務所用建物の貸借を媒介する場合、受け取る報酬の合計が借賃の1.1か月分以内であれば、依頼者双方からどのような割合で受け取っても、一方のみから受け取ってもよい。","a":1,"e":"居住用以外の建物の貸借の媒介では、合計が借賃1か月分＋税以内なら双方の負担割合に制限はない。","m":"非居住用は合計1か月内で自由"},{"f":"業法","t":"宅建士","ref":"R02-34-1","s":"甲県で宅地建物取引士資格試験に合格した者が、乙県知事免許の宅建業者に勤務することになった場合、資格登録は勤務先の免許権者である乙県知事に申請しなければならない。","a":0,"e":"登録は、試験を行った都道府県知事（甲県知事）に申請する（18条1項）。勤務先の所在は関係ない。","m":"登録は合格した県の知事へ"},{"f":"業法","t":"宅建士","ref":"R02-34-3","s":"宅地建物取引士の勤務先である宅地建物取引業者が、商号や免許証番号は変えずに事務所の所在地だけを変更した場合、その宅地建物取引士は変更の登録を申請しなければならない。","a":0,"e":"勤務先業者の商号・名称や免許証番号は登録事項だが、事務所の所在地は登録事項ではなく変更の登録は不要。","m":"勤務先の所在地変更は届出不要"},{"f":"業法","t":"宅建士","ref":"R02-34-4","s":"宅地建物取引士が登録の移転の申請とあわせて新たな宅地建物取引士証の交付を受けた場合、その宅建士証の有効期間は、移転前の宅建士証の有効期間が満了するまでの期間となる。","a":1,"e":"登録の移転に伴い交付される宅建士証の有効期間は、従前の宅建士証の残りの期間となる（22条の2第5項）。","m":"移転後の士証は残存期間"},{"f":"業法","t":"37条書面","ref":"R02-37-ア","s":"宅地建物取引業者Aが自ら売主として宅建業者でない買主と宅地の売買契約を締結したときは、Aは宅地建物取引士をして、37条書面の内容を買主に説明させなければならない。","a":0,"e":"37条書面は交付（記名）が必要だが、宅建士による説明は義務付けられていない。説明義務は35条の重要事項。","m":"37条書面に説明義務なし"},{"f":"業法","t":"37条書面","ref":"R02-37-ウ","s":"宅地建物取引業者Aが自ら売主として宅地の売買契約を締結した場合、買主が宅地建物取引業者であっても、Aは買主に対して37条書面を契約締結後遅滞なく交付しなければならない。","a":1,"e":"37条書面の交付義務は業者間取引でも適用除外とならず、相手方が宅建業者でも交付が必要（78条2項）。","m":"業者間でも37条書面は必要"},{"f":"業法","t":"37条書面","ref":"R02-37-エ","s":"宅地建物取引業者Aが自ら売主として宅地を売却する場合、買主が宅地建物取引業者であれば、宅地の引渡しの時期と所有権移転登記の申請の時期は37条書面に記載しなくてもよい。","a":0,"e":"引渡し時期と移転登記の申請時期は売買の必要的記載事項で、相手方が宅建業者でも省略できない（37条1項）。","m":"引渡・登記時期は必ず記載"},{"f":"業法","t":"媒介契約","ref":"R02-38-2","s":"宅地建物取引業者が売却の媒介を依頼された物件の価額について依頼者に意見を述べる場合、その根拠を明らかにしなければならず、その方法は必ず書面によらなければならない。","a":0,"e":"価額に意見を述べるときは根拠を明らかにする必要があるが、方法は口頭でもよい（34条の2第2項）。","m":"価額の根拠は口頭でもOK"},{"f":"業法","t":"媒介契約","ref":"R02-38-3","s":"宅地建物取引業者Aが住宅の所有者Bから売却の媒介を依頼され、Bと一般媒介契約を締結した場合でも、Aは、当該住宅に関する所定の事項を指定流通機構に登録しなければならない。","a":0,"e":"指定流通機構への登録義務は専任媒介・専属専任媒介に限られ、一般媒介には課されない（34条の2第5項）。","m":"一般媒介に登録義務なし"},{"f":"業法","t":"媒介契約","ref":"R02-38-4","s":"宅地建物取引業者が一般媒介契約を締結した場合であっても、作成して依頼者に交付する媒介契約の書面には、媒介契約の有効期間と解除に関する事項を記載しなければならない。","a":1,"e":"有効期間と解除に関する事項は、一般媒介を含むすべての媒介契約書面の記載事項（34条の2第1項）。","m":"有効期間・解除は必ず記載"},{"f":"業法","t":"クーリング・オフ","ref":"R02-40-ア","s":"宅建業者Aが自ら売主となる宅地の売買で、買主Bが喫茶店で買受けを申し込み、クーリング・オフについて書面で告げられた日の翌日から起算して8日目に解除の書面を発送した場合、Bは契約を解除できる。","a":0,"e":"期間は告げられた日から起算して8日間。翌日起算の8日目は告知日から9日目で期間経過後なので解除できない（37条の2）。","m":"告げられた日から8日"},{"f":"業法","t":"クーリング・オフ","ref":"R02-40-イ","s":"買主Bが喫茶店で宅地の買受けを申し込み、クーリング・オフの期間内に売主である宅建業者Aが契約の履行に着手した場合でも、Bはクーリング・オフにより契約を解除できる。","a":1,"e":"売主の履行着手はクーリング・オフを妨げない。履行着手が問題となるのは手付解除の場面である。","m":"業者の履行着手は無関係"},{"f":"業法","t":"クーリング・オフ","ref":"R02-40-エ","s":"買主Bが、宅建業者Aの事務所以外で継続的に業務を行うことができる施設を有する場所で買受けを申し込み、2日後に喫茶店で契約を締結した場合、Bはクーリング・オフにより契約を解除できる。","a":0,"e":"申込みの場所が事務所等であれば、契約締結場所が喫茶店でもクーリング・オフはできない。判断は申込み場所で行う。","m":"申込み場所で判断"},{"f":"業法","t":"重要事項説明","ref":"R02-41-2","s":"宅地建物取引業者が交付する重要事項説明書に記名する宅地建物取引士は専任の宅地建物取引士でなければならないが、実際に説明を行う宅地建物取引士は専任でなくてもよい。","a":0,"e":"35条書面への記名も重要事項の説明も、宅建士であれば足り、専任の宅建士である必要はない。","m":"記名も説明も専任不要"},{"f":"業法","t":"重要事項説明","ref":"R02-41-3","s":"宅地建物取引士証を紛失し、その再交付を申請中の宅地建物取引士は、再交付を受けるまでの間、相手方の承諾があっても、宅地建物取引業法35条の重要事項の説明を行うことができない。","a":1,"e":"重要事項の説明時には宅建士証の提示が必要（35条4項）なので、手元にない間は説明できない。","m":"士証なしでは重説できない"},{"f":"業法","t":"重要事項説明","ref":"R02-41-4","s":"宅地建物取引業者が行う35条の重要事項の説明は、相手方の自宅や勤務先、喫茶店などの場所で行うことはできず、宅地建物取引業者の事務所において行わなければならない。","a":0,"e":"重要事項説明の場所について宅建業法に定めはなく、事務所以外の場所で行ってもよい。","m":"重説の場所は自由"},{"f":"業法","t":"免許の基準","ref":"R02-43-1","s":"A社の取締役が傷害罪で拘禁刑1年・執行猶予2年の判決を受け、取り消されることなく猶予期間を満了した場合でも、A社はその満了日から5年を経過しなければ免許を受けることができない。","a":0,"e":"執行猶予期間を満了すれば刑の言渡しは効力を失い、取締役は欠格事由に当たらない。A社は直ちに免許を受けられる。","m":"猶予満了なら即OK"},{"f":"業法","t":"免許","ref":"R02-43-2","s":"個人で宅地建物取引業を営むBが死亡した場合、Bの相続人Cは、Bが売主として生前に締結していた売買契約に基づいて、その取引を結了するために買主に目的物を引き渡すことができる。","a":1,"e":"相続人は、被相続人が締結した取引を結了する目的の範囲内で宅建業者とみなされる（76条）。","m":"取引の結了は相続人がOK"},{"f":"業法","t":"免許","ref":"R02-43-3","s":"法人である宅地建物取引業者D社が破産手続開始の決定を受けた場合、D社の役員は30日以内に免許権者に届け出なければならず、D社の免許は破産手続開始の決定日に効力を失う。","a":0,"e":"破産の場合の届出義務者は破産管財人で、免許は届出の時に効力を失う（11条1項3号・2項）。","m":"破産は管財人が届出・届出時失効"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R02-45-1","s":"宅地建物取引業者Aが自ら売主となる新築住宅の売買で、媒介をした宅地建物取引業者が住宅販売瑕疵担保責任保険契約を締結していれば、Aは資力確保措置を講じる必要はない。","a":0,"e":"資力確保措置の義務者は売主である宅建業者Aであり、媒介業者等の保険加入によって免除されることはない。","m":"資力確保は売主の義務"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R02-45-2","s":"住宅販売瑕疵担保保証金を供託した宅地建物取引業者は、基準日において供託額が基準額を超えることとなったときは、免許権者の承認を受けてその超過額を取り戻すことができる。","a":1,"e":"基準額超過分は免許権者の承認を受けて取り戻せる（住宅瑕疵担保履行法16条、9条）。営業保証金と違い公告は不要。","m":"超過分は承認で取戻し"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R02-45-4","s":"宅地建物取引業者が自ら売主として、宅地建物取引業者である買主に新築住宅を販売する場合でも、売主は住宅販売瑕疵担保保証金の供託または保険契約の締結をしなければならない。","a":0,"e":"資力確保措置は買主が宅建業者でない場合に必要で、業者間取引では不要（住宅瑕疵担保履行法2条）。","m":"業者間は資力確保不要"},{"f":"税他","t":"景品表示法","ref":"R02-47-1","s":"路地状部分のみで道路に接する土地で、路地状部分の面積が土地面積のおおむね30％以上を占めるときは、広告にその旨と路地状部分の割合または面積を明示しなければならない。","a":1,"e":"路地状部分がおおむね30％以上の土地は、路地状部分を含む旨と割合または面積の明示が必要（公正競争規約施行規則）。","m":"路地状30％以上は明示"},{"f":"税他","t":"景品表示法","ref":"R02-47-2","s":"宅地建物取引業者が新築分譲住宅の広告をする際、物件から最寄駅まで実際に歩いて15分かかった場合は、道路距離にかかわらず「最寄駅まで徒歩15分」と表示することができる。","a":0,"e":"徒歩所要時間は道路距離80mにつき1分で算出し、1分未満の端数は1分に切り上げる。実測時間ではない。","m":"徒歩は80m＝1分"},{"f":"税他","t":"景品表示法","ref":"R02-47-4","s":"宅地建物取引業者が住戸により管理費が異なる分譲マンションの広告をする際、全住戸の管理費を示すことが困難な場合は、全住戸の管理費の平均額を1戸当たりの月額として表示すればよい。","a":0,"e":"原則は1戸当たりの月額。全住戸の表示が困難な場合は最低額と最高額を表示し、平均額では足りない。","m":"管理費は最低と最高"},{"f":"税他","t":"土地・建物","ref":"R02-49-1","s":"都市化によって地表がアスファルトやコンクリート等で覆われると、雨水が地中に浸透しにくくなって短時間に河川へ流れ込むため、都市の中小河川が氾濫する原因の一つとなっている。","a":1,"e":"不浸透面の増加で雨水が一気に河川へ流出し、都市型水害（中小河川の氾濫）の原因となる。","m":"舗装で雨水が一気に川へ"},{"f":"税他","t":"土地・建物","ref":"R02-49-3","s":"液状化現象は、地下水位の高い緩い砂質地盤で起こりやすく、海岸沿いの埋立地、旧河道、沼や湿地を埋め立てて造成した土地などで発生しやすいため、古地図等での確認が有効である。","a":1,"e":"地下水位が高く緩い砂質地盤で起こりやすい。古い地図で旧河道や埋立地かどうかを確認するのが有効。","m":"埋立地・旧河道は液状化注意"},{"f":"権利","t":"相続","ref":"R02s-08-ア","s":"Aが1億2,000万円の財産を残して死亡した。Aに配偶者はおらず、子の長男・次男はAより先に死亡しており、長男には子B・C、次男には子Dがいる。この場合、B・C・Dはそれぞれ4,000万円ずつ相続する。","a":0,"e":"代襲相続人は被代襲者の相続分を引き継ぐ。長男分6,000万円をB・Cが3,000万円ずつ、次男分6,000万円をDが相続する（民法901条）。","m":"代襲は親の取り分を分ける"},{"f":"権利","t":"相続","ref":"R02s-08-ウ","s":"Aが1億2,000万円の財産を残して死亡した。Aには配偶者・子・兄弟姉妹がなく、父母も既に死亡しているが、祖父母E・F・Gの3人が存命である。この場合、E・F・Gはそれぞれ4,000万円ずつ相続する。","a":1,"e":"直系尊属には代襲相続の考え方はなく、同じ親等の尊属が均等に相続する。祖父母3人で1億2,000万円を3等分する。","m":"尊属は頭数で均等割り"},{"f":"権利","t":"時効","ref":"R02s-09-1","s":"Aは、隣地Bの土地を通行するための地役権の時効取得を主張している。民法上、地役権は、継続的に行使されるもの、又は外形上認識することができるもののいずれか一方に該当すれば、時効によって取得することができる。","a":0,"e":"時効取得できる地役権は、継続的に行使され、かつ外形上認識できるものに限られる（民法283条）。両方の要件が必要。","m":"継続『かつ』外形で時効取得"},{"f":"権利","t":"物権変動・対抗","ref":"R02s-09-4","s":"要役地の所有権を譲り受けた者は、その所有権移転登記を備えて所有権取得を承役地の所有者に対抗できる場合、地役権の登記を自ら備えていなくても、地役権の取得を承役地の所有者に対抗できる。","a":1,"e":"地役権は要役地の所有権に従って移転する（付従性、民法281条）。要役地の所有権取得を対抗できれば地役権の取得も対抗できる。","m":"地役権は要役地にくっつく"},{"f":"権利","t":"共有・相隣","ref":"R02s-10-1","s":"A・B・Cの3人が共同で購入した土地について、売買契約書にも登記にも各自の持分の割合が示されておらず、持分の割合が明らかでない。この場合、A・B・Cの持分は相等しいものと推定される。","a":1,"e":"共有者の持分は、合意や法律の規定で定まらず不明なときは、相等しいものと推定される（民法250条）。","m":"持分不明なら平等推定"},{"f":"権利","t":"共有・相隣","ref":"R02s-10-2","s":"A・B・Cが共有する建物について、Aが大規模な増築のように共有物の形状又は効用の著しい変更を伴う変更を加えようとする場合、Aは他の共有者であるB・C全員の同意を得なければならない。","a":1,"e":"形状・効用の著しい変更は全員の同意が必要。著しい変更を伴わない軽微な変更は持分の過半数で決められる（民法251条・252条）。","m":"重い変更は全員同意"},{"f":"権利","t":"共有・相隣","ref":"R02s-10-4","s":"A・Bが共有する土地について、Aが死亡したが、Aには相続人がなく、特別縁故者への財産分与もされなかった。この場合、Aの共有持分は国庫に帰属し、他の共有者Bに帰属することはない。","a":0,"e":"共有者が相続人なく死亡した場合、その持分は国庫ではなく他の共有者に帰属する（民法255条）。","m":"相続人なき持分は他の共有者へ"},{"f":"権利","t":"借地","ref":"R02s-11-1","s":"Aから土地を賃借したBが、その土地上に自己名義の建物を所有している。この建物について、Bが所有権保存登記をせず表示の登記しかしていないときは、Bは借地権を土地の譲受人など第三者に対抗することができない。","a":0,"e":"借地上の建物の登記は、権利の登記でなく表示の登記でも借地権の対抗要件となる（借地借家法10条1項、判例）。","m":"表示登記でも借地権は対抗可"},{"f":"権利","t":"借地","ref":"R02s-11-2","s":"登記した借地上の建物が滅失し、借地権者が必要事項を土地上の見やすい場所に掲示した。その後2年以内に新建物を築造すれば、新建物の登記をしなくても、滅失から2年経過後も借地権を第三者に対抗できる。","a":0,"e":"掲示による対抗力は滅失から2年間に限られる。2年経過後も対抗するには、その間に新建物を築造し登記する必要がある（借地借家法10条2項）。","m":"掲示は2年、その先は登記"},{"f":"権利","t":"借地","ref":"R02s-11-4","s":"借地権者Bが一筆の借地上に2棟の建物を所有しており、そのうち1棟についてのみB名義の登記がある。この場合、Bの借地権の対抗力は、登記のある建物の敷地部分に限られず、その一筆の土地全体に及ぶ。","a":1,"e":"一筆の土地上の複数建物のうち1棟でも借地権者名義の登記があれば、その土地全体について借地権を対抗できるとされる（判例）。","m":"1棟の登記で土地全体OK"},{"f":"権利","t":"賃貸借","ref":"R02s-12-1","s":"居住用建物の賃借人Bが、雨漏りのため修繕が必要である旨を賃貸人Aに通知したにもかかわらず、Aが相当の期間内に必要な修繕をしない場合、Bは自らその修繕をすることができる。","a":1,"e":"修繕が必要な旨を通知し（又は賃貸人が知り）相当期間内に修繕されないとき、又は急迫の事情があるときは、賃借人が自ら修繕できる（民法607条の2）。","m":"通知して放置なら自分で修繕"},{"f":"権利","t":"借家","ref":"R02s-12-3","s":"期間2年の居住用建物賃貸借で、賃貸人が契約前に「更新がなく期間満了で終了する」旨を書面の交付をせず口頭で説明しただけでも、書面で契約していれば期間満了で賃貸借は終了する。","a":0,"e":"定期建物賃貸借には、契約書とは別の書面の交付（借主の承諾があれば電磁的方法）による事前説明が必要。口頭のみでは定期借家にならない（借地借家法38条）。","m":"定期借家は別書面で説明"},{"f":"権利","t":"借家","ref":"R02s-12-4","s":"居住用建物の賃借人が相続人なしに死亡した場合、事実上夫婦と同様の関係にあった同居者は、賃借人の死亡を知った後1か月以内に反対の意思を表示しない限り、賃借人の権利義務を承継する。","a":1,"e":"相続人がいない場合、内縁の配偶者等の同居者が借家権を承継する。死亡を知ってから1か月以内に反対の意思表示をすれば承継しない（借地借家法36条）。","m":"内縁同居者は1か月で承継"},{"f":"権利","t":"区分所有法","ref":"R02s-13-1","s":"区分所有建物の規約は、原則として管理者が保管しなければならない。また、規約を保管する者は、その保管場所を建物内の見やすい場所に掲示しなければならず、利害関係人の閲覧請求にも応じなければならない。","a":1,"e":"規約は管理者が保管し（管理者がないときは区分所有者等のうち規約・集会で定める者）、保管場所を建物内の見やすい場所に掲示する（区分所有法33条）。","m":"規約は管理者保管＋場所掲示"},{"f":"権利","t":"区分所有法","ref":"R02s-13-2","s":"マンションの共用部分は区分所有者全員の共有に属するのが原則であるが、区分所有者が選任した管理者は、規約に特別の定めがあるときは、その規約に基づいて共用部分を所有することができる。","a":1,"e":"規約に特別の定めがあれば、管理者は共用部分を所有できる（管理所有、区分所有法27条1項）。","m":"規約で管理者の管理所有"},{"f":"権利","t":"区分所有法","ref":"R02s-13-3","s":"マンションの規約及び集会の決議は、区分所有者の特定承継人、例えば決議の後に住戸を買い受けて新たに区分所有者となった者に対しては、その者が同意しない限り効力を生じない。","a":0,"e":"規約・集会の決議は区分所有者の特定承継人に対しても効力を生じる（区分所有法46条1項）。新所有者もこれに従う。","m":"買主も規約・決議に従う"},{"f":"法令","t":"開発許可","ref":"R02s-16-1","s":"市街化調整区域において、非常災害のため必要な応急措置として行う開発行為であっても、開発区域の面積が1,000㎡以上であれば都道府県知事の許可を受けなければならない。","a":0,"e":"非常災害のための応急措置として行う開発行為は、区域や規模を問わず開発許可が不要（都市計画法29条1項10号）。","m":"非常災害の応急措置は不要"},{"f":"法令","t":"開発許可","ref":"R02s-16-2","s":"都市計画法上、市街化区域において、公民館の建築の用に供する目的で行う1,500㎡の開発行為については、条例で別段の定めがない場合、都道府県知事の開発許可を受ける必要はない。","a":1,"e":"公民館など公益上必要な建築物のための開発行為は、区域・規模を問わず開発許可が不要（都市計画法29条1項3号）。","m":"公民館は公益で許可不要"},{"f":"法令","t":"開発許可","ref":"R02s-16-4","s":"都市計画法上、市街化調整区域において、Aが自己の居住の用に供する住宅を建築する目的で行う100㎡の開発行為であれば、規模が小さいため都道府県知事の開発許可を受ける必要はない。","a":0,"e":"市街化調整区域には小規模の例外がなく、自己居住用住宅の建築目的でも原則として開発許可が必要（都市計画法29条1項）。","m":"調整区域は小さくても許可"},{"f":"法令","t":"建築基準法","ref":"R02s-17-1","s":"建築基準法上、建築物が防火地域と準防火地域にわたる場合（防火壁で区画されていないものとする）には、その建築物の敷地の面積が大きい方の地域の規定が、その建築物の全部に適用される。","a":0,"e":"防火地域と準防火地域にわたる建築物は、原則として全部に厳しい防火地域の規定が適用される（建築基準法65条2項）。面積の大小は関係ない。","m":"またがれば厳しい方を全部に"},{"f":"法令","t":"建築基準法","ref":"R02s-17-3","s":"建築基準法上、高さ25mの事務所ビルを新築する場合、周囲の状況によって安全上支障がない場合を除き、落雷による被害を防ぐため、有効に避雷設備を設けなければならない。","a":1,"e":"高さ20mを超える建築物には、周囲の状況により安全上支障がない場合を除き、避雷設備を設けなければならない（建築基準法33条）。","m":"20m超で避雷設備"},{"f":"法令","t":"建築基準法","ref":"R02s-17-4","s":"建築基準法上、建築物の階段には原則として手すりを設けなければならないが、高さ1m以下の階段の部分については、この手すりの設置に関する規定は適用されず、手すりを設けなくてもよい。","a":1,"e":"階段には手すりを設ける必要があるが、高さ1m以下の階段の部分には適用されない（建築基準法施行令25条）。","m":"1m以下の階段は手すり不要"},{"f":"法令","t":"土地区画整理法","ref":"R02s-20-1","s":"地方公共団体が施行する土地区画整理事業で、施行後の宅地価額の総額が施行前の総額より減少した場合、減価補償金は宅地の所有者等のほか、施行地区内の建物の賃借人にも交付される。","a":0,"e":"減価補償金の交付対象は、宅地の所有者と、宅地について地上権・賃借権など使用収益権を持つ者。建物の賃借人は対象外（土地区画整理法109条）。","m":"減価補償金は宅地の権利者へ"},{"f":"法令","t":"土地区画整理法","ref":"R02s-20-2","s":"土地区画整理事業の施行者は、仮換地を指定した時には、従前の宅地と仮換地との間に価値の不均衡がある場合、清算金に相当する金額を必ず徴収し、又は交付しなければならない。","a":0,"e":"清算金は換地処分の公告後に確定し徴収・交付する。仮換地指定時の仮清算は必要があるとき任意に行えるにすぎない（土地区画整理法102条・110条）。","m":"仮清算は任意"},{"f":"法令","t":"土地区画整理法","ref":"R02s-20-3","s":"土地区画整理事業の施行者が換地計画において換地を定める場合には、換地と従前の宅地の位置、地積、土質、水利、利用状況、環境等が照応するように定めなければならない。","a":1,"e":"換地は従前の宅地と位置・地積・土質・水利・利用状況・環境等が照応するように定める（換地照応の原則、土地区画整理法89条）。","m":"換地は照応の原則"},{"f":"法令","t":"農地法","ref":"R02s-21-1","s":"Aは、山林を開墾して現に水田として耕作している土地を所有している。この土地の登記簿上の地目が山林のままであれば、この土地は農地法上の農地には該当せず、農地法の規制を受けない。","a":0,"e":"農地かどうかは登記簿の地目でなく現況で判断する。現に耕作されていれば農地法上の農地に当たる（農地法2条1項）。","m":"農地は現況で判断"},{"f":"法令","t":"農地法","ref":"R02s-21-2","s":"農業を営む親Aが、所有する市街化調整区域内の農地のすべてを一括して、耕作を引き継ぐ子Bに贈与する場合には、親子間の承継であるため、農地法第3条第1項の許可を受ける必要はない。","a":0,"e":"贈与による権利移転は3条許可が必要。許可が不要なのは相続・遺産分割・包括遺贈など（農地法3条1項）。","m":"贈与は3条許可が必要"},{"f":"法令","t":"農地法","ref":"R02s-21-3","s":"農業者Aが、耕作の目的で、裁判所の競売手続により他人の所有する農地を買い受けて取得する場合であっても、Aは原則どおり農地法第3条第1項の許可を受ける必要がある。","a":1,"e":"競売による取得も許可不要の例外に当たらず、耕作目的なら3条許可が必要（農地法3条1項）。","m":"競売でも3条許可"},{"f":"法令","t":"国土利用計画法","ref":"R02s-22-1","s":"国土利用計画法の事後届出を受けた都道府県知事は、届出に係る土地の利用目的について勧告できるほか、届出に係る対価の額についても、著しく適正を欠くときは変更すべきことを勧告することができる。","a":0,"e":"事後届出に対する勧告は土地の利用目的についてのみ行い、対価の額は勧告の対象にならない（国土利用計画法24条）。","m":"事後届出の勧告は利用目的だけ"},{"f":"法令","t":"国土利用計画法","ref":"R02s-22-3","s":"個人Aが国から市街化区域内の2,000㎡の土地を購入する売買契約を締結した場合、Aは契約締結日から起算して2週間以内に、国土利用計画法の事後届出をしなければならない。","a":0,"e":"当事者の一方又は双方が国・地方公共団体等である契約は、面積にかかわらず事後届出が不要（国土利用計画法23条2項3号）。","m":"国が当事者なら届出不要"},{"f":"法令","t":"国土利用計画法","ref":"R02s-22-4","s":"Cが、都市計画区域外にあるD所有の11,000㎡の土地について、権利金（対価）を支払って地上権の設定を受ける契約を締結した場合、Cは国土利用計画法の事後届出を行わなければならない。","a":1,"e":"対価を伴う地上権・賃借権の設定も土地売買等の契約に当たる。都市計画区域外は1万㎡以上が届出対象（国土利用計画法23条）。","m":"区域外は1万㎡以上"},{"f":"業法","t":"業務上の規制","ref":"R02s-26-1","s":"宅建業者Aが自ら売主として宅地を販売する際、資金に不安のある買主に対して金融機関の住宅ローンをあっせんし、それによって売買契約の締結を誘引することは、手付の貸付けと同様に宅建業法で禁止されている。","a":0,"e":"禁止されるのは手付の貸付け・分割払い・後払い等による信用供与での契約誘引。代金の借入れのあっせんは禁止されていない（宅建業法47条3号）。","m":"ローンのあっせんはOK"},{"f":"業法","t":"宅建士","ref":"R02s-26-2","s":"宅建業者A社が不正の手段で免許を受けたとして免許を取り消された。取消しの聴聞の期日・場所の公示日前60日以内にA社の役員であった者は、取消しの日から5年を経過しなければ宅建士の登録を受けられない。","a":1,"e":"不正手段・情状が特に重い・業務停止処分違反による免許取消しの場合、公示日前60日以内の役員も5年間は登録欠格となる（宅建業法18条1項）。","m":"悪質取消しの役員は5年"},{"f":"業法","t":"業務上の規制","ref":"R02s-26-3","s":"宅建業者Aは、建築確認を受ける前の工事完了前の賃貸マンションの一室について、貸主Bから依頼を受け、Bを代理して宅建業者でない借主Cとの間で賃貸借契約を締結することができる。","a":1,"e":"建築確認前の契約締結が禁止されるのは売買・交換（その代理・媒介）のみ。貸借の契約は制限されない（宅建業法36条）。広告は貸借も不可。","m":"契約制限は売買・交換だけ"},{"f":"業法","t":"事務所・案内所","ref":"R02s-26-4","s":"宅建業者Aが一団の宅地（10区画）の分譲のために、現地に契約締結権限を持つ者を置かない案内所を設置した場合、Aはその案内所にも業務に関する帳簿を備え付けなければならない。","a":0,"e":"帳簿の備付け義務は事務所ごとに課される。一時的な案内所は事務所に当たらず、帳簿は不要（宅建業法49条）。","m":"帳簿は事務所だけ"},{"f":"業法","t":"広告","ref":"R02s-27-1","s":"宅建業者が、販売する宅地の環境について著しく事実に相違する表示の広告をした場合でも、その広告を見て誤認した者がおらず、実際に損害も発生していなければ、監督処分の対象とはならない。","a":0,"e":"誇大広告は表示をした時点で違反となり、誤認や損害の発生は不要。監督処分の対象となる（宅建業法32条・65条）。","m":"誇大広告は出した時点で違反"},{"f":"業法","t":"広告","ref":"R02s-27-2","s":"宅建業者Aは、建築確認の申請中である新築予定の分譲住宅について、新聞折込チラシの広告中に建築確認申請中である旨を明示すれば、その建物の売買に関する広告をすることができる。","a":0,"e":"工事完了前の建物は、建築確認等の処分を受けた後でなければ広告できない。申請中と表示しても違反（宅建業法33条）。","m":"申請中の広告はNG"},{"f":"業法","t":"広告","ref":"R02s-27-3","s":"宅建業者Aは、分譲予定の宅地について造成工事の完了前であっても、その工事に必要な都市計画法の開発許可を受けた後であれば、その宅地の売買に関する広告をすることができる。","a":1,"e":"工事完了前でも、開発許可・建築確認など工事に必要な処分を受けた後であれば広告できる（宅建業法33条）。","m":"許可後なら完成前も広告可"},{"f":"業法","t":"媒介契約","ref":"R02s-28-ア","s":"宅建業者Aが売主Bから宅地の売却について専任媒介契約を締結した場合でも、Bとの間で指定流通機構に登録しない旨の特約をしたときは、Aは当該宅地を指定流通機構に登録しなくてよい。","a":0,"e":"専任媒介では契約締結日から7日以内（休業日除く）に指定流通機構へ登録する義務があり、これに反する特約は無効（宅建業法34条の2第5項・10項）。","m":"登録しない特約は無効"},{"f":"業法","t":"媒介契約","ref":"R02s-28-ウ","s":"依頼者が他の業者に重ねて依頼する際はその業者を明示する義務がある一般媒介契約では、明示していない業者の媒介で契約が成立したときの措置を媒介契約書面に記載しなければならない。","a":1,"e":"明示型の一般媒介では、明示義務に違反して契約が成立した場合の措置が媒介契約書面の記載事項となる（宅建業法34条の2第1項）。","m":"明示型は違反時の措置を記載"},{"f":"業法","t":"媒介契約","ref":"R02s-28-エ","s":"宅建業者Aが売主Bから宅地の売却の媒介を依頼され、その宅地の売買すべき価額について意見を述べるときは、その根拠として不動産鑑定士による鑑定評価書をBに示さなければならない。","a":0,"e":"価額について意見を述べるときは根拠を明らかにすればよく、不動産鑑定士の評価は不要。取引事例比較など合理的な根拠で足りる（宅建業法34条の2第2項）。","m":"根拠は必要、鑑定は不要"},{"f":"業法","t":"媒介契約","ref":"R02s-29-2","s":"宅建業者Aが売主Bと締結した専任媒介契約に基づいて宅地の売買契約が成立した場合、Aは、その宅地の引渡しが完了した後でなければ、指定流通機構への成約の通知をする必要はない。","a":0,"e":"売買契約が成立したら遅滞なく登録番号・取引価格・成立年月日を指定流通機構に通知する。引渡しの完了は要件でない（宅建業法34条の2第7項）。","m":"成約したら遅滞なく通知"},{"f":"業法","t":"媒介契約","ref":"R02s-29-3","s":"宅建業者Aが売主Bと宅地の売買の媒介契約を締結したときに作成・交付する書面には、宅建業者Aの記名押印が必要であるが、Aの従業者で担当する宅建士の記名押印は必要ない。","a":1,"e":"媒介契約書面への記名押印は宅建業者の義務であり、宅建士の記名は不要（宅建業法34条の2第1項）。35条・37条書面との違いに注意。","m":"媒介契約書は業者の記名押印"},{"f":"業法","t":"媒介契約","ref":"R02s-29-4","s":"宅建業者Aが売主Bから宅地の売却の依頼を受けて一般媒介契約を締結した場合には、専任媒介契約の場合と異なり、Bに交付する媒介契約書面に売買すべき価額を記載する必要はない。","a":0,"e":"売買すべき価額又はその評価額は、一般・専任を問わず媒介契約書面の記載事項（宅建業法34条の2第1項2号）。","m":"価額は必ず記載"},{"f":"業法","t":"保証協会","ref":"R02s-30-1","s":"本店と支店3か所を設置している宅建業者Aが保証協会に加入しようとする場合、Aが加入しようとする日までに保証協会に納付すべき弁済業務保証金分担金の額は110万円である。","a":0,"e":"分担金は本店60万円、支店1か所ごとに30万円。60万＋30万×3＝150万円となる（宅建業法64条の9、施行令7条）。","m":"分担金は60万＋30万×支店"},{"f":"業法","t":"保証協会","ref":"R02s-30-2","s":"保証協会の社員である宅建業者は、保証協会から還付充当金を納付するよう通知を受けたときは、通知を受けた日から2週間以内に、その額を保証協会に納付しなければならない。","a":1,"e":"還付充当金の納付期限は通知を受けた日から2週間以内。期限内に納付しないと社員の地位を失う（宅建業法64条の10）。","m":"還付充当金は2週間"},{"f":"業法","t":"保証協会","ref":"R02s-30-4","s":"保証協会の社員である宅建業者Aと宅建業に関し取引をした者が、その取引による債権について弁済業務保証金から還付を受けるには、Aの免許権者である都道府県知事の認証を受けなければならない。","a":0,"e":"弁済業務保証金の還付を受けるには、保証協会の認証を受けて供託所に請求する（宅建業法64条の8第2項）。知事の認証ではない。","m":"還付の認証は保証協会"},{"f":"業法","t":"免許の基準","ref":"R02s-31-1","s":"宅建業者Aが免許を受けてから1年以内に事業を開始しなかったため免許を取り消された場合、Aは、取消しの日から5年を経過しなければ、新たに宅建業の免許を受けることができない。","a":0,"e":"1年以内に事業を開始しないことによる取消しは免許の欠格事由とされていないため、直ちに免許を受け直せる（宅建業法5条・66条）。","m":"不開始の取消しは欠格でない"},{"f":"業法","t":"免許","ref":"R02s-31-3","s":"宅建業の免許権者である国土交通大臣又は都道府県知事は、宅建業の免許に条件を付すことができ、免許の更新に当たっても、宅建業の適正な運営を確保するため条件を付すことができる。","a":1,"e":"免許権者は免許（更新を含む）に条件を付し、これを変更できる（宅建業法3条の2）。","m":"免許・更新とも条件OK"},{"f":"業法","t":"免許","ref":"R02s-31-4","s":"法人である宅建業者Aは、役員の住所に変更があったときは、宅建業者名簿の登載事項の変更として、30日以内にその旨を免許権者である都道府県知事に届け出なければならない。","a":0,"e":"変更の届出が必要なのは役員の氏名の変更で、住所は宅建業者名簿の登載事項でないため届出不要（宅建業法8条・9条）。","m":"役員は氏名のみ届出"},{"f":"業法","t":"重要事項説明","ref":"R02s-32-イ","s":"宅建業者が建物の貸借の媒介を行う場合（借主は宅建業者でない）、その建物が土砂災害警戒区域内にあるときは、宅建業者は重要事項説明においてその旨を説明しなければならない。","a":1,"e":"土砂災害警戒区域内にある旨は、売買・貸借を問わず重要事項として説明が必要（宅建業法35条1項14号、規則16条の4の3）。","m":"土砂災害区域は貸借も説明"},{"f":"業法","t":"重要事項説明","ref":"R02s-32-ウ","s":"宅建業者が宅地の貸借の媒介を行う場合（借主は宅建業者でない）、文化財保護法に基づく重要文化財の譲渡に関する制限については、その概要を重要事項として説明する必要はない。","a":1,"e":"重要文化財の譲渡制限は有償譲渡に関する制限なので、売買では説明が必要だが貸借では不要（宅建業法35条1項2号、施行令3条）。","m":"文化財の譲渡制限は貸借不要"},{"f":"業法","t":"重要事項説明","ref":"R02s-32-エ","s":"宅建業者が宅地の売買の媒介を行う場合（買主は宅建業者でない）、その宅地が津波防災地域づくりに関する法律の津波防護施設区域内にあるときは、同法に基づく制限の概要を説明しなければならない。","a":1,"e":"津波防護施設区域内では土地の掘削等に管理者の許可が必要で、宅地の売買ではその制限の概要を説明する（宅建業法35条1項2号、施行令3条）。","m":"津波防護施設は宅地なら説明"},{"f":"業法","t":"報酬","ref":"R02s-34-2","s":"宅建業者Aが、売買の媒介の依頼者に対して不当に高額の報酬を要求した場合でも、依頼者が支払いを拒み、Aが実際にその報酬を受領していなければ、宅建業法違反とはならない。","a":0,"e":"不当に高額の報酬を要求する行為自体が禁止されており、受領していなくても違反となる（宅建業法47条2号）。","m":"高額報酬は要求だけで違反"},{"f":"業法","t":"報酬","ref":"R02s-34-3","s":"事業用建物の貸借の媒介で借賃が月額10万円（税抜）の場合、課税事業者である宅建業者は、貸主から9万円、借主から1万円の合計10万円を報酬として受領しても宅建業法に違反しない。","a":1,"e":"事業用建物の貸借では、双方から受ける報酬の合計が借賃1か月分（税込1.1倍）以内なら、負担割合は規制されない（報酬告示）。","m":"事業用は合計1か月で割合自由"},{"f":"業法","t":"報酬","ref":"R02s-34-4","s":"宅建業者Aは、媒介の依頼者の依頼によらずに自ら行った通常の広告の料金について、依頼者の承諾があれば、報酬限度額を超えてその広告料金相当額を受領することができる。","a":0,"e":"報酬限度額を超えて受領できる広告料金は、依頼者の依頼によって行った広告に限られる。依頼によらない広告料は承諾があっても不可（報酬告示）。","m":"依頼なき広告料は取れない"},{"f":"業法","t":"37条書面","ref":"R02s-35-ア","s":"宅建業者Aが宅地の売買を媒介した場合、Aは、37条書面に記名した宅建士とは別の、宅建士でない従業者に、その37条書面を契約の当事者である売主・買主へ交付させても差し支えない。","a":1,"e":"37条書面への記名は宅建士が行う必要があるが、交付義務は宅建業者にあり、交付者は宅建士でなくてもよい（宅建業法37条）。","m":"37条の交付は誰でも可"},{"f":"業法","t":"37条書面","ref":"R02s-35-イ","s":"宅建業者Aが宅地の貸借の媒介で37条書面を交付する場合、宅地の引渡しの時期のほか、賃借権設定登記の申請の時期についても、37条書面に必ず記載しなければならない。","a":0,"e":"移転登記の申請時期は売買・交換の記載事項で、貸借の37条書面には不要。引渡しの時期は貸借でも必要（宅建業法37条2項）。","m":"貸借に登記時期は不要"},{"f":"業法","t":"37条書面","ref":"R02s-35-エ","s":"宅建業者Aが媒介して事業用定期借地権の設定契約を公正証書によって成立させた場合でも、Aは、公正証書とは別に37条書面を作成し、当事者双方に交付しなければならない。","a":1,"e":"公正証書で契約しても37条書面の作成・交付義務は免除されない。当事者が宅建業者でも宅建士の記名・交付は省略できない（宅建業法37条）。","m":"公正証書でも37条書面"},{"f":"業法","t":"37条書面","ref":"R02s-37-1","s":"既存建物の売買の媒介において、構造耐力上主要な部分等の状況について当事者双方が確認した事項がない場合、37条書面には確認した事項がない旨を記載しなければならない。","a":1,"e":"既存建物の売買・交換では、当事者双方が確認した事項を37条書面に記載する。確認事項がない場合は「無し」と記載する（宅建業法37条1項2号の2）。","m":"確認事項なしは『無し』"},{"f":"業法","t":"37条書面","ref":"R02s-37-2","s":"宅建業者Aが中古建物の売買を媒介した際、代金についての金銭の貸借のあっせんに関する定めがない場合、Aは37条書面にその旨、つまり「定めがない」旨を記載しなければならない。","a":0,"e":"ローンあっせんに関する事項は、定めがある場合に限り37条書面の記載事項となる。定めがなければ記載不要（宅建業法37条1項9号）。","m":"定めがなければ書かない"},{"f":"業法","t":"37条書面","ref":"R02s-37-3","s":"宅建業者Aが宅地の売買を媒介した際、当事者間で損害賠償額の予定又は違約金に関する定めがない場合でも、Aは37条書面に「定めがない」旨を必ず記載しなければならない。","a":0,"e":"損害賠償額の予定・違約金は、定めがある場合に限り37条書面の記載事項となる（宅建業法37条1項8号）。","m":"任意的記載は定めがあれば"},{"f":"業法","t":"宅建士","ref":"R02s-38-ア","s":"宅建業者は、事務所に置く専任の宅建士が退任して法定数を欠いた場合、30日以内に新たな専任の宅建士を置き、その後2週間以内に免許権者へ変更の届出をしなければならない。","a":0,"e":"法定数を欠いたときは2週間以内に補充などの措置をとり、専任宅建士の氏名変更は30日以内に届け出る。期間が逆（宅建業法31条の3・9条）。","m":"補充2週間、届出30日"},{"f":"業法","t":"宅建士","ref":"R02s-38-イ","s":"宅建士の資格登録を受けた18歳未満の未成年者は、法定代理人の同意があれば、宅建業者の役員ではなくても、その宅建業者の事務所に置かれる専任の宅建士となることができる。","a":0,"e":"専任の宅建士は成年者でなければならない。ただし宅建業者本人や法人役員である場合の例外がある（宅建業法31条の3）。法定代理人の同意では足りない。","m":"専任宅建士は成年者"},{"f":"業法","t":"宅建士","ref":"R02s-38-ウ","s":"宅建士は重要事項説明をするときは相手方に宅建士証を提示しなければならないが、相手方が宅建業者である場合は重要事項説明自体が不要なので、宅建士証の提示も不要である。","a":1,"e":"宅建業者が相手方の場合、35条書面の交付は必要だが説明は不要。説明をしない以上、宅建士証の提示も不要となる（宅建業法35条4項・6項）。","m":"業者相手は説明も提示も不要"},{"f":"業法","t":"宅建士","ref":"R02s-38-エ","s":"宅建士資格試験に合格した者が成年被後見人又は被保佐人に該当する場合、その者は、心身の状況を個別に審査されることなく、そのことのみを理由として一律に宅建士の登録を受けることができない。","a":0,"e":"成年被後見人等であることは一律の欠格事由ではない。心身の故障により宅建士の事務を適正に行えない者として個別に判断される（宅建業法18条1項12号）。","m":"成年被後見人は個別審査"},{"f":"業法","t":"クーリング・オフ","ref":"R02s-39-1","s":"買主Bが売主業者Aの仮設テント張りの案内所で買受けを申し込み、2日後にAの事務所で契約し代金全額を支払った。引渡し前の申込みから8日目にBが解除書面を送付しても、Aは代金全額の受領を理由に解除を拒める。","a":0,"e":"クーリング・オフできなくなるのは、引渡しを受け、かつ代金全額を支払った場合。引渡し前なら代金を払っていても解除できる（宅建業法37条の2）。","m":"引渡し＋全額払いで終了"},{"f":"業法","t":"クーリング・オフ","ref":"R02s-39-2","s":"買主Bが自ら希望した自宅近くの喫茶店で売主業者Aに申込みと契約をし、3日後にクーリング・オフについて書面で告げられた。Bは契約締結日から10日後でも解除できる。","a":1,"e":"喫茶店は買主が希望しても事務所等に当たらない。書面で告げられた日から起算して8日以内なら解除でき、10日後は期間内（宅建業法37条の2）。","m":"喫茶店はクーリング・オフ可"},{"f":"業法","t":"クーリング・オフ","ref":"R02s-39-4","s":"買主Bが自ら指定した、本件の代理・媒介を受けていない宅建業者の事務所で売主業者Aに申込み・契約をし、書面で告げられた日から6日後に解除の書面を発した場合、Aは解除を拒めない。","a":1,"e":"売買に関与しない他の業者の事務所は事務所等に当たらずクーリング・オフ可。告知から8日以内に書面を発しているので有効（宅建業法37条の2）。","m":"無関係業者の事務所は対象"},{"f":"業法","t":"業務上の規制","ref":"R02s-40-1","s":"宅建業者Aの従業者が、宅地の購入を勧誘した相手方から契約を締結しない旨の意思表示を受けたにもかかわらず、後日再度電話で勧誘を続けることは、宅建業法上の禁止事項に当たらない。","a":0,"e":"相手方が契約を締結しない旨や勧誘を受けたくない旨を表示した後に勧誘を継続することは禁止されている（宅建業法47条の2第3項）。","m":"断られたら勧誘終了"},{"f":"業法","t":"業務上の規制","ref":"R02s-40-3","s":"宅建業者Aは、宅地の売買の勧誘をした相手方が、契約を締結するかどうかを判断するための時間を求めた場合、正当な理由の有無を含め理由の如何を問わず、これを拒んではならない。","a":0,"e":"禁止されるのは、正当な理由なく判断に必要な時間を与えることを拒むこと。正当な理由があれば拒める（宅建業法47条の2第3項、施行規則）。","m":"正当な理由があれば拒める"},{"f":"業法","t":"業務上の規制","ref":"R02s-40-4","s":"宅建業者Aが、購入資金に不安があると述べた相手方に対し、売買代金を引き下げることを提案して宅地の売買契約の締結を勧誘することは、手付の信用供与に当たらず宅建業法に違反しない。","a":1,"e":"代金の値下げは手付の貸付け等の信用供与には当たらず、値下げを提示して勧誘しても違反にならない（宅建業法47条3号参照）。","m":"値下げ勧誘はOK"},{"f":"業法","t":"業務上の規制","ref":"R02s-41-1","s":"本店と支店を有する宅建業者Aは、支店には帳簿を備え付けず、本店に支店分の取引も含めた業務に関する帳簿をまとめて備え付けておけば、宅建業法第49条の帳簿備付け義務に違反しない。","a":0,"e":"帳簿は事務所ごとに備え付け、その事務所の取引を記載しなければならない。本店でまとめることはできない（宅建業法49条）。","m":"帳簿は事務所ごと"},{"f":"業法","t":"業務上の規制","ref":"R02s-41-2","s":"宅建業者は、その事務所ごとに業務に関する帳簿を備え、宅建業に関し取引のあったつど、その年月日、取引に係る宅地又は建物の所在及び面積その他所定の事項を記載しなければならない。","a":1,"e":"帳簿には取引のつど、年月日・所在・面積・取引態様・当事者・代金や報酬の額等を記載する（宅建業法49条、規則18条）。","m":"取引のつど帳簿に記載"},{"f":"業法","t":"業務上の規制","ref":"R02s-41-3","s":"宅建業者は、帳簿を各事業年度の末日に閉鎖し、閉鎖後5年間保存しなければならないが、宅建業者が売買の媒介をした新築住宅に係る帳簿は、閉鎖後10年間保存しなければならない。","a":0,"e":"保存期間は閉鎖後5年間が原則。10年間となるのは宅建業者が自ら売主となる新築住宅に係るものに限られ、媒介は含まれない（規則18条3項）。","m":"10年は自ら売主の新築"},{"f":"業法","t":"重要事項説明","ref":"R02s-42-1","s":"宅建業者が建物の売買の媒介をする場合において、その建物が歴史的風致形成建造物であるときは、増築をする際に市町村長への届出が必要である旨を、重要事項として説明する必要はない。","a":0,"e":"歴史的風致形成建造物の増築等に関する市町村長への届出義務は、建物の売買では説明が必要（貸借は不要）（宅建業法35条1項2号）。","m":"歴史的風致は売買なら説明"},{"f":"業法","t":"重要事項説明","ref":"R02s-42-3","s":"宅建業者が区分所有建物の売買の媒介をする場合（買主は宅建業者でない）において、一棟の建物の維持修繕の実施状況が記録されているときは、その内容を重要事項として説明しなければならない。","a":1,"e":"区分所有建物の売買では、一棟の建物の維持修繕の実施状況の記録があればその内容を説明する（宅建業法35条1項6号、規則16条の2）。","m":"マンション売買は修繕記録"},{"f":"業法","t":"重要事項説明","ref":"R02s-42-4","s":"宅建業者が居住用建物の貸借の媒介を行う場合（借主は宅建業者でない）、台所、浴室、便所その他の当該建物の設備の整備状況について、重要事項として説明しなければならない。","a":1,"e":"建物の貸借では、台所・浴室・便所等の設備の整備状況が重要事項説明の対象となる（宅建業法35条1項14号、規則16条の4の3）。","m":"貸借は設備の整備状況"},{"f":"業法","t":"宅建士","ref":"R02s-43-1","s":"宅建士Aが精神の機能の障害により宅建士の事務を適正に行えない者となった場合、その届出は法定代理人又は同居の親族がしなければならず、A本人が届け出ることはできない。","a":0,"e":"心身の故障による届出は、本人又は法定代理人若しくは同居の親族が、その日から30日以内に行う（宅建業法21条3号）。本人も届出できる。","m":"本人も届出できる"},{"f":"業法","t":"宅建士","ref":"R02s-43-2","s":"宅建士Aが登録の移転の申請とともに宅建士証の交付を申請する場合であっても、Aは、交付申請前6か月以内に行われる移転先の都道府県知事指定の講習を受講しなければならない。","a":0,"e":"登録の移転に伴う宅建士証の交付では法定講習は不要。新たな宅建士証の有効期間は従前の残存期間となる（宅建業法22条の2第2項・5項）。","m":"移転時は法定講習不要"},{"f":"業法","t":"宅建士","ref":"R02s-43-4","s":"宅建士が刑法の脅迫罪により罰金の刑に処せられて登録を消除された場合、刑の執行を終わり又は執行を受けることがなくなった日から5年を経過するまで、新たな登録を受けることができない。","a":1,"e":"脅迫罪など一定の犯罪による罰金刑は登録の欠格事由で、執行終了等から5年間は登録できない（宅建業法18条1項）。","m":"脅迫罪の罰金は5年"},{"f":"業法","t":"免許","ref":"R02s-44-ア","s":"宅建業法上の宅地には、現に建物の敷地に供されている土地だけでなく、取引の時点では更地であっても、将来建物の敷地に供する目的で取引の対象とされる土地も含まれる（用途地域外も同様）。","a":1,"e":"宅地とは、建物の敷地に供せられる土地をいい、取引時点で建物の敷地に供する目的で取引される土地を含む（宅建業法2条1号）。","m":"将来の建物敷地も宅地"},{"f":"業法","t":"免許","ref":"R02s-44-イ","s":"都市計画法の用途地域内にある土地であっても、現に農地として耕作されており、当面は建物の敷地に供する予定がない土地であれば、宅建業法上の宅地には該当せず、その売買の媒介に免許は不要である。","a":0,"e":"用途地域内の土地は、道路・公園・河川・広場・水路の用に供されているものを除き、現況が農地でも宅地に当たる（宅建業法2条1号）。","m":"用途地域内は原則宅地"},{"f":"業法","t":"免許","ref":"R02s-44-エ","s":"都市計画法の用途地域内にある土地であれば、道路、公園、河川等の公共施設の用に供せられている土地であっても、宅建業法上の宅地に該当し、その取引には宅建業法が適用される。","a":0,"e":"用途地域内でも、道路・公園・河川・広場・水路の用に供されている土地は宅地から除かれる（宅建業法2条1号、施行令1条）。","m":"道路・公園は宅地でない"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R02s-45-1","s":"自ら売主として新築住宅を販売する宅建業者が住宅販売瑕疵担保保証金を供託する場合、床面積100㎡以下の新築住宅は、販売新築住宅の合計戸数の算定において2戸をもって1戸と数える。","a":0,"e":"供託額算定の戸数で2戸を1戸と数えるのは、床面積55㎡以下の住宅である（住宅瑕疵担保履行法11条、施行令）。","m":"55㎡以下で2戸を1戸"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R02s-45-3","s":"住宅販売瑕疵担保責任保険契約では、引渡しから10年間、構造耐力上主要な部分、雨水の浸入を防止する部分のほか、給水設備やガス設備の瑕疵による損害も保険金の支払対象となる。","a":0,"e":"保険の対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵に限られ、給水・ガス設備は含まれない（住宅瑕疵担保履行法2条）。","m":"対象は構造と雨水だけ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R02s-45-4","s":"住宅販売瑕疵担保責任保険契約は、新築住宅の売主である宅建業者が住宅瑕疵担保責任保険法人と締結するものであり、宅建業者でない買主が保険料を支払うものではない（買主は保険金を請求できる）。","a":1,"e":"保険契約は売主業者が保険法人と締結し、保険料も売主業者が支払う。買主は瑕疵があれば保険金を請求できる（住宅瑕疵担保履行法2条）。","m":"保険料は売主業者が負担"},{"f":"税他","t":"住宅金融支援機構","ref":"R02s-46-1","s":"独立行政法人住宅金融支援機構は、住宅の耐震性を高めることを主な目的とする住宅の改良工事に必要な資金について、民間金融機関を通さずに自ら直接融資する業務を行っている。","a":1,"e":"耐震改修など、民間で対応しにくい分野は機構の直接融資業務の対象とされている。","m":"耐震改良は直接融資"},{"f":"税他","t":"住宅金融支援機構","ref":"R02s-46-2","s":"住宅金融支援機構の証券化支援事業（買取型）を利用した住宅ローン（フラット35）の金利は、機構が全国一律に定めているため、どの民間金融機関で借りても必ず同じ金利になる。","a":0,"e":"買取型の住宅ローン金利は各金融機関が独自に決めるため、金融機関ごとに異なることがある。","m":"金利は銀行ごとに違う"},{"f":"税他","t":"住宅金融支援機構","ref":"R02s-46-4","s":"住宅金融支援機構が証券化支援事業（買取型）で譲り受ける貸付債権には、住宅の建設・購入資金に係るものは含まれるが、住宅の購入に付随する住宅の改良に必要な資金に係るものは含まれない。","a":0,"e":"住宅購入に付随する土地・借地権の取得や改良の資金に係る貸付債権も、買取型の譲受け対象に含まれる。","m":"付随の改良資金もOK"},{"f":"税他","t":"土地・建物","ref":"R02s-49-2","s":"宅地・建物に関する一般的な知識として、低地は一般に洪水による浸水や、地震による液状化・揺れの増幅などの被害を受けやすい地形であるため、防災の観点からは住宅地として好ましい土地とはいえない。","a":1,"e":"低地は浸水しやすく、地盤も軟弱なことが多いため、洪水や地震の被害を受けやすい。","m":"低地は災害に弱い"},{"f":"税他","t":"土地・建物","ref":"R02s-49-3","s":"埋立地は一般に海面に対して数mの比高をもつのに対し、干拓地は海面以下の場合が多い。それでも、自然災害に対する危険度は、埋立地のほうが干拓地より高いとされている。","a":0,"e":"干拓地は海面以下のことが多く、埋立地よりも危険度が高い。比較の向きが逆である。","m":"干拓地のほうが危険"},{"f":"税他","t":"土地・建物","ref":"R02s-49-4","s":"宅地・建物に関する一般的な知識として、台地は一般に水はけがよく地盤も安定しているため、河川沿いの低地などと比べると、洪水や地震などの自然災害に対する安全度は高く、宅地として適しているといえる。","a":1,"e":"台地は水はけがよく地盤も安定しているため、低地に比べ自然災害に強いとされる。","m":"台地は安定・安全"},{"f":"税他","t":"土地・建物","ref":"R02s-50-2","s":"建物の平面形状や立面形状が複雑だと、地震力や風圧力が建物の一部に集中しやすい。そのため、耐震性・耐風性を高めるには、建物の形状をできるだけ単純にすることが望ましい。","a":1,"e":"複雑な形状は力が偏って集中しやすい。単純でまとまった形のほうが構造的に有利である。","m":"形はシンプルに"},{"f":"税他","t":"土地・建物","ref":"R02s-50-3","s":"宅地・建物に関する一般的な知識として、鉄骨造は不燃構造であり、さらに靭性（ねばり強さ）も大きい構造であるから、耐久性を確保するうえで、建築にあたって鋼材に防錆処理を施す必要はないとされている。","a":0,"e":"鋼材は錆びやすいため防錆処理が必要である。また耐火性確保には耐火被覆も要る。","m":"鉄は錆びる→防錆"},{"f":"税他","t":"土地・建物","ref":"R02s-50-4","s":"鉄筋コンクリート造の建物は、かつては10階建て程度が限度とされていたが、コンクリートと鉄筋の高強度化が進んだことにより、現在では超高層の共同住宅にも用いられている。","a":1,"e":"高強度コンクリート・鉄筋の開発により、RC造でも超高層マンションが建てられるようになった。","m":"RCも超高層OK"},{"f":"権利","t":"賃貸借","ref":"R03-01-1","s":"建物賃貸借が終了した場合、賃借人の明渡債務が敷金返還債務より先に履行すべきものとされる以上、賃借人は敷金の返還を受けていないことを理由に建物を留置することはできない。","a":1,"e":"敷金は明渡し後に返還すればよく（民法622条の2）、明渡しが先履行なので留置権は主張できない。","m":"明渡しが先、敷金は後"},{"f":"権利","t":"賃貸借","ref":"R03-01-2","s":"民法の規定及び判例によれば、建物賃貸借が終了した場合における賃借人の建物明渡債務と、賃貸人の敷金返還債務とは、一個の双務契約から生じた対価的な債務であるから、両者は同時履行の関係に立つ。","a":0,"e":"敷金契約は賃貸借とは別の契約であり、両債務は対価関係になく、同時履行の関係に立たない。","m":"敷金と明渡しは同時でない"},{"f":"権利","t":"賃貸借","ref":"R03-01-3","s":"建物賃貸借の終了後、賃借人が建物を明け渡すまでの間に生じた賃料相当損害金などの債権についても、賃貸人は、明渡し後に返還する敷金からその額を控除することができる。","a":1,"e":"敷金は明渡しまでに生じた賃借人の一切の債務を担保する（民法622条の2第1項）。","m":"明渡しまでの債務を担保"},{"f":"権利","t":"不法行為・請負・委任","ref":"R03-03-ア","s":"個人事業者Aが、事業所の清掃業務を清掃業者に委託する準委任契約を締結した後、契約期間中に死亡した場合、Aの相続人がその契約上の地位を当然に承継し、契約は継続する。","a":0,"e":"準委任には委任の規定が準用され、委任は委任者の死亡で終了する（民法653条、656条）。","m":"委任は死亡で終了"},{"f":"権利","t":"賃貸借","ref":"R03-03-イ","s":"民法の規定及び判例によれば、個人事業者Aが事業用に建物を賃借していたところ、賃貸借の期間中にAが死亡した場合、その賃貸借契約は終了せず、Aの賃借人としての地位はAの相続人に承継される。","a":1,"e":"賃貸借は当事者の死亡で終了せず、賃借権は相続の対象となる（民法896条）。","m":"賃貸借は死亡で終わらない"},{"f":"権利","t":"賃貸借","ref":"R03-03-エ","s":"民法の規定及び判例によれば、個人事業者Aが知人から建物を無償で借りる使用貸借契約を締結した後に死亡した場合、Aの相続人は借主の地位を承継し、引き続きその建物を無償で使用することができる。","a":0,"e":"使用貸借は借主の死亡によって終了する（民法597条3項）。相続人は使用権を承継しない。","m":"使用貸借は借主死亡で終了"},{"f":"権利","t":"相続","ref":"R03-04-1","s":"被相続人Aの配偶者Bが、遺産分割協議によりA所有建物の配偶者居住権を取得し、その存続期間を20年と定めた場合、配偶者居住権は20年の経過で消滅し、延長や更新はできない。","a":1,"e":"存続期間は原則終身だが協議・遺言で定めることができ、その場合は期間満了で消滅する（民法1030条）。","m":"定めた期間で終わる"},{"f":"権利","t":"相続","ref":"R03-04-2","s":"被相続人Aの配偶者Bが遺産分割協議によりA所有建物の配偶者居住権を取得した場合、Bは建物所有者の承諾を得なくても、その建物を第三者に賃貸して収益を得ることができる。","a":0,"e":"第三者に使用・収益させるには建物所有者の承諾が必要である（民法1032条3項）。","m":"賃貸には所有者の承諾"},{"f":"権利","t":"相続","ref":"R03-04-3","s":"被相続人Aの配偶者Bが遺産分割協議により配偶者居住権を取得した後に死亡した場合、Bの配偶者居住権はBの相続人に相続され、その相続人が引き続き建物に居住することができる。","a":0,"e":"配偶者居住権は配偶者の死亡により消滅し、相続の対象とならない（民法1036条、597条3項）。","m":"一身専属で相続されない"},{"f":"権利","t":"意思表示・行為能力","ref":"R03-05-1","s":"令和7年に17歳の者が、法定代理人である親の同意を得ずに単独でアパートの賃貸借契約を締結した場合、その者または親は、未成年者の行為であることを理由に契約を取り消すことができる。","a":1,"e":"成年年齢は18歳。未成年者が法定代理人の同意なく行った法律行為は取り消せる（民法4条、5条）。","m":"18歳未満は同意が必要"},{"f":"権利","t":"意思表示・行為能力","ref":"R03-05-3","s":"民法の規定及び判例によれば、親から営業を許された未成年者が締結した負担付贈与契約は、その営業に関するものであるか否かを問わず、未成年者の法定代理人が後から取り消すことはできない。","a":0,"e":"成年者と同じ行為能力を持つのはその営業に関してのみ（民法6条1項）。営業外の行為は取り消せる。","m":"営業の範囲だけ大人扱い"},{"f":"権利","t":"意思表示・行為能力","ref":"R03-05-4","s":"重度の認知症などにより意思能力を有しない状態で行った法律行為は、行為者が後見開始の審判を受けているか否かにかかわらず、無効である。取り消すまでもなく効力を生じない。","a":1,"e":"意思無能力者の法律行為は無効（民法3条の2）。後見開始の審判の有無とは関係ない。","m":"意思無能力は無効"},{"f":"権利","t":"相続","ref":"R03-09-1","s":"民法の規定及び判例によれば、被相続人Dに配偶者Aと前妻との間の子F・Gがいる場合（Aには前夫との子Cがいるが、Dとは養子縁組していない）、法定相続分はA2分の1、F・G各4分の1である。","a":1,"e":"配偶者1/2、子1/2を均分する。Cは配偶者の連れ子でDの子ではないため相続人にならない。","m":"連れ子は相続人でない"},{"f":"権利","t":"相続","ref":"R03-09-3","s":"民法の規定及び判例によれば、被相続人Dには前妻Eとの間に子Fがいるが、DとEの離婚の際にFの親権者をEと定めていた。この場合、FはDの相続人とならず、Dの遺産を相続することはできない。","a":0,"e":"親権の所在は相続権に影響しない。FはDの子として相続人となる（民法887条1項）。","m":"親権と相続は無関係"},{"f":"権利","t":"借地","ref":"R03-11-1","s":"居住用建物の所有を目的として存続期間60年の一般定期借地権を設定する場合、更新しない旨等の特約は書面（電磁的記録を含む）で定めればよく、公正証書による必要はない。","a":1,"e":"一般定期借地権は期間50年以上で、特約は書面等で足りる（借地借家法22条）。公正証書は事業用定期借地権の要件。","m":"一般定借は書面でOK"},{"f":"権利","t":"借地","ref":"R03-11-2","s":"借地借家法の規定によれば、居住用建物の所有を目的とする借地契約において、借地権の存続期間を20年とし、期間満了時には更新されず確実に契約が終了する定期借地権を設定することができる。","a":0,"e":"居住用では事業用定期借地権は使えず、一般定期借地権は50年以上が必要。20年では設定できない。","m":"居住用は50年以上"},{"f":"権利","t":"借地","ref":"R03-11-3","s":"借地借家法の規定によれば、建物譲渡特約付借地権を設定する場合、借地権を設定した日から20年を経過した日に借地上の建物を借地権設定者に相当の対価で譲渡する旨を定めることができる。","a":0,"e":"建物譲渡特約は設定後30年以上を経過した日に譲渡する旨を定める必要がある（借地借家法24条1項）。","m":"譲渡特約は30年以上"},{"f":"権利","t":"借地","ref":"R03-11-4","s":"借地借家法の規定によれば、臨時設備の設置その他一時使用のために借地権を設定したことが明らかな場合には、借地権の存続期間を5年とし、期間満了時に更新しない旨を定めることができる。","a":1,"e":"一時使用目的の借地権には存続期間・更新等の規定は適用されない（借地借家法25条）。","m":"一時使用は自由に"},{"f":"権利","t":"区分所有法","ref":"R03-13-1","s":"区分所有法上、規約により集会で決議すべきとされた事項を含め、集会で決議すべき事項について区分所有者全員の承諾があるときは、集会を開催せずに書面または電磁的方法による決議をすることができる。","a":1,"e":"書面・電磁的方法による決議は区分所有者全員の承諾が要件である（区分所有法45条1項）。","m":"書面決議は全員承諾"},{"f":"権利","t":"区分所有法","ref":"R03-13-3","s":"区分所有法上、敷地利用権が数人で有する所有権その他の権利である場合、区分所有者は原則として専有部分と敷地利用権とを分離して処分できないが、規約に別段の定めがあれば分離処分が可能である。","a":1,"e":"専有部分と敷地利用権は一体性の原則があるが、規約で別段の定めができる（区分所有法22条1項）。","m":"分離処分は規約で可"},{"f":"権利","t":"区分所有法","ref":"R03-13-4","s":"区分所有法上、共用部分の各共有者の持分は、規約に別段の定めがない限り、その有する専有部分の床面積の割合によるが、この床面積は壁その他の区画の中心線で囲まれた部分の水平投影面積で算定する。","a":0,"e":"床面積は壁その他の区画の内側線で囲まれた部分の水平投影面積（内法）による（区分所有法14条3項）。","m":"持分は内法面積"},{"f":"権利","t":"不動産登記法","ref":"R03-14-1","s":"不動産登記法上、所有権の登記の抹消は、その所有権について第三者への移転の登記がされている場合であっても、現在の所有権の登記名義人が単独で申請することができるとされている。","a":0,"e":"単独申請できるのは所有権の移転の登記がない場合に限られる（不動産登記法77条）。","m":"移転登記があれば共同"},{"f":"権利","t":"不動産登記法","ref":"R03-14-2","s":"不動産登記法上、登記の申請をする者の委任による代理人（司法書士等）の代理権限は、民法の委任の原則と同様に、本人である委任者が登記申請前に死亡した場合には消滅する。","a":0,"e":"民法の委任と異なり、登記申請の代理権は本人の死亡では消滅しない（不動産登記法17条1号）。","m":"本人死亡でも代理権存続"},{"f":"権利","t":"不動産登記法","ref":"R03-14-3","s":"不動産登記法上、法人の合併による権利の移転の登記は、相続による権利の移転の登記と同様に、登記義務者と共同することなく、合併後の法人である登記権利者が単独で申請することができる。","a":1,"e":"相続・法人の合併による権利移転の登記は登記権利者の単独申請でよい（不動産登記法63条2項）。","m":"相続・合併は単独"},{"f":"権利","t":"不動産登記法","ref":"R03-14-4","s":"不動産登記法上、信託の登記は、委託者と受託者が共同して申請しなければならないものではなく、信託財産となる不動産に関する権利の受託者が単独で申請することができる。","a":1,"e":"信託の登記は、受託者が単独で申請することができる（不動産登記法98条2項）。","m":"信託登記は受託者単独"},{"f":"法令","t":"建築基準法","ref":"R03-18-1","s":"建築基準法上、建蔽率の限度が10分の6とされている近隣商業地域内で、準防火地域内にある耐火建築物を、特定行政庁が指定する街区の角地に建築する場合、建蔽率の限度は10分の8となる。","a":1,"e":"準防火地域内の耐火建築物等で+1/10、特定行政庁指定の角地で+1/10、合計+2/10となる（建基法53条3項）。","m":"防火+角地で+2/10"},{"f":"法令","t":"建築基準法","ref":"R03-18-2","s":"建築基準法上、市町村は、地区計画等の区域のうち集落地区計画の区域内においても、地区計画等の内容に従い、条例で用途地域による建築物の用途制限を緩和することができるとされている。","a":0,"e":"条例による用途制限の緩和は地区計画等の区域で認められるが、集落地区計画の区域は除かれている。","m":"集落地区計画は除外"},{"f":"法令","t":"建築基準法","ref":"R03-18-4","s":"建築基準法上、ごみ焼却場は、都市計画でその敷地の位置が決定していなくても、特定行政庁が都道府県都市計画審議会の議を経て都市計画上支障がないと認めて許可した場合は新築できる。","a":1,"e":"卸売市場・ごみ焼却場等は原則として都市計画決定が必要だが、審議会の議を経た許可で例外となる（建基法51条）。","m":"位置未決でも許可で可"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R03-24-1","s":"個人が自己の居住用に、平成9年4月1日以後に新築された床面積50㎡以上240㎡以下の既存住宅を取得した場合、不動産取得税の課税標準から1,200万円が控除される。","a":1,"e":"既存住宅の控除額は新築時期で異なり、平成9年4月1日以後に新築されたものは1,200万円となる。","m":"中古はH9以後1200万"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R03-24-2","s":"地方税法の規定によれば、家屋が新築された日から3年を経過してもなお使用または譲渡が行われない場合、その日に家屋の取得があったものとみなされ、所有者に不動産取得税が課される。","a":0,"e":"みなし取得は原則として新築後6か月を経過した日（宅建業者等が売り渡す住宅は特例で延長あり）であり、3年ではない（地方税法73条の2第2項）。","m":"新築未使用は原則6か月"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R03-24-3","s":"地方税法の規定によれば、不動産取得税は、土地や家屋を取得した者が、取得後一定期間内に自ら税額を計算して都道府県に申告し、その申告に基づいて納付する申告納付の方法により徴収される。","a":0,"e":"不動産取得税は、都道府県が送る納税通知書により納付する普通徴収の方法による。","m":"取得税は普通徴収"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R03-25-2","s":"原価法で建設資材や工法の変遷により対象不動産の再調達原価を求めることが困難な場合には、同等の有用性を持つものに置き換えて求めた置換原価を再調達原価とみなすことができる。","a":1,"e":"再調達原価を直接求められない場合、置換原価を再調達原価とみなして原価法を適用できる。","m":"困難なら置換原価"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R03-25-3","s":"不動産鑑定評価基準上、取引事例等に係る取引が売り急ぎなどの特殊な事情を含み、これが取引価格に影響を及ぼしているときに、その価格を適切に補正することを時点修正という。","a":0,"e":"取引の特殊事情を補正するのは事情補正。時点修正は取引時点から価格時点までの価格変動を修正するもの。","m":"特殊事情は事情補正"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R03-25-4","s":"不動産鑑定評価基準上、鑑定評価によって求める賃料は、一般的には正常賃料または継続賃料であるが、鑑定評価の依頼目的に対応した条件によっては限定賃料を求めることができる場合がある。","a":1,"e":"鑑定評価で求める賃料は原則として正常賃料・継続賃料だが、条件次第で限定賃料も求められる。","m":"賃料は正常・継続＋限定"},{"f":"業法","t":"免許","ref":"R03-32-1","s":"宅地建物取引業法の規定によれば、用途地域外にあり、建物の敷地に供する目的もない土地について、ソーラーパネルを設置する目的での売買の媒介を業として行う場合、宅地建物取引業の免許は不要である。","a":1,"e":"用途地域外で建物の敷地に供さない土地は宅建業法上の「宅地」に当たらず、その取引は宅建業ではない。","m":"建物予定なし＝宅地でない"},{"f":"業法","t":"免許","ref":"R03-32-3","s":"宅地建物取引業法の規定によれば、農業協同組合が、組合員から依頼を受けて、組合員の所有する宅地の売却の代理を業として行う場合、その農業協同組合は宅地建物取引業の免許を受ける必要はない。","a":0,"e":"免許不要の例外は国・地方公共団体等に限られ、農業協同組合は含まれない。免許が必要である。","m":"農協は免許必要"},{"f":"業法","t":"免許","ref":"R03-32-4","s":"D社が地方公共団体から依頼を受けて、その地方公共団体が所有する宅地の売却の媒介を業として行う場合、依頼者が地方公共団体であるため、D社は宅建業の免許を受ける必要はない。","a":0,"e":"国・地方公共団体自身は免許不要だが、その依頼を受けて媒介・代理を行う者は免許が必要である（宅建業法78条1項）。","m":"国の代わりは免許必要"},{"f":"業法","t":"37条書面","ref":"R03-37-1","s":"宅建業者が区分所有建物の貸借の媒介をする場合、専有部分の用途その他の利用制限（ペット飼育禁止等）に関する規約の定めは、重要事項として説明するほか37条書面にも記載しなければならない。","a":0,"e":"専有部分の利用制限は重要事項説明の対象だが、37条書面の記載事項には含まれない。","m":"利用制限は35条だけ"},{"f":"業法","t":"37条書面","ref":"R03-37-3","s":"宅地建物取引業法の規定によれば、宅建業者が土地の売買の媒介をした場合において、代金以外の金銭の授受に関する定めがあるときは、その額、授受の目的及び時期を37条書面に記載しなければならない。","a":1,"e":"代金・借賃以外の金銭の授受の定めがあれば、額・目的・時期が37条書面の記載事項となる（宅建業法37条1項6号）。","m":"代金以外は額・目的・時期"},{"f":"業法","t":"37条書面","ref":"R03-37-4","s":"宅地建物取引業法の規定によれば、宅建業者は、自ら貸主として所有する建物について借主と賃貸借契約を締結した場合にも、借主に対して遅滞なく37条書面を作成し、交付しなければならない。","a":0,"e":"自ら貸主となる貸借は宅建業に当たらず、宅建業法の37条書面の交付義務はない。","m":"自ら貸主は業法対象外"},{"f":"業法","t":"業務上の規制","ref":"R03-40-1","s":"宅地建物取引業法の規定によれば、宅建業者は、本店に業務に関する帳簿を備え付け、取引のあったつど所定の事項を記載していれば、支店には業務に関する帳簿を備え付ける必要はない。","a":0,"e":"帳簿は事務所ごとに備え付けなければならず、支店も事務所に当たる（宅建業法49条）。","m":"帳簿は事務所ごと"},{"f":"業法","t":"業務上の規制","ref":"R03-40-3","s":"宅建業者が一団の宅地建物の分譲を行う場合、その分譲の現地に契約締結等を行う案内所を設けないときであっても、分譲を行う現地に国土交通省令で定める標識を掲示しなければならない。","a":1,"e":"一団の宅地建物の分譲を行う所在場所には標識の掲示が必要（宅建業法50条1項）。","m":"分譲現地に標識"},{"f":"業法","t":"業務上の規制","ref":"R03-40-4","s":"宅地建物取引業法の規定によれば、宅建業者は、税務署の職員から質問検査権に基づき、業務上知り得た取引先の取引内容について質問を受けた場合でも、それに回答すると守秘義務違反となる。","a":0,"e":"法令に基づく質問への回答は守秘義務の「正当な理由」に当たり、違反とならない（宅建業法45条）。","m":"法令に基づく回答はOK"},{"f":"業法","t":"報酬","ref":"R03-44-1","s":"宅地建物取引業法の規定によれば、宅建業者が居住用建物の貸借の媒介をする場合において、返還されない権利金の授受があるときは、その権利金の額を売買代金とみなして報酬限度額を計算することができる。","a":0,"e":"権利金を売買代金とみなす計算は居住用建物以外の貸借に限られる。居住用建物では使えない。","m":"権利金計算は居住用以外"},{"f":"業法","t":"報酬","ref":"R03-44-3","s":"宅建業者が代金500万円（税抜）の空家の売買の媒介を売主から受け、現地調査等の費用を要することを事前に説明し合意を得ていた場合、売主から受領できる報酬の上限は33万円（税込）である。","a":1,"e":"低廉な空家等（800万円以下）の特例で、依頼者一方から30万円＋消費税まで受領できる（2024年7月改正の報酬告示）。","m":"800万以下は30万＋税"},{"f":"業法","t":"報酬","ref":"R03-44-4","s":"店舗兼住宅の貸借の媒介は居住用建物の貸借の媒介として扱われるため、宅建業者は依頼者の承諾がない限り、依頼者の一方から賃料の半月分を超えて報酬を受領することはできない。","a":0,"e":"店舗兼住宅は居住用建物以外として扱われ、半月分の制限はない。双方合計で賃料1か月分＋税が上限。","m":"店舗兼住宅は居住用以外"},{"f":"税他","t":"住宅金融支援機構","ref":"R03-46-1","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において、賃貸住宅の建設または購入に必要な資金の貸付けに係る民間金融機関の貸付債権も、譲受けの対象としている。","a":0,"e":"買取型の対象は自ら居住する住宅等の建設・購入資金に係る債権であり、賃貸住宅向けは対象外。","m":"買取型は自宅用のみ"},{"f":"税他","t":"住宅金融支援機構","ref":"R03-46-3","s":"住宅金融支援機構は、証券化支援事業（買取型）において、省エネルギー性や耐震性、バリアフリー性などに優れた住宅を取得する場合に、一定期間の貸付金利を引き下げる制度を設けている。","a":1,"e":"いわゆるフラット35Sで、性能の高い住宅について一定期間金利を引き下げる。","m":"高性能住宅は金利引下げ"},{"f":"税他","t":"住宅金融支援機構","ref":"R03-46-4","s":"住宅金融支援機構は、経済情勢の著しい変動により住宅ローンの元利金の支払が著しく困難となった債務者について、償還期間の延長などの貸付条件の変更を行うことができる。","a":1,"e":"支払困難となった債務者に対し、償還期間の延長等の貸付条件の変更や延滞元利金の支払方法の変更を行う。","m":"困ったら条件変更"},{"f":"税他","t":"景品表示法","ref":"R03-47-1","s":"不当景品類及び不当表示防止法（表示規約を含む）によれば、宅建業者が広告で居室の広さを畳数で表示する場合、実際に敷かれている畳の枚数をそのまま表示すればよく、畳1枚あたりの面積について特に基準は定められていない。","a":0,"e":"畳数表示は、畳1枚あたり1.62㎡以上の広さがあるという意味で用いなければならない（表示規約施行規則）。","m":"1畳＝1.62㎡以上"},{"f":"税他","t":"景品表示法","ref":"R03-47-2","s":"団地と駅などの施設との間の距離・所要時間は、その施設から最も近い団地内の地点を起点又は着点として算出し、団地を数区画に区分して販売するときは区画ごとに算出して表示する。","a":0,"e":"2022年の表示規約改正後は、団地内の最も近い区画と最も遠い区画のそれぞれを起点とした距離・所要時間の両方を表示する（表示規約施行規則）。最寄りの地点や区画ごとの表示という旧ルールは使えない。","m":"団地は最も近い区画と最も遠い区画の両方"},{"f":"税他","t":"景品表示法","ref":"R03-47-3","s":"新築分譲マンションの広告に完成予想図を掲載する場合、完成予想図である旨を明示していれば、周囲に実在しない公園を描くなど、周囲の状況を現況と異なるように表示してもよい。","a":0,"e":"完成予想図である旨を明示しても、周囲の状況は現況に反する表示をしてはならない。","m":"周囲は現況どおり"},{"f":"税他","t":"土地・建物","ref":"R03-49-3","s":"宅地・建物に関する一般的な知識として、林相が良好で見た目には安定した森林であっても、破砕帯や崖錐などの上に生育する杉の植林地では、豪雨に際して斜面が崩壊することがあるため注意が必要である。","a":1,"e":"破砕帯や崖錐は地盤がもろく、見た目の森林状態がよくても豪雨時に崩壊するおそれがある。","m":"破砕帯・崖錐はもろい"},{"f":"税他","t":"土地・建物","ref":"R03-49-4","s":"宅地・建物に関する一般的な知識として、崖錐や小河川の出口付近で堆積物の多い所は、上流からの土砂がすでに堆積して安定しているため、宅地として見た場合に土石流の危険が少ない土地であるといえる。","a":0,"e":"崖錐や谷の出口の堆積物が多い所は過去の土石流の跡であることが多く、危険が大きい。","m":"谷の出口は土石流注意"},{"f":"税他","t":"土地・建物","ref":"R03-50-3","s":"宅地・建物に関する一般的な知識として、鉄骨構造は、耐火被覆や鋼材の防錆処理が必要であり、加工性にも劣ることから、主に工場や倉庫に用いられ、現在は住宅や店舗等の建物の構造には用いられていない。","a":0,"e":"鉄骨構造は加工性がよく、住宅や店舗にも広く用いられている。耐火被覆・防錆処理が必要な点は正しい。","m":"鉄骨は住宅にも使う"},{"f":"税他","t":"土地・建物","ref":"R03-50-4","s":"宅地・建物に関する一般的な知識として、鉄骨構造は自重が小さく、柱と柱の間隔を大きくとることができるため、工場・体育館・倉庫などの単層で大空間の建築物に適した構造として多く用いられている。","a":1,"e":"鉄骨は軽量で大スパンを実現しやすく、工場や体育館など大空間の単層建築に多く用いられる。","m":"鉄骨は大空間向き"},{"f":"権利","t":"賃貸借","ref":"R03s-01-3","s":"建物の賃借人が賃料を長期間滞納している場合、賃貸人は、緊急やむを得ない特別の事情がなくても、賃借人の同意を得ずに鍵を交換して賃借人を建物に入れないようにすることができる。","a":0,"e":"自力救済は原則禁止。法的手続では権利を守れない緊急やむを得ない特別の事情がある場合に限り、必要な限度で許される。","m":"鍵交換は自力救済NG"},{"f":"権利","t":"賃貸借","ref":"R03s-01-4","s":"判例によれば、私力の行使は原則として禁止されるが、法律の手続によっては権利を維持できない緊急やむを得ない特別の事情があるときは、必要な限度内で例外的に許される。","a":1,"e":"自力救済は原則禁止だが、緊急やむを得ない特別の事情と必要限度内という要件を満たせば例外的に許される（最判昭40.12.7）。","m":"自力救済は緊急時のみ"},{"f":"権利","t":"意思表示・行為能力","ref":"R03s-03-2","s":"民法の規定及び判例によれば、成年後見人が、成年被後見人を代理して、成年被後見人の居住の用に供する建物に第三者のための抵当権を設定するには、家庭裁判所の許可を得なければならない。","a":1,"e":"居住用建物・敷地の売却、賃貸、賃貸借の解除、抵当権の設定等には家庭裁判所の許可が必要（民法859条の3）。","m":"居住用の処分は家裁許可"},{"f":"権利","t":"意思表示・行為能力","ref":"R03s-03-3","s":"民法の規定及び判例によれば、成年後見人が、成年被後見人を代理して、成年被後見人が所有する賃貸用のオフィスビルに第三者のための抵当権を設定するには、家庭裁判所の許可を得なければならない。","a":0,"e":"家庭裁判所の許可が必要なのは居住の用に供する建物・敷地の処分であり、オフィスビルは対象外。","m":"居住用以外は許可不要"},{"f":"権利","t":"相続","ref":"R03s-07-1","s":"自筆証書遺言は全文・日付・氏名を自書し押印して作成するが、遺言書に財産目録を添付する場合、その目録は自書でなくてもよく、目録の各ページへの署名押印も不要である。","a":0,"e":"財産目録は自書でなくてよいが、目録の各ページ（両面記載なら両面）に署名押印が必要である（民法968条2項）。","m":"目録はPC可・各頁署名押印"},{"f":"権利","t":"相続","ref":"R03s-07-2","s":"民法の規定及び判例によれば、公正証書遺言の作成には証人2人以上の立会いが必要であるが、遺言者の推定相続人は、未成年者でなく成年者であれば、この公正証書遺言の証人となることができる。","a":0,"e":"推定相続人・受遺者とその配偶者・直系血族は、成年者でも証人となれない（民法974条）。","m":"推定相続人は証人不可"},{"f":"権利","t":"相続","ref":"R03s-07-4","s":"民法の規定及び判例によれば、遺贈義務者が受遺者に対し相当の期間を定めて遺贈の承認または放棄をすべき旨を催告し、受遺者がその期間内に意思表示をしないときは、遺贈を放棄したものとみなされる。","a":0,"e":"催告期間内に意思表示がなければ、遺贈を承認したものとみなされる（民法987条）。","m":"無回答は承認"},{"f":"権利","t":"意思表示・行為能力","ref":"R03s-08-1","s":"民法の規定及び判例によれば、AがBに土地売却の申込みを郵便で発信した後、それがBに届く前に死亡し、Bが承諾の通知を発する前にAの死亡を知った場合でも、その申込みは効力を失わない。","a":0,"e":"申込者が死亡し、相手方が承諾の通知を発する前にそれを知ったときは、申込みは効力を失う（民法526条）。","m":"承諾前に死亡を知れば失効"},{"f":"権利","t":"意思表示・行為能力","ref":"R03s-08-2","s":"民法の規定及び判例によれば、申込者が「自分が死亡した場合には申込みは効力を失う」旨の意思を表示していた場合、申込者が死亡すれば、相手方がその事実を知らなくても申込みは効力を失う。","a":1,"e":"申込者がそのような意思を表示していたときは、その意思に従い申込みは効力を失う（民法526条）。","m":"失効の意思表示が優先"},{"f":"権利","t":"意思表示・行為能力","ref":"R03s-08-4","s":"民法の規定及び判例によれば、AがBに土地の売却を申し込み、Bが承諾の通知を郵便で発信した場合、売買契約はBが承諾の通知を発信した時点で成立し、それがAに到達した時点で成立するのではない。","a":0,"e":"現行民法では承諾も到達時に効力を生じ（民法97条1項）、契約は承諾の到達時に成立する。","m":"承諾も到達主義"},{"f":"権利","t":"賃貸借","ref":"R03s-09-2","s":"A所有の建物について、Bに売却した場合、Bは売主Aの承諾なく第三者に賃貸できるが、Bに賃貸した場合、BはAの承諾を得なければその建物を第三者に転貸することができない。","a":1,"e":"買主は所有者として自由に賃貸できるが、賃借人の転貸には賃貸人の承諾が必要（民法612条1項）。","m":"転貸には承諾"},{"f":"権利","t":"物権変動・対抗","ref":"R03s-09-3","s":"AがBに建物を売却した場合、Bは所有権移転登記を備えていなければ、その建物を権原なく占拠している不法占拠者Dに対して、所有権を主張して明渡しを請求することができない。","a":0,"e":"不法占拠者は登記の欠缺を主張する正当な利益を有する第三者に当たらず、登記なしで対抗できる（民法177条・判例）。","m":"不法占拠者に登記不要"},{"f":"権利","t":"賃貸借","ref":"R03s-09-4","s":"AがBに建物を賃貸し引き渡した後、当事者双方の責めに帰することができない第三者の放火で建物が全焼し、使用収益ができなくなった場合、AB間の賃貸借契約は終了する。","a":1,"e":"賃借物の全部が滅失等で使用収益できなくなった場合、賃貸借は当然に終了する（民法616条の2）。","m":"全部滅失で当然終了"},{"f":"権利","t":"借家","ref":"R03s-12-1","s":"借地借家法の規定によれば、期間2年の建物賃貸借が、期間満了前の更新拒絶の通知がされなかったため法定更新された場合、更新後の契約は従前と同一の条件となり、期間も従前と同じ2年とされる。","a":0,"e":"法定更新後は従前と同一条件だが、期間の定めがないものとなる（借地借家法26条1項）。","m":"法定更新は期間なし"},{"f":"権利","t":"借家","ref":"R03s-12-2","s":"借地借家法の規定によれば、期間の定めのない建物賃貸借で、賃貸人が正当事由をもって賃借人に解約の申入れをした場合、その申入れの日から6か月を経過することによって賃貸借契約は終了する。","a":1,"e":"賃貸人からの解約申入れは正当事由が必要で、6か月経過で終了する（借地借家法27条1項、28条）。","m":"貸主解約は6か月"},{"f":"権利","t":"借家","ref":"R03s-12-4","s":"借地借家法の規定によれば、一時使用目的でない建物賃貸借契約において、賃借人が付加した造作についての造作買取請求権をあらかじめ排除する特約は、賃借人に不利なものとして無効である。","a":0,"e":"造作買取請求権（借地借家法33条）は強行規定の対象外で、排除特約は有効である（同法37条）。","m":"造作買取は特約で排除可"},{"f":"法令","t":"都市計画法","ref":"R03s-15-1","s":"都市計画法上、近隣商業地域は、近隣の住宅地の住民に対する日用品の供給を主な内容とする商業その他の業務の利便を増進するため定める地域であり、住居の環境の保護は目的として掲げられていない。","a":1,"e":"近隣商業地域の目的は日用品供給を中心とする商業等の利便の増進。「住居の環境を保護」は住居系用途地域の目的の書き方である（都市計画法9条）。","m":"近商＝ご近所の日用品"},{"f":"法令","t":"都市計画法","ref":"R03s-15-3","s":"都市計画法上、特定用途制限地域は、良好な環境の形成又は保持のため、制限すべき特定の建築物等の用途の概要を定める地域であり、第一種低層住居専用地域内においても定めることができる。","a":0,"e":"特定用途制限地域は、用途地域が定められていない土地の区域（市街化調整区域を除く）に定めるもの。用途地域内には定められない（都市計画法9条）。","m":"特定用途制限＝用途地域の外"},{"f":"法令","t":"都市計画法","ref":"R03s-15-4","s":"高層住居誘導地区は、住居と住居以外の用途を適正に配分し、利便性の高い高層住宅の建設を誘導するため定める地区であり、第一種住居地域内においても定めることができる。","a":1,"e":"高層住居誘導地区は第一種・第二種住居、準住居、近隣商業、準工業地域のうち容積率400%または500%の地域に定めることができる。","m":"高層誘導＝住居系＋近商・準工"},{"f":"法令","t":"開発許可","ref":"R03s-16-2","s":"都市計画法上、開発許可を受けた者が、開発許可の申請書に記載した事項について国土交通省令で定める軽微な変更をしたときは、改めて都道府県知事の許可を受ける必要はなく、遅滞なくその旨を届け出れば足りる。","a":1,"e":"変更には原則として許可が必要だが、軽微な変更は遅滞なく届出をすればよい（都市計画法35条の2）。","m":"軽微な変更は事後届出"},{"f":"法令","t":"開発許可","ref":"R03s-16-3","s":"都市計画法上、開発許可を受けた者が、その開発行為に関する工事を途中で廃止しようとするときは、廃止の届出では足りず、あらかじめ都道府県知事の許可を受けなければならない。","a":0,"e":"工事を廃止したときは、遅滞なく知事に届け出れば足り、許可は不要である（都市計画法38条）。","m":"工事の廃止は事後届出"},{"f":"法令","t":"開発許可","ref":"R03s-16-4","s":"開発許可を受けた開発区域内では、工事完了の公告前は原則として建築物を建築できないが、開発行為に同意していない土地所有者がその権利の行使として建築する場合は建築できる。","a":1,"e":"完了公告前の建築制限には例外があり、不同意の土地所有者等が権利行使として建築する場合は認められる（都市計画法37条）。","m":"不同意の地主は建ててよい"},{"f":"法令","t":"建築基準法","ref":"R03s-17-2","s":"建築基準法上、その用途に供する部分の床面積が200㎡を超える映画館を演芸場に用途変更する場合は、政令で定める類似の用途相互間の変更にあたるため、建築確認を受ける必要はない。","a":1,"e":"200㎡超の特殊建築物への用途変更は原則確認が必要だが、劇場・映画館・演芸場など政令で定める類似用途間の変更は不要（建築基準法87条）。","m":"類似用途の変更は確認不要"},{"f":"法令","t":"建築基準法","ref":"R03s-17-3","s":"建築基準法上、換気設備を設けていない居室には換気のための窓その他の開口部を設け、その換気に有効な部分の面積を、その居室の床面積に対して10分の1以上としなければならない。","a":0,"e":"換気のための開口部は床面積の20分の1以上でよい（建築基準法28条2項）。採光（住宅は原則7分の1）と混同しない。","m":"換気は20分の1"},{"f":"法令","t":"建築基準法","ref":"R03s-17-4","s":"建築基準法上、延べ面積が500㎡を超える特殊建築物には原則として排煙設備を設けなければならないが、階段の部分や昇降機の昇降路の部分（乗降ロビーを含む）には設けなくてよい。","a":1,"e":"500㎡超の特殊建築物は原則排煙設備が必要。ただし階段・昇降路（乗降ロビー含む）等は政令で除外されている（建築基準法施行令126条の2）。","m":"階段・昇降路は排煙不要"},{"f":"法令","t":"建築基準法","ref":"R03s-18-1","s":"建築基準法の規定が適用されるに至った際に現に建築物が立ち並んでいる道は、その幅員が何mであっても、また特定行政庁の指定がなくても、すべて同法上の道路とみなされる。","a":0,"e":"道路とみなされるのは、幅員4m未満の道で特定行政庁が指定したもの（いわゆる2項道路）である（建築基準法42条2項）。","m":"2項道路は指定が必要"},{"f":"法令","t":"建築基準法","ref":"R03s-18-2","s":"建築基準法上、準工業地域内で、都市計画により容積率の限度が10分の50と定められている区域にある建築物については、道路斜線制限の適用距離は35m、斜線の勾配は1.5となる。","a":1,"e":"工業系の用途地域では、容積率40/10超の区域の適用距離は35m、勾配は1.5（建築基準法56条・別表第3）。","m":"工業系の道路斜線は1.5"},{"f":"法令","t":"建築基準法","ref":"R03s-18-4","s":"建築基準法上、建築物の敷地が建蔽率の限度の異なる2つの地域にわたる場合は、その敷地の過半が属する地域の建蔽率の限度が、敷地全体についての建蔽率の限度として適用される。","a":0,"e":"建蔽率は過半主義ではなく、各地域の限度を敷地面積の割合で按分した加重平均で求める（建築基準法53条2項）。","m":"建蔽率・容積率は按分"},{"f":"法令","t":"土地区画整理法","ref":"R03s-20-1","s":"土地区画整理組合が施行する土地区画整理事業では、施行地区内の宅地の所有者はすべてその組合の組合員となるが、その宅地について借地権のみを有する者は組合員とならない。","a":0,"e":"施行地区内の宅地について所有権または借地権を有する者は、すべて組合員となる（土地区画整理法25条1項）。","m":"借地権者も組合員"},{"f":"法令","t":"土地区画整理法","ref":"R03s-20-3","s":"土地区画整理組合などの施行者は、土地区画整理事業において換地処分の公告があった場合、直ちに、その旨を換地計画に係る区域を管轄する登記所に通知しなければならない。","a":1,"e":"換地処分の公告があれば、施行者は直ちに管轄登記所へ通知し、遅滞なく必要な登記を申請・嘱託する（土地区画整理法107条）。","m":"公告後すぐ登記所へ通知"},{"f":"法令","t":"土地区画整理法","ref":"R03s-20-4","s":"都道府県や市町村が施行する土地区画整理事業では、事業ごとに土地区画整理審議会が置かれ、換地計画、仮換地の指定及び減価補償金の交付に関する事項について、法に定める権限を行う。","a":1,"e":"公的施行では事業ごとに審議会を置き、換地計画、仮換地の指定、減価補償金の交付について意見を述べる等の権限をもつ（土地区画整理法56条）。","m":"公的施行には審議会"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R03s-24-1","s":"固定資産税について、市町村長は、固定資産課税台帳に登録された価格等に重大な錯誤があることを発見した場合には、直ちに決定された価格等を修正して、台帳に登録しなければならない。","a":1,"e":"価格等の重大な錯誤を発見したときは、市町村長は直ちに価格等を修正し登録しなければならない（地方税法417条）。","m":"重大な錯誤は直ちに修正"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R03s-24-2","s":"固定資産課税台帳に登録された価格に不服がある固定資産税の納税者は、納税通知書の交付を受けた日後1か月を経過する日までに限り、固定資産評価審査委員会に審査の申出をすることができる。","a":0,"e":"審査の申出は、原則として納税通知書の交付を受けた日後3か月を経過する日までにできる（地方税法432条1項）。","m":"審査の申出は3か月"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R03s-24-4","s":"固定資産税において、住宅用地のうち小規模住宅用地（住宅1戸あたり200㎡以下の部分）に対して課する固定資産税の課税標準は、その土地の価格の3分の1の額とされている。","a":0,"e":"小規模住宅用地は価格の6分の1、200㎡を超える一般住宅用地部分が3分の1である（地方税法349条の3の2）。","m":"200㎡以下は6分の1"},{"f":"業法","t":"報酬","ref":"R03s-31-ア","s":"宅建業者Cが借主Dから媒介の依頼を受け、借賃月額8万円（税別）の居住用建物の賃貸借を成立させた場合、Dの承諾がなければ、CがDから受領できる報酬は44,000円が上限である。","a":1,"e":"居住用建物の貸借の媒介では、依頼者の承諾がない限り一方から受領できる報酬は借賃の0.5か月分＋消費税まで（報酬告示）。","m":"居住用は承諾なしで半月"},{"f":"業法","t":"報酬","ref":"R03s-31-イ","s":"貸主の代理業者Aと借主の媒介業者Cが借賃月額8万円（税別）の店舗用建物の賃貸借を成立させた場合、AとCが受領する報酬の合計額は88,000円以内でなければならない。","a":1,"e":"貸借では、関与した業者全員が受領する報酬の合計は借賃1か月分＋消費税が上限である（報酬告示）。","m":"貸借の合計は1か月分"},{"f":"業法","t":"報酬","ref":"R03s-31-ウ","s":"貸主の代理業者Aと借主の媒介業者Cが、返還されない権利金200万円（税別）の授受がある店舗用建物の賃貸借を成立させた場合、AとCの受領できる報酬の合計は110,000円以内である。","a":0,"e":"居住用以外の貸借で権利金がある場合は、権利金を売買代金とみなして計算できる。この場合、AとCの合計の上限は220,000円となる。","m":"権利金は売買とみなす"},{"f":"業法","t":"報酬","ref":"R03s-31-エ","s":"貸主Bから建物の賃貸借の代理を依頼された宅建業者Aは、Bの依頼によらずに自らの判断で行った通常の広告の料金に相当する額についても、報酬とは別にBから受領することができる。","a":0,"e":"報酬とは別に受領できるのは、依頼者の依頼に基づいて行った特別な広告の料金等に限られる（報酬告示）。","m":"別途広告料は依頼があってこそ"},{"f":"業法","t":"重要事項説明","ref":"R03s-32-2","s":"宅建業者は、取引の相手方が宅建業者である場合であっても、契約が成立するまでの間に、営業保証金を供託した主たる事務所の最寄りの供託所とその所在地について説明しなければならない。","a":0,"e":"供託所等の説明（宅建業法35条の2）は、相手方が宅建業者である場合は不要である。","m":"業者相手なら供託所説明不要"},{"f":"業法","t":"重要事項説明","ref":"R03s-32-3","s":"宅建業者は、宅建業者でない相手方との宅地建物の売買契約が成立した後、遅滞なく、その相手方に対して営業保証金の供託所及びその所在地など供託所等に関する事項を説明すれば足りる。","a":0,"e":"供託所等の説明は、契約が成立するまでの間に行わなければならない（宅建業法35条の2）。","m":"供託所説明も契約前"},{"f":"業法","t":"保証協会","ref":"R03s-32-4","s":"保証協会の社員である宅建業者は、取引の相手方（宅建業者でない）に対し、社員である旨、保証協会の名称等、弁済業務保証金が供託された供託所とその所在地を説明しなければならない。","a":1,"e":"社員は営業保証金を供託しないため、その供託所ではなく、保証協会に関する事項と弁済業務保証金の供託所等を説明する（宅建業法35条の2）。","m":"社員は協会と供託所を説明"},{"f":"業法","t":"媒介契約","ref":"R03s-33-ア","s":"宅建業者Aが、売主Bとの間でB所有の宅地の売却について専任媒介契約（専属専任媒介契約ではない）を締結した場合、Aは、Bに対して業務の処理状況を1週間に1回以上報告しなければならない。","a":0,"e":"専任媒介は2週間に1回以上、専属専任媒介は1週間に1回以上の報告が必要（宅建業法34条の2第9項）。","m":"専任2週・専属1週"},{"f":"業法","t":"媒介契約","ref":"R03s-33-ウ","s":"宅建業者Aが売主Bと一般媒介契約を締結した場合でも、Aは、遅滞なく、宅建業法34条の2第1項の規定に基づく媒介契約の内容を記載した書面を作成し、Bに交付しなければならない。","a":1,"e":"媒介契約書の作成・交付義務は、一般媒介を含むすべての売買・交換の媒介契約に適用される（宅建業法34条の2第1項）。","m":"一般媒介でも書面交付"},{"f":"業法","t":"媒介契約","ref":"R03s-33-エ","s":"宅建業者Aが、売主Bとの間でB所有の宅地の売却について一般媒介契約を締結した場合でも、Aがその宅地の売買すべき価額について意見を述べるときは、その根拠を明らかにしなければならない。","a":1,"e":"価額について意見を述べる際の根拠明示義務は、媒介契約の種類を問わず適用される（宅建業法34条の2第2項）。","m":"価額の意見には根拠"},{"f":"業法","t":"免許","ref":"R03s-34-1","s":"宅建業法上、用途地域内の土地であっても、現に道路・公園・河川・広場・水路の用に供されているものは、宅地には該当せず、その売買を業として行っても宅地の取引とはならない。","a":1,"e":"用途地域内の土地は原則宅地だが、道路・公園・河川・広場・水路の用に供されているものは除かれる（宅建業法2条1号、施行令1条）。","m":"用途地域内でも道路公園は除く"},{"f":"業法","t":"免許","ref":"R03s-34-2","s":"マンションの1室のように建物の一部の売買の代理を業として行う場合は、建物全体を取引するものではないため、宅建業法上の宅地建物取引業には該当せず、免許は不要である。","a":0,"e":"宅建業法上の建物には建物の一部も含まれるため、マンションの1室の売買の代理を業として行うことも宅建業に当たる。","m":"建物の一部も建物"},{"f":"業法","t":"免許","ref":"R03s-34-4","s":"宅建業法上の宅地に該当するかどうかは、その土地の登記簿上の地目によって判断されるため、建物の敷地に供する目的で取引される土地であっても、地目が田であれば宅地に当たらない。","a":0,"e":"宅地かどうかは現況や取引の目的で判断し、登記簿上の地目は関係ない。建物の敷地に供する目的で取引される土地は宅地である。","m":"宅地は地目でなく目的"},{"f":"業法","t":"免許","ref":"R03s-36-1","s":"法人である宅建業者について破産手続開始の決定があった場合、その法人の代表取締役など役員であった者は、その日から30日以内に、その旨を免許権者に届け出なければならない。","a":0,"e":"破産手続開始決定の場合、届出義務者は役員ではなく破産管財人であり、30日以内に免許権者へ届け出る（宅建業法11条1項3号）。","m":"破産は管財人が届出"},{"f":"業法","t":"免許","ref":"R03s-36-3","s":"宅建業者が免許の更新の申請を怠ったために、その免許の有効期間が満了した場合、その宅建業者であった者は、遅滞なく、手元の免許証を免許権者に返納しなければならない。","a":0,"e":"有効期間満了の場合は免許証の返納義務はない。返納が必要なのは免許換え、免許取消し、亡失した免許証の発見、廃業等の届出の場合である。","m":"期間満了は返納不要"},{"f":"業法","t":"監督・罰則","ref":"R03s-36-4","s":"宅建業者が免許を受けてから1年以内に事業を開始しない場合、免許権者は、聴聞を経たうえで、その宅建業者の免許を取り消すかどうかを裁量で判断することができるにとどまる。","a":0,"e":"免許後1年以内に事業を開始しない場合は、裁量ではなく必ず免許を取り消さなければならない（必要的取消し、宅建業法66条1項）。","m":"1年開業なしは必ず取消"},{"f":"業法","t":"広告","ref":"R03s-38-ア","s":"宅建業者Aは、建築確認を受ける前の未完成の賃貸住宅について、貸主から媒介の依頼を受けた場合、広告に取引態様が媒介である旨を明示すれば、借主を募集する広告をすることができる。","a":0,"e":"未完成物件は、建築確認等の処分があった後でなければ、売買・貸借を問わず広告できない（宅建業法33条）。取引態様の明示では足りない。","m":"確認前は貸借も広告禁止"},{"f":"業法","t":"業務上の規制","ref":"R03s-38-イ","s":"宅建業者Aは、建築確認を受ける前の未完成の賃貸住宅について、貸主から代理の依頼を受けた場合、貸主の代理人として借主との間で賃貸借契約を締結しても、宅建業法に違反しない。","a":1,"e":"確認前の契約締結の制限は売買・交換に限られ、貸借には適用されない（宅建業法36条）。広告の制限とは範囲が異なる。","m":"契約制限は貸借を除く"},{"f":"業法","t":"8種制限","ref":"R03s-38-ウ","s":"宅建業者Aは、他人が所有する宅地で、Aがその宅地を取得する契約をまだ締結していないものについて、宅建業者Bを買主として売買の予約を締結しても、宅建業法に違反しない。","a":1,"e":"自己の所有に属しない物件の売買制限（宅建業法33条の2）は8種制限の一つで、業者間取引には適用されない。","m":"業者間に8種制限なし"},{"f":"業法","t":"8種制限","ref":"R03s-38-エ","s":"宅建業者Aは、農地法5条の許可を停止条件とする契約によって取得する予定の土地について、宅建業者でない個人を買主として、自ら売主となる売買契約を締結しても、宅建業法に違反しない。","a":0,"e":"停止条件付きの取得契約は、他人物売買の例外となる「取得する契約」に当たらない。業者でない者への売買はできない（宅建業法33条の2）。","m":"停止条件付取得は例外外"},{"f":"業法","t":"37条書面","ref":"R03s-40-1","s":"売主である宅建業者Aと媒介業者Bが関与した宅地の売買で、Bが作成した37条書面にBの宅建士が記名していれば、Aは自社の宅建士に37条書面へ記名させる必要はない。","a":0,"e":"取引に関与した宅建業者はいずれも37条書面の交付義務を負う。AもBも宅建士に記名させなければならない（宅建業法37条）。","m":"関与業者は全員記名"},{"f":"業法","t":"37条書面","ref":"R03s-40-2","s":"宅建業者Aが媒介して宅地の売買契約を成立させた場合で、契約不適合責任に関する特約があるときは、Aはその内容を記載した37条書面を売主と買主の双方に交付しなければならない。","a":1,"e":"担保責任（契約不適合責任）の定めは任意的記載事項。媒介業者は契約の両当事者に37条書面を交付する（宅建業法37条1項）。","m":"媒介は双方に交付"},{"f":"業法","t":"37条書面","ref":"R03s-40-4","s":"宅建業者Aが自ら貸主として、自己所有の建物を賃貸する契約を宅建業者でない借主Gと締結した場合、Aは、借賃の額と支払方法を記載した37条書面をGに交付しなければならない。","a":0,"e":"自ら貸主となる行為は宅建業の「取引」に当たらないため、宅建業法の規制は及ばず、37条書面の交付義務も生じない。","m":"自ら貸主は業法対象外"},{"f":"業法","t":"37条書面","ref":"R03s-42-ア","s":"宅建業者が媒介して既存建物の賃貸借契約を成立させた場合、借賃以外の金銭の授受に関する定めがあるときは、その額・授受の時期・目的を37条書面に記載しなければならない。","a":1,"e":"借賃以外の金銭（敷金・礼金等）の定めがあれば、額・時期・目的が37条書面の記載事項となる（宅建業法37条2項）。","m":"借賃以外の金銭は3点記載"},{"f":"業法","t":"37条書面","ref":"R03s-42-イ","s":"宅建業者が媒介して既存建物の賃貸借契約を成立させた場合、設計図書や点検記録など建物の建築・維持保全の状況に関する書類の保存状況を37条書面に記載しなければならない。","a":0,"e":"書類の保存状況は既存建物の売買・交換における35条書面の記載事項であり、貸借の37条書面の記載事項ではない。","m":"書類保存状況は売買の35条"},{"f":"業法","t":"37条書面","ref":"R03s-42-エ","s":"宅建業者が媒介して既存建物の賃貸借契約を成立させた場合、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を37条書面に記載しなければならない。","a":1,"e":"天災その他不可抗力による損害の負担（危険負担）の定めは、売買・貸借に共通する37条書面の任意的記載事項である。","m":"天災の定めは売買も貸借も"},{"f":"業法","t":"クーリング・オフ","ref":"R03s-43-1","s":"業者Aが売主となり、土地に定着しないテント張りの案内所で一般の買主が申込み・契約し、クーリング・オフを口頭で告げられただけの場合、契約から8日経過すれば買主は解除できない。","a":0,"e":"テント張りの案内所は事務所等に当たらない。書面で告げられていなければ8日の期間は進まず、引渡し・全額支払前なら解除できる。","m":"テント案内所はCO可"},{"f":"業法","t":"クーリング・オフ","ref":"R03s-43-3","s":"宅建業者Aが売主の売買で、クーリング・オフについて書面で告げられた一般の買主が、告げられた日から8日目に解除の書面を発信し、それがAに2日後に到達した場合でも、解除の効力は生じる。","a":1,"e":"クーリング・オフによる解除は、買主が書面を発した時に効力を生じる（宅建業法37条の2第2項）。","m":"COは発信主義"},{"f":"業法","t":"クーリング・オフ","ref":"R03s-43-4","s":"宅建業者Aの事務所で買受けの申込みをした一般の買主は、後日喫茶店で売買契約を締結し、クーリング・オフについて書面で告げられていなかったとしても、その契約を解除することはできない。","a":1,"e":"申込みと契約の場所が異なるときは申込みの場所で判断する。事務所で申し込んだ場合、クーリング・オフはできない（宅建業法37条の2）。","m":"場所は申込みで判断"},{"f":"権利","t":"抵当権・担保","ref":"R05-10-3","s":"A所有の土地に一番B（1,000万円）、二番C（1,200万円）、三番D（2,000万円）の抵当権がある。BがDのために順位を放棄し、売却代金2,400万円を配当する場合、Bの配当額は400万円である。","a":1,"e":"放棄がなければB1,000万・D200万。合計1,200万をB・Dの債権額比1:2で分けるので、Bは400万円となる（民法376条）。","m":"合計して債権額で按分"},{"f":"権利","t":"抵当権・担保","ref":"R05-10-4","s":"A所有の土地に一番B（1,000万円）、二番C（1,200万円）、三番D（2,000万円）の抵当権がある。BがDのために順位を放棄し、売却代金2,400万円を配当する場合、Bの配当額は800万円である。","a":0,"e":"B・Dの本来の配当合計1,200万円を債権額比1:2で分けると、Bは400万円、Dが800万円となる。Cの1,200万円は影響を受けない。","m":"放棄はB・D間だけの話"},{"f":"権利","t":"借家","ref":"R05-12-1","s":"AがBに建物を賃貸する普通建物賃貸借契約（定期借家・一時使用を除く）で、契約期間を6か月と定めた場合、借地借家法上、その賃貸借は期間を1年とするものとみなされる。","a":0,"e":"建物賃貸借で1年未満の期間を定めると、期間の定めがない賃貸借とみなされる（借地借家法29条1項）。","m":"借家の1年未満は期間なし"},{"f":"権利","t":"借家","ref":"R05-12-2","s":"普通建物賃貸借契約に「契約後一定期間は賃料を減額しない」との特約がある場合、その期間中に経済事情の変動等で賃料が不相当になっても、賃借人は賃料の減額を請求することができない。","a":0,"e":"増額しない特約は有効だが、減額しない特約は普通借家では無効とされ、賃借人は減額請求できる（借地借家法32条1項）。","m":"減額しない特約は無効"},{"f":"権利","t":"借家","ref":"R05-12-3","s":"引渡しを受けた建物賃借人がいる建物を賃貸人が譲渡する際、譲渡人と譲受人が賃貸人の地位を譲渡人に留保し、譲受人が譲渡人に賃貸する旨を合意すれば、賃貸人の地位は譲受人に移転しない。","a":1,"e":"原則は譲受人へ当然移転するが、地位留保と譲受人から譲渡人への賃貸の合意があれば移転しない（民法605条の2第2項）。","m":"留保＋賃貸合意で移転せず"},{"f":"業法","t":"37条書面","ref":"R05-26-ア","s":"宅建業者Aが自ら売主として宅建業者でない者と宅地の売買契約を締結し、37条書面の記載事項を書面に代えて電磁的方法で提供しようとする場合、Aは相手方の承諾を得なければならない。","a":1,"e":"37条書面の電磁的提供には、あらかじめ方法の種類と内容を示し、相手方の承諾を得る必要がある（法37条4項）。","m":"電磁的提供は承諾が前提"},{"f":"業法","t":"37条書面","ref":"R05-26-イ","s":"宅建業者が売買の媒介で37条書面の記載事項を電磁的方法で提供する場合、相手方の承諾を得る際の通知で宅建士を明示していれば、実際に提供するファイル等で宅建士を明示する必要はない。","a":0,"e":"電磁的方法で提供するときも、提供する記録自体で書面の交付に係る宅建士が明示されていなければならない。","m":"提供時にも宅建士明示"},{"f":"業法","t":"37条書面","ref":"R05-26-エ","s":"宅建業者が建物賃貸借の媒介で37条書面の記載事項を電磁的方法で提供する場合、提供するファイルに記録された事項が改変されていないかどうかを確認できる措置を講じなければならない。","a":1,"e":"電磁的提供の要件として、出力して書面化できること、改変の有無を確認できる措置（電子署名等）などが求められる。","m":"改変チェック措置が必要"},{"f":"業法","t":"媒介契約","ref":"R05-27-2","s":"宅建業者が売主から既存建物の売買の媒介を依頼され、媒介契約に基づき建物状況調査の実施者をあっせんする場合、その実施者は、建築士で国土交通大臣が定める講習を修了した者でなければならない。","a":1,"e":"建物状況調査の実施者は、国交大臣が定める講習を修了した建築士（既存住宅状況調査技術者）に限られる。","m":"調査は講習修了の建築士"},{"f":"業法","t":"媒介契約","ref":"R05-27-3","s":"宅建業者が既存建物の売主から売却の媒介を依頼され、建物状況調査の実施者を売主にあっせんした場合でも、宅建業者はそのあっせんについて、媒介報酬とは別にあっせん料金を受領することはできない。","a":1,"e":"建物状況調査のあっせんは媒介業務の一環とされ、あっせんの対価を報酬とは別に受け取ることはできない。","m":"あっせん料は別取り不可"},{"f":"業法","t":"37条書面","ref":"R05-27-4","s":"宅建業者が既存建物の貸借を媒介して契約を成立させた場合も、37条書面には、建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を記載しなければならない。","a":0,"e":"構造耐力上主要な部分等の状況について双方が確認した事項の記載は、売買・交換の場合のみで、貸借では不要（法37条1項2号の2）。","m":"確認事項は売買・交換のみ"},{"f":"業法","t":"重要事項説明","ref":"R05-33-1","s":"宅建業者Aが、宅建業者でない個人Bとの間で、Aが所有する甲宅地とBが所有する乙宅地を交換する契約を結ぶ場合、AはBに対し甲宅地の重要事項を説明すれば足り、乙宅地について説明する必要はない。","a":1,"e":"重要事項説明は物件を取得する側に対して行う。Bが取得する甲宅地のみ説明が必要で、Aが取得する乙宅地は不要。","m":"説明は取得する側へ"},{"f":"業法","t":"重要事項説明","ref":"R05-33-2","s":"宅建業者が宅建業者でない買主に対して宅地の売買の媒介を行う場合、契約締結前に宅建士が行う35条の重要事項説明において、宅地の引渡しの時期を説明しなければならない。","a":0,"e":"引渡しの時期は37条書面の必要的記載事項であり、35条の重要事項説明の対象ではない。","m":"引渡し時期は37条だけ"},{"f":"業法","t":"重要事項説明","ref":"R05-33-4","s":"宅建業者でない買主から口頭で「重要事項説明書は電磁的方法での提供でかまわない」と依頼された場合、宅建業者は書面等で改めて承諾を得ることなく、電磁的方法で重要事項説明書を提供できる。","a":0,"e":"電磁的提供には、書面または電磁的方法による承諾が必要で、口頭の依頼だけでは足りない（法35条8項、施行令）。","m":"承諾は書面か電磁的で"},{"f":"業法","t":"業務上の規制","ref":"R05-36-ア","s":"宅建業者が建物の賃貸借の媒介に際して申込者から預り金を受領し、その後申込者が申込みの撤回を申し出たため、預り金から事務手数料等の諸費用を差し引いて返還することは、宅建業法に違反しない。","a":0,"e":"申込みの撤回時に、既に受領した預り金の返還を拒むことは禁止されており、一部を差し引くことも許されない。","m":"預り金は全額返す"},{"f":"業法","t":"業務上の規制","ref":"R05-36-イ","s":"宅建業者が自ら売主として宅建業者でない買主にマンションを販売する際、手付金を用意できない買主の求めに応じ、手付金の分割払いを提案して契約の締結を誘引することは、宅建業法に違反しない。","a":0,"e":"手付の分割払い・後払い・貸付は、手付についての信用の供与として禁止される（法47条3号）。","m":"手付の分割も信用供与"},{"f":"業法","t":"業務上の規制","ref":"R05-36-ウ","s":"宅建業者が、事務所ごとに備える帳簿について、取引のあったつど記載事項を電子計算機のファイルに記録し、必要に応じて紙面に明確に表示できる状態で保存することは、宅建業法に違反しない。","a":1,"e":"帳簿の記載事項をファイル等に記録し、必要に応じ紙面に表示できるときは、その記録をもって帳簿に代えられる。","m":"帳簿は電子保存OK"},{"f":"業法","t":"業務上の規制","ref":"R05-37-1","s":"宅建業者は、従業者に従業者証明書を携帯させなければ業務に従事させてはならないが、非常勤の役員については、宅建業の業務に従事させる場合であっても、従業者証明書を携帯させなくてもよい。","a":0,"e":"従業者証明書は、代表者や非常勤役員、一時的に事務を補助する者も含め、業務に従事する者全員に携帯させる（法48条1項）。","m":"非常勤役員も証明書"},{"f":"業法","t":"業務上の規制","ref":"R05-37-3","s":"宅建業者Aの従業者は、Aが売り出している宅地の買受けを申し込んだ者から従業者証明書の提示を求められた場合、その申込者が宅建業者であっても、従業者証明書を提示しなければならない。","a":1,"e":"従業者は取引の関係者から請求があれば従業者証明書を提示する義務があり、相手が業者でも例外はない（法48条2項）。","m":"業者相手でも提示"},{"f":"業法","t":"業務上の規制","ref":"R05-37-4","s":"宅建業者は、事務所ごとに従業者の氏名等を記載した従業者名簿を備えなければならず、その従業者名簿は、取引の関係者の閲覧に供するとともに、最終の記載をした日から5年間保存すれば足りる。","a":0,"e":"従業者名簿の保存期間は、最終の記載をした日から10年間である。帳簿（閉鎖後5年等）と混同しないこと。","m":"従業者名簿は10年"},{"f":"業法","t":"免許","ref":"R05-38-ア","s":"宅建業者Aが、自ら所有する複数のマンションの部屋について、自ら貸主となって不特定多数の者に反復継続して賃貸する行為は、それ自体としては宅建業法上の宅地建物取引業に該当しない。","a":1,"e":"自ら貸主として賃貸する行為は宅建業法上の「取引」に当たらないため、反復継続しても宅建業ではない（法2条2号）。","m":"自ら貸主は取引でない"},{"f":"業法","t":"免許","ref":"R05-38-ウ","s":"建設業者Bが、建築請負工事を受注することを目的として、不特定多数の者を相手に業として宅地の売買の媒介を行う場合、その目的に照らし、宅地建物取引業には該当しない。","a":0,"e":"業として宅地の売買を媒介すれば、目的が工事受注であっても宅建業に該当し、免許が必要となる。","m":"目的を問わず媒介は業"},{"f":"業法","t":"宅建士","ref":"R05-38-エ","s":"宅地建物取引士は、宅地又は建物の取引の専門家として、宅地又は建物の取引に係る事務に必要な知識及び能力の維持向上に努めなければならないと宅建業法に定められている。","a":1,"e":"宅建士には、取引に係る事務に必要な知識・能力の維持向上に努める義務がある（法15条の3）。","m":"宅建士は研鑽の努力義務"},{"f":"業法","t":"8種制限","ref":"R05-39-1","s":"宅建業者Aが自ら売主として宅建業者でない個人Bと宅地の売買契約を結び、手付金について保全措置が必要な場合、Aは手付金を受領した後、速やかに保全措置を講じればよい。","a":0,"e":"保全措置は手付金等を受領する前に講じなければならない（法41条の2第1項）。受領後では違反となる。","m":"保全措置は受領前"},{"f":"業法","t":"8種制限","ref":"R05-39-2","s":"宅建業者が自ら売主として宅建業者でない個人と宅地を売買し、手付金の保全措置を保険会社との保証保険契約で講じる場合、保険期間は、少なくとも保証保険契約成立時から宅地の引渡しまでの期間であればよい。","a":1,"e":"保証保険契約の保険期間は、少なくとも契約成立時から物件の引渡しまでの期間とすることが求められる。","m":"保険期間は引渡しまで"},{"f":"業法","t":"8種制限","ref":"R05-39-3","s":"宅建業者が自ら売主として宅建業者でない個人と宅地を売買し、手付金の保全措置を保証保険契約で講じた場合、宅建業者は保険証券又はこれに代わる書面を買主に交付する必要はない。","a":0,"e":"どの保全方法でも、保証書・保険証券等の書面（承諾があれば電磁的記録）を買主に交付しなければならない。","m":"証券は買主に渡す"},{"f":"業法","t":"監督・罰則","ref":"R05-41-2","s":"甲県知事の登録を受けている宅建士Bが、勤務実態のない乙県知事免許の宅建業者Cで、自らが専任の宅建士である旨の表示をされることを許した場合、乙県知事はBに対し必要な指示をすることができる。","a":1,"e":"名義貸しなどの場合、登録知事のほか、その事務を行った区域を管轄する知事も宅建士に指示処分ができる（法68条）。","m":"行為地の知事も指示可"},{"f":"業法","t":"監督・罰則","ref":"R05-41-3","s":"甲県知事の登録を受けている宅建士が、不正の手段により宅建士証の交付を受けたことが判明した場合、甲県知事は、情状が特に重いときに限り、その宅建士の登録を消除することができる。","a":0,"e":"不正の手段で宅建士証の交付を受けたときは、登録知事は必ず登録を消除しなければならない（法68条の2第1項）。","m":"不正交付は必ず消除"},{"f":"業法","t":"監督・罰則","ref":"R05-41-4","s":"都道府県知事は、その登録を受けている宅建士に対して登録を消除する処分をしたときは、宅建業者に対する免許取消処分の場合と同様に、その旨を公報等で公告しなければならない。","a":0,"e":"公告が必要なのは宅建業者への業務停止・免許取消処分であり、宅建士に対する処分は公告されない。","m":"宅建士処分は公告なし"},{"f":"権利","t":"意思表示・行為能力","ref":"R06-01-1","s":"営業を許された未成年者が、その営業に関する取引の意思表示をした時に、泥酔などにより意思能力を有していなかった場合、民法上、その法律行為は取り消すまでもなく無効である。","a":1,"e":"意思能力を欠く状態でした法律行為は無効である（民法3条の2）。営業の許可があっても変わらない。","m":"意思無能力は無効"},{"f":"権利","t":"意思表示・行為能力","ref":"R06-01-3","s":"AがBに土地を売却する意思表示をした場合、民法上、詐欺による意思表示は取り消すことで初めから無効であったとみなされるが、強迫による意思表示は取り消すまでもなく当然に無効である。","a":0,"e":"詐欺・強迫による意思表示はいずれも取消しができるもので、取り消すまでは有効である（民法96条1項）。","m":"強迫も取消しで無効"},{"f":"権利","t":"売買・契約不適合","ref":"R06-01-4","s":"AがB所有の土地をBに無断で自己の物としてCに売却する契約を結んだ場合、他人の土地を目的とする売買契約であるため無効であり、所有者Bが追認したときに初めて有効となる。","a":0,"e":"他人物売買も有効で、売主は権利を取得して買主に移転する義務を負う（民法561条）。","m":"他人物売買も有効"},{"f":"権利","t":"不法行為・請負・委任","ref":"R06-02-2","s":"Aから事務処理の委任を受けた受任者Bは、委任者Aの許諾を得たとき、又はやむを得ない事由があるときでなければ、自らに代わって事務を処理する復受任者を選任することができない。","a":1,"e":"受任者は原則自ら事務を処理し、許諾かやむを得ない事由がある場合に限り復受任者を選べる（民法644条の2第1項）。","m":"復委任は許諾かやむを得ず"},{"f":"権利","t":"代理","ref":"R06-02-3","s":"Aが委任契約に基づきBに土地売却の代理権を与える際、A・B間で「Aが死亡しても代理権は消滅しない」と合意していた場合には、Aが死亡してもBの代理権は消滅しない。","a":1,"e":"代理権は本人の死亡で消滅するのが原則（民法111条1項）だが、死亡後も存続させる特約は有効とされる。","m":"死後存続の特約は有効"},{"f":"権利","t":"不法行為・請負・委任","ref":"R06-02-4","s":"民法上、委任とは、当事者の一方が仕事を完成することを約し、相手方がその仕事の結果に対して報酬を支払うことを約することによって、その効力を生ずる契約のことをいう。","a":0,"e":"これは請負の定義（民法632条）。委任は法律行為をすることを委託し、相手方が承諾することで成立する（民法643条）。","m":"完成目的は請負"},{"f":"権利","t":"抵当権・担保","ref":"R06-06-ア","s":"A所有の甲土地にBを地上権者とする地上権が設定・登記され、その後Cを抵当権者とする抵当権が設定・登記された。BがAから甲土地を買い受けて所有権を取得した場合、地上権は混同により消滅する。","a":0,"e":"所有権と地上権が同一人に帰属しても、その地上権が第三者（後順位抵当権者C）の権利の目的等である場合は消滅しない（民法179条1項ただし書）。","m":"後に抵当権あれば存続"},{"f":"権利","t":"抵当権・担保","ref":"R06-06-イ","s":"A所有の甲土地にBの地上権が設定・登記され、その後Cの抵当権が設定・登記された。Aが死亡しBが単独相続して甲土地の所有権を取得した場合でも、Bの地上権は消滅しない。","a":1,"e":"混同の例外。抵当権が実行されても、Bが地上権で土地利用を続けられるよう地上権は存続する（民法179条1項ただし書）。","m":"取得原因を問わず存続"},{"f":"権利","t":"相続","ref":"R06-07-3","s":"AがBに甲建物を賃貸し引き渡した後、Bが死亡してDが単独相続した。この場合、Dは、Bの死亡を知るなどして相続の開始を知るまでは、Bが有していた甲建物の占有を承継しない。","a":0,"e":"相続人は、相続開始を知らなくても、被相続人の占有を相続開始と同時に当然承継するとされる（判例）。","m":"占有は相続で当然承継"},{"f":"権利","t":"賃貸借","ref":"R06-07-4","s":"AがBに甲建物を賃貸して引き渡した後、賃貸人Aと賃借人Bがともに死亡した場合でも、賃貸借契約は当然には終了せず、貸主・借主の地位はそれぞれの相続人に承継される。","a":1,"e":"賃貸借は当事者の死亡で終了せず、相続の対象となる。使用貸借（借主の死亡で終了）との違いに注意。","m":"賃貸借は死亡で終わらない"},{"f":"権利","t":"意思表示・行為能力","ref":"R06-08-1","s":"民法上、遠く離れた者同士（隔地者間）の契約は、申込みに対する承諾の通知を相手方に向けて発信した時に成立し、その承諾の通知が相手方に到達した時に成立するのではない。","a":0,"e":"現行民法は発信主義の規定を削除し、承諾も到達した時に効力を生ずる（民法97条1項）。","m":"承諾も到達主義"},{"f":"権利","t":"代理","ref":"R06-08-3","s":"代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合、相手方がその目的を知り、又は知ることができたときは、その行為は代理権を有しない者がした行為とみなされる。","a":1,"e":"代理権の濫用は、相手方が悪意又は有過失なら無権代理行為とみなされる（民法107条）。","m":"濫用＋相手悪意有過失は無権代理"},{"f":"権利","t":"意思表示・行為能力","ref":"R06-08-4","s":"未成年者が土地の売買などの法律行為をするには法定代理人の同意を得なければならないが、単に権利を得、又は義務を免れる法律行為については、その同意を得る必要はない。","a":1,"e":"未成年者の法律行為には法定代理人の同意が必要だが、単に権利を得・義務を免れる行為は例外（民法5条1項）。","m":"得するだけなら同意不要"},{"f":"権利","t":"保証・連帯債務","ref":"R06-09-1","s":"債務者Aと第三者Cとの契約により、CがAの債務を引き受けてAが債務を免れる免責的債務引受をする場合、債権者Bの承諾は必要なく、A・C間の合意だけで効力を生ずる。","a":0,"e":"債務者と引受人の契約による免責的債務引受は、債権者が引受人に承諾することで効力を生ずる（民法472条3項）。","m":"免責的引受は債権者承諾"},{"f":"権利","t":"保証・連帯債務","ref":"R06-09-2","s":"債務者Aと第三者Cとの契約により、CがAと並んで同じ内容の債務を負う併存的債務引受をした場合、その引受けは、債権者Bが引受人Cに対して承諾をした時に効力を生ずる。","a":1,"e":"債務者と引受人の契約による併存的債務引受は、債権者が引受人に承諾した時に効力を生ずる（民法470条3項）。","m":"債務者と引受人なら債権者承諾"},{"f":"権利","t":"賃貸借","ref":"R06-09-4","s":"AがBから建物を賃借している場合、賃借人Aは、賃貸人Bの承諾を得なくても、賃貸借契約の期間中であれば、その建物の全部又は一部を第三者Cに自由に転貸することができる。","a":0,"e":"賃借人が賃借権を譲渡し又は転貸するには、賃貸人の承諾が必要（民法612条1項）。","m":"転貸には承諾"},{"f":"権利","t":"売買・契約不適合","ref":"R06-10-4","s":"売買の目的物に品質に関する契約不適合があり、その不適合が売主・買主のいずれの責めにも帰することができない事由によるものである場合、買主は売主に対して損害賠償を請求することができない。","a":1,"e":"損害賠償請求は売主に帰責事由がある場合に限られる（民法415条1項ただし書）。追完・減額・解除は帰責事由不要。","m":"損害賠償だけ帰責必要"},{"f":"権利","t":"売買・契約不適合","ref":"R06-10-1","s":"売買の目的物に品質に関する契約不適合があり、その不適合が売主・買主のいずれの責めにも帰することができない事由による場合、買主は売買契約を解除することができない。","a":0,"e":"解除に売主の帰責事由は不要で、買主に帰責事由がなければ解除できる（民法541条・542条・543条）。","m":"解除に売主の帰責不要"},{"f":"権利","t":"売買・契約不適合","ref":"R06-10-3","s":"売買の目的物に品質に関する契約不適合があり、その不適合が売主・買主のいずれの責めにも帰することができない事由による場合、買主は履行の追完請求も代金減額請求もできない。","a":0,"e":"追完請求・代金減額請求は売主の帰責事由を要せず、買主に帰責事由がなければ行使できる（民法562条・563条）。","m":"追完・減額は無過失でも可"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R06-24-1","s":"不動産取得税の課税標準は、不動産を取得した時の実際の売買価格であり、固定資産課税台帳に登録された価格を課税標準とする固定資産税とは、課税標準の算定方法が異なる。","a":0,"e":"課税標準は売買価格ではなく、固定資産課税台帳の登録価格（未登録なら評価基準による価格）である。","m":"取得税も台帳価格"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R06-24-2","s":"不動産取得税は、課税標準となるべき額が、土地の取得・建築による家屋の取得・その他の家屋の取得の別に応じて地方税法で定められた免税点に満たない場合には、課されない。","a":1,"e":"課税標準額が免税点未満なら不動産取得税は課されない。免税点の額は土地・建築による家屋取得・その他の家屋で異なる。","m":"免税点未満は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R06-24-3","s":"法人Aが法人Bを吸収合併し、Bが所有していた土地・建物を合併によってAが取得した場合であっても、売買による取得と同様に、取得者であるAには不動産取得税が課される。","a":0,"e":"相続や法人の合併による取得は形式的な移転として非課税とされる（地方税法73条の7）。","m":"相続・合併は非課税"},{"f":"業法","t":"重要事項説明","ref":"R06-26-ア","s":"宅建業者が宅建業者でない買主に住宅の売買を媒介する場合で、宅地内のガス配管設備の所有権が引渡し後も家庭用プロパンガス販売業者に残るときは、その旨を重要事項として説明する必要がある。","a":1,"e":"配管の所有権が販売業者に残ると、後にガス会社変更時の費用負担などが生じ得るため、その旨の説明が求められる。","m":"配管がガス会社所有なら説明"},{"f":"業法","t":"重要事項説明","ref":"R06-26-イ","s":"宅建業者が宅建業者でない者に重要事項を説明する場合、説明を行う宅建士も、35条書面に記名する宅建士も、いずれもその事務所に置かれている専任の宅建士でなければならない。","a":0,"e":"説明・記名をする宅建士は専任である必要はなく、事務所の専任でない宅建士でもよい。","m":"説明・記名は専任不要"},{"f":"業法","t":"重要事項説明","ref":"R06-26-エ","s":"宅建業者が宅建業者でない買主に区分所有建物の売買を媒介する場合で、規約に計画的な修繕積立金の定めがあるときは、その内容と既に積み立てられている額を説明しなければならない。","a":1,"e":"区分所有建物の売買では、修繕積立金の定めの内容と既積立額（滞納があればその額も）を説明する。","m":"積立金は定め＋既積立額"},{"f":"業法","t":"報酬","ref":"R06-28-ア","s":"消費税免税事業者である宅建業者Bが、居住用建物（月額賃料12万円）の借主から賃貸借の媒介を依頼され、報酬について借主の特別な承諾を得ずに、借主から6.5万円を受領することは宅建業法に違反しない。","a":0,"e":"居住用建物の媒介で承諾がなければ借主からは賃料の0.5か月分が上限。免税業者は4%上乗せで6万×1.04＝6.24万円まで。","m":"居住用は承諾なし半月"},{"f":"業法","t":"報酬","ref":"R06-28-イ","s":"免税事業者Bが事業用建物（月額賃料10万円・返還されない権利金90万円）の貸借の双方から媒介を依頼され、貸主・借主から5万円ずつ受領することは、宅建業法に違反しない。","a":1,"e":"権利金基準なら双方合計約9.4万円だが、賃料基準なら合計10万×1.04＝10.4万円が上限。高い方を使え、合計10万円は範囲内。","m":"権利金と賃料の高い方"},{"f":"業法","t":"8種制限","ref":"R06-34-2","s":"業者Aが自ら売主として業者でない個人に完成済建物を4,000万円で売る場合、保全措置なしで手付金100万円を受領できるが、中間金400万円を受領する前には手付金と合わせて保全措置を講じる必要がある。","a":1,"e":"完成物件は代金の10%以下かつ1,000万円以下なら保全不要。合計500万円は10%（400万円）を超えるので、全額につき保全が必要。","m":"完成物件は10%超で保全"},{"f":"業法","t":"8種制限","ref":"R06-34-3","s":"宅建業者Aが自ら売主として、宅建業者でない個人Bと建築工事完了前の建物を代金4,000万円で売買する契約を結ぶ場合、Aは保全措置を講じずに手付金300万円を受領することができる。","a":0,"e":"未完成物件は代金の5%以下かつ1,000万円以下なら保全不要。5%は200万円で、300万円は保全措置が必要。","m":"未完成は5%まで"},{"f":"業法","t":"8種制限","ref":"R06-34-4","s":"宅建業者Aが自ら売主として宅建業者でない個人Bと建物の売買契約を結んだ場合、Aが必要な手付金等の保全措置を講じていないときは、Bは中間金など手付金等の支払いを拒むことができる。","a":1,"e":"売主業者が必要な保全措置を講じないときは、買主は手付金等を支払わないことができる（法41条4項、41条の2第5項）。","m":"保全なしなら支払拒否可"},{"f":"業法","t":"37条書面","ref":"R06-35-2","s":"宅建業者Aが媒介業者として建物の賃貸借契約を成立させ、37条書面の記載事項を電磁的方法で提供する場合、その方法は、37条書面の交付に係る宅建士が明示されるものでなければならない。","a":1,"e":"電磁的方法による提供でも、書面交付に係る宅建士が明示されることが要件の一つとされている。","m":"電子でも宅建士明示"},{"f":"業法","t":"37条書面","ref":"R06-35-3","s":"宅建業者が37条書面の電磁的提供について相手方から書面で承諾を得た後に、相手方から電磁的方法による提供を受けない旨の申出があっても、電磁的方法で提供することができる。","a":0,"e":"承諾後でも、相手方が電磁的提供を受けない旨を申し出た場合は、電磁的方法で提供してはならない（施行令）。","m":"拒否の申出が優先"},{"f":"業法","t":"37条書面","ref":"R06-35-4","s":"宅建業者が宅地売買の媒介で、相手方の承諾を得て37条書面の記載事項を適法に電磁的方法で提供した場合でも、その後速やかに書面の37条書面を交付しなければならない。","a":0,"e":"要件を満たして電磁的方法で提供すれば、書面を交付したものとみなされ、別途紙の書面を交付する必要はない。","m":"電子提供で交付みなし"},{"f":"業法","t":"37条書面","ref":"R06-40-ア","s":"宅建業者が媒介により既存建物の貸借の契約を成立させた場合、37条書面には、当該建物に係る租税その他の公課の負担に関する定めがあるときは、その内容を記載しなければならない。","a":0,"e":"租税その他の公課の負担に関する定めは売買・交換の場合の記載事項で、貸借では記載不要。","m":"公課負担は売買のみ"},{"f":"業法","t":"37条書面","ref":"R06-40-イ","s":"宅建業者が媒介により建物の貸借の契約を成立させた場合、借賃以外の金銭の授受に関する定めがあるときは、その額並びに授受の時期及び目的を37条書面に記載しなければならない。","a":1,"e":"敷金・礼金等、借賃以外の金銭の定めがあるときは、額・時期・目的を記載する（法37条2項3号）。","m":"借賃以外は額・時期・目的"},{"f":"業法","t":"37条書面","ref":"R06-40-ウ","s":"宅建業者が媒介により居住用建物の貸借の契約を成立させた場合、損害賠償額の予定又は違約金に関する定めがあるときは、その内容を37条書面に必ず記載しなければならない。","a":1,"e":"損害賠償額の予定・違約金の定めは、売買・貸借を問わず、定めがあるときの記載事項である。","m":"違約金は貸借でも記載"},{"f":"業法","t":"業務上の規制","ref":"R06-42-2","s":"宅建業者が建物の売買の勧誘に際して、引渡しの時期について故意に事実と異なることを告げた場合でも、その後に作成する契約書に正しい引渡時期を記載すれば、宅建業法違反とはならない。","a":0,"e":"故意の不実告知は告げた時点で違反が成立し、後で書面に正しく記載しても違反は解消されない（法47条1号）。","m":"不実告知は書面で治らない"},{"f":"業法","t":"業務上の規制","ref":"R06-42-3","s":"国交省の人の死の告知に関するガイドラインによれば、居住用不動産の売買で、対象物件内で自然死があったが特殊清掃等が行われていない場合、宅建業者は原則として買主にそれを告げなくてもよい。","a":1,"e":"自然死・日常生活での不慮の死は原則告知不要。ただし特殊清掃や大規模リフォームが行われた場合は告知が必要となる。","m":"自然死は原則告知不要"},{"f":"業法","t":"業務上の規制","ref":"R06-42-4","s":"人の死の告知に関するガイドラインでは、居住用不動産の賃貸借で、自然死以外の死が発生しても、発覚から概ね3年を経過すれば、特段の事情がない限り借主に告げなくてもよい。","a":1,"e":"賃貸借では概ね3年経過で原則告知不要。ただし事件性・周知性が高いなど特段の事情があれば告知を要する。","m":"賃貸は概ね3年"},{"f":"税他","t":"土地・建物","ref":"R06-49-1","s":"宅地の選定に関し、勾配が30度以上の斜面を背後に控えている宅地では、崖崩れや土砂の流出のおそれがあるため、崖面の保護対策を講じたり擁壁を設けたりするなどの安全対策が必要となる。","a":1,"e":"30度以上の急傾斜地を背にする宅地は崖崩れ等のリスクが高く、崖面の保護や擁壁設置などの対策が求められる。","m":"30度以上は崖対策"},{"f":"税他","t":"土地・建物","ref":"R06-49-2","s":"宅地の擁壁のうち高さ2m以下のものであれば、擁壁の背面に雨水や地下水がたまる心配はないため、水抜き穴が設けられていなくても、地震によって被害を受けることはない。","a":0,"e":"水抜き穴がないと背面に水圧がたまり不安定になる。低い擁壁でも安全性が不十分なことがあり、地震で被害を受け得る。","m":"低い擁壁も油断禁物"},{"f":"税他","t":"土地・建物","ref":"R06-49-3","s":"宅地の擁壁の種類のうち、重力式擁壁は、鉄筋で引っ張りに抵抗するのではなく、擁壁自体の重さによって背面の土から受ける土圧に抵抗し、土の崩壊を防ぐコンクリート等の構造物である。","a":1,"e":"重力式擁壁は自重で土圧を支える構造。ほかに鉄筋コンクリート造や練積み造などがある。","m":"重力式は自重で支える"},{"f":"権利","t":"意思表示・行為能力","ref":"R07-03-ア","s":"Aが真意ではないことを自ら知りながらBに土地を売ると意思表示した場合、BがAの真意を知らなかったときは、知らなかったことに過失があっても、その意思表示は有効である。","a":0,"e":"心裡留保は原則有効だが、相手方が真意を知り又は知ることができた（善意有過失）ときは無効（民法93条1項）。","m":"心裡留保は善意無過失で有効"},{"f":"権利","t":"意思表示・行為能力","ref":"R07-03-イ","s":"AとBが通謀して土地をBに売却したように仮装した場合、その無効は善意の第三者Cに対抗できないが、Cが仮装であることを知らなかったことに過失があれば、AはCに無効を対抗できる。","a":0,"e":"虚偽表示の無効は善意の第三者に対抗できず、第三者の無過失は不要とされる（民法94条2項、判例）。","m":"虚偽表示は善意で足りる"},{"f":"権利","t":"意思表示・行為能力","ref":"R07-03-エ","s":"AがBの詐欺によりBに土地を売却し、その後BがCに転売した場合、Aは詐欺を理由に売買を取り消しても、その取消しを善意でかつ過失がないCに対抗することができない。","a":1,"e":"詐欺取消しは善意無過失の第三者に対抗できない（民法96条3項）。強迫取消しは第三者にも対抗できる。","m":"詐欺は善意無過失に負け"},{"f":"権利","t":"抵当権・担保","ref":"R07-04-2","s":"AがBから弁済期の定めなく1,000万円を借り入れ、返済を怠った場合、BはAから別の事情で預かっている動産について、貸金債権を被担保債権として留置権を行使することができる。","a":0,"e":"留置権はその物に関して生じた債権（牽連性）が必要で、物と無関係の貸金債権では成立しない（民法295条）。","m":"留置権は物との牽連性"},{"f":"権利","t":"抵当権・担保","ref":"R07-04-3","s":"AがBから1,000万円を借り入れる金銭消費貸借契約を結び、Aが返済を怠った場合、Bはその貸金債権に基づいて、Aの総財産について先取特権を行使することができる。","a":0,"e":"先取特権は法律が定める特定の債権にだけ認められ、通常の貸金債権には一般先取特権は生じない。","m":"貸金に先取特権なし"},{"f":"権利","t":"不法行為・請負・委任","ref":"R07-04-4","s":"AがBに1,000万円の貸金返還債務を負い、BがAに悪意の不法行為による1,000万円の損害賠償債務（弁済期到来済み）を負う場合、被害者Aは損害賠償債権を自働債権として相殺できる。","a":1,"e":"悪意の不法行為による債務の相殺禁止は加害者側からの相殺を禁じるもので、被害者側からの相殺は可能（民法509条）。","m":"被害者からの相殺はOK"},{"f":"権利","t":"物権変動・対抗","ref":"R07-06-1","s":"BがA所有の甲土地をAに無断でCに売却し、その後BがAから甲土地を買い受けて所有権を取得した場合、Cは、B・C間の売買契約の時にさかのぼって甲土地の所有権を取得する。","a":0,"e":"他人物売買は有効だが、Cが所有権を取得するのは売主Bが所有権を取得した時であり、契約時にさかのぼらない。","m":"取得時に移転・遡らない"},{"f":"権利","t":"物権変動・対抗","ref":"R07-06-2","s":"DがA所有の甲土地について無断で自己名義の登記をしてEに売却し、Eも移転登記を備えた後、AがFに甲土地を売却した場合、FはEに対して甲土地の所有権を主張することができる。","a":1,"e":"Dは無権利者でありEも権利を取得しない。登記に公信力はないため、真の所有者Aから買ったFが優先する。","m":"登記に公信力なし"},{"f":"権利","t":"物権変動・対抗","ref":"R07-06-3","s":"GがA所有の甲土地を占有して時効取得した後、Aが死亡してHがAを単独相続した場合、Gは、Hに対して、所有権移転登記がなくても時効による所有権の取得を主張することができる。","a":1,"e":"時効取得者と原所有者は当事者関係にあり、包括承継人である相続人Hも当事者と同視されるため登記不要。","m":"相続人は第三者でない"},{"f":"権利","t":"不法行為・請負・委任","ref":"R07-07-1","s":"Bが賃借中のA所有建物の屋根修理をCに請け負わせ、修理後にBが代金を払わないまま無資力となった場合でも、CはAに対し、事務管理に基づいて修理費用の償還を請求することはできない。","a":1,"e":"CはBとの請負契約上の義務として工事をしており、Aのために義務なく事務を管理したとはいえないので事務管理は不成立。","m":"契約上の工事は事務管理でない"},{"f":"権利","t":"賃貸借","ref":"R07-07-2","s":"建物の賃借人が賃借建物の屋根の雨漏りを自らの費用で修理した場合、特約がなければ、賃借人は賃貸借契約の終了時でなければ賃貸人にその費用の償還を請求することができない。","a":0,"e":"雨漏り修理は必要費であり、賃借人は直ちに賃貸人に償還請求できる（民法608条1項）。終了時償還は有益費。","m":"必要費は直ちに"},{"f":"権利","t":"抵当権・担保","ref":"R07-07-3","s":"賃借人Bから建物の屋根修理を請け負ったCは、Bが修理代金を支払わない場合、登記などの手続を要することなく当然に、Bが占有するA所有の建物について不動産工事の先取特権を行使できる。","a":0,"e":"先取特権は債務者の所有物にしか成立せず、建物はA所有。また不動産先取特権は登記が必要で当然には行使できない。","m":"先取特権は債務者の物に"},{"f":"権利","t":"売買・契約不適合","ref":"R07-10-1","s":"AがBに土地を売却し引き渡した後、Bが引渡しから11年後に契約不適合の土壌汚染を発見し、1年以内にAに通知した。Aが重過失なく汚染を知らなかった場合、BはAに損害賠償を請求できない。","a":1,"e":"通知期間は守っていても、引渡し（権利行使可能時）から10年の消滅時効が完成しているため請求できない（民法166条1項2号）。","m":"通知期間と時効は別物"},{"f":"権利","t":"売買・契約不適合","ref":"R07-10-3","s":"「引渡しから1年以内に通知」の特約がある土地売買で、売主が汚染を知りながら告げなかった場合、売主が宅建業者か否かで、業者でない買主が損害賠償を請求できるかの結論が異なる。","a":0,"e":"売主が個人でも知りながら告げなければ特約は効かず（民法572条）、業者なら1年特約は無効。いずれも請求できる。","m":"悪意の売主は特約無効"},{"f":"権利","t":"売買・契約不適合","ref":"R07-10-4","s":"「契約不適合責任を一切負わない」特約のある土地売買で、売主が重過失なく汚染を知らなかった場合、売主が宅建業者か否かで、業者でない買主が損害賠償を請求できるかの結論が異なる。","a":1,"e":"個人売主なら全部免責特約は有効で請求不可。業者売主なら買主に不利な特約として無効（宅建業法40条）で請求できる。","m":"業者の全部免責は無効"},{"f":"法令","t":"都市計画法","ref":"R07-15-1","s":"風致地区は都市の風致を維持するために定める地区であり、その区域内における建築物の建築や宅地の造成等については、政令で定める基準に従い、地方公共団体の条例で都市の風致を維持するため必要な規制をすることができる。","a":1,"e":"風致地区内の建築・宅地造成・木竹の伐採等は、政令の基準に従い地方公共団体の条例で規制できる（都市計画法58条1項）。","m":"風致は条例で規制"},{"f":"法令","t":"都市計画法","ref":"R07-15-2","s":"特定街区は、市街地の整備改善を図るため街区の整備又は造成が行われる地区について定めるもので、その都市計画では、街区内の建築物の容積率、建築物の高さの最高限度及び壁面の位置の制限を定める。","a":1,"e":"特定街区では容積率・高さの最高限度・壁面の位置の制限の3つを都市計画で定める（都市計画法9条20項）。","m":"特定街区は容積・高さ・壁面"},{"f":"法令","t":"都市計画法","ref":"R07-15-4","s":"生産緑地地区は、農業の利便の増進を図りつつ、これと調和した低層住宅に係る良好な住居の環境を保護するため定める地域であり、用途地域の一つとして位置づけられている。","a":0,"e":"記述は田園住居地域の定義。生産緑地地区は市街化区域内の農地を保全する地域地区で、用途地域ではない（生産緑地法3条）。","m":"農と低層住宅＝田園住居"},{"f":"法令","t":"開発許可","ref":"R07-16-2","s":"開発行為とは、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更をいうが、ゴルフコースの建設を目的とする土地の区画形質の変更は、その規模にかかわらず開発行為に当たらない。","a":0,"e":"ゴルフコースは規模を問わず第二種特定工作物であり、その建設目的の区画形質の変更は開発行為に当たる（都市計画法4条11項・12項）。","m":"ゴルフ場は規模不問で特定工作物"},{"f":"法令","t":"開発許可","ref":"R07-16-3","s":"区域区分が定められていない都市計画区域内において、店舗の建築を目的として4,000㎡の土地の区画形質の変更を行おうとする者は、都道府県知事の開発許可を受ける必要はない。","a":0,"e":"非線引き都市計画区域では3,000㎡以上の開発行為に許可が必要。4,000㎡なら許可を要する（都市計画法29条1項1号、施行令19条）。","m":"非線引きは3,000㎡以上"},{"f":"法令","t":"開発許可","ref":"R07-16-4","s":"自己の居住の用に供する住宅の建築を目的とするもの以外の開発行為については、原則として、開発区域内に建築基準法の災害危険区域などの開発不適区域内の土地を含まないことが、開発許可の基準とされている。","a":1,"e":"災害危険区域・地すべり防止区域・土砂災害特別警戒区域等を含まないことが基準。自己居住用住宅は対象外（都市計画法33条1項8号）。","m":"レッドゾーンは自己居住用以外NG"},{"f":"法令","t":"建築基準法","ref":"R07-17-2","s":"都市計画区域外において木造2階建て・延べ面積150㎡の住宅を新築する場合には建築確認が必要であるが、同じ住宅について大規模の修繕を行う場合には、建築確認を受ける必要はない。","a":0,"e":"2025年4月以降、木造でも2階建て以上又は延べ面積200㎡超は新2号建築物となり、全国で大規模の修繕・模様替にも確認が必要（建築基準法6条1項2号）。","m":"新2号は修繕も確認"},{"f":"法令","t":"建築基準法","ref":"R07-17-3","s":"延べ面積が1,000㎡を超える木造の建築物は、その外壁及び軒裏で延焼のおそれのある部分を防火構造とし、その屋根の構造を一定の防火性能を有するものとしなければならない。","a":1,"e":"大規模木造建築物（延べ1,000㎡超）は外壁・軒裏の延焼のおそれのある部分を防火構造とし、屋根も所定の構造とする（建築基準法25条）。","m":"木造千㎡超は防火構造"},{"f":"法令","t":"建築基準法","ref":"R07-17-4","s":"建築物の階段には、原則としてその両側又は片側に手すりを設けなければならないが、階段の部分のうち高さが1m以下の部分については、手すりを設けなくてもよいとされている。","a":1,"e":"階段には手すりを設ける必要があるが、高さ1m以下の部分には適用されない（建築基準法施行令25条1項・4項）。","m":"手すりは1m以下なら不要"},{"f":"法令","t":"建築基準法","ref":"R07-18-2","s":"延べ面積1,000㎡で2階建ての飲食店は、第一種低層住居専用地域、第二種低層住居専用地域、第一種中高層住居専用地域、工業専用地域及び田園住居地域のいずれにおいても、原則として建築することができない。","a":1,"e":"二低・田園住居は150㎡（農家レストラン等500㎡）以下、一中高は500㎡以下に限られ、一低と工専は飲食店不可。1,000㎡ならいずれも不可（建築基準法48条・別表第二）。","m":"千㎡の飲食店は一中高でも不可"},{"f":"法令","t":"建築基準法","ref":"R07-18-3","s":"建築基準法の建築協定について、特定行政庁による認可の公告があった後に、その協定区域内の土地の所有者となった者に対しては、その者が改めて協定に同意しない限り、当該建築協定の効力は及ばない。","a":0,"e":"認可の公告後に協定区域内の土地所有者等となった者にも、原則として建築協定の効力が及ぶ（承継効、建築基準法75条）。","m":"建築協定は後の所有者も拘束"},{"f":"法令","t":"建築基準法","ref":"R07-18-4","s":"建築物の外壁に断熱材を取り付ける工事など、屋外に面する部分の省エネ改修工事で構造上やむを得ないものについては、特定行政庁の許可を受けることなく、容積率の制限を超えることができる。","a":0,"e":"省エネ改修等で容積率の限度を超えるには特定行政庁の許可が必要で、許可の範囲内に限られる（建築基準法52条14項）。","m":"省エネ改修の容積緩和は許可制"},{"f":"税他","t":"印紙税・登録免許税","ref":"R07-23-1","s":"土地の売買による所有権の移転登記に係る登録免許税の税率の軽減措置は、宅地に限られず、登記簿上の地目が雑種地である土地の売買による所有権の移転登記についても適用される。","a":1,"e":"土地の売買の軽減措置は地目による限定がなく、雑種地・農地・山林にも適用される（租税特別措置法72条）。適用期限に注意。","m":"土地売買の軽減は地目不問"},{"f":"税他","t":"印紙税・登録免許税","ref":"R07-23-3","s":"土地の売買による所有権の移転登記に係る登録免許税の税率の軽減措置は、個人が土地を取得する場合に限り適用され、法人が売買により土地を取得して登記を受ける場合には適用されない。","a":0,"e":"土地売買の軽減措置は取得者が個人か法人かを問わない。個人・自己居住用に限られる住宅用家屋の特例と混同しないこと（租特法72条）。","m":"土地売買の軽減は法人もOK"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R07-24-1","s":"固定資産税において、住宅用地のうち小規模住宅用地（住宅1戸につき200㎡以下の部分）に対して課する固定資産税の課税標準は、当該住宅用地の価格の3分の1の額とされている。","a":0,"e":"小規模住宅用地（200㎡以下の部分）は価格の6分の1。3分の1は200㎡を超える一般住宅用地の部分である（地方税法349条の3の2）。","m":"小規模住宅用地は6分の1"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R07-24-2","s":"市町村長は、納税義務者等の求めに応じて固定資産課税台帳を閲覧に供しなければならないが、住所が明らかになることで人の生命又は身体に危害を及ぼすおそれがある場合には、住所を記載しない写し等を閲覧に供することができる。","a":1,"e":"台帳は納税義務者等の閲覧に供するが、DV被害者等の保護のため、住所を記載しない写し等で閲覧に供することができる（地方税法）。","m":"危害のおそれは住所を伏せる"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R07-24-4","s":"固定資産課税台帳に所有者として登録されている者が賦課期日前に死亡し、賦課期日において新たな所有者が登録されていない場合には、市町村は、その土地について誰に対しても固定資産税を課することができない。","a":0,"e":"登録された所有者が賦課期日前に死亡していれば、賦課期日に現に所有している者（相続人等）が納税義務者となる（地方税法343条2項）。","m":"死亡なら現所有者に課税"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R07-25-1","s":"不動産鑑定評価基準によれば、一般経済社会における不動産のあり方及びその価格の水準に影響を与える要因を個別的要因といい、自然的要因、社会的要因、経済的要因及び行政的要因に分けられる。","a":0,"e":"記述は一般的要因の説明。個別的要因は不動産ごとの個別性（形状・日照・地盤など）に基づき価格を個別的に形成する要因である。","m":"社会全体の要因＝一般的要因"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R07-25-2","s":"不動産鑑定評価基準によれば、収益還元法は賃貸用不動産や賃貸以外の事業用不動産の価格を求める場合に特に有効であるが、自用の不動産であっても賃貸を想定することにより適用することができる。","a":1,"e":"収益還元法は文化財等を除き基本的にすべての不動産に適用でき、自用の不動産も賃貸を想定して適用できる（鑑定評価基準）。","m":"自用でも賃貸を想定して収益還元"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R07-25-3","s":"不動産鑑定評価基準によれば、原価法において再調達原価から控除する減価額を求める減価修正の方法には、耐用年数に基づく方法と観察減価法の二つがあり、原則としてこれらを併用するものとされている。","a":1,"e":"減価額を求めるには耐用年数に基づく方法と観察減価法があり、原則として両者を併用する（鑑定評価基準）。","m":"減価修正は2つを併用"},{"f":"業法","t":"重要事項説明","ref":"R07-27-1","s":"宅地建物取引業者が区分所有建物の売買を媒介する場合において、一棟の建物及びその敷地の管理が委託されているときは、その委託を受けている者の氏名（法人ならその商号又は名称）及び住所（法人なら主たる事務所の所在地）を説明しなければならない。","a":1,"e":"区分所有建物の売買等では、管理の委託先の氏名・住所（法人は商号・主たる事務所の所在地）が重要事項（宅建業法35条1項6号、施行規則16条の2）。","m":"管理会社名と所在地を説明"},{"f":"業法","t":"重要事項説明","ref":"R07-27-3","s":"宅地建物取引業者は、宅地建物取引業者でない相手方に対する重要事項の説明を、自らの事務所において行わなければならず、相手方の自宅や喫茶店、物件の現地で行うことはできない。","a":0,"e":"重要事項の説明の場所に制限はなく、相手方の自宅や喫茶店、現地などでもよい（宅建業法35条）。","m":"重説はどこでもできる"},{"f":"業法","t":"重要事項説明","ref":"R07-27-4","s":"宅地建物取引業者が建物の売買を媒介する場合において、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を35条の重要事項として契約前に説明しなければならない。","a":0,"e":"天災等不可抗力による損害の負担（危険負担）の定めは37条書面の任意的記載事項であり、35条の重要事項ではない。","m":"危険負担は37条書面"},{"f":"業法","t":"広告","ref":"R07-28-ア","s":"自ら売主として宅地を販売する宅地建物取引業者が、広告で取引態様の別を明示しなかった場合は監督処分の対象となるが罰則はなく、宅地の規模について著しく事実に相違する表示をした場合は監督処分に加え罰則の対象にもなる。","a":1,"e":"取引態様の明示義務違反は指示処分等の監督処分のみ。誇大広告は監督処分に加え6月以下の拘禁刑・100万円以下の罰金又は併科（宅建業法32条・34条・81条）。","m":"誇大広告は罰則あり"},{"f":"業法","t":"8種制限","ref":"R07-28-ウ","s":"自ら売主である宅地建物取引業者Aが、宅地建物取引業者である買主Bに、自己の所有に属しない造成工事前の宅地を売却する場合、Aは手付金等の保全措置を講じるとともに、当該宅地の取得契約を締結していなければならない。","a":0,"e":"買主が宅建業者の場合は8種制限が適用されず、自己の所有に属しない物件の売買制限や手付金等の保全措置は不要（宅建業法78条2項）。","m":"業者間は8種制限なし"},{"f":"業法","t":"媒介契約","ref":"R07-28-エ","s":"宅地建物取引業者が宅地の売買について専属専任媒介契約を締結したときは、契約締結の日から休業日数を除いて5日以内に、当該宅地を指定流通機構に登録しなければならない。","a":1,"e":"指定流通機構への登録は専属専任媒介で5日以内、専任媒介で7日以内（いずれも休業日を除く）。一般媒介は義務なし（宅建業法34条の2第5項）。","m":"専属5日・専任7日"},{"f":"業法","t":"クーリング・オフ","ref":"R07-30-イ","s":"宅地建物取引業者が自ら売主となる建物の売買において、宅建業者でない買主が売主業者の事務所で買受けの申込みをした場合、売主業者が買主にクーリング・オフについて告げる書面を交付しなくても、宅建業法に違反しない。","a":1,"e":"事務所での申込みはクーリング・オフの対象外なので、告知書面の交付義務もない（宅建業法37条の2第1項）。","m":"事務所で申込み→告知不要"},{"f":"業法","t":"重要事項説明","ref":"R07-30-ウ","s":"宅地建物取引業者が区分所有建物を売却する際、共用部分に関する規約がまだ案の段階にとどまっている場合には、買主の了解を得れば、その内容の説明を省略して契約後に確定した規約を交付すれば足りる。","a":0,"e":"共用部分に

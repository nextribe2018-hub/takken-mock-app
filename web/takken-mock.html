、保証協会の認証を受けて供託所から500万円の還付を受けた。","p":"協会は国土交通大臣の通知から2週間以内に500万円を供託し、Dは協会の通知から2週間以内に還付充当金を納付する。還付の日から起算するのではない点に注意。","kw":["認証","還付充当金","2週間以内","通知を受けた日","供託"]}],"around":[{"h":"二重加入の禁止","b":"一つの保証協会の社員は他の保証協会の社員になれない。協会は社員の加入・地位喪失を直ちに（速やかに）免許権者へ報告する。"},{"h":"協会の業務","b":"苦情の解決・研修・弁済業務は必須業務。一般保証業務、手付金等保管事業、研修費用の助成などは任意業務で、大臣の承認を受けて行う。"},{"h":"特別分担金","b":"還付充当金の未納に備える準備金で不足するとき、協会は全社員に特別弁済業務保証金分担金を求め、社員は通知から1か月以内に納付する。怠ると地位を失う。"},{"h":"分担金の返還","b":"社員の地位を失ったときは協会が6か月以上の公告をしてから返還する。一部の事務所廃止による返還では公告不要（営業保証金の一部廃止は公告必要）。"},{"h":"加入前の債権と担保","b":"社員となる前の取引も還付対象のため、弁済業務の運営に支障のおそれがあるとき、協会はその社員に担保の提供を求めることができる。"}]},"業法|事務所・案内所":{"pts":["事務所とは本店・支店・継続的に業務を行い契約締結権限を持つ使用人を置く場所。本店は常に事務所、支店は宅建業を営む場合のみ。登記の有無は無関係。","事務所ごとに業務従事者5人に1人以上の成年の専任宅建士を置く。契約行為等を行う案内所等は1人以上。不足は2週間以内に補充等の措置。","事務所には標識・報酬額の掲示、帳簿・従業者名簿の備付けが必要。案内所等には標識のみ必要で、報酬額の掲示は不要。","帳簿は事業年度末に閉鎖し閉鎖後5年間（自ら売主の新築住宅は10年間）、従業者名簿は最終記載日から10年間保存する。電子保存も可。","契約行為等（申込み受付を含む）を行う案内所等は、業務開始の10日前までに免許権者と所在地の知事の双方に届け出る。","業者本人や法人の役員が宅建士であれば、主として業務に従事する事務所等で成年者である専任宅建士とみなされる（未成年でも可）。","全従業者に従業者証明書を携帯させなければならず、宅建士証で代用することはできない。取引関係者の請求があれば提示する。"],"traps":["「事務所に免許証を掲示しなければならない」と出たら×。掲示義務は標識と報酬額で、免許証はない。","「専任宅建士の不足は30日以内に補充すれば足りる」と出たら×。不足したら2週間以内に補充等の措置を執る。","「契約をしない案内所には標識不要」と出たら×。標識はすべての案内所等に必要、不要なのは専任宅建士と届出。"],"rel":["業法|宅建士","業法|クーリング・オフ","業法|免許"],"bridge":"専任宅建士を置く「契約行為等を行う案内所」は、クーリング・オフの「事務所等」と重なる。テント張りの案内所など土地に定着しない場所は事務所等に当たらない点も比較される。","sys":{"overview":"業者の営業拠点ごとの設置義務の論点。事務所の定義、専任宅建士の数（5人に1人・案内所1人）、標識・報酬額掲示・帳簿・名簿の区別、案内所の10日前届出を表で整理すれば得点できる。","tree":[{"h":"事務所","items":["本店は常に事務所（支店のみで営業しても）","支店は宅建業を営む場合のみ事務所","継続的業務の場所で契約権限者を置く所","登記の有無は無関係"]},{"h":"案内所等","items":["継続的業務を行う事務所以外の場所","一団の宅地建物の分譲の案内所","他業者の分譲の代理・媒介の案内所","展示会その他の催しの会場"]},{"h":"専任宅建士","items":["事務所：業務従事者5人に1人以上","契約行為等の案内所等：1人以上","成年者であることが必要","業者本人・役員の宅建士は成年者とみなす","不足は2週間以内に補充等の措置"]},{"h":"備付け・掲示","items":["標識：事務所・すべての案内所等","報酬額の掲示：事務所のみ","帳簿：事務所ごと、閉鎖後5年（新築自ら売主10年）","従業者名簿：最終記載から10年","電子的な保存も可","事務所の標識は専任宅建士の数を表示"]},{"h":"案内所の届出","items":["契約行為等（申込み受付含む）を行う場合","業務開始の10日前まで","免許権者と所在地の知事の双方","契約行為等をしなければ届出不要","大臣宛ても知事を経由せず直接提出"]},{"h":"従業者証明書","items":["全従業者に携帯させる","宅建士証では代用できない","関係者の請求があれば提示","役員・非常勤も対象"]}],"flow":{"title":"案内所を設けるときの判定","steps":["その場所で契約・申込み受付をするか","しないなら標識の掲示のみで足りる","するなら成年の専任宅建士を1人以上置く","業務開始10日前までに双方の知事等へ届出","標識を掲示（報酬額の掲示は不要）","業務開始後も従業者証明書を携帯させる"]},"tables":[{"title":"場所ごとの義務","head":["義務","事務所","案内所(契約等)","案内所(契約なし)"],"rows":[["標識","○","○","○"],["報酬額の掲示","○","×","×"],["帳簿","○","×","×"],["従業者名簿","○","×","×"],["専任宅建士","5人に1人","1人以上","×"],["50条2項届出","×（変更届）","10日前","×"]]},{"title":"保存期間","head":["書類","保存期間","起算"],"rows":[["帳簿","5年","各事業年度末の閉鎖後"],["帳簿（新築住宅を自ら売主）","10年","閉鎖後"],["従業者名簿","10年","最終の記載をした日"]]},{"title":"よくあるひっかけ","head":["記述","正誤"],"rows":[["免許証を掲示する","×（標識と報酬額）"],["専任宅建士の補充は30日以内","×（2週間以内）"],["案内所届出は所在地知事のみ","×（免許権者にも）"],["宅建士証で従業者証明書を代用","×"],["未登記の支店は事務所でない","×"]]}]},"ex":[{"t":"専任宅建士の人数","s":"A社の本店では宅建業に従事する者が12人（代表者を含む）おり、成年の専任宅建士を3人置いている。そのうち1人が5月15日に退職した。","p":"12人÷5＝2.4なので3人必要で、退職により不足する。A社は退職日から2週間以内に補充その他必要な措置を執らなければならない（30日以内ではない）。","kw":["専任の宅地建物取引士","5人に1人","不足","2週間以内","補充"]},{"t":"他県の契約案内所","s":"甲県知事免許のBが、乙県内のモデルルームでマンションの申込みの受付だけを行う（契約締結はしない）ことにした。","p":"申込み受付も契約行為等なので、業務開始の10日前までに甲県知事と乙県知事の双方へ届け出て、専任宅建士を1人以上置く。標識は必要、報酬額の掲示は不要。","kw":["案内所","申込みの受付","10日前","届出","専任"]},{"t":"代理業者が設けた案内所","s":"売主の業者Cから新築マンションの販売代理を依頼された業者Dが、現地に契約締結を行う案内所を設置した。","p":"案内所を設置したDが標識（売主Cの商号も記載）を掲げ、専任宅建士の設置と届出もDが行う。Dの案内所にCが重ねて標識を掲げる必要はないが、分譲の売主Cもマンションの所在する場所には自己の標識を掲げなければならない。","kw":["販売代理","標識","売主","案内所を設置","双方"]}],"around":[{"h":"事務所の定義","b":"本店は常に事務所、支店は宅建業を営む場合だけ事務所。登記の有無は関係なく、建設業だけを営む支店は事務所ではない。"},{"h":"保存期間の比較","b":"帳簿は各事業年度末に閉鎖し閉鎖後5年（自ら売主の新築住宅は10年）、従業者名簿は最終記載日から10年。帳簿は各事務所に備え、本店一括は不可。"},{"h":"従業者名簿の改正","b":"2025年4月1日施行の施行規則改正で、従業者名簿の記載事項から性別・生年月日が削除され、標識（業者票）の様式も改められた。"},{"h":"従業者証明書","b":"代表者や一時的な事務補助者も含め全従業者に携帯させる。宅建士証では代用できず、取引関係者の請求があれば提示する。"},{"h":"クーリング・オフとの関係","b":"専任宅建士を置くべき案内所等での申込みはクーリング・オフ不可だが、テント張りなど一時的で移動が容易な施設はそもそも「事務所等」に当たらず、クーリング・オフできる。"}]},"業法|業務上の規制":{"pts":["勧誘に先立ち、業者の商号・名称、勧誘者の氏名、契約締結の勧誘目的である旨を告げなければならない。","相手方が契約を締結しない意思を示した後の再勧誘は禁止。担当者を替えても同じ。迷惑を覚える時間の電話・訪問も禁止。","手付の貸付け・分割受領・後払いなどの信用供与による契約誘引は禁止され、契約が成立しなくても誘引した時点で違反。","正当な理由なく判断に必要な時間を与えることを拒むこと、申込み撤回時に受領済みの預り金の返還を拒むことは禁止。","業者・従業者は正当な理由なく業務上知り得た秘密を漏らしてはならず、廃業後・退職後も続く。本人の承諾や裁判での証言は正当な理由。","宅建業法上の割賦販売は、引渡し後1年以上の期間にわたり2回以上に分割して代金を受領することを条件とする販売をいう。","宅地建物の売買及びその代理・媒介は犯罪収益移転防止法の特定取引で、取引時確認や記録の保存が必要。"],"traps":["「勧誘前に自分の氏名を告げれば商号は告げなくてよい」と出たら×。商号・氏名・目的のすべてを告げる。","「契約が成立しなかったので手付貸付けの申出は違反でない」と出たら×。誘引行為自体が違反。","「依頼者の承諾があっても秘密を漏らせない」と出たら×。本人の承諾は正当な理由に当たる。"],"rel":["業法|広告","業法|8種制限","業法|監督・罰則"],"bridge":"手付の貸付けは禁止だが手付の減額は信用供与に当たらず可。手付の額の上限や性質は8種制限で規律され、違反の重さは監督・罰則で問われる。","sys":{"overview":"業法の行為規制のうち勧誘・契約誘引・守秘に関する禁止事項。宅建業者間でも適用される点、手付の信用供与禁止（減額は可）、再勧誘・威迫・時間不付与の禁止、守秘義務の継続と正当理由を押さえれば得点できる。","tree":[{"h":"基本原則","items":["信義を旨とし誠実に業務を行う","従業者への教育の努力義務","業務に関し不当な履行遅延の禁止","業者間取引にも適用（8種制限と異なる）"]},{"h":"勧誘時の規制","items":["商号・勧誘者氏名・勧誘目的を事前に告知","断る意思表示後の再勧誘禁止","担当者を替えても再勧誘は違反","迷惑な時間の電話・訪問の禁止","威迫・断定的判断の提供の禁止"]},{"h":"契約誘引","items":["重要事項の故意の不告知・不実告知禁止","手付の貸付け・分割・後払いは禁止","契約不成立でも誘引時点で違反","手付の減額は信用供与に当たらない","不当に高額の報酬要求の禁止"]},{"h":"契約前後","items":["判断に必要な時間を与えない行為の禁止","撤回時の預り金返還拒否の禁止","手付放棄による解除の不当拒否の禁止","供託所等の説明は契約成立前（業者相手不要）"]},{"h":"守秘義務","items":["業者・従業者とも正当理由なく漏洩禁止","廃業後・退職後も継続","本人の承諾は正当な理由","裁判での証言も正当な理由"]},{"h":"その他","items":["割賦販売：引渡し後1年以上・2回以上分割","売買とその代理・媒介は犯収法の特定取引","特定取引では取引時確認・記録保存","確認記録・取引記録は7年保存"]}],"flow":{"title":"勧誘から契約までの規制","steps":["勧誘前に商号・氏名・目的を告げる","迷惑な時間・威迫・断定的判断をしない","断られたら担当を替えても再勧誘しない","重要事項を偽らず、手付で信用供与しない","判断に必要な時間を与える","撤回されたら預り金を返還する"]},"tables":[{"title":"手付をめぐる行為","head":["行為","可否"],"rows":[["手付の貸付け","×"],["手付の分割受領","×"],["手付の後払い","×"],["手付の減額","○"],["銀行ローンのあっせん","○"]]},{"title":"守秘義務の正当な理由","head":["場面","漏らしてよいか"],"rows":[["本人の承諾","○"],["裁判での証人として証言","○"],["税務署等の法令に基づく調査","○"],["廃業・退職後に他人へ話す","×"],["同業者に参考として話す","×"]]},{"title":"勧誘時の禁止と許容","head":["行為","可否"],"rows":[["商号を告げず氏名のみ","×"],["断られた翌日に再度電話","×"],["担当者を替えて再勧誘","×"],["「必ず値上がり」と断定","×"],["深夜の電話勧誘","×"]]}]},"ex":[{"t":"断られた後の再勧誘","s":"業者Aの従業者Bが電話で投資用マンションを勧誘したところ、相手方Cは「購入しないので二度と電話しないで」と告げた。翌週、Aは担当を従業者Dに替えてCに電話した。","p":"契約を締結しない意思を示した相手への勧誘継続は禁止で、担当者を替えても違反。勧誘に先立ち商号・氏名・勧誘目的を告げることも必要。","kw":["再勧誘","担当者","締結しない旨","電話","商号"]},{"t":"手付の貸付けと値引き","s":"業者Eが自ら売主の建物（代金3,000万円、手付300万円）について、手付を用意できない買主Fに「手付は3回の分割でよい」と持ちかけた。結局契約は成立しなかった。","p":"手付の分割・貸付け・後払いによる誘引は、契約が成立しなくても誘引した時点で違反（6か月以下の拘禁刑等の対象）。手付の減額や提携ローンのあっせんは違反でない。","kw":["手付","分割","貸付け","信用の供与","誘引"]},{"t":"守秘義務の例外","s":"業者Gの従業者Hは、売主Iの住宅ローン滞納の事情を知った。Hは退職後、知人に話した。一方Gは、Iの承諾を得て買主候補に事情を説明し、後に裁判で証人としても証言した。","p":"退職後に知人へ話すのは違反（従業者でなくなった後も守秘義務は続く）。本人の承諾や証人としての証言は「正当な理由」に当たり違反でない。","kw":["秘密","正当な理由","承諾","証人","退職"]}],"around":[{"h":"罰則の重さを比較","b":"重要事項の故意の不告知・不実告知は2年以下の拘禁刑又は300万円以下の罰金（法人は1億円以下）、不当に高額な報酬の要求は1年以下又は100万円以下、守秘義務違反は50万円以下の罰金で告訴が必要。"},{"h":"断定的判断の提供","b":"「必ず値上がりする」など利益が確実と誤解させる断定的判断や、将来の環境・交通の利便について誤解させる断定的判断は、故意がなくても禁止される。"},{"h":"預り金と撤回","b":"申込みの撤回時に、既に経費がかかった等の理由で預り金の返還を拒むことは禁止。手付として受領した後の解約は手付解除のルールで処理する。"},{"h":"人の死の告知","b":"国土交通省ガイドラインでは、賃貸借で自然死・日常生活の不慮の死以外の死（又は特殊清掃）があった場合、おおむね3年経過後は原則告げなくてよい。売買には期間の目安がない。"},{"h":"犯罪収益移転防止法","b":"宅地建物の売買とその代理・媒介は特定取引で、取引時確認を行い、確認記録・取引記録を7年間保存する。"}]},"業法|広告":{"pts":["未完成物件は開発許可・建築確認等の処分があった後でなければ広告できない。この広告開始時期の制限は売買だけでなく貸借にも及ぶ。","契約締結時期の制限（処分前の売買・交換の契約禁止）は貸借には適用されない。広告と契約で範囲が異なる。","確認後に変更確認を申請中なら、変更予定である旨と当初の確認内容を併記すれば広告できる。確認申請中の表示では広告できない。","所在・規模・形質、利用の制限、環境・交通、代金・借賃、代金の融資等について、著しく事実に相違する表示や誤認させる表示は禁止。","誇大広告は広告した時点で違反で、取引成立や問合せの有無は問わない。成約済み物件の掲載継続もおとり広告として違反。","誇大広告等は監督処分の対象で、6か月以下の拘禁刑又は100万円以下の罰金（併科あり）が科され得る。","取引態様の別は広告のたびに明示し、注文を受けたときにも改めて遅滞なく明示する。自ら貸主の募集広告は業法の規制外。"],"traps":["「建築確認申請中と明示すれば広告できる」と出たら×。確認を受けるまで広告できない。","「確認前でも貸借の媒介の広告はできる」と出たら×。広告開始時期の制限は貸借にも及ぶ。","「問合せや申込みがなければ誇大広告でも違反でない」と出たら×。広告をした時点で違反が成立する。"],"rel":["税他|景品表示法","業法|報酬","業法|監督・罰則"],"bridge":"広告の表示ルールは景品表示法・公正競争規約でも細かく規制される。依頼者の依頼による広告料金は報酬とは別に受領できる点は報酬の論点で問われる。","sys":{"overview":"業法の広告規制は、誇大広告等の禁止、広告開始時期の制限、取引態様の明示の3本柱。開始時期制限は貸借にも及ぶが契約締結時期制限は及ばない点、違反は広告した時点で成立する点を押さえれば得点できる。","tree":[{"h":"誇大広告等","items":["著しく事実と相違・誤認させる表示の禁止","所在・規模・形質","現在・将来の利用の制限","環境・交通その他の利便","代金・借賃と金銭貸借のあっせん"]},{"h":"違反の成立","items":["広告した時点で違反成立","問合せ・取引成立の有無は不問","成約済み物件の掲載継続はおとり広告","表示しないことによる誤認も違反","監督処分＋6か月以下拘禁刑等の罰則"]},{"h":"開始時期制限","items":["工事完了前は処分後でなければ広告不可","処分＝開発許可・建築確認等","売買・交換・貸借すべてに適用","確認申請中の表示があっても不可","変更確認申請中は当初内容等の併記で可"]},{"h":"契約時期制限","items":["工事完了前は処分後でなければ契約不可","売買・交換（代理・媒介含む）に適用","貸借には適用されない","予約も契約と同じく制限"]},{"h":"取引態様の明示","items":["自ら当事者・代理・媒介の別","広告をするたびに明示","注文を受けたときも遅滞なく明示","口頭でも可、業者相手でも必要","自ら貸主・転貸の広告は業法の対象外"]},{"h":"広告料金","items":["報酬と別の受領は原則不可","依頼者の依頼による広告の実費は可","依頼がなければ受領できない"]}],"flow":{"title":"広告を出す前の確認","steps":["自ら貸主・転貸なら業法の広告規制外","工事完了前か確認","完了前なら開発許可・建築確認等を受けたか","変更確認申請中なら当初内容と予定を併記","取引態様の別を明示","表示内容に誤認のおそれがないか確認"]},"tables":[{"title":"時期制限の適用範囲","head":["取引","広告開始時期","契約締結時期"],"rows":[["売買","○制限","○制限"],["交換","○制限","○制限"],["貸借","○制限","×制限なし"],["代理・媒介","○制限","○（貸借除く）"]]},{"title":"広告できるか","head":["状態","広告"],"rows":[["建築確認申請中","×"],["「確認申請済」と表示","×"],["建築確認後","○"],["確認後に変更確認申請中","○（併記すれば）"],["開発許可申請中","×"]]},{"title":"誇大広告の判定","head":["ケース","違反"],"rows":[["問合せがない","○違反"],["取引が成立しなかった","○違反"],["成約済み物件を掲載継続","○違反"],["利用制限の一部を省き誤認","○違反"],["ネット広告","○違反（媒体不問）"]]}]},"ex":[{"t":"確認前の賃貸物件","s":"業者Aは、建築確認を申請中の新築賃貸マンションについて、貸主Bから入居者募集の媒介を依頼された。確認はまだ下りていない。","p":"広告開始時期の制限は貸借にも及ぶので、確認前は募集広告ができない。一方、契約締結時期の制限は貸借に及ばないので、賃貸借契約の媒介をして成立させることはできる。","kw":["建築確認","申請中","貸借","媒介","広告"]},{"t":"変更確認の申請中","s":"業者Cの分譲マンションは建築確認を受けた後、間取り変更のため変更の確認を申請している。Cはパンフレットを作りたい。","p":"変更確認を受ける予定である旨と当初の確認の内容を併せて表示すれば広告できる。当初の確認すらない「確認申請済」の表示では広告できない。","kw":["変更の確認","当初の確認","併せて表示","建築確認申請済","パンフレット"]},{"t":"成約済みの掲載継続","s":"業者Dは、3月に売買契約が成立した宅地の広告をポータルサイトに5月まで掲載し続けた。その間、問合せは1件もなかった。","p":"取引できない物件の広告はおとり広告として誇大広告等の禁止に違反し、問合せや損害がなくても掲載した時点で違反。6か月以下の拘禁刑又は100万円以下の罰金（併科あり）の対象。","kw":["誇大広告","おとり広告","インターネット","問合せ","成約"]}],"around":[{"h":"取引態様の明示","b":"広告をするたびに明示し、注文を受けたら改めて遅滞なく明示する（広告で明示済みでも省略不可）。口頭でもよく、書面は不要。"},{"h":"自ら貸主の広告","b":"自ら貸主（サブリースの転貸を含む）は宅建業に当たらないため、その募集広告には取引態様の明示などの業法の広告規制が及ばない。"},{"h":"広告料金の受領","b":"報酬とは別に広告料金を受け取れるのは、依頼者の依頼によって行った特別の広告の実費だけ。通常の広告費は報酬に含まれる。"},{"h":"業務停止中の広告","b":"業務の全部停止を命じられた期間中は、広告も業務に含まれるため行えない。処分を受けていない業者の広告開始時期の制限とは別の理由で不可となる点に注意。"},{"h":"広告と契約の時期","b":"広告開始時期の制限は売買・交換・貸借すべて、契約締結時期の制限は売買・交換のみ（貸借は対象外）。表で範囲の違いを押さえる。"}]},"業法|媒介契約":{"pts":["34条の2の規制は宅地建物の売買・交換の媒介・代理に適用され、貸借の媒介には適用されない。相手が宅建業者でも書面交付は必要。","契約後遅滞なく業者が記名押印した書面を交付する（依頼者の承諾で電磁的方法も可）。宅建士の記名は不要。","専任・専属専任の有効期間は3か月以内で、超える定めは3か月に短縮。更新は依頼者の申出による場合のみで、自動更新特約は無効。","業務処理状況の報告は専任が2週間に1回以上、専属専任が1週間に1回以上（休業日を含む）。方法は口頭でもよい。","指定流通機構への登録は専任が契約日から7日以内、専属専任が5日以内（いずれも休業日を除く）。登録証明書は遅滞なく依頼者に引き渡す。","申込みがあれば種類を問わず遅滞なく依頼者に報告する。価額に意見を述べるときは根拠を示す（方法自由・費用請求不可）。","書面には売買すべき価額、既存建物の建物状況調査を実施する者のあっせんに関する事項（あっせん無しでもその旨）等を記載する。"],"traps":["「専任媒介の登録期限は休業日を含めて7日以内」と出たら×。休業日を除いて7日以内。","「一般媒介なら書面に売買すべき価額の記載は不要」と出たら×。価額は全媒介契約の必要的記載事項。","「依頼者の申出がなければ自動更新する特約は有効」と出たら×。更新は依頼者の申出がある場合に限る。"],"rel":["業法|報酬","業法|重要事項説明","業法|37条書面"],"bridge":"媒介契約書は業者の記名押印で依頼者（売主側が多い）に交付、35条書面と37条書面は宅建士の記名が必要。誰が何に記名し誰に交付するかで混同しやすい。","sys":{"overview":"宅建業者の業務規制のうち、売買・交換の媒介・代理の依頼を受けた場面のルール。3種類の媒介契約の違い（有効期間・報告・指定流通機構登録）と、媒介契約書面の記載事項を数字ごと押さえれば得点源になる。","tree":[{"h":"適用範囲","items":["宅地建物の売買・交換の媒介・代理","貸借の媒介・代理には適用なし","依頼者が宅建業者でも適用あり"]},{"h":"契約の種類","items":["一般：複数業者に重ねて依頼可","専任：他業者への依頼不可・自己発見可","専属専任：自己発見取引も不可","一般は明示型・非明示型がある"]},{"h":"専任系の規制","items":["有効期間3か月以内（超過分は3か月に）","更新は依頼者の申出時のみ・自動更新不可","報告：専任2週1回・専属1週1回以上","機構登録：専任7日・専属5日（休業日除く）","申込み受付状況も登録し変更時は更新"]},{"h":"全類型の義務","items":["契約後遅滞なく書面交付（業者が記名押印）","依頼者の承諾で電磁的方法も可","価額の意見には根拠明示（費用請求不可）","申込みは遅滞なく依頼者へ報告"]},{"h":"書面記載事項","items":["物件特定・売買すべき価額・報酬","媒介契約の種類・有効期間・解除","建物状況調査のあっせんの有無（既存建物）","標準媒介契約約款に基づくか否か","依頼者の違反時の措置・機構登録事項"]}],"flow":{"title":"専任媒介の手続の流れ","steps":["依頼受付・価額に意見なら根拠を明示","媒介契約締結→遅滞なく書面交付","指定流通機構へ登録（専任7日・専属5日）","登録証明書を遅滞なく依頼者へ引渡し","業務処理状況を定期報告（2週・1週）","申込みがあれば遅滞なく依頼者へ報告","成約したら遅滞なく機構へ通知"]},"tables":[{"title":"媒介契約3類型の比較","head":["項目","一般","専任","専属専任"],"rows":[["他業者への重ねた依頼","○","×","×"],["自己発見取引","○","○","×"],["有効期間の制限","なし","3か月以内","3か月以内"],["業務処理状況の報告","義務なし","2週に1回以上","1週に1回以上"],["機構への登録","任意","7日以内","5日以内"],["申込みの報告","必要","必要","必要"],["書面の交付","必要","必要","必要"]]},{"title":"日数の数え方","head":["義務","期間","休業日"],"rows":[["機構登録（専任）","契約日から7日以内","除く"],["機構登録（専属専任）","契約日から5日以内","除く"],["業務報告（専任）","2週間に1回以上","含む"],["業務報告（専属専任）","1週間に1回以上","含む"]]}]},"ex":[{"t":"登録期限の数え方","s":"宅建業者Aは4月1日に売主Bと中古マンションの専属専任媒介契約を結んだ。Aの休業日は4月3日だけで、ほかの日はすべて営業している。","p":"専属専任は契約日から5日以内（休業日を除く）に指定流通機構へ登録する。契約日の翌日から数え、4月3日を飛ばして4月7日までに登録すればよい（専任媒介なら7日以内）。","kw":["専属専任媒介契約","指定流通機構","休業日","5日以内","登録"]},{"t":"6か月の約定と更新","s":"AはBと専任媒介契約を結び、有効期間を6か月とし、「期間満了時にBから異議がなければ自動で更新する」と定めた。","p":"3か月を超える部分だけが無効となり、有効期間は3か月になる（契約全体は無効にならない）。更新はBの申出がある場合に限られるので、自動更新の特約は無効。更新後の期間も3か月以内。","kw":["有効期間","3か月","自動更新","依頼者の申出","専任媒介契約"]},{"t":"価額への意見と根拠","s":"売主Bは自宅を5,000万円で売りたいと希望したが、Aは近隣の成約事例から4,500万円が妥当と考え、その意見を伝えることにした。契約は一般媒介である。","p":"媒介契約の種類を問わず、価額に意見を述べるときは根拠を明らかにしなければならない。根拠の示し方は口頭でもよく、そのための費用をBに請求することはできない。","kw":["売買すべき価額","意見","根拠","一般媒介契約","費用"]}],"around":[{"h":"貸借には適用なし","b":"34条の2の書面交付・期間・登録などの規制は売買・交換の媒介・代理が対象。賃貸の媒介では媒介契約書面の交付義務はない。"},{"h":"機構への登録事項","b":"所在・規模・形質、売買すべき価額、法令上の制限で主要なもの、専属専任ならその旨などを登録する。依頼者の氏名・住所は登録事項ではない。"},{"h":"成約したら通知","b":"登録物件の売買・交換の契約が成立したら、遅滞なく登録番号・取引価格・契約成立年月日を指定流通機構に通知する。"},{"h":"3つの書面の記名者","b":"媒介契約書面は宅建業者の記名押印、35条書面・37条書面は宅建士の記名。媒介契約書面に宅建士の記名は要らない。"},{"h":"一般媒介の明示型","b":"一般媒介には、重ねて依頼する他の業者を明示する義務がある「明示型」と、ない「非明示型」がある。どちらも書面交付と価額記載は必要。"}]},"業法|重要事項説明":{"pts":["契約成立までに、宅建士が宅建士証を提示（請求不要）のうえ記名した35条書面を交付して、買主・借主等に説明する。売主・貸主への説明は不要。","相手方が宅建業者なら書面交付のみで説明は不要。相手方の承諾があれば電磁的方法での提供やIT重説も可だが、宅建士証の提示は省略できない。","既存建物では1年以内（鉄筋コンクリート造等の共同住宅等は2年以内）の建物状況調査の有無と結果の概要を、売買・貸借とも説明する。","建築・維持保全の書類（検査済証・設計図書等）の保存状況は既存建物の売買・交換のみ説明。存在しなければその旨を説明する。","水害ハザードマップ上の所在地、造成宅地防災区域・土砂災害警戒区域・津波災害警戒区域内である旨は、売買・貸借を問わず説明する。","石綿調査の記録があればその内容、旧耐震（昭和56年5月31日以前着工）の耐震診断があればその内容を説明。業者に調査義務はない。","登記された権利（抹消予定でも）、代金以外の金銭の額と目的、契約解除、損害賠償予定・違約金、手付金等保全措置、担保責任の履行確保措置等を説明。"],"traps":["「代金の額・支払時期」「引渡しの時期」を重要事項として説明と出たら×。これらは37条書面の記載事項。","「IT重説なら相手方の承諾で宅建士証の提示を省略できる」と出たら×。画面上で視認できるよう提示が必要。","「水害ハザードマップの説明は貸借では不要」と出たら×。売買・交換・貸借いずれも必要。"],"rel":["業法|37条書面","業法|宅建士","業法|住宅瑕疵担保履行法"],"bridge":"35条は契約前に買主・借主へ説明（宅建士必須）、37条は契約後に両当事者へ交付（説明不要）。記載事項の振り分けが頻出で、引渡し時期・代金は37条側。","sys":{"overview":"宅建業法35条。契約成立前に、宅建士が買主・借主等へ書面を交付して説明する義務で、業法で最頻出の論点。説明の方法（誰が・誰に・いつ）と、売買／貸借・区分所有建物ごとの説明事項の振り分けが得点の鍵。","tree":[{"h":"説明の方法","items":["契約成立までに宅建士が説明（専任不要）","宅建士証は請求なしで提示・記名した書面","相手：買主・借主・交換の両当事者","売主・貸主への説明は不要","場所の制限なし"]},{"h":"特例","items":["相手方が業者なら書面交付のみで説明不要","承諾があれば書面を電磁的方法で提供可","IT重説も可。画面で宅建士証の提示必要"]},{"h":"物件の事項","items":["登記された権利（抹消予定でも）","法令上の制限・私道負担","飲用水・電気・ガス・排水の整備状況","未完成物件は完了時の形状・構造","災害区域・水害ハザードマップ上の所在地"]},{"h":"既存建物","items":["建物状況調査の有無・結果概要","調査は1年以内（RC共同住宅等は2年）","建築・維持保全書類の保存状況（売買のみ）","石綿調査の記録があればその内容","耐震診断はS56.6.1前着工の建物のみ"]},{"h":"取引条件","items":["代金・借賃以外の金銭の額と目的","契約解除・損害賠償予定・違約金","手付金等保全措置・支払金預り金保全","ローンのあっせん内容と不成立時の措置","担保責任の履行確保措置の有無"]},{"h":"区分・貸借","items":["区分：敷地権利・共用部分規約・積立金等","区分売買：管理業者が管理者を兼ねる旨","貸借：期間・更新・用途制限・敷金精算","貸借：管理委託先、建物は台所等の設備","定期借地・定期建物賃貸借である旨"]}],"flow":null,"tables":[{"title":"35条と37条の比較","head":["項目","35条書面","37条書面"],"rows":[["時期","契約成立まで","契約成立後遅滞なく"],["相手","買主・借主等","契約当事者双方"],["宅建士の記名","必要","必要"],["宅建士の説明","必要（業者相手は不要）","不要"],["宅建士証の提示","説明時に必要","不要"],["電磁的方法","承諾で可","承諾で可"],["代金額・引渡し時期","記載不要","必要的記載事項"]]},{"title":"取引態様別の説明要否","head":["説明事項","売買","貸借"],"rows":[["登記された権利","○","○"],["私道負担","○","建物貸借は×"],["建物状況調査の結果概要","○（既存）","○（既存）"],["建築・維持保全書類の保存","○（既存）","×"],["水害ハザードマップの所在地","○","○"],["石綿調査記録・耐震診断","建物のみ○","建物のみ○"],["手付金等保全措置","○","×"],["担保責任の履行確保措置","○","×"],["契約期間・更新・敷金精算","×","○"]]},{"title":"区分所有建物の追加事項","head":["説明事項","売買","貸借"],"rows":[["敷地に関する権利","○","×"],["共用部分の規約","○","×"],["専有部分の用途・利用制限","○","○"],["専用使用権の規約","○","×"],["修繕積立金・管理費","○","×"],["維持修繕の実施状況の記録","○","×"],["管理の委託先","○","○"],["管理業者が管理者等を兼ねる旨","○","×"]]}]},"ex":[{"t":"買主が宅建業者","s":"売主業者Aの媒介で、宅建業者Cが中古ビルを1億円で買うことになった。Aの宅建士は「相手も業者だから」と35条書面を渡すだけで説明を省いた。","p":"買主等が宅建業者なら、宅建士が記名した35条書面を交付すれば説明は不要。ただし書面の交付と宅建士の記名は省略できない。","kw":["宅地建物取引業者","35条書面","交付","説明","記名"]},{"t":"RC造マンションの調査","s":"築20年の鉄筋コンクリート造マンションの1室を売る。建物状況調査は1年6か月前に実施されていた。","p":"鉄筋コンクリート造等の共同住宅等は2年以内（それ以外は1年以内）の調査が対象なので、調査の実施と結果の概要を説明する。売買でも貸借でも同じ。","kw":["既存の建物","建物状況調査","結果の概要","共同住宅","1年"]},{"t":"IT重説と宅建士証","s":"買主Dの承諾を得て、宅建士Eがテレビ会議システムで重要事項を説明した。35条書面に記名したのは同じ事務所の宅建士Fである。","p":"IT重説でも宅建士証は画面越しに視認できるよう提示する必要がある。記名した宅建士と説明する宅建士が別人でも違反ではない（どちらも専任である必要はない）。","kw":["宅地建物取引士証","提示","テレビ会議","記名","承諾"]}],"around":[{"h":"マンション貸借の範囲","b":"区分所有建物の貸借では、専有部分の用途その他の利用制限と管理の委託先は説明するが、修繕積立金・管理費や共用部分の規約は説明不要。"},{"h":"代金は37条側","b":"代金・借賃の額や支払時期、引渡し時期は37条書面の記載事項。35条で説明するのは代金以外に授受される金銭の額と目的。"},{"h":"抹消予定の抵当権","b":"登記された権利は、引渡しまでに抹消される予定の抵当権でも説明が必要。登記されていない権利は対象外。"},{"h":"説明の場所は自由","b":"重要事項説明は事務所以外（買主の自宅・喫茶店など）で行ってもよい。時期は契約成立までであれば足りる。"},{"h":"士証不提示の制裁","b":"重要事項説明の際に宅建士証を提示しないと、宅建士は10万円以下の過料の対象。請求がなくても提示が必要。"}]},"業法|37条書面":{"pts":["契約成立後遅滞なく、契約当事者双方（自ら当事者なら相手方）に交付する。関与した業者全員に交付義務があり、相手方の承諾でも省略不可。","宅建士の記名が必要（専任でなくてよい、押印は不要）。説明義務はなく、交付は宅建士でない従業者でもよい。","相手方が宅建業者でも交付・宅建士の記名・必要的記載事項は省略できない。相手方の承諾があれば電磁的方法での提供も可。","必要的記載事項は当事者の氏名・住所、物件特定表示、代金・借賃の額と支払時期・方法、引渡し時期、売買では移転登記の申請時期など。","既存建物の売買・交換では、構造耐力上主要な部分等の状況について当事者双方が確認した事項が必要的記載事項（貸借は不要）。","任意的記載事項（解除、損害賠償予定・違約金、代金等以外の金銭、危険負担、担保責任特約、租税公課の負担等）は定めがあれば記載。","代金等以外の金銭は額・授受の時期・目的のすべてを記載する。未完成建物は重説で使用した図書の交付で特定表示に代えられる。"],"traps":["「37条書面は宅建士に内容を説明させなければならない」と出たら×。記名は必要だが説明義務はない。","「定めがなければ『定めなし』と記載する」と出たら×。任意的記載事項は定めがなければ記載不要。","「登記された抵当権の内容を37条書面に記載」と出たら×。登記された権利は35条書面の説明事項。"],"rel":["業法|重要事項説明","業法|媒介契約","業法|クーリング・オフ"],"bridge":"35条は契約前に説明、37条は契約後に交付で説明不要。クーリング・オフの告知書面は宅建士の記名不要で、書面ごとに記名の主体と要否を比較して覚える。","sys":{"overview":"宅建業法37条。契約成立後に、契約内容を書面化して当事者双方へ交付する義務。35条書面との違い（時期・相手・説明不要）と、必要的記載事項／任意的記載事項の振り分け、売買と貸借の差を押さえる。","tree":[{"h":"交付の方法","items":["契約成立後遅滞なく交付","相手：契約当事者双方（自ら当事者は相手方）","関与した業者全員に交付義務","承諾があれば電磁的方法で提供可"]},{"h":"宅建士の関与","items":["宅建士の記名が必要（専任不要・押印不要）","説明義務なし","交付は宅建士でない従業者でも可"]},{"h":"業者間の扱い","items":["相手方が業者でも交付省略不可","記名・記載事項も省略不可","承諾があっても交付は省略不可"]},{"h":"必要的記載","items":["当事者の氏名・住所、物件の特定表示","代金・借賃の額、支払時期・方法","引渡し時期","移転登記の申請時期（売買・交換）","既存建物の構造等の双方確認事項（売買）"]},{"h":"任意的記載","items":["代金等以外の金銭：額・時期・目的","契約解除、損害賠償予定・違約金","危険負担（天災等の損害負担）","担保責任の特約・履行確保措置","ローン不成立時の措置、租税公課の負担"]}],"flow":null,"tables":[{"title":"売買と貸借の記載事項","head":["記載事項","売買","貸借"],"rows":[["代金・借賃の額・支払時期・方法","必要","必要"],["引渡し時期","必要","必要"],["移転登記の申請時期","必要","不要"],["既存建物の構造等確認事項","必要","不要"],["代金等以外の金銭","定めあれば","定めあれば"],["解除・損害賠償予定・違約金","定めあれば","定めあれば"],["危険負担","定めあれば","定めあれば"],["担保責任・ローンあっせん","定めあれば","不要"],["租税公課の負担","定めあれば","不要"]]},{"title":"書面ごとの記名と説明","head":["書面","記名する者","説明"],"rows":[["媒介契約書","宅建業者（記名押印）","不要"],["35条書面","宅建士","宅建士が説明"],["37条書面","宅建士","不要"],["クーリング・オフ告知書面","宅建士の記名不要","書面で告知"]]}]},"ex":[{"t":"業者2社の交付義務","s":"売主側の媒介業者Aと買主側の媒介業者Bが共同で、Cの土地をDに3,000万円で売る契約を成立させた。AはBが書面を作るので自分は関係ないと考えた。","p":"契約に関与した業者全員に37条書面の交付義務がある。A・Bそれぞれが自社の宅建士に記名させ、売主C・買主D双方に交付する（共同で1通作成も可）。","kw":["媒介","37条書面","交付","記名","当事者双方"]},{"t":"敷金の記載方法","s":"Aの媒介で、月額借賃15万円・敷金30万円の店舗賃貸借が成立した。違約金の定めはない。","p":"敷金は代金等以外の金銭なので、額・授受の時期・目的のすべてを記載する。違約金は定めがないので記載不要（「なし」と書く必要もない）。貸借なので移転登記の申請時期も不要。","kw":["借賃以外の金銭","授受の時期","目的","違約金","定めがあるとき"]},{"t":"業者間でも省略不可","s":"宅建業者Aが自ら売主となり宅建業者Bに建物を売った。BはAに「業者同士なので書面は不要。どうしても出すならメールでよい」と伝えた。","p":"買主が業者でも37条書面の交付と宅建士の記名は省略できない。Bの承諾があれば、書面に代えて電磁的方法で提供することはできる。","kw":["宅地建物取引業者","相手方","省略","電磁的方法","承諾"]}],"around":[{"h":"35条との違い","b":"35条は契約前に買主・借主へ宅建士が説明、37条は契約後に当事者双方へ交付するだけで説明は不要。どちらも宅建士の記名は必要。"},{"h":"既存建物の確認事項","b":"既存建物の売買・交換では、構造耐力上主要な部分等について当事者双方が確認した事項を必ず記載する。貸借では不要。"},{"h":"危険負担・租税公課","b":"天災その他不可抗力による損害の負担、租税公課の負担は定めがあれば記載。租税公課の負担は貸借では記載事項でない。"},{"h":"不交付の罰則","b":"37条書面を交付しなかった業者は50万円以下の罰金の対象となり、指示・業務停止処分も受けうる。"},{"h":"交付者は誰でもよい","b":"記名は宅建士が必要だが、交付自体は宅建士でない従業者が行ってもよい。宅建士証の提示も不要。"}]},"業法|クーリング・オフ":{"pts":["宅建業者が自ら売主、買主が宅建業者でない売買で、事務所等以外の場所で申込み・契約をした場合に適用される。申込み場所で判断する。","事務所等には、事務所、契約行為等を行う土地に定着した案内所、媒介・代理業者の事務所等、買主が自ら申し出た自宅・勤務先が含まれる。","業者から書面で告げられた日から起算して8日を経過するか、引渡しを受け、かつ代金全部を支払ったときはできなくなる。","告知・撤回等は書面で行い、電磁的方法は不可。撤回等の効力は書面を発した時に生じる（発信主義）。告知書面に宅建士の記名は不要。","業者は損害賠償・違約金を請求できず、受領した手付金その他の金銭を速やかに全額返還する。","クーリング・オフの規定に反する買主に不利な特約は無効。期間を8日より長くするなど買主に有利な特約は有効。","テント張りなど土地に定着しない案内所や喫茶店・ホテルのロビー、業者の申出による買主の自宅・勤務先は事務所等に当たらない。"],"traps":["「買主の承諾があれば告知・撤回を電磁的方法で行える」と出たら×。書面に限られる。","「解除の効力は書面が業者に到達した時に生じる」と出たら×。書面を発した時に生じる。","「引渡しを受けたらクーリング・オフできない」と出たら×。引渡し＋代金全額支払の両方が必要。"],"rel":["業法|8種制限","業法|事務所・案内所","業法|37条書面"],"bridge":"クーリング・オフは8種制限の一つで、業者が売主・買主が非業者の取引に限られる。「事務所等」の範囲は専任宅建士を置く案内所の規制とセットで覚える。","sys":{"overview":"8種制限の一つ（宅建業法37条の2）。業者が自ら売主・買主が非業者の売買で、事務所等以外で申込み等をした買主を保護する制度。「事務所等」の範囲、8日の起算点、書面・発信主義を押さえる。","tree":[{"h":"適用要件","items":["宅建業者が自ら売主・買主は非業者","事務所等以外で申込み・契約","申込みと契約の場所が違えば申込み場所で判断"]},{"h":"事務所等","items":["売主業者の事務所","土地に定着し契約等を行う案内所","媒介・代理業者の事務所等","買主が自ら申し出た自宅・勤務先"]},{"h":"事務所等外","items":["テント張りなど定着しない案内所","喫茶店・ホテルのロビー","業者の申出による自宅・勤務先"]},{"h":"できない時","items":["書面告知の日から起算して8日経過","引渡し＋代金全額支払の両方済み","告知がなければ8日の期間は進行しない"]},{"h":"方法と効果","items":["告知・撤回等とも書面（電磁的方法不可）","効力は書面を発した時（発信主義）","損害賠償・違約金の請求不可","手付金等は速やかに全額返還","買主に不利な特約は無効、有利は有効"]}],"flow":{"title":"クーリング・オフ可否の判定","steps":["売主が業者・買主が非業者か（違えば不可）","申込み場所は事務所等か（該当なら不可）","自宅・勤務先は誰の申出か確認","書面告知から8日経過していないか","引渡し＋代金全額支払が済んでいないか","すべてクリアなら書面で撤回・解除可"]},"tables":[{"title":"場所ごとの可否","head":["申込みの場所","C・O"],"rows":[["売主業者の事務所","不可"],["媒介・代理業者の事務所","不可"],["土地に定着した案内所（契約等を行う）","不可"],["テント張りの案内所","可"],["喫茶店・ホテルのロビー","可"],["買主が申し出た自宅・勤務先","不可"],["業者が申し出た自宅・勤務先","可"]]},{"title":"書面と時点の整理","head":["場面","ルール"],"rows":[["業者の告知","書面のみ・宅建士記名不要"],["買主の撤回・解除","書面のみ"],["効力発生","書面を発した時"],["期間","告知日から起算8日"],["期間延長の特約","有効（買主に有利）"]]}]},"ex":[{"t":"申込みと契約が別","s":"買主Bは、売主業者Aが分譲地に設けたテント張りの案内所で購入を申し込み、2日後にAの事務所で売買契約を結んだ。","p":"申込みと契約の場所が違うときは申込みの場所で判断する。テント張りの案内所は事務所等に当たらないので、事務所で契約していてもクーリング・オフできる。","kw":["テント張り","案内所","申込み","事務所","契約の解除"]},{"t":"8日の起算と発信主義","s":"Aは10月1日にクーリング・オフについて書面で告げた。Bは10月8日に解除の書面を郵送し、Aに届いたのは10月10日だった。","p":"告げられた日を1日目として8日を数えるので期限は10月8日。解除は書面を発した時に効力を生じるため、到達が10日でも解除は有効。","kw":["書面で告げられた日","起算して8日","書面を発した時","郵送","効力"]},{"t":"買主が指定した喫茶店","s":"買主Bが「自宅近くの喫茶店で説明を聞きたい」と自ら申し出て、Aの担当者とその喫茶店で買受けの申込みをした。","p":"買主の申出で事務所等になるのは自宅と勤務先だけ。喫茶店は買主が指定しても事務所等に当たらず、クーリング・オフできる。","kw":["喫茶店","自ら申し出た","自宅","勤務先","買受けの申込み"]}],"around":[{"h":"告知がない場合","b":"業者が書面で告げなければ8日の期間は進行しない。ただし引渡しを受け代金全額を支払えば、告知がなくてもできなくなる。"},{"h":"業者の返還義務","b":"クーリング・オフされた業者は、受け取った手付金などを速やかに全額返還する。損害賠償や違約金は請求できない。"},{"h":"専任宅建士との関係","b":"土地に定着し契約・申込みを受ける案内所は事務所等に当たり、専任の宅建士の設置と50条2項の届出も必要になる。"},{"h":"媒介業者の事務所","b":"売主業者から媒介・代理を頼まれた別の業者の事務所で申し込んだ場合も、事務所等での申込みとなりクーリング・オフできない。"},{"h":"8種制限の一つ","b":"買主が宅建業者なら適用されない。売主が業者でない（個人売主を業者が媒介する）場合も適用されない。"}]},"業法|8種制限":{"pts":["8種制限は宅建業者が自ら売主、買主が宅建業者でない場合のみ適用。業者間取引には適用されない。","損害賠償額の予定と違約金は合算して代金の2/10以内。超える部分は無効。予定がなければ実損額を請求できる。","手付は代金の2/10以内で、常に解約手付となる。相手方の履行着手前なら、買主は放棄、売主業者は倍額の現実の提供で解除できる。","担保責任の通知期間を「引渡しから2年以上」とする特約以外で民法より買主に不利な特約は無効。無効なら民法の原則（知った時から1年）に戻る。","手付金等保全措置は未完成物件で代金の5%超又は1,000万円超、完成物件で10%超又は1,000万円超のとき、受領前に講じる。","未完成物件の保全措置は保証委託契約か保証保険契約のみ、完成物件はこれに指定保管機関の手付金等寄託契約が加わる。講じなければ買主は支払拒否できる。","他人物・未完成物件の売買は原則禁止（停止条件付取得契約は不可）。割賦販売の解除は30日以上の書面催告が必要、代金の3/10超受領後は所有権留保不可。"],"traps":["「担保責任を引渡しから1年とする特約は有効」と出たら×。2年以上でなければ無効。","「売主業者は手付と同額を返還すれば解除できる」と出たら×。倍額を現実に提供する必要がある。","「業者間取引でも損害賠償予定は2割まで」と出たら×。8種制限は業者間には適用されない。"],"rel":["業法|クーリング・オフ","権利|売買・契約不適合","業法|住宅瑕疵担保履行法"],"bridge":"8種制限は民法の売買・契約不適合の原則を買主有利に修正するもの。新築住宅の構造部分の10年責任は品確法・履行法の資力確保措置とセットで出る。","sys":{"overview":"宅建業者が自ら売主・買主が非業者の売買にだけ適用される8つの規制（業者間には不適用）。民法の原則を買主有利に修正する点が軸で、2/10・5%・10%・1,000万円・2年・30日・3/10の数字が頻出。","tree":[{"h":"適用場面","items":["業者が自ら売主・買主が非業者","業者間取引・業者が買主の場合は不適用","媒介・代理の場合は不適用"]},{"h":"契約の制限","items":["クーリング・オフ（8日）","他人物・未完成物件の売買の原則禁止","未完成は保全措置を講じれば売買可","損害賠償予定＋違約金は合計2/10以内"]},{"h":"手付の規制","items":["手付は代金の2/10以内・常に解約手付","相手方の履行着手前なら解除可","買主は放棄、売主は倍額を現実に提供","買主に不利な特約は無効"]},{"h":"保全措置","items":["未完成：5%超又は1,000万円超で必要","完成：10%超又は1,000万円超で必要","受領前に講じる。なければ支払拒否可","買主が所有権登記をしたら不要"]},{"h":"担保責任","items":["民法より買主に不利な特約は無効","例外：通知期間を引渡しから2年以上","無効なら民法（知った時から1年通知）"]},{"h":"割賦販売","items":["解除・一括請求は30日以上の書面催告","3/10超受領後は所有権留保不可","譲渡担保による留保も同様に制限"]}],"flow":{"title":"手付金等保全措置の要否","steps":["業者が売主・買主は非業者か確認","買主が所有権登記をしたか（済なら不要）","契約時に未完成物件か完成物件か判定","受領額累計が代金の5%（完成10%）超か","又は1,000万円超か（どちらも以下なら不要）","超えるなら受領前に全額について措置"]},"tables":[{"title":"8種制限の一覧","head":["制限","ポイント"],"rows":[["クーリング・オフ","告知から8日・書面・発信主義"],["他人物売買等の制限","取得契約（停止条件付除く）・保全措置で可"],["損害賠償予定等","違約金と合計2/10以内"],["手付の額・性質","2/10以内・解約手付"],["手付金等保全措置","未完成5%・完成10%・1,000万円"],["担保責任の特約","引渡しから2年以上のみ有効"],["割賦販売の解除等","30日以上の書面催告"],["所有権留保等の禁止","3/10超受領後は留保不可"]]},{"title":"保全措置の比較","head":["項目","未完成物件","完成物件"],"rows":[["必要となる額","5%超又は1,000万円超","10%超又は1,000万円超"],["保証委託契約","○","○"],["保証保険契約","○","○"],["指定保管機関の寄託","×","○"]]},{"title":"代金別の上限（計算例）","head":["代金","手付・賠償予定上限","保全不要の上限"],"rows":[["2,000万円・未完成","400万円","100万円まで"],["2,000万円・完成","400万円","200万円まで"],["5,000万円・未完成","1,000万円","250万円まで"],["1億2,000万円・完成","2,400万円","1,000万円まで"]]}]},"ex":[{"t":"未完成物件の保全措置","s":"売主業者Aが建築前のマンションを代金5,000万円で一般の買主Bに売り、契約時に手付250万円、その後中間金250万円を受け取る予定である。","p":"未完成物件は代金の5%（250万円）超で保全措置が必要。手付250万円はちょうど5%なので不要だが、中間金を受け取ると累計500万円となるため、中間金の受領前に500万円全額について保全措置を講じる。","kw":["手付金等","保全措置","未完成","5%","中間金"]},{"t":"損害賠償予定の上限","s":"売主業者Aと一般の買主Bが代金4,000万円の建物売買で、債務不履行の損害賠償予定額を1,000万円と定めた。違約金の定めはない。","p":"損害賠償予定と違約金は合計で代金の2/10（800万円）が上限。超える200万円部分だけが無効となり、予定額は800万円となる。","kw":["損害賠償の額を予定","違約金","10分の2","超える部分","無効"]},{"t":"担保責任期間の特約","s":"売主業者Aが一般の買主Bに中古住宅を売り、「契約不適合責任の通知期間は引渡しから1年」とする特約を結んだ。","p":"引渡しから2年以上とする特約以外で民法より不利な特約は無効。1年の特約は無効となり、民法の原則どおりBが不適合を知った時から1年以内に通知すればよい。","kw":["担保責任","特約","引渡しの日から2年","通知","無効"]}],"around":[{"h":"不適用の場面","b":"業者間の売買、業者が買主の売買、業者が媒介・代理するだけの売買には8種制限は適用されない。売主が業者・買主が非業者のときだけ。"},{"h":"手付金等の範囲","b":"契約締結日以後、引渡し前に支払われ代金に充当される金銭はすべて手付金等。名目が中間金・内金でも対象になる。"},{"h":"手付解除の期限","b":"手付による解除は相手方が履行に着手するまで。売主業者は倍額を現実に提供する必要があり、口頭で伝えるだけでは足りない。"},{"h":"保全措置が不要な時","b":"買主が所有権の登記をしたとき、または受領額が基準以下（未完成物件は代金の5%以下かつ1,000万円以下、完成物件は10%以下かつ1,000万円以下）のときは保全措置は不要。"},{"h":"他人物売買の例外","b":"売主業者が物件を取得する契約（予約を含む）を結んでいれば売買できる。ただし取得契約が停止条件付きの場合は不可。"}]},"業法|報酬":{"pts":["売買の媒介の上限は、代金（税抜）200万円以下5%、200万円超400万円以下4%、400万円超3%。400万円超は「3%＋6万円」で計算し消費税を加える。","代理は媒介の2倍以内。同一取引で双方から受領する場合も合計で媒介報酬の2倍以内に収める。","代金800万円以下の宅地建物（低廉な空家等）の売買・交換の媒介は、事前に依頼者と合意すれば売主・買主それぞれから30万円（＋税）まで受領できる（2024年改正）。代理はその2倍以内。","貸借の媒介は双方合計で借賃1か月分（＋税）以内。居住用建物は承諾がない限り依頼者の一方から0.5か月分（＋税）まで。","長期の空家等（1年超不使用等）の貸借の媒介は、事前合意により貸主・借主合計で借賃2か月分（＋税）まで受領できる特例があるが、居住用の借主からは通常どおり0.5か月分（＋税）が上限。","居住用以外の建物の貸借で権利金の授受があれば、権利金を売買代金とみなして計算できる。居住用建物には適用されない。","報酬とは別に受領できるのは、依頼者の依頼による広告料金と、依頼者の特別の依頼による費用で事前に承諾を得たものだけ。"],"traps":["「双方の承諾があれば居住用貸借で合計1か月分超を受領できる」と出たら×。合計1か月分（＋税）が上限（長期の空家等の特例を除く）。","「低廉な空家等の特例は売主からの報酬のみ」と出たら×。2024年改正で買主からの媒介報酬にも適用される。","「契約書作成費用を報酬とは別に受領できる」と出たら×。通常業務の費用は報酬に含まれる。"],"rel":["業法|媒介契約","業法|広告","業法|監督・罰則"],"bridge":"報酬は媒介契約に基づく成功報酬で、上限超過は業務停止処分や罰則の対象。依頼者の依頼による広告料金のみ別途受領できる点が広告の論点と交差する。","sys":{"overview":"宅建業法46条と国土交通大臣告示による報酬の上限規制。売買の速算式（5%・4%＋2万・3%＋6万）、代理は2倍、貸借は1か月分、居住用は0.5か月分、2024年改正の空家等特例を計算できれば得点できる。","tree":[{"h":"売買の媒介","items":["200万円以下：5%","200万超400万以下：4%＋2万円","400万円超：3%＋6万円","代金は税抜で計算し最後に消費税加算","交換は高い方の価額で計算","免税業者は税抜額に4%上乗せ"]},{"h":"売買の代理","items":["媒介報酬の2倍以内","相手方からも受領なら合計2倍以内"]},{"h":"空家等特例","items":["800万円以下の宅地建物（低廉な空家等）","売主・買主それぞれ30万円（＋税）まで","事前に依頼者へ説明し合意が必要","長期空家等の貸借：合計2か月分まで","長期空家等＝1年超不使用等の建物","代理の特例は媒介特例額の2倍以内"]},{"h":"貸借","items":["双方合計で借賃1か月分（＋税）以内","居住用建物：一方から0.5か月分","居住用でも依頼者の承諾で一方1か月分可","非居住用は権利金を代金とみなし計算可"]},{"h":"別途受領","items":["依頼者の依頼による広告料金","特別の依頼による費用で事前承諾あり","契約書作成費等の通常費用は不可"]}],"flow":null,"tables":[{"title":"売買媒介の速算式","head":["代金（税抜）","上限（税抜）"],"rows":[["200万円以下","代金×5%"],["200万円超400万円以下","代金×4%＋2万円"],["400万円超","代金×3%＋6万円"],["800万円以下の空家等","各依頼者から30万円まで（事前合意）"],["代理","上記の2倍以内"]]},{"title":"貸借の報酬上限","head":["区分","上限（税抜）"],"rows":[["貸借の媒介（原則）","双方合計で借賃1か月分"],["居住用建物の媒介","一方から0.5か月分（承諾で1か月）"],["貸借の代理","借賃1か月分（相手方と合計）"],["非居住用で権利金あり","権利金を代金とみなし計算可"],["長期の空家等（特例）","貸主から上乗せ、合計2か月分"],["使用貸借","通常の借賃を基準に計算"]]},{"title":"計算例（課税業者）","head":["取引","税抜","税込"],"rows":[["売買媒介 1,000万円","36万円","39.6万円"],["売買代理 1,000万円","72万円","79.2万円"],["売買媒介 300万円","14万円","15.4万円"],["600万円・空家特例（一方から）","30万円","33万円"],["居住用貸借 月10万円・一方","5万円","5.5万円"]]}]},"ex":[{"t":"3,000万円の媒介報酬","s":"課税業者Aが売主B・買主Cの双方から依頼を受け、代金3,000万円（税抜）の土地の売買を媒介した。","p":"3,000万円×3%＋6万円＝96万円、税込で105万6,000円がB・Cそれぞれからの上限。双方から受け取れば合計211万2,000円で、媒介報酬の2倍以内に収まるため適法。","kw":["売買の媒介","3%＋6万円","消費税","双方","課税事業者"]},{"t":"400万円の空家の特例","s":"課税業者Aが、代金400万円（税抜）の古家付き土地の売買を、売主Bと買主Cの双方から媒介の依頼を受けて成立させた。媒介契約の前にB・Cそれぞれと報酬額を説明・合意している。","p":"通常の計算では400万円×4%＋2万円＝18万円（税込19万8,000円）だが、代金800万円以下の低廉な空家等の特例により、B・Cそれぞれから30万円（税込33万円）まで受け取れる。事前の合意がなければ通常計算が上限。","kw":["低廉な空家等","800万円以下","30万円","合意","買主"]},{"t":"居住用貸借の配分","s":"課税業者Aが月額借賃10万円のアパートの貸借を媒介した。借主Dからは媒介の依頼を受ける時に承諾を得ていない。","p":"居住用建物では承諾がない限り一方から借賃0.5か月分（5万円、税込5万5,000円）まで。貸主・借主の合計は1か月分（税込11万円）が上限で、承諾があっても超えられない。","kw":["居住の用に供する建物","貸借の媒介","0.5か月分","承諾","1か月分"]}],"around":[{"h":"代理と媒介の組合せ","b":"売主の代理業者と買主の媒介業者が関与した場合、2社の報酬合計は媒介報酬の2倍（代理の上限）以内でなければならない。"},{"h":"店舗の権利金","b":"居住用以外の建物の貸借で返還されない権利金があれば、権利金を売買代金とみなして計算した額と1か月分のいずれかを上限にできる。"},{"h":"長期の空家等の貸借","b":"長期間使われていない空家等の貸借の媒介では、貸主と事前に合意すれば合計で借賃2か月分（＋税）まで。上乗せは貸主からだけ。"},{"h":"免税業者の上限","b":"消費税の免税事業者は、税抜の報酬額に4%を上乗せした額が上限。10%の消費税相当額は加算できない。"},{"h":"交換の計算","b":"交換の媒介は、交換する物件のうち価額の高い方を基準に売買と同じ速算式で計算する。差金がある場合も高い方の価額で計算する。"}]},"業法|監督・罰則":{"pts":["必要的取消は欠格事由該当、不正手段による免許取得、業務停止事由で情状が特に重い、業務停止処分違反、免許後1年以内の事業不開始・1年以上休止など。","免許の条件違反、事務所の所在地等を確知できず公告から30日を経過しても申出がない場合は任意的取消。","指示・業務停止は免許権者のほか業務地の知事もできるが、免許取消は免許権者だけができる。業務停止は1年以内の期間。","監督処分の前には聴聞が必要で、審理は公開で行う。業務停止と免許取消は公告が必要、指示処分は公告不要。","国土交通大臣が消費者保護に関わる規定違反で大臣免許業者を処分する場合は、あらかじめ内閣総理大臣に協議する。","無免許営業・名義貸し・不正免許取得・業務停止違反は3年以下の拘禁刑か300万円以下の罰金（併科あり）、法人は1億円以下の罰金。","重要な事項の不告知・不実告知は2年以下の拘禁刑等、誇大広告は6か月以下の拘禁刑等。報酬額不掲示・標識不掲示は50万円以下の罰金。"],"traps":["「免許の条件違反は必ず取り消さなければならない」と出たら×。取り消すことが「できる」任意的取消。","「業務停止処分をしたときは公告不要」と出たら×。業務停止・免許取消は公告が必要で、不要なのは指示処分だけ。","「知事が大臣免許業者を処分するとき内閣総理大臣と協議」と出たら×。協議が必要なのは国土交通大臣が処分する場合。"],"rel":["業法|免許の基準","業法|免許","業法|宅建士"],"bridge":"必要的取消の多くは免許の基準（欠格事由）と表裏一体。宅建士に対する監督（指示・事務禁止・登録消除）も同じ構造なので並べて覚える。","sys":{"overview":"宅建業者・宅建士の違反に対する行政処分（指示・業務停止・免許取消）と刑事罰。必要的取消と任意的取消の区別、処分権者（免許権者／業務地の知事）、聴聞・公告の要否、罰則の重さの序列を押さえる。","tree":[{"h":"業者の処分","items":["指示処分：免許権者・業務地の知事","業務停止（1年以内）：同上","免許取消：免許権者のみ"]},{"h":"必要的取消","items":["欠格事由に該当","不正の手段で免許取得","業務停止事由で情状特に重い・停止違反","免許後1年以内に事業不開始・1年以上休止"]},{"h":"任意的取消","items":["免許に付された条件に違反","所在不明で公告後30日経過し申出なし"]},{"h":"手続","items":["処分前に聴聞（審理は公開）","聴聞は期日1週間前までに通知・公示","業務停止・取消は公告、指示は不要","大臣が消費者保護規定違反で処分→首相協議","知事が他の免許業者を処分→免許権者に報告等"]},{"h":"宅建士処分","items":["指示・事務禁止（1年以内）","登録消除は登録知事のみ","指示・事務禁止は行為地の知事も可"]},{"h":"罰則","items":["無免許・名義貸し等：3年以下拘禁刑","重要事項の不告知等：2年以下拘禁刑","誇大広告：6か月以下拘禁刑","法人重科：最大1億円以下の罰金"]}],"flow":{"title":"業者への監督処分の流れ","steps":["違反行為の発覚（報告徴収・立入検査等）","処分権者を確認（取消は免許権者のみ）","大臣処分で消費者保護規定なら首相と協議","聴聞を実施（期日の審理は公開）","指示・業務停止・免許取消の処分","業務停止・免許取消は公告（指示は不要）","他の行政庁が処分したら免許権者へ報告等"]},"tables":[{"title":"監督処分の比較","head":["処分","処分権者","公告"],"rows":[["指示処分","免許権者・業務地知事","不要"],["業務停止（1年以内）","免許権者・業務地知事","必要"],["免許取消","免許権者のみ","必要"],["宅建士の事務禁止","登録知事・行為地知事","不要"],["宅建士の登録消除","登録知事のみ","不要"]]},{"title":"主な罰則","head":["違反","罰則"],"rows":[["無免許営業・名義貸し","3年以下拘禁刑・300万円以下"],["不正手段の免許取得","3年以下拘禁刑・300万円以下"],["業務停止処分違反","3年以下拘禁刑・300万円以下"],["重要事項の不告知・不実告知","2年以下拘禁刑・300万円以下"],["不当に高額の報酬の要求","1年以下拘禁刑・100万円以下"],["誇大広告","6か月以下拘禁刑・100万円以下"],["限度額を超える報酬の受領","100万円以下の罰金"],["37条書面の不交付","50万円以下の罰金"],["報酬額・標識の不掲示","50万円以下の罰金"],["重説時の士証不提示・提出・返納違反","10万円以下の過料"]]}]},"ex":[{"t":"他県知事ができる処分","s":"甲県知事免許の業者Aが、乙県内の分譲現場で重要事項の説明をせずに契約を結んだ。","p":"乙県知事は業務地の知事としてAに指示処分・業務停止処分をできるが、免許取消は免許権者の甲県知事しかできない。乙県知事が処分したときは遅滞なく甲県知事に通知する。","kw":["業務地","知事","指示処分","業務停止","免許取消"]},{"t":"所在不明と30日","s":"丙県知事は業者Bの事務所の所在地を確知できないため、その事実を公告した。公告から30日を経過してもBから申出がない。","p":"公告から30日経過後に免許を取り消すことが「できる」（任意的取消）。2週間では足りず、必ず取り消さなければならないわけでもない。","kw":["所在地を確知できない","公告","30日","申出","取り消すことができる"]},{"t":"不告知の刑事罰","s":"法人業者Cの従業者が、売買の勧誘で物件の重大な欠陥をわざと告げずに契約させた。","p":"重要な事項の故意の不告知は2年以下の拘禁刑か300万円以下の罰金（併科あり）。行為者のほか法人Cも1億円以下の罰金の対象となる（両罰規定）。","kw":["重要な事項","故意に告げず","拘禁刑","罰金","法人"]}],"around":[{"h":"拘禁刑への変更","b":"2025年6月1日から懲役・禁錮は拘禁刑に一本化された。罰則や欠格事由の「禁錮以上の刑」は「拘禁刑以上の刑」と読む。"},{"h":"処分前の聴聞","b":"指示・業務停止・免許取消のいずれも、処分前に聴聞を行う。聴聞の期日における審理は公開で行う。"},{"h":"公告の要否","b":"業務停止と免許取消は公告が必要、指示処分は不要。宅建士に対する処分（指示・事務禁止・登録消除）は公告されない。"},{"h":"宅建士への処分","b":"宅建士には指示・事務禁止（1年以内）・登録消除がある。登録消除は登録知事のみ、指示・事務禁止は行為地の知事もできる。"},{"h":"検査拒否・報告拒否","b":"免許権者等の報告要求に応じない、立入検査を正当な理由なく拒むと、50万円以下の罰金の対象となる。"}]},"業法|住宅瑕疵担保履行法":{"pts":["宅建業者が自ら売主となり、宅建業者でない買主に新築住宅を引き渡す場合に、保証金の供託か保険契約締結による資力確保措置が必要。","対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵。これらの免責特約は品確法上無効で、資力確保義務は残る。","保証金は主たる事務所の最寄りの供託所に供託。販売戸数の算定では床面積55㎡以下の住宅は2戸をもって1戸と数える。","保険契約は国土交通大臣指定の保険法人と締結し、引渡しから10年以上有効でなければならない。買主の承諾があっても短縮できない。","基準日（毎年3月31日）ごとに、基準日から3週間以内に資力確保措置の状況を免許権者に届け出る。","届出をしないと、基準日の翌日から起算して50日を経過した日以後、新たに自ら売主となる新築住宅の売買契約を締結できない。","供託する場合は契約締結までに供託所の所在地等を書面（承諾があれば電磁的方法）で説明する。保険付き住宅は指定住宅紛争処理機関を利用できる。"],"traps":["「買主が宅建業者でも資力確保措置が必要」と出たら×。資力確保措置は買主が宅建業者でない場合に限られる。","「保証金は販売した新築住宅の所在地の最寄りの供託所に供託」と出たら×。主たる事務所の最寄りの供託所。","「床面積25㎡以下は3戸を1戸と数える」と出たら×。55㎡以下は2戸をもって1戸。"],"rel":["業法|8種制限","業法|営業保証金","業法|重要事項説明"],"bridge":"8種制限の担保責任特約制限が「特約の効力」の問題なのに対し、履行法は責任を確実に果たすための「お金の手当て」。供託先が主たる事務所最寄りという点は営業保証金と共通。","sys":{"overview":"品確法の新築住宅10年責任を確実に履行させるため、業者売主に保証金供託か保険加入を義務づける法律。適用場面、供託先、55㎡・2戸1戸、10年以上、基準日3月31日・3週間・50日の数字を押さえる。","tree":[{"h":"適用場面","items":["業者が自ら売主・買主は非業者","新築住宅の引渡し（媒介は対象外）","買主が業者なら資力確保措置不要","新築＝完成1年内かつ未入居の住宅"]},{"h":"対象の瑕疵","items":["構造耐力上主要な部分","雨水の浸入を防止する部分","品確法で10年責任・免責特約は無効"]},{"h":"保証金供託","items":["主たる事務所の最寄りの供託所","過去10年の供給戸数に応じた額","55㎡以下は2戸をもって1戸","契約締結までに供託所所在地等を書面説明"]},{"h":"保険契約","items":["国土交通大臣指定の保険法人と締結","引渡しから10年以上有効","買主の承諾でも期間短縮不可","保険付き住宅は指定住宅紛争処理機関可"]},{"h":"届出","items":["基準日：毎年3月31日","基準日から3週間以内に免許権者へ届出","未届出：基準日翌日から50日経過日以後","新たな新築住宅の売買契約が禁止"]}],"flow":{"title":"資力確保措置の手順","steps":["売主業者・非業者買主・新築住宅か確認","供託か保険契約かを選択","供託なら契約締結までに供託所等を説明","引渡し（保険は10年以上有効で締結）","基準日（3月31日）の状況を集計","3週間以内に免許権者へ届出"]},"tables":[{"title":"履行法の重要数字","head":["項目","内容"],"rows":[["責任期間","引渡しから10年"],["保険の有効期間","10年以上"],["戸数算定の特例","55㎡以下は2戸で1戸"],["基準日","毎年3月31日"],["届出期限","基準日から3週間以内"],["新規契約禁止","基準日翌日から50日経過日以後"]]},{"title":"営業保証金との比較","head":["項目","営業保証金","瑕疵担保保証金"],"rows":[["供託先","主たる事務所最寄り","主たる事務所最寄り"],["対象者","全宅建業者","新築住宅の業者売主"],["額の基準","事務所数","過去10年の供給戸数"],["保険で代替","×","○（保険契約）"]]}]},"ex":[{"t":"買主が業者・媒介のみ","s":"宅建業者Aは自ら売主として新築戸建てを宅建業者Bに売り、別の新築住宅では売主Cの媒介だけを行った。","p":"資力確保措置が必要なのは、宅建業者が自ら売主となり宅建業者でない買主に新築住宅を引き渡す場合だけ。Bへの売却も媒介も対象外。","kw":["自ら売主","宅地建物取引業者","新築住宅","媒介","資力確保措置"]},{"t":"55㎡以下の戸数計算","s":"Aが過去10年間に非業者へ引き渡した新築住宅は100戸で、うち40戸は床面積50㎡のワンルームである。","p":"床面積55㎡以下は2戸で1戸と数えるので、40戸は20戸分。保証金の算定戸数は60戸＋20戸＝80戸となる。","kw":["販売新築住宅","床面積55㎡以下","2戸をもって1戸","合計戸数","保証金"]},{"t":"基準日と50日の期限","s":"Aは3月31日の基準日の資力確保措置の状況を、免許権者に届け出ていない。","p":"届出期限は基準日から3週間以内（4月21日まで）。届出をしないと基準日の翌日（4月1日）から起算して50日を経過した日、つまり5月21日以後は新たに自ら売主となる新築住宅の売買契約を締結できない。","kw":["基準日","3週間以内","届出","50日を経過した日","売買契約"]}],"around":[{"h":"新築住宅の定義","b":"建設工事完了から1年以内で、まだ人が住んだことのない住宅。完成から1年を超えた売れ残りは新築住宅に当たらない。"},{"h":"保険の要件","b":"保険金額は2,000万円以上、有効期間は引渡しから10年以上が必要。保険料は売主業者が負担する。"},{"h":"品確法の10年責任","b":"新築住宅の構造耐力上主要な部分・雨水浸入防止部分の不具合は引渡しから10年責任を負う。特約で20年まで延ばせるが短縮は無効。"},{"h":"供託所の説明","b":"保証金を供託する場合は、売買契約を締結するまでに供託所の所在地等を記載した書面を交付して説明する（承諾があれば電磁的方法も可）。"},{"h":"営業保証金との違い","b":"供託先は同じ主たる事務所最寄りの供託所だが、額の基準は事務所数ではなく過去10年の供給戸数。保険契約で代替できる点も違う。"}]},"権利|意思表示・行為能力":{"pts":["通謀虚偽表示は当事者間で無効。ただし無効を善意の第三者に対抗できず、第三者は無過失や登記を要しない（94条2項）。","錯誤は無効でなく取消し。重要な錯誤が要件で、動機の錯誤はその事情が法律行為の基礎とされていると表示されていた場合に限る。","表意者に重過失があると錯誤取消しはできない。ただし相手方が悪意・重過失のとき又は共通錯誤のときは取り消せる。","詐欺取消しは善意無過失の第三者に対抗できない。第三者詐欺は相手方が詐欺を知り又は知ることができたときに限り取り消せる。","強迫による取消しは、第三者が善意無過失でも対抗できる。第三者による強迫でも相手方の善意・悪意を問わず取り消せる。","成年は18歳。未成年者の行為は法定代理人の同意が必要だが、単に権利を得・義務を免れる行為や許可された営業は単独でできる。","成年被後見人の行為は後見人の同意があっても取り消せる（日用品の購入等を除く）。制限行為能力者が詐術を用いたときは取消し不可。"],"traps":["「錯誤による意思表示は無効」と出たら×。2020年改正後は取消しで、善意無過失の第三者には対抗できない。","「虚偽表示の第三者は善意無過失でなければ保護されない」と出たら×。94条2項は善意で足り、登記も不要。","「強迫の取消しは善意無過失の第三者に対抗できない」と出たら×。保護されないのは詐欺の場合で、強迫は対抗できる。"],"rel":["権利|代理","権利|物権変動・対抗"],"bridge":"代理では意思表示の瑕疵を原則として代理人について判断する。取消し前の第三者は意思表示の規定で、取消し後の第三者は登記の先後（177条）で処理する。","sys":{"overview":"民法総則のうち、契約が有効に成立するかを左右する分野。意思表示の5類型（心裡留保・虚偽表示・錯誤・詐欺・強迫）の効果と第三者保護要件、制限行為能力者4類型の保護者の権限を比較で押さえれば得点できる。","tree":[{"h":"意思の欠缺","items":["心裡留保：原則有効、相手方悪意・有過失なら無効","虚偽表示：当事者間で無効、善意の第三者に対抗不可","虚偽表示の第三者は善意で足り無過失・登記不要"]},{"h":"錯誤","items":["重要な錯誤なら取消し（無効ではない）","動機の錯誤は基礎事情の表示が必要","表意者に重過失→原則取消し不可","相手方悪意・重過失、共通錯誤なら重過失でも可","善意無過失の第三者に対抗不可"]},{"h":"詐欺・強迫","items":["詐欺：取消し、善意無過失の第三者に対抗不可","第三者詐欺：相手方が悪意・有過失なら取消し可","強迫：取消し、第三者が善意無過失でも対抗可","第三者強迫：相手方の善意悪意を問わず取消し可"]},{"h":"制限行為能力","items":["成年は18歳（婚姻による成年擬制は廃止）","未成年者：同意なき行為は取消し可","成年被後見人：同意があっても取消し可","被保佐人：13条所定の重要行為に同意必要","被補助人：審判で定めた特定の行為のみ同意必要"]},{"h":"例外・相手方","items":["単に権利を得・義務を免れる行為は単独で可","許可された営業はその営業に関してのみ単独で可","日用品の購入等は成年被後見人も取消し不可","詐術を用いたときは取消し不可（21条）","相手方の催告：1か月以上の期間を定める"]},{"h":"取消し・追認","items":["取消権は追認できる時から5年で消滅","行為の時から20年でも消滅","取消し後は初めから無効、現存利益の返還（制限行為能力者）","取消し後の第三者とは登記の先後で決まる"]}],"flow":{"title":"錯誤取消しの判定","steps":["錯誤が法律行為の目的・取引通念上重要か","動機の錯誤なら基礎事情が表示されていたか","表意者に重大な過失がないか","重過失でも相手方悪意・重過失か共通錯誤なら可","要件充足→取消し可（はじめから無効）","第三者が善意無過失なら取消しを対抗できない"]},"tables":[{"title":"意思表示の5類型比較","head":["類型","効果","善意の第三者"],"rows":[["心裡留保","原則有効（悪意・有過失の相手方→無効）","対抗不可（善意で保護）"],["虚偽表示","無効","対抗不可（善意で保護）"],["錯誤","取消し","善意無過失なら対抗不可"],["詐欺","取消し","善意無過失なら対抗不可"],["強迫","取消し","対抗できる（保護なし）"]]},{"title":"制限行為能力者4類型","head":["類型","保護者","同意権","代理権"],"rows":[["未成年者","親権者・未成年後見人","○","○"],["成年被後見人","成年後見人","×（同意しても取消可）","○"],["被保佐人","保佐人","○（13条の行為）","審判で付与"],["被補助人","補助人","審判で定めた行為","審判で付与"]]},{"title":"相手方の催告と確答なし","head":["催告の相手","確答なしの効果"],"rows":[["能力者となった本人","追認とみなす"],["法定代理人・保佐人・補助人","追認とみなす"],["被保佐人・被補助人本人","取消しとみなす"]]}]},"ex":[{"t":"重過失の言い間違い","s":"Aは所有する甲土地を1,000万円で売るつもりだったが、確認を怠って売買契約書に「100万円」と記入し、Bが承諾した。Bは単に安いと思っただけで、Aの書き間違いに気づいていなかった。","p":"Aには重大な過失があるので、原則として錯誤取消しはできない（95条3項）。ただしBがAの錯誤を知っていた（又は重過失で知らなかった）場合や、Bも同じ錯誤に陥っていた場合は、Aは取り消せる。","kw":["錯誤","重大な過失","取り消すことができる","相手方が知っていた","同一の錯誤"]},{"t":"仮装譲渡と転得者","s":"Aは差押えを逃れるため、Bと示し合わせて甲土地をBに売ったことにし、B名義の登記をした。Bは事情を知らないCに2,000万円で甲土地を売り、Cは登記をしないまま代金を払った。Cは少し調べれば仮装と気づけた。","p":"Aは虚偽表示の無効をCに対抗できない。94条2項の第三者は善意であればよく、無過失も登記も不要だからである。一方、B名義の土地上の建物をBから借りただけの賃借人は、土地の仮装譲渡については第三者に当たらない（判例）。","kw":["通謀","虚偽表示","善意の第三者","過失","登記"]},{"t":"営業許可と詐術","s":"17歳のDは、親から古着販売の営業を許可されている。Dは仕入れのため古着50万円分を単独で購入し、さらに親の同意なく自分用に300万円の自動車を購入した。別の取引ではDが偽造の身分証で「20歳だ」と相手方を信じさせて土地を買った。","p":"営業に関する古着の仕入れは取り消せないが、営業と無関係な自動車の購入は同意がないので取り消せる（6条1項・5条2項）。詐術を用いて行為能力者と信じさせた土地の購入は取り消せない（21条）。","kw":["未成年者","営業の許可","法定代理人の同意","詐術","取り消すことができない"]}],"around":[{"h":"第三者保護の比較","b":"心裡留保・虚偽表示の無効は「善意」の第三者に対抗できず、錯誤・詐欺の取消しは「善意無過失」の第三者に対抗できない。強迫の取消しは善意無過失の第三者にも対抗できる。"},{"h":"第三者による詐欺・強迫","b":"相手方以外の者が詐欺をしたときは、相手方が詐欺を知り又は知ることができた場合に限り取り消せる。第三者による強迫は相手方の善意・悪意を問わず取り消せる。"},{"h":"意思無能力は無効","b":"泥酔や重度の認知症など意思能力がない状態でした法律行為は無効であり（3条の2）、取消しを待たない。後見開始の審判を受けているかどうかとは関係がない。"},{"h":"取消権の期間と取消権者","b":"取消権は追認できる時から5年、行為の時から20年で消滅する（126条）。錯誤・詐欺・強迫で取り消せるのは表意者本人とその代理人・承継人で、相手方は取り消せない（120条2項）。"},{"h":"離婚後の共同親権","b":"2026年4月1日施行の改正で、離婚後も父母の共同親権を選べるようになった。共同親権では未成年者の行為への同意も原則父母が共同で行い、監護・教育に関する日常の行為や急迫の事情があるときは一方が単独でできる（824条の2）。"}],"cases":[{"n":"最判昭和44年5月27日","f":"AはBと通謀して、A所有の土地をBに売ったことにし、B名義の登記をした。仮装であることを知らないCがBからこの土地を買ったが、Cはまだ所有権移転登記を受けていなかった。AはCに対し、AB間の売買は虚偽表示で無効だと主張した。","h":"94条2項の善意の第三者として保護されるために登記は要らない。AはCに無効を主張できない。","pt":"「第三者が登記を備えていなければ保護されない」と出たら×。94条2項の第三者は善意だけで足り、無過失も登記も要らない（無過失不要は大審院以来の判例）。","kw":["虚偽表示","善意の第三者","登記","対抗することができない","仮装譲渡"]},{"n":"最判昭和45年7月24日","f":"AとBが通謀して、A所有の土地をBに仮装譲渡した。事情を知っているCがBからこの土地を買い、さらに事情を知らないDがCから買い受けた。AはDに対して、AB間の売買の無効を主張した。","h":"虚偽表示の目的物を転得した者も94条2項の第三者に当たり、前の取得者Cが悪意でも、転得者D自身が善意であれば保護される。","pt":"「直接の第三者が悪意なら転得者も保護されない」と出たら×。善意・悪意は転得者ごとに判断する。","kw":["転得者","虚偽表示","善意","悪意","第三者"]},{"n":"最判昭和48年6月28日","f":"AはBと通謀して、A所有の土地をB名義に仮装譲渡した。Bにお金を貸していたCは、仮装と知らずにB名義のこの土地を差し押さえた。","h":"虚偽表示の目的物を差し押さえた債権者は94条2項の第三者に当たり、善意であればAは無効を対抗できない。","pt":"差押債権者は第三者に当たるが、仮装譲受人Bの単なる一般債権者（差押えをしていない者）は第三者に当たらない（大審院判例）。差押えの有無が分かれ目。","kw":["差押え","債権者","虚偽表示","第三者","善意"]},{"n":"最判昭和57年6月8日","f":"AはBと通謀して、A所有の甲土地をBに仮装譲渡した。Bは甲土地の上に乙建物を建て、仮装譲渡の事情を知らないCに乙建物を賃貸した。AはCに対し、甲土地の売買は無効だと主張した。","h":"土地の仮装譲受人が建てた建物の賃借人は、仮装譲渡された土地について法律上の利害関係を持つ者ではなく、94条2項の第三者に当たらない。","pt":"「建物の賃借人Cが善意なら、Aは土地の売買の無効を主張できない」と出たら×。土地そのものと建物の賃貸借とを区別するのがひっかけの急所。","kw":["建物の賃借人","土地","仮装譲渡","第三者に当たらない","法律上の利害関係"]},{"n":"最判昭和45年9月22日","f":"Bは、Aに無断でA所有の土地の登記をB名義に移した。Aはその事実を知ったが、何年も抹消せずに放置し、その間にB名義の登記を前提とする行動もとった。その後、B名義の登記を信じたCがBからこの土地を買い受けた。","h":"所有者Aが不実の登記を知りながら明示又は黙示に承認していたときは、94条2項を類推適用し、Aは善意のCに対して、Bが所有者でないことを主張できない。","pt":"通謀がなくても、真の所有者が虚偽の外観（不実の登記）を承認していれば94条2項が類推適用される。帰責性のある本人が負けるという考え方を押さえる。","kw":["類推適用","不実の登記","放置","承認","善意の第三者"]},{"n":"最判平成18年2月23日","f":"Aは、不動産の賃貸の手続を任せたBに、登記済証や印鑑登録証明書を預け、Bが差し出した登記申請書にも内容を確かめずに実印を押した。Bはこれを利用してA所有の土地を自分名義に登記し、事情を知らず過失もないCに売却した。","h":"Aは不実の登記を自ら知りながら放置したのと同視できるほど帰責性が重いとして、94条2項・110条を類推適用し、AはCに対して所有権を主張できない。","pt":"本人が不実登記を承認していなくても、帰責性が極めて重ければ保護される。ただしこの場合の第三者は善意だけでなく無過失も必要（110条の類推）である点が通常の94条2項と違う。","kw":["94条2項","110条","類推適用","善意無過失","帰責性","不実の登記"]},{"n":"最判昭和49年9月26日","f":"AはBにだまされて農地をBに売る契約をし、Bは知事の許可前で仮登記だけを受けた。Bは詐欺の事情を知らないCにその権利を譲り渡し、Cも本登記はしていなかった。その後AはBの詐欺を理由に売買を取り消した。","h":"詐欺取消しから保護される96条3項の第三者は、対抗要件（登記）を備えた者に限られない。Cは第三者として保護される。","pt":"現在の96条3項は、第三者が善意でかつ過失がないことを求める（2020年改正で無過失が必要になった）。登記は不要という点は虚偽表示と同じ。","kw":["詐欺","取消し","第三者","登記","善意無過失"]},{"n":"大判昭和17年9月30日","f":"AはBにだまされて甲土地をBに売り、B名義の登記がされた。Aが詐欺を理由に売買を取り消したが、登記をA名義に戻さないでいるうちに、BがCに甲土地を売却し、Cが登記を備えた。","h":"取消し後に現れた第三者とAとは、Bを起点とする二重譲渡と同じ対抗関係になり、先に登記を備えた方が優先する（177条）。Cが登記を備えたのでAは負ける。","pt":"取消し前の第三者は96条3項（善意無過失なら保護）、取消し後の第三者は登記の先後で処理する。取消し後の第三者は善意・悪意を問わない（背信的悪意者を除く）のがひっかけ。","kw":["取消し後の第三者","登記","対抗","177条","詐欺"]},{"n":"最判平成元年9月14日","f":"夫Aは離婚に伴う財産分与として、自分名義の土地建物を妻Bに譲渡した。Aは、課税されるのはBの方だと思い込み、自分には課税されないことを当然の前提にしていたが、実際にはAに多額の譲渡所得税が課された。","h":"Aが自分に課税されないことを前提としていることが黙示的に表示されていたといえれば、その動機の錯誤は要素の錯誤となりうるとした。","pt":"現在は95条2項で「その事情が法律行為の基礎とされていることが表示されていたとき」に限り取消しができると明文化された。効果は無効ではなく取消しになった点に注意。表示は黙示でもよい。","kw":["動機の錯誤","表示","黙示","法律行為の基礎","取消し"]},{"n":"最判昭和44年2月13日","f":"制限行為能力者Aは、自分が制限行為能力者であることを相手方Bに告げずに、所有する土地を売却した。後にAの側が、制限行為能力を理由に売買を取り消そうとした。","h":"制限行為能力者であることを単に黙っていただけでは21条の「詐術」に当たらない。ただし他の言動と相まって相手方を誤信させ、又は誤信を強めたときは詐術に当たる。","pt":"「黙っていただけでも詐術になり取り消せない」と出たら×。黙秘だけなら取消しできる。積極的な嘘でなくても、他の言動と組み合わされば詐術になる。","kw":["詐術","黙秘","制限行為能力者","取り消すことができない","誤信"]}]},"権利|代理":{"pts":["代理人は行為能力者であることを要しない。制限行為能力者が代理人としてした行為は、行為能力の制限を理由に取り消せない。","自己契約・双方代理は無権代理とみなす。ただし債務の履行と本人があらかじめ許諾した行為は有効（108条）。","代理権濫用は、相手方が代理人の目的を知り又は知ることができたとき無権代理とみなす（107条）。","任意代理人は本人の許諾又はやむを得ない事由があるときのみ復代理人を選任可。法定代理人は自己の責任でいつでも選任できる。","代理権は本人の死亡、代理人の死亡・破産手続開始・後見開始で消滅する。任意代理では本人の破産手続開始でも消滅する。","無権代理の追認は契約時にさかのぼって効力を生ずる。相手方は催告でき、本人が期間内に確答しなければ追認拒絶とみなす。","表見代理（代理権授与表示・権限外・代理権消滅後）は相手方の善意無過失が必要。無権代理人の責任は相手方が選択できる。"],"traps":["「双方代理は本人の許諾があっても無効」と出たら×。あらかじめ許諾した行為や債務の履行は有効となる。","「無権代理の追認は追認の時から効力を生ずる」と出たら×。別段の意思表示がない限り契約時にさかのぼる。","「善意の相手方は表見代理を主張できる」と出たら要注意。表見代理は善意だけでなく無過失も必要で、過失があれば不成立。"],"rel":["権利|意思表示・行為能力","権利|相続"],"bridge":"代理行為の瑕疵は代理人を基準に判断し、意思表示の規定がそのまま使われる。無権代理と相続では、本人が相続すれば追認拒絶でき、無権代理人が単独相続すれば追認拒絶できない。","sys":{"overview":"民法総則の代理制度。有効な代理の3要件（代理権・顕名・代理行為）を軸に、代理権の制限（自己契約・双方代理・濫用）、復代理、消滅事由、無権代理と表見代理での相手方の手段を要件の違いで押さえる。","tree":[{"h":"代理の要件","items":["代理権の存在・顕名・代理行為の3つ","顕名なし→代理人自身の行為とみなす","相手方が悪意・有過失なら本人に効果（100条）","代理人は行為能力者でなくてよい（102条）","代理行為の瑕疵は原則代理人を基準に判断"]},{"h":"代理権の制限","items":["自己契約・双方代理は無権代理とみなす","債務の履行・本人があらかじめ許諾した行為は有効","利益相反行為も無権代理とみなす","濫用：相手方悪意・有過失なら無権代理とみなす"]},{"h":"復代理","items":["任意代理：本人の許諾かやむを得ない事由が必要","法定代理：自己の責任でいつでも選任可","復代理人は本人を直接代理する","代理人の代理権消滅で復代理権も消滅"]},{"h":"代理権の消滅","items":["本人の死亡","代理人の死亡・破産手続開始・後見開始","任意代理は本人の破産手続開始でも消滅","本人の後見開始は消滅事由でない"]},{"h":"無権代理","items":["本人は追認・追認拒絶できる","追認は契約時にさかのぼる（116条）","相手方：催告・取消し・責任追及","無権代理人の責任：履行か損害賠償を相手方が選択"]},{"h":"表見代理","items":["代理権授与表示（109条）","権限外の行為（110条）・正当な理由","代理権消滅後（112条）","いずれも相手方の善意無過失が必要","日常家事代理権を基本代理権とする110条の趣旨類推（判例）"]}],"flow":{"title":"無権代理の相手方の手段","steps":["本人に相当期間を定めて追認を催告（悪意でも可）","確答なし→追認拒絶とみなす","善意なら本人の追認前に契約を取り消せる","善意無過失なら表見代理の成立を主張","善意無過失なら無権代理人に履行か損害賠償請求","無権代理人が悪意なら相手方に過失があっても可"]},"tables":[{"title":"相手方の手段と要件","head":["手段","善意","無過失","備考"],"rows":[["催告","不要","不要","確答なし→追認拒絶"],["取消し","必要","不要","本人の追認前に限る"],["表見代理","必要","必要","本人に効果帰属"],["無権代理人の責任","必要","原則必要","代理人が制限行為能力者なら×"]]},{"title":"代理権の消滅事由","head":["事由","本人","代理人"],"rows":[["死亡","消滅","消滅"],["破産手続開始","任意代理のみ消滅","消滅"],["後見開始","消滅しない","消滅"]]},{"title":"無権代理と相続","head":["場面","追認拒絶"],"rows":[["無権代理人が本人を単独相続","×（できない）"],["本人が無権代理人を相続","○（ただし責任は承継）"],["無権代理人が他の相続人と共同相続","全員の追認がなければ当然有効とならない"]]}]},"ex":[{"t":"解任後の元代理人","s":"AはBに甲土地の売却の代理権を与えたが、4月1日に代理権を撤回した。Bは5月10日、手元に残っていた委任状を示し、Aの代理人としてCと3,000万円の売買契約を結んだ。","p":"Cが代理権の消滅を知らず、知らないことに過失もなければ表見代理が成立し、Aが責任を負う（112条）。Cに過失があれば表見代理は成立しないが、Bは自分に代理権がないと知っていたので、CはBに履行か損害賠償を請求できる（117条2項2号ただし書）。","kw":["代理権の消滅","表見代理","善意無過失","無権代理人の責任","過失"]},{"t":"無権代理人が相続","s":"Bは父Aに無断で、Aの代理人と称してA所有の乙建物をCに2,000万円で売った。その後Aが死亡し、Bが単独でAを相続した。","p":"無権代理人が本人を単独相続すると、本人が自ら行為したのと同様になり、Bは追認を拒絶できない（判例）。ただしAが生前に追認を拒絶していれば無効が確定しており、相続しても有効にならない。逆に本人Aが無権代理人Bを相続した場合は、Aは追認を拒絶できる（無権代理人の責任は承継する）。","kw":["無権代理人","単独で相続","追認を拒絶","本人","当然に有効"]},{"t":"双方代理と許諾","s":"司法書士Dは、売主Aと買主Cの双方から依頼を受け、甲土地の所有権移転登記をA・C双方の代理人として申請した。別の取引では、仲介業者EがF・G双方の代理人となり、両者の事前の許諾なく売買価格を決めて契約した。","p":"登記申請は既に決まった債務の履行なので、双方代理でも有効である（108条1項ただし書）。Eの行為は無権代理とみなされるが、F・Gがあらかじめ許諾していれば有効で、事後に追認することもできる。","kw":["双方代理","自己契約","あらかじめ許諾","債務の履行","無権代理行為とみなす"]}],"around":[{"h":"相手方の4つの手段","b":"催告は悪意の相手方でもでき、取消しは善意の相手方が本人の追認前に限りできる。表見代理の主張と無権代理人の責任追及は原則として善意無過失が必要。"},{"h":"代理人の行為能力","b":"制限行為能力者が代理人としてした行為は、行為能力の制限を理由に取り消せない（102条）。ただし制限行為能力者が他の制限行為能力者の法定代理人としてした行為は取り消せる。"},{"h":"代理権の濫用","b":"代理人が自己や第三者の利益を図る目的で権限内の行為をした場合、相手方がその目的を知り又は知ることができたときは無権代理とみなされる（107条）。本人は追認することもできる。"},{"h":"顕名がない場合","b":"代理人が本人のためにすることを示さずにした意思表示は、代理人自身のためにしたものとみなされる。ただし相手方が本人のためと知り又は知ることができたときは本人に効果が帰属する（100条）。"},{"h":"復代理人の地位","b":"復代理人は代理人の代理人ではなく本人の代理人で、本人に対して代理人と同一の権利義務を負う（106条）。代理人の代理権が消滅すれば復代理権も消滅する。"}],"cases":[{"n":"最判昭和44年12月18日","f":"妻Bは、夫Aに無断で、A所有の土地建物をAの代理人としてCに売却した。Cは、夫婦の日常の家事に関する代理権があることを理由に、この売買も有効だと主張した。","h":"761条により夫婦は日常家事について相互に代理権を持つ。日常家事の範囲を超える行為については、相手方がその夫婦の日常家事の範囲内と信じたことに正当な理由があるときに限り、110条の趣旨を類推して保護する。","pt":"「日常家事代理権を基本代理権として110条をそのまま適用する」と出たら×。110条の「趣旨の類推」で、しかも日常家事の範囲内と信じた正当理由が必要。不動産の売却は通常日常家事に当たらない。","kw":["日常の家事","夫婦","110条","類推","正当な理由"]},{"n":"最判昭和46年6月3日","f":"Aは、Cとの贈与契約に基づく所有権移転登記の申請手続をBに任せ、実印などを渡した。Bはこれを悪用し、Aの代理人としてDとの間で、Aを保証人とする契約を結んだ。","h":"登記申請のような公法上の行為の代理権は原則として基本代理権にならないが、それが私法上の契約上の義務の履行としてされるときは、110条の基本代理権になる。","pt":"基本代理権は原則として私法上の法律行為の代理権が必要（事実行為の代行権限は基本代理権にならない＝最判昭和35年2月19日）。登記申請は例外的に基本代理権になりうる、という組合せで問われる。","kw":["基本代理権","登記申請","公法上の行為","表見代理","110条"]},{"n":"最判昭和44年12月19日","f":"Aは、Bに担保のための借入れの代理権だけを与えていた。BはA本人であるかのように装い、A名義でA所有の土地をCに売却した。Cは取引の相手がA本人だと信じていた。","h":"代理人が本人の名で権限外の行為をした場合でも、相手方がその行為を本人自身の行為と信じたことに正当な理由があるときは、110条を類推適用する。","pt":"代理人だと名乗らず本人になりすました場合でも表見代理の規定で保護されうる。「顕名がないから110条は使えない」と出たら×。","kw":["本人の名","権限外の行為","110条","類推適用","正当な理由"]},{"n":"判例（最高裁）","f":"Aは、Bに代理権を与えたかのような表示（委任状の交付など）をCに対してした。Bはその表示された代理権の範囲をさらに超えて、Aの代理人としてCと契約を結んだ。","h":"代理権授与の表示をした範囲を超えて代理行為がされた場合も、相手方がその行為についてBに代理権があると信じる正当な理由があれば、109条と110条を重ねて適用して本人に責任を負わせる。","pt":"現在は109条2項で明文化された。代理権消滅後に元の権限を超えた場合も112条2項で明文化（いずれも相手方の善意無過失・正当理由が必要）。","kw":["代理権授与の表示","権限外","重畳適用","109条2項","112条2項"]},{"n":"最判昭和42年4月20日","f":"Aの代理人Bは、代理権の範囲内でCから商品を買い入れたが、実は自分が転売して利益を得るつもりだった。Bは代金を払わずに着服し、CはAに代金を請求した。","h":"代理人が自己又は第三者の利益を図るため権限内の行為をした場合、相手方がその意図を知り又は知ることができたときに限り、93条ただし書を類推適用して本人は責任を負わない。","pt":"現在は107条で明文化され、相手方が目的を知り又は知ることができたときは「無権代理とみなす」とされた（無効ではなく無権代理なので本人は追認できる）。相手方が善意無過失なら本人に効果が帰属する。","kw":["代理権の濫用","自己の利益","知ることができた","無権代理とみなす","107条"]},{"n":"判例（最高裁）","f":"Aから甲土地の売買契約を結ぶ代理権を与えられたBが、Cとの間で売買契約を結んだ。その後Cは、Bに対して、この売買契約を取り消すという意思表示をした。","h":"売買契約を結ぶ代理権を持つ代理人は、特段の事情がない限り、相手方からのその契約の取消しの意思表示を受ける権限も持つ。","pt":"契約締結の代理権には、その契約についての相手方からの意思表示（取消し等）の受領権限も含まれる。「本人に直接しなければ取消しの効力が生じない」と出たら×。","kw":["取消しの意思表示","受領","代理権","特段の事情","売買契約"]},{"n":"最判昭和62年7月7日","f":"Bは代理権がないのに、Aの代理人と称してCとの間でAを保証人とする契約を結んだ。Cが無権代理人Bに責任を追及すると、Bは「表見代理が成立するのだからAに請求すべきだ」「Cにも過失があった」と争った。","h":"無権代理人は、表見代理が成立することを理由に117条の責任を免れることはできない。また117条2項の「過失」は重大な過失に限られない。","pt":"相手方は表見代理と無権代理人の責任を選んで主張できる。2020年改正で、無権代理人が自分に代理権がないことを知っていたときは、相手方に過失があっても責任を負う（117条2項2号ただし書）。","kw":["無権代理人の責任","表見代理","選択","過失","117条"]},{"n":"最判昭和40年6月18日","f":"Bは父Aに無断で、Aの代理人と称してA所有の土地をCに売却した。その後Aが死亡し、BがただひとりでAを相続した。BはCに対し、本人の地位に基づいて追認を拒絶すると主張した。","h":"無権代理人が本人を単独で相続した場合は、本人が自ら法律行為をしたのと同様の法律上の地位が生じ、無権代理行為は当然に有効となる。Bは追認を拒絶できない。","pt":"自分で無権代理をした者が相続で本人の立場を得て追認拒絶するのは許されない。「本人の地位で追認拒絶できる」と出たら×。","kw":["無権代理人","単独で相続","追認を拒絶","当然に有効","本人の地位"]},{"n":"最判昭和37年4月20日","f":"Bは父Aに無断で、Aの代理人と称してA所有の土地をCに売却した。その後、無権代理人Bが先に死亡し、本人Aが無権代理人Bを相続した。AはCに対して追認を拒絶した。","h":"本人が無権代理人を相続した場合、本人が追認を拒絶しても信義則に反しないから、無権代理行為は相続によって当然に有効とはならない。","pt":"無権代理人が本人を相続する場合（追認拒絶不可）との逆パターン。本人は何も悪くないので追認拒絶ができる。ただし無権代理人の責任は相続する（最判昭和48年7月3日）。","kw":["本人","無権代理人を相続","追認拒絶","信義則","当然に有効とならない"]},{"n":"最判昭和48年7月3日","f":"Bは無権代理人として、Aの代理人と称しCとの契約を結び、Cに対して117条の責任を負っていた。その後Bが死亡し、本人AがBを相続した。AはCからの責任追及に対し、自分は本人として追認を拒絶できる立場だと反論した。","h":"本人は無権代理人が負っていた117条の責任を相続によって承継し、追認を拒絶できる地位にあることを理由にその責任を免れることはできない。","pt":"本人が無権代理人を相続すると「追認拒絶はできるが、無権代理人の責任（履行又は損害賠償）は承継する」。両方をセットで覚える。","kw":["無権代理人の責任","相続","承継","追認拒絶","117条"]},{"n":"最判平成5年1月21日","f":"Bは父Aに無断で、Aの代理人と称してA所有の土地をCに売却した。Aが死亡し、無権代理人Bと弟Dが共同でAを相続した。Dは追認していない。","h":"追認権は共同相続人全員に不可分的に帰属するので、共同相続人全員が共同して追認しない限り、無権代理人Bの相続分に相当する部分についても無権代理行為は当然には有効とならない。","pt":"単独相続なら当然有効だが、共同相続では全員の追認が必要。「Bの相続分の限度で当然に有効になる」と出たら×。","kw":["共同相続","追認","全員","相続分","不可分"]},{"n":"最判平成10年7月17日","f":"Bは本人Aに無断で、Aの代理人と称してA所有の不動産に関する契約をCと結んだ。Aは生前、この無権代理行為の追認を拒絶した。その後Aが死亡し、Bが相続した。","h":"本人が追認を拒絶すれば無権代理行為の効力が本人に及ばないことが確定するので、その後に無権代理人が本人を相続しても、無権代理行為は有効にならない。","pt":"「無権代理人が本人を相続すれば、本人が生前に追認拒絶していても当然有効」と出たら×。追認拒絶の前か後かで結論が変わる。","kw":["追認を拒絶","確定","相続","無権代理人","有効にならない"]}]},"権利|時効":{"pts":["所有権の取得時効は、所有の意思をもって平穏・公然に占有し、占有開始時に善意無過失なら10年、それ以外は20年で完成する。","所有の意思は占有取得の原因（権原）で客観的に決まる。賃借人は何年占有しても原則として所有権を時効取得できない。","前の占有者の占有を併合でき、その場合は瑕疵も承継する。善意無過失は最初の占有者の占有開始時で判断する。","債権は、権利行使できることを知った時から5年、行使できる時から10年で時効消滅する。生命・身体侵害の損害賠償は後者が20年。","裁判上の請求は終了まで完成猶予、確定判決等で権利が確定すれば更新。確定せず終了したときは終了から6か月完成猶予にとどまる。","催告は6か月間の完成猶予のみで、猶予中の再度の催告に効力はない。承認は更新事由で、処分の行為能力・権限は不要。","時効は当事者（保証人・物上保証人・第三取得者等）が援用して初めて確定する。時効の利益は完成前に放棄できない。"],"traps":["「後順位抵当権者は先順位の被担保債権の消滅時効を援用できる」と出たら×。順位上昇は反射的利益で援用権者でない。","「時効完成を知らずに承認した債務者は時効を援用できる」と出たら×。判例は信義則上援用できないとする。","「途中で他人の物と知った占有者は所有の意思を失う」と出たら×。善意・悪意は占有開始時で判断し、所有の意思は失わない。"],"rel":["権利|物権変動・対抗","権利|保証・連帯債務"],"bridge":"時効取得者は時効完成前の第三者には登記なく対抗でき、完成後の第三者とは対抗関係になる。保証人は主債務の時効を援用でき、主債務者の時効利益放棄の効果は保証人に及ばない。","sys":{"overview":"民法総則の時効制度。取得時効（10年・20年）と消滅時効（5年・10年）の期間、完成猶予と更新の事由の区別、援用権者の範囲を整理すれば得点できる。2020年改正で「中断・停止」は「更新・完成猶予」に再編された。","tree":[{"h":"取得時効","items":["所有の意思・平穏・公然の占有","占有開始時に善意無過失→10年","それ以外→20年","所有の意思は権原で客観的に判断","賃借人を通じた間接占有でも可"]},{"h":"占有の承継","items":["前主の占有を併合できる（瑕疵も承継）","善意無過失は最初の占有者の開始時で判断","占有回収の訴えで回復→占有は継続扱い"]},{"h":"消滅時効","items":["債権：知った時から5年","債権：行使できる時から10年","生命・身体侵害の損害賠償：20年（客観）","債権以外の財産権：20年、所有権は消滅しない","判決で確定した権利：10年"]},{"h":"完成猶予","items":["裁判上の請求等：終了まで（不確定なら+6か月）","催告：6か月（再度の催告は無効）","協議の書面合意：最長1年、通算5年まで","仮差押え・仮処分：終了から6か月","天災等：障害消滅から3か月"]},{"h":"更新","items":["確定判決・裁判上の和解等で権利確定","強制執行等の終了","承認（処分の能力・権限は不要）","更新後は新たに時効が進行"]},{"h":"援用・放棄","items":["援用で効果確定、効果は起算日にさかのぼる","援用権者：保証人・物上保証人・第三取得者","後順位抵当権者は援用不可（判例）","完成前の放棄は不可、完成後の放棄は相対効","完成後の承認→知らなくても援用不可（判例）"]}],"flow":{"title":"時効の進行から完成まで","steps":["起算点：占有開始／権利行使可能・知った時","完成猶予事由が生じれば期間満了が延びる","更新事由が生じればゼロから再スタート","期間満了で時効完成","当事者が援用して効果が確定","効果は起算日にさかのぼる（144条）"]},"tables":[{"title":"時効期間の整理","head":["種類","期間","起算点"],"rows":[["所有権の取得（善意無過失）","10年","占有開始時"],["所有権の取得（上記以外）","20年","占有開始時"],["債権（主観）","5年","行使できると知った時"],["債権（客観）","10年","行使できる時"],["生命・身体侵害の損害賠償","5年／20年","知った時／行使できる時"],["債権・所有権以外の財産権","20年","行使できる時"],["判決で確定した権利","10年","確定時"]]},{"title":"完成猶予と更新","head":["事由","完成猶予","更新"],"rows":[["裁判上の請求","○ 終了まで","○ 権利確定時"],["請求の取下げ等","○ 終了から6か月","×"],["強制執行等","○ 終了まで","○ 終了時"],["仮差押え・仮処分","○ 終了から6か月","×"],["催告","○ 6か月","×"],["協議の書面合意","○ 最長1年","×"],["承認","—","○"]]},{"title":"援用権者に当たるか","head":["立場","援用"],"rows":[["保証人","○"],["物上保証人","○"],["抵当不動産の第三取得者","○"],["後順位抵当権者","×"],["一般債権者（原則）","×"]]}]},"ex":[{"t":"占有の承継と10年","s":"Aは2016年4月1日、甲土地を自分の物と信じ、そう信じたことに過失もなく占有を始めた。6年後、Aは甲土地をBに引き渡し、Bは他人の土地と知りながらその後4年間占有を続けた。","p":"BはAの占有を併せて主張でき、その場合の善意無過失は最初の占有者Aの占有開始時で判断するので、合計10年で取得時効が完成する（187条・162条2項）。Bが自分の占有だけを主張するなら悪意なので20年が必要になる。","kw":["占有の承継","併せて主張","善意無過失","10年","占有開始時"]},{"t":"催告から訴訟へ","s":"Aは2021年6月30日が返済期限の貸金債権をBに対して持ち、期限を知っていたので2026年6月30日に時効が完成する予定だった。Aは2026年5月1日に内容証明郵便で催告し、その後9月に訴えを提起して、勝訴判決が確定した。","p":"催告で6か月間完成が猶予され、その間の訴え提起で手続終了まで猶予が続き、判決確定で時効が更新されて新たに10年が進行する（150条・147条・169条）。訴えではなく再度の催告をしても、猶予期間は延びない。","kw":["催告","6か月","完成猶予","裁判上の請求","更新","確定判決"]},{"t":"完成後の承認と保証人","s":"BのAに対する借入金債務は消滅時効が完成していたが、Bはそれを知らずに「分割で払わせてほしい」とAに申し入れた。この債務にはCが保証人となっている。","p":"Bは時効完成を知らなくても、承認した以上、信義則上その時効を援用できない（判例）。しかしこれはB個人に生じた事情で、保証人Cは主たる債務の消滅時効を独自に援用できる。","kw":["時効の完成後","承認","援用","保証人","時効の利益の放棄"]}],"around":[{"h":"取得時効と登記","b":"時効完成前に原所有者から譲り受けた第三者には、時効取得者は登記なく対抗できる。完成後に譲り受けた第三者とは登記の先後で優劣が決まる。"},{"h":"援用できる人","b":"保証人・物上保証人・抵当不動産の第三取得者は援用できる（145条）。後順位抵当権者は順位上昇が反射的利益にすぎず、援用できない（判例）。"},{"h":"消滅時効期間の比較","b":"一般の債権は知った時から5年・行使できる時から10年。不法行為は損害と加害者を知った時から3年・行為時から20年で、生命・身体の侵害は債務不履行・不法行為とも5年・20年にそろう。"},{"h":"協議を行う旨の合意","b":"書面による協議の合意で、合意から1年などの最も早い時まで完成が猶予される。再度の合意で延長できるが通算5年が上限で、催告による猶予中にした合意には効力がない（151条）。"},{"h":"所有権と時効","b":"所有権は消滅時効にかからない。債権・所有権以外の財産権（地役権など）は20年で消滅する。時効の利益は完成前にあらかじめ放棄できない（146条）。"}],"cases":[{"n":"最判昭和41年4月20日（大法廷）","f":"Aの貸金債権について消滅時効が完成した後、債務者Bは時効の完成を知らないまま、Aに対して「少し待ってほしい」と支払猶予を求め、債務を承認した。その後Bは時効を援用した。","h":"時効完成後に債務を承認した債務者は、時効完成の事実を知らなかったときでも、信義則に照らしてその完成した消滅時効を援用することは許されない。","pt":"知らずにした承認は「時効利益の放棄」ではないが、援用は信義則上できなくなる。ただし承認の時から再び時効期間が経過すれば、新たな時効は援用できる（最判昭和45年5月21日）。","kw":["時効完成後","承認","知らなかった","援用","信義則"]},{"n":"最判平成11年10月21日","f":"A所有の甲土地に、Bが1番抵当権、Cが2番抵当権を持っていた。Bの被担保債権について消滅時効期間が経過したので、Cは「Bの債権は時効で消滅した」と援用し、自分の順位を上げようとした。","h":"後順位抵当権者は、先順位抵当権の被担保債権の消滅時効を援用できない。順位が上がって配当が増えるのは反射的な利益にすぎない。","pt":"145条の「権利の消滅について正当な利益を有する者」に後順位抵当権者は含まれない。保証人・物上保証人・第三取得者（いずれも援用できる）との区別が頻出。","kw":["後順位抵当権者","先順位","援用","反射的利益","消滅時効"]},{"n":"最判昭和43年9月26日","f":"Cは、友人Bの債務を担保するため、自分の土地にAのための抵当権を設定した（物上保証人）。Aの被担保債権について消滅時効期間が経過したが、債務者Bは時効を援用しなかった。","h":"物上保証人は、被担保債権の消滅時効を援用することができる。","pt":"現在は145条かっこ書で、保証人・物上保証人・第三取得者が援用権者であることが明文化されている。","kw":["物上保証人","援用","被担保債権","消滅時効","145条"]},{"n":"最判昭和48年12月14日","f":"A所有の土地にはBのための抵当権が設定されていた。Cはこの土地をAから買い受けた（第三取得者）。その後、Bの被担保債権について消滅時効期間が経過した。","h":"抵当不動産の第三取得者は、抵当権の被担保債権の消滅時効を援用することができる。","pt":"第三取得者は援用できるが、後順位抵当権者はできない。現在は145条で明文化。","kw":["第三取得者","抵当不動産","援用","消滅時効","被担保債権"]},{"n":"最判昭和53年3月6日","f":"Aは、他人の土地を自分の物と信じ、そう信じたことに過失もなく占有を始めた。数年後、Aからこの土地の占有を引き継いだBは、他人の土地であることを知っていた。Bは、Aの占有期間と自分の占有期間を合わせて10年の取得時効を主張した。","h":"善意無過失の占有者から占有を承継した者が、前主の占有を併せて主張する場合は、最初の占有者の占有開始時に善意無過失であれば、10年の取得時効を主張できる。承継人自身が悪意でもよい。","pt":"占有を併せて主張する場合、善意無過失は最初の占有者の占有開始時で判断する（162条2項・187条）。自分の占有だけを主張するなら自分の善意・悪意で判断する。","kw":["占有の承継","併せて主張","善意無過失","10年","占有開始時"]},{"n":"最判昭和35年7月27日","f":"Bは、A所有の土地を長年占有し続けた。Bは取得時効を主張するにあたり、自分に有利になるよう、実際に占有を始めた時より後の時点を起算点として時効完成時期を選ぼうとした。","h":"取得時効の完成時期は、必ず時効の基礎となる事実が開始した時（占有開始時）を起算点として決めるべきで、援用者が起算点を任意に選んで完成時期を早めたり遅らせたりすることはできない。","pt":"起算点を後ろにずらして「時効完成後の第三者」を「完成前の第三者」に変えることはできない。時効と登記の問題とセットで問われる。","kw":["起算点","占有開始","任意に選択","時効完成時期","取得時効"]},{"n":"最判昭和41年11月22日","f":"Bは、A所有の甲土地を所有の意思をもって占有していた。Bの取得時効が完成する前に、Aは甲土地をCに売却し、Cが移転登記を備えた。その後Bの取得時効が完成した。","h":"時効完成前に原所有者から権利を取得して登記した者に対しては、時効取得者は登記がなくても所有権の取得を主張できる。","pt":"時効完成前の第三者は時効取得の「当事者」と同じ扱いで、登記不要。完成後の第三者とは登記の先後で決まる（最判昭和33年8月28日）点と対比される。","kw":["時効完成前","第三者","登記","対抗","取得時効"]},{"n":"最判昭和33年8月28日","f":"Bは、A所有の甲土地を占有し続けて取得時効が完成したが、移転登記をしていなかった。時効完成後、Aは甲土地をCに売却し、Cが移転登記を備えた。","h":"時効により所有権を取得しても、登記をしなければ、時効完成後に旧所有者から権利を取得して登記をした第三者に対抗できない。","pt":"時効完成後の第三者とは二重譲渡と同じ対抗関係（177条）。ただし第三者が背信的悪意者なら登記なしで対抗できる。Cの登記後にBがさらに時効期間占有を続ければ、再び時効取得を登記なしで主張できる（最判昭和36年7月20日）。","kw":["時効完成後","第三者","登記","対抗できない","177条"]},{"n":"最判平成8年11月12日","f":"A名義の土地建物を、子BがAの許可を得て管理していた（他主占有）。Bの死後、Bの妻子は、BがAから贈与を受けていたと信じて、登記済証を保管し、固定資産税を払い、賃料を受け取って生活費にあてていた。Aやその相続人はこれを知りながら異議を述べなかった。","h":"他主占有者の相続人が自分の占有に基づいて取得時効を主張するには、その事実的支配が外形的・客観的にみて独自の所有の意思に基づくものと認められる事情を相続人の側で証明する必要がある。本件ではこれを認めた。","pt":"相続は185条の「新たな権原」になりうるが、単に賃借人や管理人の地位を相続しただけでは足りない。賃借人の地位をそのまま引き継いで賃料を払い続けている相続人は、所有の意思が認められず所有権を時効取得できない。","kw":["他主占有","相続人","所有の意思","新たな権原","証明"]},{"n":"判例（最高裁）","f":"Bは農地の所有者Aと賃貸借契約を結び、農地法3条の許可を受けないまま、長年にわたり賃料を払って耕作を続けた。AはBの賃借権を否定し、農地の明渡しを求めた。","h":"時効による農地の賃借権の取得については、農地法3条の許可に関する規定の適用はなく、許可がなくても賃借権の時効取得が認められうる。","pt":"賃借権の時効取得は、土地の継続的な用益という外形的事実があり、それが賃借の意思に基づくことが客観的に表現されているとき（賃料の支払い等）に認められる（最判昭和43年10月8日）。農地でも同じで、3条許可は要らない。","kw":["農地","賃借権","時効取得","農地法3条","許可"]}]},"権利|物権変動・対抗":{"pts":["不動産物権の得喪変更は、登記がなければ第三者に対抗できない（177条）。二重譲渡の優劣は契約の先後でなく登記の先後で決まる。","177条の第三者は登記の欠缺を主張する正当な利益を有する者。不法占拠者・無権利者・背信的悪意者には登記なく対抗できる。","単なる悪意者は第三者に当たる。背信的悪意者からの転得者も、自身が背信的悪意者でなければ177条の第三者として保護される。","取消し前の第三者は意思表示の規定で処理し、取消し後の第三者とは登記の先後で決まる。解除後の第三者も登記の先後。","解除前の第三者は、善意・悪意を問わず権利保護要件として登記を備えれば保護される（545条1項ただし書）。","時効取得者は完成前の第三者には登記不要、完成後の第三者とは登記の先後。相続人が法定相続分を超える部分は登記なく対抗できない。","共同相続人の1人が勝手に単独名義で登記し譲渡しても、他の相続人の持分について譲受人は権利を取得できない（登記に公信力なし）。"],"traps":["「先に売買契約をした買主は登記がなくても後の買主に優先する」と出たら×。優劣は登記の先後で決まる。","「悪意の第二買主には登記なく対抗できる」と出たら×。単なる悪意者は177条の第三者で、対抗できないのは背信的悪意者のみ。","「解除前の第三者は善意であれば登記なしで保護される」と出たら×。善意悪意不問だが、登記は必要。"],"rel":["権利|不動産登記法","権利|意思表示・行為能力","権利|時効"],"bridge":"177条は「登記がなければ対抗できない」という実体法のルールで、不動産登記法はその登記の申請手続を定める。取消し・解除・時効・相続の各場面で、第三者が出現した時期により処理が変わる。","sys":{"overview":"物権編の基本原則。不動産の物権変動は登記がなければ第三者に対抗できない（177条）。「第三者」に当たる者・当たらない者の区別と、取消し・解除・時効・相続で第三者が現れた時期ごとの処理を図で押さえる。","tree":[{"h":"基本原則","items":["物権変動は意思表示のみで生じる（176条）","第三者への対抗には登記が必要（177条）","二重譲渡の優劣は登記の先後","登記に公信力はない"]},{"h":"第三者の範囲","items":["登記の欠缺を主張する正当な利益を有する者","単なる悪意者は第三者に当たる","背信的悪意者・不法占拠者・無権利者は除外","背信的悪意者からの転得者は保護されうる","順次譲渡の前々主は当事者類似で登記不要"]},{"h":"取消し・解除","items":["取消し前の第三者：意思表示の規定で判断","取消し後の第三者：登記の先後","解除前の第三者：善意悪意不問、登記が必要","解除後の第三者：登記の先後"]},{"h":"時効と登記","items":["完成前の第三者：登記なく対抗できる","完成後の第三者：登記の先後","起算点は任意に選べない（判例）"]},{"h":"相続と登記","items":["法定相続分は登記なく対抗できる","法定相続分を超える部分は登記が必要（899条の2）","相続放棄の効果は登記なく対抗できる（判例）","無断単独登記の譲受人は他相続人の持分を取得しない","相続登記の申請義務：知った日から3年以内"]}],"flow":{"title":"二重譲渡の対抗関係の判定","steps":["相手は当事者・前主か（なら登記不要）","相手は無権利者・不法占拠者か（なら登記不要）","相手は背信的悪意者か（なら登記不要）","上記以外は177条の第三者（悪意者も含む）","先に登記を備えた方が優先","取消し・解除・時効は第三者の出現時期も確認"]},"tables":[{"title":"登記なしで対抗できるか","head":["相手方","登記なしで対抗"],"rows":[["二重譲渡の他方の譲受人（悪意含む）","×"],["背信的悪意者","○"],["背信的悪意者からの善意の転得者","×"],["不法占拠者・無権利者","○"],["前主・前々主（順次譲渡）","○"],["差押債権者","×"],["対抗力ある借地人（賃貸人の地位主張）","×"]]},{"title":"第三者の出現時期と処理","head":["場面","前の第三者","後の第三者"],"rows":[["詐欺・錯誤取消し","善意無過失なら保護","登記の先後"],["強迫取消し","保護されない","登記の先後"],["虚偽表示","善意なら保護（登記不要）","—"],["解除","登記があれば保護","登記の先後"],["取得時効","登記なく対抗可","登記の先後"]]}]},"ex":[{"t":"二重譲渡と背信的悪意","s":"Aは3月1日に甲土地をBに売ったが、Bは登記をしていなかった。CはA・B間の売買を知りながら4月1日にAから甲土地を買い受け、先に登記を備えた。","p":"単なる悪意者Cは177条の第三者に当たり、先に登記したCが優先する。Cが「Bに高値で売りつける」目的で買った背信的悪意者なら、Bは登記なくCに対抗できる。ただしCから善意で買って登記したDには、D自身が背信的悪意者でない限りBは対抗できない（判例）。","kw":["二重譲渡","悪意","背信的悪意者","転得者","登記"]},{"t":"取消し後に転売","s":"AはBにだまされて甲土地を売り、登記もBに移した。Aは6月1日に詐欺を理由に売買を取り消したが、登記を戻さないでいるうちに、Bは7月1日に甲土地をDに売り、Dが登記を備えた。","p":"取消し後に現れた第三者Dとの関係は、Bを起点とする二重譲渡と同様に登記の先後で決まり、先に登記したDが優先する（判例）。取消し前の第三者であれば、96条3項により善意無過失かどうかで判断する。","kw":["取消し後","第三者","登記の先後","詐欺","取消し前"]},{"t":"共同相続と単独登記","s":"父の死亡で甲土地をBとCが2分の1ずつ相続した。Bは勝手に甲土地全部を自分の単独名義で登記し、Eに売却して移転登記をした。","p":"Cの持分についてBは無権利者で、登記に公信力もないため、Cは自己の持分2分の1を登記なくEに対抗できる（判例）。一方、遺産分割でCが甲土地全部を取得した場合、法定相続分を超える2分の1については、登記がなければ第三者に対抗できない（899条の2）。","kw":["共同相続","単独名義","法定相続分","遺産分割","登記なく対抗"]}],"around":[{"h":"登記なしで対抗できる相手","b":"不法占拠者、無権利者とその譲受人、背信的悪意者、前主・前々主（順次譲渡の当事者）には登記なく所有権を主張できる。差押債権者や単なる悪意の譲受人には登記が必要。"},{"h":"解除前の第三者","b":"契約が解除されても、解除前に権利を得た第三者は善意・悪意を問わず保護されるが、保護には登記が必要（545条1項ただし書・判例）。解除後の第三者とは登記の先後で決まる。"},{"h":"相続登記の申請義務","b":"不動産を相続で取得したことを知った日から3年以内に相続登記を申請する義務があり、正当な理由なく怠ると10万円以下の過料の対象となる（2024年4月施行）。"},{"h":"住所等変更登記の義務","b":"2026年4月1日から、登記名義人の住所・氏名の変更日から2年以内に変更登記を申請する義務がある。正当な理由なく怠ると5万円以下の過料の対象で、施行前の変更は2028年3月31日までが期限。"},{"h":"即時取得は動産だけ","b":"無権利者から善意無過失で買っても、不動産は即時取得の対象外で所有権を取得できない。登記を信じて買った場合も、登記に公信力がないので保護されないのが原則。"}],"cases":[{"n":"最判昭和43年8月2日","f":"AはBに山林を売ったが、Bは登記をしていなかった。Cはその事情を知ったうえで、Bに高値で売りつけて利益を得る目的でAから同じ山林を安く買い受け、先に登記を備えた。CはBに対して所有権を主張した。","h":"実体上物権変動があった事実を知る者が、登記の欠缺を主張することが信義に反する事情がある場合（背信的悪意者）は、177条の第三者に当たらない。Bは登記なくCに所有権を対抗できる。","pt":"単なる悪意者は177条の第三者に当たり、先に登記した方が勝つ。登記なく対抗できるのは「背信的悪意者」だけ。「悪意の第二買主には登記なく対抗できる」は×。","kw":["背信的悪意者","二重譲渡","悪意","登記の欠缺","信義則"]},{"n":"最判平成8年10月29日","f":"AがBに土地を売った後、Bが未登記のうちに背信的悪意者CがAから二重に買い受けて登記した。その後、DがCから土地を買い受けて登記を備えた。BはDに対して所有権を主張した。","h":"背信的悪意者からの転得者は、転得者自身が第一譲受人Bとの関係で背信的悪意者と評価されない限り、177条の第三者として保護される。BはDに登記なく対抗できない。","pt":"背信的悪意者は「無権利者」ではなく、その者から買った転得者は自分が背信的悪意者でなければ保護される（相対的判断）。転得者Dも背信的悪意者なら、Bは登記なく対抗できる。","kw":["背信的悪意者","転得者","相対的","177条の第三者","登記"]},{"n":"最判昭和25年12月19日","f":"Aから建物を買い受けたBは、まだ所有権移転登記を備えていなかった。その建物には何の権原もないCが住みついて不法に占拠していた。BはCに建物の明渡しを求めた。","h":"不法占拠者は登記の欠缺を主張する正当な利益を有する第三者に当たらない。Bは登記がなくても不法占拠者Cに明渡しを請求できる。","pt":"「登記がなければ不法占拠者に明渡請求できない」と出たら×。無権利者・不法行為者・不法占拠者には登記なく対抗できる。","kw":["不法占拠者","明渡請求","登記なく対抗","第三者に当たらない","正当な利益"]},{"n":"大判昭和17年9月30日","f":"AはBにだまされて土地を売り、登記もBに移した。Aは詐欺を理由に売買契約を取り消したが、登記をAに戻さないでいるうちに、BがCに土地を売却し、Cが登記を備えた。","h":"取消し後の第三者との関係は、取消しによるBからAへの復帰的物権変動とBからCへの譲渡との二重譲渡と同様の対抗関係となり、登記の先後で決まる。先に登記したCが優先する。","pt":"取消し「前」の第三者は96条3項（詐欺は善意無過失なら保護、強迫は保護されない）、取消し「後」の第三者は177条（登記の先後）と、出現時期で処理が分かれる。取消し後は、詐欺・強迫の別や第三者の善意悪意（背信的悪意者は除く）ではなく、登記の先後で決まる。","kw":["取消し後の第三者","復帰的物権変動","二重譲渡","登記の先後","詐欺"]},{"n":"最判昭和33年6月14日","f":"AがBに土地を売って登記も移し、BはさらにCに転売した。その後、AとBは売買契約を合意解除し、AはCに土地の返還を求めた。","h":"契約が合意解除された場合でも、解除前に権利を取得した第三者の権利を害することはできないが、その第三者が保護されるには対抗要件（不動産なら登記）を備えていることが必要である。","pt":"解除前の第三者は善意・悪意を問わないが、登記を備えていることが必要（解除原因を知っていても登記があれば保護）。債務不履行による法定解除の場合も、545条1項ただし書の第三者には登記が必要と解されている。「善意であれば登記なしで保護される」は×。","kw":["解除前の第三者","545条1項ただし書","権利保護要件","登記","善意悪意不問"]},{"n":"最判昭和35年11月29日","f":"AはBに土地を売って登記も移したが、Bが代金を支払わないため売買契約を解除した。Aが登記を戻さないうちに、BがCに土地を売却した。","h":"解除後の第三者との関係は、解除による復帰的物権変動と二重譲渡の関係に立ち、先に登記を備えた方が優先する。","pt":"解除後の第三者は対抗要件として登記の先後で決まる。解除前の第三者（権利保護要件として登記）と結論は同じく「登記があれば保護」だが理屈が異なる。","kw":["解除後の第三者","復帰的物権変動","登記の先後","対抗関係","契約の解除"]},{"n":"最判昭和41年11月22日","f":"Cは他人Aの土地を占有し続けていたが、取得時効が完成する前に、Aはその土地をBに売り、Bが登記を備えた。その後、Cの取得時効が完成し、CはBに所有権を主張した。","h":"時効完成前に原所有者から所有権を取得した者は、時効完成時の当事者であり、時効取得者は登記がなくてもその者に時効取得を対抗できる。","pt":"時効完成「前」の第三者には登記不要、完成「後」の第三者とは登記の先後で決まる（大判大正14年7月8日など）。「時効取得者は登記がなければ完成前の譲受人に対抗できない」は×。","kw":["時効完成前の第三者","取得時効","当事者","登記不要","時効完成後"]},{"n":"最判昭和35年7月27日","f":"Bは他人Aの土地を占有し、取得時効が完成した。ところが時効完成後にCがAから土地を買い受けて登記した。Bは、時効の起算点を遅らせて時効完成時期をCの登記の後にずらし、Cを「時効完成前の第三者」として扱うよう主張した。","h":"取得時効の完成時期は、時効の基礎となる事実（占有）の開始時を起算点として決めるべきで、援用者が任意に起算点を選択して完成時期を早めたり遅らせたりすることはできない。","pt":"起算点を後ろにずらして完成後の第三者を完成前の第三者に変えることはできない。時効完成後の第三者とは登記の先後で決まるという準則とセットで問われる。","kw":["起算点","任意に選択","時効完成後","取得時効","占有開始"]},{"n":"最判平成18年1月17日","f":"Aは隣地との境界付近の通路部分を多年にわたり占有し、取得時効が完成していた。時効完成後にBがその土地を買い受けて登記したが、Bは購入時、Aが通路として長年使用している事実を認識していた。","h":"時効完成後の譲受人が、時効取得者が多年にわたり占有している事実を認識しており、登記の欠缺を主張することが信義に反すると認められる事情があれば、背信的悪意者に当たる。時効完成の要件をすべて具体的に認識している必要はない。","pt":"時効完成後の第三者でも、背信的悪意者なら時効取得者は登記なく対抗できる。この場合の背信的悪意は「多年の占有の事実」の認識で足りる点が特徴。","kw":["時効完成後の第三者","背信的悪意者","多年にわたる占有","認識","取得時効"]},{"n":"最判昭和38年2月22日","f":"父の死亡により甲土地をBとCが共同相続した。Bは勝手に甲土地全部を自分の単独名義で相続登記し、Dに売却して移転登記をした。CはDに対し自己の持分を主張した。","h":"Bの単独登記のうちCの持分に関する部分は無権利の登記であり、登記に公信力がない以上、DもCの持分を取得できない。Cは自己の持分を登記なくDに対抗できる。","pt":"法定相続分は登記なく対抗できる。遺産分割や遺言で法定相続分を超えて取得した部分は登記がなければ第三者に対抗できない（899条の2で明文化）点と区別する。","kw":["共同相続","単独名義","無権利","公信力","法定相続分","登記なく対抗"]},{"n":"最判昭和42年1月20日","f":"父の死亡により相続人はBとCだったが、Cは家庭裁判所で相続放棄をした。ところがCの債権者Dが、Cも相続したものとして土地のCの持分を差し押さえる登記をした。BはDに対し、土地全部が自分のものだと主張した。","h":"相続放棄の効力は絶対的で、何人に対しても登記等なくしてその効力を生ずる。Bは登記がなくても差押債権者Dに対抗できる。","pt":"相続放棄は「初めから相続人でなかった」とみなされ（939条）、登記なく対抗できる。遺産分割による取得（法定相続分を超える部分は登記必要）と結論が逆になる点がひっかけ。","kw":["相続放棄","遡及効","絶対的","差押債権者","登記なく対抗"]},{"n":"最判昭和49年3月19日","f":"Aは所有地をCに賃貸し、Cはその土地上に登記した建物を所有していた。BがAからその土地を買い受けたが、所有権移転登記をしないまま、Cに賃料の支払を求めた。","h":"対抗要件を備えた賃借人は177条の第三者に当たり、土地の譲受人は所有権移転登記を経由しなければ、賃貸人たる地位を賃借人に対抗（賃料請求等）することができない。","pt":"現在は605条の2第3項で明文化（賃貸人たる地位の移転は所有権移転登記をしなければ賃借人に対抗できない）。不法占拠者には登記不要なのに、対抗力ある賃借人には登記が必要という対比で出る。","kw":["賃貸人たる地位","対抗要件を備えた賃借人","所有権移転登記","賃料請求","605条の2"]}]},"権利|共有・相隣":{"pts":["保存行為は各共有者が単独ででき、管理行為（軽微な変更、土地5年・建物3年以内の賃貸借等を含む）は持分の価格の過半数で決する。","形状又は効用の著しい変更を伴う変更には共有者全員の同意が必要。所在等不明共有者がいれば裁判所の決定で残りの共有者で決められる。","各共有者は共有物の全部を持分に応じて使用できる。共有者の1人が単独占有していても、他の共有者は当然には明渡請求できない。","共有者が持分を放棄し又は相続人なく死亡したとき、その持分は他の共有者に帰属する。分割禁止特約は5年以内（更新可）。","隣地使用権は一定目的のため必要な範囲で認められるが、住家への立入りは居住者の承諾が必要。原則あらかじめ通知する。","越境した竹木の根は自ら切り取れる。枝は所有者に切除させるのが原則だが、催告後相当期間内に切除しない等の場合は自ら切り取れる。","他の土地に囲まれ公道に通じない土地の所有者は囲繞地を通行できる。分割・一部譲渡で生じた袋地は他の分割者の土地のみ無償で通行できる。"],"traps":["「共有物の変更はすべて共有者全員の同意が必要」と出たら×。形状・効用の著しい変更を伴わない軽微な変更は持分の過半数で足りる。","「隣地の枝はいかなる場合も自ら切り取れない」と出たら×。催告後相当期間内に切除されない、所有者不明、急迫の事情の場合は可。","「持分を放棄した共有者の持分は国庫に帰属する」と出たら×。他の共有者に帰属する（255条）。"],"rel":["権利|区分所有法","権利|相続"],"bridge":"区分所有建物の共用部分にも共有の考え方があるが、変更・管理の決議は区分所有法の集会決議で行う。遺産共有も共有の一種で、相続開始から10年経過後は共有物分割手続でも分割できる場合がある。","sys":{"overview":"物権編の所有権の章。共有物に関する行為を保存・管理・変更に分けて決め方を押さえ、2023年4月施行の改正（軽微変更、所在等不明共有者、隣地使用権、枝の切取り、管理命令制度）と相隣関係の数字を整理する。","tree":[{"h":"共有の基本","items":["各共有者は全部を持分に応じて使用できる","使用する共有者は超過分の対価償還義務あり","持分の処分は各自自由","持分放棄・相続人なく死亡→他の共有者に帰属","単独占有者に当然には明渡請求できない（判例）"]},{"h":"行為の区分","items":["保存行為：各共有者が単独で可","管理行為：持分の価格の過半数","軽微な変更：持分の価格の過半数","著しい変更：共有者全員の同意","短期賃貸借（土地5年・建物3年以内）は管理"]},{"h":"不明共有者","items":["所在等不明共有者：裁判所の決定で除外可","賛否不明共有者：管理行為のみ除外可","不明共有者の持分の取得・譲渡の制度あり","遺産共有は相続開始から10年経過が必要"]},{"h":"分割","items":["各共有者はいつでも分割請求できる","分割禁止特約は5年以内（更新可）","協議が調わなければ裁判で分割","現物・賠償・競売による分割"]},{"h":"相隣関係","items":["隣地使用権：原則あらかじめ通知","住家への立入りは居住者の承諾が必要","越境した根は自ら切り取れる","枝は催告後相当期間内に切除なし等で自ら切除","ライフライン設備の設置・使用権"]},{"h":"通行・距離等","items":["袋地所有者は囲繞地を通行できる（償金必要）","分割・一部譲渡の袋地は残余地のみ無償通行","建物は境界線から50cm以上離す","1m未満の窓・縁側には目隠しが必要","所有者不明・管理不全の土地建物の管理命令"]}],"flow":{"title":"共有物の行為の決め方","steps":["持分の処分か→各共有者が単独で可","現状維持の保存行為か→単独で可","形状・効用の著しい変更か→全員の同意","それ以外の管理・軽微変更→持分価格の過半数","使用中の共有者に特別の影響→その承諾が必要","不明共有者がいれば裁判所の決定で除外"]},"tables":[{"title":"共有物の行為と要件","head":["行為","要件","例"],"rows":[["保存","単独","不実登記の抹消請求・修繕"],["管理","持分価格の過半数","管理者選任・使用者の決定"],["短期賃貸借","持分価格の過半数","土地5年・建物3年以内"],["軽微な変更","持分価格の過半数","著しい変更を伴わない工事"],["著しい変更","全員の同意","造成・全体の売却"],["持分の処分","単独","持分の売却・抵当権設定"]]},{"title":"相隣関係の数字・要件","head":["項目","ルール"],"rows":[["越境した根","自ら切り取れる"],["越境した枝","原則所有者に切除させる"],["枝を自ら切れる場合","催告後相当期間・所有者不明・急迫"],["隣地の住家への立入り","居住者の承諾が必要"],["建物と境界線","50cm以上離す"],["窓・縁側の目隠し","境界線から1m未満"],["囲繞地通行","償金必要・損害最少の場所"],["分割による袋地","残余地のみ・無償"]]},{"title":"不明共有者の扱い","head":["対象","管理","変更"],"rows":[["所在等不明共有者","○ 除外可","○ 除外可"],["賛否不明共有者","○ 除外可","×"],["通常（不明者なし）","持分価格の過半数","全員の同意"]]}]},"ex":[{"t":"持分2分の1では足りない","s":"A（持分2分の1）・B（4分の1）・C（4分の1）が乙建物を共有している。Aは単独の判断で乙建物をEに期間2年の定期建物賃貸借で貸そうとし、また、無権利者Fが勝手にしたF名義の登記の抹消を求めようとしている。","p":"建物の3年以内の賃貸は管理行為で、持分価格の過半数が必要だが、Aの2分の1は過半数に達しないのでBかCの賛成が必要（252条1項・4項）。ただし法定更新がある普通借家は3年以内に終わる保証がないため、過半数で決められるのは定期建物賃貸借などに限られると考えられている。不実登記の抹消請求は保存行為なのでAが単独でできる。3年を超える建物の賃貸は管理の範囲を超え、原則として全員の同意が必要になる。","kw":["持分の価格","過半数","賃貸","保存行為","3年"]},{"t":"越境した枝と根","s":"Aの土地に、隣地所有者Bの柿の木の枝と根が境界線を越えて伸びてきた。AはBに枝を切るよう催告したが、相当の期間が過ぎてもBは切らなかった。","p":"根は催告なしにAが自ら切り取れる。枝はBに切除させるのが原則だが、催告後相当期間内に切除されないとき、Bやその所在が分からないとき、急迫の事情があるときは、Aが自ら切り取れる（233条）。","kw":["竹木の枝","根","催告","相当の期間","急迫の事情","切り取る"]},{"t":"分割で生じた袋地","s":"Aは所有地を甲地と乙地に分け、公道に通じない乙地をBに売った。乙地は甲地のほか第三者C所有の丙地にも接しており、丙地を通る方が公道に近い。","p":"分割・一部譲渡で生じた袋地の所有者Bは、残りの甲地だけを、償金を払わずに通行できる（213条）。丙地を通行する権利は認められない。","kw":["公道に通じない","分割","袋地","償金","通行"]}],"around":[{"h":"隣地使用権","b":"境界付近の工作物の築造・修繕、境界標の調査・測量、越境した枝の切取りのために隣地を使用できる。原則あらかじめ目的・日時・場所・方法を通知し、住家への立入りは居住者の承諾が必要（209条）。"},{"h":"短期賃貸借の期間","b":"持分価格の過半数で決められる賃貸借は、樹木の栽植・伐採目的の山林10年、その他の土地5年、建物3年、動産6か月以内（252条4項）。"},{"h":"所在等不明共有者","b":"所在等が分からない共有者がいるときは、裁判所の決定を得て残りの共有者で変更・管理を決められる。持分の取得・譲渡の制度もあるが、遺産共有では相続開始から10年経過が必要。"},{"h":"持分放棄と分割禁止","b":"共有者が持分を放棄し、又は相続人なく死亡したときは、その持分は国庫ではなく他の共有者に帰属する（255条）。分割禁止の特約は5年以内で、更新もできる。"},{"h":"ライフライン設備","b":"他の土地に設備を設置しなければ電気・ガス・水道などの供給を受けられないときは、必要な範囲で他人の土地に設備を設置し、又は他人の設備を使用できる。あらかじめ目的・場所・方法を通知する。"}],"cases":[{"n":"最判昭和41年5月19日","f":"共同相続により建物を共有することになったA（持分の過半数）とB（少数持分）がいたが、Bが他の共有者と協議しないまま建物を単独で占有していた。AはBに対し建物の明渡しを請求した。","h":"少数持分権者も自己の持分によって共有物を使用収益する権原を有するので、多数持分権者であっても当然には明渡しを請求できない。明渡しを求めるには、その理由を主張・立証する必要がある。","pt":"「持分の過半数を有する共有者は単独占有者に当然に明渡請求できる」は×。なお現行法では、使用する共有者は他の共有者に使用の対価を償還する義務を負う（249条2項）。","kw":["単独占有","明渡請求","少数持分権者","持分の過半数","当然には"]},{"n":"最判昭和63年5月20日","f":"建物をA・B・Cが共有していたが、AとBはCの承認を得ないまま、第三者Dに建物の占有使用を認めた。CはDに対して建物の明渡しを請求した。","h":"共有者の一部から共有物の占有使用を承認された第三者は、その共有者の持分に基づく限度で占有使用する権原を有するので、承認しなかった他の共有者は、その第三者に当然には明渡しを請求できない。","pt":"第三者は承認した共有者の持分の範囲で使用権原を持つにとどまり、承認しなかった共有者に対し排他的な占有権原を主張することもできない。「承認しない共有者は当然に明渡請求できる」も「第三者は排他的占有権原を主張できる」も×。","kw":["第三者の占有","承認","明渡請求","持分に基づく限度","排他的占有"]},{"n":"最判平成12年4月7日","f":"A・Bが共有する土地を、Aが自己の持分を超えて単独で使用していた。Bは、Aに対し、自分の持分に相当する使用利益の支払を求めた。","h":"共有者の一人が持分を超えて共有物を単独で使用している場合、他の共有者は、地代相当額のうち自己の持分割合に応じた額について、不当利得金または損害賠償金の支払を請求できる。","pt":"明渡しは当然には請求できないが、金銭（持分相当の使用対価）は請求できる。現在は249条2項で「自己の持分を超える使用の対価を償還する義務」として明文化。","kw":["単独使用","不当利得","持分割合","地代相当額","使用の対価"]},{"n":"最判平成15年7月11日","f":"A・B・Cが共有する土地について、実体上の権利を持たないDが、Cの持分を譲り受けたとして持分移転登記をしていた。AはDに対し単独でその登記の抹消を請求した。","h":"共有者の一人は、共有不動産について実体上の権利を有しないのに持分移転登記を経由している者に対し、持分権に基づく妨害排除請求として、単独で抹消登記手続を請求できる。","pt":"不実登記の抹消請求は各共有者が単独でできる（保存行為的に扱われる）。「共有者全員でなければ抹消請求できない」は×。不法占拠者への明渡請求も各共有者が単独でできる。","kw":["不実の登記","抹消登記請求","単独","妨害排除","保存行為"]},{"n":"最判昭和39年2月25日","f":"A・B・Cが共有する建物をDに賃貸していたが、Dが賃料を滞納した。持分の過半数を有するAとBは、Cの同意を得ないまま、Dとの賃貸借契約を解除した。","h":"共有物を目的とする賃貸借契約の解除は、共有物の管理に関する事項に当たり、持分の価格の過半数で決することができる。解除権の不可分性（544条1項）の規定は適用されない。","pt":"賃貸借の解除は「管理行為」なので全員の同意は不要。全員でしなければならないとする544条1項の原則と区別する。","kw":["賃貸借契約の解除","管理行為","持分の価格の過半数","544条","不可分性"]},{"n":"最判平成10年3月24日","f":"A・Bが共有する土地について、AはBの同意を得ないまま、土地に土砂を搬入して造成するなど、共有物の形状を変える工事を始めた。BはAに対し工事の禁止と原状回復を求めた。","h":"共有者の一人が他の共有者の同意を得ずに共有物に変更を加える行為をしている場合、他の共有者は、その行為の禁止を求めることができ、変更後であれば原状回復を求めることもできる。","pt":"形状・効用の著しい変更は全員の同意が必要（251条1項）。無断の変更には差止め・原状回復を請求できる。形状・効用の著しい変更を伴わない軽微な変更なら持分の価格の過半数で足りる点（2023年4月施行の改正、251条1項かっこ書・252条1項）と合わせて問われる。","kw":["変更行為","全員の同意","差止め","原状回復","251条"]},{"n":"最判平成元年11月24日","f":"A・Bが土地を共有していたが、Aが相続人なく死亡した。Aには生前Aの療養看護に努めたCがおり、Cは特別縁故者として相続財産の分与を申し立てた。Bは、Aの持分は255条により自分に帰属すると主張した。","h":"共有者が相続人なく死亡した場合、その持分はまず特別縁故者への財産分与の対象となり、分与がされなかったときに初めて255条により他の共有者に帰属する。","pt":"「相続人なく死亡した共有者の持分は国庫に帰属する」は×（他の共有者に帰属）。ただし特別縁故者への分与が優先する。特別縁故者の条文は現在958条の2（2023年施行の改正で条番号が変更）。","kw":["相続人なく死亡","特別縁故者","255条","他の共有者に帰属","国庫"]},{"n":"最判平成8年12月17日","f":"Aは自己所有の建物で子Bと同居していた。Aが死亡し、BとCが建物を共同相続したが、Bは遺産分割前も引き続き建物に単独で住み続けた。CはBに対し、持分に応じた賃料相当額の支払を求めた。","h":"共同相続人の一人が被相続人の許諾を得て遺産建物に同居していた場合、特段の事情がない限り、被相続人死亡後も遺産分割終了までは無償で使用させる旨の合意（使用貸借）が推認され、他の相続人は賃料相当額を請求できない。","pt":"遺産共有も共有の一種。原則として持分を超える使用には対価償還義務があるが（249条2項）、合意による無償使用であれば請求できない。配偶者については現在は配偶者短期居住権（1037条）も規定されている。","kw":["遺産共有","同居","使用貸借","遺産分割","賃料相当額"]},{"n":"最判昭和47年4月14日","f":"Aの甲土地は他の土地に囲まれて公道に通じていない（袋地）。AはBの乙土地を通行していたが、Aは甲土地の所有権移転登記を備えていなかった。Bは登記がないことを理由にAの通行を拒んだ。","h":"袋地の所有権を取得した者は、所有権取得の登記がなくても、囲繞地の所有者・利用権者に対して囲繞地通行権を主張できる。","pt":"囲繞地通行権は相隣関係から法律上当然に生じる権利で、登記は不要。地役権（登記が対抗要件）と混同させるひっかけに注意。","kw":["袋地","囲繞地通行権","登記不要","相隣関係","公道に通じない"]},{"n":"最判平成2年11月20日","f":"Aは所有地を甲地と乙地に分筆し、袋地となった甲地をBに売却した。その後、Aは乙地をCに売却した。Bは、公道に出るために乙地以外の土地（Dの土地）を通行させるよう求めた。","h":"土地の分割・一部譲渡によって袋地が生じた場合、袋地の所有者は残余地（乙地）についてのみ無償の通行権を有し、この通行権は残余地が第三者に特定承継されても消滅しない。","pt":"分割・一部譲渡による袋地は、他の分割者・譲渡人の土地のみ通行でき、償金は不要（213条）。残余地が転売されても他の土地を通行できるようにはならない。","kw":["分割","一部譲渡","袋地","残余地","無償","特定承継"]},{"n":"最判平成11年7月13日","f":"Aの土地は幅員1.45mの通路で公道に通じていたが、建築基準法の接道要件（幅員2m以上）を満たさないため、建物の建築ができない状態だった。Aは、接道要件を満たすため、隣地の一部（幅0.55m）について囲繞地通行権があると主張した。","h":"囲繞地通行権（210条）と建築基準法の接道要件とは趣旨・目的が異なるので、接道要件を満たさないというだけで、隣地について接道要件を満たすための囲繞地通行権が当然に認められるものではない。","pt":"「建築基準法の接道要件を満たすためなら囲繞地通行権が当然に認められる」は×。通行権は通行の必要のためのもので、建築のための接道確保とは別に判断される。","kw":["囲繞地通行権","接道義務","建築基準法","公道に通じている","建替え"]}]},"権利|抵当権・担保":{"pts":["抵当権は付加一体物に及び、設定当時の従物（判例）や建物抵当権では借地権にも及ぶ。果実には債務不履行後に及ぶ。","物上代位は売却代金・賃料・保険金など目的物の価値代替物に及び、払渡し・引渡し前に差押えが必要。","利息その他の定期金は、満期となった最後の2年分についてのみ抵当権を行使できる。後順位者等がいなければ制限されない。","法定地上権は、設定時に土地上に建物があり、土地と建物が同一所有者で、競売により別々の所有者となった場合に成立する。","抵当権者に対抗できない建物賃借人は、買受人の買受けの時から6か月間明渡しが猶予される。土地の賃借人には適用されない。","抵当権消滅請求は第三取得者が競売による差押えの効力発生前にでき、主たる債務者・保証人やその承継人はできない。","根抵当権は極度額の範囲で担保し、元本確定前の被担保債権の範囲変更・債務者変更に後順位抵当権者等の承諾は不要。"],"traps":["「更地に抵当権設定後に建てた建物にも法定地上権が成立する」と出たら×。設定時に建物が存在することが要件。","「一括競売をした抵当権者は建物の代価からも優先弁済を受けられる」と出たら×。一括競売は任意で、優先弁済は土地の代価のみ。","「物上代位は差押えなしに保険金に及ぶ」と出たら×。払渡し・引渡し前に抵当権者自らが差し押さえる必要がある。"],"rel":["権利|借地","権利|賃貸借","権利|保証・連帯債務"],"bridge":"建物の抵当権は従たる権利である借地権に及び、抵当権登記後の賃借人は買受人に対抗できない。保証人は債務者の財産から回収する人的担保、抵当権は物から優先弁済を受ける物的担保である。","sys":{"overview":"物権編の担保物権。中心は抵当権で、効力の及ぶ範囲、物上代位、優先弁済の範囲（最後の2年分）、法定地上権、第三取得者・賃借人の保護、根抵当権との違いを押さえる。留置権・先取特権・質権との性質比較も出る。","tree":[{"h":"担保物権","items":["法定：留置権・先取特権","約定：質権・抵当権","共通性質：付従性・随伴性・不可分性","物上代位性は留置権にない"]},{"h":"効力の範囲","items":["付加一体物、設定当時の従物（判例）","建物抵当権は借地権にも及ぶ（判例）","果実は債務不履行後に及ぶ","利息等は満期となった最後の2年分","物上代位：差押えを払渡し前にする"]},{"h":"法定地上権","items":["設定時に土地上に建物が存在","設定時に土地と建物が同一所有者","土地・建物の一方又は双方に抵当権","競売で別々の所有者になる","更地に後で建てた建物→不成立"]},{"h":"利害関係人","items":["代価弁済：抵当権者の請求に応じて支払う","抵当権消滅請求：第三取得者から請求","消滅請求は競売の差押えの効力発生前まで","債務者・保証人・その承継人は消滅請求不可","建物賃借人は買受けから6か月明渡猶予"]},{"h":"一括競売等","items":["更地抵当後の建物も一括競売できる（任意）","優先弁済は土地の代価のみ","登記した賃貸借も抵当権者全員の同意＋登記で対抗可","順位の変更は登記が効力要件"]},{"h":"根抵当権","items":["一定範囲の不特定債権を極度額まで担保","利息等は極度額まで全部担保（2年制限なし）","確定前の範囲・債務者変更に後順位の承諾不要","元本確定期日は定めた日から5年以内","設定者の確定請求は設定から3年経過後"]}],"flow":{"title":"法定地上権の成立判定","steps":["抵当権設定時に土地上に建物があったか","設定時に土地と建物が同一所有者だったか","土地・建物の一方又は双方に抵当権があるか","競売で土地と建物の所有者が別になったか","全て○なら法定地上権が成立","更地なら一括競売（任意）を検討"]},"tables":[{"title":"抵当権と根抵当権","head":["項目","抵当権","根抵当権"],"rows":[["被担保債権","特定の債権","一定範囲の不特定債権"],["付従性・随伴性","あり","元本確定前はなし"],["利息の担保","最後の2年分","極度額まで全部"],["範囲・債務者の変更","—","確定前は可・承諾不要"],["元本確定期日","—","5年以内"],["確定請求（設定者）","—","設定から3年経過後"]]},{"title":"第三取得者・賃借人の保護","head":["制度","誰から","ポイント"],"rows":[["代価弁済","抵当権者の請求","代価支払で抵当権消滅"],["抵当権消滅請求","第三取得者","競売の差押えの効力発生前"],["明渡猶予","建物賃借人","買受けから6か月・土地は対象外"],["同意の登記","賃借人","全抵当権者の同意＋登記で対抗"]]},{"title":"担保物権の性質","head":["種類","物上代位","優先弁済"],"rows":[["留置権","×","×"],["先取特権","○","○"],["質権","○","○"],["抵当権","○","○"]]}]},"ex":[{"t":"法定地上権の成否","s":"Aは甲土地とその上の乙建物を所有し、甲土地だけにBのため抵当権を設定した。抵当権が実行され、Cが甲土地を買い受けた。","p":"設定時に土地上に建物があり、土地と建物が同一所有者だったので、乙建物のために法定地上権が成立する（388条）。甲土地が更地のときに抵当権を設定し後で建物を建てた場合は成立せず、Bは土地と建物を一括競売できるが、優先弁済は土地の代価に限られる（389条）。","kw":["法定地上権","同一の所有者","更地","一括競売","抵当権設定時"]},{"t":"火災保険金と差押え","s":"Aは自己所有の乙建物にBのための抵当権を設定していた。乙建物が火災で焼失し、AはD保険会社に対して1,500万円の火災保険金請求権を取得した。","p":"Bは保険金請求権に物上代位できるが、Dが保険金をAに払い渡す前に、B自身が差し押さえなければならない（372条・304条）。土地だけに抵当権を設定していた場合は、その土地上の建物の保険金に物上代位はできない。","kw":["物上代位","保険金","差押え","払渡し","価値代替物"]},{"t":"賃借人の明渡し猶予","s":"A所有の丙建物に2024年にBの抵当権設定登記がされ、2025年にCが丙建物を借りて住み始めた。2026年7月1日、競売でDが丙建物を買い受けた。","p":"Cは抵当権に対抗できないが、建物の使用者として買受けの時から6か月間は明渡しが猶予される（395条）。その間の使用の対価をDから相当期間を定めて1か月分以上催告され、支払わないと猶予は受けられない。土地の賃借人にはこの猶予はない。","kw":["抵当権設定登記後","建物の賃借人","6か月","買受人","明渡し"]}],"around":[{"h":"代価弁済と消滅請求","b":"代価弁済は抵当権者の請求に応じて第三取得者が代価を払うもの、抵当権消滅請求は第三取得者から申し出るもの。消滅請求は競売による差押えの効力発生前に限られ、債務者・保証人とその承継人はできない。"},{"h":"利息は最後の2年分","b":"抵当権で優先弁済を受けられる利息・遅延損害金は、満期となった最後の2年分に限られる（375条）。根抵当権には2年の制限はなく、極度額まで担保される。"},{"h":"順位の譲渡・放棄","b":"順位の譲渡では、譲り受けた者が譲渡人と自分の本来の配当合計から先に配当を受ける。順位の放棄では、その合計を両者の債権額の割合で分ける。他の抵当権者の配当は変わらない。"},{"h":"根抵当権の確定請求","b":"元本確定期日の定めがないとき、設定者は設定から3年経過後に確定を請求でき、請求から2週間で確定する。根抵当権者はいつでも請求でき、請求の時に確定する（398条の19）。"},{"h":"留置権と先取特権","b":"留置権はその物に関して生じた債権（牽連性）が必要で、物上代位も優先弁済もない。先取特権は法律が定める債権にだけ生じ、通常の貸金債権には生じない。"}],"cases":[{"n":"最判昭和44年3月28日","f":"Aは宅地にBのための抵当権を設定した。その宅地には、設定当時から石灯籠や取り外しのできる庭石などが置かれていた。抵当権が実行される際、これらの物にも抵当権の効力が及ぶかが争われた。","h":"抵当権設定当時に存在した従物（石灯籠・庭石等）にも抵当権の効力が及び、抵当権設定登記によってその対抗要件も備わる。","pt":"抵当権は付加一体物のほか、「設定当時の」従物にも及ぶ。設定後に備え付けた従物については争いがあるため、試験では「設定当時」の従物に及ぶとする判例として押さえる。","kw":["従物","設定当時","石灯籠","庭石","付加一体物"]},{"n":"最判昭和40年5月4日","f":"AはBから借りた土地の上に建物を所有し、その建物にCのための抵当権を設定した。抵当権が実行され、Dが建物を買い受けた。Dは建物の敷地の賃借権も取得したと主張した。","h":"借地上の建物に設定された抵当権の効力は、特段の事情がない限り、建物の従たる権利である敷地の賃借権（借地権）にも及ぶ。","pt":"買受人は借地権も取得するが、賃借権の譲渡になるため地主の承諾が必要で、承諾がなければ借地借家法20条の許可（代諾許可）を申し立てることになる。","kw":["借地権","従たる権利","建物抵当権","敷地の賃借権","買受人"]},{"n":"最判平成元年10月27日","f":"Aは自己所有の建物にBのための抵当権を設定した後、その建物をCに賃貸した。Aが借入金を返済しないため、BはAのCに対する賃料債権を差し押さえた。","h":"抵当権者は、抵当不動産の賃借人が支払う賃料債権に対して、物上代位権を行使することができる。","pt":"物上代位は売却代金・賃料・保険金・損害賠償請求権などに及び、払渡し・引渡し前に抵当権者自ら差し押さえる必要がある（372条・304条）。別途、債務不履行後は果実（賃料）にも抵当権の効力が及ぶ（371条）。","kw":["物上代位","賃料債権","差押え","抵当不動産","賃借人"]},{"n":"最判平成10年1月30日","f":"Aは賃貸ビルにBのための抵当権を設定し登記した。その後、AはCに対する将来の賃料債権を第三者Dに譲渡し、確定日付のある通知で対抗要件を備えた。その後、Bが物上代位により同じ賃料債権を差し押さえた。","h":"民法304条1項ただし書の「払渡し又は引渡し」には債権譲渡は含まれず、抵当権者は、物上代位の目的債権が譲渡され第三者対抗要件が備えられた後でも、自ら目的債権を差し押さえて物上代位権を行使できる。","pt":"抵当権の物上代位は抵当権設定登記で公示されているため、債権譲渡に優先する。「目的債権が譲渡され対抗要件を備えた後は物上代位できない」は×。","kw":["物上代位","債権譲渡","払渡し又は引渡し","差押え","抵当権設定登記"]},{"n":"最判平成13年3月13日","f":"Aは賃貸建物にBのための抵当権を設定し登記した。その後、賃借人CはAに対して貸金債権を取得した。BがAのCに対する賃料債権を物上代位により差し押さえたところ、Cは貸金債権と賃料債権の相殺を主張した。","h":"抵当権者が物上代位権を行使して賃料債権を差し押さえた後は、賃借人は、抵当権設定登記の後に賃貸人に対して取得した債権を自働債権とする相殺をもって、抵当権者に対抗することができない。","pt":"相殺できるかは「抵当権設定登記」と「自働債権の取得」の先後で決まる。登記後に取得した債権での相殺は抵当権者に対抗できない。","kw":["物上代位","相殺","賃料債権","抵当権設定登記","自働債権"]},{"n":"最決平成12年4月14日","f":"Aは自己所有の建物にBのための抵当権を設定し、建物をCに賃貸した。Cはさらに建物をDに転貸していた。Bは、CがDに対して有する転貸賃料債権に物上代位しようとした。","h":"抵当権者は、抵当不動産の賃借人を所有者と同視することを相当とする場合を除き、賃借人が取得する転貸賃料債権について物上代位権を行使することができない。","pt":"賃料には物上代位できるが、転貸賃料には原則できない。賃借人は被担保債権の弁済義務を負う者ではないため。例外は賃借人が所有者と同視できる場合（執行妨害目的のダミー会社など）。","kw":["転貸賃料","物上代位","賃借人","所有者と同視","原則できない"]},{"n":"最判昭和36年2月10日","f":"Aは更地の甲土地にBのための抵当権を設定した。設定当時、Aはすでに建物の建築に着手しており、Bも建物の築造をあらかじめ承認していた。その後完成した建物が残ったまま抵当権が実行され、Cが甲土地を買い受けた。","h":"土地への抵当権設定当時に地上に建物が存在しなかった場合は、建築に着手しており抵当権者が建物の築造を承認していたとしても、法定地上権は成立しない。","pt":"法定地上権は「抵当権設定時に建物が存在」が要件。更地に抵当権設定後に建てた建物は一括競売（389条）の対象になり得るが、優先弁済は土地の代価のみ。","kw":["法定地上権","更地","抵当権設定時","建物の存在","築造の承認"]},{"n":"最判平成2年1月22日","f":"甲土地はA、その上の建物はBが所有している状態で、甲土地にCの1番抵当権が設定された。その後、AがBから建物を取得して土地と建物が同一所有者になり、甲土地にDの2番抵当権が設定された。その後1番抵当権が実行された。","h":"土地の1番抵当権設定当時に土地と建物の所有者が異なっていた場合は、その後同一人の所有となって後順位抵当権が設定されたとしても、抵当権の実行により法定地上権は成立しない。","pt":"同一所有者要件は「1番抵当権設定時」で判断する。ただし1番抵当権が解除等で消滅した後に2番抵当権が実行された場合は、2番抵当権設定時に同一所有者であれば成立する（最判平成19年7月6日）。","kw":["法定地上権","同一所有者","1番抵当権","後順位抵当権","設定時"]},{"n":"最判平成9年2月14日","f":"Aは所有する甲土地と乙建物の両方にBのための共同抵当権を設定した。その後、Aは乙建物を取り壊して新建物を建てたが、新建物にはBの抵当権を設定しなかった。その後甲土地の抵当権が実行された。","h":"土地・建物に共同抵当権が設定された後、建物が取り壊されて新建物が建築された場合、新建物の所有者が土地所有者と同一であっても、新建物に土地と同順位の共同抵当権が設定されたなどの特段の事情がない限り、法定地上権は成立しない。","pt":"抵当権者は土地・建物全体の担保価値を把握しているので、再築で法定地上権を認めると土地の価値が下がり不当になるとの理由。土地のみに抵当権を設定していた場合の再築とは結論が異なる。","kw":["共同抵当","再築","新建物","法定地上権","特段の事情"]},{"n":"最判平成17年3月10日","f":"Aは所有建物にBのための抵当権を設定し登記した。その後、Aは競売を妨害する目的でCに建物を賃貸し、Cが占有を続けたため、競売の買受人が現れず売却価額が下落するおそれが生じた。BはCに対して建物の明渡しを求めた。","h":"抵当権設定登記後に所有者から占有権原の設定を受けた占有者でも、その設定に競売手続を妨害する目的があり、交換価値の実現が妨げられ優先弁済請求権の行使が困難となるときは、抵当権者は抵当権に基づく妨害排除請求ができ、所有者に適切な維持管理が期待できない場合は直接自己への明渡しを請求できる。","pt":"抵当権は非占有担保だが、競売妨害の占有には妨害排除請求ができる。不法占有者に対しては所有者の妨害排除請求権の代位行使も認められている（最判平成11年11月24日）。ただし賃料相当額の損害賠償は請求できない。","kw":["妨害排除請求","明渡請求","競売妨害","占有権原","交換価値"]},{"n":"最判昭和43年11月21日","f":"AはBに建物を売って引き渡したが、Bが登記をしないうちに、Aは同じ建物をCにも売って登記を移した。CがBに建物の明渡しを求めたところ、BはAに対する損害賠償債権を被担保債権として留置権を主張した。","h":"不動産の二重売買で第二買主が登記を備えた場合、第一買主は、売主の履行不能による損害賠償債権に基づいて、第二買主の引渡請求に対し留置権を主張することはできない。","pt":"留置権には「その物に関して生じた債権」（牽連性）が必要（295条）。二重譲渡の損害賠償債権や、物と無関係の貸金債権では成立しない。造作買取代金債権に基づく建物の留置権も否定されている（最判昭和29年1月14日）。","kw":["留置権","牽連性","二重売買","損害賠償債権","物に関して生じた債権"]}]},"権利|債務不履行・解除":{"pts":["履行遅滞の時期は、確定期限は期限到来時、不確定期限は到来後に請求を受けた時か到来を知った時の早い方、期限なしは請求時。","損害賠償には債務者の帰責事由が必要。履行遅滞中に当事者双方の責めに帰さない不能が生じたときは債務者の帰責事由とみなす。","原始的不能でも契約は無効とならず、債務不履行による損害賠償を請求できる（412条の2第2項）。","金銭債務は不可抗力をもって抗弁とできず、損害の証明も不要。損害賠償額は約定利率がなければ法定利率による（変動制）。","解除に債務者の帰責事由は不要。ただし不履行が債権者の帰責事由によるときは解除できない（543条）。","催告解除は相当期間を定めて催告し、期間経過時の不履行が軽微なときは解除できない（541条ただし書）。","全部の履行不能・明確な履行拒絶、定期行為の期間経過などは無催告で解除できる（542条）。解除しても損害賠償請求は可能。"],"traps":["「解除には債務者の責めに帰すべき事由が必要」と出たら×。2020年改正で不要となった。損害賠償との違いに注意。","「不確定期限の債務は期限到来の時から遅滞となる」と出たら×。請求を受けた時か到来を知った時のいずれか早い時から。","「原始的不能の契約は無効」と出たら×。契約は有効で、履行に代わる損害賠償を請求できる。"],"rel":["権利|売買・契約不適合","権利|物権変動・対抗"],"bridge":"契約不適合責任の解除・損害賠償は債務不履行の一般規定（541・542条、415条）によるため要件は共通。解除前・解除後の第三者の扱いは物権変動・対抗の論点となる。","sys":{"overview":"債権総論の中心。履行遅滞の時期、損害賠償（帰責事由が必要）と解除（帰責事由不要）の要件の違い、催告解除と無催告解除の区別、解除の効果（原状回復・第三者保護）を2020年改正後のルールで押さえる。","tree":[{"h":"履行遅滞","items":["確定期限：期限到来時","不確定期限：請求時か知った時の早い方","期限の定めなし：請求を受けた時","不法行為の賠償債務：不法行為時から"]},{"h":"履行不能","items":["原始的不能でも契約は有効（412条の2）","遅滞中の不能は債務者の帰責事由とみなす","債権者は反対給付の履行を拒める（危険負担）","債権者の帰責事由による不能→反対給付拒絶不可"]},{"h":"損害賠償","items":["債務者の帰責事由が必要","通常損害＋予見すべき特別損害","債権者の過失は過失相殺","賠償額の予定ができる"]},{"h":"金銭債務","items":["不可抗力をもって抗弁とできない","損害の証明不要","約定利率がなければ法定利率","法定利率は3年ごと見直し（2026年4月〜も年3%）"]},{"h":"解除の要件","items":["債務者の帰責事由は不要","債権者の帰責事由による不履行→解除不可","催告解除：相当期間を定めて催告","期間経過時の不履行が軽微なら解除不可","全部不能・明確な履行拒絶は無催告解除"]},{"h":"解除の効果","items":["原状回復義務（双方の同時履行）","金銭

","m":"50〜240㎡で1,200万控除"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H28-25-1","s":"不動産鑑定評価基準によれば、文化財の指定を受けた建造物のように市場性を有しない不動産については、依頼目的や条件に応じて、限定価格又は特定価格を求める場合がある。","a":0,"e":"市場性を有しない不動産の価格は特殊価格（文化財など）。限定価格・特定価格は市場性を有する不動産の価格である。","m":"市場性なしは特殊価格"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H28-25-2","s":"不動産鑑定評価基準によれば、同一需給圏とは、対象不動産と代替関係が成立して価格形成に影響を及ぼし合う不動産の存する圏域をいい、不動産の種類や規模に応じて範囲が狭くも広くもなり得る。","a":1,"e":"同一需給圏の範囲は、不動産の種類・性格・規模に応じた需要者の選好によって狭くも広域にもなる。","m":"需給圏は伸び縮みする"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H28-25-3","s":"不動産鑑定評価基準によれば、取引事例比較法において、売り急ぎや買い進みなど特殊な事情を含む取引事例は、事情補正をしたとしても、比準の事例として用いてはならない。","a":0,"e":"特殊事情を含む事例も、その事情を正常なものに補正（事情補正）できれば用いることができる。","m":"特殊事情は事情補正"},{"f":"業法","t":"監督・罰則","ref":"H28-26-1","s":"甲県知事免許の宅建業者Aが、自ら売主となる分譲マンションの売買で宅建業者でない買主に重要事項説明を行わなかった場合、Aは甲県知事から業務停止を命じられることがある。","a":1,"e":"35条の重要事項説明義務違反は業務停止処分事由。免許権者は1年以内の期間を定めて業務停止を命じられる（法65条2項）。","m":"重説違反は業務停止あり"},{"f":"業法","t":"監督・罰則","ref":"H28-26-2","s":"甲県知事免許の宅建業者Aが、乙県内で行った業務に関して著しく不当な行為をした場合でも、乙県知事は免許権者ではないため、Aに対して業務停止を命じることはできない。","a":0,"e":"業務地を管轄する知事も、指示処分・業務停止処分をすることができる（法65条4項）。免許取消しは免許権者のみ。","m":"業務地知事も停止できる"},{"f":"業法","t":"監督・罰則","ref":"H28-26-4","s":"甲県知事免許の宅建業者Aが、自ら所有する建物を宅建業者でない賃借人Bに直接賃貸する際に重要事項説明を行わなかった場合、Aは甲県知事から業務停止処分を受けることがある。","a":0,"e":"自ら貸主として賃貸することは宅建業の「取引」に当たらず、宅建業法の規制が及ばないので処分の対象外。","m":"自ら貸主は業法対象外"},{"f":"業法","t":"事務所・案内所","ref":"H28-29-ア","s":"宅建業者がマンション分譲のために設置した案内所で、売買契約の締結も申込みの受付も行わない場合であっても、その案内所には国土交通省令で定める標識を掲示しなければならない。","a":1,"e":"標識は、契約締結や申込受付を行うか否かにかかわらず案内所等に掲示が必要（法50条1項）。","m":"標識は契約しなくても"},{"f":"業法","t":"業務上の規制","ref":"H28-29-ウ","s":"宅建業者が、事務所ごとに備え付けている法第49条の帳簿について、取引の関係者から閲覧を求められたにもかかわらず閲覧させなかった場合でも、宅建業法には違反しない。","a":1,"e":"帳簿には取引関係者への閲覧義務はない。閲覧させる義務があるのは従業者名簿である（法48条4項）。","m":"閲覧義務は従業者名簿"},{"f":"業法","t":"8種制限","ref":"H28-29-エ","s":"宅建業者が自ら売主となって宅建業者でない買主とマンションの割賦販売契約を結んだ場合、買主が賦払金を支払期日に支払わなければ、催告をせずに直ちに契約を解除することができる。","a":0,"e":"30日以上の相当期間を定めて書面で催告し、その期間内に支払がない場合でなければ解除できない（法42条1項）。","m":"割賦解除は30日書面催告"},{"f":"業法","t":"重要事項説明","ref":"H28-30-1","s":"宅建業者が建物の貸借の媒介を行う場合、宅建業者でない借主となろうとする者に対して、借賃の額並びにその支払の時期及び方法を、35条の重要事項として説明しなければならない。","a":0,"e":"借賃の額・支払時期・方法は37条書面の必要的記載事項だが、35条の重要事項説明の対象ではない。","m":"借賃は37条、重説でない"},{"f":"業法","t":"37条書面","ref":"H28-30-3","s":"宅建業者は、建物の売買の媒介で契約を成立させた場合、37条書面の交付に代えて、相手方の承諾を得ることなく、書面に記載すべき事項を電磁的方法により提供することができる。","a":0,"e":"37条書面の電磁的方法による提供は、相手方の承諾を得た場合に限り認められる（法37条4項）。","m":"電子交付は承諾が必要"},{"f":"業法","t":"37条書面","ref":"H28-30-4","s":"宅建業者は、宅地の売買契約を成立させたときに交付する37条書面に宅建士をして記名させなければならないが、その書面の交付自体は宅建士でない従業者に行わせてもよい。","a":1,"e":"37条書面は宅建士の記名が必要だが、交付や説明は宅建士である必要はない（法37条3項）。","m":"記名は士、交付は誰でも"},{"f":"業法","t":"広告","ref":"H28-32-1","s":"宅建業者が、宅地造成工事に必要な開発許可等の処分があった宅地について、その処分があったことを明示したうえで、工事の完了前に販売広告を行っても、宅建業法に違反しない。","a":1,"e":"未完成物件でも、開発許可・建築確認等の必要な処分があった後であれば広告できる（法33条）。","m":"許可後なら完成前も広告可"},{"f":"業法","t":"広告","ref":"H28-32-2","s":"宅建業者が自ら売主として新築マンションを分譲する場合、建築確認の申請中であることを「建築確認申請済」と明示すれば、確認を受ける前でも販売広告を行うことができる。","a":0,"e":"未完成物件は建築確認等の処分を受けた後でなければ広告できない。申請中である旨の明示でも不可（法33条）。","m":"申請中は広告できない"},{"f":"業法","t":"広告","ref":"H28-32-4","s":"免許権者から業務の全部の停止を命じられた宅建業者が、停止期間中に未完成物件の販売広告のみを行い、売買契約は停止期間が経過した後に締結した場合には、宅建業法に違反しない。","a":0,"e":"広告も業務の一部であり、業務全部停止の期間中は広告もできない。契約時期は関係ない。","m":"停止中は広告もダメ"},{"f":"業法","t":"報酬","ref":"H28-33-イ","s":"宅建業者は、宅地の売買の媒介報酬の限度額とは別に、依頼者の依頼によらずに自らの判断で行った通常の広告の料金相当額を、報酬に合算して依頼者から受け取ることができる。","a":0,"e":"限度額とは別に受け取れるのは、依頼者の依頼による広告の料金や特別の費用に限られる。","m":"広告費は依頼あるときだけ"},{"f":"業法","t":"報酬","ref":"H28-33-ウ","s":"宅建業者が居住用建物の貸借の媒介を行い、借主から貸主へ返還されない権利金が授受される場合、宅建業者は権利金の額を売買代金とみなして、媒介報酬の限度額を計算することができる。","a":0,"e":"権利金を売買代金とみなして報酬を計算できるのは、居住用建物以外（宅地・事業用建物）の貸借に限られる。","m":"権利金計算は居住用以外"},{"f":"業法","t":"業務上の規制","ref":"H28-34-1","s":"宅建業者が賃貸アパートの媒介で、入居申込者が無収入と知りながら、申込書の収入欄に虚偽の年収が記載されたまま、その事実を告げずに貸主に提出した場合、宅建業法に違反する。","a":1,"e":"取引関係者の資力・信用に関する事項について、故意に事実を告げず又は不実を告げることは禁止されている（法47条1号）。","m":"資力の虚偽は告知違反"},{"f":"業法","t":"業務上の規制","ref":"H28-34-2","s":"宅建業者が分譲マンションの勧誘の際、計画の有無を確認せず、うわさをもとに「3年後には近くに必ず新駅ができる」と告げた場合、故意にだましたのでなければ宅建業法には違反しない。","a":0,"e":"将来の環境・交通の利便について誤解させる断定的判断の提供は、故意の有無を問わず禁止される（法47条の2第3項）。","m":"断定的判断は故意不要"},{"f":"業法","t":"業務上の規制","ref":"H28-34-4","s":"宅建業者が、手付金を用意できずに迷っている相手方に手付金の分割払いを持ちかけて宅地の売買契約の締結を勧誘した場合、契約に至らなかったとしても宅建業法に違反する。","a":1,"e":"手付の分割払い等の信用供与による契約締結の誘引は、誘引した時点で違反となる（法47条3号）。","m":"手付の信用供与は勧誘で違反"},{"f":"業法","t":"重要事項説明","ref":"H28-36-ア","s":"区分所有建物の売買の媒介で、敷地に定期借地権が設定されている場合、宅建業者はその定期借地権が登記されているか否かにかかわらず、その内容を重要事項として説明しなければならない。","a":1,"e":"区分所有建物では一棟の建物の敷地に関する権利の種類・内容が説明事項で、登記の有無は問わない。","m":"敷地の権利は登記不問"},{"f":"業法","t":"重要事項説明","ref":"H28-36-ウ","s":"建物の売買の媒介では、代金の額や支払方法は重要事項説明の対象ではないが、代金以外に授受される金銭があるときは、その金銭の額と授受の目的を重要事項として説明しなければならない。","a":1,"e":"代金・交換差金・借賃以外に授受される金銭の額と目的は35条の説明事項。代金自体は37条書面の記載事項。","m":"代金以外の金銭は重説"},{"f":"業法","t":"重要事項説明","ref":"H28-36-エ","s":"建物の貸借の媒介で、その建物が建築工事の完了前である場合、宅建業者は完了時の主要構造部、内装・外装の構造又は仕上げ、設備の設置及び構造を重要事項として説明しなければならない。","a":1,"e":"未完成物件は売買・貸借を問わず、完了時の形状・構造等を説明する（必要に応じ図面を交付）。","m":"未完成は完了時の姿を説明"},{"f":"業法","t":"免許","ref":"H28-37-ア","s":"甲県知事免許の宅建業者が乙県にも支店を設けて営業しているのに、免許換えの申請を怠っていたことが判明した場合、甲県知事はその業者に業務停止を命じることができるにとどまる。","a":0,"e":"免許換えをすべきなのに怠っていることは必要的免許取消事由であり、免許を取り消さなければならない（法66条1項5号）。","m":"免許換え怠りは必ず取消"},{"f":"業法","t":"免許の基準","ref":"H28-37-ウ","s":"免許の申請前5年以内に宅建業に関して不正又は著しく不当な行為をした者は、そのことについて拘禁刑や罰金などの刑罰を受けていなくても、宅建業の免許を受けることができない。","a":1,"e":"申請前5年以内に宅建業に関し不正又は著しく不当な行為をした者は、刑罰の有無を問わず欠格事由に当たる（法5条1項）。","m":"刑罰なくても5年は欠格"},{"f":"業法","t":"免許","ref":"H28-37-エ","s":"甲県知事免許の宅建業者が国土交通大臣への免許換えを申請している間は、従前の免許が効力を失っているため、重要事項説明書や37条書面を交付して宅建業を営むことはできない。","a":0,"e":"免許換えの申請中も従前の免許は有効で、新たな免許を受けた時に従前の免許が失効する。","m":"免許換え中も旧免許は有効"},{"f":"業法","t":"宅建士","ref":"H28-38-ア","s":"甲県知事の登録を受けている宅建士が乙県で業務に従事するため乙県知事に登録の移転を申請した場合、移転後に交付される宅建士証の有効期間は、交付の日から新たに5年間となる。","a":0,"e":"登録移転後に交付される宅建士証の有効期間は、従前の宅建士証の残りの有効期間となり、新たに5年とはならない。","m":"移転後は残存期間を引継ぐ"},{"f":"業法","t":"宅建士","ref":"H28-38-ウ","s":"宅建士が心身の故障により宅建士の事務を適正に行うことができない者として省令で定めるものに該当した場合、本人又はその法定代理人若しくは同居の親族は、30日以内に登録知事に届け出なければならない。","a":1,"e":"心身の故障に該当した場合は、本人・法定代理人・同居の親族が30日以内に届け出る（法21条3号）。","m":"心身故障は30日以内届出"},{"f":"業法","t":"重要事項説明","ref":"H28-39-1","s":"区分所有建物の貸借の媒介で、専有部分の用途その他の利用制限に関する規約の定めを重要事項説明書に記載して説明した場合でも、37条書面にも必ず記載しなければならない。","a":0,"e":"専有部分の用途その他の利用制限は35条の説明事項だが、37条書面の記載事項ではない。","m":"利用制限は重説だけ"},{"f":"業法","t":"37条書面","ref":"H28-39-2","s":"宅建業者が区分所有建物の貸借の媒介を行う場合において、契約の解除に関する定めがあるときは、その内容を重要事項として説明し、かつ37条書面にも記載しなければならない。","a":1,"e":"契約の解除に関する事項は35条の説明事項であり、定めがあれば37条書面の任意的記載事項にもなる。","m":"解除は重説と37条の両方"},{"f":"業法","t":"37条書面","ref":"H28-39-3","s":"宅建業者が区分所有建物の貸借の媒介を行う場合、借賃の額や支払の時期・方法について、貸主と借主の双方の承諾があれば、37条書面への記載を省略することができる。","a":0,"e":"借賃の額・支払時期・方法は37条書面の必要的記載事項であり、当事者の承諾があっても省略できない。","m":"借賃は37条の必須事項"},{"f":"業法","t":"営業保証金","ref":"H28-40-1","s":"金銭と国債証券で営業保証金を供託している宅建業者が本店を移転し最寄りの供託所が変わった場合、遅滞なく移転後の最寄りの供託所に新たに営業保証金を供託しなければならない。","a":1,"e":"保管替えは金銭のみで供託している場合に限られる。有価証券を含む場合は新たに供託（二重供託）が必要（法29条1項）。","m":"有価証券ありは二重供託"},{"f":"業法","t":"営業保証金","ref":"H28-40-2","s":"本店と支店を有する宅建業者が、営業保証金の還付により生じた不足額を供託した場合、供託書の写しを添付して、供託の日から30日以内に免許権者に届け出なければならない。","a":0,"e":"還付による不足額を供託したときは、供託した日から2週間以内に、供託書の写しを添えて免許権者へ届け出る。","m":"不足供託の届出は2週間"},{"f":"業法","t":"営業保証金","ref":"H28-40-4","s":"金銭と国債証券で営業保証金を供託している宅建業者が本店移転に伴い新たに供託した場合、従前の営業保証金を取り戻すには、還付請求権者に対して一定期間内に申し出るよう公告しなければならない。","a":0,"e":"本店移転で二重供託した場合は、公告をせずに従前の営業保証金を取り戻すことができる。","m":"二重供託の取戻しは公告不要"},{"f":"業法","t":"媒介契約","ref":"H28-41-1","s":"宅建業者が宅地の所有者から売却について依頼を受けた場合、媒介契約であれば書面の交付が必要だが、代理契約であれば、その契約内容を記載した書面を依頼者に交付する必要はない。","a":0,"e":"媒介契約書面の規定は代理契約にも準用されるので、代理契約でも書面の交付が必要（法34条の3）。","m":"代理も媒介と同じ書面"},{"f":"業法","t":"8種制限","ref":"H28-41-3","s":"宅建業者Aは、宅建業法上、宅建業者でないCが所有する宅地について、Cとの間で取得契約を結んでいなくても、自らを売主、宅建業者Dを買主とする売買契約を締結することができる。","a":1,"e":"自己の所有に属しない物件の売買制限は8種制限であり、買主が宅建業者の場合は適用されない（法78条2項）。","m":"業者間は他人物売買OK"},{"f":"業法","t":"媒介契約","ref":"H28-41-4","s":"宅建業者が依頼者との間で宅地の売却について専属専任媒介契約を締結した場合、契約締結の日から休業日数を含めて5日以内に、その宅地の情報を指定流通機構に登録しなければならない。","a":0,"e":"専属専任は休業日数を除いて5日以内、専任は休業日数を除いて7日以内に指定流通機構へ登録する。","m":"専属5日・専任7日、休日除く"},{"f":"業法","t":"37条書面","ref":"H28-42-1","s":"宅建業者Aが媒介業者として、宅建業者Bと宅建業者Cの間の宅地売買を媒介した場合、売主・買主がともに宅建業者であれば、Aは37条書面に宅地の引渡しの時期を記載する必要はない。","a":0,"e":"37条書面のルールは業者間取引にも適用される。引渡しの時期は必要的記載事項である。","m":"業者間も37条は省略不可"},{"f":"業法","t":"37条書面","ref":"H28-42-3","s":"宅建業者Aが自ら売主となり、宅建業者Dの媒介で宅建業者Eと宅地売買契約を結んだ場合、Dが自社の宅建士に37条書面へ記名させていれば、Aは自社の宅建士に記名させる必要はない。","a":0,"e":"37条書面の作成・交付義務は取引に関与した業者それぞれが負うので、Aも宅建士に記名させる必要がある。","m":"関与業者全員が記名"},{"f":"業法","t":"37条書面","ref":"H28-42-4","s":"宅建業者Aが貸主Fを代理して、借主Gとの間で建物賃貸借契約を成立させた場合、Aは代理の依頼者である貸主Fと借主Gの双方に対して、37条書面を交付しなければならない。","a":1,"e":"代理の場合は、代理を依頼した者と相手方の双方に37条書面を交付する（法37条2項）。","m":"代理なら双方に交付"},{"f":"業法","t":"8種制限","ref":"H28-43-ア","s":"宅建業者Aが自ら売主として宅建業者でない買主と建築工事完了前のマンション（代金3,000万円）の売買契約を結び、保全措置なく手付金600万円を受領しようとする場合、買主はその支払を拒むことができる。","a":1,"e":"未完成物件は代金の5%（150万円）又は1,000万円を超える手付金等の受領前に保全措置が必要。講じなければ買主は支払拒否できる。","m":"保全なしなら支払拒否可"},{"f":"業法","t":"8種制限","ref":"H28-43-イ","s":"宅建業者が自ら売主となる未完成物件の売買で保全措置を講じて手付金を受領した場合、その売買を媒介した宅建業者も、媒介報酬を受領する前に保全措置を講じなければならない。","a":0,"e":"手付金等の保全措置は自ら売主となる業者に課される義務で、媒介業者が講じる必要はない。","m":"保全は売主業者の義務"},{"f":"業法","t":"8種制限","ref":"H28-43-ウ","s":"代金3,000万円の未完成マンションの売主業者が、保全措置なく手付金150万円を受領した後に中間金350万円を受領する場合、中間金受領前に合計500万円について保全措置が必要である。","a":1,"e":"保全措置は受領済みの手付金を含めた手付金等の合計額について講じる。合計が5%を超える時点で全額が対象。","m":"保全は既受領分も合計"},{"f":"業法","t":"クーリング・オフ","ref":"H28-44-1","s":"宅建業者が自ら売主となる宅地の売買で、クーリング・オフについて告げる書面には、買主の氏名・住所と、売主業者の商号又は名称・住所・免許証番号を記載しなければならない。","a":1,"e":"告知書面には、買主の氏名・住所と、売主業者の商号又は名称・住所・免許証番号を記載する。","m":"告知書面に双方の情報"},{"f":"業法","t":"クーリング・オフ","ref":"H28-44-2","s":"宅建業者が自ら売主となる宅地の売買で、クーリング・オフについて告げる書面には、告げられた日から8日を経過するまでは、代金の全部を支払った場合を除き解除できる旨を記載すれば足りる。","a":0,"e":"解除できなくなるのは引渡しを受け、かつ代金全部を支払った場合。引渡しの要件を欠く記載では足りない。","m":"引渡し＋全額支払で終了"},{"f":"業法","t":"クーリング・オフ","ref":"H28-44-3","s":"宅建業者が自ら売主となる宅地の売買で、クーリング・オフについて告げる書面には、買主が契約を解除する場合、その効力は解除する旨の書面を発した時に生じることを記載しなければならない。","a":1,"e":"クーリング・オフは書面を発した時に効力が生じ、その旨を告知書面に記載する（法37条の2第2項）。","m":"解除は発信時に効力"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H28-45-1","s":"宅建業者が住宅販売瑕疵担保保証金の額を算定するにあたり、過去10年間に引き渡した販売新築住宅の合計戸数を数える際は、床面積が100㎡以下の住宅については2戸をもって1戸と数える。","a":0,"e":"2戸をもって1戸と数えるのは、床面積55㎡以下の住宅である。100㎡ではないので誤り。","m":"55㎡以下は2戸で1戸"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H28-45-2","s":"自ら売主として新築住宅を宅建業者でない買主に販売した宅建業者は、資力確保措置の状況について、その住宅の引渡しの日から3週間以内に免許権者に届け出なければならない。","a":0,"e":"届出は引渡しの日ではなく、基準日（毎年3月31日）から3週間以内に免許権者へ行う。","m":"基準日から3週間"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H28-45-3","s":"住宅販売瑕疵担保保証金を供託する宅建業者は、自ら売主として新築住宅を販売するとき、売買契約を締結するまでに、供託所の所在地等を記載した書面を交付して買主に説明しなければならない。","a":1,"e":"保証金を供託する売主業者は、契約締結までに供託所の所在地等を書面で交付（電磁的方法も可）して説明する。","m":"供託所の説明は契約前"},{"f":"税他","t":"住宅金融支援機構","ref":"H28-46-1","s":"独立行政法人住宅金融支援機構は、子どもを育成する家庭や高齢者の家庭に適した良好な居住性能等を有する賃貸住宅の建設又は改良に必要な資金の貸付けを、業務として行っている。","a":1,"e":"機構は原則として直接融資をしないが、子育て世帯・高齢者向け賃貸住宅の建設等の資金は例外的に直接貸し付ける。","m":"子育て高齢者賃貸は直接融資"},{"f":"税他","t":"住宅金融支援機構","ref":"H28-46-2","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において、賃貸住宅の建設又は購入に必要な資金の貸付けに係る金融機関の貸付債権も、譲受けの対象としている。","a":0,"e":"買取型の対象は、本人又は親族が居住する住宅の建設・購入資金の貸付債権であり、賃貸住宅向けは対象外。","m":"買取型は自分が住む家だけ"},{"f":"税他","t":"住宅金融支援機構","ref":"H28-46-4","s":"独立行政法人住宅金融支援機構は、民間金融機関の住宅ローンを支援する証券化支援業務とは別に、マンションの共用部分の改良に必要な資金の貸付けを、自らの業務として行っている。","a":1,"e":"マンション共用部分の改良資金の貸付けは、機構が例外的に直接行う融資業務の一つである。","m":"マンション共用部も直接融資"},{"f":"税他","t":"景品表示法","ref":"H28-47-1","s":"インターネットに掲載した賃貸物件が掲載の直後に契約済みとなったのに掲載を続けても、問合せがあった際に契約済みであると説明すれば、景品表示法上の不当表示には当たらない。","a":0,"e":"契約済みで取引できない物件の表示はおとり広告となり、問合せ時に説明しても不当表示に当たる。","m":"契約済み掲載はおとり"},{"f":"税他","t":"景品表示法","ref":"H28-47-3","s":"不動産の広告で、物件の近くにある小学校や市役所の存在を示すときは、「小学校、市役所近し」と表示すれば足り、物件からの道路距離や徒歩所要時間を示す必要はない、とされている。","a":0,"e":"公共・公益施設を表示する場合は、物件からの道路距離又は徒歩所要時間を明示しなければならない。","m":"施設は距離か徒歩分で"},{"f":"税他","t":"景品表示法","ref":"H28-47-4","s":"新設予定の鉄道駅について、その鉄道事業者が新駅の設置とその予定時期を公表している場合には、不動産の広告にその新設予定時期を明示して、新駅を表示することができる。","a":1,"e":"新設予定の駅等は、運行主体が公表したものに限り、新設予定時期を明示して表示できる（表示規約）。","m":"公表済みなら新駅表示可"},{"f":"税他","t":"土地・建物","ref":"H28-49-2","s":"花崗岩が風化してできた「まさ土」が分布する地帯では、豪雨時に土石流などの土砂災害が発生する危険性があり、近年の土石流災害によって、その危険性が改めて認識された。","a":1,"e":"まさ土は花崗岩の風化した砂質土で崩れやすく、広島の土石流災害（2014年）などで危険性が注目された。","m":"まさ土は崩れやすい"},{"f":"税他","t":"土地・建物","ref":"H28-49-3","s":"山麓や谷の出口などで、過去に土石流や土砂崩壊によって運ばれた土砂が堆積してできた地形は、すでに崩れた後なので再び崩壊する危険性が低く、宅地造成をして住宅地とするのに好適である。","a":0,"e":"土石流等の堆積地は、再び土石流や崩壊に見舞われるおそれがあり、住宅地として適さない。","m":"土石流の跡は再び危ない"},{"f":"税他","t":"土地・建物","ref":"H28-49-4","s":"丘陵地や台地の縁辺部の斜面では、傾斜角が25度を超えると崩壊地が急激に増加し、それより緩やかな斜面では、大雨が降っても崩壊はあまり発生しない傾向があるとされる。","a":1,"e":"斜面崩壊は傾斜25度を超えると急増し、それより緩い斜面では豪雨でもあまり起きない。","m":"25度超で崩壊急増"},{"f":"税他","t":"土地・建物","ref":"H28-50-1","s":"建築物の構造に関し、一般に鉄骨造は自重が大きく、靱性（ねばり強さ）が小さいことから、大空間を必要とする体育館などの建築物や高層の建築物には、あまり使用されない。","a":0,"e":"鉄骨造は自重が小さく靱性が大きいので、大空間や高層の建築物に適している。記述は逆。","m":"鉄骨は軽くて粘り強い"},{"f":"税他","t":"土地・建物","ref":"H28-50-2","s":"鉄筋コンクリート造の建築物においては、地震力等に抵抗するため、柱と梁を剛に接合して一体の骨組をつくるラーメン式の構造が、その骨組形式として一般に用いられている、とされる。","a":1,"e":"RC造の骨組形式は、柱と梁を剛接合して一体化したラーメン構造が一般的に用いられる。","m":"RC造はラーメン構造"},{"f":"税他","t":"土地・建物","ref":"H28-50-4","s":"耐火性は高いが耐震性の低いコンクリートブロック造を耐震的な構造にするためには、鉄筋コンクリートの布基礎及び臥梁によって、壁体の底部と頂部を固めることが必要であるとされる。","a":1,"e":"耐震性が低いブロック造は、鉄筋コンクリートの布基礎と臥梁で壁の上下を固めて耐震性を高める。","m":"ブロック造は布基礎と臥梁"},{"f":"権利","t":"時効","ref":"H29-02-1","s":"Bが所有の意思をもってA所有の甲土地を占有し続け、甲土地を時効取得した場合、Bが甲土地の所有権を取得するのは、占有を開始した時ではなく、取得時効が完成した時である。","a":0,"e":"時効の効力は起算日にさかのぼるため、Bは占有開始時から所有者であったことになる（民法144条）。","m":"時効は起算日に遡る"},{"f":"権利","t":"物権変動・対抗","ref":"H29-02-2","s":"Cが所有する乙建物を、所有権を持たないAが自分の建物だとしてBに売却した場合、BがAを所有者と信じ、そう信じたことに過失がなかったときは、Bは乙建物の所有権を取得する。","a":0,"e":"即時取得は動産に限られ、不動産には適用されない。無権利者から買ったBは原則として所有権を取得できない。","m":"不動産に即時取得なし"},{"f":"権利","t":"意思表示・行為能力","ref":"H29-02-4","s":"AがBの強迫を受けて自己所有の丁土地をBに売却した場合、丁土地の所有権はいったんBに移転するが、Aが強迫を理由に契約を取り消すと、所有権は初めからBに移転しなかったことになる。","a":1,"e":"強迫による意思表示は取り消すまで有効で、取り消すと初めから無効だったものとみなされる（民法96条1項・121条）。","m":"取消しで初めから無効"},{"f":"権利","t":"共有・相隣","ref":"H29-03-1","s":"建物を複数の者が共有している場合、共有者の一人は、持分に応じて建物全体を使用できるものの、他の共有者との協議を経ないまま、当然に建物を排他的に占有する権原を有するものではない。","a":1,"e":"各共有者は持分に応じて共有物全体を使用できるが、協議なく他の共有者を排除する排他的占有権原はない（判例）。","m":"共有者でも独占はできない"},{"f":"権利","t":"共有・相隣","ref":"H29-03-3","s":"建物を共有するDとEのうち、DのみがEとの協議を経ずにFに建物を無償で使用させた場合、Fは使用を承認していないEに対しても、建物全体を排他的に占有する権原を主張することができる。","a":0,"e":"FはDの持分に基づく限度で占有権原を持つにとどまり、承認していないEに対し排他的な占有権原は主張できない（判例）。","m":"一部の承認では独占不可"},{"f":"権利","t":"共有・相隣","ref":"H29-03-4","s":"甲建物をGとHが2分の1ずつ共有している場合において、他に特段の事情がないとき、Gがその持分を放棄したときは、Gの持分は国庫に帰属するのではなく、他の共有者であるHに帰属する。","a":1,"e":"共有者の一人が持分を放棄したときは、その持分は国庫ではなく他の共有者に帰属する（民法255条）。","m":"持分放棄は他の共有者へ"},{"f":"権利","t":"時効","ref":"H29-04-1","s":"民法によれば、権利についての協議を行う旨の合意が書面でされたときは、合意から1年を経過した時などのうち最も早い時までの間は、その権利についての時効は完成しない。","a":1,"e":"協議の合意による完成猶予。合意から1年、1年未満で定めた協議期間、続行拒絶通知から6か月のうち早い時まで（民法151条）。","m":"協議合意で完成猶予"},{"f":"権利","t":"共有・相隣","ref":"H29-04-2","s":"他の土地に囲まれて公道に通じない土地の所有者は、公道に至るため、その土地を囲んでいる他の土地のうち、自分が通りたい場所と方法を自由に選んで通行することができる。","a":0,"e":"通行の場所・方法は、通行権者に必要で、かつ他の土地のために損害が最も少ないものを選ばなければならない（民法211条1項）。","m":"通行は損害最小の場所"},{"f":"権利","t":"賃貸借","ref":"H29-04-4","s":"建物の賃借人は、賃貸借が終了したときは受け取った後に生じた損傷について原状回復義務を負うが、通常の使用収益によって生じた損耗や経年変化については、原状に復する義務を負わない。","a":1,"e":"賃借人の原状回復義務の対象から、通常損耗と経年変化は明文で除かれている（民法621条）。","m":"通常損耗は回復不要"},{"f":"権利","t":"相続","ref":"H29-06-2","s":"Aが死亡して子BとCが相続人となったが、遺産分割協議が成立する前にBが死亡した場合、Bの子EがBを代襲して相続人となり、Bの配偶者Dを除いて、Cとともに遺産分割協議を行う。","a":0,"e":"代襲相続はAより先にBが死亡した場合の制度。A死亡後のBの死亡ではBの相続人（配偶者D・子E）が地位を承継する。","m":"後に死亡は代襲でなく承継"},{"f":"権利","t":"相続","ref":"H29-06-3","s":"共同相続人の遺産分割前に、相続財産である賃貸不動産から生じた賃料債権は、各相続人が相続分に応じて確定的に取得し、後の遺産分割でその不動産を取得した相続人に清算する必要はない。","a":1,"e":"分割前の賃料債権は遺産とは別個の財産で、各共同相続人が相続分に応じて確定的に取得する（判例）。","m":"分割前の賃料は各自のもの"},{"f":"権利","t":"相続","ref":"H29-06-4","s":"Aが死亡し、その共同相続人がBとCの2名である場合に、Bが相続開始を知った時から3か月以内に家庭裁判所へ限定承認の申述をすれば、Cも限定承認をしたものとみなされる。","a":0,"e":"相続人が複数いるときは、限定承認は共同相続人の全員が共同してしなければならない（民法923条）。","m":"限定承認は全員で"},{"f":"権利","t":"不法行為・請負・委任","ref":"H29-07-2","s":"請負契約において、注文者の責めに帰すべき事由によって仕事の完成が不能となった場合、請負人は残りの仕事をする義務を免れるが、注文者に対して請負代金全額を請求でき、ただし自己の債務を免れたことで得た利益は注文者に償還しなければならない。","a":1,"e":"債権者の責めによる履行不能では反対給付を拒めず、債務を免れた利益は償還する（536条2項）。","m":"注文者のせい→代金全額"},{"f":"権利","t":"不法行為・請負・委任","ref":"H29-07-3","s":"請負人が完成させて引き渡した建物に契約内容に適合しない部分があり、注文者が修補に代わる損害賠償を請求している場合でも、注文者はその賠償を受ける前に、請負代金の全額を支払わなければならない。","a":0,"e":"修補に代わる損害賠償と報酬支払は同時履行の関係に立ち、注文者は賠償を受けるまで報酬全額の支払を拒める（533条、判例）。","m":"賠償と報酬は同時履行"},{"f":"権利","t":"不法行為・請負・委任","ref":"H29-07-4","s":"請負契約で請負人が担保責任を負わない旨の特約をした場合でも、請負人が仕事の目的物の契約不適合を知りながら注文者に告げなかったときは、その事実についての責任は免れることができない。","a":1,"e":"担保責任を負わない特約も有効だが、知りながら告げなかった事実は免責されない（559条・572条）。","m":"知って黙っていたら免責なし"},{"f":"権利","t":"相続","ref":"H29-09-4","s":"配偶者のいないAが死亡し、子Bは相続を放棄し、子CはAを強迫して遺言を妨げ相続欠格となった。この場合、Bの子EはBに代わって代襲相続人となり、Cの子FもCに代わって代襲相続人となる。","a":0,"e":"相続放棄は代襲原因ではないためEは相続人とならない。欠格は代襲原因なのでFは代襲相続する（887条2項）。","m":"放棄は代襲なし"},{"f":"権利","t":"相続","ref":"H29-09-3","s":"配偶者のいないAが死亡し、子B・C・Dのうち、Bは相続を放棄し、CはAを強迫して遺言を妨げたため相続欠格となった。Cに子Fがいる場合、相続人はDとFとなり、法定相続分はそれぞれ2分の1である。","a":1,"e":"放棄したBは初めから相続人でなく、欠格のCはFが代襲する。よってDとFが各2分の1（887条2項・939条）。","m":"欠格は代襲あり"},{"f":"権利","t":"借地","ref":"H29-11-2","s":"Aが所有する土地をBに賃貸する契約で存続期間を10年と定めた場合、建物所有目的であれば存続期間は30年となるが、資材置場として利用する目的であれば存続期間は10年となる。","a":1,"e":"建物所有目的なら借地借家法で最短30年（3条）。資材置場目的は民法が適用され、最長50年の範囲で約定どおり10年。","m":"建物目的かで法が変わる"},{"f":"権利","t":"借地","ref":"H29-11-3","s":"建物所有を目的とする土地の賃貸借契約において、一定期間ごとに地代を増額する旨の特約とともに、いかなる事情があっても地代の減額請求をしない旨の特約を定めた場合、借地権者は地代の減額を請求できない。","a":0,"e":"地代を増額しない特約は有効だが、減額しない特約は借地権者に不利で無効。事情変更があれば減額請求できる（借地借家法11条）。","m":"減額しない特約は無効"},{"f":"権利","t":"借家","ref":"H29-12-1","s":"AがBに建物を期間3年で賃貸した普通建物賃貸借において、Aが期間満了の1年前から6か月前までの間にBに更新しない旨の通知をすれば、正当事由の有無にかかわらず、契約は期間満了により終了する。","a":0,"e":"賃貸人からの更新拒絶の通知には正当事由が必要。正当事由がなければ従前と同一条件で更新したものとみなされる（借地借家法26条・28条）。","m":"貸主の拒絶は正当事由"},{"f":"権利","t":"借家","ref":"H29-12-2","s":"AがBに建物を賃貸した期間の定めのない普通建物賃貸借で、Aが解約の申入れをした日から3か月を経過すれば契約が終了する旨の特約は、Bがこれに同意していれば有効である。","a":0,"e":"賃貸人の解約申入れは申入れから6か月で終了する。これより賃借人に不利な特約は同意があっても無効（借地借家法27条・30条）。","m":"貸主の解約は6か月"},{"f":"権利","t":"借家","ref":"H29-12-4","s":"AがBに建物を賃貸する際に契約の更新がない旨を定める場合、公正証書等の書面（電磁的記録を含む）によって契約をしなければ、その更新がない旨の定めは無効となる。","a":1,"e":"定期建物賃貸借は書面（電磁的記録でも可）で契約することが要件。欠けると更新しない特約は効力を生じない（借地借家法38条）。","m":"定期借家は書面が必須"},{"f":"権利","t":"区分所有法","ref":"H29-13-2","s":"区分所有建物において、区分所有者の5分の1以上で議決権の5分の1以上を有する者は管理者に対し集会の招集を請求できるが、この定数は規約で減ずることはできない。","a":0,"e":"集会招集請求の定数（5分の1）は規約で減ずることができる（区分所有法34条3項）。","m":"招集請求の定数は減らせる"},{"f":"権利","t":"区分所有法","ref":"H29-13-3","s":"区分所有建物の区分所有者が、あらかじめ管理者に対して通知を受けるべき場所を通知していた場合、管理者は集会の招集通知をその場所に宛てて発すれば足りる。","a":1,"e":"通知場所の届出があればその場所に、なければ専有部分の所在場所に宛てて発すれば足りる（35条3項）。","m":"通知先の届出があればそこへ"},{"f":"権利","t":"区分所有法","ref":"H29-13-4","s":"区分所有建物の集会は、原則として会日の1週間前までに招集通知を発して招集するが、区分所有者全員の同意があるときは、招集の手続を経ることなく開くことができる。","a":1,"e":"区分所有者全員の同意があれば、招集手続を省略して集会を開くことができる（区分所有法36条）。","m":"全員同意で招集省略"},{"f":"権利","t":"不動産登記法","ref":"H29-14-1","s":"マンションなどの建物に「〇〇ハイツ」のような名称が付けられているときは、その名称も、建物の表示に関する登記の登記事項として登記記録に記録される。","a":1,"e":"建物の名称があるときは、その名称も建物の表示に関する登記の登記事項となる（不動産登記法44条）。","m":"建物の名称も表示登記"},{"f":"権利","t":"不動産登記法","ref":"H29-14-3","s":"AがBに土地を賃貸し、賃借権の設定の登記をする場合、BからAに敷金が交付されているときであっても、敷金があることやその額は賃借権の登記の登記事項とはならない。","a":0,"e":"賃借権の登記では、敷金があるときはその旨も登記事項となる（不動産登記法81条）。","m":"敷金も賃借権登記に載る"},{"f":"権利","t":"不動産登記法","ref":"H29-14-4","s":"土地について借地借家法23条1項の事業用定期借地権の定めのある賃借権の設定の登記をする場合、その事業用定期借地権である旨の定めも登記事項となる。","a":1,"e":"賃借権の登記では、事業用定期借地権である旨の定めも登記事項となる（不動産登記法81条）。","m":"事業用定借も登記事項"},{"f":"法令","t":"農地法","ref":"H29-15-1","s":"市街化区域内にある農地を、耕作の目的で所有者から賃借する場合には、あらかじめ農業委員会に届け出ておけば、農地法3条1項の許可を受ける必要はない。","a":0,"e":"市街化区域内の届出特例は4条・5条だけ。耕作目的の権利移動（3条）は市街化区域内でも農業委員会の許可が必要。","m":"3条に市街化区域特例なし"},{"f":"法令","t":"農地法","ref":"H29-15-3","s":"農地の所有者が金融機関から融資を受けるため、所有する農地に抵当権を設定する場合には、その設定について農地法3条1項または5条1項の許可を受ける必要がある。","a":0,"e":"抵当権の設定は使用収益権の移転を伴わないため、農地法3条・5条の許可はいずれも不要である。","m":"抵当権設定は許可不要"},{"f":"法令","t":"農地法","ref":"H29-15-4","s":"相続により農地の所有権を取得した者は、農地法3条1項の許可を受ける必要はないが、遅滞なく、その農地の所在する市町村の農業委員会にその旨を届け出なければならない。","a":1,"e":"相続による取得は3条許可不要だが、遅滞なく農業委員会への届出が必要（農地法3条の3）。","m":"相続は許可不要・届出要"},{"f":"法令","t":"都市計画法","ref":"H29-16-ア","s":"都市計画施設の区域内で建築物の建築をする場合、原則として都道府県知事等の許可が必要であるが、非常災害のため必要な応急措置として行う建築については許可は不要である。","a":1,"e":"都市計画施設等の区域内の建築は原則許可制だが、非常災害の応急措置等は除かれる（都市計画法53条）。","m":"応急措置は許可不要"},{"f":"法令","t":"都市計画法","ref":"H29-16-イ","s":"地区整備計画が定められている地区計画の区域内において、建築物の建築を行おうとする者は、原則として、あらかじめ都道府県知事等の許可を受けなければならない。","a":0,"e":"地区計画区域内の建築等は許可ではなく、着手30日前までに市町村長へ届出（都市計画法58条の2）。","m":"地区計画は市町村長へ届出"},{"f":"法令","t":"都市計画法","ref":"H29-16-エ","s":"都市計画事業の認可等の告示があった日の翌日から起算して10日を経過した後に、事業地内の土地建物等を有償で譲り渡そうとする者は、施行者の許可を受けなければならない。","a":0,"e":"事業地内の有償譲渡は許可ではなく、予定対価・相手方等を施行者に届け出る（都市計画法67条）。","m":"有償譲渡は施行者へ届出"},{"f":"法令","t":"建築基準法","ref":"H29-19-1","s":"用途地域の指定のない区域内の建築物の建蔽率の上限は、3/10から7/10までのうち、特定行政庁が土地利用の状況等を考慮し、都道府県都市計画審議会の議を経て定める数値である。","a":1,"e":"用途地域の指定のない区域の建蔽率は、特定行政庁が審議会の議を経て3/10〜7/10から定める（建築基準法53条）。","m":"無指定区域は特定行政庁"},{"f":"法令","t":"建築基準法","ref":"H29-19-3","s":"都市計画区域内において、幅員4m以上の道で建築基準法の規定が適用されるに至った際に現に存在するものは、特定行政庁の指定を受けなければ同法上の道路とならない。","a":0,"e":"適用時に現存する幅員4m以上の道は、指定がなくても法上の道路となる（建築基準法42条1項3号）。","m":"4m以上の既存道は当然道路"},{"f":"法令","t":"建築基準法","ref":"H29-19-4","s":"建築物の敷地が幅員の異なる2以上の道路に接している場合、前面道路の幅員による容積率の制限は、それらの道路の幅員のうち最も小さいものを基準として算定する。","a":0,"e":"前面道路が2以上あるときは、幅員の最大のものを基準とする（建築基準法52条2項）。","m":"前面道路は広い方"},{"f":"法令","t":"盛土規制法","ref":"H29-20-1","s":"宅地造成等工事規制区域内の宅地で、必要な擁壁が設置されていないため放置すると災害の発生のおそれが大きい場合、都道府県知事は土地の所有者・管理者・占有者に対して擁壁の設置等の工事を命ずることができる。","a":1,"e":"災害防止のため必要な擁壁等が未設置等で危険が大きいときは、知事は所有者等に改善命令を出せる（盛土規制法）。","m":"危険な宅地に改善命令"},{"f":"法令","t":"盛土規制法","ref":"H29-20-2","s":"都道府県知事は、宅地造成等工事規制区域内の土地の所有者等に対し、その土地や土地で行われている工事の状況について報告を求めることができるが、これは宅地造成等に関する工事に限られない。","a":1,"e":"知事は規制区域内の土地や工事の状況について報告を求められ、宅地造成等の工事かどうかを問わない（盛土規制法）。","m":"報告徴収は工事の種類問わず"},{"f":"法令","t":"盛土規制法","ref":"H29-20-4","s":"宅地造成等工事規制区域内において、宅地造成等に関する工事の許可を要しない排水施設の全部の除却工事を行う場合には、都道府県知事への届出も不要である。","a":0,"e":"擁壁・排水施設等の除却工事は、許可不要でも工事着手の14日前までに知事へ届け出る必要がある（盛土規制法21条）。","m":"除却工事は14日前届出"},{"f":"法令","t":"土地区画整理法","ref":"H29-21-1","s":"土地区画整理組合が事業の完成により解散しようとする場合には、総会の議決を経るだけでは足りず、都道府県知事の認可を受けなければ解散することができない。","a":1,"e":"総会の議決や事業の完成等による組合の解散には都道府県知事の認可が必要（土地区画整理法45条）。","m":"組合解散は知事認可"},{"f":"法令","t":"土地区画整理法","ref":"H29-21-3","s":"土地区画整理事業の事業計画の決定に先立って組合を設立する必要があると認められる場合、7人以上が共同して定款及び事業基本方針を定め、都道府県知事の認可を受けて組合を設立できる。","a":1,"e":"7人以上で定款と事業基本方針を定め、知事の認可を受けて設立できる（土地区画整理法14条2項）。","m":"7人以上で組合設立"},{"f":"法令","t":"土地区画整理法","ref":"H29-21-4","s":"土地区画整理組合が施行する土地区画整理事業において、施行地区内の宅地について所有権を持たず借地権のみを有する者は、その組合の組合員とはならない。","a":0,"e":"施行地区内の宅地の所有権者と借地権者は全員組合員となる（土地区画整理法25条）。借家人は組合員でない。","m":"借地権者も組合員"},{"f":"法令","t":"国土利用計画法","ref":"H29-22-2","s":"市街化区域内にある3,000㎡の土地を親族から贈与により取得した者は、取得後2週間以内に、国土利用計画法23条の事後届出を行わなければならない。","a":0,"e":"事後届出の対象は対価を得て行う土地売買等の契約。対価のない贈与は届出不要（国土利用計画法23条）。","m":"贈与は届出不要"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H29-24-1","s":"固定資産税は固定資産の所有者に課されるのが原則であるが、土地や家屋が第三者に賃貸されている場合には、その年度の固定資産税は所有者ではなく賃借人に課される。","a":0,"e":"賃借されていても納税義務者は所有者。質権者や100年超の地上権者は例外として課税される。","m":"賃借人には課税しない"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H29-24-3","s":"固定資産税の納税者は、固定資産課税台帳に登録された自己の土地の価格について不服がある場合、固定資産評価審査委員会に対して文書で審査の申出をすることができる。","a":1,"e":"登録価格への不服は、文書で固定資産評価審査委員会に審査の申出をする（地方税法432条）。","m":"価格の不服は審査委員会"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H29-24-4","s":"年度の賦課期日である1月1日に更地であった土地について、その後その年度中に住宅が建てられて住宅の敷地となった場合、その年度から住宅用地の課税標準の特例が適用される。","a":0,"e":"固定資産税は1月1日の状況で課税する。1月1日に住宅がなければその年度は住宅用地の特例は適用されない。","m":"1月1日の現況で判断"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H29-25-2","s":"地価公示法に基づき、土地鑑定委員会は、公示区域内の標準地について、毎年2回、一定の基準日における単位面積当たりの正常な価格を判定し、その結果を官報で公示する。","a":0,"e":"標準地の正常な価格の判定・公示は毎年1回、1月1日を基準日として行う（地価公示法2条）。","m":"公示は年1回"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H29-25-3","s":"標準地は、土地鑑定委員会が、自然的・社会的条件からみて類似の利用価値を有すると認められる地域において、土地の利用状況や環境等が通常と認められる一団の土地について選定する。","a":1,"e":"標準地は類似地域内で利用状況・環境等が通常と認められる一団の土地から選定する（地価公示法3条）。","m":"標準地は通常の一団の土地"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H29-25-4","s":"都市及びその周辺の地域等において土地の取引を行う者は、取引の対象となる土地に類似する利用価値を有する標準地の公示価格を指標として、取引を行わなければならない。","a":0,"e":"公示価格を指標として取引を行うよう努めなければならない、という努力義務にとどまる（地価公示法1条の2）。","m":"取引は努力義務"},{"f":"業法","t":"報酬","ref":"H29-26-1","s":"宅建業者A（貸主から依頼）とC（借主から依頼）が、月額借賃9万円（税抜）の店舗の賃貸借を媒介し権利金200万円（返還されないもの）が授受された。課税事業者のAとCが受領できる報酬の合計額の上限は22万円である。","a":1,"e":"居住用以外は権利金を売買代金とみなせる。200万×5%＝10万、税込11万を各依頼者から受領でき合計22万。借賃基準9.9万より大きい。","m":"店舗は権利金で計算可"},{"f":"業法","t":"報酬","ref":"H29-26-3","s":"宅建業者が居住用建物の貸借の媒介をした場合、依頼者に対して行った重要事項説明の対価として、法定の報酬とは別に一定の金額を依頼者から受領することができる。","a":0,"e":"報酬とは別に受領できるのは依頼者の依頼による広告費用や特別の依頼による費用のみ。重要事項説明の対価は受領できない。","m":"重説の対価は取れない"},{"f":"業法","t":"報酬","ref":"H29-26-4","s":"居住用建物の賃貸借の媒介で、退去時に全額返還される保証金100万円が授受された場合、宅建業者はこの保証金を売買代金とみなして報酬の限度額を計算することができる。","a":0,"e":"権利金で計算できるのは居住用以外の建物等で、返還されない権利金に限る。居住用・返還される保証金は不可。","m":"居住用は借賃基準のみ"},{"f":"業法","t":"8種制限","ref":"H29-27-ア","s":"宅建業者Aが自ら売主として宅建業者でない買主Bと宅地の売買契約を結ぶ際、契約不適合の通知期間を引渡しの日から2年間とする特約は、民法の規定より買主に不利なので無効である。","a":0,"e":"通知期間を引渡しから2年以上とする特約は、宅建業法40条の例外として有効となる。","m":"引渡しから2年以上はOK"},{"f":"業法","t":"8種制限","ref":"H29-27-イ","s":"宅建業者Aが自ら売主として宅建業者でない買主Bと宅地の売買契約を結ぶ際、Aに帰責事由がある場合に限り、引渡しの日から1年間だけ契約不適合責任を負うとする特約は無効である。","a":1,"e":"売主の帰責事由を要件とする点も、期間を引渡しから1年とする点も民法より買主に不利で無効（宅建業法40条）。","m":"1年特約・帰責限定は無効"},{"f":"業法","t":"8種制限","ref":"H29-27-ウ","s":"宅建業者Aが自ら売主として宅建業者でない買主Bと宅地の売買契約を結ぶ際、契約不適合があってもBは損害賠償請求のみでき契約の解除はできないとする特約は有効である。","a":0,"e":"民法では解除も認められるため、解除を排除する特約は買主に不利で無効（宅建業法40条2項）。","m":"解除を奪う特約は無効"},{"f":"業法","t":"業務上の規制","ref":"H29-28-ア","s":"宅建業者は、取引の関係者の秘密を保護するためであれば、事務所に備え付けた業務に関する帳簿を各事業年度末日の閉鎖後、遅滞なく専門業者に委託して廃棄することができる。","a":0,"e":"帳簿は事業年度末日に閉鎖し、閉鎖後5年間（自ら売主の新築住宅は10年間）保存しなければならない（宅建業法49条）。","m":"帳簿は閉鎖後5年保存"},{"f":"業法","t":"媒介契約","ref":"H29-28-イ","s":"宅建業者が宅地の売却について依頼者と専任代理契約を締結した場合、依頼者の要望があれば、指定流通機構に登録しない旨の特約を定めて登録をしないことができる。","a":0,"e":"代理契約にも媒介契約の規定が準用され、専任代理でも7日以内（休業日除く）の登録が必要。特約で免除できない。","m":"専任なら代理も登録義務"},{"f":"業法","t":"8種制限","ref":"H29-28-エ","s":"宅建業者が自ら売主として宅建業者でない買主から手付を受領した場合、買主が契約の履行に着手する前であれば、受領した手付を返還するだけで契約を解除することができる。","a":0,"e":"売主からの手付解除は手付の倍額を現実に提供する必要がある。返還するだけでは解除できない（宅建業法39条2項）。","m":"売主は倍返し"},{"f":"業法","t":"監督・罰則","ref":"H29-29-1","s":"甲県知事の免許を受けた宅建業者Aが、マンション管理業に関する不正な行為を理由に国土交通大臣から業務停止を命じられた場合、Aはこれを理由に甲県知事から宅建業法に基づく指示処分を受けることがある。","a":0,"e":"宅建業法の指示処分は宅建業に関する違反などが対象。他の法律による処分そのものは直接の理由とならない。","m":"他業の処分は対象外"},{"f":"業法","t":"監督・罰則","ref":"H29-29-2","s":"国土交通大臣は、乙県知事の免許を受けた宅建業者Bの事務所の所在地を確知できない場合、その旨を公告し、30日を経過しても申出がなければBの免許を取り消すことができる。","a":0,"e":"所在不明による免許取消しをできるのは免許権者だけ。Bの免許権者は乙県知事なので大臣は取り消せない（宅建業法67条）。","m":"取消しは免許権者のみ"},{"f":"業法","t":"監督・罰則","ref":"H29-29-4","s":"丙県知事の免許を受けた宅建業者Dが、丙県職員による事務所への立入検査を正当な理由なく拒んだ場合、Dは宅建業法に基づき50万円以下の罰金に処せられることがある。","a":1,"e":"立入検査を拒み、妨げ、忌避した者は50万円以下の罰金の対象となる（宅建業法83条）。","m":"検査拒否は50万以下罰金"},{"f":"業法","t":"宅建士","ref":"H29-30-1","s":"甲県知事の登録を受けている宅地建物取引士が、勤務先の事務所は変えずに住所だけを乙県に移した場合、乙県知事に対して登録の移転を申請することができる。","a":0,"e":"登録の移転は登録地以外の都道府県の事務所に従事する（しようとする）場合に限り申請でき、住所移転だけでは不可（19条の2）。","m":"住所移転では登録移転不可"},{"f":"業法","t":"事務所・案内所","ref":"H29-30-2","s":"甲県知事免許の宅建業者が、乙県内に契約の締結を行う案内所を設置する場合、業務を開始する日の10日前までに、甲県知事と乙県知事の双方に所定の事項を届け出なければならない。","a":1,"e":"契約締結・申込みを受ける案内所の届出は、業務開始の10日前までに免許権者と所在地の知事の両方に行う（50条2項）。","m":"案内所は10日前に両知事"},{"f":"業法","t":"宅建士","ref":"H29-30-3","s":"宅建試験に合格してから1年6か月を経過した者が宅地建物取引士証の交付を申請する場合、原則として交付申請前6か月以内に行われる都道府県知事指定の講習を受けなければならない。","a":1,"e":"法定講習が免除されるのは試験合格の日から1年以内に交付を受ける場合。1年を超えれば受講が必要（22条の2）。","m":"合格1年超は講習必要"},{"f":"業法","t":"営業保証金","ref":"H29-32-1","s":"営業保証金を金銭のみで供託している宅建業者が、主たる事務所の移転により最寄りの供託所が変わった場合、営業保証金を取り戻したうえで移転後の供託所に新たに供託しなければならない。","a":0,"e":"金銭のみで供託している場合は、遅滞なく従前の供託所に移転後の供託所への保管替えを請求する（宅建業法29条）。","m":"金銭のみなら保管替え"},{"f":"業法","t":"営業保証金","ref":"H29-32-3","s":"宅建業者が一部の事務所を廃止したことにより、超過額となった営業保証金を取り戻す場合、還付請求権者に対し、6か月以上の期間を定めて申し出るべき旨を公告しなければならない。","a":1,"e":"一部廃止による取戻しも、原則として6か月以上の期間を定めた公告が必要（宅建業法30条2項）。","m":"取戻しは6か月以上公告"},{"f":"業法","t":"営業保証金","ref":"H29-32-4","s":"営業保証金の還付により営業保証金に不足が生じた場合、宅建業者は、免許権者から不足額を供託すべき旨の通知書の送付を受けた日から2週間以内に、不足額を供託しなければならない。","a":1,"e":"還付による不足額は、通知書の送付を受けた日から2週間以内に供託しなければならない（宅建業法28条）。","m":"不足は通知から2週間"},{"f":"業法","t":"重要事項説明","ref":"H29-33-2","s":"宅建業者が宅地の売買を媒介する場合、代金に関する金銭の貸借のあっせんの内容と、そのあっせんに係る金銭の貸借が成立しないときの措置を、重要事項として説明しなければならない。","a":1,"e":"金銭の貸借のあっせんの内容と、あっせんに係る貸借が不成立のときの措置は、35条の重要事項説明の対象となる。","m":"ローン不成立時の措置も説明"},{"f":"業法","t":"重要事項説明","ref":"H29-33-3","s":"宅建業者が宅建業者でない者を相手方として建物の貸借を媒介する場合、その建物に接する私道に関する負担に関する事項を重要事項として説明しなければならない。","a":0,"e":"私道負担の説明が必要なのは宅地・建物の売買・交換と宅地の貸借。建物の貸借では不要。","m":"建物貸借は私道負担不要"},{"f":"業法","t":"重要事項説明","ref":"H29-33-4","s":"宅建業者が建物の売買を媒介する場合において、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を35条の重要事項として説明しなければならない。","a":0,"e":"危険負担（天災等による損害の負担）の定めは37条書面の記載事項で、35条の重要事項説明の対象ではない。","m":"危険負担は37条書面"},{"f":"業法","t":"業務上の規制","ref":"H29-34-1","s":"宅建業者が自ら売主となる宅地の売買で、宅建業者でない買主に対し、手付金の額を通常より減額することを提示して契約の締結を誘引しても、宅建業法に違反しない。","a":1,"e":"禁止されるのは手付の貸付けその他の信用供与による誘引。手付の減額は信用供与に当たらない（47条3号）。","m":"手付の減額はOK"},{"f":"業法","t":"業務上の規制","ref":"H29-34-3","s":"宅建業者が宅地の売買の媒介をした場合に、買主から分割払いの要望を受けて、法定の限度額の範囲内の媒介報酬を数回に分割して受領しても、宅建業法に違反しない。","a":1,"e":"報酬で禁止されるのは限度額を超える受領。分割受領は違反せず、手付の信用供与の規制とも無関係。","m":"報酬の分割受領はOK"},{"f":"業法","t":"業務上の規制","ref":"H29-34-4","s":"宅建業者が、手付について貸付けその他の信用の供与をすることにより契約の締結を誘引した場合、監督処分のほか、6月以下の拘禁刑もしくは100万円以下の罰金に処せられ、又はこれを併科されることがある。","a":1,"e":"手付の信用供与による誘引の禁止（47条3号）の違反は罰則の対象。2025年6月から懲役は拘禁刑に改められた。","m":"手付の貸付けは拘禁刑も"},{"f":"業法","t":"業務上の規制","ref":"H29-35-2","s":"複数の事務所を有する宅建業者は、業務に関する帳簿を主たる事務所に一括して備え付ければ足り、各従たる事務所にはそれぞれ帳簿を備え付ける必要はない。","a":0,"e":"業務に関する帳簿は、主たる事務所だけでなく事務所ごとに備え付けなければならない（宅建業法49条）。","m":"帳簿は事務所ごと"},{"f":"業法","t":"業務上の規制","ref":"H29-35-3","s":"宅建業者は事務所ごとに業務に関する帳簿を備えなければならないが、取引のあった都度、報酬の額を記載しなかった場合には、監督処分の対象となることがある。","a":1,"e":"報酬の額は帳簿の記載事項であり、記載を怠れば指示処分や業務停止処分の対象となる（49条）。","m":"帳簿に報酬額も記載"},{"f":"業法","t":"業務上の規制","ref":"H29-35-4","s":"宅建業者は、繁忙期に一時的に事務の補助のために雇用した者で宅建業に従事するものについては、事務所ごとに備える従業者名簿に記載する必要はない。","a":0,"e":"一時的に雇用した者でも宅建業に従事すれば従業者名簿への記載が必要（48条3項）。","m":"一時雇用も名簿に記載"},{"f":"業法","t":"免許","ref":"H29-36-1","s":"宅建業者が免許の有効期間満了前に更新の申請をしたにもかかわらず、満了日までに処分がされなかった場合、処分がされるまでの間、その業者は宅建業を営むことができない。","a":0,"e":"期間内に更新申請をしていれば、処分がされるまでの間は従前の免許がなお効力を有する（3条4項）。","m":"処分まで旧免許有効"},{"f":"業法","t":"免許","ref":"H29-36-3","s":"宅建業の免許を受けている法人が、宅建業以外の事業を新たに兼業するようになった場合、その日から30日以内に免許権者にその旨を届け出なければならない。","a":0,"e":"兼業は変更の届出事項ではない。届出は商号、役員・政令使用人、事務所、専任宅建士の氏名等の変更時（9条）。","m":"兼業は届出不要"},{"f":"業法","t":"免許","ref":"H29-36-4","s":"宅建業者である法人が宅建業者でない法人に吸収合併されて消滅した場合、存続法人は、消滅法人が締結した契約に基づく取引を結了する目的の範囲内で宅建業者とみなされる。","a":1,"e":"一般承継人は、被承継人が締結した契約に基づく取引を結了する目的の範囲で宅建業者とみなされる（76条）。","m":"合併後も取引結了まで"},{"f":"業法","t":"宅建士","ref":"H29-37-1","s":"宅地建物取引士は、重要事項説明の前に取引の相手方から請求を受けて宅地建物取引士証を提示していた場合、重要事項説明の際に改めて提示する必要はない。","a":0,"e":"重要事項説明の際は、請求の有無や事前の提示にかかわらず宅建士証を提示しなければならない（35条4項）。","m":"重説時は必ず提示"},{"f":"業法","t":"宅建士","ref":"H29-37-2","s":"甲県知事の登録を受けた宅地建物取引士が、乙県内の事務所に専任の宅地建物取引士として従事することになった場合、乙県知事に登録の移転を申請しなければならない。","a":0,"e":"登録の移転は「申請することができる」任意の制度であり、他県の事務所に従事しても義務ではない（19条の2）。","m":"登録移転は任意"},{"f":"業法","t":"宅建士","ref":"H29-37-3","s":"宅建試験の合格者で2年以上の実務経験を有する者、又は国土交通大臣の登録を受けた講習を修了した者は、登録の欠格事由に該当しなければ、合格した試験の都道府県知事の登録を受けられる。","a":1,"e":"登録には実務経験2年以上又は登録実務講習の修了が必要で、欠格事由に該当しないことも要件（18条1項）。","m":"実務2年か登録講習"},{"f":"業法","t":"37条書面","ref":"H29-38-1","s":"宅建業者Aが売主の代理人として宅建業者でない買主との間で宅地の売買契約を締結した場合、37条書面は買主に交付すれば足り、売主に交付する必要はない。","a":0,"e":"37条書面は契約の両当事者に交付する。代理の場合は買主のほか依頼者である売主にも交付が必要（37条1項）。","m":"37条は当事者双方へ"},{"f":"業法","t":"37条書面","ref":"H29-38-2","s":"宅建業者が自ら売主として宅建業者でない買主から手付金等を受領する場合でも、手付金等の保全措置の内容は37条書面の記載事項ではないので、記載しなくても宅建業法に違反しない。","a":1,"e":"手付金等の保全措置の概要は35条（重要事項説明）の対象で、37条書面の記載事項ではない。","m":"保全措置は35条だけ"},{"f":"業法","t":"37条書面","ref":"H29-38-4","s":"宅建業者が自ら売主となる宅地の売買で、契約不適合責任についての特約を定めた場合でも、買主が宅建業者であれば、その特約の内容を37条書面に記載しなくてよい。","a":0,"e":"担保責任の特約は37条書面の記載事項で、業者間取引でも省略できない（37条1項）。","m":"業者間でも37条は省略不可"},{"f":"業法","t":"営業保証金","ref":"H29-39-ア","s":"営業保証金を供託している宅建業者が従たる事務所を新たに設置した場合、その従たる事務所の最寄りの供託所に、新設分の営業保証金を供託しなければならない。","a":0,"e":"営業保証金は従たる事務所の分も含め、主たる事務所の最寄りの供託所に供託する（25条1項）。","m":"供託は本店最寄り"},{"f":"業法","t":"保証協会","ref":"H29-39-ウ","s":"保証協会の社員である宅建業者がその地位を失った場合、宅建業を続けるには、社員の地位を失った日から1週間以内に営業保証金を供託しなければならない。","a":1,"e":"社員の地位を失ったときは、その日から1週間以内に営業保証金を供託しなければならない（64条の15）。","m":"社員失格→1週間で供託"},{"f":"業法","t":"保証協会","ref":"H29-39-エ","s":"保証協会の社員である宅建業者は、弁済業務保証金の還付に係る還付充当金を納付すべき旨の通知を保証協会から受けた日から2週間以内に、その金額を保証協会に納付しなければならない。","a":1,"e":"還付充当金は保証協会から通知を受けた日から2週間以内に納付する（64条の10）。","m":"還付充当金は2週間"},{"f":"業法","t":"37条書面","ref":"H29-40-1","s":"宅建業者が宅地の売買の媒介を行う場合、代金の支払時期と引渡しの時期を重要事項説明書に記載して説明していれば、37条書面にはこれらを記載する必要はない。","a":0,"e":"代金の支払時期や引渡し時期は37条書面の必要的記載事項で、重要事項説明で説明済みでも省略できない。","m":"支払・引渡時期は37条"},{"f":"業法","t":"37条書面","ref":"H29-40-2","s":"宅建業者Aが自ら売主として宅建業者Bの媒介により売買契約を締結した場合、37条書面にBの宅地建物取引士が記名していれば、Aの宅地建物取引士は記名しなくてよい。","a":0,"e":"37条書面には、交付義務を負う宅建業者それぞれの宅建士が記名する必要がある（37条3項）。","m":"業者ごとに宅建士記名"},{"f":"業法","t":"37条書面","ref":"H29-40-3","s":"宅建業者が媒介した売買契約で、宅地建物取引士が37条書面を買主に交付する際、買主から請求がなかったので宅地建物取引士証を提示しなかったとしても、宅建業法に違反しない。","a":1,"e":"宅建士証の提示が必要なのは取引関係者から請求があったときと重要事項説明のとき。37条書面の交付時は不要。","m":"37条交付時は提示不要"},{"f":"業法","t":"重要事項説明","ref":"H29-41-2","s":"宅建業者が宅建業者でない買主に対して中古建物の売買を媒介する場合、売主から買主への所有権移転登記の申請の時期を重要事項として説明しなければならない。","a":0,"e":"移転登記の申請時期は37条書面の記載事項であり、35条の重要事項説明の対象ではない。","m":"登記申請時期は37条"},{"f":"業法","t":"重要事項説明","ref":"H29-41-3","s":"宅建業者が宅地の売買を媒介する場合、宅地内のガス配管設備の所有権が売買後も家庭用プロパンガス販売業者に残るときは、その旨を重要事項として説明する必要がある。","a":1,"e":"ガス等の供給施設の整備状況の説明に当たり、配管の所有権が販売業者に残る旨も説明が求められる（35条、解釈運用）。","m":"ガス配管の所有者も説明"},{"f":"業法","t":"重要事項説明","ref":"H29-41-4","s":"区分所有建物の売買の媒介で、計画的な維持修繕費用の積立てを行う旨の規約の定めがあるときは、その内容と既に積み立てられている額を重要事項として説明しなければならない。","a":1,"e":"修繕積立金の規約の定めがあるときは、その内容と既積立額（滞納があればその額）を説明する（35条、規則）。","m":"修繕積立金は額まで"},{"f":"業法","t":"広告","ref":"H29-42-イ","s":"宅建業者の広告で誇大広告が禁止される「現在又は将来の利用の制限」には、都市計画法等による公法上の制限だけでなく、借地権の有無やその内容などの私法上の制限も含まれる。","a":1,"e":"利用の制限には公法上の制限のほか、借地権・地上権等の有無や内容といった私法上の制限も含まれる（32条）。","m":"私法上の制限も含む"},{"f":"業法","t":"広告","ref":"H29-42-ウ","s":"宅建業者が実際には売る意思のない条件の良い物件を広告して顧客を集めた場合でも、その広告を見た者が実際に誤認しなかったときは、誇大広告等の禁止に違反しない。","a":0,"e":"おとり広告は誇大広告に当たり、相手が誤認したか、損害が生じたかを問わず広告をした時点で違反となる（32条）。","m":"おとり広告は即違反"},{"f":"業法","t":"広告","ref":"H29-42-エ","s":"宅建業者は、宅地の販売広告をする際に取引態様の別を明示していても、その広告を見た者から注文を受けたときは、遅滞なく改めて取引態様の別を明らかにしなければならない。","a":1,"e":"取引態様の明示は広告時と注文を受けた時の両方で必要。広告時と同じでも省略できない（34条）。","m":"広告時と注文時の2回"},{"f":"業法","t":"媒介契約","ref":"H29-43-ア","s":"宅建業者Aが売主Bと専任媒介契約（専属専任媒介契約ではない）を締結した。Aは2週間に1回以上業務の処理状況をBに報告するほか、物件の購入申込みがあったときは遅滞なくその旨をBに報告しなければならない。","a":1,"e":"専任媒介は2週間に1回以上の業務報告が必要。購入の申込みがあった旨の報告は、媒介契約の種類を問わず遅滞なく行う（34条の2）。","m":"専任2週・専属専任1週"},{"f":"業法","t":"媒介契約","ref":"H29-43-イ","s":"宅建業者Aが宅建業者Bから専任媒介の依頼を受ける場合、依頼者Bも宅建業者であるから、両者が合意すれば、有効期間満了時に自動的に更新する旨の特約を有効に定めることができる。","a":0,"e":"専任媒介の有効期間は3か月以内で、更新には依頼者の申出が必要。依頼者が宅建業者でもこの規制は適用され、自動更新特約は無効。","m":"業者相手でも自動更新×"},{"f":"業法","t":"媒介契約","ref":"H29-43-ウ","s":"専任媒介契約を締結した宅建業者Aが物件を指定流通機構に登録した場合、Aは指定流通機構が発行する登録を証する書面を依頼者に提示すれば足り、引き渡す必要はない。","a":0,"e":"登録を証する書面は、遅滞なく依頼者に引き渡さなければならない（34条の2）。提示するだけでは足りない。","m":"登録証明書は「引渡し」"},{"f":"業法","t":"媒介契約","ref":"H29-43-エ","s":"専任媒介契約を締結した宅建業者Aは、指定流通機構への情報登録に要した費用について、依頼者から特別の依頼がなくても、報酬の限度額とは別に依頼者に請求することができる。","a":0,"e":"報酬と別に受領できるのは、依頼者の依頼による広告費や特別の費用に限られる。指定流通機構への登録費用は請求できない。","m":"登録費用は請求できない"},{"f":"業法","t":"免許","ref":"H29-44-1","s":"免許を受けている宅建業者A社が、免許を受けていないB社に吸収合併されて消滅した場合、存続会社であるB社はA社の免許を承継し、そのまま宅地建物取引業を営むことができる。","a":0,"e":"免許は一身専属的なもので、合併や相続によって承継されない。B社が宅建業を営むには自ら免許を受ける必要がある。","m":"免許は承継されない"},{"f":"業法","t":"免許","ref":"H29-44-3","s":"甲県知事の免許を受けている個人の宅建業者Aが死亡した場合、Aの相続人がその死亡を知った日から30日以内に甲県知事へ届け出ると、Aの免許はその届出の日に効力を失う。","a":0,"e":"相続人は死亡を知った日から30日以内に届け出るが、免許は届出時ではなく死亡の時に効力を失う（11条）。","m":"死亡は死亡時に失効"},{"f":"業法","t":"免許","ref":"H29-44-4","s":"宅建業者である法人が合併及び破産手続開始の決定以外の理由で解散した場合、その清算人は解散の日から30日以内に免許権者へ届け出なければならず、免許は届出の時に効力を失う。","a":1,"e":"合併・破産以外の解散では清算人が解散日から30日以内に届け出る。この場合、免許は届出の時に失効する（11条）。","m":"解散は清算人が届出"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H29-45-1","s":"宅建業者Aが自ら売主として宅建業者でない買主Bに新築住宅を販売する場合、Aは住宅販売瑕疵担保保証金を供託している供託所の所在地等について、住宅の引渡しまでにBに書面を交付して説明すればよい。","a":0,"e":"供託所の所在地等の説明と書面交付は、売買契約を締結するまでに行う必要がある。引渡しまででは遅い。","m":"説明は契約締結まで"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H29-45-2","s":"宅建業者が自ら売主として新築住宅を販売し、住宅販売瑕疵担保保証金を供託する場合、その額を算定する基礎となる販売新築住宅の合計戸数の計算では、床面積が55㎡以下の住宅は2戸をもって1戸と数える。","a":1,"e":"保証金の算定戸数では、床面積55㎡以下の新築住宅は2戸で1戸と数える特例がある。","m":"55㎡以下は2戸で1戸"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H29-45-4","s":"新築住宅の売主である宅建業者が締結した住宅販売瑕疵担保責任保険契約では、給水設備やガス設備の瑕疵によって生じた損害も、引渡しから10年間は保険金の支払対象となる。","a":0,"e":"対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵に限られる。給水・ガス設備の瑕疵は対象外。","m":"対象は構造と雨水だけ"},{"f":"税他","t":"住宅金融支援機構","ref":"H29-46-1","s":"住宅金融支援機構の団体信用生命保険業務では、貸付けを受けた者が死亡した場合だけでなく、重度障害の状態となった場合にも、支払われる保険金を貸付債務の弁済に充てることができる。","a":1,"e":"団体信用生命保険業務では、死亡のほか重度障害となった場合も、保険金を貸付けに係る債務の弁済に充当できる。","m":"団信は死亡＋重度障害"},{"f":"税他","t":"住宅金融支援機構","ref":"H29-46-3","s":"住宅金融支援機構の証券化支援事業（買取型）において、機構が民間金融機関から買い取る住宅ローンの貸付金利は機構が定めるため、どの取扱金融機関で借り入れても同一の金利となる。","a":0,"e":"買取型の住宅ローン金利は、取扱金融機関がそれぞれ決めるため、金融機関ごとに異なる。","m":"買取型の金利は機関ごと"},{"f":"税他","t":"住宅金融支援機構","ref":"H29-46-4","s":"住宅金融支援機構が証券化支援事業（買取型）で譲り受ける貸付債権には、住宅の購入に付随する土地等の取得資金のほか、購入に付随するその住宅の改良に必要な資金に係るものも含まれる。","a":1,"e":"住宅の建設・購入に付随する土地や借地権の取得資金、購入に付随する住宅改良資金に係る債権も譲受けの対象となる。","m":"購入付随の改良資金もOK"},{"f":"税他","t":"景品表示法","ref":"H29-47-1","s":"宅建業者が他の業者から入手した物件情報をそのまま自社のインターネットサイトに掲載した場合、その情報が事実と異なっていても、自ら作成した情報ではないので不当表示となることはない。","a":0,"e":"インターネット広告も表示規制の対象。入手した情報の転載であっても、内容が事実と異なれば不当表示に当たり得る。","m":"転載でも責任あり"},{"f":"税他","t":"景品表示法","ref":"H29-47-3","s":"宅建業者がインターネット広告で物件を紹介する際、最寄り駅からの道路距離が420mの物件について、徒歩所要時間を「駅から徒歩5分」と表示しても、不当表示には当たらない。","a":0,"e":"徒歩所要時間は道路距離80mにつき1分で計算し、1分未満の端数は切り上げる。420mは5.25分なので6分と表示する。","m":"80mで1分・端数切上げ"},{"f":"税他","t":"景品表示法","ref":"H29-47-4","s":"新築分譲マンションの広告で、パンフレットには全戸の専有面積を表示し、インターネット広告では最小面積と最大面積のみを表示した場合、面積の表示について不当表示には当たらない。","a":1,"e":"新築分譲住宅等の面積は、パンフレット等を除き、最小面積と最大面積のみで表示することができる（表示規約）。","m":"面積は最小・最大でOK"},{"f":"税他","t":"土地・建物","ref":"H29-49-1","s":"扇状地は、山地から河川によって運ばれた砂礫等が谷の出口付近に扇形に堆積してできた地形であり、一般に砂礫層からなるため、宅地としての地盤は比較的良好であるとされる。","a":1,"e":"扇状地は谷の出口に砂礫が堆積してできた地形で、砂礫層のため地盤は比較的強い。ただし土石流には注意。","m":"扇状地は砂礫で固め"},{"f":"税他","t":"土地・建物","ref":"H29-49-3","s":"台地は、一般に水はけが良く地盤が安定しているため、周囲の低地と比べると、洪水や地震などの自然災害に対する安全度が高く、宅地に適している土地が多いとされる。","a":1,"e":"台地は一般に地盤が安定し水はけも良いため、低地より自然災害に強い。ただし縁辺部や浅い谷には注意。","m":"台地は低地より安全"},{"f":"税他","t":"土地・建物","ref":"H29-49-4","s":"埋立地は一般に海面に対して比高を持つが、海や湖を仕切って水を抜いた干拓地で海面より低いことが多い土地と比べると、水害に対してはより危険であるとされている。","a":0,"e":"埋立地は海面より高く造成されるのに対し、干拓地は海面より低いことが多い。水害の危険は干拓地の方が大きい。","m":"水害は干拓地が危険"},{"f":"税他","t":"土地・建物","ref":"H29-50-1","s":"木造建築物に用いる木材の強度は含水率の影響を受けるが、十分に乾燥して含水率が小さい状態の方が、水分を多く含み含水率が大きい状態よりも、強度は低くなる。","a":0,"e":"木材は乾燥して含水率が小さいほど強度が高い。湿った状態では強度が低く、腐朽も起こりやすい。","m":"木材は乾くほど強い"},{"f":"税他","t":"土地・建物","ref":"H29-50-2","s":"鉄筋コンクリート造などに用いる鉄筋の鋼材は、炭素の含有量が多いほど引張強度や硬さが増す傾向があるが、その反面、伸びや粘り強さが減って、もろくなる性質がある。","a":1,"e":"鋼は炭素量が多いほど引張強さ・硬さが増すが、伸びが小さくなりもろくなる。","m":"炭素多い→強いがもろい"},{"f":"税他","t":"土地・建物","ref":"H29-50-3","s":"常温・常圧において、鉄筋と普通コンクリートの熱膨張率はほぼ等しく、温度が変化しても両者が一体として働くことが、鉄筋コンクリート構造が成り立つ理由の一つとなっている。","a":1,"e":"鉄筋とコンクリートは熱膨張率がほぼ等しいため、温度変化があっても一体として働き、鉄筋コンクリート構造が成立する。","m":"鉄とコンクリは同じ膨張"},{"f":"権利","t":"意思表示・行為能力","ref":"H30-03-2","s":"AがBに「Bが試験に合格したら甲建物を贈与する」と書面で約束した後、合格発表前にAが自ら放火して甲建物を滅失させた。その後Bが合格した場合、BはAに損害賠償を請求できる。","a":1,"e":"条件の成否が未定の間も、当事者は相手方の条件付きの利益を害してはならない。故意に滅失させたAは損害賠償責任を負う（民法128条）。","m":"条件付きの権利も保護"},{"f":"権利","t":"意思表示・行為能力","ref":"H30-03-3","s":"AがBに対し「Bが5か月後の試験に合格したら、A所有の甲建物を贈与する」と書面で約束し、その後Bが合格した場合、Bは約束をした時にさかのぼって甲建物の所有権を取得する。","a":0,"e":"停止条件付きの法律行為は、原則として条件が成就した時から効力を生じ、契約時にさかのぼらない（民法127条1項）。","m":"停止条件は成就時から"},{"f":"権利","t":"意思表示・行為能力","ref":"H30-03-4","s":"AがBに対し「Bが5か月後の試験に合格したら、A所有の甲建物を贈与する」と約束した時点でAに意思能力がなかった場合、その後Bが合格しても、Bは甲建物の所有権を取得できない。","a":1,"e":"意思能力を欠く状態でした法律行為は無効（民法3条の2）。後で条件が成就しても贈与の効力は生じない。","m":"意思能力なし＝無効"},{"f":"権利","t":"不法行為・請負・委任","ref":"H30-05-1","s":"Aは、隣人Bの留守中に台風で壊れたB宅の屋根を、Bから頼まれていないのに修理した。この場合、Aは特段の事情がない限り、Bに対して修理の報酬を請求することはできない。","a":1,"e":"依頼なく他人の事務を処理する事務管理では、管理者は本人に報酬を請求できない。有益な費用の償還は別に請求できる。","m":"事務管理は報酬なし"},{"f":"権利","t":"不法行為・請負・委任","ref":"H30-05-3","s":"台風で壊れた隣人Bの屋根を、差し迫った被害を防ぐためAが依頼なく修理した場合、Aは善良な管理者の注意義務を負い、軽い過失による損害でもBに賠償しなければならない。","a":0,"e":"本人の身体・名誉・財産への急迫の危害を免れさせるための事務管理は、悪意又は重大な過失がなければ賠償責任を負わない（民法698条）。","m":"緊急時は重過失のみ責任"},{"f":"権利","t":"不法行為・請負・委任","ref":"H30-05-4","s":"Aが隣人Bのために依頼なく屋根を修理し、その費用がBの意思に反せず、Bにとって有益な費用であった場合、AはBに対してその費用の償還を請求することができる。","a":1,"e":"事務管理者が本人のために有益な費用を支出したときは、本人に対しその償還を請求できる（民法702条1項）。","m":"有益費は償還請求OK"},{"f":"権利","t":"賃貸借","ref":"H30-08-1","s":"建物賃貸借では通常損耗による価値の減少は賃料に含めて回収されているので、賃借人がどのような使い方をして生じた損傷であっても、賃貸人は賃料とは別に賠償を求めることができない。","a":0,"e":"賃料で回収されるのは通常の使用による損耗に限られる。通常でない使用で生じた損傷は賃借人が原状回復・賠償の責任を負う。","m":"通常損耗だけ賃料込み"},{"f":"権利","t":"賃貸借","ref":"H30-08-3","s":"建物賃借人に通常損耗の補修費用を負担させる特約は、契約書に通常損耗の範囲が具体的に明記されておらず、口頭での説明もない場合には、明確に合意されたとはいえず認められない。","a":1,"e":"判例は通常損耗補修特約に明確な合意を求める。現行民法621条も、通常損耗・経年変化を原状回復の対象外としている。","m":"通常損耗特約は明確に"},{"f":"権利","t":"不法行為・請負・委任","ref":"H30-09-3","s":"AはBに土地の売買代金債権を有している。BがAの不法行為により身体を傷害され損害賠償債権を取得した場合、被害者であるBは、この損害賠償債権を自働債権として代金債務と相殺できる。","a":1,"e":"生命・身体の侵害による損害賠償債務は、加害者側から相殺できないが、被害者が自働債権として相殺することはできる（民法509条）。","m":"被害者からの相殺はOK"},{"f":"権利","t":"代理","ref":"H30-10-1","s":"無権代理人Bが本人Aに無断でA所有の土地をCに売却した後、Aが死亡しBが単独で相続した場合、Bは本人の地位に基づいて、Cに対し追認を拒絶することができる。","a":0,"e":"無権代理人が本人を単独相続した場合、本人が自ら法律行為をしたのと同様の効果が生じ、追認拒絶は許されない（判例）。","m":"無権代理人が単独相続→有効"},{"f":"権利","t":"物権変動・対抗","ref":"H30-10-2","s":"遺産分割前の共有不動産について、共同相続人の一人が勝手に単独名義の登記をして第三者に譲渡した場合、他の相続人は自己の法定相続分を登記なしにその第三者に対抗できる。","a":1,"e":"他の相続人の持分については無権利者からの譲受けとなるため、他の相続人は登記がなくても法定相続分を対抗できる（判例）。","m":"法定相続分は登記不要"},{"f":"権利","t":"保証・連帯債務","ref":"H30-10-3","s":"連帯債務者の一人が死亡し相続人が複数いる場合、各相続人は債務を相続分に応じて分割して承継し、その承継した範囲で他の連帯債務者とともに連帯債務者となる。","a":1,"e":"可分な金銭債務は相続分に応じて当然に分割承継され、各相続人はその範囲で本来の債務者と連帯債務を負う（判例）。","m":"連帯債務は分割して承継"},{"f":"権利","t":"借地","ref":"H30-11-1","s":"AがBとの間で、専ら事業の用に供する建物の所有を目的として甲土地の借地権を設定する場合、その借地契約は公正証書によってしなければ、借地契約自体が無効となる。","a":0,"e":"公正証書が必要なのは事業用定期借地権とする場合。事業用建物が目的でも、普通借地権であれば通常の書面でも有効。","m":"公正証書は事業用定借だけ"},{"f":"権利","t":"借地","ref":"H30-11-2","s":"AがBとの間で、居住用建物の所有を目的とする借地契約を締結し、存続期間を20年として更新請求をしない旨を定めた場合でも、事業用定期借地権とはならず、存続期間は30年となる。","a":1,"e":"事業用定期借地権は居住用建物には設定できない。普通借地権となり、30年未満の期間の定めは30年となる（借地借家法3条）。","m":"居住用に事業用定借×"},{"f":"権利","t":"借地","ref":"H30-11-4","s":"借地権者Bが借地上の建物を、同居する未成年の長男の名義で所有権保存登記をしていた場合、Bは、その後に土地を地主から買い受けた第三者に対して借地権を対抗することができる。","a":0,"e":"建物の登記で借地権を対抗するには、借地権者自身の名義である必要がある。家族名義の登記では対抗できない（判例）。","m":"建物登記は本人名義"},{"f":"権利","t":"借家","ref":"H30-12-2","s":"床面積200㎡未満の居住用建物の定期建物賃貸借で、賃借人が転勤によりその建物を生活の本拠として使用することが困難になっても、賃借人は中途解約の申入れをすることができない。","a":0,"e":"床面積200㎡未満の居住用建物で、転勤・療養・介護などやむを得ない事情があるときは、賃借人は中途解約を申し入れられる（借地借家法38条）。","m":"200㎡未満は中途解約可"},{"f":"権利","t":"借家","ref":"H30-12-3","s":"期間5年の普通建物賃貸借で、当事者が期間満了の1年前から6か月前までに更新拒絶等の通知をしなかった場合、従前と同一の条件で更新され、更新後の期間は定めのないものとなる。","a":1,"e":"通知がなければ従前と同一条件で契約を更新したものとみなされ、期間は定めがないものとなる（借地借家法26条1項）。","m":"法定更新は期間なし"},{"f":"権利","t":"借家","ref":"H30-12-4","s":"賃貸人の同意を得て付加した造作について、期間満了で建物賃貸借が終了した場合、賃借人は賃貸人に造作買取請求ができるが、転借人は賃貸人に買取請求をすることができない。","a":0,"e":"造作買取請求権は転借人にも認められ、賃貸人の同意を得て付加した造作なら転借人も賃貸人に買取を請求できる（借地借家法33条2項）。","m":"転借人も造作買取OK"},{"f":"権利","t":"区分所有法","ref":"H30-13-2","s":"区分所有建物の規約を保管する者は、区分所有者や購入予定者などの利害関係人から規約の閲覧を請求された場合、正当な理由がある場合を除いて、その閲覧を拒むことができない。","a":1,"e":"規約の保管者は、正当な理由がなければ利害関係人の閲覧請求を拒めない。違反には過料の制裁がある（区分所有法33条2項）。","m":"規約閲覧は原則拒めない"},{"f":"権利","t":"区分所有法","ref":"H30-13-3","s":"区分所有建物の規約は、管理者がいるときは管理者が保管しなければならず、また規約の保管場所は、建物内の見やすい場所に掲示して区分所有者等に知らせなければならない。","a":1,"e":"規約は管理者（いなければ規約等で定めた者）が保管し、その保管場所を建物内の見やすい場所に掲示する（区分所有法33条）。","m":"保管場所は掲示"},{"f":"権利","t":"区分所有法","ref":"H30-13-4","s":"区分所有者から専有部分を賃借して居住している者は、区分所有者ではなく規約の当事者でもないため、建物・敷地・附属施設の使用方法について規約で定められた義務を負わない。","a":0,"e":"占有者も、建物・敷地・附属施設の使用方法について、区分所有者が規約・集会決議に基づいて負うのと同一の義務を負う（46条2項）。","m":"賃借人も使用方法は規約に従う"},{"f":"権利","t":"不動産登記法","ref":"H30-14-1","s":"不動産の登記は、原則として当事者からの申請か官庁・公署からの嘱託があって初めて行われるものであり、法令に特別の定めがない限り、登記官が自ら進んで行うことはない。","a":1,"e":"登記は申請又は嘱託によるのが原則（不動産登記法16条1項）。ただし表示に関する登記は登記官が職権ですることもできる。","m":"登記は申請か嘱託"},{"f":"権利","t":"不動産登記法","ref":"H30-14-3","s":"既存建物について増築により床面積に変更があった場合、表題部所有者又は所有権の登記名義人は、その変更の日から2年以内に表示の変更の登記を申請すればよい。","a":0,"e":"床面積など表題部の登記事項に変更があったときは、変更の日から1か月以内に変更の登記を申請しなければならない（不動産登記法51条）。","m":"表示の変更は1か月以内"},{"f":"権利","t":"不動産登記法","ref":"H30-14-4","s":"土地の所有権の登記名義人が転居して住所に変更があった場合、その登記名義人は、住所の変更があった日から2年以内に、住所の変更の登記を申請しなければならない。","a":1,"e":"2026年4月施行の改正で住所等の変更登記が義務化され、変更日から2年以内の申請が必要になった（不動産登記法76条の5）。","m":"住所変更登記は2年以内"},{"f":"法令","t":"国土利用計画法","ref":"H30-15-1","s":"事後届出に係る土地の利用目的について都道府県知事から勧告を受けた権利取得者がその勧告に従わなかった場合、知事はその旨及び勧告の内容を公表することができる。","a":1,"e":"勧告に従わないとき、知事はその旨と勧告の内容を公表できる（国土利用計画法26条）。罰則や契約の無効はない。","m":"勧告無視→公表のみ"},{"f":"法令","t":"国土利用計画法","ref":"H30-15-2","s":"乙県が所有する市街化区域内の3,000㎡の土地を個人Cに売却した場合でも、国土利用計画法の面積要件を満たしている以上、買主であるCは事後届出をしなければならない。","a":0,"e":"当事者の一方又は双方が国・地方公共団体等である場合は、面積要件を満たしても事後届出は不要（国土利用計画法23条2項）。","m":"国・自治体が当事者→不要"},{"f":"法令","t":"国土利用計画法","ref":"H30-15-3","s":"指定都市以外の区域にある土地について国土利用計画法23条の事後届出をする場合、権利取得者は市町村長を経由せず、直接都道府県知事に届け出なければならない。","a":0,"e":"事後届出は、契約締結日から2週間以内に、土地が所在する市町村長を経由して都道府県知事に行う（国土利用計画法23条1項）。","m":"届出は市町村長経由"},{"f":"法令","t":"開発許可","ref":"H30-17-1","s":"市街化調整区域内において、非常災害のため必要な応急措置として行う開発行為は、その開発区域の規模にかかわらず、都道府県知事の開発許可を受ける必要がない。","a":1,"e":"非常災害のための応急措置として行う開発行為は、区域や規模を問わず開発許可が不要（都市計画法29条1項）。","m":"非常災害は許可不要"},{"f":"法令","t":"開発許可","ref":"H30-17-3","s":"都市計画区域及び準都市計画区域のいずれにも属さない区域内で、8,000㎡の土地について区画形質の変更を行う開発行為をする場合、都道府県知事の開発許可を受ける必要はない。","a":1,"e":"両区域外では1ha（10,000㎡）以上の開発行為が許可の対象。8,000㎡なら許可は不要。","m":"区域外は1ha以上"},{"f":"法令","t":"開発許可","ref":"H30-17-4","s":"準都市計画区域内で、農業を営む者の居住の用に供する建築物を建築する目的で1,000㎡の開発行為を行う場合、都道府県知事の開発許可を受けなければならない。","a":0,"e":"市街化区域以外での農林漁業者の居住用建築物のための開発行為は許可不要。準都市計画区域は3,000㎡未満でも不要。","m":"農家住宅は区域外で不要"},{"f":"法令","t":"建築基準法","ref":"H30-18-2","s":"防火地域内にある木造3階建ての既存住宅について、床面積10㎡以内の増築をする場合には、増築部分がわずかであるから、建築主は建築確認を受ける必要はない。","a":0,"e":"10㎡以内の増改築・移転で確認不要となるのは、防火地域及び準防火地域の外に限られる。防火地域内では確認が必要。","m":"防火地域は10㎡でも確認"},{"f":"法令","t":"建築基準法","ref":"H30-18-3","s":"屋上広場又は2階以上の階にあるバルコニーその他これに類するものの周囲には、安全上必要な高さが1.1m以上の手すり壁、さく又は金網を設けなければならない。","a":1,"e":"屋上広場や2階以上のバルコニー等の周囲には、高さ1.1m以上の手すり壁・さく・金網が必要（建築基準法施行令126条1項）。","m":"手すりは1.1m以上"},{"f":"法令","t":"建築基準法","ref":"H30-18-4","s":"建築基準法の改正により、現に存する建築物が改正後の規定に適合しなくなった場合、その建築物の所有者又は管理者は、直ちに改正後の規定に適合させなければならない。","a":0,"e":"既存不適格建築物は、直ちに改正後の規定に適合させる必要はない。増改築や建替えの際に新しい規定が適用される（3条2項）。","m":"既存不適格はそのままOK"},{"f":"法令","t":"盛土規制法","ref":"H30-20-1","s":"宅地造成等工事規制区域内の土地の所有者、管理者又は占有者は、宅地造成等に伴う災害が生じないよう、その土地を常時安全な状態に維持するよう努めなければならない。","a":1,"e":"規制区域内の土地の所有者等には、常時安全な状態に維持する努力義務がある（盛土規制法22条1項）。造成主と所有者が異なっても同じ。","m":"所有者等は安全維持に努める"},{"f":"法令","t":"盛土規制法","ref":"H30-20-2","s":"都道府県知事は、宅地造成等工事規制区域内で行われる宅地造成等に関する工事について許可をする場合、その許可に、工事の施行に伴う災害を防止するため必要な条件を付することができる。","a":1,"e":"知事は、宅地造成等に関する工事の許可に、工事に伴う災害を防止するため必要な条件を付することができる（盛土規制法）。","m":"許可には条件を付せる"},{"f":"法令","t":"盛土規制法","ref":"H30-20-4","s":"宅地造成等工事規制区域内の宅地において、面積400㎡の切土を行い、その結果高さ1mの崖が生じる場合には、工事主は都道府県知事の許可を受けなければならない。","a":0,"e":"切土は、高さ2m超の崖を生じるもの、高さ5m超のもの、面積500㎡超のものが許可の対象。本件はいずれにも当たらない。","m":"切土は崖2m超・500㎡超"},{"f":"法令","t":"農地法","ref":"H30-22-1","s":"市街化区域内にある農地を宅地に転用する目的で買い受ける場合、あらかじめ農業委員会に届け出れば、都道府県知事等による農地法5条1項の許可を受ける必要はない。","a":1,"e":"市街化区域内の農地の転用目的での権利移動は、あらかじめ農業委員会に届け出れば5条許可は不要（農地法5条1項）。","m":"市街化区域は届出でOK"},{"f":"法令","t":"農地法","ref":"H30-22-2","s":"被相続人が所有していた農地を、共同相続人の一人が遺産分割によって取得する場合、農地の権利移動に当たるため、取得する相続人は農地法3条1項の許可を受けなければならない。","a":0,"e":"相続や遺産分割による農地の取得は3条許可が不要。ただし農業委員会への届出は必要。","m":"相続・遺産分割は許可不要"},{"f":"法令","t":"農地法","ref":"H30-22-4","s":"登記簿上の地目が雑種地となっている土地は、実際には現に耕作の目的に供されていたとしても、登記簿上の地目の記載が基準となるため、農地法上の農地には当たらない。","a":0,"e":"農地かどうかは登記簿上の地目ではなく、土地の現況で判断する。現に耕作されていれば農地に当たる。","m":"農地は現況で判断"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H30-25-1","s":"不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用を前提として把握される価格を標準として形成され、これを最有効使用の原則という。","a":1,"e":"不動産鑑定評価基準の価格諸原則のうち、最有効使用の原則の説明として正しい。","m":"価格は最有効使用が基準"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H30-25-2","s":"不動産鑑定評価基準によれば、収益還元法は賃貸用不動産を評価するための手法であるから、所有者が自ら使用している自用の不動産の鑑定評価には適用すべきではない。","a":0,"e":"収益還元法は賃貸用不動産だけでなく、自用の不動産でも賃貸を想定して適用すべきとされている。","m":"自用でも収益還元法"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H30-25-4","s":"不動産鑑定評価基準によれば、民事再生法に基づく評価目的の下で、早期売却を前提とした価格を求める場合は、鑑定評価で求める価格のうち限定価格を求める場合に当たる。","a":0,"e":"これは特定価格の例。限定価格は隣地の併合など、特定の当事者間でのみ経済合理性が認められる価格をいう。","m":"早期売却は特定価格"},{"f":"業法","t":"業務上の規制","ref":"H30-28-ア","s":"宅建業者Aは、自ら売主となる宅地について、都市計画法の開発許可を申請中であれば、許可を受ける前であっても、許可を停止条件とする売買契約を宅建業者でない買主と締結できる。","a":0,"e":"開発許可等の処分前は、停止条件付契約や予約を含めて売買契約を締結できない（36条）。申請中でも同じ。","m":"許可前は契約できない"},{"f":"業法","t":"37条書面","ref":"H30-28-イ","s":"宅建業者Aが自ら売主となり、宅建業者Bが買主となって宅地の売買契約を締結した場合、当事者がいずれも宅建業者であるため、Aは37条書面を交付する必要はない。","a":0,"e":"37条書面の交付は業者間の取引でも省略できず、宅建士の記名も必要（37条）。","m":"37条書面は業者間も必要"},{"f":"業法","t":"営業保証金","ref":"H30-28-ウ","s":"営業保証金を供託している宅建業者は、取引の相手方が宅建業者である場合には、契約が成立するまでの間に、営業保証金を供託した供託所及びその所在地について説明する必要はない。","a":1,"e":"宅建業者は営業保証金から還付を受けられないため、相手方が宅建業者のときは供託所等の説明は不要（35条の2）。","m":"業者相手は供託所説明不要"},{"f":"業法","t":"媒介契約","ref":"H30-28-エ","s":"媒介契約を締結した宅建業者は、媒介の目的物について売買の申込みがあったときは、依頼者が宅建業者であっても、遅滞なくその旨を依頼者に報告しなければならない。","a":1,"e":"申込みがあった旨の報告義務は、媒介契約の種類を問わず、依頼者が宅建業者であっても適用される（34条の2）。","m":"申込みは遅滞なく報告"},{"f":"業法","t":"報酬","ref":"H30-30-1","s":"課税事業者である宅建業者Aが、店舗用建物の貸借（月額賃料10万円、返還されない権利金150万円、いずれも税別）を貸主・借主双方から媒介した場合、双方から受領できる報酬の合計上限は16万5,000円である。","a":1,"e":"居住用以外は権利金を売買代金とみなせる。150万円×5%＋税＝8万2,500円を各自から受領でき、合計16万5,000円で賃料基準の11万円より大きい。","m":"居住用以外は権利金で計算"},{"f":"業法","t":"報酬","ref":"H30-30-2","s":"宅建業者が居住用建物の貸借を媒介し、借主から貸主へ返還されない権利金の授受がある場合、宅建業者は権利金の額を売買代金とみなして報酬の上限額を計算することができる。","a":0,"e":"権利金を売買代金とみなして計算できるのは、居住用建物以外の貸借に限られる。居住用は賃料基準で計算する。","m":"居住用は権利金計算×"},{"f":"業法","t":"報酬","ref":"H30-30-4","s":"定期建物賃貸借が期間満了で終了した後、宅建業者が当事者の依頼を受けて同じ当事者間の再契約を媒介した場合、その再契約についても報酬を受領することができる。","a":1,"e":"再契約は新たな契約であり、媒介すれば報酬を受領できる。報酬額の制限など宅建業法の規定も適用される。","m":"再契約も報酬OK"},{"f":"業法","t":"監督・罰則","ref":"H30-32-1","s":"甲県知事の登録を受けた宅建士が甲県知事から指示処分を受けた場合、その宅建士が勤務する国土交通大臣免許の宅建業者に責めに帰すべき理由があれば、大臣はその業者に指示処分をすることができる。","a":1,"e":"宅建士が処分を受けた場合に業者に帰責事由があるときは、業者も指示処分や業務停止処分の対象となる（65条）。","m":"業者に帰責→業者も処分"},{"f":"業法","t":"宅建士","ref":"H30-32-2","s":"甲県知事の登録を受けている宅建士が不正の手段によりその登録を受けていたことが判明した場合、甲県知事は、その者の宅建試験の合格の決定を取り消さなければならない。","a":0,"e":"不正手段による登録は登録の消除事由（68条の2）。合格決定の取消しは試験に関する不正が対象。","m":"不正登録→登録消除"},{"f":"業法","t":"宅建士","ref":"H30-32-4","s":"甲県知事の登録を受け乙県内の事務所で勤務する宅建士が、乙県知事から事務禁止処分を受けた場合、その宅建士は速やかに宅建士証を乙県知事に提出しなければならない。","a":0,"e":"事務禁止処分を受けた宅建士は、宅建士証をその交付を受けた知事（甲県知事）に速やかに提出しなければならない。","m":"提出先は交付した知事"},{"f":"業法","t":"37条書面","ref":"H30-34-ア","s":"宅建業者が既存建物の貸借の媒介をした場合、当事者間に契約不適合を担保すべき責任についての定めがあるときは、その内容を37条書面に記載しなければならない。","a":0,"e":"契約不適合責任の定めの記載は売買・交換の場合の事項であり、貸借の37条書面には記載不要。","m":"貸借に不適合責任欄なし"},{"f":"業法","t":"37条書面","ref":"H30-34-ウ","s":"宅建業者が媒介により既存建物の貸借契約を成立させた場合、その宅建業者は、建物の引渡しの時期を37条書面に必ず記載して、契約の両当事者に交付しなければならない。","a":1,"e":"引渡しの時期は、売買・交換・貸借のいずれでも37条書面の必要的記載事項（37条）。","m":"引渡し時期は必ず記載"},{"f":"業法","t":"37条書面","ref":"H30-34-エ","s":"宅建業者が既存建物の貸借を媒介した場合、建物の構造耐力上主要な部分等の状況について当事者双方が確認した事項を、37条書面に必ず記載しなければならない。","a":0,"e":"当事者双方が確認した事項の記載は、既存建物の売買・交換の場合に限られ、貸借では不要。","m":"双方確認事項は売買だけ"},{"f":"業法","t":"重要事項説明","ref":"H30-35-2","s":"宅建業者Aが宅建業者Bに未完成の建物を売却する場合、Aは35条書面を交付するだけでは足りず、宅建士にその書面を示して重要事項を説明させなければならない。","a":0,"e":"相手方が宅建業者の場合、35条書面の交付（宅建士の記名）は必要だが、宅建士による説明は省略できる（35条）。","m":"業者間は説明省略可"},{"f":"業法","t":"重要事項説明","ref":"H30-35-3","s":"宅地の売買において、契約不適合責任の履行に関して保証保険契約の締結等の措置を講じるかどうか、講じる場合はその概要を、35条書面に記載しなければならない。","a":1,"e":"担保責任の履行に関する措置を講じるかどうか及びその概要は、売買・交換の場合の重要事項（35条）。","m":"不適合措置の有無を記載"},{"f":"業法","t":"重要事項説明","ref":"H30-35-4","s":"宅建業者間で建物の交換契約を締結し、交換差金の一部として30万円の預り金を受領する場合、宅建業者はその預り金の保全措置の概要を35条書面に記載しなければならない。","a":0,"e":"支払金・預り金の保全措置の説明は、50万円未満のものなどは対象外。30万円の預り金なら記載不要。","m":"50万円未満は対象外"},{"f":"業法","t":"クーリング・オフ","ref":"H30-37-ア","s":"宅建業者Aが売主となる新築マンションの売買で、「クーリング・オフの解除書面は、告知の日から8日以内にAに到達しなければならない」とする特約は、買主に不利なため無効である。","a":1,"e":"クーリング・オフは書面を発した時に効力を生じる。これより買主に不利な特約は無効（37条の2）。","m":"発信主義・不利特約は無効"},{"f":"業法","t":"クーリング・オフ","ref":"H30-37-イ","s":"売主業者Aから媒介を依頼された業者Bの事務所で買主Cが買受けの申込みをし、後日喫茶店で売買契約を締結した場合、Cはクーリング・オフにより契約を解除できない。","a":1,"e":"申込みの場所と契約の場所が異なる場合は申込みの場所で判断する。媒介業者の事務所での申込みは解除できない。","m":"申込み場所で判断"},{"f":"業法","t":"クーリング・オフ","ref":"H30-37-ウ","s":"媒介業者Bの提案により買主Cの自宅で買受けの申込みをした場合、クーリング・オフについて書面で告げられていなくても、申込みから10日を経過すればCは解除できない。","a":0,"e":"自宅での申込みが除外されるのは買主から申し出た場合だけ。書面の告知がなければ8日間は進行しない。","m":"告知なしは8日進行せず"},{"f":"業法","t":"8種制限","ref":"H30-38-1","s":"宅建業者Aが自ら売主として完成済みの戸建住宅を代金3,000万円で宅建業者でないBに売却し、手付金200万円を受領した後に中間金300万円を受け取る場合、その受領前に保全措置が必要である。","a":1,"e":"完成物件は代金の10%又は1,000万円を超えると保全措置が必要。手付と合わせて500万円となり、中間金の受領前に保全が要る。","m":"完成物件は10%超で保全"},{"f":"業法","t":"8種制限","ref":"H30-38-2","s":"宅建業者Aが自ら売主として未完成の戸建住宅を代金2,500万円で宅建業者でないBに売却する場合、Aは手付金150万円を保全措置を講じずに受領することができる。","a":0,"e":"未完成物件は代金の5%（125万円）又は1,000万円を超えると保全措置が必要。150万円は受領前に保全措置が要る。","m":"未完成は5%超で保全"},{"f":"業法","t":"8種制限","ref":"H30-38-3","s":"宅建業者が自ら売主として宅建業者でない買主に未完成物件を売却し、手付金等の保全措置を講じる場合、指定保管機関との手付金等寄託契約による方法を選ぶことができる。","a":0,"e":"未完成物件は銀行等の保証委託契約か保険事業者の保証保険契約に限られる。指定保管機関による保管は完成物件だけ。","m":"指定保管機関は完成物件だけ"},{"f":"業法","t":"重要事項説明","ref":"H30-39-1","s":"宅地建物取引業者が建物の貸借を媒介する場合、借主が宅地建物取引業者であれば、宅地建物取引士による重要事項の説明は省略できるが、重要事項説明書の交付（電磁的方法による提供を含む）は省略できない。","a":1,"e":"相手方が宅建業者のときは説明は不要だが、35条書面の交付（又は電磁的提供）は必要（35条6項・8項）。","m":"業者相手は説明不要・書面は必要"},{"f":"業法","t":"重要事項説明","ref":"H30-39-2","s":"既存建物の貸借の媒介では、建物状況調査の実施の有無と実施している場合の結果の概要は説明が必要だが、設計図書・点検記録等の建物の建築・維持保全の状況に関する書類の保存状況は説明不要である。","a":1,"e":"書類の保存状況の説明は売買・交換のみで、貸借では不要。建物状況調査の有無・概要は貸借でも必要。","m":"保存状況は売買だけ"},{"f":"業法","t":"重要事項説明","ref":"H30-39-4","s":"テレビ会議等のITを活用して重要事項の説明を行う場合、相手方の承諾があれば、宅地建物取引士は宅地建物取引士証の提示を省略することができる。","a":0,"e":"IT重説でも取引士証の提示は省略できない。相手方が画面上で視認できたことを確認する必要がある。","m":"ITでも取引士証は見せる"},{"f":"業法","t":"業務上の規制","ref":"H30-40-ア","s":"宅地建物取引業者Aが自ら売主として建物を売却する際、手付金を用意できない買主に手付を分割払いとすることを提案し、買主がこれに応じて契約を締結しても、宅地建物取引業法に違反しない。","a":0,"e":"手付の分割払いは手付についての信用の供与にあたり、契約締結の誘引として禁止される（47条3号）。","m":"手付の分割も信用供与"},{"f":"業法","t":"業務上の規制","ref":"H30-40-イ","s":"宅地建物取引業者Aが自ら売主となる建物について、買主の値引き要求に応じて広告記載の販売価格から100万円値引きして売買契約を締結しても、宅地建物取引業法に違反しない。","a":1,"e":"値引き販売そのものを禁止する規定はない。手付の貸付け等の信用供与とは区別される。","m":"値引きはOK"},{"f":"業法","t":"業務上の規制","ref":"H30-40-エ","s":"投資用マンションを勧誘中の宅地建物取引業者Aが、相手方から「二度と電話をかけないで」と言われた場合、電話はやめて自宅を訪問して勧誘を続けることは、宅地建物取引業法に違反しない。","a":0,"e":"契約を締結しない旨の意思表示を受けた後に勧誘を続けることは、方法を変えても禁止される（施行規則16条の11）。","m":"断られたら手段を変えてもNG"},{"f":"業法","t":"免許","ref":"H30-41-1","s":"A社が自己所有地を10区画に分けて住宅を建築し、それぞれを不特定多数の者に賃貸する場合、A社は宅地建物取引業の免許を受ける必要はない。","a":1,"e":"自ら貸主として賃貸することは「取引」にあたらないため、免許は不要（2条2号）。","m":"自ら貸主は免許不要"},{"f":"業法","t":"免許","ref":"H30-41-3","s":"賃貸住宅の管理業者C社が、複数の貸主から委託を受けて入居者を募集し、貸主を代理して賃貸借契約を締結する場合、C社は宅地建物取引業の免許を受ける必要がある。","a":1,"e":"貸借の代理を業として行うことは宅建業にあたり免許が必要。苦情処理や清掃などの管理業務自体は取引ではない。","m":"貸借の代理は免許必要"},{"f":"業法","t":"免許","ref":"H30-41-4","s":"D社が、多数の顧客から、顧客所有地に住宅や商業用ビルを建てる建設工事を請け負い代金を受領する場合、D社は宅地建物取引業の免許を受ける必要がある。","a":0,"e":"建設工事の請負は宅地建物の売買・交換・貸借やその代理・媒介ではなく、宅建業の「取引」にあたらない。","m":"請負は宅建業ではない"},{"f":"業法","t":"宅建士","ref":"H30-42-1","s":"宅地建物取引士が死亡した場合、その相続人は、死亡した日から30日以内に、登録をしている都道府県知事にその旨を届け出なければならない。","a":0,"e":"相続人の死亡の届出は、死亡の事実を知った日から30日以内（21条1号）。死亡日からではない。","m":"死亡は知った日から30日"},{"f":"業法","t":"宅建士","ref":"H30-42-3","s":"宅地建物取引士が事務禁止処分を受けたときは、速やかに、宅地建物取引士証をその交付を受けた都道府県知事に提出しなければならない。","a":1,"e":"事務禁止処分を受けたら交付知事に取引士証を提出する（22条の2第7項）。登録消除なら返納。","m":"禁止は提出・消除は返納"},{"f":"業法","t":"宅建士","ref":"H30-42-4","s":"宅地建物取引士は、37条書面の交付に際して取引の関係者から請求があったときは、専任の宅地建物取引士であるか否かにかかわらず、宅地建物取引士証を提示しなければならない。","a":1,"e":"取引の関係者から請求があれば取引士証を提示する義務がある（22条の4）。専任かどうかは関係ない。","m":"請求されたら必ず提示"},{"f":"業法","t":"営業保証金","ref":"H30-43-1","s":"免許権者は、免許をした日から3か月以内に宅地建物取引業者から営業保証金供託の届出がないときは催告をしなければならず、催告到達後1か月以内に届出がないときは免許を取り消すことができる。","a":1,"e":"3か月以内に届出がなければ催告が必要、催告到達から1か月以内に届出がなければ免許取消しができる（25条6項・7項）。","m":"3か月で催告・1か月で取消"},{"f":"業法","t":"営業保証金","ref":"H30-43-2","s":"宅地建物取引業者から家賃収納代行業務を受託した者は、その業務から生じた債権について、当該宅地建物取引業者が供託した営業保証金から還付を受けることができる。","a":0,"e":"還付対象は宅建業に関する取引から生じた債権に限られる。家賃収納代行は宅建業の取引ではない（27条1項）。","m":"還付は宅建業の取引だけ"},{"f":"業法","t":"営業保証金","ref":"H30-43-4","s":"宅地建物取引業者が支店を2か所新設した場合、額面金額200万円の国債と額面金額800万円の地方債を供託すれば、追加すべき営業保証金の額に足りる。","a":0,"e":"支店2か所で1,000万円が必要。国債は額面100%、地方債は90%評価なので200万＋720万＝920万円で不足する。","m":"地方債は9割評価"},{"f":"業法","t":"保証協会","ref":"H30-44-1","s":"保証協会の社員である宅地建物取引業者が社員の地位を失った場合、当該宅地建物取引業者は、還付請求権者に対し6か月以上の期間を定めて申し出るよう公告しなければならない。","a":0,"e":"社員の地位を失ったときの還付請求権者への公告は、宅建業者ではなく保証協会が行う（64条の11第4項）。","m":"公告するのは保証協会"},{"f":"業法","t":"保証協会","ref":"H30-44-2","s":"保証協会は、社員の取引の相手方から苦情の申出を受け、解決のために必要があると認めるときは、当該社員に対し文書又は口頭による説明や資料の提出を求めることができる。","a":1,"e":"苦情解決は保証協会の必須業務であり、社員に説明や資料提出を求めることができる（64条の5第2項）。","m":"苦情なら社員に説明要求可"},{"f":"業法","t":"保証協会","ref":"H30-44-4","s":"保証協会の社員が一部の事務所を廃止したことにより弁済業務保証金分担金を返還する場合、保証協会は、還付請求権者に対する公告をすることなく返還することができる。","a":1,"e":"一部事務所廃止による返還では公告は不要。社員の地位を失った場合は6か月以上の公告が必要（64条の11）。","m":"一部廃止は公告不要"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H30-45-1","s":"新築住宅の売買において、自ら売主となる宅地建物取引業者だけでなく、その売買を媒介する宅地建物取引業者も、住宅販売瑕疵担保保証金の供託又は保険契約の締結の義務を負う。","a":0,"e":"資力確保措置の義務を負うのは自ら売主として新築住宅を引き渡す宅建業者だけで、媒介業者は負わない。","m":"義務は売主業者だけ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H30-45-3","s":"新築住宅を引き渡した売主業者が基準日に係る資力確保措置の状況を届け出なかった場合、基準日の翌日から起算して50日を経過した日以後は、新たに自ら売主となる新築住宅の売買契約を締結できない。","a":1,"e":"届出は基準日から3週間以内。届出を怠ると基準日の翌日から50日経過後は新たな売買契約が禁止される（履行法13条）。","m":"3週間届出・50日で契約禁止"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H30-45-4","s":"自ら売主となる宅地建物取引業者が締結する住宅販売瑕疵担保責任保険契約は、新築住宅の構造耐力上主要な部分の瑕疵によって生じた損害のみを填補するものであればよい。","a":0,"e":"保険の対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵の両方。保険期間は引渡しから10年以上。","m":"構造と雨水の2つ"},{"f":"税他","t":"住宅金融支援機構","ref":"H30-46-1","s":"住宅金融支援機構は、住宅の建設・購入に付随する土地又は借地権の取得に必要な資金の貸付けに係る金融機関の貸付債権については、譲受けの対象としていない。","a":0,"e":"住宅の建設・購入に付随する土地・借地権の取得資金の貸付債権も譲受けの対象に含まれる。","m":"土地・借地権も対象"},{"f":"税他","t":"住宅金融支援機構","ref":"H30-46-2","s":"住宅金融支援機構は、金融機関が貸し付けた住宅ローンについて、債務不履行により生じる損害を填補する住宅融資保険を引き受けている。","a":1,"e":"住宅融資保険業務は機構の業務の一つで、民間金融機関の住宅ローンを支援する。","m":"融資保険で金融機関を支援"},{"f":"税他","t":"住宅金融支援機構","ref":"H30-46-4","s":"高齢者の家庭に適した性能を備えた住宅とするための改良（高齢者が自ら居住する住宅に限る）に必要な資金の貸付けは、住宅金融支援機構の直接融資業務に含まれる。","a":1,"e":"高齢者向け改良（リフォーム）資金は、民間では対応が難しいため機構の直接融資の対象とされている。","m":"高齢者リフォームは直接融資"},{"f":"税他","t":"景品表示法","ref":"H30-47-1","s":"新築分譲住宅を値下げして旧価格と新価格を併記する二重価格表示をする場合、値下げ額が明確であれば、旧価格の公表時期と値下げの時期は表示しなくてよい。","a":0,"e":"過去の販売価格を比較対照とするには、その公表時期と値下げ時期の明示などの要件が必要（表示規約）。","m":"二重価格は時期を明示"},{"f":"税他","t":"景品表示法","ref":"H30-47-2","s":"土地上に古家がある物件を「売地」として広告する場合、古家がある旨を明示していれば、その古家が住宅として使用できる状態であっても不当表示にはならない。","a":1,"e":"古家・廃屋等があるときはその旨を明示すれば足り、使用可能かどうかは問わない（表示規約）。","m":"古家ありと書けばOK"},{"f":"税他","t":"景品表示法","ref":"H30-47-3","s":"宅地建物取引業者が新築分譲マンションの広告に完成予想図を掲載する際、外観を明確に示す目的であれば、敷地内にある電柱や電線を消して表示しても不当表示にはならない。","a":0,"e":"完成予想図は現況に反する表示をしてはならない。電柱・電線を消すと現況と異なる表示になる。","m":"電柱を消すのはNG"},{"f":"税他","t":"土地・建物","ref":"H30-49-1","s":"山麓部で地すべりによってできた地形は、なだらかで水はけもよく住宅地に適して見えるが、末端の急斜面部は斜面崩壊の危険度が高い。","a":1,"e":"地すべり地形は一見住宅向きでも、末端の急斜面は崩壊しやすく注意が必要。","m":"地すべり末端は崩れやすい"},{"f":"税他","t":"土地・建物","ref":"H30-49-3","s":"大都市の大部分は低地に立地し、その多くは湿地や旧河道など若く軟弱な地盤であるため、低地は地震災害に対して安全とはいえない。","a":1,"e":"低地の軟弱地盤は水害・地盤沈下・液状化が起きやすく、地震災害にも弱い。","m":"低地は地震にも弱い"},{"f":"税他","t":"土地・建物","ref":"H30-49-4","s":"住宅地としての適否について、扇状地、自然堤防、旧天井川は軟弱な地盤で災害の危険度が高く、デルタ地域や旧河道は比較的安定した地盤で危険度が低い。","a":0,"e":"記述が逆。扇状地・自然堤防・旧天井川は比較的安定、デルタ・旧河道は軟弱で危険度が高い。","m":"デルタ・旧河道は危険"},{"f":"税他","t":"土地・建物","ref":"H30-50-1","s":"木材は、含水率が高い状態に比べて乾燥して含水率が低い状態のほうが強度が高いため、木造建築物には十分に乾燥した木材を使用するのが望ましい。","a":1,"e":"木材は含水率が低い（乾燥している）ほど強度が高く、湿った木材は腐朽しやすいため乾燥材が望ましい。","m":"木は乾くほど強い"},{"f":"税他","t":"土地・建物","ref":"H30-50-2","s":"集成材は、乾燥させた単板等を接着剤で積層して材質を均質にした加工木材であり、大規模な木造建築物の骨組みにも用いられている。","a":1,"e":"集成材は品質が均一で強度が安定するため、体育館等の大規模木造にも使われる。","m":"集成材は大規模にも使える"},{"f":"税他","t":"土地・建物","ref":"H30-50-3","s":"鉄骨は不燃材料であり火災で燃えることはないから、鉄骨構造の建築物を耐火構造とする場合であっても、柱やはりを耐火材料で被覆する必要はない。","a":0,"e":"鉄骨は不燃でも火災の高温で強度が大きく低下するため、耐火構造とするには耐火被覆が必要。","m":"鉄は熱に弱い→被覆必要"},{"f":"権利","t":"不法行為・請負・委任","ref":"R01-04-1","s":"放火により家屋が滅失し、所有者が火災保険金を受け取った場合、加害者に対する損害賠償額の算定にあたっては、その保険金額を損益相殺として控除しなければならない。","a":0,"e":"判例は、火災保険金は保険料の対価であり、損益相殺の対象となる利益にあたらないとする。","m":"保険金は差し引かない"},{"f":"権利","t":"不法行為・請負・委任","ref":"R01-04-3","s":"第三者Cが債務者Bをそそのかして、Bの債権者Aに対する債務の履行を不能にさせた場合でも、Cは債権者Aに対して不法行為責任を負わない。","a":0,"e":"債務者を教唆して債権を侵害した第三者は、債権者に対して不法行為責任を負う（債権侵害、709条）。","m":"そそのかした者も責任"},{"f":"権利","t":"不法行為・請負・委任","ref":"R01-04-4","s":"名誉を違法に侵害された者は、損害賠償や名誉回復のための処分を求めることができるほか、人格権としての名誉権に基づき侵害行為の差止めを求めることができる。","a":1,"e":"損害賠償・名誉回復処分（723条）に加え、判例は人格権に基づく差止請求も認める。","m":"名誉侵害は差止めもOK"},{"f":"権利","t":"代理","ref":"R01-05-1","s":"Bが本人Aの代理人と称して契約したが、Aが無権代理行為の追認を拒絶した場合、その後にA自身が改めて追認しても、無権代理行為を有効とすることはできない。","a":1,"e":"追認拒絶により無権代理行為の効力が本人に及ばないことが確定するため、後から追認できない（判例）。","m":"拒絶したら確定"},{"f":"権利","t":"代理","ref":"R01-05-2","s":"無権代理人Bが本人Aを単独で相続した場合、Aが生前に無権代理行為の追認を拒絶していたか否かにかかわらず、無権代理行為は当然に有効となる。","a":0,"e":"追認拒絶前の相続なら当然有効となるが、拒絶後の相続では無効が確定しており有効にならない（判例）。","m":"拒絶後の相続は無効のまま"},{"f":"権利","t":"代理","ref":"R01-05-4","s":"本人が無権代理人を相続した場合、本人は、無権代理行為の追認を拒絶しても信義則に反しないため、追認を拒絶することができる。","a":1,"e":"本人が無権代理人を相続しても当然には有効とならず、本人は追認拒絶ができる（判例）。","m":"本人相続は拒絶OK"},{"f":"権利","t":"債務不履行・解除","ref":"R01-07-1","s":"買主Bが受領権限のないCに代金を弁済し、Bに過失があった場合でも、Cが受け取った代金を売主Aに引き渡したときは、売主Aが利益を受けた限度で弁済は効力を有する。","a":1,"e":"受領権限のない者への弁済も、債権者が利益を受けた限度で効力を有する（479条）。","m":"債権者が得した分は有効"},{"f":"権利","t":"債務不履行・解除","ref":"R01-07-2","s":"売主Aの代理人と称するDに対し、買主Bが善意無過失で代金を弁済した場合であっても、Dに代理権がない以上、その弁済は効力を生じない。","a":0,"e":"取引上の社会通念に照らして受領権者としての外観を有する者への善意無過失の弁済は有効（478条）。","m":"外観ある者に善意無過失→有効"},{"f":"権利","t":"債務不履行・解除","ref":"R01-07-4","s":"建物の売買で代金支払期日を過ぎても、売主Aが建物の引渡しの提供をしていなければ、買主Bは特段の事情がない限り代金の支払を拒むことができる。","a":1,"e":"売主の引渡債務と買主の代金債務は同時履行の関係にあり、相手が提供するまで履行を拒める（533条）。","m":"提供なければ払わなくてよい"},{"f":"権利","t":"抵当権・担保","ref":"R01-10-1","s":"甲土地に一番抵当権者B（2,000万円）、二番C（2,400万円）、三番D（3,000万円）がいて、BがDに抵当権の順位を譲渡した場合、売却代金6,000万円ならBの配当額は600万円である。","a":1,"e":"譲渡がなければB2,000万・D1,600万で計3,600万円。順位の譲渡によりDが先に3,000万円、残り600万円がBとなる。","m":"BとDの枠内でDが先取り"},{"f":"権利","t":"抵当権・担保","ref":"R01-10-4","s":"甲土地に一番抵当権者B（2,000万円）、二番C（2,400万円）、三番D（3,000万円）がいて、BがDに抵当権の順位を譲渡した場合、売却代金6,000万円ならBの配当額は1,600万円である。","a":0,"e":"BとDの配当合計3,600万円のうち、順位の譲渡を受けたDが3,000万円を先に受けるため、Bは600万円となる。","m":"Cの配当は変わらない"},{"f":"権利","t":"借地","ref":"R01-11-1","s":"AがBに対し、建物所有を目的とせず資材置場とする目的で甲土地を期間50年として賃貸した場合、その賃貸借は期間の定めのない契約となる。","a":0,"e":"建物所有目的でないため民法が適用され、賃貸借の上限50年以内なので期間は50年のまま（604条）。","m":"民法の賃貸借は上限50年"},{"f":"権利","t":"借地","ref":"R01-11-3","s":"居住用建物の所有を目的とする土地の賃貸借で、期間50年なら書面で更新がない旨を定めれば有効だが、期間15年で同じ定めをしても無効となる。","a":1,"e":"一般定期借地権は期間50年以上が要件（22条）。期間15年の居住用は普通借地権となり、期間は30年となる。","m":"一般定期は50年以上"},{"f":"権利","t":"借地","ref":"R01-11-4","s":"工場用建物の所有を目的とする土地の賃貸借で、期間を15年とし、公正証書によって契約の更新がない旨を定めても、その定めは無効である。","a":0,"e":"事業用建物の所有目的で期間10年以上50年未満なら、公正証書による事業用定期借地権として有効（23条）。","m":"事業用定期は公正証書"},{"f":"権利","t":"借家","ref":"R01-12-1","s":"期間3年の建物賃貸借で、公正証書等の書面で契約しさえすれば、事前に更新がない旨を記載した書面を交付して説明しなくても、更新がない旨の定めは有効となる。","a":0,"e":"定期建物賃貸借は、書面等による契約に加え、事前に更新がない旨の書面交付（電磁的提供可）と説明が必要（38条）。","m":"契約書＋事前説明書面"},{"f":"権利","t":"借家","ref":"R01-12-3","s":"期間3年の建物賃貸借で、賃貸人が期間満了の1年前から6か月前までの間に更新しない旨の通知をしなかった場合、従前と同一条件で期間の定めのない契約として更新される。","a":1,"e":"通知期間内に通知がなければ法定更新され、更新後の期間は定めのないものとなる（26条1項）。","m":"1年前〜6か月前に通知"},{"f":"権利","t":"借家","ref":"R01-12-4","s":"建物の賃貸人Aの同意を得て賃借人Bが転貸している場合、AB間の賃貸借が解約の申入れで終了するときは、Aは転借人Cにその旨を通知しなければ終了をCに対抗できない。","a":1,"e":"賃貸借が期間満了又は解約申入れで終了するときは転借人への通知が必要で、通知から6か月で転貸借が終了する（34条）。","m":"転借人へ通知＋6か月"},{"f":"権利","t":"区分所有法","ref":"R01-13-1","s":"区分所有建物の専有部分が数人の共有に属するときは、議決権を行使すべき者を定めることなく、各共有者がそれぞれ持分に応じて集会で議決権を行使することができる。","a":0,"e":"専有部分の共有者は、議決権を行使すべき者1人を定めなければならない（40条）。","m":"共有者は代表1人"},{"f":"権利","t":"区分所有法","ref":"R01-13-2","s":"区分所有者の承諾を得て専有部分を占有する賃借人は、会議の目的たる事項に利害関係を有する場合、集会に出席して意見を述べることができるが、議決権は行使できない。","a":1,"e":"占有者は利害関係があれば集会で意見を述べられるが、議決権はない（44条1項）。","m":"占有者は意見のみ"},{"f":"権利","t":"区分所有法","ref":"R01-13-3","s":"集会においては、規約に別段の定めがある場合及び別段の決議をした場合を除き、管理者又は集会を招集した区分所有者の1人が議長となる。","a":1,"e":"議長は原則として管理者又は招集した区分所有者の1人。規約や別段の決議で別に定められる（41条）。","m":"議長は管理者か招集者"},{"f":"権利","t":"不動産登記法","ref":"R01-14-2","s":"甲土地の所有権の登記名義人がA、隣接する乙土地の所有権の登記名義人がBであるように、所有権の登記名義人が相互に異なる土地については、合筆の登記をすることができない。","a":1,"e":"所有権の登記名義人が異なる土地の合筆は禁止されている（41条3号）。","m":"名義が違えば合筆不可"},{"f":"権利","t":"不動産登記法","ref":"R01-14-3","s":"山林として登記されている一筆の土地の一部が農地となるなど、一筆の土地の一部が別の地目となった場合でも、登記官は職権で分筆の登記をすることはできない。","a":0,"e":"一筆の土地の一部が別の地目となったときは、登記官が職権で分筆の登記をしなければならない（39条2項）。","m":"一部地目変更は職権分筆"},{"f":"権利","t":"不動産登記法","ref":"R01-14-4","s":"土地の売主Aが司法書士に所有権移転登記の申請を委任した後に死亡した場合でも、登記の申請をする者の委任による代理人の権限は、本人の死亡によっては消滅しない。","a":1,"e":"民法の原則と異なり、登記申請の委任による代理権は本人の死亡で消滅しない（17条1号）。","m":"登記の代理は死亡で消えない"},{"f":"法令","t":"開発許可","ref":"R01-16-1","s":"準都市計画区域において、店舗の建築を目的とする4,000㎡の土地の区画形質の変更を行う場合、原則として都道府県知事の開発許可が必要である。","a":1,"e":"準都市計画区域では3,000㎡未満なら許可不要。4,000㎡は許可が必要（29条1項1号、施行令19条）。","m":"準都市は3,000㎡"},{"f":"法令","t":"開発許可","ref":"R01-16-3","s":"市街化調整区域において、野球場の建設を目的とする8,000㎡の土地の区画形質の変更を行う場合、都道府県知事の開発許可が必要である。","a":0,"e":"野球場は1ha以上で第二種特定工作物となる。8,000㎡は該当せず開発行為にあたらないので許可不要。","m":"野球場は1ha以上"},{"f":"法令","t":"開発許可","ref":"R01-16-4","s":"市街化調整区域において、病院の建築を目的とする1,000㎡の土地の区画形質の変更を行う場合、公益上必要な建築物であるため開発許可は不要である。","a":0,"e":"許可不要の公益上必要な建築物は駅舎・図書館・公民館・変電所等で、病院は含まれない。","m":"病院・学校は許可必要"},{"f":"法令","t":"建築基準法","ref":"R01-17-1","s":"特定行政庁は、緊急の必要がある場合、違反建築物の所有者等に対し、意見聴取等の手続によらずに仮に使用禁止又は使用制限の命令をすることができる。","a":1,"e":"緊急の必要があるときは、通常の手続を経ずに仮に使用禁止・使用制限を命じられる（9条7項）。","m":"緊急なら手続省略"},{"f":"法令","t":"建築基準法","ref":"R01-17-2","s":"地方公共団体は、条例で、津波・高潮・出水等による危険の著しい区域を災害危険区域として指定し、区域内の住居用建築物の建築禁止などの制限を定めることができる。","a":1,"e":"災害危険区域の指定も、区域内の住居用建築物の禁止などの建築制限も、地方公共団体の条例で定める（39条）。","m":"災害危険区域は条例"},{"f":"法令","t":"建築基準法","ref":"R01-17-4","s":"建築基準法上、共同住宅の住戸には、その建築物の規模や階数にかかわらず、居室ごとに非常用の照明装置を設けなければならない。","a":0,"e":"一戸建住宅や長屋・共同住宅の住戸は、非常用の照明装置の設置が不要とされている（施行令126条の4）。","m":"住戸に非常照明は不要"},{"f":"法令","t":"盛土規制法","ref":"R01-19-1","s":"宅地造成等工事規制区域にも特定盛土等規制区域にも属さない区域で宅地造成の工事を行う場合、工事主は工事着手の日の14日前までに都道府県知事に届け出なければならない。","a":0,"e":"盛土規制法の許可・届出は規制区域内の工事が対象。いずれの区域にも属さない区域の工事には届出義務はない。","m":"区域外なら規制なし"},{"f":"法令","t":"盛土規制法","ref":"R01-19-2","s":"宅地造成等工事規制区域内で許可を受けた工事の計画を変更する場合、軽微な変更を除き、遅滞なく都道府県知事に届け出れば足りる。","a":0,"e":"計画の変更は原則として知事の許可が必要で、届出で足りるのは軽微な変更のみ（盛土規制法16条）。","m":"変更は許可・軽微は届出"},{"f":"法令","t":"盛土規制法","ref":"R01-19-3","s":"宅地造成等工事規制区域の指定の際、その区域内で既に宅地造成等の工事を行っている工事主は、指定があった日から21日以内に都道府県知事に届け出なければならない。","a":1,"e":"指定の際に既に工事中の工事主は許可不要だが、指定日から21日以内の届出が必要（盛土規制法21条1項）。","m":"指定時工事中は21日届出"},{"f":"法令","t":"土地区画整理法","ref":"R01-20-1","s":"仮換地の指定があった日後、施行地区内の土地及び建物について変動に係る登記がされるまでは、原則として他の登記をすることができない。","a":0,"e":"登記が制限されるのは換地処分の公告があった日後である（107条3項）。仮換地の指定ではない。","m":"登記停止は換地処分公告後"},{"f":"法令","t":"土地区画整理法","ref":"R01-20-3","s":"土地区画整理事業において、個人施行者以外の施行者が換地計画を定めようとする場合、その換地計画を2週間公衆の縦覧に供しなければならない。","a":1,"e":"個人施行者以外の施行者は、換地計画を2週間公衆の縦覧に供する必要がある（88条2項）。","m":"換地計画の縦覧は2週間"},{"f":"法令","t":"土地区画整理法","ref":"R01-20-4","s":"換地処分の公告があった場合、換地は公告の日の翌日から従前の宅地とみなされ、換地を定めなかった従前の宅地に存する権利は公告の日が終了した時に消滅する。","a":1,"e":"換地は翌日から従前の宅地とみなされ、換地を定めなかった従前の宅地上の権利は公告日の終了時に消滅（104条）。","m":"消滅は当日終了・取得は翌日"},{"f":"法令","t":"農地法","ref":"R01-21-1","s":"自己が所有する原野を、耕作の目的で開墾して農地とする場合、その行為は農地の転用にあたらないため、農地法第4条第1項の許可は不要である。","a":1,"e":"原野は農地ではなく、原野を農地にする行為は農地の転用にあたらない。","m":"原野→農地は許可不要"},{"f":"法令","t":"農地法","ref":"R01-21-2","s":"農業者が金融機関から資金を借り入れるため、自己所有の農地に金融機関のための抵当権を設定する場合、農地法第3条第1項の許可が必要である。","a":0,"e":"3条の対象は所有権移転や使用収益権の設定等で、抵当権の設定は含まれない。","m":"抵当権設定は許可不要"},{"f":"法令","t":"農地法","ref":"R01-21-3","s":"市街化区域内にある自己所有の農地を自家用の駐車場に転用する場合、あらかじめ農業委員会に届け出たとしても、農地法第4条第1項の許可が必要である。","a":0,"e":"市街化区域内の農地の転用は、あらかじめ農業委員会に届け出れば許可は不要（4条1項7号）。","m":"市街化区域は届出"},{"f":"法令","t":"国土利用計画法","ref":"R01-22-2","s":"個人Dが所有する市街化区域内の3,000㎡の土地を、個人Eが相続により取得した場合、Eは国土利用計画法第23条の事後届出を行わなければならない。","a":0,"e":"事後届出の対象は対価を得て行う契約による取引。相続は契約ではないため届出不要。","m":"相続は届出不要"},{"f":"法令","t":"国土利用計画法","ref":"R01-22-3","s":"市街化調整区域内の6,000㎡の一団の土地を、宅地建物取引業者Gが一定の計画に従い3,000㎡ずつ2回に分けて購入した場合、Gは事後届出を行う必要がある。","a":1,"e":"一定の計画に従った一団の土地の取得は合算して判断する。市街化調整区域は5,000㎡以上で届出が必要。","m":"一団の土地は合算"},{"f":"法令","t":"国土利用計画法","ref":"R01-22-4","s":"甲市が所有する市街化調整区域内の12,000㎡の土地を宅地建物取引業者Hが購入した場合、Hは事後届出を行う必要はない。","a":1,"e":"当事者の一方又は双方が国・地方公共団体等である場合は、事後届出は不要。","m":"国・自治体が当事者なら不要"},{"f":"業法","t":"免許","ref":"R01-26-1","s":"宅地建物取引業者は、自己の名義をもって他人に宅地建物取引業を営ませることはできないが、宅地建物取引業を営む目的で自己の名義で広告をさせることはできる。","a":0,"e":"名義貸しは、営業させること・営業の表示をさせること・広告をさせることのいずれも禁止（13条）。","m":"名義貸しは広告もNG"},{"f":"業法","t":"免許","ref":"R01-26-2","s":"マンションの一室など建物の一部の売買の代理を業として行うことは、建物全体の取引ではないため、宅地建物取引業にあたらず免許は不要である。","a":0,"e":"宅建業法の「建物」には建物の一部も含まれるため、その売買の代理を業として行えば宅建業にあたる。","m":"建物の一部も建物"},{"f":"業法","t":"免許","ref":"R01-26-4","s":"宅地建物取引業者Aの従業者Bが、Aの業務とは別に自己のために免許を受けずに宅地建物の売買の媒介を業として行った場合、Bの行為は無免許事業にあたる。","a":1,"e":"従業者個人であっても自己のために宅建業を営むには免許が必要で、無免許なら12条違反となる。","m":"従業者も自分の商売は免許"},{"f":"業法","t":"8種制限","ref":"R01-27-イ","s":"宅地建物取引業者が自ら売主となり宅建業者でない者に建物を売却する場合、契約不適合の通知期間を引渡しの日から1年とする特約は有効である。","a":0,"e":"民法より買主に不利な特約は無効。例外は通知期間を引渡しから2年以上とする特約のみ（40条）。","m":"通知期間は引渡しから2年以上"},{"f":"業法","t":"業務上の規制","ref":"R01-27-ウ","s":"宅地建物取引業者は、業務上知り得た秘密について、裁判の証人となる場合など正当な理由があっても、他に漏らしてはならない。","a":0,"e":"守秘義務は正当な理由がある場合は例外で、証人として証言する場合や本人の承諾がある場合は漏らせる（45条）。","m":"正当な理由なら開示可"},{"f":"業法","t":"業務上の規制","ref":"R01-27-エ","s":"宅地建物取引業者は、契約の締結を勧誘するに際し、相手方に利益を生ずることが確実であると誤解させるような断定的判断を提供してはならない。","a":1,"e":"利益が確実と誤解させる断定的判断の提供は禁止される（47条の2第1項）。故意でなくても違反となる。","m":"「必ず儲かる」はNG"},{"f":"業法","t":"広告","ref":"R01-30-ア","s":"建築工事着手前の賃貸住宅について、取引態様を「媒介」と明示すれば、建築確認を受ける前でも貸借の媒介の広告をすることができる。","a":0,"e":"未完成物件の広告は、売買・貸借を問わず建築確認等の処分があった後でなければできない（33条）。","m":"確認前は貸借でも広告不可"},{"f":"業法","t":"広告","ref":"R01-30-イ","s":"一団の宅地を数回に分けて広告する場合、宅地建物取引業者は、最初の広告だけでなく各回の広告ごとに取引態様の別を明示しなければならない。","a":1,"e":"取引態様の明示は広告をするたびに必要で、数回に分ける場合も各回に明示する（34条1項）。","m":"広告のたびに態様明示"},{"f":"業法","t":"広告","ref":"R01-30-ウ","s":"媒介を行う宅地建物取引業者は、依頼者の依頼によらない通常の広告についても、報酬とは別に広告料金に相当する額を受領することができる。","a":0,"e":"報酬と別に広告料金を受領できるのは、依頼者の依頼による特別な広告の場合に限られる（報酬告示）。","m":"広告料は依頼があった分だけ"},{"f":"業法","t":"媒介契約","ref":"R01-31-ア","s":"専任媒介契約を締結した宅地建物取引業者は、契約締結の日から休業日を含めて7日以内に、物件を指定流通機構に登録しなければならない。","a":0,"e":"専任媒介の登録期限は休業日を除いて7日以内（34条の2第5項、施行規則15条の10）。","m":"専任7日は休業日除く"},{"f":"業法","t":"媒介契約","ref":"R01-31-イ","s":"宅地建物取引業者Aが既存マンションの売主Bと専任媒介契約を締結し、その有効期間を6か月と定めた場合、その専任媒介契約は無効となる。","a":0,"e":"3か月を超える期間を定めた場合は3か月に短縮されるだけで、契約自体は有効（34条の2第3項）。","m":"超えたら3か月に短縮"},{"f":"業法","t":"媒介契約","ref":"R01-31-エ","s":"媒介業者が依頼者に建物状況調査を実施する者のあっせんをする場合、その者は建築士であって国土交通大臣が定める講習を修了した者でなければならない。","a":1,"e":"建物状況調査を実施できるのは、国交大臣が定める講習を修了した建築士である（施行規則15条の8）。","m":"調査者は講習修了の建築士"},{"f":"業法","t":"保証協会","ref":"R01-33-1","s":"保証協会に加入しようとする宅地建物取引業者は、加入した日から2週間以内に弁済業務保証金分担金を保証協会に納付しなければならない。","a":0,"e":"分担金は保証協会に加入しようとする日までに金銭で納付しなければならない（64条の9第1項）。","m":"加入日までに納付"},{"f":"業法","t":"保証協会","ref":"R01-33-2","s":"保証協会の社員となったことにより営業保証金を供託する必要がなくなった宅地建物取引業者は、還付請求権者に対する公告をすることなく営業保証金を取り戻すことができる。","a":1,"e":"保証協会の社員となったことによる取戻しは公告不要（64条の14）。","m":"社員になったら公告不要"},{"f":"業法","t":"保証協会","ref":"R01-33-3","s":"保証協会の社員が新たに事務所を設置した場合、その日から2週間以内に弁済業務保証金分担金を納付しなければ、社員の地位を失う。","a":1,"e":"新事務所設置日から2週間以内に分担金を納付しないと社員の地位を失う（64条の9第2項・3項）。","m":"新事務所は2週間以内"},{"f":"業法","t":"37条書面","ref":"R01-34-1","s":"宅地建物取引業者Aが宅地の売買を媒介し、契約で損害賠償額の予定を定めた場合、その予定額が代金の10分の2以下であれば、Aは37条書面にその内容を記載する必要はない。","a":0,"e":"損害賠償額の予定は定めがあれば金額にかかわらず記載が必要な任意的記載事項（37条1項8号）。売買・貸借共通。","m":"定めがあれば額を問わず記載"},{"f":"業法","t":"37条書面","ref":"R01-34-2","s":"宅地建物取引業者Aが既存建物の売買を媒介して契約を成立させた場合、建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を、37条書面に記載しなければならない。","a":1,"e":"既存建物の売買・交換では当事者双方が確認した事項が必要的記載事項（37条1項2号の2）。貸借では不要。","m":"既存建物の売買は確認事項を記載"},{"f":"業法","t":"37条書面","ref":"R01-34-3","s":"宅地建物取引業者Aが宅地の売買を媒介し、当事者間で固定資産税など租税その他の公課の負担について定めをしたときであっても、Aはその内容を37条書面に記載する必要はない。","a":0,"e":"租税公課の負担の定めは、定めがあれば記載しなければならない任意的記載事項（売買・交換のみ）。","m":"公租公課の定め→売買は記載"},{"f":"業法","t":"37条書面","ref":"R01-34-4","s":"宅地建物取引業者が売買を媒介して37条書面を作成する場合、その書面に記名する宅地建物取引士は、同じ取引の35条書面に記名した宅地建物取引士と同一の者でなければならない。","a":0,"e":"35条書面と37条書面の記名は宅建士であれば足り、同一人物である必要はない。専任である必要もない。","m":"記名する宅建士は別人でもOK"},{"f":"業法","t":"8種制限","ref":"R01-35-1","s":"宅地建物取引業者Aが、宅建業者でないBの所有地について確定測量図の交付を停止条件とする売買契約をBと結んだ場合、条件成就前でも、Aは自ら売主として宅建業者でないCとその宅地の売買契約を締結できる。","a":0,"e":"停止条件付きの取得契約では物件はまだ自己の所有に属しないとされ、自ら売主として売買契約を結べない（33条の2）。","m":"停止条件付き取得は他人物扱い"},{"f":"業法","t":"事務所・案内所","ref":"R01-35-2","s":"宅地建物取引業者Aの主たる事務所で唯一の専任の宅地建物取引士が5月15日に退職した場合、Aが6月10日に新たな専任の宅地建物取引士を設置すれば、宅建業法には違反しない。","a":0,"e":"専任宅建士が法定数を欠いたときは2週間以内に補充等の措置をとる必要がある（31条の3第3項）。6月10日では遅い。","m":"専任宅建士の欠員は2週間で補充"},{"f":"業法","t":"業務上の規制","ref":"R01-35-4","s":"宅地建物取引業者Aが、都市計画法29条の開発許可を申請中であることを知りながら、その許可前に当該宅地の貸借を媒介して賃貸借契約を成立させても、宅建業法には違反しない。","a":1,"e":"許可等の前の契約締結時期の制限（36条）は売買・交換が対象で、貸借には適用されない。","m":"契約時期の制限は貸借対象外"},{"f":"業法","t":"37条書面","ref":"R01-36-イ","s":"宅地建物取引業者Aが自ら貸主として宅地の定期賃貸借契約を締結し、借賃の支払方法を定めた場合、借主が宅建業者であっても、Aは借主に37条書面を交付しなければならない。","a":0,"e":"自ら貸主となる行為は宅地建物取引業に当たらず、宅建業法の37条書面交付義務は生じない。","m":"自ら貸主は業法の対象外"},{"f":"業法","t":"37条書面","ref":"R01-36-エ","s":"宅地建物取引業者Aが建物の売買や貸借を媒介し、契約の解除に関する定めがある場合、Aはその内容を37条書面に記載しなければならず、これは売買でも貸借でも同じである。","a":1,"e":"契約の解除に関する定めは、売買・貸借いずれでも定めがあれば記載すべき任意的記載事項（37条1項7号・2項1号）。","m":"解除の定めは売買も貸借も記載"},{"f":"業法","t":"8種制限","ref":"R01-37-2","s":"宅建業者Aが自ら売主として宅建業者でないBに未完成マンションを売り、手付を受領した場合、Bが履行に着手する前であれば、Aは手付の倍額を現実に提供して契約を解除できる。","a":1,"e":"宅建業者が売主で手付を受領した場合、相手方の履行着手前なら売主は倍額を現実に提供して解除できる（39条2項）。","m":"売主は倍返しで解除OK"},{"f":"業法","t":"8種制限","ref":"R01-37-3","s":"宅建業者Aが自ら売主として宅建業者でないBと代金3,000万円の未完成マンションの売買契約を結び、手付金150万円を保全措置なしで受領した。その後中間金50万円を受領するには、合計200万円について保全措置を講じればよい。","a":1,"e":"未完成物件は代金の5％（150万円）超で保全措置が必要。超えることとなる中間金の受領前に、受領済み分を含む全額を保全する（41条）。","m":"超える時に全額を保全"},{"f":"業法","t":"8種制限","ref":"R01-37-1","s":"宅建業者Aが自ら売主として宅建業者でないBに代金3,000万円の未完成マンションを売る場合、Bに書面で保全措置を講じない旨を告げてBが承諾すれば、手付金200万円を保全措置なしで受領できる。","a":0,"e":"未完成物件で代金の5％（150万円）を超える手付金等は、買主の承諾があっても保全措置なしでは受領できない（41条）。","m":"買主の承諾でも保全は省けない"},{"f":"業法","t":"業務上の規制","ref":"R01-40-1","s":"宅建業者の従業者は取引の関係者から請求があったときに従業者証明書を提示すればよいが、宅地建物取引士は重要事項の説明をするときは請求がなくても宅地建物取引士証を提示しなければならない。","a":1,"e":"従業者証明書は請求時に提示（48条2項）。宅建士証は重要事項説明時は請求がなくても提示が必要（35条4項）。","m":"重説時の宅建士証は請求不要"},{"f":"業法","t":"業務上の規制","ref":"R01-40-2","s":"宅地建物取引業者は、その事務所ごとに業務に関する帳簿を備え付け、これを各取引の終了後5年間（自ら売主となる新築住宅に係るものは10年間）保存しなければならない。","a":0,"e":"帳簿は各事業年度の末日に閉鎖し、閉鎖後5年間（自ら売主の新築住宅は10年間）保存する（49条、規則18条）。","m":"帳簿は閉鎖後5年・新築10年"},{"f":"業法","t":"事務所・案内所","ref":"R01-40-3","s":"宅建業者が一団の宅地の分譲をテント張りの案内所のような一時的かつ移動が容易な施設で行う場合、その案内所に掲げる標識にはクーリング・オフ制度の適用がある旨を表示しなければならない。","a":1,"e":"土地に定着しない案内所での申込み等はクーリング・オフの対象となるため、標識にその旨を記載する（50条1項、規則19条）。","m":"テント案内所はクーリングオフ表示"},{"f":"業法","t":"免許","ref":"R01-42-1","s":"都市計画法に規定する用途地域内にある土地であれば、現に道路・公園・河川などの公共施設の用に供されている土地であっても、宅地建物取引業法上の「宅地」に該当することになる。","a":0,"e":"用途地域内の土地は原則宅地だが、道路・公園・河川・広場・水路の用に供されている土地は除かれる（2条1号）。","m":"用途地域内でも公共施設用地は除外"},{"f":"業法","t":"免許","ref":"R01-42-4","s":"準工業地域内にある土地で、現在は建築資材置場として利用されているものは、建物の敷地に供されておらず、その予定もない場合でも、宅地建物取引業法上の「宅地」に該当する。","a":1,"e":"用途地域内の土地は、道路・公園等の公共施設用地を除き、現況にかかわらず宅地に当たる（2条1号）。","m":"用途地域内は現況を問わず宅地"},{"f":"業法","t":"宅建士","ref":"R01-44-1","s":"業務停止処分に違反したとして免許を取り消された法人で、取消し前に政令で定める使用人であった者は、取消しの日から5年を経過しなければ宅地建物取引士の登録を受けることができない。","a":0,"e":"登録欠格となるのは聴聞公示前60日以内に役員であった者で、政令使用人は含まれない（18条1項）。","m":"政令使用人は欠格に含まれない"},{"f":"業法","t":"宅建士","ref":"R01-44-2","s":"甲県知事の資格登録を受けている宅地建物取引士が、乙県知事の免許を受けた宅地建物取引業者に勤務先を変更した場合、乙県知事に対して変更の登録を申請しなければならない。","a":0,"e":"勤務先業者の商号・免許証番号は登録事項なので変更の登録が必要だが、申請先は登録をしている甲県知事（20条）。","m":"変更の登録は登録知事へ"},{"f":"業法","t":"宅建士","ref":"R01-44-3","s":"宅地建物取引士の資格登録を受けている者は、宅地建物取引士証の交付を受けていない場合であっても、住所を変更したときは、遅滞なく変更の登録を申請しなければならない。","a":1,"e":"住所は資格登録簿の登載事項であり、宅建士証の有無にかかわらず遅滞なく変更の登録が必要（20条）。","m":"住所変更は士証なしでも届出"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R01-45-1","s":"宅地建物取引業者は、自ら売主として新築住宅を販売する場合だけでなく、新築住宅の売買を媒介する場合にも、住宅販売瑕疵担保保証金の供託または保険契約の締結を行う義務を負う。","a":0,"e":"資力確保措置の義務を負うのは自ら売主となる宅建業者であり、媒介業者は義務を負わない（住宅瑕疵担保履行法11条）。","m":"資力確保は売主業者だけ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R01-45-2","s":"自ら売主として新築住宅を販売する宅建業者が保証金を供託している場合、宅建業者でない買主に対し、売買契約を締結するまでに、供託所の所在地等を記載した書面を交付して説明しなければならない。","a":1,"e":"供託所の所在地等は、売買契約締結までに書面を交付して説明する必要がある（住宅瑕疵担保履行法15条）。","m":"供託所の説明は契約締結まで"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R01-45-3","s":"自ら売主として新築住宅を引き渡した宅建業者は、基準日ごとに、保証金の供託と保険契約の締結の状況について、基準日から3週間以内に免許権者に届け出なければならない。","a":1,"e":"資力確保措置の状況は基準日から3週間以内に免許を受けた大臣・知事へ届け出る（住宅瑕疵担保履行法12条）。","m":"届出は基準日から3週間"},{"f":"税他","t":"住宅金融支援機構","ref":"R01-46-1","s":"住宅金融支援機構は、証券化支援事業（買取型）において、新築住宅の建設・購入資金の貸付債権は買取りの対象とするが、中古住宅を購入するための貸付債権は買取りの対象としていない。","a":0,"e":"一定の技術基準を満たす中古住宅の購入資金の貸付債権も、証券化支援事業（買取型）の買取対象となる。","m":"中古住宅も買取対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R01-46-2","s":"住宅金融支援機構は、証券化支援事業（買取型）において、バリアフリー性、省エネルギー性、耐震性、耐久性・可変性に優れた住宅を取得する場合に、一定期間貸付金利を引き下げる制度を実施している。","a":1,"e":"優良住宅取得支援制度（フラット35S）として、性能の優れた住宅は一定期間の金利が引き下げられる。","m":"優良住宅は金利引下げ"},{"f":"税他","t":"住宅金融支援機構","ref":"R01-46-3","s":"住宅金融支援機構は、マンションの管理組合や区分所有者に対して、マンションの共用部分の改良に必要な資金を直接貸し付ける業務を行っており、これは証券化支援事業とは別の業務である。","a":1,"e":"共用部分の改良資金の貸付けは、機構が直接融資で行う業務の一つである（機構法13条1項）。","m":"共用部分の改良も直接融資"},{"f":"税他","t":"景品表示法","ref":"R01-47-2","s":"宅地建物取引業者が新築賃貸マンションの広告をする際、全住戸の賃料を表示することが困難な場合は、標準的な1住戸の1か月当たりの賃料のみを表示すれば、不当表示とはならない。","a":0,"e":"全住戸の賃料を示すのが困難な場合は、1住戸当たりの最低賃料と最高賃料を表示する（公正競争規約施行規則）。","m":"全戸困難なら最低と最高"},{"f":"税他","t":"景品表示法","ref":"R01-47-3","s":"宅地建物取引業者が中古住宅の広告をする場合、その住宅がリフォーム済みであるときは、リフォームの内容や時期にかかわらず、必ずリフォーム済みである旨を表示しなければならない。","a":0,"e":"リフォームの表示義務はない。リフォーム済みと表示するときに、その内容と時期を明示する必要がある。","m":"リフォーム表示時は内容と時期"},{"f":"税他","t":"景品表示法","ref":"R01-47-4","s":"宅地建物取引業者が中古として買い取って再販売する分譲住宅であっても、建築後1年未満で、かつ居住の用に供されたことがないものであれば、広告で「新築」と表示することができる。","a":1,"e":"「新築」は建築後1年未満かつ未入居のものをいい、再販売かどうかは問わない（公正競争規約18条）。","m":"新築＝1年未満かつ未入居"},{"f":"税他","t":"土地・建物","ref":"R01-50-2","s":"建築物の地震対策の考え方の一つである制震構造は、柱・梁・壁などに組み込んだ制振ダンパー等の装置によって地震の揺れのエネルギーを吸収し、建物の揺れを制御する構造である。","a":1,"e":"制震はダンパー等で揺れのエネルギーを吸収する技術で、揺れが増幅しやすい高層建築物に有効とされる。","m":"制震＝ダンパーで吸収"},{"f":"税他","t":"土地・建物","ref":"R01-50-4","s":"建築物の地震対策のうち耐震構造は、柱や壁など構造自体の強さや粘り強さによって地震に耐える方法であるが、既存不適格建築物の地震補強の手法としては用いられていない。","a":0,"e":"耐震は構造の強度で地震に耐える方法で、既存不適格建築物の耐震補強にも広く用いられている。","m":"耐震は既存補強にも使う"},{"f":"権利","t":"売買・契約不適合","ref":"R02-09-1","s":"AとBが建物の売買契約を結び、買主Bが解約手付を交付した。その後Bが履行期到来後に代金を用意し、いつでも支払える状態でAに履行を催告した場合でも、Aは手付の倍額を現実に提供して契約を解除できる。","a":0,"e":"相手方が履行に着手した後は手付解除できない（557条1項）。代金を準備して催告した買主は履行に着手したとされる（判例）。","m":"相手が着手したら手付解除不可"},{"f":"権利","t":"売買・契約不適合","ref":"R02-09-3","s":"AがBに建物を負担付きで贈与し、Bがその負担を履行した場合において、その建物に契約内容に適合しない点があったときは、贈与者Aは、その負担の限度において、売主と同様に担保の責任を負う。","a":1,"e":"負担付贈与の贈与者は、その負担の限度で売主と同じく担保の責任を負う（551条2項）。","m":"負担の限度で売主と同じ責任"},{"f":"権利","t":"債務不履行・解除","ref":"R02-09-4","s":"建物の売買契約では買主の債務不履行を理由に売主が契約を解除できるが、建物の負担付贈与契約では、受贈者が負担を履行しなくても、贈与者は契約を解除することができない。","a":0,"e":"負担付贈与には双務契約の規定が準用されるため、受贈者が負担を履行しないときは贈与者は解除できる（553条、判例）。","m":"負担不履行なら解除できる"},{"f":"権利","t":"借地","ref":"R02-11-1","s":"AがBに居住用建物の所有を目的として土地を賃貸した場合、Bが借地権の登記も借地上の建物の登記もしていなくても、土地の引渡しを受けていれば、その後土地を買い受けたCに借地権を対抗できる。","a":0,"e":"借地権の対抗要件は賃借権の登記か借地上の建物の登記（借地借家法10条1項）。土地の引渡しだけでは対抗できない。","m":"借地は引渡しでは対抗不可"},{"f":"権利","t":"借地","ref":"R02-11-2","s":"建物所有目的の普通借地契約で「一定期間は地代を減額しない」と定めた場合、経済事情の変動で地代が不相当になっても、借地権者はその期間中、地代の減額を請求できない。","a":0,"e":"増額しない特約は有効だが、減額しない特約は借地権者に不利で無効。借地権者は減額請求できる（借地借家法11条1項）。","m":"減額しない特約は無効"},{"f":"権利","t":"借地","ref":"R02-11-4","s":"建物所有を目的とする存続期間30年の普通借地契約が期間満了により初めて更新される場合、当事者が更新後の存続期間を15年と合意しても、更新後の存続期間は20年となる。","a":1,"e":"最初の更新後は20年以上、2回目以降は10年以上。これより短い定めは無効で法定期間となる（借地借家法4条）。","m":"初回更新20年・以降10年"},{"f":"権利","t":"借家","ref":"R02-12-2","s":"AがBに居住用建物を期間2年の定期建物賃貸借で貸し、賃料改定に関する特約を定めなかった場合、経済事情の変動で賃料が不相当となったときは、AはBに借賃の増額を請求できる。","a":1,"e":"定期建物賃貸借でも、借賃改定の特約がなければ借賃増減請求権の規定が適用される（借地借家法32条、38条）。","m":"特約なし→定期借家も増減請求可"},{"f":"権利","t":"借家","ref":"R02-12-3","s":"居住用の定期建物賃貸借で、賃貸人が転勤や親族の介護などやむを得ない事情により自ら使用することが困難になったときは、賃貸人は解約を申し入れ、1か月経過後に契約を終了させることができる。","a":0,"e":"やむを得ない事情による中途解約は、床面積200㎡未満の居住用建物の賃借人からの申入れに限られる（借地借家法38条）。","m":"中途解約は借主からだけ"},{"f":"権利","t":"借家","ref":"R02-12-4","s":"造作買取請求権を排除する特約がない定期建物賃貸借が期間満了で終了する場合、賃借人は、賃貸人の同意を得て付加した造作について、賃貸人に時価での買取りを請求できる。","a":1,"e":"造作買取請求権は特約で排除できるが、特約がなければ定期建物賃貸借でも行使できる（借地借家法33条、37条）。","m":"特約なければ造作買取OK"},{"f":"権利","t":"不動産登記法","ref":"R02-14-1","s":"敷地権付き区分建物について、表題部所有者から直接所有権を取得した者が自己名義で所有権の保存登記を申請するには、その敷地権の登記名義人の承諾を得なければならない。","a":1,"e":"区分建物は表題部所有者からの取得者も保存登記を申請できるが、敷地権付きなら敷地権の登記名義人の承諾が必要（74条2項）。","m":"敷地権付きは名義人の承諾"},{"f":"権利","t":"不動産登記法","ref":"R02-14-2","s":"所有権に関する仮登記に基づく本登記は、その本登記について登記上の利害関係を有する第三者がいる場合であっても、その第三者の承諾を得ることなく申請することができる。","a":0,"e":"所有権の仮登記に基づく本登記は、登記上の利害関係を有する第三者がいればその承諾が必要（109条1項）。","m":"所有権仮登記の本登記は承諾要"},{"f":"権利","t":"不動産登記法","ref":"R02-14-4","s":"配偶者居住権は、建物の所有者と配偶者との間の債権的な権利にすぎず、第三者に対抗する手段も設けられていないため、不動産登記法上、登記することができる権利には含まれていない。","a":0,"e":"配偶者居住権は登記できる権利であり（不登法3条9号）、建物所有者は設定登記を備えさせる義務を負う。","m":"配偶者居住権も登記できる"},{"f":"法令","t":"都市計画法","ref":"R02-15-1","s":"都市計画法上、地区計画を都市計画に定める場合、地区施設および地区整備計画については定めるよう努めるものとされているにとどまり、これらを必ずしも定める必要はない。","a":0,"e":"地区計画には地区施設と地区整備計画を定めるものとされる。努力義務は目標や整備・開発・保全の方針（12条の5）。","m":"地区施設・整備計画は必須"},{"f":"法令","t":"都市計画法","ref":"R02-15-3","s":"都市計画法上、第二種住居地域は、中高層住宅に係る良好な住居の環境を保護するため定める地域であり、用途地域の一つとして市街化区域その他の都市計画区域内に定められる。","a":0,"e":"これは第一種中高層住居専用地域の定義。第二種住居地域は主として住居の環境を保護するため定める地域（9条）。","m":"中高層住居の保護＝一中高"},{"f":"法令","t":"都市計画法","ref":"R02-15-4","s":"市街化調整区域における地区計画は、市街化区域の市街化の状況等を勘案して、地区計画の区域周辺の市街化を促進せず、計画的な市街化を図るうえで支障がないように定めなければならない。","a":1,"e":"市街化調整区域の地区計画は周辺の市街化を促進せず、計画的な市街化に支障がないよう定める（13条1項15号）。","m":"調整区域の地区計画は市街化促進NG"},{"f":"法令","t":"建築基準法","ref":"R02-18-2","s":"建築基準法の用途規制上、客席部分の床面積の合計が200㎡以上の映画館は、商業地域や準工業地域では建築できるが、近隣商業地域内では特定行政庁の許可がなければ建築することができない。","a":0,"e":"客席200㎡以上の映画館は近隣商業地域・商業地域・準工業地域で建築できる（48条、別表第二）。","m":"大きい映画館は近商・商業・準工"},{"f":"法令","t":"建築基準法","ref":"R02-18-3","s":"建築基準法上、建築物の容積率を算定する場合、老人ホームや福祉ホームの共用の廊下や階段の用に供する部分の床面積は、容積率の算定の基礎となる建築物の延べ面積に算入しない。","a":1,"e":"共同住宅・老人ホーム等の共用廊下・階段部分の床面積は容積率算定上の延べ面積に算入しない（52条6項）。","m":"老人ホームの共用廊下は不算入"},{"f":"法令","t":"建築基準法","ref":"R02-18-4","s":"建築基準法の日影による中高層の建築物の高さの制限において、日影時間は、夏至日の真太陽時による午前8時から午後4時まで（北海道以外の区域の場合）の間について測定する。","a":0,"e":"日影時間は冬至日の真太陽時による午前8時から午後4時まで（北海道は9時から15時）で測る（56条の2）。","m":"日影規制は冬至日で測る"},{"f":"法令","t":"盛土規制法","ref":"R02-19-3","s":"盛土規制法の宅地造成等工事規制区域内において、宅地造成等に関する工事を行わずに公共施設用地を宅地に転用しようとする者は、あらかじめ都道府県知事の許可を受けなければならない。","a":0,"e":"工事を伴わない公共施設用地の宅地・農地等への転用は許可不要で、転用した日から14日以内に知事へ届け出れば足

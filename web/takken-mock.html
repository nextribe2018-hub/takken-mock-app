知事等の許可は不要。②は耕作目的の権利移動（3条）で、届出特例がないため農業委員会の許可が必要。市街化区域は市街化を進める区域なので、緩めるのは転用（4条・5条）だけと考える。","kw":["市街化区域","あらかじめ農業委員会に届出","5条","3条","耕作の目的"]},{"t":"相続・遺贈・贈与の違い","s":"農業者Pが市街化調整区域の農地を残して亡くなった。子Qは遺産分割で取得し、Pの遺言で知人R（相続人ではない）にも別の農地が特定遺贈された。Pは生前、別の農地を子Sに贈与していた。","p":"Qは3条許可不要だが、遅滞なく農業委員会への届出が必要。Rは相続人以外への特定遺贈なので3条許可が必要で、Sへの生前贈与も親子間でも通常の権利移動として3条許可が必要。","kw":["遺産分割","特定遺贈","相続人以外","贈与","農業委員会","届出"]},{"t":"2アール未満の例外の範囲","s":"農業者Tが自己所有の農地を転用する。①1.5アールに農業用倉庫を建てる、②4アールに牛舎を建てる、③市街化調整区域の1アールに自宅を建てる、の3つ。","p":"①は2アール未満の農業用施設への自己転用なので4条許可不要。②は2アール以上、③は農業用施設ではない（自宅）ため、どちらも4条許可が必要。この例外は4条だけで、転用目的で他人から取得する5条には適用されない。","kw":["2アール未満","農業用施設","4条","自己の住宅","転用"]}],"around":[{"h":"農地かどうかは現況","b":"登記簿の地目が山林・雑種地・宅地でも、現に耕作していれば農地。逆に原野を開墾して農地にするのは転用に当たらず4条許可は不要。"},{"h":"下限面積要件の廃止","b":"3条許可の要件だった下限面積（原則50アール等）は2023年4月に廃止された。全部効率利用要件や個人の常時従事要件は残っている。"},{"h":"違反転用への対応強化","b":"令和6年の改正で、知事等は転用許可に、転用完了までの実施状況の報告などの条件を付けられるようになった。原状回復等の命令に従わない違反転用者について、その旨や土地の地番を公表する仕組みも設けられた。"},{"h":"抵当権と競売","b":"農地に抵当権を設定するだけなら3条許可は不要。しかし競売で第三者が農地を取得するときは、取得者が3条又は5条の許可を受ける必要がある。"},{"h":"賃貸借の保護","b":"農地の賃貸借は登記がなくても引渡しで第三者に対抗できるが、使用貸借は対抗できない。賃貸借の解除・解約申入れ・更新拒絶には原則として知事の許可が必要。"}]},"法令|国土利用計画法":{"pts":["事後届出は、土地売買等の契約を締結した権利取得者（買主等）が、契約締結日から起算して2週間以内に市町村長経由で知事に行う。","届出対象面積は、市街化区域2,000㎡以上、その他の都市計画区域5,000㎡以上、都市計画区域外10,000㎡以上。","土地売買等の契約は対価を得て所有権・地上権・賃借権を移転・設定する契約で、予約や交換も含む。贈与・相続・無償の賃借は対象外。","買主側が一団の土地を取得する場合は合計面積で判断する（買いの一団）。個々の契約が小さくても合計が基準以上なら届出必要。","当事者の一方又は双方が国・地方公共団体等の場合、民事調停による場合、農地法3条許可を受ける場合などは事後届出不要。","届出事項には対価の額も含むが、知事の勧告は土地の利用目的についてのみ行い、届出から3週間以内にする。","勧告に従わないと公表されることがあるが契約は有効。無届は6か月以下の拘禁刑又は100万円以下の罰金の対象（契約は有効）。"],"traps":["「売主と買主が共同で事後届出をする」と出たら×。届出義務者は権利取得者（買主等）のみで、売主に義務はない。","「勧告に従わなければ契約は無効」と出たら×。公表されることがあるだけで、無届・勧告不服従でも契約は有効。","「対価の額が著しく不適正なら勧告できる」と出たら×。事後届出の勧告は利用目的についてのみ。"],"rel":["法令|農地法","法令|都市計画法"],"bridge":"事後届出の対象面積は都市計画法の区域区分（市街化区域・その他の区域・区域外）で決まる。農地法3条許可を受ける取引は国土法の事後届出が不要となる。","sys":{"overview":"大規模な土地取引を届出・許可で監視する法律。試験の中心は事後届出で、土地売買等の契約の範囲→届出対象面積（区域区分で決まる）→届出不要の例外→勧告と効果の順に押さえる。事前届出・許可制は概要でよい。","tree":[{"h":"制度の全体","items":["原則：事後届出制","注視区域・監視区域：事前届出制","規制区域：許可制（不許可は買取請求）","監視区域は規則で届出面積を引下げ可"]},{"h":"売買等の契約","items":["所有権・地上権・賃借権の移転・設定","対価があることが要件","売買・交換・予約・代物弁済は該当","贈与・相続・時効・抵当権設定は非該当"]},{"h":"届出面積","items":["市街化区域：2,000㎡以上","その他の都市計画区域：5,000㎡以上","都市計画区域外：1ha以上","買主側の一団の土地は合計で判断"]},{"h":"届出手続","items":["届出者は権利取得者（買主等）のみ","契約締結日から2週間以内","市町村長を経由して知事へ","対価の額・利用目的等を届出"]},{"h":"届出不要","items":["当事者の一方又は双方が国・地方公共団体等","民事調停による契約","農地法3条許可を受ける場合","面積が基準未満・対価なし"]},{"h":"勧告・効果","items":["勧告は利用目的についてのみ","届出から3週間以内（延長可）","不服従は公表されることがある","無届・不服従でも契約は有効","無届は6月以下拘禁刑又は100万円以下罰金"]}],"flow":{"title":"事後届出の流れ","steps":["土地売買等の契約を締結","2週間以内に権利取得者が届出","市町村長を経由して知事へ","知事が利用目的を審査","3週間以内に勧告又は助言","不服従なら公表（契約は有効）"]},"tables":[{"title":"事後届出の対象面積","head":["区域","届出が必要な面積"],"rows":[["市街化区域","2,000㎡以上"],["市街化調整区域","5,000㎡以上"],["非線引都市計画区域","5,000㎡以上"],["準都市計画区域","1ha以上"],["都市計画区域外","1ha以上"]]},{"title":"土地売買等の契約か","head":["取引","該当"],"rows":[["売買・売買の予約","○"],["交換（差金なしでも）","○"],["対価ある地上権・賃借権設定","○"],["贈与・相続・遺産分割","×"],["無償の賃借・使用貸借","×"],["抵当権・質権の設定","×"],["時効取得","×"]]},{"title":"事後届出と事前届出","head":["項目","事後届出","事前届出"],"rows":[["区域","注視・監視・規制区域以外","注視区域・監視区域"],["届出者","権利取得者のみ","当事者双方"],["時期","契約後2週間以内","契約前"],["勧告の対象","利用目的のみ","対価の額・利用目的"],["一団の判定","買主側のみ","売主・買主双方"],["勧告の期限","届出から3週間以内","届出から6週間以内"]]}]},"ex":[{"t":"面積と期限の計算","s":"Hは、市街化区域内の2,500㎡の土地を購入する売買契約を4月1日に締結した。引渡しと登記は5月中旬の予定である。","p":"市街化区域は2,000㎡以上が対象なので、買主Hが契約締結日から起算して2週間以内（4月14日まで）に市町村長経由で知事へ届け出る。基準は登記や引渡しの日ではなく契約締結日で、「3週間」は知事が勧告する期間なので混同しない。","kw":["市街化区域","2,000㎡","2週間以内","契約締結日","権利取得者","市町村長を経由"]},{"t":"買いの一団と売りの分割","s":"市街化調整区域で、Iが隣接する甲地3,500㎡と乙地2,500㎡を別々の所有者から順に購入した。一方、Jは自分が所有する調整区域の10,000㎡を2,000㎡ずつ5人の別々の買主に売却した。","p":"Iは合計6,000㎡で5,000㎡以上となるため、それぞれの契約について届出が必要。Jの売却は買主ごとに2,000㎡で基準未満なので届出不要。事後届出の一団は買主（権利取得者）側だけで判断する。","kw":["一団の土地","市街化調整区域","5,000㎡","別々の売買契約","権利取得者"]},{"t":"対価があるかで分かれる","s":"都市計画区域外で、Kは11,000㎡の土地に権利金を払って地上権の設定を受けた。同じ区域で、Lは12,000㎡の土地を親から贈与され、Mは12,000㎡の土地を相続した。","p":"Kは対価のある地上権設定で1ha以上なので届出が必要。贈与と相続は対価がないため「土地売買等の契約」に当たらず、面積が基準を超えていても届出は不要。","kw":["都市計画区域外","1ha","地上権","権利金","贈与","相続"]}],"around":[{"h":"届出不要の当事者","b":"当事者の一方又は双方が国・地方公共団体等なら事後届出は不要。県から個人が買う場合も不要になる。"},{"h":"農地法との関係","b":"農地法3条許可を受ける取引は事後届出不要。5条許可（転用目的の売買）には除外規定がないので、面積要件を満たせば事後届出が必要。"},{"h":"勧告と効果","b":"知事は届出から3週間以内に利用目的についてだけ勧告できる（対価の額は勧告対象外）。従わなければ公表されることがあるが、契約は有効のまま。"},{"h":"事前届出との違い","b":"注視区域・監視区域では契約前に当事者双方が事前届出をし、対価の額も勧告の対象になる。一団の判定も売主・買主の双方で行う。"},{"h":"無届の罰則","b":"事後届出を怠ると6か月以下の拘禁刑又は100万円以下の罰金の対象になる。それでも契約自体は無効にならない。"}]},"税他|不動産取得税・固定資産税":{"pts":["不動産取得税は都道府県が不動産の取得者に課す。有償・無償や登記の有無を問わず、家屋の改築で価格が増加した場合も課税。","相続・法人の合併・共有物分割（持分を超えない部分）などの形式的な移転は非課税。国・地方公共団体等には課税できない。","不動産取得税の課税標準は固定資産課税台帳の価格。免税点（2026年4月1日以後の取得）は土地16万円、家屋は建築1戸66万円・その他1戸34万円未満。","固定資産税は市町村が1月1日（賦課期日）時点の固定資産課税台帳上の所有者に課す。年の途中で売却しても納税義務者は変わらない。","質権者・100年より長い存続期間の地上権者は、所有者に代わり固定資産税の納税義務者となる。賃借人は納税義務者にならない。","住宅用地の課税標準は、200㎡以下の小規模住宅用地は価格の1/6、それを超える部分は1/3とする特例がある。","いずれも普通徴収（納税通知書）。固定資産税の納期は原則4月・7月・12月・2月中で、特別の事情があれば条例で別に定められる。"],"traps":["「不動産取得税は申告納付である」と出たら×。不動産取得税・固定資産税とも普通徴収。","「相続による取得にも不動産取得税が課される」と出たら×。相続は形式的移転で非課税。贈与・交換は課税。","「4月1日の所有者に固定資産税が課される」と出たら×。賦課期日は1月1日で、その時点の所有者に課す。"],"rel":["税他|印紙税・登録免許税","税他|地価公示・鑑定評価"],"bridge":"不動産取得税・固定資産税・登録免許税はいずれも固定資産課税台帳の価格を課税標準の基礎にする。地価公示価格とは別の評価制度である。","sys":{"overview":"地方税のうち不動産に関わる2税。不動産取得税（都道府県・取得時に1回）と固定資産税（市町村・毎年1月1日の所有者）を、課税主体→納税義務者→非課税→課税標準と特例→税率・免税点→徴収の順で比較して押さえる。","tree":[{"h":"不取：課税","items":["都道府県が不動産の取得者に課す","有償・無償、登記の有無を問わない","改築で価格増加した場合も課税","新築家屋は最初の使用・譲渡時に取得とみなす","未使用で6か月経過でも取得とみなす（業者1年）"]},{"h":"不取：非課税","items":["相続・法人の合併等の形式的移転","共有物分割（持分を超えない部分）","国・地方公共団体等の取得","贈与・交換・売買は課税"]},{"h":"不取：計算","items":["課税標準：固定資産課税台帳の価格","宅地等の課税標準1/2（2027年3月まで）","新築住宅は1,200万円控除（40〜240㎡。2026年4月以後の取得）","税率：本則4%、土地・住宅3%（同上）","免税点：土地16万・家屋建築66万・他34万円"]},{"h":"固：課税","items":["市町村が課す（東京23区は都）","1月1日時点の台帳上の所有者に課税","年途中で売却しても納税義務者は不変","質権者・100年超の地上権者が納税義務者","賃借人は納税義務者にならない"]},{"h":"固：計算","items":["課税標準：台帳価格（3年ごと評価替え）","住宅用地200㎡以下は1/6、超部分1/3","標準税率1.4%","免税点：土地30万・家屋20万円","新築住宅は3年度（中高層耐火5年度）1/2"]},{"h":"徴収・不服","items":["両税とも普通徴収（納税通知書）","固定資産税の納期：4・7・12・2月","特別の事情があれば条例で別の納期","価格の不服は固定資産評価審査委員会"]}],"flow":null,"tables":[{"title":"2税の比較","head":["項目","不動産取得税","固定資産税"],"rows":[["課税主体","都道府県","市町村"],["課税時期","取得時に1回","毎年（賦課期日1月1日）"],["納税義務者","取得者","1月1日の台帳所有者"],["課税標準","台帳価格","台帳価格"],["税率","4%（土地・住宅3%）","標準1.4%"],["免税点（土地）","16万円未満","30万円未満"],["免税点（家屋）","建築66万・他34万円未満","20万円未満"],["徴収方法","普通徴収","普通徴収"]]},{"title":"主な特例","head":["特例","内容"],"rows":[["不取：宅地等","課税標準×1/2"],["不取：新築住宅","1,200万円控除（40〜240㎡。2026年4月以後の取得）"],["不取：住宅用土地","税額から一定額を減額"],["固：小規模住宅用地","200㎡以下は価格×1/6"],["固：一般住宅用地","200㎡超部分は価格×1/3"],["固：新築住宅","120㎡まで税額1/2（3年度・中高層5年度）"]]},{"title":"不動産取得税の課否","head":["取得の原因","課税"],"rows":[["売買・交換","○"],["贈与","○"],["家屋の新築・増改築","○"],["相続・法人の合併","×"],["共有物分割（持分内）","×"],["国・地方公共団体の取得","×"]]}]},"ex":[{"t":"新築一戸建ての取得税","s":"Aは2026年5月、宅地200㎡（固定資産課税台帳の価格3,000万円）を買い、同年中に床面積110㎡の住宅（価格1,800万円）を新築して住んだ。住宅は（1,800万円−1,200万円）×3%＝18万円。土地は課税標準を1/2にして1,500万円×3%＝45万円だが、住宅用土地の減額は「1㎡当たり価格15万円×1/2×200㎡（床面積の2倍、200㎡が上限）×3%＝45万円」と45,000円の多い方なので、土地の税額は0円になる。","p":"課税標準は実際の売買価格ではなく台帳価格。新築住宅は1戸1,200万円控除、宅地評価土地は課税標準1/2、土地・住宅の税率は3%（いずれも特例）。","kw":["不動産取得税","課税標準","1,200万円","新築住宅","固定資産課税台帳"]},{"t":"住宅用地特例の計算","s":"Bは1戸建て住宅の敷地300㎡（台帳価格4,500万円、1㎡当たり15万円）を所有している。200㎡までの小規模住宅用地は3,000万円×1/6＝500万円、残る100㎡は1,500万円×1/3＝500万円で、課税標準は合計1,000万円。標準税率1.4%なら固定資産税は14万円（特例がなければ63万円）となる（負担調整措置は考えない）。","p":"200㎡以下の部分が1/6、超える部分が1/3。「小規模住宅用地は1/3」と逆にした問題は×。","kw":["小規模住宅用地","200㎡","課税標準","固定資産税","標準税率"]},{"t":"年の途中で売った家","s":"Cは2026年1月1日時点で土地建物の登記名義人だったが、3月にDへ売却して引き渡した。2026年度の固定資産税の納税通知書はCに届き、CD間で引渡日以降の分を日割りで精算する特約を結んだ。一方、Dには取得者として都道府県から不動産取得税が課される。","p":"固定資産税は1月1日（賦課期日）の台帳上の所有者に1年度分を課すため、Cが納税義務者。日割精算は当事者の契約上の取決めにすぎない。","kw":["賦課期日","1月1日","納税義務者","固定資産課税台帳","所有者"]}],"around":[{"h":"床面積要件が40㎡に","b":"2026年4月1日以後の取得・新築では、不動産取得税の住宅控除と固定資産税の新築住宅減額の床面積下限が40㎡に下がった（上限240㎡）。新築住宅の控除は貸家でも受けられるが、中古住宅は自己居住が要件。"},{"h":"免税点の比較","b":"不動産取得税は土地16万円・家屋（建築）66万円・家屋（その他）34万円未満（2026年4月1日以後の取得）。固定資産税は土地30万円・家屋20万円未満で、同一市町村内の合計額で判定する。"},{"h":"都市計画税の特例","b":"都市計画税にも住宅用地の特例があり、200㎡以下の部分は1/3、超える部分は2/3。固定資産税の1/6・1/3と混同しやすい。"},{"h":"価格に不服があるとき","b":"台帳の価格への不服は固定資産評価審査委員会に審査の申出をする。期間は台帳登録の公示の日から納税通知書の交付を受けた日後3か月以内。"},{"h":"所有者が亡くなったら","b":"賦課期日前に台帳上の所有者が死亡していれば、1月1日に現に所有している者（相続人等）に固定資産税が課される。課税できなくなるわけではない。"}]},"税他|印紙税・登録免許税":{"pts":["不動産の譲渡契約書、地上権・土地賃借権の設定・譲渡契約書、請負契約書、金銭消費貸借契約書は課税文書。建物賃貸借契約書は非課税。","契約の成立を証する文書なら仮契約書・覚書も課税文書。同一内容で複数作成すれば、仲介人保存分も含め各通が課税される。","土地賃借権設定の記載金額は権利金等の返還されない金額で、賃料・敷金は含まない。贈与契約書は記載金額のない文書となる。","国等と私人が共同作成した文書は、私人が保存するものは国等が作成したものとみなされ非課税、国等が保存するものは課税。","印紙の貼付漏れは過怠税（原則納付すべき額の3倍、自主的申出で1.1倍）。消印のない場合も過怠税が課される。","登録免許税は登記を受ける者が連帯して納付する。不動産の課税標準は登記時の価額で、固定資産課税台帳の価格を基礎とする。","住宅用家屋の軽減税率特例は、個人が自己居住用に取得し床面積50㎡以上、取得後1年以内の登記等が要件。敷地の土地には適用されない。"],"traps":["「建物の賃貸借契約書は印紙税の課税文書」と出たら×。課税文書となるのは土地の賃借権設定契約書で、建物賃貸借は非課税。","「住宅用家屋の所有権移転登記の軽減は贈与・相続でも適用」と出たら×。売買又は競落による取得に限られる。","「減額の変更契約書は減額後の金額が記載金額」と出たら×。減額の変更契約書は記載金額のない文書となる。"],"rel":["税他|不動産取得税・固定資産税","権利|不動産登記法"],"bridge":"登録免許税は登記という手続にかかる国税で、不動産取得税は取得にかかる地方税。課税標準は同じく固定資産課税台帳の価格を基礎とする。","sys":{"overview":"いずれも不動産取引に伴う国税。印紙税は契約書等の文書に、登録免許税は登記に課される。課税文書の範囲と記載金額の決め方、登録免許税の課税標準と住宅用家屋の軽減要件が得点源。","tree":[{"h":"印紙税の対象","items":["不動産譲渡契約書・地上権/土地賃借権の設定譲渡","請負契約書・金銭消費貸借契約書","売上代金の受取書（5万円未満は非課税）","建物賃貸借・抵当権設定の契約書は課税対象外","仮契約書・覚書・変更契約書も課税対象"]},{"h":"記載金額","items":["土地賃借権設定は返還されない権利金等","賃料・敷金・保証金は含めない","贈与・減額変更は記載金額のない文書(200円)","増額変更は増加額が記載金額","交換は高い方の価額（差金のみ記載なら差金）"]},{"h":"納税義務者等","items":["課税文書の作成者（共同作成は連帯納付）","国等と私人の共同作成は私人保存分が非課税","同一内容の複数通は各通が課税（仲介人分も）","消費税額の区分記載があれば税抜額で判定"]},{"h":"納付・過怠税","items":["印紙を貼付し消印して納付","貼付漏れは納付額の3倍（本来分含む）","自主的申出なら1.1倍","消印漏れは消印のない印紙の額面相当"]},{"h":"登録免許税","items":["登記を受ける者が連帯して納付する国税","課税標準は固定資産課税台帳の価格が基礎","抵当権設定の課税標準は債権金額","本則：売買移転2%・相続0.4%・保存0.4%","土地の売買移転は1.5%（2029年3月まで）"]},{"h":"住宅用家屋軽減","items":["個人が自己居住用に新築・取得","床面積50㎡以上","新築・取得後1年以内に登記","移転は売買・競落のみ（贈与・交換不可）","敷地の土地には適用なし","適用期限は2027年3月31日まで"]}],"flow":{"title":"印紙税の判定手順","steps":["契約の成立・変更を証する文書か確認","課税文書の号別（譲渡・請負等）を判定","非課税文書・国等の作成文書か確認","記載金額を決める（権利金・増加額等）","税額表で税額を確認（金額なしは200円）","印紙を貼付し消印する"]},"tables":[{"title":"文書ごとの課税関係","head":["文書","課税","記載金額"],"rows":[["土地売買契約書","○","売買金額"],["土地賃借権設定契約書","○","権利金等（賃料除く）"],["建物賃貸借契約書","×","―"],["贈与契約書","○","記載金額なし(200円)"],["増額の変更契約書","○","増加額"],["減額の変更契約書","○","記載金額なし"],["交換契約書","○","高い方の価額"],["抵当権設定契約書","×","―"]]},{"title":"登録免許税の税率","head":["登記","本則","住宅用家屋の軽減"],"rows":[["所有権保存","0.4%","0.15%"],["売買による移転","2%","0.3%"],["土地の売買による移転","2%","適用なし（土地特例1.5%）"],["相続による移転","0.4%","適用なし"],["贈与・交換による移転","2%","適用なし"],["抵当権設定","0.4%","0.1%"]]},{"title":"住宅用家屋軽減の要件","head":["要件","内容"],"rows":[["取得者","個人のみ"],["用途","自己の居住用"],["床面積","50㎡以上"],["登記時期","新築・取得後1年以内"],["取得原因(移転)","売買・競落のみ"],["中古住宅","新耐震基準適合が必要"],["対象","家屋のみ（土地×）"]]}]},"ex":[{"t":"売買契約書を3通作成","s":"売主E・買主F・媒介業者Gが、売買代金4,800万円の土地売買契約書を同じ内容で3通作り、各自1通ずつ保存した。記載金額は1,000万円超5,000万円以下なので、2027年3月31日までに作成された不動産譲渡契約書の軽減税率で1通1万円（本則2万円）。3通すべてに印紙が必要で合計3万円になる。","p":"印紙税は文書ごとに課税されるため、媒介業者の保存分も課税文書になる。軽減税率は不動産譲渡契約書（と建設工事の請負契約書）に限られる。","kw":["課税文書","売買契約書","同一内容","媒介","記載金額"]},{"t":"借地契約の記載金額","s":"建物所有目的の土地賃貸借契約書に、返還されない権利金500万円、退去時に返す保証金300万円、月額賃料15万円が書かれている。記載金額は権利金の500万円だけで、100万円超500万円以下の本則税率2,000円となる。同じ当事者が建物の賃貸借契約書を作っても印紙税はかからない。","p":"土地賃借権の設定契約書の記載金額は、後日返還されない権利金等に限り、賃料・敷金・保証金は含まない。不動産譲渡契約書の軽減税率は適用されない。","kw":["権利金","賃料","記載金額","土地の賃貸借","課税標準"]},{"t":"中古マンションの登記","s":"個人Hが自分で住むため、築8年・床面積70㎡の中古マンションを売買で取得し、1年以内に移転登記をした。台帳価格は建物1,200万円、敷地2,000万円。建物は住宅用家屋の軽減で1,200万円×0.3%＝3.6万円、敷地は土地の売買の特例で2,000万円×1.5%＝30万円。同じ物件を親から贈与で取得すると、建物も土地も2%（24万円・40万円）になる。","p":"課税標準は売買代金ではなく固定資産課税台帳の価格が基礎。住宅用家屋の軽減は家屋だけで、取得原因が売買・競落に限られる。","kw":["登録免許税","課税標準","住宅用家屋","所有権の移転登記","敷地","軽減措置"]}],"around":[{"h":"変更契約書の扱い","b":"5,000万円の契約を1,000万円増額する変更契約書は増加額1,000万円が記載金額。減額する変更契約書は記載金額のない文書となり200円。"},{"h":"交換契約書","b":"3,000万円の土地と3,500万円の土地の交換で双方の価額が書かれていれば、高い方の3,500万円が記載金額。差金だけが書かれていれば差金が記載金額。"},{"h":"過怠税の倍率","b":"印紙を貼らなかったときは納付すべき額とその2倍（合計3倍）、税務調査前に自主的に申し出れば1.1倍。消印漏れは消印していない印紙の額面相当。"},{"h":"軽減税率の期限","b":"印紙税の不動産譲渡契約書の軽減と登録免許税の住宅用家屋の軽減（保存0.15%・移転0.3%・抵当権0.1%）は2027年3月31日まで。土地の売買1.5%は2029年3月31日まで。"},{"h":"土地の1.5%特例","b":"土地の売買による移転登記の1.5%は地目や取得者を問わず、法人や雑種地にも適用される。住宅用家屋の軽減（個人・自己居住・床面積50㎡以上）とは要件が違う。"}]},"税他|所得税・譲渡":{"pts":["譲渡所得は譲渡した年の1月1日時点で所有期間5年超なら長期、5年以下なら短期。相続・贈与では被相続人等の取得費・取得時期を引き継ぐ。","取得費には購入代金のほか設備費・改良費を含む。営利目的で継続的に行う譲渡は事業所得又は雑所得となる。","居住用財産の3,000万円特別控除は所有期間を問わない。配偶者・直系血族・生計を一にする親族等への譲渡には適用されない。","居住しなくなった日から3年を経過する日の属する年の12月31日までの譲渡なら適用可。前年・前々年に同特例等を受けていると不可。","所有期間10年超の居住用財産は、3,000万円控除後の金額に軽減税率の特例を併用できる。収用等の5,000万円控除後も同様。","居住用財産の譲渡損失の損益通算・繰越控除の特例は、住宅ローン控除と併用することができる。","居住年等に3,000万円控除や軽減税率の特例などを受けると、住宅ローン控除は適用されない。"],"traps":["「同居していない配偶者への譲渡なら3,000万円控除を受けられる」と出たら×。配偶者・直系血族への譲渡は同居の有無を問わず不可。","「所有期間は譲渡日現在で判定する」と出たら×。長期・短期は譲渡した年の1月1日現在の所有期間で判定する。","「3,000万円特別控除は所有期間10年超が要件」と出たら×。所有期間要件はなく、10年超が要件なのは軽減税率の特例。"],"rel":["権利|相続","税他|不動産取得税・固定資産税"],"bridge":"相続で取得した不動産は被相続人の取得費・取得時期を引き継ぎ、長期・短期の判定もそれによる。不動産取得税は取得時に、所得税は譲渡益に課される。","sys":{"overview":"所得税のうち不動産の譲渡益に課される分離課税の譲渡所得が出題の中心。長期・短期の判定、取得費、居住用財産の特例（3,000万円控除・軽減税率・買換え・譲渡損失）の要件と併用関係を押さえれば得点できる。","tree":[{"h":"所得区分","items":["土地建物の譲渡は分離課税の譲渡所得","営利目的の継続的譲渡は事業所得・雑所得","借地権設定の権利金が土地価額の1/2超→譲渡所得","別荘等の災害損失はその年・翌年の譲渡所得から控除"]},{"h":"長期と短期","items":["譲渡年の1月1日で所有期間5年超→長期","5年以下→短期","相続・贈与は取得時期・取得費を引き継ぐ","長期：所得税15%＋住民税5%","短期：所得税30%＋住民税9%"]},{"h":"計算","items":["譲渡収入−(取得費＋譲渡費用)−特別控除","取得費に設備費・改良費を含む","取得費は収入金額の5%（概算）でも可","譲渡損失は原則他の所得と通算不可"]},{"h":"居住用の特例","items":["3,000万円特別控除（所有期間不問）","10年超所有の軽減税率（6,000万円以下部分）","買換え特例（2027年12月までの譲渡）","譲渡損失の損益通算・繰越控除（3年）","収用等は5,000万円特別控除"]},{"h":"適用除外","items":["配偶者・直系血族への譲渡は不可","生計を一にする親族・同族会社等も不可","前年・前々年に同特例を受けていると不可","居住しなくなって3年目の年末まで適用可"]},{"h":"併用関係","items":["3,000万円控除＋軽減税率は併用○","3,000万円控除と買換え特例は選択","譲渡損失の特例＋住宅ローン控除は併用○","3,000万円等を受けると住宅ローン控除×"]}],"flow":{"title":"譲渡所得の計算手順","steps":["所得区分を判定（譲渡か事業・雑か）","1月1日時点の所有期間で長期・短期を判定","譲渡収入金額を確定する","取得費（不明なら5%）と譲渡費用を控除","特別控除（3,000万円等）を差し引く","税率を適用（軽減税率の可否を確認）"]},"tables":[{"title":"居住用財産の特例比較","head":["特例","所有期間","主な要件"],"rows":[["3,000万円控除","不問","親族等への譲渡は不可"],["軽減税率","10年超","3,000万円控除と併用可"],["買換え特例","10年超","居住10年以上・1億円以下"],["譲渡損失の特例","5年超","住宅ローン控除と併用可"],["収用5,000万円控除","不問","軽減税率と併用可"]]},{"title":"税率の整理","head":["区分","所得税","住民税"],"rows":[["短期（5年以下）","30%","9%"],["長期（5年超）","15%","5%"],["軽減（6,000万以下）","10%","4%"],["軽減（6,000万超）","15%","5%"]]},{"title":"住宅ローン控除との関係","head":["譲渡側の特例","ローン控除"],"rows":[["3,000万円特別控除","×"],["軽減税率の特例","×"],["買換え特例","×"],["譲渡損失の損益通算・繰越","○"]]}]},"ex":[{"t":"5年ちょうどの落とし穴","s":"Iは2021年4月に買った土地を、2026年6月に売却して1,000万円の譲渡益が出た。譲渡日では5年2か月所有しているが、譲渡した年の1月1日（2026年1月1日）では4年9か月なので短期譲渡所得となり、税額は所得税30%・住民税9%で390万円（復興特別所得税は除く）。2027年1月1日以後に売れば長期となり20%の200万円で済む。","p":"長期・短期は譲渡日ではなく譲渡した年の1月1日の所有期間で判定する。5年超が長期。","kw":["長期譲渡所得","短期譲渡所得","所有期間","1月1日","5年"]},{"t":"マイホーム売却の計算","s":"Jは20年前に買って15年住んだ自宅（家屋・敷地とも所有期間10年超）を8,000万円で売った。購入額が分からないので取得費は収入の5%の400万円、仲介手数料などの譲渡費用は300万円。譲渡益7,300万円から3,000万円特別控除を引いた4,300万円に軽減税率（所得税10%・住民税4%）を適用し、税額は602万円（復興特別所得税は除く）。軽減税率がなければ20%で860万円。","p":"3,000万円特別控除は所有期間を問わず、10年超所有の軽減税率と併用できる。取得費が不明なら収入金額の5%を取得費にできる。","kw":["3,000万円特別控除","軽減税率","取得費","居住用財産","10年"]},{"t":"相続した土地を売る","s":"Kの父は1995年に土地を2,000万円で買い、2025年に死亡してKが相続した（相続時の時価5,000万円）。Kは2026年にこの土地を6,000万円で売った。取得費は父の2,000万円、取得時期も1995年を引き継ぐので、K自身は1年余りしか持っていなくても長期譲渡所得となる。","p":"相続・贈与で取得した資産は被相続人等の取得費・取得時期を引き継ぐ。「相続時の価額が取得費」は×。","kw":["相続","取得費","被相続人","長期譲渡所得","引き継ぐ"]}],"around":[{"h":"特例が使えない相手","b":"配偶者・直系血族（子・孫・父母）への譲渡は同居の有無を問わず3,000万円控除不可。生計を一にする親族や同族会社への譲渡も不可。"},{"h":"住まなくなった後","b":"居住しなくなった日から3年を経過する日の属する年の12月31日までに売れば3,000万円控除を受けられる。前年・前々年に同じ特例等を受けていると不可。"},{"h":"住宅ローン控除との関係","b":"3,000万円控除・軽減税率・買換え特例を受けると、居住年等に住宅ローン控除は使えない。譲渡損失の損益通算・繰越控除の特例なら併用できる。"},{"h":"相続空き家の特例","b":"相続した1981年5月31日以前建築の空き家を一定の要件で売ると最高3,000万円控除（2027年12月31日までの譲渡、相続人3人以上なら各2,000万円）。マイホームの3,000万円控除とは別の制度。"},{"h":"買換え特例の要件","b":"所有期間10年超・居住期間10年以上・売却代金1億円以下で、2027年12月31日までの譲渡が対象。3,000万円控除とはどちらか選択になる。"}]},"税他|地価公示・鑑定評価":{"pts":["土地鑑定委員会が都市計画区域その他の公示区域内の標準地について、毎年1月1日の正常な価格を判定し官報で公示する。","標準地は自然的・社会的条件からみて類似する地域で、土地の利用状況・環境等が通常と認められる一団の土地から選定する。","正常な価格の判定は2人以上の不動産鑑定士の鑑定評価を求めて行う。建物や地上権等があっても存しないものとして（更地として）求める。","公示事項は所在地、単位面積当たりの価格、価格判定の基準日、地積・形状、周辺の状況等。総額は公示しない。","不動産鑑定士は公示区域内の土地の鑑定評価で公示価格を規準としなければならない。一般の土地取引は指標とするよう努める。","鑑定評価は原価法・取引事例比較法・収益還元法を併用する。原価法は造成地・埋立地等の土地にも適用できる。","価格は正常価格・限定価格・特定価格・特殊価格に分かれる。特殊価格は文化財等の市場性を有しない不動産の価格。"],"traps":["「標準地の公示価格は総額で公示される」と出たら×。公示されるのは単位面積当たりの価格。","「地上権が設定された土地は標準地に選定できない」と出たら×。選定でき、価格は地上権が存しないものとして求める。","「原価法は土地には適用できない」と出たら×。再調達原価を適切に求められる造成地・埋立地には適用できる。"],"rel":["税他|不動産取得税・固定資産税","法令|国土利用計画法"],"bridge":"地価公示は土地取引の指標となる正常価格で、固定資産税等の評価額とは別の制度。国土法の事後届出の対価は届出事項だが、勧告対象は利用目的のみ。","sys":{"overview":"地価公示法と不動産鑑定評価基準から1問。土地鑑定委員会が毎年1月1日の正常な価格を公示する流れと公示事項、鑑定評価の3手法と価格の種類・価格原則を押さえれば得点できる。","tree":[{"h":"地価公示の主体","items":["土地鑑定委員会（国土交通省に置かれる）","公示区域：都市計画区域その他の区域","国土法の規制区域は除く","基準日は毎年1月1日"]},{"h":"標準地の選定","items":["自然的・社会的条件が類似する地域","利用状況・環境等が通常と認められる土地","地上権等があっても選定可能"]},{"h":"正常な価格","items":["2人以上の不動産鑑定士の鑑定評価","自由な取引で通常成立する価格","建物・地上権等は存しないものとして算定","公示は単位面積当たりの価格（総額×）"]},{"h":"公示の効力","items":["一般の土地取引：指標とするよう努める","不動産鑑定士：公示価格を規準とする義務","公共事業用地の取得価格も規準とする"]},{"h":"鑑定評価手法","items":["原価法→積算価格（造成地等の土地も可）","取引事例比較法→比準価格","収益還元法→収益価格（自用不動産も可）","複数手法を併用するのが原則"]},{"h":"価格の種類","items":["正常価格：通常の市場価格","限定価格：隣地併合など市場が限定","特定価格：証券化・早期売却など","特殊価格：文化財等、市場性なし"]},{"h":"価格の諸原則","items":["最有効使用：最も効果的な使い方を前提","変動・予測：価格は常に変動し将来を予測","代替・競争：代わりの物件と比べて決まる","適合・均衡：環境との適合、内部の均衡"]}],"flow":{"title":"地価公示の流れ","steps":["土地鑑定委員会が標準地を選定","2人以上の不動産鑑定士が鑑定評価","委員会が審査・調整し1月1日の価格を判定","所在地・単位面積当たり価格等を官報で公示","関係市町村長に書面・図面を送付","市町村の事務所で一般の閲覧に供する"]},"tables":[{"title":"鑑定評価の3手法","head":["手法","求める価格","ポイント"],"rows":[["原価法","積算価格","再調達原価−減価修正"],["取引事例比較法","比準価格","事情補正・時点修正を行う"],["収益還元法","収益価格","純収益の現在価値の総和"]]},{"title":"価格の種類","head":["種類","内容","例"],"rows":[["正常価格","合理的な市場での価格","通常の売買"],["限定価格","市場が相対的に限定","隣地の併合・借地人の底地買取"],["特定価格","正常価格の前提を欠く","証券化・民事再生の早期売却"],["特殊価格","市場性を有しない","文化財の建造物"]]},{"title":"公示事項かどうか","head":["事項","公示"],"rows":[["標準地の所在地","○"],["単位面積当たりの価格","○"],["価格判定の基準日","○"],["地積・形状","○"],["周辺の土地の利用現況","○"],["価格の総額","×"]]}]},"ex":[{"t":"建物付きの標準地","s":"土地鑑定委員会が、木造アパートが建ち地上権も設定されている住宅地を標準地に選んだ。2人以上の不動産鑑定士の鑑定評価を基に、建物も地上権もないもの（更地）として1月1日時点の価格を判定し、「1㎡当たり52万円」と官報で公示した。地積や形状は公示されるが、地積×単価の総額は公示されない。","p":"使用収益を制限する権利があっても標準地に選べ、正常な価格は権利・建物が存しないものとして求める。公示は単位面積当たりの価格。","kw":["標準地","地上権","正常な価格","単位面積当たり","官報","総額"]},{"t":"鑑定士と一般の売主","s":"個人Lは自宅の土地を売る際、近くの標準地の公示価格を参考にした。一方、公示区域内の土地を鑑定評価する不動産鑑定士Mは、対象地と標準地の位置・地積・環境などを比較し、公示価格と均衡を保たせる必要がある。","p":"一般の土地取引は公示価格を指標として取引するよう努める（努力義務）だけで、鑑定士は公示価格を規準としなければならない。「実際の取引価格を規準」は×。","kw":["公示価格","指標","規準","不動産鑑定士","公示区域"]},{"t":"自社ビルと売り急ぎ","s":"N社が自社で使う店舗ビルを鑑定評価に出した。賃貸していなくても、賃貸を想定した純収益から収益還元法を適用できる。取引事例の中に資金繰りで売り急いだ事例があったが、事情補正をすれば事例として使える。","p":"収益還元法は自用の不動産にも適用できる。売り急ぎ等の特殊事情の補正は「事情補正」、価格時点への修正は「時点修正」で、名前を取り違えた問題は×。","kw":["収益還元法","自用","取引事例比較法","事情補正","時点修正"]}],"around":[{"h":"都道府県地価調査","b":"地価公示は土地鑑定委員会が1月1日時点の価格を3月頃に公表し、鑑定士は2人以上。地価調査は都道府県知事が7月1日時点の価格を調べ、鑑定士は1人以上。両方を合わせて半年ごとの動きを補い合う。"},{"h":"公示区域の範囲","b":"都市計画区域に限らず、土地取引が相当程度見込まれる区域として国土交通省令で定める区域も含む。国土利用計画法の規制区域は除かれる。"},{"h":"価格の種類の例","b":"隣地の併合や借地人による底地の買取りは限定価格、証券化や民事再生法の早期売却は特定価格、文化財の建造物は特殊価格。"},{"h":"価格形成要因","b":"一般的要因（経済社会全体）・地域要因（地域の特性）・個別的要因（その不動産固有）の3つ。一般的要因を自然的・社会的・経済的・行政的要因に分ける。"},{"h":"原価法の補足","b":"再調達原価が求めにくいときは同等の有用性をもつものに置き換えた置換原価を使える。減価修正は耐用年数に基づく方法と観察減価法を併用する。"}]},"税他|住宅金融支援機構":{"pts":["証券化支援業務（買取型）は、民間金融機関の住宅ローン債権を買い取り、これを担保にMBSを発行して資金調達する。","買取対象は本人又は親族が居住する住宅の建設・購入資金の貸付債権で、中古住宅や付随する土地・借地権、購入に付随する改良資金も含む。賃貸住宅は対象外。","住宅融資保険業務では、民間金融機関の住宅ローンについて保険を引き受け、民間による住宅資金の供給を支援する。","直接融資は原則民間が困難な分野に限られ、災害復興建築物、マンション共用部分の改良（管理組合等への融資）などが対象。","団体信用生命保険業務で、債務者の死亡のほか重度障害の場合も保険金を債務の弁済に充当する。","災害復興建築物の貸付金では元金据置期間を設けられる。高齢者向け返済特例として死亡時一括償還制度がある。"],"traps":["「賃貸住宅の建設資金の貸付債権も買取対象」と出たら×。買取対象は本人又は親族が居住する住宅に係る債権。","「中古住宅の購入資金は買取対象外」と出たら×。新築に限られず中古住宅購入資金も対象。","「機構は一般の個人向け住宅ローンを広く直接融資する」と出たら×。直接融資は災害関連など政策上必要な分野に限られる。"],"rel":["税他|景品表示法","税他|土地・建物"],"bridge":"機構は住宅ローンの資金供給を担う制度で、免除科目の中で景品表示法・土地建物と並ぶ5問免除の一角。数字より業務の対象・範囲の理解が問われる。","sys":{"overview":"5問免除科目の1問。機構は民間の住宅ローン供給を支える独立行政法人で、証券化支援（買取型・保証型）が中心業務。買取対象債権の範囲と、直接融資が政策上必要な分野に限られる点を押さえれば得点できる。","tree":[{"h":"機構の性格","items":["独立行政法人（旧住宅金融公庫の業務を承継）","民間金融機関の住宅資金供給を支援","一般の住宅ローン直接融資は原則行わない"]},{"h":"証券化支援","items":["買取型：債権を買い取りMBSを発行","保証型：民間ローンの債務を保証","対象：本人・親族が住む住宅の資金","中古住宅・付随する土地/借地権も対象","購入に付随する改良資金も対象"]},{"h":"保険・保証","items":["住宅融資保険：民間ローンに保険を引受","団体信用生命保険：死亡・重度障害で弁済"]},{"h":"直接融資","items":["災害復興建築物・災害予防の資金","マンション共用部分の改良（管理組合等）","子育て・高齢者向け賃貸住宅の建設等","高齢者のバリアフリー等の改良資金"]},{"h":"返済上の配慮","items":["災害復興の貸付は元金据置期間を設定可","高齢者向けの死亡時一括償還制度","経済事情の変動による返済条件の変更"]}],"flow":{"title":"証券化支援(買取型)","steps":["民間金融機関が個人に長期固定ローンを融資","機構が当該住宅ローン債権を買い取る","機構が債権を信託し担保とする","MBSを発行し投資家から資金を調達","調達資金で次の債権買取りに充てる"]},"tables":[{"title":"買取型の対象債権","head":["資金の内容","対象"],"rows":[["自ら居住する新築住宅","○"],["親族が居住する住宅","○"],["中古住宅の購入","○"],["付随する土地・借地権取得","○"],["購入に付随する改良資金","○"],["賃貸住宅の建設・購入","×"],["投資用・事業用物件","×"]]},{"title":"業務の区分","head":["業務","区分","主な内容"],"rows":[["証券化支援（買取型）","間接","債権買取・MBS発行"],["証券化支援（保証型）","間接","民間ローンの保証"],["住宅融資保険","間接","民間ローンに保険"],["団体信用生命保険","付随","死亡・重度障害で弁済"],["災害復興融資","直接","据置期間の設定可"],["マンション共用部分改良","直接","管理組合等に融資"]]}]},"ex":[{"t":"買い取られるローン","s":"会社員Oは民間銀行のフラット35で、中古マンションの購入資金と、購入に合わせた内装リフォーム資金を借りた。Pは郊外に住む両親のための住宅をフラット35で建て、敷地の購入資金も一緒に借りた。Qは投資用のワンルームを買うためにフラット35を申し込んだ。","p":"買取型の対象は本人又は親族が住む住宅の建設・購入資金で、中古住宅、付随する土地・借地権、購入に付随する改良資金も含む。投資用・賃貸用は対象外なのでQは使えない。","kw":["証券化支援事業","買取型","中古住宅","改良","土地","賃貸住宅"]},{"t":"災害と管理組合","s":"台風で自宅が全壊したRは、建て直しの資金を機構から直接借り、当面は元金の返済を据え置く期間を設けた。また、築30年のマンションの管理組合は、外壁や屋上の大規模修繕（共用部分の改良）の資金を機構から借りた。","p":"機構の直接融資は災害復興、マンション共用部分の改良など、民間では対応しにくい政策分野に限られる。災害復興の貸付けでは元金据置期間を設けられる。","kw":["災害","元金据置期間","マンション","共用部分","管理組合","直接融資"]},{"t":"高齢者の自宅改修","s":"72歳のSは自宅に手すりと段差解消の工事をするため、機構から資金を借りた。毎月の返済は利息だけで、元金は自分が死亡した後に相続人が一括返済するか、住宅を売って返済する。","p":"高齢者が自ら住む住宅のバリアフリー工事や耐震改修工事の貸付けには、死亡時に元金を一括償還する方法（高齢者向け返済特例）がある。","kw":["高齢者","バリアフリー","耐震改修","死亡時","一括"]}],"around":[{"h":"金利は銀行ごと","b":"フラット35は全期間固定金利だが、金利は取扱金融機関ごとに異なり、資金受取時の金利が適用される。「機構が全国一律に定める」は×。"},{"h":"MBSで資金調達","b":"買取型では買い取った住宅ローン債権を信託し、それを担保にMBS（資産担保証券）を発行して債券市場から資金を調達する。保証型は民間ローンを担保にした証券の支払を機構が保証する。"},{"h":"団体信用生命保険","b":"機構の団信は債務者の死亡だけでなく重度障害の場合も、保険金を債務の弁済に充てる。"},{"h":"回収は委託できる","b":"買い取った債権の元利金の回収などの業務は、一定の金融機関等に委託できる。機構がすべて自ら回収するわけではない。"},{"h":"その他の支援","b":"住宅融資保険で民間ローンの債務不履行による損害を填補し、フラット35Sでは省エネ・耐震等に優れた住宅の金利を一定期間引き下げる。経済事情の変動で返済が困難な人には償還期間の延長等の条件変更ができる。"}]},"税他|景品表示法":{"pts":["徒歩所要時間は道路距離80mにつき1分で計算し、1分未満の端数は1分に切り上げる。起点は物件の区画のうち駅に最も近い地点等。","新築は建築工事完了後1年未満で、かつ居住の用に供されたことがないもの。この要件を満たさない物件に「新築」と表示することはできない。","取引する意思のない物件や契約済み物件を表示するおとり広告は不当表示。事後に説明しても違反となる。","取引態様は売主・貸主・代理・媒介（仲介）の用語で明示する。「直販」等の表示では明示とならない。","分譲住宅等で全区画の価格表示が困難なときは、最低価格・最高価格と最多価格帯・その価格帯の数を表示できる。平均額は不可。","建築条件付土地は、対象が土地である旨、条件の内容、条件不成就時の措置（受領金全額返還等）を明示する。","古家・廃屋等がある土地はその旨を明示。新設予定の駅は運行主体が公表したものに限り、新設予定時期を明示して表示できる。"],"traps":["「徒歩所要時間の1分未満の端数は切り捨てる」と出たら×。1分未満の端数は切り上げる。","「すぐ訂正すればおとり広告にならない」と出たら×。契約済み物件の掲載はそれ自体が不当表示。","「価格は平均価格で表示すればよい」と出たら×。最低・最高価格（及び最多価格帯）で表示し、平均額は認められない。"],"rel":["業法|広告","税他|住宅金融支援機構"],"bridge":"宅建業法の広告規制（誇大広告の禁止・取引態様の明示・広告開始時期）と景品表示法・公正競争規約は内容が重なるが、根拠法と監督の仕組みが異なる。","sys":{"overview":"5問免除科目の1問。景品表示法の不当表示・景品規制と、それを具体化した不動産の表示に関する公正競争規約が出題範囲。徒歩分数・新築・おとり広告・価格表示・特定事項の明示など数字と用語のルールを押さえれば得点できる。","tree":[{"h":"景表法の骨格","items":["不当表示：優良誤認・有利誤認・おとり広告等","過大な景品類の提供を制限","違反には措置命令・課徴金","業界の自主ルール＝公正競争規約"]},{"h":"交通・距離","items":["徒歩：道路距離80mで1分、端数切上げ","起点は駅に最も近い区画等","団地は最も近い・遠い区画の両方を表示","新設予定駅は運行主体の公表分のみ"]},{"h":"物件の表示","items":["新築：完成後1年未満かつ未使用","古家・廃屋がある土地はその旨明示","建築条件付土地：条件と不成就時の措置","取引態様：売主・貸主・代理・媒介で明示","畳1枚は1.62㎡以上で換算"]},{"h":"価格・費用","items":["全区画困難なら最低・最高と最多価格帯","管理費・修繕積立金も最低・最高で可","平均額だけの表示は不可","価格は消費税込みの総額"]},{"h":"おとり広告","items":["契約済み物件の掲載","取引する意思がない物件の表示","実在しない物件の表示","事後に説明しても不当表示"]}],"flow":null,"tables":[{"title":"表示規約の主要ルール","head":["項目","ルール"],"rows":[["徒歩所要時間","80m＝1分、端数切上げ"],["新築","完成後1年未満・未使用"],["取引態様","売主・貸主・代理・媒介"],["分譲価格","最低・最高・最多価格帯"],["管理費等","最低額・最高額で可"],["新設予定駅","運行主体公表分・時期明示"],["古家のある土地","その旨を明示"],["建築条件付土地","条件・不成就時の措置明示"]]},{"title":"表示の可否","head":["表示","可否"],"rows":[["徒歩分数の端数切捨て","×"],["平均価格だけの表示","×"],["完成1年超・未入居を新築","×"],["「直販」で取引態様を表示","×"],["契約済み物件を掲載し事後説明","×"],["最も近い区画のみで距離表示","×"]]}]},"ex":[{"t":"徒歩分数の計算","s":"マンションの出入口から駅の出入口までの道路距離が1,250m。1,250÷80＝15.625分なので「徒歩16分」と表示する。分譲地で駅に最も近い区画が400m（5分）、最も遠い区画が900m（11.25分→12分）なら「徒歩5分〜12分」と両方を示す。","p":"道路距離80mにつき1分で計算し1分未満は切り上げる。マンションは建物の出入口が起点で、団地は最も近い区画と最も遠い区画の両方を表示する。","kw":["徒歩","所要時間","80m","端数","団地","道路距離"]},{"t":"成約済みの掲載継続","s":"業者Tはポータルサイトに載せた賃貸物件が3日後に成約したのに、反響を集めるため掲載を続けた。問合せをした客には「その部屋は決まったので別の部屋を」と説明した。","p":"契約済みの物件を表示し続けるのはおとり広告で、問合せ時に説明しても不当表示になる。取引する意思のない物件の表示も同様。","kw":["おとり広告","契約済み","インターネット","不当表示","取引する意思"]},{"t":"値下げの二重価格表示","s":"業者Uは新築分譲住宅を4,980万円で3か月間広告していたが、4,580万円に値下げし「旧価格4,980万円→新価格4,580万円」と表示したい。旧価格の公表日と値下げした日を明示し、値下げから6か月以内に限って表示した。","p":"過去の販売価格との比較は、値下げ直前に2か月以上実際に公表していた価格であること、公表日と値下げ日の明示、値下げから6か月以内などの要件を満たす場合に限り認められる。賃料の二重価格表示はできない。","kw":["二重価格","旧価格","値下げ","公表","時期"]}],"around":[{"h":"2024年10月の改正","b":"景品表示法の改正で、事業者が是正計画を申請し認定されれば措置命令・課徴金を受けない確約手続ができた。10年以内に課徴金を命じられた事業者は算定率が1.5倍（4.5%）になり、優良誤認・有利誤認には100万円以下の罰金（直罰）が新設された。"},{"h":"措置命令は誰が","b":"措置命令は消費者庁長官のほか都道府県知事も出せる。表示規約は業界団体の自主ルールで、違反には協議会が警告や違約金を課す。"},{"h":"新築と新発売","b":"新築は建築工事完了後1年未満で居住の用に供されたことがないもの。新発売は新たに造成・建築した物件等を初めて販売するときの表示で、中古住宅をリフォームしても新発売とは言えない。"},{"h":"数字で覚える基準","b":"畳1枚は1.62㎡以上で換算。路地状部分の面積がおおむね30%以上なら、その旨と割合又は面積を明示。電車の所要時間は朝の通勤ラッシュ時を表示し、平常時は併記できる。"},{"h":"管理費・賃料の表示","b":"住戸ごとに異なる管理費・修繕積立金は最低額と最高額で表示できるが、平均額だけや最高額だけは不可。新築賃貸の賃料も最低・最高で示し、標準的な1住戸だけの表示は不可。"}]},"税他|土地・建物":{"pts":["台地・段丘は水はけが良く地盤も安定し、宅地として安全度が高い。ただし台地上の浅い谷は浸水しやすく、縁辺部は崖崩れに注意。","低地は軟弱地盤が多く、洪水・地震・津波等の災害リスクが高い。自然堤防は周辺の後背低地より比較的安全。","埋立地・干拓地のうち干拓地は海面より低いことが多く危険度が高い。旧河道や砂の緩い埋立地は液状化しやすい。","扇状地は山麓部で土石流等に注意。軟弱層が厚い地域では地震動が増幅され揺れが大きくなる。","鉄筋コンクリートは異形棒鋼の方が付着力が高い。コンクリートは中性化すると鉄筋が錆びやすくなるため、かぶり厚さが重要。","壁式構造は柱・梁を用いず壁と床で箱形をつくる構造。ブレース構造はラーメン構造等と併用されることがある。","べた基礎は建物底部全体に設け、布基礎は壁体等の下に連続して設ける。木造の真壁は和風、大壁は洋風の仕上げ。"],"traps":["「台地上ならどこでも浸水の危険はない」と出たら×。台地上の浅い谷は水が集まり浸水することがある。","「布基礎は建物底部全体にコンクリートを打つ基礎」と出たら×。底部全体はべた基礎、布基礎は壁下に連続。","「異形棒鋼より丸鋼の方が付着力が高い」と出たら×。表面に突起のある異形棒鋼の方が付着力が高い。"],"rel":["法令|盛土規制法","業法|重要事項説明"],"bridge":"盛土・切土の崖や擁壁の安全は盛土規制法で規制され、地形の危険性の理解と結び付く。水害ハザードマップ上の位置や土砂災害警戒区域は重要事項説明の対象となる。","sys":{"overview":"5問免除科目で土地・建物各1問。地形ごとの宅地適否と災害リスク、建物の構造・材料・基礎の特徴が出題範囲。台地は安全・低地は危険を軸に例外（浅い谷・縁辺部・自然堤防）を押さえれば得点できる。","tree":[{"h":"山地・丘陵","items":["山麓部は土石流・地すべりに注意","丘陵の造成地は盛土部分が沈下しやすい","切土と盛土の境目は不同沈下の危険"]},{"h":"台地・段丘","items":["水はけが良く地盤が安定、宅地向き","台地上の浅い谷は豪雨で浸水しやすい","縁辺部は崖崩れに注意"]},{"h":"低地","items":["軟弱地盤で洪水・地震・津波に弱い","軟弱層が厚いと地震動が増幅される","自然堤防は後背低地より比較的安全","旧河道は浸水・液状化しやすい","扇状地は土石流に注意"]},{"h":"埋立・干拓地","items":["干拓地は海面より低く危険度が高い","埋立地は干拓地より比較的安全","砂の緩い埋立地は液状化しやすい"]},{"h":"建物の構造","items":["木造：真壁＝和風、大壁＝洋風","RC：異形棒鋼は付着力が高い","中性化で鉄筋が錆びる→かぶり厚さ","壁式：柱・梁なしで壁と床で支える","ブレース：筋かいで変形抑制、併用可"]},{"h":"基礎","items":["べた基礎：建物底部全体に設ける","布基礎：壁体等の下に連続して設ける","独立基礎：柱ごとに設ける","軟弱地盤では杭基礎も用いる"]},{"h":"耐震と材料","items":["耐震：構造体の強さで揺れに耐える","制震：ダンパー等で揺れを吸収","免震：積層ゴム等で揺れを伝えにくく","木材は乾燥しているほど強度が高い","鉄骨は熱に弱く耐火被覆が必要"]}],"flow":null,"tables":[{"title":"地形と宅地適否","head":["地形","適否","注意点"],"rows":[["台地・段丘","○","浅い谷・縁辺部"],["自然堤防","△","周囲より比較的安全"],["後背低地","×","軟弱・浸水"],["旧河道","×","液状化・浸水"],["扇状地","△","山麓部の土石流"],["埋立地","△","液状化"],["干拓地","×","海面より低い"]]},{"title":"構造形式の比較","head":["構造","特徴"],"rows":[["ラーメン","柱と梁を剛接合"],["壁式","壁と床で箱形、柱・梁なし"],["ブレース","筋かいで補強、他と併用可"],["トラス","部材を三角形に組む"]]},{"title":"基礎の種類","head":["基礎","設け方"],"rows":[["べた基礎","建物底部全体を版で支える"],["布基礎","壁体等の下に連続"],["独立基礎","柱の下ごとに単独"],["杭基礎","杭で深い支持層に伝える"]]}]},"ex":[{"t":"台地の中の危ない場所","s":"Vは水はけの良い台地上で宅地を探している。候補は①台地の平坦な中央部、②台地を刻む浅い谷の底、③台地上の古い池を埋め立てた造成地、④台地の縁の崖の上。安全度が高いのは①で、②は豪雨時に水が集まり浸水しやすく、③は地下水位が高く液状化のおそれ、④は崖崩れに注意が要る。","p":"台地は一般に宅地向きだが、浅い谷・池沼の埋立地・縁辺部は例外的に危険がある。「台地上ならどこでも安全」は×。","kw":["台地","浅い谷","埋め立て","液状化","縁辺部"]},{"t":"川沿い低地の地形","s":"川沿いの低地にある3つの土地を比べる。①川に沿って少し高くなった自然堤防、②その背後の湿った後背低地（後背湿地）、③昔の川筋だった旧河道。①は周囲より比較的安全だが、②は浸水しやすく軟弱、③は浸水・液状化のおそれが大きい。軟弱層が厚い低地では地震の揺れが増幅される。","p":"低地は若く軟弱な地盤が多く、防災上は宅地に好ましくない。自然堤防は相対的に安全、旧河道・後背低地は危険。","kw":["低地","自然堤防","旧河道","後背","軟弱","地震動"]},{"t":"構造と基礎の選び方","s":"Wは体育館のような大空間には自重が小さく柱間を広く取れる鉄骨造を選び、柱・梁は耐火被覆と防錆処理を施した。住宅は鉄筋コンクリート造とし、鉄筋には付着力の高い異形棒鋼を使い、中性化に備えてかぶり厚さを確保した。地盤がやや軟弱だったため、底部全体を版で支えるべた基礎とした。","p":"鉄骨は不燃でも熱に弱く錆びやすいので耐火被覆・防錆が必要。べた基礎は底部全体、布基礎は壁の下に連続して設ける。","kw":["鉄骨","耐火","異形棒鋼","べた基礎","布基礎","鉄筋コンクリート"]}],"around":[{"h":"耐震・制震・免震","b":"耐震は構造体の強さ・粘りで耐え、既存建物の補強にも使われる。制震はダンパー等で揺れを吸収、免震は積層ゴム等で建物に揺れを伝えにくくする。"},{"h":"擁壁の水抜き穴","b":"擁壁には壁面の面積3㎡以内ごとに内径7.5cm以上の水抜き穴を設ける（盛土規制法の技術的基準）。高さが低い擁壁でも背面に水がたまれば崩壊の原因になる。"},{"h":"木材と鋼材の性質","b":"木材は乾燥して含水率が低いほど強度が高い。鋼は炭素量が多いほど硬く強くなるが、もろくなる。"},{"h":"RCが成り立つ理由","b":"鉄筋とコンクリートは常温での熱膨張率がほぼ等しく、一体として働く。コンクリートのアルカリ性が鉄筋を錆から守るが、中性化が進むと錆びやすくなる。"},{"h":"山麓・扇状地の注意","b":"扇状地は砂礫層で地盤は比較的良いが、谷の出口や崖錐の堆積地は土石流の危険がある。地すべり地形はなだらかでも末端の急斜面は崩れやすい。"}]},"権利|弁済・相殺・債権譲渡":{"pts":["正当な利益を有しない第三者は、債務者の意思に反して弁済できない（債務者の意思に反することを債権者が知らなかったときを除く）。債権者の意思に反する弁済も原則できない（債務者の委託を受けたことを債権者が知っていたときを除く）（474条2項・3項）。","受領権者としての外観を有する者（預金通帳と印鑑の持参人等）への弁済は、弁済者が善意かつ無過失なら有効（478条）。","弁済した第三者は債権者の承諾なく代位できる。正当な利益を有しない者の代位は、債権譲渡と同じ通知・承諾が対抗要件（499条・500条）。","相殺は双方の債務が同種で弁済期にあれば一方の意思表示ででき、相殺適状時に遡って効力を生じる。時効消滅前に相殺適状にあった債権は時効後も自働債権にできる（508条）。","悪意による不法行為・人の生命身体侵害の損害賠償債務を受働債権として加害者から相殺できない。差押え後に取得した債権による相殺は差押債権者に対抗できない（差押え前の原因に基づく債権を除く）（509条・511条）。","譲渡制限特約があっても債権譲渡は有効。債務者は悪意・重過失の譲受人に履行を拒み、譲渡人への弁済を対抗できる（466条3項）。","債権譲渡の対抗要件は譲渡人からの通知又は債務者の承諾。第三者には確定日付ある証書が必要で、二重譲渡の優劣は確定日付ある通知の到達の先後で決まる（判例）。"],"traps":["「譲渡制限特約に反する債権譲渡は無効」と出たら×。2020年改正で譲渡自体は有効となった（預貯金債権は例外）。","「二重譲渡の優劣は確定日付の先後で決まる」と出たら×。確定日付ある通知が債務者に到達した日時の先後で決まる。","「譲受人が自ら債務者に通知すれば対抗要件を備える」と出たら×。通知は譲渡人からしなければならず、譲受人は代位して通知することもできない。","「不法行為の被害者は損害賠償債権を自働債権として相殺できない」と出たら×。禁止されるのは加害者からの相殺で、被害者からの相殺はできる。"],"rel":["権利|保証・連帯債務","権利|債務不履行・解除","権利|抵当権・担保"],"bridge":"保証人や物上保証人が弁済すると、債権者の抵当権・保証債権を代位して求償を確保できる。弁済の提供をすれば債務不履行責任を免れ、債権者が受領しなければ受領遅滞・供託の問題となる。","sys":{"overview":"債権総論のうち債権の消滅（弁済・相殺等）と債権の移転（債権譲渡）、債権の保全（債権者代位権・詐害行為取消権）をまとめた論点。第三者弁済の可否、相殺禁止、譲渡の対抗要件と優劣を2020年改正後のルールで押さえる。","tree":[{"h":"弁済","items":["正当な利益なき第三者：債務者の意思に反せない","受領権者の外観ある者へ：善意無過失なら有効","受取証書の交付は弁済と同時履行","債権証書の返還は全額弁済後","特定物以外は債権者の現住所で弁済"]},{"h":"提供・供託・代物弁済","items":["提供の時から不履行責任を免れる","原則は現実の提供","あらかじめ受領拒絶なら口頭の提供で足りる","供託：受領拒絶・受領不能・債権者不確知","代物弁済は合意で成立、給付で消滅"]},{"h":"弁済による代位","items":["債権者の承諾不要","正当な利益なき者は通知・承諾が必要","保証人・物上保証人は法定代位","第三取得者は保証人に代位しない","保証人と物上保証人の間は頭数で"]},{"h":"相殺","items":["同種の債務・自働債権が弁済期","意思表示で相殺適状時に遡る","条件・期限を付けられない","時効前に相殺適状なら時効後も可","相殺禁止特約は悪意・重過失者に対抗可"]},{"h":"債権譲渡","items":["譲渡制限特約があっても有効","将来債権も譲渡できる","対抗要件：譲渡人の通知か債務者の承諾","第三者対抗：確定日付ある証書","対抗要件具備時までの抗弁を対抗できる"]},{"h":"債権の保全","items":["代位権：債務者の無資力が原則","代位権：一身専属権は行使不可","金銭・動産は自己への引渡しを請求可","取消権：必ず裁判所に請求","取消権：知った時から2年・行為から10年"]}],"flow":{"title":"二重譲渡の優劣判定","steps":["AがBへの債権をC・Dに二重に譲渡","確定日付ある通知・承諾があるか確認","一方のみ確定日付あり→その譲受人が優先","双方あり→通知が債務者Bに到達した先後で決定","同時到達→C・Dとも全額を請求でき、Bは弁済を拒めない","Bが一方に弁済すれば債務は消滅（先後不明で供託したときは供託金を債権額で按分：判例）"]},"tables":[{"title":"相殺できるか","head":["場面","相殺","根拠"],"rows":[["悪意の不法行為の加害者から相殺","×","509条1号"],["生命・身体侵害の賠償債務を受働債権に","×","509条2号"],["不法行為の被害者から相殺","○","禁止は加害者側のみ"],["差押え後に取得した債権で相殺","×","511条1項（差押え前の原因に基づく債権は○：同条2項）"],["差押え前に取得した債権で相殺","○","弁済期の先後を問わない"],["時効消滅前に相殺適状だった債権","○","508条"],["時効消滅した債権を譲り受けて相殺","×","判例"]]},{"title":"債権譲渡の対抗要件","head":["相手","必要なもの","注意点"],"rows":[["債務者","譲渡人の通知又は債務者の承諾","確定日付は不要"],["第三者（二重譲受人・差押債権者）","確定日付ある証書による通知・承諾","優劣は到達の先後"],["譲受人からの通知","対抗要件にならない","代位による通知も不可"],["譲渡制限特約と悪意・重過失の譲受人","譲渡は有効","債務者は履行拒絶・供託可"]]},{"title":"債権者代位権と詐害行為取消権","head":["項目","債権者代位権","詐害行為取消権"],"rows":[["行使方法","裁判外でも可","裁判所への請求が必要"],["被保全債権の期限","到来が必要（保存行為は不要）","詐害行為前の原因で生じた債権"],["債務者の無資力","原則必要（登記請求権の転用は不要）","必要"],["金銭の扱い","自己への支払を請求可","自己への支払を請求可"],["期間制限","特になし","知った時から2年・行為から10年"]]}]},"ex":[{"t":"通帳持参人への払戻し","s":"Aは銀行Bに500万円の預金を有している。Cが盗んだAの預金通帳と届出印を持参し、Bの窓口で払戻しを求めた。Bの担当者はCを正当な権限者と信じ、通常の確認手続をしたうえで500万円を支払った。","p":"Cは受領権者としての外観を有する者であり、Bが善意かつ無過失なら弁済は有効となり、Aの預金債権は消滅する（478条）。Bに過失があれば弁済は無効で、AはBに改めて払戻しを請求できる。","kw":["受領権者としての外観","善意かつ無過失","弁済","効力を有する"]},{"t":"二重譲渡と到達の先後","s":"AはBに対する1,000万円の代金債権をCとDに二重に譲渡した。AはCへの譲渡を4月1日付の確定日付ある内容証明郵便で、Dへの譲渡を4月2日付の確定日付ある内容証明郵便でBに通知した。Dへの通知は4月3日、Cへの通知は4月4日にBに到達した。","p":"確定日付ある通知が債務者に到達した日時の先後で優劣が決まるので、先に到達したDが優先し、BはDに弁済すべきである。確定日付の日付はCの方が早いが、優劣には関係しない。","kw":["二重に譲渡","確定日付のある証書","通知","到達","先後"]},{"t":"差押えと相殺","s":"AはBに対して800万円の売買代金債権を有している。Aの債権者Cが、6月1日にこの代金債権を差し押さえた。BはAに対する500万円の貸金債権を5月1日に取得していた。","p":"差押え前に取得した債権による相殺は、弁済期の先後を問わず差押債権者Cに対抗できるので、Bは500万円の範囲で相殺できる（511条1項）。Bが貸金債権を差押え後の6月10日に取得したのであれば、相殺をCに対抗できない。","kw":["差押え","相殺","差押え前に取得","差押債権者","対抗"]}],"around":[{"h":"債務者の抗弁","b":"債務者は対抗要件具備時までに譲渡人に対して生じた事由を譲受人に対抗できる（468条）。改正で異議をとどめない承諾による抗弁の切断は廃止された。"},{"h":"譲渡制限特約と供託","b":"譲渡制限特約付きの金銭債権が譲渡されたとき、債務者は譲受人の善意・悪意を問わず、債務の全額を供託できる（466条の2）。預貯金債権は悪意・重過失の譲受人に譲渡の無効を主張できる。"},{"h":"弁済の提供","b":"弁済の提供は原則として債務の本旨に従った現実の提供が必要。債権者があらかじめ受領を拒んだときは、弁済の準備をしたことを通知して受領を催告する口頭の提供で足りる（493条）。"},{"h":"不動産の代物弁済","b":"代物弁済は当事者の合意だけで成立する諾成契約。不動産による代物弁済で債務が消滅するのは、所有権移転登記などの対抗要件を備えた時とされる（判例）。"},{"h":"登記請求権の代位","b":"土地がA→B→Cと売却され登記がAに残るとき、CはBに代位してAへの移転登記請求権を行使できる。この転用型では債務者Bの無資力は要件とならない（423条の7）。"}],"cases":[{"n":"最判昭和63年7月1日","f":"BはAから土地を借りて建物を建て、その建物をCに賃貸していた。Bが地代を滞納し借地契約を解除されそうになったので、CがBに代わって地代を支払おうとした。","h":"借地上の建物の賃借人は、敷地の地代の弁済について法律上の利害関係を有し、借地人の意思に反しても地代を弁済できる。","pt":"現在は「弁済をするについて正当な利益を有する第三者」（474条2項）として債務者の意思に反しても弁済可。単なる親族・友人など正当な利益のない第三者は、原則として債務者の意思に反して弁済できない（ただし、債務者の意思に反することを債権者が知らなかったときは有効。474条2項ただし書）。また債権者の意思に反しても原則として弁済できない（474条3項）。","kw":["第三者の弁済","正当な利益","借地上の建物の賃借人","地代","債務者の意思に反して"]},{"n":"最判昭和37年8月21日","f":"債権者Aの代理人と称するCが債務者Bのもとに来て弁済を求めた。Cには代理権がなかったが、Bは代理権があると信じ、過失なくCに支払った。","h":"債権者の代理人と称して債権を行使する者（詐称代理人）も債権の準占有者に当たり、善意無過失でした弁済は有効となる。","pt":"現在は「受領権者としての外観を有する者」への善意無過失の弁済（478条）として明文化。「代理権がない以上弁済は無効」と出たら×（令和元年出題）。","kw":["詐称代理人","受領権者としての外観","善意無過失","弁済","478条"]},{"n":"最判昭和59年2月23日","f":"C銀行は、預金者Aを名乗るBに、Aの定期預金を担保にして貸付けをした。Bが返済しないので、C銀行は貸付債権と定期預金債権とを相殺した。C銀行は貸付時にBをA本人と信じ、過失もなかった。","h":"預金担保貸付をした金融機関が、貸付時に善意無過失であれば、478条の類推適用により、その後の相殺の効力を真実の預金者に対抗できる。","pt":"478条は「弁済」だけでなく、預金担保貸付と相殺のように実質的に弁済と同視できる場面にも類推される。善意無過失は相殺時ではなく貸付時で判断する。","kw":["預金担保貸付","相殺","478条","類推適用","善意無過失","貸付時"]},{"n":"最大判昭和32年6月5日","f":"賃貸人Aは賃貸借契約の存在そのものを否定し、賃借人Bから賃料を受け取らない態度を明らかにしていた。Bは賃料を提供しないまま期日を過ぎた。","h":"債権者が契約の存在を否定するなど、弁済を受領しない意思が明確な場合は、債務者は口頭の提供をしなくても債務不履行（履行遅滞）の責任を負わない。","pt":"原則は現実の提供、債権者があらかじめ受領を拒んでいれば口頭の提供で足りる（493条）。受領拒絶の意思が明確なら口頭の提供すら不要、という3段階で問われる。","kw":["弁済の提供","口頭の提供","受領を拒む","受領しない意思が明確","履行遅滞"]},{"n":"最大判昭和45年6月24日","f":"C銀行はAに貸付債権を持ち、AはC銀行に預金債権を持っていた。Aの債権者BがAの預金債権を差し押さえたので、C銀行は、差押え前から持っていた貸付債権で預金債権と相殺した。","h":"第三債務者は、差押え前に取得した債権であれば、自働債権と受働債権の弁済期の先後を問わず、相殺適状に達すれば差押え後でも相殺をもって差押債権者に対抗できる（無制限説）。","pt":"現在は511条1項で明文化（差押え前に取得した債権による相殺は対抗できる。差押え後に取得した債権では不可）。","kw":["差押え","相殺","差押え前に取得","弁済期の先後を問わず","第三債務者"]},{"n":"最判昭和36年4月14日","f":"AはBに対して代金債務を負っていた。Aは、すでに消滅時効が完成しているCのBに対する債権を譲り受け、これを自働債権としてBへの代金債務と相殺しようとした。","h":"消滅時効が完成した債権を譲り受け、これを自働債権として相殺することは、508条によっても許されない。","pt":"508条は時効完成前に相殺適状にあった自分の債権を保護する規定。時効消滅した他人の債権を買い集めて相殺することはできない。","kw":["消滅時効","譲り受けた債権","自働債権","相殺","508条"]},{"n":"最判昭和49年3月7日","f":"AはBに対する債権をCとDに二重に譲渡し、いずれもBに確定日付のある証書で通知した。証書の日付はC宛ての方が早かったが、Bに先に届いたのはD宛ての通知だった。","h":"確定日付のある通知が複数あるときの譲受人間の優劣は、確定日付の先後ではなく、通知が債務者に到達した日時（承諾の場合は承諾の日時）の先後で決まる。","pt":"Dが優先する。「確定日付の早い方が優先」と出たら×。単なる通知（確定日付なし）しかない譲受人は、確定日付ある通知の譲受人に対抗できない（467条2項）。","kw":["債権譲渡","二重譲渡","確定日付のある証書","到達の先後","対抗要件"]},{"n":"最判昭和55年1月11日","f":"AはBに対する債権をCとDに二重に譲渡し、確定日付のある通知が同時にBに到達した。CがBに全額の支払を求めた。","h":"確定日付のある通知が同時に到達した場合、各譲受人は債務者に対してそれぞれ全額の弁済を請求でき、債務者は同順位の譲受人がほかにいることを理由に弁済を拒めない。","pt":"どちらかに弁済すれば債務は消滅する。債務者が供託した場合、譲受人は供託金を債権額に応じて按分して取得するとした判例（最判平成5年3月30日）もある。","kw":["同時に到達","確定日付","二重譲渡","全額","弁済を拒めない"]},{"n":"最判平成11年1月29日","f":"医師Aは、将来8年間に発生する診療報酬債権をまとめてBに譲渡した。","h":"将来発生する債権を目的とする譲渡契約も有効であり、契約時に債権発生の可能性が低かったとしても、そのことだけで契約の効力は否定されない。","pt":"現在は466条の6で明文化（将来債権も譲渡でき、譲受人は発生した債権を当然に取得する）。","kw":["将来債権","債権譲渡","発生の可能性","有効","466条の6"]},{"n":"大判明治43年7月6日","f":"土地がA→B→Cと順に売却されたが、登記名義はAのまま残っていた。BがAに対する登記請求権を行使しないので、CはBに代わってAにB名義への移転登記を求めた。","h":"登記請求権を保全するため、Cは、BのAに対する登記請求権を代位行使でき、この場合は債務者Bの無資力は要件とならない（債権者代位権の転用）。","pt":"現在は423条の7で明文化。金銭債権を保全する本来の債権者代位では債務者の無資力が必要、という違いが狙われる。","kw":["債権者代位権","登記請求権","代位行使","無資力","423条の7"]},{"n":"判例（最高裁）","f":"BはAから土地を借りたが、Cがその土地を不法に占拠していた。所有者Aは何もしないので、Bは自らCに明渡しを求めた。","h":"賃借人Bは、賃借権を保全するため、賃貸人Aが所有者として不法占拠者Cに対して持つ妨害排除請求権を代位行使できる。","pt":"現在は、対抗要件を備えた不動産賃借人なら、代位によらず自ら妨害停止・返還を請求できる（605条の4）。代位行使の場合は無資力不要。","kw":["賃借人","不法占拠者","妨害排除請求権","代位行使","605条の4"]},{"n":"最大判昭和36年7月19日","f":"AはBに土地を売ったが登記をしないうちに、ほかに財産のないAがその土地をCに安く売り、Cが登記した。BはA・C間の売買を詐害行為として取り消そうとした。","h":"特定物の引渡請求権（特定物債権）も、究極において損害賠償債権に変じうるので、債務者が無資力となった場合には、その特定物債権者は詐害行為取消権を行使できる。","pt":"取り消せるのは取消債権者の債権が詐害行為より前の原因に基づく場合（424条3項）。二重譲渡の対抗問題で負けた買主でも、無資力要件を満たせば取消しを主張できる点がポイント。","kw":["詐害行為取消権","特定物債権","二重譲渡","無資力","損害賠償債権"]},{"n":"最判昭和53年10月5日","f":"AはBに土地を売ったが、登記前に無資力のAが同じ土地をCに売り、Cが登記した。Bは、A・C間の売買を詐害行為として取り消したうえで、Cに対し、土地の登記を直接自分（B）名義に移すよう求めた。","h":"特定物債権者は、詐害行為取消しにより登記をAに戻させることはできるが、直接自己への所有権移転登記を求めることはできない。","pt":"詐害行為取消しは総債権者のために責任財産を回復する制度。金銭なら取消債権者が直接自己への支払を求められる（424条の9）が、不動産の登記を自己名義にすることはできない。","kw":["詐害行為取消","特定物債権者","所有権移転登記","自己への移転","責任財産"]},{"n":"最判平成11年6月11日","f":"多額の借金を抱えたBは、父の死亡後、母・兄弟と遺産分割協議をし、自分は何も取得しないことにした。Bの債権者Aは、この遺産分割協議を詐害行為として取り消そうとした。","h":"共同相続人の間で成立した遺産分割協議は、財産権を目的とする法律行為であり、詐害行為取消権の対象となる。","pt":"相続放棄は詐害行為取消しの対象とならない（最判昭和49年9月20日）こととの対比が頻出。","kw":["遺産分割協議","詐害行為取消権","共同相続人","財産権を目的とする法律行為"]},{"n":"最判昭和49年9月20日","f":"多額の借金を抱えたBは、父の死亡後に相続放棄をした。Bの債権者Aは、この相続放棄を詐害行為として取り消そうとした。","h":"相続の放棄は、既得財産を積極的に減少させる行為ではなく消極的にその増加を妨げるにすぎず、また身分行為であって他人の意思で強制すべきでないから、詐害行為取消権の対象とならない。","pt":"「相続放棄も遺産分割協議も詐害行為取消しの対象となる」と出たら×。遺産分割協議は対象、相続放棄は対象外。","kw":["相続の放棄","詐害行為取消権","身分行為","遺産分割協議"]},{"n":"最判昭和58年12月19日","f":"ほかに財産のないBは、妻Cと離婚する際、唯一の財産である土地をCに財産分与した。Bの債権者Aは、この財産分与を詐害行為として取り消そうとした。","h":"離婚に伴う財産分与は、分与者が債務超過でも、768条3項の趣旨に反して不相当に過大で、財産分与に仮託された財産処分と認めるに足りる特段の事情がない限り、詐害行為とならない。","pt":"原則は取消しの対象外。不相当に過大な部分に限り取り消せる（最判平成12年3月9日）。","kw":["離婚","財産分与","詐害行為","不相当に過大","特段の事情"]},{"n":"最判昭和46年12月16日","f":"AはBとの間で、Aの鉱山で採掘する硫黄鉱石の全量をBが買い取る継続的な売買契約を結んだ。ところが市況が悪化すると、Bは鉱石の引取りを拒んだ。","h":"この契約関係のもとでは、買主Bは信義則上、鉱石を引き取る義務を負い、その引取りを拒絶したことは債務不履行となるので、売主Aは損害賠償を請求できる。","pt":"判例は、債権者には原則として受領義務がなく、受領遅滞だけを理由に債務者が契約を解除することはできないとする立場をとりつつ、契約の内容によっては信義則上の引取義務を認める。受領遅滞の効果（注意義務の軽減・増加費用の債権者負担・危険の移転）は413条・413条の2で明文化。","kw":["受領遅滞","引取義務","信義則","継続的売買","債務不履行"]}]}};

/* ---------- exam ---------- */
function startExam(field){
  const qs=[];const ex=new Set();
  if(field){pick(BANK.filter(q=>q.f===field),10,ex).forEach(q=>qs.push(q))}
  else{const mix=MIX[SET.round];FIELDS.forEach(([f])=>{pickCover(BANK.filter(q=>q.f===f),mix[f],ex).forEach(q=>{qs.push(q);ex.add(q.i)})})}
  const label=field?FNAME(field)+" 10問":`第${SET.round+1}回`;
  const E={qs,ans:Array(qs.length).fill(null),cur:0,left:LIMIT,start:Date.now(),field,label};

    const q=E.qs[E.cur];const m=Math.floor(E.left/60),s=E.left%60;

    <article class="card"><div class="meta">問${E.cur+1}　${FIELDS.find(x=>x[0]===q.f)[1]}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn ${E.ans[E.cur]===1?"sel":""}" id="o" ${E.ans[E.cur]!=null?"disabled":""}>○</button><button class="btn ${E.ans[E.cur]===0?"sel":""}" id="x" ${E.ans[E.cur]!=null?"disabled":""}>×</button></div>
    ${E.ans[E.cur]!=null?(()=>{const ok=E.ans[E.cur]===q.a;return `<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答え：${q.a?"○":"×"}　<span class="note">${q.t}　${q.ref==="確認"?"確認問題":q.ref}</span></span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div>`})():""}
    <div class="row" style="justify-content:space-between"><button class="btn" id="prev" ${E.cur?"":"disabled"}>前へ</button><button class="btn ${E.ans[E.cur]!=null?"pri":""}" id="next">${E.cur<9?"次へ":"採点する"}</button></div></article>
    <div id="cf"></div>`;
    const choose=v=>{
      // 1問ごとにその場で正誤と解説を表示（答えは確定）。10問テスト・分野別とも同じ
      if(E.ans[E.cur]!=null)return;E.ans[E.cur]=v;const q0=E.qs[E.cur];render();if(voice)speak((v===q0.a?"正解。":"不正解。")+"答えは"+(q0.a?"まる":"ばつ")+"。"+q0.e)};
    $("#o").onclick=()=>choose(1);$("#x").onclick=()=>choose(0);
    $("#prev").onclick=()=>{E.cur--;render()};

  };

    $("#cf").innerHTML=`<div class="confirm row"><span>未回答が${un}問あります。未回答は不正解になります。</span><button class="btn" id="yes">採点する</button><button class="btn" id="no">続ける</button></div>`;
    $("#yes").onclick=finish;$("#no").onclick=()=>$("#cf").innerHTML=""};

    const used=LIMIT-E.left;let sc=0;E.qs.forEach((q,k)=>{const ok=E.ans[k]===q.a;if(ok)sc++;rec(q,ok)});

function judge(sc){return sc>=8?["j-ok","合格圏"]:sc===7?["j-mid","合格ライン上"]:["j-ng","要復習"]}

    <p class="note">かかった時間 ${Math.floor(used/60)}分${used%60}秒 / 10分</p>
    ${wrongItems.length?`<p class="note">間違えた論点ごとに「解説（具体例・周辺知識つき） → 付随する論点 → 過去問の確認例題5問」の順で復習します。</p>
    <button class="btn pri" id="allw">間違えた${wrongItems.length}論点を復習する</button>
    <div class="row">${wrongItems.map((w,j)=>`<button class="btn" data-w="${j}">${w.key.split("|")[1]}だけ</button>`).join("")}</div>`:`<p>全問正解です。${E.field?"続けて解くと見込みの精度が上がります。":"次の回に進みましょう。"}</p>`}
    <div class="row"><button class="btn" id="home">ホームへ</button><button class="btn" id="nx">${E.field?`もう一度 ${FNAME(E.field)} 10問`:`第${SET.round+1}回へ進む`}</button></div>
  </section>
  ${setHtml}
  <section class="rv">${E.qs.map((q,k)=>{const ok=E.ans[k]===q.a;return `<article class="card"><div class="meta">問${k+1}　${q.t}　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    <div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　あなた：${E.ans[k]==null?"未回答":E.ans[k]?"○":"×"}　答え：${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div></article>`}).join("")}</section>`;
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>startReview([wrongItems[+b.dataset.w]]));
  if(wrongItems.length)$("#allw").onclick=()=>startReview(wrongItems);

/* ---------- review: 解説（具体例・周辺知識） → 付随論点 → 確認例題5問（1問ごとに正誤と解説） ---------- */
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// 間違えた問題と最も関係の深い枝（大項目）を文字の2文字組の重なりで推定する
function bigr(x){const s=String(x).replace(/[\s、。・：（）()「」，,．.0-9０-９]/g,"");const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o}
function overlap(a,b){let n=0;b.forEach(x=>{if(a.has(x))n++});return n}
function cellHtml(x){x=esc(x);if(/^(○|◯|必要|可|あり|できる)/.test(x))return `<span class="o">${x}</span>`;if(/^(×|✕|不要|不可|なし|できない)/.test(x))return `<span class="x">${x}</span>`;return x}
// 間違えた問題に最も関係する枝・項目を推定（2文字組の重なり）
function hitOf(S,missed){
  let b=-1,it=-1;if(!S||!missed)return {b,it};
  const qb=bigr(missed.q.s+missed.q.e);let best=1;
  S.tree.forEach((x,i)=>{const sc=overlap(qb,bigr(x.h+x.items.join("")));if(sc>best){best=sc;b=i}});
  if(b>=0){let bi=0;S.tree[b].items.forEach((x,j)=>{const sc=overlap(qb,bigr(x));if(sc>bi){bi=sc;it=j}})}
  return {b,it};
}
const brHtml=(x,i,hit,tag)=>`<div class="br ${hit.b===i?"hit":""}" id="br-${i}"><h4><span class="no">${i+1}</span>${esc(x.h)}${hit.b===i&&tag?`<span class="tag">${tag}</span>`:""}</h4><ul>${x.items.map((y,j)=>`<li class="${hit.b===i&&hit.it===j?"hit":""}">${esc(y)}</li>`).join("")}</ul></div>`;
const tblHtml=(tb,rows,note)=>`<div><div style="font-weight:700;margin-bottom:6px">${esc(tb.title)}</div><div class="tw"><table class="st"><thead><tr>${tb.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${cellHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${note?`<p class="note" style="margin:4px 0 0">${note}</p>`:""}</div>`;
const missedHtml=missed=>missed?`<article class="card"><div class="meta">あなたが間違えた問題　${missed.q.ref==="確認"?"確認問題":missed.q.ref}</div><p class="stmt">${missed.q.s}</p>
    <div class="res ng"><span class="v">あなた：${missed.your==null?"未回答":missed.your?"○":"×"}　答え：${missed.q.a?"○":"×"}</span><span>${missed.q.e}</span><span class="memo">覚え方：<b>${missed.q.m}</b></span></div></article>`:"";

/* 1段目：間違えた範囲だけに絞った解説＋体系へのリンク */
// 具体例と周辺知識（src/logic.ts の orderExamples と同じ並べ方）
function orderExamples(L,q){const ex=L.ex||[];if(!q)return ex.map(x=>({ex:x,near:false}));const text=q.s+q.e;
  const sc=ex.map((x,i)=>({x,i,n:x.kw.filter(k=>text.includes(k)).length}));sc.sort((a,b)=>b.n-a.n||a.i-b.i);return sc.map((o,j)=>({ex:o.x,near:j===0&&o.n>0}))}
function exHtml(L,missed){const o=orderExamples(L,missed&&missed.q);if(!o.length)return "";
  return `<article class="card"><div class="meta">具体例で理解する</div>${o.map(({ex,near})=>`<div class="exb${near?" near":""}">${near?`<span class="tag">この問題に近い例</span>`:""}<b>${esc(ex.t)}</b><p>${esc(ex.s)}</p><p class="exp">→ ${esc(ex.p)}</p></div>`).join("")}</article>`}
// 判例：問題に関係する判例を先頭に3件、残りは折りたたみ（src/logic.ts の orderByKw と同じ並べ方）
function orderByKw(list,q){if(!q)return list.map(x=>({item:x,near:false}));const text=q.s+q.e;
  const sc=list.map((x,i)=>({x,i,n:x.kw.filter(k=>text.includes(k)).length}));sc.sort((a,b)=>b.n-a.n||a.i-b.i);return sc.map(o=>({item:o.x,near:o.n>0}))}
function casesHtml(L,missed){const o=orderByKw(L.cases||[],missed&&missed.q);if(!o.length)return "";
  const one=({item:c,near})=>`<div class="exb${near?" near":""}">${near?`<span class="tag">この問題に関係する判例</span>`:""}<b>${esc(c.n)}</b><p><b>事案</b>　${esc(c.f)}</p><p><b>判断</b>　${esc(c.h)}</p><p class="cpt"><b>試験では</b>　${esc(c.pt)}</p></div>`;
  return `<article class="card"><div class="meta">判例で理解する（${o.length}件）</div>${o.slice(0,3).map(one).join("")}${o.length>3?`<details class="more"><summary>ほかの判例も見る（あと${o.length-3}件）</summary>${o.slice(3).map(one).join("")}</details>`:""}</article>`}
function aroundHtml(L){const a=L.around||[];if(!a.length)return "";
  return `<article class="card"><div class="meta">あわせて覚える周辺知識</div><dl class="ard">${a.map(x=>`<dt>${esc(x.h)}</dt><dd>${esc(x.b)}</dd>`).join("")}</dl></article>`}
function focusHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const S=L.sys;const t=key.split("|")[1];
  const qb=missed?bigr(missed.q.s+missed.q.e):null;
  const hit=hitOf(S,missed);
  let body="";
  if(S&&hit.b>=0){body+=brHtml(S.tree[hit.b],hit.b,hit,"間違えた範囲")}
  else{body+=`<ul class="ul">${L.pts.slice(0,4).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
  // 関係する表の行だけを抜き出す
  if(S&&qb){let best=null;
    S.tables.forEach(tb=>{const rs=tb.rows.map((r,i)=>({i,r,sc:overlap(qb,bigr(r.join("")))})).filter(o=>o.sc>=2);
      const top=rs.sort((a,b)=>b.sc-a.sc).slice(0,4).sort((a,b)=>a.i-b.i);const sc=top.reduce((a,o)=>a+o.sc,0);
      if(top.length&&(!best||sc>best.sc))best={tb,top,sc}});
    if(best)body+=tblHtml(best.tb,best.top.map(o=>o.r),best.top.length<best.tb.rows.length?`表の一部（${best.top.length}／${best.tb.rows.length}行）。全体は下の「体系的に学ぶ」で。`:"")}
  // 関係するひっかけ
  let traps=L.traps||[];
  if(qb){const r=traps.map(x=>({x,sc:overlap(qb,bigr(x))})).filter(o=>o.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,2).map(o=>o.x);traps=r.length?r:traps.slice(0,1)}else traps=traps.slice(0,2);
  if(traps.length)body+=`<div class="trap"><b>この範囲のひっかけ</b><ul class="ul">${traps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  const head=S&&hit.b>=0?`${esc(t)}：${esc(S.tree[hit.b].h)}`:`${esc(t)}の要点`;
  const map=S?`<div class="mini">${S.tree.map((x,i)=>`<button class="mchip ${i===hit.b?"on":""}" data-deep="${i}"><span class="no">${i+1}</span>${esc(x.h)}</button>`).join("")}</div>`:"";
  const rel=(L.rel||[]).filter(k=>LESSON[k]);
  return `<article class="card"><div class="meta">間違えた範囲の解説</div><h2>${head}</h2>${body}</article>
  ${exHtml(L,missed)}${casesHtml(L,missed)}${aroundHtml(L)}
  ${S?`<article class="card"><div class="meta">体系的に広げる</div><p class="note" style="margin:0">「${esc(t)}」は全${S.tree.length}項目。項目を押すと、その場所から詳しい解説を開きます。</p>${map}
    <button class="btn deeplink" data-deep="all">${esc(t)}を体系的に学ぶ<span class="sub2">全体像・流れ図・比較表・要点</span></button>
    ${rel.length?`<div><div class="note" style="margin-bottom:6px">${esc(L.bridge||"関連する論点")}</div><div class="mini">${rel.map(k=>`<button class="mchip rel" data-deeprel="${k}">${esc(k.split("|")[1])} →</button>`).join("")}</div></div>`:""}</article>`:""}`;
}

/* 2段目：論点を体系的に深く学ぶページ */
function deepHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const S=L.sys;const [f,t]=key.split("|");
  const hit=hitOf(S,missed);
  let h="";
  if(S){
    h+=`<article class="card"><div class="meta">全体像（体系図）　${FIELDS.find(x=>x[0]===f)[1]}</div><h2>${esc(t)}の全体像</h2><p class="ov">${esc(S.overview)}</p><div class="systree"><div class="sysroot">${esc(t)}</div><div class="sysbr">${S.tree.map((x,i)=>brHtml(x,i,hit,"間違えた範囲")).join("")}</div></div></article>`;
    if(S.flow&&S.flow.steps&&S.flow.steps.length)h+=`<article class="card"><div class="meta">流れで覚える</div><h2>${esc(S.flow.title)}</h2><ol class="flow">${S.flow.steps.map((x,i)=>`<li><span class="n">${i+1}</span><span class="s">${esc(x)}</span></li>`).join("")}</ol></article>`;
    if(S.tables&&S.tables.length)h+=`<article class="card"><div class="meta">比較表・数字</div><div class="tbls">${S.tables.map(tb=>tblHtml(tb,tb.rows,"")).join("")}</div></article>`;
  }
  h+=`<article class="card"><div class="meta">要点のまとめ</div><h2>${esc(t)}の要点</h2><ul class="ul">${L.pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${L.traps&&L.traps.length?`<div class="trap"><b>よく出るひっかけ</b><ul class="ul">${L.traps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}</article>`;
  h+=exHtml(L,missed)+casesHtml(L,missed)+aroundHtml(L);
  const rel=(L.rel||[]).filter(k=>LESSON[k]);
  if(rel.length)h+=`<article class="card"><div class="meta">つながる論点</div><p style="margin:0">${esc(L.bridge||"")}</p><div class="mini">${rel.map(k=>`<button class="mchip rel" data-deeprel="${k}">${esc(k.split("|")[1])} →</button>`).join("")}</div></article>`;
  return h;
}
function deepView(key,focus,missed,back,trail){
  trail=trail||[];const t=key.split("|")[1];
  app.innerHTML=`<div class="exam-top"><div><div class="note">体系的に学ぶ${trail.length?"　"+trail.map(k=>esc(k.split("|")[1])).join(" › ")+" ›":""}</div><div style="font-weight:700">${esc(t)}</div></div><button class="btn" id="back">← 復習に戻る</button></div>
  ${deepHtml(key,missed)}
  <div class="row"><button class="btn pri" id="back2">← 復習に戻る</button></div>`;
  $("#back").onclick=back;$("#back2").onclick=back;
  document.querySelectorAll("[data-deeprel]").forEach(b=>b.onclick=()=>deepView(b.dataset.deeprel,-1,null,back,[...trail,key]));
  if(focus>=0){const el=document.getElementById("br-"+focus);if(el){el.classList.add("focus");el.scrollIntoView({block:"center"});return}}
  window.scrollTo(0,0);
}
function startReview(queue){ // queue: [{key, missed?}]
  if(!queue.length){home();return}
  const item=queue[0],rest=queue.slice(1);const key=item.key;const [f,t]=key.split("|");
  app.innerHTML=`<div class="exam-top"><div><div class="note">復習　残り${queue.length}論点</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
  ${missedHtml(item.missed)}
  ${focusHtml(key,item.missed)}
  <div class="row"><button class="btn pri" id="toq">確認例題5問へ</button></div>`;
  $("#home").onclick=home;
  $("#toq").onclick=()=>checkQs(item,rest);
  const back=()=>startReview(queue);
  document.querySelectorAll("[data-deep]").forEach(b=>b.onclick=()=>deepView(key,b.dataset.deep==="all"?-1:+b.dataset.deep,item.missed,back));
  document.querySelectorAll("[data-deeprel]").forEach(b=>b.onclick=()=>deepView(b.dataset.deeprel,-1,null,back,[key]));
  if(voice){const L=LESSON[key];if(L){const S=L.sys,h=hitOf(S,item.missed);speak(h.b>=0?t+"、"+S.tree[h.b].h+"。"+S.tree[h.b].items.join("。"):t+"の要点。"+L.pts.slice(0,4).join("。"))}}
  window.scrollTo(0,0);
}
function checkQs(item,rest){
  const [f,t]=item.key.split("|");
  const ex=new Set(item.missed?[item.missed.q.i]:[]);
  let pool=BANK.filter(q=>q.f===f&&q.t===t);
  let real=pool.filter(q=>q.ref!=="確認");
  const N=5; // 確認例題の問題数（src/logic.ts の reviewCount と同じ）
  const qs=pick(real.length>=N?real:pool,N,ex);
  let k=0,right=0;
  const render=()=>{
    if(k>=qs.length){
      const J=right>=Math.ceil(qs.length*0.8)?["j-ok","習得"]:right>=Math.ceil(qs.length*0.6)?["j-mid","もう一息"]:["j-ng","要復習"];const ok=J[0]==="j-ok";
      app.innerHTML=`<section class="card"><h2>${t}　確認例題の結果</h2><div class="row"><span class="big">${right}<span style="font-size:1.2rem"> / ${qs.length}</span></span><span class="judge ${J[0]}">${J[1]}</span></div>
      <p class="note">${ok?"この論点は理解できています。":"もう一度、解説を読んでから別の5問に挑戦できます。"}</p>
      <div class="row">${ok?"":`<button class="btn" id="again">解説に戻ってもう一度</button>`}
      ${rest.length?`<button class="btn pri" id="next">次の論点へ（残り${rest.length}）</button>`:`<button class="btn pri" id="nx">第${SET.round+1}回の模試へ</button>`}
      <button class="btn" id="home">ホームへ</button></div></section>`;
      if(!ok)$("#again").onclick=()=>startReview([{key:item.key,missed:item.missed},...rest]);
      if(rest.length)$("#next").onclick=()=>startReview(rest);else $("#nx").onclick=()=>startExam();
      $("#home").onclick=home;window.scrollTo(0,0);return}
    const q=qs[k];
    app.innerHTML=`<div class="exam-top"><div><div class="note">確認例題　${k+1} / ${qs.length}　正解 ${right}</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
    <article class="card"><div class="meta">過去問　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn" id="o">○</button><button class="btn" id="x">×</button></div><div id="res"></div></article>`;
    const go=v=>{$("#o").disabled=$("#x").disabled=true;const ok=v===q.a;if(ok)right++;rec(q,ok);save();
      $("#res").innerHTML=`<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答えは ${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div><div class="row" style="margin-top:10px"><button class="btn pri" id="nx">次へ</button></div>`;
      if(voice)speak((ok?"正解。":"不正解。")+"答えは"+(q.a?"まる":"ばつ")+"。"+q.e);
      $("#nx").onclick=()=>{k++;render();if(voice&&k<qs.length)speak(qs[k].s)};$("#nx").focus()};
    $("#o").onclick=()=>go(1);$("#x").onclick=()=>go(0);$("#home").onclick=home;
    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    window.scrollTo(0,0);
  };
  render();if(voice&&qs.length)speak(qs[0].s);
}
if(canSpeak){try{speechSynthesis.getVoices()}catch(e){}}
home();
connect();
</script>

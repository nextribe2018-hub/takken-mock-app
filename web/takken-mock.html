関する規約の定めは、案の段階であってもその内容を重要事項として説明しなければならない（宅建業法35条1項6号、施行規則16条の2）。","m":"規約は案でも説明"},{"f":"業法","t":"8種制限","ref":"R07-30-エ","s":"宅地建物取引業者が自ら売主として、建築工事完了前のマンションを代金5,000万円で宅建業者でない個人に売却する場合、手付金500万円を受領するにあたって手付金等の保全措置を講じる必要はない。","a":0,"e":"未完成物件では代金の5％（250万円）以下かつ1,000万円以下でなければ保全措置が必要。500万円なら必要（宅建業法41条）。","m":"未完成は5％超で保全"},{"f":"業法","t":"業務上の規制","ref":"R07-31-ア","s":"宅地建物取引業者の従業者である宅建士が電話でマンションの購入を勧誘する際、勤務先の名称と免許証番号及び勧誘目的を告げていれば、自己の氏名を告げなくても宅建業法に違反しない。","a":0,"e":"勧誘に先立ち、業者の商号又は名称、勧誘を行う者の氏名、勧誘目的であることを告げなければならない（宅建業法47条の2第3項、施行規則16条の11）。","m":"勧誘は名称・氏名・目的"},{"f":"業法","t":"業務上の規制","ref":"R07-31-ウ","s":"宅地建物取引業者が一時的に雇用したアルバイトにチラシの配布や契約書作成の補助をさせる場合であっても、そのアルバイトには業務に従事する際に従業者証明書を携帯させなければならない。","a":1,"e":"従業者には一時的な者や事務補助者も含まれ、業務に従事させる際は従業者証明書を携帯させる必要がある（宅建業法48条1項）。","m":"バイトも従業者証明書"},{"f":"業法","t":"業務上の規制","ref":"R07-31-エ","s":"宅地建物取引業者が、日当たりを重視するマンション購入希望者に対し、南側の駐車場に将来高層建築物が建つ予定は全くないと根拠なく断定して説明し申込みを受けることは、宅建業法で禁止される行為に当たる。","a":1,"e":"将来の環境等について誤解させるような断定的判断を提供して勧誘することは禁止されている（宅建業法47条の2第3項、施行規則16条の11）。","m":"将来を言い切るのはNG"},{"f":"業法","t":"8種制限","ref":"R07-32-2","s":"宅地建物取引業者Aが自ら売主として、宅建業者でないBに建築工事完了後のマンションを代金4,000万円で売却する場合、Aは保全措置を講じることなく、手付金として400万円を受領することができる。","a":1,"e":"完成物件は代金の10％以下かつ1,000万円以下なら保全措置不要。400万円はちょうど10％なので不要（宅建業法41条の2）。","m":"完成物件は10％まで保全不要"},{"f":"業法","t":"8種制限","ref":"R07-32-3","s":"宅地建物取引業者Aが自ら売主として、宅建業者でないBから手付金500万円を受領した場合、Bに債務不履行がなくても、Aは受領した500万円をBに返還すれば、Bが履行に着手する前であれば契約を解除できる。","a":0,"e":"売主業者が手付解除するには、相手方が履行に着手する前に手付の倍額（1,000万円）を現実に提供しなければならない（宅建業法39条2項）。","m":"売主の手付解除は倍返し"},{"f":"業法","t":"8種制限","ref":"R07-32-4","s":"宅地建物取引業者Aが自ら売主として、宅建業者でないBとの間で代金4,000万円のマンションの売買契約を締結する場合、債務不履行による解除に伴う損害賠償の予定額を1,000万円とする特約を定めることができる。","a":0,"e":"損害賠償の予定額と違約金の合計は代金の20％（800万円）を超えられず、超える部分は無効（宅建業法38条）。","m":"損害賠償予定は2割まで"},{"f":"業法","t":"免許の基準","ref":"R07-34-ア","s":"A社の政令で定める使用人であったBが拘禁刑2年・執行猶予2年の判決を受けた後に退任し、C社の政令で定める使用人に就任した。Bの執行猶予期間が満了していない場合、C社は免許を受けることができない。","a":1,"e":"拘禁刑以上の刑で執行猶予中の者は欠格。政令使用人が欠格者なら法人も免許不可。猶予期間満了で直ちに解消（宅建業法5条1項5号・12号）。","m":"執行猶予中は欠格"},{"f":"業法","t":"免許の基準","ref":"R07-34-ウ","s":"営業に関し成年者と同一の行為能力を有しない未成年者Fの法定代理人Gが、現場助勢罪により罰金刑に処せられた場合、刑の執行を終えてから5年を経過していなくても、Fは免許を受けることができる。","a":0,"e":"現場助勢罪は暴力的犯罪として罰金刑でも欠格事由。法定代理人が欠格者なら未成年者本人も5年間免許を受けられない（宅建業法5条1項6号・11号）。","m":"法定代理人の欠格は本人に及ぶ"},{"f":"業法","t":"免許の基準","ref":"R07-34-エ","s":"K社の政令で定める使用人Jが破産手続開始の決定を受けた後に復権を得た場合、復権を得た日から5年を経過していなくても、K社は他に欠格事由がなければ免許を受けることができる。","a":1,"e":"破産者の欠格は復権を得れば直ちに解消し、5年待つ必要はない（宅建業法5条1項1号）。","m":"破産は復権で即OK"},{"f":"業法","t":"営業保証金","ref":"R07-35-1","s":"保証協会の社員でない宅地建物取引業者Aの免許が有効期間満了により失効した場合、Aが営業保証金を取り戻すには、原則として還付請求権者に対し6か月を下らない一定期間内に申し出るべき旨を公告しなければならない。","a":1,"e":"免許失効・取消し・廃業等による取戻しは、原則として6か月以上の期間を定めた公告が必要（宅建業法30条2項）。","m":"取戻しは6か月以上の公告"},{"f":"業法","t":"営業保証金","ref":"R07-35-3","s":"保証協会の社員でない宅地建物取引業者Aが他の都道府県に支店を新設したときは、その支店の最寄りの供託所に営業保証金を供託し、その旨を免許権者に届け出なければならない。","a":0,"e":"営業保証金は支店増設分も含め、すべて主たる事務所の最寄りの供託所に供託する（宅建業法25条1項・26条）。","m":"供託は本店最寄り"},{"f":"業法","t":"営業保証金","ref":"R07-35-4","s":"保証協会の社員でない宅地建物取引業者Aの支店で宅地建物取引業に関する取引をした者（宅建業者を除く）は、その取引により生じた債権について、支店分の500万円を限度として営業保証金から還付を受けることができる。","a":0,"e":"還付の限度は支店分に限られず、業者が供託している営業保証金の全額。宅建業者は還付を受けられない（宅建業法27条1項）。","m":"還付は供託額全部まで"},{"f":"業法","t":"広告","ref":"R07-38-ア","s":"宅地建物取引業者が広告で取引態様の別を明示していた場合であっても、その広告を見た者から宅地の売買に関する注文を受けたときは、遅滞なく改めて取引態様の別を明らかにしなければならない。","a":1,"e":"取引態様の別は広告時と注文を受けた時の両方で明示が必要。注文時の明示は口頭でもよい（宅建業法34条）。","m":"広告時と注文時の2回"},{"f":"業法","t":"広告","ref":"R07-38-イ","s":"宅地建物取引業者が宅地の形質について実際のものよりも著しく優良であると人を誤認させる広告をした場合、その広告を見て注文した者がおらず取引が成立しなかったときは、監督処分や罰則の対象とならない。","a":0,"e":"誇大広告は表示した時点で違反となり、取引の有無を問わず監督処分・罰則（6月以下の拘禁刑等）の対象（宅建業法32条・65条・81条）。","m":"誇大広告は出した時点で違反"},{"f":"業法","t":"報酬","ref":"R07-38-エ","s":"宅地建物取引業者は、依頼者から依頼を受けずに自らの判断で行った物件の広告であっても、その広告料金に相当する額を、報酬の限度額とは別に依頼者から受け取ることができる。","a":0,"e":"報酬と別に広告料金を受領できるのは、依頼者の依頼による広告の実費に限られる（報酬告示第9）。","m":"広告料は依頼＋実費のみ"},{"f":"業法","t":"クーリング・オフ","ref":"R07-40-ア","s":"宅建業者Aが自ら売主、宅建業者Bの媒介で宅建業者でないCに宅地を売却する場合、CがBの事務所で買受けの申込みをし、3日後に自宅近くの喫茶店で契約を締結したときは、Cはクーリング・オフによる解除ができない。","a":1,"e":"申込みと契約の場所が異なるときは申込みの場所で判断する。媒介業者Bの事務所は事務所等に当たる（宅建業法37条の2、施行規則16条の5）。","m":"申込みの場所で判定"},{"f":"業法","t":"クーリング・オフ","ref":"R07-40-ウ","s":"宅建業者Aが自ら売主となる宅地の売買で、宅建業者でない買主Cが、媒介業者Bの提案によりCの自宅で買受けの申込みをし、クーリング・オフについて告げられないまま10日後にAの事務所で契約した場合、Cは解除できない。","a":0,"e":"自宅は買主が自ら申し出た場合に限り事務所等となる。本件は該当せず、告知もないため8日間は進行しておらず解除できる（宅建業法37条の2）。","m":"業者提案の自宅はCO可"},{"f":"業法","t":"クーリング・オフ","ref":"R07-40-エ","s":"宅建業者Aが自ら売主となり、宅建業者Bが媒介する宅地の売買において、買主にクーリング・オフについて告げる書面には、売主Aの商号又は名称、住所及び免許証番号を記載しなければならないが、媒介業者Bの商号や免許証番号の記載は必要とされない。","a":1,"e":"告知書面に記載が必要なのは売主業者の商号・住所・免許証番号等であり、媒介業者の情報は必要的記載事項ではない（施行規則16条の6）。","m":"告知書面は売主の情報"},{"f":"業法","t":"免許","ref":"R07-41-1","s":"甲県知事の免許を受けた宅地建物取引業者Aが、免許を受けてから1年以内に事業を開始しないときは、甲県知事は、情状にかかわらず、Aの免許を取り消さなければならない。","a":1,"e":"免許後1年以内に事業を開始しない、又は引き続き1年以上事業を休止したときは、免許権者は免許を取り消さなければならない（宅建業法66条1項6号）。","m":"1年開始なしは必要的取消し"},{"f":"業法","t":"免許","ref":"R07-41-3","s":"宅地建物取引業者でない法人Cが、甲県に本店、乙県に支店を有し、乙県の支店でのみ新たに宅地建物取引業を営もうとする場合、Cは乙県知事の免許を受けなければならない。","a":0,"e":"支店で宅建業を営めば本店も事務所となる。事務所が2以上の都道府県にあるため国土交通大臣の免許が必要（宅建業法3条1項）。","m":"支店で営業なら本店も事務所"},{"f":"業法","t":"免許","ref":"R07-41-4","s":"甲県知事の免許を受けた宅地建物取引業者Dが、甲県内の事務所を廃止して乙県内にのみ事務所を設置する場合、Dは甲県知事に廃業の届出をするとともに、乙県知事に免許換えの申請をしなければならない。","a":0,"e":"乙県知事に免許換えを申請すればよく、新免許を受けると旧免許は失効するので廃業の届出は不要（宅建業法7条）。","m":"免許換えに廃業届は不要"},{"f":"業法","t":"宅建士","ref":"R07-42-イ","s":"宅地建物取引士は、勤務先である宅地建物取引業者の商号又は名称に変更があった場合、変更の登録の申請とあわせて、宅地建物取引士証の書換え交付を申請しなければならない。","a":0,"e":"勤務先の商号・名称は変更の登録事項だが、宅建士証の記載事項ではないため書換え交付は不要（宅建業法20条）。","m":"勤務先変更は証の書換え不要"},{"f":"業法","t":"宅建士","ref":"R07-42-ウ","s":"宅地建物取引士は、事務の禁止処分を受けていない場合でも、宅地建物取引士証の有効期間が満了したときは、速やかに、その宅地建物取引士証を交付を受けた都道府県知事に返納しなければならない。","a":1,"e":"登録が消除されたとき又は宅建士証が効力を失ったときは、速やかに交付を受けた知事に返納する（宅建業法22条の2第6項）。","m":"失効したら返納"},{"f":"業法","t":"宅建士","ref":"R07-42-エ","s":"甲県知事の登録を受けている宅地建物取引士が乙県内の事務所に勤務するようになった場合、乙県知事への登録の移転を申請することができるが、申請しなければならないわけではない。","a":1,"e":"登録の移転は他県の事務所に従事する場合に申請できる任意の手続であり、義務ではない（宅建業法19条の2）。","m":"登録の移転は任意"},{"f":"業法","t":"重要事項説明","ref":"R07-43-イ","s":"宅地建物取引業者が建物の貸借を媒介する場合において、その建物が建築工事完了前のものであるときは、完了時の形状・構造について重要事項として説明する必要はなく、売買の場合に限り説明すれば足りる。","a":0,"e":"工事完了前の建物は、貸借でも完了時の主要構造部・内装外装の構造又は仕上げ・設備の設置及び構造を説明する（宅建業法35条1項5号、施行規則16条）。","m":"未完成は貸借でも完成時を説明"},{"f":"業法","t":"重要事項説明","ref":"R07-43-ウ","s":"宅地建物取引業者が建物の貸借を媒介する場合、敷金その他いかなる名義をもって授受されるかを問わず、契約終了時において精算することとされている金銭の精算に関する事項を説明しなければならない。","a":1,"e":"敷金等、名目を問わず契約終了時に精算する金銭の精算に関する事項は、貸借の重要事項である（施行規則16条の4の3）。","m":"敷金精算は貸借の重説"},{"f":"業法","t":"重要事項説明","ref":"R07-43-エ","s":"宅地建物取引業者が宅地の売買を媒介する場合、その宅地が津波防災地域づくりに関する法律の津波防護施設区域内にあるときは、同法による制限の概要を説明しなければならない。","a":1,"e":"津波防護施設区域内では行為に管理者の許可が必要となるため、その制限の概要は法令上の制限として説明事項となる（宅建業法35条1項2号）。","m":"津波防護施設区域も説明"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R07-45-2","s":"宅地建物取引業者が新築住宅の売買の媒介をする場合にも、自ら売主となる場合と同様に、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。","a":0,"e":"資力確保措置の義務を負うのは、自ら売主として宅建業者でない買主に新築住宅を引き渡す宅建業者のみで、媒介業者は負わない（履行法11条）。","m":"資力確保は売主業者だけ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R07-45-3","s":"住宅販売瑕疵担保責任保険契約を締結した宅地建物取引業者は、新築住宅の引渡しから10年間、構造耐力上主要な部分の瑕疵によって生じた損害に限って保険金を請求することができる。","a":0,"e":"保険の対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵の両方であり、前者に限られない（履行法2条）。","m":"構造＋雨水の2つ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R07-45-4","s":"住宅販売瑕疵担保責任保険契約を締結した宅地建物取引業者及びその新築住宅の買主は、指定住宅紛争処理機関に対し、当該住宅の売買契約に関する紛争のあっせん、調停又は仲裁を申請することができる。","a":1,"e":"保険付き住宅の売主・買主は、指定住宅紛争処理機関の特別住宅紛争処理（あっせん・調停・仲裁）を利用できる（履行法33条）。","m":"保険付きはADRを利用可"},{"f":"税他","t":"土地・建物","ref":"R07-49-1","s":"川沿いの低地に川が運んで堆積した土砂からなる地盤は、締まりがよく地耐力が大きいため、地盤改良などをしなくても、鉄筋コンクリート造の建物など重い構造物を支えるのに適している。","a":0,"e":"低地の新しい堆積地盤は細かい土や有機物を含み軟弱で、圧密沈下等が起きやすい。重い建物には地盤改良や杭が必要。","m":"低地の堆積土は軟弱"},{"f":"税他","t":"土地・建物","ref":"R07-49-2","s":"海岸付近に分布する砂州や砂丘は、粒径のそろった砂で構成されていることが多いため、地下水位が浅い場所では、地震の揺れによって液状化現象が生じやすい地形であるといえる。","a":1,"e":"粒径のそろった砂質土で、地下水で飽和していると液状化が起きやすい。砂州・砂丘はその条件に当てはまりやすい。","m":"そろった砂＋浅い水位＝液状化"},{"f":"税他","t":"土地・建物","ref":"R07-49-4","s":"台地は低地よりも古い時代に形成された地盤であり、一般に土砂が締め固まっていて構造物を支える強度を有するうえ、周囲の低地より高いため水害に対しても比較的安全である。","a":1,"e":"台地・段丘は洪積層で締まっており地耐力があり、周囲の低地より高く浸水しにくいため、一般に宅地に適する。","m":"台地は古くて強い"},{"f":"税他","t":"土地・建物","ref":"R07-50-1","s":"建築物の構造材料として用いられる鋼は、一般に、含まれる炭素量が多くなるほど軟らかく粘り強い性質となり、その一方で引張強さなどの強度は小さくなるという性質をもっている。","a":0,"e":"炭素量が多いほど硬く引張強さは増すが、粘りが減りもろくなる。炭素量が少ないほど軟らかく粘り強い。","m":"炭素多い＝硬くもろい"},{"f":"税他","t":"土地・建物","ref":"R07-50-2","s":"鋼材は強度が高く粘りもある構造材料であるが、高温になると強度が大きく低下し、またさびやすいため、鉄骨造の建物では耐火被覆や塗装・めっき等の防錆処理を施す必要がある。","a":1,"e":"鋼材は高温で強度が大きく低下し、また酸素や水分でさびるため、耐火被覆と防錆処理が必要となる。","m":"鉄骨は火とさびに弱い"},{"f":"税他","t":"土地・建物","ref":"R07-50-4","s":"建築物の構造材料として用いられる鋼材の密度は、木材やコンクリートの密度よりも大きく、同じ体積で比較すると、これら三つの材料の中では鋼材が最も重い材料であるといえる。","a":1,"e":"密度の目安は鋼材約7.85g/cm³、コンクリート約2.3g/cm³、木材約0.5g/cm³で、鋼材が最も大きい。","m":"鋼が一番重い"},{"f":"権利","t":"意思表示・行為能力","ref":"H23-01-1","s":"売主Aから土地を買ったBが、将来の地価高騰を見込んでいたのに値上がりしなかった場合、その事情が契約時に表示されていれば、Bは錯誤を理由に契約の「無効」を主張できる。","a":0,"e":"現行民法では錯誤の効果は無効ではなく取消し。基礎事情の錯誤は、その事情が表示され重要なものであれば取り消せる（95条）。","m":"錯誤は無効でなく取消し"},{"f":"権利","t":"意思表示・行為能力","ref":"H23-01-2","s":"買主Bが第三者Cにだまされて土地の購入を申し込んだ場合、売主Aがその詐欺の事実を知っていたときでも、Bは売買契約を取り消すことができない。","a":0,"e":"第三者による詐欺は、相手方が詐欺を知り又は知ることができたときに取り消せる。Aが知っていれば取消し可（96条2項）。","m":"第三者詐欺は相手の悪意・有過失"},{"f":"権利","t":"物権変動・対抗","ref":"H23-01-3","s":"AがBの詐欺により土地をBに売り、Aが契約を取り消した後に、BがDにその土地を売却してDが先に所有権移転登記をした場合、AはDから土地を取り戻せない。","a":1,"e":"取消し後の第三者とは、二重譲渡と同様に対抗関係となり、先に登記を備えた者が優先する（177条、判例）。","m":"取消し後は登記の先後"},{"f":"権利","t":"意思表示・行為能力","ref":"H23-01-4","s":"AがBの強迫により土地をBに売り、その後BがEに転売した場合、Aが強迫を理由に契約を取り消せば、Eが強迫の事実を知らず過失もなかったとしても、AはEに取消しを対抗できる。","a":1,"e":"強迫による取消しは、取消し前の第三者に対し善意無過失でも対抗できる。詐欺（96条3項）のような第三者保護規定はない。","m":"強迫は第三者にも勝てる"},{"f":"権利","t":"意思表示・行為能力","ref":"H23-02-1","s":"停止条件付きの売買契約で、条件が成就すると不利益を受ける当事者が故意にその成就を妨げた場合、相手方は条件が成就したものとみなすことができる。","a":1,"e":"条件成就で不利益を受ける者が故意に成就を妨げたときは、相手方は条件成就とみなせる（130条1項）。","m":"妨害したら成就とみなす"},{"f":"権利","t":"意思表示・行為能力","ref":"H23-02-2","s":"停止条件付きの売買契約の買主が、条件の成否が未定の間に死亡した場合、その買主の地位は相続人に相続されず、契約は効力を失う。","a":0,"e":"条件の成否未定の間の権利義務も、一般の規定に従い処分・相続・保存・担保に供することができる（129条）。","m":"条件付きの権利も相続OK"},{"f":"権利","t":"意思表示・行為能力","ref":"H23-02-3","s":"停止条件付き売買契約の売主が、条件の成否未定の間に相手方の期待を害する行為をしたとしても、条件成就前の行為である以上、損害賠償責任を負うことはない。","a":0,"e":"条件付法律行為の当事者は、成否未定の間、条件成就で相手方が得る利益を害してはならず、害すれば賠償責任を負い得る（128条）。","m":"未定の間も相手の期待を守る"},{"f":"権利","t":"共有・相隣","ref":"H23-03-1","s":"共有者の一人はいつでも共有物の分割を請求できるが、共有者間で5年を超えない期間内であれば、分割をしない旨の契約をすることができる。","a":1,"e":"共有物はいつでも分割請求できるが、5年以内の期間で不分割特約を結べる（256条1項）。更新も5年以内。","m":"不分割特約は5年まで"},{"f":"権利","t":"共有・相隣","ref":"H23-03-2","s":"共有物の分割について協議が調わず裁判所に請求した場合、現物分割も賠償分割もできないとき、又は分割で価格を著しく減少させるおそれがあるときは、裁判所は競売を命じることができる。","a":1,"e":"裁判所による分割は現物分割・賠償分割が原則で、それができないか価格を著しく減らすおそれがあれば競売を命じられる（258条）。","m":"最後の手段は競売"},{"f":"権利","t":"共有・相隣","ref":"H23-03-3","s":"共有地を第三者が不法に占拠している場合、共有者の一人は、他の共有者の同意を得なくても、単独でその第三者に対し妨害排除を請求できる。","a":1,"e":"不法占拠者への妨害排除請求は保存行為に当たり、各共有者が単独でできる（252条5項）。","m":"保存行為は単独で"},{"f":"権利","t":"共有・相隣","ref":"H23-03-4","s":"共有者の一人が他の共有者と協議せずに共有建物全体を単独で使用している場合、他の共有者は、各自単独で、その共有者に対し当然に建物の明渡しを請求できる。","a":0,"e":"使用中の共有者も持分に基づく使用権原があるため、他の共有者は当然には明渡しを請求できない（判例）。持分超過分の対価償還は請求し得る（249条2項）。","m":"当然には明渡し不可"},{"f":"権利","t":"抵当権・担保","ref":"H23-04-1","s":"根抵当権者は、後順位抵当権者がいる場合、確定した元本の利息については最後の2年分に限り、根抵当権を行使することができる。","a":0,"e":"根抵当権は、確定した元本・利息・損害金の全部について極度額の範囲内で行使できる（398条の3）。最後の2年分の制限は普通抵当権のもの。","m":"根抵当は極度額まで"},{"f":"権利","t":"抵当権・担保","ref":"H23-04-2","s":"元本の確定前に根抵当権者から被担保債権に属する個別の債権を譲り受けた者は、その債権について根抵当権を行使することができない。","a":1,"e":"確定前の根抵当権には随伴性がなく、個別の債権を取得しても根抵当権は移らない（398条の7第1項）。","m":"確定前は随伴しない"},{"f":"権利","t":"抵当権・担保","ref":"H23-04-3","s":"元本確定期日の定めがない根抵当権について、根抵当権設定者は、設定の時から3年を経過すれば、元本の確定を請求することができる。","a":1,"e":"確定期日の定めがなければ、設定者は設定から3年経過後に確定を請求でき、請求から2週間で確定する（398条の19第1項）。","m":"設定者は3年で確定請求"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H23-05-1","s":"AのBに対する代金債権に譲渡禁止の特約があり、譲受人Cがその特約を重大な過失により知らなかった場合でも、AからCへの債権譲渡そのものは有効である。","a":1,"e":"譲渡制限特約があっても債権譲渡は有効（466条2項）。悪意・重過失の譲受人に対しては、債務者が履行を拒める（同3項）。","m":"特約違反でも譲渡は有効"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H23-05-2","s":"AがBに対する代金債権をCに譲渡した場合、AからBへの通知が確定日付のある証書によらなくても、CはBに対して債権の譲受けを主張できる。","a":1,"e":"債務者への対抗要件は譲渡人の通知か債務者の承諾で足り、確定日付は不要。確定日付は第三者対抗要件（467条）。","m":"債務者には通知だけで可"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H23-05-3","s":"債権譲渡の通知前から債務者BがAに対する貸金債権を有していた場合、その弁済期が通知後に到来したとしても、Bは譲受人Cに対し相殺を主張できる。","a":1,"e":"債務者は対抗要件具備時より前に取得した譲渡人への債権による相殺を譲受人に対抗でき、弁済期の先後は問わない（469条1項）。","m":"通知前取得なら相殺OK"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H23-05-4","s":"債権が二重に譲渡され、いずれも確定日付のある証書で債務者に通知された場合、譲受人間の優劣は、通知の確定日付の先後によって決まる。","a":0,"e":"確定日付のある通知が複数ある場合の優劣は、確定日付の先後ではなく、通知が債務者に到達した日時の先後で決まる（判例）。","m":"優劣は到達の先後"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H23-06-1","s":"賃貸人Aの債権者CがAのBに対する賃料債権を差し押さえた場合、賃借人Bは、差押え前に取得したAに対する債権であれば、弁済期の先後を問わず相殺をCに対抗できる。","a":1,"e":"差押え前に取得した債権による相殺は、弁済期の先後にかかわらず差押債権者に対抗できる（511条1項）。","m":"差押え前取得なら相殺OK"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H23-06-2","s":"抵当権者Dが物上代位により賃料債権を差し押さえた場合、賃借人Bは、抵当権設定登記の後に取得した賃貸人に対する債権による相殺をDに対抗できる。","a":0,"e":"物上代位の差押え後は、抵当権設定登記後に取得した債権による相殺を抵当権者に対抗できない（判例）。登記で物上代位が公示されているため。","m":"登記後取得の相殺は負け"},{"f":"権利","t":"賃貸借","ref":"H23-06-3","s":"抵当権者が物上代位により賃料債権を差し押さえた後に賃貸借が終了し建物が明け渡された場合、未払賃料は敷金の充当によりその限度で当然に消滅し、抵当権者にもそれを対抗できる。","a":1,"e":"敷金は明渡し時に未払賃料に当然充当され、物上代位による差押え後でも抵当権者に対抗できる（判例、622条の2）。","m":"敷金充当は差押えに勝つ"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H23-06-4","s":"賃貸人Aが賃料債権をFに譲渡してBに通知した場合、通知前にBがAに対する債権を取得して相殺適状にあったとしても、通知後はBはFに相殺を主張できない。","a":0,"e":"対抗要件具備時より前に取得した譲渡人への債権による相殺は、譲受人に対抗できる（469条1項）。","m":"通知前取得なら相殺OK"},{"f":"権利","t":"賃貸借","ref":"H23-07-1","s":"建物賃借人Bが賃貸人Aの承諾を得てCに転貸した場合、AはCに対し、BがAに支払うべき賃料の範囲内で、賃料を直接自分に支払うよう請求できる。","a":1,"e":"適法な転借人は賃貸人に直接義務を負い、賃借人の債務の範囲を限度とする（613条1項）。","m":"転借人は直接払う義務"},{"f":"権利","t":"賃貸借","ref":"H23-07-2","s":"建物賃貸人の先取特権は、賃借人がその建物に備え付けた動産のほか、適法に転貸された場合の転借人の動産や転貸人が受けるべき転貸賃料にも及ぶ。","a":1,"e":"賃貸人の先取特権は、転貸の場合、転借人の動産と転貸人が受けるべき金銭にも及ぶ（313条、314条）。","m":"先取特権は転貸料にも"},{"f":"権利","t":"賃貸借","ref":"H23-07-3","s":"適法な転貸借がある場合、賃貸人と賃借人が賃貸借を合意解除しても、解除当時に賃貸人が賃借人の債務不履行による解除権を持っていた場合を除き、転借人に対抗できない。","a":1,"e":"合意解除は転借人に対抗できないが、その当時賃貸人が債務不履行による解除権を有していたときは別（613条3項）。","m":"合意解除は転借人に勝てない"},{"f":"権利","t":"賃貸借","ref":"H23-07-4","s":"賃借人の賃料不払いを理由に賃貸借を解除する場合、賃貸人は、事前に転借人へ通知して賃料を代わりに支払う機会を与えなければ解除できない。","a":0,"e":"債務不履行解除にあたり、転借人に通知し代払いの機会を与える必要はない（判例）。転貸借は返還請求時に終了する。","m":"転借人への催告は不要"},{"f":"権利","t":"不法行為・請負・委任","ref":"H23-08-1","s":"Bに雇われた運転手の交通事故でAがけがをした場合、AがBに対して持つ損害賠償請求権は、AB間の契約ではなく不法行為（使用者責任）に基づいて発生する。","a":1,"e":"被用者が事業の執行で他人に損害を与えたとき、使用者は賠償責任を負う（715条）。契約関係がなくても生じる法定の債権。","m":"使用者責任は不法行為"},{"f":"権利","t":"不法行為・請負・委任","ref":"H23-08-2","s":"AがBから買主を探すあっせんを引き受け、Aの媒介で売買が成立した場合、AのBに対する報酬請求権は、AB間の媒介契約に基づいて発生する。","a":1,"e":"媒介の依頼は準委任契約にあたり、報酬請求権はその契約（特約）から生じる（656条、648条）。","m":"媒介報酬は契約から"},{"f":"権利","t":"意思表示・行為能力","ref":"H23-08-3","s":"AB間の土地売買契約が錯誤を理由に取り消された場合に、AとBが互いに負う代金返還や登記抹消などの原状回復義務は、売買契約に基づいて発生する義務である。","a":0,"e":"取消しにより契約は初めから無効となり、原状回復義務は契約ではなく法律の規定により生じる（121条、121条の2）。","m":"原状回復は法律の効果"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H23-08-4","s":"Aが、BのDに対する借金をBの依頼なく弁済した場合、AがBに対して取得する求償権や代位による権利は、AB間の契約に基づくものではない。","a":1,"e":"依頼のない第三者弁済の求償権は事務管理等により、代位は弁済により法律上当然に生じる（499条）。AB間の契約は不要。","m":"第三者弁済は法定の権利"},{"f":"権利","t":"不法行為・請負・委任","ref":"H23-09-1","s":"新築建物に建て替えが必要なほどの重大な欠陥がある場合、買主は、その欠陥を生じさせた工事施工者に対し、不法行為に基づき建て替え費用相当額の賠償を請求できることがある。","a":1,"e":"建物の基本的な安全性を損なう欠陥について、施工者は契約関係のない買主にも不法行為責任を負う（判例）。","m":"施工者にも不法行為責任"},{"f":"権利","t":"不法行為・請負・委任","ref":"H23-09-3","s":"重大な欠陥で倒壊の具体的なおそれがある建物でも、現実に倒壊していなければ、買主が居住していた利益は建て替え費用の賠償額から控除される。","a":0,"e":"倒壊の具体的おそれがあり社会経済的価値がない建物では、居住利益を損害額から控除できない（最判平成22年6月17日）。","m":"危険な家の居住利益は引かない"},{"f":"権利","t":"不法行為・請負・委任","ref":"H23-09-4","s":"重大な欠陥のため社会経済的価値がないと評価される建物について、買主が建て替え費用相当額の賠償を求める場合、それまでの居住利益は損害額から控除できない。","a":1,"e":"社会経済的価値がない建物での居住は利益とはいえず、損害額から控除しない（最判平成22年6月17日）。","m":"価値ゼロなら控除なし"},{"f":"権利","t":"相続","ref":"H23-10-2","s":"事業資金として1,000万円を借り入れているAがCと養子縁組をした場合、養子となったCは、Aの借入金債務についてAと連帯して返済の責任を負う。","a":0,"e":"養子縁組をしても、養子が養親の生前の債務を連帯して負うことはない。相続が開始して初めて承継の問題となる。","m":"養子でも連帯責任なし"},{"f":"権利","t":"相続","ref":"H23-10-3","s":"Aの死亡後、相続人DとEの遺産分割協議で唯一の不動産をDが取得すると決めた場合、借入金債務について定めがなくても、債務の全部をDが承継する。","a":0,"e":"金銭債務は相続開始と同時に法定相続分で当然に分割承継され、不動産の取得者が当然に全部を負うわけではない（判例）。","m":"借金は相続分で当然分割"},{"f":"権利","t":"相続","ref":"H23-10-4","s":"多額の借入金債務を負っていたAが死亡し、唯一の相続人Fが単純承認をした場合、Fはその債務の存在を知らなかったとしても、Aの借入金債務を承継する。","a":1,"e":"単純承認をすると、無限に被相続人の権利義務を承継し、債務を知っていたかは問わない（920条）。","m":"単純承認は借金も全部"},{"f":"権利","t":"借地","ref":"H23-11-1","s":"建物の種類や用途を制限する借地条件が、法令による土地利用規制の変更などで実情に合わなくなった場合、協議が調わなければ、裁判所は当事者の申立てにより借地条件を変更できる。","a":1,"e":"法令変更など事情の変更で借地条件が相当でなくなったときは、裁判所が当事者の申立てで借地条件を変更できる（借地借家法17条1項）。","m":"借地条件は裁判所が変更"},{"f":"権利","t":"借地","ref":"H23-11-2","s":"借地契約の更新後、借地権者が残存期間を超えて存続する建物を再築することにやむを得ない事情があるのに地主が承諾しない場合、借地権者は裁判所に承諾に代わる許可を求められる。","a":1,"e":"更新後の再築でやむを得ない事情があれば、裁判所は借地権者の申立てで地主の承諾に代わる許可を与えられる（借地借家法18条）。","m":"更新後の再築は裁判所許可"},{"f":"権利","t":"借地","ref":"H23-11-3","s":"借地権者が借地上の建物を第三者に譲渡しようとする場合、地主が賃借権の譲渡を承諾しないときは、その第三者が裁判所に承諾に代わる許可を申し立てることができる。","a":0,"e":"任意譲渡の場合に申立てができるのは借地権者であり、譲受人となる第三者ではない（借地借家法19条1項）。","m":"任意譲渡は借地権者が申立て"},{"f":"権利","t":"借地","ref":"H23-11-4","s":"競売で借地上の建物を取得した第三者は、地主が賃借権の譲渡を承諾しない場合、裁判所に承諾に代わる許可を申し立てることができる。","a":1,"e":"競売・公売の場合は建物の取得者が申し立てられる。代金支払後2か月以内に限られる（借地借家法20条）。","m":"競売なら買受人が申立て"},{"f":"権利","t":"借家","ref":"H23-12-1","s":"AがBに建物を賃貸する契約において、賃借人Bが造作買取請求権をあらかじめ放棄する旨の特約は、その契約が定期建物賃貸借でなくても有効である。","a":1,"e":"造作買取請求権の規定（借地借家法33条）は強行規定とされておらず、排除する特約は有効。","m":"造作買取は特約で排除OK"},{"f":"権利","t":"借家","ref":"H23-12-2","s":"AがBに建物を期間2年の定期建物賃貸借で貸す場合、期間満了による終了の通知を賃貸人Aがしなくても契約が終了する旨の特約は有効である。","a":0,"e":"期間1年以上の定期借家では期間満了の1年前から6か月前までに終了通知が必要で、これに反する賃借人に不利な特約は無効（借地借家法38条）。","m":"終了通知は省略できない"},{"f":"権利","t":"借家","ref":"H23-12-3","s":"法令により一定期間経過後に取り壊すことが明らかな建物を賃貸する場合、取壊し事由を記載した書面等で契約すれば、取壊し時に賃貸借が終了する旨を定められる。","a":1,"e":"取壊し予定の建物の賃貸借では、事由を記載した書面（電磁的記録も可）により、取壊し時に終了する特約ができる（借地借家法39条）。","m":"取壊し予定は書面で特約"},{"f":"権利","t":"借家","ref":"H23-12-4","s":"一時使用のために建物を賃貸することが明らかな場合、借地借家法の借家に関する規定は適用されず、民法の賃貸借の規定が適用される。","a":1,"e":"一時使用目的の建物賃貸借には借地借家法第3章は適用されない（同法40条）。期間・解約は民法による。","m":"一時使用は民法だけ"},{"f":"権利","t":"区分所有法","ref":"H23-13-1","s":"区分所有建物の規約を保管している管理者は、利害関係人から規約の閲覧を請求された場合、正当な理由がある場合を除き、その閲覧を拒むことができない。","a":1,"e":"規約の保管者は、利害関係人の請求があれば正当な理由がある場合を除き閲覧を拒めない（区分所有法33条2項）。","m":"閲覧は正当理由なく拒めない"},{"f":"権利","t":"区分所有法","ref":"H23-13-2","s":"区分所有建物において規約に別段の定めがない場合、各共有者の共用部分の持分は、その有する専有部分の床面積の割合によって定まる。","a":1,"e":"共用部分の持分は専有部分の床面積割合による（区分所有法14条1項）。床面積は壁その他の内側線で囲まれた水平投影面積。","m":"持分は専有の床面積割合"},{"f":"権利","t":"区分所有法","ref":"H23-13-3","s":"一部共用部分に関する事項で区分所有者全員の利害に関係しないものは、区分所有者全員の規約に定めがない限り、一部共用者の規約で定めることができる。","a":1,"e":"一部共用部分の事項で全員の利害に関係しないものは、全員の規約で定める場合を除き、一部共用者の規約で定められる（区分所有法30条2項）。","m":"一部共用は一部の規約で"},{"f":"権利","t":"区分所有法","ref":"H23-13-4","s":"集会で決議すべき事項について、区分所有者全員が書面又は電磁的方法により合意したときは、集会の決議があったものとみなされる。","a":1,"e":"全員の書面又は電磁的方法による合意があれば、書面又は電磁的方法による決議があったものとみなされる（区分所有法45条2項）。","m":"全員合意で書面決議"},{"f":"権利","t":"不動産登記法","ref":"H23-14-1","s":"土地の合筆の登記に関して、所有権の登記がある土地と所有権の登記がない土地とは、隣接していても合筆の登記をすることができない。","a":1,"e":"所有権の登記の有無が異なる土地どうしは合筆できない（不動産登記法41条）。権利関係が混乱するため。","m":"登記あり・なしは合筆不可"},{"f":"権利","t":"不動産登記法","ref":"H23-14-2","s":"権利の変更の登記又は更正の登記は、登記上の利害関係を有する第三者の承諾がある場合、又はそのような第三者がいない場合に限り、付記登記によってすることができる。","a":1,"e":"利害関係人の承諾があるか利害関係人がいなければ付記登記で、そうでなければ主登記でする（不動産登記法66条）。","m":"承諾ありなら付記登記"},{"f":"権利","t":"不動産登記法","ref":"H23-14-3","s":"信託財産である不動産について信託の登記をする場合、受託者が申請しないときは、受益者又は委託者が受託者に代わってその登記を申請することができる。","a":1,"e":"受益者又は委託者は、受託者に代わって信託の登記を申請できる（不動産登記法99条）。","m":"信託登記は受益者も代位可"},{"f":"権利","t":"不動産登記法","ref":"H23-14-4","s":"所有権移転請求権の仮登記がされている場合、その仮登記の抹消は、登記権利者と登記義務者が共同して申請しなければならず、仮登記名義人が単独で申請することはできない。","a":0,"e":"仮登記名義人は単独で仮登記の抹消を申請できる。利害関係人も仮登記名義人の承諾があれば単独で申請できる（不動産登記法110条）。","m":"仮登記抹消は名義人単独で"},{"f":"法令","t":"国土利用計画法","ref":"H23-15-1","s":"事後届出に係る土地の利用目的について都道府県知事の勧告に基づき利用目的が変更された場合、知事は、必要があればその土地の処分についてあっせん等の措置を講じなければならない義務を負う。","a":0,"e":"勧告に基づき利用目的が変更された場合のあっせん等は「講ずるよう努めなければならない」努力義務にとどまる（国土利用計画法27条）。","m":"あっせんは努力義務"},{"f":"法令","t":"都市計画法","ref":"H23-16-1","s":"都市計画法上、都市計画区域は一の市町村の区域内に限って指定することができ、必要があっても複数の市町村の区域にわたって指定することはできない。","a":0,"e":"都市計画区域は必要があれば市町村の区域外にわたって指定でき、複数の都府県にわたる場合は国土交通大臣が指定する（5条）。","m":"区域は市町村をまたげる"},{"f":"法令","t":"都市計画法","ref":"H23-16-2","s":"都市計画区域外に指定される準都市計画区域では、都市計画に用途地域や風致地区を定めることはできるが、高度利用地区を定めることはできない。","a":1,"e":"準都市計画区域で定められる地域地区は用途地域・特別用途地区・特定用途制限地域・高度地区・景観地区・風致地区等で、高度利用地区は不可（8条2項）。","m":"準都計に高度利用地区なし"},{"f":"法令","t":"都市計画法","ref":"H23-16-3","s":"都市計画区域について区域区分が定められている場合、市街化区域だけでなく市街化調整区域も含め、そのすべての区域に用途地域を定めなければならない。","a":0,"e":"市街化区域には少なくとも用途地域を定めるが、市街化調整区域には原則として定めない（13条1項7号）。","m":"調整区域は原則用途地域なし"},{"f":"法令","t":"都市計画法","ref":"H23-16-4","s":"都市計画法上、すべての都市計画区域について、都道府県は市街化区域と市街化調整区域との区分（区域区分）を必ず定めなければならない。","a":0,"e":"区域区分は必要があるときに定めることができ、定めない非線引き都市計画区域もある（7条1項）。","m":"線引きは任意が原則"},{"f":"法令","t":"開発許可","ref":"H23-17-1","s":"開発許可を申請しようとする者は、あらかじめ、開発行為に関係がある既存の公共施設の管理者と協議し、その同意を得なければならない。","a":1,"e":"既存の公共施設の管理者とは協議して同意を得る必要がある。新たに設置される公共施設の管理者とは協議のみ（32条）。","m":"既存は同意・新設は協議"},{"f":"法令","t":"開発許可","ref":"H23-17-2","s":"市街化調整区域内で、農産物の貯蔵に必要な建築物を建築するために行う開発行為は、農林漁業用の建築物として開発許可が不要である。","a":0,"e":"許可不要の農林漁業用建築物は農産物の生産・集荷用や生産資材の貯蔵用等に限られ、農産物の貯蔵用は原則として許可が必要（29条、施行令20条）。","m":"農産物の貯蔵は許可必要"},{"f":"法令","t":"開発許可","ref":"H23-17-3","s":"主として自己の居住の用に供する住宅を建築する目的で行う開発行為には、開発許可の基準のうち排水施設に関する基準は適用されない。","a":0,"e":"自己居住用でも排水施設の基準は適用される。自己居住用で適用されないのは道路・公園等の空地の基準など（33条）。","m":"自己居住用も排水基準あり"},{"f":"法令","t":"開発許可","ref":"H23-17-4","s":"非常災害のため必要な応急措置として行う開発行為は、市街化調整区域内で行うものであっても、都道府県知事の開発許可を受ける必要はない。","a":1,"e":"非常災害の応急措置としての開発行為は、区域や規模を問わず許可不要（29条1項10号）。","m":"非常災害は許可不要"},{"f":"法令","t":"建築基準法","ref":"H23-18-1","s":"建築物が防火地域と準防火地域にわたる場合、防火壁で区画されているなどの例外を除き、その建築物の全部について防火地域内の建築物に関する規定が適用される。","a":1,"e":"建築物が複数の地域にわたるときは、原則として厳しい方の地域の規定が建築物全体に適用される（65条2項）。","m":"またがりは厳しい方"},{"f":"法令","t":"建築基準法","ref":"H23-18-3","s":"防火地域内にある建築物の屋上に看板を設ける場合、その看板の主要な部分を難燃材料で造り、又はおおえば足り、不燃材料とする必要はない。","a":0,"e":"防火地域内の屋上看板や高さ3m超の看板は、主要な部分を不燃材料で造り又はおおわなければならない（64条）。","m":"屋上看板は不燃材料"},{"f":"法令","t":"建築基準法","ref":"H23-18-4","s":"防火地域又は準防火地域内にある建築物で、外壁が耐火構造のものについては、その外壁を隣地境界線に接して設けることができる。","a":1,"e":"防火・準防火地域内で外壁が耐火構造の建築物は、外壁を隣地境界線に接して設けられる（63条）。","m":"耐火外壁は境界に接してOK"},{"f":"法令","t":"建築基準法","ref":"H23-19-1","s":"他の地域地区の指定や特定行政庁の許可がない場合、第二種住居地域内では、工場に併設するものであっても、倉庫業を営む倉庫を建築することはできない。","a":1,"e":"倉庫業を営む倉庫は準住居地域以上で建築でき、第二種住居地域以下では建築できない（48条、別表第二）。","m":"倉庫業倉庫は準住居から"},{"f":"法令","t":"建築基準法","ref":"H23-19-2","s":"都市計画区域内で、幅員4m未満の道は、現に建築物が立ち並んでいれば、特定行政庁の指定がなくても建築基準法上の道路とみなされる。","a":0,"e":"幅員4m未満の道が道路とみなされるには、基準時に建築物が立ち並んでいることに加え、特定行政庁の指定が必要（42条2項）。","m":"2項道路は指定が必要"},{"f":"法令","t":"建築基準法","ref":"H23-19-3","s":"前面道路の幅員が12m未満の敷地では、都市計画で定められた容積率と、前面道路の幅員に一定の数値を乗じた容積率のうち、小さい方が容積率の限度となる。","a":1,"e":"前面道路幅員12m未満の場合、幅員×法定乗数（住居系4/10等）の値と都市計画の容積率のうち厳しい方が適用される（52条2項）。","m":"12m未満は厳しい方"},{"f":"法令","t":"建築基準法","ref":"H23-19-4","s":"建蔽率の限度が10分の8とされている地域内で、かつ防火地域内にある耐火建築物等については、建蔽率の限度が10分の9に緩和される。","a":0,"e":"建蔽率8/10の地域で防火地域内の耐火建築物等は、建蔽率の制限が適用されない（53条6項）。1/10加算ではない。","m":"8割地域×防火×耐火は無制限"},{"f":"法令","t":"盛土規制法","ref":"H23-20-1","s":"都道府県知事は、擁壁の設置等の措置により造成宅地防災区域の指定の事由がなくなったと認めるときは、その指定の全部又は一部を解除する。","a":1,"e":"造成宅地防災区域は、擁壁等の設置で指定事由がなくなれば解除される（盛土規制法）。","m":"事由がなくなれば解除"},{"f":"法令","t":"盛土規制法","ref":"H23-20-2","s":"都道府県知事は、偽りその他不正な手段により宅地造成等に関する工事の許可を受けた者に対し、その許可を取り消すことができる。","a":1,"e":"不正な手段で許可を受けた者に対し、知事は許可を取り消すことができる（盛土規制法）。裁量的な取消し。","m":"不正手段の許可は取消し可"},{"f":"法令","t":"盛土規制法","ref":"H23-20-3","s":"宅地造成等工事規制区域内の土地の所有者・管理者・占有者は、工事を行った造成主でなくても、その土地を常時安全な状態に維持するよう努めなければならない。","a":1,"e":"規制区域内の土地の所有者等は、造成主かどうかを問わず、災害が生じないよう常時安全な状態に維持する努力義務を負う（盛土規制法）。","m":"所有者等も安全維持の努力"},{"f":"法令","t":"土地区画整理法","ref":"H23-21-1","s":"組合施行の土地区画整理事業で、設立認可の公告後、換地処分の公告までの間に施行地区内で事業の施行の障害となる土地の形質の変更をしようとする者は、組合の許可を受けなければならない。","a":0,"e":"許可権者は施行者（組合）ではなく都道府県知事（市の区域内では市長）であり、知事は施行者の意見を聴く（76条1項）。","m":"建築等の許可は知事"},{"f":"法令","t":"土地区画整理法","ref":"H23-21-2","s":"土地区画整理事業の換地計画では、公共施設の用に供している宅地について、換地の位置や地積等に特別の考慮を払って換地を定めることができる。","a":1,"e":"公共施設の用に供している宅地等については、位置・地積等に特別の考慮を払い換地を定められる（95条1項）。","m":"公共施設用地は特別考慮"},{"f":"法令","t":"土地区画整理法","ref":"H23-21-3","s":"土地区画整理事業では、事業の施行の費用に充てるため、換地計画において一定の土地を換地として定めず、保留地として定めることができる。","a":1,"e":"施行費用に充てるなどのため、換地計画で一定の土地を換地とせず保留地とできる（96条）。","m":"費用に充てる保留地"},{"f":"法令","t":"土地区画整理法","ref":"H23-21-4","s":"施行者は、換地処分を行う前であっても、換地計画に基づき換地処分を行うため必要がある場合には、施行地区内の宅地について仮換地を指定できる。","a":1,"e":"施行者は換地処分前に、土地の区画形質の変更工事や換地処分のため必要があれば仮換地を指定できる（98条1項）。","m":"仮換地は処分前に指定可"},{"f":"法令","t":"農地法","ref":"H23-22-1","s":"相続人が遺産分割協議によって被相続人の農地を取得する場合には、その取得について農地法第3条第1項の許可を受ける必要がある。","a":0,"e":"相続や遺産分割による農地の取得は3条許可が不要。ただし遅滞なく農業委員会への届出が必要（3条の3）。","m":"相続・遺産分割は許可不要"},{"f":"法令","t":"農地法","ref":"H23-22-2","s":"個人が裁判所の競売手続により農地を農地のまま買い受けて所有権を取得する場合には、農地法第3条第1項の許可を受ける必要はない。","a":0,"e":"競売による取得も権利移転に当たり、3条許可が必要。許可不要の例外には含まれない。","m":"競売でも許可必要"},{"f":"法令","t":"農地法","ref":"H23-22-3","s":"農業者が自己所有の農地のうち2アール未満を、自らの農作物の育成のための農業用施設の敷地に転用する場合、農地法第4条第1項の許可は不要である。","a":1,"e":"耕作者が自己の農地を2アール未満の農業用施設に転用する場合は、4条許可が不要（施行規則29条）。","m":"2アール未満の農業施設は不要"},{"f":"法令","t":"農地法","ref":"H23-22-4","s":"市街化区域内の農地を宅地に転用する目的で取得する場合、工事完了後遅滞なく農業委員会に届け出れば、農地法第5条第1項の許可は不要である。","a":0,"e":"市街化区域内の特例は、あらかじめ農業委員会に届け出た場合に限られる。事後の届出では足りない（5条1項）。","m":"市街化区域は「あらかじめ」届出"},{"f":"税他","t":"印紙税・登録免許税","ref":"H23-23-1","s":"土地の賃貸借契約書で契約期間を定めていなかったため、後日「契約期間は10年とする」旨を記載した覚書を作成した場合、その覚書は印紙税の課税文書に当たる。","a":1,"e":"契約期間など重要事項を補充・変更する覚書や念書も契約書に含まれ、課税文書となる。","m":"覚書・念書も契約書"},{"f":"税他","t":"印紙税・登録免許税","ref":"H23-23-2","s":"土地の売買で、後日正式な契約書を作成することを明記した仮契約書を作成した場合、それは正式な契約書ではないので印紙税は課されない。","a":0,"e":"仮契約書でも契約の成立を証明する文書であれば課税文書となる。後日正式文書を作る予定でも同じ。","m":"仮契約書も課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"H23-23-4","s":"土地の交換契約書に、交換する土地の価額として7,000万円と1億円がそれぞれ記載されている場合、印紙税の記載金額は差額の3,000万円である。","a":0,"e":"交換契約書で双方の価額が記載されていれば、いずれか高い方（1億円）が記載金額。差額のみの記載なら差額。","m":"交換は高い方"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H23-24-2","s":"市町村長は、不動産鑑定士又は不動産鑑定業者に、市町村内の固定資産の状況を毎年少なくとも1回実地に調査させなければならない。","a":0,"e":"実地調査をさせるのは固定資産評価員又は固定資産評価補助員であり、不動産鑑定士等ではない（地方税法408条）。","m":"実地調査は評価員"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H23-24-3","s":"家屋の賃借人は、その家屋の敷地である土地について、固定資産課税台帳のうち当該権利の目的である固定資産の記載事項を閲覧することができる。","a":1,"e":"借地人・借家人等も、権利の目的である固定資産について台帳の閲覧ができる。家屋の借家人は敷地も対象（地方税法382条の2）。","m":"借家人も敷地を閲覧可"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H23-24-4","s":"市町村は、独立行政法人が所有する固定資産に対しては、その用途や法人の種類を問わず、一切固定資産税を課することができない。","a":0,"e":"独立行政法人も一定の非課税規定に当たる場合を除き課税される。一律に課税できないのは国・地方公共団体等。","m":"独法は課税されうる"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H23-25-1","s":"地価公示法上、公示区域は都市計画区域内に限って定めることができ、都市計画区域外の土地について標準地を選定することはできない。","a":0,"e":"公示区域は都市計画区域のほか、土地取引が相当程度見込まれる区域として省令で定める区域にも定められる（地価公示法2条）。","m":"都市計画区域外もOK"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H23-25-2","s":"土地収用法等により土地を収用できる事業を行う者は、公示区域内の土地を事業用に取得する場合、その取得価格を定めるにあたり公示価格を規準としなければならない。","a":1,"e":"収用事業者が公示区域内の土地を取得する際は、公示価格を規準としなければならない（地価公示法9条）。","m":"収用事業者は公示価格が規準"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H23-25-3","s":"都市及びその周辺の地域等で土地の取引を行う者は、取引の対象となる土地に類似する標準地の公示価格により取引を行わなければならない。","a":0,"e":"取引を行う者は公示価格を指標として取引を行うよう努めなければならない、という努力義務にとどまる（地価公示法1条の2）。","m":"取引は指標とする努力義務"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H23-25-4","s":"土地鑑定委員会は、標準地の正常な価格を判定したときは、標準地の価格のほか、標準地及びその周辺の土地の利用の現況などを官報で公示しなければならない。","a":1,"e":"公示事項は、標準地の所在・価格・地積・形状・利用の現況・周辺の土地の利用の現況など（地価公示法6条）。","m":"価格以外も公示"},{"f":"業法","t":"免許","ref":"H23-26-1","s":"宅地建物取引業者が同一県内に本店と支店の2つ以上の事務所を設置して事業を営む場合は、国土交通大臣の免許を受けなければならない。","a":0,"e":"事務所が一つの都道府県内だけにあれば、その数にかかわらず都道府県知事の免許。2以上の都道府県にあれば大臣免許（3条1項）。","m":"同一県内なら知事免許"},{"f":"業法","t":"免許","ref":"H23-26-2","s":"他人が所有するマンションを借り上げ、自ら転貸人となって不特定多数の者に反復継続して転貸する場合、宅地建物取引業の免許が必要である。","a":0,"e":"自ら貸主（転貸主を含む）として貸借を行うことは宅地建物取引業の「取引」に当たらず、免許は不要（2条2号）。","m":"自ら貸主は免許不要"},{"f":"業法","t":"免許","ref":"H23-26-3","s":"事務所を乙県にのみ設置する会社が、丙県内の物件について反復継続して貸借の代理を行う場合、乙県知事の免許を受ければ足りる。","a":1,"e":"免許権者は事務所の所在地で決まり、物件の所在地や業務を行う場所では決まらない（3条1項）。","m":"免許は事務所の場所で"},{"f":"業法","t":"免許","ref":"H23-26-4","s":"宅地建物取引業の免許の有効期間は、免許権者によって異なり、国土交通大臣の免許は5年、都道府県知事の免許は3年とされている。","a":0,"e":"免許の有効期間は、国土交通大臣免許・都道府県知事免許のいずれも5年である（3条2項）。","m":"免許はどちらも5年"},{"f":"業法","t":"免許の基準","ref":"H23-27-1","s":"C社が役員Dの拘禁刑判決を理由に免許を取り消された場合、その取消しの前60日以内にC社の役員であったBがA社の役員に就任しても、A社はそれだけで免許を受けられなくなるわけではない。","a":1,"e":"役員の欠格による取消しは、不正手段や業務停止違反などの悪質な取消しではないため、その前60日以内の役員は欠格とならない（5条1項2号）。","m":"悪質取消しだけ60日ルール"},{"f":"業法","t":"免許の基準","ref":"H23-27-2","s":"役員の中に詐欺罪により罰金の刑に処せられ、その刑の執行を終えてから5年を経過しない者がいる法人は、宅地建物取引業の免許を受けることができない。","a":0,"e":"罰金刑で欠格となるのは宅建業法違反や傷害・暴行・脅迫・背任等の罪に限られ、詐欺罪の罰金は含まれない（5条1項）。","m":"詐欺の罰金は欠格外"},{"f":"業法","t":"免許の基準","ref":"H23-27-3","s":"役員の中に暴力団員による不当な行為の防止等に関する法律に規定する暴力団員がいる法人は、同法に違反していなくても免許を受けられない。","a":1,"e":"暴力団員又は暴力団員でなくなってから5年を経過しない者が役員にいる法人は、免許を受けられない（5条1項）。","m":"暴力団員の役員は即アウト"},{"f":"業法","t":"監督・罰則","ref":"H23-27-4","s":"宅地建物取引業者が免許を受けてから1年以内に事業を開始しない場合、免許権者は、情状にかかわらずその免許を取り消さなければならない。","a":1,"e":"免許後1年以内に事業を開始しない、又は引き続き1年以上事業を休止したときは、免許を取り消さなければならない（66条1項6号）。","m":"1年開始しない→必要的取消"},{"f":"業法","t":"事務所・案内所","ref":"H23-28-1","s":"一団の分譲建物について売買契約の申込みのみを受ける案内所を設置した場合でも、その案内所には成年者である専任の宅地建物取引士を1人以上置かなければならない。","a":1,"e":"契約の締結又は申込みを受ける案内所には、専任の宅地建物取引士を1人以上置く必要がある（31条の3、規則15条の5の2）。","m":"申込みだけでも専任必要"},{"f":"業法","t":"宅建士","ref":"H23-28-2","s":"18歳未満の未成年者は、法定代理人から宅地建物取引業の営業に関する許可を受けていても、宅地建物取引士の登録を受けることができない。","a":0,"e":"宅建業の営業に関し成年者と同一の行為能力を有する未成年者は登録を受けられる（18条1項1号）。","m":"営業許可ありなら登録可"},{"f":"業法","t":"宅建士","ref":"H23-28-3","s":"宅地建物取引士は、買主に対して重要事項の説明をするときは、相手方から請求があった場合に限り、宅地建物取引士証を提示すればよい。","a":0,"e":"重要事項の説明をするときは、請求の有無にかかわらず宅地建物取引士証を提示しなければならない（35条4項）。","m":"重説では必ず提示"},{"f":"業法","t":"宅建士","ref":"H23-28-4","s":"宅地建物取引士証の交付を受けようとする者は、原則として都道府県知事指定の講習を受けなければならないが、試験合格の日から1年以内に交付を受ける場合は不要である。","a":1,"e":"取引士証の交付申請前6か月以内の法定講習が必要だが、合格日から1年以内の交付申請なら不要（22条の2第2項）。","m":"合格1年以内は講習不要"},{"f":"業法","t":"宅建士","ref":"H23-29-1","s":"不正の手段で免許を受けたとして免許を取り消された法人で、役員ではなく一般の従業者として働いていた者は、その取消しの日から5年を経過するまで取引士の登録を受けることができない。","a":0,"e":"5年の登録制限がかかるのは、取消し前60日以内に役員だった者に限られる。単なる従業者には制限がない（法18条1項）。","m":"制限は役員だけ"},{"f":"業法","t":"宅建士","ref":"H23-29-2","s":"取引士が傷害罪で罰金刑に処せられ登録を消除された場合、その者は登録消除の日から5年を経過するまで、新たに取引士の登録を受けることができない。","a":0,"e":"起算点は登録消除の日ではなく、刑の執行を終わり、又は執行を受けることがなくなった日から5年である（法18条1項）。","m":"起算は刑の終了日"},{"f":"業法","t":"宅建士","ref":"H23-29-3","s":"甲県知事の登録を受けている取引士が、住所を乙県に移し乙県所在の宅建業者の事務所に勤務することになった場合、乙県知事に登録の移転を申請しなければならない。","a":0,"e":"登録の移転は任意であり義務ではない。住所や勤務先の業者名が変わったときに義務となるのは変更の登録である（法19条の2・20条）。","m":"移転は任意、変更は義務"},{"f":"業法","t":"宅建士","ref":"H23-29-4","s":"甲県知事登録の取引士が乙県知事への登録の移転とともに取引士証の交付を申請した場合、乙県知事は移転前の取引士証の残りの有効期間を有効期間とする取引士証を交付する。","a":1,"e":"登録移転に伴う新しい取引士証の有効期間は、移転前の取引士証の有効期間の残りを引き継ぐ。新たに5年となるわけではない（法22条の2第5項）。","m":"移転後は残存期間"},{"f":"業法","t":"営業保証金","ref":"H23-30-1","s":"甲県知事免許の宅建業者が新たに支店を設置した場合、支店で営業を始めた後、設置から3月以内に営業保証金を供託してその旨を届け出れば足りる。","a":0,"e":"新設した支店の分の営業保証金を供託し、その旨を免許権者に届け出た後でなければ、その支店で事業を開始できない（法26条2項・25条5項）。","m":"供託・届出が先、営業は後"},{"f":"業法","t":"営業保証金","ref":"H23-30-2","s":"免許の日から3月以内に営業保証金供託の届出がないときは、免許権者は届出をすべき旨を催告しなければならず、催告到達から1月以内に届出がなければ免許を取り消すことができる。","a":1,"e":"免許後3月以内に届出がなければ催告が必要で、催告到達後1月以内に届出がないときは免許を取り消せる（任意的取消し、法25条6項・7項）。","m":"3月で催告、1月で取消可"},{"f":"業法","t":"営業保証金","ref":"H23-30-3","s":"宅建業者が一部の支店を廃止したことにより超過した営業保証金を取り戻す場合は、廃業の場合と異なり、還付請求権者に対する公告をする必要はない。","a":0,"e":"一部の事務所廃止による取戻しも、廃業の場合と同様に6月以上の期間を定めた公告が必要である（法30条2項）。","m":"支店廃止でも公告必要"},{"f":"業法","t":"媒介契約","ref":"H23-31-1","s":"宅建業者が宅地の売買について依頼者と一般媒介契約を締結した場合、その宅地を所定の期間内に指定流通機構へ登録しなければならない。","a":0,"e":"指定流通機構への登録義務があるのは専任媒介契約と専属専任媒介契約であり、一般媒介契約には登録義務はない（法34条の2第5項）。","m":"登録義務は専任だけ"},{"f":"業法","t":"媒介契約","ref":"H23-31-2","s":"宅建業者が専任媒介契約を締結した場合でも、依頼者から指定流通機構への登録は不要との申出があれば、登録しない旨の特約を定めて登録しないことができる。","a":0,"e":"専任媒介では依頼者の申出があっても登録義務は免除されず、依頼者に不利な特約は無効となる（法34条の2第5項・10項）。","m":"申出があっても登録"},{"f":"業法","t":"媒介契約","ref":"H23-31-3","s":"専任媒介契約に基づき宅地を指定流通機構に登録した宅建業者は、登録を証する書面を遅滞なく依頼者に引き渡さなければならない。","a":1,"e":"指定流通機構が発行する登録を証する書面は、遅滞なく依頼者に引き渡す義務がある（法34条の2第6項）。","m":"登録証明は遅滞なく渡す"},{"f":"業法","t":"媒介契約","ref":"H23-31-4","s":"専任媒介契約に基づき指定流通機構に登録した宅地について売買契約が成立した場合でも、宅建業者は指定流通機構にその旨を通知する必要はない。","a":0,"e":"登録物件の売買・交換の契約が成立したときは、遅滞なく登録番号・取引価格・成立日を指定流通機構に通知しなければならない（法34条の2第7項）。","m":"成約したら通知"},{"f":"業法","t":"重要事項説明","ref":"H23-32-1","s":"建物の貸借の媒介を行う場合、借賃以外に授受される金銭については、その額を説明すれば足り、授受の目的まで重要事項として説明する必要はない。","a":0,"e":"借賃以外に授受される金銭は、その額だけでなく授受の目的も重要事項として説明しなければならない（法35条1項7号）。","m":"額と目的はセット"},{"f":"業法","t":"重要事項説明","ref":"H23-32-2","s":"昭和60年に新築工事に着手した建物の売買を媒介する場合、その建物が耐震診断を受けていても、耐震診断の内容を重要事項として説明する必要はない。","a":1,"e":"耐震診断の内容の説明が必要なのは昭和56年6月1日より前に新築工事に着手した建物であり、それ以降の建物は説明不要である。","m":"S56.6.1以降は不要"},{"f":"業法","t":"重要事項説明","ref":"H23-32-3","s":"宅地が造成宅地防災区域内にあるかどうかは、宅地の売買の媒介では重要事項として説明が必要だが、宅地の貸借の媒介では説明する必要はない。","a":0,"e":"造成宅地防災区域内にあるか否かは、売買だけでなく貸借の場合も、建物・宅地とも重要事項として説明が必要である。","m":"造成宅地防災区域は貸借も"},{"f":"業法","t":"重要事項説明","ref":"H23-32-4","s":"宅建業者が自ら売主として宅建業者でない者に建物を売却する場合、建物の引渡しの時期は重要事項として説明しなければならない。","a":0,"e":"引渡しの時期は37条書面の必要的記載事項であり、35条の重要事項説明の対象ではない。","m":"引渡時期は37条"},{"f":"業法","t":"重要事項説明","ref":"H23-33-1","s":"宅建業者の代表者は、取引士でなくても、その業者に勤める取引士の取引士証を相手方に示せば、重要事項の説明を行うことができる。","a":0,"e":"重要事項の説明は取引士自身が行わなければならず、取引士でない者は他人の取引士証を示しても説明できない（法35条1項・4項）。","m":"説明は取引士本人だけ"},{"f":"業法","t":"重要事項説明","ref":"H23-33-2","s":"取引士証の有効期間が満了している者であっても、取引士の登録が残っていれば、更新を受ける前に重要事項の説明を行うことができる。","a":0,"e":"取引士証の有効期間が満了すると取引士ではなくなり、更新を受けるまで重要事項の説明などの取引士の事務は行えない。","m":"期限切れは説明不可"},{"f":"業法","t":"重要事項説明","ref":"H23-33-3","s":"宅建業者でない買主が了承していれば、売主側の宅建業者は、売買契約を締結した後に取引士による重要事項の説明を行っても差し支えない。","a":0,"e":"重要事項の説明は契約が成立するまでの間に行わなければならず、買主の了承があっても契約後の説明は違反となる（法35条1項）。","m":"説明は契約前"},{"f":"業法","t":"重要事項説明","ref":"H23-33-4","s":"取引士が記名した重要事項説明書を取引士でない従業者が買主に交付し、その後契約締結前に取引士が重要事項を説明することは、宅建業法に違反しない。","a":1,"e":"35条書面には取引士の記名が必要だが、交付自体は取引士以外が行ってよい。説明は契約成立前に取引士が行えば足りる。","m":"交付は誰でも、説明は取引士"},{"f":"業法","t":"37条書面","ref":"H23-34-1","s":"抵当権に基づく差押えの登記がされている建物の貸借を媒介する場合、その登記の内容は35条書面だけでなく37条書面にも記載しなければならない。","a":0,"e":"登記された権利の種類・内容は35条書面の記載事項であり、37条書面の記載事項ではない。","m":"登記の内容は35条だけ"},{"f":"業法","t":"37条書面","ref":"H23-34-2","s":"宅建業者が交付する37条書面には取引士の記名が必要であるが、その書面の作成や相手方への交付は、取引士でない従業者に行わせることができる。","a":1,"e":"37条書面で取引士が行う必要があるのは記名のみであり、作成・交付は取引士以外の従業者が行ってもよい（法37条3項）。","m":"37条は記名だけ取引士"},{"f":"業法","t":"37条書面","ref":"H23-34-3","s":"天災その他不可抗力による損害の負担に関する定めがある場合、その内容は37条書面に記載しなければならないが、35条書面に記載する必要はない。","a":1,"e":"危険負担（不可抗力による損害の負担）の定めは、定めがあるときの37条書面の記載事項であり、35条書面の記載事項ではない。","m":"天災の負担は37条"},{"f":"業法","t":"37条書面","ref":"H23-34-4","s":"宅建業者が同じ取引について作成する場合、35条書面に記名する取引士と37条書面に記名する取引士は、同一の者でなければならない。","a":0,"e":"35条書面と37条書面に記名する取引士が同一人物である必要はない。それぞれ取引士であれば足りる。","m":"記名者は別人でよい"},{"f":"業法","t":"クーリング・オフ","ref":"H23-35-ア","s":"宅建業者が自ら売主となる売買契約に違約金の定めがある場合、買主がクーリング・オフにより契約を解除したときは、売主の業者はその違約金を請求できる。","a":0,"e":"クーリング・オフによる解除では、業者は損害賠償や違約金の支払いを請求できない（法37条の2第1項）。","m":"クーリング・オフは無償"},{"f":"業法","t":"クーリング・オフ","ref":"H23-35-イ","s":"買主がクーリング・オフにより売買契約を解除した場合、自ら売主である宅建業者は、受領していた手付の倍額を買主に償還しなければならない。","a":0,"e":"クーリング・オフでは、業者は受領した手付金その他の金銭を速やかに返還すれば足り、倍額を償還する必要はない（法37条の2第3項）。","m":"返すのは受け取った額"},{"f":"業法","t":"クーリング・オフ","ref":"H23-35-ウ","s":"宅建業者でない買主が喫茶店で買受けの申込みをし、後日、売主業者の事務所で売買契約を締結した場合、所定の要件を満たせば買主はクーリング・オフができる。","a":1,"e":"クーリング・オフの可否は申込みをした場所で判断する。喫茶店は事務所等に当たらないため、契約が事務所でも解除できる。","m":"判断は申込みの場所"},{"f":"業法","t":"広告","ref":"H23-36-1","s":"宅建業者は、未完成の宅地や建物について、開発許可や建築確認などの許可等の処分があった後でなければ、その工事に係る宅地・建物の売買その他の業務に関する広告をしてはならない。","a":1,"e":"広告開始時期の制限。工事完了前は開発許可・建築確認等の処分後でなければ広告できない（宅建業法33条）。","m":"広告は確認が出てから"},{"f":"業法","t":"広告","ref":"H23-36-2","s":"宅建業者が複数区画のある分譲宅地を何回かに分けて広告する場合、最初の広告で取引態様の別を明示していれば、2回目以降の広告では取引態様の別を明示しなくてもよい。","a":0,"e":"取引態様の別は広告をするたびに明示が必要。回数を分けても省略はできない（宅建業法34条1項）。","m":"態様明示は毎回"},{"f":"業法","t":"報酬","ref":"H23-36-3","s":"宅建業者が建物の貸借の媒介に関して広告をした場合、依頼者から広告の依頼がなくても、報酬とは別に、その広告料金に相当する額を依頼者から受け取ることができる。","a":0,"e":"報酬とは別に広告料金を受け取れるのは、依頼者の依頼で行った広告に限られる（報酬告示）。","m":"広告料は依頼があれば"},{"f":"業法","t":"免許","ref":"H23-36-4","s":"免許を取り消された宅建業者が、取消し前に建物の売買の広告をしていた場合、取消し後も、その広告に応じた者と新たに売買契約を締結する目的の範囲内では宅建業者とみなされる。","a":0,"e":"みなし業者となるのは、すでに締結した契約に基づく取引を結了する目的の範囲内に限られ、新たな契約締結はできない（宅建業法76条）。","m":"結了のためだけ業者"},{"f":"業法","t":"8種制限","ref":"H23-37-2","s":"宅建業者が自ら売主として宅建業者でない買主に建築工事完了後の建物を売る場合、代金の10分の2の手付金を受領するときは、その受領前に手付金等の保全措置を講じなければならない。","a":1,"e":"完成物件では代金の10分の1又は1,000万円を超える手付金等を受領する場合に、受領前の保全措置が必要となる（法41条の2）。","m":"完成物件は1割超で保全"},{"f":"業法","t":"8種制限","ref":"H23-37-3","s":"自ら売主の宅建業者が宅建業者でない買主と、損害賠償の予定額と違約金を合算して代金の10分の1とする特約を定めることは、宅建業法上できる。","a":1,"e":"損害賠償の予定額と違約金の合計は代金の10分の2が上限であり、10分の1であれば定めることができる（法38条）。","m":"合算で2割まで"},{"f":"業法","t":"8種制限","ref":"H23-37-4","s":"自ら売主の宅建業者が宅建業者でない買主と、契約不適合の通知期間を「買主が不適合を発見した時から2年」とする特約を定めることは有効である。","a":1,"e":"民法の「知った時から1年」より買主に有利なので有効。買主に不利な特約は、通知期間を引渡しから2年以上とするものを除き無効（法40条）。","m":"買主に有利ならOK"},{"f":"業法","t":"8種制限","ref":"H23-38-1","s":"宅建業者Aが自ら売主として未完成マンションを一般の買主に売り、手付金等の保全措置として銀行等と保証委託契約を結ぶ場合、少なくともAが受領した手付金等の返還債務の全部を保証するものでなければならない。","a":1,"e":"保証委託契約による保全措置では、銀行等が受領済み手付金等の返還債務の全部を連帯保証する内容でなければならない（宅建業法41条）。","m":"保証は全額"},{"f":"業法","t":"8種制限","ref":"H23-38-2","s":"宅建業者が自ら売主として未完成物件を一般の買主に売る場合、手付金等の保全措置として結ぶ保証保険契約の保険期間は、少なくとも保険契約の成立時から建築工事の完了時までであればよい。","a":0,"e":"保険期間は少なくとも保証保険契約成立時から物件の引渡しまでとする必要がある。工事完了まででは足りない（宅建業法41条）。","m":"保険期間は引渡しまで"},{"f":"業法","t":"8種制限","ref":"H23-38-3","s":"宅建業者Aが自ら売主として未完成マンション（代金3,000万円）を一般の買主に売る場合、契約前に受け取った申込証拠金が契約後に代金に充当されるときは、その額も保全措置の対象となる。","a":1,"e":"手付金等は代金に充当される金銭で引渡し前に支払うもの。契約後に代金に充当される申込証拠金も含まれる（宅建業法41条）。","m":"充当されれば手付金等"},{"f":"業法","t":"8種制限","ref":"H23-38-4","s":"宅建業者Aが自ら売主として代金3,000万円の未完成マンションを一般の買主に売り、手付金200万円を受領済みの場合、その後に引渡し前の中間金を受け取るときは中間金についても保全措置が必要である。","a":1,"e":"未完成物件は代金の5％（150万円）超または1,000万円超で保全が必要。手付金だけで超えており中間金も対象（宅建業法41条）。","m":"未完成は5％超で保全"},{"f":"業法","t":"8種制限","ref":"H23-39-1","s":"宅建業者が自ら売主となり宅建業者に代金3,000万円で宅地を売る場合、違約金を1,000万円と定め、買主の債務不履行で解除したときにこれを受領しても違反しない。","a":1,"e":"損害賠償額の予定等の制限（代金の2割まで）を含む8種制限は、業者間の取引には適用されない（法78条2項）。","m":"業者間は8種制限なし"},{"f":"業法","t":"8種制限","ref":"H23-39-2","s":"宅建業者が自ら売主となる宅地の割賦販売で、宅建業者でない買主の賦払金の支払いが遅れた場合、20日の期間を定めて書面で催告すれば契約を解除できる。","a":0,"e":"割賦販売の契約解除や残金の一括請求には、30日以上の相当の期間を定めて書面で催告する必要がある（法42条）。","m":"割賦の催告は30日以上"},{"f":"業法","t":"8種制限","ref":"H23-39-3","s":"代金3,000万円の宅地の割賦販売で、引渡し後に宅建業者でない買主から300万円しか支払われていない場合、売主業者は登記を自己名義のままにしておける。","a":1,"e":"割賦販売では、受領額が代金の10分の3以下であれば所有権移転登記を留保できる。300万円は900万円以下である（法43条）。","m":"3割以下なら登記留保可"},{"f":"業法","t":"8種制限","ref":"H23-39-4","s":"宅建業者同士の宅地の売買で、売主業者の契約不適合責任の通知期間を「引渡しの日から1年」とする特約を定めても、宅建業法に違反しない。","a":1,"e":"担保責任の特約の制限は8種制限の一つであり、買主も宅建業者である取引には適用されない（法78条2項）。","m":"業者間は特約自由"},{"f":"業法","t":"報酬","ref":"H23-40-1","s":"居住用建物（月額賃料10万円）の賃貸借の媒介で、借主から承諾を得ていない場合、借主から受け取れる媒介報酬は5万5,000円（税込）が上限である。","a":1,"e":"居住用建物の賃貸借の媒介では、依頼者の一方から受け取れる報酬は、承諾がない限り借賃の半月分（税込0.55か月分）までである。","m":"居住用は承諾なしで半月"},{"f":"業法","t":"報酬","ref":"H23-40-2","s":"月額賃料10万円の建物賃貸借で、貸主代理の業者Aが貸主から11万円を受領した場合、借主側の媒介業者Cは借主から報酬を受け取ることができない。","a":1,"e":"賃貸借で複数の業者が関与しても、受け取れる報酬の合計は借賃の1か月分（税込1.1か月分）が上限であり、Aが上限まで受領済みである。","m":"賃貸は全体で1か月分"},{"f":"業法","t":"報酬","ref":"H23-40-3","s":"店舗用建物の賃貸借で返還されない権利金が授受される場合、宅建業者は権利金の額を売買代金とみなして報酬限度額を計算することができる。","a":1,"e":"居住用建物以外の賃貸借で権利金の授受があるときは、権利金を売買代金とみなして算出した額を報酬限度額とすることができる。","m":"権利金計算は居住用以外"},{"f":"業法","t":"報酬","ref":"H23-40-4","s":"建物賃貸借の媒介を行った宅建業者は、報酬限度額とは別に、契約書の作成費用を文書作成費の名目で依頼者から受け取ることができる。","a":0,"e":"業者が受け取れるのは報酬限度額内の報酬と、依頼者の依頼による広告料など特別の費用に限られ、契約書作成費は別に受領できない。","m":"作成費は報酬に含む"},{"f":"業法","t":"業務上の規制","ref":"H23-41-ア","s":"宅建業者が自ら売主として建物を販売する際、買主が手付金を用意できなかったため、手付金を貸し付けることで契約の締結を誘引しても、宅建業法には違反しない。","a":0,"e":"手付の貸付けその他信用の供与による契約締結の誘引は禁止。手付の分割受領も同様で、減額は可（宅建業法47条3号）。","m":"手付の貸付けはNG"},{"f":"業法","t":"業務上の規制","ref":"H23-41-イ","s":"宅建業者が建物の販売に際して、私生活の平穏を害する方法で電話勧誘を行い相手方を困惑させた場合、勧誘が短時間であっても宅建業法に違反する。","a":1,"e":"相手方を困惑させる勧誘は、時間の長短にかかわらず禁止されている（宅建業法47条の2第3項、施行規則）。","m":"困惑させたら短くても違反"},{"f":"業法","t":"業務上の規制","ref":"H23-41-ウ","s":"宅建業者が自ら売主として建物の売買契約を結んだ後、買主から手付放棄による契約解除の申出を受けた場合に、正当な理由なくこれを拒むことは宅建業法に違反する。","a":1,"e":"相手方が契約の解除を申し出た際に、正当な理由なく拒んだり妨げたりすることは禁止されている（宅建業法47条の2第3項、施行規則）。","m":"手付解除の拒否は違反"},{"f":"業法","t":"業務上の規制","ref":"H23-41-エ","s":"宅建業者が売買の媒介に際し、契約締結後に買主へ不当に高額の報酬を要求したが、買主に拒まれて要求を取り下げた場合、実際には受領していないので宅建業法に違反しない。","a":0,"e":"不当に高額の報酬を要求する行為自体が禁止されており、受領しなくても要求した時点で違反となる（宅建業法47条2号）。","m":"要求しただけで違反"},{"f":"業法","t":"事務所・案内所","ref":"H23-42-ア","s":"売主の宅建業者A社が宅建業者B社にマンションの販売代理を一括して依頼し、B社が案内所を設置する場合、その案内所についての業務を行う場所の届出はA社がしなければならない。","a":0,"e":"案内所の届出義務を負うのは案内所を設置した業者であり、本問では代理業者のB社が届け出る（宅建業法50条2項）。","m":"届出は設置した業者"},{"f":"業法","t":"事務所・案内所","ref":"H23-42-イ","s":"宅建業者がマンション分譲のために設置した案内所で、売買契約の締結も申込みの受付も行わない場合には、その案内所に標識を掲示する必要はない。","a":0,"e":"案内所には契約・申込みを行うかどうかにかかわらず標識の掲示が必要。専任宅建士は契約等を行う場合に必要（宅建業法50条1項）。","m":"標識はどの案内所にも"},{"f":"業法","t":"事務所・案内所","ref":"H23-42-ウ","s":"甲県知事免許の宅建業者が乙県内にマンション分譲の案内所を設けてそこで契約を行う場合、業務開始日の10日前までに乙県知事にも業務を行う場所の届出をしなければならない。","a":1,"e":"契約等を行う案内所は、免許権者と所在地の知事に業務開始の10日前までに届け出る（宅建業法50条2項、施行規則19条）。","m":"届出は10日前・両知事"},{"f":"業法","t":"保証協会","ref":"H23-43-1","s":"保証協会に加入しようとする宅建業者は、加入の日までに納める弁済業務保証金分担金を、金銭のほか国債などの有価証券で納付することができる。","a":0,"e":"弁済業務保証金分担金は金銭で納付しなければならない。有価証券が使えるのは営業保証金や保証協会が供託する弁済業務保証金である。","m":"分担金は現金のみ"},{"f":"業法","t":"保証協会","ref":"H23-43-2","s":"保証協会は、その社員である宅建業者の取引士その他宅建業の業務に従事し又は従事しようとする者に対して、研修を実施しなければならない。","a":1,"e":"研修の実施は、苦情の解決・弁済業務と並ぶ保証協会の必須業務である（法64条の3第1項）。","m":"研修は協会の必須業務"},{"f":"業法","t":"保証協会","ref":"H23-43-3","s":"保証協会の社員が新たに支店を設置した場合、その設置の日までに追加の弁済業務保証金分担金を納付しなければ社員の地位を失う。","a":0,"e":"新たに事務所を設置したときは、設置した日から2週間以内に追加の分担金を納付すればよい（法64条の9第2項）。","m":"支店追加は2週間以内"},{"f":"業法","t":"保証協会","ref":"H23-43-4","s":"弁済業務保証金から生じた利息・配当金や、準備金で供託した後に社員から納付された還付充当金は、弁済業務保証金準備金に繰り入れなければならない。","a":1,"e":"これらは、還付充当金が納付されない場合に保証協会が供託するための準備金として積み立てることとされている。","m":"利息と穴埋め金は準備金へ"},{"f":"業法","t":"監督・罰則","ref":"H23-44-1","s":"国土交通大臣はすべての宅建業者に、都道府県知事は区域内で宅建業を営む業者に対して、業務の適正な運営のため必要な指導・助言・勧告をすることができる。","a":1,"e":"大臣はすべての業者に、知事は当該区域内で業を営む業者に対して、指導・助言・勧告ができる（法71条）。","m":"大臣は全部、知事は区域内"},{"f":"業法","t":"監督・罰則","ref":"H23-44-2","s":"免許権者が宅建業者に対して指示処分、業務停止処分又は免許取消処分をしようとするときは、あらかじめ公開による聴聞を行わなければならない。","a":1,"e":"宅建業者に対する指示・業務停止・免許取消しのいずれの処分も、事前に公開による聴聞を行う必要がある（法69条）。","m":"処分の前に聴聞"},{"f":"業法","t":"監督・罰則","ref":"H23-44-3","s":"宅建業者が業務に関して景品表示法など宅建業法以外の法令に違反した場合は、宅建業法に基づく指示処分や業務停止処分の対象とはならない。","a":0,"e":"業務に関し他の法令に違反し、宅建業者として不適当と認められるときは、指示処分の対象となる（法65条1項3号）。","m":"他の法令違反も処分対象"},{"f":"業法","t":"監督・罰則","ref":"H23-44-4","s":"事務所の専任の取引士が退職し法定数を欠くことになった宅建業者は、2週間以内に補充などの措置を執らなければならず、怠れば監督処分の対象となる。","a":1,"e":"専任取引士が業務に従事する者5人に1人以上という基準を欠いたときは、2週間以内に必要な措置を執る義務がある（法31条の3第3項）。","m":"専任不足は2週間で補充"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H23-45-1","s":"宅建業者が自ら売主として新築住宅を売る場合、買主が建設業者であれば、宅建業者でなくても住宅販売瑕疵担保保証金の供託などの資力確保措置を講じる必要はない。","a":0,"e":"資力確保措置が不要なのは買主が宅建業者の場合だけ。建設業者は宅建業者ではないので措置が必要（住宅瑕疵担保履行法2条・11条）。","m":"不要は買主が業者のときだけ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H23-45-2","s":"新築住宅を一般の買主に引き渡した宅建業者が、基準日の資力確保措置の状況を届け出なかった場合、その基準日の当日から直ちに新たな新築住宅の売買契約を締結できなくなる。","a":0,"e":"新たな売買契約が禁止されるのは、基準日の翌日から起算して50日を経過した日以後である（住宅瑕疵担保履行法13条）。","m":"届出なしは50日後から禁止"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H23-45-3","s":"自ら売主として新築住宅を販売する宅建業者が保証金の供託をする場合、売買契約を締結するまでに、買主に供託所の所在地等を記載した書面を交付して説明しなければならない。","a":1,"e":"供託所の所在地等は、売買契約締結までに書面（承諾があれば電磁的方法）で説明する必要がある（住宅瑕疵担保履行法15条）。","m":"供託所の説明は契約前"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H23-45-4","s":"住宅販売瑕疵担保責任保険契約は、新築住宅の買主が保険料を支払う約束で保険法人と締結し、引渡しから10年間、住宅の瑕疵による損害について保険金が支払われるものである。","a":0,"e":"保険料を支払う約束をして保険法人と契約するのは売主の宅建業者であり、買主ではない（住宅瑕疵担保履行法2条）。","m":"保険料は売主業者が払う"},{"f":"税他","t":"住宅金融支援機構","ref":"H23-46-2","s":"毎月の返済を利息のみとし元金は死亡時に一括返済する高齢者向け返済特例制度は、機構の証券化支援事業（保証型）で利用される制度である。","a":0,"e":"高齢者向け返済特例は、高齢者が自宅のバリアフリー工事や耐震改修を行う場合の機構の直接融資に設けられた制度である。","m":"高齢者特例は直接融資"},{"f":"税他","t":"住宅金融支援機構","ref":"H23-46-3","s":"証券化支援事業（買取型）では、機構が民間金融機関の長期固定金利住宅ローン債権を買い取って信託し、それを担保とする証券を投資家に発行する。","a":1,"e":"買取型では、機構が買い取った住宅ローン債権を信託し、その信託受益権を担保とするMBS（資産担保証券）を発行して資金を調達する。","m":"買取型は債権買取→MBS"},{"f":"税他","t":"住宅金融支援機構","ref":"H23-46-4","s":"機構は、経済事情の著しい変動などにより住宅ローンの元利金の返済が著しく困難になった者について、償還期間の延長などの貸付条件の変更を行っている。","a":1,"e":"機構は、災害や経済事情の変動で返済が著しく困難になった債務者に対し、返済期間の延長などの条件変更に応じている。","m":"困ったら条件変更"},{"f":"税他","t":"景品表示法","ref":"H23-47-1","s":"50区画の分譲宅地を新聞折込チラシで広告する際、全区画の価格を載せるのが困難なときは、1区画当たりの最低価格・最高価格・最多価格帯とその価格帯の区画数を表示すればよい。","a":1,"e":"分譲宅地の価格はパンフレット等を除き、最低・最高・最多価格帯と区画数で表示できる。10区画未満なら最多価格帯は省略可（表示規約）。","m":"最低・最高・最多で可"},{"f":"税他","t":"景品表示法","ref":"H23-47-2","s":"マンションのモデルルームは表示規約上の「表示」に当たらないので、実際の住戸に付かない豪華な設備や家具を置いても、付属しない旨を明示する必要はない。","a":0,"e":"モデルルームも規制対象の表示に当たる。実際の住戸に付かない設備・家具を置くときはその旨の明示が必要。","m":"モデルルームも表示"},{"f":"税他","t":"景品表示法","ref":"H23-47-3","s":"物件から最寄駅まで実際に歩いて15分かかった場合、道路距離にかかわらず、広告に「最寄駅まで徒歩15分」と表示することができる。","a":0,"e":"徒歩所要時間は道路距離80mにつき1分（端数は1分に切上げ）で算出して表示する。実測の時間では表示できない（表示規約）。","m":"徒歩は80mで1分"},{"f":"税他","t":"景品表示法","ref":"H23-47-4","s":"地元住民が鉄道会社に駅の新設を要請していることが報道されていれば、要請されている新設予定時期を明示して、新駅として広告に表示することができる。","a":0,"e":"新設予定の駅等は、運行主体が公表したものに限り、新設予定時期を明示して表示できる。住民の要請の報道では足りない。","m":"新駅は運行主体の公表"},{"f":"税他","t":"土地・建物","ref":"H23-49-1","s":"住宅地として土地を選ぶ際の立地条件のうち、交通の便や周辺環境よりも前に確認すべき最も基本的な条件は、その土地の地形と地盤に関することである。","a":1,"e":"住宅地の安全性や快適性を左右する最も基本的な条件は地形と地盤であり、まずこれを確認する必要がある。","m":"まず地形と地盤"},{"f":"税他","t":"土地・建物","ref":"H23-49-2","s":"山麓部の土地を住宅地として利用する場合は、土砂災害のおそれがあるため、その背後の地形・地質・地盤について十分に吟味する必要がある。","a":1,"e":"山麓部は背後の斜面からの土砂崩れや土石流のおそれがあるため、背後地の地形・地質・地盤の確認が重要である。","m":"山麓は背後を見る"},{"f":"税他","t":"土地・建物","ref":"H23-49-3","s":"台地や段丘と比べて、低地は一般に津波や地震、洪水などの災害に弱く、防災の観点からは住宅地として好ましくない土地とされる。","a":1,"e":"低地は浸水や液状化などの被害を受けやすい。特に三角州・旧河道・後背低地は注意が必要である。","m":"低地は災害に弱い"},{"f":"税他","t":"土地・建物","ref":"H23-49-4","s":"海を埋め立てた埋立地は一般に海面より数m高い位置にあるが、海面より低いことが多い干拓地と比べると、災害に対してより危険である。","a":0,"e":"逆である。干拓地は海面より低いことが多く、浸水や高潮に弱い。埋立地は海面より数m高く、干拓地より比較的安全。","m":"干拓地のほうが危険"},{"f":"税他","t":"土地・建物","ref":"H23-50-1","s":"建築物のラーメン構造とは、柱と梁を剛に接合して一体化した骨組みの構造であり、鉄筋コンクリート造や鉄骨造の建物で用いられる。","a":1,"e":"ラーメン構造は柱と梁の接合部を剛にして一体化させた骨組みで、RC造や鉄骨造の建物に広く用いられる。","m":"ラーメン＝柱梁一体"},{"f":"税他","t":"土地・建物","ref":"H23-50-2","s":"建築物のトラス式構造とは、直線的で細長い部材を三角形の組合せを単位として組み立てた骨組みの構造であり、橋や屋根などに用いられる。","a":1,"e":"トラスは直線部材を三角形状に組んだ構造で、変形しにくく橋や屋根の小屋組みなどに用いられる。","m":"トラス＝三角形"},{"f":"税他","t":"土地・建物","ref":"H23-50-3","s":"建築物のアーチ式構造は、曲線状の部材で荷重を支える構造であるが、スポーツ施設のような柱のない大空間を構成するのには向かない。","a":0,"e":"アーチ式構造は曲線状の部材で荷重を支える構造で、ドームなど柱のない大空間をつくるのに適している。","m":"アーチは大空間向き"},{"f":"税他","t":"土地・建物","ref":"H23-50-4","s":"建築物の壁式構造とは、柱や梁を設けず、壁体や床版などの平面的な部材で建物の骨組みを構成する構造であり、中低層の住宅などに用いられる。","a":1,"e":"壁式構造は柱・梁を用いず、耐力壁と床などの面で荷重を支える構造で、中低層の集合住宅などに用いられる。","m":"壁式＝壁で支える"},{"f":"権利","t":"意思表示・行為能力","ref":"H24-01-1","s":"AとBが通謀して甲土地をBに仮装譲渡しB名義の登記をした場合、甲土地を差し押さえたBの債権者Cは、民法94条2項の「第三者」に当たる。","a":1,"e":"虚偽表示の目的物を差し押さえた仮装譲受人の債権者は、法律上の利害関係を持つに至った者として94条2項の第三者に当たる（判例）。","m":"差し押さえたら第三者"},{"f":"権利","t":"意思表示・行為能力","ref":"H24-01-2","s":"AがBと通謀してB名義の抵当権を仮装で設定し、Bがその抵当権に善意のCのために転抵当権を設定した場合、Cは民法94条2項の「第三者」に当たる。","a":1,"e":"仮装の抵当権を基礎に転抵当権の設定を受けた者は、虚偽表示の目的について新たに利害関係を持った第三者に当たる（94条2項）。","m":"転抵当権者も第三者"},{"f":"権利","t":"意思表示・行為能力","ref":"H24-01-3","s":"AがBに甲土地を仮装譲渡した場合、甲土地を差し押さえていないものの、Bに金銭を貸し付けていた債権者Cは、民法94条2項の「第三者」に当たる。","a":0,"e":"単に仮装譲受人に金銭を貸しただけの一般債権者は、目的物について法律上の利害関係を持たないため、第三者に当たらない（判例）。","m":"ただの貸主は第三者でない"},{"f":"権利","t":"意思表示・行為能力","ref":"H24-01-4","s":"AとBが通謀して仮装の金銭消費貸借契約を結び、BがAに対する仮装の貸金債権を善意のCに譲渡した場合、Cは民法94条2項の「第三者」に当たる。","a":1,"e":"仮装債権の譲受人は、虚偽表示の目的について新たに法律上の利害関係を持った者として94条2項の第三者に当たる（判例）。","m":"仮装債権の譲受人も保護"},{"f":"権利","t":"代理","ref":"H24-02-1","s":"未成年者が他人から代理権を与えられて代理人として締結した契約は、その未成年者の法定代理人の同意がなければ、本人に対して効力を生じない。","a":0,"e":"代理人は行為能力者である必要はなく、未成年者の代理行為も本人に有効に帰属し、行為能力の制限を理由に取り消せない（民法102条）。","m":"代理人は未成年でもOK"},{"f":"権利","t":"代理","ref":"H24-02-2","s":"法人が代理人を通じて動産を取引した場合、即時取得の要件である善意・無過失は、原則として法人の代表者ではなく代理人について判断する。","a":1,"e":"意思表示の効力に影響する事情は代理人を基準に判断するため、代理人が取引したときの善意・無過失も代理人で判断する（101条、判例）。","m":"善意無過失は代理人基準"},{"f":"権利","t":"代理","ref":"H24-02-3","s":"同一人が売主と買主の双方の代理人として売買契約を締結しても、売主・買主の双方があらかじめ許諾していれば、契約の効果は両者に有効に帰属する。","a":1,"e":"双方代理は原則として無権代理とみなされるが、本人があらかじめ許諾した行為や債務の履行は例外として有効となる（108条1項）。","m":"双方の許諾があれば有効"},{"f":"権利","t":"代理","ref":"H24-02-4","s":"本人から復代理人の選任について許諾を得ていない法定代理人は、やむを得ない事由がなくても、自己の責任で復代理人を選任することができる。","a":1,"e":"法定代理人は自己の責任でいつでも復代理人を選任できる。任意代理人は本人の許諾かやむを得ない事由が必要（104条・105条）。","m":"法定代理人は復代理自由"},{"f":"権利","t":"代理","ref":"H24-04-1","s":"代理権のないBがAの代理人としてA所有の土地をCに売却した場合でも、Aが追認すれば、AC間の売買契約は原則として契約時にさかのぼって有効となる。","a":1,"e":"無権代理行為は本人に効力を生じないが、本人が追認すれば、別段の意思表示がない限り契約時にさかのぼって効力を生じる（113条・116条）。","m":"本人の追認で有効"},{"f":"権利","t":"代理","ref":"H24-04-2","s":"無権代理人Bが本人Aの土地をCに売却した後、Aが死亡してBが単独で相続した場合、Bは本人の地位に基づいて追認を拒絶することができる。","a":0,"e":"無権代理人が本人を単独相続した場合、自ら行った無権代理行為の追認を拒絶することは信義則上許されず、契約は有効となる（判例）。","m":"無権代理人は拒絶不可"},{"f":"権利","t":"代理","ref":"H24-04-3","s":"無権代理人Bが本人Aの土地をCに売却した後、Bが死亡して本人Aが単独で相続した場合、Aは本人の地位に基づいて追認を拒絶することができる。","a":1,"e":"本人が無権代理人を相続しても、本人としての追認拒絶権は失われない。ただし無権代理人の責任は相続しうる（判例）。","m":"本人は拒絶できる"},{"f":"権利","t":"代理","ref":"H24-04-4","s":"無権代理人Bが本人Aの土地を売却した後、Aが死亡しBと他の相続人Dが共同相続した場合、Dが追認しない限り、Bの相続分についても契約は当然には有効とならない。","a":1,"e":"追認権は共同相続人全員に不可分的に帰属するため、全員が共同で追認しない限り、無権代理人の相続分でも当然に有効とはならない（判例）。","m":"共同相続は全員で追認"},{"f":"権利","t":"不法行為・請負・委任","ref":"H24-05-2","s":"請負人が建てた建物に重大な欠陥があり建て替えるほかない場合、注文者は請負人に対し、建替費用相当額の損害賠償を請求することができる。","a":1,"e":"建物に重大な瑕疵（契約不適合）があり建て替えるしかないときは、建替費用相当額の損害賠償請求が認められる（判例）。","m":"建替えしかないなら建替費"},{"f":"権利","t":"不法行為・請負・委任","ref":"H24-05-3","s":"請負の目的物が建物である場合、注文者は、引き渡された建物に契約不適合があることを理由に請負契約を解除することはできない。","a":0,"e":"建物等の解除を制限していた旧635条ただし書は削除され、現在は建物でも債務不履行の一般規定に従い解除できる（541条・542条）。","m":"建物でも解除できる"},{"f":"権利","t":"不法行為・請負・委任","ref":"H24-05-4","s":"請負人が品質に関して契約内容に適合しない建物を引き渡した場合、注文者は原則として不適合を知った時から1年以内に請負人に通知しなければ責任を追及できない。","a":1,"e":"注文者は不適合を知った時から1年以内に通知が必要。引渡し時に請負人が悪意・重過失なら制限はない（民法637条）。","m":"知って1年内に通知"},{"f":"権利","t":"物権変動・対抗","ref":"H24-06-1","s":"A所有の土地をBが占有中、取得時効完成前にAから土地を買って登記したCに対し、その後に時効が完成したBは、登記がなくても時効取得を主張できる。","a":1,"e":"時効完成前に登場した第三者は時効取得者からみて当事者と同様に扱われ、時効取得者は登記なしで所有権を対抗できる（判例）。","m":"完成前の第三者には登記不要"},{"f":"権利","t":"物権変動・対抗","ref":"H24-06-2","s":"借地上の建物を登記している借地人Dがいる土地を買い受けたEは、土地の所有権移転登記を備えていなければ、Dに対して賃貸人として賃料を請求できない。","a":1,"e":"賃貸不動産の譲受人が賃貸人の地位を賃借人に主張するには、所有権移転登記が必要である（民法605条の2第3項）。","m":"新賃貸人は登記が必要"},{"f":"権利","t":"抵当権・担保","ref":"H24-07-1","s":"Aが建物に抵当権の設定登記をした後、建物所有者Bの一般債権者がその建物の賃料債権を差し押さえた。この場合、Aは物上代位によってその賃料債権から一般債権者に優先して弁済を受けることはできない。","a":0,"e":"一般債権者の差押えと抵当権者の物上代位の優劣は、差押命令の第三債務者への送達と抵当権設定登記の先後で決まる（判例）。登記が先のAが優先する。","m":"送達と登記の先後"},{"f":"権利","t":"抵当権・担保","ref":"H24-07-2","s":"Aが抵当権を設定した建物について、被担保債権に債務不履行があったときは、抵当権はその後に生じた建物の賃料などの果実にも効力が及ぶ。","a":1,"e":"抵当権は原則として果実に及ばないが、被担保債権の不履行があれば、その後に生じた果実に及ぶ（民法371条）。","m":"不履行後は賃料にも"},{"f":"権利","t":"抵当権・担保","ref":"H24-07-3","s":"抵当権の目的である建物が火災で焼失した場合、抵当権者は、保険金が払い渡される前に差し押さえれば、建物所有者の火災保険金請求権に物上代位できる。","a":1,"e":"抵当権には物上代位性があり、目的物の滅失で所有者が受ける保険金請求権にも行使できる。払渡し前の差押えが必要（民法372条・304条）。","m":"保険金にも物上代位"},{"f":"権利","t":"抵当権・担保","ref":"H24-07-4","s":"抵当権が設定された建物を所有者から賃借したCが、これを第三者に転貸している場合、抵当権者は原則としてCが受け取る転貸賃料債権に物上代位することができる。","a":0,"e":"判例は、賃借人を所有者と同視できる場合を除き、転貸賃料債権への物上代位を否定する。賃借人は被担保債権の責任を負わないため。","m":"転貸賃料は原則不可"},{"f":"権利","t":"債務不履行・解除","ref":"H24-08-1","s":"契約を結ぶ前に、一方の当事者が信義則上の説明義務に違反して重要な情報を相手方に提供しなかった場合、その者は相手方に対し、債務不履行ではなく不法行為による損害賠償責任を負うことがある。","a":1,"e":"契約締結前の説明義務違反は契約上の債務の不履行ではないため、債務不履行責任は負わず、不法行為責任を負うことがある（判例）。","m":"契約前は不法行為"},{"f":"権利","t":"債務不履行・解除","ref":"H24-08-2","s":"利息付きの金銭消費貸借で利率を定めていなかった場合に、借主が返済を遅滞したときの遅延損害金は、法定利率によって計算する。","a":1,"e":"金銭債務の遅延損害金は法定利率（現在は年3%で3年ごとに見直し）による。約定利率が法定利率を超えるときは約定利率による（民法419条）。","m":"定めなし→法定利率"},{"f":"権利","t":"債務不履行・解除","ref":"H24-08-3","s":"Bが自己所有の甲不動産をAに売却した後、同じ不動産をCにも売却し、Cが先に所有権移転登記を備えた。この場合、AはBに対し債務不履行による損害賠償を請求できる。","a":1,"e":"Cが登記を備えたことでBのAへの引渡し・登記移転は履行不能となる。債務者の責めに帰すべき不能なので損害賠償を請求できる（民法415条）。","m":"二重譲渡は履行不能"},{"f":"権利","t":"債務不履行・解除","ref":"H24-08-4","s":"金銭の借主Bが、予定していた入金がなかったために返済期限を過ぎてしまった場合、Bに帰責事由がなければ、Bは遅延損害金を支払う必要はない。","a":0,"e":"金銭債務の不履行では、債務者は不可抗力をもって抗弁とすることができない。帰責事由がなくても遅延損害金を負う（民法419条3項）。","m":"金銭債務に言い訳なし"},{"f":"権利","t":"不法行為・請負・委任","ref":"H24-09-1","s":"従業員Bが勤務中に事故を起こして歩行者Cに損害を与え、使用者Aも使用者責任を負う場合、BのCに対する損害賠償債務が時効で消滅しても、AのCに対する債務は当然には消滅しない。","a":1,"e":"AとBの賠償債務は連帯債務の関係にあり、弁済等以外の事由は他の債務者に影響しない（相対効、民法441条）。","m":"時効は相対効"},{"f":"権利","t":"不法行為・請負・委任","ref":"H24-09-2","s":"不法行為の被害者が事故で即死した場合は、被害者本人に精神的損害は生じないので、加害者側は被害者の相続人に対して被害者本人の慰謝料を支払う責任を負わない。","a":0,"e":"即死の場合でも被害者本人に慰謝料請求権が発生し、相続人がこれを相続する（判例）。","m":"即死でも慰謝料相続"},{"f":"権利","t":"不法行為・請負・委任","ref":"H24-09-3","s":"使用者責任に基づいて被害者に損害を賠償した使用者Aは、事故を起こした従業員Bに資力がある限り、支払った額の全額を常にBに求償できる。","a":0,"e":"使用者から被用者への求償は、損害の公平な分担の見地から信義則上相当と認められる限度に制限される（判例）。","m":"求償は信義則の範囲"},{"f":"権利","t":"不法行為・請負・委任","ref":"H24-09-4","s":"不法行為の被害者が幼児である場合、その保護者である親に監督上の過失があっても、被害者本人ではないので、過失相殺において考慮されることはない。","a":0,"e":"過失相殺では被害者側の過失も考慮され、被害者と身分上・生活関係上一体をなす親の過失はこれに含まれる（判例）。","m":"親の過失も被害者側"},{"f":"権利","t":"相続","ref":"H24-10-1","s":"父Bには、子Aと、先に死亡した子Dの子F（Bの孫）がいる。Bの妻とDも既に死亡しており、Dの妻Eは生存している。Bが死亡した場合の法定相続分は、A2分の1、E4分の1、F4分の1である。","a":0,"e":"Dの地位はFが代襲相続し、相続人はAとFで各2分の1となる。子の配偶者Eは相続人にならない（民法887条）。","m":"嫁は相続人でない"},{"f":"権利","t":"相続","ref":"H24-10-2","s":"共同相続人の一人Aが相続財産である建物を単独で占有している場合、他の共同相続人Fは、Aに対して当然に建物の明渡しを請求することができる。","a":0,"e":"相続財産は共同相続人の共有となり、各相続人は持分に応じて使用できる。他の相続人は当然には明渡しを請求できない（判例）。","m":"共有者に当然明渡しなし"},{"f":"権利","t":"相続","ref":"H24-10-3","s":"未婚で子のないAが死亡し、Aの相続人となりうる者として父Bと、亡兄Dの子Fがいる場合、法定相続分はB4分の3、F4分の1となる。","a":0,"e":"子がいないときは直系尊属が第2順位の相続人となり、兄弟姉妹（その代襲者）より優先する。父Bが全部を相続する（民法889条）。","m":"親がいれば兄弟は無し"},{"f":"権利","t":"相続","ref":"H24-10-4","s":"Aが全財産を第三者Gに遺贈して死亡し、Aの相続人が亡兄Dの子F（代襲相続人）だけである場合、FはGに対して遺留分侵害額の請求をすることができない。","a":1,"e":"兄弟姉妹には遺留分がなく、その代襲相続人である甥・姪にも遺留分はない。したがってFは遺留分侵害額を請求できない（民法1042条）。","m":"兄弟姉妹に遺留分なし"},{"f":"権利","t":"借地","ref":"H24-11-1","s":"借地権者が借地権の登記をしていなくても、借地上に自己名義で表示の登記をした建物を所有していれば、借地権を第三者に対抗できる。","a":1,"e":"借地上の建物の登記で借地権の対抗力が認められ、表示の登記でもよい。ただし借地権者本人名義であることが必要（借地借家法10条、判例）。","m":"建物登記は本人名義"},{"f":"権利","t":"借地","ref":"H24-11-2","s":"登記した借地上の建物が火災で滅失した場合でも、借地権者が建物を特定する事項などを土地の見やすい場所に掲示すれば、一定期間は借地権を第三者に対抗できる。","a":1,"e":"掲示により、建物の滅失日から2年間は対抗力が維持される。滅失前に建物の登記があったことが前提（借地借家法10条2項）。","m":"掲示で2年間セーフ"},{"f":"権利","t":"借地","ref":"H24-11-3","s":"適法に土地を転借した者は、自ら対抗要件を備えていなくても、転貸人である賃借人が対抗力のある建物を所有していれば、その賃借権を援用して転借権を第三者に対抗できる。","a":1,"e":"判例は、転貸人の賃借権が対抗力を有するときは、適法な転借人はこれを援用して転借権を第三者に対抗できるとする。","m":"転貸人の対抗力を援用"},{"f":"権利","t":"借地","ref":"H24-11-4","s":"仮設建物を建てるために一時使用目的で土地を1年間借りた借地権者は、期間満了時に借地権設定者に対して建物を時価で買い取るよう請求できる。","a":0,"e":"一時使用目的の借地権には、存続期間・更新・建物買取請求権などの規定は適用されない（借地借家法25条）。","m":"一時使用に買取請求なし"},{"f":"権利","t":"借家","ref":"H24-12-1","s":"居住用建物の賃貸借では、普通建物賃貸借であっても定期建物賃貸借であっても、賃借人の造作買取請求権を特約で排除することができる。","a":1,"e":"造作買取請求権の規定は任意規定で、特約で排除できる（借地借家法33条・37条）。借地の建物買取請求権は排除できない点と区別する。","m":"造作買取は排除OK"},{"f":"権利","t":"借家","ref":"H24-12-2","s":"普通建物賃貸借で、一定期間賃料を減額しない旨の特約をしていても、経済事情の変動で賃料が不相当になれば、賃借人は賃料の減額を請求できる。","a":1,"e":"普通建物賃貸借では、増額しない特約は有効だが、減額しない特約は賃借人に不利なため無効となる（借地借家法32条1項）。","m":"減額しない特約は無効"},{"f":"権利","t":"借家","ref":"H24-12-3","s":"定期建物賃貸借を結ぶ際、賃貸人は契約の更新がない旨を記載した書面をあらかじめ賃借人に交付しておけば、その旨を口頭で説明しなくても定期建物賃貸借として有効となる。","a":0,"e":"賃貸人は事前に書面を交付したうえで、更新がなく期間満了で終了することを説明しなければならない。説明がないと更新がない旨の定めは無効（借地借家法38条）。","m":"書面交付＋説明"},{"f":"権利","t":"借家","ref":"H24-12-4","s":"床面積200㎡未満の居住用建物の定期建物賃貸借では、転勤や親族の介護などやむを得ない事情で住めなくなった賃借人は、中途解約の特約がなくても解約の申入れができる。","a":1,"e":"居住用で床面積200㎡未満なら、やむを得ない事情がある賃借人は解約を申し入れ、1か月経過で終了させられる（借地借家法38条7項）。","m":"200㎡未満は途中解約"},{"f":"権利","t":"区分所有法","ref":"H24-13-1","s":"区分所有建物の共用部分の保存行為は、規約に別段の定めがない限り、集会の決議を経ずに各区分所有者が単独ですることができる。","a":1,"e":"共用部分の保存行為は、集会の決議によらず各区分所有者が単独でできる（区分所有法18条1項ただし書）。","m":"保存行為は単独で"},{"f":"権利","t":"区分所有法","ref":"H24-13-3","s":"管理者がその職務の範囲内で第三者とした行為について、区分所有者が責任を負う割合は、規約に別段の定めがない限り、共用部分の持分の割合と同じである。","a":1,"e":"管理者の職務上の行為について区分所有者が負う責任の割合は、原則として共用部分の持分割合と同一となる（区分所有法29条1項）。","m":"責任は持分割合"},{"f":"権利","t":"区分所有法","ref":"H24-13-4","s":"区分所有建物の各区分所有者は、規約に別段の定めがない限り、その共用部分の持分に応じて、共用部分の管理費用などの負担を負う。","a":1,"e":"共用部分の負担と利益の収取は、規約に別段の定めがない限り、共用部分の持分に応じる（区分所有法19条）。","m":"費用は持分に応じて"},{"f":"権利","t":"不動産登記法","ref":"H24-14-1","s":"売主Aから所有権移転登記の申請を委任された代理人の代理権は、登記を申請する前にAが死亡した場合でも、Aの死亡によっては消滅しない。","a":1,"e":"民法では本人の死亡で代理権は消滅するが、登記申請の代理権は本人の死亡によっては消滅しない（不動産登記法17条）。","m":"登記代理は死亡で消えず"},{"f":"権利","t":"不動産登記法","ref":"H24-14-2","s":"甲土地を要役地、乙土地を承役地とする地役権の設定登記は、乙土地に所有権の登記があれば、甲土地に所有権の登記がなくても申請することができる。","a":0,"e":"地役権の設定登記は承役地にされるが、要役地に所有権の登記がないときは申請できない。両方の土地に所有権の登記が必要。","m":"要役地にも所有権登記"},{"f":"権利","t":"不動産登記法","ref":"H24-14-3","s":"区分建物を新築した所有者が表題登記を申請する前に死亡した場合、その相続人などの一般承継人も、被承継人を表題部所有者とする表題登記を申請できる。","a":1,"e":"区分建物の原始取得者に一般承継があったときは、一般承継人も表題登記を申請できる（不動産登記法47条2項）。","m":"相続人も表題登記可"},{"f":"権利","t":"不動産登記法","ref":"H24-14-4","s":"土地収用法による収用を原因とする土地の所有権移転の登記は、土地の所有者との共同申請によらず、起業者が単独で申請することができる。","a":1,"e":"収用による所有権移転の登記は、共同申請の例外として起業者が単独で申請できる（不動産登記法118条1項）。","m":"収用は起業者単独"},{"f":"法令","t":"国土利用計画法","ref":"H24-15-1","s":"国土利用計画法の事後届出で、土地の権利移転の対価が金銭以外のものであるときは、その時価を基準に金銭に見積もった額を届出書に記載する。","a":1,"e":"事後届出書には対価の額を記載する。金銭以外の対価は、時価を基準として金銭に見積もった額を記載する（施行規則）。","m":"非金銭は時価で見積り"},{"f":"法令","t":"国土利用計画法","ref":"H24-15-2","s":"市街化調整区域内の同一所有者の土地4,000㎡を、買主が一定の計画に従って2,000㎡ずつ2回に分けて購入した場合、買主は事後届出をしなければならない。","a":0,"e":"一団の土地として合計4,000㎡で判断するが、市街化調整区域の届出対象は5,000㎡以上なので届出は不要（国土利用計画法23条）。","m":"調整区域は5,000㎡"},{"f":"法令","t":"国土利用計画法","ref":"H24-15-3","s":"市が所有する都市計画区域外の24,000㎡の土地を、民間の2者が持分2分の1ずつで共同購入した場合、各買主は事後届出をしなければならない。","a":0,"e":"契約当事者の一方または双方が国・地方公共団体等である場合は、面積にかかわらず事後届出は不要。","m":"国・自治体相手は不要"},{"f":"法令","t":"国土利用計画法","ref":"H24-15-4","s":"市街化区域内の2,500㎡の土地について、融資を受けられることを停止条件とする売買契約を結んだ場合、買主は条件が成就した日から2週間以内に事後届出をしなければならない。","a":0,"e":"停止条件付きの契約でも、契約を締結した日から2週間以内に届け出る。条件成就時の届出は不要。","m":"契約日から2週間"},{"f":"法令","t":"都市計画法","ref":"H24-16-1","s":"市街地開発事業等予定区域内で、非常災害のため必要な応急措置として建築物を建築する場合は、都道府県知事等の許可を受ける必要はない。","a":1,"e":"市街地開発事業等予定区域内の建築等は原則許可制だが、非常災害の応急措置として行う行為は許可不要（都市計画法52条の2）。","m":"応急措置は許可不要"},{"f":"法令","t":"都市計画法","ref":"H24-16-2","s":"都市計画の決定や変更の提案は、提案に係る区域内の土地について所有権または借地権を有する者に限って行うことができ、NPO法人などはできない。","a":0,"e":"土地所有者等のほか、まちづくりNPO法人や一定の団体も都市計画の提案をすることができる（都市計画法21条の2）。","m":"NPOも提案できる"},{"f":"法令","t":"都市計画法","ref":"H24-16-3","s":"市町村が都市計画を決定しようとするときは、あらかじめ都道府県知事に協議するだけでは足りず、都道府県知事の同意を得なければならない。","a":0,"e":"市町村の都市計画決定は、都道府県知事への協議で足り、同意は不要（都市計画法19条3項）。","m":"協議のみ、同意不要"},{"f":"法令","t":"都市計画法","ref":"H24-16-4","s":"地区整備計画が定められた地区計画の区域内で建築物の建築を行う者は、工事が完了した日から30日以内に市町村長に届け出なければならない。","a":0,"e":"地区計画の区域内の建築等は、行為に着手する日の30日前までに市町村長に届け出る（都市計画法58条の2）。","m":"着手30日前に届出"},{"f":"法令","t":"開発許可","ref":"H24-17-ア","s":"市街化調整区域内で図書館を建築する目的で行う3,000㎡の開発行為は、開発許可を受けなければならない（許可面積に関する条例の定めはない）。","a":0,"e":"図書館は公益上必要な建築物にあたり、その建築のための開発行為は区域・規模を問わず開発許可が不要（都市計画法29条1項3号）。","m":"図書館は許可不要"},{"f":"法令","t":"開発許可","ref":"H24-17-イ","s":"準都市計画区域内で病院を建築する目的で行う4,000㎡の開発行為は、開発許可を受けなければならない（許可面積に関する条例の定めはない）。","a":1,"e":"準都市計画区域では3,000㎡以上が許可対象。病院などの医療施設は公益上必要な建築物の例外に含まれないため許可が必要。","m":"病院は許可必要"},{"f":"法令","t":"開発許可","ref":"H24-17-ウ","s":"市街化区域内で農業者の居住用建築物を建築する目的で行う1,500㎡の開発行為は、開発許可を受けなければならない（許可面積に関する条例の定めはない）。","a":1,"e":"農林漁業者の住宅の例外は市街化区域外のみ。市街化区域では1,000㎡以上の開発行為に許可が必要。","m":"市街化区域に農家特例なし"},{"f":"法令","t":"建築基準法","ref":"H24-18-1","s":"法令の改正によって既存の建築物が改正後の規定に適合しなくなった場合、その建築物は違反建築物となり、所有者は直ちに改正後の規定に適合させなければならない。","a":0,"e":"既存不適格建築物には改正後の規定は適用されず、違反建築物にはならない。増改築等をする際に適合が求められる（建築基準法3条2項）。","m":"既存不適格は違反でない"},{"f":"法令","t":"建築基準法","ref":"H24-18-2","s":"事務所として使っている建築物の用途を変更して、床面積250㎡の飲食店とする場合は、建築主事等または指定確認検査機関の建築確認を受ける必要がある。","a":1,"e":"用途変更で200㎡を超える特殊建築物（飲食店を含む）とする場合は、建築確認が必要（建築基準法87条）。","m":"特建200㎡超へ変更は確認"},{"f":"法令","t":"建築基準法","ref":"H24-18-3","s":"住宅の居室には、換気のための窓その他の開口部を設け、その換気に有効な部分の面積は、居室の床面積の25分の1以上としなければならない。","a":0,"e":"居室の換気に有効な開口部は床面積の20分の1以上が必要（建築基準法28条2項）。採光は住宅の居室で7分の1以上。","m":"換気は20分の1"},{"f":"法令","t":"建築基準法","ref":"H24-18-4","s":"建築主事等は、建築確認の審査において、建築基準法令の規定への適合だけを審査し、都市計画法など他の法令への適合は審査しない。","a":0,"e":"建築確認では、建築基準法令に加え、都市計画法などの建築基準関係規定への適合も審査する（建築基準法6条）。","m":"関係規定も審査"},{"f":"法令","t":"建築基準法","ref":"H24-19-1","s":"街区の角にある敷地の建築物の建蔽率は、特定行政庁の指定がなくても、都市計画で定められた数値に10分の1を加えたものとなる。","a":0,"e":"角地の建蔽率の10分の1加算は、特定行政庁が指定するものの内にある敷地に限られる（建築基準法53条3項）。","m":"角地緩和は指定が必要"},{"f":"法令","t":"建築基準法","ref":"H24-19-2","s":"第一種低層住居専用地域内の建築物の高さは、原則として、12mまたは15mのうち都市計画で定められた建築物の高さの限度を超えてはならない。","a":0,"e":"低層住居専用地域と田園住居地域の絶対高さ制限は、10mまたは12mのうち都市計画で定めた限度（建築基準法55条）。","m":"低層は10mか12m"},{"f":"法令","t":"建築基準法","ref":"H24-19-3","s":"用途地域に関する都市計画において建築物の敷地面積の最低限度を定める場合、その最低限度は200㎡を超えてはならないとされている。","a":1,"e":"敷地面積の最低限度を定める場合、200㎡を超えてはならない（建築基準法53条の2第2項）。","m":"最低限度は200㎡まで"},{"f":"法令","t":"建築基準法","ref":"H24-19-4","s":"既に認可を受けた建築協定の内容を変更する場合は、協定区域内の土地所有者等の過半数の合意を得て、特定行政庁の認可を受ければ足りる。","a":0,"e":"建築協定の変更には土地所有者等の全員の合意が必要。廃止は過半数の合意で足りる。いずれも特定行政庁の認可が必要。","m":"変更は全員・廃止は過半数"},{"f":"法令","t":"盛土規制法","ref":"H24-20-1","s":"宅地造成等工事規制区域内で許可を受けて宅地造成に関する工事をした工事主は、工事が完了したときに都道府県知事の検査を受けなければならない。","a":1,"e":"許可を受けた宅地造成等に関する工事が完了した場合、工事主は都道府県知事の完了検査を申請し、受けなければならない（盛土規制法17条）。","m":"完了したら検査"},{"f":"法令","t":"盛土規制法","ref":"H24-20-2","s":"都道府県知事は、宅地造成等工事規制区域内の宅地造成等に関する工事の許可に、工事に伴う災害を防止するため必要な条件を付けることができる。","a":1,"e":"知事は工事の許可に、工事に伴う災害の防止のため必要な条件を付すことができる（盛土規制法12条3項）。","m":"許可に条件を付けられる"},{"f":"法令","t":"盛土規制法","ref":"H24-20-3","s":"都道府県知事は、宅地造成等工事規制区域内の土地の所有者、管理者または占有者に対し、その土地や工事の状況について報告を求めることができる。","a":1,"e":"知事は規制区域内の土地の所有者・管理者・占有者に対し、土地または工事の状況の報告を求めることができる（盛土規制法25条）。","m":"知事は報告を求められる"},{"f":"法令","t":"盛土規制法","ref":"H24-20-4","s":"都道府県知事は、宅地造成等工事規制区域内で、災害の危険が大きい一団の造成宅地の区域を造成宅地防災区域に指定することができる。","a":0,"e":"造成宅地防災区域は、宅地造成等工事規制区域の外で指定される。規制区域内では指定できない（盛土規制法45条）。","m":"防災区域は規制区域外"},{"f":"法令","t":"土地区画整理法","ref":"H24-21-1","s":"土地区画整理組合が総会の議決によって解散しようとする場合は、組合の判断だけでは足りず、その解散について都道府県知事の認可を受けなければならない。","a":1,"e":"組合が総会の議決等で解散する場合は、都道府県知事の認可が必要（土地区画整理法45条）。","m":"組合解散は知事認可"},{"f":"法令","t":"土地区画整理法","ref":"H24-21-2","s":"土地区画整理組合は、民間の施行者であっても、都市計画で定められた土地区画整理事業の施行区域の外では、事業を施行することができない。","a":0,"e":"組合を含む民間施行者（個人・組合・会社）は、施行区域外でも事業を施行できる。施行区域内に限られるのは公的施行者。","m":"民間は区域外でも可"},{"f":"法令","t":"土地区画整理法","ref":"H24-21-3","s":"土地区画整理組合は、土地区画整理事業の費用に充てるため、換地計画において一定の土地を換地として定めずに保留地として定めることができる。","a":1,"e":"組合などの施行者は、事業費に充てる等の目的で、換地として定めない土地（保留地）を換地計画で定められる（土地区画整理法96条）。","m":"保留地で事業費"},{"f":"法令","t":"土地区画整理法","ref":"H24-21-4","s":"土地区画整理組合が施行する土地区画整理事業の施行地区内の宅地について所有権または借地権を有する者は、すべてその組合の組合員となる。","a":1,"e":"組合施行の場合、施行地区内の宅地の所有権者と借地権者は全員が組合員となる（土地区画整理法25条1項）。","m":"所有者・借地人は全員"},{"f":"法令","t":"農地法","ref":"H24-22-1","s":"登記簿上の地目が山林となっている土地であっても、現に耕作の目的に供されている土地であれば、農地法上の農地にあたり、同法の規制を受ける。","a":1,"e":"農地かどうかは登記簿上の地目ではなく、土地の現況によって判断する。現に耕作されていれば農地となる（農地法2条1項）。","m":"農地は現況で判断"},{"f":"法令","t":"農地法","ref":"H24-22-2","s":"農地法3条または5条の許可が必要な農地の売買契約を、その許可を受けずに締結した場合、売主から買主への所有権移転の効力は生じない。","a":1,"e":"3条・5条の許可を受けずにした権利移転は効力を生じない（農地法3条6項・5条3項）。","m":"無許可は効力なし"},{"f":"法令","t":"農地法","ref":"H24-22-3","s":"市街化区域内の農地を、あらかじめ農業委員会に届け出たうえで自ら駐車場に転用する場合は、農地法4条の許可を受ける必要はない。","a":1,"e":"市街化区域内の農地の転用は、あらかじめ農業委員会に届け出れば4条・5条の許可は不要。","m":"市街化区域は届出でOK"},{"f":"法令","t":"農地法","ref":"H24-22-4","s":"砂利採取法の認可を受けた計画に従って砂利を採取するため、農地を一時的に貸し付ける場合は、農地法5条の許可を受ける必要はない。","a":0,"e":"一時的であっても、農地以外の用途に使う目的で農地を貸し付けるときは5条の許可が必要。","m":"一時転用でも5条許可"},{"f":"税他","t":"所得税・譲渡","ref":"H24-23-1","s":"個人が居住用財産を譲渡した場合、その所有期間が10年以下であるときは、居住用財産の譲渡所得の3,000万円特別控除を適用することはできない。","a":0,"e":"3,000万円特別控除は所有期間の長短を問わず適用できる。所有期間10年超が要件なのは軽減税率の特例。","m":"3,000万控除は期間不問"},{"f":"税他","t":"所得税・譲渡","ref":"H24-23-2","s":"所有期間10年超の居住用財産を収用により譲渡し、収用等の5,000万円特別控除を受けた場合でも、その控除後の譲渡益について居住用財産の軽減税率の特例を適用できる。","a":1,"e":"居住用財産の軽減税率の特例は、収用等の5,000万円特別控除と重ねて適用できる。","m":"5,000万と軽減税率は併用"},{"f":"税他","t":"所得税・譲渡","ref":"H24-23-3","s":"所有期間10年超の家屋について、譲渡の時点で自己の居住の用に供していなければ、住まなくなってからの期間にかかわらず、居住用財産の軽減税率の特例は適用できない。","a":0,"e":"居住しなくなった日から3年を経過する日の属する年の12月31日までに譲渡すれば、軽減税率の特例を適用できる。","m":"転居後3年目の年末まで"},{"f":"税他","t":"所得税・譲渡","ref":"H24-23-4","s":"居住用財産を、生計を一にしていない自分の孫に譲渡した場合でも、居住用財産の譲渡所得の3,000万円特別控除を適用できる。","a":0,"e":"配偶者・直系血族への譲渡は、生計を一にしているかどうかを問わず3,000万円特別控除の対象外。孫は直系血族にあたる。","m":"直系血族への譲渡は不可"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H24-24-1","s":"2026年4月1日以後の取得について、不動産取得税の免税点は、課税標準となる額が土地16万円、建築に係る家屋1戸66万円、その他の家屋1戸34万円に満たない場合である。","a":1,"e":"2026年4月1日以後の取得から免税点が引き上げられ、土地16万円、建築に係る家屋66万円、その他の家屋34万円となった。","m":"16・66・34万円"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H24-24-2","s":"個人が床面積250㎡の新築住宅を取得した場合、その住宅に係る不動産取得税の課税標準の算定にあたって、価格から1,200万円が控除される。","a":0,"e":"新築住宅の1,200万円控除は、床面積が一定の範囲（上限240㎡）の住宅に限られる。250㎡の住宅には適用されない。","m":"控除の上限は240㎡"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H24-24-3","s":"個人が宅地を取得した場合の不動産取得税の課税標準は、宅地評価土地の取得に係る課税標準の特例により、当該宅地の価格の4分の1の額とされる。","a":0,"e":"宅地の取得に係る課税標準の特例は、価格の2分の1とするもの。4分の1は固定資産税の住宅用地の特例などと混同しないこと。","m":"宅地取得は2分の1"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H24-24-4","s":"家屋が新築されてから2年を経過しても最初の使用または譲渡が行われない場合は、2年を経過した日に家屋の取得があったものとみなして不動産取得税が課される。","a":0,"e":"新築家屋が使用・譲渡されないときは、原則として新築から6か月を経過した日に取得があったものとみなされる（地方税法73条の2第2項）。","m":"みなし取得は原則6か月"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H24-25-1","s":"不動産鑑定評価では、不動産の効用、相対的稀少性、有効需要に影響を与える価格形成要因について、その推移や動向、相互の関係を分析する必要がある。","a":1,"e":"価格形成要因は一般的要因・地域要因・個別的要因に分かれ、鑑定評価ではその推移・動向と相互関係を把握し分析する。","m":"要因の推移と相互関係"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H24-25-2","s":"鑑定評価の各手法に用いる取引事例等は、豊富に秩序正しく収集・選択すべきであり、投機的取引と認められる事例は用いてはならない。","a":1,"e":"鑑定評価基準は、事例を豊富に秩序正しく収集し、投機的取引と認められる事例等は用いないこととしている。","m":"投機的事例は使わない"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H24-25-3","s":"取引事例比較法の取引事例は、原則として近隣地域または同一需給圏内の類似地域から選択し、必要やむを得ない場合は近隣地域の周辺の地域から選択できる。","a":1,"e":"鑑定評価基準は、事例を近隣地域または同一需給圏内の類似地域から選ぶのを原則とし、やむを得ない場合は周辺地域も認める。","m":"近隣か同一需給圏"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H24-25-4","s":"原価法における減価修正の方法には、耐用年数に基づく方法と観察減価法があるが、両者は考え方が異なるため併用することはできない。","a":0,"e":"減価修正は、耐用年数に基づく方法と観察減価法の二つの方法を併用するのが原則である。","m":"減価修正は2つを併用"},{"f":"業法","t":"免許の基準","ref":"H24-26-1","s":"法人Aの役員が傷害罪で拘禁刑1年・執行猶予2年の判決を受け、その猶予期間が満了した場合、満了から5年を経過していなくてもAは免許を受けることができる。","a":1,"e":"執行猶予期間が満了すると刑の言渡しは効力を失うため、直ちに欠格事由に該当しなくなる（宅建業法5条）。","m":"猶予満了で即OK"},{"f":"業法","t":"免許の基準","ref":"H24-26-2","s":"法人Bの非常勤役員が現場助勢罪で罰金刑に処せられた場合でも、非常勤であれば、刑の執行が終わってから5年を経過していなくてもBは免許を受けることができる。","a":0,"e":"非常勤役員も役員に含まれる。現場助勢罪の罰金刑は欠格事由なので、その役員がいる限り5年間は免許を受けられない。","m":"非常勤も役員"},{"f":"業法","t":"免許の基準","ref":"H24-26-3","s":"法人Cの役員が暴行罪で拘留の刑に処せられた場合、刑の執行が終わってから5年を経過しなければ、Cは免許を受けることができない。","a":0,"e":"暴行罪で欠格事由となるのは罰金刑以上。拘留は罰金より軽い刑なので欠格事由にあたらない。","m":"拘留・科料は欠格外"},{"f":"業法","t":"免許の基準","ref":"H24-26-4","s":"法人Dの役員が過失傷害罪で科料に処せられた場合、刑の執行が終わってから5年を経過しなければ、Dは免許を受けることができない。","a":0,"e":"過失傷害罪など一般の犯罪で欠格事由となるのは拘禁刑以上の刑。科料は欠格事由にあたらない。","m":"過失傷害は拘禁刑から"},{"f":"業法","t":"免許","ref":"H24-27-1","s":"免許を受けていた個人の宅建業者が死亡した場合、その相続人は、死亡の事実を知った日から30日以内に免許権者に届け出なければならない。","a":1,"e":"死亡の届出は相続人が、死亡を知った日から30日以内に行う。他の廃業等の届出は事由発生日から30日以内（宅建業法11条）。","m":"死亡は知った日から"},{"f":"業法","t":"免許","ref":"H24-27-2","s":"自己所有の宅地を駐車場として賃貸する者が、その賃貸の媒介を宅建業者に依頼する場合、依頼者自身も宅建業の免許を受けなければならない。","a":0,"e":"自ら貸主として賃貸することは宅建業の取引にあたらず、媒介を業者に依頼しても依頼者に免許は不要。","m":"自ら貸主は免許不要"},{"f":"業法","t":"免許","ref":"H24-27-3","s":"ビルの所有者から一棟を借り受けた者が、これを不特定多数の者に反復継続して転貸する場合、その転貸人は宅建業の免許を受けなければならない。","a":0,"e":"転貸も自ら貸主として行う貸借であり、宅建業の取引にあたらない。所有者も転貸人も免許は不要。","m":"転貸人も免許不要"},{"f":"業法","t":"免許","ref":"H24-27-4","s":"甲県知事免許の宅建業者が国土交通大臣免許の宅建業者に吸収合併されて消滅した場合、存続会社の役員が合併の日から30日以内に国土交通大臣に届け出なければならない。","a":0,"e":"合併による消滅の届出は、消滅した法人の代表役員であった者が、消滅会社の免許権者（甲県知事）に30日以内に行う。","m":"消滅会社の代表が届出"},{"f":"業法","t":"広告","ref":"H24-28-ア","s":"建物所有者から建物を借り受けて自ら転貸する者が入居者募集の広告をする場合、自らが契約の当事者となる旨を明示しなければ、宅建業法の取引態様の明示義務に違反する。","a":0,"e":"自ら貸主として転貸する行為は宅建業にあたらず、宅建業法の広告規制（取引態様の明示義務）は適用されない。","m":"自ら貸主に業法なし"},{"f":"業法","t":"広告","ref":"H24-28-イ","s":"建築確認を申請中の居住用賃貸マンションについては、貸主から媒介の依頼を受けていても、宅建業者は入居者募集の広告をすることができない。","a":1,"e":"工事完了前の建物は、建築確認等の処分があった後でなければ広告できない。売買・貸借を問わない（宅建業法33条）。","m":"確認前は広告禁止"},{"f":"業法","t":"広告","ref":"H24-28-ウ","s":"宅地の売買契約が成立した後も広告の掲載を続けた場合でも、最初に掲載した時点で契約が成立していなければ、誇大広告等の禁止には違反しない。","a":0,"e":"契約済みで取引できない物件の広告を続けることは、おとり広告として誇大広告等の禁止に違反する（宅建業法32条）。","m":"成約後の掲載はおとり"},{"f":"業法","t":"広告","ref":"H24-28-エ","s":"建築確認を申請中の新築分譲住宅については、建築確認申請中である旨を広告に表示すれば、宅建業者は販売の広告をすることができる。","a":0,"e":"申請中である旨を表示しても、建築確認を受ける前は広告できない（宅建業法33条）。","m":"申請中表示でも不可"},{"f":"業法","t":"媒介契約","ref":"H24-29-1","s":"宅建業者が専任媒介契約に基づき指定流通機構に登録した物件の売買契約が成立したときは、登録番号、取引価格、契約成立年月日を遅滞なく指定流通機構に通知しなければならない。","a":1,"e":"登録物件の契約が成立したときは、登録番号・取引価格・契約成立年月日を遅滞なく指定流通機構に通知する（宅建業法34条の2第7項）。","m":"成約したら3点を通知"},{"f":"業法","t":"媒介契約","ref":"H24-29-2","s":"宅建業者が専属専任媒介契約を締結した場合、依頼者への業務処理状況の報告は書面で行う必要があり、電子メールで行うことはできない。","a":0,"e":"業務処理状況の報告方法に制限はなく、電子メールや口頭でもよい。専属専任は1週間に1回以上、専任は2週間に1回以上。","m":"報告はメールでもOK"},{"f":"業法","t":"媒介契約","ref":"H24-29-3","s":"宅建業者が、他の宅建業者から購入の媒介を依頼されて一般媒介契約を締結した場合でも、媒介契約の内容を記載した書面を依頼者に交付（または電磁的方法で提供）しなければならない。","a":1,"e":"媒介契約書面の交付義務は、依頼者が宅建業者であっても、一般媒介であっても免除されない（宅建業法34条の2）。","m":"業者間でも書面必要"},{"f":"業法","t":"媒介契約","ref":"H24-29-4","s":"一般媒介契約を締結した宅建業者が、依頼された物件の売買価額について意見を述べるときは、その根拠を明らかにしなければならない。","a":1,"e":"価額について意見を述べるときは、媒介契約の種類を問わず根拠を明らかにする必要がある（宅建業法34条の2第2項）。","m":"価額の意見に根拠"},{"f":"業法","t":"重要事項説明","ref":"H24-30-1","s":"住宅性能評価を受けた新築住宅の貸借の媒介をする場合、宅建業者は、重要事項説明において住宅性能評価を受けた住宅である旨を説明しなければならない。","a":0,"e":"住宅性能評価を受けた新築住宅である旨の説明は、建物の売買・交換の場合に必要で、貸借では不要。","m":"性能評価は売買のみ"},{"f":"業法","t":"重要事項説明","ref":"H24-30-2","s":"建物の売買の媒介で、飲用水・電気・ガスの供給施設や排水施設が整備されていない場合、宅建業者はその整備の見通しと特別の負担に関する事項を説明しなければならない。","a":1,"e":"飲用水・電気・ガス・排水施設の整備状況（未整備なら見通しと特別の負担）は、売買・交換・貸借のすべてで説明事項となる。","m":"インフラは全取引で説明"},{"f":"業法","t":"重要事項説明","ref":"H24-30-3","s":"建物の貸借の媒介で、石綿の使用の有無の調査結果が記録されている場合、宅建業者はその旨を説明すれば足り、記録の内容まで説明する必要はない。","a":0,"e":"石綿使用の有無の調査結果が記録されているときは、その内容を説明しなければならない。建物の売買・交換・貸借が対象。","m":"石綿は内容まで説明"},{"f":"業法","t":"重要事項説明","ref":"H24-30-4","s":"昭和55年に竣工した建物の売買の媒介をする宅建業者は、耐震診断を自ら実施したうえで、その内容を重要事項として説明しなければならない。","a":0,"e":"旧耐震の建物は、耐震診断を受けていればその内容を説明する。業者に耐震診断を実施する義務はない。","m":"診断の実施義務なし"},{"f":"業法","t":"37条書面","ref":"H24-31-1","s":"宅建業者が自ら売主として売買契約を締結し、買主には代理人として別の宅建業者が関与した場合、37条書面を買主本人とその代理人の双方に交付しても宅建業法に違反しない。","a":1,"e":"37条書面は契約の両当事者に交付が必要。本人に交付していれば、代理人にも交付することは問題ない。","m":"本人に渡せば重ねてOK"},{"f":"業法","t":"37条書面","ref":"H24-31-2","s":"宅建業者が建物の売買を媒介した際、売主が手付金等の保全措置を講じていても、宅建業者はその保全措置の内容を37条書面に記載しなくてよい。","a":1,"e":"手付金等の保全措置の概要は35条書面（重要事項説明）の記載事項であり、37条書面の記載事項ではない。","m":"保全措置は35条のみ"},{"f":"業法","t":"37条書面","ref":"H24-31-3","s":"工事完了前の建物の売買を媒介した宅建業者が、37条書面に記載すべき建物を特定するための表示を、重要事項説明で用いた図書を交付することで行っても宅建業法に違反しない。","a":1,"e":"工事完了前の建物は、重要事項説明で使用した図書を交付することにより建物を特定するための表示を行うことができる。","m":"未完成は図書で特定"},{"f":"業法","t":"37条書面","ref":"H24-31-4","s":"居住用建物の賃貸借の媒介で、引渡しの時期を重要事項説明の際に借主に伝えていれば、宅建業者はそれを37条書面に記載しなくてもよい。","a":0,"e":"引渡しの時期は37条書面の必要的記載事項であり、重要事項説明で伝えたことを理由に省略することはできない。","m":"引渡時期は必ず記載"},{"f":"業法","t":"業務上の規制","ref":"H24-32-1","s":"宅建業者が自ら売主となる宅地の売買で、購入の申込みを撤回した宅建業者でない買主から預かっていた申込証拠金を、解約手数料に充てて返還しなかった。これは宅建業法に違反しない。","a":0,"e":"相手方が申込みを撤回したときに、既に受領した預り金の返還を拒むことは禁止されている（宅建業法47条の2、施行規則）。","m":"預り金は全額返す"},{"f":"業法","t":"重要事項説明","ref":"H24-32-2","s":"宅建業者でない買主から強く求められた場合には、宅建業者は重要事項説明を省略して先に売買契約を締結し、37条書面を交付することができる。","a":0,"e":"重要事項説明は、買主の求めがあっても契約が成立するまでの間に行わなければならない（宅建業法35条）。","m":"重説は必ず契約前"},{"f":"業法","t":"重要事項説明","ref":"H24-32-3","s":"宅建業者があっせんする融資について、融資が成立しないときの措置を説明すれば、融資額や返済方法などの融資の内容は重要事項説明書への記載を省略できる。","a":0,"e":"代金に関する金銭の貸借のあっせんの内容と、あっせんが不成立のときの措置は、いずれも重要事項として説明・記載が必要。","m":"ローン内容も不成立時も"},{"f":"業法","t":"業務上の規制","ref":"H24-32-4","s":"宅建業者が、将来の交通整備について「確定はしていないが」と断ったうえで、その計画の報道があることを買主に伝えても、宅建業法に違反しない。","a":1,"e":"不確実であることを示して報道の事実を伝えるだけなら、断定的判断の提供にはあたらない。確定的に告げれば違反となる。","m":"断ったうえなら可"},{"f":"業法","t":"営業保証金","ref":"H24-33-1","s":"宅建業者が営業保証金を供託する際に地方債証券を充てる場合、その地方債証券の価額は、額面金額の100分の90として評価する。","a":1,"e":"有価証券の評価は、国債が額面の100%、地方債・政府保証債が90%、その他の省令で定めるものが80%。","m":"国債100・地方債90"},{"f":"業法","t":"営業保証金","ref":"H24-33-2","s":"本店と支店を設けて宅建業を営む者は、本店分は本店の最寄りの供託所に、支店分は各支店の最寄りの供託所に、それぞれ営業保証金を供託しなければならない。","a":0,"e":"営業保証金は、本店・支店の分をまとめて主たる事務所の最寄りの供託所に供託する（宅建業法25条1項）。","m":"全部本店の最寄りへ"},{"f":"業法","t":"営業保証金","ref":"H24-33-3","s":"保証協会の社員とならずに、本店と支店5か所を設けて宅建業を営もうとする者が供託すべき営業保証金の額は、本店と支店を合わせて合計210万円である。","a":0,"e":"営業保証金は本店1,000万円・支店1か所500万円で合計3,500万円。210万円は保証協会の弁済業務保証金分担金の額。","m":"本店1,000・支店500"},{"f":"業法","t":"営業保証金","ref":"H24-33-4","s":"営業保証金を供託している宅建業者は、売買契約が成立するまでに、相手方に対して供託所の所在地とともに供託している営業保証金の額を説明しなければならない。","a":0,"e":"契約成立前に説明すべきなのは、営業保証金を供託した主たる事務所の最寄りの供託所とその所在地であり、供託額は不要（宅建業法35条の2）。","m":"説明は供託所と所在地"},{"f":"業法","t":"8種制限","ref":"H24-34-ア","s":"宅建業者Aが自ら売主として代金2,000万円の完成済み中古マンションを宅建業者でない買主に売り、手付金200万円を受領した後、引渡し前に中間金100万円を受け取り、その後で手付金と中間金について保全措置を講じた。これは宅建業法に違反しない。","a":0,"e":"完成物件は手付金等が代金の10%を超えると保全措置が必要。中間金を含め合計300万円となるので、中間金の受領前に保全措置を講じなければならない。","m":"保全措置は受領前"},{"f":"業法","t":"8種制限","ref":"H24-34-イ","s":"宅建業者Aが自ら売主として代金2,000万円の完成済み中古マンションを宅建業者でない買主に売る際、申込証拠金10万円を代金に充当することとし、保全措置を講じた後に手付金200万円を受領した。これは宅建業法に違反しない。","a":1,"e":"代金に充当される申込証拠金も手付金等に含まれ、合計210万円で10%を超えるが、受領前に保全措置を講じているので違反しない（宅建業法41条の2）。","m":"充当される申込金も手付金等"},{"f":"業法","t":"業務上の規制","ref":"H24-34-ウ","s":"宅建業者が自ら売主となる売買で、宅建業者でない買主に手付金の一部を貸し付けることにより、契約の締結を誘引した。これは宅建業法に違反しない。","a":0,"e":"手付けについて貸付けその他の信用の供与をすることにより契約の締結を誘引する行為は禁止されている（宅建業法47条3号）。","m":"手付の貸付けは禁止"},{"f":"業法","t":"報酬","ref":"H24-35-エ","s":"媒介を依頼された宅建業者は、依頼者から特に依頼されていない通常の広告の費用について、報酬限度額とは別に依頼者に請求して受け取ることはできない。","a":1,"e":"報酬とは別に受け取れる広告料金は、依頼者の依頼による広告の実費に限られる（報酬告示）。依頼のない広告費は請求できない。","m":"広告費は依頼あってこそ"},{"f":"業法","t":"宅建士","ref":"H24-36-1","s":"宅建業者の事務所で唯一の専任の宅建士が退職した場合、その宅建業者は退職の日から30日以内に新たな専任の宅建士を置けば、宅建業法に違反しない。","a":0,"e":"専任の宅建士が法定数に不足したときは、2週間以内に補充などの必要な措置をとらなければならない（31条の3第3項）。","m":"専任不足は2週間"},{"f":"業法","t":"宅建士","ref":"H24-36-2","s":"宅建業者が契約の締結や申込みを受ける案内所を設置し、そこに従業者が6名いる場合、成年者である専任の宅建士を2名以上置かなければならない。","a":0,"e":"契約・申込みを受ける案内所は、従業者の人数にかかわらず専任の宅建士を1名以上置けばよい。5人に1人は事務所の基準。","m":"案内所は人数問わず1名"},{"f":"業法","t":"宅建士","ref":"H24-36-3","s":"事務所の専任の宅建士の一人が退職した場合でも、その事務所に法定数の専任の宅建士が残っていれば、宅建業者は免許権者に変更の届出をする必要はない。","a":0,"e":"専任の宅建士の氏名は宅建業者名簿の登載事項。法定数を満たしていても、変更があれば30日以内に届け出る（9条）。","m":"専任の交代は30日で届出"},{"f":"業法","t":"宅建士","ref":"H24-36-4","s":"甲県知事免許の宅建業者で働く乙県知事登録の宅建士が、丙県内の取引で不正な行為をした場合、丙県知事はその宅建士に事務禁止処分をすることができる。","a":1,"e":"宅建士への指示・事務禁止は、登録知事だけでなく行為地の知事もできる（68条）。登録消除は登録知事だけが行う。","m":"行為地の知事も事務禁止"},{"f":"業法","t":"クーリング・オフ","ref":"H24-37-1","s":"宅建業者でない買主が、専任の宅建士を置くべき売主業者のモデルルームで買受けの申込みをし、後日事務所で契約した場合、クーリング・オフを告げられていなければ解除できる。","a":0,"e":"クーリング・オフの可否は申込みの場所で判断する。土地に定着し専任の宅建士を置くモデルルームは事務所等にあたる（37条の2）。","m":"場所は申込みで判断"},{"f":"業法","t":"クーリング・オフ","ref":"H24-37-2","s":"宅建業者でない買主が喫茶店で申込みと契約をし、その3日後に売主業者から書面でクーリング・オフを告げられた場合、契約日から10日目であれば買主は解除できる。","a":1,"e":"8日間は書面で告げられた日から数える。契約日から10日目は告知日から数えて8日以内なので解除できる（37条の2）。","m":"8日は告知の日から"},{"f":"業法","t":"クーリング・オフ","ref":"H24-37-3","s":"宅建業者でない買主がホテルのロビーで申込みをする際に、クーリング・オフによる解除をしない旨を売主業者と合意していれば、業者はその合意を理由に解除を拒める。","a":0,"e":"クーリング・オフの規定に反する特約で買主に不利なものは無効。業者は合意を理由に解除を拒めない（37条の2第4項）。","m":"解除しない特約は無効"},{"f":"業法","t":"クーリング・オフ","ref":"H24-37-4","s":"宅建業者でない買主が売主業者の事務所で買受けの申込みをし、後日レストランで契約を結んだ場合、クーリング・オフを告げられていなければ買主は解除できる。","a":0,"e":"申込みと契約の場所が違うときは申込みの場所で判断する。事務所で申し込んだ以上、クーリング・オフはできない。","m":"事務所で申込みなら不可"},{"f":"業法","t":"8種制限","ref":"H24-38-ア","s":"宅建業者が自ら売主となり、宅建業者である買主と代金3,000万円の建物の売買契約を結ぶ場合、損害賠償の予定額を1,000万円とする特約を定めることができる。","a":1,"e":"8種制限は宅建業者間の取引には適用されない（78条2項）。代金の2割を超える損害賠償の予定も有効に定められる。","m":"業者間に8種制限なし"},{"f":"業法","t":"8種制限","ref":"H24-38-イ","s":"自ら売主の宅建業者が、業者でない買主と代金3,000万円で契約し、損害賠償の予定額300万円と違約金600万円を定めた場合、違約金の定めは全部が無効となる。","a":0,"e":"予定額と違約金の合計が代金の2割（600万円）を超えるときは、超えた部分（300万円）だけが無効になる（38条2項）。","m":"2割超えは超過分だけ無効"},{"f":"業法","t":"8種制限","ref":"H24-38-ウ","s":"自ら売主の宅建業者が、業者でない買主と完成済みの建物（代金3,000万円）の売買契約を結び、手付金300万円を受け取る場合、事前に保全措置を講じなければならない。","a":0,"e":"完成物件は手付金等が代金の10%または1,000万円を超えるときに保全措置が必要。300万円はちょうど10%で不要（41条の2）。","m":"完成物件は10%超で保全"},{"f":"業法","t":"8種制限","ref":"H24-39-1","s":"自ら売主の宅建業者が、業者でない買主と新築住宅の売買契約を結ぶ際に、担保責任を負う期間についての特約を何も定めなくても、宅建業法に違反しない。","a":1,"e":"担保責任の期間についての特約は任意的記載事項なので、定めなくても宅建業法違反ではない。定めなければ民法の原則どおりで、買主は不適合を知った時から1年以内に通知すればよく（民法566条）、権利そのものは消滅時効（知った時から5年・引渡しから10年）にかかる。なお、新築住宅の構造耐力上主要な部分等については、品確法により引渡しから10年の担保責任を負う。","m":"定めなければ民法どおり"},{"f":"業法","t":"8種制限","ref":"H24-39-2","s":"宅建業者が自ら売主として宅建業者である買主に中古建物を売る場合、売主は担保責任を一切負わないとする特約を定めても、宅建業法に違反しない。","a":1,"e":"買主が宅建業者なら8種制限（担保責任の特約の制限）は適用されない（78条2項）。責任を負わない特約も定められる。","m":"買主が業者なら免責OK"},{"f":"業法","t":"8種制限","ref":"H24-39-3","s":"自ら売主の宅建業者が業者でない買主と中古建物の売買契約を結ぶ際、不適合を通知すべき期間を引渡しの日から2年間とする特約は有効である。","a":1,"e":"通知期間を引渡しから2年以上とする特約は、民法より不利でも例外として有効とされる（40条1項）。","m":"引渡しから2年以上はOK"},{"f":"業法","t":"8種制限","ref":"H24-39-4","s":"自ら売主の宅建業者と業者でない買主の新築住宅の売買で、「不適合があっても買主は損害賠償の請求はできるが、契約の解除はできない」とする特約は有効である。","a":0,"e":"民法では不適合があれば解除もできる。解除を認めない特約は民法より買主に不利なので無効（40条）。","m":"解除できない特約は無効"},{"f":"業法","t":"業務上の規制","ref":"H24-40-ア","s":"宅建業者は、業務に関して行うべき宅地建物の登記、引渡し、取引の対価の支払を不当に遅らせてはならないが、規制の対象はこの3つに限られている。","a":1,"e":"不当な履行遅延の禁止の対象は、登記・引渡し・取引に係る対価の支払の3つに限られる（44条）。","m":"登記・引渡し・支払を遅らすな"},{"f":"業法","t":"業務上の規制","ref":"H24-40-イ","s":"個人情報保護法上の個人情報取扱事業者にあたらない宅建業者であれば、業務上取り扱った顧客の個人情報を正当な理由なく漏らしても、宅建業法違反にはならない。","a":0,"e":"宅建業法の守秘義務は個人情報保護法と関係なくすべての宅建業者に及ぶ。正当な理由なく漏らせば違反（45条）。","m":"守秘義務は全業者に"},{"f":"業法","t":"業務上の規制","ref":"H24-40-ウ","s":"宅建業者は、従業者名簿を事務所ごとに備え、最終の記載をした日から10年間保存し、取引の関係者から請求があれば閲覧させなければならない。","a":1,"e":"従業者名簿は事務所ごとに備え付け、最終記載日から10年保存。取引関係者の請求があれば閲覧させる（48条）。","m":"従業者名簿は10年"},{"f":"業法","t":"業務上の規制","ref":"H24-40-エ","s":"宅建業者は、事務所ごとに帳簿を備え、各事業年度の末日に閉鎖したうえで、閉鎖後5年間（自ら売主となる新築住宅に関するものは10年間）保存しなければならない。","a":1,"e":"帳簿は事業年度末に閉鎖し、閉鎖後5年間保存。自ら売主の新築住宅に関するものは10年間（49条、規則18条）。","m":"帳簿は閉鎖後5年"},{"f":"業法","t":"業務上の規制","ref":"H24-41-ア","s":"宅建業者の従業員が投資用マンションの電話勧誘をする際、会社の商号と自分の氏名を告げれば、勧誘の目的が売買契約の締結であることは告げなくても宅建業法に違反しない。","a":0,"e":"勧誘に先立ち、商号・名称、勧誘する者の氏名に加え、契約締結の勧誘が目的であることも告げなければならない（規則）。","m":"商号・氏名・目的を告げる"},{"f":"業法","t":"業務上の規制","ref":"H24-41-イ","s":"宅建業者の従業員が「将来、南側に高い建物が建つ予定は全くない」と根拠なく告げて勧誘した場合でも、誤解させる意図がなければ宅建業法違反にはならない。","a":0,"e":"将来の環境などについて誤解させる断定的判断の提供は、故意がなくても禁止される（47条の2）。","m":"断定的判断は故意不要"},{"f":"業法","t":"業務上の規制","ref":"H24-41-ウ","s":"宅建業者が、購入資金に不安を示した相手方に対し、売買代金を値引きすることを提案して契約の締結を誘うことは、宅建業法に違反しない。","a":1,"e":"代金の値引きは禁止されていない。禁止されるのは手付の貸付けなど信用の供与による契約の誘引（47条3号）。","m":"値引きはOK・手付貸しはNG"},{"f":"業法","t":"業務上の規制","ref":"H24-41-エ","s":"宅建業者の従業員が、相手方から事前に「午後3時の訪問は迷惑」と告げられていたのに、午後3時に訪問して勧誘することは、宅建業法に違反する。","a":1,"e":"相手方が迷惑を覚えるような時間に電話や訪問をして勧誘することは禁止されている（規則16条の11）。","m":"迷惑な時間の訪問NG"},{"f":"業法","t":"事務所・案内所","ref":"H24-42-ア","s":"売主業者Bから分譲マンションの販売代理を受けた業者Aが現地の隣に案内所を設ける場合、マンションの所在地にはAが標識を掲げ、売主Bは掲げなくてよい。","a":0,"e":"物件の所在地に標識を掲げるのは売主B。代理業者Aは自ら設けた案内所に標識を掲げる（50条1項）。","m":"現地の標識は売主"},{"f":"業法","t":"事務所・案内所","ref":"H24-42-イ","s":"販売代理業者Aが契約締結を行う案内所を設ける場合、案内所の届出は売主業者Bが行えばよく、案内所を設置したA自身は届出をする必要はない。","a":0,"e":"届出は案内所を設けたAが、業務開始の10日前までに免許権者と案内所所在地の知事に行う（50条2項）。","m":"届出は設置した業者が"},{"f":"業法","t":"事務所・案内所","ref":"H24-42-ウ","s":"販売代理業者Aが契約締結を行う案内所を設けた場合、Aはそこに成年者である専任の宅建士を置かなければならないが、売主業者Bは置く必要がない。","a":1,"e":"専任の宅建士を置く義務は案内所を設置した業者Aにある。売主Bに設置義務はない（31条の3）。","m":"案内所を設けた者が置く"},{"f":"業法","t":"事務所・案内所","ref":"H24-42-エ","s":"販売代理業者Aが分譲マンションの案内所に掲げる標識には、Aの情報に加えて、売主業者Bの商号または名称と免許証番号も記載しなければならない。","a":1,"e":"代理・媒介業者が設ける案内所の標識には、売主の商号・名称と免許証番号も記載する（規則19条）。","m":"案内所標識に売主も記載"},{"f":"業法","t":"保証協会","ref":"H24-43-1","s":"保証協会は、社員から弁済業務保証金分担金の納付を受けたときは、その日から1週間以内に、納付額に相当する額の弁済業務保証金を供託しなければならない。","a":1,"e":"保証協会は分担金の納付を受けた日から1週間以内に同額を供託所に供託する（64条の7）。","m":"協会の供託は1週間"},{"f":"業法","t":"保証協会","ref":"H24-43-2","s":"弁済業務保証金の還付があった場合、保証協会は国土交通大臣から通知を受けた日から2週間以内に、還付額に相当する弁済業務保証金を供託しなければならない。","a":1,"e":"還付があると、協会は国土交通大臣から通知を受けた日から2週間以内に補充供託する（64条の8第3項）。","m":"還付後の補充は2週間"},{"f":"業法","t":"保証協会","ref":"H24-43-3","s":"保証協会の社員と宅建業の取引をした者（宅建業者を除く）は、その社員が納付した弁済業務保証金分担金の額の範囲内でのみ弁済を受けることができる。","a":0,"e":"弁済を受けられるのは、社員でなければ供託すべき営業保証金の額の範囲内。本店のみなら分担金60万でも1,000万円まで。","m":"還付は営業保証金の額まで"},{"f":"業法","t":"保証協会","ref":"H24-43-4","s":"保証協会の社員との宅建業の取引で債権を取得した者（宅建業者を除く）が弁済を受ける権利を実行するには、その額について保証協会の認証を受けなければならない。","a":1,"e":"弁済業務保証金から還付を受けるには、保証協会の認証を受ける必要がある（64条の8第2項）。","m":"還付には協会の認証"},{"f":"業法","t":"監督・罰則","ref":"H24-44-1","s":"国土交通大臣または都道府県知事が宅建業者に対して指示処分をしようとするときは、行政手続法上の弁明の機会を与えれば足り、聴聞を行う必要はない。","a":0,"e":"宅建業者への指示・業務停止・免許取消は、処分前に公開の聴聞を行わなければならない（69条）。","m":"処分の前は聴聞"},{"f":"業法","t":"監督・罰則","ref":"H24-44-2","s":"甲県知事が国土交通大臣免許の宅建業者に指示処分をした場合、甲県知事は大臣に通知するとともに、甲県の公報でその旨を公告しなければならない。","a":0,"e":"公告が必要なのは業務停止と免許取消で、指示処分は公告不要。免許権者への通知は必要（70条）。","m":"指示処分は公告なし"},{"f":"業法","t":"監督・罰則","ref":"H24-44-3","s":"乙県知事が丙県知事免許の宅建業者に業務停止処分をした場合、処分の年月日と内容は、乙県知事が備える宅建業者名簿に記載される。","a":0,"e":"処分の内容は免許権者の名簿に記載する。乙県知事は丙県知事に通知し、丙県の名簿に記載される。","m":"名簿は免許権者のもの"},{"f":"業法","t":"監督・罰則","ref":"H24-44-4","s":"国土交通大臣は、自ら免許を与えた宅建業者が、業者でない個人を相手方とする取引で37条書面を交付しなかったことを理由に業務停止処分をするときは、あらかじめ内閣総理大臣と協議しなければならない。","a":1,"e":"大臣免許業者を消費者保護の規定違反で処分するときは、あらかじめ内閣総理大臣と協議する（71条の2）。","m":"大臣処分は総理と協議"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H24-45-1","s":"自ら売主として新築住宅を引き渡した宅建業者は、資力確保措置の状況について、その住宅を引き渡した日から3週間以内に免許権者へ届け出なければならない。","a":0,"e":"届出は引渡しの日ではなく、基準日から3週間以内に行う（住宅瑕疵担保履行法12条）。","m":"届出は基準日から3週間"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H24-45-2","s":"新築住宅を引き渡した宅建業者が基準日に係る届出をしなかった場合、基準日の翌日から起算して50日を経過した日以後は、新たに自ら売主となる新築住宅の売買契約を結べない。","a":1,"e":"届出をしないと、基準日の翌日から50日経過後は新たな新築住宅の売買契約が禁止される（13条）。","m":"届出なしは50日後から禁止"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H24-45-3","s":"新築住宅を自ら売主として販売する宅建業者が締結する住宅販売瑕疵担保責任保険契約は、売買契約を締結した日から5年間有効なものであればよい。","a":0,"e":"保険契約は新築住宅の引渡しから10年以上の期間にわたり有効でなければならない（2条）。","m":"保険は引渡しから10年以上"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H24-45-4","s":"保証金を供託している宅建業者は、供託所の所在地などを記載した書面の交付と説明を、新築住宅の売買契約を結んでから引渡しまでの間に行えばよい。","a":0,"e":"供託所の所在地等の書面交付・説明は、売買契約を締結するまでに行わなければならない（15条）。","m":"供託所の説明は契約前"},{"f":"税他","t":"住宅金融支援機構","ref":"H24-46-1","s":"住宅金融支援機構は、証券化支援事業（買取型）において、民間金融機関から買い取った住宅ローン債権を担保として、MBS（資産担保証券）を発行している。","a":1,"e":"買取型では、買い取った住宅ローン債権を信託し、それを担保にMBSを発行して投資家から資金を調達する。","m":"買取型はMBSで資金調達"},{"f":"税他","t":"住宅金融支援機構","ref":"H24-46-2","s":"証券化支援事業（買取型）の対象となる民間金融機関の住宅ローン（フラット35）の金利は、取り扱う金融機関によって異なる場合がある。","a":1,"e":"フラット35の金利は各金融機関が独自に決めるため、金融機関ごとに異なることがある。","m":"金利は金融機関ごと"},{"f":"税他","t":"住宅金融支援機構","ref":"H24-46-4","s":"住宅金融支援機構の証券化支援事業（買取型）では、新築住宅の建設・購入の貸付債権だけでなく、中古住宅の購入のための貸付債権も買取りの対象としている。","a":1,"e":"機構の定める技術基準を満たしていれば、中古住宅の購入資金の貸付債権も買取型の対象になる。","m":"中古住宅も買取対象"},{"f":"税他","t":"景品表示法","ref":"H24-47-1","s":"宅建業者が自ら所有する不動産を販売する広告では、取引態様として「直販」と表示すれば、不動産の表示に関する公正競争規約上問題はない。","a":0,"e":"取引態様は「売主」「貸主」「代理」「媒介（仲介）」のいずれかの用語で表示しなければならない。","m":"直販ではなく売主"},{"f":"税他","t":"景品表示法","ref":"H24-47-2","s":"宅建業者が改装済みの中古住宅を「改装済み」と表示して販売する広告を出す場合、その改装の内容と時期を明示しなければならない。","a":1,"e":"建物を増築・改築・改装・改修したことを表示するときは、その内容と時期を明示す

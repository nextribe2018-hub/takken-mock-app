の譲渡は有効である。","a":1,"e":"将来発生する債権も、特定されていれば譲渡できる。譲受人は発生した債権を当然に取得する（民法466条の6、判例）。","m":"将来債権も特定すれば譲渡OK"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H28-05-4","s":"AがBに対する債権をCに譲渡し通知した。Bが通知を受ける前からAに対する貸金債権を持っていた場合、Bは通知後に相殺の意思表示をして、それをCに対抗できる。","a":1,"e":"債務者は、対抗要件具備の前に取得した譲渡人への債権による相殺を譲受人に対抗できる（民法469条1項）。","m":"通知前の反対債権で相殺可"},{"f":"権利","t":"売買・契約不適合","ref":"H28-06-2","s":"AがC所有の甲土地をBに売却し、BはCの所有と知って契約した。Aが甲土地の所有権を取得してBに移転できないときは、Bは売買契約を解除できる。","a":1,"e":"他人物売買の売主は権利を取得して移転する義務を負い、果たせなければ買主は解除できる。買主の善意・悪意は問わない（民法561条・542条）。","m":"他人物売買は悪意でも解除可"},{"f":"権利","t":"賃貸借","ref":"H28-08-3","s":"AがBに建物を賃貸し、BがAの承諾を得てCに転貸している。AがBの債務不履行を理由に賃貸借を解除したときは、Cに賃料の滞納がなくても、AはCに明渡しを請求できる。","a":1,"e":"債務不履行解除で原賃貸借が終われば、転借人は賃貸人に転借権を対抗できず、明渡しを拒めない（判例）。","m":"債務不履行解除は転借人に勝つ"},{"f":"権利","t":"不法行為・請負・委任","ref":"H28-09-1","s":"売買契約の締結前に売主が信義則上の説明義務に違反し、買主が損害を受けた。この賠償請求権は、買主が損害と加害者を知った時から3年行使しないと時効で消滅する（生命・身体の侵害ではない）。","a":1,"e":"契約前の説明義務違反は不法行為責任となる（判例）。生命・身体以外の侵害なら、知った時から3年で消滅時効（民法724条）。","m":"契約前の説明違反＝不法行為"},{"f":"権利","t":"相続","ref":"H28-10-3","s":"甲建物を所有するAが死亡し、子BとCが相続人となった。Cが単純承認をしたときは、Bは単独で限定承認をすることができない。","a":1,"e":"共同相続では、限定承認は相続人全員が共同してしなければならない。1人が単純承認すれば限定承認はできない（民法923条）。","m":"限定承認は全員そろって"},{"f":"権利","t":"借地","ref":"H28-11-2","s":"借地権者Aが借地上の建物を自己名義で登記したが、登記上の所在地番や床面積が実際と少しでも違っている場合、Aは土地の譲受人に借地権を対抗できない。","a":0,"e":"登記の表示が実際と多少違っても、建物の同一性が認められる程度の軽微な相違なら対抗力は失われない（判例）。","m":"軽微なズレなら対抗できる"},{"f":"権利","t":"借家","ref":"H28-12-4","s":"賃貸人Bと賃借人Aが期間3年の定期建物賃貸借を結んだ。Bは期間満了の1年前から6か月前までにAに終了の通知をしなければ、期間満了による終了をAに対抗できない。","a":1,"e":"期間1年以上の定期建物賃貸借では、賃貸人は所定期間内に終了通知をしないと終了を対抗できない（借地借家法38条）。","m":"定期借家は1年〜6か月前通知"},{"f":"権利","t":"区分所有法","ref":"H28-13-3","s":"区分所有法上、集会の決議で選任される管理者には、自然人だけでなく法人もなることができるが、区分所有者以外の者は管理者になることができない。","a":0,"e":"管理者の資格に制限はなく、区分所有者でない者（管理会社など）も選任できる（区分所有法25条）。","m":"管理者は外部でもOK"},{"f":"権利","t":"不動産登記法","ref":"H28-14-2","s":"不動産登記法上、登記することができる権利には、所有権や地上権のほか、担保物権である抵当権や、債権である不動産の賃借権も含まれる。","a":1,"e":"登記できる権利は所有権・地上権・永小作権・地役権・先取特権・質権・抵当権・賃借権・配偶者居住権・採石権（不動産登記法3条）。","m":"賃借権も登記できる"},{"f":"法令","t":"都市計画法","ref":"H28-16-1","s":"都市計画法上、市街地開発事業等予定区域に係る市街地開発事業や都市施設に関する都市計画には、施行予定者を定めなければならない。","a":1,"e":"予定区域に係る事業の都市計画では、施行予定者を必ず定める。予定区域の都市計画にも施行予定者を定める。","m":"予定区域は施行予定者必須"},{"f":"法令","t":"都市計画法","ref":"H28-16-3","s":"高度利用地区は、用途地域内で市街地の環境維持や土地利用の増進のため、建築物の高さの最高限度または最低限度を定める地区である。","a":0,"e":"高さの最高・最低限度を定めるのは高度地区。高度利用地区は容積率・建ぺい率・建築面積の最低限度・壁面の位置を定める。","m":"高さは高度地区"},{"f":"法令","t":"都市計画法","ref":"H28-16-4","s":"地区計画の都市計画には、地区計画の種類・名称・位置・区域のほか、必ず建築物の建ぺい率及び容積率の最高限度を定めなければならない。","a":0,"e":"建ぺい率・容積率の最高限度などは地区整備計画で定めることができる事項であり、地区計画に必ず定める事項ではない。","m":"建ぺい・容積は任意事項"},{"f":"税他","t":"印紙税・登録免許税","ref":"H28-23-3","s":"Aが所有する価額3,000万円の土地をBに贈与する旨の契約書は、記載金額のない不動産譲渡契約書として扱われ、印紙税額は200円となる。","a":1,"e":"贈与は対価がないため、価額を書いても記載金額とはならず、記載金額のない契約書として200円が課される。","m":"贈与契約書は200円"},{"f":"税他","t":"印紙税・登録免許税","ref":"H28-23-4","s":"宅建業者が売買の媒介で受け取った仲介手数料49,500円（消費税等込み）について作成した受取書には、印紙税が課されない。","a":1,"e":"売上代金の受取書は記載金額5万円未満なら非課税。消費税額が区分記載されていれば税抜で判定するが、本件は込みでも5万円未満。","m":"受取書は5万円未満非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H28-24-1","s":"家屋が新築された日から3年を経過しても最初の使用または譲渡が行われない場合は、3年を経過した日に家屋の取得があったものとみなされ、不動産取得税が課される。","a":0,"e":"原則は新築から6か月経過時に取得とみなされる（宅建業者等が売る新築住宅には1年とする特例がある）。3年ではない。","m":"みなし取得は原則6か月"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H28-24-4","s":"個人が住宅以外の家屋（店舗や事務所など）の敷地となる土地を取得した場合、その土地に係る不動産取得税の税率は本則どおり4%である。","a":0,"e":"本則は4%だが、土地と住宅には3%の特例税率がある。4%となるのは住宅以外の家屋だけ。","m":"家屋（非住宅）だけ4%"},{"f":"業法","t":"媒介契約","ref":"H28-27-1","s":"宅建業者Aが宅地の売却について一般媒介契約を締結した場合、標準媒介契約約款に基づくか否かの別は、媒介契約書に記載する必要はない。","a":0,"e":"標準媒介契約約款に基づくか否かの別は、一般・専任を問わず媒介契約書（34条の2書面）の記載事項。","m":"約款の別は必ず記載"},{"f":"業法","t":"媒介契約","ref":"H28-27-2","s":"宅建業者が専任媒介契約に基づき指定流通機構に登録した宅地について売買契約が成立したときは、引渡しが完了してから遅滞なく指定流通機構に通知すればよい。","a":0,"e":"通知は売買契約の成立後遅滞なく行う。引渡しの完了を待つ必要はない（宅建業法34条の2）。","m":"成約したらすぐ通知"},{"f":"業法","t":"媒介契約","ref":"H28-27-4","s":"宅建業者が宅地の売却について一般媒介契約を締結した場合は、専任媒介契約と異なり、媒介契約書に売買すべき価額を記載する必要はない。","a":0,"e":"売買すべき価額（評価額）は、一般・専任を問わず媒介契約書の記載事項である（宅建業法34条の2第1項）。","m":"価額は一般でも記載"},{"f":"業法","t":"8種制限","ref":"H28-28-ア","s":"宅建業者Aが自ら売主として、宅建業者でないBに未完成のマンションを代金4,000万円で売却し、手付金200万円を受領した後、中間金200万円を受け取ってから保全措置を講じた。これは宅建業法に違反しない。","a":0,"e":"未完成物件は代金の5%を超える手付金等を受け取る前に保全措置が必要。中間金で合計400万円となるので受領前に講じなければ違反。","m":"超える前に保全措置"},{"f":"業法","t":"8種制限","ref":"H28-28-エ","s":"宅建業者Aが自ら売主として、宅建業者でないBと代金4,000万円の売買契約を結び、損害賠償の予定額を1,000万円とする特約をした。この特約は800万円を超える部分について無効となる。","a":1,"e":"違約金と損害賠償予定額の合計は代金の2/10が上限。超える部分のみ無効となる（宅建業法38条）。","m":"賠償予定は2割まで"},{"f":"業法","t":"保証協会","ref":"H28-31-1","s":"保証協会への加入は任意であるため、宅建業者は一つの保証協会の社員となった後でも、重ねて他の保証協会の社員となることができる。","a":0,"e":"保証協会の社員となった者は、他の保証協会の社員となることはできない（宅建業法64条の4）。","m":"保証協会は一つだけ"},{"f":"業法","t":"保証協会","ref":"H28-31-2","s":"保証協会の社員である宅建業者が新たに事務所を設置したときは、その日から2週間以内に弁済業務保証金分担金を納付しなければ、社員の地位を失う。","a":1,"e":"新事務所設置の日から2週間以内に分担金（1か所30万円）を納付しないと社員の地位を失う（宅建業法64条の9）。","m":"新事務所は2週間で納付"},{"f":"業法","t":"保証協会","ref":"H28-31-3","s":"保証協会から還付充当金を納付するよう通知を受けた社員は、通知を受けた日から2週間以内に、主たる事務所の最寄りの供託所に供託しなければならない。","a":0,"e":"還付充当金は供託所ではなく保証協会に、通知を受けた日から2週間以内に納付する（宅建業法64条の10）。","m":"還付充当金は協会へ"},{"f":"業法","t":"報酬","ref":"H28-33-ア","s":"売主があらかじめ受取額を決め、実際の売却額との差額を媒介業者が受け取る取り決めをした場合、その差額には報酬の限度額は適用されない。","a":0,"e":"媒介業者が受け取れるのは限度額内の報酬と依頼者の依頼による広告料金等だけで、差額を受け取ることはできない。","m":"差額取りは不可"},{"f":"業法","t":"免許","ref":"H28-35-1","s":"宅建業者が免許の更新を申請せず、免許の有効期間が満了して免許が効力を失った場合、その宅建業者は遅滞なく免許証を免許権者に返納しなければならない。","a":0,"e":"返納が必要なのは免許換えによる失効、免許取消し、亡失免許証の発見、廃業等の届出の場合で、期間満了は含まれない。","m":"期間満了は返納不要"},{"f":"業法","t":"免許","ref":"H28-35-2","s":"業務停止処分を受けている期間中の宅建業者であっても、その期間中に免許の有効期間が満了する場合には、免許の更新を申請することができる。","a":1,"e":"業務停止処分では免許は失効しない。停止期間後の営業に備え、停止期間中でも更新申請はできる。","m":"業務停止中も更新可"},{"f":"業法","t":"免許","ref":"H28-35-3","s":"法人である宅建業者について破産手続開始の決定があった場合、その法人を代表する役員が、決定の日から30日以内に免許権者へ届け出なければならない。","a":0,"e":"破産手続開始決定の場合、届出義務者は破産管財人である（法11条1項3号）。期間の30日以内は正しい。","m":"破産の届出は管財人"},{"f":"権利","t":"代理","ref":"H29-01-3","s":"復代理人が委任事務の処理で金銭を受領し、それを代理人に引き渡したときは、復代理人の本人に対する受領物の引渡義務も消滅する。","a":1,"e":"復代理人が代理人に受領物を引き渡せば、代理人への義務とともに本人への引渡義務も消滅する（判例）。","m":"代理人に渡せば本人分も済み"},{"f":"権利","t":"物権変動・対抗","ref":"H29-02-3","s":"AがBに土地を売り、代金を完済するまで所有権は移転しないとの特約を付けた。この場合でも、所有権は売買契約の締結時にBへ移転する。","a":0,"e":"所有権の移転時期は特約で定められる。特約がなければ契約時に移転するが、本件は特約どおり代金完済時に移転する。","m":"移転時期は特約優先"},{"f":"権利","t":"共有・相隣","ref":"H29-03-2","s":"AとBが共有する建物を、AがBと協議せずにCへ使用貸借した。この場合でも、BはCに対し当然には建物の明渡しを請求できない。","a":1,"e":"協議なく承認を受けた第三者も、承認した共有者の持分の範囲では使用権原があるため、他の共有者は当然には明渡しを求められない（判例）。","m":"持分の範囲で使える"},{"f":"権利","t":"売買・契約不適合","ref":"H29-04-3","s":"民法上、不動産の売主は、買主に対し、所有権移転登記など売買の目的である権利の移転についての対抗要件を備えさせる義務を負う。","a":1,"e":"売主は買主に登記などの対抗要件を備えさせる義務を負う。債権法改正で明文化された（民法560条）。","m":"売主は登記まで面倒を見る"},{"f":"権利","t":"売買・契約不適合","ref":"H29-05-1","s":"AがCに中古自動車を100万円で売却した場合、特約がなければ、Cは自動車の引渡しを受ける前に代金100万円を支払わなければならない。","a":0,"e":"売買の代金支払と目的物の引渡しは同時履行の関係にあり、先に代金だけ払う義務はない（民法533条）。","m":"代金と引渡しは同時"},{"f":"権利","t":"売買・契約不適合","ref":"H29-05-3","s":"AがCに中古自動車を売り、買主Cが売主Aに手付10万円を交付した場合、Aは手付の倍額20万円を現実に提供すれば、いつでも売買契約を解除できる。","a":0,"e":"手付解除は相手方が契約の履行に着手するまでに限られる。「いつでも」ではない（民法557条1項）。","m":"手付解除は着手まで"},{"f":"権利","t":"売買・契約不適合","ref":"H29-05-4","s":"Bの媒介でAがCに100万円で売却した中古自動車が、実はAではなくAの父の所有物であった場合でも、AC間の売買契約は有効に成立する。","a":1,"e":"他人の物の売買も有効で、売主はその権利を取得して買主に移転する義務を負う（民法561条）。","m":"他人物売買も有効"},{"f":"権利","t":"相続","ref":"H29-06-1","s":"Aが死亡し、相続人がB・Cの2名の場合、BがAの配偶者でCが子のときの方が、BとCがともにAの子のときより、Bの法定相続分は大きい。","a":0,"e":"配偶者と子1人なら各1/2、子2人なら各1/2で、Bの法定相続分は同じ（民法900条）。","m":"配偶者＋子1人は半々"},{"f":"権利","t":"不法行為・請負・委任","ref":"H29-07-1","s":"請負人の責任で工事が途中で終わり、注文者が残工事を別業者に依頼した場合、注文者が請負人に請求できるのは、残工事費のうち未施工部分の報酬相当額を超える部分に限られる。","a":1,"e":"注文者は未施工部分の報酬を払わずに済むので、残工事費がそれを超える額だけを損害として請求できる（判例）。","m":"超過分だけ請求できる"},{"f":"権利","t":"保証・連帯債務","ref":"H29-08-1","s":"A・B・CがDに連帯債務を負っている。DがAに履行を請求した場合、BとCがそのことを知っていれば、BとCにも請求の効力が生じる。","a":0,"e":"連帯債務者の1人への請求は相対効で、他の債務者には効力が及ばない。知っていても同じ（民法441条）。","m":"請求は相対効"},{"f":"権利","t":"保証・連帯債務","ref":"H29-08-2","s":"A・B・CがDに900万円の連帯債務を負う。AがDに対する200万円の債権で相殺したときは、BとCの債務も200万円分消滅する。","a":1,"e":"連帯債務者の1人による相殺は絶対効で、相殺した分だけ全員の債務が消滅する（民法439条1項）。","m":"相殺は絶対効"},{"f":"権利","t":"保証・連帯債務","ref":"H29-08-3","s":"A・B・CがDに対して900万円の連帯債務を負っている（負担部分は等しい）。Bについて消滅時効が完成した場合、AとCの債務も全部消滅する。","a":0,"e":"時効の完成は相対効で、Bの債務が消えるだけ。AとCの債務には影響しない（民法441条）。","m":"時効は相対効"},{"f":"権利","t":"相続","ref":"H29-09-1","s":"配偶者のいないAが死亡し、Aには子B・C・Dがいた。Bが家庭裁判所に申述して相続を放棄した場合、Bの子EはBに代わってAの相続人となる。","a":0,"e":"相続放棄は代襲原因にならないので、Bの子Eは相続人にならない。代襲原因は死亡・欠格・廃除だけ（民法887条）。","m":"放棄に代襲なし"},{"f":"権利","t":"相続","ref":"H29-09-2","s":"配偶者のいないAに子B・C・Dがいて、Bは相続放棄し、CはAの遺言を強迫で妨げたため相続欠格となった。Cに子Fがいる場合、Dが遺産の全部を相続する。","a":0,"e":"欠格は代襲原因なので、Cの子Fが代襲相続する。相続人はDとFで各1/2となる（民法887条・891条）。","m":"欠格・廃除は代襲あり"},{"f":"権利","t":"抵当権・担保","ref":"H29-10-2","s":"民法上、不動産質権は10年を超える存続期間を定めても10年に短縮されるが、抵当権には存続期間の上限についての制限は設けられていない。","a":1,"e":"不動産質権は質権者が使用収益するため期間を最長10年に制限している（360条）。抵当権にはこのような期間制限はない。","m":"質権10年・抵当権は無制限"},{"f":"権利","t":"抵当権・担保","ref":"H29-10-3","s":"債権者のために不動産に抵当権を設定する場合、不動産質権と同じく、設定者から抵当権者へ目的不動産を引き渡さなければ効力を生じない。","a":0,"e":"質権は目的物の引渡しが効力発生要件だが（344条）、抵当権は設定者が使用収益を続けるため引渡しは不要。","m":"抵当権は引渡し不要"},{"f":"権利","t":"抵当権・担保","ref":"H29-10-4","s":"民法上、不動産質権も抵当権も不動産に関する物権であるため、いずれもその設定を第三者に対抗するには、登記を備えなければならない。","a":1,"e":"どちらも不動産上の担保物権であり、不動産物権変動の対抗要件である登記が必要となる（177条）。","m":"質権も抵当権も登記で対抗"},{"f":"権利","t":"借地","ref":"H29-11-4","s":"更新がなく建物買取請求もしない定期借地権を設定する場合、賃貸人は契約前に、更新がない旨を記載した書面を交付して借地人に説明しなければならない。","a":0,"e":"事前に書面を交付して説明する義務は定期建物賃貸借の規定（38条）で、定期借地権にはこの説明義務はない。","m":"事前説明は定期借家だけ"},{"f":"権利","t":"借家","ref":"H29-12-3","s":"Aから建物を借りたBがAの承諾を得てCに転貸している場合、期間満了による賃貸借の終了をCに対抗するには、BからCへ通知すれば足りる。","a":0,"e":"賃貸借の終了を転借人に対抗するには、賃貸人Aが転借人Cにその旨を通知する必要がある（借地借家法34条）。","m":"終了通知は賃貸人から転借人"},{"f":"権利","t":"区分所有法","ref":"H29-13-1","s":"区分所有建物に管理者が選任されている場合、その管理者は、少なくとも毎年1回、区分所有者による集会を招集しなければならない。","a":1,"e":"管理者には年1回以上の集会招集義務があり、集会で事務の報告をする（区分所有法34条2項・43条）。","m":"管理者は年1回招集"},{"f":"権利","t":"不動産登記法","ref":"H29-14-2","s":"Aの土地にBのための地上権の設定の登記をする場合において、当事者間で地上権の存続期間の定めがあるときは、その定めも登記事項となる。","a":1,"e":"地上権の登記では、設定目的のほか存続期間や地代・支払時期の定めがあればそれも登記事項となる（不登法78条）。","m":"地上権は期間も登記"},{"f":"法令","t":"開発許可","ref":"H29-17-1","s":"準都市計画区域内において、工場の建築を目的とする1,000㎡の土地の区画形質の変更を行う場合、都道府県知事の開発許可を受けなければならない。","a":0,"e":"準都市計画区域では3,000㎡未満の開発行為は許可不要。1,000㎡なので許可は要らない（都計法29条1項1号）。","m":"準都計は3,000㎡未満不要"},{"f":"法令","t":"開発許可","ref":"H29-17-2","s":"市街化区域内において、農業を営む者の居住用建築物を建築する目的で1,000㎡の開発行為を行う場合、開発許可を受ける必要がある。","a":1,"e":"農業者住宅の例外は市街化区域外のルール。市街化区域では1,000㎡以上なら原則どおり許可が必要（29条1項）。","m":"市街化区域に農業例外なし"},{"f":"法令","t":"開発許可","ref":"H29-17-4","s":"区域区分が定められていない都市計画区域内において、遊園地の建設を目的とする3,000㎡の土地の区画形質の変更を行う場合、開発許可が必要である。","a":0,"e":"遊園地は1ha以上で第二種特定工作物となる。3,000㎡の遊園地は特定工作物ではなく開発行為に当たらない。","m":"遊園地は1ha以上で対象"},{"f":"法令","t":"建築基準法","ref":"H29-18-1","s":"建築確認を要する2階建ての鉄筋コンクリート造の住宅でも、特定行政庁が安全上・防火上・避難上支障がないと認めたときは、検査済証の交付前に仮に使用できる。","a":1,"e":"検査済証の交付前は原則使用禁止だが、特定行政庁等の仮使用の認定があれば例外的に使用できる（法7条の6）。","m":"仮使用は認定で可"},{"f":"法令","t":"建築基準法","ref":"H29-18-2","s":"長屋又は共同住宅の各戸の界壁は、一定の遮音性能をもつ天井を設ける場合を除き、小屋裏又は天井裏に達するものとしなければならない。","a":1,"e":"界壁は遮音性能を備え、原則として小屋裏・天井裏まで達させる。一定の遮音性能をもつ天井なら例外あり（法30条）。","m":"界壁は天井裏まで"},{"f":"法令","t":"建築基準法","ref":"H29-18-3","s":"下水道法に規定する処理区域内に建築物を建てる場合、その便所は、汚水管が公共下水道に連結された水洗便所としなければならない。","a":1,"e":"処理区域内の便所は、公共下水道に接続した水洗便所以外としてはならない（法31条1項）。","m":"処理区域は水洗便所"},{"f":"業法","t":"クーリング・オフ","ref":"H29-31-イ","s":"宅建業者Aが自ら売主となる売買で、買主Bが書面によりクーリング・オフによる契約解除を行う場合、その効力はBが書面を発した時に生じる。","a":1,"e":"クーリング・オフは発信主義で、書面を発した時に効力が生じる。売主が受け取らなくても解除できる（業法37条の2第2項）。","m":"クーリング・オフは発信時"},{"f":"業法","t":"8種制限","ref":"H29-31-ウ","s":"宅建業者Aが宅建業者でないBに代金3,000万円で自ら売主として売却する際、損害賠償額の予定600万円と違約金300万円を定めた場合、その特約は全体が無効となる。","a":0,"e":"予定額と違約金の合計は代金の2割が上限。超えた部分（300万円）だけが無効で、全体が無効になるわけではない（業法38条）。","m":"2割超えた分だけ無効"},{"f":"権利","t":"意思表示・行為能力","ref":"H30-01-1","s":"AがCの詐欺によりBに土地を売却し、その後契約を取り消した場合、BのAへの登記抹消義務とAのBへの代金返還義務は同時履行の関係に立つ。","a":1,"e":"取消し後の双方の原状回復義務は、公平の観点から同時履行の関係に立つとされている（判例、533条類推）。","m":"原状回復は同時履行"},{"f":"権利","t":"意思表示・行為能力","ref":"H30-01-2","s":"売主Aの錯誤について重大な過失があるためAが錯誤による取消しを主張できない場合、相手方である買主Bもその錯誤を理由に取り消すことはできない。","a":1,"e":"錯誤による取消しは表意者やその代理人・承継人に限られ、相手方からは取り消せない（95条・120条2項）。","m":"錯誤取消しは表意者側だけ"},{"f":"権利","t":"時効","ref":"H30-04-3","s":"債務者がした詐害行為の受益者は、その詐害行為取消権を行使する債権者の被保全債権について、消滅時効を援用することができる。","a":1,"e":"被保全債権が消滅すれば受益者は取消しを免れる直接の利益があるため、援用権者に当たる（判例、145条）。","m":"受益者は援用できる"},{"f":"権利","t":"不法行為・請負・委任","ref":"H30-05-2","s":"台風の接近時に頼まれずに隣人Bの屋根を修理したAは、Bから請求があったときは、いつでも事務の処理の状況を報告しなければならない。","a":1,"e":"事務管理には委任の受任者の報告義務が準用され、本人の請求があればいつでも報告する（701条・645条）。","m":"事務管理も報告義務"},{"f":"権利","t":"抵当権・担保","ref":"H30-06-1","s":"Aが土地と、B名義で登記されたままの建物を実質的に所有している状態で、土地にCの抵当権を設定した場合、競売により法定地上権が成立する。","a":1,"e":"法定地上権の同一所有者要件は実質で判断し、建物の登記名義が前所有者のままでも成立する（判例、388条）。","m":"同一所有は実質で判断"},{"f":"権利","t":"抵当権・担保","ref":"H30-06-3","s":"土地と建物に共同抵当権を設定した後に建物を取り壊して新建物を建て、新建物に抵当権を設定しなかった場合、原則として新建物のための法定地上権は成立しない。","a":1,"e":"共同抵当の建物が再築された場合、新建物に同順位の共同抵当が設定されたなどの特段の事情がない限り不成立（判例）。","m":"共同抵当の再築は不成立"},{"f":"権利","t":"抵当権・担保","ref":"H30-06-4","s":"土地に抵当権を設定した後、土地所有者Aがその土地上の自己所有の建物をDに譲渡した場合、土地が競売されても法定地上権は成立しない。","a":0,"e":"法定地上権の要件は抵当権設定時を基準に判断する。設定後に建物を譲渡しても法定地上権は成立する（判例）。","m":"要件は設定時で判断"},{"f":"権利","t":"賃貸借","ref":"H30-07-1","s":"賃借人が建物をどのように使用して損耗させても、その減価分は賃料で回収されているから、賃貸人は賃借人に補修費を請求できない。","a":0,"e":"賃料で回収されるのは通常損耗分のみ。故意・過失など通常の使用を超える損耗は賃借人が原状回復義務を負う（621条）。","m":"通常損耗だけ賃料で回収"},{"f":"権利","t":"賃貸借","ref":"H30-07-2","s":"判例によれば、建物賃貸借でいう通常損耗とは、賃借人が社会通念上通常の使用をした場合に生じる賃借物件の劣化又は価値の減少をいう。","a":1,"e":"判例は通常損耗をこのように定義し、民法も通常損耗・経年変化を賃借人の原状回復義務から除いている（621条）。","m":"通常使用の劣化＝通常損耗"},{"f":"権利","t":"賃貸借","ref":"H30-07-3","s":"賃借人に通常損耗の原状回復義務を負わせるには、その範囲が契約書に明記されているか口頭で説明され、賃借人が明確に認識して合意していることが必要である。","a":1,"e":"通常損耗の補修を賃借人負担とするのは予期しない特別の負担なので、特約が明確に合意されていることが必要（判例）。","m":"通常損耗特約は明確合意"},{"f":"権利","t":"賃貸借","ref":"H30-07-4","s":"建物の賃貸借契約書に「賃借人は退去時に原状回復義務を負う」とだけ定めていれば、賃借人は通常損耗の補修費用も負担しなければならない。","a":0,"e":"抽象的な原状回復条項だけでは足りず、負担する通常損耗の範囲が具体的に明確に合意されている必要がある（判例）。","m":"抽象条項では足りない"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H30-08-4","s":"譲渡制限の意思表示がされた債権に質権を設定した場合、質権者がその意思表示を知っていたときは、債務者は質権者からの履行請求を拒むことができる。","a":1,"e":"質権設定も原則有効だが、債権譲渡と同様に悪意・重過失の質権者には債務者は履行を拒める（466条3項）。","m":"質権者にも同じルール"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H30-09-1","s":"代金債権の支払期日が12月1日、買主Bの売主Aに対する貸金債権の弁済期が12月31日である場合、Bは12月1日の時点で両債権を相殺できる。","a":0,"e":"自働債権であるBの貸金債権の弁済期が到来していないため、12月1日の時点では相殺できない（505条）。","m":"自働債権は弁済期必要"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H30-09-2","s":"Aの代金債権がAの債権者Cに差し押さえられた後に、BがAに対する貸金債権を他人から取得した場合、BはこれをもってCに相殺を対抗できる。","a":0,"e":"差押え後に他人から取得した債権による相殺は差押債権者に対抗できない（511条1項）。","m":"差押え後取得は対抗不可"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"H30-09-4","s":"BのAに対する貸金債権が、Aの代金債権が発生する前日に消滅時効期間を経過し、Aが時効を援用した場合でも、Bはその貸金債権で相殺できる。","a":0,"e":"時効消滅した債権で相殺できるのは時効完成前に相殺適状にあった場合だけ。両債権が並存しておらず相殺できない（508条）。","m":"時効前に相殺適状が必要"},{"f":"権利","t":"共有・相隣","ref":"H30-10-4","s":"遺産分割前の共有建物で持分の過半数を有する相続人は、協議を経ずに単独で占有している他の相続人に対し、当然に建物の明渡しを請求できる。","a":0,"e":"各共有者は持分に応じて全体を使用でき、過半数持分者でも当然には明渡しを請求できない（判例、249条）。","m":"過半数でも当然明渡し不可"},{"f":"権利","t":"借地","ref":"H30-11-3","s":"AとBが建物所有を目的とする普通借地権の存続期間を60年と定めた場合でも、公正証書で契約しなければ、存続期間は30年となる。","a":0,"e":"普通借地権は30年以上の期間を自由に定められ、60年の定めは書面の形式を問わず有効（借地借家法3条）。","m":"30年超はそのまま有効"},{"f":"権利","t":"借家","ref":"H30-12-1","s":"期間5年の定期建物賃貸借では、賃貸人が期間満了の1年前から6か月前までに終了の通知をしなくても、期間満了により終了を賃借人に対抗できる。","a":0,"e":"期間1年以上の定期建物賃貸借は、1年前から6か月前までに終了を通知しなければ終了を賃借人に対抗できない（38条6項）。","m":"定期借家は事前通知"},{"f":"権利","t":"区分所有法","ref":"H30-13-1","s":"区分所有建物の規約の設定・変更・廃止は、集会において区分所有者及び議決権の各過半数による普通決議で行うことができるとされている。","a":0,"e":"規約の設定・変更・廃止は特別決議が必要（2026年4月以後は出席した区分所有者及び議決権の各4分の3以上）で、普通決議では足りない（31条1項）。","m":"規約は特別決議"},{"f":"権利","t":"不動産登記法","ref":"H30-14-2","s":"建物の滅失の登記などの表示に関する登記は、所有者などの当事者からの申請がなくても、登記官が職権で調査してすることができる。","a":1,"e":"表示に関する登記は不動産の現況を公示するものなので、登記官が職権で行うことができる（不登法28条）。","m":"表示登記は職権でも可"},{"f":"法令","t":"都市計画法","ref":"H30-16-1","s":"都市計画法上、田園住居地域内の農地の区域で土地の形質の変更を行おうとする者は、一定の場合を除き、市町村長の許可を受けなければならない。","a":1,"e":"田園住居地域内の農地では、形質変更・建築物の建築・物件の堆積などに市町村長の許可が必要（都計法52条1項）。","m":"田住の農地は市町村長許可"},{"f":"法令","t":"都市計画法","ref":"H30-16-2","s":"風致地区内における建築物の建築については、政令の基準に従い、地方公共団体の条例で風致の維持のため必要な規制をすることができる。","a":1,"e":"風致地区内の建築や宅地造成・木竹の伐採などは、地方公共団体の条例で規制できる（都計法58条1項）。","m":"風致地区は条例で規制"},{"f":"法令","t":"都市計画法","ref":"H30-16-4","s":"都市計画法上、準都市計画区域については、都道府県が都市計画に市街化区域と市街化調整区域との区分を必ず定めなければならない。","a":0,"e":"区域区分は都市計画区域について定めるもので、準都市計画区域には定めない。また原則は任意である（都計法7条）。","m":"区域区分は都計区域だけ"},{"f":"法令","t":"建築基準法","ref":"H30-19-2","s":"敷地の60%が第一種中高層住居専用地域、40%が第一種低層住居専用地域にある場合、その敷地には大学を建築することができない。","a":0,"e":"用途制限は敷地の過半が属する地域で判断する。第一種中高層住居専用地域では大学を建築できる（法91条）。","m":"用途は過半の地域で判断"},{"f":"法令","t":"建築基準法","ref":"H30-19-3","s":"建築基準法の規定が適用された際に現に建築物が立ち並んでいる幅員2mの道で、特定行政庁が指定したものは、同法上の道路とみなされる。","a":1,"e":"幅員4m未満でも、特定行政庁が指定した既存の道は道路とみなされる（2項道路、法42条2項）。","m":"2項道路は指定で道路"},{"f":"法令","t":"建築基準法","ref":"H30-19-4","s":"壁面線の指定がある場合に、特定行政庁が基準に適合すると認めて許可した建築物は、前面道路の境界線が壁面線にあるものとして容積率を算定できる。","a":1,"e":"許可を受ければ壁面線を道路境界線とみなし、前面道路の幅員を広げて容積率を計算できる（法52条11項）。","m":"壁面線で容積率緩和"},{"f":"法令","t":"土地区画整理法","ref":"H30-21-1","s":"土地区画整理法上、土地区画整理事業は、都市計画区域内の土地だけでなく、都市計画区域外の土地についても施行することができる。","a":0,"e":"土地区画整理事業は都市計画区域内の土地について施行されるものである（土地区画整理法2条）。","m":"区画整理は都計区域内"},{"f":"法令","t":"土地区画整理法","ref":"H30-21-2","s":"事業計画の決定公告後、施行地区内で事業の障害となる建築物を新築するには、都道府県知事と市町村長の双方の許可を受けなければならない。","a":0,"e":"許可権者は都道府県知事等（市の区域内では市長）であり、双方の許可を要するわけではない（76条1項）。","m":"許可は知事等の一つだけ"},{"f":"法令","t":"土地区画整理法","ref":"H30-21-3","s":"仮換地を指定した場合に、従前の宅地上の建築物を移転し又は除却する必要があるときは、施行者がこれを移転し又は除却することができる。","a":1,"e":"仮換地の指定に伴う建築物等の移転・除却は施行者が行うことができる（土地区画整理法77条1項）。","m":"移転・除却は施行者"},{"f":"税他","t":"印紙税・登録免許税","ref":"H30-23-1","s":"個人が住宅用家屋を共有で取得した場合、家屋の床面積に自己の持分を乗じた面積が50㎡以上でなければ、移転登記の税率軽減措置を受けられない。","a":0,"e":"床面積50㎡以上の要件は家屋全体の床面積で判定し、持分を乗じた面積で判断するわけではない。","m":"50㎡は家屋全体で判定"},{"f":"税他","t":"印紙税・登録免許税","ref":"H30-23-3","s":"平成元年に新築された住宅用家屋を個人が取得した場合、耐震基準適合証明書がなければ所有権移転登記の税率軽減措置を受けられない。","a":0,"e":"現在は昭和57年1月1日以後に建築された家屋は新耐震基準に適合するものとみなされ、証明書は不要。","m":"昭和57年以後なら適合扱い"},{"f":"税他","t":"印紙税・登録免許税","ref":"H30-23-4","s":"個人が住宅用家屋の所有権移転登記について税率の軽減措置を受けるには、税務署長が発行する住宅用家屋証明書を添付しなければならない。","a":0,"e":"住宅用家屋証明書は家屋の所在地の市町村長（特別区の区長）が発行するもので、税務署長が発行するものではない。","m":"証明書は市町村長"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H30-24-2","s":"個人が所有する家屋を改築して家屋の価格が増加した場合でも、新築ではないため、その改築について不動産取得税が課されることはない。","a":0,"e":"改築による価格の増加も家屋の取得とみなされ、増加した価格を課税標準として課税される（地方税法73条の2第3項）。","m":"改築の増加分も課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H30-24-4","s":"不動産取得税の免税点は、課税標準となる不動産の価格ではなく、取得した土地の地積や家屋の床面積の大きさによって判定される。","a":0,"e":"免税点は課税標準となる価格で判定する。2026年4月以後は土地16万円、家屋建築66万円、その他の家屋34万円未満。","m":"免税点は価格で判定"},{"f":"業法","t":"広告","ref":"H30-26-1","s":"宅建業者が広告を出した時点では売買契約が未成立だった物件であれば、契約成立後もその広告を掲載し続けても、誇大広告等の禁止に違反することはない。","a":0,"e":"契約成立で取引できなくなった物件の広告を続けるのは、おとり広告として誇大広告等の禁止（32条）に違反する。","m":"成約後の掲載＝おとり広告"},{"f":"業法","t":"広告","ref":"H30-26-2","s":"宅建業者が著しく事実に相違する表示をした広告を出した場合、その広告を見て取引した者がおらず実害がなくても、監督処分や罰則の対象となり得る。","a":1,"e":"誇大広告は表示しただけで違反となり、取引の成否を問わない。罰則は6月以下の拘禁刑若しくは100万円以下の罰金（併科あり）。","m":"誇大広告は出した時点でアウト"},{"f":"業法","t":"広告","ref":"H30-26-3","s":"建築確認を申請中の建物については、宅建業者は売買の媒介の広告はできないが、貸借の媒介の広告であれば建築確認前でもすることができる。","a":0,"e":"広告開始時期の制限（33条）は貸借にも適用される。建築確認を受けるまでは、売買・貸借いずれの広告もできない。","m":"広告制限は貸借も対象"},{"f":"業法","t":"媒介契約","ref":"H30-27-1","s":"既存住宅の売却の媒介を受けた宅建業者Aは、売買契約が成立するまでに、買主Dに対して建物状況調査を実施する者のあっせんの有無を確認しなければならない。","a":0,"e":"あっせんに関する事項は、依頼者（売主）との媒介契約書に記載する事項であり、買主に契約成立までに確認するものではない（34条の2）。","m":"あっせんは媒介契約書に"},{"f":"業法","t":"37条書面","ref":"H30-27-4","s":"既存住宅の売買で買主が宅建業者であっても、構造耐力上主要な部分等の状況について当事者双方が確認した事項があるときは、37条書面にその事項を記載しなければならない。","a":1,"e":"既存建物の双方確認事項は37条書面の記載事項であり、37条書面は相手方が宅建業者でも省略できない。","m":"37条書面は業者間も省略不可"},{"f":"業法","t":"37条書面","ref":"H30-29-1","s":"売主・買主がともに宅建業者である建物の売買では、売主業者が作成した37条書面に、宅建士でない従業者が記名して交付しても宅建業法に違反しない。","a":0,"e":"37条書面には宅建士の記名が必要であり、相手方が宅建業者である業者間取引でも省略できない（37条3項）。","m":"37条の記名は宅建士だけ"},{"f":"業法","t":"8種制限","ref":"H30-29-2","s":"売主・買主がともに宅建業者である代金2,000万円の建物売買で、債務不履行による解除の際の損害賠償の予定額を600万円と定めても、宅建業法に違反しない。","a":1,"e":"損害賠償額の予定等の制限（代金の2割まで）は8種制限の一つで、宅建業者間の取引には適用されない（78条2項）。","m":"8種制限は業者間に不適用"},{"f":"業法","t":"8種制限","ref":"H30-29-4","s":"宅建業者が自ら売主として宅建業者でない買主に建物を売る場合、契約不適合を引渡しの日から1年以内に通知しなければ担保責任を追及できないとする特約は有効である。","a":0,"e":"民法より買主に不利な特約は原則無効。通知期間を引渡しから2年以上とする特約なら有効だが、1年では無効（40条）。","m":"通知期間は引渡しから2年以上"},{"f":"業法","t":"報酬","ref":"H30-31-3","s":"代金350万円（税抜）の土地売買で売主から媒介を依頼された消費税課税事業者の宅建業者は、低廉な空家等の特例を事前に説明して合意を得れば、売主から330,000円まで受領できる。","a":1,"e":"代金800万円以下の宅地建物の売買の媒介では、合意により依頼者の一方から30万円の1.1倍（330,000円）まで受領できる（報酬告示）。","m":"800万以下は33万円まで"},{"f":"業法","t":"報酬","ref":"H30-31-4","s":"借賃月15万円の居住用建物（長期の空家等ではない）の貸借で、貸主の承諾を得た宅建業者は、現地調査費用が多くかかった旨を説明すれば、借賃1か月分に3万円を加えた額に税を加えた198,000円を受領できる。","a":0,"e":"現地調査費用を上乗せできる低廉な空家等の特例は売買が対象で、通常の貸借には使えない。上限は借賃1か月分＋税の165,000円。","m":"貸借に調査費の上乗せなし"},{"f":"業法","t":"媒介契約","ref":"H30-33-2","s":"宅建業者が売主と専属専任媒介契約を締結した場合、契約締結日から休業日を除き7日以内に、物件を指定流通機構に登録しなければならない。","a":0,"e":"専属専任媒介の登録期限は休業日を除き5日以内。7日以内は専任媒介契約の期限である（34条の2第5項、規則）。","m":"専属5日・専任7日"},{"f":"業法","t":"媒介契約","ref":"H30-33-3","s":"売却の媒介を受けた宅建業者が、依頼者に示す価額の根拠として周辺の取引事例を調査した場合、依頼者の承諾がなくても、その調査費用を報酬とは別に請求できる。","a":0,"e":"報酬以外に受領できるのは、依頼者の依頼による広告料金と、依頼者の特別の依頼による費用に限られる。価額の根拠を示すのは業者の義務。","m":"根拠の説明は業者の仕事"},{"f":"業法","t":"媒介契約","ref":"H30-33-4","s":"宅建業者が専任媒介契約を締結したときは、依頼者が他の宅建業者の媒介や代理で売買等の契約を成立させた場合の措置を、媒介契約書に記載しなければならない。","a":1,"e":"専任媒介では他業者に依頼して契約を成立させることが違反となるため、その場合の措置を媒介契約書に記載する必要がある（34条の2）。","m":"専任違反の措置も記載"},{"f":"業法","t":"免許","ref":"H30-36-1","s":"宅建業者が免許の更新を適法に申請したが、有効期間満了日までに更新の処分がされなかった場合、従前の免許は満了日の経過により効力を失う。","a":0,"e":"更新申請中に処分がなければ、従前の免許は処分がされるまでなお効力を有する（3条4項）。","m":"処分まで旧免許は有効"},{"f":"業法","t":"免許","ref":"H30-36-2","s":"甲県知事の免許を受けた宅建業者が、乙県に所在する宅地の売買の媒介をする場合には、国土交通大臣への免許換えの申請をしなければならない。","a":0,"e":"知事免許でも全国の物件を取引できる。免許換えが必要なのは事務所の設置状況が変わったときである。","m":"知事免許でも全国OK"},{"f":"業法","t":"免許","ref":"H30-36-4","s":"法人である宅建業者で、宅建士でない者2名が新たに取締役に就任した場合、変更の届出が必要なのは常勤の取締役についてだけで、非常勤の取締役については不要である。","a":0,"e":"役員の氏名は宅建業者名簿の登載事項で、常勤・非常勤を問わず変更から30日以内に届け出なければならない（9条）。","m":"役員は非常勤も届出"},{"f":"権利","t":"物権変動・対抗","ref":"R01-01-3","s":"AからA所有の土地を買ったBが、移転登記を受けないまま土地をEに転売した場合、Eは登記がなくても、Aに対して自分が所有者であると主張できる。","a":1,"e":"Eは前主Bの地位を承継する者で、AとEは当事者に近い関係にあり対抗関係に立たない。よって登記なしでAに対抗できる。","m":"前の売主には登記不要"},{"f":"権利","t":"物権変動・対抗","ref":"R01-02-1","s":"Aが詐欺を理由にBとの土地売買を取り消した後、Bがその土地をCに売却して登記を備えた。Cが背信的悪意者でなければ、Aは登記がない限りCに返還を請求できない。","a":1,"e":"取消し後はBを起点とする二重譲渡と同様の関係になり、対抗問題として先に登記を備えた方が優先する（177条）。","m":"取消後の第三者は登記勝負"},{"f":"権利","t":"意思表示・行為能力","ref":"R01-02-2","s":"Aが詐欺を理由にBとの売買を取り消す前に、その詐欺を知っていたCがBから土地を買い受けて登記を備えた場合、Aは取消しをしてCに返還を請求できる。","a":1,"e":"詐欺による取消しは善意かつ無過失の第三者に対抗できないが、悪意のCは保護されない（96条3項）。登記の有無は関係ない。","m":"悪意の第三者は保護なし"},{"f":"権利","t":"意思表示・行為能力","ref":"R01-02-4","s":"土地の売主Aの意思表示に重要な錯誤があった場合、Aに重大な過失があったとしても、Aは買主Bに対し錯誤による無効を主張して土地の返還を請求できる。","a":0,"e":"錯誤の効果は無効ではなく取消し。表意者に重大な過失があるときは、相手方の悪意・重過失等の例外を除き取り消せない（95条）。","m":"錯誤は取消し・重過失NG"},{"f":"権利","t":"売買・契約不適合","ref":"R01-03-3","s":"売買の目的物の建物に契約不適合がある場合、買主が売主に損害賠償を請求できるのは、契約を解除することができる場合に限られる。","a":0,"e":"損害賠償請求は解除の可否とは別に認められ、解除と損害賠償を併せて行うこともできる（564条、415条、545条4項）。","m":"解除と賠償は両立"},{"f":"権利","t":"売買・契約不適合","ref":"R01-03-4","s":"宅建業者Cの媒介で個人間の建物売買が成立し、建物に契約不適合があった場合、買主は媒介業者Cに対しても契約不適合責任を追及できる。","a":0,"e":"契約不適合責任を負うのは売買契約の当事者である売主であり、媒介をしただけの業者は担保責任を負わない。","m":"担保責任は売主だけ"},{"f":"権利","t":"不法行為・請負・委任","ref":"R01-04-2","s":"不法行為の被害者が、損害を受けたのと同じ原因によって損害と同質の利益を得ている場合でも、その利益の額は加害者の賠償額から控除されない。","a":0,"e":"同一原因で同質の利益を得たときは、損益相殺によりその額を賠償額から差し引くのが判例である。","m":"同じ原因の利益は差し引く"},{"f":"権利","t":"代理","ref":"R01-05-3","s":"本人が無権代理行為を追認した場合、別段の意思表示がなければ契約時にさかのぼって効力を生じるが、それによって第三者の権利を害することはできない。","a":1,"e":"追認は原則として契約時にさかのぼって効力を生じるが、第三者の権利を害することはできない（116条）。","m":"追認は遡及・第三者は保護"},{"f":"権利","t":"相続","ref":"R01-06-2","s":"共同相続人は、いったん成立した遺産分割協議を、全員の合意によって全部または一部解除し、改めて分割協議を成立させることができる。","a":1,"e":"判例は、共同相続人全員の合意による遺産分割協議の合意解除と、その後の再分割協議を認めている。","m":"全員合意なら協議やり直し可"},{"f":"権利","t":"相続","ref":"R01-06-3","s":"被相続人の預貯金債権は、相続開始と同時に法定相続分に応じて当然に分割されるため、各相続人は遺産分割を待たずに自分の相続分を全額単独で払い戻せる。","a":0,"e":"預貯金債権は遺産分割の対象となる。分割前は、残高の3分の1×法定相続分（上限あり）に限り単独で払戻しを受けられる（909条の2）。","m":"預金は遺産分割の対象"},{"f":"権利","t":"相続","ref":"R01-06-4","s":"遺産分割の効力は分割協議が成立した時から生じ、相続開始時にさかのぼることはないが、第三者の権利を害することはできないとされている。","a":0,"e":"遺産分割は相続開始の時にさかのぼって効力を生じる。ただし第三者の権利を害することはできない（909条）。","m":"分割は相続開始時に遡及"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"R01-07-3","s":"建物の買主Bが、売主Aの相続人と名乗るEに代金を支払った場合、Eに受領権限がないことについてBが善意かつ無過失であれば、その弁済は有効となる。","a":1,"e":"受領権者としての外観を有する者への弁済は、弁済者が善意・無過失なら有効となる（478条）。","m":"外観ある者へ善意無過失"},{"f":"権利","t":"不法行為・請負・委任","ref":"R01-08-1","s":"請負契約の目的物である建物が契約内容に適合せず、建て替えるほかない場合、注文者は請負人に対し建替え費用相当額の損害賠償を請求できる。","a":1,"e":"重大な不適合で建て替えるほかない場合には、建替費用相当額の損害賠償請求が認められるとするのが判例である。","m":"建替えしかない→建替費用"},{"f":"権利","t":"不法行為・請負・委任","ref":"R01-08-3","s":"建物の増築工事の請負契約で、注文者Aの失火により建物が焼失し増築ができなくなった場合、Aは請負人Bに対し増築工事の完成を請求することはできない。","a":1,"e":"仕事の完成が不能になれば履行請求はできない（412条の2）。なお注文者の責めに帰すべき事由なので、Bは報酬の請求を拒まれない（536条2項）。","m":"注文者のせいでも履行は不能"},{"f":"権利","t":"時効","ref":"R01-09-1","s":"AがBに金銭の支払を求めて訴えを提起したが、その後訴えを取り下げた場合、特段の事情がない限り、時効の更新の効力は生じない。","a":1,"e":"取下げで権利が確定しないので更新は生じない。取下げの時から6か月間は時効の完成が猶予されるにとどまる（147条）。","m":"取下げ→更新なし"},{"f":"権利","t":"時効","ref":"R01-09-2","s":"AがBに対して金銭の支払を求める訴えを提起したが、その訴えを不適法として却下する判決が確定した場合、時効の更新の効力は生じない。","a":1,"e":"却下判決では権利が確定しないため更新は生じず、確定から6か月間の時効の完成猶予が生じるだけである（147条）。","m":"却下→猶予のみ"},{"f":"権利","t":"時効","ref":"R01-09-3","s":"AがBに対して金銭の支払を求める訴えを提起したが、審理の結果Aの請求を棄却する判決が確定した場合、時効の更新の効力は生じない。","a":1,"e":"時効が更新されるのは確定判決等で権利が確定したときであり、請求棄却では権利が確定しないので更新は生じない（147条2項）。","m":"棄却→更新なし"},{"f":"権利","t":"抵当権・担保","ref":"R01-10-2","s":"甲土地に一番抵当B（2,000万円）、二番抵当C（2,400万円）、三番抵当D（3,000万円）があり、BがDに順位を譲渡した後、甲土地が6,000万円で売却された場合、Bの配当は1,000万円である。","a":0,"e":"譲渡がなければB2,000万・D1,600万で合計3,600万円。順位譲渡によりDが先に3,000万円を受け、Bは残りの600万円となる。","m":"順位譲渡は合計を先取り"},{"f":"権利","t":"抵当権・担保","ref":"R01-10-3","s":"甲土地に一番抵当B（2,000万円）、二番抵当C（2,400万円）、三番抵当D（3,000万円）があり、BがDに順位を譲渡した後、甲土地が6,000万円で売却された場合、Bの配当は1,440万円である。","a":0,"e":"BとDの本来の配当合計3,600万円から、譲受人Dが3,000万円を優先して受け、Bは600万円となる。Cの2,400万円は影響を受けない。","m":"B・Dの枠内で計算"},{"f":"権利","t":"借地","ref":"R01-11-2","s":"建物所有を目的とする土地賃貸借を公正証書によらずに締結した場合、期間を50年と定めても30年となり、期間を15年と定めた場合は15年のままとなる。","a":0,"e":"借地権の存続期間は30年以上で、30年未満の定めは30年となる。50年の定めはそのまま50年、15年の定めは30年になる（借地借家法3条）。","m":"借地は最低30年"},{"f":"権利","t":"借家","ref":"R01-12-2","s":"AがBに居住用の建物を3年間賃貸する場合、定期建物賃貸借の要件を満たしたとしても、居住用である以上、契約の更新がない旨を定めることはできない。","a":0,"e":"定期建物賃貸借は居住用・事業用を問わず設定できる。書面による契約と事前の書面説明があれば更新なしの特約は有効（38条）。","m":"定期借家は居住用もOK"},{"f":"権利","t":"区分所有法","ref":"R01-13-4","s":"区分所有建物の集会の議事は、区分所有法又は規約に別段の定めがない限り、区分所有者及び議決権の各4分の3以上の多数で決する。","a":0,"e":"普通決議は各過半数で足りる（2026年4月改正後は出席した区分所有者及びその議決権の各過半数）。4分の3は規約の設定等の特別決議。","m":"普通決議は過半数"},{"f":"権利","t":"不動産登記法","ref":"R01-14-1","s":"登記の申請に係る不動産の所在地が、申請を受けた登記所の管轄に属しないときは、登記官は理由を付した決定でその申請を却下しなければならない。","a":1,"e":"申請された不動産の所在地が登記所の管轄に属しないことは、却下事由として定められている（不動産登記法25条1号）。","m":"管轄違いは却下"},{"f":"法令","t":"都市計画法","ref":"R01-15-2","s":"都市計画法上、特定街区については、都市計画に、建築物の容積率、建築物の高さの最高限度及び壁面の位置の制限を定めるものとされている。","a":1,"e":"特定街区の都市計画には、容積率・高さの最高限度・壁面の位置の制限を定める（都市計画法8条3項）。","m":"特定街区は容積・高さ・壁面"},{"f":"法令","t":"都市計画法","ref":"R01-15-3","s":"準住居地域は、道路の沿道としての地域の特性にふさわしい業務の利便の増進を図りつつ、これと調和した住居の環境を保護するため定める地域である。","a":1,"e":"準住居地域の定義どおりである（都市計画法9条7項）。「道路の沿道」と「住居の環境の保護」の調和がキーワード。","m":"準住居＝沿道"},{"f":"法令","t":"都市計画法","ref":"R01-15-4","s":"特別用途地区は、用途地域が定められていない土地の区域（市街化調整区域を除く）内で、制限すべき特定の建築物等の用途の概要を定める地区である。","a":0,"e":"これは特定用途制限地域の説明。特別用途地区は用途地域内で、用途地域の指定を補完して定める地区である（9条）。","m":"特別用途地区は用途地域内"},{"f":"法令","t":"建築基準法","ref":"R01-18-1","s":"第一種低層住居専用地域では、延べ面積60㎡のうち居住部分が40㎡、クリーニング取次店部分が20㎡の兼用住宅は建築してはならない。","a":0,"e":"延べ面積の2分の1以上が居住用で、非住宅部分が50㎡以下のクリーニング取次店等との兼用住宅は第一種低層住居専用地域でも建築できる。","m":"兼用住宅は半分以上住居"},{"f":"法令","t":"建築基準法","ref":"R01-18-3","s":"建築基準法上、防火地域内にある準耐火建築物については、都市計画で定められた建蔽率に10分の1を加えた数値を限度とすることができる。","a":0,"e":"防火地域で建蔽率が1/10加算されるのは耐火建築物等である。準耐火建築物等で加算されるのは準防火地域内の場合（53条3項）。","m":"防火は耐火・準防火は準耐火も"},{"f":"法令","t":"建築基準法","ref":"R01-18-4","s":"地方公共団体は、袋路状道路にのみ接する延べ面積150㎡超の一戸建ての住宅について、条例で敷地が接する道路の幅員等の制限を付加することができる。","a":0,"e":"条例で制限を付加できる袋路状道路の建築物は、延べ面積150㎡超のもので一戸建ての住宅は除かれる（43条3項）。","m":"袋路状の付加は戸建て除く"},{"f":"税他","t":"所得税・譲渡","ref":"R01-23-2","s":"居住用財産の軽減税率の特例は、前年にこの特例の適用を受けていた場合でも、本年中に所有期間10年超の居住用財産を譲渡すれば重ねて適用を受けることができる。","a":0,"e":"軽減税率の特例は、前年・前々年にこの特例の適用を受けていないことが要件であり、前年に受けていれば適用できない（措置法31条の3）。","m":"軽減税率は3年に1回"},{"f":"税他","t":"所得税・譲渡","ref":"R01-23-4","s":"収用等に伴い代替資産を取得した場合の課税の特例の適用を受ける場合には、その譲渡について居住用財産の軽減税率の特例の適用を受けることはできない。","a":1,"e":"代替資産の特例（課税の繰延べ）と軽減税率の特例は併用できない。5,000万円特別控除とは併用できる。","m":"代替資産と軽減税率は×"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R01-24-1","s":"区分所有家屋（マンション）の固定資産税は、原則として、建物全体の税額を各専有部分の取引価格の割合で按分した額を、各区分所有者に課する。","a":0,"e":"区分所有家屋の税額は原則として専有部分の床面積の割合で按分する。超高層の居住用建物は階層による補正率を用いる。","m":"按分は床面積割合"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R01-24-2","s":"固定資産税における小規模住宅用地（住宅用地のうち200㎡以下の部分）の課税標準は、課税標準となるべき価格の3分の1の額とされている。","a":0,"e":"小規模住宅用地は価格の6分の1、200㎡を超える一般住宅用地部分は3分の1である（地方税法349条の3の2）。","m":"200㎡以下は1/6"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R01-24-3","s":"固定資産税の納期は4月・7月・12月・2月中と定められており、市町村は特別の事情があってもこれと異なる納期を定めることはできない。","a":0,"e":"納期は原則4月・7月・12月・2月中で条例で定めるが、特別の事情がある場合は異なる納期を定めることができる（地方税法362条）。","m":"特別の事情で納期変更可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R01-25-1","s":"土地の取引を行う者は、取引の対象土地から最も近い位置にある標準地の公示価格を指標として取引を行うよう努めなければならない。","a":0,"e":"指標とするのは、対象土地に類似する利用価値を有すると認められる標準地の公示価格であり、距離の近さではない（地価公示法1条の2）。","m":"近さでなく類似性"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R01-25-2","s":"地価公示法上、標準地は都市計画区域内の土地から選定されるため、都市計画区域外や国土利用計画法の規制区域内の土地が標準地に選ばれることはない。","a":0,"e":"標準地は公示区域内から選ばれ、公示区域には都市計画区域外も含まれ得る。規制区域は公示区域から除かれる（2条、3条）。","m":"都市計画区域外もあり得る"},{"f":"業法","t":"重要事項説明","ref":"R01-28-1","s":"宅建業者が建物の貸借の媒介を行う場合、その建物が住宅性能評価を受けた新築住宅であるときは、その旨を重要事項として説明しなければならない。","a":0,"e":"住宅性能評価を受けた新築住宅である旨は、売買・交換の場合の説明事項であり、貸借の媒介では説明不要である。","m":"性能評価は売買だけ"},{"f":"業法","t":"重要事項説明","ref":"R01-28-2","s":"宅建業者が既存建物の貸借の媒介を行う場合、設計図書や点検記録など建物の建築・維持保全に関する書類の保存状況を重要事項として説明しなければならない。","a":0,"e":"書類の保存状況は既存建物の売買・交換の場合の説明事項で、貸借では不要。建物状況調査の実施の有無等は貸借でも必要。","m":"書類保存は売買のみ"},{"f":"業法","t":"報酬","ref":"R01-32-3","s":"既存住宅の売買の媒介で、宅建業者が売主に建物状況調査を実施する者をあっせんした場合でも、報酬とは別にあっせん料を受領することはできない。","a":1,"e":"報酬以外に受領できるのは依頼者の依頼による広告料金等に限られ、建物状況調査のあっせん料はこれに当たらない。","m":"あっせん料は取れない"},{"f":"業法","t":"報酬","ref":"R01-32-4","s":"代金200万円（税抜）の宅地の売買で、売主から媒介を依頼された消費税課税事業者の宅建業者は、低廉な空家等の特例について合意を得ても、198,000円を超えて報酬を受領できない。","a":0,"e":"代金800万円以下の売買の媒介では、事前の説明・合意により依頼者の一方から330,000円（30万円×1.1）まで受領できる。","m":"800万以下は33万円まで"},{"f":"業法","t":"37条書面","ref":"R01-36-ア","s":"宅建業者Aが媒介して宅地の売買契約を成立させた場合、35条書面で物件を特定する図面を交付済みであっても、37条書面には宅地を特定するのに必要な表示を記載しなければならない。","a":1,"e":"物件を特定する表示は37条書面の必要的記載事項。35条書面で図面を渡していても省略できない（宅建業法37条1項2号）。","m":"物件の特定は必ず記載"},{"f":"業法","t":"37条書面","ref":"R01-36-ウ","s":"宅建業者Aが売主となる土地付建物の売買で「買主が住宅ローンの承認を得られなければ無条件で解除できる」と定めた場合、Aがローンのあっせんをしない予定であっても、37条書面にその定めを記載しなければならない。","a":1,"e":"無条件解除の取決めは「契約の解除に関する定め」に当たるので、定めがあれば記載が必要（宅建業法37条1項7号）。","m":"解除の定めは必ず記載"},{"f":"業法","t":"重要事項説明","ref":"R01-39-2","s":"宅建業者が宅地の売買を媒介する場合、登記された抵当権が引渡しまでに抹消される予定であれば、その抵当権について重要事項説明を省略できる。","a":0,"e":"登記された権利の種類・内容は、抹消予定であっても重要事項として説明しなければならない（宅建業法35条1項1号）。","m":"抹消予定でも説明する"},{"f":"業法","t":"重要事項説明","ref":"R01-39-3","s":"宅地の貸借の媒介で、契約終了時に宅地上の建物を取り壊すことに関する事項を定めようとするときは、宅建業者はその内容を重要事項として説明しなければならない。","a":1,"e":"宅地の貸借では、契約終了時の建物の取壊しに関する事項を定めるときはその内容が説明事項になる（施行規則16条の4の3）。","m":"取壊し予定は説明"},{"f":"業法","t":"重要事項説明","ref":"R01-39-4","s":"建物が津波防災地域づくり法の津波災害警戒区域内にあるときは、その旨の説明は建物の売買では必要だが、建物の貸借の媒介では不要である。","a":0,"e":"津波災害警戒区域内にある旨は、売買・貸借のどちらでも説明が必要（施行規則16条の4の3第3号）。","m":"津波区域は貸借も説明"},{"f":"業法","t":"重要事項説明","ref":"R01-41-3","s":"宅建業者が建物の貸借の媒介を行う場合、その建物の敷地に建蔽率・容積率の制限があるときは、重要事項としてその概要を借主に説明しなければならない。","a":0,"e":"建物の貸借では、借主が建築するわけではないため建蔽率・容積率などの建築制限は説明不要とされている。","m":"建物貸借に建蔽率不要"},{"f":"業法","t":"重要事項説明","ref":"R01-41-4","s":"宅地の売買の媒介で、代金の額そのものは重要事項として説明する必要はないが、代金以外に授受される金銭があるときはその額と授受の目的を説明しなければならない。","a":1,"e":"代金・借賃の額は37条書面の事項。代金以外の金銭（手付金等）の額と目的は35条の重要事項。","m":"代金以外の金銭は35条"},{"f":"業法","t":"免許","ref":"R01-42-2","s":"宅建業法上の宅地には、現に建物の敷地になっている土地だけでなく、建物の敷地にする目的で取引される土地も含まれ、登記簿の地目や現況は問わない。","a":1,"e":"宅地は「建物の敷地に供せられる土地」で、建物を建てる目的で取引される土地も含む。地目・現況は関係ない（宅建業法2条1号）。","m":"建てる目的なら宅地"},{"f":"業法","t":"免許","ref":"R01-42-3","s":"市街化調整区域内にある土地であっても、現に建物の敷地に供せられている土地であれば、用途地域外であることにかかわらず宅建業法上の宅地に当たる。","a":1,"e":"建物の敷地に供せられる土地は、用途地域の内外や区域区分を問わず宅地に当たる（宅建業法2条1号）。","m":"調整区域でも建物用地は宅地"},{"f":"税他","t":"土地・建物","ref":"R01-49-1","s":"台地や段丘は、農地として利用されることが多いほか、住宅地などの都市的な土地利用も多く、一般に地盤も比較的安定している地形である。","a":1,"e":"台地・段丘は水はけが良く地盤が安定しており、宅地としても農地としても広く利用されている。","m":"台地・段丘は安定"},{"f":"税他","t":"土地・建物","ref":"R01-49-2","s":"地盤が安定した台地であっても、台地を刻む谷や台地上の池沼を埋め立てた土地では、地震の際に地盤の液状化が起こることがある。","a":1,"e":"谷や池沼の埋立地は地盤内の水分が多く軟弱なため、台地上にあっても液状化のおそれがある。","m":"台地の谷・池は要注意"},{"f":"税他","t":"土地・建物","ref":"R01-49-4","s":"旧河道、低湿地、海浜の埋立地などは地下水位が高いことが多く、これらの土地に建物を建てる場合には、地震による地盤の液状化への対策が必要になる。","a":1,"e":"旧河道・低湿地・埋立地は地下水位が高く砂質で緩い地盤が多いため、液状化対策が必要とされる。","m":"旧河道・埋立地は液状化"},{"f":"税他","t":"土地・建物","ref":"R01-50-1","s":"建築物の地震対策の技術には、建物の強さで揺れに耐える耐震、装置で揺れを抑える制震、揺れを建物に伝えにくくする免震という考え方がある。","a":1,"e":"地震対策は耐震・制震・免震の三つに大別される。いずれも新築だけでなく既存建物の補強にも使われる。","m":"耐震・制震・免震"},{"f":"税他","t":"土地・建物","ref":"R01-50-3","s":"免震構造とは、建物と地盤（基礎）との間に積層ゴムなどの免震装置を設けることで、地震の揺れが建物に伝わりにくくする構造である。","a":1,"e":"免震は建物と地盤の間に免震装置を入れ、揺れの伝わりを抑える。装置を建物内部に付けて揺れを吸収するのは制震。","m":"免震は足元にゴム"},{"f":"権利","t":"共有・相隣","ref":"R02-01-1","s":"共有地を分割したことで公道に通じない土地が生じた場合、その土地の所有者は、他の分割者の所有地のみを、償金を支払わずに通行できる。","a":1,"e":"分割で袋地が生じたときは、他の分割者の土地のみ通行でき、償金は不要（民法213条1項）。","m":"分割の袋地は無償通行"},{"f":"権利","t":"共有・相隣","ref":"R02-01-2","s":"Aが購入した甲土地が他の土地に囲まれて公道に通じない場合、甲土地の所有者Aには、自動車による通行を前提とする囲繞地通行権が認められることはない。","a":0,"e":"判例は、自動車通行の必要性や周辺土地の状況、囲繞地所有者の不利益などを総合考慮し、認められる場合があるとする。","m":"車の通行権もあり得る"},{"f":"権利","t":"保証・連帯債務","ref":"R02-02-1","s":"個人Aが金融機関Bから事業資金を借り入れる際に、第三者CがBとの間で結ぶ保証契約は、契約書を作らず口頭で合意しただけでも効力を生じる。","a":0,"e":"保証契約は書面（電磁的記録を含む）でしなければ効力を生じない（民法446条2項・3項）。","m":"保証は書面が必要"},{"f":"権利","t":"保証・連帯債務","ref":"R02-02-3","s":"金融機関からの借入れについて連帯保証人となったCは、債権者から保証債務の履行を請求されたとき、まず主たる債務者に催告するよう求めることはできない。","a":1,"e":"連帯保証人には催告の抗弁権も検索の抗弁権もないので、先に主たる債務者へ請求せよとは言えない（民法454条）。","m":"連帯保証は抗弁なし"},{"f":"権利","t":"債務不履行・解除","ref":"R02-03-1","s":"土地の売買で、買主が代金は支払ったが、附随的義務として定められた税金相当額の償還をしない場合、特段の事情がなければ、売主はこれを理由に契約を解除できない。","a":1,"e":"判例は、契約の目的達成に必須でない附随的義務の不履行にすぎない場合、特段の事情がない限り解除できないとする。","m":"附随的義務では解除不可"},{"f":"権利","t":"賃貸借","ref":"R02-04-1","s":"建物賃貸借の終了時、原状回復について特段の合意がなければ、賃借人は通常の使用によって生じた損耗や経年変化も含めて原状に戻す義務を負う。","a":0,"e":"通常の使用による損耗や経年変化は賃料で回収されているとされ、原状回復義務の対象外（民法621条）。","m":"通常損耗は戻さなくてよい"},{"f":"権利","t":"賃貸借","ref":"R02-04-2","s":"建物賃貸借が期間満了で終了した場合、賃借人は、地震によるひび割れなど自己の責めに帰すべき事由がない損傷についても、原状回復義務を負う。","a":0,"e":"賃借人の責めに帰することができない事由による損傷は、原状回復義務の対象外（民法621条ただし書）。","m":"帰責なしは対象外"},{"f":"権利","t":"不法行為・請負・委任","ref":"R02-05-1","s":"報酬の約定がある委任で、委任者の責めに帰すべき事由により事務の履行ができなくなった場合、受任者は報酬全額を請求できるが、自己の債務を免れて得た利益は委任者に償還しなければならない。","a":1,"e":"債権者の帰責事由による履行不能では反対給付を拒めず、免れた利益は償還する（民法536条2項）。","m":"全額請求・利益は返す"},{"f":"権利","t":"不法行為・請負・委任","ref":"R02-05-4","s":"受任者が死亡した場合、委任契約は終了するが、急迫の事情があるときは、受任者の相続人は委任者が事務を処理できるまで必要な処分をしなければならない。","a":1,"e":"受任者の死亡で委任は終了する（民法653条）。急迫の事情があれば相続人等は必要な処分をする（同654条）。","m":"急迫なら相続人が対応"},{"f":"権利","t":"保証・連帯債務","ref":"R02-07-3","s":"委託を受けた保証人が弁済期前に弁済し、主たる債務者が弁済の日以前に相殺の原因を有していたと主張したときは、保証人は債権者に対し、相殺で消滅すべきだった債務の履行を請求できる。","a":1,"e":"期限前弁済の求償では、主たる債務者が相殺原因を主張すると、保証人は債権者にその債務の履行を請求できる（民法459条の2第1項）。","m":"相殺分は債権者へ請求"},{"f":"権利","t":"保証・連帯債務","ref":"R02-07-4","s":"委託を受けた保証人が主たる債務者に通知しないで弁済した場合、主たる債務者は、債権者に対抗できた事由をもってその保証人に対抗できる。","a":1,"e":"委託を受けた保証人は弁済前に主たる債務者へ通知が必要。怠ると求償が制限されることがある（民法463条1項）。","m":"弁済前に通知"},{"f":"権利","t":"相続","ref":"R02-08-1","s":"真正の相続人が持つ相続回復請求権は、相続人が相続権を侵害された事実を知った時から5年間行使しないとき、時効によって消滅する。","a":1,"e":"相続回復請求権は、侵害を知った時から5年、または相続開始から20年で消滅する（民法884条）。","m":"回復請求は5年・20年"},{"f":"権利","t":"相続","ref":"R02-08-3","s":"被相続人に配偶者と父母、兄弟姉妹がいるが子も孫もおらず、直系尊属が相続人となる場合、被相続人の兄弟姉妹は相続人とならない。","a":1,"e":"兄弟姉妹は第3順位で、直系尊属が相続人となるときは相続人にならない（民法889条1項）。","m":"親がいれば兄弟なし"},{"f":"権利","t":"売買・契約不適合","ref":"R02-09-2","s":"書面によらない負担付贈与で建物を贈与した場合、建物の引渡しと所有権移転登記の両方が終わるまでは、書面によらないことを理由に解除できる。","a":0,"e":"判例上、不動産は引渡しか登記のどちらかがされれば履行が終わったとされ、その後は解除できない（民法550条）。","m":"引渡し・登記どちらかで終了"},{"f":"権利","t":"時効","ref":"R02-10-1","s":"他人の土地を17年間占有したBが死亡し、相続人CがBの占有を引き継いで3年間占有を続けた場合、Cは土地を時効取得できる。","a":1,"e":"相続人は被相続人の占有を併せて主張でき、合計20年の占有で取得時効が成立する（民法162条1項・187条1項）。","m":"相続で占有を通算"},{"f":"権利","t":"時効","ref":"R02-10-2","s":"善意無過失で他人の土地の占有を始めたDが、3年後に他人の土地と知ったまま7年間占有を続けた場合、Dは土地を時効取得できない。","a":0,"e":"善意無過失は占有開始時で判断するので、合計10年の占有で取得時効が成立する（民法162条2項）。","m":"善意は開始時で判定"},{"f":"権利","t":"時効","ref":"R02-10-4","s":"Aが所有する甲土地を、他人に占有されることもなく20年以上まったく使用せずに放置した場合、Aの甲土地の所有権は消滅時効によって消滅する。","a":0,"e":"所有権は消滅時効にかからない（民法166条2項）。ただし他人の取得時効で失うことはある。","m":"所有権は時効消滅しない"},{"f":"権利","t":"借地","ref":"R02-11-3","s":"建物所有目的の借地契約が借地権者の賃料不払いを理由に解除された場合、借地権者は地主に対して建物買取請求権を行使できない。","a":1,"e":"判例上、債務不履行による解除の場合は建物買取請求権は認められない（借地借家法13条参照）。","m":"不払い解除は買取なし"},{"f":"権利","t":"借家","ref":"R02-12-1","s":"建物の引渡しを受けた賃借人Bが賃貸人Aに賃料を前払いした後、Aが建物をCに売却した場合、Bは前払いの事実を新所有者Cに対抗できる。","a":1,"e":"対抗要件を備えた賃貸借では賃貸人の地位は譲受人に移転し、前払賃料の弁済も新賃貸人に主張できる（民法605条の2）。","m":"前払いは新家主に主張可"},{"f":"権利","t":"区分所有法","ref":"R02-13-3","s":"区分所有建物の共用部分の保存行為は、規約に別段の定めがない場合でも集会の決議によらなければならず、区分所有者が単独で行うことはできない。","a":0,"e":"保存行為は規約に別段の定めがない限り各区分所有者が単独でできる（区分所有法18条1項ただし書）。","m":"保存は一人でできる"},{"f":"権利","t":"区分所有法","ref":"R02-13-4","s":"一部共用部分は、これを共用すべき区分所有者の共有に属するのが原則だが、規約で定めれば区分所有者全員の共有とすることもできる。","a":1,"e":"一部共用部分は原則として一部区分所有者の共有だが、規約で別段の定めをすることができる（区分所有法11条1項・2項）。","m":"一部共用も規約で全員"},{"f":"権利","t":"不動産登記法","ref":"R02-14-3","s":"債権者が債務者に代位して所有権移転登記を申請した場合でも、その登記の完了後、申請人である債権者に登記識別情報が通知される。","a":0,"e":"登記識別情報は、申請人自らが登記名義人となる場合に通知される。代位した債権者には通知されない（不動産登記法21条）。","m":"名義人になる人に通知"},{"f":"法令","t":"開発許可","ref":"R02-16-1","s":"開発許可を申請しようとする者は、開発行為により設置される公共施設を管理することとなる者と、あらかじめ協議しなければならない。","a":1,"e":"設置される公共施設の管理者となる者とは協議、既存の関係公共施設の管理者とは協議・同意が必要（都市計画法32条）。","m":"新設は協議・既存は同意"},{"f":"法令","t":"開発許可","ref":"R02-16-2","s":"市街化調整区域のうち開発許可を受けた開発区域以外の区域では、都市計画事業の施行として行う建築物の新築であっても、都道府県知事の許可が必要である。","a":0,"e":"開発区域外の市街化調整区域での建築でも、都市計画事業の施行として行うものは許可不要（都市計画法43条1項）。","m":"都市計画事業は許可不要"},{"f":"法令","t":"建築基準法","ref":"R02-17-2","s":"建築基準法上、居室の天井の高さは2.1m以上必要であり、一室で天井の高さが異なる部分がある場合は、そのうち最も低い部分の高さで判定する。","a":0,"e":"居室の天井高は2.1m以上。一室で高さが異なる部分があるときは、その平均の高さで判定する（建築基準法施行令21条）。","m":"天井高は平均で判定"},{"f":"法令","t":"建築基準法","ref":"R02-17-3","s":"建築基準法上、延べ面積が1,000㎡を超える耐火建築物は、防火壁などで区画し、各区画の床面積をそれぞれ1,000㎡以内にしなければならない。","a":0,"e":"1,000㎡超の建築物の防火壁区画は、耐火建築物・準耐火建築物には適用されない（建築基準法26条）。","m":"耐火・準耐火は区画不要"},{"f":"法令","t":"建築基準法","ref":"R02-17-4","s":"建築基準法上、高さ30mの事務所ビルを新築する場合には、避雷設備に加えて、原則として非常用の昇降機を設けなければならない。","a":0,"e":"非常用昇降機が必要なのは高さ31mを超える建築物（建築基準法34条2項）。なお避雷設備は20m超で必要。","m":"非常用EVは31m超"},{"f":"法令","t":"盛土規制法","ref":"R02-19-1","s":"宅地造成等工事規制区域の指定のための基礎調査として知事が他人の土地に立ち入る場合、土地の占有者は正当な理由がない限り、立入りを拒んだり妨げたりできない。","a":1,"e":"基礎調査のための立入りについて、占有者は正当な理由なく拒み又は妨げてはならないとされている（盛土規制法）。","m":"調査の立入りは拒めない"},{"f":"法令","t":"盛土規制法","ref":"R02-19-2","s":"宅地造成等工事規制区域内で、宅地を宅地以外の土地にするために行う盛土その他の土地の形質の変更は、盛土規制法上の「宅地造成」に該当しない。","a":1,"e":"宅地造成は「宅地以外→宅地」または「宅地において」行う形質変更をいう（盛土規制法2条2号）。宅地→宅地以外は該当しない。","m":"宅地をやめるのは対象外"},{"f":"法令","t":"土地区画整理法","ref":"R02-20-1","s":"土地区画整理組合の設立認可に必要な借地権者の同意について、未登記の借地権であっても市町村長に申告されたものを有する者は、同意を得る対象に含まれる。","a":1,"e":"未登記の借地権は市町村長に申告しなければ存在しないものとみなされるが、申告すれば同意の対象になる（19条）。","m":"未登記借地権は申告で算入"},{"f":"法令","t":"土地区画整理法","ref":"R02-20-2","s":"土地区画整理組合の総会は、総組合員の半数以上が出席しなければ会議を開くことができず、半数未満の出席では総会は成立しない。","a":1,"e":"組合の総会の定足数は総組合員の半数以上の出席。議事は原則として出席組合員の過半数で決する。","m":"総会は半数以上出席"},{"f":"法令","t":"土地区画整理法","ref":"R02-20-4","s":"施行地区内の宅地に所有権も借地権も持たない者でも、資力と信用があり定款で定められた者であれば、誰でも参加組合員として土地区画整理組合の組合員になれる。","a":0,"e":"参加組合員になれるのは都市再生機構・地方住宅供給公社など法令で定める者に限られ、資力・信用だけでは足りない。","m":"参加組合員は公的機関等"},{"f":"法令","t":"農地法","ref":"R02-21-1","s":"農地法3条1項の許可が必要な農地の売買を、当事者が許可を受けずに契約だけを結んで行った場合、その売買契約は所有権移転の効力を生じない。","a":1,"e":"3条許可を受けないでした売買などの行為は効力を生じず、所有権は移転しない（農地法3条6項）。","m":"許可なしは無効"},{"f":"法令","t":"農地法","ref":"R02-21-3","s":"相続により農地の所有権を取得した者は、農地法3条1項の許可は不要だが、遅滞なく農業委員会にその旨を届け出なければならない。","a":1,"e":"相続による取得は3条許可不要だが、遅滞なく農業委員会への届出が必要（農地法3条の3）。","m":"相続は許可不要・届出"},{"f":"法令","t":"農地法","ref":"R02-21-4","s":"農家が耕作を続ける農地に、金融機関からの借入れの担保として抵当権を設定する場合には、農地法3条1項の許可を受けなければならない。","a":0,"e":"抵当権の設定は耕作者が変わらないため3条許可は不要。所有権移転や賃借権設定などが許可の対象。","m":"抵当権は許可不要"},{"f":"法令","t":"国土利用計画法","ref":"R02-22-2","s":"市街化区域内の2,000㎡の土地を売買で取得した者は、所有権移転登記を完了した日から2週間以内に事後届出をしなければならない。","a":0,"e":"事後届出の期限は契約を締結した日から起算して2週間以内（国土利用計画法23条1項）。","m":"契約から2週間"},{"f":"法令","t":"国土利用計画法","ref":"R02-22-3","s":"都市計画区域外にある15,000㎡の土地を親族から贈与により取得した者は、国土利用計画法23条の事後届出をしなければならない。","a":0,"e":"事後届出の対象は売買・交換など対価を伴う土地売買等の契約。贈与は対象外なので面積にかかわらず届出不要。","m":"贈与は届出不要"},{"f":"法令","t":"国土利用計画法","ref":"R02-22-4","s":"都市計画区域外の10,000㎡の土地と市街化調整区域内の10,000㎡の土地を交換した場合、双方の当事者とも事後届出をする必要はない。","a":0,"e":"交換も対価を伴う取引で届出対象。都市計画区域外1万㎡以上・調整区域5,000㎡以上を満たすので双方に届出義務がある。","m":"交換も届出対象"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02-23-1","s":"請負代金1,100万円（うち消費税及び地方消費税100万円と区分記載）とする工事請負契約書の印紙税の記載金額は、1,100万円である。","a":0,"e":"消費税額等が区分記載されていれば、その額は記載金額に含めない。記載金額は1,000万円となる。","m":"区分記載の消費税は除く"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02-23-2","s":"Aの5,000万円の土地とBの4,000万円の土地を交換する契約書に双方の価額が記載されている場合、印紙税の記載金額は5,000万円である。","a":1,"e":"交換契約書に双方の価額が記載されているときは高い方、交換差金のみ記載ならその差金が記載金額となる。","m":"交換は高い方"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02-24-1","s":"個人が令和8年中に店舗用地など住宅用以外の土地を取得した場合、その土地に係る不動産取得税の税率は、本則どおり4%が適用される。","a":0,"e":"土地は住宅用か否かを問わず特例で3%（令和9年3月末までの取得）。4%が適用されるのは住宅以外の家屋。","m":"土地はいつでも3%"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02-24-2","s":"不動産取得税の免税点は面積で定められており、取得した土地の面積が一定の面積に満たない場合には、不動産取得税は課されない。","a":0,"e":"免税点は面積ではなく課税標準の額で判定する。面積が小さくても課税標準が免税点以上なら課税される。","m":"免税点は面積でなく金額"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02-24-3","s":"個人が所有する家屋を改築して、その家屋の価格が増加した場合でも、新築や購入による取得ではないため、不動産取得税は課されない。","a":0,"e":"改築で価格が増えた場合は家屋の取得とみなされ、増加した価格分に課税される（地方税法73条の2第3項）。","m":"改築は増えた分に課税"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02-25-1","s":"不動産鑑定評価基準によれば、不動産の価格は最有効使用を前提として把握される価格を標準として形成されるが、現実の使用方法が必ずしも最有効使用とは限らない点に留意する。","a":1,"e":"最有効使用の原則。現実の使用方法が効用を十分に発揮していない場合もあるので注意が必要とされる。","m":"価格は最有効使用が基準"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02-25-2","s":"不動産鑑定評価基準によれば、建物の工事が完了していない場合でも、依頼目的に応じて工事の完了を前提として鑑定評価を行うことがある。","a":1,"e":"未竣工建物等鑑定評価という。一定の要件を満たせば、工事完了後の状態を前提に評価できる。","m":"未完成でも完成前提OK"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02-25-4","s":"不動産鑑定評価基準によれば、原価法は対象不動産が建物又は建物及びその敷地である場合に適用でき、対象が土地のみの場合には適用できない。","a":0,"e":"造成地や埋立地など、再調達原価を適切に求めることができれば、土地のみの場合でも原価法を適用できる。","m":"原価法は土地でも可"},{"f":"業法","t":"広告","ref":"R02-27-ア","s":"宅建業者が広告で取引態様の別を明示していれば、その広告を見た客から注文を受けた際には、改めて取引態様の別を明示する必要はない。","a":0,"e":"注文を受けたときは、広告で明示していても遅滞なく取引態様の別を明示しなければならない（宅建業法34条2項）。","m":"注文時は改めて明示"},{"f":"業法","t":"広告","ref":"R02-27-イ","s":"宅建業者が宅地の広告で、法令上の利用制限の一部をあえて表示しないことにより、実際より有利であると人に誤認させることも、誇大広告として禁止される。","a":1,"e":"誇大広告は虚偽表示だけでなく、必要な事項を表示しないことで誤認させる場合も含む（宅建業法32条）。","m":"隠して誤認も誇大広告"},{"f":"業法","t":"広告","ref":"R02-27-ウ","s":"宅建業者が一団の宅地を数回に分けて販売するため広告を数回行う場合、最初の広告で取引態様の別を明示すれば、以後の広告では明示を省略できる。","a":0,"e":"取引態様の別は、数回に分けて広告する場合でも、広告をするたびに明示しなければならない（宅建業法34条1項）。","m":"広告のたびに明示"},{"f":"業法","t":"重要事項説明","ref":"R02-31-1","s":"宅建業者が建物の貸借の媒介をする場合も、損害賠償額の予定又は違約金に関する事項は、重要事項として説明しなければならない。","a":1,"e":"損害賠償額の予定・違約金は、売買・貸借の別なく説明事項である（宅建業法35条1項9号）。","m":"違約金は貸借でも説明"},{"f":"業法","t":"重要事項説明","ref":"R02-31-2","s":"建物の売買の媒介において、石綿の使用の有無の調査結果が記録されているか判明しない場合、宅建業者は自ら石綿の使用の有無を調査し、その結果を説明しなければならない。","a":0,"e":"記録があればその内容を説明すれば足り、宅建業者に自ら調査する義務はない（施行規則16条の4の3）。","m":"石綿は記録の説明だけ"},{"f":"業法","t":"クーリング・オフ","ref":"R02-32-2","s":"宅建業者Aが自ら売主、宅建業者でないBが買主の建物売買で、Bがクーリング・オフにより解除した場合でも、受領済みの手付金は返還しない旨の特約は有効である。","a":0,"e":"クーリング・オフ時は受領した手付金等を速やかに返還しなければならず、買主に不利な特約は無効（宅建業法37条の2）。","m":"CO後は全額返す"},{"f":"業法","t":"8種制限","ref":"R02-32-4","s":"宅建業者Aが自ら売主として、工事完了前の建物を代金5,000万円で宅建業者でないBに売却する場合、Aは手付金200万円を保全措置を講じないで受領できる。","a":1,"e":"未完成物件は代金の5%以下かつ1,000万円以下なら保全措置不要。200万円は250万円以下なので受領できる（41条）。","m":"未完成は5%・1千万"},{"f":"業法","t":"営業保証金","ref":"R02-35-1","s":"宅建業者Aから建設工事を請け負った建設業者は、その請負代金債権について、Aが供託した営業保証金から弁済を受ける権利を有する。","a":0,"e":"還付を受けられるのは宅建業に関する取引で生じた債権を持つ者に限られ、請負代金債権は対象外（宅建業法27条1項）。","m":"還付は宅建取引の債権だけ"},{"f":"業法","t":"営業保証金","ref":"R02-35-2","s":"宅建業者が新たに支店を設置した場合、本店最寄りの供託所に500万円を供託すれば、その旨を免許権者に届け出る前でも、その支店で事業を開始できる。","a":0,"e":"供託後、免許権者に供託した旨を届け出た後でなければ新設支店で事業を開始できない（宅建業法26条・25条5項）。","m":"供託＋届出で開始"},{"f":"業法","t":"営業保証金","ref":"R02-35-3","s":"営業保証金の還付で供託額が不足した場合、宅建業者は免許権者から不足の通知書の送付を受けた日から2週間以内に、不足額を供託しなければならない。","a":1,"e":"通知を受けた日から2週間以内に不足額を供託し、供託後2週間以内に届け出る（宅建業法28条）。","m":"通知から2週間で補充"},{"f":"業法","t":"保証協会","ref":"R02-36-1","s":"保証協会の社員と宅建業に関し取引をした者（宅建業者を除く）が還付を受けられる額は、その社員が納付した弁済業務保証金分担金の額が限度となる。","a":0,"e":"限度額は、社員でないとしたら供託すべき営業保証金の額に相当する額である（法64条の8第1項）。分担金額ではない。","m":"限度は営業保証金相当"},{"f":"業法","t":"保証協会","ref":"R02-36-2","s":"保証協会の社員と取引をした者が弁済業務保証金から弁済を受けるには、保証協会の認証を受けた後、保証協会に対して還付を請求する。","a":0,"e":"認証は保証協会から受けるが、還付請求の相手は供託所である（法64条の8第2項）。","m":"認証は協会、請求は供託所"},{"f":"業法","t":"保証協会","ref":"R02-36-3","s":"弁済業務保証金の還付があり、保証協会から還付充当金を納付するよう通知を受けた社員は、通知を受けた日から2週間以内に、その額を供託所に供託しなければならない。","a":0,"e":"還付充当金は通知から2週間以内に保証協会へ納付する（法64条の10）。供託所へ供託するのではない。","m":"充当金は協会へ納付"},{"f":"業法","t":"8種制限","ref":"R02-42-1","s":"宅建業者Aが自ら売主、宅建業者でないBが買主の宅地売買で、契約不適合の通知期間を「Bが不適合を知った時から2年」とする特約は有効である。","a":0,"e":"民法より買主に不利な特約は無効で、例外は通知期間を引渡しから2年以上とする特約のみ（宅建業法40条）。","m":"引渡しから2年以上だけ"},{"f":"業法","t":"8種制限","ref":"R02-42-3","s":"宅建業者Aが宅建業者Dに造成完了済みの宅地を代金3,000万円で売却する場合、Aは保全措置を講じずに手付金800万円を受領できる。","a":1,"e":"買主も宅建業者なので、手付金等の保全措置や手付の額の制限などの8種制限は適用されない（宅建業法78条2項）。","m":"業者間は8種制限なし"},{"f":"業法","t":"8種制限","ref":"R02-42-4","s":"宅建業者Aが自ら売主、非業者Eが買主の建物売買で、契約不適合責任を一切負わない特約を定めた場合、特約は無効となり、Aは引渡しから2年間に限り責任を負う。","a":0,"e":"特約が無効になると民法の原則に戻り、Eは不適合を知った時から1年以内に通知すれば責任追及できる。","m":"無効なら民法に戻る"},{"f":"業法","t":"重要事項説明","ref":"R02-44-2","s":"建物の貸借の媒介において、敷金など契約終了時に精算することとされている金銭の精算に関する事項は、重要事項として説明しなければならない。","a":1,"e":"敷金等の契約終了時における金銭の精算に関する事項は、貸借の重要事項説明の対象（施行規則16条の4の3）。","m":"敷金精算は貸借で説明"},{"f":"業法","t":"重要事項説明","ref":"R02-44-3","s":"宅建業者が自ら委託者となる信託の受益権の売主となる場合、相手方が宅建業者であっても、原則として書面を交付して重要事項の説明をしなければならない。","a":1,"e":"信託受益権の販売の説明（宅建業法35条3項）は、相手方が宅建業者でも説明を省略できない。","m":"信託受益権は業者にも説明"},{"f":"業法","t":"重要事項説明","ref":"R02-44-4","s":"区分所有建物の売買の媒介では、修繕積立金の積立てを行う旨の規約があればその内容を説明すれば足り、既に積み立てられている額を説明する必要はない。","a":0,"e":"規約の内容に加え、既に積み立てられている額も説明しなければならない（施行規則16条の2）。","m":"積立済み額も説明"},{"f":"税他","t":"住宅金融支援機構","ref":"R02-46-1","s":"住宅金融支援機構は、証券化支援事業（買取型）において、金融機関から買い取った住宅ローン債権を担保としてMBS（資産担保証券）を発行している。","a":1,"e":"買取型では機構が買い取った住宅ローン債権を担保にMBSを発行し、投資家から資金を調達する。","m":"買取型→MBS発行"},{"f":"税他","t":"住宅金融支援機構","ref":"R02-46-4","s":"住宅金融支援機構は、貸付けを受けた者が死亡した場合に支払われる生命保険金を、その貸付けに係る債務の弁済に充当する団体信用生命保険業務を行っている。","a":1,"e":"機構は団体信用生命保険業務を行い、債務者が死亡したときの保険金を残りの貸付債務の弁済に充てる。","m":"団信で残債を弁済"},{"f":"税他","t":"土地・建物","ref":"R02-49-2","s":"宅地の水害の危険性は、その土地自体の位置だけでなく、周辺の地形や防災施設の状況にも左右されるため、宅地選定の際には周辺も含めて確認することが大切である。","a":1,"e":"浸水の危険は周囲の地形や堤防等の防災施設の状況で変わる。宅地だけでなく周辺環境も確認すべきである。","m":"水害は周辺も見る"},{"f":"税他","t":"土地・建物","ref":"R02-49-4","s":"宅地の災害リスクを調べる際には、専門的な地形や地質の調査をすれば十分であり、その地域に長く住む周辺住民の意見を聴く必要はない。","a":0,"e":"住民からは過去の災害や避難方法など地域に伝わる情報が得られる。地形・地質調査とあわせて意見を参考にすべき。","m":"地元の声も聴く"},{"f":"権利","t":"不法行為・請負・委任","ref":"R02s-01-3","s":"責任能力のない認知症の高齢者が線路に立ち入り鉄道会社に損害を与えた場合、同居する配偶者は、そのことだけで法定の監督義務者として賠償責任を負う。","a":0,"e":"同居の配偶者であることだけでは法定の監督義務者にあたらない（最判平成28年3月1日）。","m":"同居だけでは責任なし"},{"f":"権利","t":"代理","ref":"R02s-02-1","s":"代理人Bが自己の利益を図る目的で本人Aの土地を相手方Dに売却し、Dがその目的を知り又は知ることができた場合、Bの行為は無権代理とみなされる。","a":1,"e":"代理権の濫用は、相手方が目的を知り又は知ることができたときは無権代理とみなされる（民法107条）。","m":"濫用＋相手悪意有過失→無権"},{"f":"権利","t":"代理","ref":"R02s-02-2","s":"BがAとCの双方から代理権を受け、AC間で甲土地の売買契約を締結した場合、事前の許諾がなくても、Aに損害が生じなければ有効な代理行為となる。","a":0,"e":"双方代理は、本人の事前の許諾か債務の履行の場合を除き無権代理とみなされ、損害の有無は問わない（民法108条）。","m":"双方代理は損害不問"},{"f":"権利","t":"代理","ref":"R02s-02-3","s":"Aの代理権が消滅した後に、BがAの代理人と称して甲土地を、消滅の事実を過失なく知らないEに売却した場合、AはEに甲土地を引き渡す責任を負わない。","a":0,"e":"代理権消滅後の表見代理が成立し、AはEに対して売主としての責任（引渡し義務）を負う（民法112条）。","m":"消滅後も善意無過失は保護"},{"f":"権利","t":"時効","ref":"R02s-05-1","s":"抵当権が設定された不動産の第三取得者は、被担保債権の消滅について正当な利益を有するため、その債権の消滅時効を援用できる。","a":1,"e":"援用できる当事者には、債務者のほか保証人・物上保証人・第三取得者が含まれる（民法145条）。","m":"第三取得者も援用可"},{"f":"権利","t":"時効","ref":"R02s-05-4","s":"夫婦の一方が他方に対して有する金銭債権などの権利については、婚姻の解消の時から6か月を経過するまでの間は、時効が完成しない。","a":1,"e":"夫婦間の権利は、離婚や死亡による婚姻解消の時から6か月間、時効の完成が猶予される（民法159条）。","m":"夫婦間は解消後6か月"},{"f":"権利","t":"賃貸借","ref":"R02s-06-2","s":"適法な転借人Cの用法違反で建物が損傷した場合、賃貸人Aは賃借人Bに対し、建物の返還を受けた時から1年以内に損害賠償を請求しなければならない。","a":1,"e":"用法違反による損害賠償は、賃貸人が返還を受けた時から1年以内に請求しなければならない（民法622条・600条）。","m":"用法違反は返還後1年"},{"f":"権利","t":"債務不履行・解除","ref":"R02s-07-2","s":"土地の売主Aが買主Bに土地を引き渡せなかった場合、それがAの責めに帰することができない事由によるときを除き、BはAに損害賠償を請求できる。","a":1,"e":"債務者に帰責事由がない場合を除き、債務不履行による損害賠償を請求できる（民法415条）。","m":"帰責事由なしなら免責"},{"f":"権利","t":"債務不履行・解除","ref":"R02s-07-3","s":"買主が支払期日に代金を支払わなかった場合、遅延損害金の利率について特段の定めがなければ、売主は年5%の割合で遅延損害金を請求できる。","a":0,"e":"利率の定めがなければ法定利率による（民法419条）。法定利率は2020年4月以降3%で3年ごとに見直す。","m":"遅延損害金は法定利率"},{"f":"権利","t":"意思表示・行為能力","ref":"R02s-07-4","s":"売主Aが重要な錯誤により売買契約を締結したが、Aに重大な過失があった場合、買主Bが錯誤を知らず重過失もないときは、Aは錯誤を理由に取り消すことができない。","a":1,"e":"表意者に重過失がある錯誤は、相手方の悪意・重過失や共通錯誤の場合を除き取り消せない（民法95条3項）。","m":"重過失なら原則取消不可"},{"f":"権利","t":"相続","ref":"R02s-08-イ","s":"財産1億2,000万円のAが死亡。配偶者はなく、子の長男・次男は先に死亡し、長男の子B・Cと次男の子Dが代襲相続した。Bの相続分は3,000万円、Dは6,000万円である。","a":1,"e":"代襲相続人は被代襲者の相続分を引き継ぐ。長男分6,000万円をB・Cで分け、次男分6,000万円はDが受ける（民法901条）。","m":"代襲は親の取り分を承継"},{"f":"権利","t":"相続","ref":"R02s-08-エ","s":"財産1億2,000万円のAが死亡し、相続人が父方の祖父母E・Fと母方の祖母Gの3人のみの場合、E・Fは各3,000万円、Gは6,000万円を相続する。","a":0,"e":"直系尊属が相続人のときは代襲の考え方をとらず、同順位の者で均等に分ける。3人とも各4,000万円。","m":"祖父母は頭割り"},{"f":"権利","t":"共有・相隣","ref":"R02s-09-2","s":"甲土地の所有者Aのために通行地役権が設定された場合、地役権者は、設定行為で定めた目的に従い、他人の土地（承役地）を自己の土地（要役地）の便益に供する権利を有する。","a":1,"e":"地役権は設定行為で定めた目的に従い、承役地を要役地の便益に供する権利である（民法280条）。","m":"承役地を要役地の便益に"},{"f":"権利","t":"物権変動・対抗","ref":"R02s-09-3","s":"承役地の所有者が設定行為により地役権行使のための工作物の設置・修繕を自己の費用で行う義務を負う場合、承役地の特定承継人もその義務を負う。","a":1,"e":"承役地所有者の工作物設置・修繕義務は、承役地の特定承継人にも引き継がれる（民法286条）。","m":"修繕義務は買主も承継"},{"f":"権利","t":"共有・相隣","ref":"R02s-10-3","s":"A・B・Cが共有する建物の雨漏りの修理などの保存行為は、他の共有者の同意を得なくても、各共有者が単独ですることができる。","a":1,"e":"共有物の現状を維持する保存行為は、各共有者が他の共有者の同意なく単独でできる（民法252条5項）。","m":"保存は単独でOK"},{"f":"権利","t":"借地","ref":"R02s-11-3","s":"借地権者が借地権の対抗要件を備えている場合、土地の適法な転借人は、自己の転借権の対抗要件を備えていなくても、借地権者の借地権を援用して転借権を第三者に対抗できる。","a":1,"e":"判例は、転借人が賃借人（転貸人）の対抗力ある借地権を援用して第三者に対抗できるとする。","m":"転借人は借地権を援用"},{"f":"権利","t":"賃貸借","ref":"R02s-12-2","s":"賃借人Bが賃貸人Aの承諾なく建物を第三者に転貸した場合でも、それがAに対する背信的行為と認めるに足りない特段の事情があれば、Aは契約を解除できない。","a":1,"e":"無断転貸でも背信的行為と認めるに足りない特段の事情があれば解除できない（信頼関係破壊の法理・判例）。","m":"背信性なければ解除不可"},{"f":"権利","t":"区分所有法","ref":"R02s-13-4","s":"区分所有建物において、規約に別段の定めがない限り、区分所有者は集会の決議によって管理者を選任し、又は解任することができる。","a":1,"e":"管理者の選任・解任は、規約に別段の定めがない限り集会の普通決議で行う（区分所有法25条1項）。","m":"管理者は集会で選ぶ"},{"f":"権利","t":"不動産登記法","ref":"R02s-14-1","s":"表示に関する登記を申請できる表題部所有者について相続があった場合、その相続人も、当該表示に関する登記を申請することができる。","a":1,"e":"表題部所有者等に一般承継があったときは、相続人その他の一般承継人も申請できる（不動産登記法30条）。","m":"相続人も表示登記OK"},{"f":"権利","t":"不動産登記法","ref":"R02s-14-3","s":"区分建物の表題登記を申請するときは、その区分建物が属する一棟の建物に属する他の区分建物の表題登記とあわせて申請しなければならない。","a":1,"e":"区分建物の表題登記は一棟の建物の他の区分建物と一括して申請する（不動産登記法48条1項）。","m":"区分建物は一括申請"},{"f":"権利","t":"不動産登記法","ref":"R02s-14-4","s":"登記簿の附属書類のうち土地所在図などの図面は誰でも閲覧を請求できるが、申請書などそれ以外のものは、正当な理由があると認められる部分に限り閲覧できる。","a":1,"e":"図面は何人も閲覧可。それ以外の附属書類は正当な理由がある部分に限って閲覧できる（不動産登記法121条）。","m":"図面は誰でも閲覧"},{"f":"法令","t":"都市計画法","ref":"R02s-15-1","s":"区域区分が定められていない都市計画区域については、都市計画に、都市施設として少なくとも道路、病院及び下水道を定めなければならない。","a":0,"e":"市街化区域と非線引き区域で少なくとも定めるのは道路・公園・下水道で、病院ではない（都市計画法13条1項11号）。","m":"道・公・下水"},{"f":"法令","t":"都市計画法","ref":"R02s-15-2","s":"都市計画法上、市街化調整区域については、市街化を抑制すべき区域であるため、土地区画整理事業などの市街地開発事業を都市計画に定めることができない。","a":1,"e":"市街地開発事業は市街化区域又は非線引き区域内で定め、市街化調整区域には定めない（都市計画法13条）。","m":"調整区域に開発事業なし"},{"f":"法令","t":"都市計画法","ref":"R02s-15-3","s":"都市計画法上、一体の都市として整備すべき区域である都市計画区域は、市町村が市町村議会の意見を聴いたうえで、都道府県知事の同意を得て指定する。","a":0,"e":"都市計画区域を指定するのは原則として都道府県（2以上の都府県にわたる場合は国土交通大臣）（都市計画法5条）。","m":"指定は都道府県"},{"f":"法令","t":"建築基準法","ref":"R02s-18-1","s":"壁面線が指定されている場合、建築物の壁やこれに代わる柱は原則として壁面線を越えて建築できないが、地盤面下の部分や、特定行政庁が建築審査会の同意を得て許可した歩廊の柱などは例外とされる。","a":1,"e":"壁面線を越える建築は原則禁止だが、地盤面下の部分や許可を受けた歩廊の柱等は例外となる（建築基準法47条）。","m":"壁面線、地下と歩廊柱はOK"},{"f":"法令","t":"建築基準法","ref":"R02s-18-2","s":"特別用途地区内では、地区の指定目的のため必要と認める場合、地方公共団体は国土交通大臣の承認を得て、条例で用途地域による用途制限を緩和することができる。","a":1,"e":"特別用途地区では条例で用途制限の強化も緩和もできるが、緩和には国土交通大臣の承認が必要（建築基準法49条2項）。","m":"緩和は大臣の承認"},{"f":"法令","t":"建築基準法","ref":"R02s-18-3","s":"都市計画で建蔽率の限度が10分の8と定められた準工業地域内で、かつ防火地域内にある耐火建築物を建築する場合、建蔽率の制限は適用されない。","a":1,"e":"建蔽率8/10の地域内で防火地域内の耐火建築物等は、建蔽率制限が適用除外となる（建築基準法53条6項）。","m":"8割×防火×耐火＝制限なし"},{"f":"法令","t":"盛土規制法","ref":"R02s-19-2","s":"宅地造成等工事規制区域内で災害防止のために行う工事のうち、高さが5mを超える擁壁の設置は、政令で定める資格を有する者の設計によらなければならない。","a":1,"e":"高さ5m超の擁壁の設置や、盛土・切土面積1,500㎡超の排水施設の設置は有資格者の設計が必要（盛土規制法13条2項）。","m":"擁壁5m超は有資格者"},{"f":"法令","t":"盛土規制法","ref":"R02s-19-4","s":"宅地造成等工事規制区域内で許可を受けた宅地造成工事が完了したときは、工事主は都道府県知事（指定都市等では市長）の検査を受けなければならない。","a":1,"e":"許可工事の完了時は知事の完了検査を受け、技術的基準に適合すれば検査済証が交付される（盛土規制法17条）。","m":"完了したら知事の検査"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02s-23-1","s":"個人が住宅用家屋を売買で取得した場合の所有権移転登記の税率軽減措置は、その家屋の取得後1年以内に登記を受けることが適用要件の一つとされている。","a":1,"e":"住宅用家屋の移転登記の軽減は、個人・売買か競落・床面積50㎡以上・取得後1年以内の登記が要件。","m":"取得後1年以内に登記"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02s-23-2","s":"個人が相続によって取得した住宅用家屋について所有権移転登記を受ける場合も、住宅用家屋の所有権移転登記に係る登録免許税の税率軽減措置の適用を受けることができる。","a":0,"e":"この軽減措置の対象は売買または競落による取得に限られ、相続や贈与による取得には適用されない。","m":"軽減は売買・競落だけ"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02s-23-4","s":"過去に住宅用家屋の所有権移転登記に係る登録免許税の税率軽減措置の適用を受けたことがある個人は、再びこの軽減措置の適用を受けることができない。","a":0,"e":"この軽減措置には適用回数の制限がなく、要件を満たせば過去に適用を受けた者でも再び適用を受けられる。","m":"登免税の軽減は何度でも"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02s-24-1","s":"固定資産税を全期分納付済みの土地所有者が、年度の途中でその土地を他人に譲渡した場合、譲渡後の月数に応じた税額の還付を市町村から受けることができる。","a":0,"e":"納税義務者は1月1日現在の登録所有者であり、年度途中に譲渡しても還付はない。精算は当事者間の取決めによる。","m":"1月1日の所有者が全額"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02s-24-2","s":"固定資産税の標準税率は100分の1.4とされており、市町村が条例で定める固定資産税の税率は100分の1.7を超えることができない。","a":0,"e":"標準税率は1.4％だが制限税率はなく、市町村は条例で1.7％を超える税率を定めることもできる。","m":"1.4%標準、上限なし"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02s-24-4","s":"住宅用地のうち面積200㎡以下の部分（小規模住宅用地）については、固定資産税の課税標準を価格の2分の1の額とする特例が設けられている。","a":0,"e":"小規模住宅用地（200㎡以下の部分）は価格の6分の1、200㎡を超える部分は3分の1が課税標準となる。","m":"小規模は1/6、一般は1/3"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02s-25-2","s":"標準地の鑑定評価を行った2人以上の不動産鑑定士は、土地鑑定委員会に対し、鑑定評価額その他の事項を記載した鑑定評価書を連名で提出しなければならない。","a":0,"e":"鑑定評価は2人以上の不動産鑑定士が行うが、鑑定評価書は各鑑定士がそれぞれ提出する。連名ではない。","m":"鑑定評価書は各自提出"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02s-25-4","s":"土地収用法その他の法律で土地を収用できる事業を行う者が公示区域内の土地を取得する場合、その取得価格は公示価格と同額にしなければならない。","a":0,"e":"収用事業者は公示価格を規準としなければならないが、同額にすることまでは求められていない（地価公示法9条）。","m":"収用は規準、同額不要"},{"f":"業法","t":"営業保証金","ref":"R02s-33-1","s":"宅建業者が事業開始後に従たる事務所を新設したときは、その従たる事務所の最寄りの供託所に政令で定める額の営業保証金を供託し、免許権者に届け出なければならない。","a":0,"e":"営業保証金は、どの事務所の分でも主たる事務所の最寄りの供託所に供託する（宅建業法25条1項・26条）。","m":"供託は本店の最寄りへ"},{"f":"業法","t":"営業保証金","ref":"R02s-33-2","s":"営業保証金を国債証券で供託している宅建業者が、主たる事務所の移転により最寄りの供託所が変わった場合、遅滞なく営業保証金の保管替えを請求しなければならない。","a":0,"e":"保管替えの請求は金銭のみで供託している場合に限られ、有価証券を含むときは新たな供託所に供託し直す。","m":"保管替えは金銭のみ"},{"f":"業法","t":"営業保証金","ref":"R02s-33-3","s":"宅建業者が免許の有効期間満了により営業保証金を取り戻すときは、還付請求権者に対する公告をすることなく、直ちに取り戻すことができる。","a":0,"e":"有効期間満了による取戻しは、6か月以上の期間を定めて公告が必要。公告不要は保証協会加入・保管替え等・10年経過の場合。","m":"取戻しは原則公告必要"},{"f":"税他","t":"景品表示法","ref":"R02s-47-1","s":"セットバックを要する部分を含む土地を広告する場合、その旨に加えて、セットバックを要する部分の面積を、その割合にかかわらず必ず表示しなければならない。","a":0,"e":"セットバックを要する旨は必ず表示するが、面積の併記はその部分が土地面積のおおむね10％以上の場合に必要。","m":"面積併記は10%以上"},{"f":"税他","t":"景品表示法","ref":"R02s-47-3","s":"既に契約済みで取引できない賃貸物件をインターネットに掲載していても、消費者からの問合せがなく、故意に掲載を続けていたのでなければ、不当表示にはならない。","a":0,"e":"契約済みで取引できない物件の広告はおとり広告に当たり、問合せや故意の有無にかかわらず不当表示となる。","m":"契約済み掲載はおとり"},{"f":"税他","t":"景品表示法","ref":"R02s-47-4","s":"価格が確定しておらず直ちに取引できない新築分譲住宅について、取引開始時期をあらかじめ告知する予告広告をすることは、公正競争規約上認められていない。","a":0,"e":"予告広告は公正競争規約で定められた広告で、価格等が未確定の新築分譲住宅等について一定の条件の下で認められている。","m":"予告広告はできる"},{"f":"権利","t":"賃貸借","ref":"R03-01-4","s":"賃借人の家屋明渡債務と賃貸人の敷金返還債務を同時履行の関係にあると解することは、明渡しまでに生じた一切の債権を担保するという敷金の性質に適合する。","a":0,"e":"同時履行とすると明渡しまでの債権を担保しきれず敷金の性質に合わない。明渡しが先履行（民法622条の2）。","m":"明渡しが先、敷金は後"},{"f":"権利","t":"保証・連帯債務","ref":"R03-02-1","s":"A・B・Cが債権者Dに連帯債務を負う場合、DがAに対して裁判上の請求をしても、特段の合意がなければ、B及びCの債務の消滅時効の完成には影響しない。","a":1,"e":"連帯債務者の一人への請求は相対効であり、他の連帯債務者の時効には影響しない（民法441条）。","m":"請求は相対効"},{"f":"権利","t":"保証・連帯債務","ref":"R03-02-3","s":"A・B・Cが債権者Dに300万円の連帯債務を負う場合、DがCの債務を免除しても、特段の合意がなければ、DはA及びBに対しそれぞれ300万円全額を請求できる。","a":1,"e":"連帯債務者の一人に対する免除は相対効で、他の連帯債務者の債務には影響しない（民法441条）。","m":"免除も相対効"},{"f":"権利","t":"相続","ref":"R03-03-ウ","s":"Aが自己所有の土地をDに売却する契約を締結し、引渡しと残代金決済の前にAが死亡した場合、その売買契約は原始的に履行不能となり無効となる。","a":0,"e":"売主が死亡しても売買契約は有効で、引渡債務は相続人に承継される。原始的不能の問題ではない（民法896条）。","m":"売主死亡でも契約は有効"},{"f":"権利","t":"相続","ref":"R03-04-4","s":"遺産分割により配偶者居住権を取得した配偶者Bは、居住建物が第三者Dに譲渡された場合、配偶者居住権の登記をしていなくてもDに対抗することができる。","a":0,"e":"配偶者居住権は登記が対抗要件で、所有者は登記を備えさせる義務を負う。登記がなければ対抗できない（民法1031条）。","m":"配偶者居住権は登記で対抗"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"R03-06-1","s":"譲渡制限の意思表示がされた売買代金債権が譲渡された場合でも、譲渡の効力は妨げられないが、債務者はその債権の全額に相当する金銭を供託することができる。","a":1,"e":"譲渡制限特約があっても債権譲渡は有効で、債務者は全額を供託して債務を免れられる（民法466条2項・466条の2）。","m":"制限特約でも譲渡は有効"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"R03-06-2","s":"債権譲渡の意思表示の時点でまだ発生していない将来の債権を譲渡した場合、譲受人は、その後に発生した債権を取得することができない。","a":0,"e":"将来債権も譲渡でき、譲受人は債権が発生した時に当然にこれを取得する（民法466条の6）。","m":"将来債権も譲渡OK"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"R03-06-3","s":"譲渡制限の意思表示がされた債権の譲受人がその意思表示を知っていた場合、債務者は譲受人への履行を拒むことができ、譲渡人への弁済を譲受人に対抗できる。","a":1,"e":"譲受人が悪意または重過失の場合、債務者は履行を拒み、譲渡人への弁済等を対抗できる（民法466条3項）。","m":"悪意・重過失には拒める"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"R03-06-4","s":"債権譲渡は、譲渡人の債務者への通知か債務者の承諾がなければ債務者その他の第三者に対抗できず、債務者以外の第三者に対抗するには確定日付のある証書が必要である。","a":1,"e":"債務者への対抗要件は通知か承諾、債務者以外の第三者には確定日付のある証書による通知・承諾が必要（民法467条）。","m":"第三者には確定日付"},{"f":"権利","t":"不法行為・請負・委任","ref":"R03-08-3","s":"建物の壁が崩れて通行人Bが負傷した場合、Bの不法行為に基づく損害賠償請求権は、Bが損害及び加害者を知らなくても、不法行為の時から20年間行使しなければ消滅する。","a":1,"e":"不法行為の損害賠償請求権は、不法行為の時から20年行使しないと時効で消滅する（民法724条2号）。","m":"行為時から20年"},{"f":"権利","t":"不法行為・請負・委任","ref":"R03-08-4","s":"建物の壁が崩れて通行人Bが負傷した場合、Bの損害賠償請求権は、Bが損害及び加害者を知った時から5年間行使しなければ時効によって消滅する。","a":1,"e":"人の生命・身体を害する不法行為では、知った時からの時効期間が3年から5年に延びる（民法724条の2）。","m":"生命・身体は知って5年"},{"f":"権利","t":"相続","ref":"R03-09-2","s":"Dが配偶者A、前妻との子F・Gを残して死亡し、Aには亡夫との子Cがいる場合、法定相続分はA2分の1、C・F・G各6分の1である。","a":0,"e":"CはDと親子関係がなく（養子縁組もない）相続人ではない。A2分の1、F・G各4分の1となる（民法887条・900条）。","m":"連れ子は養子縁組なしで相続なし"},{"f":"権利","t":"相続","ref":"R03-09-4","s":"Dが配偶者A、前妻との子F（親権者は前妻）・G（親権者はD）を残して死亡した場合、Fは親権者でないDの相続人とならず、法定相続分はA2分の1、G2分の1である。","a":0,"e":"親権の所在は相続に関係なく、FもDの子として相続人となる。A2分の1、F・G各4分の1（民法887条・900条）。","m":"親権がなくても子は子"},{"f":"権利","t":"借家","ref":"R03-12-3","s":"建物賃貸借が期間満了で終了する場合、建物が適法に転貸されているときに賃貸人が転借人にその旨を通知すれば、転貸借は通知の日から3か月を経過することで終了する。","a":0,"e":"期間満了・解約申入れで賃貸借が終了するとき、転借人への通知から6か月経過で転貸借が終了する（借地借家法34条）。","m":"転借人へ通知して6か月"},{"f":"権利","t":"借家","ref":"R03-12-4","s":"期間5年の定期建物賃貸借で、賃貸人が期間満了の1年前から6か月前までに終了の通知をしなかった場合、従前の契約と同一の条件で更新したものとみなされる。","a":0,"e":"通知を怠っても更新とはならず、後から通知すれば、その日から6か月経過後に終了を対抗できる（借地借家法38条）。","m":"通知遅れは6か月後終了"},{"f":"法令","t":"都市計画法","ref":"R03-15-1","s":"地区計画については、都市計画に、地区施設及び地区整備計画を定めるとともに、当該地区計画の目標を定めるよう努めるものとされている。","a":1,"e":"地区計画では地区施設・地区整備計画を定め、地区計画の目標や区域の整備・開発・保全の方針は努力義務（都市計画法12条の5）。","m":"目標は努力義務"},{"f":"法令","t":"都市計画法","ref":"R03-15-2","s":"地区計画等については、都市計画に、地区計画等の種類・名称・位置・区域を定めるとともに、区域の面積その他の政令で定める事項を定めるよう努めるものとされている。","a":1,"e":"種類・名称・位置・区域は必ず定め、区域の面積等は定めるよう努めるものとされる（都市計画法12条の4第2項）。","m":"面積は努力義務"},{"f":"法令","t":"建築基準法","ref":"R03-17-1","s":"建築基準法上、居室を有する建築物の居室の内装には、ホルムアルデヒドを発散させる建築材料を一切使用してはならないとされている。","a":0,"e":"ホルムアルデヒドは使用禁止ではなく、建築材料と換気設備を技術的基準に適合させる規制である（建築基準法28条の2）。","m":"ホルムアルデヒドは制限"},{"f":"法令","t":"建築基準法","ref":"R03-17-2","s":"4階建ての共同住宅の敷地内には、避難階に設けた屋外への出口から道又は公園等の空地に通じる幅員2m以上の通路を設けなければならない。","a":0,"e":"敷地内の避難通路の幅員は原則1.5m以上（階数3以下・延べ200㎡未満は90cm以上）とされている（建築基準法施行令128条）。","m":"敷地内通路は1.5m"},{"f":"法令","t":"建築基準法","ref":"R03-17-4","s":"3階建ての木造共同住宅を新築する場合でも、特定行政庁が安全上・防火上・避難上支障がないと認めたときは、検査済証の交付を受ける前に仮に使用することができる。","a":1,"e":"検査済証交付前の使用は原則禁止だが、特定行政庁等が支障ないと認めたときは仮使用できる（建築基準法7条の6）。","m":"仮使用は認定があればOK"},{"f":"法令","t":"盛土規制法","ref":"R03-19-1","s":"宅地造成等工事規制区域内で、面積500㎡の土地を切土のみで宅地にし、その切土部分に生じる崖の高さが1.5mである場合、都道府県知事の許可は不要である。","a":1,"e":"切土は崖の高さ2m超、または面積500㎡超の場合に許可が必要。高さ1.5m・面積500㎡ちょうどは対象外。","m":"切土2m超・面積500㎡超"},{"f":"法令","t":"盛土規制法","ref":"R03-19-2","s":"宅地造成等工事規制区域内の工事について許可の申請があったときは、都道府県知事は遅滞なく許可又は不許可の処分をし、文書で申請者に通知しなければならない。","a":1,"e":"知事は申請に対し遅滞なく許可・不許可の処分を行い、その結果を文書で申請者に通知しなければならない。","m":"遅滞なく文書で通知"},{"f":"法令","t":"盛土規制法","ref":"R03-19-4","s":"都道府県知事は、宅地造成等工事規制区域内の一団の造成宅地についても、一定の基準に該当すれば造成宅地防災区域として指定することができる。","a":0,"e":"造成宅地防災区域は、宅地造成等工事規制区域内の土地を除く区域で指定される。規制区域内では指定できない。","m":"防災区域は規制区域の外"},{"f":"法令","t":"土地区画整理法","ref":"R03-20-1","s":"土地区画整理組合の換地計画で参加組合員に与えると定められた宅地は、換地処分の公告があった日の翌日に、その参加組合員が取得する。","a":1,"e":"参加組合員に与える宅地は、換地処分の公告の日の翌日に参加組合員が取得する（土地区画整理法104条）。","m":"参加組合員も公告の翌日"},{"f":"法令","t":"土地区画整理法","ref":"R03-20-2","s":"換地計画で換地を定める場合、換地と従前の宅地の位置・地積・土質・水利・利用状況・環境等が照応するように定めなければならない。","a":1,"e":"換地は従前の宅地と位置・地積・土質・水利・利用状況・環境等が照応するよう定める（換地照応の原則、89条）。","m":"換地は照応が原則"},{"f":"法令","t":"土地区画整理法","ref":"R03-20-4","s":"土地区画整理組合の組合員は、組合員の3分の1以上の連署をもって、その代表者から理由を記載した書面を組合に提出し、理事又は監事の解任を請求できる。","a":1,"e":"組合員は総数の3分の1以上の連署で、理由を記した書面を提出して理事・監事の解任を請求できる（土地区画整理法27条）。","m":"役員解任は1/3連署"},{"f":"法令","t":"農地法","ref":"R03-21-2","s":"農地法第3条第1項の許可が必要な農地の売買について、許可を受けずに売買契約を締結した場合、その所有権移転の効力は生じない。","a":1,"e":"3条・5条の許可を受けずにした農地の権利移動は効力を生じない（農地法3条・5条）。","m":"無許可の売買は無効"},{"f":"法令","t":"農地法","ref":"R03-21-3","s":"砂利採取法の認可を受けて、市街化調整区域内の農地を砂利採取のために一時的に借り受ける場合、農地法第5条第1項の許可は不要である。","a":0,"e":"一時的な借受けでも農地を転用目的で借りるので5条許可が必要。砂利採取法の認可は農地法の許可に代わらない。","m":"一時転用も5条許可"},{"f":"法令","t":"国土利用計画法","ref":"R03-22-2","s":"事後届出があった場合、都道府県知事は、届出をした者に対し、その土地の利用目的だけでなく対価の額についても必要な助言をすることができる。","a":0,"e":"事後届出に対する助言は土地の利用目的についてのみで、対価の額は助言の対象とならない（国土利用計画法27条の2）。","m":"事後届出の助言は目的だけ"},{"f":"法令","t":"国土利用計画法","ref":"R03-22-3","s":"事後届出が必要な土地売買契約で権利取得者が届出をしなかった場合、都道府県知事の勧告に従わなかったときに限り罰則が適用される。","a":0,"e":"届出をしないこと自体が罰則の対象で、勧告を経る必要はない（6か月以下の拘禁刑又は100万円以下の罰金）。","m":"無届は即罰則"},{"f":"法令","t":"国土利用計画法","ref":"R03-22-4","s":"準都市計画区域内の20,000㎡の土地をAが10,000㎡ずつB市と宅建業者Cに売却した場合、Cは一定の場合を除き事後届出を行う必要がある。","a":1,"e":"B市との契約は届出不要だが、Cは都市計画区域外の基準10,000㎡以上を取得するので届出が必要（国土利用計画法23条）。","m":"区域外は1万㎡以上"},{"f":"税他","t":"所得税・譲渡","ref":"R03-23-3","s":"建物の所有を目的とする土地の賃借権の設定の対価として受け取る権利金の額が、その土地の価額の2分の1を超える場合、その所得は不動産所得として課税される。","a":0,"e":"借地権設定の権利金が土地の価額の2分の1を超える場合は、不動産所得ではなく譲渡所得として課税される（所得税法施行令79条）。","m":"権利金1/2超は譲渡所得"},{"f":"税他","t":"所得税・譲渡","ref":"R03-23-4","s":"総合課税の譲渡所得のうち、取得の日以後5年以内に譲渡した資産に係る短期譲渡所得も、特別控除後の金額の2分の1が総所得金額に算入される。","a":0,"e":"2分の1を算入するのは長期譲渡所得だけで、短期譲渡所得は全額が総所得金額に算入される（所得税法22条2項）。","m":"1/2になるのは長期だけ"},{"f":"業法","t":"重要事項説明","ref":"R03-26-1","s":"宅建業者Aが自ら売主として宅建業者でない買主Bに建物を売却する場合、Aは重要事項の説明を専任の宅地建物取引士にさせなければならない。","a":0,"e":"重要事項説明は宅建士であればよく、専任である必要はない。非常勤の宅建士でも説明できる（宅建業法35条）。","m":"重説は専任でなくてOK"},{"f":"業法","t":"重要事項説明","ref":"R03-26-3","s":"宅建業者が建物を売却する場合、建物に存する登記された権利の種類・内容に加え、所有権移転登記の申請の時期も重要事項として説明しなければならない。","a":0,"e":"登記された権利の種類・内容は35条の説明事項だが、移転登記の申請時期は37条書面の記載事項で、重説は不要。","m":"登記申請時期は37条"},{"f":"業法","t":"重要事項説明","ref":"R03-26-4","s":"宅建業者が自ら売主として宅建業者でない者に建物を売却する場合、建物の引渡しの時期を重要事項として説明しなければならない。","a":0,"e":"引渡しの時期は37条書面の必要的記載事項であり、35条の重要事項説明の対象ではない。","m":"引渡し時期は37条"},{"f":"業法","t":"免許の基準","ref":"R03-27-1","s":"個人Aが不正の手段で宅建業の免許を受けたとして免許を取り消された場合、取消しの日から5年を経過しても、Aは再び免許を受けることができない。","a":0,"e":"不正手段による免許取消しの欠格期間は取消しの日から5年。経過すれば他の欠格事由がない限り免許を受けられる。","m":"不正取消しは5年で復帰"},{"f":"業法","t":"免許の基準","ref":"R03-27-2","s":"破産手続開始の決定を受けた個人Bは、その後復権を得た場合であっても、復権から5年を経過しなければ宅建業の免許を受けることができない。","a":0,"e":"破産者は復権を得れば直ちに免許を受けられる。5年の待機期間はない（宅建業法5条1項1号）。","m":"破産は復権で即OK"},{"f":"業法","t":"宅建士","ref":"R03-28-1","s":"甲県知事の登録を受けている宅建士が乙県内の宅建業者の事務所に勤務することになった場合、甲県知事を経由せずに乙県知事に対して登録の移転を申請しなければならない。","a":0,"e":"登録の移転は任意であり、申請する場合も現在登録している甲県知事を経由して行う（法19条の2）。","m":"移転は任意・経由して"},{"f":"業法","t":"宅建士","ref":"R03-28-2","s":"宅建士の登録は受けているが宅建士証の交付を受けていない者が宅建士としてすべき事務を行った場合、登録をしている知事は、情状にかかわらず必ずその登録を消除しなければならない。","a":0,"e":"宅建士証の交付を受けていない登録者が宅建士としてすべき事務を行った場合、知事が登録を消除しなければならないのは「情状が特に重いとき」に限られる（宅建業法68条の2第2項3号）。情状を問わず必ず消除するわけではない。なお、この者は宅地建物取引士ではないため、68条の指示処分・事務禁止処分の対象にはならない。","m":"特に重いとき消除"},{"f":"業法","t":"広告","ref":"R03-30-ウ","s":"宅建業者が一団の宅地を数回に分けて広告する場合、最初の広告で取引態様の別を明示していれば、2回目以降の広告では取引態様の別を明示しなくてもよい。","a":0,"e":"取引態様の別は、最初の広告だけでなく、広告をするたびに毎回明示しなければならない（宅建業法34条1項）。","m":"態様は広告のたび"},{"f":"業法","t":"広告","ref":"R03-30-エ","s":"宅建業者は、建築確認が必要な未完成の建物について、確認を受ける前に「建築確認申請中」と明示したとしても、その建物の売買の広告をすることはできない。","a":1,"e":"広告開始時期の制限により、建築確認を受けた後でなければ広告できない。申請中の表示でも違反となる（法33条）。","m":"申請中でも広告不可"},{"f":"業法","t":"保証協会","ref":"R03-31-1","s":"保証協会は、新たに社員として加入しようとする宅建業者に対し、その者が社員となる前に行った宅建業の取引から生じた債務について、担保の提供を求めることができる。","a":1,"e":"加入前の取引による債権も弁済業務の対象となるため、保証協会は担保の提供を求めることができる（法64条の4第3項）。","m":"加入前債務は担保要求"},{"f":"業法","t":"保証協会","ref":"R03-31-2","s":"保証協会から苦情の解決のために文書による説明や資料の提出を求められた社員は、正当な理由がある場合でなければ、これを拒んではならない。","a":1,"e":"苦情解決のための説明・資料提出の求めに対し、社員は正当な理由なく拒めない（法64条の5第3項）。","m":"苦情の求めは拒めず"},{"f":"業法","t":"保証協会","ref":"R03-31-4","s":"還付充当金を納付すべき旨の通知を受けた社員が期限までに納付しないと社員の地位を失い、保証協会は直ちにその旨を社員の免許権者に報告しなければならない。","a":1,"e":"通知から2週間以内に納付しないと社員の地位を失い、保証協会は免許権者に直ちに報告する（法64条の10・64条の4）。","m":"未納→地位喪失→報告"},{"f":"業法","t":"重要事項説明","ref":"R03-33-2","s":"取引対象の宅地が、市町村の作成した洪水・雨水出水・高潮の各水害ハザードマップの対象区域に含まれる場合、重要事項説明ではそのうち1種類を提示すれば足りる。","a":0,"e":"作成されている水害ハザードマップは種類ごとに提示が必要で、該当するすべてを示して所在地を説明する。","m":"3種すべて提示"},{"f":"業法","t":"重要事項説明","ref":"R03-33-4","s":"宅建業者は、水害ハザードマップを重要事項説明書に添付しておけば、そのハザードマップにおける取引対象の宅地建物の所在地について口頭で説明する必要はない。","a":0,"e":"添付だけでは足りず、ハザードマップを提示して対象物件の位置を説明しなければならない。","m":"添付だけでは不足"},{"f":"業法","t":"営業保証金","ref":"R03-34-1","s":"国土交通大臣の免許を受けた宅建業者が主たる事務所の最寄りの供託所に営業保証金を供託した場合、供託所から大臣に通知されるので、業者自身が供託の届出をする必要はない。","a":0,"e":"供託後、供託書の写しを添付して免許権者に届け出なければ事業を開始できない（法25条4項・5項）。","m":"供託したら届出"},{"f":"業法","t":"営業保証金","ref":"R03-34-3","s":"宅建業者は、営業保証金を金銭または有価証券のいずれかで供託することができるが、金銭と有価証券を併用して供託することはできない。","a":0,"e":"営業保証金は金銭のみ、有価証券のみ、両者の併用のいずれの方法でも供託できる（法25条3項）。","m":"併用もOK"},{"f":"業法","t":"営業保証金","ref":"R03-34-4","s":"有価証券で営業保証金を供託する場合、その評価額は、国債証券については額面金額の90％、地方債証券については額面金額の80％となる。","a":0,"e":"国債証券は額面の100％、地方債証券・政府保証債は90％で評価される（規則15条）。","m":"国債100地方債90"},{"f":"業法","t":"宅建士","ref":"R03-35-イ","s":"甲県知事登録の宅建士が事務禁止処分を受け、その期間中に自ら申請して登録を消除された場合、期間満了までは乙県で改めて試験に合格しても登録を受けられない。","a":1,"e":"事務禁止期間中に本人の申請で登録消除された者は、期間が満了するまで登録の欠格事由に当たる（18条1項）。","m":"禁止期間中の消除は待て"},{"f":"業法","t":"宅建士","ref":"R03-35-ウ","s":"甲県知事登録の宅建士は、住所を乙県に移転しただけの場合でも、甲県知事を経由して乙県知事に登録の移転を申請することができる。","a":0,"e":"登録の移転は、登録先以外の都道府県にある宅建業者の事務所に従事し、またはしようとする場合に限り申請できる。","m":"移転は勤務先が理由"},{"f":"業法","t":"重要事項説明","ref":"R03-36-2","s":"建物の貸借の媒介において、その建物について石綿の使用の有無の調査結果が記録されているときは、宅建業者はその内容を重要事項として説明しなければならない。","a":1,"e":"石綿使用の有無の調査結果の記録があれば、売買・貸借を問わず建物の取引では説明が必要である。","m":"石綿記録は貸借も説明"},{"f":"業法","t":"重要事項説明","ref":"R03-36-4","s":"宅地の貸借の媒介において、敷金その他契約終了時に精算することとされている金銭の精算に関する事項は、重要事項として説明しなければならない。","a":1,"e":"敷金等の精算に関する事項は、宅地・建物の貸借で説明すべき事項である。名目を問わず契約終了時に精算する金銭が対象。","m":"敷金精算は貸借で説明"},{"f":"業法","t":"クーリング・オフ","ref":"R03-39-1","s":"宅建業者Aが自ら売主としてクーリング・オフについて告げる書面には、撤回・解除があった場合にAが損害賠償や違約金の支払を請求できない旨を記載しなければならない。","a":1,"e":"損害賠償・違約金を請求できない旨は、クーリング・オフの告知書面の記載事項とされている。","m":"告知書面に違約金不可"},{"f":"業法","t":"クーリング・オフ","ref":"R03-39-2","s":"宅建業者が自ら売主となる売買で、買主が物件の引渡しを受けるか代金の全部を支払うかのいずれか一方をすれば、買主はクーリング・オフができなくなる。","a":0,"e":"できなくなるのは引渡しを受け「かつ」代金全部を支払ったとき（37条の2第1項2号）。一方だけでは行使できる。","m":"引渡しかつ全額で終了"},{"f":"業法","t":"クーリング・オフ","ref":"R03-39-4","s":"売主業者Aの売買を宅建業者Bが媒介した場合、Aが買主に交付するクーリング・オフの告知書面には、Bの商号・住所・免許証番号も記載しなければならない。","a":0,"e":"告知書面は売主業者と買主の間の書面で、記載するのは売主業者の情報。媒介業者の情報は記載事項ではない。","m":"告知書面に媒介業者不要"},{"f":"業法","t":"37条書面","ref":"R03-41-ウ","s":"宅建業者Aが自ら売主として宅建業者Bに宅地を売却した場合、買主Bが宅建業者であるので、Aは37条書面をBに交付しなくてよい。","a":0,"e":"37条書面は相手方が宅建業者であっても交付が必要である。35条の説明省略と混同しないこと。","m":"37条は業者間でも交付"},{"f":"業法","t":"37条書面","ref":"R03-41-エ","s":"宅建業者が宅地の売買を媒介した場合、その宅地に登記された抵当権があるときは、37条書面にその抵当権の内容を記載しなければならない。","a":0,"e":"抵当権など登記された権利の内容は35条の説明事項であり、37条書面の記載事項ではない。","m":"抵当権は35条で説明"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R03-45-1","s":"宅建業者Aが自ら売主として新築住宅を販売する場合、買主Bが建設業者であっても宅建業者でなければ、Aは資力確保措置（供託又は保険）を講じなければならない。","a":1,"e":"資力確保措置が不要になるのは買主が宅建業者の場合だけ。建設業者は宅建業者ではないので義務がある。","m":"買主が業者のときだけ不要"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R03-45-2","s":"売主業者が締結する住宅販売瑕疵担保責任保険契約は、新築住宅の引渡しから2年以上の期間にわたって有効なものであれば足りる。","a":0,"e":"保険契約は引渡しから10年以上の期間有効でなければならない。品確法の10年の担保責任に対応している。","m":"保険は10年以上"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R03-45-4","s":"売主業者と買主の間で構造耐力上主要な部分の瑕疵について売主が責任を負わない旨の特約をすれば、売主業者は資力確保措置を講じる必要がない。","a":0,"e":"構造耐力上主要な部分等の10年の責任に反する買主に不利な特約は無効。特約があっても資力確保義務は残る。","m":"免責特約でも義務は残る"},{"f":"税他","t":"土地・建物","ref":"R03-49-1","s":"森林は木材資源として重要であるだけでなく、雨水を蓄えて水源を涵養し、洪水を防止するなど、国土の保全に大きな役割を担っている。","a":1,"e":"森林には雨水を蓄えて水源を守る水源涵養機能や、洪水・土砂流出を防ぐ機能があり、宅地周辺の防災にも関わる。","m":"森林は水を蓄える"},{"f":"税他","t":"土地・建物","ref":"R03-49-2","s":"活動度の高い火山のふもと（火山麓）に宅地を求める場合には、溶岩流や火砕流、降灰など火山活動に伴う災害に注意する必要がある。","a":1,"e":"活動度の高い火山の麓は噴火に伴う溶岩流・火砕流・降灰などの災害を受けるおそれがあり、注意が必要。","m":"火山麓は噴火に注意"},{"f":"税他","t":"土地・建物","ref":"R03-50-1","s":"鉄骨構造はトラス・ラーメン・アーチなどの構造形式を用いて高層建築の骨組にも適しており、コンクリートを使わない分、鉄筋コンクリート造より軽量である。","a":1,"e":"鉄骨造はトラス・ラーメン・アーチ等の形式で高層にも使われ、コンクリートを用いない分RC造より軽い。","m":"鉄骨は軽くて高層向き"},{"f":"税他","t":"土地・建物","ref":"R03-50-2","s":"鉄骨構造の床には、軽量で耐火性に優れたALC板や、工場製造で品質が均一なプレキャストコンクリート板が用いられる。","a":1,"e":"鉄骨造の床材としてALC板（軽量・耐火性）やPCa板（工場製で品質均一）が広く使われている。","m":"鉄骨の床はALCとPCa"},{"f":"権利","t":"不法行為・請負・委任","ref":"R03s-01-1","s":"判例によれば、権利を侵害された者が裁判手続によらず実力で権利を回復する自力救済は、必要な限度を超えない範囲であれば、特別の事情の有無を問わず許される。","a":0,"e":"自力救済は原則禁止で、法的手続では回復が著しく困難な緊急やむを得ない特別の事情があり、必要限度内の場合に限り許される。","m":"自力救済は原則禁止"},{"f":"権利","t":"不法行為・請負・委任","ref":"R03s-01-2","s":"建物賃貸借の終了後、賃借人が退去しないまま家財を残している場合でも、賃貸人は、裁判手続によらずにその残置物を自ら搬出・撤去することが原則として許される。","a":0,"e":"裁判によらず残置物を撤去するのは自力救済に当たり、緊急やむを得ない特別の事情がない限り許されない。","m":"勝手に撤去は不可"},{"f":"権利","t":"共有・相隣","ref":"R03s-02-1","s":"土地の所有者は、隣地の所有者と共同の費用で境界標を設けることができ、その設置・保存の費用は、原則として相隣者が等しい割合で負担する。","a":1,"e":"境界標は共同の費用で設置でき、設置・保存費用は相隣者が平分して負担する（民法223条・224条）。","m":"境界標は折半"},{"f":"権利","t":"共有・相隣","ref":"R03s-02-2","s":"隣り合う土地の境界線上に設けられた境界標・囲障・障壁・溝・堀は、特段の事情がない限り、隣接する土地の所有者である相隣者の共有に属するものと推定される。","a":1,"e":"境界線上に設けた境界標や囲障などは、相隣者が共同で利用するものとして、その共有に属すると推定される（民法229条）。","m":"境界線上は共有推定"},{"f":"権利","t":"共有・相隣","ref":"R03s-02-4","s":"土地の所有者は、自分の土地に建物を建てる場合であっても、雨水を直接隣地に注ぐ構造の屋根その他の工作物を設けることはできない。","a":1,"e":"雨水を直接隣地に注ぐ構造の屋根などの工作物の設置は、隣地への被害を防ぐため禁止されている（民法218条）。","m":"雨水を隣に直接×"},{"f":"権利","t":"意思表示・行為能力","ref":"R03s-03-1","s":"成年後見人が、成年被後見人を代理して、成年被後見人所有の乗用車を第三者に売却するには、家庭裁判所の許可を得なければならない。","a":0,"e":"家庭裁判所の許可が必要なのは居住用不動産の売却・賃貸・抵当権設定等であり、乗用車の売却は不要（民法859条の3）。","m":"許可は居住用不動産"},{"f":"権利","t":"意思表示・行為能力","ref":"R03s-03-4","s":"成年後見人が、成年被後見人を代理して、成年被後見人所有の倉庫について第三者との賃貸借契約を解除するには、家庭裁判所の許可を得なければならない。","a":0,"e":"許可が必要なのは居住の用に供する建物又は敷地に関する処分であり、倉庫の賃貸借の解除は対象外（民法859条の3）。","m":"倉庫は許可不要"},{"f":"権利","t":"売買・契約不適合","ref":"R03s-04-1","s":"買主Bが売主Aに手付を交付した場合、Aは、目的物を引き渡すまでであれば、Bが履行に着手した後でも、手付の倍額を現実に提供して契約を解除できる。","a":0,"e":"手付解除ができるのは相手方が契約の履行に着手するまでである（民法557条1項）。","m":"相手の着手まで"},{"f":"権利","t":"売買・契約不適合","ref":"R03s-04-3","s":"他人が所有する土地の売買契約で、売主Aがその土地が他人の物であることを知らなかった場合、Aは権利を移転できないときに、損害を賠償することなく契約を解除できる。","a":0,"e":"他人物売買も有効で、売主は権利取得・移転義務を負う。善意の売主の解除権の規定は債権法改正で削除された（民法561条）。","m":"善意売主の解除権なし"},{"f":"権利","t":"売買・契約不適合","ref":"R03s-04-4","s":"引渡し時に売主が目的物の契約不適合を知っていた場合、買主は不適合を知ってから1年以内に通知しなくても、消滅時効が完成していなければ担保責任を追及できる。","a":1,"e":"売主が引渡し時に悪意又は重過失の場合、1年以内の通知の期間制限は適用されない（民法566条ただし書）。","m":"売主悪意なら通知不要"},{"f":"権利","t":"代理","ref":"R03s-05-1","s":"代理人Aが、第三者の利益を図る目的で代理権の範囲内の行為をし、相手方Cがその目的を知っていた場合でも、本人Bの追認がなくてもその効果はBに帰属する。","a":0,"e":"代理権の濫用で相手方が目的を知り又は知ることができたときは無権代理とみなされ、追認がなければ本人に帰属しない（民法107条）。","m":"濫用+悪意=無権代理"},{"f":"権利","t":"代理","ref":"R03s-05-2","s":"本人Bが、代理権を与えていないAに代理権を与えた旨を相手方Cに表示した場合、CがAに代理権がないことを知っていたとしても、BはAの行為について責任を負う。","a":0,"e":"代理権授与表示による表見代理は、相手方が悪意又は有過失なら成立せず、本人は責任を負わない（民法109条1項）。","m":"表見代理は善意無過失"},{"f":"権利","t":"代理","ref":"R03s-05-3","s":"全く代理権のないAが本人Bの代理人と偽って相手方Cと契約した場合、CがAに代理権があると信じていても、Bの追認がなければ原則としてその効果はBに帰属しない。","a":1,"e":"代理権授与の外観がない無権代理行為は、本人が追認しない限り本人に効力を生じない（民法113条1項）。","m":"無権代理は追認次第"},{"f":"権利","t":"物権変動・対抗","ref":"R03s-06-1","s":"甲土地の所有権がA→B→C→Dと順次譲渡された場合、最初の売主Aは、Dにとって登記がなければ所有権を対抗できない第三者に当たる。","a":0,"e":"転々譲渡の前主は当事者と同様に扱われ、対抗関係に立つ第三者には当たらない。Dは登記がなくてもAに所有権を主張できる。","m":"前の売主は第三者×"},{"f":"権利","t":"物権変動・対抗","ref":"R03s-06-2","s":"土地の賃借人で、その土地上に登記した建物を所有する者は、その土地の所有権を新たに取得した者と対抗関係に立つ第三者に当たる。","a":1,"e":"借地上の登記建物の所有者と土地の新所有者は対抗関係に立ち、新所有者は賃料請求等に所有権移転登記を要する。","m":"借地人も対抗関係"},{"f":"権利","t":"時効","ref":"R03s-06-3","s":"第三者が所有権移転登記をした後に取得時効が完成した場合、時効取得者は、その時効完成前の第三者に対しては、登記がなくても時効取得を対抗できる。","a":1,"e":"時効完成前に登場した第三者は時効の当事者と同様の関係に立つため、時効取得者は登記なしに対抗できる（判例）。","m":"完成前の第三者は登記不要"},{"f":"権利","t":"相続","ref":"R03s-07-3","s":"船舶が遭難した場合、その船舶中で死亡の危急に迫った者は、証人2人以上の立会いがあれば、自筆証書や公正証書によらず口頭で遺言をすることができる。","a":1,"e":"船舶遭難者の特別方式の遺言として、証人2人以上の立会いで口頭による遺言が認められている（民法979条1項）。","m":"遭難は証人2人で口頭"},{"f":"権利","t":"意思表示・行為能力","ref":"R03s-08-3","s":"承諾期間を定めずに郵便で発信された申込みは、撤回する権利を留保していない限り、申込者が承諾の通知を受けるのに相当な期間を経過するまでは撤回することができない。","a":1,"e":"承諾期間の定めのない隔地者への申込みは、撤回権を留保した場合を除き、相当期間が経過するまで撤回できない（民法525条1項）。","m":"相当期間は撤回不可"},{"f":"権利","t":"債務不履行・解除","ref":"R03s-09-1","s":"建物の売買契約が解除されると買主は使用利益を返還する必要があるが、建物の賃貸借契約が解除されても、賃貸人は解除までに受け取った賃料を返還する必要はない。","a":1,"e":"売買の解除は遡及し原状回復義務を負うが、賃貸借の解除は将来に向かってのみ効力を生じる（民法545条・620条）。","m":"賃貸借の解除は将来効"},{"f":"権利","t":"抵当権・担保","ref":"R03s-10-1","s":"建物に抵当権が設定登記された後に、その建物が賃貸された場合、被担保債権が債務不履行になれば、抵当権者は物上代位により賃料債権を差し押さえることができる。","a":1,"e":"抵当権者は、目的物の賃料についても、払渡し前に差し押さえれば物上代位できる（民法372条・304条）。","m":"賃料にも物上代位"},{"f":"権利","t":"抵当権・担保","ref":"R03s-10-2","s":"建物の賃借人Cが、その建物に抵当権が設定登記される前に引渡しを受けていた場合でも、Cは賃借権を抵当権の実行による競売の買受人に対抗できない。","a":0,"e":"賃借権の対抗要件（引渡し）が抵当権設定登記より先なので、Cは買受人に賃借権を対抗できる（借地借家法31条）。","m":"先に引渡し→対抗可"},{"f":"権利","t":"抵当権・担保","ref":"R03s-10-4","s":"抵当権設定登記より前に建物の引渡しを受けた賃借人Cも、競売の買受けの時から1年を経過したときは、買受人に建物を引き渡さなければならない。","a":0,"e":"抵当権に先立って対抗要件を備えた賃借人は、賃借権を主張して買受人への引渡しを拒める。","m":"先に対抗要件→拒める"},{"f":"権利","t":"借地","ref":"R03s-11-1","s":"借地権の当事者が合意によって借地契約の最初の更新をする場合、更新後の存続期間は、更新の日から30年以上の期間を定めなければならない。","a":0,"e":"最初の更新後の存続期間は20年以上、2回目以降は10年以上であればよい（借地借家法4条）。","m":"更新は20年・10年"},{"f":"権利","t":"借地","ref":"R03s-11-2","s":"借地上に建物がある場合に借地権者が契約の更新を請求したときは、借地権設定者は、正当事由があっても異議を述べて更新を拒むことはできない。","a":0,"e":"借地権設定者は、正当事由があれば遅滞なく異議を述べて更新を拒絶できる（借地借家法5条・6条）。","m":"正当事由で異議OK"},{"f":"権利","t":"借家","ref":"R03s-12-3","s":"賃借人の債務不履行により建物賃貸借が解除された場合、適法な転貸借は、賃貸人が転借人に賃貸借終了を通知した日から6か月を経過した時に終了する。","a":0,"e":"債務不履行解除の場合、転貸借は賃貸人が転借人に明渡しを請求した時に終了する（判例）。","m":"不履行解除→請求時終了"},{"f":"権利","t":"区分所有法","ref":"R03s-13-1","s":"区分所有者の承諾を得て専有部分を占有する賃借人は、集会の目的事項に利害関係があれば、集会に出席して意見を述べることはできるが、議決権を行使することはできない。","a":1,"e":"占有者は利害関係がある事項について集会で意見を述べられるが、議決権は持たない（区分所有法44条1項）。","m":"占有者は意見のみ"},{"f":"権利","t":"区分所有法","ref":"R03s-13-3","s":"区分所有建物の共用部分は区分所有者全員の共有に属するのが原則だが、規約で特別の定めをすれば、管理者を共用部分の所有者とすることができる。","a":1,"e":"規約に特別の定めがあれば、管理者に共用部分を所有させる管理所有が認められる（区分所有法11条2項・27条）。","m":"規約で管理所有"},{"f":"権利","t":"区分所有法","ref":"R03s-13-4","s":"管理組合法人には理事を置かなければならず、理事が数人いるときは、規約に別段の定めがない限り、管理組合法人の事務は理事の過半数で決する。","a":1,"e":"理事は必置機関であり、複数の場合は規約に別段の定めがなければ理事の過半数で事務を決する（区分所有法49条）。","m":"理事必置・過半数"},{"f":"権利","t":"不動産登記法","ref":"R03s-14-2","s":"共用部分である旨の登記がある建物であっても、所有者が同じであれば、その建物と隣接する他の建物とを合併する建物の合併の登記を申請することができる。","a":0,"e":"共用部分である旨の登記がある建物は、建物の合併の登記をすることができない（不動産登記法56条）。","m":"共用部分登記は合併×"},{"f":"権利","t":"不動産登記法","ref":"R03s-14-3","s":"登記官は、表示に関する登記について申請があった場合や職権で登記しようとする場合に、必要と認めるときは、その不動産の表示に関する事項を調査することができる。","a":1,"e":"表示に関する登記では、登記官に実地調査などの調査権限が認められている（不動産登記法29条1項）。","m":"表示登記は登記官調査"},{"f":"権利","t":"不動産登記法","ref":"R03s-14-4","s":"区分建物を新築した者が表題登記を申請する前に死亡した場合、その相続人は、被相続人を表題部所有者とする表題登記を申請することができる。","a":1,"e":"区分建物の新築者に一般承継があった場合、一般承継人は被承継人を表題部所有者とする表題登記を申請できる（同法47条2項）。","m":"相続人が故人名義で申請"},{"f":"法令","t":"盛土規制法","ref":"R03s-19-2","s":"都道府県知事は、宅地造成等工事規制区域内の土地の所有者・管理者・占有者に対し、その土地や行われている工事の状況について報告を求めることができる。","a":1,"e":"盛土規制法上、知事は規制区域内の土地の所有者等に対し、土地や工事の状況の報告を求める権限を持つ。","m":"区域内は報告徴収OK"},{"f":"法令","t":"盛土規制法","ref":"R03s-19-3","s":"宅地造成等工事規制区域内で高さ5mを超える擁壁を設置する工事を行う場合、その擁壁は政令で定める資格を有する者の設計によらなければならない。","a":1,"e":"有資格者の設計が必要なのは、高さ5m超の擁壁と、盛土・切土面積1,500㎡超の土地の排水施設の2つ。","m":"5m擁壁・1500㎡排水"},{"f":"法令","t":"盛土規制法","ref":"R03s-19-4","s":"偽りその他不正な手段により宅地造成等に関する工事の許可を受けた者がいる場合、都道府県知事はその許可を取り消すことができる。","a":1,"e":"不正手段で受けた許可は、知事が取り消すことができる（任意的な取消し）。義務ではない点に注意。","m":"不正許可は取消し可"},{"f":"法令","t":"農地法","ref":"R03s-21-1","s":"農地の所有者が、自宅の建設資金を借り入れるためにその農地に抵当権を設定する場合には、農地法第3条第1項の許可を受ける必要がある。","a":0,"e":"抵当権の設定は使用収益権の移転でも転用でもないため、3条・4条・5条いずれの許可も不要。","m":"抵当権設定は許可不要"},{"f":"法令","t":"農地法","ref":"R03s-21-2","s":"農地の賃貸借について、所有者が賃借人に対して一方的に解約の申入れをする場合には、農地法第18条の都道府県知事の許可は不要である。","a":0,"e":"農地の賃貸借の解除・解約申入れ等には、原則として都道府県知事の許可が必要（農地法18条1項）。","m":"賃貸借の解約は知事許可"},{"f":"法令","t":"農地法","ref":"R03s-21-4","s":"市街化区域内にある自己所有の農地を駐車場に転用する場合、あらかじめ農業委員会に届け出れば、農地法第4条第1項の許可は不要である。","a":1,"e":"市街化区域内の農地転用は、事前に農業委員会へ届け出れば4条許可は不要（市街化区域の特例）。","m":"市街化区域は届出でOK"},{"f":"法令","t":"国土利用計画法","ref":"R03s-22-2","s":"遊休土地である旨の通知を受けた者は、通知があった日から起算して1か月以内に、その土地の利用・処分に関する計画を都道府県知事に届け出なければならない。","a":0,"e":"遊休土地の通知を受けた者は、通知の日から6週間以内に利用・処分計画を知事に届け出る必要がある。","m":"遊休土地は6週間"},{"f":"法令","t":"国土利用計画法","ref":"R03s-22-3","s":"市街化調整区域内で、一定の計画に従い2,000㎡の土地と隣接する3,000㎡の土地を順に購入したDは、それぞれが5,000㎡未満なので事後届出は不要である。","a":0,"e":"一団の土地として合計5,000㎡となり、市街化調整区域の届出基準（5,000㎡以上）を満たすため届出が必要。","m":"一団の土地は合計で判断"},{"f":"法令","t":"国土利用計画法","ref":"R03s-22-4","s":"事後届出に係る土地の利用目的について勧告を受けた者がその勧告に従わない場合、都道府県知事はその旨およびその勧告の内容を公表しなければならない。","a":0,"e":"勧告に従わないときの公表は「できる」とされる任意の措置であり、知事に公表の義務はない。","m":"公表は「できる」"},{"f":"税他","t":"印紙税・登録免許税","ref":"R03s-23-1","s":"住宅用家屋の所有権移転登記に係る登録免許税の税率の軽減措置は、床面積100㎡以上で、取得した個人の居住の用に供する家屋に限り適用される。","a":0,"e":"床面積の要件は50㎡以上であり、100㎡以上ではない。個人の居住用であることは要件となる。","m":"床面積は50㎡以上"},{"f":"税他","t":"印紙税・登録免許税","ref":"R03s-23-2","s":"住宅用家屋の所有権移転登記に係る登録免許税の税率の軽減措置は、個人が売買または競落によって取得した住宅用家屋に限って適用される。","a":1,"e":"移転登記の軽減は、売買・競落による取得が対象。贈与や相続による取得には適用されない。","m":"売買・競落のみ"},{"f":"税他","t":"印紙税・登録免許税","ref":"R03s-23-4","s":"住宅用家屋の所有権移転登記に係る登録免許税の税率の軽減措置の適用を受けるには、都道府県知事が発行する証明書を登記申請書に添付する必要がある。","a":0,"e":"添付するのは市区町村長が発行する住宅用家屋証明書であり、都道府県知事の証明書ではない。","m":"証明は市区町村長"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R03s-25-1","s":"地価公示法は、標準地の正常な価格を公示して一般の土地取引価格の指標とし、公共事業用地の補償金額の算定等に資することで、適正な地価の形成に寄与することを目的とする。","a":1,"e":"地価公示法1条の目的規定のとおり。公示価格は取引の指標や補償金算定の規準として用いられる。","m":"取引の指標＋補償の規準"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R03s-25-3","s":"標準地の鑑定評価は、近傍類地の取引価格から算定される推定価格、地代等から算定される推定価格、同等の効用を有する土地の造成費用の額を勘案して行う。","a":1,"e":"取引事例比較法・収益還元法・原価法の3手法に対応する価格を勘案して鑑定評価を行う。","m":"3手法を勘案"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R03s-25-4","s":"関係市町村長は、土地鑑定委員会から送付された標準地に関する書面と図面を、送付を受けた日から3年間、一般の閲覧に供しなければならない。","a":1,"e":"公示後、土地鑑定委員会が関係市町村長に書面等を送付し、市町村長はそれを3年間一般の閲覧に供する。","m":"閲覧は3年間"},{"f":"業法","t":"8種制限","ref":"R03s-27-1","s":"宅建業者Aが自ら売主となり宅建業者でないBと建物の売買契約を結ぶ際、損害賠償額の予定と違約金の合計が代金の2割を超える特約をした場合、その特約は全体が無効となる。","a":0,"e":"代金の2割を超える部分のみが無効となり、特約全体が無効になるわけではない（宅建業法38条2項）。","m":"2割超の部分だけ無効"},{"f":"業法","t":"8種制限","ref":"R03s-27-3","s":"宅建業者Aが自ら売主として宅建業者でないBに建物を売却する場合、Bの書面による承諾があれば、Aは代金の2割を超える手付を受領することができる。","a":0,"e":"手付は代金の2割が上限で、買主の承諾があっても2割を超えて受領することはできない（39条1項）。","m":"手付は2割まで"},{"f":"業法","t":"広告","ref":"R03s-30-1","s":"宅建業者Aが中古建物の売買の媒介を依頼され、取引態様の別を明示せずに広告したが、問合せがなく契約も成立しなかった場合、Aは宅建業法に違反しない。","a":0,"e":"取引態様の別は広告をする時に明示が必要。問合せや契約の有無にかかわらず34条違反となる。","m":"広告時に取引態様明示"},{"f":"業法","t":"広告","ref":"R03s-30-3","s":"宅建業者Aが、売る意思のない条件の良い物件を広告して客を集める、いわゆるおとり広告をした場合、注文がなく取引が成立しなくても監督処分の対象となる。","a":1,"e":"おとり広告は誇大広告等の禁止（32条）に違反し、取引の成否にかかわらず広告した時点で違反となる。","m":"おとり広告は即違反"},{"f":"業法","t":"広告","ref":"R03s-30-4","s":"宅建業の免許を取り消された者は、取消し前に建物の売買の広告をしていた場合、その広告に係る取引を結了する目的の範囲内で宅建業者とみなされる。","a":0,"e":"みなし業者となるのは、取消し前に締結した契約に基づく取引を結了する範囲内に限られ、広告だけでは対象外。","m":"みなし業者は契約済みのみ"},{"f":"業法","t":"重要事項説明","ref":"R03s-35-2","s":"売買の媒介を行う宅建業者は、売買契約が成立した後に遅滞なく重要事項説明書を交付して説明すれば、宅建業法上の義務を果たしたことになる。","a":0,"e":"重要事項の説明と35条書面の交付は契約が成立するまでに行う必要がある。契約後に交付するのは37条書面。","m":"重説は契約の前"},{"f":"業法","t":"重要事項説明","ref":"R03s-35-3","s":"売買の媒介で交付する重要事項説明書には、説明を行う宅建士が専任の宅建士として記名しなければならず、専任でない宅建士の記名では足りない。","a":0,"e":"35条書面に記名する宅建士は専任である必要はない。押印は2022年の改正で不要になった。","m":"記名は専任でなくてよい"},{"f":"業法","t":"重要事項説明","ref":"R03s-35-4","s":"売買の媒介で買主が宅建業者である場合、重要事項の説明は省略できるが、重要事項説明書の交付（電磁的方法による提供を含む）は省略できない。","a":1,"e":"相手方が宅建業者なら説明は不要だが、35条書面の交付（または電磁的方法による提供）は必要。","m":"業者相手も書面は必要"},{"f":"業法","t":"宅建士","ref":"R03s-37-1","s":"甲県知事の登録を受けた宅地建物取引士が、乙県に所在する宅建業者の事務所の専任の宅建士となる場合、乙県知事への登録の移転を申請しなければならない。","a":0,"e":"登録の移転は任意であり、「申請することができる」にとどまる（法19条の2）。義務ではない。","m":"登録の移転は任意"},{"f":"業法","t":"宅建士","ref":"R03s-37-3","s":"傷害罪により罰金刑に処せられて登録を消除された者は、登録が消除された日から5年を経過すれば、改めて宅建士の登録を受けることができる。","a":0,"e":"再登録できるのは刑の執行を終わり、または執行を受けることがなくなった日から5年経過後。消除の日からではない。","m":"起算は刑の執行終了"},{"f":"業法","t":"保証協会","ref":"R03s-39-1","s":"宅地建物取引業保証協会は、名称、住所または事務所の所在地を変更しようとするときは、あらかじめ国土交通大臣に届け出なければならない。","a":1,"e":"保証協会の名称・住所・事務所所在地の変更は、事前に国土交通大臣へ届け出る必要がある（宅建業法64条の2第3項）。","m":"協会の変更は事前届出"},{"f":"業法","t":"保証協会","ref":"R03s-39-2","s":"保証協会は、宅建業者が新たに社員として加入したとき、または社員がその地位を失ったときは、直ちにその宅建業者の免許権者に報告しなければならない。","a":1,"e":"社員の加入・地位喪失があれば、保証協会は直ちに免許権者へ報告する義務がある（宅建業法64条の4第2項）。","m":"加入も脱退も直ちに報告"},{"f":"業法","t":"保証協会","ref":"R03s-39-4","s":"保証協会から社員の取引に関する苦情の解決のため文書による説明を求められた社員は、正当な理由がなければこれを拒むことができない。","a":1,"e":"保証協会は苦情解決に必要なとき社員に説明・資料提出を求められ、社員は正当な理由なく拒めない（宅建業法64条の5）。","m":"苦情の説明は拒めない"},{"f":"業法","t":"事務所・案内所","ref":"R03s-41-1","s":"一団の宅地建物の分譲のために設置した案内所では、契約の締結も申込みの受付も行わない場合であっても、専任の宅建士を1名以上置かなければならない。","a":0,"e":"専任宅建士が必要なのは契約締結または申込受付を行う案内所。どちらも行わないなら設置義務はない。","m":"契約も申込もなければ不要"},{"f":"業法","t":"事務所・案内所","ref":"R03s-41-2","s":"主たる事務所に置かれていた唯一の専任宅建士が退職した場合、宅建業者は2週間以内に専任宅建士の設置要件を満たす措置をとらなければならない。","a":1,"e":"事務所には業務従事者5人に1人以上の専任宅建士が必要で、欠けたときは2週間以内に補充する（31条の3第3項）。","m":"専任欠けたら2週間"},{"f":"業法","t":"重要事項説明","ref":"R03s-44-ア","s":"建物の貸借の媒介でも、水防法に基づき市町村

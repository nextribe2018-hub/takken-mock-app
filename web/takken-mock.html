ても、Fは免許を受けることができる。","a":0,"e":"現場助勢罪は暴力的犯罪として罰金刑でも欠格事由。法定代理人が欠格者なら未成年者本人も5年間免許を受けられない（宅建業法5条1項6号・11号）。","m":"法定代理人の欠格は本人に及ぶ"},{"f":"業法","t":"免許の基準","ref":"R07-34-エ","s":"K社の政令で定める使用人Jが破産手続開始の決定を受けた後に復権を得た場合、復権を得た日から5年を経過していなくても、K社は他に欠格事由がなければ免許を受けることができる。","a":1,"e":"破産者の欠格は復権を得れば直ちに解消し、5年待つ必要はない（宅建業法5条1項1号）。","m":"破産は復権で即OK"},{"f":"業法","t":"営業保証金","ref":"R07-35-1","s":"保証協会の社員でない宅地建物取引業者Aの免許が有効期間満了により失効した場合、Aが営業保証金を取り戻すには、原則として還付請求権者に対し6か月を下らない一定期間内に申し出るべき旨を公告しなければならない。","a":1,"e":"免許失効・取消し・廃業等による取戻しは、原則として6か月以上の期間を定めた公告が必要（宅建業法30条2項）。","m":"取戻しは6か月以上の公告"},{"f":"業法","t":"営業保証金","ref":"R07-35-3","s":"保証協会の社員でない宅地建物取引業者Aが他の都道府県に支店を新設したときは、その支店の最寄りの供託所に営業保証金を供託し、その旨を免許権者に届け出なければならない。","a":0,"e":"営業保証金は支店増設分も含め、すべて主たる事務所の最寄りの供託所に供託する（宅建業法25条1項・26条）。","m":"供託は本店最寄り"},{"f":"業法","t":"営業保証金","ref":"R07-35-4","s":"保証協会の社員でない宅地建物取引業者Aの支店で宅地建物取引業に関する取引をした者（宅建業者を除く）は、その取引により生じた債権について、支店分の500万円を限度として営業保証金から還付を受けることができる。","a":0,"e":"還付の限度は支店分に限られず、業者が供託している営業保証金の全額。宅建業者は還付を受けられない（宅建業法27条1項）。","m":"還付は供託額全部まで"},{"f":"業法","t":"広告","ref":"R07-38-ア","s":"宅地建物取引業者が広告で取引態様の別を明示していた場合であっても、その広告を見た者から宅地の売買に関する注文を受けたときは、遅滞なく改めて取引態様の別を明らかにしなければならない。","a":1,"e":"取引態様の別は広告時と注文を受けた時の両方で明示が必要。注文時の明示は口頭でもよい（宅建業法34条）。","m":"広告時と注文時の2回"},{"f":"業法","t":"広告","ref":"R07-38-イ","s":"宅地建物取引業者が宅地の形質について実際のものよりも著しく優良であると人を誤認させる広告をした場合、その広告を見て注文した者がおらず取引が成立しなかったときは、監督処分や罰則の対象とならない。","a":0,"e":"誇大広告は表示した時点で違反となり、取引の有無を問わず監督処分・罰則（6月以下の拘禁刑等）の対象（宅建業法32条・65条・81条）。","m":"誇大広告は出した時点で違反"},{"f":"業法","t":"報酬","ref":"R07-38-エ","s":"宅地建物取引業者は、依頼者から依頼を受けずに自らの判断で行った物件の広告であっても、その広告料金に相当する額を、報酬の限度額とは別に依頼者から受け取ることができる。","a":0,"e":"報酬と別に広告料金を受領できるのは、依頼者の依頼による広告の実費に限られる（報酬告示第9）。","m":"広告料は依頼＋実費のみ"},{"f":"業法","t":"クーリング・オフ","ref":"R07-40-ア","s":"宅建業者Aが自ら売主、宅建業者Bの媒介で宅建業者でないCに宅地を売却する場合、CがBの事務所で買受けの申込みをし、3日後に自宅近くの喫茶店で契約を締結したときは、Cはクーリング・オフによる解除ができない。","a":1,"e":"申込みと契約の場所が異なるときは申込みの場所で判断する。媒介業者Bの事務所は事務所等に当たる（宅建業法37条の2、施行規則16条の5）。","m":"申込みの場所で判定"},{"f":"業法","t":"クーリング・オフ","ref":"R07-40-ウ","s":"宅建業者Aが自ら売主となる宅地の売買で、宅建業者でない買主Cが、媒介業者Bの提案によりCの自宅で買受けの申込みをし、クーリング・オフについて告げられないまま10日後にAの事務所で契約した場合、Cは解除できない。","a":0,"e":"自宅は買主が自ら申し出た場合に限り事務所等となる。本件は該当せず、告知もないため8日間は進行しておらず解除できる（宅建業法37条の2）。","m":"業者提案の自宅はCO可"},{"f":"業法","t":"クーリング・オフ","ref":"R07-40-エ","s":"宅建業者Aが自ら売主となり、宅建業者Bが媒介する宅地の売買において、買主にクーリング・オフについて告げる書面には、売主Aの商号又は名称、住所及び免許証番号を記載しなければならないが、媒介業者Bの商号や免許証番号の記載は必要とされない。","a":1,"e":"告知書面に記載が必要なのは売主業者の商号・住所・免許証番号等であり、媒介業者の情報は必要的記載事項ではない（施行規則16条の6）。","m":"告知書面は売主の情報"},{"f":"業法","t":"免許","ref":"R07-41-1","s":"甲県知事の免許を受けた宅地建物取引業者Aが、免許を受けてから1年以内に事業を開始しないときは、甲県知事は、情状にかかわらず、Aの免許を取り消さなければならない。","a":1,"e":"免許後1年以内に事業を開始しない、又は引き続き1年以上事業を休止したときは、免許権者は免許を取り消さなければならない（宅建業法66条1項6号）。","m":"1年開始なしは必要的取消し"},{"f":"業法","t":"免許","ref":"R07-41-3","s":"宅地建物取引業者でない法人Cが、甲県に本店、乙県に支店を有し、乙県の支店でのみ新たに宅地建物取引業を営もうとする場合、Cは乙県知事の免許を受けなければならない。","a":0,"e":"支店で宅建業を営めば本店も事務所となる。事務所が2以上の都道府県にあるため国土交通大臣の免許が必要（宅建業法3条1項）。","m":"支店で営業なら本店も事務所"},{"f":"業法","t":"免許","ref":"R07-41-4","s":"甲県知事の免許を受けた宅地建物取引業者Dが、甲県内の事務所を廃止して乙県内にのみ事務所を設置する場合、Dは甲県知事に廃業の届出をするとともに、乙県知事に免許換えの申請をしなければならない。","a":0,"e":"乙県知事に免許換えを申請すればよく、新免許を受けると旧免許は失効するので廃業の届出は不要（宅建業法7条）。","m":"免許換えに廃業届は不要"},{"f":"業法","t":"宅建士","ref":"R07-42-イ","s":"宅地建物取引士は、勤務先である宅地建物取引業者の商号又は名称に変更があった場合、変更の登録の申請とあわせて、宅地建物取引士証の書換え交付を申請しなければならない。","a":0,"e":"勤務先の商号・名称は変更の登録事項だが、宅建士証の記載事項ではないため書換え交付は不要（宅建業法20条）。","m":"勤務先変更は証の書換え不要"},{"f":"業法","t":"宅建士","ref":"R07-42-ウ","s":"宅地建物取引士は、事務の禁止処分を受けていない場合でも、宅地建物取引士証の有効期間が満了したときは、速やかに、その宅地建物取引士証を交付を受けた都道府県知事に返納しなければならない。","a":1,"e":"登録が消除されたとき又は宅建士証が効力を失ったときは、速やかに交付を受けた知事に返納する（宅建業法22条の2第6項）。","m":"失効したら返納"},{"f":"業法","t":"宅建士","ref":"R07-42-エ","s":"甲県知事の登録を受けている宅地建物取引士が乙県内の事務所に勤務するようになった場合、乙県知事への登録の移転を申請することができるが、申請しなければならないわけではない。","a":1,"e":"登録の移転は他県の事務所に従事する場合に申請できる任意の手続であり、義務ではない（宅建業法19条の2）。","m":"登録の移転は任意"},{"f":"業法","t":"重要事項説明","ref":"R07-43-イ","s":"宅地建物取引業者が建物の貸借を媒介する場合において、その建物が建築工事完了前のものであるときは、完了時の形状・構造について重要事項として説明する必要はなく、売買の場合に限り説明すれば足りる。","a":0,"e":"工事完了前の建物は、貸借でも完了時の主要構造部・内装外装の構造又は仕上げ・設備の設置及び構造を説明する（宅建業法35条1項5号、施行規則16条）。","m":"未完成は貸借でも完成時を説明"},{"f":"業法","t":"重要事項説明","ref":"R07-43-ウ","s":"宅地建物取引業者が建物の貸借を媒介する場合、敷金その他いかなる名義をもって授受されるかを問わず、契約終了時において精算することとされている金銭の精算に関する事項を説明しなければならない。","a":1,"e":"敷金等、名目を問わず契約終了時に精算する金銭の精算に関する事項は、貸借の重要事項である（施行規則16条の4の3）。","m":"敷金精算は貸借の重説"},{"f":"業法","t":"重要事項説明","ref":"R07-43-エ","s":"宅地建物取引業者が宅地の売買を媒介する場合、その宅地が津波防災地域づくりに関する法律の津波防護施設区域内にあるときは、同法による制限の概要を説明しなければならない。","a":1,"e":"津波防護施設区域内では行為に管理者の許可が必要となるため、その制限の概要は法令上の制限として説明事項となる（宅建業法35条1項2号）。","m":"津波防護施設区域も説明"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R07-45-2","s":"宅地建物取引業者が新築住宅の売買の媒介をする場合にも、自ら売主となる場合と同様に、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。","a":0,"e":"資力確保措置の義務を負うのは、自ら売主として宅建業者でない買主に新築住宅を引き渡す宅建業者のみで、媒介業者は負わない（履行法11条）。","m":"資力確保は売主業者だけ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R07-45-3","s":"住宅販売瑕疵担保責任保険契約を締結した宅地建物取引業者は、新築住宅の引渡しから10年間、構造耐力上主要な部分の瑕疵によって生じた損害に限って保険金を請求することができる。","a":0,"e":"保険の対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵の両方であり、前者に限られない（履行法2条）。","m":"構造＋雨水の2つ"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R07-45-4","s":"住宅販売瑕疵担保責任保険契約を締結した宅地建物取引業者及びその新築住宅の買主は、指定住宅紛争処理機関に対し、当該住宅の売買契約に関する紛争のあっせん、調停又は仲裁を申請することができる。","a":1,"e":"保険付き住宅の売主・買主は、指定住宅紛争処理機関の特別住宅紛争処理（あっせん・調停・仲裁）を利用できる（履行法33条）。","m":"保険付きはADRを利用可"},{"f":"税他","t":"土地・建物","ref":"R07-49-1","s":"川沿いの低地に川が運んで堆積した土砂からなる地盤は、締まりがよく地耐力が大きいため、地盤改良などをしなくても、鉄筋コンクリート造の建物など重い構造物を支えるのに適している。","a":0,"e":"低地の新しい堆積地盤は細かい土や有機物を含み軟弱で、圧密沈下等が起きやすい。重い建物には地盤改良や杭が必要。","m":"低地の堆積土は軟弱"},{"f":"税他","t":"土地・建物","ref":"R07-49-2","s":"海岸付近に分布する砂州や砂丘は、粒径のそろった砂で構成されていることが多いため、地下水位が浅い場所では、地震の揺れによって液状化現象が生じやすい地形であるといえる。","a":1,"e":"粒径のそろった砂質土で、地下水で飽和していると液状化が起きやすい。砂州・砂丘はその条件に当てはまりやすい。","m":"そろった砂＋浅い水位＝液状化"},{"f":"税他","t":"土地・建物","ref":"R07-49-4","s":"台地は低地よりも古い時代に形成された地盤であり、一般に土砂が締め固まっていて構造物を支える強度を有するうえ、周囲の低地より高いため水害に対しても比較的安全である。","a":1,"e":"台地・段丘は洪積層で締まっており地耐力があり、周囲の低地より高く浸水しにくいため、一般に宅地に適する。","m":"台地は古くて強い"},{"f":"税他","t":"土地・建物","ref":"R07-50-1","s":"建築物の構造材料として用いられる鋼は、一般に、含まれる炭素量が多くなるほど軟らかく粘り強い性質となり、その一方で引張強さなどの強度は小さくなるという性質をもっている。","a":0,"e":"炭素量が多いほど硬く引張強さは増すが、粘りが減りもろくなる。炭素量が少ないほど軟らかく粘り強い。","m":"炭素多い＝硬くもろい"},{"f":"税他","t":"土地・建物","ref":"R07-50-2","s":"鋼材は強度が高く粘りもある構造材料であるが、高温になると強度が大きく低下し、またさびやすいため、鉄骨造の建物では耐火被覆や塗装・めっき等の防錆処理を施す必要がある。","a":1,"e":"鋼材は高温で強度が大きく低下し、また酸素や水分でさびるため、耐火被覆と防錆処理が必要となる。","m":"鉄骨は火とさびに弱い"},{"f":"税他","t":"土地・建物","ref":"R07-50-4","s":"建築物の構造材料として用いられる鋼材の密度は、木材やコンクリートの密度よりも大きく、同じ体積で比較すると、これら三つの材料の中では鋼材が最も重い材料であるといえる。","a":1,"e":"密度の目安は鋼材約7.85g/cm³、コンクリート約2.3g/cm³、木材約0.5g/cm³で、鋼材が最も大きい。","m":"鋼が一番重い"}];
const LESSON={"業法|免許":{"pts":["自ら当事者として売買・交換、または売買・交換・貸借の代理・媒介を業として行うには免許が必要。自ら貸主・転貸は宅建業に当たらない。","事務所が1つの都道府県内のみなら数に関係なく知事免許、2以上の都道府県に事務所を置くなら国土交通大臣免許。物件所在地は無関係。","免許の有効期間は5年。更新申請は満了日の90日前から30日前まで。満了日までに処分がなければ従前の免許は処分まで効力を有する。","免許権者は免許（更新を含む）に条件を付けられ、条件違反は任意的取消事由。免許は一身専属で、合併・相続によっても承継されない。","廃業等の届出は30日以内。死亡は相続人が死亡を知った日から、合併消滅は消滅法人の代表役員だった者がその日から届け出る。","破産・解散・廃止の届出は破産管財人・清算人・業者本人等。死亡・合併は事実発生時、それ以外は届出時に免許が失効する。","免許失効後も、一般承継人等は締結済み取引を結了する目的の範囲内で宅建業者とみなされる（76条）。"],"traps":["「他県の物件を扱うので大臣免許への免許換えが必要」と出たら×。区分は事務所の所在地だけで決まる。","「相続人は死亡の日から30日以内に届出」と出たら×。正しくは死亡を知った日から30日以内。","「合併後の会社が届出をすれば免許を承継できる」と出たら×。免許は承継されず、新たに免許を受ける必要がある。"],"rel":["業法|免許の基準","業法|監督・罰則","業法|宅建士"],"bridge":"免許は「誰が・どこで営業するか」の入口の手続、免許の基準は「免許を受けられない人」の中身。取消や失効後の処理は監督・罰則とつながる。","sys":{"overview":"宅建業法の入口となる制度。何が宅建業に当たるか、知事免許と大臣免許の区分、有効期間5年と更新、変更・廃業等の届出と失効時期を押さえれば得点できる。","tree":[{"h":"宅建業の定義","items":["宅地＝建物の敷地用の土地＋用途地域内の土地","用途地域内でも道路・公園・河川等は除く","取引＝自ら売買・交換＋売買等の代理・媒介","自ら貸主・転貸は取引に当たらない","業＝不特定多数相手に反復継続して行う"]},{"h":"免許の要否","items":["国・地方公共団体等は免許不要","信託会社・信託銀行は大臣への届出で足りる","業者に代理・媒介を任せても売主は免許必要","無免許・名義貸しは3年以下拘禁刑等"]},{"h":"免許の区分","items":["1都道府県内のみに事務所→その知事免許","2以上の都道府県に事務所→国土交通大臣免許","物件所在地・営業地域は区分に無関係","区分が変われば免許換え（従前免許は失効）","大臣免許の申請は知事を経由しない"]},{"h":"有効期間・更新","items":["有効期間は5年（知事・大臣とも）","更新申請は満了の90日前から30日前まで","処分未了なら従前免許は処分まで有効","更新後の有効期間は従前満了日の翌日から5年","免許・更新に条件を付すことができる"]},{"h":"変更の届出","items":["名簿登載事項の変更は30日以内に届出","商号・名称、事務所の名称・所在地","役員・政令使用人・専任宅建士の氏名","事務所の新設・廃止も変更の届出"]},{"h":"廃業等の届出","items":["届出期限はすべて30日以内","死亡：相続人が知った日から30日以内","死亡・合併は事実発生時に免許失効","破産・解散・廃業は届出時に免許失効","失効後も取引の結了の範囲で業者とみなす"]}],"flow":{"title":"免許取得から更新まで","steps":["事務所の所在から知事か大臣かを判断","免許申請し免許を受ける（有効期間5年）","営業保証金供託か保証協会加入で営業開始","変更があれば30日以内に変更の届出","満了90日前〜30日前に更新申請","処分まで従前免許が存続し更新後5年"]},"tables":[{"title":"取引の当否","head":["行為","自ら","代理・媒介"],"rows":[["売買","○","○"],["交換","○","○"],["貸借","×（自ら貸主）","○"],["転貸","×（自ら転貸）","○"]]},{"title":"廃業等の届出","head":["事由","届出義務者","失効時期"],"rows":[["死亡","相続人（知った日から）","死亡時"],["合併消滅","消滅法人の代表役員","合併時"],["破産","破産管財人","届出時"],["解散","清算人","届出時"],["廃業","本人・代表役員","届出時"]]},{"title":"免許換えの要否","head":["ケース","免許換え"],"rows":[["甲県のみ→甲県内で事務所増設","不要"],["甲県知事→乙県に支店新設","必要（大臣へ）"],["甲県知事→乙県へ全事務所移転","必要（乙県知事へ）"],["大臣→1県のみに縮小","必要（その知事へ）"],["他県の物件を扱うだけ","不要"]]}]}},"業法|免許の基準":{"pts":["拘禁刑以上の刑に処せられ、執行を終わり又は受けなくなった日から5年を経過しない者は欠格。罪の種類は問わない。","罰金刑が欠格となるのは宅建業法違反、傷害・暴行・脅迫等の暴力系の罪、背任罪などに限られ、執行終了等から5年間。","拘留・科料は欠格事由にならない。控訴・上告中で刑が確定していない間も「刑に処せられた」に当たらない。","執行猶予期間中は欠格だが、猶予期間を満了すれば刑の言渡しが効力を失い、5年を待たずに直ちに免許を受けられる。","不正手段による免許取得・業務停止事由で情状が特に重い・業務停止処分違反で免許を取り消された者は取消しの日から5年間欠格。","破産手続開始決定を受けて復権を得ない者、暴力団員等（脱退後5年を経過しない者を含む）、心身の故障で業務を適正に行えない者は欠格。","法人は役員（非常勤・相談役等を含む）や政令で定める使用人（支店長等）に欠格者がいれば免許を受けられない。専任宅建士は審査対象外。"],"traps":["「非常勤の取締役だから会社の免許に影響しない」と出たら×。非常勤でも役員として審査対象になる。","「執行猶予期間が満了しても、その日から5年を経過しないと免許を受けられない」と出たら×。満了で直ちに受けられる。","「所得税法違反の罰金で免許が取り消される」と出たら×。罰金で欠格となる罪は宅建業法違反・暴力系・背任等に限られる。"],"rel":["業法|免許","業法|宅建士","業法|監督・罰則"],"bridge":"宅建士の登録欠格もほぼ同じ構造だが、未成年者の扱いや事務禁止処分中の登録消除など宅建士特有の事由がある。該当すれば監督・罰則の必要的取消につながる。","sys":{"overview":"免許の欠格事由（5条）は宅建士の登録欠格とほぼ共通の土台。刑罰による欠格（拘禁刑以上は罪を問わず、罰金は特定の罪のみ）と5年の起算点、法人役員への波及を押さえれば得点できる。","tree":[{"h":"本人の能力","items":["心身の故障で業務を適正に行えない者","破産者で復権を得ない者（復権で直ちに可）","未成年者は法定代理人が欠格なら不可","成年者と同一の行為能力ある未成年者は可"]},{"h":"刑罰","items":["拘禁刑以上：罪を問わず執行終了等から5年","罰金：業法違反・暴力系・背任のみ5年","暴力系＝傷害・現場助勢・暴行・脅迫等","拘留・科料は欠格事由にならない","上訴中で未確定なら欠格でない","執行猶予中は欠格、満了で直ちに可"]},{"h":"処分歴","items":["不正取得・情状特に重い・業務停止違反で取消","上記取消から5年間は欠格","法人：聴聞公示前60日内の役員も5年","聴聞公示後のかけこみ廃業は届出から5年"]},{"h":"不正・暴力団","items":["申請前5年以内に宅建業で不正等をした者","不正・不誠実な行為をするおそれが明らか","暴力団員・脱退後5年未経過の者","暴力団員等が事業活動を支配する者"]},{"h":"関係者","items":["法人：役員（非常勤・相談役等含む）","法人・個人：政令で定める使用人（支店長等）","専任宅建士は審査対象外","欠格者がいれば法人自体が免許不可"]},{"h":"その他","items":["事務所に専任宅建士の法定数が不足","申請書・添付書類の重要事項の虚偽記載","免許後に該当すれば原則必要的取消"]}],"flow":{"title":"刑罰による欠格の判定","steps":["刑が確定しているか（上訴中なら欠格でない）","刑の種類は拘禁刑以上か罰金か拘留・科料か","拘留・科料なら欠格事由にならない","罰金なら業法違反・暴力系・背任か確認","執行猶予なら猶予中のみ欠格、満了で回復","実刑なら執行終了等から5年経過で回復"]},"tables":[{"title":"刑罰と欠格","head":["刑","罪の種類","欠格期間"],"rows":[["拘禁刑以上","問わない","執行終了等から5年"],["罰金","業法違反","執行終了等から5年"],["罰金","傷害・暴行・脅迫等","執行終了等から5年"],["罰金","背任","執行終了等から5年"],["罰金","暴対法・暴力行為等処罰法","執行終了等から5年"],["罰金","上記以外（所得税法等）","欠格でない"],["拘留・科料","問わない","欠格でない"],["執行猶予付","問わない","猶予中のみ（満了で可）"]]},{"title":"5年待つもの・待たないもの","head":["事由","回復"],"rows":[["破産者の復権","直ちに"],["執行猶予期間の満了","直ちに"],["実刑の執行終了","5年経過後"],["不正取得等による免許取消","取消から5年"],["暴力団員の脱退","脱退から5年"]]},{"title":"法人の審査対象","head":["地位","対象"],"rows":[["代表取締役・取締役","○"],["非常勤役員・相談役等","○"],["政令使用人（支店長）","○"],["専任宅建士","×"],["一般の従業者","×"]]}]}},"業法|宅建士":{"pts":["登録は試験を行った都道府県知事に申請する。住所地や勤務地は関係なく、2年以上の実務経験か国土交通大臣の登録実務講習修了が必要。","登録の移転は他県の業者の事務所に従事する（予定）場合に「できる」任意の手続で、事務禁止処分期間中は申請できない。","氏名・住所・本籍、勤務先業者の商号・名称・免許証番号に変更があれば、専任かどうかを問わず遅滞なく変更の登録を申請する。","宅建士証の有効期間は5年。交付・更新の際は登録先知事が指定する講習（交付申請前6か月以内）を受講する。試験合格後1年以内の交付は講習免除。","宅建士証は取引関係者から請求があれば提示し、重要事項説明の際は請求がなくても提示する。住所欄へのシール貼付や旧姓併記が認められる。","事務禁止処分を受けたら速やかに交付知事へ宅建士証を提出し、効力を失ったら速やかに返納する。違反は10万円以下の過料。","営業に関し成年者と同一の行為能力を有しない未成年者は登録できないが、営業許可等で同一の行為能力があれば登録できる。"],"traps":["「他県の業者の専任宅建士になるには登録の移転をしなければならない」と出たら×。登録の移転は任意。","「専任でない宅建士は勤務先が変わっても変更の登録は不要」と出たら×。勤務先業者は登録事項で専任かを問わない。","「宅建士証の更新では国土交通大臣が指定する講習を受講」と出たら×。登録先の都道府県知事が指定する講習。"],"rel":["業法|免許の基準","業法|事務所・案内所","業法|重要事項説明"],"bridge":"登録欠格は免許の基準と似ているが別制度。宅建士の独占業務は35条の説明と35条・37条書面への記名で、専任宅建士の設置数は事務所・案内所の規制で決まる。","sys":{"overview":"宅建士は試験合格→登録→宅建士証交付の3段階で成立する資格。登録先（試験地の知事）、登録の移転・変更の登録、宅建士証の有効期間5年と講習、提示・提出・返納の区別を押さえれば得点できる。","tree":[{"h":"登録","items":["試験を行った都道府県知事に申請","実務2年以上か登録実務講習の修了が必要","登録は一生有効（消除されない限り）","登録欠格は免許の基準とほぼ同じ","事務禁止中に自ら消除→満了まで再登録不可"]},{"h":"登録の移転","items":["他県の業者の事務所に従事（予定）の場合","移転は任意で義務ではない","事務禁止処分期間中は申請できない","現登録知事を経由して移転先知事へ申請","新宅建士証は従前の残存期間で交付"]},{"h":"変更・死亡等","items":["氏名・住所・本籍の変更は変更の登録","勤務先業者の商号・免許証番号も対象","専任か否かを問わず遅滞なく申請","死亡等の届出は30日以内（相続人は知った日から）"]},{"h":"宅建士証","items":["有効期間5年","交付申請前6か月以内の法定講習を受講","講習は登録先知事が指定","合格後1年以内・移転時の交付は講習免除","旧姓併記・住所欄シール貼付が可能"]},{"h":"提示・提出・返納","items":["関係者の請求があれば提示","重要事項説明時は請求なしで提示","事務禁止処分→交付知事に速やかに提出","失効・登録消除→速やかに返納","提出・返納違反は10万円以下の過料"]},{"h":"独占業務と義務","items":["35条の重要事項説明","35条書面への記名","37条書面への記名","公正誠実・信用失墜行為の禁止","知識・能力の維持向上の努力義務"]}],"flow":{"title":"合格から宅建士証の更新","steps":["試験合格（合格は一生有効）","試験地の知事に登録申請（実務2年等）","登録を受ける（宅建士証はまだない）","法定講習を受け宅建士証交付（1年内は免除）","宅建士証の有効期間は5年","更新前6か月以内に法定講習を受け更新"]},"tables":[{"title":"提示・提出・返納","head":["場面","行為","相手"],"rows":[["関係者から請求","提示","請求者"],["重要事項説明","提示（請求不要）","相手方"],["事務禁止処分","提出","交付知事"],["禁止期間満了","返還請求で返還","交付知事"],["失効・登録消除","返納","交付知事"]]},{"title":"登録の移転と変更の登録","head":["項目","登録の移転","変更の登録"],"rows":[["性質","任意（できる）","義務"],["きっかけ","他県業者の事務所に従事","登録事項の変更"],["申請先","移転先知事（経由）","登録先知事"],["期限","定めなし","遅滞なく"],["事務禁止中","不可","可"]]},{"title":"講習の要否","head":["場面","法定講習"],"rows":[["合格後1年以内の交付","不要"],["合格後1年超の交付","必要"],["有効期間の更新","必要"],["登録の移転に伴う交付","不要"]]}]}},"業法|営業保証金":{"pts":["主たる事務所1,000万円、従たる事務所1か所ごとに500万円を、全事務所分まとめて主たる事務所の最寄りの供託所に供託する。","金銭のほか有価証券も可。評価額は国債100%、地方債・政府保証債90%、その他の有価証券80%。","供託後、供託書の写しを添付して免許権者に届け出た後でなければ事業を開始できない。新設事務所分も供託・届出後に業務開始。","免許後3か月以内に届出がなければ免許権者は催告しなければならず、催告到達から1か月以内に届出がなければ免許を取り消せる。","主たる事務所移転で供託所が変わったとき、金銭のみなら保管替えを請求し、有価証券を含むなら新たに供託する（二重供託後に取戻し）。","還付を受けられるのは業者と宅建業の取引をした者で宅建業者を除く。還付で不足したら通知を受けた日から2週間以内に不足額を供託する。","取戻しには6か月以上の公告が必要（一部の事務所廃止も同じ）。保証協会加入時・保管替え時・取戻し事由発生から10年経過時は公告不要。"],"traps":["「国債は額面の90%、地方債は80%で評価」と出たら×。国債100%、地方債90%、その他80%。","「免許失効による取戻しの公告期間は3か月」と出たら×。還付請求権者への公告は6か月を下らない期間が必要。","「金銭のみで供託していても移転先の供託所に新たに供託し直す」と出たら×。金銭のみなら保管替えの請求。"],"rel":["業法|保証協会","業法|住宅瑕疵担保履行法","業法|免許"],"bridge":"保証協会は営業保証金に代わる制度で、分担金は60万・30万と小さく金銭のみ。還付の限度額は営業保証金相当額で同じだが、公告や期限の細部が異なる。","sys":{"overview":"取引相手の損害を担保する業者自身の供託制度。供託額（本店1,000万円・支店500万円）、有価証券の評価割合、供託→届出→営業開始の順序、還付・不足額供託・取戻し（6か月公告）の期限を押さえれば得点できる。","tree":[{"h":"供託","items":["主たる事務所1,000万円","従たる事務所1か所ごとに500万円","主たる事務所の最寄りの供託所に一括供託","金銭・有価証券（国債100%等）で可"]},{"h":"営業開始","items":["供託後、供託書の写しを添えて免許権者に届出","届出後でなければ事業開始できない","事務所新設時も供託・届出後に業務開始","免許後3か月届出なし→催告","催告到達後1か月届出なし→取消できる"]},{"h":"保管替え等","items":["主たる事務所移転で最寄り供託所が変わる場合","金銭のみ→保管替えを請求","有価証券を含む→新たに供託し旧分を取戻し","移転後遅滞なく供託"]},{"h":"還付","items":["業者と宅建業の取引をした者が対象","宅建業者は還付を受けられない","上限は供託した営業保証金の額","不足通知から2週間以内に不足額供託","供託から2週間以内に免許権者へ届出"]},{"h":"取戻し","items":["免許失効・取消、一部事務所廃止など","原則6か月以上の公告が必要","保管替え・保証協会加入時は公告不要","取戻し事由発生から10年経過で公告不要"]}],"flow":{"title":"供託から還付・補充まで","steps":["主たる事務所最寄りの供託所に供託","供託書の写しを添えて免許権者に届出","届出後に事業開始（3か月で催告）","取引相手が供託所に還付請求","免許権者から不足額供託の通知","通知受領から2週間以内に不足額を供託","供託から2週間以内に免許権者へ届出"]},"tables":[{"title":"有価証券の評価額","head":["種類","評価"],"rows":[["金銭","100%"],["国債証券","額面の100%"],["地方債・政府保証債","額面の90%"],["その他の有価証券","額面の80%"]]},{"title":"取戻しの公告","head":["取戻し事由","公告"],"rows":[["免許失効・取消","必要（6か月以上）"],["一部の事務所廃止","必要（6か月以上）"],["保証協会の社員となった","不要"],["保管替え後の旧供託所分","不要"],["事由発生から10年経過","不要"]]},{"title":"供託額の計算例","head":["事務所","供託額"],"rows":[["本店のみ","1,000万円"],["本店＋支店1","1,500万円"],["本店＋支店2","2,000万円"],["本店＋支店5","3,500万円"]]}]}},"業法|保証協会":{"pts":["弁済業務保証金分担金は主たる事務所60万円、その他の事務所1か所につき30万円で、金銭のみ。加入しようとする日までに納付する。","加入後に事務所を新設したときは、その日から2週間以内に追加の分担金を納付する。怠ると社員の地位を失う。","保証協会は分担金の受領日から1週間以内に、同額の弁済業務保証金を法務大臣及び国土交通大臣が定める供託所に供託する。","還付の限度額は、その社員が社員でなければ供託すべき営業保証金相当額。社員となる前に取引した者（宅建業者を除く）も対象。","還付を受けるには保証協会の認証が必要で、認証事務は認証申出書の受理の順序に従って処理する。","還付後、保証協会は大臣の通知から2週間以内に還付額を供託し、社員は協会の通知から2週間以内に還付充当金を納付する。","社員の地位を失ったら1週間以内に営業保証金を供託する。分担金返還の公告（6か月以上）は社員の地位を失った場合のみで、一部事務所廃止なら不要。"],"traps":["「分担金を国債証券で納付できる」と出たら×。分担金は金銭のみ（協会が供託する弁済業務保証金は有価証券も可）。","「分担金は加入した日から1週間以内に納付」と出たら×。加入しようとする日までに納付する。","「納付した弁済業務保証金の額の範囲内で弁済を受けられる」と出たら×。限度は営業保証金相当額。"],"rel":["業法|営業保証金","業法|監督・罰則","業法|住宅瑕疵担保履行法"],"bridge":"営業保証金は業者自身が主たる事務所最寄りに供託、保証協会は協会が供託し業者は分担金を納める。期限は「2週間」と「1週間」が入り混じるので主体ごとに整理する。","sys":{"overview":"営業保証金に代わる弁済制度。分担金（本店60万円・支店30万円、金銭のみ）の納付時期、協会の1週間以内供託、還付の認証と限度額、還付充当金の2週間、社員地位喪失後の1週間を主体別に整理すれば得点できる。","tree":[{"h":"保証協会","items":["国土交通大臣が指定する一般社団法人","宅建業者のみが社員","業者は1つの協会の社員にしかなれない","社員加入時は協会が免許権者に報告"]},{"h":"業務","items":["必須：苦情の解決","必須：研修","必須：弁済業務","任意：一般保証・手付金等保管・研修費助成","その他必要な業務は大臣の承認が必要"]},{"h":"分担金","items":["主たる事務所60万円","その他の事務所1か所30万円","金銭のみ（有価証券不可）","加入しようとする日までに納付","事務所新設は2週間以内に追加納付"]},{"h":"弁済業務保証金","items":["協会が分担金受領から1週間以内に供託","供託先は法務大臣及び国交大臣が定める供託所","協会の供託は有価証券も可","社員加入で営業保証金は公告なく取戻し可"]},{"h":"還付","items":["社員加入前の取引も対象","宅建業者は対象外","限度は営業保証金相当額","保証協会の認証が必要（受理順に処理）","協会は通知から2週間以内に還付額を供託"]},{"h":"社員の地位喪失","items":["還付充当金は通知から2週間以内","未納付なら社員の地位を失う","喪失から1週間以内に営業保証金を供託","分担金返還は6か月以上の公告後","一部事務所廃止の返還は公告不要"]}],"flow":{"title":"還付から補充まで","steps":["取引相手が保証協会に認証を申し出る","協会が認証（申出書の受理順）","供託所に還付請求し還付を受ける","大臣の通知から2週間以内に協会が供託","協会が社員に還付充当金納付を通知","社員は通知から2週間以内に納付","未納付なら地位喪失→1週間以内に営業保証金"]},"tables":[{"title":"営業保証金と保証協会","head":["項目","営業保証金","保証協会"],"rows":[["額（本店）","1,000万円","60万円"],["額（支店1か所）","500万円","30万円"],["納付方法","金銭・有価証券","金銭のみ"],["供託・納付先","最寄りの供託所","保証協会"],["事務所新設","供託・届出後開始","2週間以内に納付"],["還付の認証","不要","必要"],["還付限度","供託額","営業保証金相当額"]]},{"title":"期限の整理","head":["主体","場面","期限"],"rows":[["業者","加入時の分担金","加入しようとする日まで"],["業者","事務所新設の追加分","2週間以内"],["協会","分担金受領後の供託","1週間以内"],["協会","還付後の補充供託","通知から2週間以内"],["業者","還付充当金","通知から2週間以内"],["業者","地位喪失後の営業保証金","1週間以内"]]},{"title":"還付限度額の計算例","head":["事務所","分担金","還付限度"],"rows":[["本店のみ","60万円","1,000万円"],["本店＋支店1","90万円","1,500万円"],["本店＋支店3","150万円","2,500万円"]]}]}},"業法|事務所・案内所":{"pts":["事務所とは本店・支店・継続的に業務を行い契約締結権限を持つ使用人を置く場所。本店は常に事務所、支店は宅建業を営む場合のみ。登記の有無は無関係。","事務所ごとに業務従事者5人に1人以上の成年の専任宅建士を置く。契約行為等を行う案内所等は1人以上。不足は2週間以内に補充等の措置。","事務所には標識・報酬額の掲示、帳簿・従業者名簿の備付けが必要。案内所等には標識のみ必要で、報酬額の掲示は不要。","帳簿は事業年度末に閉鎖し閉鎖後5年間（自ら売主の新築住宅は10年間）、従業者名簿は最終記載日から10年間保存する。電子保存も可。","契約行為等（申込み受付を含む）を行う案内所等は、業務開始の10日前までに免許権者と所在地の知事の双方に届け出る。","業者本人や法人の役員が宅建士であれば、主として業務に従事する事務所等で成年者である専任宅建士とみなされる（未成年でも可）。","全従業者に従業者証明書を携帯させなければならず、宅建士証で代用することはできない。取引関係者の請求があれば提示する。"],"traps":["「事務所に免許証を掲示しなければならない」と出たら×。掲示義務は標識と報酬額で、免許証はない。","「専任宅建士の不足は30日以内に補充すれば足りる」と出たら×。不足したら2週間以内に補充等の措置を執る。","「契約をしない案内所には標識不要」と出たら×。標識はすべての案内所等に必要、不要なのは専任宅建士と届出。"],"rel":["業法|宅建士","業法|クーリング・オフ","業法|免許"],"bridge":"専任宅建士を置く「契約行為等を行う案内所」は、クーリング・オフの「事務所等」と重なる。テント張りの案内所など土地に定着しない場所は事務所等に当たらない点も比較される。","sys":{"overview":"業者の営業拠点ごとの設置義務の論点。事務所の定義、専任宅建士の数（5人に1人・案内所1人）、標識・報酬額掲示・帳簿・名簿の区別、案内所の10日前届出を表で整理すれば得点できる。","tree":[{"h":"事務所","items":["本店は常に事務所（支店のみで営業しても）","支店は宅建業を営む場合のみ事務所","継続的業務の場所で契約権限者を置く所","登記の有無は無関係"]},{"h":"案内所等","items":["継続的業務を行う事務所以外の場所","一団の宅地建物の分譲の案内所","他業者の分譲の代理・媒介の案内所","展示会その他の催しの会場"]},{"h":"専任宅建士","items":["事務所：業務従事者5人に1人以上","契約行為等の案内所等：1人以上","成年者であることが必要","業者本人・役員の宅建士は成年者とみなす","不足は2週間以内に補充等の措置"]},{"h":"備付け・掲示","items":["標識：事務所・すべての案内所等","報酬額の掲示：事務所のみ","帳簿：事務所ごと、閉鎖後5年（新築自ら売主10年）","従業者名簿：最終記載から10年","電子的な保存も可","事務所の標識は専任宅建士の数を表示"]},{"h":"案内所の届出","items":["契約行為等（申込み受付含む）を行う場合","業務開始の10日前まで","免許権者と所在地の知事の双方","契約行為等をしなければ届出不要","大臣宛ても知事を経由せず直接提出"]},{"h":"従業者証明書","items":["全従業者に携帯させる","宅建士証では代用できない","関係者の請求があれば提示","役員・非常勤も対象"]}],"flow":{"title":"案内所を設けるときの判定","steps":["その場所で契約・申込み受付をするか","しないなら標識の掲示のみで足りる","するなら成年の専任宅建士を1人以上置く","業務開始10日前までに双方の知事等へ届出","標識を掲示（報酬額の掲示は不要）","業務開始後も従業者証明書を携帯させる"]},"tables":[{"title":"場所ごとの義務","head":["義務","事務所","案内所(契約等)","案内所(契約なし)"],"rows":[["標識","○","○","○"],["報酬額の掲示","○","×","×"],["帳簿","○","×","×"],["従業者名簿","○","×","×"],["専任宅建士","5人に1人","1人以上","×"],["50条2項届出","×（変更届）","10日前","×"]]},{"title":"保存期間","head":["書類","保存期間","起算"],"rows":[["帳簿","5年","各事業年度末の閉鎖後"],["帳簿（新築住宅を自ら売主）","10年","閉鎖後"],["従業者名簿","10年","最終の記載をした日"]]},{"title":"よくあるひっかけ","head":["記述","正誤"],"rows":[["免許証を掲示する","×（標識と報酬額）"],["専任宅建士の補充は30日以内","×（2週間以内）"],["案内所届出は所在地知事のみ","×（免許権者にも）"],["宅建士証で従業者証明書を代用","×"],["未登記の支店は事務所でない","×"]]}]}},"業法|業務上の規制":{"pts":["勧誘に先立ち、業者の商号・名称、勧誘者の氏名、契約締結の勧誘目的である旨を告げなければならない。","相手方が契約を締結しない意思を示した後の再勧誘は禁止。担当者を替えても同じ。迷惑を覚える時間の電話・訪問も禁止。","手付の貸付け・分割受領・後払いなどの信用供与による契約誘引は禁止され、契約が成立しなくても誘引した時点で違反。","正当な理由なく判断に必要な時間を与えることを拒むこと、申込み撤回時に受領済みの預り金の返還を拒むことは禁止。","業者・従業者は正当な理由なく業務上知り得た秘密を漏らしてはならず、廃業後・退職後も続く。本人の承諾や裁判での証言は正当な理由。","宅建業法上の割賦販売は、引渡し後1年以上の期間にわたり2回以上に分割して代金を受領することを条件とする販売をいう。","宅地建物の売買及びその代理・媒介は犯罪収益移転防止法の特定取引で、取引時確認や記録の保存が必要。"],"traps":["「勧誘前に自分の氏名を告げれば商号は告げなくてよい」と出たら×。商号・氏名・目的のすべてを告げる。","「契約が成立しなかったので手付貸付けの申出は違反でない」と出たら×。誘引行為自体が違反。","「依頼者の承諾があっても秘密を漏らせない」と出たら×。本人の承諾は正当な理由に当たる。"],"rel":["業法|広告","業法|8種制限","業法|監督・罰則"],"bridge":"手付の貸付けは禁止だが手付の減額は信用供与に当たらず可。手付の額の上限や性質は8種制限で規律され、違反の重さは監督・罰則で問われる。","sys":{"overview":"業法の行為規制のうち勧誘・契約誘引・守秘に関する禁止事項。宅建業者間でも適用される点、手付の信用供与禁止（減額は可）、再勧誘・威迫・時間不付与の禁止、守秘義務の継続と正当理由を押さえれば得点できる。","tree":[{"h":"基本原則","items":["信義を旨とし誠実に業務を行う","従業者への教育の努力義務","業務に関し不当な履行遅延の禁止","業者間取引にも適用（8種制限と異なる）"]},{"h":"勧誘時の規制","items":["商号・勧誘者氏名・勧誘目的を事前に告知","断る意思表示後の再勧誘禁止","担当者を替えても再勧誘は違反","迷惑な時間の電話・訪問の禁止","威迫・断定的判断の提供の禁止"]},{"h":"契約誘引","items":["重要事項の故意の不告知・不実告知禁止","手付の貸付け・分割・後払いは禁止","契約不成立でも誘引時点で違反","手付の減額は信用供与に当たらない","不当に高額の報酬要求の禁止"]},{"h":"契約前後","items":["判断に必要な時間を与えない行為の禁止","撤回時の預り金返還拒否の禁止","手付放棄による解除の不当拒否の禁止","供託所等の説明は契約成立前（業者相手不要）"]},{"h":"守秘義務","items":["業者・従業者とも正当理由なく漏洩禁止","廃業後・退職後も継続","本人の承諾は正当な理由","裁判での証言も正当な理由"]},{"h":"その他","items":["割賦販売：引渡し後1年以上・2回以上分割","売買とその代理・媒介は犯収法の特定取引","特定取引では取引時確認・記録保存","確認記録・取引記録は7年保存"]}],"flow":{"title":"勧誘から契約までの規制","steps":["勧誘前に商号・氏名・目的を告げる","迷惑な時間・威迫・断定的判断をしない","断られたら担当を替えても再勧誘しない","重要事項を偽らず、手付で信用供与しない","判断に必要な時間を与える","撤回されたら預り金を返還する"]},"tables":[{"title":"手付をめぐる行為","head":["行為","可否"],"rows":[["手付の貸付け","×"],["手付の分割受領","×"],["手付の後払い","×"],["手付の減額","○"],["銀行ローンのあっせん","○"]]},{"title":"守秘義務の正当な理由","head":["場面","漏らしてよいか"],"rows":[["本人の承諾","○"],["裁判での証人として証言","○"],["税務署等の法令に基づく調査","○"],["廃業・退職後に他人へ話す","×"],["同業者に参考として話す","×"]]},{"title":"勧誘時の禁止と許容","head":["行為","可否"],"rows":[["商号を告げず氏名のみ","×"],["断られた翌日に再度電話","×"],["担当者を替えて再勧誘","×"],["「必ず値上がり」と断定","×"],["深夜の電話勧誘","×"]]}]}},"業法|広告":{"pts":["未完成物件は開発許可・建築確認等の処分があった後でなければ広告できない。この広告開始時期の制限は売買だけでなく貸借にも及ぶ。","契約締結時期の制限（処分前の売買・交換の契約禁止）は貸借には適用されない。広告と契約で範囲が異なる。","確認後に変更確認を申請中なら、変更予定である旨と当初の確認内容を併記すれば広告できる。確認申請中の表示では広告できない。","所在・規模・形質、利用の制限、環境・交通、代金・借賃、代金の融資等について、著しく事実に相違する表示や誤認させる表示は禁止。","誇大広告は広告した時点で違反で、取引成立や問合せの有無は問わない。成約済み物件の掲載継続もおとり広告として違反。","誇大広告等は監督処分の対象で、6か月以下の拘禁刑又は100万円以下の罰金（併科あり）が科され得る。","取引態様の別は広告のたびに明示し、注文を受けたときにも改めて遅滞なく明示する。自ら貸主の募集広告は業法の規制外。"],"traps":["「建築確認申請中と明示すれば広告できる」と出たら×。確認を受けるまで広告できない。","「確認前でも貸借の媒介の広告はできる」と出たら×。広告開始時期の制限は貸借にも及ぶ。","「問合せや申込みがなければ誇大広告でも違反でない」と出たら×。広告をした時点で違反が成立する。"],"rel":["税他|景品表示法","業法|報酬","業法|監督・罰則"],"bridge":"広告の表示ルールは景品表示法・公正競争規約でも細かく規制される。依頼者の依頼による広告料金は報酬とは別に受領できる点は報酬の論点で問われる。","sys":{"overview":"業法の広告規制は、誇大広告等の禁止、広告開始時期の制限、取引態様の明示の3本柱。開始時期制限は貸借にも及ぶが契約締結時期制限は及ばない点、違反は広告した時点で成立する点を押さえれば得点できる。","tree":[{"h":"誇大広告等","items":["著しく事実と相違・誤認させる表示の禁止","所在・規模・形質","現在・将来の利用の制限","環境・交通その他の利便","代金・借賃と金銭貸借のあっせん"]},{"h":"違反の成立","items":["広告した時点で違反成立","問合せ・取引成立の有無は不問","成約済み物件の掲載継続はおとり広告","表示しないことによる誤認も違反","監督処分＋6か月以下拘禁刑等の罰則"]},{"h":"開始時期制限","items":["工事完了前は処分後でなければ広告不可","処分＝開発許可・建築確認等","売買・交換・貸借すべてに適用","確認申請中の表示があっても不可","変更確認申請中は当初内容等の併記で可"]},{"h":"契約時期制限","items":["工事完了前は処分後でなければ契約不可","売買・交換（代理・媒介含む）に適用","貸借には適用されない","予約も契約と同じく制限"]},{"h":"取引態様の明示","items":["自ら当事者・代理・媒介の別","広告をするたびに明示","注文を受けたときも遅滞なく明示","口頭でも可、業者相手でも必要","自ら貸主・転貸の広告は業法の対象外"]},{"h":"広告料金","items":["報酬と別の受領は原則不可","依頼者の依頼による広告の実費は可","依頼がなければ受領できない"]}],"flow":{"title":"広告を出す前の確認","steps":["自ら貸主・転貸なら業法の広告規制外","工事完了前か確認","完了前なら開発許可・建築確認等を受けたか","変更確認申請中なら当初内容と予定を併記","取引態様の別を明示","表示内容に誤認のおそれがないか確認"]},"tables":[{"title":"時期制限の適用範囲","head":["取引","広告開始時期","契約締結時期"],"rows":[["売買","○制限","○制限"],["交換","○制限","○制限"],["貸借","○制限","×制限なし"],["代理・媒介","○制限","○（貸借除く）"]]},{"title":"広告できるか","head":["状態","広告"],"rows":[["建築確認申請中","×"],["「確認申請済」と表示","×"],["建築確認後","○"],["確認後に変更確認申請中","○（併記すれば）"],["開発許可申請中","×"]]},{"title":"誇大広告の判定","head":["ケース","違反"],"rows":[["問合せがない","○違反"],["取引が成立しなかった","○違反"],["成約済み物件を掲載継続","○違反"],["利用制限の一部を省き誤認","○違反"],["ネット広告","○違反（媒体不問）"]]}]}},"業法|媒介契約":{"pts":["34条の2の規制は宅地建物の売買・交換の媒介・代理に適用され、貸借の媒介には適用されない。相手が宅建業者でも書面交付は必要。","契約後遅滞なく業者が記名押印した書面を交付する（依頼者の承諾で電磁的方法も可）。宅建士の記名は不要。","専任・専属専任の有効期間は3か月以内で、超える定めは3か月に短縮。更新は依頼者の申出による場合のみで、自動更新特約は無効。","業務処理状況の報告は専任が2週間に1回以上、専属専任が1週間に1回以上（休業日を含む）。方法は口頭でもよい。","指定流通機構への登録は専任が契約日から7日以内、専属専任が5日以内（いずれも休業日を除く）。登録証明書は遅滞なく依頼者に引き渡す。","申込みがあれば種類を問わず遅滞なく依頼者に報告する。価額に意見を述べるときは根拠を示す（方法自由・費用請求不可）。","書面には売買すべき価額、既存建物の建物状況調査を実施する者のあっせんに関する事項（あっせん無しでもその旨）等を記載する。"],"traps":["「専任媒介の登録期限は休業日を含めて7日以内」と出たら×。休業日を除いて7日以内。","「一般媒介なら書面に売買すべき価額の記載は不要」と出たら×。価額は全媒介契約の必要的記載事項。","「依頼者の申出がなければ自動更新する特約は有効」と出たら×。更新は依頼者の申出がある場合に限る。"],"rel":["業法|報酬","業法|重要事項説明","業法|37条書面"],"bridge":"媒介契約書は業者の記名押印で依頼者（売主側が多い）に交付、35条書面と37条書面は宅建士の記名が必要。誰が何に記名し誰に交付するかで混同しやすい。","sys":{"overview":"宅建業者の業務規制のうち、売買・交換の媒介・代理の依頼を受けた場面のルール。3種類の媒介契約の違い（有効期間・報告・指定流通機構登録）と、媒介契約書面の記載事項を数字ごと押さえれば得点源になる。","tree":[{"h":"適用範囲","items":["宅地建物の売買・交換の媒介・代理","貸借の媒介・代理には適用なし","依頼者が宅建業者でも適用あり"]},{"h":"契約の種類","items":["一般：複数業者に重ねて依頼可","専任：他業者への依頼不可・自己発見可","専属専任：自己発見取引も不可","一般は明示型・非明示型がある"]},{"h":"専任系の規制","items":["有効期間3か月以内（超過分は3か月に）","更新は依頼者の申出時のみ・自動更新不可","報告：専任2週1回・専属1週1回以上","機構登録：専任7日・専属5日（休業日除く）","申込み受付状況も登録し変更時は更新"]},{"h":"全類型の義務","items":["契約後遅滞なく書面交付（業者が記名押印）","依頼者の承諾で電磁的方法も可","価額の意見には根拠明示（費用請求不可）","申込みは遅滞なく依頼者へ報告"]},{"h":"書面記載事項","items":["物件特定・売買すべき価額・報酬","媒介契約の種類・有効期間・解除","建物状況調査のあっせんの有無（既存建物）","標準媒介契約約款に基づくか否か","依頼者の違反時の措置・機構登録事項"]}],"flow":{"title":"専任媒介の手続の流れ","steps":["依頼受付・価額に意見なら根拠を明示","媒介契約締結→遅滞なく書面交付","指定流通機構へ登録（専任7日・専属5日）","登録証明書を遅滞なく依頼者へ引渡し","業務処理状況を定期報告（2週・1週）","申込みがあれば遅滞なく依頼者へ報告","成約したら遅滞なく機構へ通知"]},"tables":[{"title":"媒介契約3類型の比較","head":["項目","一般","専任","専属専任"],"rows":[["他業者への重ねた依頼","○","×","×"],["自己発見取引","○","○","×"],["有効期間の制限","なし","3か月以内","3か月以内"],["業務処理状況の報告","義務なし","2週に1回以上","1週に1回以上"],["機構への登録","任意","7日以内","5日以内"],["申込みの報告","必要","必要","必要"],["書面の交付","必要","必要","必要"]]},{"title":"日数の数え方","head":["義務","期間","休業日"],"rows":[["機構登録（専任）","契約日から7日以内","除く"],["機構登録（専属専任）","契約日から5日以内","除く"],["業務報告（専任）","2週間に1回以上","含む"],["業務報告（専属専任）","1週間に1回以上","含む"]]}]}},"業法|重要事項説明":{"pts":["契約成立までに、宅建士が宅建士証を提示（請求不要）のうえ記名した35条書面を交付して、買主・借主等に説明する。売主・貸主への説明は不要。","相手方が宅建業者なら書面交付のみで説明は不要。相手方の承諾があれば電磁的方法での提供やIT重説も可だが、宅建士証の提示は省略できない。","既存建物では1年以内（共同住宅等は2年以内）の建物状況調査の有無と結果の概要を、売買・貸借とも説明する。","建築・維持保全の書類（検査済証・設計図書等）の保存状況は既存建物の売買・交換のみ説明。存在しなければその旨を説明する。","水害ハザードマップ上の所在地、造成宅地防災区域・土砂災害警戒区域・津波災害警戒区域内である旨は、売買・貸借を問わず説明する。","石綿調査の記録があればその内容、旧耐震（昭和56年5月31日以前着工）の耐震診断があればその内容を説明。業者に調査義務はない。","登記された権利（抹消予定でも）、代金以外の金銭の額と目的、契約解除、損害賠償予定・違約金、手付金等保全措置、担保責任の履行確保措置等を説明。"],"traps":["「代金の額・支払時期」「引渡しの時期」を重要事項として説明と出たら×。これらは37条書面の記載事項。","「IT重説なら相手方の承諾で宅建士証の提示を省略できる」と出たら×。画面上で視認できるよう提示が必要。","「水害ハザードマップの説明は貸借では不要」と出たら×。売買・交換・貸借いずれも必要。"],"rel":["業法|37条書面","業法|宅建士","業法|住宅瑕疵担保履行法"],"bridge":"35条は契約前に買主・借主へ説明（宅建士必須）、37条は契約後に両当事者へ交付（説明不要）。記載事項の振り分けが頻出で、引渡し時期・代金は37条側。","sys":{"overview":"宅建業法35条。契約成立前に、宅建士が買主・借主等へ書面を交付して説明する義務で、業法で最頻出の論点。説明の方法（誰が・誰に・いつ）と、売買／貸借・区分所有建物ごとの説明事項の振り分けが得点の鍵。","tree":[{"h":"説明の方法","items":["契約成立までに宅建士が説明（専任不要）","宅建士証は請求なしで提示・記名した書面","相手：買主・借主・交換の両当事者","売主・貸主への説明は不要","場所の制限なし"]},{"h":"特例","items":["相手方が業者なら書面交付のみで説明不要","承諾があれば書面を電磁的方法で提供可","IT重説も可。画面で宅建士証の提示必要"]},{"h":"物件の事項","items":["登記された権利（抹消予定でも）","法令上の制限・私道負担","飲用水・電気・ガス・排水の整備状況","未完成物件は完了時の形状・構造","災害区域・水害ハザードマップ上の所在地"]},{"h":"既存建物","items":["建物状況調査の有無・結果概要","調査は1年以内（RC共同住宅等は2年）","建築・維持保全書類の保存状況（売買のみ）","石綿調査の記録があればその内容","耐震診断はS56.6.1前着工の建物のみ"]},{"h":"取引条件","items":["代金・借賃以外の金銭の額と目的","契約解除・損害賠償予定・違約金","手付金等保全措置・支払金預り金保全","ローンのあっせん内容と不成立時の措置","担保責任の履行確保措置の有無"]},{"h":"区分・貸借","items":["区分：敷地権利・共用部分規約・積立金等","区分売買：管理業者が管理者を兼ねる旨","貸借：期間・更新・用途制限・敷金精算","貸借：管理委託先、建物は台所等の設備","定期借地・定期建物賃貸借である旨"]}],"flow":null,"tables":[{"title":"35条と37条の比較","head":["項目","35条書面","37条書面"],"rows":[["時期","契約成立まで","契約成立後遅滞なく"],["相手","買主・借主等","契約当事者双方"],["宅建士の記名","必要","必要"],["宅建士の説明","必要（業者相手は不要）","不要"],["宅建士証の提示","説明時に必要","不要"],["電磁的方法","承諾で可","承諾で可"],["代金額・引渡し時期","記載不要","必要的記載事項"]]},{"title":"取引態様別の説明要否","head":["説明事項","売買","貸借"],"rows":[["登記された権利","○","○"],["私道負担","○","建物貸借は×"],["建物状況調査の結果概要","○（既存）","○（既存）"],["建築・維持保全書類の保存","○（既存）","×"],["水害ハザードマップの所在地","○","○"],["石綿調査記録・耐震診断","建物のみ○","建物のみ○"],["手付金等保全措置","○","×"],["担保責任の履行確保措置","○","×"],["契約期間・更新・敷金精算","×","○"]]},{"title":"区分所有建物の追加事項","head":["説明事項","売買","貸借"],"rows":[["敷地に関する権利","○","×"],["共用部分の規約","○","×"],["専有部分の用途・利用制限","○","○"],["専用使用権の規約","○","×"],["修繕積立金・管理費","○","×"],["維持修繕の実施状況の記録","○","×"],["管理の委託先","○","○"],["管理業者が管理者等を兼ねる旨","○","×"]]}]}},"業法|37条書面":{"pts":["契約成立後遅滞なく、契約当事者双方（自ら当事者なら相手方）に交付する。関与した業者全員に交付義務があり、相手方の承諾でも省略不可。","宅建士の記名が必要（専任でなくてよい、押印は不要）。説明義務はなく、交付は宅建士でない従業者でもよい。","相手方が宅建業者でも交付・宅建士の記名・必要的記載事項は省略できない。相手方の承諾があれば電磁的方法での提供も可。","必要的記載事項は当事者の氏名・住所、物件特定表示、代金・借賃の額と支払時期・方法、引渡し時期、売買では移転登記の申請時期など。","既存建物の売買・交換では、構造耐力上主要な部分等の状況について当事者双方が確認した事項が必要的記載事項（貸借は不要）。","任意的記載事項（解除、損害賠償予定・違約金、代金等以外の金銭、危険負担、担保責任特約、租税公課の負担等）は定めがあれば記載。","代金等以外の金銭は額・授受の時期・目的のすべてを記載する。未完成建物は重説で使用した図書の交付で特定表示に代えられる。"],"traps":["「37条書面は宅建士に内容を説明させなければならない」と出たら×。記名は必要だが説明義務はない。","「定めがなければ『定めなし』と記載する」と出たら×。任意的記載事項は定めがなければ記載不要。","「登記された抵当権の内容を37条書面に記載」と出たら×。登記された権利は35条書面の説明事項。"],"rel":["業法|重要事項説明","業法|媒介契約","業法|クーリング・オフ"],"bridge":"35条は契約前に説明、37条は契約後に交付で説明不要。クーリング・オフの告知書面は宅建士の記名不要で、書面ごとに記名の主体と要否を比較して覚える。","sys":{"overview":"宅建業法37条。契約成立後に、契約内容を書面化して当事者双方へ交付する義務。35条書面との違い（時期・相手・説明不要）と、必要的記載事項／任意的記載事項の振り分け、売買と貸借の差を押さえる。","tree":[{"h":"交付の方法","items":["契約成立後遅滞なく交付","相手：契約当事者双方（自ら当事者は相手方）","関与した業者全員に交付義務","承諾があれば電磁的方法で提供可"]},{"h":"宅建士の関与","items":["宅建士の記名が必要（専任不要・押印不要）","説明義務なし","交付は宅建士でない従業者でも可"]},{"h":"業者間の扱い","items":["相手方が業者でも交付省略不可","記名・記載事項も省略不可","承諾があっても交付は省略不可"]},{"h":"必要的記載","items":["当事者の氏名・住所、物件の特定表示","代金・借賃の額、支払時期・方法","引渡し時期","移転登記の申請時期（売買・交換）","既存建物の構造等の双方確認事項（売買）"]},{"h":"任意的記載","items":["代金等以外の金銭：額・時期・目的","契約解除、損害賠償予定・違約金","危険負担（天災等の損害負担）","担保責任の特約・履行確保措置","ローン不成立時の措置、租税公課の負担"]}],"flow":null,"tables":[{"title":"売買と貸借の記載事項","head":["記載事項","売買","貸借"],"rows":[["代金・借賃の額・支払時期・方法","必要","必要"],["引渡し時期","必要","必要"],["移転登記の申請時期","必要","不要"],["既存建物の構造等確認事項","必要","不要"],["代金等以外の金銭","定めあれば","定めあれば"],["解除・損害賠償予定・違約金","定めあれば","定めあれば"],["危険負担","定めあれば","定めあれば"],["担保責任・ローンあっせん","定めあれば","不要"],["租税公課の負担","定めあれば","不要"]]},{"title":"書面ごとの記名と説明","head":["書面","記名する者","説明"],"rows":[["媒介契約書","宅建業者（記名押印）","不要"],["35条書面","宅建士","宅建士が説明"],["37条書面","宅建士","不要"],["クーリング・オフ告知書面","宅建士の記名不要","書面で告知"]]}]}},"業法|クーリング・オフ":{"pts":["宅建業者が自ら売主、買主が宅建業者でない売買で、事務所等以外の場所で申込み・契約をした場合に適用される。申込み場所で判断する。","事務所等には、事務所、契約行為等を行う土地に定着した案内所、媒介・代理業者の事務所等、買主が自ら申し出た自宅・勤務先が含まれる。","業者から書面で告げられた日から起算して8日を経過するか、引渡しを受け、かつ代金全部を支払ったときはできなくなる。","告知・撤回等は書面で行い、電磁的方法は不可。撤回等の効力は書面を発した時に生じる（発信主義）。告知書面に宅建士の記名は不要。","業者は損害賠償・違約金を請求できず、受領した手付金その他の金銭を速やかに全額返還する。","クーリング・オフの規定に反する買主に不利な特約は無効。期間を8日より長くするなど買主に有利な特約は有効。","テント張りなど土地に定着しない案内所や喫茶店・ホテルのロビー、業者の申出による買主の自宅・勤務先は事務所等に当たらない。"],"traps":["「買主の承諾があれば告知・撤回を電磁的方法で行える」と出たら×。書面に限られる。","「解除の効力は書面が業者に到達した時に生じる」と出たら×。書面を発した時に生じる。","「引渡しを受けたらクーリング・オフできない」と出たら×。引渡し＋代金全額支払の両方が必要。"],"rel":["業法|8種制限","業法|事務所・案内所","業法|37条書面"],"bridge":"クーリング・オフは8種制限の一つで、業者が売主・買主が非業者の取引に限られる。「事務所等」の範囲は専任宅建士を置く案内所の規制とセットで覚える。","sys":{"overview":"8種制限の一つ（宅建業法37条の2）。業者が自ら売主・買主が非業者の売買で、事務所等以外で申込み等をした買主を保護する制度。「事務所等」の範囲、8日の起算点、書面・発信主義を押さえる。","tree":[{"h":"適用要件","items":["宅建業者が自ら売主・買主は非業者","事務所等以外で申込み・契約","申込みと契約の場所が違えば申込み場所で判断"]},{"h":"事務所等","items":["売主業者の事務所","土地に定着し契約等を行う案内所","媒介・代理業者の事務所等","買主が自ら申し出た自宅・勤務先"]},{"h":"事務所等外","items":["テント張りなど定着しない案内所","喫茶店・ホテルのロビー","業者の申出による自宅・勤務先"]},{"h":"できない時","items":["書面告知の日から起算して8日経過","引渡し＋代金全額支払の両方済み","告知がなければ8日の期間は進行しない"]},{"h":"方法と効果","items":["告知・撤回等とも書面（電磁的方法不可）","効力は書面を発した時（発信主義）","損害賠償・違約金の請求不可","手付金等は速やかに全額返還","買主に不利な特約は無効、有利は有効"]}],"flow":{"title":"クーリング・オフ可否の判定","steps":["売主が業者・買主が非業者か（違えば不可）","申込み場所は事務所等か（該当なら不可）","自宅・勤務先は誰の申出か確認","書面告知から8日経過していないか","引渡し＋代金全額支払が済んでいないか","すべてクリアなら書面で撤回・解除可"]},"tables":[{"title":"場所ごとの可否","head":["申込みの場所","C・O"],"rows":[["売主業者の事務所","不可"],["媒介・代理業者の事務所","不可"],["土地に定着した案内所（契約等を行う）","不可"],["テント張りの案内所","可"],["喫茶店・ホテルのロビー","可"],["買主が申し出た自宅・勤務先","不可"],["業者が申し出た自宅・勤務先","可"]]},{"title":"書面と時点の整理","head":["場面","ルール"],"rows":[["業者の告知","書面のみ・宅建士記名不要"],["買主の撤回・解除","書面のみ"],["効力発生","書面を発した時"],["期間","告知日から起算8日"],["期間延長の特約","有効（買主に有利）"]]}]}},"業法|8種制限":{"pts":["8種制限は宅建業者が自ら売主、買主が宅建業者でない場合のみ適用。業者間取引には適用されない。","損害賠償額の予定と違約金は合算して代金の2/10以内。超える部分は無効。予定がなければ実損額を請求できる。","手付は代金の2/10以内で、常に解約手付となる。相手方の履行着手前なら、買主は放棄、売主業者は倍額の現実の提供で解除できる。","担保責任の通知期間を「引渡しから2年以上」とする特約以外で民法より買主に不利な特約は無効。無効なら民法の原則（知った時から1年）に戻る。","手付金等保全措置は未完成物件で代金の5%超又は1,000万円超、完成物件で10%超又は1,000万円超のとき、受領前に講じる。","未完成物件の保全措置は保証委託契約か保証保険契約のみ、完成物件はこれに指定保管機関の手付金等寄託契約が加わる。講じなければ買主は支払拒否できる。","他人物・未完成物件の売買は原則禁止（停止条件付取得契約は不可）。割賦販売の解除は30日以上の書面催告が必要、代金の3/10超受領後は所有権留保不可。"],"traps":["「担保責任を引渡しから1年とする特約は有効」と出たら×。2年以上でなければ無効。","「売主業者は手付と同額を返還すれば解除できる」と出たら×。倍額を現実に提供する必要がある。","「業者間取引でも損害賠償予定は2割まで」と出たら×。8種制限は業者間には適用されない。"],"rel":["業法|クーリング・オフ","権利|売買・契約不適合","業法|住宅瑕疵担保履行法"],"bridge":"8種制限は民法の売買・契約不適合の原則を買主有利に修正するもの。新築住宅の構造部分の10年責任は品確法・履行法の資力確保措置とセットで出る。","sys":{"overview":"宅建業者が自ら売主・買主が非業者の売買にだけ適用される8つの規制（業者間には不適用）。民法の原則を買主有利に修正する点が軸で、2/10・5%・10%・1,000万円・2年・30日・3/10の数字が頻出。","tree":[{"h":"適用場面","items":["業者が自ら売主・買主が非業者","業者間取引・業者が買主の場合は不適用","媒介・代理の場合は不適用"]},{"h":"契約の制限","items":["クーリング・オフ（8日）","他人物・未完成物件の売買の原則禁止","未完成は保全措置を講じれば売買可","損害賠償予定＋違約金は合計2/10以内"]},{"h":"手付の規制","items":["手付は代金の2/10以内・常に解約手付","相手方の履行着手前なら解除可","買主は放棄、売主は倍額を現実に提供","買主に不利な特約は無効"]},{"h":"保全措置","items":["未完成：5%超又は1,000万円超で必要","完成：10%超又は1,000万円超で必要","受領前に講じる。なければ支払拒否可","買主が所有権登記をしたら不要"]},{"h":"担保責任","items":["民法より買主に不利な特約は無効","例外：通知期間を引渡しから2年以上","無効なら民法（知った時から1年通知）"]},{"h":"割賦販売","items":["解除・一括請求は30日以上の書面催告","3/10超受領後は所有権留保不可","譲渡担保による留保も同様に制限"]}],"flow":{"title":"手付金等保全措置の要否","steps":["業者が売主・買主は非業者か確認","買主が所有権登記をしたか（済なら不要）","契約時に未完成物件か完成物件か判定","受領額累計が代金の5%（完成10%）超か","又は1,000万円超か（どちらも以下なら不要）","超えるなら受領前に全額について措置"]},"tables":[{"title":"8種制限の一覧","head":["制限","ポイント"],"rows":[["クーリング・オフ","告知から8日・書面・発信主義"],["他人物売買等の制限","取得契約（停止条件付除く）・保全措置で可"],["損害賠償予定等","違約金と合計2/10以内"],["手付の額・性質","2/10以内・解約手付"],["手付金等保全措置","未完成5%・完成10%・1,000万円"],["担保責任の特約","引渡しから2年以上のみ有効"],["割賦販売の解除等","30日以上の書面催告"],["所有権留保等の禁止","3/10超受領後は留保不可"]]},{"title":"保全措置の比較","head":["項目","未完成物件","完成物件"],"rows":[["必要となる額","5%超又は1,000万円超","10%超又は1,000万円超"],["保証委託契約","○","○"],["保証保険契約","○","○"],["指定保管機関の寄託","×","○"]]},{"title":"代金別の上限（計算例）","head":["代金","手付・賠償予定上限","保全不要の上限"],"rows":[["2,000万円・未完成","400万円","100万円まで"],["2,000万円・完成","400万円","200万円まで"],["5,000万円・未完成","1,000万円","250万円まで"],["1億2,000万円・完成","2,400万円","1,000万円まで"]]}]}},"業法|報酬":{"pts":["売買の媒介の上限は、代金（税抜）200万円以下5%、200万円超400万円以下4%、400万円超3%。400万円超は「3%＋6万円」で計算し消費税を加える。","代理は媒介の2倍以内。同一取引で双方から受領する場合も合計で媒介報酬の2倍以内に収める。","代金800万円以下の宅地建物（低廉な空家等）の売買・交換の媒介は、事前に依頼者と合意すれば売主・買主それぞれから30万円（＋税）まで受領できる（2024年改正）。代理はその2倍以内。","貸借の媒介は双方合計で借賃1か月分（＋税）以内。居住用建物は承諾がない限り依頼者の一方から0.5か月分（＋税）まで。","長期の空家等（1年超不使用等）の貸借の媒介は、事前合意により貸主・借主合計で借賃2か月分（＋税）まで受領できる特例があるが、居住用の借主からは通常どおり0.5か月分（＋税）が上限。","居住用以外の建物の貸借で権利金の授受があれば、権利金を売買代金とみなして計算できる。居住用建物には適用されない。","報酬とは別に受領できるのは、依頼者の依頼による広告料金と、依頼者の特別の依頼による費用で事前に承諾を得たものだけ。"],"traps":["「双方の承諾があれば居住用貸借で合計1か月分超を受領できる」と出たら×。合計1か月分（＋税）が上限（長期の空家等の特例を除く）。","「低廉な空家等の特例は売主からの報酬のみ」と出たら×。2024年改正で買主からの媒介報酬にも適用される。","「契約書作成費用を報酬とは別に受領できる」と出たら×。通常業務の費用は報酬に含まれる。"],"rel":["業法|媒介契約","業法|広告","業法|監督・罰則"],"bridge":"報酬は媒介契約に基づく成功報酬で、上限超過は業務停止処分や罰則の対象。依頼者の依頼による広告料金のみ別途受領できる点が広告の論点と交差する。","sys":{"overview":"宅建業法46条と国土交通大臣告示による報酬の上限規制。売買の速算式（5%・4%＋2万・3%＋6万）、代理は2倍、貸借は1か月分、居住用は0.5か月分、2024年改正の空家等特例を計算できれば得点できる。","tree":[{"h":"売買の媒介","items":["200万円以下：5%","200万超400万以下：4%＋2万円","400万円超：3%＋6万円","代金は税抜で計算し最後に消費税加算","交換は高い方の価額で計算","免税業者は税抜額に4%上乗せ"]},{"h":"売買の代理","items":["媒介報酬の2倍以内","相手方からも受領なら合計2倍以内"]},{"h":"空家等特例","items":["800万円以下の宅地建物（低廉な空家等）","売主・買主それぞれ30万円（＋税）まで","事前に依頼者へ説明し合意が必要","長期空家等の貸借：合計2か月分まで","長期空家等＝1年超不使用等の建物","代理の特例は媒介特例額の2倍以内"]},{"h":"貸借","items":["双方合計で借賃1か月分（＋税）以内","居住用建物：一方から0.5か月分","居住用でも依頼者の承諾で一方1か月分可","非居住用は権利金を代金とみなし計算可"]},{"h":"別途受領","items":["依頼者の依頼による広告料金","特別の依頼による費用で事前承諾あり","契約書作成費等の通常費用は不可"]}],"flow":null,"tables":[{"title":"売買媒介の速算式","head":["代金（税抜）","上限（税抜）"],"rows":[["200万円以下","代金×5%"],["200万円超400万円以下","代金×4%＋2万円"],["400万円超","代金×3%＋6万円"],["800万円以下の空家等","各依頼者から30万円まで（事前合意）"],["代理","上記の2倍以内"]]},{"title":"貸借の報酬上限","head":["区分","上限（税抜）"],"rows":[["貸借の媒介（原則）","双方合計で借賃1か月分"],["居住用建物の媒介","一方から0.5か月分（承諾で1か月）"],["貸借の代理","借賃1か月分（相手方と合計）"],["非居住用で権利金あり","権利金を代金とみなし計算可"],["長期の空家等（特例）","貸主から上乗せ、合計2か月分"],["使用貸借","通常の借賃を基準に計算"]]},{"title":"計算例（課税業者）","head":["取引","税抜","税込"],"rows":[["売買媒介 1,000万円","36万円","39.6万円"],["売買代理 1,000万円","72万円","79.2万円"],["売買媒介 300万円","14万円","15.4万円"],["600万円・空家特例（一方から）","30万円","33万円"],["居住用貸借 月10万円・一方","5万円","5.5万円"]]}]}},"業法|監督・罰則":{"pts":["必要的取消は欠格事由該当、不正手段による免許取得、業務停止事由で情状が特に重い、業務停止処分違反、免許後1年以内の事業不開始・1年以上休止など。","免許の条件違反、事務所の所在地等を確知できず公告から30日を経過しても申出がない場合は任意的取消。","指示・業務停止は免許権者のほか業務地の知事もできるが、免許取消は免許権者だけができる。業務停止は1年以内の期間。","監督処分の前には聴聞が必要で、審理は公開で行う。業務停止と免許取消は公告が必要、指示処分は公告不要。","国土交通大臣が消費者保護に関わる規定違反で大臣免許業者を処分する場合は、あらかじめ内閣総理大臣に協議する。","無免許営業・名義貸し・不正免許取得・業務停止違反は3年以下の拘禁刑か300万円以下の罰金（併科あり）、法人は1億円以下の罰金。","重要な事項の不告知・不実告知は2年以下の拘禁刑等、誇大広告は6か月以下の拘禁刑等。報酬額不掲示・標識不掲示は50万円以下の罰金。"],"traps":["「免許の条件違反は必ず取り消さなければならない」と出たら×。取り消すことが「できる」任意的取消。","「業務停止処分をしたときは公告不要」と出たら×。業務停止・免許取消は公告が必要で、不要なのは指示処分だけ。","「知事が大臣免許業者を処分するとき内閣総理大臣と協議」と出たら×。協議が必要なのは国土交通大臣が処分する場合。"],"rel":["業法|免許の基準","業法|免許","業法|宅建士"],"bridge":"必要的取消の多くは免許の基準（欠格事由）と表裏一体。宅建士に対する監督（指示・事務禁止・登録消除）も同じ構造なので並べて覚える。","sys":{"overview":"宅建業者・宅建士の違反に対する行政処分（指示・業務停止・免許取消）と刑事罰。必要的取消と任意的取消の区別、処分権者（免許権者／業務地の知事）、聴聞・公告の要否、罰則の重さの序列を押さえる。","tree":[{"h":"業者の処分","items":["指示処分：免許権者・業務地の知事","業務停止（1年以内）：同上","免許取消：免許権者のみ"]},{"h":"必要的取消","items":["欠格事由に該当","不正の手段で免許取得","業務停止事由で情状特に重い・停止違反","免許後1年以内に事業不開始・1年以上休止"]},{"h":"任意的取消","items":["免許に付された条件に違反","所在不明で公告後30日経過し申出なし"]},{"h":"手続","items":["処分前に聴聞（審理は公開）","聴聞は期日1週間前までに通知・公示","業務停止・取消は公告、指示は不要","大臣が消費者保護規定違反で処分→首相協議","知事が他の免許業者を処分→免許権者に報告等"]},{"h":"宅建士処分","items":["指示・事務禁止（1年以内）","登録消除は登録知事のみ","指示・事務禁止は行為地の知事も可"]},{"h":"罰則","items":["無免許・名義貸し等：3年以下拘禁刑","重要事項の不告知等：2年以下拘禁刑","誇大広告：6か月以下拘禁刑","法人重科：最大1億円以下の罰金"]}],"flow":{"title":"業者への監督処分の流れ","steps":["違反行為の発覚（報告徴収・立入検査等）","処分権者を確認（取消は免許権者のみ）","大臣処分で消費者保護規定なら首相と協議","聴聞を実施（期日の審理は公開）","指示・業務停止・免許取消の処分","業務停止・免許取消は公告（指示は不要）","他の行政庁が処分したら免許権者へ報告等"]},"tables":[{"title":"監督処分の比較","head":["処分","処分権者","公告"],"rows":[["指示処分","免許権者・業務地知事","不要"],["業務停止（1年以内）","免許権者・業務地知事","必要"],["免許取消","免許権者のみ","必要"],["宅建士の事務禁止","登録知事・行為地知事","不要"],["宅建士の登録消除","登録知事のみ","不要"]]},{"title":"主な罰則","head":["違反","罰則"],"rows":[["無免許営業・名義貸し","3年以下拘禁刑・300万円以下"],["不正手段の免許取得","3年以下拘禁刑・300万円以下"],["業務停止処分違反","3年以下拘禁刑・300万円以下"],["重要事項の不告知・不実告知","2年以下拘禁刑・300万円以下"],["不当に高額の報酬の要求","1年以下拘禁刑・100万円以下"],["誇大広告","6か月以下拘禁刑・100万円以下"],["限度額を超える報酬の受領","100万円以下の罰金"],["37条書面の不交付","50万円以下の罰金"],["報酬額・標識の不掲示","50万円以下の罰金"],["重説時の士証不提示・提出・返納違反","10万円以下の過料"]]}]}},"業法|住宅瑕疵担保履行法":{"pts":["宅建業者が自ら売主となり、宅建業者でない買主に新築住宅を引き渡す場合に、保証金の供託か保険契約締結による資力確保措置が必要。","対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵。これらの免責特約は品確法上無効で、資力確保義務は残る。","保証金は主たる事務所の最寄りの供託所に供託。販売戸数の算定では床面積55㎡以下の住宅は2戸をもって1戸と数える。","保険契約は国土交通大臣指定の保険法人と締結し、引渡しから10年以上有効でなければならない。買主の承諾があっても短縮できない。","基準日（毎年3月31日）ごとに、基準日から3週間以内に資力確保措置の状況を免許権者に届け出る。","届出をしないと、基準日の翌日から起算して50日を経過した日以後、新たに自ら売主となる新築住宅の売買契約を締結できない。","供託する場合は契約締結までに供託所の所在地等を書面（承諾があれば電磁的方法）で説明する。保険付き住宅は指定住宅紛争処理機関を利用できる。"],"traps":["「買主が宅建業者でも資力確保措置が必要」と出たら×。資力確保措置は買主が宅建業者でない場合に限られる。","「保証金は販売した新築住宅の所在地の最寄りの供託所に供託」と出たら×。主たる事務所の最寄りの供託所。","「床面積25㎡以下は3戸を1戸と数える」と出たら×。55㎡以下は2戸をもって1戸。"],"rel":["業法|8種制限","業法|営業保証金","業法|重要事項説明"],"bridge":"8種制限の担保責任特約制限が「特約の効力」の問題なのに対し、履行法は責任を確実に果たすための「お金の手当て」。供託先が主たる事務所最寄りという点は営業保証金と共通。","sys":{"overview":"品確法の新築住宅10年責任を確実に履行させるため、業者売主に保証金供託か保険加入を義務づける法律。適用場面、供託先、55㎡・2戸1戸、10年以上、基準日3月31日・3週間・50日の数字を押さえる。","tree":[{"h":"適用場面","items":["業者が自ら売主・買主は非業者","新築住宅の引渡し（媒介は対象外）","買主が業者なら資力確保措置不要","新築＝完成1年内かつ未入居の住宅"]},{"h":"対象の瑕疵","items":["構造耐力上主要な部分","雨水の浸入を防止する部分","品確法で10年責任・免責特約は無効"]},{"h":"保証金供託","items":["主たる事務所の最寄りの供託所","過去10年の供給戸数に応じた額","55㎡以下は2戸をもって1戸","契約締結までに供託所所在地等を書面説明"]},{"h":"保険契約","items":["国土交通大臣指定の保険法人と締結","引渡しから10年以上有効","買主の承諾でも期間短縮不可","保険付き住宅は指定住宅紛争処理機関可"]},{"h":"届出","items":["基準日：毎年3月31日","基準日から3週間以内に免許権者へ届出","未届出：基準日翌日から50日経過日以後","新たな新築住宅の売買契約が禁止"]}],"flow":{"title":"資力確保措置の手順","steps":["売主業者・非業者買主・新築住宅か確認","供託か保険契約かを選択","供託なら契約締結までに供託所等を説明","引渡し（保険は10年以上有効で締結）","基準日（3月31日）の状況を集計","3週間以内に免許権者へ届出"]},"tables":[{"title":"履行法の重要数字","head":["項目","内容"],"rows":[["責任期間","引渡しから10年"],["保険の有効期間","10年以上"],["戸数算定の特例","55㎡以下は2戸で1戸"],["基準日","毎年3月31日"],["届出期限","基準日から3週間以内"],["新規契約禁止","基準日翌日から50日経過日以後"]]},{"title":"営業保証金との比較","head":["項目","営業保証金","瑕疵担保保証金"],"rows":[["供託先","主たる事務所最寄り","主たる事務所最寄り"],["対象者","全宅建業者","新築住宅の業者売主"],["額の基準","事務所数","過去10年の供給戸数"],["保険で代替","×","○（保険契約）"]]}]}},"権利|意思表示・行為能力":{"pts":["通謀虚偽表示は当事者間で無効。ただし無効を善意の第三者に対抗できず、第三者は無過失や登記を要しない（94条2項）。","錯誤は無効でなく取消し。重要な錯誤が要件で、動機の錯誤はその事情が法律行為の基礎とされていると表示されていた場合に限る。","表意者に重過失があると錯誤取消しはできない。ただし相手方が悪意・重過失のとき又は共通錯誤のときは取り消せる。","詐欺取消しは善意無過失の第三者に対抗できない。第三者詐欺は相手方が詐欺を知り又は知ることができたときに限り取り消せる。","強迫による取消しは、第三者が善意無過失でも対抗できる。第三者による強迫でも相手方の善意・悪意を問わず取り消せる。","成年は18歳。未成年者の行為は法定代理人の同意が必要だが、単に権利を得・義務を免れる行為や許可された営業は単独でできる。","成年被後見人の行為は後見人の同意があっても取り消せる（日用品の購入等を除く）。制限行為能力者が詐術を用いたときは取消し不可。"],"traps":["「錯誤による意思表示は無効」と出たら×。2020年改正後は取消しで、善意無過失の第三者には対抗できない。","「虚偽表示の第三者は善意無過失でなければ保護されない」と出たら×。94条2項は善意で足り、登記も不要。","「強迫の取消しは善意無過失の第三者に対抗できない」と出たら×。保護されないのは詐欺の場合で、強迫は対抗できる。"],"rel":["権利|代理","権利|物権変動・対抗"],"bridge":"代理では意思表示の瑕疵を原則として代理人について判断する。取消し前の第三者は意思表示の規定で、取消し後の第三者は登記の先後（177条）で処理する。","sys":{"overview":"民法総則のうち、契約が有効に成立するかを左右する分野。意思表示の5類型（心裡留保・虚偽表示・錯誤・詐欺・強迫）の効果と第三者保護要件、制限行為能力者4類型の保護者の権限を比較で押さえれば得点できる。","tree":[{"h":"意思の欠缺","items":["心裡留保：原則有効、相手方悪意・有過失なら無効","虚偽表示：当事者間で無効、善意の第三者に対抗不可","虚偽表示の第三者は善意で足り無過失・登記不要"]},{"h":"錯誤","items":["重要な錯誤なら取消し（無効ではない）","動機の錯誤は基礎事情の表示が必要","表意者に重過失→原則取消し不可","相手方悪意・重過失、共通錯誤なら重過失でも可","善意無過失の第三者に対抗不可"]},{"h":"詐欺・強迫","items":["詐欺：取消し、善意無過失の第三者に対抗不可","第三者詐欺：相手方が悪意・有過失なら取消し可","強迫：取消し、第三者が善意無過失でも対抗可","第三者強迫：相手方の善意悪意を問わず取消し可"]},{"h":"制限行為能力","items":["成年は18歳（婚姻による成年擬制は廃止）","未成年者：同意なき行為は取消し可","成年被後見人：同意があっても取消し可","被保佐人：13条所定の重要行為に同意必要","被補助人：審判で定めた特定の行為のみ同意必要"]},{"h":"例外・相手方","items":["単に権利を得・義務を免れる行為は単独で可","許可された営業はその営業に関してのみ単独で可","日用品の購入等は成年被後見人も取消し不可","詐術を用いたときは取消し不可（21条）","相手方の催告：1か月以上の期間を定める"]},{"h":"取消し・追認","items":["取消権は追認できる時から5年で消滅","行為の時から20年でも消滅","取消し後は初めから無効、現存利益の返還（制限行為能力者）","取消し後の第三者とは登記の先後で決まる"]}],"flow":{"title":"錯誤取消しの判定","steps":["錯誤が法律行為の目的・取引通念上重要か","動機の錯誤なら基礎事情が表示されていたか","表意者に重大な過失がないか","重過失でも相手方悪意・重過失か共通錯誤なら可","要件充足→取消し可（はじめから無効）","第三者が善意無過失なら取消しを対抗できない"]},"tables":[{"title":"意思表示の5類型比較","head":["類型","効果","善意の第三者"],"rows":[["心裡留保","原則有効（悪意・有過失の相手方→無効）","対抗不可（善意で保護）"],["虚偽表示","無効","対抗不可（善意で保護）"],["錯誤","取消し","善意無過失なら対抗不可"],["詐欺","取消し","善意無過失なら対抗不可"],["強迫","取消し","対抗できる（保護なし）"]]},{"title":"制限行為能力者4類型","head":["類型","保護者","同意権","代理権"],"rows":[["未成年者","親権者・未成年後見人","○","○"],["成年被後見人","成年後見人","×（同意しても取消可）","○"],["被保佐人","保佐人","○（13条の行為）","審判で付与"],["被補助人","補助人","審判で定めた行為","審判で付与"]]},{"title":"相手方の催告と確答なし","head":["催告の相手","確答なしの効果"],"rows":[["能力者となった本人","追認とみなす"],["法定代理人・保佐人・補助人","追認とみなす"],["被保佐人・被補助人本人","取消しとみなす"]]}]}},"権利|代理":{"pts":["代理人は行為能力者であることを要しない。制限行為能力者が代理人としてした行為は、行為能力の制限を理由に取り消せない。","自己契約・双方代理は無権代理とみなす。ただし債務の履行と本人があらかじめ許諾した行為は有効（108条）。","代理権濫用は、相手方が代理人の目的を知り又は知ることができたとき無権代理とみなす（107条）。","任意代理人は本人の許諾又はやむを得ない事由があるときのみ復代理人を選任可。法定代理人は自己の責任でいつでも選任できる。","代理権は本人の死亡、代理人の死亡・破産手続開始・後見開始で消滅する。任意代理では本人の破産手続開始でも消滅する。","無権代理の追認は契約時にさかのぼって効力を生ずる。相手方は催告でき、本人が期間内に確答しなければ追認拒絶とみなす。","表見代理（代理権授与表示・権限外・代理権消滅後）は相手方の善意無過失が必要。無権代理人の責任は相手方が選択できる。"],"traps":["「双方代理は本人の許諾があっても無効」と出たら×。あらかじめ許諾した行為や債務の履行は有効となる。","「無権代理の追認は追認の時から効力を生ずる」と出たら×。別段の意思表示がない限り契約時にさかのぼる。","「善意の相手方は表見代理を主張できる」と出たら要注意。表見代理は善意だけでなく無過失も必要で、過失があれば不成立。"],"rel":["権利|意思表示・行為能力","権利|相続"],"bridge":"代理行為の瑕疵は代理人を基準に判断し、意思表示の規定がそのまま使われる。無権代理と相続では、本人が相続すれば追認拒絶でき、無権代理人が単独相続すれば追認拒絶できない。","sys":{"overview":"民法総則の代理制度。有効な代理の3要件（代理権・顕名・代理行為）を軸に、代理権の制限（自己契約・双方代理・濫用）、復代理、消滅事由、無権代理と表見代理での相手方の手段を要件の違いで押さえる。","tree":[{"h":"代理の要件","items":["代理権の存在・顕名・代理行為の3つ","顕名なし→代理人自身の行為とみなす","相手方が悪意・有過失なら本人に効果（100条）","代理人は行為能力者でなくてよい（102条）","代理行為の瑕疵は原則代理人を基準に判断"]},{"h":"代理権の制限","items":["自己契約・双方代理は無権代理とみなす","債務の履行・本人があらかじめ許諾した行為は有効","利益相反行為も無権代理とみなす","濫用：相手方悪意・有過失なら無権代理とみなす"]},{"h":"復代理","items":["任意代理：本人の許諾かやむを得ない事由が必要","法定代理：自己の責任でいつでも選任可","復代理人は本人を直接代理する","代理人の代理権消滅で復代理権も消滅"]},{"h":"代理権の消滅","items":["本人の死亡","代理人の死亡・破産手続開始・後見開始","任意代理は本人の破産手続開始でも消滅","本人の後見開始は消滅事由でない"]},{"h":"無権代理","items":["本人は追認・追認拒絶できる","追認は契約時にさかのぼる（116条）","相手方：催告・取消し・責任追及","無権代理人の責任：履行か損害賠償を相手方が選択"]},{"h":"表見代理","items":["代理権授与表示（109条）","権限外の行為（110条）・正当な理由","代理権消滅後（112条）","いずれも相手方の善意無過失が必要","日常家事代理権を基本代理権とする110条の趣旨類推（判例）"]}],"flow":{"title":"無権代理の相手方の手段","steps":["本人に相当期間を定めて追認を催告（悪意でも可）","確答なし→追認拒絶とみなす","善意なら本人の追認前に契約を取り消せる","善意無過失なら表見代理の成立を主張","善意無過失なら無権代理人に履行か損害賠償請求","無権代理人が悪意なら相手方に過失があっても可"]},"tables":[{"title":"相手方の手段と要件","head":["手段","善意","無過失","備考"],"rows":[["催告","不要","不要","確答なし→追認拒絶"],["取消し","必要","不要","本人の追認前に限る"],["表見代理","必要","必要","本人に効果帰属"],["無権代理人の責任","必要","原則必要","代理人が制限行為能力者なら×"]]},{"title":"代理権の消滅事由","head":["事由","本人","代理人"],"rows":[["死亡","消滅","消滅"],["破産手続開始","任意代理のみ消滅","消滅"],["後見開始","消滅しない","消滅"]]},{"title":"無権代理と相続","head":["場面","追認拒絶"],"rows":[["無権代理人が本人を単独相続","×（できない）"],["本人が無権代理人を相続","○（ただし責任は承継）"],["無権代理人が他の相続人と共同相続","全員の追認がなければ当然有効とならない"]]}]}},"権利|時効":{"pts":["所有権の取得時効は、所有の意思をもって平穏・公然に占有し、占有開始時に善意無過失なら10年、それ以外は20年で完成する。","所有の意思は占有取得の原因（権原）で客観的に決まる。賃借人は何年占有しても原則として所有権を時効取得できない。","前の占有者の占有を併合でき、その場合は瑕疵も承継する。善意無過失は最初の占有者の占有開始時で判断する。","債権は、権利行使できることを知った時から5年、行使できる時から10年で時効消滅する。生命・身体侵害の損害賠償は後者が20年。","裁判上の請求は終了まで完成猶予、確定判決等で権利が確定すれば更新。確定せず終了したときは終了から6か月完成猶予にとどまる。","催告は6か月間の完成猶予のみで、猶予中の再度の催告に効力はない。承認は更新事由で、処分の行為能力・権限は不要。","時効は当事者（保証人・物上保証人・第三取得者等）が援用して初めて確定する。時効の利益は完成前に放棄できない。"],"traps":["「後順位抵当権者は先順位の被担保債権の消滅時効を援用できる」と出たら×。順位上昇は反射的利益で援用権者でない。","「時効完成を知らずに承認した債務者は時効を援用できる」と出たら×。判例は信義則上援用できないとする。","「途中で他人の物と知った占有者は所有の意思を失う」と出たら×。善意・悪意は占有開始時で判断し、所有の意思は失わない。"],"rel":["権利|物権変動・対抗","権利|保証・連帯債務"],"bridge":"時効取得者は時効完成前の第三者には登記なく対抗でき、完成後の第三者とは対抗関係になる。保証人は主債務の時効を援用でき、主債務者の時効利益放棄の効果は保証人に及ばない。","sys":{"overview":"民法総則の時効制度。取得時効（10年・20年）と消滅時効（5年・10年）の期間、完成猶予と更新の事由の区別、援用権者の範囲を整理すれば得点できる。2020年改正で「中断・停止」は「更新・完成猶予」に再編された。","tree":[{"h":"取得時効","items":["所有の意思・平穏・公然の占有","占有開始時に善意無過失→10年","それ以外→20年","所有の意思は権原で客観的に判断","賃借人を通じた間接占有でも可"]},{"h":"占有の承継","items":["前主の占有を併合できる（瑕疵も承継）","善意無過失は最初の占有者の開始時で判断","占有回収の訴えで回復→占有は継続扱い"]},{"h":"消滅時効","items":["債権：知った時から5年","債権：行使できる時から10年","生命・身体侵害の損害賠償：20年（客観）","債権以外の財産権：20年、所有権は消滅しない","判決で確定した権利：10年"]},{"h":"完成猶予","items":["裁判上の請求等：終了まで（不確定なら+6か月）","催告：6か月（再度の催告は無効）","協議の書面合意：最長1年、通算5年まで","仮差押え・仮処分：終了から6か月","天災等：障害消滅から3か月"]},{"h":"更新","items":["確定判決・裁判上の和解等で権利確定","強制執行等の終了","承認（処分の能力・権限は不要）","更新後は新たに時効が進行"]},{"h":"援用・放棄","items":["援用で効果確定、効果は起算日にさかのぼる","援用権者：保証人・物上保証人・第三取得者","後順位抵当権者は援用不可（判例）","完成前の放棄は不可、完成後の放棄は相対効","完成後の承認→知らなくても援用不可（判例）"]}],"flow":{"title":"時効の進行から完成まで","steps":["起算点：占有開始／権利行使可能・知った時","完成猶予事由が生じれば期間満了が延びる","更新事由が生じればゼロから再スタート","期間満了で時効完成","当事者が援用して効果が確定","効果は起算日にさかのぼる（144条）"]},"tables":[{"title":"時効期間の整理","head":["種類","期間","起算点"],"rows":[["所有権の取得（善意無過失）","10年","占有開始時"],["所有権の取得（上記以外）","20年","占有開始時"],["債権（主観）","5年","行使できると知った時"],["債権（客観）","10年","行使できる時"],["生命・身体侵害の損害賠償","5年／20年","知った時／行使できる時"],["債権・所有権以外の財産権","20年","行使できる時"],["判決で確定した権利","10年","確定時"]]},{"title":"完成猶予と更新","head":["事由","完成猶予","更新"],"rows":[["裁判上の請求","○ 終了まで","○ 権利確定時"],["請求の取下げ等","○ 終了から6か月","×"],["強制執行等","○ 終了まで","○ 終了時"],["仮差押え・仮処分","○ 終了から6か月","×"],["催告","○ 6か月","×"],["協議の書面合意","○ 最長1年","×"],["承認","—","○"]]},{"title":"援用権者に当たるか","head":["立場","援用"],"rows":[["保証人","○"],["物上保証人","○"],["抵当不動産の第三取得者","○"],["後順位抵当権者","×"],["一般債権者（原則）","×"]]}]}},"権利|物権変動・対抗":{"pts":["不動産物権の得喪変更は、登記がなければ第三者に対抗できない（177条）。二重譲渡の優劣は契約の先後でなく登記の先後で決まる。","177条の第三者は登記の欠缺を主張する正当な利益を有する者。不法占拠者・無権利者・背信的悪意者には登記なく対抗できる。","単なる悪意者は第三者に当たる。背信的悪意者からの転得者も、自身が背信的悪意者でなければ177条の第三者として保護される。","取消し前の第三者は意思表示の規定で処理し、取消し後の第三者とは登記の先後で決まる。解除後の第三者も登記の先後。","解除前の第三者は、善意・悪意を問わず権利保護要件として登記を備えれば保護される（545条1項ただし書）。","時効取得者は完成前の第三者には登記不要、完成後の第三者とは登記の先後。相続人が法定相続分を超える部分は登記なく対抗できない。","共同相続人の1人が勝手に単独名義で登記し譲渡しても、他の相続人の持分について譲受人は権利を取得できない（登記に公信力なし）。"],"traps":["「先に売買契約をした買主は登記がなくても後の買主に優先する」と出たら×。優劣は登記の先後で決まる。","「悪意の第二買主には登記なく対抗できる」と出たら×。単なる悪意者は177条の第三者で、対抗できないのは背信的悪意者のみ。","「解除前の第三者は善意であれば登記なしで保護される」と出たら×。善意悪意不問だが、登記は必要。"],"rel":["権利|不動産登記法","権利|意思表示・行為能力","権利|時効"],"bridge":"177条は「登記がなければ対抗できない」という実体法のルールで、不動産登記法はその登記の申請手続を定める。取消し・解除・時効・相続の各場面で、第三者が出現した時期により処理が変わる。","sys":{"overview":"物権編の基本原則。不動産の物権変動は登記がなければ第三者に対抗できない（177条）。「第三者」に当たる者・当たらない者の区別と、取消し・解除・時効・相続で第三者が現れた時期ごとの処理を図で押さえる。","tree":[{"h":"基本原則","items":["物権変動は意思表示のみで生じる（176条）","第三者への対抗には登記が必要（177条）","二重譲渡の優劣は登記の先後","登記に公信力はない"]},{"h":"第三者の範囲","items":["登記の欠缺を主張する正当な利益を有する者","単なる悪意者は第三者に当たる","背信的悪意者・不法占拠者・無権利者は除外","背信的悪意者からの転得者は保護されうる","順次譲渡の前々主は当事者類似で登記不要"]},{"h":"取消し・解除","items":["取消し前の第三者：意思表示の規定で判断","取消し後の第三者：登記の先後","解除前の第三者：善意悪意不問、登記が必要","解除後の第三者：登記の先後"]},{"h":"時効と登記","items":["完成前の第三者：登記なく対抗できる","完成後の第三者：登記の先後","起算点は任意に選べない（判例）"]},{"h":"相続と登記","items":["法定相続分は登記なく対抗できる","法定相続分を超える部分は登記が必要（899条の2）","相続放棄の効果は登記なく対抗できる（判例）","無断単独登記の譲受人は他相続人の持分を取得しない","相続登記の申請義務：知った日から3年以内"]}],"flow":{"title":"二重譲渡の対抗関係の判定","steps":["相手は当事者・前主か（なら登記不要）","相手は無権利者・不法占拠者か（なら登記不要）","相手は背信的悪意者か（なら登記不要）","上記以外は177条の第三者（悪意者も含む）","先に登記を備えた方が優先","取消し・解除・時効は第三者の出現時期も確認"]},"tables":[{"title":"登記なしで対抗できるか","head":["相手方","登記なしで対抗"],"rows":[["二重譲渡の他方の譲受人（悪意含む）","×"],["背信的悪意者","○"],["背信的悪意者からの善意の転得者","×"],["不法占拠者・無権利者","○"],["前主・前々主（順次譲渡）","○"],["差押債権者","×"],["対抗力ある借地人（賃貸人の地位主張）","×"]]},{"title":"第三者の出現時期と処理","head":["場面","前の第三者","後の第三者"],"rows":[["詐欺・錯誤取消し","善意無過失なら保護","登記の先後"],["強迫取消し","保護されない","登記の先後"],["虚偽表示","善意なら保護（登記不要）","—"],["解除","登記があれば保護","登記の先後"],["取得時効","登記なく対抗可","登記の先後"]]}]}},"権利|共有・相隣":{"pts":["保存行為は各共有者が単独ででき、管理行為（軽微な変更、土地5年・建物3年以内の賃貸借等を含む）は持分の価格の過半数で決する。","形状又は効用の著しい変更を伴う変更には共有者全員の同意が必要。所在等不明共有者がいれば裁判所の決定で残りの共有者で決められる。","各共有者は共有物の全部を持分に応じて使用できる。共有者の1人が単独占有していても、他の共有者は当然には明渡請求できない。","共有者が持分を放棄し又は相続人なく死亡したとき、その持分は他の共有者に帰属する。分割禁止特約は5年以内（更新可）。","隣地使用権は一定目的のため必要な範囲で認められるが、住家への立入りは居住者の承諾が必要。原則あらかじめ通知する。","越境した竹木の根は自ら切り取れる。枝は所有者に切除させるのが原則だが、催告後相当期間内に切除しない等の場合は自ら切り取れる。","他の土地に囲まれ公道に通じない土地の所有者は囲繞地を通行できる。分割・一部譲渡で生じた袋地は他の分割者の土地のみ無償で通行できる。"],"traps":["「共有物の変更はすべて共有者全員の同意が必要」と出たら×。形状・効用の著しい変更を伴わない軽微な変更は持分の過半数で足りる。","「隣地の枝はいかなる場合も自ら切り取れない」と出たら×。催告後相当期間内に切除されない、所有者不明、急迫の事情の場合は可。","「持分を放棄した共有者の持分は国庫に帰属する」と出たら×。他の共有者に帰属する（255条）。"],"rel":["権利|区分所有法","権利|相続"],"bridge":"区分所有建物の共用部分にも共有の考え方があるが、変更・管理の決議は区分所有法の集会決議で行う。遺産共有も共有の一種で、相続開始から10年経過後は共有物分割手続でも分割できる場合がある。","sys":{"overview":"物権編の所有権の章。共有物に関する行為を保存・管理・変更に分けて決め方を押さえ、2023年4月施行の改正（軽微変更、所在等不明共有者、隣地使用権、枝の切取り、管理命令制度）と相隣関係の数字を整理する。","tree":[{"h":"共有の基本","items":["各共有者は全部を持分に応じて使用できる","使用する共有者は超過分の対価償還義務あり","持分の処分は各自自由","持分放棄・相続人なく死亡→他の共有者に帰属","単独占有者に当然には明渡請求できない（判例）"]},{"h":"行為の区分","items":["保存行為：各共有者が単独で可","管理行為：持分の価格の過半数","軽微な変更：持分の価格の過半数","著しい変更：共有者全員の同意","短期賃貸借（土地5年・建物3年以内）は管理"]},{"h":"不明共有者","items":["所在等不明共有者：裁判所の決定で除外可","賛否不明共有者：管理行為のみ除外可","不明共有者の持分の取得・譲渡の制度あり","遺産共有は相続開始から10年経過が必要"]},{"h":"分割","items":["各共有者はいつでも分割請求できる","分割禁止特約は5年以内（更新可）","協議が調わなければ裁判で分割","現物・賠償・競売による分割"]},{"h":"相隣関係","items":["隣地使用権：原則あらかじめ通知","住家への立入りは居住者の承諾が必要","越境した根は自ら切り取れる","枝は催告後相当期間内に切除なし等で自ら切除","ライフライン設備の設置・使用権"]},{"h":"通行・距離等","items":["袋地所有者は囲繞地を通行できる（償金必要）","分割・一部譲渡の袋地は残余地のみ無償通行","建物は境界線から50cm以上離す","1m未満の窓・縁側には目隠しが必要","所有者不明・管理不全の土地建物の管理命令"]}],"flow":{"title":"共有物の行為の決め方","steps":["持分の処分か→各共有者が単独で可","現状維持の保存行為か→単独で可","形状・効用の著しい変更か→全員の同意","それ以外の管理・軽微変更→持分価格の過半数","使用中の共有者に特別の影響→その承諾が必要","不明共有者がいれば裁判所の決定で除外"]},"tables":[{"title":"共有物の行為と要件","head":["行為","要件","例"],"rows":[["保存","単独","不実登記の抹消請求・修繕"],["管理","持分価格の過半数","管理者選任・使用者の決定"],["短期賃貸借","持分価格の過半数","土地5年・建物3年以内"],["軽微な変更","持分価格の過半数","著しい変更を伴わない工事"],["著しい変更","全員の同意","造成・全体の売却"],["持分の処分","単独","持分の売却・抵当権設定"]]},{"title":"相隣関係の数字・要件","head":["項目","ルール"],"rows":[["越境した根","自ら切り取れる"],["越境した枝","原則所有者に切除させる"],["枝を自ら切れる場合","催告後相当期間・所有者不明・急迫"],["隣地の住家への立入り","居住者の承諾が必要"],["建物と境界線","50cm以上離す"],["窓・縁側の目隠し","境界線から1m未満"],["囲繞地通行","償金必要・損害最少の場所"],["分割による袋地","残余地のみ・無償"]]},{"title":"不明共有者の扱い","head":["対象","管理","変更"],"rows":[["所在等不明共有者","○ 除外可","○ 除外可"],["賛否不明共有者","○ 除外可","×"],["通常（不明者なし）","持分価格の過半数","全員の同意"]]}]}},"権利|抵当権・担保":{"pts":["抵当権は付加一体物に及び、設定当時の従物（判例）や建物抵当権では借地権にも及ぶ。果実には債務不履行後に及ぶ。","物上代位は売却代金・賃料・保険金など目的物の価値代替物に及び、払渡し・引渡し前に差押えが必要。","利息その他の定期金は、満期となった最後の2年分についてのみ抵当権を行使できる。後順位者等がいなければ制限されない。","法定地上権は、設定時に土地上に建物があり、土地と建物が同一所有者で、競売により別々の所有者となった場合に成立する。","抵当権者に対抗できない建物賃借人は、買受人の買受けの時から6か月間明渡しが猶予される。土地の賃借人には適用されない。","抵当権消滅請求は第三取得者が競売開始決定の効力発生前にでき、主たる債務者・保証人やその承継人はできない。","根抵当権は極度額の範囲で担保し、元本確定前の被担保債権の範囲変更・債務者変更に後順位抵当権者等の承諾は不要。"],"traps":["「更地に抵当権設定後に建てた建物にも法定地上権が成立する」と出たら×。設定時に建物が存在することが要件。","「一括競売をした抵当権者は建物の代価からも優先弁済を受けられる」と出たら×。一括競売は任意で、優先弁済は土地の代価のみ。","「物上代位は差押えなしに保険金に及ぶ」と出たら×。払渡し・引渡し前に抵当権者自らが差し押さえる必要がある。"],"rel":["権利|借地","権利|賃貸借","権利|保証・連帯債務"],"bridge":"建物の抵当権は従たる権利である借地権に及び、抵当権登記後の賃借人は買受人に対抗できない。保証人は債務者の財産から回収する人的担保、抵当権は物から優先弁済を受ける物的担保である。","sys":{"overview":"物権編の担保物権。中心は抵当権で、効力の及ぶ範囲、物上代位、優先弁済の範囲（最後の2年分）、法定地上権、第三取得者・賃借人の保護、根抵当権との違いを押さえる。留置権・先取特権・質権との性質比較も出る。","tree":[{"h":"担保物権","items":["法定：留置権・先取特権","約定：質権・抵当権","共通性質：付従性・随伴性・不可分性","物上代位性は留置権にない"]},{"h":"効力の範囲","items":["付加一体物、設定当時の従物（判例）","建物抵当権は借地権にも及ぶ（判例）","果実は債務不履行後に及ぶ","利息等は満期となった最後の2年分","物上代位：差押えを払渡し前にする"]},{"h":"法定地上権","items":["設定時に土地上に建物が存在","設定時に土地と建物が同一所有者","土地・建物の一方又は双方に抵当権","競売で別々の所有者になる","更地に後で建てた建物→不成立"]},{"h":"利害関係人","items":["代価弁済：抵当権者の請求に応じて支払う","抵当権消滅請求：第三取得者から請求","消滅請求は競売の差押えの効力発生前まで","債務者・保証人・その承継人は消滅請求不可","建物賃借人は買受けから6か月明渡猶予"]},{"h":"一括競売等","items":["更地抵当後の建物も一括競売できる（任意）","優先弁済は土地の代価のみ","登記した賃貸借も抵当権者全員の同意＋登記で対抗可","順位の変更は登記が効力要件"]},{"h":"根抵当権","items":["一定範囲の不特定債権を極度額まで担保","利息等は極度額まで全部担保（2年制限なし）","確定前の範囲・債務者変更に後順位の承諾不要","元本確定期日は定めた日から5年以内","設定者の確定請求は設定から3年経過後"]}],"flow":{"title":"法定地上権の成立判定","steps":["抵当権設定時に土地上に建物があったか","設定時に土地と建物が同一所有者だったか","土地・建物の一方又は双方に抵当権があるか","競売で土地と建物の所有者が別になったか","全て○なら法定地上権が成立","更地なら一括競売（任意）を検討"]},"tables":[{"title":"抵当権と根抵当権","head":["項目","抵当権","根抵当権"],"rows":[["被担保債権","特定の債権","一定範囲の不特定債権"],["付従性・随伴性","あり","元本確定前はなし"],["利息の担保","最後の2年分","極度額まで全部"],["範囲・債務者の変更","—","確定前は可・承諾不要"],["元本確定期日","—","5年以内"],["確定請求（設定者）","—","設定から3年経過後"]]},{"title":"第三取得者・賃借人の保護","head":["制度","誰から","ポイント"],"rows":[["代価弁済","抵当権者の請求","代価支払で抵当権消滅"],["抵当権消滅請求","第三取得者","競売の差押えの効力発生前"],["明渡猶予","建物賃借人","買受けから6か月・土地は対象外"],["同意の登記","賃借人","全抵当権者の同意＋登記で対抗"]]},{"title":"担保物権の性質","head":["種類","物上代位","優先弁済"],"rows":[["留置権","×","×"],["先取特権","○","○"],["質権","○","○"],["抵当権","○","○"]]}]}},"権利|債務不履行・解除":{"pts":["履行遅滞の時期は、確定期限は期限到来時、不確定期限は到来後に請求を受けた時か到来を知った時の早い方、期限なしは請求時。","損害賠償には債務者の帰責事由が必要。履行遅滞中に当事者双方の責めに帰さない不能が生じたときは債務者の帰責事由とみなす。","原始的不能でも契約は無効とならず、債務不履行による損害賠償を請求できる（412条の2第2項）。","金銭債務は不可抗力をもって抗弁とできず、損害の証明も不要。損害賠償額は約定利率がなければ法定利率による（変動制）。","解除に債務者の帰責事由は不要。ただし不履行が債権者の帰責事由によるときは解除できない（543条）。","催告解除は相当期間を定めて催告し、期間経過時の不履行が軽微なときは解除できない（541条ただし書）。","全部の履行不能・明確な履行拒絶、定期行為の期間経過などは無催告で解除できる（542条）。解除しても損害賠償請求は可能。"],"traps":["「解除には債務者の責めに帰すべき事由が必要」と出たら×。2020年改正で不要となった。損害賠償との違いに注意。","「不確定期限の債務は期限到来の時から遅滞となる」と出たら×。請求を受けた時か到来を知った時のいずれか早い時から。","「原始的不能の契約は無効」と出たら×。契約は有効で、履行に代わる損害賠償を請求できる。"],"rel":["権利|売買・契約不適合","権利|物権変動・対抗"],"bridge":"契約不適合責任の解除・損害賠償は債務不履行の一般規定（541・542条、415条）によるため要件は共通。解除前・解除後の第三者の扱いは物権変動・対抗の論点となる。","sys":{"overview":"債権総論の中心。履行遅滞の時期、損害賠償（帰責事由が必要）と解除（帰責事由不要）の要件の違い、催告解除と無催告解除の区別、解除の効果（原状回復・第三者保護）を2020年改正後のルールで押さえる。","tree":[{"h":"履行遅滞","items":["確定期限：期限到来時","不確定期限：請求時か知った時の早い方","期限の定めなし：請求を受けた時","不法行為の賠償債務：不法行為時から"]},{"h":"履行不能","items":["原始的不能でも契約は有効（412条の2）","遅滞中の不能は債務者の帰責事由とみなす","債権者は反対給付の履行を拒める（危険負担）","債権者の帰責事由による不能→反対給付拒絶不可"]},{"h":"損害賠償","items":["債務者の帰責事由が必要","通常損害＋予見すべき特別損害","債権者の過失は過失相殺","賠償額の予定ができる"]},{"h":"金銭債務","items":["不可抗力をもって抗弁とできない","損害の証明不要","約定利率がなければ法定利率","法定利率は3年ごと見直し（2026年4月〜も年3%）"]},{"h":"解除の要件","items":["債務者の帰責事由は不要","債権者の帰責事由による不履行→解除不可","催告解除：相当期間を定めて催告","期間経過時の不履行が軽微なら解除不可","全部不能・明確な履行拒絶は無催告解除"]},{"h":"解除の効果","items":["原状回復義務（双方の同時履行）","金銭は受領時から利息を付す","物は果実・使用利益も返還","解除しても損害賠償請求できる","当事者複数なら全員から又は全員に"]}],"flow":{"title":"解除から原状回復まで","steps":["債務不履行の発生（債権者の帰責事由なし）","無催告解除事由か（全部不能・明確な拒絶等）","該当しなければ相当期間を定めて催告","期間経過時の不履行が軽微でないか","解除の意思表示（撤回不可）","原状回復：金銭は受領時から利息を付す","解除前の第三者は登記があれば保護"]},"tables":[{"title":"履行遅滞となる時期","head":["期限","遅滞の時期"],"rows":[["確定期限","期限到来時"],["不確定期限","請求時か知った時の早い方"],["期限の定めなし","請求を受けた時"],["不法行為の損害賠償","不法行為時（請求不要）"]]},{"title":"損害賠償と解除の要件","head":["項目","損害賠償","解除"],"rows":[["債務者の帰責事由","必要","不要"],["債権者の帰責事由","過失相殺","解除不可"],["催告","不要","原則必要"],["軽微な不履行","請求可","催告解除不可"],["原始的不能","請求可","無催告で可"]]},{"title":"無催告解除できる場合","head":["事由","解除"],"rows":[["債務の全部が履行不能","○ 全部"],["全部の履行拒絶を明確に表示","○ 全部"],["定期行為で時期を経過","○ 全部"],["一部不能・一部拒絶で目的不達","○ 全部"],["一部不能・一部拒絶","○ その一部"]]}]}},"権利|売買・契約不適合":{"pts":["引き渡された目的物が種類・品質・数量に関して契約に適合しないとき、買主は追完（修補・代替物・不足分の引渡し）を請求できる。","代金減額請求は原則として相当期間を定めた追完の催告が必要。追完不能・明確な追完拒絶などの場合は無催告で減額請求できる。","契約不適合を理由に、債務不履行の一般規定により損害賠償請求（売主の帰責事由が必要）と解除（帰責事由不要）ができる。","不適合が買主の帰責事由によるときは、追完・代金減額・解除のいずれも請求できない。","種類・品質の不適合は、買主が知った時から1年以内に通知しなければ権利を失う。売主が悪意・重過失なら制限なし。数量・権利は対象外。","担保責任を負わない特約も有効だが、売主が知りながら告げなかった事実や自ら設定・譲渡した権利は免責されない（572条）。","手付は解約手付と推定され、相手方が履行に着手するまで、買主は手付を放棄、売主は倍額を現実に提供して解除できる。"],"traps":["「1年以内に請求しなければならない」と出たら×。知った時から1年以内の「通知」で足り、数量不足には適用されない。","「契約目的を達成できなければ解除できない」と出たら×。催告解除は不適合が軽微でなければ可能。目的達成不能は無催告解除の要件。","「売主は自分が履行に着手していれば手付解除できない」と出たら×。基準は相手方の履行着手で、自ら着手していても解除可。"],"rel":["権利|債務不履行・解除","業法|8種制限","権利|不法行為・請負・委任"],"bridge":"民法では担保責任の免責特約も有効だが、宅建業者が自ら売主の8種制限では引渡しから2年以上とする通知期間特約を除き買主に不利な特約は無効。請負の不適合責任も売買の規定を準用する。","sys":{"overview":"債権各論の売買。契約不適合責任の4つの救済（追完・代金減額・損害賠償・解除）の要件の違いと、通知期間（知った時から1年）を押さえる。手付・買戻し・他人物売買や、宅建業法の8種制限・品確法との違いも頻出。","tree":[{"h":"契約不適合","items":["種類・品質・数量・権利の不適合","売主の帰責事由は損害賠償のみ必要","買主の帰責事由なら追完・減額・解除不可","媒介業者は担保責任を負わない"]},{"h":"4つの救済","items":["追完：修補・代替物・不足分の引渡し","代金減額：原則として追完の催告が必要","損害賠償：債務不履行の一般規定（415条）","解除：541・542条、軽微なら催告解除不可"]},{"h":"期間制限","items":["種類・品質：知った時から1年以内に通知","売主が悪意・重過失なら1年制限なし","数量・権利の不適合は1年制限の対象外","別に消滅時効（知った時5年・引渡し等から10年）"]},{"h":"特約","items":["担保責任免除特約も原則有効","知りながら告げない事実は免責されない","自ら設定・譲渡した権利も免責されない","業者が売主：通知期間を引渡しから2年以上は可"]},{"h":"手付","items":["解約手付と推定","買主は放棄、売主は倍額を現実に提供","相手方の履行着手まで解除できる","手付解除では損害賠償請求できない"]},{"h":"その他","items":["他人物売買も有効、売主は取得して移転","権利を失うおそれ→代金支払拒絶可（576条）","引渡し後の滅失・損傷は買主の負担（567条）","買戻し期間は10年以内、定めなし→5年以内"]}],"flow":{"title":"買主の救済手段の順","steps":["不適合が買主の帰責事由によらないか確認","まず追完（修補・代替物・不足分）を請求","追完の催告後も相当期間内に追完なし","代金減額請求か催告解除（軽微でなければ）","追完不能・明確な拒絶→無催告で減額・解除","売主に帰責事由あれば損害賠償も併せて請求","種類・品質は知った時から1年以内に通知"]},"tables":[{"title":"4つの救済手段","head":["手段","売主の帰責","催告","買主の帰責"],"rows":[["追完請求","不要","—","×"],["代金減額","不要","原則必要","×"],["損害賠償","必要","—","過失相殺"],["解除","不要","原則必要","×"]]},{"title":"期間制限の整理","head":["場面","期間"],"rows":[["種類・品質の不適合","知った時から1年以内に通知"],["売主が悪意・重過失","1年制限なし"],["数量・権利の不適合","1年制限なし（消滅時効のみ）"],["宅建業者が自ら売主","引渡しから2年以上の特約可"],["新築住宅（品確法）","構造耐力上主要部分等10年"]]},{"title":"手付解除の可否","head":["状況","手付解除"],"rows":[["相手方が履行に着手前","○"],["自分だけが履行に着手","○"],["相手方が履行に着手後","×"],["売主：倍額を口頭で提供のみ","×（現実の提供が必要）"]]}]}},"権利|保証・連帯債務":{"pts":["保証契約は書面（電磁的記録を含む）でしなければ効力を生じない。保証債務は主たる債務に付従する。","保証債務は元本・利息・違約金・損害賠償等に及ぶ。契約後に主債務の目的・態様が加重されても保証人の負担は加重されない。","通常の保証人には催告の抗弁権・検索の抗弁権があるが、連帯保証人にはない。連帯保証人には分別の利益もない。","個人根保証契約は極度額を定めなければ無効。事業用貸金等の個人保証は原則、契約前1か月以内の公正証書による意思表示が必要。","連帯債務で他の債務者に効力が及ぶ（絶対効）のは弁済・更改・相殺・混同。請求・免除・時効完成は原則として相対効。","他の連帯債務者が反対債権を有するときは、その者の負担部分の限度で履行を拒めるのみで、代わりに相殺はできない。","弁済した連帯債務者は、弁済額が自己の負担部分を超えなくても、各自の負担部分の割合に応じて求償できる（442条）。"],"traps":["「連帯債務者の1人への履行の請求は他の債務者にも効力を生ずる」と出たら×。2020年改正で請求は相対効となった。","「口頭の合意だけで保証契約が成立する」と出たら×。保証契約は書面又は電磁的記録でしなければ効力を生じない。","「連帯保証人は催告の抗弁権を有する」と出たら×。連帯保証人は催告・検索の抗弁権をいずれも有しない。"],"rel":["権利|抵当権・担保","権利|時効"],"bridge":"保証は人的担保、抵当権は物的担保で、保証人も物上保証人も弁済すれば求償できる。主債務の時効は保証人が援用でき、主債務者の承認による更新は保証人にも及ぶ（付従性）。","sys":{"overview":"債権総論の「多数当事者の債権債務」に属し、保証は人的担保の中心。保証人の抗弁・個人保証の保護、連帯債務の絶対効と求償を押さえれば得点できる。","tree":[{"h":"保証の成立","items":["書面又は電磁的記録でなければ無効","主債務が無効なら保証も無効（付従性）","債権譲渡で保証も移る（随伴性）","主債務者の承諾なくても保証人になれる"]},{"h":"保証の範囲","items":["元本・利息・違約金・損害賠償に及ぶ","後の主債務加重は保証人に及ばない","売買解除時の代金返還義務にも及ぶ（判例）","主債務者の時効更新は保証人にも及ぶ"]},{"h":"保証人の抗弁","items":["催告の抗弁権：まず主債務者へ請求せよ","検索の抗弁権：執行容易な財産から執行せよ","分別の利益：保証人数で頭割り","連帯保証人には上の3つがいずれもない"]},{"h":"個人保証の保護","items":["個人根保証は極度額の定めがないと無効","事業用貸金の個人保証は1か月内の公正証書","公正証書不要：取締役・過半数株主等","期限の利益喪失は知った時から2か月内に通知"]},{"h":"連帯債務","items":["各自が全額の履行義務を負う","絶対効：弁済・更改・相殺・混同","請求・免除・時効完成は相対効","他人の反対債権は負担部分まで履行拒絶のみ"]},{"h":"求償","items":["連帯債務：負担部分以下の弁済でも割合求償","保証人：弁済後に主債務者へ求償","事前・事後の通知を怠ると求償が制限"]}],"flow":null,"tables":[{"title":"保証・連帯保証・連帯債務","head":["項目","普通保証","連帯保証","連帯債務"],"rows":[["補充性","あり","なし","なし"],["催告の抗弁権","○","×","×"],["検索の抗弁権","○","×","×"],["分別の利益","○","×","―"],["書面の要否","必要","必要","不要"],["付従性","○","○","×（独立の債務）"]]},{"title":"連帯債務の影響関係","head":["1人に生じた事由","他の債務者への効力"],"rows":[["弁済・代物弁済","絶対効（全員消滅）"],["更改","絶対効"],["相殺（援用した場合）","絶対効"],["混同","絶対効"],["履行の請求","相対効（特約で絶対効可）"],["免除","相対効"],["時効の完成","相対効"]]},{"title":"個人保証の数字","head":["ルール","内容"],"rows":[["個人根保証の極度額","定めなければ無効"],["事業用貸金の個人保証","締結前1か月以内に公正証書"],["期限の利益喪失の通知","知った時から2か月以内"],["保証契約の方式","書面又は電磁的記録"]]}]}},"権利|不法行為・請負・委任":{"pts":["不法行為の損害賠償請求権は、損害及び加害者を知った時から3年（生命・身体侵害は5年）、不法行為の時から20年で時効消滅する。","使用者は事業の執行についての被用者の加害行為に責任を負う。使用者から被用者への求償、被用者から使用者への逆求償も相当額で認められる。","工作物責任は占有者が第一次的に負い、占有者が損害発生防止に必要な注意をしたときは所有者が無過失責任を負う。","請負人の契約不適合責任は、注文者が不適合を知った時から1年以内に通知が必要。注文者の材料・指図による不適合は原則責任なし。","注文者は仕事完成前ならいつでも損害を賠償して解除できる。完成前に解除等されても、注文者が受ける利益の割合に応じて報酬請求できる。","受任者は有償・無償を問わず善管注意義務を負う。報酬は特約がなければ請求できず、委任事務の中途終了なら履行割合に応じ請求できる。","委任は各当事者がいつでも解除できる。相手方に不利な時期の解除等は損害賠償が必要。委任者・受任者の死亡・破産で終了する。"],"traps":["「無償の受任者は自己の財産と同一の注意で足りる」と出たら×。委任は無償でも善管注意義務。自己の財産と同一の注意は無償寄託。","「工作物の所有者は過失がなければ責任を負わない」と出たら×。所有者の工作物責任は無過失責任。","「請負の不適合は引渡し時から1年以内に通知」と出たら×。起算点は注文者が不適合を知った時。"],"rel":["権利|売買・契約不適合","権利|時効"],"bridge":"請負の契約不適合責任は売買の規定を準用し、追完・減額・解除・損害賠償の枠組みは共通。不法行為の時効は一般の債権（5年・10年）と期間・起算点が異なる。","sys":{"overview":"民法債権各論の契約（請負・委任）と法定債権（不法行為）にまたがる論点。時効期間の数字、使用者・工作物責任の構造、請負と委任の報酬・解除・注意義務の違いが得点源。","tree":[{"h":"一般不法行為","items":["故意・過失による権利侵害で損害賠償","賠償は金銭が原則、遅滞は不法行為時から","過失相殺は裁判所の任意（必ずではない）","悪意・人身侵害の賠償債務は加害者から相殺不可"]},{"h":"特殊不法行為","items":["使用者責任：事業の執行についての加害","使用者→被用者の求償、逆求償も相当額","工作物責任：占有者→所有者（無過失責任）","共同不法行為者は連帯して全額を負う"]},{"h":"不法行為の時効","items":["知った時から3年（生命・身体は5年）","不法行為の時から20年","建物の安全性欠如は設計・施工者も責任（判例）"]},{"h":"請負","items":["報酬は仕事の目的物の引渡しと同時払","不適合は知った時から1年以内に通知","注文者の材料・指図による不適合は原則免責","完成前は注文者が損害賠償して解除可","未完成でも利益の割合に応じ報酬請求可"]},{"h":"委任","items":["有償・無償問わず善管注意義務","報酬は特約がなければ請求不可","中途終了は履行割合に応じ報酬請求可","費用の前払・償還請求ができる","いつでも解除可、不利な時期は損害賠償"]},{"h":"委任の終了事由","items":["委任者：死亡・破産","受任者：死亡・破産・後見開始","終了後も急迫の事情があれば必要な処分"]}],"flow":null,"tables":[{"title":"損害賠償請求権の時効","head":["種類","主観的起算点","客観的起算点"],"rows":[["一般の債権","知った時から5年","行使可能時から10年"],["人の生命・身体（債務不履行）","知った時から5年","行使可能時から20年"],["不法行為（物損等）","知った時から3年","不法行為時から20年"],["不法行為（生命・身体）","知った時から5年","不法行為時から20年"]]},{"title":"請負と委任の比較","head":["項目","請負","委任"],"rows":[["目的","仕事の完成","事務の処理"],["報酬","当然に有償","特約がなければ無償"],["報酬の時期","引渡しと同時","事務履行後（後払）"],["中途終了の報酬","利益の割合に応じ可","履行割合に応じ可"],["解除","注文者が完成前に可","各当事者いつでも可"],["契約不適合責任","○（売買準用）","×（債務不履行で処理）"]]},{"title":"特殊不法行為の責任者","head":["類型","第一次責任","免責の可否"],"rows":[["使用者責任","使用者","選任監督に注意で免責（実際上困難）"],["工作物責任","占有者","必要な注意をすれば免責"],["工作物責任（二次）","所有者","免責なし（無過失責任）"],["注文者の責任","原則負わない","注文・指図に過失あれば負う"]]}]}},"権利|賃貸借":{"pts":["民法上の賃貸借の存続期間は最長50年。借地借家法が適用される建物所有目的の土地賃貸借・建物賃貸借には別の規律がある。","賃貸人は修繕義務を負う（賃借人の帰責事由による場合を除く）。通知後相当期間修繕しない場合や急迫の事情では賃借人が修繕できる。","必要費は直ちに償還請求でき、有益費は賃貸借終了時に価格の増加が現存する場合に、支出額か増加額を賃貸人が選択して償還する。","無断譲渡・転貸は解除事由だが、背信的行為と認めるに足りない特段の事情があれば解除できない（判例）。","適法な転借人は賃貸人に直接義務を負う。合意解除は転借人に対抗できないが、債務不履行解除権があったときは対抗できる。","敷金は明渡し時に未払債務を控除して返還する。明渡しが先履行で、賃借人から敷金を未払賃料に充当するよう請求はできない。","賃借人は通常損耗・経年変化を除き原状回復義務を負う。対抗要件ある賃貸不動産の譲渡で賃貸人の地位は譲受人に移転する。"],"traps":["「賃借人は敷金を未払賃料に充てるよう請求できる」と出たら×。充当できるのは賃貸人のみ。","「無断転貸があれば賃貸人は常に解除できる」と出たら×。背信的行為と認めるに足りない特段の事情があれば解除できない。","「通常損耗も原状回復の対象」と出たら×。通常の使用収益で生じた損耗・経年変化は原状回復義務の対象外。"],"rel":["権利|借家","権利|借地","権利|物権変動・対抗"],"bridge":"建物賃貸借や建物所有目的の土地賃貸借には借地借家法が優先し、民法の規定は補充的に適用される。譲受人が賃貸人の地位を賃借人に主張するには所有権移転登記が必要。","sys":{"overview":"民法債権各論の典型契約の一つで、借地借家法の土台となる一般ルール。修繕・費用償還・転貸・敷金・賃貸人の地位移転を押さえ、使用貸借との違いも整理すれば得点できる。","tree":[{"h":"成立・期間","items":["諾成契約（書面不要）","存続期間は最長50年（超えれば50年）","期間の定めなし：土地1年・建物3か月で終了","処分権限のない者：土地5年・建物3年まで"]},{"h":"賃貸人の義務","items":["修繕義務（賃借人の帰責事由は除く）","通知後相当期間修繕なし→賃借人が修繕可","急迫の事情があれば賃借人が直ちに修繕可","必要費は直ちに償還請求"]},{"h":"賃借人の義務","items":["賃料支払（一部滅失等で当然減額）","用法遵守・善管注意で保管","通常損耗・経年変化を除き原状回復","損害賠償・費用償還は返還から1年以内"]},{"h":"譲渡・転貸","items":["無断譲渡・転貸は原則解除可","背信性なしの特段の事情なら解除不可","転借人は賃貸人に直接義務を負う","合意解除は転借人に対抗不可（例外あり）"]},{"h":"対抗・地位移転","items":["賃借権の登記で第三者に対抗","対抗要件あり→譲受人に地位が当然移転","譲受人の賃料請求には所有権移転登記要","敷金・費用償還債務も譲受人が承継"]},{"h":"敷金","items":["明渡し時に未払債務を控除して返還","明渡しが先履行（同時履行ではない）","賃借人から充当請求はできない","賃借権譲渡時は旧賃借人に返還"]}],"flow":{"title":"終了から敷金返還まで","steps":["期間満了・解約申入れ・解除で終了","賃借人が建物を明け渡す（先履行）","通常損耗を除き原状回復","未払賃料・損害を敷金から控除","残額を賃借人に返還"]},"tables":[{"title":"必要費と有益費","head":["項目","必要費","有益費"],"rows":[["例","雨漏り修理","改良工事"],["請求時期","直ちに","賃貸借終了時"],["償還額","支出額","支出額か増加額（賃貸人選択）"],["期間の猶予","なし","裁判所が許与できる"],["請求期限","返還から1年以内","返還から1年以内"]]},{"title":"賃貸借と使用貸借","head":["項目","賃貸借","使用貸借"],"rows":[["対価","有償","無償"],["契約の性質","諾成","諾成"],["修繕義務","貸主が負う","貸主は負わない"],["通常の必要費","貸主が負担","借主が負担"],["借主の死亡","相続される","終了する"],["第三者への対抗","登記等で可","不可"]]},{"title":"転貸借の終了と転借人","head":["原賃貸借の終了原因","転借人に対抗"],"rows":[["賃借人の債務不履行解除","○（催告不要）"],["合意解除","×"],["合意解除（不履行解除権あり）","○"],["期間満了（借家）","通知後6か月で対抗可"]]}]}},"権利|借地":{"pts":["借地権は建物所有目的の地上権又は土地賃借権。存続期間は30年以上で、定めがなければ30年。短い定めも30年となる。","合意更新の期間は最初の更新で20年以上、2回目以降は10年以上。建物がある場合の更新請求・使用継続には地主の正当事由ある異議が必要。","借地権は借地上の建物の登記で対抗でき、登記は借地権者本人名義であることが必要。滅失しても一定事項を掲示すれば2年間対抗できる。","更新がないとき借地権者は建物買取請求ができる。第三者が建物を取得し地主が譲渡を承諾しないときも買取請求できる。","地代の増減請求は可能。一定期間増額しない特約は有効だが、減額しない特約は無効で、減額請求できる。","一般定期借地権は50年以上で書面（電磁的記録含む）により、更新なし・建物築造による延長なし・買取請求なしを定められる。","事業用定期借地権は専ら事業用（居住用不可）で10年以上50年未満、公正証書による。建物譲渡特約付借地権は30年以上。"],"traps":["「家族名義の建物登記でも借地権を対抗できる」と出たら×。判例は借地権者本人名義の登記を要求する。","「事業用定期借地権は書面であれば公正証書でなくてもよい」と出たら×。事業用定期借地権の設定契約は公正証書によらなければならない。","「地代を減額しない特約は有効」と出たら×。増額しない特約のみ有効で、減額しない特約があっても減額請求できる。"],"rel":["権利|借家","権利|賃貸借","権利|物権変動・対抗"],"bridge":"借家は建物の引渡しで、借地は借地上の建物の登記で対抗力を得る。民法の賃貸借（最長50年）と異なり、借地権は30年以上で更新も保護される。","sys":{"overview":"民法の賃貸借・地上権の特別法である借地借家法のうち、建物所有目的の土地利用を扱う。存続期間と更新、対抗要件、建物買取請求、定期借地権3種の数字を押さえれば得点できる。","tree":[{"h":"存続期間","items":["当初30年以上（定めなし・短い定めは30年）","合意更新：1回目20年以上","2回目以降10年以上","一時使用目的は期間・更新の規定なし"]},{"h":"更新","items":["建物ありで更新請求→同一条件で更新（期間除く）","期間満了後の使用継続も同様","地主は遅滞なく異議＋正当事由で阻止","正当事由：必要性・経過・利用状況・立退料"]},{"h":"建物の滅失・再築","items":["承諾ある再築：承諾日等から20年延長","更新後の無承諾再築→地主は解約申入れ可","解約申入れから3か月で借地権消滅","更新後の滅失→借地権者も解約申入れ可"]},{"h":"対抗要件","items":["借地権の登記又は借地上の建物の登記","建物登記は借地権者本人名義が必要","表示登記でも可（判例）","滅失時は掲示で2年間対抗可"]},{"h":"建物買取・譲渡","items":["更新なし→借地権者が時価で買取請求","無承諾の建物取得者も地主へ買取請求","譲渡転貸は裁判所の代諾許可の制度あり","地代先取特権は最後の2年分"]},{"h":"定期借地権","items":["一般定期：50年以上・書面","事業用定期：10年以上50年未満・公正証書","建物譲渡特約付：30年以上","事業用は居住用建物（賃貸マンション）不可"]}],"flow":{"title":"期間満了〜建物買取請求","steps":["借地権の存続期間が満了","建物ありで更新請求or土地使用を継続","地主が遅滞なく異議を述べるか","異議に正当事由があるか","異議なし・正当事由なし→更新","正当事由あり→更新なく借地権消滅","借地権者が建物を時価で買取請求"]},"tables":[{"title":"借地権の種類","head":["種類","存続期間","方式"],"rows":[["普通借地権","30年以上","制限なし"],["一般定期借地権","50年以上","書面・電磁的記録"],["事業用定期借地権","10年以上50年未満","公正証書"],["建物譲渡特約付借地権","30年以上","制限なし"],["一時使用目的","規定なし","制限なし"]]},{"title":"普通借地と定期借地","head":["項目","普通借地","一般定期","事業用定期"],"rows":[["更新","○","×（特約）","×"],["再築による延長","○","×（特約）","×"],["建物買取請求","○","×（特約）","×"],["居住用建物","○","○","×"]]},{"title":"地代増減の特約","head":["特約","効力"],"rows":[["一定期間増額しない","有効"],["一定期間減額しない","無効（減額請求可）"],["協議不調の増額請求","相当額を払えば足りる"],["裁判確定後の差額","年1割の利息付き精算"]]}]}},"権利|借家":{"pts":["建物賃貸借は登記がなくても建物の引渡しで対抗できる。普通借家・定期借家のいずれにも適用される。","期間1年未満の普通借家は期間の定めがないものとみなす。賃貸人からの解約申入れは正当事由が必要で、申入れから6か月で終了する。","期間満了の1年前から6か月前までに更新拒絶等の通知をしないと、従前と同一条件（期間の定めなし）で更新したものとみなす。","定期借家は書面（電磁的記録含む）で契約し、事前に契約書とは別の書面で更新がない旨を説明する必要がある（承諾を得て電磁的方法も可）。","期間1年以上の定期借家では、期間満了の1年前から6か月前までに終了の通知をしなければ終了を賃借人に対抗できない。","床面積200㎡未満の居住用定期借家で、やむを得ない事情により使用困難なら賃借人は解約申入れでき、1か月後に終了する。","造作買取請求権は特約で排除できる。居住用建物の賃借人が相続人なく死亡したときは同居の事実上の配偶者等が承継する。"],"traps":["「定期建物賃貸借は公正証書でしなければならない」と出たら×。書面又は電磁的記録で足りる。","「造作買取請求権を排除する特約は無効」と出たら×。造作買取請求権の規定は任意規定で、排除特約は有効。","「定期借家でも賃料減額請求権は排除できない」と出たら×。賃料改定特約があれば借賃増減請求の規定は適用されない。"],"rel":["権利|借地","権利|賃貸借","業法|重要事項説明"],"bridge":"借家は建物の引渡しで対抗力を得るが、借地は建物登記が必要。定期借家の事前説明は賃貸人の義務で、宅建業者の重要事項説明とは別物（業者が代理する場合は兼ねられる）。","sys":{"overview":"借地借家法の建物賃貸借部分で、民法の賃貸借を修正し借家人を保護する。引渡しによる対抗力、更新拒絶と正当事由、解約申入れの期間、定期借家の要件と中途解約が得点源。","tree":[{"h":"適用・対抗","items":["建物の賃貸借全般に適用（一時使用除く）","引渡しで第三者に対抗（普通・定期共通）","譲受人には敷金返還債務も承継"]},{"h":"期間・更新","items":["1年未満の期間は定めなしとみなす","期間満了1年前〜6か月前に更新拒絶通知","通知なし→同一条件で法定更新（期間なし）","満了後の使用継続に遅滞なく異議が必要"]},{"h":"解約申入れ","items":["賃貸人から：正当事由要・6か月で終了","賃借人から：民法により3か月で終了","正当事由は立退料の申出で補完される"]},{"h":"定期借家","items":["書面又は電磁的記録で契約","契約書とは別の書面で事前説明","1年以上：1年前〜6か月前に終了通知","200㎡未満居住用はやむを得ず中途解約可","賃料改定特約で増減請求を排除可"]},{"h":"その他の保護","items":["造作買取請求（特約で排除可）","相続人なし→事実上の配偶者等が承継","転借人：原賃貸借終了の通知後6か月","取壊し予定建物：取壊し時終了特約（書面）"]}],"flow":{"title":"更新拒絶〜明渡し","steps":["期間満了1年前〜6か月前に通知","賃貸人の通知には正当事由が必要","通知なし・正当事由なし→法定更新","満了後の使用継続→遅滞なく異議","終了→造作買取請求（排除特約なし時）","明渡し後に敷金を精算・返還"]},"tables":[{"title":"普通借家と定期借家","head":["項目","普通借家","定期借家"],"rows":[["契約方式","制限なし","書面・電磁的記録"],["事前説明書面","不要","必要（別書面）"],["1年未満の期間","定めなしとみなす","有効"],["更新","あり（正当事由）","なし"],["賃料減額しない特約","無効","有効"],["賃借人の中途解約","特約による","200㎡未満居住用は可"]]},{"title":"借家の期間・数字","head":["場面","期間"],"rows":[["更新拒絶・終了通知","満了1年前〜6か月前"],["賃貸人の解約申入れ","6か月後に終了"],["賃借人の解約申入れ","3か月後に終了"],["定期借家の中途解約","申入れ1か月後に終了"],["遅れた終了通知","通知から6か月後に対抗可"],["転借人への終了通知","通知から6か月後に終了"]]},{"title":"特約の有効・無効","head":["特約","効力"],"rows":[["造作買取請求権の排除","有効"],["一定期間増額しない","有効"],["減額しない（普通借家）","無効"],["賃料改定特約（定期借家）","有効"],["正当事由なく更新しない","無効（普通借家）"]]}]}},"権利|区分所有法":{"pts":["共用部分は区分所有者全員の共有に属し、各共有者の持分は規約に別段の定めがない限り専有部分の床面積の割合による。","共用部分の保存行為は各共有者が単独でできる。負担は規約に別段の定めがない限り持分に応じて負う。","規約で管理者を共用部分の所有者（管理所有）とできる。管理者は少なくとも毎年1回集会を招集しなければならない。","規約・集会決議は区分所有者の特定承継人にも効力を生じ、占有者も建物等の使用方法について区分所有者と同一の義務を負う。","規約の設定・変更・廃止は集会の特別決議による。一部の区分所有者の権利に特別の影響を及ぼすときはその者の承諾が必要。","最初に専有部分の全部を所有する者は、公正証書で規約共用部分・規約敷地・敷地利用権の分離処分等に関する規約を設定できる。","議事録には議長及び集会に出席した区分所有者2人が署名する。招集手続は区分所有者全員の同意があれば省略できる。"],"traps":["「分譲業者は公正証書で法定共用部分を定める規約を設定できる」と出たら×。公正証書で設定できるのは規約共用部分等の一定事項のみ。","「集会の決議は買主など特定承継人には及ばない」と出たら×。規約・集会決議は特定承継人にも効力を生ずる。","「共用部分の持分は専有部分の価格の割合による」と出たら×。原則は床面積割合（内法で計算）で、規約で別段の定めも可。"],"rel":["権利|共有・相隣","業法|重要事項説明"],"bridge":"共用部分の管理には民法の共有規定でなく区分所有法の集会決議が適用される。区分所有建物の売買では、規約の定め（専用使用権・管理費等）が重要事項説明の追加項目になる。","sys":{"overview":"民法の共有の特別法で、マンションの専有部分・共用部分・敷地と管理組合運営を定める。2026年4月施行の改正で集会決議は原則「出席者の多数決」（定足数あり）となり、所在等不明者の除外や建替え要件の緩和が入った。決議要件の数字が得点源。","tree":[{"h":"専有・共用","items":["専有部分：構造上・利用上独立した部分","法定共用部分：廊下・階段室等","規約共用部分：集会室等、登記で対抗","持分は専有部分の床面積割合（内法）"]},{"h":"共用部分の管理","items":["保存行為：各共有者が単独で可","管理行為：出席者の過半数（普通決議）","重大な変更：出席者の3/4（人数は規約で減可）","耐震・外壁・配管・バリアフリー等は出席者の2/3","費用負担・収益は持分に応じる"]},{"h":"敷地・分離処分","items":["専有部分と敷地利用権の分離処分は原則禁止","規約で分離処分を可能にできる","最初の全部所有者は公正証書で一定の規約"]},{"h":"規約","items":["設定・変更・廃止は出席者の3/4","特別の影響を受ける者の承諾が必要","特定承継人にも効力、占有者も使用方法拘束","管理者等が保管し、利害関係人は閲覧可"]},{"h":"管理者・集会","items":["管理者は毎年1回以上集会を招集","1/5以上で招集請求（規約で減可）","通知は1週間前（建替えは2か月前）","通知には全ての議案の要領を示す","定足数：区分所有者・議決権の各過半数の出席","全員同意で招集手続を省略可","議事録：議長＋出席者2人が署名"]},{"h":"義務違反・建替え","items":["停止請求の訴え：普通決議","使用禁止・競売等：出席者の3/4＋弁明の機会","建替え：全体の4/5（一定の事由で3/4）","大規模滅失の復旧：出席者の3/4","所在等不明者は裁判所の決定で母数から除外"]}],"flow":{"title":"集会の招集〜議事録","steps":["管理者が招集（毎年1回以上）","1/5以上の請求でも招集","会日の1週間前までに通知","全員同意なら招集手続を省略可","定足数（各過半数の出席）を満たし決議","議長＋出席者2人が議事録に署名"]},"tables":[{"title":"主な決議要件","head":["事項","決議要件","規約で別段"],"rows":[["共用部分の管理","出席者の過半数","○"],["共用部分の重大変更","出席者の3/4（一定事由2/3）","人数のみ過半数まで減"],["規約の設定・変更・廃止","出席者の3/4","×"],["管理組合法人の設立","出席者の3/4","×"],["使用禁止・競売請求","出席者の3/4","×"],["大規模滅失の復旧","出席者の3/4","×"],["建替え","全体の4/5（一定事由3/4）","×"]]},{"title":"集会の数字","head":["項目","内容"],"rows":[["決議の定足数","区分所有者・議決権の各過半数"],["定期集会","毎年1回以上"],["少数区分所有者の招集請求","1/5以上（規約で減可）"],["招集通知","1週間前（規約で伸縮可）"],["招集通知の記載","全議案の要領を示す"],["建替え決議の通知","2か月前（規約で伸長のみ）"],["建替えの説明会","会日の1か月前まで"],["議事録の署名","議長＋出席者2人"]]},{"title":"単独・集会・承諾の区別","head":["行為","方法"],"rows":[["共用部分の保存行為","各自単独"],["小規模滅失の復旧","決議前は各自単独可"],["規約変更で特別の影響","その者の承諾必要"],["招集手続の省略","区分所有者全員の同意"],["書面・電磁的方法の決議","全員の承諾が必要"],["所在等不明区分所有者","裁判所の決定で母数から除外"]]}]}},"権利|不動産登記法":{"pts":["表示に関する登記は1か月以内の申請義務がある（新築建物の表題登記、建物の滅失登記など）。登記官は職権でもできる。","権利に関する登記は登記権利者と登記義務者の共同申請が原則。判決・相続・合併・相続人への遺贈は単独申請できる。","相続登記は2024年4月から義務化。相続による取得を知った日から3年以内に申請が必要で、正当な理由なく怠ると過料の対象となる。","申請期限内に相続人である旨を申し出る相続人申告登記により、相続登記の申請義務を履行したものとみなされる。","所有権の登記名義人の住所・氏名の変更登記も2026年4月から義務化され、変更日から2年以内に申請しなければならない。","共同申請では登記義務者の登記識別情報の提供が必要。資格者代理人による申請でも、提供できない正当な理由がない限り省略できない。","所有権登記名義人等が異なる土地や、地目・地番区域が異なる土地は合筆できない。分筆は原則として申請によりできる。"],"traps":["「相続人以外への遺贈による所有権移転登記は受遺者が単独で申請できる」と出たら×。単独申請は相続人への遺贈に限る。","「権利に関する登記には一般に申請義務がない」と出たら要注意。相続登記・住所等変更登記は申請義務がある。","「建物の合併の登記は抵当権者も申請できる」と出たら×。申請人は表題部所有者又は所有権の登記名義人に限られる。"],"rel":["権利|物権変動・対抗","権利|相続"],"bridge":"物権変動の対抗要件が登記で、不動産登記法はその申請手続を定める。相続の効果は民法、相続登記の申請義務と期限は不動産登記法と分けて押さえる。","sys":{"overview":"民法の物権変動の対抗要件である登記の手続法。表示登記と権利登記の区別、共同申請と単独申請の例外、相続登記・住所等変更登記の申請義務、合筆・分筆の制限が得点源。","tree":[{"h":"登記簿の構成","items":["表題部：物理的現況（所在・地目・床面積等）","権利部甲区：所有権に関する事項","権利部乙区：所有権以外の権利（抵当権等）","何人も手数料で登記事項証明書を請求可"]},{"h":"表示に関する登記","items":["表題登記・滅失登記等は1か月以内に申請","登記官は職権でも登記できる","一部地目変更の土地は職権で分筆可","合筆制限：所有者・地目・地番区域の相違"]},{"h":"権利に関する登記","items":["原則は共同申請（権利者＋義務者）","単独：判決・相続・合併・相続人への遺贈","買戻し特約は10年経過で権利者単独抹消","仮登記は義務者の承諾があれば単独可"]},{"h":"申請義務","items":["相続登記：知った日から3年以内","相続人申告登記で義務履行とみなす","住所・氏名変更：変更日から2年以内","正当な理由なく怠ると過料","施行前の住所変更は2028年3月末までに申請"]},{"h":"添付情報","items":["登記原因証明情報","登記義務者の登記識別情報（代理でも要）","提供不可→事前通知か本人確認情報","所有権登記義務者は印鑑証明書（書面申請）"]}],"flow":{"title":"権利の登記申請の流れ","steps":["登記原因（売買・相続等）が発生","申請方式を判断（共同か単独か）","申請情報と添付情報を準備","書面又はオンラインで登記所に申請","登記官が審査し登記を実行","新名義人に登記識別情報を通知"]},"tables":[{"title":"申請義務と期限","head":["登記","期限","義務違反"],"rows":[["土地・建物の表題登記","1か月以内","過料"],["建物の滅失登記","1か月以内","過料"],["地目・床面積等の変更","1か月以内","過料"],["相続による所有権移転","知った日から3年","10万円以下の過料"],["住所・氏名の変更","変更日から2年","5万円以下の過料"],["売買等の所有権移転","義務なし","―"]]},{"title":"単独申請できる登記","head":["登記","単独申請"],"rows":[["相続・法人の合併","○"],["相続人への遺贈","○"],["相続人以外への遺贈","×（共同申請）"],["判決による登記","○"],["登記名義人の住所等変更","○"],["10年経過後の買戻し特約抹消","○"],["仮登記（義務者の承諾書）","○"]]},{"title":"合筆・分筆の可否","head":["状況","合筆","分筆"],"rows":[["所有者が異なる","×","―"],["地目・地番区域が異なる","×","―"],["所有権以外の権利登記あり","原則×","○"],["一部が別地目になった","―","職権でも可"]]}]}},"権利|相続":{"pts":["法定相続分は、配偶者と子で各1/2、配偶者と直系尊属で2/3と1/3、配偶者と兄弟姉妹で3/4と1/4。","代襲原因は相続開始以前の死亡・欠格・廃除で、相続放棄は含まれない。子の系統は再代襲あり、兄弟姉妹は甥・姪までで再代襲なし。","相続放棄・限定承認は自己のために相続開始を知った時から3か月以内に家庭裁判所に申述する。限定承認は共同相続人全員で行う。","遺留分は兄弟姉妹以外に認められ、総体的遺留分は直系尊属のみが相続人なら1/3、それ以外は1/2。侵害額は金銭で請求する。","遺留分の放棄は相続開始前でも家庭裁判所の許可で可能だが、相続放棄は相続開始前にはできない。遺留分放棄後も相続人の地位は残る。","自筆証書遺言は全文・日付・氏名を自書し押印するが、財産目録は自書不要（各頁に署名押印）。法務局で保管すれば検認不要。","配偶者居住権は遺産分割・遺贈等で取得し、期間の定めがなければ終身。遺言で5年を超えない期間で遺産分割を禁止できる。"],"traps":["「相続放棄をした者の子が代襲相続する」と出たら×。相続放棄は代襲原因にならない。","「兄弟姉妹にも遺留分がある」と出たら×。遺留分は兄弟姉妹以外の相続人にのみ認められる。","「遺留分を放棄した者は相続人でなくなる」と出たら×。遺留分を放棄しても相続はでき、相続放棄とは別の制度。"],"rel":["権利|不動産登記法","権利|物権変動・対抗","税他|所得税・譲渡"],"bridge":"相続で取得した不動産は3年以内の相続登記が義務で、法定相続分を超える取得は登記がなければ第三者に対抗できない。譲渡所得では相続人が被相続人の取得費・取得時期を引き継ぐ。","sys":{"overview":"民法第5編の相続法で、相続人と相続分、承認・放棄、遺産分割、遺言、遺留分、配偶者居住権からなる。法定相続分と遺留分の数字、代襲の可否、期間制限を押さえれば得点できる。","tree":[{"h":"相続人","items":["配偶者は常に相続人","第1順位子→第2直系尊属→第3兄弟姉妹","代襲原因：死亡・欠格・廃除（放棄は×）","子は再代襲あり、兄弟姉妹は甥姪まで"]},{"h":"相続分","items":["配偶者と子：1/2ずつ","配偶者と直系尊属：2/3と1/3","配偶者と兄弟姉妹：3/4と1/4","半血の兄弟姉妹は全血の1/2"]},{"h":"承認・放棄","items":["知った時から3か月以内に選択","放棄・限定承認は家庭裁判所に申述","限定承認は共同相続人全員で","財産処分・期間経過で単純承認とみなす","相続開始前の放棄はできない"]},{"h":"遺産分割","items":["協議→調停→審判","効力は相続開始時に遡る","遺言で5年以内の分割禁止可","開始10年後は原則法定相続分で分割"]},{"h":"遺言","items":["15歳以上で作成可、いつでも撤回可","自筆：全文・日付・氏名自書＋押印","財産目録は自書不要（各頁署名押印）","公正証書・法務局保管の自筆は検認不要"]},{"h":"遺留分・居住権","items":["兄弟姉妹以外、全体で1/2（尊属のみ1/3）","侵害額は金銭で請求（1年・10年）","開始前の遺留分放棄は家裁許可で可","配偶者居住権：定めなければ終身","配偶者短期居住権：最低6か月"]}],"flow":{"title":"相続開始〜登記・遺留分","steps":["被相続人の死亡で相続開始","相続人・遺産・遺言の有無を調査","3か月内に承認・限定承認・放棄","遺言があれば検認（不要な方式あり）","遺産分割協議（不調なら調停・審判）","知った日から3年内に相続登記","侵害があれば遺留分侵害額請求"]},"tables":[{"title":"法定相続分と遺留分","head":["相続人","法定相続分","個別の遺留分"],"rows":[["配偶者のみ","全部","1/2"],["配偶者＋子","1/2・1/2","1/4・1/4"],["配偶者＋直系尊属","2/3・1/3","1/3・1/6"],["配偶者＋兄弟姉妹","3/4・1/4","1/2・なし"],["子のみ","全部","1/2"],["直系尊属のみ","全部","1/3"],["兄弟姉妹のみ","全部","なし"]]},{"title":"相続放棄と遺留分放棄","head":["項目","相続放棄","遺留分放棄"],"rows":[["開始前","×","○（家裁の許可）"],["開始後","3か月内に家裁へ申述","自由（意思表示）"],["相続人の地位","初めから相続人でない","相続人のまま"],["代襲相続","生じない","―"],["他の相続人への影響","相続分が増える","増えない"]]},{"title":"遺言の方式","head":["項目","自筆証書","公正証書"],"rows":[["作成者","本人が自書","公証人"],["証人","不要","2人以上"],["検認","必要（法務局保管は不要）","不要"],["財産目録","自書不要（署名押印）","―"]]}]}},"法令|都市計画法":{"pts":["都市計画区域は原則都道府県が指定（2以上の都府県にわたる場合は国土交通大臣）。区域外にも準都市計画区域を指定できる。","市街化区域はすでに市街地を形成している区域とおおむね10年以内に優先的・計画的に市街化を図るべき区域、市街化調整区域は市街化を抑制すべき区域。","市街化区域には少なくとも用途地域を定め、市街化調整区域には原則として用途地域を定めない。用途地域は13種類。","高度地区は用途地域内で高さの最高限度・最低限度を定め、高度利用地区は容積率の最高・最低限度、建蔽率の最高限度等を定める。","特定用途制限地域は、用途地域が定められていない土地の区域（市街化調整区域を除く）に定める。","準都市計画区域では用途地域・特別用途地区・特定用途制限地域・高度地区（最高限度）・景観地区・風致地区等を定められる。","地区計画は用途地域内のほか一定の用途地域外にも定められ、地区整備計画区域内での建築等は着手30日前までに市町村長へ届出。"],"traps":["「準都市計画区域に高度利用地区・防火地域を定められる」と出たら×。準都市計画区域で高度利用地区・防火地域・準防火地域は定められない。","「高度地区では容積率の最高限度を定める」と出たら×。高度地区は高さ、容積率を定めるのは高度利用地区。","「都市施設は都市計画区域外に定めることはできない」と出たら×。特に必要があるときは区域外にも定められる。"],"rel":["法令|開発許可","法令|建築基準法"],"bridge":"都市計画法で決めた区域区分が開発許可の要否面積を、用途地域が建築基準法の用途制限・建蔽率・容積率を決める。都市計画で枠を作り、開発許可と建築確認で個々の行為を規制する。","sys":{"overview":"法令上の制限の土台となる法律。区域（都市計画区域・準都市計画区域・区域区分）→地域地区→都市施設・市街地開発事業・地区計画→決定手続→都市計画制限の順で整理し、どの区域に何を定められるかを押さえる。","tree":[{"h":"区域の指定","items":["都市計画区域：原則都道府県が指定","2以上の都府県にわたる区域は国土交通大臣","準都市計画区域：区域外に都道府県が指定","区域区分（線引き）は都市計画区域のみ"]},{"h":"区域区分","items":["市街化区域：既成市街地＋概ね10年以内に市街化","市街化調整区域：市街化を抑制すべき区域","市街化区域は用途地域を必ず定める","調整区域は原則用途地域を定めない"]},{"h":"地域地区","items":["用途地域13種：住居系8・商業系2・工業系3","高度地区：高さの最高・最低限度","高度利用地区：容積率・建蔽率・建築面積","特定用途制限地域：用途地域外（調整区域除く）","防火・準防火地域は準都市計画区域に不可"]},{"h":"施設・事業","items":["都市施設：特に必要なら区域外にも可","市街化区域・非線引区域は道路・公園・下水道必須","住居系用途地域には義務教育施設も定める","市街地開発事業：市街化区域か非線引区域のみ"]},{"h":"地区計画","items":["用途地域内＋一定の用途地域外に定められる","地区整備計画は特別な事情があれば省略可","建築等は着手30日前までに市町村長へ届出","勧告はできるが許可制ではない"]},{"h":"都市計画制限","items":["都市計画施設等の区域内の建築は知事等の許可","2階以下・地階なしで移転容易なら必ず許可","事業地内の建築・土地形質変更は知事等の許可","事業地内の有償譲渡は施行者へ事前届出"]}],"flow":{"title":"都市計画の決定手続","steps":["原案作成（必要に応じ公聴会等）","決定しようとする旨を公告し2週間縦覧","住民・利害関係人が意見書を提出","都市計画審議会の議を経る","市町村決定は知事に協議（都道府県は一定で大臣同意）","決定を告示（告示の日から効力）","図書を公衆の縦覧に供する"]},"tables":[{"title":"準都市計画区域で定められるか","head":["地域地区等","可否"],"rows":[["用途地域・特別用途地区","○"],["特定用途制限地域","○"],["高度地区","○（最高限度のみ）"],["景観地区・風致地区","○"],["高度利用地区","×"],["防火地域・準防火地域","×"],["区域区分・市街地開発事業","×"],["地区計画","×"],["都市施設","○"]]},{"title":"高度地区と高度利用地区","head":["項目","高度地区","高度利用地区"],"rows":[["定める場所","用途地域内","用途地域内"],["定める内容","高さの最高・最低限度","容積率の最高・最低限度等"],["その他","—","建蔽率の最高限度・建築面積の最低限度"],["準都市計画区域","最高限度のみ○","×"]]},{"title":"用途地域の分類","head":["系統","用途地域"],"rows":[["住居系（8）","一低・二低・一中高・二中高"],["住居系（続き）","一住・二住・準住居・田園住居"],["商業系（2）","近隣商業・商業"],["工業系（3）","準工業・工業・工業専用"]]}]}},"法令|開発許可":{"pts":["開発行為は、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更。建築のみなら許可不要。","許可不要の規模は市街化区域1,000㎡未満（三大都市圏の一定区域は500㎡未満）、非線引き・準都市計画区域3,000㎡未満、区域外1ha未満。","市街化区域以外では農林漁業用建築物・農林漁業者の住宅のための開発行為は許可不要。市街化区域では規模要件で判断する。","駅舎・図書館・公民館・変電所など公益上必要な建築物や、都市計画事業・土地区画整理事業等の施行として行う開発行為は許可不要。","申請前に既存の関係公共施設の管理者と協議し同意を得る。新設される公共施設の管理者となる者とは協議が必要。","工事完了公告前は原則建築不可だが、工事用仮設建築物、知事が支障なしと認めたもの、開発に同意していない土地所有者等の建築は可。","相続等の一般承継人は地位を当然に承継し、特定承継は知事の承認が必要。自己業務用でも災害レッドゾーンは原則除外される。"],"traps":["「病院・学校の建築

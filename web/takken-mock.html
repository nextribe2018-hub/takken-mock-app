間の敷地の賃料相当額もAに支払う必要はない。","a":0,"e":"引渡しは拒めるが、その間の敷地占有による賃料相当額は不当利得として返還しなければならない（判例）。","m":"留置OKでも地代相当額は払う"},{"f":"権利","t":"借地","ref":"R07-11-1","s":"AがBに建物所有目的で甲土地を賃貸し、Bが甲土地上に乙建物を所有している場合、乙建物についてBの配偶者名義で所有権の登記をしていても、Bは甲土地の借地権を第三者に対抗することができる。","a":0,"e":"借地権の対抗要件となる建物登記は借地権者本人名義でなければならず、家族名義では対抗できない（判例）。","m":"建物登記は借地人本人名義"},{"f":"権利","t":"借地","ref":"R07-11-3","s":"AがBとの間で、Bの事業の用に供する建物を所有する目的で、存続期間を50年とする甲土地の借地契約を締結する場合、契約の更新及び建物の築造による存続期間の延長がなく、建物買取請求をしない旨を書面で定めることができる。","a":1,"e":"存続期間50年以上なら、書面により一般定期借地権として3つの特約を定めることができる（借地借家法22条）。","m":"50年以上は一般定期借地OK"},{"f":"権利","t":"借地","ref":"R03s-11-3","s":"Bが、Aから借りた甲土地の上に所有する乙建物について登記をしている場合において、Bが借地権を第三者に対抗することができるのは、乙建物の登記に敷地として表示された土地に限られる。","a":1,"e":"建物登記による対抗力は、登記に所在地番として記載された土地にのみ及ぶ（判例）。","m":"対抗力は登記記載の土地のみ"},{"f":"権利","t":"借地","ref":"R03s-11-4","s":"AがBに建物所有目的で甲土地を賃貸している場合、Aは、弁済期が到来した最後の3年分の地代について、Bが甲土地上に所有する建物の上に先取特権を有する。","a":0,"e":"先取特権の対象は弁済期の到来した最後の2年分の地代等である（借地借家法12条）。","m":"地代の先取特権は2年分"},{"f":"権利","t":"借地","ref":"R05-11-1","s":"AがBのために普通借地権を設定する契約において、「当初10年間は地代を減額しない」旨の特約を定めた場合には、その期間内は、Bは、Aに対して地代の減額を請求することができない。","a":0,"e":"地代を増額しない特約は有効だが、減額しない特約は無効であり、減額請求できる（借地借家法11条1項）。","m":"借地は不増額特約のみ有効"},{"f":"権利","t":"借家","ref":"R06-12-1","s":"Aが所有する甲建物をBに賃貸して引き渡した後、Aが甲建物をCに売却した場合、AB間の賃貸借が普通建物賃貸借であればBは賃借権をCに対抗できるが、定期建物賃貸借であれば対抗することができない。","a":0,"e":"引渡しによる対抗力は普通借家・定期借家のいずれにも認められる（借地借家法31条）。","m":"引渡しで定期も普通も対抗可"},{"f":"権利","t":"借家","ref":"R06-12-2","s":"Aが所有する甲建物をBに賃貸する契約において、賃料を改定しない旨の特約を定めた場合であっても、その契約が定期建物賃貸借、普通建物賃貸借のいずれであるかを問わず、Bは借賃の減額を請求することができる。","a":0,"e":"定期借家では賃料改定特約があれば借賃増減請求権の規定は適用されず、減額請求できない（借地借家法38条9項）。","m":"定期借家は改定特約が優先"},{"f":"権利","t":"借家","ref":"R06-12-3","s":"Aが所有する居住用の甲建物をBが賃借し、BがCと事実上の夫婦として同居していた場合において、Bが相続人なく死亡したときは、定期建物賃貸借か普通建物賃貸借かを問わず、Cは賃借人の権利義務を承継する。","a":1,"e":"居住用建物では、相続人がいなければ同居の内縁配偶者等が権利義務を承継する（借地借家法36条）。反対の意思表示も可。","m":"相続人なしなら内縁が承継"},{"f":"権利","t":"借家","ref":"R06-12-4","s":"AがBとの間で甲建物について定期建物賃貸借契約を締結し、契約の更新がない旨を定める場合には、その契約は公正証書によってしなければならない。","a":0,"e":"公正証書に限らず、書面（電磁的記録含む）で契約すれば足りる（借地借家法38条1項）。","m":"定期借家は書面で足りる"},{"f":"権利","t":"借家","ref":"R04-12-3","s":"AがBに対して床面積200㎡未満の居住用建物を定期建物賃貸借により賃貸した場合において、転勤等のやむを得ない事情により建物の使用が困難となったときは、Bは中途解約の申入れをすることができる。","a":1,"e":"やむを得ない事情で使用困難となれば解約申入れができ、申入れから1か月で終了する（借地借家法38条7項）。","m":"200㎡未満居住用は中途解約可"},{"f":"権利","t":"借家","ref":"R07-12-3","s":"Aが所有する甲建物をBに賃貸する契約において、BがAの同意を得て甲建物に付加した造作について、Bが造作買取請求権を行使しない旨の特約を定めた場合、その特約は有効である。","a":1,"e":"造作買取請求権の規定は任意規定であり、排除特約は有効（借地借家法37条で強行規定から除外）。","m":"造作買取は特約で排除OK"},{"f":"権利","t":"借家","ref":"R07-12-4","s":"法令により一定の期間を経過した後に取り壊すことが明らかな建物をAがBに賃貸する場合において、建物を取り壊すこととなる時に賃貸借が終了する旨の特約を定めるときは、その特約は公正証書によってしなければならない。","a":0,"e":"取壊し事由を記載した書面（電磁的記録含む）で足り、公正証書である必要はない（借地借家法39条）。","m":"取壊し予定特約は書面で可"},{"f":"権利","t":"借家","ref":"R03-12-1","s":"Aが所有する甲建物をBに期間の定めなく賃貸している場合において、Aが解約の申入れをしたときは、その賃貸借は、解約の申入れの日から3か月を経過することによって終了する。","a":0,"e":"賃貸人からの解約申入れは正当事由を要し、申入れから6か月経過で終了する（借地借家法27条・28条）。","m":"貸主の解約申入れは6か月"},{"f":"権利","t":"借家","ref":"R03-12-2","s":"Aが所有する甲建物をBに賃貸して引き渡し、BがAに敷金を交付していた場合において、Aが甲建物をCに売却したときは、敷金はBの未払賃料に充当され、その残額がCに承継される。","a":1,"e":"賃貸人の地位がCに移転し、敷金は未払賃料等に充当された残額が承継される（判例、民法605条の2）。","m":"敷金は充当後の残額が承継"},{"f":"権利","t":"区分所有法","ref":"R07-13-1","s":"区分所有建物の共用部分は、原則として区分所有者全員の共有に属するが、規約で特別の定めをすれば、管理者を共用部分の所有者とすることもできる。","a":1,"e":"規約に特別の定めがあれば管理者を共用部分の所有者とすること（管理所有）ができる（区分所有法11条2項・27条）。","m":"規約で管理者の管理所有可"},{"f":"権利","t":"区分所有法","ref":"R07-13-3","s":"区分所有建物の集会の議事録が書面で作成されているときは、議長及び集会に出席した区分所有者の全員が、その議事録に署名しなければならない。","a":0,"e":"署名は議長及び集会に出席した区分所有者の2人で足りる（区分所有法42条3項）。","m":"議事録署名は議長＋2人"},{"f":"権利","t":"区分所有法","ref":"R06-13-1","s":"Aマンションの共用部分を区分所有者全員で共有している場合において、共用部分に対する各共有者の持分は、規約に別段の定めがない限り、共有者の数に応じて等しい割合となる。","a":0,"e":"持分は規約に別段の定めがない限り専有部分の床面積の割合による（区分所有法14条1項）。","m":"持分は床面積割合"},{"f":"権利","t":"区分所有法","ref":"R06-13-2","s":"区分所有者Aが専有部分をBに売却した場合、その区分所有建物の規約及び集会の決議は、特定承継人であるBに対しても効力を生ずる。","a":1,"e":"規約・集会決議は特定承継人（買主など）にも効力が及ぶ（区分所有法46条1項）。","m":"規約・決議は買主にも及ぶ"},{"f":"権利","t":"区分所有法","ref":"R05-13-2","s":"区分所有建物において集会を開こうとする場合、区分所有者の4分の3以上の同意があるときは、管理者は、会日の通知など招集の手続を経ないで集会を開くことができる。","a":0,"e":"招集手続の省略には区分所有者全員の同意が必要である（区分所有法36条）。","m":"招集省略は全員同意"},{"f":"権利","t":"区分所有法","ref":"R05-13-3","s":"区分所有建物の共用部分について、その保存行為は、規約に別段の定めがない限り、集会の決議を経ることなく各共有者がすることができる。","a":1,"e":"保存行為は各共有者が単独ですることができる（区分所有法18条1項ただし書）。","m":"保存行為は各自単独で"},{"f":"権利","t":"区分所有法","ref":"R04-13-1","s":"区分所有建物の管理者が、規約により、その職務に関して区分所有者のために原告となって訴えを提起したときは、管理者は、各区分所有者にその旨を通知する必要はない。","a":0,"e":"規約により原告・被告となったときは、遅滞なく区分所有者に通知しなければならない（区分所有法26条5項）。","m":"規約で訴訟したら通知必要"},{"f":"権利","t":"区分所有法","ref":"R04-13-2","s":"区分所有建物に管理者がないときは、区分所有者の5分の1以上で議決権の5分の1以上を有するものが集会を招集することができ、この定数は規約で減ずることができる。","a":1,"e":"管理者がないときは5分の1以上の者が招集でき、その定数は規約で減ずることができる（区分所有法34条5項）。","m":"管理者不在は1/5で招集"},{"f":"権利","t":"区分所有法","ref":"R03s-13-2","s":"新築マンションの分譲業者Aのように、最初に建物の専有部分の全部を所有する者は、公正証書により、廊下や階段室などの法定共用部分を共用部分とする旨の規約を設定することができる。","a":0,"e":"公正証書で設定できるのは規約共用部分などに関する規約であり、法定共用部分を定める規約は設定できない（区分所有法32条）。","m":"公正証書規約に法定共用部分なし"},{"f":"権利","t":"区分所有法","ref":"R02-13-2","s":"Aマンションの共用部分を区分所有者全員で共有している場合において、共用部分の管理に要する費用は、規約に別段の定めがない限り、各共有者が等しい割合で負担する。","a":0,"e":"各共有者は規約に別段の定めがない限り、その持分に応じて負担する（区分所有法19条）。","m":"管理費は持分に応じて"},{"f":"権利","t":"不動産登記法","ref":"R07-14-1","s":"Aが所有する一筆の甲土地の一部が別の地目となった場合であっても、登記官は、職権で甲土地について分筆の登記をすることはできない。","a":0,"e":"一部が別地目となったときは、登記官は職権で分筆の登記をしなければならない（不動産登記法39条2項）。","m":"一部別地目は職権分筆"},{"f":"権利","t":"不動産登記法","ref":"R07-14-4","s":"Aが所有する甲建物と乙建物とを一個の建物とするための建物の合併の登記は、表題部所有者又は所有権の登記名義人以外の者は申請することができない。","a":1,"e":"建物の合併の登記の申請人は表題部所有者又は所有権の登記名義人に限られる（不動産登記法54条1項）。","m":"合併登記は所有者のみ申請"},{"f":"権利","t":"不動産登記法","ref":"R06-14-1","s":"AがBに甲土地を売却する際に買戻しの特約をし、その旨の登記がされた場合において、売買契約の日から10年を経過したときは、登記権利者は、単独で当該買戻しの特約の登記の抹消を申請することができる。","a":1,"e":"契約日から10年経過した買戻し特約の登記は、登記権利者が単独で抹消申請できる（不動産登記法69条の2）。","m":"買戻し登記は10年で単独抹消"},{"f":"権利","t":"不動産登記法","ref":"R06-14-3","s":"Aが自己所有の甲土地を相続人ではないBに遺贈した場合、Aの死亡後、甲土地についての遺贈による所有権移転の登記は、受遺者Bが単独で申請することができる。","a":0,"e":"単独申請できるのは相続人に対する遺贈の場合であり、相続人以外への遺贈は共同申請が原則（不動産登記法63条3項）。","m":"単独申請は相続人への遺贈のみ"},{"f":"権利","t":"不動産登記法","ref":"R05-14-1","s":"Aが所有権の登記名義人である甲建物が火災により滅失したときは、Aは、滅失の日から1か月以内に、甲建物の滅失の登記を申請しなければならない。","a":1,"e":"建物の滅失の登記は滅失の日から1か月以内に申請しなければならない（不動産登記法57条）。","m":"建物滅失登記は1か月以内"},{"f":"権利","t":"不動産登記法","ref":"R05-14-2","s":"登記簿の附属書類のうち、Aが所有権移転の登記を申請した際の申請書については、何人も、正当な理由の有無にかかわらず、手数料を納付すれば閲覧することができる。","a":0,"e":"申請書の閲覧は、請求人に正当な理由があると認められる部分に限られる（不動産登記法121条3項）。","m":"申請書閲覧は正当理由が必要"},{"f":"権利","t":"不動産登記法","ref":"R04-14-2","s":"AがBに甲土地を売却し、資格者代理人に依頼して所有権移転の登記を申請する場合には、登記義務者Aの登記識別情報を提供する必要はない。","a":0,"e":"資格者代理人による申請でも登記識別情報の提供は必要であり、正当な理由がある場合に限り不要となる（不動産登記法22条）。","m":"代理人申請でも識別情報必要"},{"f":"権利","t":"不動産登記法","ref":"R03s-14-1","s":"Aが表題登記のされていない甲土地の所有権を取得した場合、Aは、その所有権の取得の日から1か月以内に、甲土地の表題登記を申請しなければならない。","a":1,"e":"表題登記のない土地の所有権取得者には1か月以内の表題登記の申請義務がある（不動産登記法36条）。","m":"土地表題登記は1か月以内"},{"f":"権利","t":"不動産登記法","ref":"R02s-14-2","s":"Aが所有する甲土地に、所有権の登記以外の権利に関する登記がされているときは、Aは、甲土地について分筆の登記をすることができない。","a":0,"e":"そのような制限があるのは合筆の登記であり、分筆の登記はすることができる（不動産登記法41条）。","m":"制限は合筆、分筆はOK"},{"f":"権利","t":"相続","ref":"R04-02-1","s":"Aには子B及びCがいる。Bは、Aの生前であっても、家庭裁判所の許可を受ければ、将来のAの相続についての遺留分を放棄することができる。","a":1,"e":"相続開始前の遺留分の放棄は家庭裁判所の許可を受けたときに限り効力を生ずる（民法1049条1項）。","m":"生前の遺留分放棄は家裁許可"},{"f":"権利","t":"相続","ref":"R04-02-2","s":"Aには子B及びCがいる。Bは、Aの生前に、家庭裁判所に対して将来のAの相続についての相続放棄の申述をすることはできない。","a":1,"e":"相続放棄は相続開始後にのみでき、生前の相続放棄は認められない（民法915条・938条）。","m":"相続放棄は生前不可"},{"f":"権利","t":"相続","ref":"R04-02-3","s":"Aには子B及びCがいる。Bが、Aの生前に家庭裁判所の許可を受けて遺留分を放棄した場合、Bは、その後に開始したAの相続において遺産を相続する権利を失う。","a":0,"e":"遺留分を放棄しても相続人の地位は失わず、遺産を相続することはできる。","m":"遺留分放棄≠相続放棄"},{"f":"権利","t":"相続","ref":"R04-02-4","s":"Aが遺言で全財産を友人Dに遺贈して死亡し、Aの相続人がAの配偶者Bと兄Cである場合、兄弟姉妹であるCには遺留分がない。","a":1,"e":"遺留分は兄弟姉妹以外の相続人にのみ認められる（民法1042条）。","m":"兄弟姉妹に遺留分なし"},{"f":"権利","t":"相続","ref":"R02-08-2","s":"Aの子Bが既に死亡しており、Bの子CもAより先に死亡していた場合において、その後Aが死亡したときは、Cの子DがAの相続人となることはない。","a":0,"e":"直系卑属には再代襲が認められ、ひ孫が相続人となる（民法887条3項）。","m":"子の系統は再代襲あり"},{"f":"権利","t":"相続","ref":"R02-08-4","s":"Aの相続人となるべき弟B及びBの子Cが、いずれもAの相続開始以前に死亡していた場合、Cの子DがAの相続人となることはない。","a":1,"e":"兄弟姉妹の代襲はその子（甥・姪）までで、再代襲はない（民法889条2項）。","m":"兄弟姉妹は甥姪まで"},{"f":"権利","t":"相続","ref":"R07-05-エ","s":"Aが死亡し、その相続人が子B及びDであった場合において、Bが家庭裁判所に申述して相続の放棄をしたときは、Bの子CがBを代襲してAの相続人となる。","a":0,"e":"代襲原因は相続開始以前の死亡・欠格・廃除であり、相続放棄は代襲原因とならない（民法887条2項）。","m":"放棄は代襲しない"},{"f":"権利","t":"相続","ref":"R01-06-1","s":"Aが死亡し、その相続人が子B及びCである場合、Aは、生前に作成した遺言によって、B及びCによる遺産の分割を禁止することはできない。","a":0,"e":"被相続人は遺言で相続開始から5年を超えない期間を定めて遺産分割を禁止できる（民法908条）。","m":"遺言で分割禁止5年まで"},{"f":"権利","t":"相続","ref":"R05-07-1","s":"Aが死亡し、配偶者Bが遺産分割によってAの所有していた居住建物について配偶者居住権を取得した場合において、その存続期間を定めなかったときは、存続期間は20年となる。","a":0,"e":"存続期間の定めがなければ配偶者の終身の間となる（民法1030条）。","m":"配偶者居住権は原則終身"},{"f":"権利","t":"賃貸借","ref":"R02s-06-3","s":"Aが所有する甲建物をBが賃借して居住している場合において、Aが甲建物をDに売却したときは、AD間に特段の合意がない限り、賃貸人たる地位はDに移転する。","a":1,"e":"対抗要件を備えた賃貸不動産が譲渡されると、賃貸人たる地位は原則として譲受人に移転する（民法605条の2）。","m":"売買で貸主の地位も移転"},{"f":"法令","t":"都市計画法","ref":"R05-15-1","s":"市街化調整区域は、そのまま土地利用を整序することなく放置すれば、将来における一体の都市としての整備に支障が生じるおそれがある区域として、都市計画に定められるものである。","a":0,"e":"記述は準都市計画区域の考え方に近い。市街化調整区域は「市街化を抑制すべき区域」である。","m":"調整区域＝市街化を抑制"},{"f":"法令","t":"都市計画法","ref":"H30-16-3","s":"都市計画区域について区域区分を定めた場合、市街化区域については少なくとも用途地域を定めるものとし、市街化調整区域については原則として用途地域を定めないものとする。","a":1,"e":"市街化区域は用途地域必須、市街化調整区域は原則として定めない。","m":"市街化区域は用途地域必須"},{"f":"法令","t":"都市計画法","ref":"R05-15-2","s":"高度利用地区は、用途地域内の市街地における土地の合理的かつ健全な高度利用を図るため、都市計画に建築物の高さの最低限度を定める地区である。","a":0,"e":"高度利用地区で定めるのは容積率の最高・最低限度、建蔽率の最高限度、建築面積の最低限度等。高さを定めるのは高度地区。","m":"高さは高度地区"},{"f":"法令","t":"都市計画法","ref":"R04-15-3","s":"用途地域内に高度地区を定める場合には、高度地区に関する都市計画において、建築物の容積率の最高限度又は最低限度を定めるものとされている。","a":0,"e":"高度地区で定めるのは建築物の高さの最高限度又は最低限度。容積率は高度利用地区。","m":"高度地区＝高さだけ"},{"f":"法令","t":"都市計画法","ref":"R01-15-1","s":"高度地区は、用途地域内において市街地の環境を維持し、又は土地利用の増進を図るため、建築物の高さの最高限度又は最低限度を定める地区である。","a":1,"e":"高度地区は用途地域内で高さの最高限度又は最低限度を定める。","m":"高度地区は高さ上下"},{"f":"法令","t":"都市計画法","ref":"R05-15-3","s":"特定用途制限地域は、用途地域が定められている土地の区域内において、その良好な環境の形成又は保持のため、制限すべき特定の建築物等の用途の概要を定める地域である。","a":0,"e":"特定用途制限地域は用途地域が定められていない区域（市街化調整区域を除く）に定める。","m":"特定用途制限＝用途地域の外"},{"f":"法令","t":"都市計画法","ref":"R04-15-2","s":"準都市計画区域は都市計画区域外に指定される区域であるが、この準都市計画区域についても、都市計画に特別用途地区を定めることができる。","a":1,"e":"準都市計画区域では用途地域・特別用途地区・高度地区（最高限度）・景観地区・風致地区等を定められる。","m":"準都計でも特別用途地区OK"},{"f":"法令","t":"都市計画法","ref":"R02s-15-4","s":"準都市計画区域は都市計画区域外に指定される区域であるため、準都市計画区域については、都市計画に高度地区を定めることができない。","a":0,"e":"準都市計画区域でも高度地区（高さの最高限度）は定められる。定められないのは高度利用地区。","m":"準都計：高度地区○高度利用×"},{"f":"法令","t":"都市計画法","ref":"H28-16-2","s":"準都市計画区域は都市計画区域外に指定される区域であるが、この準都市計画区域については、市街地における火災の危険を防除するため、都市計画に準防火地域を定めることができる。","a":0,"e":"準都市計画区域には防火地域・準防火地域を定めることはできない。","m":"準都計に防火系なし"},{"f":"法令","t":"都市計画法","ref":"R06-15-2","s":"準都市計画区域については、その区域内に用途地域が定められている場合であっても、都市計画に市街地開発事業を定めることはできない。","a":1,"e":"準都市計画区域には都市施設は定められるが、市街地開発事業は定められない。","m":"準都計に市街地開発事業なし"},{"f":"法令","t":"都市計画法","ref":"R06-15-1","s":"都市計画区域外の区域であっても、特に必要があるときは、当該都市計画区域外の区域に道路や公園などの都市施設に関する都市計画を定めることができる。","a":1,"e":"都市施設は特に必要があるときは都市計画区域外にも定められる。","m":"都市施設は区域外もOK"},{"f":"法令","t":"都市計画法","ref":"R06-15-4","s":"地区計画は、用途地域が定められている土地の区域内においてのみ定めることができ、また、地区計画を定める際には、地区整備計画も必ず定めなければならない。","a":0,"e":"地区計画は一定の場合用途地域外にも定められ、地区整備計画は特別な事情があれば定めなくてもよい。","m":"地区計画は用途地域外もOK"},{"f":"法令","t":"都市計画法","ref":"R03-15-4","s":"地区計画の区域内において、建築物の建築等に関する事項を詳細に定める地区整備計画においては、建築物の建蔽率の最高限度を定めることができる。","a":1,"e":"地区整備計画では建蔽率の最高限度、容積率の最高・最低限度、高さ等を定められる。","m":"地区整備計画で建蔽率OK"},{"f":"法令","t":"都市計画法","ref":"R03-15-3","s":"地区計画の区域内において定められる地区整備計画においては、当該区域について区域区分を決定するかどうかを定めることができる。","a":0,"e":"区域区分の有無は都市計画区域マスタープランで定める事項で、地区整備計画の内容ではない。","m":"区域区分はマスタープラン"},{"f":"法令","t":"都市計画法","ref":"R06-15-3","s":"準住居地域は、道路の沿道としての地域の特性にふさわしい業務の利便の増進を図りつつ、これと調和した住居の環境を保護するため定める地域である。","a":1,"e":"準住居地域の定義そのもの。","m":"準住居＝沿道"},{"f":"法令","t":"開発許可","ref":"R04-16-1","s":"市街化区域内において、市街地再開発事業の施行として行う開発行為で、その規模が1haであるものについては、都道府県知事の許可を受けなければならない。","a":0,"e":"市街地再開発事業・土地区画整理事業・都市計画事業の施行として行う開発行為は規模を問わず許可不要。","m":"〇〇事業の施行は許可不要"},{"f":"法令","t":"開発許可","ref":"R03-16-4","s":"区域区分が定められていない都市計画区域内において、土地区画整理事業の施行として行う開発行為で、その規模が8,000㎡であるものについては、都道府県知事の許可を受けなければならない。","a":0,"e":"土地区画整理事業の施行として行う開発行為は区域・規模を問わず許可不要。","m":"区画整理事業は許可不要"},{"f":"法令","t":"開発許可","ref":"R06-16-3","s":"市街化調整区域内において、都市計画事業の施行として行う開発行為については、その規模にかかわらず、都道府県知事の許可を受けなければならない。","a":0,"e":"都市計画事業の施行として行う開発行為は許可不要。","m":"都市計画事業は許可不要"},{"f":"法令","t":"開発許可","ref":"R04-16-2","s":"区域区分が定められていない都市計画区域内において、博物館の建築の用に供する目的で行う8,000㎡の開発行為については、都道府県知事の許可を受ける必要はない。","a":1,"e":"博物館・図書館・公民館・駅舎・変電所など公益上必要な建築物のための開発行為は許可不要。","m":"図書館・公民館・博物館は不要"},{"f":"法令","t":"開発許可","ref":"R03-16-1","s":"市街化区域内において、都市公園法に規定する公園施設である建築物の建築の用に供する目的で行う5,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":0,"e":"公園施設は公益上必要な建築物にあたり、開発許可は不要。","m":"公園施設は公益で不要"},{"f":"法令","t":"開発許可","ref":"R06-16-1","s":"市街化区域内において、病院の建築の用に供する目的で行う1,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":1,"e":"病院・学校・社会福祉施設は公益上の例外に当たらない。市街化区域で1,000㎡以上なので許可必要。","m":"病院・学校は例外にならない"},{"f":"法令","t":"開発許可","ref":"R03-16-2","s":"首都圏整備法に規定する既成市街地内にある市街化区域において、住宅の建築の用に供する目的で行う800㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":1,"e":"三大都市圏の既成市街地等にある市街化区域では500㎡以上で許可が必要。","m":"三大都市圏は500㎡"},{"f":"法令","t":"開発許可","ref":"R03-16-3","s":"準都市計画区域内において、商業施設の建築の用に供する目的で行う2,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":0,"e":"準都市計画区域は3,000㎡未満なら許可不要。","m":"準都計は3,000㎡未満不要"},{"f":"法令","t":"開発許可","ref":"H29-17-3","s":"都市計画区域外の区域内において、変電所の建築の用に供する目的で行う1,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":0,"e":"変電所は公益上必要な建築物で許可不要。なお区域外は1ha未満でも不要。","m":"区域外は1ha以上"},{"f":"法令","t":"開発許可","ref":"R06-16-2","s":"開発行為を伴わずに建築物を建築する場合であっても、その規模が1,000㎡以上であるときは、その建築について開発許可を受けなければならない。","a":0,"e":"開発許可は開発行為（区画形質の変更）について必要。開発行為を伴わない建築には不要。","m":"区画形質の変更がなければ不要"},{"f":"法令","t":"開発許可","ref":"R05-16-1","s":"開発許可を申請しようとする者は、あらかじめ、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。","a":1,"e":"既存の関係公共施設の管理者とは協議＋同意、新設公共施設の管理者となる者とは協議が必要。","m":"既存は同意、新設は協議"},{"f":"法令","t":"開発許可","ref":"R02-16-3","s":"開発許可を受けた開発行為により設置された公共施設は、工事完了の公告の日の翌日において、原則として、その公共施設の存する市町村の管理に属する。","a":1,"e":"他の法律や協議で別段の定めがない限り、市町村の管理に属する。","m":"公共施設は原則市町村管理"},{"f":"法令","t":"開発許可","ref":"R02-16-4","s":"開発許可を受けた者から当該開発区域内の土地の所有権その他工事を施行する権原を取得した者は、都道府県知事の承認を受けて、開発許可に基づく地位を承継することができる。","a":1,"e":"特定承継は知事の承認が必要。相続等の一般承継は当然に承継。","m":"特定承継は承認、相続は当然"},{"f":"法令","t":"開発許可","ref":"R06-16-4","s":"都道府県知事から開発許可を受けた者は、開発登録簿に、開発許可の年月日や予定建築物の用途などの必要事項を自ら登録しなければならない。","a":0,"e":"開発登録簿に登録するのは都道府県知事。","m":"登録簿は知事が作る"},{"f":"法令","t":"開発許可","ref":"R04-16-3","s":"主として自己の業務の用に供する施設の建築の用に供する目的で行う開発行為にあっては、開発区域内に土砂災害警戒区域内の土地を含んではならない。","a":0,"e":"自己業務用で含めないのは災害危険区域・土砂災害特別警戒区域等（レッドゾーン）。土砂災害警戒区域は対象外。","m":"レッドは特別警戒区域"},{"f":"法令","t":"開発許可","ref":"R04-16-4","s":"市街化調整区域内における開発行為は、市街化を促進するおそれがあるか否かにかかわらず、開発審査会の議を経れば、都道府県知事が許可をすることができる。","a":0,"e":"開発審査会の議を経て許可できるのは、市街化を促進するおそれがなく、市街化区域内で行うことが困難又は著しく不適当と認めるもの。","m":"審査会も促進おそれなしが前提"},{"f":"法令","t":"建築基準法","ref":"R06-17-1","s":"高さ25ｍの建築物を建築する場合には、周囲の状況によって安全上支障がない場合を除き、有効に避雷設備を設けなければならない。","a":1,"e":"高さ20ｍを超える建築物には原則として避雷設備が必要。","m":"避雷は20ｍ超"},{"f":"法令","t":"建築基準法","ref":"R06-17-2","s":"特定行政庁は、違反建築物について緊急の必要があるため仮に使用禁止の命令をする場合であっても、意見書の提出先等を記載した通知書を所有者等に交付しなければならない。","a":0,"e":"緊急の必要がある場合は、通知書交付等の手続によらず仮に使用禁止・使用制限を命じられる。","m":"緊急なら手続省略"},{"f":"法令","t":"建築基準法","ref":"R06-17-3","s":"防火地域内において、床面積300㎡の共同住宅について増築をする場合、その増築に係る部分の床面積の合計が10㎡以内であっても、建築確認を受ける必要がある。","a":1,"e":"10㎡以内の増改築・移転で確認不要となるのは防火・準防火地域外の場合のみ。","m":"防火地域は10㎡以内でも確認"},{"f":"法令","t":"建築基準法","ref":"H27-17-1","s":"防火地域及び準防火地域外において建築物を改築する場合で、その改築に係る部分の床面積の合計が10㎡以内であるときは、建築確認を受ける必要はない。","a":1,"e":"防火・準防火地域外での10㎡以内の増築・改築・移転は確認不要。","m":"地域外の10㎡以内は不要"},{"f":"法令","t":"建築基準法","ref":"R06-17-4","s":"建築物の所有者が、既存の劇場の用途を変更して床面積の合計が500㎡の映画館とする場合においては、両者は政令で定める類似の用途相互間の変更に当たるため、建築主事等の建築確認を受ける必要はない。","a":1,"e":"劇場・映画館・演芸場等の類似用途間の変更は確認不要。","m":"類似用途間は確認不要"},{"f":"法令","t":"建築基準法","ref":"H29-18-4","s":"既存のホテルの用途を変更して、その用途に供する部分の床面積の合計が300㎡の共同住宅とする場合においては、特殊建築物相互間の用途変更であるため、建築主事等の建築確認を受ける必要はない。","a":0,"e":"200㎡超の特殊建築物への用途変更は、類似用途でない限り確認が必要。ホテルと共同住宅は類似用途でない。","m":"200㎡超の特殊建築物へは確認"},{"f":"法令","t":"建築基準法","ref":"R04-17-2","s":"延べ面積が500㎡を超える建築物であっても、その建築物が都市計画区域及び準都市計画区域の外に所在する場合には、当該建築物について大規模の修繕を行うに当たり、建築確認を受ける必要はない。","a":0,"e":"階数2以上又は延べ面積200㎡超の新2号建築物（500㎡超の特殊建築物等も同様）は、都市計画区域の内外を問わず全国で大規模修繕に建築確認が必要。","m":"新2号は区域外も確認"},{"f":"法令","t":"建築基準法","ref":"R02-17-1","s":"鉄骨造、地上2階建て、延べ面積200㎡の共同住宅について大規模の修繕を行おうとする場合においては、その所在地のいかんにかかわらず、工事に着手する前に建築確認を受けなければならない。","a":1,"e":"2階以上の建築物は新2号建築物として、大規模修繕・模様替にも確認が必要。","m":"2階以上は修繕も確認"},{"f":"法令","t":"建築基準法","ref":"R04-17-1","s":"建築基準法の改正により、現に存する建築物が改正後の規定に適合しなくなった場合には、当該建築物は違反建築物となり、所有者は速やかに改正後の規定に適合するよう改修しなければならない。","a":0,"e":"既存不適格建築物には改正後の規定は適用されず、違反建築物とはならない（増改築時等に適合が必要）。","m":"既存不適格は違反でない"},{"f":"法令","t":"建築基準法","ref":"R04-17-4","s":"地方公共団体が条例で災害危険区域を指定した場合において、当該区域内においては、建築基準法の規定により、住居の用に供する建築物の建築は条例の内容にかかわらず一律に禁止される。","a":0,"e":"住居用建築物の禁止その他の制限は条例で定めるもので、一律禁止ではない。","m":"災害危険区域は条例で制限"},{"f":"法令","t":"建築基準法","ref":"R05-17-3","s":"建築物が防火地域及び準防火地域にわたる場合においては、原則として、その建築物の全部について、規制の緩やかな準防火地域内の建築物に関する規定が適用される。","a":0,"e":"原則として全部に厳しい方の防火地域の規定が適用される。","m":"またがりは厳しい方"},{"f":"法令","t":"建築基準法","ref":"R03-17-3","s":"防火地域又は準防火地域内にある建築物で、外壁が防火構造であるものについては、その外壁を隣地境界線に接して設けることができる旨が建築基準法に定められている。","a":0,"e":"隣地境界線に接して設けられるのは外壁が耐火構造の建築物。","m":"隣地に接するのは耐火構造"},{"f":"法令","t":"建築基準法","ref":"R05-17-4","s":"建築物を建築する場合において、石綿をあらかじめ添加した建築材料については、石綿を飛散又は発散させるおそれがないものとして国土交通大臣が定めたもの又は大臣の認定を受けたものを除き、使用してはならない。","a":1,"e":"石綿等の飛散・発散による衛生上の支障防止のための規定。","m":"石綿添加材は原則禁止"},{"f":"法令","t":"建築基準法","ref":"R06-18-1","s":"映画館で客席部分の床面積の合計が300㎡のものは、第二種住居地域内においては建築することができないが、準住居地域内においては特定行政庁の許可を受けなくても建築することができる。","a":0,"e":"準住居地域で建築できる映画館は客席200㎡未満のみ。300㎡は準住居地域でも建築不可。","m":"準住居の映画館は200㎡未満"},{"f":"法令","t":"建築基準法","ref":"R04-18-1","s":"第一種低層住居専用地域内においては、良好な住居の環境を保護するため、神社、寺院及び教会は、特定行政庁の許可を受けた場合を除き、建築することができない。","a":0,"e":"神社・寺院・教会はすべての用途地域で建築できる。","m":"宗教施設は全地域OK"},{"f":"法令","t":"建築基準法","ref":"R01-18-2","s":"工業地域内においては、幼保連携型認定こども園は、保育所と同様に、特定行政庁の許可を受けなくても建築することができ、用途地域による建築制限を受けることはない。","a":1,"e":"幼保連携型認定こども園は保育所と同様に全用途地域で建築可能。","m":"保育所系は全地域OK"},{"f":"法令","t":"建築基準法","ref":"R06-18-4","s":"都市計画において定められた建蔽率の限度が10分の8とされている地域内で、かつ、防火地域内にある耐火建築物については、特定行政庁の許可を受けた場合に限り、建蔽率の制限が適用されない。","a":0,"e":"この場合は許可なしで当然に建蔽率制限が適用されない。","m":"80％＋防火＋耐火で無制限"},{"f":"法令","t":"建築基準法","ref":"R05-18-1","s":"都市計画において定められた建蔽率の限度が10分の6の準防火地域内にある準耐火建築物で、街区の角にある敷地として特定行政庁が指定するものの内にある建築物については、建蔽率の限度に10分の2を加えた数値が限度となる。","a":1,"e":"準防火地域内の耐火・準耐火建築物等で＋1/10、角地で＋1/10、合計＋2/10。","m":"防火＋角地で2/10加算"},{"f":"法令","t":"建築基準法","ref":"R05-18-4","s":"日影による中高層の建築物の高さの制限の対象区域外にある建築物については、冬至日において対象区域内の土地に日影を生じさせるものであっても、当該制限の適用を受けることはない。","a":0,"e":"対象区域外でも高さ10ｍ超で冬至日に対象区域内に日影を生じさせるものは規制を受ける。","m":"区域外でも10ｍ超は対象"},{"f":"法令","t":"建築基準法","ref":"R02s-18-4","s":"田園住居地域内の建築物については、第一種低層住居専用地域内の建築物と異なり、北側の前面道路又は隣地との関係についての建築物の各部分の高さの制限（北側斜線制限）は適用されない。","a":0,"e":"北側斜線制限は低層住居専用地域・田園住居地域・中高層住居専用地域に適用される。","m":"北側斜線は低層・田園・中高層"},{"f":"法令","t":"建築基準法","ref":"H30-19-1","s":"田園住居地域内においては、建築物の高さは、一定の場合を除き、10ｍ又は12ｍのうち当該地域に関する都市計画において定められた建築物の高さの限度を超えてはならない。","a":1,"e":"第一種・第二種低層住居専用地域と田園住居地域には絶対高さ制限（10ｍ又は12ｍ）がある。","m":"低層・田園は10ｍか12ｍ"},{"f":"法令","t":"盛土規制法","ref":"R06-19-1","s":"都道府県知事は、宅地造成、特定盛土等又は土石の堆積に伴う災害の防止のための基礎調査を行うため必要があるときは、他人の占有する土地に立ち入ることができ、当該土地の占有者は、正当な理由がない限り、これを拒み、又は妨げてはならない。","a":1,"e":"基礎調査のための立入りは認められ、占有者は正当な理由なく拒み、妨げてはならない。","m":"基礎調査の立入りは拒めない"},{"f":"法令","t":"盛土規制法","ref":"R02s-19-3","s":"都道府県知事又はその命じた者が、基礎調査のために他人の占有する土地に立ち入ったことにより他人に損失を与えた場合においては、都道府県は、その損失を受けた者に対して、通常生ずべき損失を補償しなければならない。","a":1,"e":"立入りによる損失は、都道府県が通常生ずべき損失を補償しなければならない。","m":"立入りの損失は都道府県が補償"},{"f":"法令","t":"盛土規制法","ref":"R06-19-3","s":"宅地造成等工事規制区域内において、許可を要する宅地造成等に関する工事を行おうとする工事主は、当該工事に着手した日から2週間以内に、工事の施行に係る土地の周辺地域の住民に対し、工事の内容を周知させるための措置を講じれば足りる。","a":0,"e":"周知措置は許可申請の前に、あらかじめ講じなければならない。着手後では遅い。","m":"住民周知は申請前にあらかじめ"},{"f":"法令","t":"盛土規制法","ref":"R06-19-4","s":"特定盛土等規制区域内において、一定規模の特定盛土等に関する工事を行おうとする工事主は、許可を要する場合を除き、当該工事に着手する日の30日前までに、工事の計画を都道府県知事に届け出なければならない。","a":1,"e":"特定盛土等規制区域では一定規模の工事は届出制で、工事着手日の30日前までに知事へ届け出る。","m":"特定盛土区域は30日前届出"},{"f":"法令","t":"盛土規制法","ref":"R07-19-2","s":"宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害が生じないよう、その土地を常時安全な状態に維持するよう努めなければならないのは、土地の所有者等ではなく、工事主及び工事施行者である。","a":0,"e":"努力義務を負うのは土地の所有者・管理者・占有者である。工事主等に限られない。","m":"安全維持の努力は所有者等"},{"f":"法令","t":"盛土規制法","ref":"R07-19-4","s":"宅地造成等工事規制区域内において宅地造成等に関する工事の許可を受けた工事主は、当該許可に係る工事の現場の見やすい場所に、主務省令で定めるところにより、所定の事項を記載した標識を掲げなければならない。","a":1,"e":"許可を受けた工事主には、工事現場への標識掲示義務がある。","m":"許可工事は現場に標識"},{"f":"法令","t":"盛土規制法","ref":"R05-19-1","s":"都道府県知事は、宅地造成又は特定盛土等に伴う災害で相当数の居住者等に危害を生ずるものの発生のおそれが大きい一団の造成宅地の区域であれば、宅地造成等工事規制区域内の土地であっても、造成宅地防災区域として指定することができる。","a":0,"e":"造成宅地防災区域は、宅地造成等工事規制区域内の土地には指定できない。","m":"防災区域は規制区域の外だけ"},{"f":"法令","t":"盛土規制法","ref":"R04-19-1","s":"宅地造成等工事規制区域内の土地において、高さが2ｍを超える擁壁や排水施設の全部又は一部の除却の工事を行おうとする者は、一定の場合を除き、工事に着手する日の14日前までに、その旨を都道府県知事に届け出なければならない。","a":1,"e":"許可不要な除却工事でも、擁壁（2m超）・排水施設等の除却は着手日の14日前までに知事へ届出が必要。","m":"擁壁・排水の除却は14日前"},{"f":"法令","t":"盛土規制法","ref":"R03-19-3","s":"都道府県知事は、その地方の気候、風土又は地勢の特殊性により、政令で定める技術的基準のみによっては災害の防止の目的を達し難いと認める場合においては、規則で、宅地造成等に関する工事の技術的基準を強化し、又は必要な技術的基準を付加することができる。","a":1,"e":"都道府県知事は、一定の場合、規則で政令の技術的基準を強化・付加できる。","m":"知事は規則で基準を上乗せ可"},{"f":"法令","t":"盛土規制法","ref":"R02s-19-1","s":"宅地造成等工事規制区域は、国土交通大臣が、宅地造成、特定盛土等又は土石の堆積に伴う災害の防止に関する基本方針に基づき、関係都道府県知事の意見を聴いたうえで指定する。","a":0,"e":"宅地造成等工事規制区域を指定するのは都道府県知事（指定都市等の長）である。","m":"規制区域の指定は知事"},{"f":"法令","t":"盛土規制法","ref":"R03s-19-1","s":"宅地造成等工事規制区域及び特定盛土等規制区域のいずれにも指定されていない区域内において盛土を行う場合であっても、その盛土が一定規模以上のものであるときは、工事主は、都道府県知事に届け出なければならない。","a":0,"e":"規制区域・特定盛土等規制区域の外で行う工事には、盛土規制法上の許可も届出も不要。","m":"区域外は許可も届出も不要"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-1","s":"土地区画整理事業の施行者が仮換地を指定した場合において、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。","a":1,"e":"仮換地指定の効力発生日から換地処分公告日まで、従前と同内容で仮換地を使用収益できる。","m":"仮換地で従前どおり使える"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-4","s":"土地区画整理事業の施行者は、仮換地を指定する場合において、その仮換地に使用又は収益の障害となる物件が存するときその他特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を、仮換地の指定の効力発生の日と別に定めることができる。","a":1,"e":"施行者は特別の事情があれば、使用収益開始日を別に定めることができる。","m":"特別事情なら開始日を別に"},{"f":"法令","t":"土地区画整理法","ref":"H30-21-4","s":"土地区画整理事業の施行者が仮換地を指定する場合において、その仮換地について使用又は収益を開始することができる日は、特別の事情の有無にかかわらず、仮換地の指定の効力発生の日と同じ日としなければならない。","a":0,"e":"特別の事情があるときは、施行者は使用収益開始日を別に定めることができる。","m":"開始日は必ず同日、ではない"},{"f":"法令","t":"土地区画整理法","ref":"R07-20-3","s":"土地区画整理事業の施行者が仮換地の使用又は収益を開始することができる日を別に定めたことにより、従前の宅地及び仮換地のいずれも使用収益できずに損失を受けた者がある場合においては、施行者はその者に対して通常生ずべき損失を補償しなければならない。","a":1,"e":"開始日を別に定めたため使用収益できず損失を受けた者には、施行者が損失補償をする。","m":"開始日ずれの損失は施行者補償"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-2","s":"土地区画整理事業における換地処分は、施行者が、換地計画において定められた関係事項を官報又は公報により公告することによって行うものとされ、関係権利者への通知は要しない。","a":0,"e":"換地処分は関係権利者に換地計画で定めた事項を通知して行う。公告は換地処分があった旨の公告である。","m":"換地処分は通知で行う"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-3","s":"土地区画整理事業の換地計画において保留地として定められた土地は、換地処分の公告があった日の翌日において、施行者が取得し、施行者はこれを処分して事業費に充てることができる。","a":1,"e":"保留地は換地処分公告の翌日に施行者が取得する。","m":"保留地は公告翌日に施行者へ"},{"f":"法令","t":"土地区画整理法","ref":"R05-20-1","s":"土地区画整理事業の換地計画において定められた清算金は、換地処分の公告があった日の翌日において確定し、施行者はこれを徴収し、又は交付することとなる。","a":1,"e":"清算金は換地処分公告の翌日において確定する。","m":"清算金は公告翌日に確定"},{"f":"法令","t":"土地区画整理法","ref":"R04-20-4","s":"土地区画整理事業において換地処分の公告があった後に、換地の所有権が第三者に移転した場合であっても、確定した清算金の徴収又は交付に関する権利義務は、当然には新たな所有者に移転しない。","a":1,"e":"清算金は換地処分時点の所有者との間で確定し、その後の譲受人には当然には承継されない。","m":"清算金は処分時の所有者"},{"f":"法令","t":"土地区画整理法","ref":"R05-20-4","s":"土地区画整理組合が施行する土地区画整理事業において、組合が施行地区内の宅地について仮換地を指定しようとする場合には、あらかじめ、土地区画整理審議会の同意を得なければならない。","a":0,"e":"組合施行では総会（総代会）の同意を得る。審議会は公的施行の場合に置かれる。","m":"組合は総会、審議会は公的施行"},{"f":"法令","t":"土地区画整理法","ref":"R03-20-3","s":"土地区画整理組合が施行する土地区画整理事業の施行地区内において、事業の施行の障害となるおそれがある建築物の新築を行おうとする者は、当該組合の許可を受ければ足り、他の許可を受ける必要はない。","a":0,"e":"建築行為等の許可権者は施行者ではなく、知事等（市の区域内は市長）である。","m":"建築制限の許可は知事等"},{"f":"法令","t":"土地区画整理法","ref":"R02-20-3","s":"土地区画整理組合は、事業に要する経費に充てるため組合員に賦課金を課する場合において、定款で定めれば、賦課金の額を宅地の位置や地積等にかかわらず組合員全員について一律の額とすることができる。","a":0,"e":"賦課金は宅地の位置・地積等を考慮して公平に定めなければならない。","m":"賦課金は公平に、一律不可"},{"f":"法令","t":"農地法","ref":"R05-21-1","s":"農地の所有者が死亡し、相続人以外の者に対する特定遺贈によりその農地の所有権を取得する場合には、受遺者は農地法第3条第1項の許可を受ける必要がある。","a":1,"e":"相続や相続人への特定遺贈は許可不要だが、相続人以外への特定遺贈は3条許可が必要。","m":"相続人以外への遺贈は許可要"},{"f":"法令","t":"農地法","ref":"R03-21-1","s":"遺産分割により農地の所有権を取得した者は、農地法第3条第1項の許可を受ける必要はないが、遅滞なく、その農地の存する市町村の農業委員会にその旨を届け出なければならない。","a":1,"e":"遺産分割による取得は許可不要。ただし遅滞なく農業委員会へ届け出る必要がある。","m":"遺産分割は許可不要・届出要"},{"f":"法令","t":"農地法","ref":"R05-21-2","s":"農業者が、自己の所有する農地4アールを、自らの耕作の事業のための農業用施設の敷地に転用しようとする場合には、農地法第4条第1項の許可を受ける必要はない。","a":0,"e":"許可不要となる農業用施設への転用は2アール未満に限られる。4アールなら4条許可が必要。","m":"農業用施設は2a未満のみ不要"},{"f":"法令","t":"農地法","ref":"R05-21-3","s":"農地の所有者と買主が耕作目的で農地の売買契約を締結したが、農地法第3条第1項の許可を受けていない場合には、当該売買契約による所有権移転の効力は生じない。","a":1,"e":"許可を受けない権利移動は効力を生じない。","m":"無許可売買は効力なし"},{"f":"法令","t":"農地法","ref":"R04-21-2","s":"農地所有適格法人の要件を満たしていない株式会社は、いかなる場合であっても、耕作の目的で農地を借り入れることについて農地法第3条第1項の許可を受けることができない。","a":0,"e":"適格法人でない法人も、一定の要件を満たせば3条許可を受けて農地を借り入れられる。","m":"適格法人以外も借りるのは可"},{"f":"法令","t":"農地法","ref":"R04-21-1","s":"耕作目的で農地の使用貸借による権利の設定を受けた者は、その登記がなくても、農地の引渡しを受けていれば、その後にその農地について物権を取得した第三者に対抗することができる。","a":0,"e":"引渡しで対抗できるのは農地の賃貸借である。使用貸借には適用されない。","m":"引渡し対抗は賃貸借だけ"},{"f":"法令","t":"農地法","ref":"R04-21-3","s":"農地法の規定に違反して農地を転用した者がいる場合において、都道府県知事等が行う原状回復等の措置命令の対象には、当該転用に係る工事を請け負った者は含まれない。","a":0,"e":"原状回復等の命令は、違反転用者だけでなく工事の請負人・下請人にも出せる。","m":"請負人も原状回復命令の対象"},{"f":"法令","t":"農地法","ref":"R06-21-4","s":"農地の賃貸借の当事者は、農事調停による場合等一定の場合を除き、都道府県知事の許可を受けなければ、賃貸借の解除をし、解約の申入れをし、又は更新をしない旨の通知をしてはならない。","a":1,"e":"賃貸借の解除・解約申入れ等は原則知事の許可が必要（農事調停による場合等は除く）。","m":"賃貸借解約は知事許可"},{"f":"法令","t":"農地法","ref":"R03s-21-3","s":"登記簿上の地目が宅地とされている土地であれば、現況が耕作の目的に供されている農地であっても、その土地の売買や転用について農地法の規制を受けることはない。","a":0,"e":"農地か否かは登記簿の地目ではなく現況で判断する。","m":"農地かは現況で判断"},{"f":"法令","t":"農地法","ref":"R02-21-2","s":"市街化区域内にある農地を住宅の敷地に転用する場合には、転用した後に遅滞なく農業委員会に届け出れば、農地法第4条第1項の許可を受ける必要はない。","a":0,"e":"市街化区域内の特例は、あらかじめ（転用前に）農業委員会へ届け出ることが要件。","m":"市街化区域は事前届出"},{"f":"法令","t":"農地法","ref":"R07-21-4","s":"法人の代表者が、その法人の業務に関し、農地法第4条第1項の許可を受けずに農地を転用した場合には、行為者のほか、その法人にも罰金刑が科されるが、その上限は300万円である。","a":0,"e":"4条・5条違反等の法人重科は1億円以下の罰金である。","m":"法人罰金は1億円以下"},{"f":"法令","t":"農地法","ref":"R03-21-4","s":"都道府県が病院の用に供するため農地を取得しようとする場合においては、都道府県と都道府県知事等との協議が成立することをもって、農地法第5条第1項の許可があったものとみなされる。","a":1,"e":"国・都道府県等が一定の目的で転用目的取得をする場合、協議成立で許可があったものとみなされる。","m":"国・県は協議成立で許可みなし"},{"f":"法令","t":"国土利用計画法","ref":"R06-22-1","s":"市街化調整区域内に所在する4,000㎡の土地について、土地の所有者が対価を得て第三者のために地上権を設定する契約を締結した場合には、当該地上権者は事後届出を行わなければならない。","a":0,"e":"市街化調整区域の届出対象面積は5,000㎡以上。4,000㎡なら不要。","m":"調整区域は5,000㎡以上"},{"f":"法令","t":"国土利用計画法","ref":"R03s-22-1","s":"都市計画区域外に所在する12,000㎡の土地について、土地の所有者が対価を得て第三者のために地上権を設定する契約を締結した場合には、当該地上権者は事後届出を行わなければならない。","a":1,"e":"対価を伴う地上権設定は土地売買等の契約に当たり、区域外は10,000㎡以上で届出対象。","m":"区域外は1万㎡以上"},{"f":"法令","t":"国土利用計画法","ref":"R06-22-2","s":"一定面積以上の土地について土地の交換契約を締結した場合において、当事者間で交換差金の授受がないときは、届出対象面積の要件を満たしていても、事後届出を行う必要はない。","a":0,"e":"交換も対価のある契約として土地売買等の契約に当たり、面積要件を満たせば届出が必要。","m":"交換は金銭なしでも対象"},{"f":"法令","t":"国土利用計画法","ref":"R06-22-3","s":"土地売買等の契約を締結した者が、必要な事後届出を行わなかった場合において、都道府県知事はその者に対して勧告をすることができるにとどまり、無届出について罰則の適用はない。","a":0,"e":"無届出は罰則（6月以下の拘禁刑又は100万円以下の罰金）の対象となる。","m":"無届出は罰則あり"},{"f":"法令","t":"国土利用計画法","ref":"R05-22-1","s":"国から一定面積以上の土地を購入する売買契約を締結した場合には、当事者の一方が国であるため、その面積にかかわらず、権利取得者は事後届出を行う必要はない。","a":1,"e":"当事者の一方又は双方が国等である場合は、事後届出は不要。","m":"国等が当事者なら届出不要"},{"f":"法令","t":"国土利用計画法","ref":"R05-22-3","s":"一定面積以上の土地について土地売買等の契約を締結した場合には、売主と買主は、共同して、契約締結日から起算して2週間以内に、都道府県知事に事後届出を行わなければならない。","a":0,"e":"事後届出をするのは権利取得者（買主等）のみで、売主に義務はない。","m":"届出は権利取得者だけ"},{"f":"法令","t":"国土利用計画法","ref":"R04-22-2","s":"国土利用計画法に基づく事後届出においては、土地の利用目的は届出事項とされているが、土地売買等の契約に係る土地に関する権利の移転又は設定の対価の額は届出事項とされていない。","a":0,"e":"対価の額も届出事項である。ただし勧告は利用目的についてのみ行う。","m":"対価の額も届出事項"},{"f":"法令","t":"国土利用計画法","ref":"R04-22-3","s":"市街化調整区域内において、Aが一団の土地である甲土地3,500㎡と乙土地2,500㎡を、それぞれ別の所有者から別々の売買契約により購入した場合には、Aは事後届出を行わなければならない。","a":1,"e":"一団の土地は合計6,000㎡で判定し、調整区域の5,000㎡以上に当たるため届出が必要。","m":"一団の土地は合計で判定"},{"f":"法令","t":"国土利用計画法","ref":"R04-22-4","s":"事後届出を受けた都道府県知事が土地の利用目的について勧告をしたにもかかわらず、届出をした者がその勧告に従わなかった場合には、当該土地売買等の契約は無効となる。","a":0,"e":"勧告に従わないときは公表されることがあるが、契約の効力には影響しない。","m":"勧告違反でも契約は有効"},{"f":"法令","t":"国土利用計画法","ref":"R03-22-1","s":"土地売買等の契約を締結した権利取得者は、事後届出が必要な場合には、契約を締結した日の翌日から起算して3週間以内に、所定の事項を都道府県知事に届け出ればよい。","a":0,"e":"事後届出の期限は契約締結日から起算して2週間以内である。","m":"事後届出は2週間以内"},{"f":"法令","t":"国土利用計画法","ref":"R02-22-1","s":"市街化調整区域内に所在する6,000㎡の土地について、売買の予約を締結した場合には、本契約を締結していなくても、予約上の権利者は事後届出を行わなければならない。","a":1,"e":"予約も土地売買等の契約に含まれ、5,000㎡以上なので届出が必要。","m":"予約も届出対象"},{"f":"法令","t":"国土利用計画法","ref":"R07-22-4","s":"市街化区域内の一団の土地のうち、Aが1,200㎡を購入するとともに、これに隣接する1,300㎡を所有者から無償で借り受けた場合には、Aは事後届出を行う必要はない。","a":1,"e":"無償の賃借は対価がなく対象外。購入分1,200㎡は2,000㎡未満なので届出不要。","m":"無償の貸借は面積に含めない"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R05-24-3","s":"不動産取得税は、不動産の取得に対し、当該不動産の所在する市町村において、当該不動産の取得者に課する税であり、市町村の条例で税率等が定められる。","a":0,"e":"不動産取得税は都道府県税。不動産所在の都道府県が取得者に課する。","m":"取得税は都道府県"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R05-24-4","s":"不動産取得税は、市町村や特別区が不動産を取得した場合には、その取得の目的や不動産の用途にかかわらず、これらの者に対して課することができない。","a":1,"e":"国・都道府県・市町村・特別区等には不動産取得税を課することができない（人的非課税）。","m":"国・自治体は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H30-24-1","s":"不動産取得税の納税義務者は、不動産を取得した日の翌日から起算して3か月以内に、当該不動産の所在する都道府県に対して税額を申告し、これを納付しなければならない。","a":0,"e":"不動産取得税は普通徴収（納税通知書による納付）で、申告納付ではない。","m":"取得税は普通徴収"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H30-24-3","s":"相続により土地や家屋を取得した場合には、その取得は形式的な所有権の移転等に当たるため、取得した不動産の価格にかかわらず、不動産取得税は課されない。","a":1,"e":"相続・法人の合併など形式的な移転は非課税。","m":"相続・合併は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02-24-4","s":"共有物の分割により不動産を取得した場合には、当該不動産の取得者の分割前の当該共有物に係る持分の割合を超えない部分の取得については、不動産取得税は課されない。","a":1,"e":"持分を超えない部分は形式的取得として非課税。超過部分は課税。","m":"持分内の分割は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R04-24-1","s":"固定資産税の徴収については、市町村は、納税通知書を納税者に交付する方法ではなく、給与所得に係る住民税と同様に、特別徴収の方法によらなければならないとされている。","a":0,"e":"固定資産税は普通徴収（納税通知書による）。","m":"固定資産税も普通徴収"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R04-24-3","s":"固定資産税の賦課期日は、地方税法に定めがなく、当該固定資産の所在する市町村の条例で定める日とされており、市町村ごとに異なる日を定めることができる。","a":0,"e":"賦課期日は地方税法で当該年度の初日の属する年の1月1日と定められている。","m":"賦課期日は1月1日"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R04-24-4","s":"固定資産税の課税対象となる土地や家屋が第三者に賃貸されている場合には、当該固定資産税は、所有者ではなく、その固定資産を現に使用している賃借人に対して課される。","a":0,"e":"賃借人は納税義務者とならない。原則は所有者に課税。","m":"賃借人には課税なし"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R01-24-4","s":"質権又は100年より永い存続期間の定めのある地上権の目的である土地については、その所有者ではなく、その質権者又は地上権者が固定資産税の納税義務者となる。","a":1,"e":"質権者・100年超の地上権者は所有者に代わり固定資産税の納税義務者となる。","m":"質権・百年地上権は例外"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02s-24-3","s":"固定資産税の納期は、4月、7月、12月及び2月中において、当該市町村の条例で定めるが、特別の事情がある場合においては、これと異なる納期を定めることができる。","a":1,"e":"原則4月・7月・12月・2月中で条例で定め、特別の事情があれば異なる納期も可。","m":"納期は変更可"},{"f":"税他","t":"印紙税・登録免許税","ref":"R05-23-1","s":"土地の売買契約において、売主、買主及び媒介をした宅地建物取引業者がそれぞれ1通ずつ保存するために同一内容の契約書を3通作成した場合には、その3通すべてが印紙税の課税文書となる。","a":1,"e":"仲介人保存分も含め、同一内容を2通以上作成すればすべて課税文書。","m":"仲介人保存分も課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R04-23-1","s":"土地の譲渡に関する基本的事項を合意し、後日正式な本契約書を作成することとして作成した覚書は、契約の成立を証するものであっても、印紙税は課されない。","a":0,"e":"仮契約書・覚書でも契約の成立を証すれば課税文書となる。","m":"覚書・仮契約も課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R04-23-3","s":"既に締結されている土地の賃貸借契約について、その契約期間を変更することを証するために作成した覚書は、重要な事項を変更するものとして、印紙税の課税文書となる。","a":1,"e":"契約期間など重要事項を変更する文書は課税文書となる。","m":"重要事項変更は課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R05-23-3","s":"時価2,000万円の土地を無償で譲渡することを内容とする贈与契約書を作成した場合には、当該契約書の記載金額は2,000万円として印紙税が課される。","a":0,"e":"贈与は対価がないため「記載金額のない」譲渡契約書として扱う（200円）。","m":"贈与は記載金額なし"},{"f":"税他","t":"印紙税・登録免許税","ref":"R05-23-4","s":"当初5,000万円と記載された土地の売買契約書について、売買金額を1,000万円減額する旨を記載した変更契約書を作成した場合には、当該変更契約書の記載金額は1,000万円となる。","a":0,"e":"減額の変更契約書は記載金額のない文書として扱う。増額なら増加額が記載金額。","m":"減額変更は金額なし"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02-23-3","s":"国と株式会社が共同で土地の売買契約書を2通作成し、それぞれが1通ずつ保存する場合には、当該株式会社が保存する契約書については、印紙税は課されない。","a":1,"e":"会社が保存する文書は国が作成したものとみなされ非課税となる。","m":"国作成とみなす分は非課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02-23-4","s":"建物の所有を目的とする土地の賃貸借契約書に、返還されない権利金の額と月額賃料の額がともに記載されている場合には、印紙税の課税標準となる記載金額は権利金の額のみとなる。","a":1,"e":"土地賃借権設定契約書の記載金額は権利金等の返還されない金額。賃料は含まない。","m":"賃料は記載金額外"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02s-23-3","s":"個人が土地を購入し、売買による所有権の移転登記を受ける場合において、当該登記に係る登録免許税の課税標準は、当該土地の売買契約書に記載された実際の取引価格とされている。","a":0,"e":"不動産の課税標準は登記時の価額で、固定資産課税台帳の価格がある場合はそれを基礎とする。","m":"課税標準は台帳価格"},{"f":"税他","t":"印紙税・登録免許税","ref":"R03s-23-3","s":"個人が一定の要件を満たす住宅用家屋を取得し、所有権の移転登記について登録免許税の税率の軽減措置の適用を受ける場合には、その敷地である土地の所有権の移転登記についても同様に当該軽減措置が適用される。","a":0,"e":"この軽減措置は住宅用家屋の登記が対象で、敷地の土地には適用されない。","m":"家屋のみ対象"},{"f":"税他","t":"印紙税・登録免許税","ref":"H30-23-2","s":"住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置は、個人が当該住宅用家屋を交換により取得した場合には、他の要件を満たしていても適用されない。","a":1,"e":"適用は売買又は競落による取得に限られる。交換・贈与・相続は対象外。","m":"売買・競落のみ"},{"f":"税他","t":"所得税・譲渡","ref":"R03-23-2","s":"個人が土地建物を譲渡した場合における譲渡所得の金額の計算上、取得費には、その資産の取得に要した金額は含まれるが、その資産の設備費や改良費は含まれない。","a":0,"e":"取得費には取得に要した金額のほか設備費・改良費も含まれる。","m":"改良費も取得費"},{"f":"税他","t":"所得税・譲渡","ref":"R03-23-1","s":"総合課税の対象となる譲渡所得の金額の計算上、短期譲渡所得と長期譲渡所得がある場合には、譲渡所得の特別控除額は、まず短期譲渡所得の金額から控除し、残額を長期譲渡所得の金額から控除する。","a":1,"e":"総合課税の譲渡所得の特別控除50万円は短期分から先に控除する。","m":"控除は短期から"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-2","s":"建物の所有を目的とする借地権の設定に際して受け取った権利金の額が、その土地の価額の10分の5を超える場合には、その権利金は譲渡所得ではなく不動産所得として課税される。","a":0,"e":"一定の場合、借地権設定の対価は譲渡所得として課税される。","m":"権利金5/10超は譲渡"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-3","s":"不動産業者である個人が、営利を目的として継続的に行う土地の譲渡により生ずる所得は、事業所得や雑所得ではなく、譲渡所得として所得税が課税される。","a":0,"e":"営利目的で継続的に行う譲渡は事業所得（又は雑所得）となる。","m":"業としての売買は事業"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-4","s":"個人が相続により取得した土地を譲渡した場合において、その土地の取得費は、被相続人の取得費を引き継ぐのではなく、相続の時におけるその土地の価額によるものとされている。","a":0,"e":"相続で取得した資産は被相続人の取得費・取得時期を引き継ぐ。","m":"相続は取得費引継ぎ"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-1","s":"個人が所有する別荘など、生活に通常必要でない資産について災害により損失を受けた場合には、その損失の金額は、その年分又はその翌年分の譲渡所得の金額の計算上控除するものとされている。","a":1,"e":"生活に通常必要でない資産の災害損失は、その年・翌年の譲渡所得の金額から控除する。","m":"別荘損失は譲渡から"},{"f":"税他","t":"所得税・譲渡","ref":"R01-23-3","s":"個人が居住用財産を譲渡した場合において、その譲渡の相手方が自己の孫であるときは、その孫と同居していないときであっても、居住用財産の譲渡所得の3,000万円特別控除の適用を受けることはできない。","a":1,"e":"配偶者・直系血族への譲渡は同居の有無にかかわらず3,000万円控除の対象外。","m":"直系血族へは不可"},{"f":"税他","t":"所得税・譲渡","ref":"R01-23-1","s":"個人が収用等により居住用財産を譲渡した場合において、収用等の場合の5,000万円特別控除の適用を受けるときは、その控除後の譲渡益について、居住用財産を譲渡した場合の軽減税率の特例を重ねて適用することができる。","a":1,"e":"5,000万円控除後の残額に軽減税率の特例を適用できる。","m":"収用控除と軽減税率は併用"},{"f":"税他","t":"所得税・譲渡","ref":"R06-23-1","s":"個人が居住用財産を譲渡し、その譲渡について居住用財産を譲渡した場合の軽減税率の特例の適用を受けた場合において、同じ年に新たに取得した住宅を居住の用に供したときは、その住宅について住宅ローン控除の適用を受けることはできない。","a":1,"e":"居住年等に軽減税率特例など一定の譲渡特例を受けると住宅ローン控除は不可。","m":"軽減税率とローン控除は×"},{"f":"税他","t":"所得税・譲渡","ref":"R06-23-2","s":"個人が居住用財産を譲渡し、居住用財産の買換え等の場合の譲渡損失の損益通算の特例の適用を受けた場合には、新たに取得した住宅について住宅ローン控除の適用を受けることはできない。","a":0,"e":"譲渡損失の損益通算・繰越控除の特例とは併用できる。","m":"損失特例とは併用可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R04-25-1","s":"土地鑑定委員会は、標準地の単位面積当たりの正常な価格を判定したときは、標準地の所在地、単位面積当たりの価格及び価格判定の基準日のほか、標準地の地積及び形状についても官報で公示しなければならない。","a":1,"e":"所在地・単位面積当たり価格・価格判定基準日・地積・形状等を官報で公示する。","m":"地積・形状も公示"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R04-25-2","s":"地価公示法における正常な価格とは、土地について自由な取引が行われるとした場合に通常成立すると認められる価格をいい、当該土地に建物がある場合には、その建物が存するものとして算定する。","a":0,"e":"建物や地上権等がある場合は、それらが存しないものとして算定する（更地価格）。","m":"正常価格は更地前提"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02s-25-1","s":"土地鑑定委員会が標準地を選定するに当たり、その土地に地上権その他使用収益を制限する権利が存する場合であっても、その土地を標準地として選定することができる。","a":1,"e":"地上権等があっても選定可能。価格はそれが存しないものとして求める。","m":"地上権付きも選定可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02s-25-3","s":"土地鑑定委員会は、標準地の正常な価格を判定したときは、標準地の単位面積当たりの価格のほか、当該標準地の地積に応じた価格の総額についても官報で公示しなければならない。","a":0,"e":"公示するのは単位面積当たりの価格で、総額は公示事項ではない。","m":"総額は公示しない"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R01-25-4","s":"標準地は、土地鑑定委員会が、自然的及び社会的条件からみて類似の利用価値を有すると認められる地域において、土地の利用状況、環境等が特に良好と認められる一団の土地について選定する。","a":0,"e":"自然的・社会的条件からみて類似する地域で、環境等が通常と認められる土地から選定。","m":"標準地は通常の土地"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R03s-25-2","s":"不動産鑑定士は、公示区域内の土地について鑑定評価を行う場合において、当該土地の正常な価格を求めるときは、公示価格と実際の取引価格を規準としなければならない。","a":0,"e":"不動産鑑定士が規準とするのは公示価格のみ。","m":"規準は公示価格だけ"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R05-25-2","s":"不動産の鑑定評価における原価法は、対象不動産が建物又は建物及びその敷地である場合に適用されるものであり、対象不動産が土地のみである場合には、いかなる場合においても適用することができない。","a":0,"e":"造成地・埋立地など再調達原価を適切に求められれば土地にも適用できる。","m":"造成地なら原価法可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R06-25-3","s":"不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用を前提として把握される価格を標準として形成されるが、これを不動産の価格に関する諸原則のうち適合の原則という。","a":0,"e":"これは最有効使用の原則。適合の原則は周辺環境への適合をいう。","m":"最高度＝最有効使用"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R06-25-4","s":"不動産の鑑定評価における収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求める手法であり、賃貸用不動産又は賃貸以外の事業の用に供する不動産の価格を求める場合に特に有効である。","a":1,"e":"純収益の現在価値の総和を求める手法で、賃貸用・事業用不動産に特に有効。","m":"収益還元は賃貸に有効"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02-25-3","s":"特殊価格とは、一般的に市場性を有しない不動産について、その利用現況等を前提とした経済価値を適正に表示する価格をいい、その例としては、文化財の指定を受けた建造物等が挙げられる。","a":1,"e":"特殊価格は市場性を有しない不動産の経済価値。文化財等が典型例。","m":"文化財は特殊価格"},{"f":"税他","t":"住宅金融支援機構","ref":"R05-46-2","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において、民間金融機関が貸し付けた住宅ローン債権のうち、新築住宅の建設又は購入に必要な資金の貸付けに係るもののみを買取りの対象としている。","a":0,"e":"中古住宅の購入資金に係る債権も買取りの対象。","m":"中古も買取対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R04-46-1","s":"独立行政法人住宅金融支援機構の証券化支援事業（買取型）において譲受けの対象となる貸付債権には、住宅の建設に付随する土地又は借地権の取得に必要な資金の貸付けに係るものは含まれない。","a":0,"e":"住宅の建設・購入に付随する土地・借地権の取得資金も対象に含まれる。","m":"付随の土地も対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R06-46-1","s":"独立行政法人住宅金融支援機構の証券化支援事業（買取型）において譲受けの対象となる貸付債権には、住宅の購入に付随する当該住宅の改良に必要な資金の貸付けに係るものは含まれない。","a":0,"e":"住宅購入に付随する当該住宅の改良資金も対象に含まれる。","m":"付随の改良も対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R07-46-2","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において、自ら居住する住宅のための貸付債権のほか、賃貸住宅の建設又は購入に必要な資金の貸付けに係る債権についても譲受けの対象としている。","a":0,"e":"対象は本人又は親族が居住する住宅のための貸付債権。賃貸住宅は対象外。","m":"賃貸住宅は対象外"},{"f":"税他","t":"住宅金融支援機構","ref":"R05-46-4","s":"独立行政法人住宅金融支援機構は、マンション管理組合や区分所有者に対し、マンションの共用部分の改良に必要な資金の貸付けを行うことを業務として行っている。","a":1,"e":"マンション管理組合等への共用部分改良資金の直接融資は機構の業務。","m":"マンション共用部融資"},{"f":"税他","t":"住宅金融支援機構","ref":"R04-46-2","s":"独立行政法人住宅金融支援機構は、団体信用生命保険業務として、貸付けを受けた者が死亡した場合だけでなく、重度障害の状態となった場合にも、支払われる保険金を当該貸付けに係る債務の弁済に充当している。","a":1,"e":"死亡のほか重度障害の場合の保険金も債務弁済に充当する業務を行う。","m":"団信は重度障害も"},{"f":"税他","t":"住宅金融支援機構","ref":"R04-46-4","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において買い取った住宅ローン債権を担保としてMBS（資産担保証券）を発行することにより、債券市場から資金を調達している。","a":1,"e":"買取型で買い取った住宅ローン債権を担保にMBSを発行し資金調達する。","m":"買取型はMBS発行"},{"f":"税他","t":"住宅金融支援機構","ref":"R02-46-2","s":"独立行政法人住宅金融支援機構が行う、災害により滅失した住宅に代わるべき建築物の建設又は購入に必要な資金の貸付けについては、元金据置期間を設けることができない。","a":0,"e":"災害復興建築物の貸付金は元金据置期間を設けることができる。","m":"災害復興は据置可"},{"f":"税他","t":"住宅金融支援機構","ref":"R07-46-3","s":"独立行政法人住宅金融支援機構は、高齢者が自ら居住する住宅について行うバリアフリー工事に必要な資金の貸付けについて、貸付けを受けた者の死亡時に一括して償還する方法をとることができる制度を設けている。","a":1,"e":"高齢者向け返済特例制度として死亡時一括償還が設けられている。","m":"高齢者は死亡時一括"},{"f":"税他","t":"住宅金融支援機構","ref":"R06-46-3","s":"独立行政法人住宅金融支援機構は、民間金融機関が貸し付けた住宅ローンについて住宅融資保険を引き受けることにより、民間金融機関による住宅資金の供給を支援している。","a":1,"e":"住宅融資保険により民間金融機関の住宅資金供給を支援している。","m":"融資保険で民間支援"},{"f":"税他","t":"景品表示法","ref":"R04-47-1","s":"宅地建物取引業者が新聞折込チラシに分譲住宅の広告を掲載する場合において、駅からの徒歩による所要時間は、道路距離80ｍにつき1分間を要するものとして算出し、1分未満の端数が生じたときは切り捨てて表示しなければならない。","a":0,"e":"1分未満の端数は切り上げる。","m":"徒歩80m1分切上げ"},{"f":"税他","t":"景品表示法","ref":"R04-47-2","s":"宅地建物取引業者が、既に売買契約が成立している物件をインターネット広告に掲載し続けた場合であっても、顧客からの問合せがあった際に契約済みである旨を説明すれば、不当表示には当たらない。","a":0,"e":"契約済み物件の掲載はおとり広告に当たり、事後に説明しても不当表示となる。","m":"契約済み掲載はおとり"},{"f":"税他","t":"景品表示法","ref":"R05-47-1","s":"宅地建物取引業者が広告に掲載した物件が実際に存在するものであっても、その業者に当該物件を取引する意思がない場合には、その表示は不当表示に当たる。","a":1,"e":"実際には取引する意思がない物件の表示はおとり広告として禁止される。","m":"意思なき広告はおとり"},{"f":"税他","t":"景品表示法","ref":"R04-47-4","s":"宅地建物取引業者が建築条件付土地の取引について広告をする場合には、取引の対象が土地である旨、建築請負契約を締結すべき期限等の条件の内容及び条件が成就しなかったときの措置の内容を明示しなければならない。","a":1,"e":"対象が土地である旨、条件の内容、条件不成就時の措置を明示する必要がある。","m":"建築条件付は3点明示"},{"f":"税他","t":"景品表示法","ref":"R07-47-1","s":"宅地建物取引業者が分譲団地の広告を行う場合において、団地と最寄駅との間の道路距離又は所要時間は、団地内の最も近い区画又は最も遠い区画のいずれか一方を起点として算出した数値を表示すれば足りる。","a":0,"e":"最も近い区画と最も遠い区画を起点とした数値の両方を表示する。","m":"団地は近遠両方"},{"f":"税他","t":"景品表示法","ref":"R03s-47-4","s":"宅地建物取引業者が中古マンションの広告を行う場合において、修繕積立金が住戸により異なり、全ての住戸の修繕積立金を示すことが困難であるときは、最低額及び最高額のみで表示することができる。","a":1,"e":"全住戸の表示が困難なときは最低額と最高額のみで表示できる。平均額は不可。","m":"最低と最高のみ"},{"f":"税他","t":"景品表示法","ref":"R06-47-2","s":"宅地建物取引業者が土地の売買の広告を行う場合において、当該土地上に古家が存在するときであっても、現地を見れば古家の存在が容易に分かるのであれば、広告においてその旨を明示する必要はない。","a":0,"e":"古家・廃屋等が存在するときはその旨を明示しなければならない。","m":"古家は必ず明示"},{"f":"税他","t":"景品表示法","ref":"R06-47-4","s":"宅地建物取引業者が建物の売買の広告を行う場合において、当該建物が建築工事完了後1年以上経過していても、一度も居住の用に供されたことがないものであれば、「新築」と表示することができる。","a":0,"e":"新築は建築工事完了後1年未満で、かつ居住の用に供されたことがないもの。","m":"新築は1年未満未使用"},{"f":"税他","t":"景品表示法","ref":"R07-47-3","s":"宅地建物取引業者が物件の広告を行う場合において、新設予定の鉄道の駅については、当該路線の運行主体が公表したものに限り、その新設予定時期を明示して表示することができる。","a":1,"e":"運行主体が公表したものに限り、新設予定時期を明示して表示できる。","m":"新駅は公表分のみ"},{"f":"税他","t":"景品表示法","ref":"R02s-47-2","s":"宅地建物取引業者が物件の広告を行う場合において、取引態様については、「売主」、「貸主」、「代理」又は「媒介（仲介）」の別をこれらの用語を用いて表示しなければならない。","a":1,"e":"取引態様はこれらの用語で明示する。「直販」等は不可。","m":"態様は4用語"},{"f":"税他","t":"土地・建物","ref":"R05-49-2","s":"谷底低地に軟弱層が厚く堆積している所では、地震の際に軟弱層によって地震動が吸収されるため、周辺の台地に比べて地震動が小さくなり、被害も小さくなる傾向がある。","a":0,"e":"軟弱層が厚い所では地震動が増幅され揺れが大きくなる。","m":"軟弱層は揺れ増幅"},{"f":"税他","t":"土地・建物","ref":"R05-49-1","s":"河川の両側に形成される自然堤防の後背湿地側の縁は、砂が緩く堆積していて地下水位も浅いため、地震の際に液状化被害が生じやすい地盤である。","a":1,"e":"砂が緩く堆積し地下水位が浅いため液状化しやすい。","m":"後背湿地側は液状化"},{"f":"税他","t":"土地・建物","ref":"R04-49-2","s":"河川の下流部や海岸沿いに広がる低地は、一般に地盤が安定しており洪水や地震などの自然災害に対して強いことから、防災的見地から住宅地として好ましい土地であるといえる。","a":0,"e":"低地は軟弱地盤が多く、洪水・地震・津波等の災害リスクが高い。","m":"低地は災害に弱い"},{"f":"税他","t":"土地・建物","ref":"R04-49-1","s":"台地は一般に水はけが良く住宅地として適しているが、台地上の浅い谷は、豪雨時には周囲から水が集まり、一時的に浸水することがあるので注意を要する。","a":1,"e":"台地上でも浅い谷には水が集まり浸水することがある。","m":"台地の谷は浸水注意"},{"f":"税他","t":"土地・建物","ref":"R01-49-3","s":"台地・段丘は、農地として利用されることが多く、都市的な土地利用も多いが、一般に水はけが悪く地盤も軟弱であることから、自然災害に対して安全度の低い所である。","a":0,"e":"台地・段丘は水はけが良く地盤も安定し、自然災害に対して安全度が高い。","m":"台地は安全度高い"},{"f":"税他","t":"土地・建物","ref":"R05-50-3","s":"鉄筋コンクリート構造において、鉄筋とコンクリートを一体化するためには、表面に突起のある異形棒鋼よりも、表面が平滑な丸鋼を用いる方が優れている。","a":0,"e":"表面に突起のある異形棒鋼の方が付着力が高く一体化に優れる。","m":"異形棒鋼が付着良"},{"f":"税他","t":"土地・建物","ref":"R04-50-4","s":"木造建築物の壁の構造において、柱を壁の中に隠す大壁ではなく柱を露出させる真壁のみで構成するのが洋風構造であり、大壁のみで構成するのが和風構造である。","a":0,"e":"真壁は和風、大壁は洋風。両者を併用する場合もある。","m":"真壁＝和、大壁＝洋"},{"f":"税他","t":"土地・建物","ref":"R06-50-3","s":"ブレース構造は、柱と梁で囲まれた部分に斜材（筋かい）を入れて地震力等による建築物の変形を抑える構造であり、ラーメン構造など他の構造と併用されることはない。","a":0,"e":"ブレース構造はラーメン構造等と併用されることがある。","m":"ブレースは併用可"},{"f":"税他","t":"土地・建物","ref":"R06-50-4","s":"建築物の構造のうち壁式構造は、板状の壁体と床版を一体として箱形の構造体を構成するものであり、原則として柱や梁を用いず、壁で荷重を支える構造である。","a":1,"e":"壁式構造は壁と床で箱形をつくり、柱・梁を用いない構造。","m":"壁式は柱梁なし"},{"f":"税他","t":"土地・建物","ref":"R02-50-3","s":"建築物の基礎のうち直接基礎の形式として、建物の底部全体を一枚の鉄筋コンクリートの版で支えるように設けるものを布基礎といい、地盤が比較的軟弱な場合などに用いられる。","a":0,"e":"底部全体に設けるのはべた基礎。布基礎は壁体等の下に連続して設ける。","m":"全体＝べた、壁下＝布"},{"f":"権利","t":"時効","ref":"H27-01-1","s":"債務不履行によって人の生命又は身体が侵害された場合の損害賠償請求権は、債権者が権利を行使できることを知った時から5年間、又は権利を行使できる時から10年間行使しないときは、時効によって消滅する。","a":0,"e":"生命・身体の侵害による損害賠償請求権は、客観的起算点からの期間が20年に延長されている（民法167条）。","m":"生命身体は5年・20年"},{"f":"権利","t":"保証・連帯債務","ref":"H27-01-2","s":"事業のために負担した貸金等債務を主たる債務とする保証契約で個人が保証人となるものは、契約締結前1か月以内に作成された公正証書で保証意思を表示していなければ、原則として効力を生じない。","a":1,"e":"事業用融資の個人保証には、締結前1か月以内の公正証書による保証意思の表示が必要（民法465条の6）。経営者等は例外。","m":"事業融資の個人保証は公正証書"},{"f":"権利","t":"債務不履行・解除","ref":"H27-01-4","s":"AがBに対する債務を履行しなかった場合において、債務の不履行又はこれによる損害の発生・拡大についてBにも過失があったときは、裁判所は、これを考慮して損害賠償の責任及びその額を定める。","a":1,"e":"債務不履行の過失相殺。不法行為と異なり考慮は必須で、責任自体を否定することもできる（民法418条）。","m":"債務不履行の過失相殺は必須"},{"f":"権利","t":"意思表示・行為能力","ref":"H27-02-1","s":"AがBと通謀して甲土地を仮装譲渡し、Bがこれを虚偽表示について善意のCに転売した場合、Cが所有権移転登記を備えていなくても、AはCに対してAB間の売買の無効を主張できない。","a":1,"e":"虚偽表示の無効は善意の第三者に対抗できず、第三者は登記も無過失も不要（民法94条2項・判例）。","m":"善意の第三者は登記なしで保護"},{"f":"権利","t":"意思表示・行為能力","ref":"H27-02-2","s":"AがBと通謀して甲土地を仮装譲渡し、Bが甲土地上に建てた乙建物をCに賃貸した場合、Cが仮装譲渡について善意であれば、AはCに対して甲土地の売買の無効を主張できない。","a":0,"e":"土地上の建物の賃借人は、土地の仮装譲渡について法律上の利害関係がなく、94条2項の第三者に当たらない（判例）。","m":"建物賃借人は第三者でない"},{"f":"権利","t":"意思表示・行為能力","ref":"H27-02-4","s":"AがBと通謀して甲土地を仮装譲渡し、甲土地がBから虚偽表示について悪意のCへ、さらにCから善意のDへと転売された場合、AはDに対してAB間の売買の無効を主張できない。","a":1,"e":"転得者も94条2項の第三者に含まれ、前者が悪意でも転得者自身が善意なら保護される（判例）。","m":"転得者は自分の善意で判断"},{"f":"権利","t":"賃貸借","ref":"H27-03-1","s":"A所有の甲建物をBに賃貸した場合はBが死亡しても賃借権は相続人に承継されるが、甲建物をBに無償で貸す使用貸借の場合は、特約がなければ借主Bの死亡によって契約は終了する。","a":1,"e":"使用貸借は借主の死亡で終了する（民法597条3項）。賃借権は財産権として相続される。","m":"使用貸借は借主の死で終了"},{"f":"権利","t":"賃貸借","ref":"H27-03-3","s":"A所有の甲建物をBに無償で貸す使用貸借契約は、AとBの合意だけでは成立せず、AがBに甲建物を実際に引き渡すことによって初めて効力を生じる要物契約である。","a":0,"e":"改正民法で使用貸借は諾成契約となった（民法593条）。書面によらない場合は貸主が引渡しまで解除できる。","m":"使用貸借も今は諾成契約"},{"f":"権利","t":"賃貸借","ref":"H27-03-2","s":"A所有の甲建物をBに無償で貸す使用貸借において、Bが甲建物の通常の必要費（日常の修繕費など）を支出した場合、BはAに対して直ちにその償還を請求することができる。","a":0,"e":"使用貸借では借主が通常の必要費を負担する（民法595条1項）。賃貸借なら直ちに償還請求できる（608条）。","m":"タダで借りたら通常費は自腹"},{"f":"権利","t":"時効","ref":"H27-04-1","s":"Bが父から甲土地の賃借権を相続し、所有者Aに賃料を支払いながら甲土地の占有を続けている場合でも、相続から20年間占有を継続すれば、Bは甲土地の所有権を時効取得できる。","a":0,"e":"所有権の取得時効には所有の意思が必要。賃借人としての占有は他主占有なので時効取得できない（民法162条）。","m":"賃料払う占有に所有の意思なし"},{"f":"権利","t":"時効","ref":"H27-04-2","s":"Bの父が甲土地を11年間占有した後、Bが相続によりその占有を承継してさらに9年間占有した場合、Bは自分の占有期間しか主張できないため、所有権を時効取得できない。","a":0,"e":"占有の承継人は前の占有者の占有を併せて主張できる（民法187条1項）。11年＋9年で20年となる。","m":"相続した占有は足し算OK"},{"f":"権利","t":"時効","ref":"H27-04-3","s":"Aから甲土地を買い受けたCが移転登記を備えた後に、甲土地を占有するBの取得時効が完成した場合、Bは登記がなくても、Cに対して時効による所有権の取得を主張できる。","a":1,"e":"時効完成前の第三者は当事者と同様に扱われ、時効取得者は登記なしで対抗できる（判例）。","m":"完成前の第三者には登記不要"},{"f":"権利","t":"時効","ref":"H27-04-4","s":"農地の賃借人Bが所有者Aと賃貸借契約を結び、20年以上賃料を払って継続的に耕作を続けていても、農地法の許可を受けていない以上、Bが農地の賃借権を時効取得することはない。","a":0,"e":"判例は、継続的な耕作と賃借意思の表れがあれば農地の賃借権の時効取得を認め、農地法3条の許可も不要とする。","m":"農地賃借権も時効取得OK"},{"f":"権利","t":"抵当権・担保","ref":"H27-07-1","s":"競売代金5,400万円の甲土地に、B（1番・債権2,000万円）、C（2番・2,400万円）、D（3番・4,000万円）の抵当権があり、無担保債権者E（2,000万円）もいる。BがEに抵当権を譲渡すると、Bの配当は0円となる。","a":1,"e":"抵当権の譲渡では、Bの優先枠2,000万円からEが先に配当を受け、枠を使い切るのでBは0円（民法376条1項）。","m":"譲渡は相手に枠ごと渡す"},{"f":"権利","t":"抵当権・担保","ref":"H27-07-3","s":"競売代金5,400万円の甲土地に、B（1番・債権2,000万円）、C（2番・2,400万円）、D（3番・4,000万円）の抵当権があり、無担保債権者E（2,000万円）もいる。BがEのために抵当権を放棄すると、Bは2,000万円全額の配当を受ける。","a":0,"e":"放棄ではBの優先枠2,000万円をBとEが債権額の割合（1:1）で分け、各1,000万円となる（民法376条1項）。","m":"放棄は債権額で按分"},{"f":"権利","t":"賃貸借","ref":"H27-08-ア","s":"建物賃貸借が終了した場合、賃貸人の敷金返還債務と賃借人の建物明渡債務は同時履行の関係にあり、賃借人は敷金の返還を受けるまで、建物の明渡しを拒むことができる。","a":0,"e":"敷金返還請求権は明渡し後に発生するので、明渡しが先履行となる（民法622条の2第1項）。","m":"明渡しが先、敷金は後"},{"f":"権利","t":"債務不履行・解除","ref":"H27-08-イ","s":"Aが所有する宅地をBに売却する契約が、Aの債務不履行を理由に解除された場合、契約は遡って消滅するので、Aの代金返還債務とBの宅地返還債務は同時履行の関係に立たない。","a":0,"e":"解除による原状回復義務にも同時履行の抗弁権の規定が準用される（民法546条・533条）。","m":"解除後の返還も同時履行"},{"f":"権利","t":"売買・契約不適合","ref":"H27-08-ウ","s":"宅地の売買契約において、同時履行に関する特約がない場合、買主の代金支払債務と、売主の宅地の引渡債務及び所有権移転登記に協力する債務とは、同時履行の関係に立つ。","a":1,"e":"双務契約の対価的な債務は同時履行の関係にあり、登記に協力する債務も含まれる（民法533条・判例）。","m":"代金と引渡し・登記は同時"},{"f":"権利","t":"賃貸借","ref":"H27-09-1","s":"土地の無断転貸に背信的行為と認めるに足りない特段の事情があって解除できない場合でも、賃貸人と賃借人が賃貸借を合意解除すれば、賃貸人は転借人に土地の明渡しを請求できる。","a":0,"e":"合意解除は、賃料不払い等で法定解除できた場合を除き、転借人に対抗できない（民法613条3項・判例）。","m":"合意解除は転借人に対抗不可"},{"f":"権利","t":"賃貸借","ref":"H27-09-2","s":"土地の賃貸人Aが、賃借人Bから転借人Cへの土地の転貸を承諾している場合でも、AとBは、Cの同意を得ることなく、AB間の賃貸借契約を合意によって解除すること自体はできる。","a":1,"e":"合意解除自体は可能だが、その効果は原則として転借人Cに対抗できない（民法613条3項）。","m":"合意解除はできるが対抗不可"},{"f":"権利","t":"相続","ref":"H27-10-1","s":"自筆証書遺言の一部を削除する場合、遺言者が削除したい部分に二重線を引いてそこに押印しておけば、変更した旨の付記やその部分への署名がなくても、削除の効力が生じる。","a":0,"e":"変更・削除は、場所を指示し変更した旨を付記して署名し、変更場所に押印しないと効力がない（民法968条3項）。","m":"訂正は指示・付記・署名・押印"},{"f":"権利","t":"相続","ref":"H27-10-3","s":"遺言執行者がいる場合に、相続人が遺言の執行を妨げる相続財産の処分（第三者への売却など）をしたときは、その処分は無効となるが、この無効は善意の第三者には対抗できない。","a":1,"e":"執行を妨げる行為は無効としつつ、取引の安全のため善意の第三者には対抗できない（民法1013条2項）。","m":"執行妨害は無効、善意者は保護"},{"f":"権利","t":"相続","ref":"H27-10-4","s":"被相続人の遺贈によって遺留分を侵害された相続人は、受遺者に対して、遺贈の目的物そのものの返還ではなく、遺留分侵害額に相当する金銭の支払を請求することができる。","a":1,"e":"遺留分の請求は金銭債権化され、遺留分侵害額に相当する金銭の支払請求となった（民法1046条1項）。","m":"遺留分はお金で取り戻す"},{"f":"権利","t":"借家","ref":"H27-11-1","s":"期間3年・賃料月額10万円の建物賃貸借で、期間満了の1年前から6か月前までに更新拒絶の通知がなかった場合、契約は期間3年・賃料月額10万円の同一条件で更新されたものとみなされる。","a":0,"e":"法定更新後は従前と同一条件だが、期間は定めのないものとなる（借地借家法26条1項）。","m":"法定更新後は期間の定めなし"},{"f":"権利","t":"借家","ref":"H27-11-2","s":"Aが所有する甲建物をBに賃貸する期間の定めのない建物賃貸借で、Aが正当事由のある解約の申入れをした場合、賃貸借は解約申入れの日から3か月を経過した時に終了する。","a":0,"e":"賃貸人からの解約申入れは6か月経過で終了（借地借家法27条1項）。賃借人からなら3か月（民法617条）。","m":"大家からの解約は6か月"},{"f":"権利","t":"借家","ref":"H27-11-4","s":"建物の賃借人が賃貸人の同意を得て建物に造作を付加していても、賃借人の賃料不払いを理由に賃貸借契約が解除された場合は、賃借人は賃貸人に造作買取請求権を行使できない。","a":1,"e":"造作買取請求は期間満了・解約申入れによる終了時の権利で、債務不履行による解除では認められない（判例）。","m":"不払い解除なら造作買取なし"},{"f":"権利","t":"借家","ref":"H27-12-1","s":"期間5年の建物賃貸借では、定期建物賃貸借か普通建物賃貸借かを問わず、建物の引渡しを受けていれば、賃借権の登記がなくても、その後に建物を取得した第三者に対抗できる。","a":1,"e":"建物賃借権は引渡しで対抗力を得る（借地借家法31条）。定期借家でも同じで、これに反する不利な特約は無効。","m":"借家は引渡しで対抗"},{"f":"権利","t":"借家","ref":"H27-12-2","s":"期間5年の建物賃貸借で、一定期間は賃料を増額しない旨の特約を定めた場合、その特約は、普通建物賃貸借では有効だが、定期建物賃貸借では借主に不利なので無効となる。","a":0,"e":"不増額特約は借主に有利なので、普通借家でも定期借家でも有効（借地借家法32条1項ただし書）。","m":"上げない特約はどちらも有効"},{"f":"権利","t":"借家","ref":"H27-12-3","s":"期間5年の建物賃貸借で、賃借人は造作買取請求権を行使しない旨の特約をした場合、その特約は定期建物賃貸借では有効だが、普通建物賃貸借では借主に不利なため無効となる。","a":0,"e":"造作買取請求権は任意規定で、普通借家でも特約で排除できる（借地借家法33条・37条）。","m":"造作買取は特約で排除OK"},{"f":"権利","t":"区分所有法","ref":"H27-13-1","s":"区分所有建物で管理者が選任されていない場合の集会では、規約に別段の定めがある場合や別段の決議をした場合を除き、集会を招集した区分所有者の1人が議長となる。","a":1,"e":"集会の議長は、原則として管理者又は集会を招集した区分所有者の1人（区分所有法41条）。","m":"議長は管理者か招集者"},{"f":"権利","t":"区分所有法","ref":"H27-13-4","s":"区分所有建物の管理者は、規約に別段の定めがない限り、集会の決議によって選任・解任することができるが、区分所有法上、その任期は2年以内としなければならない。","a":0,"e":"区分所有法に管理者の任期の定めはなく、任期は規約等で自由に定められる（区分所有法25条1項）。","m":"管理者に法定任期なし"},{"f":"権利","t":"不動産登記法","ref":"H27-14-1","s":"何人も、登記官に対し、手数料を納付して登記事項証明書の交付を請求することができ、その際に、請求する者がその不動産について利害関係を有することを明らかにする必要はない。","a":1,"e":"登記事項証明書は誰でも手数料を納付して請求でき、利害関係の証明は不要（不動産登記法119条1項）。","m":"登記事項証明書は誰でもOK"},{"f":"権利","t":"不動産登記法","ref":"H27-14-4","s":"筆界特定書の写しの交付は、筆界特定の申請人など、その筆界について利害関係を有する者が、利害関係を有する部分に限って、手数料を納付して請求することができる。","a":0,"e":"筆界特定書等の写しは、何人も手数料を納付して交付を請求できる（不動産登記法149条1項）。","m":"筆界特定書の写しも誰でも"},{"f":"権利","t":"不動産登記法","ref":"H27-14-3","s":"登記事項証明書の交付の請求は、登記所の窓口に出頭して行う方法や郵送による方法のほか、電子情報処理組織を使用するオンラインの方法によってもすることができる。","a":1,"e":"交付請求は窓口・郵送のほかオンラインでも可能で、証明書は窓口又は郵送で受け取れる。","m":"証明書請求はネットでもOK"},{"f":"法令","t":"開発許可","ref":"H27-15-4","s":"市街化調整区域のうち開発許可を受けた開発区域以外の区域内では、建築物の新築に原則として都道府県知事の許可が必要だが、仮設建築物の新築であれば、その許可は不要である。","a":1,"e":"開発区域外の調整区域での建築制限には、仮設建築物の新築等の例外がある（都市計画法43条1項）。","m":"仮設なら調整区域でも許可不要"},{"f":"法令","t":"開発許可","ref":"H27-15-2","s":"開発許可を受けた開発区域内で、工事完了の公告があった後に、当該開発許可に係る予定建築物を新築しようとする者は、新築の30日前までに都道府県知事に届け出なければならない。","a":0,"e":"予定建築物の新築なら許可も届出も不要。完了公告後に制限されるのは予定建築物等以外の新築等（都市計画法42条1項）。","m":"予定建築物なら届出不要"},{"f":"法令","t":"開発許可","ref":"H27-15-1","s":"市街化区域内で開発許可を受けた者が、開発区域の規模を100㎡に縮小して開発行為を行う場合、変更後の行為は許可不要の規模となるので、変更の許可を受ける必要はない。","a":1,"e":"変更後の開発行為が許可不要のものに当たるときは、変更の許可は不要（都市計画法35条の2第1項ただし書）。","m":"許可不要規模への変更は不要"},{"f":"法令","t":"都市計画法","ref":"H27-16-1","s":"開発整備促進区を定める地区計画は、第二種住居地域、準住居地域、工業地域のほか、用途地域が定められていない土地の区域（市街化調整区域を除く）にも定めることができる。","a":1,"e":"大規模集客施設の立地を図る区域で、これらの地域に限り定められる（都市計画法12条の5第4項）。","m":"促進区は二住・準住・工業"},{"f":"法令","t":"都市計画法","ref":"H27-16-2","s":"準都市計画区域は、土地利用の整序等が必要な都市計画区域外の区域として指定されるものであるから、その都市計画に市街化区域と市街化調整区域との区分（区域区分）を定めることができる。","a":0,"e":"区域区分は都市計画区域に定めるもの。準都市計画区域では用途地域など一部の地域地区のみ定められる（都市計画法8条2項）。","m":"準都市に区域区分なし"},{"f":"法令","t":"都市計画法","ref":"H27-16-4","s":"同一の区域について、市町村が定めた都市計画と都道府県が定めた都市計画の内容が抵触する場合には、その限りにおいて、地域の実情に詳しい市町村が定めた都市計画が優先する。","a":0,"e":"抵触する限りにおいて、都道府県が定めた都市計画が優先する（都市計画法15条4項）。","m":"抵触したら都道府県が勝つ"},{"f":"法令","t":"建築基準法","ref":"H27-18-2","s":"建築物の敷地が建蔽率の限度の異なる2つの用途地域にわたる場合で、建築物がそのうち一方の地域内のみに建築されるときは、その地域の建蔽率の限度が敷地全体に適用される。","a":0,"e":"敷地が異なる地域にわたるときは、建築物の位置にかかわらず各部分の面積で加重平均する（建築基準法53条2項）。","m":"建蔽率は敷地面積で按分"},{"f":"法令","t":"建築基準法","ref":"H27-18-1","s":"建築物の容積率の算定の基礎となる延べ面積には、エレベーターの昇降路の部分や、共同住宅・老人ホーム等の共用の廊下・階段の用に供する部分の床面積は算入されない。","a":1,"e":"昇降路や、共同住宅・老人ホーム等の共用の廊下・階段の部分は延べ面積に算入しない（建築基準法52条6項）。","m":"EVと共用廊下は容積率に入れない"},{"f":"法令","t":"建築基準法","ref":"H27-18-4","s":"建築協定の目的となっている建築物に関する基準が建築物の借主の権限に係る場合には、その建築協定については、当該建築物の借主は土地の所有者等とみなされ、協定の効力が及ぶ。","a":1,"e":"借主の権限に係る基準については借主も協定の当事者として扱われ、効力が借主にも及ぶ（建築基準法77条）。","m":"借主も所有者等とみなす"},{"f":"法令","t":"盛土規制法","ref":"H27-19-2","s":"宅地造成等工事規制区域の指定の際、すでにその区域内で宅地造成等に関する工事を行っている工事主は、工事を続けるために、改めて都道府県知事の許可を受けなければならない。","a":0,"e":"指定時に工事中の工事主は、指定の日から21日以内に知事へ届け出ればよい（盛土規制法21条1項）。","m":"指定時工事中は21日以内届出"},{"f":"法令","t":"盛土規制法","ref":"H27-19-4","s":"宅地造成等工事規制区域内の宅地において、面積500㎡の土地を切土し、高さ1.5mの崖が生じるだけの工事は、宅地造成等に当たらず、都道府県知事の許可は不要である。","a":1,"e":"切土は高さ2m超の崖を生じる場合や、土地の面積が500㎡を超える場合に許可が必要。本問はどちらにも当たらない。","m":"切土は2m崖・500㎡超で許可"},{"f":"法令","t":"盛土規制法","ref":"H27-19-1","s":"都道府県知事は、宅地造成等工事規制区域内の土地について災害防止のため必要があるときは、土地所有者だけでなく管理者・占有者・工事主・工事施行者にも擁壁等の設置などを勧告できる。","a":1,"e":"擁壁等の設置その他の措置は、所有者等や工事主・工事施行者に勧告できる（盛土規制法22条2項）。","m":"勧告は工事関係者にもOK"},{"f":"法令","t":"土地区画整理法","ref":"H27-20-4","s":"土地区画整理事業の施行により生じた公共施設の用に供する土地は、換地処分の公告があった日の翌日において、国や都道府県が管理するものを含め、すべてその所在する市町村に帰属する。","a":0,"e":"公共施設用地は、原則としてその公共施設を管理すべき者に帰属し、国や都道府県の場合もある（土地区画整理法105条3項）。","m":"公共施設用地は管理者へ"},{"f":"法令","t":"土地区画整理法","ref":"H27-20-2","s":"換地処分の公告があった日の翌日以後も、従前の宅地の上に存した地役権は原則として従前の宅地の上に存続するが、事業の施行により行使する利益がなくなった地役権は消滅する。","a":1,"e":"地役権は換地に移らず従前の宅地上に残るのが原則（土地区画整理法104条4項・5項）。","m":"地役権は従前の宅地に残る"},{"f":"法令","t":"土地区画整理法","ref":"H27-20-3","s":"土地区画整理事業の換地計画において定められた保留地は、換地処分の公告があった日の翌日において施行者が取得し、施行者はこれを処分して事業の費用に充てることができる。","a":1,"e":"保留地は換地処分の公告の翌日に施行者が取得し、事業費の充当等に用いられる（土地区画整理法104条11項）。","m":"保留地は翌日に施行者へ"},{"f":"法令","t":"国土利用計画法","ref":"H27-21-1","s":"Aが死亡し、都市計画区域外にあるA所有の12,000㎡の土地を相続人Bが相続により取得した。面積が届出対象面積を超えていても、Bは国土利用計画法の事後届出をする必要はない。","a":1,"e":"事後届出は対価を得て行う売買等の契約が対象。相続は契約ではないので不要（国土利用計画法23条）。","m":"相続は契約でないので届出不要"},{"f":"法令","t":"国土利用計画法","ref":"H27-21-2","s":"市街化区域内の3,000㎡の土地をAがBに売却する契約を締結した場合、売主Aと買主Bは共同して、契約締結日から2週間以内に都道府県知事に国土利用計画法の事後届出をしなければならない。","a":0,"e":"事後届出の義務者は権利取得者（買主B）のみで、売主は届出不要（国土利用計画法23条1項）。","m":"届出は買主だけ・2週間"},{"f":"法令","t":"国土利用計画法","ref":"H27-21-3","s":"市街化調整区域内の6,000㎡の農地を、農地法3条1項の許可を受けて買い受けた者は、契約締結後2週間以内に、国土利用計画法23条の事後届出を都道府県知事にしなければならない。","a":0,"e":"農地法3条許可を受ける取引は事後届出の適用除外。5条許可の場合は除外されない（国土利用計画法23条2項）。","m":"農地法3条許可なら届出不要"},{"f":"法令","t":"農地法","ref":"H27-22-1","s":"市街化区域内にある農地について、耕作の目的で所有権を取得しようとする者は、あらかじめ農業委員会に届け出れば、農地法3条1項の許可を受けなくても所有権を取得できる。","a":0,"e":"市街化区域の届出特例は4条・5条だけ。3条（権利移動）には特例がなく許可が必要。","m":"3条に市街化区域特例なし"},{"f":"法令","t":"農地法","ref":"H27-22-3","s":"市街化区域外にある自己所有の農地に、農業者が自ら居住するための住宅を建設する目的で農地を転用する場合、自己の居住用であるから、農地法4条1項の許可を受ける必要はない。","a":0,"e":"自己居住用の住宅でも転用に当たり、農業用施設等の例外に当たらないので4条許可が必要。","m":"自宅用でも転用許可が必要"},{"f":"法令","t":"農地法","ref":"H27-22-4","s":"農業者が住宅改築資金の借入れのため農地に抵当権を設定し、返済不能となって競売が行われた結果、第三者が農地を取得する場合、その取得には農地法3条又は5条の許可が必要である。","a":1,"e":"抵当権の設定自体は許可不要だが、競売による所有権の取得は権利移動であり、3条又は5条の許可が必要。","m":"競売で取得も許可が必要"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H27-24-2","s":"固定資産税の標準税率は1.4％とされているが、市町村は条例で固定資産税の税率を定めるにあたり、財政上の特別の必要があっても、1.7％を超える税率を定めることはできない。","a":0,"e":"標準税率は1.4％で、制限税率はない。財政上必要なら1.4％を超える税率も条例で定められる（地方税法350条）。","m":"固定資産税に上限税率なし"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H27-24-3","s":"マンションのような区分所有家屋の敷地である土地に対する固定資産税については、特例による按分は認められず、各区分所有者が税額の全額について連帯して納付する義務を負う。","a":0,"e":"区分所有家屋の敷地は、原則として持分割合で按分した額を各区分所有者が納める（地方税法352条の2）。","m":"マンション敷地は持分で按分"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H27-24-4","s":"市町村は、同一の者がその市町村内に所有する土地の課税標準額の合計が30万円未満の場合、財政上その他特別の必要があるときを除き、固定資産税を課することができない。","a":1,"e":"固定資産税の免税点は土地30万円・家屋20万円・償却資産150万円（地方税法351条）。","m":"免税点 土地30・家屋20"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H27-24-1","s":"固定資産税は賦課期日である1月1日現在の固定資産課税台帳上の所有者に課されるため、ある年の1月15日に新築された住宅については、その年度分の固定資産税は課されない。","a":1,"e":"賦課期日は1月1日（地方税法359条）。翌年度分から課税され、新築住宅の減額もそこから適用される。","m":"1月1日に無ければ課税なし"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H27-25-1","s":"地価公示の公示区域は都市計画法の都市計画区域内に限って定められ、土地取引が相当程度見込まれる区域であっても、都市計画区域外の区域を公示区域とすることはできない。","a":0,"e":"公示区域は都市計画区域その他土地取引が相当程度見込まれる区域として省令で定める区域（地価公示法2条1項）。","m":"公示区域は区域外も可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H27-25-2","s":"地価公示法の「正常な価格」の前提となる取引には、農地・採草放牧地・森林の取引は原則として含まれないが、森林を伐採して住宅地とするために行う森林の取引は含まれる。","a":1,"e":"農地等の取引でも、農地等以外のものとするための取引は含まれる（地価公示法2条2項）。","m":"宅地目的の森林取引は含む"},{"f":"税他","t":"地価公示・鑑定評価","ref":"H27-25-3","s":"地価公示において、土地鑑定委員会は、標準地の正常な価格を判定するにあたり、二人以上の不動産鑑定士の鑑定評価を求め、その結果を審査し必要な調整を行わなければならない。","a":1,"e":"鑑定士2人以上の評価を審査・調整して判定し、年1回公示する（地価公示法2条1項）。","m":"鑑定士は2人以上"},{"f":"業法","t":"免許","ref":"H27-26-ア","s":"都市計画法の工業専用地域内にある土地で、現に建築資材置き場として利用されているものは、その上に建物が建っていなくても、宅地建物取引業法上の「宅地」に該当する。","a":1,"e":"用途地域内の土地は、道路・公園・河川・広場・水路以外は宅地に当たる（宅建業法2条1号）。","m":"用途地域内は原則宅地"},{"f":"業法","t":"免許","ref":"H27-26-ウ","s":"都市計画法の用途地域が定められていない区域にある土地で、倉庫の敷地として利用されているものは、建物の敷地であっても宅地建物取引業法上の「宅地」には該当しない。","a":0,"e":"用途地域外でも、建物の敷地に供されている土地は宅地。倉庫も建物に当たる（宅建業法2条1号）。","m":"建物の敷地なら宅地"},{"f":"業法","t":"免許","ref":"H27-26-イ","s":"社会福祉法人が、高齢者の居住の安定確保に関する法律に規定するサービス付き高齢者向け住宅の貸借の媒介を反復継続して営む場合には、宅地建物取引業の免許を受ける必要はない。","a":0,"e":"社会福祉法人は免許不要の国・地方公共団体等に当たらない。貸借の媒介を業として行えば免許が必要。","m":"社福法人も媒介業なら免許"},{"f":"業法","t":"媒介契約","ref":"H27-28-ア","s":"宅建業者Aが宅地の売買の媒介契約を依頼者と締結したときは、遅滞なく媒介契約の内容を記載した書面を作成し、宅建士にその書面の内容を依頼者へ説明させなければならない。","a":0,"e":"媒介契約書面は業者が記名押印して交付すればよく、宅建士の記名や説明は不要（宅建業法34条の2第1項）。","m":"媒介契約書に宅建士は不要"},{"f":"業法","t":"媒介契約","ref":"H27-28-イ","s":"宅建業者が専任媒介契約を締結して指定流通機構に物件を登録する場合、物件の所在・規模・形質や売買すべき価額等に加え、依頼者の氏名も登録しなければならない。","a":0,"e":"登録事項は所在・規模・形質、価額、法令上の主要な制限、専属専任ならその旨。依頼者の氏名は含まれない。","m":"登録事項に依頼者名なし"},{"f":"業法","t":"媒介契約","ref":"H27-28-ウ","s":"宅建業者が建物の貸主から貸借の媒介の依頼を受けて媒介契約を締結した場合、宅建業法34条の2に基づく媒介契約の内容を記載した書面を、依頼者に交付する義務はない。","a":1,"e":"媒介契約書面の規制は売買・交換の媒介に限られ、貸借には適用されない（宅建業法34条の2第1項）。","m":"貸借の媒介は書面規制なし"},{"f":"業法","t":"重要事項説明","ref":"H27-29-1","s":"宅建業者は、宅地の売買の媒介を行う場合、その宅地を取得する買主だけでなく、宅建業者ではない売主に対しても、売買契約が成立するまでに重要事項の説明をしなければならない。","a":0,"e":"重要事項説明の相手は物件を取得し又は借りる側（買主・借主）で、売主には不要（宅建業法35条1項）。","m":"重説は買う側・借りる側へ"},{"f":"業法","t":"重要事項説明","ref":"H27-29-2","s":"宅建業者は、宅建業法35条の重要事項の説明と重要事項説明書面の交付を、取引の相手方の自宅や勤務先、喫茶店など、宅建業者の事務所以外の場所で行うことができる。","a":1,"e":"重要事項説明を行う場所に法律上の制限はない。説明時の宅建士証の提示は必要（宅建業法35条4項）。","m":"重説の場所は自由"},{"f":"業法","t":"重要事項説明","ref":"H27-29-4","s":"宅建業法35条の重要事項の説明を行う宅建士と、重要事項説明書面に記名する宅建士は、いずれも当該宅建業者の事務所に置かれる専任の宅建士でなければならない。","a":0,"e":"説明・記名とも宅建士であればよく、専任である必要はない（宅建業法35条1項・5項）。","m":"重説は専任でなくてOK"},{"f":"業法","t":"媒介契約","ref":"H27-30-ア","s":"宅建業者Aが、宅地の売主である宅建業者Bから売却を依頼されて専任媒介契約を締結した場合、依頼者が宅建業者であるから、Aは媒介契約書面の作成・交付を省略できる。","a":0,"e":"業者間取引で適用除外となるのは8種制限。媒介契約書面の作成・交付は省略できない（宅建業法34条の2・78条2項）。","m":"業者相手でも媒介書面は必要"},{"f":"業法","t":"媒介契約","ref":"H27-30-イ","s":"宅建業者Aが宅地の売主Bと専任媒介契約を締結した際、Bの申出により指定流通機構に物件を登録しない旨の特約をした場合、Aは登録をしなくても宅建業法に違反しない。","a":0,"e":"専任媒介では7日以内（休業日除く）の登録が義務で、これに反する特約は無効（宅建業法34条の2第5項・10項）。","m":"登録しない特約は無効"},{"f":"業法","t":"媒介契約","ref":"H27-30-エ","s":"宅建業者Aが宅地の売主Bと専任媒介契約を締結した際、媒介業務の処理状況を毎週金曜日にBへ報告する旨の特約をした場合、この特約は宅建業法上有効である。","a":1,"e":"専任媒介の報告義務は2週間に1回以上。毎週の報告は依頼者に有利で有効（宅建業法34条の2第9項）。","m":"報告は2週に1回以上"},{"f":"業法","t":"重要事項説明","ref":"H27-31-ア","s":"宅建業者が宅地の貸借を媒介する場合、その宅地が第一種低層住居専用地域内にあり、建築基準法の道路斜線制限の適用があるときは、重要事項としてその概要を説明しなければならない。","a":1,"e":"宅地の貸借では、借主が建物を建てる前提となるため建築基準法上の制限も説明事項になる（宅建業法35条1項2号）。","m":"宅地の貸借は建築制限も説明"},{"f":"業法","t":"重要事項説明","ref":"H27-31-ウ","s":"宅建業者が建物の貸借を媒介する場合、その建物が準防火地域内にあり、建築基準法による建築物の構造の制限があるときは、重要事項としてその概要を説明しなければならない。","a":0,"e":"建物の貸借では、準防火地域の構造制限など建築基準法上の制限は説明事項に含まれない。","m":"建物の貸借は構造制限不要"},{"f":"業法","t":"重要事項説明","ref":"H27-31-イ","s":"建物の貸借の媒介で、建物が新住宅市街地開発事業により造成された宅地上にあり、使用収益権の設定に知事の承認を要する制限があるときは、その概要を説明しなければならない。","a":1,"e":"新住宅市街地開発法32条1項の制限は、建物の貸借でも説明が必要な法令上の制限の一つ。","m":"新住宅の制限は借家でも説明"},{"f":"業法","t":"重要事項説明","ref":"H27-32-2","s":"宅建業者が宅地の貸借の媒介を行う場合において、借主との間で設定しようとする借地権が定期借地権であるときは、重要事項としてその旨を説明しなければならない。","a":1,"e":"宅地の貸借では、定期借地権を設定しようとするときはその旨が説明事項となる（宅建業法施行規則16条の4の3）。","m":"定期借地はその旨説明"},{"f":"業法","t":"重要事項説明","ref":"H27-32-3","s":"宅建業者が建物の売買の媒介を行う場合、その建物に消費生活用製品安全法の特定保守製品が備え付けられているときは、その保守点検に関する事項を重要事項として説明しなければならない。","a":0,"e":"特定保守製品の保守点検に関する事項は、売買・貸借のいずれでも35条の説明事項とされていない。","m":"特定保守製品は説明不要"},{"f":"業法","t":"重要事項説明","ref":"H27-32-4","s":"宅建業者が居住用建物の貸借の媒介を行う場合、契約期間については重要事項として説明する必要があるが、契約の更新に関する事項については説明する必要はない。","a":0,"e":"貸借では契約期間と契約の更新に関する事項の両方が説明事項（宅建業法施行規則16条の4の3）。","m":"期間も更新も説明する"},{"f":"業法","t":"報酬","ref":"H27-33-ア","s":"代金3,000万円の宅地売買で、売主から代理の依頼を受けた業者Aと買主から媒介の依頼を受けた業者B（いずれも課税事業者）は、Aが211万2,000円、Bが105万6,000円の報酬を受領できる。","a":0,"e":"両業者の報酬合計は代理の上限211万2,000円（96万円×2×1.1）以内でなければならず、合計316万8,000円は違反。","m":"1取引の合計は代理上限まで"},{"f":"業法","t":"報酬","ref":"H27-33-イ","s":"課税事業者A・Bが貸主・借主それぞれから依頼を受け、店舗用建物を月額借賃20万円・返還されない権利金500万円で賃貸させた。A・Bがそれぞれ依頼者から22万5,000円を受領しても違反しない。","a":1,"e":"居住用以外は権利金を売買代金とみなせる。500万×3％＋6万＝21万、税込23万1,000円が各依頼者からの上限。","m":"店舗は権利金方式もOK"},{"f":"業法","t":"報酬","ref":"H27-33-ウ","s":"月額借賃10万円の居住用建物の貸借で、貸主の承諾を得た業者Aが貸主から8万円、承諾のない借主から業者Bが5万5,000円を受領しても、宅建業法に違反しない（いずれも課税事業者）。","a":0,"e":"居住用建物の貸借の報酬は、双方からの合計で借賃1か月分＋税（11万円）以内。合計13万5,000円は違反。","m":"居住用貸借は合計1.1か月"},{"f":"業法","t":"宅建士","ref":"H27-35-1","s":"宅地建物取引業法には、宅地建物取引業者に公正誠実な業務遂行を求める規定はあるが、宅地建物取引士については公正かつ誠実に事務を行うべきことを定めた規定は置かれていない。","a":0,"e":"宅建士にも、購入者等の利益保護と円滑な流通のため公正かつ誠実に法定の事務を行う義務が定められている（15条）。","m":"宅建士にも公正誠実義務"},{"f":"業法","t":"宅建士","ref":"H27-35-2","s":"宅地建物取引士は、宅地建物取引業の業務に従事している間に限り、宅地建物取引士の信用又は品位を害するような行為をしてはならない義務を負い、私生活上の行為には及ばない。","a":0,"e":"信用失墜行為の禁止は業務中に限られず、職務と無関係な私的行為にも及ぶ（15条の2）。","m":"品位保持は私生活も含む"},{"f":"業法","t":"宅建士","ref":"H27-35-4","s":"宅地建物取引業者は従業者に必要な教育を行うよう努めなければならず、宅地建物取引士は宅地建物の取引に係る事務に必要な知識及び能力の維持向上に努めなければならない。","a":1,"e":"業者の従業者教育（31条の2）と宅建士の知識・能力の維持向上（15条の3）は、いずれも努力義務として規定されている。","m":"教育も研鑽も努力義務"},{"f":"業法","t":"8種制限","ref":"H27-36-ア","s":"宅建業者Aが自ら売主として宅建業者でないBに代金2,400万円の建物を売る契約で、損害賠償の予定額480万円と違約金240万円を定めた場合、この特約は全体が無効となる。","a":0,"e":"予定額と違約金の合計は代金の2割（480万円）まで。超えた240万円の部分だけが無効で、特約全体が無効になるわけではない（38条）。","m":"超えた分だけ無効"},{"f":"業法","t":"8種制限","ref":"H27-36-イ","s":"宅建業者Aが自ら売主として宅建業者でない買主Bに代金2,400万円の建物を売却する場合、Bの書面による承諾があれば、Aは代金の2割を超える720万円の手付を受領することができる。","a":0,"e":"業者が売主のとき手付は代金の2割（480万円）が上限で、買主が承諾しても超えて受領できない（39条1項）。","m":"手付2割は承諾でも超えず"},{"f":"業法","t":"8種制限","ref":"H27-36-ウ","s":"宅建業者Aが自ら売主として宅建業者でないBと工事完了前の建物を代金2,400万円で売買する場合、手付金120万円であれば、保全措置を講じずに受領することができる。","a":1,"e":"未完成物件は手付金等が代金の5%以下かつ1,000万円以下なら保全措置不要。120万円はちょうど5%なので不要（41条）。","m":"未完成は5%以下なら不要"},{"f":"業法","t":"業務上の規制","ref":"H27-37-1","s":"宅建業者Aは、建築確認を受ける前の新築予定の建物については、建築確認を受けるまでの間、その建物の貸借の媒介をして貸主と借主との間で賃貸借契約を成立させることはできない。","a":0,"e":"契約締結時期の制限は売買・交換に限られ、貸借は確認前でも代理・媒介して契約を締結させてよい（36条）。","m":"貸借は確認前でも契約OK"},{"f":"業法","t":"広告","ref":"H27-37-3","s":"宅建業者Aは、建築確認を受ける前の新築予定の建物については、建築確認を受けるまでの間、売買の広告に限らず、その建物の貸借の代理を行う旨の広告をすることもしてはならない。","a":1,"e":"広告開始時期の制限は売買だけでなく貸借にも及ぶため、確認前は貸借の広告もできない（33条）。","m":"広告は貸借も確認後"},{"f":"業法","t":"業務上の規制","ref":"H27-37-4","s":"宅建業者Aは、建築確認の申請中の建物であっても、建築確認を受けることを停止条件とする特約を付ければ、自ら売主として宅建業者でない買主との間で売買契約を締結することができる。","a":0,"e":"売買契約は確認等の処分後でなければ締結できず、停止条件付きでも認められない（36条）。","m":"停止条件付きでも売買不可"},{"f":"業法","t":"37条書面","ref":"H27-38-ア","s":"宅建業者Aが売主を代理して中古マンションの売買契約を締結した場合、契約不適合責任の履行に関する保証保険契約等の定めがあればその内容を37条書面に記載し、売主と買主の双方に交付しなければならない。","a":1,"e":"担保責任の履行措置の定めは任意的記載事項。代理の場合も契約当事者双方（売主と買主）に交付する（37条1項）。","m":"代理でも双方に交付"},{"f":"業法","t":"37条書面","ref":"H27-38-イ","s":"宅建業者Aが媒介して建物の売買契約を成立させた場合、37条書面には建物の引渡しの時期又は移転登記の申請の時期のいずれか一方を記載すれば足り、両方を記載する必要はない。","a":0,"e":"引渡し時期と移転登記の申請時期はどちらも必要的記載事項で、いずれか一方では足りない（37条1項）。","m":"引渡しも登記もどちらも必須"},{"f":"業法","t":"37条書面","ref":"H27-38-エ","s":"宅建業者Aが自ら買主として宅地の売買契約を締結した場合、租税公課の負担に関する定めがあればその内容を37条書面に記載し、売主が宅建業者であっても売主に交付しなければならない。","a":1,"e":"租税公課の負担の定めは任意的記載事項。相手方が宅建業者でも37条書面の交付は省略できない（37条1項）。","m":"業者相手でも37条書面"},{"f":"業法","t":"8種制限","ref":"H27-40-イ","s":"宅建業者Aが自ら売主として宅建業者でない買主Bと工事完了前の建物を売買し、保証保険契約で手付金の保全措置を講じる場合、手付金を受領した後速やかに保険証券をBに交付すれば足りる。","a":0,"e":"保全措置は手付金等の受領前に講じる必要があり、保険証券等は受領前に買主へ交付しなければならない（41条）。","m":"保険証券は受領前に渡す"},{"f":"業法","t":"8種制限","ref":"H27-40-ウ","s":"宅建業者Aが自ら売主として宅建業者でないBに工事完了前のマンションを代金3,000万円で売り、手付金150万円の後に中間金150万円を受領する場合、合計が代金の1割以下なので保全措置は不要である。","a":0,"e":"未完成物件の基準は代金の5%（150万円）。中間金を含め300万円となるので、中間金受領前に保全措置が必要（41条）。","m":"未完成5%・完成10%"},{"f":"業法","t":"業務上の規制","ref":"H27-41-イ","s":"宅建業者の従業者が新築マンションの買主に「過去の実績からみて5年後に転売すれば値上がりは間違いない」と告げることは、根拠を示したうえでの説明であれば宅建業法に違反しない。","a":0,"e":"根拠を示しても、利益が確実であると誤解させる断定的判断の提供は禁止されている（47条の2第1項）。","m":"根拠があっても断定NG"},{"f":"業法","t":"業務上の規制","ref":"H27-41-ウ","s":"宅建業者が売主の新築マンションで、従業者が買主に対し、提携銀行の担当者から手付金も融資の対象になると聞いていると説明して購入を勧めることは、宅建業法に違反しない。","a":1,"e":"禁止されるのは業者による手付の貸付けや後払い・分割払いの容認。銀行融資の案内はこれに当たらない（47条3号）。","m":"銀行融資の案内はOK"},{"f":"業法","t":"業務上の規制","ref":"H27-41-エ","s":"宅建業者が売主の新築マンションの購入申込みが撤回された場合、宅建業者が受領済みの申込証拠金から書類の処分手数料として5,000円を差し引いて返還しても、宅建業法に違反しない。","a":0,"e":"申込みの撤回時に、既に受領した預り金の返還を拒むことは禁止されている。手数料名目でも全額返還が必要。","m":"預り金は全額返す"},{"f":"業法","t":"保証協会","ref":"H27-42-1","s":"営業保証金は金銭のほか国債などの一定の有価証券で供託することができるのと同様に、保証協会の社員である宅建業者が納付する弁済業務保証金分担金も、有価証券で納付することができる。","a":0,"e":"営業保証金は有価証券も可だが、弁済業務保証金分担金は金銭でしか納付できない（64条の9）。","m":"分担金は現金のみ"},{"f":"業法","t":"営業保証金","ref":"H27-42-3","s":"本店のほか支店3か所を有する宅建業者は、営業保証金を供託する場合は2,500万円、保証協会の社員となる場合は弁済業務保証金分担金として150万円を、それぞれ納める必要がある。","a":1,"e":"営業保証金は本店1,000万円＋支店500万円×3。分担金は本店60万円＋支店30万円×3で150万円。","m":"千万・五百万と六十・三十"},{"f":"業法","t":"保証協会","ref":"H27-42-4","s":"保証協会の社員である宅建業者と宅建業に関し取引をした者（宅建業者を除く）が弁済業務保証金から還付を受けられる額は、その社員が納付した弁済業務保証金分担金の額が上限となる。","a":0,"e":"上限は、社員でなかったとしたら供託すべき営業保証金の額に相当する額であり、分担金の額ではない（64条の8）。","m":"上限は営業保証金相当額"},{"f":"業法","t":"監督・罰則","ref":"H27-43-1","s":"甲県知事免許の宅建業者Aが乙県内で宅建業者でない買主に自ら売主として中古住宅を売り、契約不適合責任を一切負わない特約を付けた場合、乙県知事はAに指示処分をすることができる。","a":1,"e":"指示処分は免許権者のほか、業務を行った区域を管轄する知事もできる（65条1項・3項）。免許取消しは免許権者のみ。","m":"業務地の知事も処分できる"},{"f":"業法","t":"監督・罰則","ref":"H27-43-2","s":"本店が甲県、支店が乙県にある国土交通大臣免許の宅建業者Bが、乙県の支店で自ら売主として代金の3割の手付を受領した場合、甲県知事はBに対して業務停止処分をすることができる。","a":0,"e":"処分できるのは免許権者（大臣）と業務地の乙県知事。甲県知事はどちらにも当たらない（65条）。","m":"本店所在地≠業務地"},{"f":"業法","t":"監督・罰則","ref":"H27-43-4","s":"国土交通大臣免許の宅建業者Dが甲県内に設置した事務所に業務に関する帳簿を備え付けていなかった場合、甲県知事はDに対して必要な報告を求め、適正な業務運営のための指導をすることができる。","a":1,"e":"知事は区域内で宅建業を営む業者に対し、報告を求め指導・助言・勧告ができる（71条・72条）。","m":"区域内なら知事も指導可"},{"f":"業法","t":"事務所・案内所","ref":"H27-44-1","s":"売主である宅建業者Aから新築マンションの販売代理を依頼された宅建業者Bが現地に案内所を設置した場合、その案内所には、A及びBの双方がそれぞれ標識を掲げなければならない。","a":0,"e":"標識の掲示義務は案内所を設置したBが負い、売主Aには掲示義務はない（50条1項）。","m":"標識は設置した業者だけ"},{"f":"業法","t":"事務所・案内所","ref":"H27-44-2","s":"宅建業者がマンションを分譲するために案内所を設置した場合、その案内所で売買契約の締結や購入申込みの受付を一切行わないときであっても、その案内所には標識を掲げなければならない。","a":1,"e":"案内所の標識は、契約・申込みの受付をするかどうかにかかわらず必要（50条1項、規則19条）。","m":"標識は契約しなくても必要"},{"f":"業法","t":"事務所・案内所","ref":"H27-44-4","s":"甲県知事免許の宅建業者Aが甲県内に申込みを受け付ける案内所を設ける場合、Aは甲県知事に加え、物件所在地の乙県知事にも業務開始10日前までに届け出なければならない。","a":0,"e":"届出先は免許権者と案内所所在地の知事。いずれも甲県知事なので、甲県知事に届け出れば足りる（50条2項）。","m":"届出先は案内所の所在地"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H27-45-1","s":"宅建業者が自ら売主として他の宅建業者に新築住宅を販売する場合であっても、売主である宅建業者は、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。","a":0,"e":"資力確保措置は買主が宅建業者でない場合に限られ、業者間取引では不要（履行法2条）。","m":"業者間は資力確保不要"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H27-45-3","s":"新築住宅を販売した宅建業者が基準日に係る資力確保措置の状況の届出をしなかった場合、基準日の翌日から起算して50日を経過した日以後は、自ら売主となる新築住宅の売買契約を締結できない。","a":1,"e":"届出は基準日から3週間以内。届出をしないと基準日の翌日から50日経過後は新たな売買契約ができない。","m":"届出なしは50日後に契約禁止"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"H27-45-4","s":"住宅販売瑕疵担保責任保険契約を締結した宅建業者は、新築住宅の構造耐力上主要な部分等の瑕疵について売主としての担保責任を履行したことにより生じた損害について、保険金を請求できる。","a":1,"e":"構造耐力上主要な部分・雨水浸入防止部分の瑕疵について責任を履行した売主は、その損害を保険金で補填できる。","m":"履行した売主が保険請求"},{"f":"税他","t":"住宅金融支援機構","ref":"H27-46-1","s":"機構は、高齢者が自ら居住する住宅にバリアフリー工事や耐震改修工事を行う場合の貸付けについて、毎月の返済を利息のみとし、元金を死亡時に一括返済する制度を設けている。","a":1,"e":"高齢者向け返済特例により、毎月は利息のみを支払い、元金は申込人全員の死亡時に一括返済する。","m":"利息だけ払い元金は死亡時"},{"f":"税他","t":"住宅金融支援機構","ref":"H27-46-3","s":"独立行政法人住宅金融支援機構は、証券化支援事業により金融機関から譲り受けた住宅ローン債権について、元利金の回収業務をいずれの金融機関にも委託することができず、自ら行わなければならない。","a":0,"e":"機構は、譲り受けた貸付債権の元利金の回収業務などを、一定の金融機関に委託して行わせることができる。","m":"回収は金融機関に委託可"},{"f":"税他","t":"住宅金融支援機構","ref":"H27-46-4","s":"独立行政法人住宅金融支援機構は、災害により住宅が滅失した場合に代わりの住宅を建設又は購入するための資金を貸し付けるときは、一定期間、元金の返済を据え置く期間を設けることができる。","a":1,"e":"災害復興住宅融資では、一定期間の元金据置きや金利引下げなどの特例が設けられている。","m":"災害融資は元金据置OK"},{"f":"税他","t":"景品表示法","ref":"H27-47-1","s":"新築分譲マンションを数期に分けて販売する場合、第1期の住戸に売れ残りがあっても、第2期の販売期間中に売り切る見込みがあれば、広告に「第1期完売御礼」と表示しても不当表示に当たらない。","a":0,"e":"実際に完売していないのに完売したと誤認させる表示は不当表示に当たり、後で売り切るかどうかは関係ない。","m":"売れ残りに完売表示NG"},{"f":"税他","t":"景品表示法","ref":"H27-47-3","s":"広告する売地が都市計画法に基づき告示された都市計画道路の区域に含まれている場合、その道路の工事が未着手であっても、宅建業者は広告においてその旨を明示しなければならない。","a":1,"e":"都市計画道路等の区域に係る土地は、事業の着手前であってもその旨を明示する必要がある（表示規約）。","m":"計画道路は未着手でも明示"},{"f":"税他","t":"景品表示法","ref":"H27-47-4","s":"築15年の中古の一戸建て住宅をリフォームして売り出す場合、その物件を一般消費者に対して販売するのが初めてであれば、宅建業者は広告に「新発売」と表示することができる。","a":0,"e":"「新発売」は新築住宅・新たに造成された宅地・一棟リノベーションマンションを初めて勧誘する場合の用語で、中古の一戸建てには使えない。","m":"新発売は新築だけ"},{"f":"税他","t":"土地・建物","ref":"H27-49-1","s":"我が国の低地の多くは、ここ数千年の間に河川の堆積作用や海岸線の変化などによって形成されたものであり、湿地や旧河道であった、若く軟弱な地盤の地域がほとんどを占めている。","a":1,"e":"低地は形成年代が新しく、湿地・旧河道など軟弱な地盤が多いため、地震や洪水への注意が必要。","m":"低地は若くて軟弱"},{"f":"税他","t":"土地・建物","ref":"H27-49-2","s":"臨海部の低地は海面とほぼ同じ高さにあることが多いため、洪水・高潮・津波などの災害を受けやすく、住宅地として利用するには十分な防災対策や避難計画の確認が必要である。","a":1,"e":"海抜の低い臨海低地は水害リスクが高く、ハザードマップの確認や防災対策が欠かせない。","m":"臨海低地は水害注意"},{"f":"税他","t":"土地・建物","ref":"H27-49-3","s":"台地は一般に水はけが良く地盤も安定しているので、台地上にある小さな池や沼を土で埋め立てて造成した宅地であっても、地震の際の液状化に対しては安全であると考えてよい。","a":0,"e":"池沼の埋立地は地下に水を含む地層が残りやすく、台地上であっても液状化が生じるおそれがある。","m":"台地でも埋立地は液状化"},{"f":"税他","t":"土地・建物","ref":"H27-50-1","s":"木材は湿気に強く腐朽しにくい材料であるため、木造の住宅を建築する場合には、雨水の跳ね返りなどから木造の土台を守る目的で地盤面から基礎の立上がりを設ける必要はない。","a":0,"e":"木材は湿気で強度が落ち腐朽しやすい。雨水等から土台を守るため、基礎の立上がりが必要である。","m":"木は湿気に弱い→立上がり"},{"f":"税他","t":"土地・建物","ref":"H27-50-2","s":"建物の基礎には直接基礎と杭基礎があり、支持地盤が浅く良好な場合は直接基礎が用いられ、直接基礎では荷重を十分に支えられない場合は支持層まで届く杭基礎が用いられる。","a":1,"e":"支持層が浅ければ直接基礎、深ければ杭を支持層まで届かせる杭基礎とするのが基本である。","m":"浅い支持層は直接基礎"},{"f":"税他","t":"土地・建物","ref":"H27-50-4","s":"建物は、基礎より上の地上部分の主体となる上部構造と、上部構造から伝わる荷重を地盤に伝えて建物全体を支える基礎構造（下部構造）とによって構成されていると考えることができる。","a":1,"e":"建物は上部構造と基礎構造からなり、基礎構造は上部の荷重を安全に地盤へ伝える役割を持つ。","m":"上部構造と基礎構造"},{"f":"権利","t":"賃貸借","ref":"H28-01-2","s":"建物の賃借人が賃料の支払など賃貸借に基づいて生じた金銭債務を履行しない場合、賃貸人は、賃借人から契約時に受け取っている敷金をその未払債務の弁済に充てることができる。","a":1,"e":"賃貸人は敷金を未払債務の弁済に充当できる。逆に賃借人から充当を請求することはできない（622条の2第2項）。","m":"充当は賃貸人からだけ"},{"f":"権利","t":"意思表示・行為能力","ref":"H28-03-2","s":"AがBの詐欺によって甲土地をBに売却し、Aが取り消す前にBが詐欺の事実を知らず過失もないDに転売して登記した場合でも、Aは詐欺による取消しをDに対抗することができる。","a":0,"e":"詐欺による意思表示の取消しは、善意でかつ過失がない第三者には対抗することができない（96条3項）。","m":"詐欺は善意無過失に負け"},{"f":"権利","t":"物権変動・対抗","ref":"H28-03-3","s":"AがBに甲土地を売却したがBが未登記のうちに、EがBに高値で売りつけて利益を得る目的でAから甲土地を二重に買い受けて登記した場合、EはBに対し所有権を主張できない。","a":1,"e":"背信的悪意者は登記の欠缺を主張する正当な利益がなく、登記を備えても所有権を対抗できない（判例）。","m":"背信的悪意者は登記でも負け"},{"f":"権利","t":"意思表示・行為能力","ref":"H28-03-4","s":"AがBに甲土地を売却した際、買主Bの意思表示に錯誤があり、錯誤による取消しの要件を満たしている場合、相手方である売主Aも、Bの錯誤を理由として売買契約を取り消すことができる。","a":0,"e":"錯誤による取消しができるのは表意者本人やその代理人・承継人であり、相手方Aは取り消せない（120条2項）。","m":"錯誤取消は表意者側だけ"},{"f":"権利","t":"売買・契約不適合","ref":"H28-06-1","s":"AがC所有の甲土地をBに売却し、Bは甲土地がCの所有であることを知っていた。AがCから所有権を取得してBに移転できないときは、Aに帰責事由がない場合を除き、BはAに損害賠償を請求できる。","a":1,"e":"他人物売買の売主は権利を取得して移転する義務を負う（561条）。移転できなければ買主の善意悪意を問わず債務不履行責任（415条）となる。","m":"他人物売買は悪意でも請求可"},{"f":"権利","t":"売買・契約不適合","ref":"H28-06-3","s":"AがBに抵当権の付いた甲土地を売却し、Bは抵当権の存在を知っていたが、その後抵当権が実行されて第三者が競落しBが所有権を失った場合、BはAに損害賠償を請求できない。","a":0,"e":"抵当権の実行で所有権を失えば売主は契約不適合・債務不履行の責任を負い、買主が知っていても損害賠償を請求できる。","m":"抵当権実行は知ってても請求"},{"f":"権利","t":"売買・契約不適合","ref":"H28-06-4","s":"AがBに抵当権の付いた甲土地を売却した後、その抵当権が実行されて第三者が甲土地を競落し、Bが甲土地の所有権を失った場合、BはAとの売買契約を解除することができる。","a":1,"e":"抵当権の実行で所有権を失えば、買主は売主の債務不履行を理由に契約を解除できる（565条・542条）。","m":"所有権喪失なら解除可"},{"f":"権利","t":"賃貸借","ref":"H28-07-ア","s":"AがBから賃借している建物の一部が、Aの責めに帰することができない事由により損壊して使用できなくなった場合、賃料は使用できない部分の割合に応じて当然に減額される。","a":1,"e":"一部滅失等で使用収益できなくなった場合、賃借人に帰責事由がなければ賃料は割合に応じて当然に減額される（611条1項）。","m":"一部滅失は当然減額"},{"f":"権利","t":"賃貸借","ref":"H28-07-イ","s":"AがBから賃借している建物の一部が損壊して使用できなくなり、残りの部分だけではAが賃借をした目的を達することができない場合、AはBとの賃貸借契約を解除することができる。","a":1,"e":"残存部分で賃借の目的を達せないときは、賃借人は契約を解除できる（611条2項）。","m":"目的達成不能なら解除"},{"f":"権利","t":"不法行為・請負・委任","ref":"H28-07-ウ","s":"運送会社Cの従業員Dが業務中の事故で損害を与え、Cが使用者責任に基づき被害者に賠償した場合、CはDに求償できるが、その範囲は信義則上相当と認められる限度に制限され得る。","a":1,"e":"使用者から被用者への求償は認められる（715条3項）が、損害の公平な分担の見地から信義則上制限され得る（判例）。","m":"求償は信義則で制限"},{"f":"権利","t":"賃貸借","ref":"H28-08-1","s":"AがBに建物を賃貸し、BがAの承諾を得てCに適法に転貸している場合、AがBの賃料不払を理由に賃貸借契約を解除するには、Cにも賃料の支払を催告しなければならない。","a":0,"e":"賃借人の債務不履行による解除の催告は賃借人Bにすれば足り、転借人Cに催告する必要はない（判例）。","m":"催告は賃借人だけで足りる"},{"f":"権利","t":"賃貸借","ref":"H28-08-2","s":"AがBに月額10万円で賃貸した建物を、BがAの承諾を得てCに月額15万円で適法に転貸している場合、Bが賃料を支払わないときは、AはCに月額10万円を直接請求できる。","a":1,"e":"転借人は賃借人の債務の範囲を限度として賃貸人に直接義務を負うため、請求できるのは10万円まで（613条1項）。","m":"直接請求は低い方まで"},{"f":"権利","t":"賃貸借","ref":"H28-08-4","s":"AがBに建物を賃貸し、BがAの承諾を得てCに適法に転貸している場合、AとBが賃貸借契約を合意解除しても、AはCに対して当然には建物の明渡しを請求することができない。","a":1,"e":"合意解除は転借人に対抗できない。ただし解除当時に債務不履行解除権があった場合は別である（613条3項）。","m":"合意解除は転借人に対抗不可"},{"f":"権利","t":"不法行為・請負・委任","ref":"H28-09-2","s":"契約締結前の売主の説明義務違反（生命・身体の侵害によらないもの）を理由とする買主の損害賠償請求権は、買主が損害を知らないままでも、売買契約から10年で時効消滅する。","a":0,"e":"この請求権は不法行為に基づくもので、知った時から3年又は不法行為の時から20年で時効消滅する（724条）。","m":"不法行為は3年・20年"},{"f":"権利","t":"不法行為・請負・委任","ref":"H28-09-3","s":"不法行為の加害者は、被害者が有する生命又は身体の侵害による損害賠償請求権を受働債権とし、自己が被害者に対して有する債権を自働債権として相殺することをもって、被害者に対抗できない。","a":1,"e":"人の生命・身体の侵害による損害賠償債務の債務者は、これを受働債権とする相殺を対抗できない（509条2号）。","m":"生命身体の賠償は相殺不可"},{"f":"権利","t":"不法行為・請負・委任","ref":"H28-09-4","s":"判例によれば、売買契約の締結前に信義則上の説明義務に違反して買主に損害を与えた売主は、買主に対し、締結されたその売買契約上の債務不履行による損害賠償責任を負うことはない。","a":1,"e":"契約締結前の説明義務違反は不法行為責任を生じさせ得るが、締結された契約上の債務不履行責任は負わない（判例）。","m":"契約前の義務違反は不法行為"},{"f":"権利","t":"相続","ref":"H28-10-1","s":"Aが死亡し子B・Cが相続人となった場合、Bが相続財産である甲建物を不法に占拠しているDに対して甲建物の明渡しを請求したときは、Bは単純承認をしたものとみなされる。","a":0,"e":"不法占拠者への明渡請求は保存行為であり、相続財産の処分に当たらないため単純承認とはみなされない（921条1号）。","m":"保存行為は単純承認でない"},{"f":"権利","t":"相続","ref":"H28-10-2","s":"Aが死亡し子B・Cが相続人となった場合、CがAの賃貸していた建物の賃借人に対して未払賃料の支払を請求し、これを受領したときは、Cは単純承認をしたものとみなされる。","a":1,"e":"相続債権を取り立てて収受することは相続財産の処分に当たり、単純承認とみなされる（判例）。","m":"賃料取立ては処分"},{"f":"権利","t":"相続","ref":"H28-10-4","s":"Aが死亡し子B・Cが相続人となった場合において、Bが、Aの死亡の事実を知らないまま相続開始から3か月が経過したときは、Bは相続について単純承認をしたものとみなされる。","a":0,"e":"熟慮期間3か月は、自己のために相続の開始があったことを知った時から進行する（915条1項）。","m":"3か月は知った時から"},{"f":"権利","t":"借地","ref":"H28-11-1","s":"Aが居住用建物を所有する目的でBから期間30年で土地を賃借し、その上の建物を子C名義で登記していた場合、Aはその土地を買い受けて登記したDに借地権を対抗できない。","a":1,"e":"借地権の対抗要件は借地権者本人名義の建物登記であり、家族名義の登記では対抗できない（10条1項、判例）。","m":"建物登記は本人名義で"},{"f":"権利","t":"借地","ref":"H28-11-3","s":"居住用建物の所有を目的とする期間30年の土地賃貸借契約でも、公正証書により契約の更新をせず期間満了時に建物を収去する旨を定めれば、更新のない借地権とすることができる。","a":0,"e":"30年で居住用では定期借地権の要件を満たさず（一般定期は50年以上、事業用は事業用建物のみ）、更新否定特約は無効。","m":"居住用30年は定借不可"},{"f":"権利","t":"借地","ref":"H28-11-4","s":"居住用建物の所有を目的とする借地契約で、借地権者Aの地代不払を理由に地主Bが契約を解除した場合、Aは、Bに対し、借地上の建物を時価で買い取るよう請求することができる。","a":0,"e":"借地権者の債務不履行により契約が解除された場合には、借地権者は建物買取請求権を行使できない（判例）。","m":"債務不履行解除は買取請求なし"},{"f":"権利","t":"借家","ref":"H28-12-1","s":"期間3年の建物賃貸借で、当事者が期間満了の1年前から6か月前までに更新拒絶の通知をしなかった場合、従前と同一条件で更新したものとみなされ、更新後は期間の定めのないものとなる。","a":1,"e":"通知期間内に更新拒絶等をしないと法定更新され、更新後の期間は定めがないものとなる（26条1項）。","m":"法定更新は期間の定めなし"},{"f":"権利","t":"借家","ref":"H28-12-2","s":"居住用建物の賃貸人が賃借人に対して解約の申入れをする際に、立退料などの財産上の給付をする旨を申し出れば、そのことだけで解約申入れに正当事由があるものとみなされる。","a":0,"e":"財産上の給付の申出は正当事由を判断する要素の一つにすぎず、それだけで正当事由が認められるわけではない（28条）。","m":"立退料は補完要素にすぎない"},{"f":"権利","t":"借家","ref":"H28-12-3","s":"建物の賃借人が賃貸人の同意を得て建物に付加した造作は、造作買取請求権を排除する特約がなければ、賃貸借が期間満了で終了するとき、賃貸人に時価で買い取るよう請求できる。","a":1,"e":"同意を得て付加した造作は、終了時に時価で買取請求できる。ただし特約で排除することも可能（33条・37条）。","m":"同意造作は時価で買取請求"},{"f":"権利","t":"区分所有法","ref":"H28-13-1","s":"区分所有法上、区分所有建物の管理者は、区分所有者の集会において、毎年2回一定の時期に、管理者として行ったその事務に関する報告を区分所有者に対してしなければならない。","a":0,"e":"管理者は、集会において毎年1回一定の時期に事務の報告をしなければならない。2回ではない（43条）。","m":"管理者報告は年1回"},{"f":"権利","t":"区分所有法","ref":"H28-13-2","s":"区分所有法上、区分所有建物の管理者は、規約に特別の定めがあるときは、区分所有者全員のために共用部分を所有することができ、このような共用部分の所有の形態を管理所有という。","a":1,"e":"規約に特別の定めがあれば管理者は共用部分を所有できる。これを管理所有という（27条1項）。","m":"規約で管理所有OK"},{"f":"権利","t":"区分所有法","ref":"H28-13-4","s":"区分所有建物の共用部分に対する各共有者の持分は、規約に別段の定めがない限り、各区分所有者が有する専有部分の床面積の割合によらず、共有者の数で等分することとされている。","a":0,"e":"持分は原則として専有部分の床面積（内法）の割合による。規約で別段の定めも可能（14条）。","m":"持分は専有面積の割合"},{"f":"権利","t":"不動産登記法","ref":"H28-14-1","s":"不動産登記法上、新築した建物の所有権を取得した者は、建物の表題登記とは別に、その所有権の取得の日から1か月以内に、自己名義の所有権の保存の登記を申請しなければならない。","a":0,"e":"1か月以内の申請義務があるのは表題登記（47条）。所有権保存登記には申請義務はない。","m":"義務は表題登記のほう"},{"f":"権利","t":"不動産登記法","ref":"H28-14-3","s":"不動産登記法上、建物が取壊しや焼失などにより滅失したときは、表題部所有者又は所有権の登記名義人は、その滅失の日から1か月以内に、建物の滅失の登記を申請しなければならない。","a":1,"e":"建物が滅失したときは、表題部所有者等が1か月以内に滅失の登記を申請する義務を負う（57条）。","m":"滅失登記も1か月以内"},{"f":"権利","t":"不動産登記法","ref":"H28-14-4","s":"区分建物（分譲マンションの一室など）については、表題部所有者である分譲業者から直接所有権を取得した者も、自己を名義人とする所有権の保存の登記を申請することができる。","a":1,"e":"区分建物は表題部所有者から直接取得した者も保存登記を申請でき、敷地権付きなら敷地権の名義人の承諾が要る（74条2項）。","m":"区分建物は転得者も保存登記"},{"f":"法令","t":"国土利用計画法","ref":"H28-15-1","s":"市街化区域内にある2,500㎡の土地を購入する売買契約を締結した者は、その契約を締結した日から起算して3週間以内に、国土利用計画法の事後届出をしなければならない。","a":0,"e":"市街化区域は2,000㎡以上が届出対象。届出期限は契約締結日から起算して2週間以内である（23条1項）。","m":"事後届出は2週間以内"},{"f":"法令","t":"国土利用計画法","ref":"H28-15-3","s":"都市計画区域外にある6,000㎡の甲土地と隣接する5,000㎡の乙土地を、一団の土地として同一人が購入する契約を締結した場合、その買主は国土利用計画法の事後届出をしなければならない。","a":1,"e":"都市計画区域外は10,000㎡以上が対象。一団の土地として合計11,000㎡となるので届出が必要（23条2項）。","m":"区域外は1万㎡・合算"},{"f":"法令","t":"国土利用計画法","ref":"H28-15-4","s":"市街化区域内の3,000㎡の甲土地を購入する契約を締結した者は、1か月後に隣接する乙土地を買う予定があれば、乙土地の契約締結後に両方を併せて事後届出をすればよい。","a":0,"e":"甲土地だけで2,000㎡以上の要件を満たすため、甲土地の契約締結日から2週間以内に届け出なければならない。","m":"届出は契約ごとに2週間"},{"f":"法令","t":"開発許可","ref":"H28-17-1","s":"都市計画法の開発許可を受けた者は、開発区域で行っている開発行為に関する工事を途中で廃止しようとする場合には、あらかじめ都道府県知事の許可を受けなければならない。","a":0,"e":"工事を廃止したときは、遅滞なく都道府県知事に届け出ればよく、許可は不要である（38条）。","m":"廃止は届出"},{"f":"法令","t":"開発許可","ref":"H28-17-3","s":"開発許可を受けた者から開発区域内の土地の所有権を買い受けた者は、都道府県知事の承認を受けることなく、開発許可を受けた者が有していた開発許可に基づく地位を承継することができる。","a":0,"e":"一般承継人は当然に承継するが、土地の所有権等を取得した特定承継人は知事の承認が必要（45条）。","m":"特定承継は知事の承認"},{"f":"法令","t":"開発許可","ref":"H28-17-4","s":"都道府県知事は、用途地域の定められていない土地の区域で開発許可をする場合、必要と認めるときは、開発区域内の土地について建ぺい率や建築物の高さなどの制限を定めることができる。","a":1,"e":"用途地域の定めのない区域では、知事は建ぺい率・高さ・壁面の位置等の制限を定めることができる（41条1項）。","m":"用途地域なしなら制限可"},{"f":"法令","t":"建築基準法","ref":"H28-18-1","s":"建築基準法上、防火地域内にある建築物で外壁が耐火構造のものについては、民法の相隣関係の規定にかかわらず、その外壁を隣地との境界線に接して設けることができるとされている。","a":1,"e":"防火地域又は準防火地域内で外壁が耐火構造の建築物は、外壁を隣地境界線に接して設けられる（63条）。","m":"耐火外壁は境界に接してOK"},{"f":"法令","t":"建築基準法","ref":"H28-18-2","s":"建築基準法上、高さが30mの建築物には、安全上支障がないものとして国土交通大臣が定める基準に適合する場合を除き、原則として非常用の昇降機を設けなければならない。","a":0,"e":"非常用の昇降機が原則必要となるのは、高さ31mを超える建築物である（34条2項）。","m":"非常用エレベーターは31m超"},{"f":"法令","t":"建築基準法","ref":"H28-18-4","s":"建築基準法上、延べ面積が1,000㎡を超える耐火建築物は、防火壁又は防火床によって区画し、各区画の床面積の合計をそれぞれ1,000㎡以内としなければならないとされている。","a":0,"e":"1,000㎡超の建築物の防火壁等による区画義務は、耐火建築物や準耐火建築物には適用されない（26条）。","m":"耐火建築物は区画不要"},{"f":"法令","t":"建築基準法","ref":"H28-19-1","s":"建築基準法上、第一種低層住居専用地域内では原則として飲食店を建築することができないが、特定行政庁が支障がないと認めて許可した場合には、例外として建築することができる。","a":1,"e":"用途規制で建築できない建築物も、特定行政庁が支障がないと認めて許可すれば建築できる（48条ただし書）。","m":"許可があれば例外OK"},{"f":"法令","t":"建築基準法","ref":"H28-19-2","s":"建築物の敷地が接する前面道路の幅員が12m以上ある場合には、都市計画で定められた容積率のみが適用され、前面道路の幅員に基づく容積率の制限は適用されないこととなる。","a":1,"e":"前面道路の幅員による容積率制限は、幅員が12m未満の場合に限り適用される（52条2項）。","m":"道路幅員制限は12m未満"},{"f":"法令","t":"建築基準法","ref":"H28-19-4","s":"建築基準法上、第一種住居地域内においては、都市計画で外壁の後退距離の限度を定めた場合、建築物の外壁又はこれに代わる柱の面は、その限度以上後退させなければならない。","a":0,"e":"外壁後退距離の限度を定められるのは第一種・第二種低層住居専用地域と田園住居地域のみである（54条）。","m":"外壁後退は低層系だけ"},{"f":"法令","t":"盛土規制法","ref":"H28-20-1","s":"盛土規制法において、宅地造成等工事規制区域外にある盛土で造成された一団の造成宅地は、盛土の高さが5m未満であれば、他の要件を満たしていても造成宅地防災区域に指定することはできない。","a":0,"e":"盛土面積3,000㎡以上で地下水位が盛土内に浸入するものなど、高さ5m未満でも指定できる場合がある。規制区域内は対象外。","m":"防災区域は高さだけじゃない"},{"f":"法令","t":"盛土規制法","ref":"H28-20-3","s":"宅地造成等工事規制区域内の土地で、高さ2mを超える擁壁を除却する工事を行おうとする者は、許可を要しない場合でも、原則として工事着手の日の14日前までに都道府県知事に届け出なければならない。","a":1,"e":"許可不要でも、高さ2m超の擁壁・排水施設・地滑り抑止ぐい等の除却工事は着手14日前までの届出が必要（盛土規制法21条）。","m":"擁壁除却は14日前届出"},{"f":"法令","t":"盛土規制法","ref":"H28-20-4","s":"宅地造成等工事規制区域内で、公共施設用地を宅地又は農地等に転用した者は、宅地造成等に関する工事を行わない場合であっても、転用した日から14日以内に都道府県知事に届け出なければならない。","a":1,"e":"公共施設用地の宅地・農地等への転用は、転用後14日以内に知事へ届け出る（盛土規制法21条）。","m":"転用は事後14日以内"},{"f":"法令","t":"土地区画整理法","ref":"H28-21-1","s":"土地区画整理事業の施行者は、換地処分を行う前において、換地計画に基づき換地処分を行うため必要がある場合には、施行地区内の宅地について仮換地を指定することができる。","a":1,"e":"仮換地の指定は「必要がある場合」にできるもので、義務ではない（土地区画整理法98条1項）。","m":"仮換地は必要なら指定可"},{"f":"法令","t":"土地区画整理法","ref":"H28-21-3","s":"施行者は、仮換地を指定した場合に、その仮換地に使用・収益の障害となる物件があるなど特別の事情があるときは、仮換地の使用収益開始日を指定の効力発生日と別に定めることができる。","a":1,"e":"原則は効力発生日から使用収益できるが、特別の事情があれば別に開始日を定められる（土地区画整理法99条2項）。","m":"特別事情なら開始日を別に"},{"f":"法令","t":"土地区画整理法","ref":"H28-21-4","s":"土地区画整理組合の設立認可の公告後、換地処分の公告までの間に施行地区内で事業の障害となるおそれのある土地の形質の変更をする者は、当該組合の許可を受ければ足りる。","a":0,"e":"許可権者は組合ではなく都道府県知事等（国土交通大臣施行の場合は大臣）である（土地区画整理法76条1項）。","m":"76条許可は知事、組合でない"},{"f":"法令","t":"農地法","ref":"H28-22-1","s":"Aが死亡し、遺言によって相続人ではない知人Bに農地を特定遺贈した場合、Bによるその農地の取得は、相続による取得と同様に、農地法第3条第1項の許可を受ける必要はない。","a":0,"e":"許可不要なのは相続・包括遺贈・相続人への特定遺贈。相続人以外への特定遺贈は3条許可が必要。","m":"相続人以外の特定遺贈は許可"},{"f":"法令","t":"農地法","ref":"H28-22-3","s":"農地法第3条第1項又は第5条第1項の許可が必要な農地の売買について、当事者が許可を受けないまま売買契約を締結した場合、その契約による所有権移転の効力は生じない。","a":1,"e":"3条・5条の許可を受けずにした農地の売買は効力を生じない。5条違反で転用していれば原状回復命令もあり得る。","m":"無許可売買は効力なし"},{"f":"法令","t":"農地法","ref":"H28-22-4","s":"市街化調整区域内にある自己所有の遊休農地を、自己の住宅を建てるための用地に転用する場合、あらかじめ農業委員会に届け出れば、農地法第4条第1項の許可を受ける必要はない。","a":0,"e":"届出で足りる特例は市街化区域内の農地に限られる。市街化調整区域では4条許可が必要。","m":"届出特例は市街化区域だけ"},{"f":"税他","t":"印紙税・登録免許税","ref":"H28-23-1","s":"宅地の売主と買主が作成した不動産譲渡契約書に収入印紙を貼り付けずにいたところ、税務調査でそのことが判明した場合、過怠税として不納付税額とその10%相当額の合計額が課される。","a":0,"e":"調査で判明した場合の過怠税は不納付税額の3倍。自主的に申し出た場合は1.1倍に軽減される（印紙税法20条）。","m":"発覚3倍・自主1.1倍"},{"f":"税他","t":"印紙税・登録免許税","ref":"H28-23-2","s":"Aが所有する甲土地（価額3,000万円）とBが所有する乙土地（価額3,500万円）を交換する契約書に、双方の土地の価額が記載されている場合、印紙税の記載金額は3,500万円となる。","a":1,"e":"交換契約書は双方の価額の記載があれば高い方、交換差金のみの記載なら差金の額が記載金額となる。","m":"交換は高い方の金額"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H28-24-2","s":"A社がB社を吸収合併し、消滅するB社が所有していた土地と建物をA社が取得した場合、その取得は形式的な所有権の移転ではあるものの、A社には不動産取得税が課される。","a":0,"e":"合併や相続による取得は形式的な所有権移転なので、不動産取得税は非課税である（地方税法73条の7）。","m":"合併・相続は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H28-24-3","s":"個人が自ら居住するために床面積240㎡の新築住宅を取得した場合、その住宅は不動産取得税の課税標準の算定にあたって、一戸につき1,200万円を価格から控除する特例の対象となる。","a":1,"e":"新築住宅は床面積40㎡以上240㎡以下（2026年4月以後の取得。それ以前は50㎡以上）なら1,200万円控除の対象となる。240㎡は範囲内。

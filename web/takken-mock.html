<title>宅建 10分模試</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: ホーム（今の実力・5回セット・論点マップ）→ 試験画面（タイマー＋1問ずつ）→ 結果 → 解説と確認例題3問 */
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1f2a2e; --muted:#5d6a6e; --line:#d9ded9;
  --ai:#24476b; --ai-soft:#e3ebf3; --ok:#2f7a4b; --ok-soft:#e2f1e7; --ng:#b8402c; --ng-soft:#f8e4df; --warn:#9a6b12; --warn-soft:#f6ecd6;
  --f-disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1d; --paper:#1d2529; --ink:#e7ecea; --muted:#9aa8ab; --line:#33403f;
  --ai:#8fb4d9; --ai-soft:#22324a; --ok:#7cc795; --ok-soft:#1f3a2a; --ng:#ee8b75; --ng-soft:#40241f; --warn:#e3b65c; --warn-soft:#3a3020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-disp);font-weight:800;font-size:1.7rem;margin:0}
h2{font-family:var(--f-disp);font-size:1.15rem;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:.88rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-weight:700;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ai)}
.btn.pri{background:var(--ai);color:var(--paper);border-color:var(--ai)}
.btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.slot b{display:block;font-size:1.05rem;font-family:var(--f-disp)}
.slot.now{border-color:var(--ai);background:var(--ai-soft)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kp{background:var(--bg);border-radius:8px;padding:10px 12px}
.kp span{font-size:.78rem;color:var(--muted)} .kp b{display:block;font-size:1.3rem;font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.topics{display:flex;flex-direction:column;gap:14px}
.tgroup h3{font-size:.85rem;margin:0 0 6px;color:var(--muted);letter-spacing:.05em}
.tlist{display:flex;flex-wrap:wrap;gap:6px}
.tp{font:inherit;font-size:.8rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.tp.s0{opacity:.75}
.tp.s1{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.tp.s2{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tp.s3{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.legend{font-size:.75rem;color:var(--muted)}
.exam-top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2;border-bottom:1px solid var(--line)}
.timer{font-family:var(--f-disp);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ng)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:.7rem;display:grid;place-items:center;font-variant-numeric:tabular-nums;cursor:pointer;background:var(--paper);color:var(--ink)}
.dot.ans{background:var(--ai-soft);border-color:var(--ai)}
.dot.cur{outline:2px solid var(--ai)}
.meta{font-size:.75rem;letter-spacing:.05em;color:var(--ai);font-weight:700}
.stmt{font-size:1.05rem;margin:0}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .btn{font-size:1.5rem;padding:10px}
.ox .btn.sel{background:var(--ai);color:var(--paper);border-color:var(--ai)}
.res{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.res.ok{background:var(--ok-soft)} .res.ng{background:var(--ng-soft)}
.v{font-weight:700} .res.ok .v{color:var(--ok)} .res.ng .v{color:var(--ng)}
.memo{font-size:.86rem;color:var(--muted)} .memo b{color:var(--ink)}
.big{font-family:var(--f-disp);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.judge{display:inline-block;font-weight:700;padding:3px 12px;border-radius:999px;font-size:.9rem}
.j-ok{background:var(--ok-soft);color:var(--ok)} .j-mid{background:var(--warn-soft);color:var(--warn)} .j-ng{background:var(--ng-soft);color:var(--ng)}
.rv{display:flex;flex-direction:column;gap:10px}
.ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.trap{background:var(--warn-soft);border-radius:8px;padding:10px 12px}
.trap b{color:var(--warn)}
.relg{display:flex;flex-direction:column;gap:10px}
.relg .ul{font-size:.9rem}
.sync{font-size:.78rem;margin:4px 0 0;color:var(--muted)}
.sync[data-s="ok"]{color:var(--ok)}
.sync[data-s="err"]{color:var(--ng)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:1.4fr .8fr .9fr 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem;font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--muted)}
.confirm{background:var(--ng-soft);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.res{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<div class="wrap" id="app"></div>

<script>
const BANK=[{"f":"業法","t":"免許","ref":"R06-38-1","s":"宅地建物取引業者Aが免許の更新を申請した場合において、有効期間の満了の日までにその申請について処分がなされないときは、Aの従前の免許は、有効期間の満了とともにその効力を失う。","a":0,"e":"満了日までに処分がないときは、従前の免許は処分がされるまでの間なお効力を有する（3条4項）。","m":"処分が出るまで旧免許は生きる"},{"f":"業法","t":"免許","ref":"R06-38-3","s":"甲県知事の免許を受けている宅地建物取引業者Aが、乙県内に所在する宅地の売買の媒介を行おうとする場合、Aは、国土交通大臣に免許換えの申請をし、その免許を受けなければならない。","a":0,"e":"免許の区分は事務所の所在で決まる。他県の物件を取引するだけなら知事免許のままで全国で営業できる。","m":"物件の場所は免許と無関係"},{"f":"業法","t":"免許","ref":"R06-38-4","s":"甲県知事の免許を受けている宅地建物取引業者Aが免許の更新を申請した場合、甲県知事はその更新に当たって条件を付すことができ、Aがその条件に違反したときは、Aの免許を取り消すことができる。","a":1,"e":"免許権者は免許（更新を含む）に条件を付すことができ（3条の2）、条件違反は任意的取消事由となる（66条2項）。","m":"更新時も条件OK・違反で取消"},{"f":"業法","t":"免許","ref":"R02-26-1","s":"宅地建物取引業者であるA社が、宅地建物取引業者ではないB社との合併により消滅した場合、B社は、A社が消滅した日から30日以内にその旨を届け出れば、A社の免許を承継することができる。","a":0,"e":"免許は一身専属的で、合併によっても承継されない。B社が宅建業を営むには自ら免許を受ける必要がある。","m":"免許は合併でも引き継げない"},{"f":"業法","t":"免許","ref":"R02-26-3","s":"個人Cが、競売により取得した宅地を複数の区画に分割し、宅地建物取引業者に販売代理を依頼して不特定多数の者に分譲しようとする場合、Cは、宅地建物取引業の免許を受けなければならない。","a":1,"e":"自ら売主として反復継続して売買する以上、宅建業に当たる。代理・媒介を業者に依頼しても本人の免許は不要にならない。","m":"業者に頼んでも売主は要免許"},{"f":"業法","t":"免許","ref":"R02-26-4","s":"乙県知事の免許を受けている宅地建物取引業者Dが、乙県内に新たな事務所を設置し、乙県内に2以上の事務所を有することとなる場合、Dは、国土交通大臣に免許換えの申請をしなければならない。","a":0,"e":"一の都道府県の区域内にのみ事務所を設置するなら、数がいくつでも知事免許でよい。大臣免許は2以上の都道府県に事務所を置く場合。","m":"同一県内なら何店でも知事"},{"f":"業法","t":"免許","ref":"R03s-29-1","s":"宅地建物取引業の免許の有効期間は5年であり、宅地建物取引業者がその免許の更新を受けようとするときは、有効期間満了の日の90日前から30日前までの間に更新の申請をしなければならない。","a":1,"e":"免許の有効期間は5年（3条2項）、更新申請は満了日の90日前から30日前までの間に行う（規則3条）。","m":"5年・90日前〜30日前"},{"f":"業法","t":"免許","ref":"R03s-29-3","s":"個人である宅地建物取引業者Eが死亡した場合、その相続人は、Eの死亡の日から30日以内に、その旨をEが免許を受けた国土交通大臣又は都道府県知事に届け出なければならない。","a":0,"e":"相続人の届出期限は「死亡を知った日」から30日以内である（11条1項1号）。","m":"死亡は「知った日」から30日"},{"f":"業法","t":"免許","ref":"R03s-29-4","s":"法人である宅地建物取引業者F社が他の法人との合併により消滅した場合、F社を代表する役員であった者は、その日から30日以内に、その旨をF社の免許権者に届け出なければならない。","a":1,"e":"合併による消滅の届出義務者は、消滅した法人を代表する役員であった者で、期限はその日から30日以内（11条1項2号）。","m":"合併は消えた側の代表が届出"},{"f":"業法","t":"免許","ref":"H28-35-4","s":"個人である宅地建物取引業者Gが死亡した場合、Gの相続人は、Gが生前に締結した宅地の売買契約に基づく取引を結了する目的の範囲内においては、なお宅地建物取引業者とみなされる。","a":1,"e":"免許失効後も、一般承継人は取引を結了する目的の範囲内で宅建業者とみなされる（76条）。","m":"相続人は後始末だけ業者扱い"},{"f":"業法","t":"免許の基準","ref":"R05-29-1","s":"宅地建物取引業者A社の支店の代表者が、道路交通法に違反したことにより拘禁刑に処せられた場合であっても、そのことを理由としてA社の免許が取り消されることはない。","a":0,"e":"支店代表者は政令で定める使用人で、拘禁刑以上の刑は罪の種類を問わず欠格事由。A社の免許は取り消される。","m":"拘禁刑は罪名を問わずアウト"},{"f":"業法","t":"免許の基準","ref":"R05-29-2","s":"宅地建物取引業者B社の取締役が、所得税法に違反したことにより罰金の刑に処せられた場合であっても、そのことを理由としてB社の免許が取り消されることはない。","a":1,"e":"罰金刑が欠格事由となるのは宅建業法違反・暴力系の罪・背任などに限られ、所得税法違反は含まれない。","m":"税法違反の罰金はセーフ"},{"f":"業法","t":"免許の基準","ref":"R05-29-4","s":"宅地建物取引業者C社の非常勤の取締役が、脅迫の罪により罰金の刑に処せられた場合であっても、その者が非常勤である以上、C社の免許が取り消されることはない。","a":0,"e":"非常勤でも役員として審査対象であり、脅迫罪の罰金は欠格事由。業者の免許は取り消される。","m":"非常勤でも役員は役員"},{"f":"業法","t":"免許の基準","ref":"R01-43-2","s":"法人Dの政令で定める使用人が、横領の罪により拘禁刑に処せられ、その刑の全部の執行を猶予されていた場合、猶予期間を満了すれば、その日から5年を経過しなくても、Dは免許を受けることができる。","a":1,"e":"執行猶予期間が満了すれば刑の言渡しは効力を失うので、満了後直ちに欠格事由に当たらなくなる。","m":"猶予満了なら即OK"},{"f":"業法","t":"免許の基準","ref":"R01-43-3","s":"法人Eの専任の宅地建物取引士が、器物損壊の罪により罰金の刑に処せられ、その刑の執行が終わった日から5年を経過していない場合、Eは宅地建物取引業の免許を受けることができない。","a":0,"e":"役員・政令使用人でない専任宅建士は審査対象外で、器物損壊罪の罰金も欠格事由に当たらない。法人は免許を受けられる。","m":"専任宅建士は審査対象外"},{"f":"業法","t":"免許の基準","ref":"R01-43-4","s":"法人Fの代表取締役が、侮辱の罪により拘留の刑に処せられ、その刑の執行が終わった日から5年を経過していない場合、Fは宅地建物取引業の免許を受けることができない。","a":0,"e":"拘留・科料は欠格事由に含まれない。法人は免許を受けることができる。","m":"拘留・科料は欠格にならない"},{"f":"業法","t":"免許の基準","ref":"R03-27-3","s":"法人Gの役員のうちに、第一審で拘禁刑1年の判決を言い渡された者がいる場合、その者がこの判決に対して控訴しており刑が確定していないときであっても、Gは免許を受けることができない。","a":0,"e":"控訴中は刑が確定しておらず「刑に処せられた」に当たらないため、会社は免許を受けられる。","m":"控訴中は未確定でセーフ"},{"f":"業法","t":"免許の基準","ref":"R03-27-4","s":"法人Hの役員のうちに、宅地建物取引業法に違反したことにより罰金の刑に処せられた者がいる場合、その刑の執行が終わった日から5年を経過しなければ、Hは免許を受けることができない。","a":1,"e":"宅建業法違反による罰金刑は欠格事由で、執行を終わった日から5年間は免許を受けられない（5条1項6号）。","m":"業法違反は罰金でも5年"},{"f":"業法","t":"免許の基準","ref":"H30-36-3","s":"宅地建物取引業を営もうとする個人Iが、過去に犯した罪により拘禁刑に処せられ、その刑の執行を終えた日から5年を経過していない場合、Iは、宅地建物取引業の免許を受けることができない。","a":1,"e":"拘禁刑以上の刑に処せられ、執行を終わり又は受けることがなくなった日から5年を経過しない者は欠格（5条1項5号）。","m":"拘禁刑は執行終了から5年"},{"f":"業法","t":"免許の基準","ref":"H27-27-2","s":"威力業務妨害罪により拘禁刑に処せられ、その刑の全部の執行を猶予された者が、執行猶予期間中に法人E社の政令で定める使用人に就任した場合、E社は、宅地建物取引業の免許を受けることができない。","a":1,"e":"執行猶予期間中は欠格事由に該当する。その者が政令で定める使用人にいるE社も免許を受けられない。","m":"猶予期間中はまだアウト"},{"f":"業法","t":"宅建士","ref":"R04-33-イ","s":"甲県知事の登録を受けている宅地建物取引士Aが、乙県知事の免許を受けている宅地建物取引業者の事務所で専任の宅地建物取引士として従事しようとする場合、Aは、登録を乙県知事に移転しなければならない。","a":0,"e":"登録の移転は任意（「できる」）であり、移転しなくても他県の業者で専任宅建士になれる。","m":"登録の移転は任意"},{"f":"業法","t":"宅建士","ref":"R03-28-4","s":"甲県知事が実施した宅地建物取引士資格試験に合格したBが、登録を受けないうちに勤務先の都合で乙県に転勤することになった場合でも、Bは、宅地建物取引士の登録を甲県知事に申請しなければならない。","a":1,"e":"登録は試験を行った都道府県知事に対して受ける（18条1項）。住所や勤務地は関係しない。","m":"登録は合格した県の知事"},{"f":"業法","t":"宅建士","ref":"R03-28-3","s":"宅地建物取引士Cは、勤務先の宅地建物取引業者において専任の宅地建物取引士ではないので、勤務先が別の宅地建物取引業者に変わった場合であっても、変更の登録を申請する必要はない。","a":0,"e":"勤務先業者の商号・名称と免許証番号は登録事項で、専任かどうかを問わず遅滞なく変更の登録が必要（20条）。","m":"専任でなくても勤務先変更は届出"},{"f":"業法","t":"宅建士","ref":"R03-35-エ","s":"宅地建物取引業者の事務所に勤務し、甲県知事の登録を受けている宅地建物取引士Dが、転居に伴い本籍を変更した場合、Dは、遅滞なく、甲県知事に変更の登録を申請しなければならない。","a":1,"e":"本籍は登録簿の登載事項なので、変更があれば遅滞なく変更の登録を申請する（20条）。","m":"本籍も住所も変更登録"},{"f":"業法","t":"宅建士","ref":"R03-35-ア","s":"甲県知事から宅地建物取引士証の交付を受けている宅地建物取引士Eが事務禁止処分を受けた場合、Eは、速やかに宅地建物取引士証を甲県知事に提出しなければならず、怠ると10万円以下の過料に処せられることがある。","a":1,"e":"事務禁止処分を受けたら交付知事に宅建士証を速やかに提出（22条の2第7項）。違反は10万円以下の過料（86条）。","m":"事務禁止は提出・怠れば過料"},{"f":"業法","t":"宅建士","ref":"R06-43-3","s":"宅地建物取引士Fが、取引の関係者から請求を受けて宅地建物取引士証を提示する場合、個人情報保護の観点から、宅地建物取引士証の住所欄にシールを貼った上で提示することも認められる。","a":1,"e":"解釈・運用の考え方により、住所欄にシールを貼ったうえでの提示が認められている。","m":"提示時は住所欄シールOK"},{"f":"業法","t":"宅建士","ref":"R06-43-4","s":"婚姻により氏を改めた宅地建物取引士Gの宅地建物取引士証には、現在の氏名を記載しなければならず、Gが希望したとしても、旧姓を併記することは認められない。","a":0,"e":"申請により、宅建士証に旧姓を併記することが認められている。","m":"旧姓併記は認められる"},{"f":"業法","t":"宅建士","ref":"R06-29-2","s":"宅地建物取引士Hが宅地建物取引士証の更新を受けず、その有効期間が満了して宅地建物取引士証が効力を失った場合であっても、Hは、宅地建物取引士証を交付を受けた知事に返納する必要はない。","a":0,"e":"宅建士証が効力を失ったときは、速やかに交付を受けた知事に返納しなければならない（22条の2第6項）。","m":"失効したら速やかに返納"},{"f":"業法","t":"宅建士","ref":"R04-29-3","s":"甲県知事の登録を受けている宅地建物取引士Iが宅地建物取引士証の有効期間の更新を受けようとする場合、Iは国土交通大臣が指定する講習を受講しなければならず、更新後の有効期間は5年である。","a":0,"e":"更新時に受講するのは登録先の知事が指定する講習（法定講習）である。有効期間5年の点は正しい。","m":"更新講習は知事指定"},{"f":"業法","t":"宅建士","ref":"R03s-37-4","s":"宅地建物取引士資格試験に合格した未成年者Jは、宅地建物取引業に係る営業に関し成年者と同一の行為能力を有している場合であっても、成年に達するまでは、宅地建物取引士の登録を受けることができない。","a":0,"e":"登録の欠格は「営業に関し成年者と同一の行為能力を有しない未成年者」に限られ、同一の行為能力があれば登録できる。","m":"営業許可ある未成年は登録可"},{"f":"業法","t":"営業保証金","ref":"R06-27-1","s":"営業保証金を金銭のみで供託している宅地建物取引業者Aが、主たる事務所を移転したためその最寄りの供託所が変更した場合、Aは、移転後の主たる事務所の最寄りの供託所に、営業保証金を新たに供託し直さなければならない。","a":0,"e":"金銭のみで供託している場合は、従前の供託所に保管替えを請求する。新たな供託が必要なのは有価証券を含む場合。","m":"金銭のみなら保管替え"},{"f":"業法","t":"営業保証金","ref":"R06-27-3","s":"宅地建物取引業者が有価証券をもって営業保証金を供託する場合、国債証券についてはその額面金額の90%、地方債証券についてはその額面金額の80%に相当する額として評価される。","a":0,"e":"国債証券は額面金額の100%、地方債証券・政府保証債は90%、その他の有価証券は80%で評価される。","m":"国債100・地方債90・他80"},{"f":"業法","t":"営業保証金","ref":"R06-27-4","s":"甲県内に主たる事務所を有する宅地建物取引業者Bが、乙県内に新たに従たる事務所を設置した場合、Bは、その従たる事務所の分の営業保証金を、主たる事務所の最寄りの供託所に供託しなければならない。","a":1,"e":"営業保証金は、どの事務所の分であっても主たる事務所の最寄りの供託所に一括して供託する（25条1項）。","m":"供託先はいつも本店最寄り"},{"f":"業法","t":"営業保証金","ref":"R04-41-イ","s":"宅地建物取引業者Cとの取引により生じた債権について営業保証金の還付が行われ、営業保証金が不足することとなった場合、Cは、免許権者から不足額を供託すべき旨の通知書の送付を受けた日から2週間以内に、その不足額を供託しなければならない。","a":1,"e":"不足額の供託期限は、免許権者から通知書の送付を受けた日から2週間以内（28条1項）。","m":"不足額は通知から2週間"},{"f":"業法","t":"営業保証金","ref":"R02-35-4","s":"新たに免許を受けた宅地建物取引業者Dが、本店のほか2か所の支店を設けて事業を開始しようとする場合、Dが主たる事務所の最寄りの供託所に供託すべき営業保証金の合計額は、1,200万円である。","a":0,"e":"本店1,000万円＋支店1か所につき500万円なので、1,000万＋500万×2＝2,000万円となる。","m":"本店1000・支店500"},{"f":"業法","t":"営業保証金","ref":"R02s-33-4","s":"免許権者は、免許をした日から3月以内に宅地建物取引業者から営業保証金を供託した旨の届出がないときは届出をすべき旨の催告をしなければならず、その催告が到達した日から1月以内に届出がないときは、その免許を取り消すことができる。","a":1,"e":"免許権者は3月以内に届出がなければ催告しなければならず、催告到達後1月以内に届出がなければ取り消すことができる（25条6項・7項）。","m":"3か月で催告・1か月で取消可"},{"f":"業法","t":"営業保証金","ref":"R05-30-イ","s":"宅地建物取引業者Eは、営業保証金を供託したときは、その供託物受入れの記載のある供託書の写しを添付して、その旨を免許権者に届け出た後でなければ、その事業を開始することができない。","a":1,"e":"供託物受入れの記載のある供託書の写しを添付して届け出た後でなければ事業を開始できない（25条4項・5項）。","m":"供託＋届出で営業開始"},{"f":"業法","t":"営業保証金","ref":"R05-30-エ","s":"宅地建物取引業者Fが、免許の有効期間の満了により免許が失効したことに伴い営業保証金を取り戻そうとする場合、Fは、還付請求権者に対し、3か月を下らない一定期間内に申し出るべき旨を公告しなければならない。","a":0,"e":"取戻しの公告期間は6か月を下らない一定期間である（30条2項）。","m":"取戻し公告は6か月以上"},{"f":"業法","t":"営業保証金","ref":"R03-34-2","s":"宅地建物取引業者Gと宅地建物取引業に関し取引をした者であっても、その者が宅地建物取引業者である場合には、その取引により生じた債権について、Gが供託した営業保証金から弁済を受ける権利を有しない。","a":1,"e":"還付を受けられるのは業者と取引をした者のうち、宅建業者を除いた者に限られる（27条1項かっこ書）。","m":"業者同士は還付なし"},{"f":"業法","t":"営業保証金","ref":"R06-36-4","s":"宅地建物取引業者Hが一部の事務所を廃止したことにより営業保証金の額が政令で定める額を超えることとなった場合、Hは、還付請求権者に対する公告をすることなく、その超過額を取り戻すことができる。","a":0,"e":"一部の事務所廃止による取戻しでも、原則として6か月以上の期間を定めた公告が必要である（30条2項）。","m":"一部廃止でも公告必要"},{"f":"業法","t":"保証協会","ref":"R04-39-1","s":"宅地建物取引業保証協会は、社員と取引をした者から弁済業務保証金の還付に係る認証の申出があった場合、認証申出書に記載された取引が成立した時期の順序に従って、認証に係る事務を処理しなければならない。","a":0,"e":"認証事務は、認証申出書の受理の順序に従って処理しなければならない（規則26条の7）。","m":"認証は受理の順番"},{"f":"業法","t":"保証協会","ref":"R04-39-3","s":"宅地建物取引業保証協会の社員である宅地建物取引業者Aが新たに事務所を設置した場合、Aは、追加して納付すべき弁済業務保証金分担金を、国債証券をもって保証協会に納付することができる。","a":0,"e":"弁済業務保証金分担金は金銭で納付しなければならず、有価証券は使えない。","m":"分担金は現金のみ"},{"f":"業法","t":"保証協会","ref":"R04-39-4","s":"宅地建物取引業者Bが宅地建物取引業保証協会の社員となる前に、Bと宅地建物取引業に関し取引をした宅地建物取引業者ではないCは、その取引により生じた債権に関し、弁済業務保証金から弁済を受ける権利を有する。","a":1,"e":"社員となる前に宅建業に関し取引をした者も、弁済を受ける権利を有する（64条の8第1項）。","m":"加入前の取引も対象"},{"f":"業法","t":"保証協会","ref":"R04-41-エ","s":"宅地建物取引業保証協会の社員である宅地建物取引業者Dと宅地建物取引業に関し取引をした者は、その取引により生じた債権に関し、Dが納付した弁済業務保証金の額の範囲内で弁済を受けることができる。","a":0,"e":"弁済の限度は、その社員が社員でないとしたら供託すべき営業保証金の額に相当する額である（64条の8第1項）。","m":"限度は営業保証金相当額"},{"f":"業法","t":"保証協会","ref":"R05-44-2","s":"宅地建物取引業保証協会は、社員である宅地建物取引業者Eが一部の事務所を廃止したことに伴い弁済業務保証金分担金を返還しようとするときは、還付請求権者に対し、一定期間内に申し出るべき旨の公告をしなければならない。","a":0,"e":"公告が必要なのは社員の地位を失った場合の返還であり、一部の事務所廃止による返還では公告は不要。","m":"一部廃止の分担金返還は公告不要"},{"f":"業法","t":"保証協会","ref":"R03s-39-3","s":"宅地建物取引業保証協会に加入しようとする宅地建物取引業者Fは、その保証協会に加入した日から1週間以内に、政令で定める額の弁済業務保証金分担金を当該保証協会に納付しなければならない。","a":0,"e":"分担金は、保証協会に加入しようとする日までに納付しなければならない（64条の9第1項）。","m":"分担金は加入日までに"},{"f":"業法","t":"保証協会","ref":"R06-36-1","s":"宅地建物取引業者Gが宅地建物取引業保証協会に加入しようとするときは、Gは、その加入しようとする日までに、政令で定める額の弁済業務保証金分担金を当該保証協会に納付しなければならない。","a":1,"e":"分担金の納付期限は加入しようとする日まで（64条の9第1項）。","m":"加入前に分担金納付"},{"f":"業法","t":"保証協会","ref":"R03-31-3","s":"宅地建物取引業保証協会の社員である宅地建物取引業者Hとの取引により生じた債権について弁済業務保証金の還付があった場合、Hは、その還付の日から2週間以内に、還付充当金を当該保証協会に納付しなければならない。","a":0,"e":"還付充当金の納付期限は、保証協会から通知を受けた日から2週間以内である（64条の10第2項）。","m":"還付充当金は通知から2週間"},{"f":"業法","t":"保証協会","ref":"R02-36-4","s":"宅地建物取引業保証協会は、社員である宅地建物取引業者Iとの取引により生じた債権について弁済業務保証金の還付があったときは、当該還付額に相当する額の弁済業務保証金を供託しなければならない。","a":1,"e":"保証協会は、国土交通大臣から通知を受けた日から2週間以内に還付額相当の弁済業務保証金を供託する（64条の8第3項）。","m":"還付分は協会が補充供託"},{"f":"業法","t":"保証協会","ref":"H28-31-4","s":"宅地建物取引業保証協会に弁済業務保証金分担金として150万円を納付している社員Jと宅地建物取引業に関し取引をした者（宅地建物取引業者を除く。）は、2,500万円を限度として、弁済業務保証金から弁済を受けることができる。","a":1,"e":"分担金150万円＝本店60万＋支店30万×3。営業保証金に換算すると1,000万＋500万×3＝2,500万円が限度。","m":"60万→1000万・30万→500万"},{"f":"業法","t":"事務所・案内所","ref":"R04-26-1","s":"法人である宅地建物取引業者A社の本店又は支店のうち、商業登記簿に登載されていないものは、そこで宅地建物取引業を営んでいたとしても、宅地建物取引業法上の事務所には該当しない。","a":0,"e":"登記の有無は無関係。本店・支店の実体があり宅建業を営めば事務所に当たる。","m":"登記の有無は関係なし"},{"f":"業法","t":"事務所・案内所","ref":"R04-26-2","s":"宅地建物取引業者B社の支店のうち、宅地建物取引業を一切営まず、B社が兼業として行う建設業の業務のみを行っているものは、宅地建物取引業法上の事務所には該当しない。","a":1,"e":"本店は常に事務所だが、支店は宅建業を営む場合に限り事務所となる。","m":"支店は宅建業を営めば事務所"},{"f":"業法","t":"事務所・案内所","ref":"R04-26-3","s":"宅地建物取引業者Cは、その事務所ごとに、公衆の見やすい場所に、国土交通大臣又は都道府県知事から交付を受けた免許証を掲示しなければならない。","a":0,"e":"免許証の掲示義務はない。事務所に掲示が必要なのは標識と報酬額。","m":"掲示は標識と報酬額だけ"},{"f":"業法","t":"事務所・案内所","ref":"R04-26-4","s":"宅地建物取引業者Dの事務所において、専任の宅地建物取引士が退職したため法定の数に不足が生じた場合、Dは、その日から30日以内に補充その他必要な措置を執れば足りる。","a":0,"e":"専任宅建士の不足は2週間以内に必要な措置を執らなければならない。","m":"専任不足は2週間以内"},{"f":"業法","t":"事務所・案内所","ref":"R03-29-1","s":"宅地建物取引業者Eは、その事務所ごとに従業者名簿を備え、従業者の氏名等を記載しなければならないが、当該名簿は最終の記載をした日から5年間保存すれば足りる。","a":0,"e":"従業者名簿の保存期間は最終記載日から10年間。","m":"名簿は10年保存"},{"f":"業法","t":"事務所・案内所","ref":"R03-29-2","s":"宅地建物取引業者Fが一団の宅地の分譲のために案内所を設置する場合において、その案内所で契約の締結や契約の申込みの受付を行わないときは、Fはその案内所に標識を掲示する必要はない。","a":0,"e":"標識は契約行為等の有無を問わず案内所に掲示が必要。","m":"標識は案内所すべてに"},{"f":"業法","t":"事務所・案内所","ref":"R03-29-3","s":"宅地建物取引業者Gが、マンションの分譲のため契約の締結を行う案内所を設置した場合、Gは、その案内所の公衆の見やすい場所に、国土交通大臣が定めた報酬の額を掲示しなければならない。","a":0,"e":"報酬額の掲示義務は事務所のみ。案内所には不要。","m":"報酬額掲示は事務所だけ"},{"f":"業法","t":"事務所・案内所","ref":"R03-29-4","s":"宅地建物取引業者Hが分譲のための案内所を設置する場合において、その案内所で契約の締結や契約の申込みの受付を行わないときは、Hはその案内所に専任の宅地建物取引士を置く必要はない。","a":1,"e":"専任宅建士の設置義務は契約行為等を行う案内所等に限られる。","m":"契約しない案内所は専任不要"},{"f":"業法","t":"事務所・案内所","ref":"R03s-41-3","s":"宅地建物取引業者Iが、宅地の分譲のため、契約の申込みの受付のみを行い契約の締結は行わない案内所を設置した場合、Iは、その案内所に専任の宅地建物取引士を1人以上置かなければならない。","a":1,"e":"申込みの受付も契約行為等に含まれるため、1人以上の専任宅建士が必要。","m":"申込受付も契約行為等"},{"f":"業法","t":"事務所・案内所","ref":"R03s-41-4","s":"宅地建物取引業者J社の役員である宅地建物取引士Kが未成年者であっても、Kは、J社の事務所のうち自らが主として業務に従事する事務所において、成年者である専任の宅地建物取引士とみなされる。","a":1,"e":"宅建士が業者（法人なら役員）本人のときは、主として業務に従事する事務所等で成年者である専任宅建士とみなされる。","m":"役員宅建士は成年専任扱い"},{"f":"業法","t":"事務所・案内所","ref":"R06-39-4","s":"甲県知事の免許を受けている宅地建物取引業者Aが、乙県内に設けた展示会場で宅地の売買契約の締結を行う場合、Aは、その展示会場の所在地を管轄する乙県知事にのみ届出をすれば足りる。","a":0,"e":"案内所等の届出は免許権者と所在地を管轄する知事の双方に必要。","m":"届出は免許権者＋現地知事"},{"f":"業法","t":"事務所・案内所","ref":"R05-32-4","s":"宅地建物取引業者Bが、一団の建物の分譲のため契約の締結を行う展示会を開催する場合、Bは、その展示会での業務を開始する日の5日前までに、所定の事項を届け出れば足りる。","a":0,"e":"案内所等の届出期限は業務開始の10日前まで。","m":"案内所届出は10日前"},{"f":"業法","t":"事務所・案内所","ref":"R02-39-2","s":"宅地建物取引業者Cの従業者が宅地建物取引士であって、宅地建物取引士証を携帯している場合であっても、Cは、その従業者に従業者証明書を携帯させなければ、その者を業務に従事させてはならない。","a":1,"e":"宅建士証は従業者証明書の代わりにならない。全従業者に従業者証明書の携帯が必要。","m":"宅建士証≠従業者証明書"},{"f":"業法","t":"業務上の規制","ref":"R07-36-ア","s":"宅地建物取引業者Aの従業者が、マンションの購入を勧誘した相手方Bから購入しない旨を明確に告げられたが、その翌日に改めてBに電話をかけて勧誘を続けた場合でも、宅地建物取引業法に違反しない。","a":0,"e":"契約を締結しない意思を表示した相手への勧誘継続は禁止されている。","m":"断られたら勧誘終了"},{"f":"業法","t":"業務上の規制","ref":"R07-36-イ","s":"宅地建物取引業者Cが、他に購入希望者がいないにもかかわらず、相手方Dに対し「今日中でなければ契約できない」と告げ、Dに契約するかどうか考える時間を与えなかった場合でも、宅地建物取引業法に違反しない。","a":0,"e":"正当な理由なく判断に必要な時間を与えることを拒むことは禁止。","m":"熟慮時間の拒否は禁止"},{"f":"業法","t":"業務上の規制","ref":"R07-36-エ","s":"宅地建物取引業者Eが、建物の購入を検討している相手方Fに対し、手付金を貸し付けることを申し出て契約の締結を誘引した場合、結果として契約が成立しなかったとしても、宅地建物取引業法に違反する。","a":1,"e":"手付の貸付け等の信用供与による契約誘引は、誘引行為自体が禁止される。","m":"手付の信用供与は誘引で違反"},{"f":"業法","t":"業務上の規制","ref":"R05-28-ア","s":"宅地建物取引業者Gの従業者が、相手方Hから契約を締結しない旨の意思表示を受けた後に、担当者を別の従業者に替えてHに対する勧誘を継続することは、宅地建物取引業法により禁止されている。","a":1,"e":"意思表示後の勧誘継続は担当者を替えても禁止。","m":"担当替えでも勧誘不可"},{"f":"業法","t":"業務上の規制","ref":"R03-43-ア","s":"宅地建物取引業者Iが、建物の売買契約の締結に当たり、相手方Jに対し手付を分割して受け取ることを持ちかけて契約の締結を誘引した場合であっても、宅地建物取引業法に違反しない。","a":0,"e":"手付の分割受領は信用の供与に当たり、契約誘引は禁止される。","m":"手付分割は信用供与"},{"f":"業法","t":"業務上の規制","ref":"R03-43-ウ","s":"宅地建物取引業者Kの従業者が、電話で宅地の購入を勧誘する際に、勧誘に先立って自己の氏名を相手方に告げていれば、Kの商号を告げなかったとしても、宅地建物取引業法に違反しない。","a":0,"e":"勧誘に先立ち、商号・名称、勧誘者の氏名、勧誘目的を告げる必要がある。","m":"商号・氏名・目的を告げる"},{"f":"業法","t":"業務上の規制","ref":"R03-43-エ","s":"宅地建物取引業者Lが、建物の購入の申込みをした相手方Mから申込みの撤回を受けた際に、既に経費がかかったことを理由として、Mから受領していた預り金の返還を拒むことは、宅地建物取引業法により禁止されている。","a":1,"e":"申込み撤回時に既に受領した預り金の返還を拒むことは禁止。","m":"預り金は全額返還"},{"f":"業法","t":"業務上の規制","ref":"R04-30-ア","s":"宅地建物取引業法上の割賦販売とは、代金の全部又は一部について、目的物の引渡し後6か月以上の期間にわたり、かつ、2回以上に分割して受領することを条件として販売することをいう。","a":0,"e":"割賦販売は引渡し後1年以上の期間にわたり2回以上に分割して受領する販売。","m":"割賦は1年以上・2回以上"},{"f":"業法","t":"業務上の規制","ref":"R04-30-イ","s":"宅地建物取引業者が行う宅地又は建物の売買契約の締結、並びにその代理又は媒介は、犯罪による収益の移転防止に関する法律に規定する特定取引に該当する。","a":1,"e":"宅建業者は特定事業者であり、売買及びその代理・媒介は特定取引に該当する。","m":"宅建業者は特定事業者"},{"f":"業法","t":"業務上の規制","ref":"R04-30-エ","s":"宅地建物取引業者Aの従業者Bは、正当な理由がある場合でなければ、Aの業務を補助したことについて知り得た秘密を他に漏らしてはならず、このことはBが従業者でなくなった後も同様である。","a":1,"e":"守秘義務は従業者にも課され、従業者でなくなった後も続く。","m":"従業者も退職後も守秘"},{"f":"業法","t":"業務上の規制","ref":"R02s-36-1","s":"宅地建物取引業者Cが、売買の媒介の依頼者Dから、その秘密を他に漏らすことについて承諾を得ていた場合であっても、Cは、業務上取り扱ったことについて知り得たDの秘密を他に漏らしてはならない。","a":0,"e":"本人の承諾は正当な理由に当たり、秘密を開示しても違反にならない。","m":"本人承諾は正当な理由"},{"f":"業法","t":"業務上の規制","ref":"R02s-36-2","s":"宅地建物取引業者Eは、宅地建物取引業を営まなくなった後は、宅地建物取引業を営んでいた当時に業務上取り扱ったことについて知り得た秘密に関し、守秘義務を負わない。","a":0,"e":"守秘義務は宅建業を営まなくなった後も継続する。","m":"廃業後も守秘義務"},{"f":"業法","t":"業務上の規制","ref":"R02s-36-3","s":"宅地建物取引業者Fが、裁判の証人として証言を求められ、業務上取り扱ったことについて知り得た依頼者の秘密を証言した場合、宅地建物取引業法上の守秘義務違反とはならない。","a":1,"e":"法律上の証言義務は秘密を漏らす正当な理由に当たる。","m":"証言は正当な理由"},{"f":"業法","t":"広告","ref":"R04-37-ア","s":"宅地建物取引業者Aは、建築確認を受けた後に変更の確認の申請をしている新築分譲マンションについて、変更の確認を受ける予定である旨と当初の確認の内容を併せて表示すれば、その広告をすることができる。","a":1,"e":"当初の確認を受けている以上、変更予定である旨と当初内容を併記すれば広告可能。","m":"当初確認済なら併記で可"},{"f":"業法","t":"広告","ref":"R04-37-イ","s":"宅地建物取引業者Bが、販売する宅地について著しく事実に相違する表示をした広告をインターネットに掲載した場合でも、その広告を見た者からの問合せや申込みがなければ、宅地建物取引業法に違反しない。","a":0,"e":"誇大広告は広告をした時点で違反。問合せ・申込みの有無は無関係。","m":"誇大広告は出した時点で違反"},{"f":"業法","t":"広告","ref":"R04-37-ウ","s":"宅地建物取引業者Cが一団の宅地の分譲について数回に分けて広告をする場合、Cは、広告をするたびに取引態様の別を明示し、さらに宅地の購入に関する注文を受けたときにも改めて取引態様の別を明示しなければならない。","a":1,"e":"取引態様の明示は広告のたび、かつ注文を受けたときにも必要。","m":"広告ごと・注文ごとに明示"},{"f":"業法","t":"広告","ref":"R06-33-1","s":"宅地建物取引業者Dが、売買契約が成立して既に取引することができなくなった宅地について、インターネット上の広告を削除せずに掲載し続けた場合、Dは、誇大広告等の禁止の規定に違反する。","a":1,"e":"成約済み物件の広告継続はおとり広告として誇大広告に当たる。","m":"成約後の掲載はおとり広告"},{"f":"業法","t":"広告","ref":"R06-33-2","s":"宅地建物取引業者Eが、オーナーから一括して借り上げた建物を自ら貸主として第三者に転貸するため入居者募集の広告をする場合、Eは、宅地建物取引業法上、その広告に取引態様の別を明示する必要はない。","a":1,"e":"自ら貸主（転貸含む）は宅建業に当たらず、業法の明示義務は及ばない。","m":"自ら貸主は業法対象外"},{"f":"業法","t":"広告","ref":"R06-33-3","s":"宅地建物取引業者Fが、宅地造成に関する工事について必要な許可を受けた分譲宅地の広告をする場合、その許可を受けた旨を広告に表示すれば、取引態様の別を明示する必要はない。","a":0,"e":"広告開始時期の制限と取引態様の明示は別の義務。許可表示とは別に態様の明示が必要。","m":"許可表示と態様明示は別"},{"f":"業法","t":"広告","ref":"R05-31-2","s":"宅地建物取引業者Gが既存建物の売買の媒介に関する広告をする場合、Gは、その建物について建物状況調査を実施しているかどうかを、広告において明示しなければならない。","a":0,"e":"建物状況調査の有無は広告の明示事項ではない（重説等の記載事項）。","m":"調査有無は広告で不要"},{"f":"業法","t":"広告","ref":"R05-31-3","s":"宅地建物取引業者Hは、工事完了前で建築確認の申請中である建物について、その売買の広告をすることはできないが、その貸借の媒介に関する広告であればすることができる。","a":0,"e":"広告開始時期の制限は貸借にも及ぶ。確認前は貸借の広告もできない。","m":"確認前は貸借広告も不可"},{"f":"業法","t":"広告","ref":"R05-31-4","s":"宅地建物取引業者Iが誇大広告等の禁止の規定に違反した場合、Iは、監督処分の対象となるほか、6か月以下の拘禁刑又は100万円以下の罰金に処せられることがある。","a":1,"e":"誇大広告は指示・業務停止処分の対象であり、罰則（併科もあり）も科され得る。","m":"誇大広告は処分＋罰則"},{"f":"業法","t":"広告","ref":"R03s-30-2","s":"宅地建物取引業者Jは、工事完了前のマンションについて建築確認の申請中であっても、広告に「建築確認申請済」と明示すれば、そのマンションの分譲の広告をすることができる。","a":0,"e":"建築確認を受けるまでは、申請中である旨を表示しても広告できない。","m":"申請済表示でも広告不可"},{"f":"業法","t":"広告","ref":"R03-30-ア","s":"宅地建物取引業者Kは、インターネットを利用して宅地の販売広告をするに当たり、その宅地に係る現在又は将来の利用の制限について、著しく事実に相違する表示をしてはならない。","a":1,"e":"利用の制限は誇大広告の禁止対象事項に含まれる。","m":"利用制限も誇大広告対象"},{"f":"業法","t":"広告","ref":"R03-30-イ","s":"宅地建物取引業者Lが建物の貸借の媒介を行う場合、Lは、依頼者の依頼の有無にかかわらず、その媒介に係る広告の料金に相当する額を、報酬とは別に依頼者から受領することができる。","a":0,"e":"報酬とは別に受領できるのは依頼者の依頼による広告料金に限られる。","m":"依頼された広告料だけ別途"},{"f":"業法","t":"広告","ref":"R02-27-エ","s":"宅地建物取引業者Mは、工事の完了前である建物について、建築基準法に基づく建築確認を申請した後であれば、確認を受ける前であっても、その建物の売買の広告をすることができる。","a":0,"e":"建築確認等の処分があった後でなければ広告できない。","m":"申請後ではなく処分後"},{"f":"業法","t":"広告","ref":"H30-26-4","s":"宅地建物取引業者Nが宅地の販売広告において、その宅地に係る利用の制限の一部を表示しないことにより購入者を誤認させた場合であっても、誇大広告等の禁止の規定には違反しない。","a":0,"e":"誤認させる方法に限定はなく、一部を表示しないことによる誤認も誇大広告に当たる。","m":"表示しないことも誇大広告"},{"f":"業法","t":"媒介契約","ref":"R04-31-1","s":"宅地建物取引業者Aが、宅地の売却の媒介の依頼を受け、その価額について意見を述べる際に根拠を明らかにした場合、Aは、その根拠を示すための査定に要した費用を依頼者に別途請求することはできない。","a":1,"e":"根拠の明示は業者の義務であり、その費用は請求できない。","m":"査定根拠の費用は請求不可"},{"f":"業法","t":"媒介契約","ref":"R04-31-2","s":"宅地建物取引業者Bが、宅地の所有者Cとの間で一般媒介契約を締結した場合、Bが作成してCに交付する媒介契約書面には、宅地を売買すべき価額を記載する必要はない。","a":0,"e":"売買すべき価額は媒介契約の種類を問わず必要的記載事項。","m":"価額は全媒介で記載"},{"f":"業法","t":"媒介契約","ref":"R04-31-3","s":"宅地建物取引業者Dが建物の売却について依頼者Eと専任媒介契約を締結した場合において、Eの申出により契約を更新するときは、更新後の有効期間を3か月を超えるものとすることができる。","a":0,"e":"更新後の有効期間も3か月を超えられない。","m":"更新後も3か月まで"},{"f":"業法","t":"媒介契約","ref":"R06-32-3","s":"宅地建物取引業者Fが依頼者Gと専任媒介契約を締結した場合、購入の申込みがなくても、Fは2週間に1回以上業務の処理状況をGに報告しなければならないが、その報告は口頭で行ってもよい。","a":1,"e":"業務処理状況の報告方法に制限はなく、口頭でも足りる。","m":"報告は口頭でもOK"},{"f":"業法","t":"媒介契約","ref":"R05-40-1","s":"宅地建物取引業者Hが宅地の売却の媒介の依頼を受けている場合において、購入の申込みがあったが、その申込みの内容が依頼者の希望条件を満たさないときは、Hは依頼者に報告する必要はない。","a":0,"e":"申込みがあったときは条件にかかわらず遅滞なく報告しなければならない。","m":"申込みは選別せず報告"},{"f":"業法","t":"媒介契約","ref":"R05-40-3","s":"宅地建物取引業者Iが依頼者Jとの間で建物の売買に係る専任媒介契約を締結した場合、Iは、契約締結の日から休業日を含めて7日以内に、当該建物を指定流通機構に登録しなければならない。","a":0,"e":"専任媒介の登録期限は休業日を除いて7日以内。","m":"専任は休業日除き7日"},{"f":"業法","t":"媒介契約","ref":"R05-40-4","s":"宅地建物取引業者Kが依頼者Lと専任媒介契約を締結したときは、LがK以外の宅地建物取引業者の媒介により売買契約を成立させたときの措置を、媒介契約書面に記載しなければならない。","a":1,"e":"依頼者の契約違反に対する措置は専任媒介の媒介契約書の記載事項。","m":"他業者で成約時の措置を記載"},{"f":"業法","t":"媒介契約","ref":"H30-33-1","s":"宅地建物取引業者Mが既存建物の売却の媒介の依頼を受けた場合において、依頼者が建物状況調査を実施する者のあっせんを希望しないときは、Mは、あっせんに関する事項を媒介契約書面に記載する必要はない。","a":0,"e":"あっせんの有無は必要的記載事項。希望しない場合もその旨の記載が必要。","m":"あっせん無しも記載"},{"f":"業法","t":"媒介契約","ref":"R04-42-2","s":"宅地建物取引業者Nが、宅地の売買の媒介の依頼を受けて、その売買すべき価額について意見を述べるときは、その根拠を明らかにしなければならないが、その方法は口頭でも書面でもよい。","a":1,"e":"根拠の明示方法に制限はない。","m":"根拠は口頭でも書面でも"},{"f":"業法","t":"媒介契約","ref":"R03-38-ア","s":"宅地建物取引業者Aが宅地の売却について依頼者Bと一般媒介契約を締結する場合、その媒介契約の有効期間を3か月以内としなければならないという制限は適用されない。","a":1,"e":"有効期間3か月の制限は専任媒介契約に限られる。","m":"3か月制限は専任だけ"},{"f":"業法","t":"媒介契約","ref":"R03-38-エ","s":"宅地建物取引業者Cが建物の貸主Dから貸借の媒介の依頼を受けて媒介契約を締結した場合において、その媒介契約に有効期間の定めがなかったとしても、宅地建物取引業法に違反しない。","a":1,"e":"媒介契約の規制（34条の2）は売買・交換に適用され、貸借には及ばない。","m":"貸借は媒介契約規制外"},{"f":"業法","t":"媒介契約","ref":"H28-27-3","s":"宅地建物取引業者Eが宅地の売買の媒介契約を締結し、その内容を記載した書面を作成して依頼者に交付する場合、その書面には宅地建物取引士の記名は必要ない。","a":1,"e":"媒介契約書に記名押印するのは宅建業者であり、宅建士の記名は不要。","m":"媒介契約書は業者が記名押印"},{"f":"業法","t":"媒介契約","ref":"R07-39-2","s":"宅地建物取引業者Fが依頼者Gと専属専任媒介契約を締結する際に、「有効期間満了時にGから更新しない旨の申出がなければ自動的に更新する」旨の特約を定めた場合、その特約は有効である。","a":0,"e":"更新は依頼者の申出がある場合に限られ、自動更新特約は無効。","m":"自動更新は無効"},{"f":"業法","t":"媒介契約","ref":"R07-39-4","s":"宅地建物取引業者Hが依頼者Iと専属専任媒介契約を締結した場合、Hは、指定流通機構に登録した物件について、その取引の申込みの受付に関する状況も登録しなければならない。","a":1,"e":"取引の申込みの受付に関する状況は登録事項に含まれる。","m":"申込受付状況も登録"},{"f":"業法","t":"重要事項説明","ref":"R04-34-1","s":"宅地建物取引業者Aが既存の木造住宅の売買の媒介を行う場合において、当該住宅について1年以内に建物状況調査が実施されているときは、Aは、その実施の有無及び結果の概要を重要事項として説明しなければならない。","a":1,"e":"既存住宅の売買・貸借では、実施後1年以内（共同住宅等は2年以内）の建物状況調査の実施の有無と結果の概要が説明事項。","m":"既存住宅は調査有無＋概要"},{"f":"業法","t":"重要事項説明","ref":"R02-31-3","s":"宅地建物取引業者Bが既存住宅の売買の媒介を行う場合、Bは、建物状況調査を実施しているかどうかを説明すれば足り、実施しているときであってもその結果の概要までは説明する必要はない。","a":0,"e":"実施している場合は結果の概要まで説明しなければならない。","m":"有無だけでなく概要も"},{"f":"業法","t":"重要事項説明","ref":"H30-27-3","s":"宅地建物取引業者Cが既存の戸建住宅の売買の媒介を行う場合において、3年前に建物状況調査が実施されていたときは、Cは、その結果の概要を重要事項として説明しなければならない。","a":0,"e":"対象は実施後1年以内（共同住宅等は2年以内）の調査に限られ、3年前のものは対象外。","m":"調査は1年（共同2年）以内"},{"f":"業法","t":"重要事項説明","ref":"R07-37-4","s":"宅地建物取引業者Dが鉄筋コンクリート造の共同住宅の一住戸の売買の媒介を行う場合において、1年6か月前に建物状況調査が実施されていたときは、Dは、実施した旨及びその結果の概要を説明しなければならない。","a":1,"e":"鉄筋コンクリート造等の共同住宅等は実施後2年以内の調査が対象となる。","m":"RC共同住宅は2年以内"},{"f":"業法","t":"重要事項説明","ref":"R03s-44-イ","s":"宅地建物取引業者Eが既存住宅の貸借の媒介を行う場合、Eは、借主に対し、建物状況調査の実施の有無と、実施しているときはその結果の概要を、重要事項として説明しなければならない。","a":1,"e":"建物状況調査の説明は既存住宅の売買・貸借いずれにも必要。","m":"調査説明は貸借でも要"},{"f":"業法","t":"重要事項説明","ref":"R04-34-2","s":"宅地建物取引業者Fが建物の売買の媒介を行う場合において、当該建物が宅地造成及び特定盛土等規制法に規定する造成宅地防災区域内にあるときは、Fは、その旨を説明しなければならない。","a":1,"e":"造成宅地防災区域内にある旨は、宅地・建物、売買・貸借を問わず説明事項。","m":"造成宅地防災区域は全取引"},{"f":"業法","t":"重要事項説明","ref":"R04-34-3","s":"宅地建物取引業者Gが建物の売買の媒介を行う場合において、当該建物について石綿の使用の有無の調査の結果が記録されているときは、Gは、その内容を買主に説明しなければならない。","a":1,"e":"石綿調査の結果が記録されていれば、建物の売買・貸借とも内容を説明する。","m":"石綿は記録あれば内容"},{"f":"業法","t":"重要事項説明","ref":"R01-28-3","s":"宅地建物取引業者Hが建物の貸借の媒介を行う場合において、当該建物について石綿の使用の有無の調査の結果が記録されていないときは、Hは、自ら石綿の使用の有無を調査し、その結果を説明しなければならない。","a":0,"e":"記録がなければ記録がない旨を説明すれば足り、業者に調査義務はない。","m":"石綿・耐震は調査義務なし"},{"f":"業法","t":"重要事項説明","ref":"R04-34-4","s":"宅地建物取引業者Iが昭和56年5月31日以前に新築の工事に着手した建物の売買の媒介を行う場合において、当該建物が耐震診断を受けているときは、Iは、その旨のみを説明すれば足りる。","a":0,"e":"旧耐震建物が耐震診断を受けているときは、その内容を説明しなければならない。","m":"耐震診断は旨でなく内容"},{"f":"業法","t":"重要事項説明","ref":"R02-44-1","s":"宅地建物取引業者Jが昭和55年に新築の工事に着手した建物の売買の媒介を行う場合において、当該建物が耐震診断を受けているときは、Jは、その内容を重要事項として説明しなければならない。","a":1,"e":"昭和56年6月1日より前に着工した建物が対象で、耐震診断を受けていればその内容を説明する。","m":"S56.6.1前着工が対象"},{"f":"業法","t":"重要事項説明","ref":"R04-36-1","s":"宅地建物取引業者Kが既存住宅の売買の媒介を行う場合、Kは、検査済証の保存の状況について説明しなければならず、検査済証が存在しないときは、その旨を説明しなければならない。","a":1,"e":"既存住宅の売買では建築・維持保全に関する書類の保存状況が説明事項で、ない場合はその旨を説明する。","m":"書類保存状況は売買のみ"},{"f":"業法","t":"重要事項説明","ref":"R01-39-1","s":"宅地建物取引業者Lが既存住宅の貸借の媒介を行う場合、Lは、借主に対し、設計図書や点検記録など建物の建築及び維持保全の状況に関する書類の保存の状況を説明しなければならない。","a":0,"e":"書類の保存状況は既存住宅の売買・交換のみの説明事項で、貸借では不要。","m":"書類保存は貸借不要"},{"f":"業法","t":"重要事項説明","ref":"H30-27-2","s":"宅地建物取引業者Mが既存住宅の売買の媒介を行う場合、Mは、設計図書等の建物の建築及び維持保全の状況に関する書類について、その保存の状況に加え、記載されている内容まで説明しなければならない。","a":0,"e":"説明が必要なのは保存の状況であり、書類の記載内容まで説明する義務はない。","m":"保存状況のみで内容不要"},{"f":"業法","t":"重要事項説明","ref":"R06-41-ウ","s":"宅地建物取引業者Nが建物の貸借の媒介を行う場合において、当該建物が住宅の品質確保の促進等に関する法律に規定する住宅性能評価を受けた新築住宅であるときは、Nは、その旨を説明しなければならない。","a":0,"e":"住宅性能評価を受けた新築住宅である旨は建物の売買・交換の説明事項で、貸借では不要。","m":"性能評価は売買のみ"},{"f":"業法","t":"重要事項説明","ref":"R01-28-4","s":"宅地建物取引業者Aが区分所有建物の貸借の媒介を行う場合において、専有部分の用途その他の利用の制限に関する規約の定めがあるときは、Aは、その内容を借主に説明しなければならない。","a":1,"e":"専有部分の利用制限規約（ペット禁止等）は、区分所有建物の売買・貸借いずれでも説明事項。","m":"専有部分利用制限は貸借も"},{"f":"業法","t":"重要事項説明","ref":"R02-31-4","s":"宅地建物取引業者Bが区分所有建物の取引の媒介を行う場合、専有部分の利用の制限に関する規約の定めについては、売買の媒介であれば説明が必要であるが、貸借の媒介であれば説明は不要である。","a":0,"e":"専有部分の利用制限規約は貸借でも説明が必要。","m":"利用制限は売買貸借とも"},{"f":"業法","t":"重要事項説明","ref":"R04-36-3","s":"宅地建物取引業者Cが宅地の売買の媒介を行う場合において、市町村が作成した水害ハザードマップに当該宅地の位置が表示されているときは、Cは、そのハザードマップが存在することを説明すれば足りる。","a":0,"e":"水害ハザードマップを提示し、その中の物件の所在地を示して説明しなければならない。","m":"ハザードは所在地を示す"},{"f":"業法","t":"重要事項説明","ref":"R03-33-1","s":"宅地建物取引業者Dが建物の売買の媒介を行う場合において、市町村が水害ハザードマップを作成・公表していないことが確認できたときは、Dは、提示すべきハザードマップが存在しない旨を説明すれば足りる。","a":1,"e":"作成されていない場合は、提示すべきハザードマップがない旨を説明すればよい。","m":"未作成ならその旨説明"},{"f":"業法","t":"重要事項説明","ref":"R03-33-3","s":"宅地建物取引業者Eが建物の取引の媒介を行う場合、水害ハザードマップにおける当該建物の所在地の提示・説明は、売買又は交換の媒介では必要であるが、貸借の媒介では必要ない。","a":0,"e":"水害ハザードマップの説明は売買・交換・貸借のいずれでも必要。","m":"ハザードは貸借も必要"},{"f":"業法","t":"重要事項説明","ref":"R06-37-ア","s":"宅地建物取引業者Fが建物の貸借の媒介を行う場合において、市町村が作成した水害ハザードマップに当該建物の位置が含まれているときは、Fは、そのハザードマップにおける当該建物の所在地を示して説明しなければならない。","a":1,"e":"水害ハザードマップ上の所在地は、宅地・建物、売買・貸借を問わず説明事項。","m":"ハザードは全取引共通"},{"f":"業法","t":"重要事項説明","ref":"R04-36-2","s":"宅地の売買の媒介を行う宅地建物取引業者Gは、買主に対し、売買代金の額並びにその支払の時期及び方法を、宅地建物取引士をして重要事項として説明させなければならない。","a":0,"e":"代金の額・支払時期・方法は37条書面の記載事項で、重要事項説明の対象ではない。","m":"代金・支払方法は37条"},{"f":"業法","t":"重要事項説明","ref":"R03-26-2","s":"宅地建物取引業者Hが建物の売買の媒介を行う場合において、代金以外に授受される金銭があるときは、Hは、その金銭の額だけでなく、その授受の目的についても重要事項として説明しなければならない。","a":1,"e":"代金・交換差金・借賃以外に授受される金銭の額及び授受の目的が説明事項。","m":"代金以外は額と目的"},{"f":"業法","t":"重要事項説明","ref":"R04-36-4","s":"宅地建物取引業者Iが自ら売主として宅地建物取引業者ではない買主Jと建物の売買契約を締結する場合、Iは、Jに対し、建物の引渡しの時期を重要事項として説明しなければならない。","a":0,"e":"引渡しの時期は37条書面の記載事項であり、重要事項説明の対象ではない。","m":"引渡し時期は37条だけ"},{"f":"業法","t":"重要事項説明","ref":"R05-42-イ","s":"宅地建物取引業者Kが、売主・買主ともに宅地建物取引業者ではない宅地の売買の媒介を行う場合、Kは、売主及び買主の双方に対し、宅地建物取引士をして重要事項の説明をさせなければならない。","a":0,"e":"重要事項説明の相手方は買主（借主）等であり、売主に説明する義務はない。","m":"重説は買主・借主へ"},{"f":"業法","t":"重要事項説明","ref":"R05-42-ウ","s":"宅地建物取引業者Lが自ら売主として宅地建物取引業者である買主Mと建物の売買契約を締結する場合、Lは、Mに重要事項説明書を交付すれば足り、宅地建物取引士にその内容を説明させる必要はない。","a":1,"e":"相手方が宅建業者の場合、35条書面の交付は必要だが説明は不要。","m":"業者相手は交付のみ"},{"f":"業法","t":"重要事項説明","ref":"R05-42-ア","s":"宅地建物取引業者Nの宅地建物取引士Oが、宅地の買主Pに対して重要事項の説明をする場合において、Pから請求がなかったときは、Oは、宅地建物取引士証をPに提示する必要はない。","a":0,"e":"重要事項説明の際は、請求の有無にかかわらず宅建士証を提示しなければならない。","m":"重説時は必ず士証提示"},{"f":"業法","t":"重要事項説明","ref":"R03s-35-1","s":"宅地建物取引業者Aの宅地建物取引士Bが、テレビ会議等のITを活用して建物の借主Cに重要事項の説明をする場合、Cの承諾があれば、Bは宅地建物取引士証の提示を省略することができる。","a":0,"e":"IT重説でも宅建士証の提示は必要で、画面上で相手方が視認できるようにする。","m":"IT重説も士証提示"},{"f":"業法","t":"重要事項説明","ref":"R03-36-1","s":"宅地建物取引業者Dが建物の貸借の媒介を行う場合、Dは、借主に対し、都市計画法に規定する開発許可に関する制限の概要を、重要事項として説明しなければならない。","a":0,"e":"建物の貸借で説明すべき法令上の制限は限られており、開発許可の制限は対象外。","m":"建物貸借の法令制限は僅か"},{"f":"業法","t":"重要事項説明","ref":"R03-36-3","s":"宅地建物取引業者Eが建物の貸借の媒介を行う場合、Eは、借主に対し、台所、浴室、便所その他の当該建物の設備の整備の状況を、重要事項として説明しなければならない。","a":1,"e":"台所・浴室・便所等の設備の整備状況は建物の貸借特有の説明事項。","m":"設備状況は建物貸借"},{"f":"業法","t":"重要事項説明","ref":"R06-37-エ","s":"宅地建物取引業者Aが建物の貸借の媒介を行う場合において、借主となる者に対して重要事項の説明をするときは、Aは、当該建物に係る私道に関する負担に関する事項を説明しなければならない。","a":0,"e":"私道負担は建物の貸借以外の取引で説明する事項で、建物の貸借では不要。","m":"私道負担は建物貸借除く"},{"f":"業法","t":"重要事項説明","ref":"R06-41-ア","s":"宅地建物取引業者Aが建物の売買の媒介を行う場合において、当該建物に登記された抵当権が売買契約の締結日までに抹消される予定であるときは、Aは、重要事項説明において当該抵当権について説明する必要はない。","a":0,"e":"抹消予定であっても、登記された権利の種類・内容等は説明しなければならない。","m":"抹消予定でも登記は説明"},{"f":"業法","t":"重要事項説明","ref":"R01-41-1","s":"宅地建物取引業者Aが建物の貸借の媒介を行う場合において、当該建物の管理が委託されているときは、Aは、その委託を受けている者の氏名（法人にあっては商号又は名称）及び住所（法人にあっては主たる事務所の所在地）を説明しなければならない。","a":1,"e":"建物の貸借では、区分所有か否かを問わず管理委託先の氏名・住所を説明する。","m":"管理委託先は商号と所在地"},{"f":"業法","t":"重要事項説明","ref":"R01-41-2","s":"宅地建物取引業者Aが自ら売主として建物を売却するにあたり宅地建物取引業者Bに媒介を依頼し、Bの媒介により宅地建物取引業者ではない買主Cと契約する場合、Cに対する重要事項の説明義務はBのみが負い、Aは負わない。","a":0,"e":"売主業者も媒介業者とともに買主に対する説明義務を負う。","m":"売主業者も説明義務"},{"f":"業法","t":"重要事項説明","ref":"R03s-44-ウ","s":"宅地建物取引業者Aが建物の売買の媒介を行う場合、Aは、当該建物の契約不適合を担保すべき責任の履行に関し保証保険契約の締結その他の措置を講ずるかどうか、及びその措置を講ずる場合におけるその概要を説明しなければならない。","a":1,"e":"担保責任の履行確保措置を講ずるかどうか及びその概要は売買の説明事項。","m":"担保責任措置の有無・概要"},{"f":"業法","t":"37条書面","ref":"R04-44-1","s":"宅地建物取引業者Aが自ら売主として、宅地建物取引業者Bの代理により買主Cとの間で宅地の売買契約を締結した場合において、AがCのほかBに対しても37条書面を交付したとしても、宅地建物取引業法の規定に違反しない。","a":1,"e":"買主への交付義務を果たしたうえで代理業者に交付することは何ら問題ない。","m":"余分に渡しても違反なし"},{"f":"業法","t":"37条書面","ref":"R04-44-2","s":"宅地建物取引業者Aが建物の売買の媒介により契約を成立させた場合において、37条書面に記名した宅地建物取引士が不在であるときは、Aは、宅地建物取引士ではない従業者に当該書面を当事者へ交付させることができる。","a":1,"e":"記名は宅建士が必要だが、交付者に資格の制限はない。","m":"記名は士、交付は誰でも"},{"f":"業法","t":"37条書面","ref":"R04-44-3","s":"宅地建物取引業者Aが建物の貸借の媒介を行った場合において、借賃以外の金銭の授受に関する定めがあるときは、Aは、その額並びに当該金銭の授受の時期及び目的を37条書面に記載しなければならない。","a":1,"e":"借賃以外の金銭は任意的記載事項で、定めがあれば額・時期・目的を記載する。","m":"借賃以外は額・時期・目的"},{"f":"業法","t":"37条書面","ref":"R04-44-4","s":"宅地建物取引業者A及びBがそれぞれ売主と買主から依頼を受けて媒介を行い宅地の売買契約が成立した場合、A及びBがそれぞれ37条書面を作成して自らの事務所に保管すれば、売主及び買主に交付する必要はない。","a":0,"e":"関与した各業者が当事者に37条書面を交付する義務を負う。","m":"作成だけでなく交付必須"},{"f":"業法","t":"37条書面","ref":"R03s-26-1","s":"宅地建物取引業者Aが宅地の売買の媒介を行った場合、Aは、37条書面に宅地の引渡しの時期又は移転登記の申請の時期のいずれか一方を記載すれば足り、両方を記載する必要はない。","a":0,"e":"引渡しの時期と移転登記の申請時期はいずれも売買の必要的記載事項。","m":"引渡しも登記も両方"},{"f":"業法","t":"37条書面","ref":"R03s-26-2","s":"宅地建物取引業者Aが既存建物の貸借の媒介を行った場合、Aは、建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を37条書面に記載しなければならない。","a":0,"e":"当事者双方が確認した事項の記載は既存建物の売買・交換のみで、貸借では不要。","m":"確認事項は売買のみ"},{"f":"業法","t":"37条書面","ref":"R03s-26-4","s":"宅地建物取引業者Aが宅地の売買の媒介により契約を成立させた場合、Aは、37条書面を売主及び買主に交付する際に、宅地建物取引士をして、その書面の内容を説明させなければならない。","a":0,"e":"37条書面は宅建士の記名が必要だが、説明義務はない。","m":"37条は記名のみ説明不要"},{"f":"業法","t":"37条書面","ref":"R04-35-4","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者Bと建物の売買契約を締結した場合、買主Bが宅地建物取引業者であっても、Aは、Bに対して37条書面を交付しなければならない。","a":1,"e":"37条書面の交付義務は相手方が宅建業者でも省略できない。","m":"業者相手でも37条交付"},{"f":"業法","t":"37条書面","ref":"R02-33-1","s":"宅地建物取引業者Aが建物の貸借の媒介を行った場合、Aは、借賃の額並びにその支払の時期及び方法を37条書面に記載し、貸主及び借主の双方に交付しなければならない。","a":1,"e":"借賃の額・支払時期・方法は貸借の必要的記載事項。","m":"借賃は額・時期・方法"},{"f":"業法","t":"37条書面","ref":"R02-33-2","s":"宅地建物取引業者Aが宅地の貸借の媒介を行う場合において、宅地の引渡しの時期を35条書面に記載して借主に説明したときは、Aは、37条書面への引渡しの時期の記載を省略することができる。","a":0,"e":"引渡しの時期は37条書面の必要的記載事項で、35条で説明しても省略できない。","m":"35条で説明しても省略不可"},{"f":"業法","t":"37条書面","ref":"R02-33-3","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者Bと宅地の売買契約を締結した場合、買主Bが宅地建物取引業者であるため、Aは、37条書面に宅地建物取引士をして記名させる必要はない。","a":0,"e":"相手方が宅建業者でも宅建士の記名は省略できない。","m":"業者間でも士の記名要"},{"f":"業法","t":"37条書面","ref":"R05-43-1","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者である買主Bと土地の売買契約を締結した場合、Aは、37条書面に移転登記の申請の時期を記載する必要はない。","a":0,"e":"必要的記載事項は相手方が宅建業者でも省略できない。","m":"業者相手でも記載省略不可"},{"f":"業法","t":"37条書面","ref":"R05-43-2","s":"宅地建物取引業者Aが建物の売買の媒介を行う場合、Aは、売主及び買主との間で売買契約が成立する前に、37条書面を売主及び買主の双方に交付しなければならない。","a":0,"e":"37条書面は契約成立後遅滞なく交付する書面である（契約前に交付するのは35条書面）。","m":"37条は契約後遅滞なく"},{"f":"業法","t":"37条書面","ref":"R05-43-3","s":"宅地建物取引業者Aが宅地の売買の媒介により契約を成立させた場合、Aが37条書面に記名させる宅地建物取引士は、Aの事務所に置かれている専任の宅地建物取引士でなければならない。","a":0,"e":"記名する宅建士は専任である必要はない。","m":"記名は専任でなくてよい"},{"f":"業法","t":"37条書面","ref":"R05-43-4","s":"宅地建物取引業者Aが建物の売買の媒介を行った場合において、天災その他不可抗力による損害の負担に関する定めがあるときは、Aは、その内容を37条書面に記載しなければならない。","a":1,"e":"危険負担の定めは任意的記載事項で、定めがあれば記載が必要。","m":"天災負担は定めあれば"},{"f":"業法","t":"37条書面","ref":"R07-29-3","s":"宅地建物取引業者Aが建物の売買の媒介を行った場合において、天災その他不可抗力による損害の負担に関する定めがないときは、Aは、37条書面に「定めなし」と記載しなければならない。","a":0,"e":"任意的記載事項は定めがなければ記載する必要はない。","m":"定めなければ記載不要"},{"f":"業法","t":"37条書面","ref":"R07-29-2","s":"宅地建物取引業者Aが既存建物の売買の媒介を行った場合、Aは、建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を37条書面に記載しなければならない。","a":1,"e":"既存建物の売買・交換では当事者双方が確認した事項が必要的記載事項。","m":"既存建物売買は確認事項"},{"f":"業法","t":"37条書面","ref":"R07-33-イ","s":"宅地建物取引業者Aが宅地の売買の媒介を行った場合において、当該売買契約に契約の解除に関する定めがないときであっても、Aは、契約の解除に関する事項を37条書面に記載しなければならない。","a":0,"e":"契約の解除に関する定めは任意的記載事項で、定めがなければ記載不要。","m":"解除は定めあれば記載"},{"f":"業法","t":"37条書面","ref":"R07-33-ウ","s":"宅地建物取引業者Aが建物の売買の媒介を行った場合において、当該建物に登記された抵当権が存在するときは、Aは、その抵当権の内容を37条書面に記載しなければならない。","a":0,"e":"登記された権利の内容は35条書面の説明事項で、37条書面の記載事項ではない。","m":"登記権利は35条"},{"f":"業法","t":"37条書面","ref":"R03-41-ア","s":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者Bの媒介により買主Cと宅地の売買契約を締結した場合、A及びBは、いずれも宅地建物取引士をして37条書面に記名させなければならない。","a":1,"e":"複数業者が関与する場合、各業者がそれぞれ宅建士に記名させる義務を負う。","m":"関与業者全員が記名"},{"f":"業法","t":"37条書面","ref":"R03-41-イ","s":"宅地建物取引業者Aが宅地の売買の媒介を行った場合において、手付金の授受に関する定めがあるときは、Aは、37条書面に手付金の額を記載すれば、その授受の時期については記載しなくてもよい。","a":0,"e":"代金以外の金銭は額・授受の時期・目的のすべてを記載しなければならない。","m":"額だけでは足りない"},{"f":"業法","t":"37条書面","ref":"R06-44-1","s":"宅地建物取引業者Aが工事完了前の建物の売買の媒介を行った場合、Aは、重要事項の説明の際に使用した図書を交付することにより、37条書面における当該建物を特定するために必要な表示とすることができる。","a":1,"e":"未完成建物は重要事項説明時に使用した図書を交付することで特定の表示に代えられる。","m":"未完成は図書で特定"},{"f":"業法","t":"37条書面","ref":"R06-44-4","s":"宅地建物取引業者Aが自ら買主として宅地建物取引業者ではない売主Bから宅地を購入する場合、Bの承諾を得たときは、Aは、Bに対して37条書面を交付しなくてもよい。","a":0,"e":"37条書面の交付は相手方の承諾があっても省略できない。","m":"承諾あっても交付必須"},{"f":"業法","t":"37条書面","ref":"R04-32-4","s":"宅地建物取引業者Aが建物の売買の媒介を行った場合において、契約不適合を担保すべき責任に関する特約を定めたときは、Aは、その内容を37条書面に記載しなければならない。","a":1,"e":"担保責任の定めは売買の任意的記載事項で、定めがあれば記載する。","m":"担保責任特約は記載"},{"f":"業法","t":"37条書面","ref":"R05-28-エ","s":"宅地建物取引業者Aが宅地の売買の媒介により契約を成立させた場合、37条書面には宅地建物取引士の記名が必要であるが、宅地建物取引士の押印は必要ない。","a":1,"e":"法改正で押印は廃止され、宅建士の記名で足りる。","m":"記名のみ押印不要"},{"f":"業法","t":"クーリング・オフ","ref":"R05-35-1","s":"宅地建物取引業者Aが自ら売主として、宅地建物取引業者ではない買主Bからテント張りの案内所で宅地の買受けの申込みを受けた場合、Bの承諾を得れば、Aは、クーリング・オフについての告知を電磁的方法により行うことができる。","a":0,"e":"告知は書面で行う必要がある。買主の承諾があっても電磁的方法は不可。","m":"告知は紙の書面"},{"f":"業法","t":"クーリング・オフ","ref":"R05-35-2","s":"宅地建物取引業者Aが自ら売主として、宅地建物取引業者ではない買主Bからテント張りの案内所で買受けの申込みを受けた場合、Bは、クーリング・オフについて告げられた日から8日以内であれば、電磁的方法により申込みの撤回を行うことができる。","a":0,"e":"クーリング・オフの撤回・解除は書面で行う必要があり、電磁的方法は認められない。","m":"撤回も紙で"},{"f":"業法","t":"クーリング・オフ","ref":"R05-35-4","s":"宅地建物取引業者Aが自ら売主となる宅地の売買において、宅地建物取引業者ではない買主Bが、Aから媒介の依頼を受けた宅地建物取引業者Cの事務所で買受けの申込みをした場合、Bは、書面によってもクーリング・オフによる申込みの撤回をすることができない。","a":1,"e":"媒介・代理を行う宅建業者の事務所も「事務所等」に当たるため、クーリング・オフはできない。","m":"媒介業者の事務所も事務所等"},{"f":"業法","t":"クーリング・オフ","ref":"R04-38-1","s":"宅地建物取引業者Aが自ら売主として、宅地建物取引業者ではない買主Bと喫茶店で建物の売買契約を締結した場合において、Bが建物の引渡しを受けたときは、代金の全部を支払っていなくても、Bはクーリング・オフによる契約の解除をすることができない。","a":0,"e":"できなくなるのは引渡しを受け、かつ代金全部を支払った場合。引渡しだけでは解除可能。","m":"引渡し＋全額で終了"},{"f":"業法","t":"クーリング・オフ","ref":"R04-38-3","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと宅地の売買契約を締結するにあたり、Aの申出によりBの勤務先で契約を締結した場合、Bは、クーリング・オフによる契約の解除をすることができない。","a":0,"e":"勤務先が事務所等になるのは買主が自ら申し出た場合のみ。業者の申出ならクーリング・オフ可能。","m":"勤務先は買主申出のみ"},{"f":"業法","t":"クーリング・オフ","ref":"R04-38-4","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと建物の売買契約を締結した後、Bがクーリング・オフにより契約を解除した場合、Aは、Bから受領した手付金その他の金銭を速やかに全額返還しなければならない。","a":1,"e":"売主業者は、受領した手付金その他の金銭を速やかに全額返還しなければならない（37条の2第3項）。違約金・損害賠償の請求もできない。","m":"受領金は全額返還"},{"f":"業法","t":"クーリング・オフ","ref":"R03-39-3","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと締結した宅地の売買契約について、Bがクーリング・オフにより契約を解除する場合、その解除の効力は、解除の書面がAに到達した時に生ずる。","a":0,"e":"効力は書面を発した時に生じる（発信主義）。","m":"発信時に効力"},{"f":"業法","t":"クーリング・オフ","ref":"R06-30-1","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bからテント張りの案内所で買受けの申込みを受けた場合において、Aがクーリング・オフについて告げる書面には、宅地建物取引士の記名は必要とされていない。","a":1,"e":"告知書面の記載事項に宅建士の記名は含まれない。35条・37条書面と区別する。","m":"告知書面は宅建士不要"},{"f":"業法","t":"クーリング・オフ","ref":"R01-38-イ","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bから喫茶店で買受けの申込みを受けた場合において、クーリング・オフができる期間を告知の日から10日間とする旨の特約を定めたときは、その特約は無効である。","a":0,"e":"8日より長くする特約は買主に有利なので有効。","m":"長くする特約は有効"},{"f":"業法","t":"クーリング・オフ","ref":"H29-31-ア","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと宅地の売買契約を締結する場合において、Bが自ら申し出た自宅で買受けの申込みをしたときは、Bは、書面によりクーリング・オフによる申込みの撤回をすることができる。","a":0,"e":"買主が自ら申し出た自宅・勤務先は事務所等に当たり、クーリング・オフできない。","m":"自ら申し出た自宅は不可"},{"f":"業法","t":"8種制限","ref":"R04-43-2","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと建物の売買契約を締結する場合において、契約不適合を担保すべき責任を「引渡しの日から1年」に限る旨の特約を定めたときは、その特約は有効である。","a":0,"e":"引渡しから2年以上とする特約を除き、民法より買主に不利な特約は無効。","m":"通知期間は引渡し2年以上"},{"f":"業法","t":"8種制限","ref":"R04-43-3","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと代金2,500万円の建物の売買契約を締結する場合、損害賠償の額の予定と違約金を合計して500万円とする旨を定めることができる。","a":1,"e":"予定額と違約金の合計が代金の2/10（500万円）以下なので適法。","m":"賠償予定＋違約金で2割"},{"f":"業法","t":"8種制限","ref":"R04-43-4","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと宅地の割賦販売契約を締結した場合において、Aが代金の額の10分の3を超える額の支払を受けた後は、Aは、当該宅地の所有権を留保することはできない。","a":1,"e":"代金の3/10超を受領したら登記等を移転する必要があり、所有権留保は禁止される。","m":"3割超で留保禁止"},{"f":"業法","t":"8種制限","ref":"R02-32-1","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと建物の売買契約を締結し手付を受領した場合において、Bが契約の履行に着手した後は、Aは、手付の倍額を提供しても、手付による契約の解除をすることができない。","a":1,"e":"手付解除は相手方が履行に着手するまで。着手後は倍額提供でも解除不可。","m":"相手の着手で解除不可"},{"f":"業法","t":"8種制限","ref":"R02-32-3","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと宅地の割賦販売契約を締結した場合において、Bが賦払金の支払を怠ったときは、Aは、直ちに契約を解除することができる。","a":0,"e":"30日以上の期間を定めて書面で催告し、その期間内に支払がない場合でなければ解除できない。","m":"30日以上の書面催告"},{"f":"業法","t":"8種制限","ref":"H27-34-1","s":"宅地建物取引業者Aが、自己の所有に属しない宅地について所有者Cとの間で停止条件付の取得契約を締結しているにすぎない場合、Aは、自ら売主として宅地建物取引業者ではない買主Bと当該宅地の売買契約を締結することができない。","a":1,"e":"取得契約が停止条件付では例外に当たらず、売買契約の締結は禁止される。","m":"停止条件付はNG"},{"f":"業法","t":"8種制限","ref":"H27-39-3","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者Bと建物の売買契約を締結する場合、損害賠償の額の予定を代金の額の30%とする旨の特約を定めても、その特約は有効である。","a":1,"e":"8種制限は業者間取引には適用されないため、2割の上限はない。","m":"業者間は8種なし"},{"f":"業法","t":"8種制限","ref":"H27-34-2","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと建物の売買契約を締結する場合において、契約不適合の通知期間を「引渡しの日から1年」とする特約を定めたときは、その特約は無効となり、通知期間は「引渡しの日から2年」となる。","a":0,"e":"特約は無効だが、民法の原則（不適合を知った時から1年以内に通知）に戻る。","m":"無効なら民法に戻る"},{"f":"業法","t":"8種制限","ref":"R02-42-2","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと工事完了前の建物を代金5,000万円で売買する契約を締結し、手付金200万円を受領した場合、Aは、保全措置を講じなければ、中間金300万円を受領することができない。","a":1,"e":"合計500万円が代金の5%（250万円）を超えるため、中間金受領前に保全措置が必要。","m":"合計額で判定"},{"f":"業法","t":"8種制限","ref":"H30-29-3","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと代金2,000万円の宅地の売買契約を締結する場合、Aは、Bから手付として500万円を受領することはできない。","a":1,"e":"手付の上限は代金の2/10（400万円）なので違反となる。","m":"手付は2割まで"},{"f":"業法","t":"8種制限","ref":"R03-42-4","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと宅地の売買契約を締結した場合において、損害賠償の額の予定をしていないときは、Bの債務不履行によりAが請求できる損害賠償の額は代金の額の10分の2が上限となる。","a":0,"e":"2割の制限は予定する場合の規制。予定がなければ実損額を請求できる。","m":"予定なしなら実損"},{"f":"業法","t":"8種制限","ref":"R03s-27-2","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと工事完了前の建物の売買契約を締結する場合、Aは、手付金等の保全措置として、指定保管機関との間で手付金等寄託契約を締結する方法を用いることができる。","a":0,"e":"未完成物件の保全措置は保証委託契約か保証保険契約のみ。寄託は完成物件だけ。","m":"未完成は保証か保険"},{"f":"業法","t":"8種制限","ref":"R03s-27-4","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと建物の売買契約を締結した場合において、Aが講じなければならない手付金等の保全措置を講じないときは、Bは、手付金等を支払わないことができる。","a":1,"e":"売主業者が必要な保全措置を講じないときは、買主は手付金等の支払を拒める。","m":"保全なしなら支払拒否可"},{"f":"業法","t":"8種制限","ref":"H28-28-イ","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと工事完了後の建物を代金4,000万円で売買する契約を締結する場合、Aは、保全措置を講じることなく、Bから手付として400万円を受領することができる。","a":1,"e":"完成物件は代金の10%（400万円）以下かつ1,000万円以下なら保全措置不要。","m":"完成は10%・1千万"},{"f":"業法","t":"8種制限","ref":"H28-28-ウ","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bと宅地の売買契約を締結し手付を受領した場合、Bが契約の履行に着手する前であれば、Aは、受領した手付と同額を返還することにより、契約を解除することができる。","a":0,"e":"売主業者が手付解除するには手付の倍額を現実に提供する必要がある。","m":"売主は倍返し"},{"f":"業法","t":"報酬","ref":"R04-27-1","s":"宅地建物取引業者Aが宅地の売買の媒介を行う場合において、依頼者の特別の依頼により遠隔地で現地調査を行ったときは、依頼者の事前の承諾を得ていれば、Aは、その費用を報酬とは別に受領することができる。","a":1,"e":"依頼者の依頼による特別の費用は、事前に承諾を得ていれば別途受領できる。","m":"特別依頼の費用は別途"},{"f":"業法","t":"報酬","ref":"R04-27-2","s":"宅地建物取引業者Aが宅地の使用貸借の媒介を行う場合において、通常の借賃をもとに報酬の限度額を算定するときは、Aは、必ず不動産鑑定業者の鑑定評価を求めなければならない。","a":0,"e":"鑑定評価は必要に応じて求めればよく、義務ではない。","m":"鑑定は必要に応じて"},{"f":"業法","t":"報酬","ref":"R04-27-3","s":"宅地建物取引業者Aが居住用建物の貸借の媒介を行う場合、貸主及び借主の双方の承諾があれば、Aは、双方から合計で借賃の1か月分に相当する金額に消費税等相当額を加えた額を超える報酬を受領することができる。","a":0,"e":"承諾があっても双方合計で借賃1か月分(+税)が上限。","m":"合計1か月分が上限"},{"f":"業法","t":"報酬","ref":"R05-34-ア","s":"宅地建物取引業者Aが居住用建物の貸借の媒介を行う場合、借主の承諾を得ていなければ、Aが借主から受領できる報酬の額は、借賃の0.5か月分に相当する金額に消費税等相当額を加えた額が上限となる。","a":1,"e":"居住用建物は承諾がない限り依頼者の一方から0.5か月分(+税)まで。","m":"居住用は承諾なし半月"},{"f":"業法","t":"報酬","ref":"R05-34-イ","s":"宅地建物取引業者Aが宅地の売買の媒介を行う場合において、依頼者の依頼によって行った広告の料金に相当する額については、Aは、報酬とは別に受領することができる。","a":1,"e":"依頼者の依頼による広告料金は報酬限度額とは別に受領できる。","m":"依頼広告は別途OK"},{"f":"業法","t":"報酬","ref":"R05-34-ウ","s":"宅地建物取引業者Aが建物の貸借の媒介を行う場合において、Aが賃貸借契約書を作成したときは、Aは、その作成費用を報酬の限度額とは別に借主から受領することができる。","a":0,"e":"契約書作成費は通常業務の費用で、報酬とは別に受領できない。","m":"契約書作成費は報酬内"},{"f":"業法","t":"報酬","ref":"R01-32-2","s":"宅地建物取引業者Aが事務所用建物の貸借の媒介を行う場合、Aは、貸主及び借主の双方から合計して、借賃の1か月分に相当する金額に消費税等相当額を加えた額を上限として報酬を受領することができる。","a":1,"e":"居住用以外の貸借は、双方からの合計が1か月分(+税)以内なら配分は自由。","m":"非居住用は配分自由"},{"f":"業法","t":"報酬","ref":"H30-31-1","s":"宅地建物取引業者Aが代金900万円（消費税等相当額を含まない。）の土地付中古住宅の売買の媒介を行う場合、低廉な空家等の売買に関する報酬の特例は適用されない。","a":1,"e":"特例の対象は代金800万円以下の宅地建物。900万円は通常計算となる。","m":"特例は800万円以下"},{"f":"業法","t":"報酬","ref":"H30-31-2","s":"宅地建物取引業者Aが低廉な空家等の売買の媒介を行う場合、低廉な空家等に関する報酬の特例は売主から受領する報酬にのみ適用され、買主から受領する報酬には適用されない。","a":0,"e":"2024年改正後は買主からの媒介報酬にも特例が適用され、30万円(+税)まで受領できる。","m":"特例は買主側にも"},{"f":"業法","t":"報酬","ref":"R07-26-イ","s":"宅地建物取引業者Aが長期の空家等の貸借の媒介を行う場合、長期の空家等に関する報酬の特例による上乗せ分について、Aは、貸主からだけでなく借主からも受領することができる。","a":0,"e":"長期の空家等の特例は貸主からの報酬に限られ、借主からは通常の限度まで。","m":"長期空家は貸主から"},{"f":"業法","t":"監督・罰則","ref":"R03s-28-ア","s":"宅地建物取引業者Aが不正の手段により免許を受けたことが判明した場合、Aに免許を与えた免許権者は、Aの免許を取り消さなければならない。","a":1,"e":"不正手段による免許取得は必要的取消事由。","m":"不正取得は必ず取消"},{"f":"業法","t":"監督・罰則","ref":"R03s-28-イ","s":"宅地建物取引業者Aが免許に付された条件に違反した場合、Aに免許を与えた免許権者は、Aの免許を必ず取り消さなければならない。","a":0,"e":"条件違反は任意的取消事由で、取り消すことが「できる」にとどまる。","m":"条件違反は任意取消"},{"f":"業法","t":"監督・罰則","ref":"R03s-28-ウ","s":"宅地建物取引業者Aが、その事務所ごとに公衆の見やすい場所に国土交通大臣が定めた報酬の額を掲示しなかった場合、Aは指示処分の対象にはなるが、罰則の対象にはならない。","a":0,"e":"報酬額の掲示義務違反は罰則（罰金）の対象となる。","m":"報酬掲示違反は罰金"},{"f":"業法","t":"監督・罰則","ref":"R01-29-ア","s":"甲県知事が、国土交通大臣の免許を受けた宅地建物取引業者Aに対し、甲県の区域内における業務に関して業務停止処分をしようとする場合、甲県知事は、あらかじめ内閣総理大臣に協議しなければならない。","a":0,"e":"内閣総理大臣との協議が必要なのは国土交通大臣が処分する場合。","m":"協議は大臣処分のみ"},{"f":"業法","t":"監督・罰則","ref":"R01-29-イ","s":"国土交通大臣又は都道府県知事は、宅地建物取引業者Aに対して指示処分をしようとするときは、聴聞を行わなければならず、その聴聞の期日における審理は公開により行わなければならない。","a":1,"e":"監督処分の前には聴聞が必要で、審理は公開で行う。","m":"聴聞は公開"},{"f":"業法","t":"監督・罰則","ref":"R01-29-ウ","s":"宅地建物取引業者Aが、免許を受けてから1年以内に事業を開始しない場合、Aに免許を与えた免許権者は、Aの免許を取り消さなければならない。","a":1,"e":"1年以内に事業を開始しないことは必要的取消事由。","m":"1年不開始は必ず取消"},{"f":"業法","t":"監督・罰則","ref":"R06-31-2","s":"免許権者は、宅地建物取引業者Aの事務所の所在地を確知できないためその事実を公告した場合において、公告の日から2週間を経過してもAから申出がないときは、Aの免許を取り消すことができる。","a":0,"e":"公告の日から30日を経過しても申出がない場合に取り消すことができる。","m":"所在不明は公告30日"},{"f":"業法","t":"監督・罰則","ref":"R06-31-4","s":"宅地建物取引業者Aに対して監督処分をする場合、免許権者は、免許取消処分をしたときは公告をしなければならないが、業務停止処分をしたときは公告をする必要はない。","a":0,"e":"業務停止処分も公告が必要。公告不要なのは指示処分。","m":"指示処分だけ公告なし"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R04-45-1","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者である買主Bに新築住宅を販売する場合であっても、Aは、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行わなければならない。","a":0,"e":"買主が宅建業者の場合、資力確保措置は不要。","m":"業者買主なら不要"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R04-45-2","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bに新築住宅を販売する場合において、住宅販売瑕疵担保責任保険契約を締結するときは、Bの承諾があれば、その保険契約の有効期間を5年とすることができる。","a":0,"e":"保険契約は引渡しから10年以上有効でなければならず、承諾でも短縮不可。","m":"保険は10年以上"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R05-45-3","s":"宅地建物取引業者Aが自ら売主として新築住宅を販売し、住宅販売瑕疵担保保証金を供託する場合、Aは、販売した新築住宅の所在地の最寄りの供託所に供託しなければならない。","a":0,"e":"供託先は宅建業者の主たる事務所の最寄りの供託所。","m":"主たる事務所の最寄り"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R05-45-4","s":"宅地建物取引業者Aが自ら売主として宅地建物取引業者ではない買主Bに新築住宅を販売する場合、構造耐力上主要な部分の瑕疵について責任を負わない旨の特約をBと結んだとしても、Aは、資力確保措置を講じなければならない。","a":1,"e":"そのような免責特約は無効なので、資力確保措置の義務は残る。","m":"免責特約は無効"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R06-45-2","s":"新築住宅を販売した宅地建物取引業者Aが、基準日に係る資力確保措置の状況の届出をしなかった場合、Aは、基準日の翌日から起算して50日を経過した日以後においては、新たに自ら売主となる新築住宅の売買契約を締結することができない。","a":1,"e":"届出を怠ると基準日の翌日から起算して50日経過日以後、新たな売買契約が禁止される。","m":"届出なし→50日で禁止"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R06-45-4","s":"宅地建物取引業者Aが住宅販売瑕疵担保保証金の額の算定にあたり販売戸数を数える場合、販売した新築住宅のうち床面積25㎡以下のものについては、3戸をもって1戸として数える。","a":0,"e":"床面積55㎡以下の住宅は2戸をもって1戸と数える。","m":"55㎡以下は2戸で1戸"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R03-45-3","s":"住宅販売瑕疵担保責任保険契約が締結された新築住宅の売主である宅地建物取引業者A及び買主Bは、当該住宅に関する紛争について、指定住宅紛争処理機関に紛争処理を申請することができる。","a":1,"e":"保険付き住宅の紛争は指定住宅紛争処理機関を利用できる。","m":"保険なら紛争処理機関"},{"f":"権利","t":"意思表示・行為能力","ref":"R02-06-1","s":"Aは、所有する甲土地を100万円で売却するつもりであったが、重大な過失により「10万円で売る」とBに表示し、Bがこれを承諾した。Bが錯誤について知らなかった場合、Aは、錯誤を理由に意思表示を取り消すことができる。","a":0,"e":"表意者に重大な過失がある錯誤は、相手方が悪意・重過失または共通錯誤の場合を除き取り消せない。","m":"重過失の錯誤は原則取消し不可"},{"f":"権利","t":"意思表示・行為能力","ref":"R02-06-3","s":"Aは、所有する絵画が真作であるのに贋作であると誤信し、Bに対して「贋作なので10万円で売る」と表示して売却した。Bも同様に贋作と誤信して購入した場合、Aは、錯誤を理由にこの売買契約を取り消すことができる。","a":1,"e":"動機が表示されて契約内容となり、相手方も同一の錯誤（共通錯誤）に陥っていれば、表意者に重過失があっても取り消せる。","m":"共通錯誤なら重過失でもOK"},{"f":"権利","t":"意思表示・行為能力","ref":"R02-06-2","s":"Aは、所有する壺の価値を誤信してBに売却したが、その価値に関する誤信（動機）をBに対して表示していなかった。この場合であっても、Aは、錯誤を理由にBとの売買契約を取り消すことができる。","a":0,"e":"動機の錯誤は、その事情が法律行為の基礎とされていることが表示されていた場合に限り取り消せる。","m":"動機の錯誤は表示が必要"},{"f":"権利","t":"意思表示・行為能力","ref":"R01-02-3","s":"AがBに甲土地を売却し、Bが甲土地をCに転売した。Aの売却の意思表示には重要な錯誤があり、Aに重過失がない場合、Aは、錯誤による取消しを、錯誤について悪意のCに対抗することができる。","a":1,"e":"錯誤取消しは善意無過失の第三者に対抗できないだけで、悪意の第三者には対抗できる。","m":"錯誤は善意無過失の第三者に負ける"},{"f":"権利","t":"意思表示・行為能力","ref":"H30-01-3","s":"AとBが通謀して、A所有の甲土地をBに仮装譲渡した。その後、仮装譲渡の事実を知らないCがBから甲土地を買い受けた場合、Aは、Cに対して虚偽表示による無効を対抗することができない。","a":1,"e":"虚偽表示の無効は善意の第三者に対抗できない（94条2項）。第三者は無過失までは不要。","m":"虚偽表示は善意だけで保護"},{"f":"権利","t":"意思表示・行為能力","ref":"H30-01-4","s":"Aは、第三者Cの詐欺によりBに甲土地を売却し、その後BはDに甲土地を転売した。Bが詐欺の事実について善意無過失であっても、Dが詐欺の事実を知っていれば、Aは、Bとの売買契約を取り消すことができる。","a":0,"e":"第三者詐欺は、相手方Bが詐欺を知り又は知ることができたときに限り取り消せる。Bが善意無過失なら取消し不可。","m":"第三者詐欺は相手方の認識で決まる"},{"f":"権利","t":"意思表示・行為能力","ref":"R04-03-1","s":"成年被後見人Aが甲土地をBに売却した場合において、成年後見監督人が選任されているときは、Aの成年後見人Cは、成年後見監督人の同意がなければ、当該売買契約を取り消すことができない。","a":0,"e":"成年後見人は法定代理人として単独で取消権を行使でき、後見監督人の同意は不要。","m":"取消しに監督人の同意不要"},{"f":"権利","t":"意思表示・行為能力","ref":"R04-03-4","s":"民法上、成年年齢は18歳とされているから、18歳の者は、年齢を理由として後見人の欠格事由に該当することはない。","a":1,"e":"未成年者は後見人になれないが、18歳は成年なので年齢による欠格事由に当たらない。","m":"18歳は成年＝後見人OK"},{"f":"権利","t":"意思表示・行為能力","ref":"H28-02-1","s":"古着の販売業について法定代理人から営業の許可を受けた未成年者Aが、その営業とは関係なく自己の居住用の建物をBから購入する場合、Aは、法定代理人の同意を得る必要はない。","a":0,"e":"営業許可による行為能力はその営業に関する行為に限られる。無関係な建物購入は同意が必要で、同意なければ取り消せる。","m":"営業許可は営業の範囲だけ"},{"f":"権利","t":"意思表示・行為能力","ref":"H28-02-4","s":"被補助人Aが、補助人の同意を得なければならない土地の売却について、詐術を用いて補助人の同意を得たとBに信じさせ、Bに土地を売却した場合、Aは、その売買契約を取り消すことができない。","a":1,"e":"制限行為能力者が詐術を用いて行為能力者であると、または同意を得たと信じさせたときは取り消せない（21条）。","m":"詐術を使えば取消し不可"},{"f":"権利","t":"代理","ref":"H30-02-1","s":"Aから甲土地の売却の代理権を与えられたBが、代金を着服する意図でCと売買契約を締結した場合において、CがBの意図を知っていたときであっても、その契約の効果は当然にAに帰属する。","a":0,"e":"代理権の濫用で相手方が目的を知り又は知り得たときは無権代理とみなされ、当然には本人に帰属しない（107条）。","m":"濫用＋相手方悪意有過失→無権代理"},{"f":"権利","t":"代理","ref":"H30-02-2","s":"AがBに甲土地の売却に関する代理権を与えた場合において、Bが代理権の授与前に補助開始の審判を受けていたときであっても、Bは有効に代理権を取得することができる。","a":1,"e":"代理人は行為能力者であることを要しない（102条）。","m":"代理人に行為能力は不要"},{"f":"権利","t":"代理","ref":"H30-02-3","s":"Bが、甲土地の売主A及び買主Cの双方の代理人となって売買契約を締結した場合、A及びCがあらかじめ許諾していたとしても、その契約は無権代理行為とみなされる。","a":0,"e":"双方代理は無権代理とみなされるが、本人があらかじめ許諾した行為や債務の履行は有効となる（108条1項ただし書）。A・C双方の許諾があれば有効。","m":"双方代理も許諾あれば有効"},{"f":"権利","t":"代理","ref":"H30-02-4","s":"AがBに甲土地の売却に関する代理権を与えた後、Bが後見開始の審判を受け、その後にBがAの代理人としてCと売買契約を締結した場合、その契約は無権代理行為となる。","a":1,"e":"代理人の後見開始の審判は代理権の消滅事由（111条）であり、その後の行為は無権代理となる。","m":"代理人の後見開始で代理権消滅"},{"f":"権利","t":"代理","ref":"H29-01-1","s":"Aから甲土地の売買契約締結の代理権を与えられたBは、相手方Cとの間で売買契約を締結した場合、特段の事情がない限り、Cからの取消しの意思表示を受領する権限を有する。","a":1,"e":"判例は、契約締結の代理権には相手方からの取消しの意思表示を受領する権限も含まれるとする。","m":"締結権限に受領権限も含む"},{"f":"権利","t":"代理","ref":"H29-01-2","s":"Aから甲土地の売却を委任され代理権を与えられたBは、Aの許諾を得ていなければ、やむを得ない事由があるときであっても、復代理人を選任することはできない。","a":0,"e":"任意代理人は、本人の許諾を得たとき又はやむを得ない事由があるときに復代理人を選任できる（104条）。","m":"任意代理の復任＝許諾orやむを得ず"},{"f":"権利","t":"代理","ref":"H29-01-4","s":"夫婦の一方Aは、他方Bから個別に代理権を与えられていなくても、日常の家事に関する事項については、Bを代理して第三者と法律行為をすることができる。","a":1,"e":"判例は761条を根拠に、夫婦が日常家事について相互に代理権を有するとする。","m":"日常家事は夫婦で相互代理"},{"f":"権利","t":"代理","ref":"R02s-02-4","s":"代理権を有しないBがAの代理人と称してA所有の甲土地をCに売却した場合において、Aがこれを追認したときは、別段の意思表示がない限り、その契約は追認の時からAに対して効力を生ずる。","a":0,"e":"追認は別段の意思表示がない限り、契約の時にさかのぼって効力を生ずる（116条）。","m":"追認は契約時にさかのぼる"},{"f":"権利","t":"代理","ref":"R03s-05-4","s":"Bの代理人であったAが、代理権の消滅後にBの代理人としてCと契約を締結した場合において、Cが過失により代理権の消滅を知らなかったときであっても、Bは、その契約について責任を負う。","a":0,"e":"代理権消滅後の表見代理（112条）は相手方の善意無過失が必要。過失があれば本人は責任を負わない。","m":"表見代理は善意無過失が要件"},{"f":"権利","t":"代理","ref":"H26-02-2","s":"Aから担保のための借入れの代理権のみを与えられたBが、Aの名義でA所有の甲土地をCに売却した場合において、CがA本人の行為であると信じたことについて正当な理由があるときは、表見代理の規定が類推適用される。","a":1,"e":"代理人が本人名義で権限外の行為をした場合も、判例は110条の類推適用を認める。","m":"本人名義の権限外行為も110条類推"},{"f":"権利","t":"時効","ref":"R04-10-1","s":"A所有の甲土地を占有していたBが、その後甲土地をDに賃貸して引き渡した場合、Bは甲土地の占有を失うから、甲土地を時効により取得することはできない。","a":0,"e":"賃借人を通じた間接占有（代理占有）でもBの占有は継続するため、時効取得できる。","m":"賃貸しても間接占有で継続"},{"f":"権利","t":"時効","ref":"R04-10-2","s":"Aが甲土地を占有していたところ、取得時効の完成前にBに占有を奪われた。Aが占有回収の訴えにより占有を回復した場合、奪われていた期間もAの占有期間に算入される。","a":1,"e":"占有回収の訴えにより占有を回復すれば、占有は中断しなかったものとして扱われる。","m":"占有回収の訴えで中断なし"},{"f":"権利","t":"時効","ref":"R04-10-3","s":"Aは、甲土地を自己の所有物と信じて所有の意思をもって占有を開始したが、その途中で甲土地がBの所有であることを知った。この場合、その時点でAの所有の意思は否定され、Aは甲土地を時効取得することはできない。","a":0,"e":"所有の意思は占有開始時の権原により客観的に判断され、途中で悪意になっても失われない。","m":"所有の意思は開始時で判断"},{"f":"権利","t":"時効","ref":"R02s-05-2","s":"AがBに対して貸金の返還を求める訴えを提起したが、その後Aがこの訴えを取り下げた場合、その取下げの時から新たに時効の進行が始まる。","a":0,"e":"権利が確定せずに終了した場合は更新されず、終了時から6か月間時効の完成が猶予されるだけ。","m":"取下げ＝更新なし、6か月猶予"},{"f":"権利","t":"時効","ref":"R02s-05-3","s":"債務者Aが債権者Bに対して債務を承認することにより時効を更新させるには、Aが、Bの権利の処分について行為能力又は権限を有していることを要しない。","a":1,"e":"承認には処分の行為能力・権限は不要（152条2項）。","m":"承認に処分能力は不要"},{"f":"権利","t":"時効","ref":"R01-09-4","s":"AがBに対して金銭の支払を求める訴えを提起した後、AB間で裁判上の和解が成立した場合であっても、その請求権について時効の更新の効力は生じない。","a":0,"e":"裁判上の和解は確定判決と同一の効力を有し、時効は更新される。","m":"裁判上の和解で更新"},{"f":"権利","t":"時効","ref":"H30-04-1","s":"AのBに対する貸金債権についてCが保証人となっている場合において、主たる債務の消滅時効の完成後にBが時効の利益を放棄したときであっても、Cは、主たる債務の消滅時効を援用することができる。","a":1,"e":"時効利益の放棄の効果は相対的で、保証人は独自に援用できる。","m":"放棄は相対効、保証人は援用可"},{"f":"権利","t":"時効","ref":"H30-04-2","s":"A所有の甲土地にBが1番抵当権を、Cが2番抵当権を有している場合、後順位抵当権者Cは、Bの抵当権の被担保債権の消滅時効を援用することができる。","a":0,"e":"順位上昇は反射的利益にすぎず、後順位抵当権者は援用権者に当たらない（判例）。","m":"後順位抵当権者は援用不可"},{"f":"権利","t":"時効","ref":"H30-04-4","s":"AのBに対する貸金債権について消滅時効が完成した後に、Bが時効の完成を知らずにAに対して債務を承認した場合、Bは、その後その消滅時効を援用することはできない。","a":1,"e":"時効完成後の承認は、完成を知らなくても信義則上援用できなくなる（判例）。","m":"完成後の承認→援用不可"},{"f":"権利","t":"時効","ref":"R02-10-3","s":"Dは善意無過失で甲土地の占有を開始し、その後Fが甲土地の占有をDから承継した。Fが悪意であっても、FはDの占有と自己の占有を併せて主張し、合計10年の占有で短期取得時効が成立しうる。","a":1,"e":"占有を併合する場合、善意無過失は最初の占有者の占有開始時で判断する。","m":"善意無過失は最初の開始時"},{"f":"権利","t":"物権変動・対抗","ref":"R04-01-1","s":"AがB及びCに甲土地を二重に譲渡し、背信的悪意者であるCが先に所有権移転登記を備えた場合、Cは、登記を備えていないBに対して甲土地の所有権を対抗することができる。","a":0,"e":"背信的悪意者は177条の第三者に当たらないため、Bは登記なくCに所有権を主張できる。","m":"背信的悪意者は登記しても負け"},{"f":"権利","t":"物権変動・対抗","ref":"H24-06-4","s":"Gが甲土地をH及びIに二重に譲渡し、背信的悪意者であるIから善意で甲土地を譲り受けたJが登記を備えた場合、登記を備えていない第一買主Hは、Jに対して所有権を対抗することができない。","a":1,"e":"背信的悪意者からの転得者も、自身が背信的悪意者でなければ177条の第三者として保護される。","m":"転得者は本人基準で判断"},{"f":"権利","t":"物権変動・対抗","ref":"R07-01-2","s":"A所有の甲土地がAからB、BからCへと順次売却された場合、Cは、所有権移転登記を備えなければ、Aに対して甲土地の所有権を主張することができない。","a":0,"e":"順次移転の前主と後主は当事者類似の関係で対抗問題にならず、Cは登記なくAに主張できる。","m":"順次移転は登記不要"},{"f":"権利","t":"物権変動・対抗","ref":"R07-01-3","s":"AがBに甲土地を売却した後にAB間の売買契約が解除された場合、解除前にBから甲土地を取得した第三者Cも、解除後にBから甲土地を取得した第三者Cも、登記を備えればAに所有権を主張することができる。","a":1,"e":"解除前の第三者は権利保護要件として、解除後の第三者は対抗要件として登記が必要で、登記があればAに主張できる。","m":"解除は前後とも登記で決着"},{"f":"権利","t":"物権変動・対抗","ref":"R07-01-4","s":"AがBに甲土地を売却し、BがCに転売した後に、AがBの強迫を理由にAB間の売買契約を取り消した場合、Cが強迫について善意無過失であれば、CはAに対して甲土地の所有権を主張することができる。","a":0,"e":"強迫による取消しは善意無過失の第三者にも対抗できる。取消し後の第三者とは登記の先後で決まる。","m":"強迫は善意無過失にも勝つ"},{"f":"権利","t":"物権変動・対抗","ref":"R03s-06-4","s":"A及びBが共同相続した甲土地について、Aが単独所有の登記をしたうえで甲土地全部をCに譲渡し、Cが所有権移転登記を備えた場合でも、Bは、自己の持分をCに対して登記なく対抗することができる。","a":1,"e":"他の相続人の持分については譲渡人は無権利者であり、Cはその部分の権利を取得できない（判例）。","m":"他人の持分は無権利"},{"f":"権利","t":"物権変動・対抗","ref":"R01-01-1","s":"AがBに甲土地を売却したが、甲土地は何の権原もないCが不法に占拠している。この場合、Bは、所有権移転登記を備えていなければ、Cに対して甲土地の明渡しを請求することができない。","a":0,"e":"不法占拠者は177条の第三者に当たらないため、登記なしで明渡請求できる。","m":"不法占拠者に登記不要"},{"f":"権利","t":"物権変動・対抗","ref":"R01-01-2","s":"AがDに甲土地を賃貸し、Dが甲土地上に登記ある建物を所有している場合において、Bが甲土地をAから買い受けたときは、Bは、所有権移転登記を備えなければ、Dに対して甲土地の所有者であることを主張することができない。","a":1,"e":"土地の譲受人が対抗力ある借地人に所有権・賃貸人の地位を主張するには所有権移転登記が必要。","m":"賃借人には登記が必要"},{"f":"権利","t":"物権変動・対抗","ref":"H24-06-3","s":"AがB及びCに甲土地を二重に譲渡し、Cが先に所有権移転登記を備えた場合であっても、Bは、自己の売買契約がCの契約より先に締結されたことを立証すれば、登記なくCに所有権を主張することができる。","a":0,"e":"二重譲渡の優劣は契約の先後ではなく、登記の先後で決まる。","m":"二重譲渡は登記の先後"},{"f":"権利","t":"物権変動・対抗","ref":"R01-01-4","s":"AがBに甲土地を売却しBへの所有権移転登記がされた後に、甲土地を占有していたFについて取得時効が完成した場合、Fは、登記を備えていなくても、Bに対して甲土地の所有権を主張することができる。","a":1,"e":"Bは時効完成前の第三者であり、時効取得者とは当事者類似の関係なので登記不要。","m":"時効完成前の第三者には登記不要"},{"f":"権利","t":"共有・相隣","ref":"R06-03-1","s":"A・B・Cが共有する甲土地について、その形状又は効用の著しい変更を伴う変更を加える場合、各共有者の持分の価格に従い、その過半数で決することができる。","a":0,"e":"重大な変更には共有者全員の同意が必要（251条1項）。所在不明共有者がいれば裁判所の決定を得て他の共有者の同意で行う。","m":"重大変更は全員同意"},{"f":"権利","t":"共有・相隣","ref":"R06-03-3","s":"A・B・C・Dが各4分の1の持分で共有する甲土地を、第三者Eに資材置場として期間3年で賃貸する場合、A・B・Cの同意があれば足り、Dの同意を得る必要はない。","a":1,"e":"土地の5年以内の賃貸借は管理行為であり、持分の価格の過半数で決することができる。","m":"土地5年以内の賃貸は過半数"},{"f":"権利","t":"共有・相隣","ref":"R07-08-1","s":"A・B・Cが共有する甲土地について、無権利者Dが自己への不実の所有権移転登記をした場合、Aは、単独でDに対してその登記の抹消を請求することができる。","a":1,"e":"不実の登記の抹消請求は保存行為として各共有者が単独でできる。","m":"不実登記の抹消は単独で"},{"f":"権利","t":"共有・相隣","ref":"R07-08-2","s":"A・B・Cが各3分の1の持分で共有する甲土地について、Aが自己の持分を放棄する旨の意思表示をした場合、Aの持分は他の共有者であるB及びCに帰属することなく、国庫に帰属する。","a":0,"e":"共有者が持分を放棄したときは、その持分は他の共有者に帰属する（255条）。","m":"持分放棄は他の共有者へ"},{"f":"権利","t":"共有・相隣","ref":"R07-08-4","s":"A・Bが共有する甲土地について、AがBに無断で甲土地を単独で占有している場合であっても、Bは、Aに対して当然には甲土地を自己に明け渡すよう請求することはできない。","a":1,"e":"Aも持分に応じて共有物全部を使用する権原を有するため、当然には明渡請求できない（判例）。","m":"無断占有でも当然明渡し不可"},{"f":"権利","t":"共有・相隣","ref":"R05-02-1","s":"甲土地の所有者Aは、境界の測量のため隣地である乙土地を使用することができる場合であっても、乙土地上の住家については、その居住者の承諾がなければ立ち入ることができない。","a":1,"e":"隣地使用権はあるが、住家への立入りには居住者の承諾が必要（209条1項ただし書）。","m":"住家立入りは居住者の承諾"},{"f":"権利","t":"共有・相隣","ref":"R05-02-2","s":"甲土地の所有者Aは、隣地の竹木の枝が境界線を越えている場合において、竹木の所有者に枝を切除するよう催告したにもかかわらず相当の期間内に切除されないときは、自らその枝を切り取ることができる。","a":1,"e":"催告後相当期間内に切除しない場合などは、土地所有者が自ら枝を切り取れる（233条3項）。","m":"催告して放置なら自ら切れる"},{"f":"権利","t":"共有・相隣","ref":"R05-02-4","s":"他の土地に囲まれて公道に通じない甲土地の所有者Aは、公道に出るため、甲土地を囲んでいる他の土地のうち、通行する場所を自由に選ぶことができる。","a":0,"e":"通行の場所・方法は、通行権者に必要で、かつ他の土地のために損害が最も少ないものを選ばなければならない。","m":"通行は損害最小の場所"},{"f":"権利","t":"共有・相隣","ref":"R03s-02-3","s":"高地である甲土地の所有者Aは、大雨により浸水した甲土地を乾かすためであっても、公の水流又は下水道に至るまで、低地である乙土地に水を通過させることはできない。","a":0,"e":"浸水地を乾かすため等には、公の水流又は下水道に至るまで低地に水を通過させることができる（220条）。","m":"浸水時は低地に排水可"},{"f":"権利","t":"共有・相隣","ref":"R02-01-4","s":"他の土地に囲まれて公道に通じない甲土地の所有者Aがいる場合において、甲土地を囲んでいる乙土地をCが時効取得したときは、Aは、乙土地を通行することができなくなる。","a":0,"e":"袋地の通行権は土地の位置関係から当然に生じ、囲繞地の所有者が変わっても消滅しない。","m":"通行権は所有者交代で消えない"},{"f":"権利","t":"抵当権・担保","ref":"R04-04-1","s":"A所有の甲土地にBのための抵当権が設定された後、Cが甲土地をAから買い受けた場合において、CがBの請求に応じてBにその代価を弁済したときは、抵当権はCのために消滅する。","a":1,"e":"代価弁済（378条）。抵当権者の請求に応じて代価を払えば、第三取得者のために抵当権は消滅する。","m":"代価弁済＝請求に応じて払う"},{"f":"権利","t":"抵当権・担保","ref":"R04-04-2","s":"A所有の甲土地にBのための抵当権が設定・登記された後に、CがAから甲土地を賃借した場合、Cは、抵当権の実行による競売の買受人の買受けの時から6か月間は、甲土地の明渡しを猶予される。","a":0,"e":"6か月の明渡猶予は建物の賃借人（建物使用者）に限られ、土地には適用されない。","m":"猶予6か月は建物だけ"},{"f":"権利","t":"抵当権・担保","ref":"R04-04-3","s":"AがBのために甲土地に抵当権を設定し登記した後、甲土地上に建物が築造された場合、Bは、抵当権を実行するときは、甲土地とともに当該建物も競売しなければならない。","a":0,"e":"一括競売は「できる」にとどまり義務ではない。優先弁済も土地の代価に限られる。","m":"一括競売は任意"},{"f":"権利","t":"抵当権・担保","ref":"R04-04-4","s":"Aが所有する甲土地に、BのCに対する債務を担保するための抵当権が設定されている場合において、債務者Bが甲土地をAから買い受けたときは、Bは抵当権者Cに対して抵当権消滅請求をすることができる。","a":0,"e":"主たる債務者・保証人やその承継人は抵当権消滅請求をすることができない（380条）。","m":"債務者・保証人は消滅請求不可"},{"f":"権利","t":"抵当権・担保","ref":"H27-06-1","s":"AがBから賃借した土地の上に所有する乙建物について、Cのために抵当権を設定した場合、特段の事情がない限り、その抵当権の効力は乙建物の敷地の賃借権にも及ぶ。","a":1,"e":"借地権は建物の従たる権利として、建物抵当権の効力が及ぶ（判例）。","m":"建物抵当は借地権まで"},{"f":"権利","t":"抵当権・担保","ref":"H28-04-2","s":"AがBに対する債務を担保するため自己所有の甲土地に抵当権を設定した場合において、甲土地上のA所有の乙建物が火災で焼失したときは、Bは乙建物の火災保険金請求権に対しても物上代位をすることができる。","a":0,"e":"物上代位できるのは抵当目的物（土地）の価値代替物のみ。建物の保険金には及ばない。","m":"土地抵当で建物保険金×"},{"f":"権利","t":"抵当権・担保","ref":"H30-06-2","s":"Aが所有する更地の甲土地にBのための抵当権を設定し、その後Aが甲土地上に乙建物を建築した場合において、抵当権が実行されて甲土地をCが買い受けたときは、乙建物のために法定地上権は成立しない。","a":1,"e":"法定地上権は抵当権設定時に土地上に建物が存在することが要件。","m":"設定時に建物が必要"},{"f":"権利","t":"抵当権・担保","ref":"R03s-10-3","s":"Aが所有する甲建物にBのための抵当権設定登記がされた後に、CがAから甲建物を賃借した場合、抵当権が実行されてDが甲建物を買い受けたときでも、Cは賃貸借の期間が満了するまで甲建物をDに引き渡す必要はない。","a":0,"e":"登記後の賃借人は買受人に対抗できず、買受けから6か月の明渡猶予があるだけ。","m":"登記後賃借＝6か月猶予"},{"f":"権利","t":"抵当権・担保","ref":"H29-10-1","s":"AがBに対する貸金債権を担保するため、B所有の甲土地に抵当権の設定を受けた場合、設定行為に別段の定めがない限り、その抵当権によって貸金債権の利息は担保されない。","a":0,"e":"利息は満期となった最後の2年分について抵当権で担保される（375条）。","m":"利息は最後の2年分"},{"f":"権利","t":"債務不履行・解除","ref":"R02s-04-1","s":"AがBとの間で、Cが死亡した時に代金を支払う旨を約して甲土地を買い受けた場合、Cの死亡後にBから代金の支払を請求されたときは、AがCの死亡を知らなくても、Aはその請求を受けた時から履行遅滞の責任を負う。","a":1,"e":"期限到来後に請求を受けた時、または期限到来を知った時のいずれか早い時から遅滞となる（412条2項）。","m":"不確定期限は早い方"},{"f":"権利","t":"債務不履行・解除","ref":"R02s-04-2","s":"売主Aが買主Bに特定の中古建物を引き渡そうとしたところ、Bが正当な理由なくその受領を拒んだため、Aの履行の費用が増加した場合、その増加額はAとBが半額ずつ負担しなければならない。","a":0,"e":"受領遅滞による履行費用の増加額は債権者の負担となる（413条2項）。","m":"受領拒否の増加費用は債権者"},{"f":"権利","t":"債務不履行・解除","ref":"R02s-04-3","s":"売主Aが買主Bへの甲建物の引渡しを遅滞している間に、当事者双方の責めに帰することができない事由によって甲建物が滅失し履行不能となった場合、その履行不能はAの責めに帰すべき事由によるものとみなされる。","a":1,"e":"遅滞中の不能は債務者の責めに帰すべき事由によるものとみなされる（413条の2第1項）。","m":"遅滞中の不能は債務者の責任"},{"f":"権利","t":"債務不履行・解除","ref":"R02s-04-4","s":"AとBとの間で甲建物の売買契約が締結されたが、契約締結時に既に甲建物が滅失していて履行が不能であった場合でも、売主Aに帰責事由があるときは、買主BはAに対して損害賠償を請求することができる。","a":1,"e":"原始的不能でも契約は有効であり、債務不履行による損害賠償請求が可能（412条の2第2項）。","m":"原始的不能でも賠償可"},{"f":"権利","t":"債務不履行・解除","ref":"R06-05-4","s":"AがBとの間で、Cが死亡した時に代金を支払う旨を約して甲土地を買い受けた場合、Aは、Cの死亡を知った後にBから代金の支払を請求された時から、履行遅滞の責任を負う。","a":0,"e":"期限到来後に請求を受けた時か、到来を知った時のいずれか早い時から遅滞となる。","m":"知った時か請求時の早い方"},{"f":"権利","t":"債務不履行・解除","ref":"R02-03-2","s":"AB間で甲土地の売買契約が締結されたが、売主Aが甲土地の引渡債務を履行しない場合において、その不履行についてAに帰責事由がないときは、買主Bは売買契約を解除することができない。","a":0,"e":"改正民法では解除に債務者の帰責事由は不要。債権者に帰責事由がある場合に解除できない。","m":"解除に帰責事由は不要"},{"f":"権利","t":"債務不履行・解除","ref":"R02-03-3","s":"買主Bが売主Aに対し相当の期間を定めて履行を催告したが、その期間を経過した時における債務の不履行が、その契約及び取引上の社会通念に照らして軽微であるときは、Bは契約を解除することができない。","a":1,"e":"催告解除でも、不履行が軽微なときは解除できない（541条ただし書）。","m":"軽微なら催告しても×"},{"f":"権利","t":"債務不履行・解除","ref":"R02-03-4","s":"AとBとの間の売買契約において、売主Aがその債務の全部の履行を拒絶する意思を明確に表示したときは、買主Bは、Aに対して履行の催告をすることなく、直ちに契約を解除することができる。","a":1,"e":"履行拒絶の明確な表示は無催告解除事由（542条1項2号）。","m":"明確な拒絶は即解除"},{"f":"権利","t":"債務不履行・解除","ref":"R06-04-1","s":"AがBに甲土地を売却して代金を受領した後に死亡し、Aの相続人CがBへの甲土地の引渡しを明確に拒絶した場合であっても、Bは、相当の期間を定めて履行を催告しなければ、売買契約を解除することができない。","a":0,"e":"債務全部の履行拒絶の意思を明確に表示した場合は、催告なしで解除できる。","m":"明確な拒絶は即解除"},{"f":"権利","t":"売買・契約不適合","ref":"R03-07-1","s":"AがBに中古自動車を売却して引き渡した後、そのエンジンに契約の内容に適合しない不具合があることが判明した場合、Bは、Aに対して、エンジンの修理による履行の追完を請求することができる。","a":1,"e":"買主は目的物の修補などの履行の追完を請求できる（562条）。","m":"不適合なら追完請求"},{"f":"権利","t":"売買・契約不適合","ref":"R03-07-2","s":"AがBに売却して引き渡した目的物に契約の内容に適合しない点があり、その修補も代替物の引渡しもできず履行の追完が不能である場合、Bは、Aに対して催告をすることなく、直ちに代金の減額を請求することができる。","a":1,"e":"履行の追完（修補・代替物引渡し等）が不能なときは、催告なしで直ちに代金減額請求できる（563条2項1号）。","m":"追完不能は無催告減額"},{"f":"権利","t":"売買・契約不適合","ref":"R03-07-3","s":"AがBに売却して引き渡した中古建物に契約の内容に適合しない不具合があった場合、その修理が可能であるか否かにかかわらず、Bは、Aに対して催告をすることなく、直ちに売買契約を解除することができる。","a":0,"e":"追完可能なら原則として催告が必要。無催告解除は追完不能などの場合に限られる。","m":"修補可能なら催告必要"},{"f":"権利","t":"売買・契約不適合","ref":"R03-07-4","s":"AがBに甲土地を売却した後、第三者Cが甲土地について権利を主張したため、Bが買い受けた権利の全部又は一部を失うおそれがある場合には、Aが相当の担保を供しない限り、Bは代金の支払を拒むことができる。","a":1,"e":"権利を取得できない・失うおそれがあるときは、その危険の程度に応じて支払を拒絶できる（576条）。","m":"失うおそれ＝支払拒絶"},{"f":"権利","t":"売買・契約不適合","ref":"R02s-07-1","s":"AがBに甲土地を売却したところ、実際の面積が契約で定めた面積よりも不足していた場合、Bは、その不足を知った時から1年以内にその旨をAに通知しなければ、代金の減額を請求することができない。","a":0,"e":"1年以内通知の期間制限は種類・品質の不適合のみ。数量不足には適用されない。","m":"数量不足に通知期限なし"},{"f":"権利","t":"売買・契約不適合","ref":"R01-03-1","s":"AB間の建物の売買契約において、売主Aが担保責任を負う期間を短縮する特約をした場合でも、Aが契約の内容に適合しないことを知りながらBに告げなかった事実については、Aはその責任を免れることができない。","a":1,"e":"売主が知りながら告げなかった事実については、免責・制限特約があっても責任を免れない（572条）。","m":"知って黙れば特約無効"},{"f":"権利","t":"売買・契約不適合","ref":"R01-03-2","s":"AがBに売却した建物の主要構造部分に契約の内容に適合しない欠陥があった場合であっても、その欠陥によって契約をした目的を達成することができないときでなければ、Bは売買契約を解除することができない。","a":0,"e":"不適合が軽微でなければ解除できる。契約目的達成不能は無催告解除の要件にすぎない。","m":"軽微でなければ解除可"},{"f":"権利","t":"売買・契約不適合","ref":"R03s-04-2","s":"AがBに甲土地を売却する際に、Aが買い戻すことができる旨の買戻しの特約をしたが、買戻しの期間を定めなかった場合には、その買戻しの特約は無効となる。","a":0,"e":"期間の定めがなければ5年以内に買戻しをしなければならない（580条3項）。特約は有効。","m":"期間なし＝5年以内"},{"f":"権利","t":"売買・契約不適合","ref":"H29-05-2","s":"宅地建物取引業者Cの媒介により、AがBに中古建物を売却した場合において、その建物に契約の内容に適合しない不具合があるときは、Bは、売主Aだけでなく、媒介業者Cに対しても担保責任を追及することができる。","a":0,"e":"契約不適合責任を負うのは売主のみ。媒介業者は担保責任を負わない。","m":"担保責任は売主だけ"},{"f":"権利","t":"保証・連帯債務","ref":"R02-07-1","s":"AがBに特定の中古建物を売却し、Cが売主Aの債務を保証した場合において、Aの債務不履行により売買契約が解除されたときは、特段の意思表示がない限り、Cは、Aが負う代金の返還義務についても保証の責任を負う。","a":1,"e":"特段の意思表示がない限り、解除による原状回復義務にも保証は及ぶ（判例）。","m":"原状回復も保証範囲"},{"f":"権利","t":"保証・連帯債務","ref":"R02-07-2","s":"AのBに対する債務についてCが保証人となった後に、AとBとの合意によって主たる債務の目的又は態様が加重された場合には、保証人Cの負担もそれに応じて加重される。","a":0,"e":"保証契約後の主債務の加重は保証人に及ばない（448条2項）。","m":"後の加重は保証人に無関係"},{"f":"権利","t":"保証・連帯債務","ref":"R02-02-2","s":"Aが所有する居住用建物をBに賃貸するにあたり、個人Cが、賃借人Bの負担する一切の債務を保証する根保証契約をAと締結する場合、極度額を定めなくても、その保証契約は有効である。","a":0,"e":"個人根保証契約は極度額を定めなければ効力を生じない（465条の2）。","m":"個人根保証は極度額必須"},{"f":"権利","t":"保証・連帯債務","ref":"R07-02-2","s":"BがAから金銭を借り入れ、CがBの貸金債務について連帯保証人となった場合において、CがAから保証債務の履行を請求されたときは、Cは、まず主たる債務者Bに請求するよう主張することができる。","a":0,"e":"連帯保証人には催告の抗弁権・検索の抗弁権がない（454条）。","m":"連帯保証は抗弁なし"},{"f":"権利","t":"保証・連帯債務","ref":"R02-02-4","s":"A社が事業資金をB銀行から借り入れるにあたり、A社の取引先である個人Cがその貸金債務の保証人となる場合、その保証契約は、原則として、締結前1か月以内に作成された公正証書でCが保証債務を履行する意思を表示していなければ、効力を生じない。","a":1,"e":"事業のための貸金等債務の個人保証は、事前1か月以内の公正証書が必要（465条の6）。","m":"事業貸金保証は公正証書"},{"f":"権利","t":"保証・連帯債務","ref":"R07-09-2","s":"A、B及びCが債権者Dに対して連帯債務を負っている場合において、AがDを相続したことによりAとDとの間に混同が生じたときでも、その効力は他の連帯債務者であるB及びCには及ばない。","a":0,"e":"混同は絶対効。他の連帯債務者にも効力が生じ、弁済したものとみなされる（440条）。","m":"混同・更改・相殺は絶対効"},{"f":"権利","t":"保証・連帯債務","ref":"R03-02-2","s":"A、B及びCがDに対して連帯債務を負い、BがDに対して反対債権を有している場合において、Bが相殺を援用しない間は、Cは、Bの有するその反対債権を用いて相殺をすることができる。","a":0,"e":"他の連帯債務者はBの負担部分の限度で履行を拒めるだけで、相殺の意思表示はできない。","m":"他人の債権は履行拒絶のみ"},{"f":"権利","t":"保証・連帯債務","ref":"R03-02-4","s":"A、B及びCがDに対して連帯債務を負っている場合において、AとDとの間で更改があったときは、Dの債権は、すべての連帯債務者の利益のために消滅する。","a":1,"e":"更改は絶対効であり、他の連帯債務者のためにも債権が消滅する（438条）。","m":"更改は絶対効"},{"f":"権利","t":"保証・連帯債務","ref":"H29-08-4","s":"A及びBがCに対して1,000万円の連帯債務を負い、その負担部分が平等である場合において、Aが自己の負担部分以下である300万円を弁済したときは、AはBに対して求償することができない。","a":0,"e":"弁済額が負担部分を超えなくても、各自の負担部分の割合に応じて求償できる（442条）。","m":"負担部分以下でも求償可"},{"f":"権利","t":"不法行為・請負・委任","ref":"R02s-01-1","s":"建築士Aが設計し、建設会社Bが施工した建物に、建物としての基本的な安全性を損なう瑕疵がある場合、A及びBは、自らと契約関係にない居住者に対しても、不法行為による損害賠償責任を負うことがある。","a":1,"e":"基本的な安全性を損なう瑕疵については、契約関係にない居住者等に不法行為責任を負う（判例）。","m":"安全性欠如は第三者にも"},{"f":"権利","t":"不法行為・請負・委任","ref":"R02s-01-2","s":"A社の従業員Bが、A社の事業の執行について第三者Cに損害を加え、BがCに対してその損害を賠償した場合、Bは、損害の公平な分担という見地から相当と認められる額について、A社に求償することができる。","a":1,"e":"損害の公平な分担の見地から相当な額について、被用者から使用者への逆求償が認められる（判例）。","m":"逆求償もできる"},{"f":"権利","t":"不法行為・請負・委任","ref":"R03-08-1","s":"Aが所有する甲建物をBが賃借して占有している場合において、甲建物の保存の瑕疵によって通行人Cに損害が生じたときは、Bは、損害の発生を防止するのに必要な注意を怠っていたとしても、Cに対して工作物責任を負わない。","a":0,"e":"占有者は必要な注意を怠れば第一次的に責任を負う。注意を尽くした場合に所有者が無過失責任を負う。","m":"占有者は注意で免責"},{"f":"権利","t":"不法行為・請負・委任","ref":"R03-08-2","s":"Aが所有しBが賃借する甲建物の保存に瑕疵があり、それによって通行人Cが負傷した場合において、Bが損害の発生を防止するのに必要な注意をしていたときは、Aは、自らも必要な注意をしていたとしても、Cに対して損害賠償責任を負う。","a":1,"e":"所有者の工作物責任は無過失責任（717条1項ただし書）。","m":"所有者は無過失責任"},{"f":"権利","t":"不法行為・請負・委任","ref":"R02s-01-4","s":"Aの不法行為によってBが身体を害された場合、Bの損害賠償請求権は、Bが損害及び加害者を知った時から5年間行使しないときは、時効によって消滅する。","a":1,"e":"生命・身体侵害の場合は主観的起算点から5年（724条の2）。客観的起算点からは20年。","m":"生命身体は5年／20年"},{"f":"権利","t":"不法行為・請負・委任","ref":"R05-03-2","s":"AがBに建物の建築を請け負わせ、完成した建物に契約の内容に適合しない欠陥があった場合、Aは、工事の終了から1年以内にその旨をBに通知しなければ、Bに対して修補を請求することができない。","a":0,"e":"通知期間は注文者が不適合を知った時から1年以内（637条）。工事終了時からではない。","m":"知った時から1年"},{"f":"権利","t":"不法行為・請負・委任","ref":"R01-08-4","s":"AがBに住宅の建築を請け負わせた場合において、Bが仕事を完成しない間は、Aは、いつでも、Bに生じる損害を賠償して請負契約を解除することができる。","a":1,"e":"注文者は仕事完成前ならいつでも損害を賠償して解除できる（641条）。","m":"完成前は注文者解除可"},{"f":"権利","t":"不法行為・請負・委任","ref":"R02-05-2","s":"AがBに対して、A所有の甲土地の売却に関する事務を委任した場合、受任者Bは、自己の財産に対するのと同一の注意をもって委任事務を処理すれば足りる。","a":0,"e":"受任者は有償・無償を問わず善良な管理者の注意義務を負う（644条）。","m":"受任者は善管注意"},{"f":"権利","t":"不法行為・請負・委任","ref":"R02-05-3","s":"AがBに報酬を支払う約束で事務の処理を委任したが、Bの責めに帰すべき事由によって委任が履行の中途で終了した場合、Bは、Aに対して報酬を一切請求することができない。","a":0,"e":"履行の中途で終了したときは、既にした履行の割合に応じて報酬を請求できる（648条3項）。","m":"途中終了は割合報酬"},{"f":"権利","t":"賃貸借","ref":"R05-09-1","s":"Aが所有する甲建物をBに賃貸している場合において、Aが甲建物の修繕が必要であることを知ったにもかかわらず、相当の期間内に必要な修繕をしないときは、Bは自ら甲建物の修繕をすることができる。","a":1,"e":"賃貸人が修繕の必要を知ったのに相当期間内に修繕しないとき、賃借人は自ら修繕できる（民法607条の2）。","m":"知って放置なら借主が修繕"},{"f":"権利","t":"賃貸借","ref":"R05-09-2","s":"Aが所有する甲建物をBに賃貸している場合において、Bが修繕の必要がある旨をAに通知したにもかかわらず、Aが直ちに修繕をしないときは、Bは自ら甲建物の修繕をすることができる。","a":0,"e":"要件は「直ちに」ではなく、通知後「相当の期間内」に修繕しないことである（急迫の事情がある場合は別）。","m":"直ちにではなく相当期間"},{"f":"権利","t":"賃貸借","ref":"R05-09-3","s":"Aが所有する甲建物をBに賃貸している場合において、賃借人Bの責めに帰すべき事由によって甲建物の修繕が必要となったときは、賃貸人Aは、その修繕をする義務を負わない。","a":1,"e":"賃借人の帰責事由による修繕の必要については、賃貸人の修繕義務が除外される（民法606条1項ただし書）。","m":"借主のせいなら貸主修繕不要"},{"f":"権利","t":"賃貸借","ref":"R04-06-4","s":"Aが所有する甲建物をBに賃貸していたところ、Bが契約で定めた用法に違反して使用したことによりAに損害が生じた場合、Aは、甲建物の返還を受けた時から5年以内に損害賠償を請求しなければならない。","a":0,"e":"用法違反による損害賠償は、貸主が返還を受けた時から1年以内に請求しなければならない（民法622条・600条）。","m":"用法違反の賠償は返還後1年"},{"f":"権利","t":"賃貸借","ref":"R04-06-2","s":"AがBに対して甲建物を無償で貸し渡した場合、借主Bは、Aの承諾を得なくても、甲建物を第三者Cに適法に転貸することができる。","a":0,"e":"使用貸借でも、借主は貸主の承諾なしに第三者に使用収益させることはできない（民法594条2項）。","m":"使用貸借も無断転貸不可"},{"f":"権利","t":"賃貸借","ref":"R02-04-3","s":"Aが所有する甲建物をBに賃貸し、BがAに敷金を交付していた場合において、賃貸借契約が終了し、Bから敷金の返還を求められたときは、Aは、甲建物の返還を受けるまで敷金の返還を拒むことができる。","a":1,"e":"敷金返還債務は賃貸物の返還を受けたときに生じ、明渡しが先履行となるため、返還まで拒める（民法622条の2）。","m":"明渡しが先、敷金は後"},{"f":"権利","t":"賃貸借","ref":"R02-04-4","s":"Aが所有する甲建物をBに賃貸し、BがAに敷金を交付している場合、Bは、賃貸借の継続中に、Aに対して、その敷金を未払賃料の弁済に充てるよう請求することができる。","a":0,"e":"敷金を債務の弁済に充てることができるのは賃貸人であり、賃借人から充当を請求することはできない（民法622条の2第2項）。","m":"敷金充当は貸主だけの権利"},{"f":"権利","t":"賃貸借","ref":"R02s-06-1","s":"Aが所有する甲建物をBに賃貸し、BがAの承諾を得て甲建物をCに転貸している場合において、AB間の賃貸借を合意解除したときは、その当時AがBの債務不履行による解除権を有していたとしても、Aはその解除をCに対抗することができない。","a":0,"e":"合意解除は原則として転借人に対抗できないが、解除当時に債務不履行による解除権を有していたときは対抗できる（民法613条3項）。","m":"合意解除も解除権あれば対抗可"},{"f":"権利","t":"賃貸借","ref":"R02s-06-4","s":"Aが所有する甲建物をBに賃貸し、BがAの承諾を得て甲建物をCに転貸している場合、Cは、Bの賃料債務の範囲でAに対して直接履行する義務を負い、Bに対する賃料の前払いをもってAに対抗することができない。","a":1,"e":"転借人は賃貸人に直接義務を負い、賃料の前払いをもって賃貸人に対抗することができない（民法613条1項）。","m":"転借人の前払いは対抗不可"},{"f":"権利","t":"借地","ref":"R06-11-3","s":"AがBとの間で、Bが建物を所有する目的で甲土地の賃貸借契約を締結した場合において、存続期間を定めなかったときは、借地権の存続期間は30年となる。","a":1,"e":"借地権の存続期間は30年であり、期間の定めがなければ30年となる（借地借家法3条）。","m":"定めなき借地は30年"},{"f":"権利","t":"借地","ref":"R06-11-4","s":"AがBに建物所有目的で甲土地を賃貸している場合において、借地契約を最初に更新する際に更新後の期間を定めなかったときは、更新後の存続期間は更新の日から10年となる。","a":0,"e":"最初の更新後の期間は更新の日から20年（2回目以降は10年）となる（借地借家法4条）。","m":"更新1回目20年・以降10年"},{"f":"権利","t":"借地","ref":"R04-11-3","s":"AがBに建物所有目的で甲土地を賃貸している場合において、借地上の建物が滅失した後の再築に関し、借地権の残存期間を超えて存続する建物を築造しない旨の特約をしたときは、その特約は無効である。","a":1,"e":"借地権者に不利な特約として無効となる（借地借家法9条・7条）。","m":"借地人に不利な特約は無効"},{"f":"権利","t":"借地","ref":"R04-11-4","s":"Bが借地上に所有する乙建物について、借地権の存続期間満了後に地主Aに対して建物買取請求権を行使した場合、Bは代金の支払を受けるまで乙建物の引渡しを拒むことができ、その間の敷地の賃料相当額もAに支払う必要はない。","a":0,"e":"引渡しは拒めるが、その間の敷地占有による賃料相当額は不当利得として返還しなければならない（判例）。","m":"留置OKでも地代相当額は払う"},{"f":"権利","t":"借地","ref":"R07-11-1","s":"AがBに建物所有目的で甲土地を賃貸し、Bが甲土地上に乙建物を所有している場合、乙建物についてBの配偶者名義で所有権の登記をしていても、Bは甲土地の借地権を第三者に対抗することができる。","a":0,"e":"借地権の対抗要件となる建物登記は借地権者本人名義でなければならず、家族名義では対抗できない（判例）。","m":"建物登記は借地人本人名義"},{"f":"権利","t":"借地","ref":"R07-11-3","s":"AがBとの間で、Bの事業の用に供する建物を所有する目的で、存続期間を50年とする甲土地の借地契約を締結する場合、契約の更新及び建物の築造による存続期間の延長がなく、建物買取請求をしない旨を書面で定めることができる。","a":1,"e":"存続期間50年以上なら、書面により一般定期借地権として3つの特約を定めることができる（借地借家法22条）。","m":"50年以上は一般定期借地OK"},{"f":"権利","t":"借地","ref":"R03s-11-3","s":"Bが、Aから借りた甲土地の上に所有する乙建物について登記をしている場合において、Bが借地権を第三者に対抗することができるのは、乙建物の登記に敷地として表示された土地に限られる。","a":1,"e":"建物登記による対抗力は、登記に所在地番として記載された土地にのみ及ぶ（判例）。","m":"対抗力は登記記載の土地のみ"},{"f":"権利","t":"借地","ref":"R03s-11-4","s":"AがBに建物所有目的で甲土地を賃貸している場合、Aは、弁済期が到来した最後の3年分の地代について、Bが甲土地上に所有する建物の上に先取特権を有する。","a":0,"e":"先取特権の対象は弁済期の到来した最後の2年分の地代等である（借地借家法12条）。","m":"地代の先取特権は2年分"},{"f":"権利","t":"借地","ref":"R05-11-1","s":"AがBのために普通借地権を設定する契約において、「当初10年間は地代を減額しない」旨の特約を定めた場合には、その期間内は、Bは、Aに対して地代の減額を請求することができない。","a":0,"e":"地代を増額しない特約は有効だが、減額しない特約は無効であり、減額請求できる（借地借家法11条1項）。","m":"借地は不増額特約のみ有効"},{"f":"権利","t":"借家","ref":"R06-12-1","s":"Aが所有する甲建物をBに賃貸して引き渡した後、Aが甲建物をCに売却した場合、AB間の賃貸借が普通建物賃貸借であればBは賃借権をCに対抗できるが、定期建物賃貸借であれば対抗することができない。","a":0,"e":"引渡しによる対抗力は普通借家・定期借家のいずれにも認められる（借地借家法31条）。","m":"引渡しで定期も普通も対抗可"},{"f":"権利","t":"借家","ref":"R06-12-2","s":"Aが所有する甲建物をBに賃貸する契約において、賃料を改定しない旨の特約を定めた場合であっても、その契約が定期建物賃貸借、普通建物賃貸借のいずれであるかを問わず、Bは借賃の減額を請求することができる。","a":0,"e":"定期借家では賃料改定特約があれば借賃増減請求権の規定は適用されず、減額請求できない（借地借家法38条9項）。","m":"定期借家は改定特約が優先"},{"f":"権利","t":"借家","ref":"R06-12-3","s":"Aが所有する居住用の甲建物をBが賃借し、BがCと事実上の夫婦として同居していた場合において、Bが相続人なく死亡したときは、定期建物賃貸借か普通建物賃貸借かを問わず、Cは賃借人の権利義務を承継する。","a":1,"e":"居住用建物では、相続人がいなければ同居の内縁配偶者等が権利義務を承継する（借地借家法36条）。反対の意思表示も可。","m":"相続人なしなら内縁が承継"},{"f":"権利","t":"借家","ref":"R06-12-4","s":"AがBとの間で甲建物について定期建物賃貸借契約を締結し、契約の更新がない旨を定める場合には、その契約は公正証書によってしなければならない。","a":0,"e":"公正証書に限らず、書面（電磁的記録含む）で契約すれば足りる（借地借家法38条1項）。","m":"定期借家は書面で足りる"},{"f":"権利","t":"借家","ref":"R04-12-3","s":"AがBに対して床面積200㎡未満の居住用建物を定期建物賃貸借により賃貸した場合において、転勤等のやむを得ない事情により建物の使用が困難となったときは、Bは中途解約の申入れをすることができる。","a":1,"e":"やむを得ない事情で使用困難となれば解約申入れができ、申入れから1か月で終了する（借地借家法38条7項）。","m":"200㎡未満居住用は中途解約可"},{"f":"権利","t":"借家","ref":"R07-12-3","s":"Aが所有する甲建物をBに賃貸する契約において、BがAの同意を得て甲建物に付加した造作について、Bが造作買取請求権を行使しない旨の特約を定めた場合、その特約は有効である。","a":1,"e":"造作買取請求権の規定は任意規定であり、排除特約は有効（借地借家法37条で強行規定から除外）。","m":"造作買取は特約で排除OK"},{"f":"権利","t":"借家","ref":"R07-12-4","s":"法令により一定の期間を経過した後に取り壊すことが明らかな建物をAがBに賃貸する場合において、建物を取り壊すこととなる時に賃貸借が終了する旨の特約を定めるときは、その特約は公正証書によってしなければならない。","a":0,"e":"取壊し事由を記載した書面（電磁的記録含む）で足り、公正証書である必要はない（借地借家法39条）。","m":"取壊し予定特約は書面で可"},{"f":"権利","t":"借家","ref":"R03-12-1","s":"Aが所有する甲建物をBに期間の定めなく賃貸している場合において、Aが解約の申入れをしたときは、その賃貸借は、解約の申入れの日から3か月を経過することによって終了する。","a":0,"e":"賃貸人からの解約申入れは正当事由を要し、申入れから6か月経過で終了する（借地借家法27条・28条）。","m":"貸主の解約申入れは6か月"},{"f":"権利","t":"借家","ref":"R03-12-2","s":"Aが所有する甲建物をBに賃貸して引き渡し、BがAに敷金を交付していた場合において、Aが甲建物をCに売却したときは、敷金はBの未払賃料に充当され、その残額がCに承継される。","a":1,"e":"賃貸人の地位がCに移転し、敷金は未払賃料等に充当された残額が承継される（判例、民法605条の2）。","m":"敷金は充当後の残額が承継"},{"f":"権利","t":"区分所有法","ref":"R07-13-1","s":"区分所有建物の共用部分は、原則として区分所有者全員の共有に属するが、規約で特別の定めをすれば、管理者を共用部分の所有者とすることもできる。","a":1,"e":"規約に特別の定めがあれば管理者を共用部分の所有者とすること（管理所有）ができる（区分所有法11条2項・27条）。","m":"規約で管理者の管理所有可"},{"f":"権利","t":"区分所有法","ref":"R07-13-3","s":"区分所有建物の集会の議事録が書面で作成されているときは、議長及び集会に出席した区分所有者の全員が、その議事録に署名しなければならない。","a":0,"e":"署名は議長及び集会に出席した区分所有者の2人で足りる（区分所有法42条3項）。","m":"議事録署名は議長＋2人"},{"f":"権利","t":"区分所有法","ref":"R06-13-1","s":"Aマンションの共用部分を区分所有者全員で共有している場合において、共用部分に対する各共有者の持分は、規約に別段の定めがない限り、共有者の数に応じて等しい割合となる。","a":0,"e":"持分は規約に別段の定めがない限り専有部分の床面積の割合による（区分所有法14条1項）。","m":"持分は床面積割合"},{"f":"権利","t":"区分所有法","ref":"R06-13-2","s":"区分所有者Aが専有部分をBに売却した場合、その区分所有建物の規約及び集会の決議は、特定承継人であるBに対しても効力を生ずる。","a":1,"e":"規約・集会決議は特定承継人（買主など）にも効力が及ぶ（区分所有法46条1項）。","m":"規約・決議は買主にも及ぶ"},{"f":"権利","t":"区分所有法","ref":"R05-13-2","s":"区分所有建物において集会を開こうとする場合、区分所有者の4分の3以上の同意があるときは、管理者は、会日の通知など招集の手続を経ないで集会を開くことができる。","a":0,"e":"招集手続の省略には区分所有者全員の同意が必要である（区分所有法36条）。","m":"招集省略は全員同意"},{"f":"権利","t":"区分所有法","ref":"R05-13-3","s":"区分所有建物の共用部分について、その保存行為は、規約に別段の定めがない限り、集会の決議を経ることなく各共有者がすることができる。","a":1,"e":"保存行為は各共有者が単独ですることができる（区分所有法18条1項ただし書）。","m":"保存行為は各自単独で"},{"f":"権利","t":"区分所有法","ref":"R04-13-1","s":"区分所有建物の管理者が、規約により、その職務に関して区分所有者のために原告となって訴えを提起したときは、管理者は、各区分所有者にその旨を通知する必要はない。","a":0,"e":"規約により原告・被告となったときは、遅滞なく区分所有者に通知しなければならない（区分所有法26条5項）。","m":"規約で訴訟したら通知必要"},{"f":"権利","t":"区分所有法","ref":"R04-13-2","s":"区分所有建物に管理者がないときは、区分所有者の5分の1以上で議決権の5分の1以上を有するものが集会を招集することができ、この定数は規約で減ずることができる。","a":1,"e":"管理者がないときは5分の1以上の者が招集でき、その定数は規約で減ずることができる（区分所有法34条5項）。","m":"管理者不在は1/5で招集"},{"f":"権利","t":"区分所有法","ref":"R03s-13-2","s":"新築マンションの分譲業者Aのように、最初に建物の専有部分の全部を所有する者は、公正証書により、廊下や階段室などの法定共用部分を共用部分とする旨の規約を設定することができる。","a":0,"e":"公正証書で設定できるのは規約共用部分などに関する規約であり、法定共用部分を定める規約は設定できない（区分所有法32条）。","m":"公正証書規約に法定共用部分なし"},{"f":"権利","t":"区分所有法","ref":"R02-13-2","s":"Aマンションの共用部分を区分所有者全員で共有している場合において、共用部分の管理に要する費用は、規約に別段の定めがない限り、各共有者が等しい割合で負担する。","a":0,"e":"各共有者は規約に別段の定めがない限り、その持分に応じて負担する（区分所有法19条）。","m":"管理費は持分に応じて"},{"f":"権利","t":"不動産登記法","ref":"R07-14-1","s":"Aが所有する一筆の甲土地の一部が別の地目となった場合であっても、登記官は、職権で甲土地について分筆の登記をすることはできない。","a":0,"e":"一部が別地目となったときは、登記官は職権で分筆の登記をしなければならない（不動産登記法39条2項）。","m":"一部別地目は職権分筆"},{"f":"権利","t":"不動産登記法","ref":"R07-14-4","s":"Aが所有する甲建物と乙建物とを一個の建物とするための建物の合併の登記は、表題部所有者又は所有権の登記名義人以外の者は申請することができない。","a":1,"e":"建物の合併の登記の申請人は表題部所有者又は所有権の登記名義人に限られる（不動産登記法54条1項）。","m":"合併登記は所有者のみ申請"},{"f":"権利","t":"不動産登記法","ref":"R06-14-1","s":"AがBに甲土地を売却する際に買戻しの特約をし、その旨の登記がされた場合において、売買契約の日から10年を経過したときは、登記権利者は、単独で当該買戻しの特約の登記の抹消を申請することができる。","a":1,"e":"契約日から10年経過した買戻し特約の登記は、登記権利者が単独で抹消申請できる（不動産登記法69条の2）。","m":"買戻し登記は10年で単独抹消"},{"f":"権利","t":"不動産登記法","ref":"R06-14-3","s":"Aが自己所有の甲土地を相続人ではないBに遺贈した場合、Aの死亡後、甲土地についての遺贈による所有権移転の登記は、受遺者Bが単独で申請することができる。","a":0,"e":"単独申請できるのは相続人に対する遺贈の場合であり、相続人以外への遺贈は共同申請が原則（不動産登記法63条3項）。","m":"単独申請は相続人への遺贈のみ"},{"f":"権利","t":"不動産登記法","ref":"R05-14-1","s":"Aが所有権の登記名義人である甲建物が火災により滅失したときは、Aは、滅失の日から1か月以内に、甲建物の滅失の登記を申請

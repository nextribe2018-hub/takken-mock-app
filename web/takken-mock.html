は受領時から利息を付す","物は果実・使用利益も返還","解除しても損害賠償請求できる","当事者複数なら全員から又は全員に"]}],"flow":{"title":"解除から原状回復まで","steps":["債務不履行の発生（債権者の帰責事由なし）","無催告解除事由か（全部不能・明確な拒絶等）","該当しなければ相当期間を定めて催告","期間経過時の不履行が軽微でないか","解除の意思表示（撤回不可）","原状回復：金銭は受領時から利息を付す","解除前の第三者は登記があれば保護"]},"tables":[{"title":"履行遅滞となる時期","head":["期限","遅滞の時期"],"rows":[["確定期限","期限到来時"],["不確定期限","請求時か知った時の早い方"],["期限の定めなし","請求を受けた時"],["不法行為の損害賠償","不法行為時（請求不要）"]]},{"title":"損害賠償と解除の要件","head":["項目","損害賠償","解除"],"rows":[["債務者の帰責事由","必要","不要"],["債権者の帰責事由","過失相殺","解除不可"],["催告","不要","原則必要"],["軽微な不履行","請求可","催告解除不可"],["原始的不能","請求可","無催告で可"]]},{"title":"無催告解除できる場合","head":["事由","解除"],"rows":[["債務の全部が履行不能","○ 全部"],["全部の履行拒絶を明確に表示","○ 全部"],["定期行為で時期を経過","○ 全部"],["一部不能・一部拒絶で目的不達","○ 全部"],["一部不能・一部拒絶","○ その一部"]]}]},"ex":[{"t":"不確定期限の遅滞","s":"Aは「Cが死亡した時に代金を支払う」約束でBから甲土地を買った。Cは5月10日に死亡し、Bは6月1日にAへ代金を請求した。AがCの死亡を知ったのは6月10日だった。","p":"不確定期限の債務は、期限到来後に請求を受けた時と到来を知った時のいずれか早い時から遅滞となるので、Aは6月1日から遅滞の責任を負う（412条2項）。Aが5月15日に死亡を知っていれば、請求がなくても5月15日から遅滞となる。","kw":["不確定期限","履行遅滞","請求を受けた時","知った時","いずれか早い時"]},{"t":"双方無責の滅失","s":"AはBに乙建物を3,000万円で売り、引渡しは9月1日の約束だった。8月20日、隣家からの延焼で乙建物が全焼した。A・Bどちらにも落ち度はなかった。","p":"履行不能なので、Bは催告なしに契約を解除でき（542条1項1号）、債務者Aの帰責事由は不要。解除しなくても代金の支払を拒める（536条1項）。ただしAに帰責事由がないので損害賠償は請求できない。Aが引渡しを遅滞している間の延焼なら、Aの帰責事由とみなされ損害賠償も請求できる。","kw":["履行不能","帰責事由","催告なしに解除","反対給付の履行を拒む","損害賠償"]},{"t":"解除後の原状回復","s":"AはBに甲土地を4,000万円で売り、4月1日に内金1,000万円を受け取って引渡しと移転登記を済ませた。Bは残代金を払わず、Aは相当期間を定めて催告した後に契約を解除した。解除前にBは甲土地をCに転売し、Cが登記を備えていた。","p":"Aは受け取った1,000万円に受領時からの利息を付けて返し、Bは甲土地を返す義務を負い、両者は同時履行の関係に立つ（545条・546条）。ただし解除前に登記を備えたCは、善意・悪意を問わず保護され、Aは甲土地の返還をCに求められない。","kw":["原状回復","利息","受領の時","同時履行","解除前の第三者"]}],"around":[{"h":"賠償と解除の要件差","b":"損害賠償には債務者の帰責事由が必要だが、解除には不要。不履行が債権者の帰責事由によるときは解除できず、代金の支払も拒めない。"},{"h":"金銭債務の特則","b":"金銭債務の不履行は不可抗力でも免責されず、債権者は損害の証明も不要。約定がなければ法定利率で賠償額を計算し、法定利率は2026年4月から2029年3月までも年3%に据え置かれた。"},{"h":"受領遅滞","b":"債権者が受領を拒んだため増えた履行費用は債権者の負担となる。受領遅滞中に双方無責の事由で履行不能になったときは、債権者の帰責事由によるものとみなされる（413条の2第2項）。"},{"h":"手付解除との違い","b":"手付解除は債務不履行がなくても、相手方が履行に着手するまで、買主は手付を放棄し、売主は倍額を現実に提供して解除できる（557条）。債務不履行解除と違い損害賠償は請求できない。"},{"h":"解除の意思表示","b":"解除は相手方への意思表示で行い、撤回できない。当事者の一方が複数いるときは、全員から又は全員に対してしなければならない（544条）。"}],"cases":[{"n":"最判昭和36年11月21日","f":"AはBに土地を売り、代金のほか、引渡しまでの固定資産税等をBが負担する約束をした。Bは代金は支払ったが固定資産税相当額を支払わなかったので、Aは契約を解除しようとした。","h":"契約の要素をなす債務の履行がなく契約目的を達成できない場合に解除を認める趣旨であるから、契約目的の達成に必須でない附随的義務を怠ったにすぎない場合は、特段の事情がない限り解除できない。","pt":"令和2年（10月）試験で判決文問題として出題。現行法では「不履行が軽微なときは催告解除できない」（541条ただし書）に受け継がれている。","kw":["附随的義務","要素たる債務","契約の目的","解除","軽微"]},{"n":"最判昭和43年2月23日","f":"AはBに土地を売り、代金完済までBは土地上に建物等を築造しないという特約を付けた。Bがこの特約に違反して建物を建て始めたので、Aは契約を解除した。","h":"その特約が売買代金の完全な支払確保のために重要な意義を持ち、契約締結の目的に必要不可欠な場合は、付随的な約款であっても契約の要素たる債務に入り、その不履行を理由に解除できる。","pt":"付随的義務の違反でも、契約目的の達成に不可欠なものなら解除できる。昭和36年判決（附随的義務なら解除不可）とセットで、「付随的な約款の不履行では一切解除できない」と出たら×。","kw":["特約","付随的な約款","要素たる債務","契約の目的","解除"]},{"n":"最判平成8年11月12日","f":"BはAからリゾートマンションの1室を買い、同時にAが経営するスポーツクラブの会員権契約も結んだ。会員権契約で約束された屋内プールが期日までに完成しなかったので、Bはマンションの売買契約も解除しようとした。","h":"同一当事者間の複数の契約でも、目的が相互に密接に関連し、いずれかが履行されるだけでは契約を締結した目的が全体として達成されないと社会通念上認められる場合は、一方の契約の債務不履行を理由に他方の契約も解除できる。","pt":"「会員権契約の不履行を理由に、別個の契約である売買契約まで解除することはできない」と出たら×。","kw":["複数の契約","密接に関連","スポーツクラブ会員権","リゾートマンション","解除"]},{"n":"大判大正10年5月17日","f":"AはBに土地を売って引き渡し、Bはその土地をCに転売した。その後Bが代金を支払わないので、Aは契約を解除した。Cはまだ所有権移転登記を受けていなかった。","h":"解除前に利害関係を持った第三者が545条1項ただし書で保護されるには、登記などの対抗要件を備えている必要がある。","pt":"解除前の第三者は善意・悪意を問わず保護されるが登記が必要。詐欺取消しの第三者（善意無過失が必要、登記不要が判例）との違いが狙われる。","kw":["解除前の第三者","545条1項ただし書","登記","対抗要件","善意・悪意を問わない"]},{"n":"最判昭和35年11月29日","f":"AはBに土地を売り移転登記をしたが、Bの代金不払でAは契約を解除した。ところがAが登記を戻す前に、BはCにその土地を売り、Cが先に移転登記を備えた。","h":"解除後の第三者と解除した者との関係は、二重譲渡と同じく対抗関係（177条）となり、先に登記を備えた方が優先する。","pt":"解除後の第三者は登記の先後で決まる（解除前の第三者との違い）。取消後の第三者・時効完成後の第三者と同じ「対抗関係」型の処理。","kw":["解除後の第三者","対抗関係","177条","登記","先に登記"]},{"n":"最判昭和31年12月6日","f":"買主Bが代金を支払わないので、売主Aは期間を定めずに（又は不相当に短い期間を定めて）支払を催告した。相当な期間が経過してもBは支払わず、Aは契約を解除した。","h":"催告に期間の定めがない場合や定めた期間が不相当に短い場合でも、催告の時から客観的に相当な期間が経過すれば、解除することができる。","pt":"「期間を定めない催告は無効で、解除するには改めて催告が必要」と出たら×。","kw":["催告","相当の期間","期間を定めない","解除","履行遅滞"]},{"n":"最判昭和35年4月21日","f":"AはBに土地を売ったが、移転登記をしないうちに同じ土地をCにも売り、Cに移転登記をした。","h":"不動産の二重譲渡で一方の買主に移転登記がされたときは、他方の買主に対する売主の債務は、特段の事情がない限り履行不能となる。","pt":"Bは催告なしに解除でき（542条1項1号）、帰責事由のある売主Aに履行に代わる損害賠償（415条2項）を請求できる。","kw":["二重譲渡","移転登記","履行不能","損害賠償","解除"]},{"n":"最判昭和47年4月20日","f":"AはBに土地を売ったが、Cに二重に売って登記をしたため、Bへの債務は履行不能になった。その後も土地の価格は上がり続けた。","h":"履行不能後も目的物の価格が騰貴を続けている場合、債務者が履行不能時にその特別の事情を知り又は知り得たときは、債権者は騰貴した現在の価格で損害賠償を請求できる。買主が転売目的でなく自ら使用する目的でもよい。","pt":"損害賠償の範囲（416条）の応用。特別損害は現行法では当事者が「予見すべきであった」ときに賠償の対象（416条2項）。","kw":["履行不能","価格の騰貴","特別の事情","損害賠償","予見"]},{"n":"最判平成23年4月22日","f":"B信用協同組合は、経営破綻のおそれがあることを説明しないまま、Aに出資を勧誘し、Aは出資した。その後Bは破綻し、Aは出資金相当額の賠償を求めた。","h":"契約締結に先立ち、信義則上の説明義務に違反して、契約を締結するかどうかの判断に影響を及ぼす情報を提供しなかった場合、不法行為による賠償責任を負うことはあっても、その契約上の債務不履行による賠償責任を負うことはない。","pt":"契約締結前の説明義務違反は不法行為責任（消滅時効は不法行為の期間による）。「債務不履行責任を負う」と出たら×。","kw":["説明義務","契約締結","信義則","不法行為","債務不履行"]},{"n":"最判昭和37年9月4日","f":"AはBの不法行為により損害を受けた。Aは事故から相当期間がたってから賠償を請求し、遅延損害金をいつから請求できるかが争われた。","h":"不法行為に基づく損害賠償債務は、催告を要することなく、損害の発生と同時に遅滞に陥る。","pt":"期限の定めのない債務は請求時から遅滞（412条3項）が原則だが、不法行為の損害賠償債務は不法行為時から遅滞。債務不履行による損害賠償債務（期限の定めのない債務として請求時から遅滞）と区別する。","kw":["不法行為","損害賠償債務","催告を要しない","遅滞","不法行為の時"]},{"n":"最判昭和53年2月17日","f":"AはBに建物を贈与し、その代わりにBがAの生活費を負担する約束をした（負担付贈与）。ところがBは負担を履行しなかった。","h":"負担付贈与で受贈者が負担を履行しないときは、贈与者は、双務契約の解除の規定（541条）を準用して贈与契約を解除できる。","pt":"負担付贈与には双務契約の規定が準用される（553条）。「贈与は片務契約なので解除できない」と出たら×（令和2年出題）。","kw":["負担付贈与","負担","受贈者","解除","双務契約の規定"]}]},"権利|売買・契約不適合":{"pts":["引き渡された目的物が種類・品質・数量に関して契約に適合しないとき、買主は追完（修補・代替物・不足分の引渡し）を請求できる。","代金減額請求は原則として相当期間を定めた追完の催告が必要。追完不能・明確な追完拒絶などの場合は無催告で減額請求できる。","契約不適合を理由に、債務不履行の一般規定により損害賠償請求（売主の帰責事由が必要）と解除（帰責事由不要）ができる。","不適合が買主の帰責事由によるときは、追完・代金減額・解除のいずれも請求できない。","種類・品質の不適合は、買主が知った時から1年以内に通知しなければ権利を失う。売主が悪意・重過失なら制限なし。数量・権利は対象外。","担保責任を負わない特約も有効だが、売主が知りながら告げなかった事実や自ら設定・譲渡した権利は免責されない（572条）。","手付は解約手付と推定され、相手方が履行に着手するまで、買主は手付を放棄、売主は倍額を現実に提供して解除できる。"],"traps":["「1年以内に請求しなければならない」と出たら×。知った時から1年以内の「通知」で足り、数量不足には適用されない。","「契約目的を達成できなければ解除できない」と出たら×。催告解除は不適合が軽微でなければ可能。目的達成不能は無催告解除の要件。","「売主は自分が履行に着手していれば手付解除できない」と出たら×。基準は相手方の履行着手で、自ら着手していても解除可。"],"rel":["権利|債務不履行・解除","業法|8種制限","権利|不法行為・請負・委任"],"bridge":"民法では担保責任の免責特約も有効だが、宅建業者が自ら売主の8種制限では引渡しから2年以上とする通知期間特約を除き買主に不利な特約は無効。請負の不適合責任も売買の規定を準用する。","sys":{"overview":"債権各論の売買。契約不適合責任の4つの救済（追完・代金減額・損害賠償・解除）の要件の違いと、通知期間（知った時から1年）を押さえる。手付・買戻し・他人物売買や、宅建業法の8種制限・品確法との違いも頻出。","tree":[{"h":"契約不適合","items":["種類・品質・数量・権利の不適合","売主の帰責事由は損害賠償のみ必要","買主の帰責事由なら追完・減額・解除不可","媒介業者は担保責任を負わない"]},{"h":"4つの救済","items":["追完：修補・代替物・不足分の引渡し","代金減額：原則として追完の催告が必要","損害賠償：債務不履行の一般規定（415条）","解除：541・542条、軽微なら催告解除不可"]},{"h":"期間制限","items":["種類・品質：知った時から1年以内に通知","売主が悪意・重過失なら1年制限なし","数量・権利の不適合は1年制限の対象外","別に消滅時効（知った時5年・引渡し等から10年）"]},{"h":"特約","items":["担保責任免除特約も原則有効","知りながら告げない事実は免責されない","自ら設定・譲渡した権利も免責されない","業者が売主：通知期間を引渡しから2年以上は可"]},{"h":"手付","items":["解約手付と推定","買主は放棄、売主は倍額を現実に提供","相手方の履行着手まで解除できる","手付解除では損害賠償請求できない"]},{"h":"その他","items":["他人物売買も有効、売主は取得して移転","権利を失うおそれ→代金支払拒絶可（576条）","引渡し後の滅失・損傷は買主の負担（567条）","買戻し期間は10年以内、定めなし→5年以内"]}],"flow":{"title":"買主の救済手段の順","steps":["不適合が買主の帰責事由によらないか確認","まず追完（修補・代替物・不足分）を請求","追完の催告後も相当期間内に追完なし","代金減額請求か催告解除（軽微でなければ）","追完不能・明確な拒絶→無催告で減額・解除","売主に帰責事由あれば損害賠償も併せて請求","種類・品質は知った時から1年以内に通知"]},"tables":[{"title":"4つの救済手段","head":["手段","売主の帰責","催告","買主の帰責"],"rows":[["追完請求","不要","—","×"],["代金減額","不要","原則必要","×"],["損害賠償","必要","—","過失相殺"],["解除","不要","原則必要","×"]]},{"title":"期間制限の整理","head":["場面","期間"],"rows":[["種類・品質の不適合","知った時から1年以内に通知"],["売主が悪意・重過失","1年制限なし"],["数量・権利の不適合","1年制限なし（消滅時効のみ）"],["宅建業者が自ら売主","引渡しから2年以上の特約可"],["新築住宅（品確法）","構造耐力上主要部分等10年"]]},{"title":"手付解除の可否","head":["状況","手付解除"],"rows":[["相手方が履行に着手前","○"],["自分だけが履行に着手","○"],["相手方が履行に着手後","×"],["売主：倍額を口頭で提供のみ","×（現実の提供が必要）"]]}]},"ex":[{"t":"雨漏りは1年内に通知","s":"Aは2026年4月1日に中古住宅をBに売り、引き渡した。Bは2026年10月1日の大雨で雨漏りに気付いたが、忙しくてAに伝えないまま2027年11月に修補を求めた。Aは雨漏りを知らずに売っていた。","p":"品質の不適合は、知った時（2026年10月1日）から1年以内に「通知」しなければ追完・減額・損害賠償・解除を求められない（566条）。通知さえ期間内にしておけば、請求そのものは消滅時効（知った時から5年）までに行えばよい。","kw":["知った時から1年","通知","品質","雨漏り","追完"]},{"t":"面積不足は代金減額","s":"Aは甲土地を「100㎡・1㎡あたり10万円・代金1,000万円」としてBに売ったが、実測は95㎡だった。土地を5㎡足すことはできない。Bが面積不足を知ってから2年後にAに減額を求めた。","p":"不足分を引き渡す追完が不能なので、Bは催告なしに直ちに代金減額（50万円）を請求できる（563条2項）。数量不足は1年の通知期間の対象外なので、2年後でも請求できる。","kw":["数量","面積","代金減額","催告","追完不能"]},{"t":"手付解除は相手の着手で","s":"AはBに建物を代金3,000万円で売り、Bから手付300万円を受け取った。Aは自分で登記書類をそろえ引渡しの準備を始めたが、Bはまだ何もしていない。その後Aが契約をやめたくなった。","p":"手付解除ができなくなるのは「相手方」が履行に着手した後なので、自分が着手したAでも、Bに600万円（倍額）を現実に提供すれば解除できる（557条）。Bが中間金を支払うなど着手した後はAは手付解除できない。","kw":["手付","倍額","現実に提供","履行に着手","解約手付"]}],"around":[{"h":"8種制限との違い","b":"宅建業者が自ら売主・業者以外が買主の場合、通知期間を「引渡しから2年以上」とする特約以外で民法より買主に不利な特約は無効。民法上は免責特約も原則有効。"},{"h":"品確法の10年","b":"新築住宅の売主・請負人は、構造耐力上主要な部分と雨水の浸入を防止する部分の不適合について、引渡しから10年間責任を負い、これより短くする特約は無効。"},{"h":"請負への準用","b":"請負の目的物の不適合にも売買の規定が準用され、追完・減額・損害賠償・解除の枠組みは同じ。注文者の材料・指図による不適合は原則として責任を問えない。"},{"h":"危険の移転","b":"目的物の引渡し後に当事者双方の責任でない事由で滅失・損傷した場合、買主は追完・減額・損害賠償・解除を主張できず、代金の支払も拒めない（567条）。"},{"h":"買戻しの期間","b":"買戻しの期間は10年を超えられず、定めなければ5年以内に買い戻す必要がある。買戻し特約は売買契約と同時に登記すれば第三者に対抗できる。"}],"cases":[{"n":"最判昭和33年6月5日","f":"BはAから建物を買い、解約手付を交付した。履行期が来たので、Bは代金を用意していつでも支払える状態にしたうえでAに履行を催告した。その後Aは手付の倍額を提供して解除しようとした。","h":"買主が履行期到来後に代金を準備して売主に履行を催告したことは「履行の着手」に当たるので、売主は手付解除できない。","pt":"令和2年出題。相手方（買主）が履行に着手した後は、売主は倍額を提供しても解除できない（557条1項ただし書）。","kw":["解約手付","履行の着手","代金を準備","履行の催告","倍額"]},{"n":"最大判昭和40年11月24日","f":"AはC所有の土地をBに売る契約を結び、Bから手付を受け取った。AはCから土地を買い取って自己名義の登記を備えたが、Bはまだ何もしないうちに手付を放棄して解除すると言い出した。","h":"履行の着手とは、客観的に外部から認識し得る形で履行行為の一部をし、又は履行の提供に欠かせない前提行為をすることをいう（Aの行為は着手に当たる）。また、手付解除を制限するのは着手した相手方を保護するためなので、自ら履行に着手した当事者でも、相手方が着手していなければ解除できる。","pt":"現在は557条1項ただし書で「その相手方が契約の履行に着手した後は」と明文化。Aは着手したのでBは解除できない。逆に自分だけが着手していても解除できる。","kw":["履行の着手","相手方","手付解除","自己名義の登記","客観的に外部から認識"]},{"n":"最判昭和41年1月21日","f":"売買契約で履行期が定められていたが、履行期より前に買主Bが代金を提供した。売主Aは、履行期前だから着手ではないとして手付の倍額を提供して解除しようとした。","h":"履行期の約定があっても、履行期前には履行に着手しない旨の合意があるなどの特段の事情がない限り、履行期前の行為でも履行の着手となり得る。","pt":"「履行期前の行為は履行の着手に当たらない」と言い切る選択肢は×。","kw":["履行期前","履行の着手","特段の事情","手付解除"]},{"n":"最判平成6年3月22日","f":"売主Aは手付を受け取った後に解除したくなり、買主Bに「手付の倍額を返すので受け取ってほしい」と告げて受領を催告したが、実際に金銭を持参して提供はしなかった。","h":"売主が手付の倍額を償還して解除するには、倍額を償還する旨を告げて受領を催告するだけでは足りず、倍額の現実の提供をしなければならない。","pt":"現在は557条1項で「その倍額を現実に提供して」と明文化。口頭の提供では解除できない。","kw":["手付","倍額","現実の提供","口頭の提供","売主"]},{"n":"最判昭和24年10月4日","f":"A・B間の売買契約で交付された手付について、契約書に「買主が違約したときは手付を没収し、売主が違約したときは倍額を返す」と定められていた。","h":"違約手付の定めがあっても、そのことだけで解約手付の性質が否定されるわけではなく、一つの手付が違約手付と解約手付を兼ねることができる。","pt":"手付は特段の意思表示がなければ解約手付と推定される。「違約手付の定めがあれば解約手付として解除することはできない」と出たら×。","kw":["違約手付","解約手付","兼ねる","推定","手付"]},{"n":"最大判昭和49年9月4日","f":"AはC所有の土地を自分の物としてBに売った（他人物売買）。その後Aが死亡し、所有者CがAを単独で相続した。BはCに土地の引渡しを求めた。","h":"権利者Cは、他人物売買の売主の地位を相続しても、信義則に反すると認められる特別の事情がない限り、売主としての履行義務を拒絶できる。","pt":"他人物売買も有効（561条）で、売主は権利を取得して移転する義務を負う。無権代理人を本人が相続した場合（本人は追認拒絶できる）と同じ発想。","kw":["他人物売買","権利者","相続","履行を拒絶","信義則"]},{"n":"最判昭和51年2月13日","f":"AはC所有の自動車をBに売って引き渡したが、Cから所有権を取得できず、Bは契約を解除した。AはBに、解除までの使用利益の返還を求めた。","h":"他人物売買が解除された場合、買主は、売主が目的物の所有権を持っていなかったときでも、原状回復義務として、引渡しから返還までの使用利益を売主に返還しなければならない。","pt":"現在は545条3項で、解除により金銭以外の物を返還するときはその受領の時以後に生じた果実も返還すると明文化された（使用利益も同様に返還すべきと解されている）。","kw":["他人物売買","解除","原状回復","使用利益","果実"]},{"n":"判例（最高裁）","f":"Bは住宅を建てる目的でAから土地を買ったが、土地の大部分が都市計画街路の予定地に含まれていて、建物を建てても将来取り壊されるおそれがあった。","h":"売買の目的物である土地に法令上の制限があり、契約で予定された用途に使えない場合も、目的物の瑕疵に当たる（権利の瑕疵ではなく物の瑕疵として扱う）。","pt":"現在は契約不適合（562条以下）の問題になる。法令上の制限を「品質」の不適合（566条の1年以内の通知が必要）とみるか「権利」の不適合（565条。566条の期間制限なし）とみるかは改正法で明記されず解釈に委ねられており、判例の立場を引き継いで品質の不適合とみる見解が有力。","kw":["法令上の制限","都市計画街路","瑕疵","品質","契約不適合"]},{"n":"最判平成22年6月1日","f":"Bは平成3年にAから土地を買った。当時は有害と認識されていなかったフッ素が土地に含まれていたが、後に法令で規制対象となり、Bは土壌汚染を理由にAに損害賠償を求めた。","h":"売買契約の当事者間で目的物がどのような品質・性能を有することが予定されていたかは、契約締結当時の取引観念を考慮して判断すべきであり、当時有害と認識されていなかった物質が基準値を超えて含まれていても瑕疵には当たらない。","pt":"契約不適合かどうかは「契約の内容」に適合するかで判断する。後から法規制ができても、契約当時の予定を基準にする。","kw":["土壌汚染","フッ素","契約締結当時","取引観念","瑕疵"]},{"n":"最判平成3年4月2日","f":"BはAから借地権付きの建物を買った。ところが敷地の擁壁に欠陥があり、建物の使用に支障が生じたので、Bは売主Aの担保責任を追及した。","h":"借地権付き建物の売買で、敷地の欠陥が賃貸人（地主）の修繕義務の対象となるものであれば、売買の目的物の瑕疵には当たらず、売主は担保責任を負わない。","pt":"買主は、売主ではなく地主（賃貸人）に修繕を求めることになる。敷地自体は売買の目的物ではない点がポイント。","kw":["借地権付き建物","敷地","擁壁","修繕義務","瑕疵"]},{"n":"最判平成13年11月27日","f":"BはAから宅地を買い引渡しを受けたが、宅地の一部に道路位置指定がされていたことを10年以上たってから知った。BはAに担保責任に基づく損害賠償を求めた。","h":"売主の担保責任に基づく買主の損害賠償請求権には消滅時効の規定が適用され、その時効は買主が目的物の引渡しを受けた時から進行する。","pt":"現在も、知った時から1年以内の通知（566条）とは別に、消滅時効（知った時から5年・引渡しなど権利行使できる時から10年、166条1項）にかかる。","kw":["担保責任","損害賠償請求権","消滅時効","引渡しを受けた時","道路位置指定"]}]},"権利|保証・連帯債務":{"pts":["保証契約は書面（電磁的記録を含む）でしなければ効力を生じない。保証債務は主たる債務に付従する。","保証債務は元本・利息・違約金・損害賠償等に及ぶ。契約後に主債務の目的・態様が加重されても保証人の負担は加重されない。","通常の保証人には催告の抗弁権・検索の抗弁権があるが、連帯保証人にはない。連帯保証人には分別の利益もない。","個人根保証契約は極度額を定めなければ無効。事業用貸金等の個人保証は原則、契約前1か月以内の公正証書による意思表示が必要。","連帯債務で他の債務者に効力が及ぶ（絶対効）のは弁済・更改・相殺・混同。請求・免除・時効完成は原則として相対効。","他の連帯債務者が反対債権を有するときは、その者の負担部分の限度で履行を拒めるのみで、代わりに相殺はできない。","弁済した連帯債務者は、弁済額が自己の負担部分を超えなくても、各自の負担部分の割合に応じて求償できる（442条）。"],"traps":["「連帯債務者の1人への履行の請求は他の債務者にも効力を生ずる」と出たら×。2020年改正で請求は相対効となった。","「口頭の合意だけで保証契約が成立する」と出たら×。保証契約は書面又は電磁的記録でしなければ効力を生じない。","「連帯保証人は催告の抗弁権を有する」と出たら×。連帯保証人は催告・検索の抗弁権をいずれも有しない。"],"rel":["権利|抵当権・担保","権利|時効"],"bridge":"保証は人的担保、抵当権は物的担保で、保証人も物上保証人も弁済すれば求償できる。主債務の時効は保証人が援用でき、主債務者の承認による更新は保証人にも及ぶ（付従性）。","sys":{"overview":"債権総論の「多数当事者の債権債務」に属し、保証は人的担保の中心。保証人の抗弁・個人保証の保護、連帯債務の絶対効と求償を押さえれば得点できる。","tree":[{"h":"保証の成立","items":["書面又は電磁的記録でなければ無効","主債務が無効なら保証も無効（付従性）","債権譲渡で保証も移る（随伴性）","主債務者の承諾なくても保証人になれる"]},{"h":"保証の範囲","items":["元本・利息・違約金・損害賠償に及ぶ","後の主債務加重は保証人に及ばない","売買解除時の代金返還義務にも及ぶ（判例）","主債務者の時効更新は保証人にも及ぶ"]},{"h":"保証人の抗弁","items":["催告の抗弁権：まず主債務者へ請求せよ","検索の抗弁権：執行容易な財産から執行せよ","分別の利益：保証人数で頭割り","連帯保証人には上の3つがいずれもない"]},{"h":"個人保証の保護","items":["個人根保証は極度額の定めがないと無効","事業用貸金の個人保証は1か月内の公正証書","公正証書不要：取締役・過半数株主等","期限の利益喪失は知った時から2か月内に通知"]},{"h":"連帯債務","items":["各自が全額の履行義務を負う","絶対効：弁済・更改・相殺・混同","請求・免除・時効完成は相対効","他人の反対債権は負担部分まで履行拒絶のみ"]},{"h":"求償","items":["連帯債務：負担部分以下の弁済でも割合求償","保証人：弁済後に主債務者へ求償","事前・事後の通知を怠ると求償が制限"]}],"flow":null,"tables":[{"title":"保証・連帯保証・連帯債務","head":["項目","普通保証","連帯保証","連帯債務"],"rows":[["補充性","あり","なし","なし"],["催告の抗弁権","○","×","×"],["検索の抗弁権","○","×","×"],["分別の利益","○","×","―"],["書面の要否","必要","必要","不要"],["付従性","○","○","×（独立の債務）"]]},{"title":"連帯債務の影響関係","head":["1人に生じた事由","他の債務者への効力"],"rows":[["弁済・代物弁済","絶対効（全員消滅）"],["更改","絶対効"],["相殺（援用した場合）","絶対効"],["混同","絶対効"],["履行の請求","相対効（特約で絶対効可）"],["免除","相対効"],["時効の完成","相対効"]]},{"title":"個人保証の数字","head":["ルール","内容"],"rows":[["個人根保証の極度額","定めなければ無効"],["事業用貸金の個人保証","締結前1か月以内に公正証書"],["期限の利益喪失の通知","知った時から2か月以内"],["保証契約の方式","書面又は電磁的記録"]]}]},"ex":[{"t":"連帯保証人は抗弁できない","s":"BはAから500万円を借り、CとDが保証人となった。返済期限を過ぎ、AはいきなりCに500万円全額の支払を求めた。Bには預金など執行しやすい財産がある。","p":"C・Dが普通の保証人なら、Cはまず主債務者Bに請求せよ（催告の抗弁権）、Bの財産から執行せよ（検索の抗弁権）と主張でき、分別の利益により250万円ずつしか負わない。連帯保証人ならこれらはいずれも主張できず、全額を支払わなければならない。","kw":["連帯保証人","催告の抗弁権","検索の抗弁権","分別の利益","主たる債務者"]},{"t":"1人の免除と求償","s":"A・B・CはDに対して900万円の連帯債務を負い、負担部分は各300万円である。DはAの債務だけを免除した。その後、BがDに900万円全額を弁済した。","p":"免除は相対効なので、B・Cの債務は900万円のまま残る（441条）。全額を弁済したBは、免除を受けたAにも負担部分300万円を求償できる（445条）。弁済が自己の負担部分以下でも、負担部分の割合に応じて求償できる。","kw":["連帯債務","免除","他の連帯債務者","求償","負担部分"]},{"t":"賃借人の個人根保証","s":"個人Cは、Aが所有するアパートの賃借人Bが負う一切の債務を保証する契約をAと結んだ。契約書には極度額の記載がなかった。","p":"個人根保証契約は、書面等で極度額を定めなければ効力を生じない（465条の2）。極度額200万円を定めていれば有効だが、主債務者Bや保証人Cが死亡すると元本が確定し、その後に生じた賃料債務は保証の対象外となる（465条の4）。","kw":["個人根保証契約","極度額","書面","元本の確定","賃借人"]}],"around":[{"h":"保証は書面が必要","b":"保証契約は書面又は電磁的記録でしなければ効力を生じない（446条）。連帯債務は保証と違い、口頭の合意でも成立する。"},{"h":"影響が及ぶ方向","b":"主債務者に生じた時効の完成猶予・更新は保証人にも及ぶ（付従性）。逆に連帯保証人への請求は、2020年改正後は相対効で、主債務者の時効には影響しない。"},{"h":"連帯債務の絶対効","b":"他の債務者にも効力が及ぶのは弁済・更改・相殺・混同。他の連帯債務者が反対債権を持つときは、その負担部分の限度で履行を拒めるだけで、代わりに相殺はできない。"},{"h":"保証人への情報提供","b":"委託を受けた保証人の請求があれば、債権者は主債務の履行状況を知らせる義務がある。主債務者が期限の利益を失ったときは、個人保証人に知った時から2か月以内に通知しなければならない。"},{"h":"債務引受","b":"併存的債務引受は引受人が債務者と並んで同じ債務を負い、免責的債務引受は債務者が債務を免れる。債務者と引受人の契約で行うときは、いずれも債権者が引受人に承諾することが必要。"}],"cases":[{"n":"最大判昭和40年6月30日","f":"AはBに特定の建物を売り、Cが売主Aの債務を保証した。Aが建物を引き渡さなかったため、Bは売買契約を解除し、支払済みの代金の返還をCに求めた。","h":"特定物売買の売主のための保証人は、特に反対の意思表示がない限り、売主の債務不履行で契約が解除された場合の代金返還義務（原状回復義務）についても保証の責任を負う。","pt":"「解除による原状回復義務は本来の債務と別個なので保証人は責任を負わない」と出たら×。損害賠償にも保証が及ぶ（447条1項）ことと合わせて覚える。","kw":["保証人","売主の債務","解除","原状回復義務","代金の返還","特段の意思表示"]},{"n":"最判平成9年11月13日","f":"BはAから期間2年で建物を借り、Cが賃借人Bの債務を保証した。賃貸借は合意更新を繰り返し、更新後にBが賃料を滞納したので、AはCに支払を求めた。","h":"期間の定めのある建物賃貸借の賃借人のための保証人は、反対の趣旨をうかがわせる特段の事情がない限り、更新後の賃貸借から生ずる債務についても責任を負う。ただし、賃借人の不払が続いているのに賃貸人が漫然と更新させていたなど、保証人への請求が信義則に反する場合は除かれる。","pt":"「保証人の責任は当初の期間に限られ、更新後の賃料には及ばない」と出たら×。なお現在、個人の賃貸保証は個人根保証契約として極度額の定めがなければ無効（465条の2）。","kw":["賃貸借","保証人","更新","更新後の賃料","特段の事情","信義則"]},{"n":"最判昭和34年6月19日","f":"A・BはCに1,000万円の連帯債務を負っていた。Aが死亡し、子D・Eが2分の1ずつ相続した。","h":"連帯債務者の1人が死亡し相続人が複数いるときは、相続人は被相続人の債務を相続分に応じて分割して承継し、各自その承継した範囲で本来の債務者Bとともに連帯債務者となる。","pt":"D・Eはそれぞれ500万円の範囲でBと連帯する。「各相続人が1,000万円全額について連帯債務を負う」と出たら×。","kw":["連帯債務者","死亡","相続人","相続分","分割して承継","連帯債務"]},{"n":"最判平成24年12月14日","f":"保証人Cは、主債務者Bが債権者Aに対して負う一定範囲の債務を保証する根保証契約を結んだ。元本が確定する前に、AはBに対する貸金債権の1つをDに譲渡し、DがCに保証債務の履行を求めた。","h":"根保証契約の当事者間で別段の合意がない限り、元本確定前に被保証債権を譲り受けた者は、保証人に対して保証債務の履行を求めることができる（随伴性を認めた）。","pt":"根抵当権は元本確定前の随伴性が否定される（398条の7）が、根保証では別段の合意がない限り随伴する。両者を混同させるひっかけに注意。","kw":["根保証契約","元本の確定","債権譲渡","随伴性","譲受人","保証債務の履行"]},{"n":"最判平成25年9月13日","f":"CはBのAに対する借入金債務の連帯保証人だった。主債務者Bが死亡しCがBを単独相続した後、Cは保証債務の弁済として一部を支払った。その後、Cは主債務の消滅時効を主張した。","h":"保証人が主たる債務を相続したことを知りながら保証債務を弁済した場合、その弁済は、特段の事情がない限り、主たる債務者による承認として主たる債務の消滅時効を中断（現在の更新）する。","pt":"保証債務の弁済は本来主債務の承認にならないが、主債務者の地位を兼ねると主債務の時効も更新される。現行法では「中断」は「更新」（152条）。","kw":["保証人","相続","主たる債務","弁済","承認","時効の更新"]},{"n":"最判平成11年11月9日","f":"主債務者Bは破産して免責決定を受けた。債権者Aが保証人Cに請求したところ、Cは、免責された主債務について消滅時効が完成したとしてこれを援用しようとした。","h":"免責決定の効力を受ける債務は、債権者が訴えによって履行を請求し強制的に実現できなくなるので消滅時効の進行を観念できず、保証人はその債務の消滅時効を援用することはできない。","pt":"主債務者の破産免責は保証人の責任に影響しない（破産法253条2項）。「主債務が免責されたので保証人も責任を免れる」と出たら×。","kw":["破産","免責","保証人","主たる債務","消滅時効","援用"]},{"n":"判例（大審院）","f":"Bの債務についてCが保証人となった。主債務の消滅時効が完成した後、主債務者Bは時効の利益を放棄した。債権者AがCに請求したところ、Cは主債務の時効を援用した。","h":"時効の利益の放棄の効果は放棄した者との関係でのみ生じ（相対効）、主債務者が放棄しても、保証人は主たる債務の消滅時効を援用できる。","pt":"保証人は主債務の消滅時効の援用権者（145条かっこ書）。主債務者の時効「更新」は保証人に及ぶ（457条1項）が、時効利益の「放棄」は及ばない、という対比で問われる。","kw":["時効の利益の放棄","主たる債務者","保証人","援用","相対効"]}]},"権利|不法行為・請負・委任":{"pts":["不法行為の損害賠償請求権は、損害及び加害者を知った時から3年（生命・身体侵害は5年）、不法行為の時から20年で時効消滅する。","使用者は事業の執行についての被用者の加害行為に責任を負う。使用者から被用者への求償、被用者から使用者への逆求償も相当額で認められる。","工作物責任は占有者が第一次的に負い、占有者が損害発生防止に必要な注意をしたときは所有者が無過失責任を負う。","請負人の契約不適合責任は、注文者が不適合を知った時から1年以内に通知が必要。注文者の材料・指図による不適合は原則責任なし。","注文者は仕事完成前ならいつでも損害を賠償して解除できる。完成前に解除等されても、注文者が受ける利益の割合に応じて報酬請求できる。","受任者は有償・無償を問わず善管注意義務を負う。報酬は特約がなければ請求できず、委任事務の中途終了なら履行割合に応じ請求できる。","委任は各当事者がいつでも解除できる。相手方に不利な時期の解除等は損害賠償が必要。委任者・受任者の死亡・破産で終了する。"],"traps":["「無償の受任者は自己の財産と同一の注意で足りる」と出たら×。委任は無償でも善管注意義務。自己の財産と同一の注意は無償寄託。","「工作物の所有者は過失がなければ責任を負わない」と出たら×。所有者の工作物責任は無過失責任。","「請負の不適合は引渡し時から1年以内に通知」と出たら×。起算点は注文者が不適合を知った時。"],"rel":["権利|売買・契約不適合","権利|時効"],"bridge":"請負の契約不適合責任は売買の規定を準用し、追完・減額・解除・損害賠償の枠組みは共通。不法行為の時効は一般の債権（5年・10年）と期間・起算点が異なる。","sys":{"overview":"民法債権各論の契約（請負・委任）と法定債権（不法行為）にまたがる論点。時効期間の数字、使用者・工作物責任の構造、請負と委任の報酬・解除・注意義務の違いが得点源。","tree":[{"h":"一般不法行為","items":["故意・過失による権利侵害で損害賠償","賠償は金銭が原則、遅滞は不法行為時から","過失相殺は裁判所の任意（必ずではない）","悪意・人身侵害の賠償債務は加害者から相殺不可"]},{"h":"特殊不法行為","items":["使用者責任：事業の執行についての加害","使用者→被用者の求償、逆求償も相当額","工作物責任：占有者→所有者（無過失責任）","共同不法行為者は連帯して全額を負う"]},{"h":"不法行為の時効","items":["知った時から3年（生命・身体は5年）","不法行為の時から20年","建物の安全性欠如は設計・施工者も責任（判例）"]},{"h":"請負","items":["報酬は仕事の目的物の引渡しと同時払","不適合は知った時から1年以内に通知","注文者の材料・指図による不適合は原則免責","完成前は注文者が損害賠償して解除可","未完成でも利益の割合に応じ報酬請求可"]},{"h":"委任","items":["有償・無償問わず善管注意義務","報酬は特約がなければ請求不可","中途終了は履行割合に応じ報酬請求可","費用の前払・償還請求ができる","いつでも解除可、不利な時期は損害賠償"]},{"h":"委任の終了事由","items":["委任者：死亡・破産","受任者：死亡・破産・後見開始","終了後も急迫の事情があれば必要な処分"]}],"flow":null,"tables":[{"title":"損害賠償請求権の時効","head":["種類","主観的起算点","客観的起算点"],"rows":[["一般の債権","知った時から5年","行使可能時から10年"],["人の生命・身体（債務不履行）","知った時から5年","行使可能時から20年"],["不法行為（物損等）","知った時から3年","不法行為時から20年"],["不法行為（生命・身体）","知った時から5年","不法行為時から20年"]]},{"title":"請負と委任の比較","head":["項目","請負","委任"],"rows":[["目的","仕事の完成","事務の処理"],["報酬","当然に有償","特約がなければ無償"],["報酬の時期","引渡しと同時","事務履行後（後払）"],["中途終了の報酬","利益の割合に応じ可","履行割合に応じ可"],["解除","注文者が完成前に可","各当事者いつでも可"],["契約不適合責任","○（売買準用）","×（債務不履行で処理）"]]},{"title":"特殊不法行為の責任者","head":["類型","第一次責任","免責の可否"],"rows":[["使用者責任","使用者","選任監督に注意で免責（実際上困難）"],["工作物責任","占有者","必要な注意をすれば免責"],["工作物責任（二次）","所有者","免責なし（無過失責任）"],["注文者の責任","原則負わない","注文・指図に過失あれば負う"]]}]},"ex":[{"t":"ブロック塀の倒壊","s":"Aが所有する住宅をBが賃借して住んでいる。敷地のブロック塀が設置の不備で倒れ、通行人Cがけがをした。Bは日頃から点検するなど損害防止に必要な注意をしていた。","p":"工作物責任は占有者Bが第一次的に負うが、Bが必要な注意をしていたので免責され、所有者Aが過失がなくても責任を負う（717条）。所有者の責任は無過失責任。","kw":["工作物","占有者","所有者","無過失責任","必要な注意"]},{"t":"使用者責任と逆求償","s":"不動産会社A社の従業員Bが、営業車で物件案内中に不注意でCに衝突し、600万円の損害を与えた。BはCに全額を賠償した。","p":"事業の執行についての加害なので、Cは使用者A社にも請求できる（715条）。Bが自分で賠償した場合も、損害の公平な分担の見地から相当と認められる額をA社に求償（逆求償）できる（判例）。","kw":["使用者責任","事業の執行","求償","被用者","逆求償"]},{"t":"請負の不適合と通知","s":"AはBに自宅の新築を請け負わせ、2025年3月に引渡しを受けた。2026年8月1日、Aは外壁の防水工事が契約内容と違い不十分であることに気付いた。","p":"請負の不適合も、注文者が知った時（2026年8月1日）から1年以内に通知すれば修補等を請求できる（637条）。起算点は引渡し時や工事終了時ではない。","kw":["請負","契約不適合","知った時から1年","通知","修補"]}],"around":[{"h":"不法行為の時効","b":"損害と加害者を知った時から3年（生命・身体の侵害は5年）、不法行為の時から20年で時効消滅する。一般の債権（5年・10年）と混同しない。"},{"h":"委任の注意義務","b":"受任者は無償でも善管注意義務を負う。自己の財産と同一の注意で足りるのは無報酬の受寄者であり、委任ではない。"},{"h":"委任の報酬と解除","b":"委任は特約がなければ無報酬。各当事者はいつでも解除でき、相手方に不利な時期の解除などは、やむを得ない事由がない限り損害を賠償する。"},{"h":"注文者の解除","b":"注文者は仕事の完成前ならいつでも損害を賠償して請負契約を解除できる。完成前に終わっても、可分な部分で注文者が利益を受けるなら、その割合に応じて報酬を請求できる。"},{"h":"事務管理","b":"頼まれずに他人の事務を処理した者は、本人のために有益な費用の償還を請求できるが、報酬は請求できない。"}],"cases":[{"n":"最判平成19年7月6日","f":"建築士Aが設計し建設会社Bが施工した9階建てマンションを、Cが前の所有者から買い受けた。建物には壁のひび割れや鉄筋の耐力低下などの欠陥があった。CはA・Bと契約関係になかったが、A・Bに損害賠償を求めた。","h":"建物の設計者・施工者・工事監理者は、契約関係にない居住者等に対しても、建物としての基本的な安全性が欠けることがないよう配慮すべき注意義務を負い、これを怠って生命・身体・財産を侵害した場合は、特段の事情がない限り不法行為責任を負う。","pt":"「契約関係がないので責任を負わない」と出たら×。契約不適合責任（契約上の責任）ではなく、不法行為責任として追及できる点がポイント。","kw":["基本的な安全性","設計者","施工者","契約関係にない","不法行為"]},{"n":"最判令和2年2月28日","f":"運送会社A社のトラック運転手Bが、業務中に交通事故を起こして通行人Cを死亡させた。BはCの遺族に損害を賠償した後、A社に対して負担の一部を求めた。","h":"被用者が使用者の事業の執行について第三者に損害を加え、その損害を賠償した場合、被用者は、損害の公平な分担という見地から相当と認められる額について、使用者に求償（逆求償）できる。","pt":"715条3項は使用者から被用者への求償だけを定めるが、判例は被用者から使用者への逆求償も認めた。「被用者は使用者に求償できない」と出たら×。","kw":["使用者責任","逆求償","被用者","損害の公平な分担","事業の執行"]},{"n":"最判昭和51年7月8日","f":"石油会社A社の従業員Bがタンクローリーを運転中に前方不注意で追突事故を起こした。A社は被害者に賠償するとともに自社車両の修理費も負担し、Bにその全額を請求した。A社は対物・車両保険に加入していなかった。","h":"使用者は、事業の性格・規模、被用者の業務内容・労働条件・加害行為の態様などに照らし、損害の公平な分担という見地から信義則上相当と認められる限度においてのみ、被用者に求償できる（本件では損害額の4分の1が限度）。","pt":"使用者から被用者への求償は認められる（715条3項）が、全額とは限らず信義則上制限される。「使用者は常に全額を求償できる」と出たら×。","kw":["使用者責任","求償","信義則","制限","715条3項"]},{"n":"最判昭和42年11月2日","f":"A社の従業員Bが、職務権限がないのに会社名義の手形を振り出し、Cがこれを受け取って損害を受けた。Cは、Bに権限がないことを容易に知り得る状況にあった。CはA社に使用者責任を追及した。","h":"被用者の取引行為が外形上職務の範囲内に見えても、それが職務権限内で適法に行われたものでないことを相手方が知り、または重大な過失により知らなかったときは、相手方は使用者責任を追及できない。","pt":"「事業の執行について」は行為の外形から判断する（外形標準説）。ただし取引の相手方が悪意・重過失なら保護されない。","kw":["使用者責任","事業の執行","外形","悪意","重大な過失"]},{"n":"最判昭和51年3月25日","f":"夫Aが運転する自動車に妻Bが同乗していたところ、Cの運転する自動車と衝突し、Bがけがをした。事故はAとC双方の過失によるものだった。BはCに損害賠償を請求した。","h":"夫婦の婚姻関係が破綻しているなど特段の事情がない限り、夫Aの過失を「被害者側の過失」として、BのCに対する賠償額を定めるにつき過失相殺できる。","pt":"過失相殺では被害者本人だけでなく、被害者と身分上・生活関係上一体をなす者の過失も考慮される。過失相殺するかどうかは裁判所の裁量（不法行為では「必ず」ではない）。","kw":["過失相殺","被害者側の過失","夫婦","722条2項","同乗"]},{"n":"最判昭和48年11月16日","f":"Bは、警察署で取り調べを受けた際に警察官Aから暴行を受けた。Bは加害者Aの姓・職業・容貌は知っていたが、名前や住所は知らず、確認も困難だった。かなり後になってAの氏名・住所を確認し、損害賠償を請求した。","h":"724条の「加害者を知った時」とは、加害者に対する賠償請求が事実上可能な状況のもとに、その可能な程度にこれを知った時をいう。本件ではAの氏名・住所を確認した時から時効が進行する。","pt":"不法行為の消滅時効は「損害及び加害者を知った時から3年（生命・身体侵害は5年）」と「不法行為の時から20年」。主観的起算点は被害者が現実に知った時が基準（損害を知った時について最判平成14年1月29日も同旨）。","kw":["消滅時効","加害者を知った時","3年","20年","724条"]},{"n":"最判平成23年4月22日","f":"信用協同組合Aは、経営が破綻するおそれがあることを説明しないまま、Bに出資を勧誘し、Bは出資契約を結んだ。その後Aは破綻し、Bは出資金を失った。Bは出資から相当期間が経ってから、契約上の債務不履行として損害賠償を請求した。","h":"契約締結前に信義則上の説明義務に違反して相手方に損害を与えた当事者は、不法行為による賠償責任を負うことはあっても、締結された契約上の債務不履行による賠償責任は負わない。","pt":"契約締結前の説明義務違反は不法行為責任なので、時効は「知った時から3年・不法行為時から20年」（724条）。「契約から10年で時効」のように債務不履行の期間で出たら×。","kw":["説明義務違反","契約締結前","不法行為","債務不履行","信義則"]},{"n":"最判昭和50年1月31日","f":"Cが放火してAの家屋が焼失した。Aは家屋にかけていた火災保険から保険金を受け取った。Cは、Aに対する損害賠償額から保険金を差し引くべきだと主張した。","h":"火災保険金は既に払い込んだ保険料の対価としての性質を持ち、不法行為の原因とは関係なく支払われるもので、損益相殺として損害賠償額から控除すべき利益に当たらない。","pt":"「保険金額を損益相殺として控除しなければならない」と出たら×。保険金を払った保険会社は保険代位で加害者に請求する。","kw":["損益相殺","火災保険金","控除","保険代位","放火"]},{"n":"最大判昭和61年6月11日（北方ジャーナル事件）","f":"知事選挙への立候補予定者Aを激しく中傷する記事を載せた雑誌が発売されようとしていた。Aは名誉を守るため、雑誌の印刷・販売の事前差止めを裁判所に求めた。","h":"名誉を違法に侵害された者は、損害賠償や名誉回復処分を求めるほか、人格権としての名誉権に基づき、侵害行為の差止めを求めることができる（表現行為の事前差止めは厳格な要件の下で認められる）。","pt":"名誉毀損では金銭賠償のほか名誉回復処分（723条）、さらに人格権に基づく差止めも認められる。「差止めは認められない」と出たら×。","kw":["名誉毀損","人格権","差止め","名誉回復","723条"]},{"n":"最判平成9年2月14日","f":"AはBに自宅の新築を請け負わせ、建物の引渡しを受けたが、建物には多数の欠陥があった。Bが請負代金の残額を請求したのに対し、Aは修補に代わる損害賠償を受けるまで代金は支払わないと主張した。","h":"注文者は、瑕疵の程度や当事者の交渉態度などから信義則に反すると認められる場合を除き、修補に代わる損害賠償を受けるまで報酬全額の支払を拒むことができる（同時履行）。","pt":"現在は533条括弧書（債務の履行に代わる損害賠償の債務の履行を含む）で同時履行関係が明文化。「賠償を受ける前に代金全額を支払わなければならない」と出たら×。","kw":["請負","修補に代わる損害賠償","報酬","同時履行","533条"]},{"n":"最判平成14年9月24日","f":"AはBに建物の建築を請け負わせ完成した建物の引渡しを受けたが、構造耐力上の安全性に関わる重大な欠陥が多数あり、建て替えるほかない状態だった。AはBに建替え費用相当額の損害賠償を求めた。","h":"請負の目的物である建物に重大な瑕疵があるためこれを建て替えざるを得ない場合には、注文者は請負人に対し、建物の建替えに要する費用相当額を損害として賠償請求できる。","pt":"改正前は「建物等の土地工作物は解除できない」（旧635条ただし書）とされていたが、この規定は削除され、現在は請負でも契約不適合を理由に解除できる。損害賠償で建替え費用を請求できる点は引き続き重要。","kw":["請負","重大な瑕疵","建替え費用","損害賠償","契約不適合"]},{"n":"最判昭和56年1月19日","f":"Aは所有ビルの管理をBに委任し、Bは管理の対価として賃借人から預かる保証金を自分の事業資金として利用できる約束だった（受任者Bの利益にもなる委任）。その後Aは、特にやむを得ない事由がないのに委任を解除した。","h":"受任者の利益のためにも締結された委任であっても、委任者が解除権自体を放棄したとは解されない事情があるときは、やむを得ない事由がなくても651条により解除でき、受任者が不利益を受ける場合は損害賠償で調整する。","pt":"現在は651条2項2号で明文化：受任者の利益（専ら報酬を得ることによるものを除く）をも目的とする委任を解除した者は、やむを得ない事由がなければ損害賠償が必要。解除自体はできる。","kw":["委任","解除","受任者の利益","損害賠償","651条"]},{"n":"最判平成7年9月19日","f":"Aの所有建物をBが賃借し、Bは権利金を払わない代わりに修繕費を自分で負担する約束をしていた。BはCに建物の改修工事を請け負わせたが、代金を払わないまま行方不明（無資力）になった。CはAに対し、建物の価値が上がった分の返還を求めた。","h":"請負人が建物所有者に不当利得返還を請求できるのは、所有者と賃借人の賃貸借関係全体から見て、所有者が対価関係なしに利益を受けたときに限られる。本件のようにAが権利金を受け取らない代わりの特約がある場合は請求できない。","pt":"いわゆる転用物訴権。賃借人の注文で工事をした請負人は、原則として所有者に事務管理や不当利得で費用を請求できない（請負契約上の義務として工事をしたにすぎない）。","kw":["不当利得","転用物訴権","請負人","建物所有者","事務管理"]},{"n":"最判昭和45年10月21日","f":"Aは不倫関係を維持する目的で、愛人Bに未登記の建物を贈与して引き渡した。その後関係が終わり、Aは建物の所有権が自分にあるとして返還を求めた。","h":"不法原因給付（708条）に当たり、Aは贈与契約の無効を理由に返還を求めることはできない。返還請求ができない反射的効果として、建物の所有権はBに帰属する。","pt":"未登記建物は引渡しで「給付」が完了するが、既登記建物は引渡しだけでは足りず登記の移転も必要（判例）。不法の原因が受益者にのみあるときは返還請求できる（708条ただし書）。","kw":["不法原因給付","708条","未登記建物","引渡し","返還請求"]}]},"権利|賃貸借":{"pts":["民法上の賃貸借の存続期間は最長50年。借地借家法が適用される建物所有目的の土地賃貸借・建物賃貸借には別の規律がある。","賃貸人は修繕義務を負う（賃借人の帰責事由による場合を除く）。通知後相当期間修繕しない場合や急迫の事情では賃借人が修繕できる。","必要費は直ちに償還請求でき、有益費は賃貸借終了時に価格の増加が現存する場合に、支出額か増加額を賃貸人が選択して償還する。","無断譲渡・転貸は解除事由だが、背信的行為と認めるに足りない特段の事情があれば解除できない（判例）。","適法な転借人は賃貸人に直接義務を負う。合意解除は転借人に対抗できないが、債務不履行解除権があったときは対抗できる。","敷金は明渡し時に未払債務を控除して返還する。明渡しが先履行で、賃借人から敷金を未払賃料に充当するよう請求はできない。","賃借人は通常損耗・経年変化を除き原状回復義務を負う。対抗要件ある賃貸不動産の譲渡で賃貸人の地位は譲受人に移転する。"],"traps":["「賃借人は敷金を未払賃料に充てるよう請求できる」と出たら×。充当できるのは賃貸人のみ。","「無断転貸があれば賃貸人は常に解除できる」と出たら×。背信的行為と認めるに足りない特段の事情があれば解除できない。","「通常損耗も原状回復の対象」と出たら×。通常の使用収益で生じた損耗・経年変化は原状回復義務の対象外。"],"rel":["権利|借家","権利|借地","権利|物権変動・対抗"],"bridge":"建物賃貸借や建物所有目的の土地賃貸借には借地借家法が優先し、民法の規定は補充的に適用される。譲受人が賃貸人の地位を賃借人に主張するには所有権移転登記が必要。","sys":{"overview":"民法債権各論の典型契約の一つで、借地借家法の土台となる一般ルール。修繕・費用償還・転貸・敷金・賃貸人の地位移転を押さえ、使用貸借との違いも整理すれば得点できる。","tree":[{"h":"成立・期間","items":["諾成契約（書面不要）","存続期間は最長50年（超えれば50年）","期間の定めなし：土地1年・建物3か月で終了","処分権限のない者：土地5年・建物3年まで"]},{"h":"賃貸人の義務","items":["修繕義務（賃借人の帰責事由は除く）","通知後相当期間修繕なし→賃借人が修繕可","急迫の事情があれば賃借人が直ちに修繕可","必要費は直ちに償還請求"]},{"h":"賃借人の義務","items":["賃料支払（一部滅失等で当然減額）","用法遵守・善管注意で保管","通常損耗・経年変化を除き原状回復","損害賠償・費用償還は返還から1年以内"]},{"h":"譲渡・転貸","items":["無断譲渡・転貸は原則解除可","背信性なしの特段の事情なら解除不可","転借人は賃貸人に直接義務を負う","合意解除は転借人に対抗不可（例外あり）"]},{"h":"対抗・地位移転","items":["賃借権の登記で第三者に対抗","対抗要件あり→譲受人に地位が当然移転","譲受人の賃料請求には所有権移転登記要","敷金・費用償還債務も譲受人が承継"]},{"h":"敷金","items":["明渡し時に未払債務を控除して返還","明渡しが先履行（同時履行ではない）","賃借人から充当請求はできない","賃借権譲渡時は旧賃借人に返還"]}],"flow":{"title":"終了から敷金返還まで","steps":["期間満了・解約申入れ・解除で終了","賃借人が建物を明け渡す（先履行）","通常損耗を除き原状回復","未払賃料・損害を敷金から控除","残額を賃借人に返還"]},"tables":[{"title":"必要費と有益費","head":["項目","必要費","有益費"],"rows":[["例","雨漏り修理","改良工事"],["請求時期","直ちに","賃貸借終了時"],["償還額","支出額","支出額か増加額（賃貸人選択）"],["期間の猶予","なし","裁判所が許与できる"],["請求期限","返還から1年以内","返還から1年以内"]]},{"title":"賃貸借と使用貸借","head":["項目","賃貸借","使用貸借"],"rows":[["対価","有償","無償"],["契約の性質","諾成","諾成"],["修繕義務","貸主が負う","貸主は負わない"],["通常の必要費","貸主が負担","借主が負担"],["借主の死亡","相続される","終了する"],["第三者への対抗","登記等で可","不可"]]},{"title":"転貸借の終了と転借人","head":["原賃貸借の終了原因","転借人に対抗"],"rows":[["賃借人の債務不履行解除","○（催告不要）"],["合意解除","×"],["合意解除（不履行解除権あり）","○"],["期間満了（借家）","通知後6か月で対抗可"]]}]},"ex":[{"t":"敷金は明渡しが先","s":"BはAから月10万円で建物を借り、敷金30万円を預けた。Bは最後の2か月分20万円を滞納したまま契約が終了し、「敷金から差し引いてくれ」と言って明渡しを拒んでいる。","p":"明渡しが先履行で、敷金返還と同時履行ではないため、Bは敷金を理由に明渡しを拒めない。敷金を未払賃料に充てられるのは賃貸人Aだけで、明渡し後に20万円等を控除した残額を返す（622条の2）。","kw":["敷金","明渡し","同時履行","未払賃料","充当"]},{"t":"転借人への直接請求","s":"AはBに月10万円で建物を賃貸し、BはAの承諾を得てCに月15万円で転貸した。Bが賃料を払わないので、AはCに直接支払を求めた。","p":"適法な転借人Cは賃貸人Aに直接義務を負うが、その範囲は原賃料と転貸料の少ない方まで。AはCに月10万円を請求でき、15万円は請求できない（613条1項）。","kw":["転貸","転借人","直接","承諾","賃料"]},{"t":"オーナーチェンジ","s":"AはBに建物を賃貸して引き渡し、Bは敷金を預けていた。その後AはこのビルをCに売却したが、Cへの所有権移転登記はまだしていない。CはBに賃料を請求した。","p":"Bは対抗要件（借地借家法の引渡し）を備えているので、賃貸人の地位は当然にCへ移り、敷金返還債務もCが承継する。ただしCが賃料をBに請求するには所有権移転登記が必要（605条の2）。","kw":["賃貸人の地位","譲受人","所有権移転登記","敷金","承継"]}],"around":[{"h":"使用貸借との違い","b":"使用貸借は無償で、借主の死亡で終了し相続されない。通常の必要費は借主が負担し、貸主は修繕義務を負わない。"},{"h":"期間の上限は50年","b":"民法の賃貸借は最長50年。資材置場など建物所有目的でない土地賃貸借は借地借家法が適用されず、この民法の規定による。"},{"h":"一部滅失は当然減額","b":"賃借人の責任でない事由で一部が使えなくなれば、賃料は使えない割合に応じて当然に減額される。全部使えなくなれば賃貸借は終了する。"},{"h":"通常損耗は対象外","b":"原状回復は通常損耗・経年変化を除く。通常損耗を賃借人負担とする特約は、範囲が具体的に明記されるなど明確に合意されていれば認められる（判例）。"},{"h":"賃借人の相続","b":"賃借権は相続の対象で、賃貸人・賃借人が死亡しても契約は終了せず相続人に承継される。"}],"cases":[{"n":"最判昭和28年9月25日","f":"Aは土地をBに賃貸していた。BはAの承諾を得ずに土地の一部をCに転貸し、Cが使用を始めたため、Aは無断転貸を理由に賃貸借契約を解除してCに明渡しを求めた。","h":"無断転貸であっても、賃借人の行為が賃貸人に対する背信的行為と認めるに足りない特段の事情があるときは、賃貸人は612条による解除をすることができない。","pt":"条文（612条2項）は「無断転貸なら解除できる」だが、判例が信頼関係破壊の法理で制限している。「無断転貸があれば常に解除できる」は×。","kw":["無断転貸","背信的行為","特段の事情","解除","信頼関係"]},{"n":"最判昭和39年7月28日","f":"Bは借家の賃料を一部滞納し、賃貸人Aは催告のうえ契約を解除した。しかしBの滞納額や経緯、Aとの交渉状況などからみると、Bに強い不誠実さがあるとはいえない事案だった。","h":"賃借人に賃料不払いなどの債務不履行があっても、賃貸人との信頼関係を破壊するに足りない特段の事情があるときは、解除は認められない。","pt":"信頼関係破壊の法理は無断転貸だけでなく賃料不払いによる解除にも及ぶ。「わずかでも延滞があれば催告して解除できる」とは限らない。","kw":["賃料不払","信頼関係","解除","催告","特段の事情"]},{"n":"最判平成8年10月14日","f":"小規模で閉鎖的な有限会社B社がAから建物を賃借していた。B社の持分が全部譲渡されて経営者が交代したため、Aは実質的な賃借権の無断譲渡に当たるとして契約を解除した。","h":"法人の構成員や機関に変動があっても法人格の同一性は失われないので、賃借権の譲渡には当たらず、それを理由とする解除はできない（法人格が形骸化している場合は別）。","pt":"賃借人が法人のとき、株式・持分の譲渡や役員交代は「賃借権の譲渡」ではない。経営者交代が信頼関係を壊すかは別問題とされる。","kw":["法人","持分譲渡","経営者の交代","賃借権の譲渡","解除"]},{"n":"最判昭和37年3月29日","f":"Aは土地をBに賃貸し、BはAの承諾を得てCに転貸していた。Bが賃料を滞納したため、AはBにだけ催告して契約を解除し、Cに明渡しを求めた。","h":"賃借人の賃料不払いを理由に解除する場合、賃貸人は賃借人に催告すれば足り、転借人に通知して代わりに支払う機会を与える必要はない。","pt":"「転借人にも催告しなければ解除できない」は×（宅建H28出題）。債務不履行解除は転借人に対抗でき、613条3項ただし書もこれを前提にしている。","kw":["転借人","催告","賃料不払","解除","代払"]},{"n":"最判平成9年2月25日","f":"Aは建物をBに賃貸し、BはAの承諾を得てCに転貸していた。Bの賃料不払いでAは原賃貸借を解除し、Cに建物の返還を請求した。CはBへの転借料の支払を続けていた。","h":"原賃貸借が賃借人の債務不履行で解除されたときは、転貸借は、賃貸人が転借人に目的物の返還を請求した時に、転貸人の債務の履行不能により終了する。","pt":"転借人は債務不履行解除に対抗できず、返還請求の時点で転貸借も終わる。合意解除（613条3項本文で対抗不可）との違いがよく問われる。","kw":["転貸借","債務不履行解除","返還請求","履行不能","終了"]},{"n":"最判昭和49年9月2日","f":"Bは賃貸人Aに敷金を預けて建物を借りていた。賃貸借が終了したが、Bは「敷金を返してもらうまでは出ていかない」と主張して明渡しを拒んだ。","h":"敷金返還債務と建物明渡債務は同時履行の関係に立たず、明渡しが先履行である。賃借人は敷金返還を理由に明渡しを拒めず、留置権も主張できない。","pt":"現在は622条の2第1項1号で「明渡しを受けたとき」に返還債務が生じると明文化。「同時履行の関係に立つ」は×（宅建R03出題）。","kw":["敷金","明渡し","同時履行","先履行","留置権"]},{"n":"最判昭和53年12月22日","f":"Bは敷金を預けてAから土地を賃借していた。Aの承諾を得てBが賃借権をCに譲渡し、Cが新たな賃借人となった。BとCの間で敷金についての特別の取決めはなかった。","h":"賃借権が適法に譲渡されても、敷金に関する権利義務は特段の事情（敷金返還請求権を譲渡する合意など）がない限り新賃借人に承継されず、旧賃借人に返還される。","pt":"現在は622条の2第1項2号で明文化。賃貸人が交代する場合（地位とともに承継）と、賃借人が交代する場合（承継しない）の対比が狙われる。","kw":["賃借権の譲渡","敷金","新賃借人","承継","旧賃借人"]},{"n":"最判平成17年12月16日","f":"Bは公社Aから共同住宅を賃借し、契約書には退去時の補修費用を賃借人負担とする条項があったが、通常損耗のどこまでを負担するかは具体的に明記されず、口頭の説明もなかった。退去時にAは敷金から通常損耗の補修費を差し引いた。","h":"賃借人に通常損耗の補修費を負担させるには、その範囲が契約書に具体的に明記されているか、口頭で説明され賃借人が明確に認識して合意していることが必要で、本件では特約の成立は認められない。","pt":"現在は621条で通常損耗・経年変化は原状回復の対象外と明文化。特約自体は可能だが「明確な合意」が要件、という点が問われる（宅建H30出題）。","kw":["通常損耗","原状回復","特約","明確な合意","敷金"]},{"n":"最判昭和46年4月23日","f":"Aは土地をBに賃貸していたが、その土地をCに売却し、賃貸人の地位もCに移すことにした。Bはこれに同意していないとして、Cを賃貸人と認めなかった。","h":"賃貸人の地位の移転は、賃貸人の義務が誰でも履行できる性質のものであることから、特段の事情がない限り賃借人の承諾を要しない。","pt":"現在は605条の3で「譲渡人と譲受人の合意で、賃借人の承諾不要」と明文化。賃借権の譲渡（賃貸人の承諾が必要）と逆なので混同注意。","kw":["賃貸人の地位","移転","賃借人の承諾","合意","譲受人"]},{"n":"最判昭和49年3月19日","f":"Aは賃貸中の土地をCに売却したが、Cへの所有権移転登記はまだだった。CはBに賃料を請求し、支払がないとして契約解除を主張した。","h":"賃貸中の不動産の譲受人が賃借人に賃貸人の地位を主張する（賃料請求・解除をする）には、所有権移転登記が必要である。","pt":"現在は605条の2第3項で明文化。賃借人は登記のない譲受人への支払を拒める。「登記がなくても当然に賃料を請求できる」は×。","kw":["譲受人","所有権移転登記","賃料請求","賃貸人の地位","対抗"]},{"n":"最判昭和40年12月7日","f":"Bが占有する土地について、Aは自分に権利があるとして、裁判などの手続によらず自ら実力で囲いを設けるなどしてBの占有を排除した。","h":"私力の行使（自力救済）は原則として許されず、法律の手続によっては権利を維持できない緊急やむを得ない特別の事情がある場合に限り、必要な限度で例外的に許される。","pt":"賃料滞納者の荷物を勝手に搬出する・鍵を交換するなどの自力救済は原則違法。「例外が一切ない」も×で、緊急性と必要限度の2要件を押さえる（宅建R03出題）。","kw":["自力救済","私力の行使","緊急やむを得ない","必要な限度","原則禁止"]}]},"権利|借地":{"pts":["借地権は建物所有目的の地上権又は土地賃借権。存続期間は30年以上で、定めがなければ30年。短い定めも30年となる。","合意更新の期間は最初の更新で20年以上、2回目以降は10年以上。建物がある場合の更新請求・使用継続には地主の正当事由ある異議が必要。","借地権は借地上の建物の登記で対抗でき、登記は借地権者本人名義であることが必要。滅失しても一定事項を掲示すれば2年間対抗できる。","更新がないとき借地権者は建物買取請求ができる。第三者が建物を取得し地主が譲渡を承諾しないときも買取請求できる。","地代の増減請求は可能。一定期間増額しない特約は有効だが、減額しない特約は無効で、減額請求できる。","一般定期借地権は50年以上で書面（電磁的記録含む）により、更新なし・建物築造による延長なし・買取請求なしを定められる。","事業用定期借地権は専ら事業用（居住用不可）で10年以上50年未満、公正証書による。建物譲渡特約付借地権は30年以上。"],"traps":["「家族名義の建物登記でも借地権を対抗できる」と出たら×。判例は借地権者本人名義の登記を要求する。","「事業用定期借地権は書面であれば公正証書でなくてもよい」と出たら×。事業用定期借地権の設定契約は公正証書によらなければならない。","「地代を減額しない特約は有効」と出たら×。増額しない特約のみ有効で、減額しない特約があっても減額請求できる。"],"rel":["権利|借家","権利|賃貸借","権利|物権変動・対抗"],"bridge":"借家は建物の引渡しで、借地は借地上の建物の登記で対抗力を得る。民法の賃貸借（最長50年）と異なり、借地権は30年以上で更新も保護される。","sys":{"overview":"民法の賃貸借・地上権の特別法である借地借家法のうち、建物所有目的の土地利用を扱う。存続期間と更新、対抗要件、建物買取請求、定期借地権3種の数字を押さえれば得点できる。","tree":[{"h":"存続期間","items":["当初30年以上（定めなし・短い定めは30年）","合意更新：1回目20年以上","2回目以降10年以上","一時使用目的は期間・更新の規定なし"]},{"h":"更新","items":["建物ありで更新請求→同一条件で更新（期間除く）","期間満了後の使用継続も同様","地主は遅滞なく異議＋正当事由で阻止","正当事由：必要性・経過・利用状況・立退料"]},{"h":"建物の滅失・再築","items":["承諾ある再築：承諾日等から20年延長","更新後の無承諾再築→地主は解約申入れ可","解約申入れから3か月で借地権消滅","更新後の滅失→借地権者も解約申入れ可"]},{"h":"対抗要件","items":["借地権の登記又は借地上の建物の登記","建物登記は借地権者本人名義が必要","表示登記でも可（判例）","滅失時は掲示で2年間対抗可"]},{"h":"建物買取・譲渡","items":["更新なし→借地権者が時価で買取請求","無承諾の建物取得者も地主へ買取請求","譲渡転貸は裁判所の代諾許可の制度あり","地代先取特権は最後の2年分"]},{"h":"定期借地権","items":["一般定期：50年以上・書面","事業用定期：10年以上50年未満・公正証書","建物譲渡特約付：30年以上","事業用は居住用建物（賃貸マンション）不可"]}],"flow":{"title":"期間満了〜建物買取請求","steps":["借地権の存続期間が満了","建物ありで更新請求or土地使用を継続","地主が遅滞なく異議を述べるか","異議に正当事由があるか","異議なし・正当事由なし→更新","正当事由あり→更新なく借地権消滅","借地権者が建物を時価で買取請求"]},"tables":[{"title":"借地権の種類","head":["種類","存続期間","方式"],"rows":[["普通借地権","30年以上","制限なし"],["一般定期借地権","50年以上","書面・電磁的記録"],["事業用定期借地権","10年以上50年未満","公正証書"],["建物譲渡特約付借地権","30年以上","制限なし"],["一時使用目的","規定なし","制限なし"]]},{"title":"普通借地と定期借地","head":["項目","普通借地","一般定期","事業用定期"],"rows":[["更新","○","×（特約）","×"],["再築による延長","○","×（特約）","×"],["建物買取請求","○","×（特約）","×"],["居住用建物","○","○","×"]]},{"title":"地代増減の特約","head":["特約","効力"],"rows":[["一定期間増額しない","有効"],["一定期間減額しない","無効（減額請求可）"],["協議不調の増額請求","相当額を払えば足りる"],["裁判確定後の差額","年1割の利息付き精算"]]}]},"ex":[{"t":"建物登記は本人名義","s":"BはAから土地を借りて家を建て、同居する長男Cの名義で建物の保存登記をした。その後Aがこの土地をDに売却し、DがBに明渡しを求めた。","p":"借地権を対抗するには借地権者本人名義の建物登記が必要で、長男名義ではDに対抗できない（判例）。逆にB名義なら表示の登記だけでも対抗できる。","kw":["借地上の建物","登記","本人名義","表示の登記","対抗"]},{"t":"減額しない特約は無効","s":"AとBは普通借地契約で地代を月20万円とし、「5年間は地代を減額しない」と特約した。2年後に周辺の地価が大きく下がり、20万円が不相当に高くなった。","p":"減額しない特約は借地権者に不利なので無効で、Bは減額請求できる（11条）。「一定期間増額しない」特約なら有効で、地主はその期間増額請求できない。","kw":["地代","減額しない特約","増額しない特約","減額請求"]},{"t":"事業用定借は公正証書","s":"Aは自己所有地にコンビニを建てたいB社と、期間20年・更新なしの借地契約を結ぶことにした。一方、賃貸マンションを建てたいC社からも同じ条件で申込みがあった。","p":"コンビニは専ら事業用なので、10年以上50年未満の事業用定期借地権として公正証書で設定できる（23条）。賃貸マンションは居住用建物なので事業用定期借地権にはできず、20年の定めは30年となる。","kw":["事業用定期借地権","公正証書","10年以上50年未満","居住用","30年"]}],"around":[{"h":"借家の対抗要件","b":"借地は借地上の建物の登記で対抗するが、借家は建物の引渡しで対抗できる。どちらも賃借権の登記でも対抗可能。"},{"h":"更新後の期間","b":"最初の更新は20年以上、2回目以降は10年以上。当初30年・更新20年・10年と数字が減っていく点を押さえる。"},{"h":"滅失時の掲示","b":"建物が滅失しても、建物を特定する事項等を土地上の見やすい場所に掲示すれば、滅失日から2年間は借地権を対抗できる（再築して登記が必要）。"},{"h":"建物買取請求","b":"期間満了で更新がないとき借地権者は時価で建物の買取りを請求できる。債務不履行で解除された場合には買取請求できない（判例）。"},{"h":"一時使用の借地","b":"臨時設備の設置など一時使用が明らかな借地は、存続期間・更新・定期借地権などの規定が適用されず、5年などの短期も有効。"}],"cases":[{"n":"最判昭和41年4月27日","f":"BはAから土地を借りて建物を建て、同居する長男Cの名義で建物の保存登記をした。その後Aは土地をDに売却し、DはBに建物収去・土地明渡しを求めた。","h":"借地上の建物の登記で借地権を対抗するには、借地権者本人名義の登記が必要で、長男名義の登記では第三者に対抗できない。","pt":"現在の借地借家法10条1項の「借地権者が登記されている建物を所有するとき」の解釈。配偶者名義・子名義でも×という形で繰り返し出題（H28・H30・R07）。","kw":["借地上の建物","登記","本人名義","長男名義","対抗"]},{"n":"最判昭和50年2月13日","f":"BはAから借りた土地に自己所有の建物を持っていたが、所有権保存登記はせず、表示の登記だけがされていた。その後土地を買ったCがBに明渡しを求めた。","h":"借地上の建物について借地権者名義の表示の登記がされていれば、権利の登記（保存登記）でなくても借地権の対抗要件として認められる。","pt":"「表示の登記しかないと対抗できない」は×（宅建R02出題）。表示登記でもよいが、本人名義であることは必要（昭和41年判例）とセットで覚える。","kw":["表示の登記","保存登記","借地上の建物","対抗要件","借地権"]},{"n":"最判平成9年7月1日","f":"Bは隣り合う甲・乙2筆の土地を借りてガソリンスタンドを営んでいた。甲地には登記のある建物があったが、乙地には未登記のポンプ室と給油設備しかなかった。両地を買ったCがBに乙地の明渡しを求めた。","h":"登記された建物がない乙地には借地権の対抗力は及ばないが、乙地を失うと営業できなくなることなどの事情から、Cの明渡請求は権利の濫用として許されない。","pt":"建物登記による対抗力は、原則として登記に敷地として表示された土地にしか及ばない（宅建R03出題）。この事案は権利濫用で救済された例外である。","kw":["二筆","建物登記","所在地番","対抗力","権利の濫用"]},{"n":"判例（最高裁）","f":"Bは一筆の借地上に2棟の建物を所有しており、そのうち1棟だけB名義で登記していた。土地を買ったCが、登記のない建物の敷地部分について明渡しを求めた。","h":"一筆の土地上の数棟の建物のうち1棟でも借地権者名義の登記があれば、借地権の対抗力はその一筆の土地全体に及ぶ。","pt":"「一筆」の中なら全体に及ぶが、「二筆」にまたがる場合は登記建物のない筆には及ばない（平成9年判例）。この区別が出題される（宅建R02出題）。","kw":["一筆","数棟の建物","1棟の登記","土地全体","対抗力"]},{"n":"最判昭和35年2月9日","f":"Bは建物所有目的でAから土地を借りていたが、地代を払わなかったため、Aは債務不履行を理由に借地契約を解除した。Bは建物を時価で買い取るようAに請求した。","h":"借地人の債務不履行によって土地賃貸借が解除された場合には、借地人は建物買取請求権を有しない。","pt":"建物買取請求は「期間満了で更新がない」とき（借地借家法13条）や第三者の取得時（14条）の権利。債務不履行解除では使えない（宅建H28出題）。","kw":["建物買取請求権","債務不履行","解除","地代不払","時価"]},{"n":"最判昭和35年9月20日","f":"借地期間が満了して更新されなかったため、Bは地主Aに建物買取請求権を行使した。Bは代金を受け取るまで建物の引渡しを拒み、その間も建物に住み続けて敷地を使っていた。","h":"建物買取請求権を行使した者は代金の支払まで建物の引渡しを拒めるが、その間に敷地を占有して得た地代相当額は不当利得として地主に返還しなければならない。","pt":"「引渡しを拒める」は○、「その間の地代相当額も支払わなくてよい」は×（宅建R04出題）。拒絶できることと無償で使えることは別。","kw":["建物買取請求権","引渡し拒絶","同時履行","不当利得","地代相当額"]},{"n":"最判昭和38年2月21日","f":"Bは地主Aから借りた土地に建物を建て、その建物をCに賃貸していた。その後AとBが借地契約を合意解除し、AはCに建物からの退去を求めた。","h":"土地賃貸借が合意解除されても、特別の事情がない限り、地主はその効果を地上建物の賃借人Cに対抗できない。","pt":"合意解除は第三者を害せない、という転貸借（613条3項）と同じ発想。債務不履行による解除であれば建物賃借人にも対抗できる点と対比される。","kw":["合意解除","借地上の建物","建物賃借人","対抗","特別の事情"]},{"n":"最判昭和40年5月4日","f":"借地権者Bは、借地上の自己所有建物に銀行Cのため抵当権を設定した。建物の使用状況に変化はなかったが、地主Aは借地権の無断譲渡に当たるとして解除を主張した。","h":"借地上の建物に設定された抵当権の効力は、従たる権利として敷地の借地権にも及び、競売で建物を買い受けた者は借地権も取得する。","pt":"抵当権設定だけでは占有が移らないので借地権の無断譲渡・転貸には当たらず、地主の承諾は不要とされる。ただし競売で建物を買った者への借地権の移転には地主の承諾か、借地借家法20条の裁判所の許可が必要。","kw":["抵当権","借地上の建物","従たる権利","無断譲渡","競売"]},{"n":"最判平成9年7月17日","f":"借地権者Bは、借地上の建物を債権者Cに譲渡担保として提供し、建物をCに引き渡してCが使用収益を始めた。地主Aは無断で借地権を譲渡・転貸したとして解除した。","h":"譲渡担保権者が建物の引渡しを受けて使用収益するときは、まだ担保権が実行されていなくても、敷地の賃借権の譲渡又は転貸に当たる。","pt":"抵当権設定（占有が移らない）と違い、譲渡担保で占有が移ると無断譲渡・転貸になる。ただし背信性がなければ解除できない点は残る。","kw":["譲渡担保","引渡し","使用収益","賃借権の譲渡","転貸"]},{"n":"最判平成6年10月25日","f":"地主Aは借地期間の満了時にBの更新請求に異議を述べ、立退料と引換えの土地明渡しを求めて提訴した。Aは訴訟の途中で立退料の額を増額して申し出た。","h":"正当事由を補完する立退料の提供・増額の申出は、信義に反するなどの事情がない限り、事実審の口頭弁論終結時までにされたものであれば考慮できる。","pt":"正当事由は地主・借地権者の土地使用の必要性が主で、立退料はそれを補完する要素（借地借家法6条）。立退料さえ払えば必ず更新拒絶できるわけではない。","kw":["正当事由","立退料","更新拒絶","異議","補完"]},{"n":"最判平成16年6月29日","f":"AとBは土地賃貸借で、3年ごとに消費者物価指数に応じて地代を改定し、指数が下がっても地代は減額しないと特約した。その後地価が下落し、Bは地代の減額を請求した。","h":"借地借家法11条1項は強行法規であり、特約によってその適用を排除できない。減額しない特約があっても借地権者は減額請求ができる（特約の存在は相当額の判断で考慮される）。","pt":"「一定期間増額しない特約」は有効だが、「減額しない特約」は減額請求を妨げない。借家の自動増額特約についての平成15年判例も同じ考え方。","kw":["地代","自動改定特約","減額しない特約","減額請求","強行法規"]}]},"権利|借家":{"pts":["建物賃貸借は登記がなくても建物の引渡しで対抗できる。普通借家・定期借家のいずれにも適用される。","期間1年未満の普通借家は期間の定めがないものとみなす。賃貸人からの解約申入れは正当事由が必要で、申入れから6か月で終了する。","期間満了の1年前から6か月前までに更新拒絶等の通知をしないと、従前と同一条件（期間の定めなし）で更新したものとみなす。","定期借家は書面（電磁的記録含む）で契約し、事前に契約書とは別の書面で更新がない旨を説明する必要がある（承諾を得て電磁的方法も可）。","期間1年以上の定期借家では、期間満了の1年前から6か月前までに終了の通知をしなければ終了を賃借人に対抗できない。","床面積200㎡未満の居住用定期借家で、やむを得ない事情により使用困難なら賃借人は解約申入れでき、1か月後に終了する。","造作買取請求権は特約で排除できる。居住用建物の賃借人が相続人なく死亡したときは同居の事実上の配偶者等が承継する。"],"traps":["「定期建物賃貸借は公正証書でしなければならない」と出たら×。書面又は電磁的記録で足りる。","「造作買取請求権を排除する特約は無効」と出たら×。造作買取請求権の規定は任意規定で、排除特約は有効。","「定期借家でも賃料減額請求権は排除できない」と出たら×。賃料改定特約があれば借賃増減請求の規定は適用されない。"],"rel":["権利|借地","権利|賃貸借","業法|重要事項説明"],"bridge":"借家は建物の引渡しで対抗力を得るが、借地は建物登記が必要。定期借家の事前説明は賃貸人の義務で、宅建業者の重要事項説明とは別物（業者が代理する場合は兼ねられる）。","sys":{"overview":"借地借家法の建物賃貸借部分で、民法の賃貸借を修正し借家人を保護する。引渡しによる対抗力、更新拒絶と正当事由、解約申入れの期間、定期借家の要件と中途解約が得点源。","tree":[{"h":"適用・対抗","items":["建物の賃貸借全般に適用（一時使用除く）","引渡しで第三者に対抗（普通・定期共通）","譲受人には敷金返還債務も承継"]},{"h":"期間・更新","items":["1年未満の期間は定めなしとみなす","期間満了1年前〜6か月前に更新拒絶通知","通知なし→同一条件で法定更新（期間なし）","満了後の使用継続に遅滞なく異議が必要"]},{"h":"解約申入れ","items":["賃貸人から：正当事由要・6か月で終了","賃借人から：民法により3か月で終了","正当事由は立退料の申出で補完される"]},{"h":"定期借家","items":["書面又は電磁的記録で契約","契約書とは別の書面で事前説明","1年以上：1年前〜6か月前に終了通知","200㎡未満居住用はやむを得ず中途解約可","賃料改定特約で増減請求を排除可"]},{"h":"その他の保護","items":["造作買取請求（特約で排除可）","相続人なし→事実上の配偶者等が承継","転借人：原賃貸借終了の通知後6か月","取壊し予定建物：取壊し時終了特約（書面）"]}],"flow":{"title":"更新拒絶〜明渡し","steps":["期間満了1年前〜6か月前に通知","賃貸人の通知には正当事由が必要","通知なし・正当事由なし→法定更新","満了後の使用継続→遅滞なく異議","終了→造作買取請求（排除特約なし時）","明渡し後に敷金を精算・返還"]},"tables":[{"title":"普通借家と定期借家","head":["項目","普通借家","定期借家"],"rows":[["契約方式","制限なし","書面・電磁的記録"],["事前説明書面","不要","必要（別書面）"],["1年未満の期間","定めなしとみなす","有効"],["更新","あり（正当事由）","なし"],["賃料減額しない特約","無効","有効"],["賃借人の中途解約","特約による","200㎡未満居住用は可"]]},{"title":"借家の期間・数字","head":["場面","期間"],"rows":[["更新拒絶・終了通知","満了1年前〜6か月前"],["賃貸人の解約申入れ","6か月後に終了"],["賃借人の解約申入れ","3か月後に終了"],["定期借家の中途解約","申入れ1か月後に終了"],["遅れた終了通知","通知から6か月後に対抗可"],["転借人への終了通知","通知から6か月後に終了"]]},{"title":"特約の有効・無効","head":["特約","効力"],"rows":[["造作買取請求権の排除","有効"],["一定期間増額しない","有効"],["減額しない（普通借家）","無効"],["賃料改定特約（定期借家）","有効"],["正当事由なく更新しない","無効（普通借家）"]]}]},"ex":[{"t":"通知なしで法定更新","s":"AはBに建物を2024年4月1日から期間2年で賃貸した。Aは2025年4月1日〜10月1日の間に更新拒絶の通知をせず、2026年4月1日の満了後もBは住み続けている。","p":"期間満了の1年前から6か月前までに通知がないので、従前と同一条件で更新され、期間は定めのないものとなる（26条）。以後Aが終わらせるには正当事由ある解約申入れが必要で、申入れから6か月で終了する。","kw":["更新拒絶","1年前から6か月前","法定更新","期間の定めのない","正当事由"]},{"t":"別書面の説明を欠く","s":"AはBと期間3年の定期建物賃貸借契約書を作成したが、契約前に「更新がなく期間満了で終了する」旨を記載した書面を別に交付して説明しなかった。","p":"契約書とは別の書面による事前説明がないと、更新がない旨の定めは無効となり、普通建物賃貸借として扱われる（38条）。契約書自体は公正証書でなくても書面・電磁的記録であればよい。","kw":["定期建物賃貸借","書面","説明","更新がない","公正証書"]},{"t":"転勤で中途解約","s":"Bは床面積60㎡の居住用マンションを期間4年の定期借家で借りていたが、2年目に会社から遠方への転勤を命じられ、住み続けられなくなった。契約に中途解約の特約はない。","p":"床面積200㎡未満の居住用で、転勤などやむを得ない事情があるので、Bは解約を申し入れることができ、申入れから1か月で終了する（38条）。賃借人に不利な方向でこの規定を変える特約は無効。","kw":["定期建物賃貸借","200㎡未満","居住用","転勤","1か月"]}],"around":[{"h":"終了通知の期間","b":"期間1年以上の定期借家では、満了の1年前から6か月前までに終了を通知しないと終了を対抗できない。遅れて通知すれば、通知から6か月後に対抗できる。"},{"h":"造作買取請求","b":"賃貸人の同意を得て付加した造作は、終了時に時価で買取請求できる。ただし任意規定なので排除特約は有効。"},{"h":"賃料増減の特約","b":"普通借家では「増額しない」特約のみ有効で、減額しない特約は無効。定期借家では賃料改定特約があれば増減請求の規定が排除される。"},{"h":"解約申入れの期間","b":"期間の定めがない借家は、賃貸人から申し入れれば正当事由が必要で6か月後、賃借人から申し入れれば民法により3か月後に終了する。"},{"h":"居住用の承継","b":"居住用建物の賃借人が相続人なく死亡すると、同居の事実上の夫婦・養親子が権利義務を承継する。死亡を知った後1か月以内に反対の意思表示をすれば承継しない。"}],"cases":[{"n":"最判昭和46年11月25日","f":"賃貸人Aは自ら建物を使用する必要があるとして、賃借人Bに解約を申し入れ、相当額の立退料の支払と引換えに明渡しを求めた。Aの必要性だけでは正当事由として十分とはいえない事案だった。","h":"立退料の提供は正当事由を補完するものとして考慮でき、申出額と大きく違わない範囲で裁判所が定める立退料の支払と引換えに明渡しを命じることができる。","pt":"現在は借地借家法28条で「財産上の給付をする旨の申出」として明文化。立退料は正当事由の補完要素で、それだけで正当事由になるわけではない。","kw":["正当事由","立退料","解約申入れ","補完","引換え"]},{"n":"最判平成3年3月22日","f":"賃貸人Aは立退料100万円を申し出て建物賃貸借の解約を申し入れ、その後の訴訟の最終段階で立退料を300万円に増額すると申し出た。","h":"解約申入れ後にされた立退料の提供・増額の申出も、解約申入れ時の正当事由を判断する際に参酌できる。本件では300万円の立退料で正当事由が具備され、申入れから6か月で契約は終了した。","pt":"解約申入れから6か月で終了（27条）という起算点は変わらない。立退料を後から増額しても、申入れ時にさかのぼって正当事由の判断材料になる点がポイント。","kw":["解約申入れ","立退料","増額","正当事由","6か月"]},{"n":"最判昭和44年7月17日","f":"Bは敷金を預けてAから建物を借りて引渡しを受けていたが、賃料を一部滞納していた。その後Aは建物をCに売却し、賃貸人の地位がCに移った。","h":"賃貸中の建物の所有権が移転し賃貸人の地位が承継されると、敷金は旧賃貸人に対する未払賃料に当然充当され、その残額についての権利義務が新賃貸人に承継される。","pt":"現在は605条の2第4項で敷金返還債務の新賃貸人への承継が明文化（未払賃料への当然充当は条文になく、本判例による）。「全額がそのまま承継される」ではなく「未払賃料に充当した残額」が承継されると押さえる（宅建R03出題）。","kw":["敷金","賃貸人の地位","承継","未払賃料","充当"]},{"n":"判例（最高裁）","f":"Bは賃貸人Aの同意を得て建物に造作を付加していた。ところがBが賃料を滞納したため、Aは債務不履行を理由に賃貸借契約を解除した。Bは造作を時価で買い取るよう請求した。","h":"賃借人の債務不履行により賃貸借が解除された場合には、造作買取請求権は認められない。","pt":"造作買取請求（借地借家法33条）は期間満了・解約申入れで終了したときの権利。借地の建物買取請求と同じく、債務不履行解除では使えない（宅建H27出題）。","kw":["造作買取請求権","債務不履行","解除","賃料不払","同意"]},{"n":"判例（最高裁）","f":"賃貸借が期間満了で終了し、Bは賃貸人Aに造作買取請求権を行使した。Bは造作代金の支払を受けるまで建物を明け渡さないと主張した。","h":"造作買取代金債権は造作に関して生じた債権で建物に関して生じた債権ではないので、賃借人はこれを理由に建物の明渡しを拒めない（同時履行の抗弁・留置権とも否定）。","pt":"借地の建物買取請求では建物の引渡しを拒めるのと対照的。造作は建物の付属物にすぎないので、建物全体の明渡しは拒めない。","kw":["造作買取請求権","同時履行","留置権","明渡し","造作代金"]},{"n":"最判平成24年9月13日","f":"AはBと定期建物賃貸借契約を結んだ。Aは事前に更新がない旨を説明したと主張したが、交付したのは契約書だけで、契約書とは別の説明書面は交付していなかった。","h":"借地借家法38条の説明書面は、賃借人が契約書の内容とは別に更新がないことを認識できるよう、契約書とは別個独立の書面であることを要する。これを欠けば更新がない旨の定めは無効となる。","pt":"現在は38条3項・4項で事前説明書面の交付（承諾を得れば電磁的方法も可）を規定。「契約書に明記して説明すれば足りる」は×で、普通借家として扱われる。","kw":["定期建物賃貸借","説明書面","別個独立","更新がない","無効"]},{"n":"最判平成15年10月21日","f":"不動産会社BはビルオーナーAから建物を一括して借り上げて転貸する、いわゆるサブリース契約を結び、賃料を一定期間ごとに増額する特約を定めた。その後賃料相場が大きく下落し、BはAに賃料減額を請求した。","h":"サブリース契約も建物の賃貸借であり借地借家法32条が適用される。同条1項は強行法規なので、賃料自動増額特約があっても賃借人は減額請求できる。","pt":"普通借家では「減額しない特約」があっても減額請求できる。一方、定期借家で賃料改定特約を定めれば32条は適用されない（38条9項）点との対比が狙われる。","kw":["サブリース","賃料減額請求","自動増額特約","強行法規","32条"]},{"n":"最判平成14年3月28日","f":"ビルオーナーAは、転貸を予定したサブリース業者Bにビルを一括賃貸し、BはAの承諾を得てテナントCに転貸した。その後Bが更新拒絶をしたため、AとBの賃貸借は期間満了で終了し、AはCに明渡しを求めた。","h":"Aは転貸による運用を当然の前提として賃貸し、転貸を当初から承諾していた事情から、信義則上、原賃貸借の終了をCに対抗できない。","pt":"条文の原則は、借家の期間満了等で原賃貸借が終われば、転借人に通知して6か月後に転貸借も終了する（借地借家法34条）。本判例はサブリース事案での例外。","kw":["サブリース","転借人","期間満了","信義則","対抗"]},{"n":"最判昭和42年2月21日","f":"借家人Aが死亡し、Aと同居していた内縁の妻Bがそのまま住み続けた。Aには別に相続人Cがいた。賃貸人DはBに明渡しを求めた。","h":"内縁の妻は、相続人が承継した賃借権を援用して賃貸人に居住を主張できる。ただし相続人と並ぶ共同賃借人になるわけではない。","pt":"相続人がいれば賃借権は相続人が承継する（判例による保護）。相続人がいないときに限り、同居の事実上の配偶者が賃借権を承継する（借地借家法36条）。","kw":["内縁の妻","相続人","賃借権の援用","居住","事実上の夫婦"]}]},"権利|区分所有法":{"pts":["共用部分は区分所有者全員の共有に属し、各共有者の持分は規約に別段の定めがない限り専有部分の床面積の割合による。","共用部分の保存行為は各共有者が単独でできる。負担は規約に別段の定めがない限り持分に応じて負う。","規約で管理者を共用部分の所有者（管理所有）とできる。管理者は少なくとも毎年1回集会を招集しなければならない。","規約・集会決議は区分所有者の特定承継人にも効力を生じ、占有者も建物等の使用方法について区分所有者と同一の義務を負う。","規約の設定・変更・廃止は集会の特別決議による。一部の区分所有者の権利に特別の影響を及ぼすときはその者の承諾が必要。","最初に専有部分の全部を所有する者は、公正証書で規約共用部分・規約敷地・敷地利用権の分離処分等に関する規約を設定できる。","議事録には議長及び集会に出席した区分所有者2人が署名する。招集手続は区分所有者全員の同意があれば省略できる。"],"traps":["「分譲業者は公正証書で法定共用部分を定める規約を設定できる」と出たら×。公正証書で設定できるのは規約共用部分等の一定事項のみ。","「集会の決議は買主など特定承継人には及ばない」と出たら×。規約・集会決議は特定承継人にも効力を生ずる。","「共用部分の持分は専有部分の価格の割合による」と出たら×。原則は床面積割合（内法で計算）で、規約で別段の定めも可。"],"rel":["権利|共有・相隣","業法|重要事項説明"],"bridge":"共用部分の管理には民法の共有規定でなく区分所有法の集会決議が適用される。区分所有建物の売買では、規約の定め（専用使用権・管理費等）が重要事項説明の追加項目になる。","sys":{"overview":"民法の共有の特別法で、マンションの専有部分・共用部分・敷地と管理組合運営を定める。2026年4月施行の改正で集会決議は原則「出席者の多数決」（定足数あり）となり、所在等不明者の除外や建替え要件の緩和が入った。決議要件の数字が得点源。","tree":[{"h":"専有・共用","items":["専有部分：構造上・利用上独立した部分","法定共用部分：廊下・階段室等","規約共用部分：集会室等、登記で対抗","持分は専有部分の床面積割合（内法）"]},{"h":"共用部分の管理","items":["保存行為：各共有者が単独で可","管理行為：出席者の過半数（普通決議）","重大な変更：出席者の3/4（人数は規約で減可）","耐震・外壁・配管・バリアフリー等は出席者の2/3","費用負担・収益は持分に応じる"]},{"h":"敷地・分離処分","items":["専有部分と敷地利用権の分離処分は原則禁止","規約で分離処分を可能にできる","最初の全部所有者は公正証書で一定の規約"]},{"h":"規約","items":["設定・変更・廃止は出席者の3/4","特別の影響を受ける者の承諾が必要","特定承継人にも効力、占有者も使用方法拘束","管理者等が保管し、利害関係人は閲覧可"]},{"h":"管理者・集会","items":["管理者は毎年1回以上集会を招集","1/5以上で招集請求（規約で減可）","通知は1週間前（建替えは2か月前）","通知には全ての議案の要領を示す","定足数：区分所有者・議決権の各過半数の出席","全員同意で招集手続を省略可","議事録：議長＋出席者2人が署名"]},{"h":"義務違反・建替え","items":["停止請求の訴え：普通決議","使用禁止・競売等：出席者の3/4＋弁明の機会","建替え：全体の4/5（一定の事由で3/4）","大規模滅失の復旧：出席者の2/3（2026年4月改正）","所在等不明者は裁判所の決定で母数から除外"]}],"flow":{"title":"集会の招集〜議事録","steps":["管理者が招集（毎年1回以上）","1/5以上の請求でも招集","会日の1週間前までに通知","全員同意なら招集手続を省略可","定足数（各過半数の出席）を満たし決議","議長＋出席者2人が議事録に署名"]},"tables":[{"title":"主な決議要件","head":["事項","決議要件","規約で別段"],"rows":[["共用部分の管理","出席者の過半数","○"],["共用部分の重大変更","出席者の3/4（一定事由2/3）","人数のみ過半数まで減"],["規約の設定・変更・廃止","出席者の3/4","×"],["管理組合法人の設立","出席者の3/4","×"],["使用禁止・競売請求","出席者の3/4","×"],["大規模滅失の復旧","出席者の2/3","×"],["建替え","全体の4/5（一定事由3/4）","×"]]},{"title":"集会の数字","head":["項目","内容"],"rows":[["決議の定足数","区分所有者・議決権の各過半数の出席"],["定期集会","毎年1回以上"],["少数区分所有者の招集請求","1/5以上（規約で減可）"],["招集通知","1週間前（規約で伸長のみ可）"],["招集通知の記載","全議案の要領を示す"],["建替え決議の通知","2か月前（規約で伸長のみ）"],["建替えの説明会","会日の1か月前まで"],["議事録の署名","議長＋出席者2人"]]},{"title":"単独・集会・承諾の区別","head":["行為","方法"],"rows":[["共用部分の保存行為","各自単独"],["小規模滅失の復旧","決議前は各自単独可"],["規約変更で特別の影響","その者の承諾必要"],["招集手続の省略","区分所有者全員の同意"],["書面・電磁的方法の決議","全員の承諾が必要"],["所在等不明区分所有者","裁判所の決定で母数から除外"]]}]},"ex":[{"t":"規約変更は出席者の3/4","s":"区分所有者40人（議決権も各1で同じ）のマンションで、ペット飼育を禁止する規約変更を集会で決議する。当日の出席は22人だった。","p":"2026年4月施行の改正で、規約の変更は定足数（区分所有者・議決権の各過半数＝21人）を満たせば、出席者及びその議決権の各3/4以上で決議できる。22人の3/4は16.5なので17人以上の賛成が必要。現に犬を飼う区分所有者など特別の影響を受ける者がいればその承諾も要る（31条）。","kw":["規約の変更","4分の3","出席","定足数","特別の影響"]},{"t":"不明者を除いて建替え","s":"区分所有者50人（議決権も同じ）の築50年のマンションで、5人が長年所在不明。耐震性が不足していることが判明し、建替えを検討している。","p":"裁判所の決定を受ければ所在等不明区分所有者を決議の母数から除け、45人が基準になる。建替え決議は原則として全体の4/5以上だが、耐震性不足などの事由があれば3/4以上に緩和されるので、45人の3/4＝33.75人→34人以上の賛成で足りる。","kw":["建替え決議","所在等不明区分所有者","裁判所","5分の4","4分の3"]},{"t":"買主・賃借人への効力","s":"区分所有者Aは管理費を6か月分滞納したまま、住戸をBに売却した。Bはさらにこの住戸をCに賃貸した。規約ではベランダでの喫煙が禁止されている。","p":"規約・集会決議は特定承継人Bにも効力を生じ、管理組合は滞納管理費をAだけでなくBにも請求できる（8条）。占有者Cは規約の当事者ではないが、建物の使用方法については区分所有者と同一の義務を負い、喫煙禁止に従う（46条）。","kw":["特定承継人","占有者","管理費","規約","使用方法"]}],"around":[{"h":"変更決議の2/3特例","b":"共用部分の重大な変更は出席者の3/4が原則だが、耐震性不足・外壁剥落のおそれ・給排水管の腐食・バリアフリー化など一定の事由があれば出席者の2/3で足りる（2026年4月施行）。"},{"h":"大規模滅失の復旧","b":"建物価格の1/2を超える一部滅失の復旧決議は、改正により出席者の3/4から2/3に引き下げられた。小規模滅失なら決議前に各自が単独で復旧できる。"},{"h":"招集通知の期間","b":"集会の招集通知は会日の少なくとも1週間前に発し、全議案の要領を示す。改正後は規約で伸長はできるが短縮はできない。建替え決議は2か月前、説明会は1か月前まで。"},{"h":"管理者の報告","b":"管理者は集会で毎年1回一定の時期に事務の報告をし、少なくとも毎年1回集会を招集する。任期について区分所有法に上限の定めはない。"},{"h":"議事録と書面決議","b":"議事録には議長と出席した区分所有者2人が署名する。全員の承諾があれば集会を開かず書面・電磁的方法で決議できる。"}]},"権利|不動産登記法":{"pts":["表示に関する登記は1か月以内の申請義務がある（新築建物の表題登記、建物の滅失登記など）。登記官は職権でもできる。","権利に関する登記は登記権利者と登記義務者の共同申請が原則。判決・相続・合併・相続人への遺贈は単独申請できる。","相続登記は2024年4月から義務化。相続による取得を知った日から3年以内に申請が必要で、正当な理由なく怠ると過料の対象となる。","申請期限内に相続人である旨を申し出る相続人申告登記により、相続登記の申請義務を履行したものとみなされる。","所有権の登記名義人の住所・氏名の変更登記も2026年4月から義務化され、変更日から2年以内に申請しなければならない。","共同申請では登記義務者の登記識別情報の提供が必要。資格者代理人による申請でも、提供できない正当な理由がない限り省略できない。","所有権登記名義人等が異なる土地や、地目・地番区域が異なる土地は合筆できない。分筆は原則として申請によりできる。"],"traps":["「相続人以外への遺贈による所有権移転登記は受遺者が単独で申請できる」と出たら×。単独申請は相続人への遺贈に限る。","「権利に関する登記には一般に申請義務がない」と出たら要注意。相続登記・住所等変更登記は申請義務がある。","「建物の合併の登記は抵当権者も申請できる」と出たら×。申請人は表題部所有者又は所有権の登記名義人に限られる。"],"rel":["権利|物権変動・対抗","権利|相続"],"bridge":"物権変動の対抗要件が登記で、不動産登記法はその申請手続を定める。相続の効果は民法、相続登記の申請義務と期限は不動産登記法と分けて押さえる。","sys":{"overview":"民法の物権変動の対抗要件である登記の手続法。表示登記と権利登記の区別、共同申請と単独申請の例外、相続登記・住所等変更登記の申請義務、合筆・分筆の制限が得点源。","tree":[{"h":"登記簿の構成","items":["表題部：物理的現況（所在・地目・床面積等）","権利部甲区：所有権に関する事項","権利部乙区：所有権以外の権利（抵当権等）","何人も手数料で登記事項証明書を請求可"]},{"h":"表示に関する登記","items":["表題登記・滅失登記等は1か月以内に申請","登記官は職権でも登記できる","一部地目変更の土地は職権で分筆可","合筆制限：所有者・地目・地番区域の相違"]},{"h":"権利に関する登記","items":["原則は共同申請（権利者＋義務者）","単独：判決・相続・合併・相続人への遺贈","買戻し特約は10年経過で権利者単独抹消","仮登記は義務者の承諾があれば単独可"]},{"h":"申請義務","items":["相続登記：知った日から3年以内","相続人申告登記で義務履行とみなす","住所・氏名変更：変更日から2年以内","正当な理由なく怠ると過料","施行前の住所変更は2028年3月末までに申請"]},{"h":"添付情報","items":["登記原因証明情報","登記義務者の登記識別情報（代理でも要）","提供不可→事前通知か本人確認情報","所有権登記義務者は印鑑証明書（書面申請）"]}],"flow":{"title":"権利の登記申請の流れ","steps":["登記原因（売買・相続等）が発生","申請方式を判断（共同か単独か）","申請情報と添付情報を準備","書面又はオンラインで登記所に申請","登記官が審査し登記を実行","新名義人に登記識別情報を通知"]},"tables":[{"title":"申請義務と期限","head":["登記","期限","義務違反"],"rows":[["土地・建物の表題登記","1か月以内","過料"],["建物の滅失登記","1か月以内","過料"],["地目・床面積等の変更","1か月以内","過料"],["相続による所有権移転","知った日から3年","10万円以下の過料"],["住所・氏名の変更","変更日から2年","5万円以下の過料"],["売買等の所有権移転","義務なし","―"]]},{"title":"単独申請できる登記","head":["登記","単独申請"],"rows":[["相続・法人の合併","○"],["相続人への遺贈","○"],["相続人以外への遺贈","×（共同申請）"],["判決による登記","○"],["登記名義人の住所等変更","○"],["10年経過後の買戻し特約抹消","○"],["仮登記（義務者の承諾書）","○"]]},{"title":"合筆・分筆の可否","head":["状況","合筆","分筆"],"rows":[["所有者が異なる","×","―"],["地目・地番区域が異なる","×","―"],["所有権以外の権利登記あり","原則×","○"],["一部が別地目になった","―","職権でも可"]]}]},"ex":[{"t":"相続登記は3年以内","s":"Aが2026年5月10日に死亡し、同居の子Bと別居の子Cが土地を相続した。Bは当日、Cは6月1日に死亡と土地の存在を知った。遺産分割協議はなかなかまとまらない。","p":"各相続人は自己のために相続開始があり取得を知った日から3年以内（Bは2029年5月10日、Cは2029年6月1日まで）に相続登記を申請する義務がある。期限内に相続人申告登記をすれば義務を果たしたとみなされ、後に遺産分割で取得したらその日から3年以内に登記する。","kw":["相続登記","知った日から3年","相続人申告登記","遺産分割","過料"]},{"t":"住所変更は2年以内","s":"土地の所有権登記名義人Aは2026年7月1日に引っ越した。Bは2025年9月に引っ越したが、住所変更登記をしていない。","p":"2026年4月施行で、Aは変更日から2年以内（2028年7月1日まで）に住所変更登記を申請する義務を負う。施行前に変更したBも対象で、2028年3月31日までに申請が必要。正当な理由なく怠ると5万円以下の過料の対象。","kw":["住所","変更の登記","2年以内","義務化","過料"]},{"t":"表題登記と保存登記","s":"Aは2026年6月に自宅を新築して所有権を取得した。その後、2027年に増築して床面積が増えた。","p":"新築建物の表題登記は取得日から1か月以内、増築による床面積の変更登記も変更日から1か月以内に申請義務がある。一方、所有権保存登記は権利の登記で申請義務はない（相続登記・住所変更登記は例外的に義務あり）。","kw":["表題登記","1か月以内","所有権の保存の登記","床面積","表示に関する登記"]}],"around":[{"h":"遺贈と単独申請","b":"相続人への遺贈による所有権移転登記は受遺者が単独で申請できるが、相続人以外への遺贈は遺言執行者又は相続人との共同申請が必要。"},{"h":"スマート変更登記","b":"所有権登記名義人が検索用情報（生年月日等）を申し出ておけば、登記官が住基ネット情報から職権で住所等の変更登記を行い、申請義務違反に問われない。"},{"h":"登記識別情報","b":"共同申請では登記義務者の登記識別情報の提供が必要で、司法書士など資格者代理人が申請する場合でも原則省略できない。提供できなければ事前通知や本人確認情報で代える。"},{"h":"合筆できない土地","b":"所有権の登記名義人が異なる土地、地目・地番区域が異なる土地、所有権の登記がある土地とない土地は合筆できない。"},{"h":"職権での分筆","b":"一筆の土地の一部が別の地目になり、又は地番区域を異にするに至ったときは、所有者からの申請がなくても、登記官は職権で分筆の登記をしなければならない（39条2項）。"}]},"権利|相続":{"pts":["法定相続分は、配偶者と子で各1/2、配偶者と直系尊属で2/3と1/3、配偶者と兄弟姉妹で3/4と1/4。","代襲原因は相続開始以前の死亡・欠格・廃除で、相続放棄は含まれない。子の系統は再代襲あり、兄弟姉妹は甥・姪までで再代襲なし。","相続放棄・限定承認は自己のために相続開始を知った時から3か月以内に家庭裁判所に申述する。限定承認は共同相続人全員で行う。","遺留分は兄弟姉妹以外に認められ、総体的遺留分は直系尊属のみが相続人なら1/3、それ以外は1/2。侵害額は金銭で請求する。","遺留分の放棄は相続開始前でも家庭裁判所の許可で可能だが、相続放棄は相続開始前にはできない。遺留分放棄後も相続人の地位は残る。","自筆証書遺言は全文・日付・氏名を自書し押印するが、財産目録は自書不要（各頁に署名押印）。法務局で保管すれば検認不要。","配偶者居住権は遺産分割・遺贈等で取得し、期間の定めがなければ終身。遺言で5年を超えない期間で遺産分割を禁止できる。"],"traps":["「相続放棄をした者の子が代襲相続する」と出たら×。相続放棄は代襲原因にならない。","「兄弟姉妹にも遺留分がある」と出たら×。遺留分は兄弟姉妹以外の相続人にのみ認められる。","「遺留分を放棄した者は相続人でなくなる」と出たら×。遺留分を放棄しても相続はでき、相続放棄とは別の制度。"],"rel":["権利|不動産登記法","権利|物権変動・対抗","税他|所得税・譲渡"],"bridge":"相続で取得した不動産は3年以内の相続登記が義務で、法定相続分を超える取得は登記がなければ第三者に対抗できない。譲渡所得では相続人が被相続人の取得費・取得時期を引き継ぐ。","sys":{"overview":"民法第5編の相続法で、相続人と相続分、承認・放棄、遺産分割、遺言、遺留分、配偶者居住権からなる。法定相続分と遺留分の数字、代襲の可否、期間制限を押さえれば得点できる。","tree":[{"h":"相続人","items":["配偶者は常に相続人","第1順位子→第2直系尊属→第3兄弟姉妹","代襲原因：死亡・欠格・廃除（放棄は×）","子は再代襲あり、兄弟姉妹は甥姪まで"]},{"h":"相続分","items":["配偶者と子：1/2ずつ","配偶者と直系尊属：2/3と1/3","配偶者と兄弟姉妹：3/4と1/4","半血の兄弟姉妹は全血の1/2"]},{"h":"承認・放棄","items":["知った時から3か月以内に選択","放棄・限定承認は家庭裁判所に申述","限定承認は共同相続人全員で","財産処分・期間経過で単純承認とみなす","相続開始前の放棄はできない"]},{"h":"遺産分割","items":["協議→調停→審判","効力は相続開始時に遡る","遺言で5年以内の分割禁止可","開始10年後は原則法定相続分で分割"]},{"h":"遺言","items":["15歳以上で作成可、いつでも撤回可","自筆：全文・日付・氏名自書＋押印","財産目録は自書不要（各頁署名押印）","公正証書・法務局保管の自筆は検認不要"]},{"h":"遺留分・居住権","items":["兄弟姉妹以外、全体で1/2（尊属のみ1/3）","侵害額は金銭で請求（1年・10年）","開始前の遺留分放棄は家裁許可で可","配偶者居住権：定めなければ終身","配偶者短期居住権：最低6か月"]}],"flow":{"title":"相続開始〜登記・遺留分","steps":["被相続人の死亡で相続開始","相続人・遺産・遺言の有無を調査","3か月内に承認・限定承認・放棄","遺言があれば検認（不要な方式あり）","遺産分割協議（不調なら調停・審判）","知った日から3年内に相続登記","侵害があれば遺留分侵害額請求"]},"tables":[{"title":"法定相続分と遺留分","head":["相続人","法定相続分","個別の遺留分"],"rows":[["配偶者のみ","全部","1/2"],["配偶者＋子","1/2・1/2","1/4・1/4"],["配偶者＋直系尊属","2/3・1/3","1/3・1/6"],["配偶者＋兄弟姉妹","3/4・1/4","1/2・なし"],["子のみ","全部","1/2"],["直系尊属のみ","全部","1/3"],["兄弟姉妹のみ","全部","なし"]]},{"title":"相続放棄と遺留分放棄","head":["項目","相続放棄","遺留分放棄"],"rows":[["開始前","×","○（家裁の許可）"],["開始後","3か月内に家裁へ申述","自由（意思表示）"],["相続人の地位","初めから相続人でない","相続人のまま"],["代襲相続","生じない","―"],["他の相続人への影響","相続分が増える","増えない"]]},{"title":"遺言の方式","head":["項目","自筆証書","公正証書"],"rows":[["作成者","本人が自書","公証人"],["証人","不要","2人以上"],["検認","必要（法務局保管は不要）","不要"],["財産目録","自書不要（署名押印）","―"]]}]},"ex":[{"t":"相続分と遺留分の計算","s":"Aが遺産1億2,000万円を残して死亡した。相続人は配偶者Bと子C・Dの3人。Aは「全財産を友人Eに遺贈する」との遺言を残していた。","p":"法定相続分はB1/2（6,000万円）、C・D各1/4（3,000万円）。遺留分は全体で1/2なので、B1/4（3,000万円）、C・D各1/8（1,500万円）をEに金銭で請求できる（1042条・1046条）。","kw":["法定相続分","遺留分","1/2","遺贈","遺留分侵害額"]},{"t":"放棄は代襲しない","s":"Aが死亡し、子はB・C・D。Bは家庭裁判所で相続を放棄し、CはAより先に死亡、DはAの遺言書を偽造して相続欠格となった。B・C・Dにはそれぞれ子b・c・dがいる。","p":"代襲原因は相続開始以前の死亡・欠格・廃除なので、cとdは代襲相続人になるが、放棄したBの子bは代襲しない（887条）。相続人はc・dで各1/2。","kw":["代襲相続","相続放棄","相続欠格","死亡","廃除"]},{"t":"配偶者居住権の性質","s":"Aが死亡し、配偶者Bは遺産分割で自宅の配偶者居住権を、子Cは自宅の所有権を取得した。存続期間は定めなかった。Bは自宅の一室を他人に貸したいと考えている。","p":"期間の定めがなければ終身となるが、第三者に使用・収益させるには所有者Cの承諾が必要。配偶者居住権は譲渡できず、Bの死亡で消滅し相続されない（1030条・1032条・1036条）。","kw":["配偶者居住権","終身","承諾","譲渡","相続されない"]}],"around":[{"h":"兄弟姉妹の相続","b":"配偶者と兄弟姉妹が相続人なら3/4と1/4。兄弟姉妹には遺留分がなく、代襲は甥・姪までで再代襲はない。"},{"h":"相続登記の義務","b":"相続で不動産を取得したと知った日から3年以内に相続登記を申請する義務がある（2024年4月施行）。法定相続分を超える取得分は登記がなければ第三者に対抗できない。"},{"h":"遺留分請求の期限","b":"遺留分侵害額請求権は、相続開始と侵害する贈与・遺贈を知った時から1年、相続開始から10年で行使できなくなる。"},{"h":"相続土地国庫帰属","b":"相続・遺贈（相続人へのもの）で取得した土地は、法務大臣の承認を受け、10年分の管理費相当の負担金を納めて国に引き取ってもらえる。建物がある土地などは対象外。"},{"h":"遺産分割の10年","b":"相続開始から10年を経過すると、特別受益・寄与分を考慮した具体的相続分の主張は原則できず、法定相続分（指定相続分）で分割する。"}],"cases":[{"n":"最判平成17年9月8日","f":"Aが賃貸マンションを残して死亡し、子B・Cが共同相続した。遺産分割が成立するまでの間に入居者から賃料が入り、その後の遺産分割でマンションはBが取得することになった。Bは「分割の効力は相続開始時にさかのぼるから、分割前の賃料も全部自分のものだ」と主張した。","h":"遺産分割前に相続不動産から生じた賃料債権は遺産とは別個の財産で、各共同相続人が相続分に応じた分割単独債権として確定的に取得する。後の遺産分割の遡及効の影響を受けない。","pt":"「分割で不動産を取得した相続人が分割前の賃料もすべて取得する」「清算が必要」と出たら×。遺産分割の遡及効（909条本文）が及ばない代表例。","kw":["遺産分割前","賃料債権","相続分に応じて","確定的に取得","遡及効"]},{"n":"最判昭和37年6月21日","f":"Aが死亡し、子Cが相続人となった。Cは、Aが賃貸していた建物の賃借人に対して未払賃料の支払を請求し、これを受け取った。その後Cは、Aに多額の借金があることが分かり相続放棄をしようとした。","h":"相続債権を取り立てて収受することは相続財産の「処分」（921条1号）に当たり、Cは単純承認をしたものとみなされる。","pt":"不法占拠者への明渡請求のような保存行為は処分に当たらず単純承認にならない。「取立て・受領」は処分、「明渡請求」は保存行為と区別して覚える。","kw":["単純承認","処分","賃料","取立て","保存行為"]},{"n":"最判昭和42年4月27日","f":"Aが家出して行方不明になった。子Bは、Aの死亡を知らないまま、A所有の物件を自分が設立した会社に使用させるなどした。後にAの遺体が発見され、家出当夜に死亡していたことが分かった。","h":"921条1号の処分で単純承認とみなされるには、相続人が自己のために相続が開始した事実を知りながら処分したか、少なくとも被相続人の死亡を確実に予想しながらあえて処分したことが必要。本件では単純承認とみなされない。","pt":"「相続財産を処分すれば、相続開始を知らなくても単純承認とみなされる」と出たら×。処分による法定単純承認には相続開始の認識（または確実な予想）が必要。","kw":["法定単純承認","処分","相続開始を知りながら","死亡","921条"]},{"n":"最判昭和59年4月27日","f":"Aが死亡し、子Bらは死亡の事実と自分が相続人であることを知っていたが、Aには財産も借金もないと信じていた。1年近く後、Aが連帯保証債務を負っていたことを知らされ、Bらはすぐに相続放棄の申述をした。","h":"熟慮期間（915条1項）は原則として相続開始の原因事実と自分が相続人となった事実を知った時から進行するが、相続財産が全く存在しないと信じ、そう信じたことに相当な理由がある場合は、相続財産の全部または一部の存在を認識した時（または通常認識できた時）から起算する。","pt":"熟慮期間3か月の起算点は「相続開始の時」ではなく「自己のために相続の開始があったことを知った時」。この判例はさらに例外的に起算点を遅らせた。","kw":["熟慮期間","3か月","知った時","相続放棄","相続財産の存在"]},{"n":"最判昭和44年10月30日","f":"AがBに甲建物を賃貸し引き渡した後、Bが死亡し、子Dが単独で相続した。Dは遠方に住んでいて、しばらくBの死亡を知らなかった。","h":"被相続人の死亡によって、その占有に属していたものは、特段の事情のない限り当然に相続人の占有に移る。相続人が相続開始を知っているかどうかは問わない。","pt":"「相続人は相続開始を知るまで占有を承継しない」と出たら×。占有も相続開始と同時に当然承継される（取得時効の占有の承継にもつながる）。","kw":["占有","相続","当然承継","相続開始を知らなくても","取得時効"]},{"n":"最大決平成28年12月19日","f":"Aが死亡し、相続人は子B・Cの2人だった。遺産のうち不動産はわずかで、大部分は銀行の普通預金・定期預金だった。Bは、預金も遺産分割の対象に含めてCが生前に受けた贈与（特別受益）を考慮した分割をしたいと考えた。","h":"共同相続された普通預金・通常貯金・定期貯金の債権は、相続開始と同時に当然に相続分に応じて分割されることはなく、遺産分割の対象となる（従来の判例を変更）。","pt":"可分債権（貸金など）は当然分割が原則だが、預貯金債権は遺産分割の対象。現在は909条の2で、分割前でも各相続人が一定額（預貯金額の1/3×法定相続分、1金融機関150万円まで）を単独で払い戻せる。","kw":["預貯金債権","遺産分割の対象","当然分割","払戻し","909条の2"]},{"n":"最判昭和38年2月22日","f":"Aが死亡し、子B・Cが甲土地を共同相続した。Bは勝手に甲土地を自分の単独名義で登記し、Dに売却して移転登記をした。Cは自分の持分の登記をしていなかった。","h":"Bの登記はCの持分については無権利の登記であり、登記に公信力はないから、DはCの持分を取得できない。Cは自己の持分を登記なくしてDに対抗できる。","pt":"法定相続分までの権利は登記なしで第三者に対抗できる（現在の899条の2第1項も同じ考え方）。法定相続分を超える部分（遺産分割・遺言による取得）は登記が必要、と対比で問われる。","kw":["共同相続","単独登記","持分","登記なくして対抗","公信力"]},{"n":"最判昭和42年1月20日","f":"Aが死亡し、子B・Cが相続人となったが、Bは家庭裁判所で相続放棄をした。その後、Bの債権者Eが、B・Cが共同相続したものとして代位により相続登記をし、Bの持分を差し押さえた（仮差押え）。","h":"相続放棄をした者は初めから相続人とならなかったものとみなされ（939条）、その効力は絶対的で、登記の有無を問わず何人に対しても及ぶ。Eの仮差押えは無効。","pt":"相続放棄は登記なしで第三者に対抗できる。遺産分割後の第三者（登記が必要）との違いがひっかけの定番。","kw":["相続放棄","939条","絶対的効力","登記なくして","差押え"]},{"n":"最判昭和46年1月26日","f":"Aが死亡し、子B・Cが甲土地を共同相続した。遺産分割協議で甲土地はBが単独で取得すると決まったが、Bは登記をしないでいた。その後、Cが法定相続分（1/2）の登記をして、その持分をDに売却した。","h":"遺産分割による相続分と異なる権利の取得には177条が適用され、Bは登記を経なければ、分割後に権利を取得したDに対して法定相続分を超える取得を対抗できない。","pt":"現在は899条の2第1項で、法定相続分を超える部分は登記等の対抗要件がなければ第三者に対抗できないと明文化。相続放棄（登記不要）との違いに注意。","kw":["遺産分割","第三者","登記","対抗","法定相続分を超える"]},{"n":"最判平成3年4月19日","f":"Aは「甲土地を長男Bに相続させる」との遺言を残して死亡した。相続人はBのほか子C・Dがいた。遺産分割協議はまだ行われていなかった。","h":"特定の遺産を特定の相続人に「相続させる」旨の遺言は、遺贈と解すべき特段の事情がない限り遺産分割方法の指定であり、遺産分割の協議や審判を経ることなく、被相続人の死亡時に直ちにその遺産がその相続人に承継される。","pt":"現在は「特定財産承継遺言」（1014条2項）として条文化。ただし相続法改正で、法定相続分を超える部分は登記がなければ第三者に対抗できない（899条の2）。改正前の「登記不要」とした判例の結論は変わったので注意。","kw":["相続させる遺言","遺産分割方法の指定","特定財産承継遺言","直ちに承継","899条の2"]},{"n":"最判昭和34年6月19日","f":"AとXは、Yに対して1,000万円の連帯債務を負っていた。Aが死亡し、子B・Cが法定相続分各1/2で相続した。YはBに対して1,000万円全額の支払を求めた。","h":"連帯債務者の一人が死亡し相続人が数人いるときは、相続人は被相続人の債務を相続分に応じて分割承継し、各自その承継した範囲で本来の債務者Xとともに連帯債務者となる。BはYに500万円の限度で責任を負う。","pt":"相続人が「被相続人の連帯債務全額について連帯債務者となる」と出たら×。金銭債務は相続分に応じて当然に分割承継される。","kw":["連帯債務","相続","分割承継","相続分に応じて","金銭債務"]},{"n":"最判平成21年3月24日","f":"Aは「全財産を長男Bに相続させる」との遺言を残して死亡した。相続人はBと次男Cの2人で、Aには銀行Dからの借入金があった。DはCに対して法定相続分の1/2の返済を求めた。","h":"相続分の全部を一人に指定する遺言があれば、相続人間では相続債務もその相続人がすべて承継する。ただし相続債権者は、指定相続分の承認がない限り、各相続人に法定相続分に応じた履行を請求できる。","pt":"現在は902条の2で明文化。遺言で相続分を指定しても債権者には法定相続分で請求でき、債権者が指定相続分を承認すればそれに従う。","kw":["相続分の指定","相続債務","相続債権者","法定相続分","902条の2"]}]},"法令|都市計画法":{"pts":["都市計画区域は原則都道府県が指定（2以上の都府県にわたる場合は国土交通大臣）。区域外にも準都市計画区域を指定できる。","市街化区域はすでに市街地を形成している区域とおおむね10年以内に優先的・計画的に市街化を図るべき区域、市街化調整区域は市街化を抑制すべき区域。","市街化区域には少なくとも用途地域を定め、市街化調整区域には原則として用途地域を定めない。用途地域は13種類。","高度地区は用途地域内で高さの最高限度・最低限度を定め、高度利用地区は容積率の最高・最低限度、建蔽率の最高限度等を定める。","特定用途制限地域は、用途地域が定められていない土地の区域（市街化調整区域を除く）に定める。","準都市計画区域では用途地域・特別用途地区・特定用途制限地域・高度地区（最高限度）・景観地区・風致地区等を定められる。","地区計画は用途地域内のほか一定の用途地域外にも定められ、地区整備計画区域内での建築等は着手30日前までに市町村長へ届出。"],"traps":["「準都市計画区域に高度利用地区・防火地域を定められる」と出たら×。準都市計画区域で高度利用地区・防火地域・準防火地域は定められない。","「高度地区では容積率の最高限度を定める」と出たら×。高度地区は高さ、容積率を定めるのは高度利用地区。","「都市施設は都市計画区域外に定めることはできない」と出たら×。特に必要があるときは区域外にも定められる。"],"rel":["法令|開発許可","法令|建築基準法"],"bridge":"都市計画法で決めた区域区分が開発許可の要否面積を、用途地域が建築基準法の用途制限・建蔽率・容積率を決める。都市計画で枠を作り、開発許可と建築確認で個々の行為を規制する。","sys":{"overview":"法令上の制限の土台となる法律。区域（都市計画区域・準都市計画区域・区域区分）→地域地区→都市施設・市街地開発事業・地区計画→決定手続→都市計画制限の順で整理し、どの区域に何を定められるかを押さえる。","tree":[{"h":"区域の指定","items":["都市計画区域：原則都道府県が指定","2以上の都府県にわたる区域は国土交通大臣","準都市計画区域：区域外に都道府県が指定","区域区分（線引き）は都市計画区域のみ"]},{"h":"区域区分","items":["市街化区域：既成市街地＋概ね10年以内に市街化","市街化調整区域：市街化を抑制すべき区域","市街化区域は用途地域を必ず定める","調整区域は原則用途地域を定めない"]},{"h":"地域地区","items":["用途地域13種：住居系8・商業系2・工業系3","高度地区：高さの最高・最低限度","高度利用地区：容積率・建蔽率・建築面積","特定用途制限地域：用途地域外（調整区域除く）","防火・準防火地域は準都市計画区域に不可"]},{"h":"施設・事業","items":["都市施設：特に必要なら区域外にも可","市街化区域・非線引区域は道路・公園・下水道必須","住居系用途地域には義務教育施設も定める","市街地開発事業：市街化区域か非線引区域のみ"]},{"h":"地区計画","items":["用途地域内＋一定の用途地域外に定められる","地区整備計画は特別な事情があれば省略可","建築等は着手30日前までに市町村長へ届出","勧告はできるが許可制ではない"]},{"h":"都市計画制限","items":["都市計画施設等の区域内の建築は知事等の許可","2階以下・地階なしで移転容易なら必ず許可","事業地内の建築・土地形質変更は知事等の許可","事業地内の有償譲渡は施行者へ事前届出"]}],"flow":{"title":"都市計画の決定手続","steps":["原案作成（必要に応じ公聴会等）","決定しようとする旨を公告し2週間縦覧","住民・利害関係人が意見書を提出","都市計画審議会の議を経る","市町村決定は知事に協議（都道府県は一定で大臣同意）","決定を告示（告示の日から効力）","図書を公衆の縦覧に供する"]},"tables":[{"title":"準都市計画区域で定められるか","head":["地域地区等","可否"],"rows":[["用途地域・特別用途地区","○"],["特定用途制限地域","○"],["高度地区","○（最高限度のみ）"],["景観地区・風致地区","○"],["高度利用地区","×"],["防火地域・準防火地域","×"],["区域区分・市街地開発事業","×"],["地区計画","×"],["都市施設","○"]]},{"title":"高度地区と高度利用地区","head":["項目","高度地区","高度利用地区"],"rows":[["定める場所","用途地域内","用途地域内"],["定める内容","高さの最高・最低限度","容積率の最高・最低限度等"],["その他","—","建蔽率の最高限度・建築面積の最低限度"],["準都市計画区域","最高限度のみ○","×"]]},{"title":"用途地域の分類","head":["系統","用途地域"],"rows":[["住居系（8）","一低・二低・一中高・二中高"],["住居系（続き）","一住・二住・準住居・田園住居"],["商業系（2）","近隣商業・商業"],["工業系（3）","準工業・工業・工業専用"]]}]},"ex":[{"t":"準都市計画区域の地域地区","s":"A県が、都市計画区域外の幹線道路沿いで大型店の立地が進む地域を準都市計画区域に指定した。県は、この区域に高度地区（高さの最高限度）と準防火地域を定めようとしている。","p":"高度地区（最高限度のみ）は定められるが、準防火地域は定められない。準都市計画区域は開発の抑制と環境保全の区域なので、市街地の整備・高度利用を前提とする防火・準防火地域、高度利用地区、区域区分、市街地開発事業は定められない。","kw":["準都市計画区域","高度地区","準防火地域","高度利用地区","区域区分","市街地開発事業"]},{"t":"地区計画区域内の建築","s":"Bは、地区整備計画が定められた地区計画の区域内（第一種住居地域）で、木造2階建ての住宅を新築しようとしている。地区整備計画では建蔽率の最高限度や壁面の位置の制限が定められている。","p":"Bは着手の30日前までに市町村長へ届け出ればよく、知事等の許可は不要。地区計画は届出・勧告制であり、計画に適合しなければ市町村長が設計変更等を勧告できるにとどまる。","kw":["地区計画","地区整備計画","30日前","市町村長","届出","勧告"]},{"t":"都市計画道路予定地の建築","s":"Cの土地の一部が、都市計画決定された道路（都市計画施設）の区域内にある。Cはそこに地階のない木造2階建ての店舗兼住宅を建てたい。まだ都市計画事業の認可は出ていない。","p":"都市計画施設の区域内での建築は原則として知事等の許可が必要だが、階数2以下・地階なし・主要構造部が木造等で容易に移転・除却できるものなら、知事等は許可しなければならない。将来の事業を妨げにくいため、許可は必要だが拒めないという整理になっている。","kw":["都市計画施設","都道府県知事等の許可","階数2以下","地階","移転","非常災害"]}],"around":[{"h":"高度地区と高度利用地区","b":"高度地区は「高さ」の最高・最低限度、高度利用地区は「容積率」の最高・最低限度と建蔽率の最高限度等を定める。名前に「利用」が付く方が容積率と覚える。"},{"h":"特別用途地区との違い","b":"特別用途地区は用途地域内に重ねて定め、用途地域の制限を補う。特定用途制限地域は用途地域が定められていない区域（市街化調整区域を除く）に定める。"},{"h":"都市計画事業の事業地","b":"事業認可等の告示後、事業地内での建築や土地の形質変更は知事等の許可制になる。告示の翌日から10日を経過した後の有償譲渡は、予定対価等を施行者に届け出る（許可ではない）。"},{"h":"都市計画が抵触したら","b":"市町村が定めた都市計画が都道府県の定めた都市計画と抵触する場合は、その限りで都道府県の都市計画が優先する。より広域の計画を優先させる仕組み。"},{"h":"決定手続の数字","b":"都市計画の案は、決定する旨を公告して2週間公衆の縦覧に供し、住民・利害関係人は意見書を出せる。都市計画は告示の日から効力を生じる。"}]},"法令|開発許可":{"pts":["開発行為は、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更。建築のみなら許可不要。","許可不要の規模は市街化区域1,000㎡未満（三大都市圏の一定区域は500㎡未満）、非線引き・準都市計画区域3,000㎡未満、区域外1ha未満。","市街化区域以外では農林漁業用建築物・農林漁業者の住宅のための開発行為は許可不要。市街化区域では規模要件で判断する。","駅舎・図書館・公民館・変電所など公益上必要な建築物や、都市計画事業・土地区画整理事業等の施行として行う開発行為は許可不要。","申請前に既存の関係公共施設の管理者と協議し同意を得る。新設される公共施設の管理者となる者とは協議が必要。","工事完了公告前は原則建築不可だが、工事用仮設建築物、知事が支障なしと認めたもの、開発に同意していない土地所有者等の建築は可。","相続等の一般承継人は地位を当然に承継し、特定承継は知事の承認が必要。自己業務用でも災害レッドゾーンは原則除外される。"],"traps":["「病院・学校の建築のための開発行為は公益上必要なので許可不要」と出たら×。病院・学校・社会福祉施設は公益の例外に当たらない。","「土地の区画形質の変更を伴わない建築にも開発許可が必要」と出たら×。開発許可は開発行為についてのもの。","「市街化区域内の農業用倉庫のための開発行為は規模を問わず許可不要」と出たら×。農林漁業用の例外は市街化区域外のみ。"],"rel":["法令|都市計画法","法令|盛土規制法","法令|土地区画整理法"],"bridge":"開発許可の要否面積は都市計画法の区域区分で決まる。開発許可を受けた土地は盛土規制法の許可を受けたものとみなされ、土地区画整理事業の施行として行う開発行為は許可不要。","sys":{"overview":"都市計画法のうち、土地の造成（区画形質の変更）段階の規制。開発行為の定義→許可不要の例外（規模・農林漁業・公益・事業）→申請手続→完了公告前後の建築制限の順に押さえれば得点できる。","tree":[{"h":"開発行為","items":["建築物・特定工作物のための区画形質の変更","第一種特定工作物：コンクリートプラント等","第二種：ゴルフコース（規模不問）","第二種：1ha以上の野球場・遊園地・墓園等","区画形質の変更なしの建築は許可不要"]},{"h":"許可不要","items":["区域ごとの規模未満（市街化1,000㎡未満等）","市街化区域外の農林漁業用建築物・農家住宅","駅舎・図書館・公民館・変電所等の公益施設","都市計画事業・区画整理事業等の施行として","非常災害の応急措置・通常の管理行為等"]},{"h":"申請・許可","items":["既存公共施設の管理者と協議し同意","新設公共施設の管理者となる者と協議","申請は書面、処分も遅滞なく文書で","33条技術基準：全区域に適用","34条立地基準：市街化調整区域のみ"]},{"h":"許可後","items":["知事が開発登録簿に登録・閲覧","軽微な変更は届出、その他の変更は許可","廃止は遅滞なく知事へ届出","一般承継は当然、特定承継は知事の承認"]},{"h":"建築制限","items":["完了公告前：原則建築不可（例外3つ）","公告後：予定建築物以外は原則不可","用途地域が定められていれば公告後の制限なし","調整区域の開発区域外の建築も原則許可"]}],"flow":{"title":"開発許可の流れ","steps":["公共施設管理者と協議・同意","知事へ書面で許可申請","許可・不許可を文書で通知","開発登録簿に登録","工事完了を知事へ届出・検査","検査済証交付→工事完了公告","公共施設は翌日原則市町村管理へ"]},"tables":[{"title":"許可不要となる規模","head":["区域","許可不要の規模"],"rows":[["市街化区域","1,000㎡未満"],["三大都市圏の既成市街地等","500㎡未満"],["市街化調整区域","規模の例外なし"],["非線引都市計画区域","3,000㎡未満"],["準都市計画区域","3,000㎡未満"],["都市計画区域・準都計区域外","1ha未満"]]},{"title":"主な例外と区域","head":["例外","市街化区域","それ以外"],"rows":[["農林漁業用建築物・農家住宅","×（規模で判断）","○不要"],["駅舎・図書館・公民館・変電所","○不要","○不要"],["病院・学校・社会福祉施設","×必要","×必要"],["区画整理・都市計画事業の施行","○不要","○不要"],["非常災害の応急措置","○不要","○不要"]]},{"title":"完了公告前に建築できる例外","head":["例外","可否"],"rows":[["工事用の仮設建築物","○"],["知事が支障ないと認めたもの","○"],["開発に不同意の土地所有者等","○"],["上記以外","×"]]}]},"ex":[{"t":"同じ800㎡でも結論が逆","s":"D社は、住宅を建てる目的で800㎡の土地を造成する予定。候補地は①地方都市の市街化区域、②首都圏整備法の既成市街地にある市街化区域の2つ。","p":"①は1,000㎡未満なので許可不要、②は三大都市圏の既成市街地等で基準が500㎡未満に下がるため許可が必要。市街化区域の面積基準は一律ではないので、区域名まで読むこと。","kw":["市街化区域","1,000㎡","500㎡","既成市街地","首都圏整備法"]},{"t":"農家住宅は区域で分かれる","s":"農業者Eが自宅を建てるため、市街化調整区域で1,000㎡の開発行為をする。同じ頃、Eは市街化区域で1,200㎡の土地を造成し農業用倉庫を建てる予定もある。また非農家Fは、市街化調整区域で自宅用に100㎡の開発行為をする。","p":"Eの調整区域での農家住宅は許可不要だが、市街化区域の倉庫は規模（1,000㎡以上）で判断するので許可が必要。Fは調整区域には規模の例外がないため100㎡でも許可が必要。","kw":["市街化調整区域","農業を営む者の居住","農業用倉庫","規模","自己の居住"]},{"t":"公益施設と第二種特定工作物","s":"市街化調整区域で、①公民館、②病院、③8,000㎡の野球場、をそれぞれ建設するための造成が計画されている。","p":"①公民館は公益上必要な建築物として許可不要。②病院は公益の例外に入らないので許可が必要。③野球場は1ha以上で初めて第二種特定工作物になるため、8,000㎡ならそもそも開発行為に当たらず許可不要。","kw":["公民館","病院","野球場","第二種特定工作物","1ha","ゴルフコース"]}],"around":[{"h":"許可不要の面積比較","b":"市街化区域1,000㎡未満（三大都市圏の一定区域500㎡未満）、非線引き・準都市計画区域3,000㎡未満、両区域外1ha未満。市街化調整区域には面積の例外がない。"},{"h":"33条と34条","b":"33条の技術基準（道路・排水・災害危険区域等の除外）は全区域に適用され、34条の立地基準は市街化調整区域の開発（第二種特定工作物を除く）だけに上乗せされる。"},{"h":"完了公告前の建築","b":"原則建築不可だが、工事用仮設建築物、知事が支障なしと認めたもの、開発に同意していない土地所有者等の建築はできる。"},{"h":"変更・廃止・承継","b":"変更は原則許可、軽微な変更は届出、廃止は遅滞なく届出。相続など一般承継は当然に承継、土地を買った特定承継人は知事の承認で承継する。"},{"h":"盛土規制法とのつながり","b":"宅地造成等工事規制区域内で開発許可を受けた工事は、盛土規制法の許可を受けたものとみなされる。手続の二重負担を避ける仕組み。"}]},"法令|建築基準法":{"pts":["2025年4月改正で、階数2以上又は延べ面積200㎡超の建築物（新2号）は全国で新築・大規模修繕・模様替に建築確認が必要。","防火・準防火地域外での10㎡以内の増築・改築・移転は確認不要。200㎡超の特殊建築物への用途変更は類似用途間を除き確認が必要。","建築物の敷地は幅員4m以上の道路に2m以上接しなければならない。2項道路は原則として道路中心線から2m後退した線が境界。","防火地域内の耐火建築物等（建蔽率8/10の地域以外）・準防火地域内の耐火・準耐火建築物等で+1/10、角地で+1/10緩和される。","建蔽率8/10の地域内で防火地域内にある耐火建築物等は建蔽率制限が適用されない。前面道路12m未満なら容積率は道路幅員で制限される。","建築物が防火地域と準防火地域等にわたるときは原則全部に厳しい方を適用。用途制限は敷地の過半の属する地域による。","第一種・第二種低層住居専用地域・田園住居地域は10m又は12mの絶対高さ制限があり、北側斜線は低層・中高層住居専用・田園住居地域に適用。"],"traps":["「防火地域内でも10㎡以内の増築なら確認不要」と出たら×。10㎡以内の確認不要は防火・準防火地域外に限る。","「神社・寺院は工業専用地域では建築できない」と出たら×。神社・寺院・教会、保育所、診療所等は全用途地域で建築可。","「都市計画区域外の木造2階建ての新築は確認不要」と出たら×。2025年改正後は新2号建築物として全国で確認が必要。"],"rel":["法令|都市計画法","法令|開発許可"],"bridge":"用途地域や防火地域は都市計画法で定め、そこでの具体的な建築制限は建築基準法が定める。開発許可は土地の造成段階、建築確認は個々の建築物の段階の規制。","sys":{"overview":"都市計画で決めた用途地域等の中で、個々の建築物を規制する法律。建築確認（2025年改正の新2号・新3号）→単体規定→集団規定（道路・用途・建蔽率・容積率・高さ・防火）の順に整理し、数字と例外を押さえる。","tree":[{"h":"建築確認","items":["1号：特殊建築物で用途200㎡超","新2号：階数2以上又は延べ200㎡超","新3号：平屋かつ200㎡以下（区域内のみ）","防火・準防火外の10㎡以内増改築等は不要","200㎡超の特殊建築物への用途変更は必要"]},{"h":"単体規定","items":["高さ20m超：避雷設備","高さ31m超：非常用の昇降機","住宅居室の採光1/7以上（照明等で1/10可）","換気に有効な開口は床面積の1/20以上","石綿添加建材は原則使用禁止"]},{"h":"道路・接道","items":["道路は幅員4m以上（指定区域は6m）","敷地は道路に2m以上接する","2項道路は中心線から2m後退","道路内には原則建築不可（地下等除く）"]},{"h":"用途制限","items":["敷地の過半が属する地域の制限を適用","神社・診療所・保育所等は全地域で可","住宅は工業専用地域のみ不可","大学・病院は低層系・田園・工業・工専で不可"]},{"h":"建蔽率・容積率","items":["防火内の耐火等・準防火内の準耐火等+1/10","角地+1/10、両方で+2/10","8/10地域・防火内の耐火等は制限なし","前面道路12m未満は幅員×4/10又は6/10","敷地が地域にまたがれば加重平均"]},{"h":"高さ・防火","items":["低層住専・田園：絶対高さ10m又は12m","北側斜線：低層・田園・中高層住専","日影規制：商業・工業・工専は対象外","防火地域：3階以上又は100㎡超は耐火等","準防火：4階以上又は1,500㎡超は耐火等"]}],"flow":{"title":"建築確認〜使用開始","steps":["建築主事等に確認申請","確認済証の交付（35日／7日以内）","着工（特定工程は中間検査）","工事完了から4日以内に完了検査申請","受理から7日以内に検査","検査済証の交付","1号・2号は検査済証後に使用開始"]},"tables":[{"title":"2025年改正後の確認対象","head":["区分","範囲","確認が必要な行為"],"rows":[["1号","特殊建築物200㎡超","全国：新築・増改築・大規模修繕等"],["新2号","階数2以上又は延べ200㎡超","全国：新築・増改築・大規模修繕等"],["新3号","平屋かつ延べ200㎡以下","区域内：新築・増改築・移転"],["用途変更","200㎡超の特殊建築物へ","類似用途間は不要"]]},{"title":"主な用途制限","head":["建築物","建築できない地域"],"rows":[["神社・寺院・診療所・保育所","なし（全地域で可）"],["住宅・共同住宅","工業専用地域"],["小・中・高校","工業・工業専用"],["大学・病院","一低・二低・田園・工業・工専"],["ホテル・旅館","一低〜二中高・田園・工業・工専"],["映画館（客席200㎡未満）","一低〜二住・田園・工業・工専"],["映画館（客席200㎡以上）","近商・商業・準工以外"]]},{"title":"建蔽率の緩和","head":["条件","緩和"],"rows":[["防火地域内の耐火建築物等","+1/10"],["準防火地域内の耐火・準耐火等","+1/10"],["特定行政庁指定の角地","+1/10"],["上記の防火系＋角地","+2/10"],["8/10地域かつ防火内の耐火等","制限なし"]]}]},"ex":[{"t":"建蔽率・容積率の計算","s":"第一種住居地域で準防火地域内の角地（特定行政庁指定）にある300㎡の敷地。都市計画で建蔽率6/10・容積率30/10が定められ、前面道路は幅員6mと4mの2本。準耐火建築物を建てる。","p":"建蔽率は6/10＋準防火の準耐火建築物1/10＋角地1/10＝8/10で、建築面積は240㎡まで。容積率は前面道路の最大幅員6m×4/10（住居系）＝24/10が指定の30/10より小さいので24/10となり、延べ面積は720㎡まで（幅員が12m以上なら道路による制限はかからない）。","kw":["建蔽率","容積率","前面道路","幅員","角地","準防火地域"]},{"t":"区域外の木造2階建て","s":"都市計画区域・準都市計画区域のいずれでもない山間部で、Gが木造2階建て・延べ150㎡の住宅を新築し、数年後に大規模の修繕をする。","p":"2025年4月改正後は階数2以上の建築物は「新2号建築物」として全国で確認が必要になり、新築だけでなく大規模の修繕・模様替にも確認を受ける。区域外で確認不要なのは平屋かつ200㎡以下（新3号）の場合。","kw":["都市計画区域外","木造2階建て","大規模の修繕","建築確認","新2号"]},{"t":"敷地が2つの地域にまたがる","s":"200㎡の敷地のうち120㎡が第一種低層住居専用地域（建蔽率5/10）、80㎡が第一種住居地域（建蔽率6/10）にあり、建物は第一種住居地域側にだけ建てる。建物の一部は防火地域、残りは準防火地域にかかる。","p":"建蔽率は加重平均で120×5/10＋80×6/10＝108㎡まで（建物の位置は関係ない）。用途制限は敷地の過半が属する第一種低層住居専用地域の制限が全体にかかり、防火規制は原則として建物全部に厳しい防火地域の規定が適用される。","kw":["2つの用途地域","加重平均","過半","防火地域","準防火地域","用途制限"]}],"around":[{"h":"前面道路の乗数","b":"前面道路の幅員が12m未満なら、住居系用途地域は幅員×4/10、その他の地域は幅員×6/10と指定容積率の小さい方が上限（特定行政庁の指定で乗数が変わる区域あり）。道路が2本以上なら最も広い幅員で計算する。"},{"h":"2項道路のセットバック","b":"幅員4m未満でも特定行政庁が指定した道は道路とみなされ、原則として中心線から2m後退した線が道路境界線になる。後退部分は敷地面積に算入されない。"},{"h":"木造の構造計算の見直し","b":"2025年4月施行の改正で、構造計算が必要な木造建築物の規模が延べ面積500㎡超から300㎡超に引き下げられた。二級建築士が扱える範囲は階数3以下かつ高さ16m以下に見直された。"},{"h":"建蔽率が制限なしになる例","b":"建蔽率8/10の地域内で、防火地域内にある耐火建築物等は建蔽率の制限が適用されない。特定行政庁の許可は不要。"},{"h":"高さ制限の適用地域","b":"絶対高さ10m・12mは一低・二低・田園住居地域のみ。北側斜線はこれに一中高・二中高を加えた地域で、日影規制は商業・工業・工業専用地域では対象区域にできない。"}]},"法令|盛土規制法":{"pts":["宅地造成等工事規制区域・特定盛土等規制区域は都道府県知事（指定都市・中核市はその長）が基礎調査をもとに指定する。","宅地造成等工事規制区域内で一定規模の宅地造成・特定盛土等・土石の堆積を行う工事主は、着手前に知事の許可を受けなければならない。","許可対象は、盛土で高さ1m超の崖、切土で高さ2m超の崖、盛土切土合わせ高さ2m超の崖、盛土で高さ2m超、面積500㎡超など。","許可申請前に、工事主は周辺住民へ説明会の開催等の周知措置を講じなければならない。許可後は工事現場に標識を掲示する。","特定盛土等規制区域内では一定規模の工事は着手日の30日前までに知事へ届出が必要。大規模な工事は許可が必要となる。","宅地造成等工事規制区域内で高さ2m超の擁壁・排水施設等の除却工事を行う者は、許可不要の場合でも着手日の14日前までに知事へ届け出る。","規制区域内の土地の所有者・管理者・占有者は、災害が生じないよう常時安全な状態に維持するよう努めなければならない。"],"traps":["「造成宅地防災区域は宅地造成等工事規制区域内にも指定できる」と出たら×。規制区域内の土地には指定できない。","「周知措置は工事着手後に行えばよい」と出たら×。許可申請の前にあらかじめ講じなければならない。","「規制区域外の盛土にも盛土規制法の届出が必要」と出たら×。規制区域・特定盛土等規制区域の外では許可も届出も不要。"],"rel":["法令|開発許可","法令|農地法"],"bridge":"規制区域内で都市計画法の開発許可を受けた工事は盛土規制法の許可を受けたものとみなされる。農地での盛土も宅地造成等の対象となり得て、農地転用許可とは別に許可が問題となる。","sys":{"overview":"旧宅地造成等規制法を改正・改称し2023年5月に施行された法律。規制区域の指定（2種類）→許可・届出が必要な規模→許可手続と検査→その他の届出→監督・造成宅地防災区域の順に整理し、数字と届出期限を押さえる。","tree":[{"h":"区域の指定","items":["指定権者：知事（指定都市・中核市は市長）","宅地造成等工事規制区域：市街地・集落等","特定盛土等規制区域：上記以外で危険な区域","造成宅地防災区域：宅造工事規制区域外","基礎調査の立入り損失は都道府県が補償"]},{"h":"対象行為","items":["宅地造成：宅地以外を宅地にする造成","特定盛土等：宅地・農地等での盛土等","土石の堆積：一定期間の仮置き","農地・森林での盛土も対象になり得る"]},{"h":"規制区域","items":["一定規模以上は着手前に知事の許可","申請前に周辺住民へ説明会等の周知","許可後は現場に標識を掲示","開発許可を受ければ許可を受けたものとみなす"]},{"h":"特定盛土区域","items":["一定規模は着手30日前までに知事へ届出","大規模（高さ5m超等）は許可","許可後の手続は規制区域と同様"]},{"h":"その他の届出","items":["区域指定時に工事中：指定日から21日以内","2m超の擁壁・排水施設の除却：14日前","公共施設用地を宅地に転用：14日以内"]},{"h":"監督・義務","items":["所有者・管理者・占有者は安全維持の努力義務","知事は所有者等に勧告・改善命令","原因行為者にも改善命令を出せる","知事は規則で技術的基準を強化・付加可"]}],"flow":{"title":"許可〜完了検査","steps":["周辺住民へ説明会等の周知措置","知事へ許可申請","許可（条件付けも可）","現場に標識を掲示して着工","特定工程の中間検査・定期報告","完了後に完了検査を申請","検査済証の交付"]},"tables":[{"title":"許可・届出が必要な規模","head":["行為","規制区域：許可","特定盛土区域：許可"],"rows":[["盛土で生じる崖","高さ1m超","高さ2m超"],["切土で生じる崖","高さ2m超","高さ5m超"],["盛土＋切土の崖","高さ2m超","高さ5m超"],["崖を生じない盛土","高さ2m超","高さ5m超"],["盛土・切土の面積","500㎡超","3,000㎡超"],["土石の堆積","2m超かつ300㎡超／500㎡超","5m超かつ1,500㎡超／3,000㎡超"]]},{"title":"届出の期限","head":["場面","期限","届出先"],"rows":[["特定盛土区域の中規模工事","着手30日前まで","知事"],["区域指定時に工事中","指定日から21日以内","知事"],["2m超擁壁・排水施設の除却","着手14日前まで","知事"],["公共施設用地→宅地転用","転用から14日以内","知事"]]},{"title":"区域の違い","head":["項目","規制区域","特定盛土区域"],"rows":[["対象地","市街地・集落等","それ以外の危険区域"],["中規模工事","許可","届出（30日前）"],["大規模工事","許可","許可"],["区域外","許可・届出とも不要","許可・届出とも不要"]]}]},"ex":[{"t":"規制区域の許可ライン","s":"宅地造成等工事規制区域内で、①500㎡の土地を切土して高さ1.5mの崖ができる、②300㎡の土地に盛土して高さ1.2mの崖ができる、③600㎡の土地を切土して崖は生じない、という3つの工事がある。","p":"①は切土の崖2m以下・面積500㎡以下（超えていない）なので許可不要。②は盛土で1m超の崖なので面積が小さくても許可が必要、③は面積500㎡超なので許可が必要。崩れやすい盛土の方が基準が厳しい（1m）点と、「超」の意味に注意。","kw":["宅地造成等工事規制区域","切土","盛土","崖","1m","500㎡"]},{"t":"特定盛土区域は届出と許可","s":"市街地から離れた特定盛土等規制区域内で、①崖を生じない高さ3mの盛土、②崖を生じない高さ6mの盛土、をそれぞれ計画している。","p":"①は規制区域なら許可が必要な規模だが、特定盛土等規制区域では着手日の30日前までに知事へ届け出ればよい。②は5m超の大規模なものなので許可が必要。区域の外ではどちらも許可・届出とも不要。","kw":["特定盛土等規制区域","30日前","届出","5m","許可"]},{"t":"農地での盛土も対象","s":"宅地造成等工事規制区域内で、農業者が自分の畑の土地改良のため、高さ2.5m（崖を生じない）の盛土をする。旧宅地造成等規制法では、農地のままの造成は「宅地造成」に当たらず規制外だった。","p":"現行法では農地等で行う一定規模の盛土も「特定盛土等」として規制対象となり、高さ2m超の盛土なので許可が必要。熱海の土石流災害を受けて、宅地かどうかに関係なく危険な盛土を規制するよう改められた。","kw":["特定盛土等","農地","旧宅地造成等規制法","土地の用途","許可"]}],"around":[{"h":"旧法から変わった点","b":"2023年5月施行で法律名が変わり、規制対象が宅地造成だけでなく特定盛土等（農地・森林での盛土を含む）と土石の堆積（一時的な仮置き）に広がった。区域も宅地造成等工事規制区域と特定盛土等規制区域の2種類になった。"},{"h":"土石の堆積の規模","b":"規制区域では高さ2m超かつ面積300㎡超、又は面積500㎡超で許可が必要。特定盛土等規制区域の許可は高さ5m超かつ1,500㎡超、又は3,000㎡超。"},{"h":"許可の前後の手続","b":"工事主は許可申請の前に説明会等で周辺住民へ周知し、許可後は現場に標識を掲げる。許可を受けた工事の計画を変更するときは、軽微な変更（届出）を除き変更の許可が必要。"},{"h":"届出の期限3つ","b":"区域指定の際すでに工事中なら指定日から21日以内、規制区域で高さ2m超の擁壁・排水施設を除却するなら着手14日前まで、公共施設用地を宅地等に転用したら転用日から14日以内。"},{"h":"造成宅地防災区域","b":"危険な既存の造成宅地の区域を知事が指定するもので、宅地造成等工事規制区域内の土地には指定できない。規制区域内の既存宅地は勧告・改善命令で対応する。"}]},"法令|土地区画整理法":{"pts":["施行者は個人・組合・区画整理会社・地方公共団体・国土交通大臣・機構等。組合設立には7人以上で定款・事業計画を定め知事の認可が必要。","組合施行区域内の宅地の所有者・借地権者はすべて組合員となる。未登記の借地権は施行者への申告がなければ存在しないものとみなす。","事業計画の決定等の公告後、換地処分公告までの間、施行区域内で建築や土地の形質変更等をするには知事等（市の区域内は市長）の許可が必要。","仮換地指定の効力発生日から換地処分公告の日まで、従前の宅地の権利者は仮換地を従前と同じ内容で使用収益でき、従前の宅地は使用できない。","仮換地の使用収益開始日を別に定めることができ、そのため使用収益できず損失を受けた者には施行者が損失補償する。","換地処分は関係権利者に換地計画で定めた事項を通知して行い、公告日の終了時に仮換地指定の効力が消滅し、翌日に換地が従前の宅地とみなされる。","清算金と保留地の取得は換地処分公告の翌日に確定・効力発生する。換地処分後は施行者が遅滞なく登記所に通知し換地処分の登記を行う。"],"traps":["「施行区域内の建築行為は施行者の許可を受ける」と出たら×。許可権者は知事等（市の区域内は市長）で、施行者ではない。","「組合施行の仮換地指定には土地区画整理審議会の意見を聴く」と出たら×。組合施行は総会等の同意で、審議会は公的施行の場合。","「清算金は換地処分後に土地を買った者に当然承継される」と出たら×。換地処分時の所有者との間で確定する。"],"rel":["法令|都市計画法","法令|開発許可"],"bridge":"土地区画整理事業は都市計画で定める市街地開発事業の一つで、施行区域は都市計画法で決まる。その施行として行う開発行為は区域・規模を問わず開発許可が不要となる。","sys":{"overview":"都市計画で定める市街地開発事業の一つ。施行者と組合→建築行為等の制限→換地計画→仮換地→換地処分とその効果→登記の順に事業の時間軸で整理し、許可権者と効果の発生時点を押さえる。","tree":[{"h":"施行者","items":["個人・組合・区画整理会社（民間施行）","都道府県・市町村・大臣・機構等（公的施行）","組合：7人以上で定款・事業計画、知事認可","設立は所有者・借地権者の各2/3以上同意","組合員：区域内の所有者・借地権者全員"]},{"h":"建築等制限","items":["事業計画等の公告〜換地処分公告まで","建築・形質変更・重量物設置等が対象","許可権者は知事（市の区域は市長）","施行者の許可ではない点に注意"]},{"h":"換地計画","items":["照応の原則：位置・地積・環境等が照応","保留地：事業費に充てる土地","清算金で不均衡を金銭調整","公的施行は審議会の意見を聴く"]},{"h":"仮換地","items":["指定は書面通知、効力発生日を定める","権利者は仮換地を従前同様に使用収益","従前の宅地は使用収益できない","使用収益開始日を別に定められる（補償あり）","組合施行は総会等の同意、公的は審議会"]},{"h":"換地処分","items":["権利者に換地計画の事項を通知して行う","原則は工事全部の完了後","公告日の終了時：仮換地の効力消滅","公告の翌日：換地が従前の宅地とみなされる","翌日：清算金確定・保留地を施行者取得"]},{"h":"登記","items":["施行者が遅滞なく登記所へ通知","施行者が換地処分の登記を申請・嘱託","登記完了まで原則他の登記不可"]}],"flow":{"title":"土地区画整理事業の流れ","steps":["組合設立認可・事業計画決定の公告","施行地区内の建築等は知事等の許可制","換地計画の作成・認可","仮換地の指定（効力発生日に使用開始）","工事の実施","換地処分の通知→知事が公告","公告翌日に換地確定・換地処分の登記"]},"tables":[{"title":"換地処分公告の効果","head":["時点","効果"],"rows":[["公告日の終了時","仮換地指定の効力が消滅"],["公告日の終了時","換地を定めない従前地の権利消滅"],["公告日の翌日","換地が従前の宅地とみなされる"],["公告日の翌日","清算金が確定"],["公告日の翌日","保留地を施行者が取得"],["公告日の翌日","公共施設は原則市町村管理"]]},{"title":"施行者による違い","head":["項目","組合施行","公的施行"],"rows":[["根拠","定款・事業計画","施行規程・事業計画"],["仮換地指定の手続","総会等の同意","審議会の意見"],["施行場所","都市計画区域内","施行区域内（都市計画事業）"],["建築制限の許可権者","知事等","知事等（大臣施行は大臣）"]]},{"title":"仮換地指定の効果","head":["土地","使用収益できる者"],"rows":[["仮換地","従前の宅地の権利者"],["従前の宅地","権利者は不可（施行者が管理）"],["仮換地の元の権利者","効力発生日から使用不可"],["開始日を別に定めた場合","損失は施行者が補償"]]}]},"ex":[{"t":"建築制限の許可権者","s":"U土地区画整理組合の設立認可が公告され、施行地区内（ある市の区域内）でVが自宅の新築を計画している。Vは組合の理事長から承諾を得ている。","p":"組合の承諾だけでは足りず、市の区域内なので市長（町村部なら知事）の許可が必要。事業の障害になる建築等を公的にチェックする仕組みで、許可権者は施行者ではない。","kw":["施行地区","建築物の新築","組合の許可","都道府県知事","市長","形質の変更"]},{"t":"仮換地の使用と売買","s":"Wの従前の宅地甲について、乙地が仮換地に指定された。乙地には移転前の建物が残っているため、施行者は使用収益の開始日を効力発生日より後に定めた。WはX社に甲地を売却したい。","p":"Wは効力発生日から甲地を使えなくなるが、開始日までは乙地も使えないため、その損失は施行者が補償する。甲地の売却は可能で、登記は従前の宅地（甲地）について行い、X社は乙地を使用収益する。","kw":["仮換地","従前の宅地","使用又は収益を開始することができる日","損失を補償","効力発生の日"]},{"t":"換地処分公告の前後","s":"換地処分が関係権利者に通知され、10月1日に公告された。Yの換地には清算金の交付が定められている。Yは10月20日に換地をZに売却した。","p":"仮換地指定の効力は10月1日の終了時に消え、10月2日に換地が従前の宅地とみなされ、清算金も確定する。清算金を受け取る権利は公告時の所有者Yに確定しているので、売買で当然にZへは移らない。","kw":["換地処分の公告","翌日","清算金","確定","第三者に移転","保留地"]}],"around":[{"h":"組合の設立と組合員","b":"7人以上で定款・事業計画を定め知事の認可を受け、施行地区内の宅地の所有者・借地権者それぞれの3分の2以上の同意が要る。借地権者も含め全員が組合員になる。"},{"h":"審議会と総会","b":"都道府県・市町村等の公的施行では土地区画整理審議会を置き、換地計画や仮換地指定でその意見を聴く。組合施行は審議会でなく総会等の同意で進める。"},{"h":"照応の原則と保留地","b":"換地は従前の宅地と位置・地積・土質・水利・利用状況・環境等が照応するように定める。保留地は事業費に充てるため換地に定めない土地で、公告翌日に施行者が取得する。"},{"h":"地役権の扱い","b":"従前の宅地上の地役権は換地処分後も原則として従前の宅地の上に存続する。事業の施行で行使の利益がなくなった地役権は消滅する。"},{"h":"換地処分の登記","b":"施行者は公告後直ちに登記所へ通知し、換地処分に伴う登記を申請・嘱託する。公告からこの登記までは原則として他の登記ができない（仮換地指定の時点ではない）。"}]},"法令|農地法":{"pts":["農地か否かは登記簿上の地目でなく現況で判断する。一時的に耕作していない休耕地も農地に当たる。","3条（権利移動）は農業委員会、4条（転用）・5条（転用目的の権利移動）は知事等（指定市町村は市町村長）の許可が必要。","相続・遺産分割・相続人への特定遺贈は許可不要だが、農業委員会への届出が必要。相続人以外への特定遺贈は3条許可が必要。","市街化区域内の農地は、あらかじめ農業委員会に届け出れば4条・5条許可が不要。3条にはこの特例はない。","2アール未満の農業用施設への自己転用は4条許可不要。国・都道府県等の一定の転用は協議成立で許可があったものとみなす。","許可のない権利移動・転用目的の権利移動は効力を生じない。違反転用者・工事請負人等に原状回復等を命じられる。","農地の賃貸借は引渡しで対抗でき、解除・解約申入れ等には原則知事の許可が必要。適格法人以外の法人も一定要件で借りられる。"],"traps":["「市街化区域内なら3条の権利移動も届出で足りる」と出たら×。市街化区域の届出特例は4条・5条のみ。","「登記簿の地目が山林なら耕作していても農地法の適用はない」と出たら×。現況で判断する。","「相続人以外への特定遺贈も許可不要」と出たら×。相続人以外への特定遺贈は3条許可が必要。"],"rel":["法令|国土利用計画法","法令|都市計画法"],"bridge":"農地法3条許可を受ける場合は国土法の事後届出が不要。市街化区域では4条・5条許可に代えて届出で足り、都市計画の区域区分が手続を左右する。","sys":{"overview":"農地・採草放牧地の権利移動と転用を規制する法律。農地の判定（現況主義）→3条・4条・5条の許可と例外→市街化区域の届出特例→違反の効果→賃貸借の保護の順に、3つの条文を比較で押さえる。","tree":[{"h":"農地の判定","items":["登記地目でなく現況で判断","休耕地も農地に当たる","採草放牧地：3条・5条の対象、4条は対象外","家庭菜園は農地に当たらない"]},{"h":"3条 権利移動","items":["許可権者：農業委員会","相続・遺産分割・相続人への特定遺贈は不要","相続等で取得した者は農業委員会へ届出","市街化区域の届出特例はない","下限面積要件は2023年4月に廃止"]},{"h":"4条 転用","items":["許可権者：知事（指定市町村は市町村長）","2a未満の農業用施設への転用は不要","国・都道府県等は協議成立で許可みなし","市街化区域：事前に農業委員会へ届出"]},{"h":"5条 転用目的","items":["転用目的の権利移動・設定が対象","許可権者は4条と同じ","市街化区域：事前届出で許可不要","許可がなければ契約は効力を生じない"]},{"h":"違反・罰則","items":["3条・5条違反の契約は無効","違反転用には原状回復等の命令","命令は工事請負人・下請人にも可","法人の4・5条違反は1億円以下の罰金"]},{"h":"賃貸借","items":["引渡しで第三者に対抗可（使用貸借は不可）","解除・解約申入れ等は原則知事の許可","一般法人も一定要件で借りられる","抵当権の設定は許可不要"]}],"flow":{"title":"5条転用許可の流れ","steps":["市街化区域内なら農業委員会へ事前届出","区域外は農業委員会経由で知事等に申請","農業委員会が意見を付して送付","知事等が許可・不許可を判断","許可後に契約が効力を生じ転用可能"]},"tables":[{"title":"3条・4条・5条の比較","head":["項目","3条","4条","5条"],"rows":[["内容","権利移動","自己転用","転用目的の権利移動"],["許可権者","農業委員会","知事等","知事等"],["市街化区域の特例","なし","事前届出","事前届出"],["無許可の効果","無効","原状回復等","無効・原状回復等"],["採草放牧地","対象","対象外","対象"]]},{"title":"許可不要となる主な場面","head":["場面","3条","4条・5条"],"rows":[["相続・遺産分割","○不要（届出）","—"],["相続人以外への特定遺贈","×必要","—"],["2a未満の農業用施設","—","4条のみ不要"],["国・都道府県等","○不要","協議成立でみなし"],["土地収用","○不要","○不要"],["抵当権の設定","○不要","—"]]},{"title":"罰則","head":["違反","個人","法人"],"rows":[["3条違反","3年以下拘禁刑又は300万円以下","300万円以下の罰金"],["4条・5条違反","3年以下拘禁刑又は300万円以下","1億円以下の罰金"]]}]},"ex":[{"t":"市街化区域の届出特例","s":"市街化区域内の農地について、①N社が宅地分譲のために買い受ける、②農業者Oが耕作目的で買い受ける、という2つの取引がある。","p":"①は転用目的の権利移動（5条）なので、あらかじめ農業委員会に届け出れば

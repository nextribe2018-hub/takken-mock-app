長が提供する水害ハザードマップにその建物の位置が表示されているときは、その所在地を重要事項として説明しなければならない。","a":1,"e":"水害ハザードマップに物件の位置が表示されていれば、売買・交換・貸借を問わずその所在地の説明が必要である。","m":"ハザードマップは貸借も"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R03s-45-1","s":"宅建業者Aが自ら売主として業者でない買主Bに新築住宅を売る場合、Bの承諾があれば、Aは資力確保措置（保証金の供託または保険契約の締結）を講じなくてよい。","a":0,"e":"買主が業者でない新築住宅の売主業者は資力確保措置が義務であり、買主の承諾があっても免除されない。","m":"買主の承諾でも免除なし"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R03s-45-2","s":"新築住宅の売主業者が基準日に係る資力確保措置の状況の届出をしなかった場合、基準日の翌日から1月を経過した日以後、新たに自ら売主となる新築住宅の売買契約を締結できない。","a":0,"e":"届出をしないと、基準日の翌日から起算して50日を経過した日以後、新たな新築住宅の売買契約が締結できなくなる（履行法13条）。","m":"届出なしは50日で停止"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R03s-45-3","s":"売主業者が締結する住宅販売瑕疵担保責任保険契約の保険金額は、買主の承諾があれば2,000万円未満とすることができる。","a":0,"e":"保険金額は2,000万円以上でなければならず、買主の承諾があっても引き下げることはできない。","m":"保険金額は2千万以上"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R03s-45-4","s":"新築住宅の構造耐力上主要な部分等に瑕疵があり、売主業者が相当の期間を経過しても担保責任を履行しない場合、買主は保険契約の有効期間内であれば保険法人に保険金を直接請求できる。","a":1,"e":"売主業者が相当期間経過後も担保責任を履行しないときは、買主は保険法人に直接保険金を請求できる（履行法2条）。","m":"売主が動かねば直接請求"},{"f":"税他","t":"住宅金融支援機構","ref":"R03s-46-1","s":"住宅金融支援機構は、子育て世帯や高齢者世帯に適した良好な居住性能を有する賃貸住宅の建設資金の貸付けを業務として行っていない。","a":0,"e":"機構は子育て世帯・高齢者世帯向けの賃貸住宅の建設資金や改良資金の貸付けを行っている。","m":"子育て・高齢者賃貸は融資"},{"f":"税他","t":"住宅金融支援機構","ref":"R03s-46-2","s":"住宅金融支援機構は、災害により住宅が滅失した場合に、それに代わるべき住宅の建設や購入に必要な資金の貸付けを業務として行っている。","a":1,"e":"災害復興住宅融資として、滅失した住宅に代わる住宅の建設・購入資金を直接貸し付けている。","m":"災害復興は直接融資"},{"f":"税他","t":"住宅金融支援機構","ref":"R03s-46-3","s":"証券化支援事業（買取型）では、本人が居住する住宅だけでなく、親族が居住する住宅の建設・購入に係る貸付債権も買取りの対象となる。","a":1,"e":"買取型の対象は自ら居住する住宅または親族の居住用住宅に係る貸付債権。投資用の賃貸住宅は対象外。","m":"親族居住用も対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R03s-46-4","s":"住宅金融支援機構は、マンションの管理組合や区分所有者に対し、マンションの共用部分の改良に必要な資金の貸付けを業務として行っている。","a":1,"e":"マンション共用部分の改良資金は、機構が管理組合や区分所有者に直接貸し付ける業務の一つ。","m":"共用部分改良は直接融資"},{"f":"税他","t":"景品表示法","ref":"R03s-47-1","s":"宅建業者の広告では、現に利用できる商業施設に限り表示でき、工事中で将来確実に利用できると認められる商業施設であっても表示することはできない。","a":0,"e":"将来確実に利用できると認められる施設は、整備予定時期を明示すれば表示できる（表示規約施行規則）。","m":"将来施設は予定時期明示"},{"f":"税他","t":"景品表示法","ref":"R03s-47-2","s":"分譲マンションの広告において、その物件名に、物件から直線距離で1,100m離れた場所にある旧跡の名称を用いることができる。","a":0,"e":"公園・旧跡等の名称を物件名に使えるのは、物件から直線距離300m以内にある場合に限られる（表示規約19条）。","m":"旧跡名は300m以内"},{"f":"税他","t":"景品表示法","ref":"R03s-47-3","s":"宅建業者が土地の価格を広告するときは、1区画当たりの価格に加えて、必ず1平方メートル当たりの価格も併記しなければならない。","a":0,"e":"原則は1区画当たりの価格表示。区画の面積を明らかにして算出する場合は1㎡当たり価格で表示することもできる。","m":"原則は1区画の価格"},{"f":"税他","t":"土地・建物","ref":"R03s-50-1","s":"石・れんが・コンクリートブロックなどを積み上げて壁を造る組積式構造は、耐震性には劣るものの、遮音性や耐火性には優れている。","a":1,"e":"組積式構造は地震の横揺れに弱いが、材料が重く不燃であるため遮音性・耐火性は高い。","m":"組積式は地震に弱い"},{"f":"税他","t":"土地・建物","ref":"R03s-50-2","s":"石やれんがを積み上げる組積式構造を耐震的な構造にするには、大きな開口部を設けることを避け、壁の厚さを大きくする必要がある。","a":1,"e":"組積式は壁で建物を支えるため、開口部を小さくし壁厚を大きくすることで耐震性を高める。","m":"開口小さく壁厚く"},{"f":"税他","t":"土地・建物","ref":"R03s-50-3","s":"補強コンクリートブロック造は、コンクリートブロックの空洞部に鉄筋を入れコンクリートを充填して補強したもので、壁式構造の一種である。","a":1,"e":"補強コンクリートブロック造は鉄筋とコンクリートで補強したブロック壁で建物を支える壁式構造。","m":"補強CB造＝壁式"},{"f":"税他","t":"土地・建物","ref":"R03s-50-4","s":"補強コンクリートブロック造は多くの壁量を必要としないため大規模建築に向いており、住宅などの小規模な建物には用いられていない。","a":0,"e":"補強CB造は一定の壁量が必要で、耐力壁で囲まれる面積にも制限がある。主に住宅など小規模建築に用いられる。","m":"補強CB造は小規模向き"},{"f":"権利","t":"物権変動・対抗","ref":"R04-01-2","s":"AがB、Cに土地を二重に売却し、先に買ったBは未登記、背信的悪意者でないCが先に登記をした場合、BはCに所有権を対抗することができる。","a":0,"e":"二重譲渡の優劣は登記の先後で決まる。背信的悪意者でないCが登記を備えた以上、BはCに対抗できない。","m":"二重譲渡は登記が先"},{"f":"権利","t":"物権変動・対抗","ref":"R04-01-3","s":"背信的悪意者Cから土地を転得して登記したDが、第一買主Bとの関係で自身も背信的悪意者と評価される場合、DはBに所有権を対抗できない。","a":1,"e":"転得者が背信的悪意者かはその転得者自身について判断し、Dが背信的悪意者なら登記があってもBに対抗できない。","m":"転得者は本人で判断"},{"f":"権利","t":"物権変動・対抗","ref":"R04-01-4","s":"二重譲渡で、第二買主Cが第一買主Bの登記未了を知っていたにすぎず背信性はない場合、Cは登記を備えてもBに所有権を対抗できない。","a":0,"e":"単なる悪意者は民法177条の第三者に当たり、登記を備えれば第一買主Bに対抗できる。","m":"単なる悪意は保護される"},{"f":"権利","t":"意思表示・行為能力","ref":"R04-03-2","s":"成年後見人と成年被後見人がともに相続人である場合でも、相続放棄は相手方のない単独行為なので、後見人が被後見人を代理して放棄することは利益相反行為に当たらない。","a":0,"e":"被後見人が放棄すると後見人の相続分が増えるため、利益相反行為に当たり得る（判例）。単独行為でも同様。","m":"放棄でも利益相反"},{"f":"権利","t":"意思表示・行為能力","ref":"R04-03-3","s":"保佐人は被保佐人の一定の行為について同意権と取消権を有するが、家庭裁判所の審判によっても、保佐人に代理権が付与されることは一切ない。","a":0,"e":"家庭裁判所は、請求により特定の法律行為について保佐人に代理権を付与する審判をすることができる。","m":"保佐人も審判で代理権"},{"f":"権利","t":"賃貸借","ref":"R04-06-1","s":"Aが自己所有の土地を資材置場として期間2年でBに使用させる契約が書面による使用貸借である場合、Aは土地を引き渡す前であれば契約を解除できる。","a":0,"e":"引渡し前に貸主が解除できるのは書面によらない使用貸借に限られる（民法593条の2）。書面なら解除不可。","m":"書面の使用貸借は解除不可"},{"f":"権利","t":"賃貸借","ref":"R04-06-3","s":"土地の賃貸借で期間内に解約する権利を留保していれば期間内の解約申入れができ、使用貸借の借主は期間の定めがあってもいつでも契約を解除できる。","a":1,"e":"解約権を留保した賃貸借は期間内でも解約申入れ可（618条）。使用貸借の借主はいつでも解除できる（598条3項）。","m":"借主はいつでも解除"},{"f":"権利","t":"意思表示・行為能力","ref":"R04-07-ア","s":"失踪宣告を受けたAを単独相続したBが土地をCに売却した後、宣告が取り消された。売買当時、B・CともAの生存を知らなかったなら、CはAに所有権を対抗できる。","a":1,"e":"失踪宣告の取消しは、取消し前に善意でした行為に影響しない。契約では当事者双方の善意が必要（判例）。","m":"双方善意なら有効"},{"f":"権利","t":"意思表示・行為能力","ref":"R04-07-イ","s":"失踪宣告を受けたAの相続人Bが土地をCに売却後に宣告が取り消された場合、Bが売買当時Aの生存を知っていても、Cが知らなければCはAに所有権を対抗できる。","a":0,"e":"契約による取得の場合、相続人Bと相手方Cの双方が善意であることが必要。Bが悪意なら対抗できない。","m":"片方悪意なら無効"},{"f":"権利","t":"意思表示・行為能力","ref":"R04-07-ウ","s":"失踪宣告を受けたAの相続人Bが土地をCに売却後に宣告が取り消された場合、Bが善意でも、CがAの生存を知っていたときは、CはAに所有権を対抗できない。","a":1,"e":"取消し前の善意の行為が保護されるには、契約当事者の双方が善意である必要があり、C悪意なら保護されない。","m":"Cが悪意なら返還"},{"f":"権利","t":"意思表示・行為能力","ref":"R04-07-エ","s":"失踪宣告を受けたAの相続人Bが土地をCに売却後に宣告が取り消された場合、B・Cの双方がAの生存を知っていたときでも、Cは登記があればAに所有権を対抗できる。","a":0,"e":"双方とも悪意であれば失踪宣告取消しの効果は制限されず、Cは登記があってもAに対抗できない。","m":"双方悪意は保護なし"},{"f":"権利","t":"賃貸借","ref":"R04-08-1","s":"建物所有以外の目的で他人の土地を利用する権原が賃借権であっても地上権であっても、土地所有者は、その利用に必要な修繕をする義務を負う。","a":0,"e":"賃貸人は修繕義務を負う（民法606条）が、地上権設定者には修繕義務を定めた規定がない。","m":"地上権は修繕義務なし"},{"f":"権利","t":"賃貸借","ref":"R04-08-2","s":"Aが建物所有以外の目的で土地所有者Bから設定を受けた地上権を、Bの承諾なくCに譲渡した場合、BはCに土地の明渡しを請求できる。","a":0,"e":"地上権は物権であり、地主の承諾なく自由に譲渡できる。賃借権の無断譲渡とは扱いが異なる。","m":"地上権は譲渡自由"},{"f":"権利","t":"賃貸借","ref":"R04-08-3","s":"他人の土地を利用する権原が地上権であれば、その地上権に抵当権を設定できるが、賃借権であれば抵当権を設定することはできない。","a":1,"e":"抵当権の目的となるのは不動産・地上権・永小作権に限られ、賃借権には設定できない（民法369条）。","m":"地上権は抵当OK"},{"f":"権利","t":"賃貸借","ref":"R04-08-4","s":"土地の賃借人は、賃借権の対抗要件を備えていても、第三者が土地の占有を妨害しているときに、その妨害の停止を請求することはできない。","a":0,"e":"対抗要件を備えた不動産の賃借人は、占有妨害者に妨害の停止や返還を請求できる（民法605条の4）。","m":"対抗要件で妨害排除"},{"f":"権利","t":"不法行為・請負・委任","ref":"R04-09-ア","s":"委任を受けて代理人となった者は、委任者から報酬を受ける約束がある場合であっても、いつでも委任契約を解除して代理人を辞任することができる。","a":1,"e":"委任は各当事者がいつでも解除できる（民法651条1項）。有償か無償かは関係ない。不利な時期なら賠償の問題。","m":"委任はいつでも解除"},{"f":"権利","t":"意思表示・行為能力","ref":"R04-09-ウ","s":"成年後見人は、正当な事由があるときは、後見監督人が選任されていればその許可を得ることによって、その任務を辞することができる。","a":0,"e":"後見人の辞任には正当な事由と家庭裁判所の許可が必要（民法844条）。後見監督人の許可ではない。","m":"後見人辞任は家裁許可"},{"f":"権利","t":"相続","ref":"R04-09-エ","s":"遺言により指定された遺言執行者は、正当な事由があるときは、相続人全員の許可を得ることによって、その任務を辞することができる。","a":0,"e":"遺言執行者の辞任には正当な事由と家庭裁判所の許可が必要（民法1019条2項）。相続人の許可ではない。","m":"遺言執行者も家裁許可"},{"f":"権利","t":"時効","ref":"R04-10-4","s":"AがBに土地を売って引き渡した後、Cにも売却し登記を移した。その後Bの取得時効が完成した場合、Bは登記がなければ時効完成時の所有者Cに対抗できない。","a":0,"e":"Cは時効完成前の第三者であり、時効取得者Bは登記がなくてもCに所有権を対抗できる（判例）。","m":"完成前の第三者は登記不要"},{"f":"権利","t":"借地","ref":"R04-11-1","s":"普通借地権の当初の存続期間中に建物が滅失し、借地権者が残存期間を超えて存続する建物を築造した場合、借地権設定者の承諾がなくても借地権の期間は延長される。","a":0,"e":"期間延長は借地権設定者の承諾がある場合に限られ、承諾日か築造日の早い日から20年存続（借地借家法7条1項）。","m":"承諾あって20年延長"},{"f":"権利","t":"借地","ref":"R04-11-2","s":"建物所有目的の普通借地上に転借地権が設定されている場合、転借地上の建物が滅失すると転借地権は当然に消滅し、転借人は建物を再築できない。","a":0,"e":"建物の滅失だけで転借地権は消滅せず、承諾を得た再築による期間延長の規定は転借地権にも適用される。","m":"転借地も再築OK"},{"f":"権利","t":"借家","ref":"R04-12-1","s":"居住用建物の定期建物賃貸借をするには、契約前に、更新がなく期間満了で終了する旨を記載した賃貸借契約書を賃借人に交付して説明すれば足りる。","a":0,"e":"更新がない旨の説明書面は、契約書とは別個の書面であることが必要（借地借家法38条、判例）。","m":"説明書面は契約書と別"},{"f":"権利","t":"借家","ref":"R04-12-2","s":"建物の賃借人Aが引渡しを受けていれば、定期建物賃貸借であるか否かにかかわらず、その後に建物を買い受けたCに対して賃借権を主張できる。","a":1,"e":"建物賃貸借は、登記がなくても建物の引渡しがあれば、その後の物権取得者に対抗できる（借地借家法31条）。","m":"建物は引渡しで対抗"},{"f":"権利","t":"借家","ref":"R04-12-4","s":"居住用建物の賃貸借が期間満了で終了した場合、敷金を預かっている賃貸人は、賃借人から建物の返還を受けるまでは、敷金を返還する必要はない。","a":1,"e":"敷金返還義務は明渡し後に生じ、明渡しが先履行で同時履行の関係ではない（民法622条の2）。","m":"明渡しが先・敷金は後"},{"f":"権利","t":"区分所有法","ref":"R04-13-3","s":"区分所有建物の管理者の選任は、規約に別段の定めがない限り、集会に出席した区分所有者及びその議決権の各過半数による決議で行う。","a":1,"e":"管理者の選任・解任は普通決議事項。2026年4月施行の改正で普通決議は出席者の過半数（定足数あり）となった。","m":"管理者選任は普通決議"},{"f":"権利","t":"不動産登記法","ref":"R04-14-1","s":"売買を原因とする所有権移転登記を申請する場合、法令に別段の定めがない限り、申請情報とあわせて登記原因を証する情報を提供しなければならない。","a":1,"e":"権利に関する登記の申請では、原則として登記原因証明情報の提供が必要となる（不動産登記法61条）。","m":"権利登記に原因証明情報"},{"f":"権利","t":"不動産登記法","ref":"R04-14-3","s":"登記をすることで自ら登記名義人となる申請人が、あらかじめ登記識別情報の通知を希望しない旨を申し出たときは、登記官は登記識別情報を通知しない。","a":1,"e":"登記識別情報は原則通知されるが、申請人が不通知を申し出た場合は通知されない（不動産登記法21条ただし書）。","m":"不要と言えば通知なし"},{"f":"権利","t":"不動産登記法","ref":"R04-14-4","s":"不動産登記の申請人が登記完了証を登記所の窓口ではなく郵送で受け取りたい場合は、送付による交付を求める旨と送付先の住所を申請情報の内容としなければならない。","a":1,"e":"登記完了証は登記所での交付のほか、申請情報に送付希望と送付先を記載すれば郵送で受け取れる。","m":"郵送希望は申請情報に"},{"f":"法令","t":"都市計画法","ref":"R04-15-1","s":"市街化区域については都市計画に少なくとも用途地域を定めるものとし、市街化調整区域については原則として用途地域を定めない。","a":1,"e":"市街化区域は必ず用途地域を定め、市街化調整区域は原則として定めない（都市計画法13条1項7号）。","m":"市街化区域は用途地域必須"},{"f":"法令","t":"都市計画法","ref":"R04-15-4","s":"都市計画法上、工業地域は主として工業の利便を増進するため定める地域であり、工業専用地域とは異なり、住宅を建築することも認められている。","a":1,"e":"工業地域は工業の利便増進のための地域で住宅も建てられる。住宅が建てられないのは工業専用地域。","m":"住宅NGは工業専用だけ"},{"f":"法令","t":"建築基準法","ref":"R04-18-2","s":"敷地内に一定規模以上の空地を有する建築物で、特定行政庁が交通・安全・防火・衛生上支障がないとして許可したものは、許可の範囲内で建蔽率・容積率・各部分の高さの限度を超えることができる。","a":0,"e":"総合設計制度で緩和されるのは容積率と各部分の高さの限度で、建蔽率は対象外（建築基準法59条の2）。","m":"総合設計は容積と高さ"},{"f":"法令","t":"建築基準法","ref":"R04-18-3","s":"現に建築物が立ち並んでいる幅員1.8m未満の道は、特定行政庁が建築審査会の同意を得て指定すれば、建築基準法上の道路とみなされる。","a":1,"e":"幅員1.8m未満の道を2項道路として指定するには、建築審査会の同意が必要（建築基準法42条6項）。","m":"1.8m未満は審査会同意"},{"f":"法令","t":"建築基準法","ref":"R04-18-4","s":"建築基準法上、第一種住居地域内の建築物は、都市計画で定められた10m又は12mの建築物の高さの限度（絶対高さ制限）を超えてはならない。","a":0,"e":"絶対高さ制限（10m・12m）は第一種・第二種低層住居専用地域と田園住居地域だけに適用される（法55条）。","m":"絶対高さは低層と田園"},{"f":"法令","t":"盛土規制法","ref":"R04-19-2","s":"宅地造成等工事規制区域内で、森林を宅地にするために切土をして高さ3mの崖を生じさせる工事を行う場合、原則として着手前に都道府県知事の許可を受けなければならない。","a":1,"e":"切土で高さ2m超の崖を生ずる工事は宅地造成に当たり、原則として知事の許可が必要（盛土規制法12条）。","m":"切土2m超の崖は許可"},{"f":"法令","t":"盛土規制法","ref":"R04-19-3","s":"宅地造成等工事規制区域内の宅地の所有者は、その宅地が区域指定前に造成されたものであっても、災害が生じないよう安全な状態に維持するよう努めなければならない。","a":1,"e":"規制区域内の土地の所有者・管理者・占有者には、安全な状態に維持する努力義務がある（盛土規制法22条1項）。","m":"所有者は安全維持の努力"},{"f":"法令","t":"盛土規制法","ref":"R04-19-4","s":"盛土規制法上、造成宅地防災区域は、宅地造成等工事規制区域内の土地についても、災害防止のため必要があれば重ねて指定することができる。","a":0,"e":"造成宅地防災区域は、宅地造成等工事規制区域内の土地を除いた区域について指定される（盛土規制法45条）。","m":"防災区域は規制区域の外"},{"f":"法令","t":"土地区画整理法","ref":"R04-20-1","s":"組合施行の土地区画整理事業で、設立認可の公告後に施行地区内で事業の障害となる建築物を新築しようとする者は、当該組合の許可を受ければ足りる。","a":0,"e":"建築行為等の許可権者は施行者ではなく、原則として都道府県知事等である（土地区画整理法76条）。","m":"建築制限は施行者でなく知事"},{"f":"法令","t":"土地区画整理法","ref":"R04-20-2","s":"換地処分は原則として換地計画区域の全部の工事完了後に行うが、規準・規約・定款等に別段の定めがあれば、工事完了前でも行うことができる。","a":1,"e":"換地処分は原則工事完了後だが、規準等に別段の定めがあれば完了前にもできる（土地区画整理法103条2項）。","m":"原則は工事完了後"},{"f":"法令","t":"土地区画整理法","ref":"R04-20-3","s":"土地区画整理事業で、仮換地の指定等により使用し収益することができる者がいなくなった従前の宅地は、換地処分の公告がある日まで施行者が管理する。","a":1,"e":"使用収益する者のいなくなった従前の宅地は、換地処分の公告の日まで施行者が管理する（法100条の2）。","m":"空いた従前地は施行者管理"},{"f":"税他","t":"印紙税・登録免許税","ref":"R04-23-2","s":"1通の契約書に甲土地の譲渡（6,000万円）と乙建物の譲渡（3,000万円）を区分して記載した場合、印紙税の記載金額は高いほうの6,000万円となる。","a":0,"e":"同じ号の課税事項が複数記載されている場合は合計額が記載金額となり、本件では9,000万円となる。","m":"同じ号は合計額"},{"f":"税他","t":"印紙税・登録免許税","ref":"R04-23-4","s":"駐車場経営者と車の所有者が、特定の区画に車を駐車させる契約書を作成した場合、土地の賃借権の設定に関する契約書として印紙税が課される。","a":0,"e":"駐車場という施設の利用契約は土地の賃借権設定契約に当たらず、印紙税の課税文書とならない。","m":"駐車場契約は非課税"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R04-25-3","s":"地価公示法上、不動産鑑定士が公示区域内の土地について鑑定評価を行い、その正常な価格を求めるときは、公示価格を規準としなければならない。","a":1,"e":"公示区域内で鑑定評価を行う際は、標準地の公示価格と均衡を保たせる「規準」が義務となる（地価公示法8条）。","m":"鑑定士は公示価格を規準"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R04-25-4","s":"地価公示法上の公示区域は、都市計画区域その他の土地取引が相当程度見込まれる区域のうち、国土利用計画法の規制区域を除いた区域から指定される。","a":1,"e":"投機的取引で地価が急騰するおそれのある規制区域は、公示価格の参考にならないため公示区域から除かれる。","m":"規制区域は公示区域外"},{"f":"業法","t":"重要事項説明","ref":"R04-28-1","s":"宅建業者が、宅建業者でない個人から媒介業者を介さずに土地付建物を買い受ける場合、買主である宅建業者は重要事項説明書を作成しなくても業法違反とならない。","a":1,"e":"重要事項説明は買主・借主に対して行うもの。自ら買主となる業者には作成・説明の義務がない（法35条）。","m":"業者が買主なら重説なし"},{"f":"業法","t":"重要事項説明","ref":"R04-28-2","s":"宅建業者が調査不足のために事実と異なる内容を重要事項説明書に記載してしまった場合でも、意図的に記載したものでなければ宅建業法違反とはならない。","a":0,"e":"故意でなくても、事実と異なる記載をした重要事項説明書は業法違反となる。調査を尽くす義務がある。","m":"誤記載は故意なしでも違反"},{"f":"業法","t":"重要事項説明","ref":"R04-28-3","s":"土地売買の媒介をする宅建業者は、宅建業者でない売主に対しても、契約成立前に宅建士に重要事項説明書を交付して説明させなければならない。","a":0,"e":"重要事項の説明・書面交付の相手は買主（借主）であり、売主に対して行う義務はない（法35条1項）。","m":"重説の相手は買主"},{"f":"業法","t":"重要事項説明","ref":"R04-28-4","s":"重要事項説明書は、権利関係や法令上の制限など専門的な内容を含むため、宅建士が自ら作成しなければならず、宅建士以外の従業者が作成することは認められない。","a":0,"e":"作成者に制限はない。宅建士に求められるのは、書面への記名と説明である（法35条5項）。","m":"作成は誰でも可"},{"f":"業法","t":"宅建士","ref":"R04-29-1","s":"登録を受けている者が拘禁刑に処せられた場合、本人はその日から30日以内に、登録を受けている都道府県知事にその旨を届け出なければならない。","a":1,"e":"拘禁刑以上の刑に処せられたときは、本人が30日以内に登録知事へ届け出る（法21条）。2025年6月に禁錮は拘禁刑に一本化。","m":"拘禁刑は本人が30日以内"},{"f":"業法","t":"宅建士","ref":"R04-29-2","s":"事務禁止処分を受けた宅建士は、速やかに宅建士証をその交付を受けた都道府県知事に提出しなければならず、怠ると過料に処せられることがある。","a":1,"e":"事務禁止処分を受けたら宅建士証を交付知事へ速やかに提出する（法22条の2第7項）。違反は10万円以下の過料。","m":"事務禁止は宅建士証提出"},{"f":"業法","t":"宅建士","ref":"R04-29-4","s":"宅建業法上、宅建士が守るべき信用を害するような行為の禁止は、宅建士の職務として行われる行為に限られ、職務と関係のない私的な行為には及ばない。","a":0,"e":"信用失墜行為の禁止は、職務に必ずしも直接関係しない行為や私的な行為も対象となる（法15条の2）。","m":"私生活も信用失墜対象"},{"f":"業法","t":"37条書面","ref":"R04-32-1","s":"宅建業者Aが売主、宅建業者Bが媒介する建物売買で、共同作成した37条書面にBの宅建士が記名していれば、Aは自社の宅建士に記名させる必要はない。","a":0,"e":"37条書面は取引に関与した宅建業者それぞれに交付義務があり、各業者が自社の宅建士に記名させる必要がある。","m":"関与業者は各自記名"},{"f":"業法","t":"37条書面","ref":"R04-32-2","s":"宅建業者の宅建士は、37条書面を売買の相手方に交付する際には、取引の関係者から請求がなくても、必ず宅建士証を提示しなければならない。","a":0,"e":"宅建士証の提示が請求なしで必要なのは重要事項説明の時。37条書面の交付時は請求があれば提示する（法22条の4）。","m":"請求なし提示は重説だけ"},{"f":"業法","t":"37条書面","ref":"R04-32-3","s":"宅建業者が自ら売主となる建物の売買で手付金等の保全措置を講じる場合、保全措置の概要は37条書面の記載事項ではないため、37条書面に記載しなくてもよい。","a":1,"e":"保全措置の概要は重要事項説明（35条）の記載事項であり、37条書面の記載事項ではない。","m":"保全措置は35条だけ"},{"f":"業法","t":"宅建士","ref":"R04-33-ア","s":"未成年者は、宅建試験に合格していても、法定代理人から営業の許可を受けているかどうかにかかわらず、成年に達するまでは宅建士の登録を受けることができない。","a":0,"e":"営業に関し成年者と同一の行為能力を有する未成年者であれば、登録を受けることができる（法18条1項1号）。","m":"営業許可の未成年は登録可"},{"f":"業法","t":"宅建士","ref":"R04-33-ウ","s":"事務禁止処分を受けた宅建士は、他県の宅建業者の事務所で業務に従事しようとする場合でも、禁止期間が満了するまでは登録の移転を申請できない。","a":1,"e":"事務禁止処分の期間中は、登録の移転を申請することができない（法19条の2ただし書）。","m":"事務禁止中は移転不可"},{"f":"業法","t":"宅建士","ref":"R04-33-エ","s":"登録の移転と同時に宅建士証の交付を申請した場合、新たに交付される宅建士証の有効期間は、従前の宅建士証の残りの有効期間となる。","a":1,"e":"移転先で交付される宅建士証の有効期間は、従前の宅建士証の有効期間が満了するまでの期間（法22条の2第5項）。","m":"移転後は残存期間"},{"f":"業法","t":"業務上の規制","ref":"R04-35-1","s":"宅建業者の従業者である宅建士は、取引の関係者から従業者証明書の提示を求められた場合、従業者証明書に代えて宅建士証を提示すれば足りる。","a":0,"e":"従業者証明書の提示を求められたときは従業者証明書を提示する必要があり、宅建士証で代えることはできない（法48条）。","m":"従業者証明書は代用不可"},{"f":"業法","t":"重要事項説明","ref":"R04-35-2","s":"宅建業者が自ら売主となり、宅建業者である法人に建物を売却する場合、35条書面を交付すれば、宅建士による重要事項の説明は省略できる。","a":1,"e":"相手方が宅建業者の場合は説明不要だが、宅建士が記名した35条書面の交付は必要（法35条6項）。","m":"業者相手は交付のみ"},{"f":"業法","t":"重要事項説明","ref":"R04-35-3","s":"建物の賃貸借の媒介を行う宅建業者は、宅建業者でない個人の借主に対する重要事項の説明を、賃貸借契約が成立した後に遅滞なく行えば足りる。","a":0,"e":"重要事項の説明は、契約が成立するまでの間に行わなければならない。成立後では違反となる（法35条1項）。","m":"重説は契約成立前"},{"f":"業法","t":"重要事項説明","ref":"R04-40-ア","s":"建物の貸借の媒介で、借主がテレビ会議等の環境を持たないため、宅建士が電話で重要事項を説明し、重要事項説明書を郵送した場合、宅建業法に違反しない。","a":0,"e":"ITによる説明は映像で相互に確認できる環境が必要。電話のみの説明と書面郵送では重要事項説明にならない。","m":"電話だけの重説は不可"},{"f":"業法","t":"重要事項説明","ref":"R04-40-ウ","s":"物件を担当していない宅建士であっても、宅建士証を提示したうえで、重要事項説明書に記名し、重要事項の説明をすることができる。","a":1,"e":"記名・説明は宅建士であれば誰でもよく、物件担当者や専任である必要はない。説明時には宅建士証の提示が必要。","m":"担当外の宅建士でもOK"},{"f":"業法","t":"重要事項説明","ref":"R04-40-エ","s":"宅建士が記名した重要事項説明書を事前に交付し、双方向で映像と音声をやりとりできる環境を確認して、画面上で宅建士証を提示しながら説明した場合、テレビ会議による重要事項説明として認められる。","a":1,"e":"IT重説は、双方向の映像・音声、書面の事前交付、開始前の環境確認、画面での宅建士証提示の要件を満たせば認められる。","m":"IT重説は4要件"},{"f":"業法","t":"媒介契約","ref":"R04-42-1","s":"宅建業者Aが売主Bと宅地の売却について専属専任媒介契約を締結した場合、AはBに対し、業務の処理状況を2週間に1回以上報告すれば足りる。","a":0,"e":"専属専任媒介契約では1週間に1回以上の報告が必要。2週間に1回以上は専任媒介契約の場合。","m":"専属専任は1週1回"},{"f":"業法","t":"媒介契約","ref":"R04-42-3","s":"専属専任媒介契約の有効期間は3か月が上限だが、依頼者から書面で申出があれば、当初から3か月を超える有効期間を定めることができる。","a":0,"e":"専任・専属専任の有効期間は3か月が上限で、これより長く定めた場合は3か月となる。申出があっても超えられない。","m":"有効期間は最長3か月"},{"f":"業法","t":"媒介契約","ref":"R04-42-4","s":"専属専任媒介契約を締結した宅建業者は、指定流通機構に登録したときは、依頼者から求められなくても、登録を証する書面を遅滞なく依頼者に引き渡さなければならない。","a":1,"e":"専任・専属専任では、指定流通機構への登録後、登録を証する書面を遅滞なく依頼者へ引き渡す義務がある。","m":"登録証明は求めなくても"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R04-45-3","s":"新築住宅を自ら売主として宅建業者でない買主に引き渡した宅建業者は、基準日から3週間を経過する日までに、基準日前10年間の引渡し戸数に応じた保証金を供託していなければならない。","a":1,"e":"基準日（3月31日）から3週間以内に供託が必要。保険契約を締結した住宅は戸数から除かれる（履行法11条）。","m":"基準日から3週間"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R04-45-4","s":"住宅販売瑕疵担保保証金の額が基準額を超えることとなった宅建業者は、免許権者の承認を受けることなく、その超過額を取り戻すことができる。","a":0,"e":"基準額を超える額は取り戻せるが、免許権者（大臣または知事）の承認を受ける必要がある。","m":"超過額取戻しは承認要"},{"f":"税他","t":"土地・建物","ref":"R04-49-3","s":"埋立地は一般に平均海面より4〜5m程度高く造成されており、護岸が強固であれば住宅地として利用することも可能である。","a":1,"e":"埋立地は海面より4〜5m程度高く、護岸がしっかりしていれば小さな高波や地震に耐え、住宅地にも利用できる。","m":"埋立地は護岸次第"},{"f":"税他","t":"土地・建物","ref":"R04-49-4","s":"国土交通省のハザードマップポータルサイトでは、洪水・土砂災害・高潮・津波のリスク情報を地図や写真に重ねて表示できる。","a":1,"e":"同サイトの「重ねるハザードマップ」で、洪水・土砂災害・高潮・津波のリスクを地図等に重ねて確認できる。","m":"重ねるハザードマップ"},{"f":"税他","t":"土地・建物","ref":"R04-50-1","s":"木造の在来軸組構法の主要な構造は、一般に、屋根を支える小屋組、床を支える床組、それ以外の骨組みである軸組から構成される。","a":1,"e":"在来軸組構法は土台・柱・梁などを木材で組む工法で、主要構造は小屋組・床組・軸組から成る。","m":"小屋組・床組・軸組"},{"f":"税他","t":"土地・建物","ref":"R04-50-2","s":"木造の在来軸組構法における軸組は、主として土台・桁・胴差などの水平材と、柱・耐力壁などの垂直材を組み合わせて構成される。","a":1,"e":"桁や胴差は水平材、柱や耐力壁は垂直材であり、これらを組み合わせて軸組を構成する。","m":"水平材＋垂直材＝軸組"},{"f":"権利","t":"相続","ref":"R05-01-1","s":"相続開始から遺産分割までに遺産の賃貸不動産から生じた賃料債権は、遺産分割でその不動産を取得した相続人が相続開始時にさかのぼって単独で取得する。","a":0,"e":"分割前の賃料債権は、各共同相続人が相続分に応じて確定的に取得し、後の遺産分割の影響を受けない（判例）。","m":"分割前の賃料は相続分で"},{"f":"権利","t":"相続","ref":"R05-01-2","s":"相続人が数人あるときは、相続財産は共同相続人の共有に属し、各共同相続人はその相続分に応じて被相続人の権利義務を承継する。","a":1,"e":"共同相続では相続財産は共有となり、各相続人は相続分に応じて権利義務を承継する（民法898条・899条）。","m":"共同相続は共有"},{"f":"権利","t":"相続","ref":"R05-01-3","s":"共同相続人の間で遺産分割が行われた場合、その効力は相続開始の時にさかのぼって生ずるが、それによって第三者の権利を害することはできない。","a":1,"e":"遺産分割には相続開始時への遡及効があるが、分割前に権利を得た第三者を害することはできない（民法909条）。","m":"遡及するが第三者保護"},{"f":"権利","t":"相続","ref":"R05-01-4","s":"共同相続された賃貸不動産を遺産分割により単独で取得した相続人は、遺産分割の後に生じたその不動産の賃料債権を単独で取得する。","a":1,"e":"遺産分割後に生じた賃料債権は、分割によって不動産を単独で取得した相続人に帰属する。分割前の分とは扱いが異なる。","m":"分割後の賃料は取得者へ"},{"f":"権利","t":"共有・相隣","ref":"R05-02-3","s":"民法上、相隣者の一人は、相隣者間で共有する障壁の高さを増す工事をしようとするときは、他方の相隣者の承諾を得なければならない。","a":0,"e":"共有障壁の高さは相隣者の一人が単独で増すことができ、増した部分はその者の単独所有となる（民法231条）。","m":"共有障壁は単独でかさ上げ"},{"f":"権利","t":"不法行為・請負・委任","ref":"R05-03-1","s":"AがBに建物の増築を注文し、増築部分が建物の構成部分となった場合、Aが請負代金を支払っていなくても、増築部分の所有権はAに帰属する。","a":1,"e":"独立性のない増築部分は建物に付合して建物所有者Aのものとなる（民法242条）。代金は別に請求できる。","m":"構成部分は建物所有者へ"},{"f":"権利","t":"不法行為・請負・委任","ref":"R05-03-3","s":"請負人が引渡しの時に工事の品質の不適合を知っていた場合、注文者は不適合を知ってから1年以内に通知しなくても、消滅時効が完成するまで修補を請求できる。","a":1,"e":"請負人が引渡し時に不適合を知り又は重過失で知らなかったときは、1年の通知期間制限は適用されない（民法637条2項）。","m":"悪意の請負人に期間制限なし"},{"f":"権利","t":"不法行為・請負・委任","ref":"R05-03-4","s":"注文者が提供した材料の性質によって不適合が生じ、請負人がその材料の不適当を知らなかった場合、注文者は修補や代金減額、損害賠償、解除を請求できない。","a":1,"e":"注文者の材料・指図による不適合は、請負人が不適当と知りながら告げなかった場合を除き責任追及できない（民法636条）。","m":"注文者の材料なら追及不可"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"R05-04-ア","s":"AのBに対する弁済期の定めのない甲債権と、BのAに対する弁済期未到来の乙債権がある場合、Aは乙債権の期限の利益を放棄すれば、甲債権と乙債権を相殺できる。","a":1,"e":"弁済期の定めのない債権は直ちに相殺に使え、受働債権は期限の利益を放棄して弁済期を到来させれば相殺できる。","m":"期限の利益は放棄できる"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"R05-04-イ","s":"AのBに対する甲債権は弁済期が到来しており、BのAに対する乙債権は弁済期の定めがない場合、Aは甲債権と乙債権を相殺できる。","a":1,"e":"自働債権の甲債権が弁済期にあり、受働債権も弁済期の定めがなく弁済できるので、Aから相殺できる（民法505条）。","m":"自働債権が弁済期ならOK"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"R05-04-ウ","s":"AのBに対する甲債権に弁済期の定めがない場合、Aはまず履行の請求をしてからでなければ、甲債権を自働債権として弁済期にある乙債権と相殺することはできない。","a":0,"e":"弁済期の定めのない債権は成立と同時に相殺に用いることができ、事前の請求は不要とされる（判例）。","m":"定めなしは即相殺可"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"R05-04-エ","s":"AのBに対する甲債権の弁済期が未到来で、BのAに対する乙債権の弁済期が到来している場合、Aは一方的な意思表示で甲債権と乙債権を相殺できる。","a":0,"e":"相殺には自働債権の弁済期到来が必要。この場合Aからは相殺できないが、Bからは相殺できる（民法505条）。","m":"自働債権の弁済期が要"},{"f":"権利","t":"時効","ref":"R05-06-ア","s":"A所有の土地をBが占有中、AがCに土地を売却しCが登記した後にBの取得時効が完成した場合、Bは登記なしで時効取得をCに対抗できる。","a":1,"e":"時効完成前に現れた第三者は時効取得者にとって当事者と同様であり、登記なしで対抗できる（判例）。","m":"完成前の第三者に登記不要"},{"f":"権利","t":"時効","ref":"R05-06-イ","s":"Bの取得時効完成後にAから土地を買ったDが先に登記した場合でも、その登記後にBがさらに時効取得に必要な期間占有を続けたときは、Bは登記なしでDに対抗できる。","a":1,"e":"時効完成後の第三者とは対抗関係になるが、その登記後に再び時効が完成すれば登記なしで対抗できる（判例）。","m":"登記後の再度の時効"},{"f":"権利","t":"時効","ref":"R05-06-ウ","s":"Bの取得時効完成後、未登記の間にEがAから抵当権設定を受け登記した場合でも、その後Bが占有を続け再度時効が完成すれば、特段の事情がない限り抵当権は消滅する。","a":1,"e":"抵当権設定登記後に再度の時効取得が完成すれば、特段の事情がない限り抵当権は消滅する（最判平24.3.16）。","m":"再度の時効で抵当権消滅"},{"f":"権利","t":"相続","ref":"R05-07-2","s":"遺産分割で配偶者居住権を取得した配偶者Bは、建物の所有権を取得した子Cの承諾を得なくても、建物を第三者に賃貸することができる。","a":0,"e":"配偶者は居住建物の所有者の承諾を得なければ、第三者に使用・収益させることができない（民法1032条3項）。","m":"賃貸には所有者の承諾"},{"f":"権利","t":"相続","ref":"R05-07-3","s":"遺産分割で配偶者が配偶者居住権を取得した場合、居住建物の所有者は、配偶者に対し配偶者居住権の設定の登記を備えさせる義務を負う。","a":1,"e":"居住建物の所有者は、配偶者居住権を取得した配偶者に設定登記を備えさせる義務を負う（民法1031条1項）。","m":"所有者に登記義務"},{"f":"権利","t":"相続","ref":"R05-07-4","s":"被相続人の配偶者が配偶者居住権を取得した建物について、その建物の通常の必要費は、建物の所有権を取得した相続人が負担しなければならない。","a":0,"e":"居住建物の通常の必要費は配偶者居住権を有する配偶者が負担する（民法1034条1項）。","m":"通常費用は配偶者負担"},{"f":"権利","t":"意思表示・行為能力","ref":"R05-08-1","s":"未成年者Aが法定代理人Bの同意を得ずに建物を買い受けた後、Bの同意なく未成年を理由に契約を取り消した場合、Bは同意がないことを理由にその取消しを取り消せる。","a":0,"e":"制限行為能力者本人も単独で取消しができ（民法120条）、その取消しを同意がないとして取り消すことはできない。","m":"本人単独で取消せる"},{"f":"権利","t":"意思表示・行為能力","ref":"R05-08-2","s":"未成年者Aが法定代理人の同意なく建物を買い受けた場合、売主CがAを未成年者と知らず過失もなかったときは、法定代理人はその契約を取り消すことができない。","a":0,"e":"未成年を理由とする取消しは、相手方が善意無過失であっても認められる（民法5条2項）。","m":"相手の善意は無関係"},{"f":"権利","t":"意思表示・行為能力","ref":"R05-08-3","s":"未成年のときに同意なく結んだ売買契約について、本人が成年に達し取消権があることを知った後に追認すれば、以後その契約を取り消すことはできない。","a":1,"e":"追認は取消しの原因が消滅し、取消権を知った後にでき、追認後は取り消せない（民法122条・124条）。","m":"成年後に知って追認"},{"f":"権利","t":"意思表示・行為能力","ref":"R05-08-4","s":"未成年者Aが同意なく買い受けた建物を、成年に達する前に同意なく第三者に転売した場合、Aは元の売買契約を取り消すことができなくなる。","a":0,"e":"法定追認は追認できる時以後の行為に限られ、未成年中の転売では生じないため取り消せる（民法125条）。","m":"未成年中は法定追認なし"},{"f":"権利","t":"賃貸借","ref":"R05-09-4","s":"建物の賃貸借で修繕が必要になった場合、急迫の事情があるときは、賃借人は賃貸人に通知して相当期間待たなくても、自ら修繕することができる。","a":1,"e":"賃借人が修繕できるのは①通知等後に相当期間内に修繕されないとき②急迫の事情があるとき（民法607条の2）。","m":"急迫なら借主が直す"},{"f":"権利","t":"抵当権・担保","ref":"R05-10-1","s":"一番抵当権者Bが三番抵当権者Dの利益のために抵当権の順位を放棄した場合、Bは放棄したことにより競売代金から一切配当を受けられなくなる。","a":0,"e":"順位の放棄では、BとDの本来の配当額の合計を債権額の割合で分け合う。Bの配当がゼロになるわけではない（民法376条）。","m":"順位放棄は按分"},{"f":"権利","t":"抵当権・担保","ref":"R05-10-2","s":"一番B1,000万円・二番C1,200万円・三番D2,000万円の抵当権があり、BがDのために順位を放棄し、競売代金が2,400万円の場合、Bの配当額は200万円である。","a":0,"e":"放棄前はB1,000万・D200万。合計1,200万をB:D＝1:2で按分し、Bは400万円、Dは800万円となる。","m":"BとDで合計を按分"},{"f":"権利","t":"借地","ref":"R05-11-2","s":"居住用の賃貸アパートを所有する目的で存続期間50年の借地契約を結び、更新しない旨の特約を付ける場合、その契約は公正証書によらなければならない。","a":0,"e":"居住用建物目的なので事業用定期借地権は使えないが、一般定期借地権（50年以上）は書面または電磁的記録で足りる（借地借家法22条）。","m":"一般定借は書面でOK"},{"f":"権利","t":"借地","ref":"R05-11-3","s":"借地権者の地代不払いを理由に借地契約が債務不履行解除された場合でも、借地権者は借地権設定者に対し建物買取請求をすることができる。","a":0,"e":"建物買取請求権は期間満了で更新がない場合の権利で、債務不履行による解除で終了したときは行使できない（判例）。","m":"不履行解除は買取不可"},{"f":"権利","t":"借地","ref":"R05-11-4","s":"建物所有目的の借地権の期間満了時に建物があり、借地権者が更新を請求した場合、借地権設定者が遅滞なく正当事由ある異議を述べなければ、契約は更新されたものとみなされる。","a":1,"e":"建物がある場合の更新請求には、正当事由を備えた遅滞なき異議がない限り更新とみなされる（借地借家法5条・6条）。","m":"更新請求＋異議なし更新"},{"f":"権利","t":"借家","ref":"R05-12-4","s":"普通建物賃貸借で賃貸人が借賃の増額を請求するには、現在の借賃が定められた時から一定の期間が経過していることが必要とされている。","a":0,"e":"租税の増減や経済事情の変動等で不相当となれば、一定期間の経過を待たず増額請求できる（借地借家法32条1項）。","m":"増額請求に期間不要"},{"f":"権利","t":"区分所有法","ref":"R05-13-1","s":"区分所有法の集会では原則として招集通知であらかじめ示した事項しか決議できないが、特別の定数が定められた事項以外は、規約で別段の定めをすればこの限りでない。","a":1,"e":"通知事項以外も、特別決議事項を除き、規約の定めがあれば決議できる（区分所有法37条）。","m":"規約で通知外も決議可"},{"f":"権利","t":"区分所有法","ref":"R05-13-4","s":"一部共用部分に関する事項で全員の利害に関係しないものを区分所有者全員の規約で変更する場合、その一部共用部分の共用者8人のうち3人が反対すると変更できない。","a":1,"e":"一部共用者の4分の1を超える者またはその議決権の4分の1超が反対すると変更できない。8人の4分の1は2人なので3人で阻止（区分所有法31条2項）。","m":"4分の1超の反対で不可"},{"f":"権利","t":"不動産登記法","ref":"R05-14-3","s":"共有物分割禁止の定めに係る権利の変更の登記は、その権利の共有者である全ての登記名義人が共同して申請しなければならず、一部の者ではできない。","a":1,"e":"分割禁止の定めの変更登記は、共有者全員の共同申請による（不動産登記法65条）。一部の共有者だけではできない。","m":"分割禁止変更は全員で"},{"f":"権利","t":"不動産登記法","ref":"R05-14-4","s":"区分建物では、表題部所有者のほか、表題部所有者から直接所有権を取得した者も、自己を名義人とする所有権保存登記を申請することができる。","a":1,"e":"区分建物は表題部所有者から所有権を取得した者も保存登記を申請できる（不動産登記法74条2項）。分譲マンションの購入者が典型。","m":"区分建物は買主も保存"},{"f":"法令","t":"開発許可","ref":"R05-16-2","s":"開発許可を受けた者が、開発許可の申請書の記載事項について国土交通省令で定める軽微な変更をする場合、都道府県知事の許可も届出も不要である。","a":0,"e":"軽微な変更は許可不要だが、遅滞なく知事に届け出なければならない（都市計画法35条の2第3項）。","m":"軽微な変更は届出"},{"f":"法令","t":"開発許可","ref":"R05-16-3","s":"開発行為に関する工事が完了し、都道府県知事が検査済証を交付したときは、開発許可を受けた者が工事完了の公告をしなければならない。","a":0,"e":"検査済証を交付した後、工事完了の公告をするのは都道府県知事である（都市計画法36条3項）。","m":"完了公告は知事"},{"f":"法令","t":"開発許可","ref":"R05-16-4","s":"市街化調整区域のうち開発許可を受けた開発区域以外の区域では、誰でも都道府県知事の許可を受けずに建築物を新築することができる。","a":0,"e":"開発区域以外の市街化調整区域で建築物を新築するには、原則として知事の許可が必要（都市計画法43条1項）。農林漁業者の住宅等の例外のみ不要。","m":"調整区域の新築は許可"},{"f":"法令","t":"建築基準法","ref":"R05-17-1","s":"地方公共団体は、条例で津波・高潮・出水等による危険の著しい区域を災害危険区域に指定し、区域内で住居用建築物の建築を禁止することができる。","a":1,"e":"災害危険区域の指定と、住居用建築物の禁止など災害防止上必要な制限は条例で定める（建築基準法39条）。","m":"災害危険区域は条例"},{"f":"法令","t":"建築基準法","ref":"R05-17-2","s":"避難階以外の階を、床面積の合計が1,500㎡を超える物品販売業の店舗の売場とする場合、その階から避難階または地上に通ずる直通階段を2以上設けなければならない。","a":1,"e":"1,500㎡超の物品販売店舗の売場の階には、2以上の直通階段が必要とされる（建築基準法施行令121条）。","m":"物販1500超は階段2つ"},{"f":"法令","t":"建築基準法","ref":"R05-18-2","s":"建築物は原則として道路内に建築できないが、地盤面下に設ける建築物であっても、道路内に建築することは一切認められていない。","a":0,"e":"地盤面下に設ける建築物は、道路内の建築制限の例外として建築できる（建築基準法44条1項1号）。","m":"地下なら道路内OK"},{"f":"法令","t":"建築基準法","ref":"R05-18-3","s":"地方公共団体は、袋路状道路にのみ接する延べ面積150㎡超の建築物について、条例で接道等の制限を付加できるが、一戸建ての住宅はこの対象から除かれる。","a":1,"e":"袋路状道路にのみ接する延べ面積150㎡超の建築物は条例で制限付加できるが、一戸建て住宅は除外される（建築基準法43条3項5号）。","m":"袋路は戸建て除く"},{"f":"法令","t":"盛土規制法","ref":"R05-19-2","s":"都道府県知事は、その地方の自然条件の特殊性から盛土規制法の技術的基準だけでは災害防止の目的を達し難いと認める場合、規則で基準を強化し、または付加することができる。","a":1,"e":"自然的条件の特殊性により必要な場合、都道府県の規則で技術的基準を強化・付加できる（宅地造成及び特定盛土等規制法施行令）。","m":"規則で基準を強化"},{"f":"法令","t":"盛土規制法","ref":"R05-19-3","s":"都道府県知事は、宅地造成等工事規制区域内の土地について災害防止のため必要と認める場合、土地所有者等に対し擁壁等の設置などの措置を勧告できる。","a":1,"e":"規制区域内の土地の保全のため、知事は所有者・管理者・占有者等に擁壁等の設置等を勧告できる（盛土規制法22条2項）。","m":"規制区域で勧告できる"},{"f":"法令","t":"盛土規制法","ref":"R05-19-4","s":"宅地造成等工事規制区域内で、雨水や地下水を排除する排水施設の全部または一部を除却する工事を行う者は、許可を要する場合等を除き、都道府県知事に届け出なければならない。","a":1,"e":"擁壁・排水施設等の除却工事は、工事着手の14日前までに知事へ届出が必要（盛土規制法21条3項）。","m":"排水施設除却は届出"},{"f":"法令","t":"土地区画整理法","ref":"R05-20-2","s":"現に土地区画整理事業が施行されている施行地区内では、その施行者の同意を得なければ、他の者が同じ区域で土地区画整理事業を施行することはできない。","a":1,"e":"同一区域で複数の事業が重ならないよう、施行中の地区では施行者の同意がなければ他の者は施行できない。","m":"重ねて施行は同意要"},{"f":"法令","t":"土地区画整理法","ref":"R05-20-3","s":"換地処分の公告があった場合、施行地区内の土地・建物について事業による変動があったときは、施行者は遅滞なくその変動に係る登記を申請または嘱託しなければならない。","a":1,"e":"換地処分の公告後、施行者は遅滞なく変動の登記を申請・嘱託する（土地区画整理法107条2項）。他の登記はそれまで原則制限。","m":"変動登記は施行者"},{"f":"法令","t":"国土利用計画法","ref":"R05-22-2","s":"市街化区域内の3,000㎡の土地を相続により取得した者は、取得後2週間以内に国土利用計画法の事後届出をしなければならない。","a":0,"e":"相続は対価性・契約性がなく「土地売買等の契約」に当たらないため、事後届出は不要（国土利用計画法23条）。","m":"相続は届出不要"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R05-24-1","s":"不動産取得税は、給与所得に係る個人住民税と同じように、特別徴収の方法によって徴収することができる都道府県の地方税である。","a":0,"e":"不動産取得税は都道府県が納税通知書を交付して納めさせる普通徴収による（地方税法73条の17）。","m":"取得税は普通徴収"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R05-24-2","s":"不動産取得税は、都市計画税と同じく、その税収の使い道が法律であらかじめ特定されている目的税に分類される都道府県の地方税である。","a":0,"e":"不動産取得税は使途を限定しない普通税で、道府県税である。目的税の代表例は都市計画税。","m":"取得税は普通税"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R05-25-1","s":"不動産鑑定評価基準によれば、原価法とは、対象不動産の収益価格をまず求め、これに減価修正を行って比準価格を求める鑑定評価の手法である。","a":0,"e":"原価法は再調達原価に減価修正をして積算価格を求める。収益価格は収益還元法、比準価格は取引事例比較法で求める。","m":"原価法→積算価格"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R05-25-3","s":"不動産鑑定評価基準によれば、特殊な事情を含む取引事例は、事情補正が可能であっても取引事例比較法の事例として採用できない。","a":0,"e":"特殊な事情を含む事例でも、その事情が判明し補正できるものは事情補正して採用できる。","m":"補正できれば採用可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R05-25-4","s":"不動産鑑定評価基準によれば、取引事例比較法は、近隣地域や同一需給圏内の類似地域等で対象不動産と類似の不動産の取引が行われている場合に有効である。","a":1,"e":"取引事例比較法は類似不動産または代替競争不動産の取引がある場合に有効で、事例は近隣地域や同一需給圏内の類似地域等から選ぶ。","m":"類似取引あれば比準"},{"f":"業法","t":"業務上の規制","ref":"R05-28-イ","s":"宅建業者の従業員が、電話で契約の勧誘をする際に、事実でないと知りながら「今後5年以内にこの一帯は再開発される」と告げた場合、宅建業法に違反する。","a":1,"e":"将来の環境・利便など重要な事項について故意に不実のことを告げる行為は禁止されている（宅建業法47条1号）。","m":"嘘の再開発話は違反"},{"f":"業法","t":"業務上の規制","ref":"R05-28-ウ","s":"宅建業者の従業員が、夜23時頃に相手方の自宅へ電話して勧誘し、その私生活の平穏を害して困惑させても、契約の締結に至らなければ宅建業法に違反しない。","a":0,"e":"私生活の平穏を害する方法で困惑させる勧誘は、それ自体が禁止される（宅建業法47条の2第3項・施行規則16条の11）。","m":"深夜の電話勧誘は違反"},{"f":"業法","t":"営業保証金","ref":"R05-30-ア","s":"免許を受けた日から3か月以内に営業保証金供託の届出がないときは免許権者は催告をしなければならず、催告到達後1か月以内に届出がなければ免許を取り消すことができる。","a":1,"e":"届出がない場合は3か月で催告義務、催告到達後1か月以内に届出がなければ任意的に免許取消し（宅建業法25条6項・7項）。","m":"3か月催告→1か月取消"},{"f":"業法","t":"営業保証金","ref":"R05-30-ウ","s":"保証協会の社員でない宅建業者は、還付により営業保証金が不足した旨の通知を受けた場合、その日から1か月以内に不足額を供託すれば足りる。","a":0,"e":"不足額の供託は通知を受けた日から2週間以内、供託後さらに2週間以内に届出が必要（宅建業法28条1項・2項）。","m":"不足額は2週間以内"},{"f":"業法","t":"免許","ref":"R05-32-1","s":"甲県知事免許の宅建業者が甲県内に新たに支店を設置した場合、宅建業者は30日以内に甲県知事に変更の届出をしなければならない。","a":1,"e":"事務所の名称・所在地は宅建業者名簿の登載事項で、変更があれば30日以内に免許権者へ届け出る（宅建業法9条）。","m":"支店新設は30日届出"},{"f":"業法","t":"免許","ref":"R05-32-2","s":"乙県知事免許の宅建業者である法人が合併により消滅した場合、消滅した法人の代表役員であった者が30日以内に乙県知事に届け出なければならない。","a":1,"e":"合併消滅の場合の廃業等の届出義務者は消滅法人の代表役員であった者で、期限は30日以内（宅建業法11条1項2号）。","m":"合併は消滅側の代表"},{"f":"業法","t":"免許","ref":"R05-32-3","s":"宅建業者は、事務所ごとに置かれる専任の宅建士の氏名に変更があった場合、30日以内に免許権者に変更の届出をしなければならない。","a":1,"e":"専任の宅建士の氏名は宅建業者名簿の登載事項であり、変更時は30日以内に変更の届出が必要（宅建業法9条）。","m":"専任宅建士交代は届出"},{"f":"業法","t":"保証協会","ref":"R05-44-1","s":"保証協会の社員は、取引の相手方からの苦情の解決について保証協会から資料の提出を求められた場合、正当な理由がなければこれを拒むことができない。","a":1,"e":"苦情解決は保証協会の必須業務。社員は協会からの説明・資料提出の求めを正当な理由なく拒めない（法64条の5）。","m":"苦情の資料は拒めない"},{"f":"業法","t":"保証協会","ref":"R05-44-3","s":"保証協会は、社員と取引をした者から還付の請求を受けたときは、直ちに弁済業務保証金の中からその者に支払わなければならない。","a":0,"e":"権利者は保証協会の認証を受けたうえで、供託所に対して還付を請求する。協会が直接支払う仕組みではない。","m":"支払うのは供託所"},{"f":"業法","t":"保証協会","ref":"R05-44-4","s":"保証協会が国土交通大臣の承認を受けて手付金等保管事業を行う場合、社員は自ら売主となる未完成物件の売買の手付金等の保全にも、この保管事業を利用できる。","a":0,"e":"未完成物件の保全措置は保証委託契約か保証保険契約に限られ、指定保管機関による保管は使えない（法41条）。","m":"未完成は保証か保険"},{"f":"税他","t":"住宅金融支援機構","ref":"R05-46-1","s":"住宅金融支援機構は、子育て世帯や高齢者世帯（単身を含む）に適した良好な居住性能等を有する賃貸住宅の建設や改良に必要な資金の貸付けを行っている。","a":1,"e":"子育て世帯・高齢者世帯向けの賃貸住宅の建設資金・改良資金の貸付けは、機構の直接融資業務の一つ。","m":"子育て・高齢者賃貸は融資"},{"f":"税他","t":"住宅金融支援機構","ref":"R05-46-3","s":"住宅金融支援機構は、証券化支援事業（買取型）において、ZEHなど省エネルギー性能等に優れた住宅を取得する場合に、一定期間の貸付金利を引き下げる制度を実施している。","a":1,"e":"フラット35Sとして、省エネ性・耐震性などに優れた住宅について一定期間の金利引下げを行っている。","m":"優良住宅はフラット35S"},{"f":"税他","t":"景品表示法","ref":"R05-47-2","s":"宅建業者の広告において、物件名には、その物件から直線距離で50m以内に所在する街道その他の道路の名称（坂名を含む）を用いることができる。","a":1,"e":"道路の名称は物件から直線距離50m以内にあれば物件名に使える（表示規約19条）。公園等の300mと区別。","m":"道路名は50m以内"},{"f":"税他","t":"景品表示法","ref":"R05-47-3","s":"物件の広告で近くのスーパーマーケットを表示する場合、自転車による所要時間を明示すれば、道路距離や徒歩所要時間を示す必要はない。","a":0,"e":"商業施設は現に利用できるものを道路距離または徒歩所要時間で明示する。自転車の所要時間だけでは足りない。","m":"施設は道路距離か徒歩"},{"f":"税他","t":"景品表示法","ref":"R05-47-4","s":"一棟リノベーションマンションについて一般消費者に初めて購入の申込みの勧誘を行う場合であっても、広告に「新発売」と表示することはできない。","a":0,"e":"「新発売」は新築住宅等のほか、一棟リノベーションマンションを初めて勧誘する場合にも使える（表示規約18条）。","m":"一棟リノベも新発売可"},{"f":"税他","t":"土地・建物","ref":"R05-50-1","s":"建物の構造のうち鉄筋コンクリート構造は、地震や風の力を受けても躯体の変形が比較的小さく、かつ耐火性にも優れた構造である。","a":1,"e":"鉄筋コンクリート構造は剛性が高く変形が小さいうえ、コンクリートが鉄筋を覆うため耐火性にも優れる。","m":"RCは変形小・耐火性大"},{"f":"税他","t":"土地・建物","ref":"R05-50-4","s":"鉄筋コンクリート構造は、コンクリートが所定の強度に達するまで日数を要し、現場での施工工程も多いため、工期が長くなる傾向がある。","a":1,"e":"コンクリートの強度が出るまでの養生期間や現場作業の多さから、RC造は工期が長くなりやすい。","m":"RCは工期が長い"},{"f":"権利","t":"意思表示・行為能力","ref":"R06-01-2","s":"公の秩序に反する内容の法律行為であっても、当事者双方が十分に納得したうえで合意している場合には、その法律行為は有効となる。","a":0,"e":"公序良俗に反する法律行為は当事者の合意にかかわらず無効で、追認しても有効にならない（民法90条・119条）。","m":"公序良俗違反は無効"},{"f":"権利","t":"不法行為・請負・委任","ref":"R06-02-1","s":"売主と一体となって販売の事務を行っていた宅建業者は、売主が買主に負う防火設備の操作方法の説明義務と同様の義務を、信義則上負うことがある。","a":1,"e":"売主と一体となって販売事務を行った宅建業者も、信義則上説明義務を負い、違反すれば損害賠償責任を負うことがある（最判平17.9.16）。","m":"一体の業者も説明義務"},{"f":"権利","t":"共有・相隣","ref":"R06-03-2","s":"共有土地について無権利者名義の不実の所有権移転登記がされている場合、共有者の1人は単独でその登記の抹消を請求することができる。","a":1,"e":"不実の登記の抹消請求は保存行為に当たり、各共有者が単独で請求できる（最判昭31.5.10）。","m":"不実登記の抹消は単独"},{"f":"権利","t":"共有・相隣","ref":"R06-03-4","s":"裁判により所在等不明共有者の持分を取得した共有者に対し、所在等不明共有者は、取得の時から3年以内に限り時価相当額の支払を請求できる。","a":0,"e":"所在等不明共有者は時価相当額の支払を請求できるが「3年以内」という特別の期間制限はない（民法262条の2第4項）。","m":"3年制限はない"},{"f":"権利","t":"債務不履行・解除","ref":"R06-04-2","s":"売買契約の売主が死亡して相続が開始した場合、その契約の解除権は一身専属権ではないので、契約上の地位とともに相続人に承継される。","a":1,"e":"相続人は被相続人の一身専属権を除く一切の権利義務を承継し、解除権も含まれる（民法896条）。","m":"解除権も相続される"},{"f":"権利","t":"物権変動・対抗","ref":"R06-04-3","s":"売主Aから甲土地を買ったBは、所有権移転登記を受けていなければ、Aを単独相続したCに対して所有権を主張して引渡しを請求することはできない。","a":0,"e":"相続人Cは売主の地位を包括承継した当事者であり第三者ではない。Bは登記なしでCに所有権を主張できる（民法177条）。","m":"相続人は当事者扱い"},{"f":"権利","t":"意思表示・行為能力","ref":"R06-04-4","s":"売主Aの詐欺により売買契約を締結した買主Bは、Aが死亡してCが単独相続した後でも、Cに対して詐欺を理由に契約を取り消すことができる。","a":1,"e":"詐欺による意思表示は取り消せる（民法96条1項）。相続人Cは売主の地位を承継するので、BはCに取消しを主張できる。","m":"取消しは相続人にも"},{"f":"権利","t":"債務不履行・解除","ref":"R06-05-1","s":"不法行為に基づく損害賠償債務は、加害者が被害者から履行の請求を受けた時から履行遅滞となり、それまでは遅延損害金は発生しない。","a":0,"e":"不法行為による損害賠償債務は、催告を要せず損害発生（不法行為）の時から遅滞に陥る（判例）。","m":"不法行為は即遅滞"},{"f":"権利","t":"債務不履行・解除","ref":"R06-05-2","s":"善意の受益者が負う不当利得返還債務は期限の定めのない債務であり、受益者は損失者から返還の請求を受けた時から履行遅滞の責任を負う。","a":1,"e":"期限の定めのない債務は履行の請求を受けた時から遅滞となる（民法412条3項）。善意の受益者の不当利得返還債務もこれに当たる。","m":"期限なしは請求時遅滞"},{"f":"権利","t":"抵当権・担保","ref":"R06-06-ウ","s":"A所有の甲土地にBの地上権が設定・登記され、その後Cの抵当権が設定・登記された。この後BがAから代物弁済として甲土地の所有権を取得した場合、Bの地上権は混同により消滅する。","a":0,"e":"所有権と地上権が同じ人に帰属しても、土地が第三者Cの抵当権の目的となっているので、地上権は消滅しない（民法179条1項ただし書）。","m":"抵当付きなら混同せず"},{"f":"権利","t":"抵当権・担保","ref":"R06-06-エ","s":"A所有の甲土地にBの地上権が設定・登記され、その後Cの抵当権が設定・登記された。この後AがBに甲土地を贈与し、Bが所有権を取得した場合でも、Bの地上権は消滅しない。","a":1,"e":"取得原因が贈与でも、土地に第三者の抵当権がある以上、Bを守るため地上権は存続する（民法179条1項ただし書）。原因は問わない。","m":"原因問わず地上権存続"},{"f":"権利","t":"物権変動・対抗","ref":"R06-07-1","s":"AがBに甲建物を賃貸して引き渡した後、CがBをだまして「甲建物はAから買った」と信じ込ませ、Bが任意にCへ占有を移した。この場合、AはCに対し占有回収の訴えで甲建物の返還を請求することはできない。","a":1,"e":"占有回収の訴えは占有を「奪われた」ときの制度。だまされても自分の意思で引き渡したなら侵奪に当たらない（民法200条、判例）。","m":"騙されて渡す＝奪われず"},{"f":"権利","t":"物権変動・対抗","ref":"R06-07-2","s":"AがBに甲建物を賃貸して引き渡した後、Bが甲建物の入口を閉ざして賃貸人Aの立入りを拒んだ場合、Aは、間接占有を侵奪されたとして、Bに対し占有回収の訴えを提起することができる。","a":0,"e":"Bは賃借人として占有を続けており、Aの間接占有も失われていないため、占有の侵奪には当たらず占有回収の訴えはできない。","m":"立入拒否は侵奪でない"},{"f":"権利","t":"意思表示・行為能力","ref":"R06-08-2","s":"売買契約が無効であったにもかかわらず、その契約に基づく債務の履行として代金や目的物の給付を受けた者は、民法上、相手方を原状に復させる義務を負う。","a":1,"e":"無効な行為に基づく給付を受けた者は原状回復義務を負うと民法に明記されている（民法121条の2第1項）。互いに返還する。","m":"無効なら元に戻す"},{"f":"権利","t":"保証・連帯債務","ref":"R06-09-3","s":"債権者Bと第三者Cとの契約で、CがAの債務と同じ内容の債務を併存して負う併存的債務引受をした場合、その効力は、債務者AがCに承諾をした時に生ずる。","a":0,"e":"債権者と引受人の契約による併存的債務引受は、債務者の承諾なしに契約だけで効力を生じる（民法470条2項）。保証と同じ発想。","m":"債権者と組めば承諾不要"},{"f":"権利","t":"売買・契約不適合","ref":"R06-10-2","s":"売買の目的物に品質の契約不適合があり、それが売主・買主いずれの責めにも帰することができない事由による場合でも、買主は売主に対して代金の減額を請求することができる。","a":1,"e":"代金減額請求は売主の帰責事由を要しない（民法563条）。双方に帰責事由がないときに使えないのは損害賠償請求だけ。","m":"減額は過失いらない"},{"f":"権利","t":"借地","ref":"R06-11-1","s":"専ら事業の用に供する建物の所有を目的とし、存続期間を20年とする事業用定期借地権を設定する場合、その契約は書面で行えばよく、公正証書による必要はない。","a":0,"e":"事業用定期借地権の設定契約は公正証書でしなければならない（借地借家法23条3項）。一般定期借地権のような書面一般では足りない。","m":"事業用定借は公正証書"},{"f":"権利","t":"借地","ref":"R06-11-2","s":"居住用建物の所有を目的とする借地権の設定にあたり、設定後30年を経過した日に借地上の建物を地主に相当の対価で譲渡する旨の特約を定めた場合、その特約は有効である。","a":1,"e":"30年以上経過後に建物を相当の対価で地主に譲渡する建物譲渡特約は有効で、譲渡により借地権は消滅する（借地借家法24条）。","m":"30年後譲渡特約OK"},{"f":"権利","t":"区分所有法","ref":"R06-13-3","s":"マンションの区分所有建物に管理者が選任されている場合、その管理者は、集会において、毎年1回一定の時期に、その事務に関する報告をしなければならない。","a":1,"e":"管理者は毎年1回一定の時期に集会で事務報告をする義務がある（区分所有法43条）。書面配布だけでは足りない。","m":"管理者は年1集会報告"},{"f":"権利","t":"区分所有法","ref":"R06-13-4","s":"集会の招集通知は、通知を受ける場所を管理者に通知していない区分所有者に対しては、その専有部分の所在場所にあてて発すれば足り、通常到達すべき時に到達したものとみなされる。","a":1,"e":"通知場所の届出がない区分所有者には専有部分の所在場所あてで足り、通常到達すべき時に到達したとみなされる（区分所有法35条3項）。","m":"届出なしは部屋あてで可"},{"f":"権利","t":"不動産登記法","ref":"R06-14-2","s":"土地収用法による収用によって土地の所有権が起業者に移転した場合、その収用を原因とする所有権の移転の登記は、起業者が単独で申請することができる。","a":1,"e":"収用では元の所有者の協力を得にくいため、起業者の単独申請が認められている（不動産登記法118条1項）。共同申請の例外。","m":"収用は起業者単独"},{"f":"権利","t":"不動産登記法","ref":"R06-14-4","s":"所有権の登記名義人Aが転居して住所が変わった場合、その登記名義人の住所についての変更の登記は、Aが単独で申請することができる。","a":1,"e":"住所等の変更登記は権利の移転ではないため名義人の単独申請でよい（不登法64条1項）。2026年4月から変更後2年以内の申請が義務化。","m":"住所変更は単独申請"},{"f":"法令","t":"建築基準法","ref":"R06-18-2","s":"特定用途誘導地区内で都市計画により建築物の高さの最高限度が定められていても、特定行政庁が用途上又は構造上やむを得ないと認めて許可した建築物は、その最高限度を超えることができる。","a":1,"e":"特定用途誘導地区の高さの最高限度は、特定行政庁が用途上・構造上やむを得ないと認めて許可したものには適用されない（建基法60条の3第2項）。","m":"誘導地区の高さは許可で超"},{"f":"法令","t":"建築基準法","ref":"R06-18-3","s":"計画建築物の天空率が、道路斜線・隣地斜線・北側斜線の各制限に適合する建築物の天空率未満であれば、それらの斜線制限は適用されない。","a":0,"e":"斜線制限が適用除外となるのは、計画建築物の天空率が適合建築物の天空率「以上」の場合である（建基法56条7項）。未満では不可。","m":"天空率は以上で除外"},{"f":"法令","t":"農地法","ref":"R06-21-1","s":"農地法3条1項の許可があった時に所有権が移転する旨の停止条件付売買契約を原因として、所有権移転の仮登記を申請する場合にも、その仮登記の申請について農業委員会の許可が必要である。","a":0,"e":"許可を停止条件とする所有権移転の仮登記は、権利がまだ移転していないため3条許可なしで申請できる（登記実務先例）。","m":"条件付仮登記は許可不要"},{"f":"法令","t":"農地法","ref":"R06-21-2","s":"農地法3条1項の許可申請書は原則として当事者が連署して提出しなければならないが、民事調停の成立による権利移転など一定の場合は、当事者の一方が単独で申請できる。","a":1,"e":"許可申請は当事者の連署が原則だが、競売・公売・遺贈・確定判決・調停成立などの場合は単独申請が認められる（農地法施行規則10条）。","m":"調停・判決は単独申請"},{"f":"法令","t":"農地法","ref":"R06-21-3","s":"期間の定めのある農地の賃貸借で、当事者が期間満了の1年前から6か月前までの間に更新しない旨の通知をしなかったときは、原則として従前と同一の条件で更新したものとみなされる。","a":1,"e":"農地の賃貸借は法定更新され、期間満了の1年前から6か月前までに更新拒絶の通知が必要（農地法17条）。通知には原則知事の許可が要る。","m":"1年前～6か月前に通知"},{"f":"税他","t":"所得税・譲渡","ref":"R06-23-3","s":"個人が住宅の敷地をある年に借入金で取得し、翌年にその敷地に家屋を新築して居住を開始した場合、敷地を取得した年分の所得税について住宅借入金等特別控除を受けることはできない。","a":1,"e":"住宅ローン控除は居住の用に供した年から適用され、その年の12月31日まで居住していることが要件（措置法41条）。土地取得の年は対象外。","m":"控除は住んだ年から"},{"f":"税他","t":"所得税・譲渡","ref":"R06-23-4","s":"住宅借入金等の償還期間が3年である場合でも、その借入金で取得した家屋に居住していれば、居住開始年以後3年間は住宅借入金等特別控除を受けることができる。","a":0,"e":"住宅ローン控除の対象となる借入金は償還期間10年以上のものに限られる（措置法41条）。償還期間3年の借入金は対象外。","m":"ローン10年以上が条件"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R06-25-1","s":"不動産鑑定評価基準における同一需給圏とは、一般に対象不動産と代替関係が成立して、その価格の形成について相互に影響を及ぼすような関係にある他の不動産の存する圏域をいう。","a":1,"e":"同一需給圏は代替関係が成立し価格形成に相互に影響する不動産の存する圏域と定義される。住宅地なら通勤圏などで判定する。","m":"代替関係の圏＝需給圏"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R06-25-2","s":"不動産鑑定評価基準によれば、鑑定評価の依頼目的に応じて、地域要因や個別的要因について想定上の条件を設定して鑑定評価を行うことがある。","a":1,"e":"依頼目的に応じ、地域要因・個別的要因に想定上の条件（例：駅開業を前提）を設定することがある。条件は実現性・合法性等を要する。","m":"想定上の条件もあり"},{"f":"業法","t":"報酬","ref":"R06-28-ウ","s":"消費税課税事業者である宅建業者Aが、売主から土地付建物（代金総額3,500万円、うち土地2,400万円、建物1,100万円で消費税込み）の売買の媒介を依頼され契約を成立させた場合、売主から受領できる報酬の上限は118万8,000円である。","a":1,"e":"建物を税抜1,000万円とし基準額3,400万円×3%＋6万円＝108万円、課税事業者なので1.1倍で118万8,000円（報酬告示）。","m":"建物は税抜きで計算"},{"f":"業法","t":"宅建士","ref":"R06-29-1","s":"宅建試験に合格した者は、宅建業の実務経験が2年未満であっても、都道府県知事が指定する講習を受講すれば、宅地建物取引士の登録を受けることができる。","a":0,"e":"実務経験2年未満を補えるのは国土交通大臣の登録を受けた講習（登録実務講習）の修了。知事指定講習は宅建士証交付前の法定講習。","m":"経験不足は登録実務講習"},{"f":"業法","t":"宅建士","ref":"R06-29-3","s":"宅地建物取引士が他人に自己の名義の使用を許し、その他人が宅地建物取引士である旨の表示をした場合でも、その他人が宅建士の登録を受けている者であれば、名義を貸した宅建士が処分を受けることはない。","a":0,"e":"名義の使用を許し他人が宅建士として表示したときは、相手が登録者でも名義貸しとして処分の対象になる（宅建業法68条1項）。","m":"相手が宅建士でも名義貸し"},{"f":"業法","t":"宅建士","ref":"R06-29-4","s":"宅建業者の事務所に置かれた唯一の専任の宅地建物取引士が登録を消除され、法定数を欠くことになった場合、宅建業者は2週間以内に必要な措置をとらなければならない。","a":1,"e":"専任の宅建士が法定数（業務従事者5人に1人以上）を欠いたときは、2週間以内に補充等の措置が必要（宅建業法31条の3第3項）。","m":"専任欠けたら2週間"},{"f":"業法","t":"クーリング・オフ","ref":"R06-30-2","s":"宅建業者Aが自ら売主となる宅地の売買で、宅建業者でない買主Bが自ら申し出て、Bの勤務先の事務所で買受けの申込みと契約をした場合、Bはクーリング・オフによる解除ができない。","a":1,"e":"買主が自ら申し出た自宅または勤務先での申込みは、クーリング・オフができない場所に当たる（宅建業法37条の2、規則16条の5）。","m":"申し出た自宅・勤務先×"},{"f":"業法","t":"クーリング・オフ","ref":"R06-30-3","s":"宅建業者Aが自ら売主となる宅地の売買で、宅建業者でない買主Bが自ら申し出て喫茶店で申込みと契約をし、契約の翌日に書面で解除を申し出た場合、Bはクーリング・オフによる解除ができる。","a":1,"e":"喫茶店は買主が申し出てもクーリング・オフできる場所。契約翌日なら8日以内で、引渡し・代金全額支払もない（宅建業法37条の2）。","m":"喫茶店は申出でも可"},{"f":"業法","t":"クーリング・オフ","ref":"R06-30-4","s":"宅建業者Aが自ら売主となる宅地の売買で、宅建業者でない買主Bが自ら申し出て融資を受ける銀行の店舗で申込みと契約をした場合、Bは契約の翌日でもクーリング・オフによる解除ができない。","a":0,"e":"買主が申し出た場所でも、例外となるのは自宅・勤務先のみ。宅建業者でない銀行の店舗なら解除できる（宅建業法37条の2）。","m":"銀行は申出でも解除可"},{"f":"業法","t":"監督・罰則","ref":"R06-31-1","s":"宅建業者が法65条1項の指示処分に従わないときは業務停止処分を受けることがあり、さらにその業務停止処分に違反したときは、免許権者は免許を取り消さなければならない。","a":1,"e":"指示に従わなければ1年以内の業務停止、業務停止処分に違反すれば必要的免許取消しとなる（宅建業法65条2項、66条1項9号）。","m":"指示→停止→取消"},{"f":"業法","t":"監督・罰則","ref":"R06-31-3","s":"免許権者が宅建業者に対して免許取消処分をしようとする場合の聴聞は、公開することが相当と認められる場合を除き、公開しないで行う。","a":0,"e":"宅建業法の監督処分に係る聴聞の期日における審理は公開で行わなければならない（宅建業法69条2項・16条の15第5項）。","m":"業法の聴聞は公開"},{"f":"業法","t":"媒介契約","ref":"R06-32-1","s":"宅建業者Aが専任媒介契約を締結し指定流通機構に登録した物件について売買契約が成立した場合、Aは、その物件の引渡しが完了した後に遅滞なく指定流通機構へ通知すればよい。","a":0,"e":"登録物件の売買契約が成立したら、引渡しを待たずに遅滞なく登録番号・取引価格・成立年月日を通知する（宅建業法34条の2第7項）。","m":"通知は契約成立時"},{"f":"業法","t":"媒介契約","ref":"R06-32-2","s":"宅建業者が宅地の売買の媒介契約を締結した場合、依頼者が宅建業者であるときは、媒介契約書面に標準媒介契約約款に基づくか否かの別を記載する必要はない。","a":0,"e":"媒介契約書面の規制は業者間取引にも適用され、標準媒介契約約款に基づくか否かの別は必ず記載する（宅建業法34条の2、規則15条の9）。","m":"業者間も約款の別を記載"},{"f":"業法","t":"媒介契約","ref":"R06-32-4","s":"既存住宅の売買の媒介契約で、依頼者が建物状況調査を実施する者のあっせんを希望しない場合、宅建業者は媒介契約書面にあっせんに関する事項を記載しなくてよい。","a":0,"e":"既存建物では、建物状況調査を実施する者のあっせんに関する事項を必ず記載する（宅建業法34条の2第1項4号）。あっせんなしでもその旨を記載。","m":"あっせん無も記載必要"},{"f":"業法","t":"保証協会","ref":"R06-36-2","s":"保証協会の社員と宅建業に関し取引をした者（宅建業者を除く）は、その社員が社員でないとしたら供託すべき営業保証金の額の範囲内で、弁済を受ける権利を有する。","a":1,"e":"弁済の限度は社員が納付した分担金の額ではなく、営業保証金に相当する額である（法64条の8第1項）。","m":"弁済は営業保証金相当"},{"f":"業法","t":"保証協会","ref":"R06-36-3","s":"社員の地位を失った宅建業者に弁済業務保証金分担金を返還する場合、保証協会は、還付請求権者に対し一定期間内に認証の申出をすべき旨を公告した後でなければ返還できない。","a":1,"e":"社員の地位を失ったときは6か月以上の期間を定めた公告後に返還する（法64条の11第4項）。一部事務所廃止は公告不要。","m":"地位喪失は公告後返還"},{"f":"業法","t":"事務所・案内所","ref":"R06-39-1","s":"継続的に業務を行うことができる施設を有し、事務所以外の場所として50条2項の届出をした案内所で契約や申込みを受ける場合、専任の宅建士を1名以上置く必要がある。","a":1,"e":"契約締結や申込受付を行う案内所等には、少なくとも1名の専任宅建士を置かなければならない（31条の3第1項）。","m":"案内所は専任1名以上"},{"f":"業法","t":"クーリング・オフ","ref":"R06-39-2","s":"10区画以上の宅地の一団の分譲のために設けた案内所が土地に定着する建物内にあり、そこで買受けの申込みがされた場合、クーリング・オフの規定は適用されない。","a":1,"e":"専任宅建士の設置義務がある案内所で、土地に定着する建物内のものは事務所等に当たる。テント張りの案内所なら適用あり。","m":"定着建物内ならクーオフ不可"},{"f":"業法","t":"事務所・案内所","ref":"R06-39-3","s":"他の宅建業者が行う一団の分譲の代理・媒介のため案内所を設けた宅建業者はその届出をしなければならず、売主業者もそこで申込みを受けるときは売主業者も届出を要する。","a":1,"e":"案内所の届出は案内所を設置した代理・媒介業者が行う。売主業者もその案内所で業務を行うなら売主業者も届け出る。","m":"使う業者がそれぞれ届出"},{"f":"業法","t":"重要事項説明","ref":"R06-41-イ","s":"宅建業者が存続期間50年の定期借地権を設定する宅地の貸借の媒介を行う場合、契約終了時の建物の取壊しに関する事項を定めようとするときは、その内容を重要事項として説明しなければならない。","a":1,"e":"宅地の貸借では、契約終了時における宅地上の建物の取壊しに関する事項を定めるときはその内容が重要事項説明の対象（規則16条の4の3）。","m":"取壊し定めは要説明"},{"f":"業法","t":"重要事項説明","ref":"R06-41-エ","s":"宅建業者が宅地の売買の媒介を行う場合、その宅地が急傾斜地崩壊危険区域内にあることは説明しなければならないが、区域内における行為制限の概要までは説明する必要はない。","a":0,"e":"急傾斜地法の区域内にある旨だけでなく、区域内の行為制限（知事の許可が必要な行為等）の概要も法令上の制限として説明する。","m":"区域も制限概要も説明"},{"f":"業法","t":"宅建士","ref":"R06-43-1","s":"宅建士の登録を受けている者は、宅建士証の交付を受けていなくても、住所を変更したときは遅滞なく変更の登録を申請しなければならない。","a":1,"e":"住所は登録事項なので、宅建士証の有無にかかわらず遅滞なく変更の登録を申請する（法20条）。","m":"住所変更は変更登録"},{"f":"業法","t":"宅建士","ref":"R06-43-2","s":"宅建士の信用又は品位を害するような行為をしてはならない義務は、宅建業の業務に関する行為に限られ、職務と関係のない私的な行為には及ばない。","a":0,"e":"信用失墜行為の禁止（法15条の2）は業務に限られず、職務と直接関係しない私的な行為にも及ぶ。","m":"私生活も品位を保つ"},{"f":"業法","t":"37条書面","ref":"R06-44-2","s":"宅建業者Aが建物の賃貸借の媒介を行った場合、貸主と借主の双方の承諾を得れば、37条書面に借賃の額・支払時期・支払方法を記載しなくてもよい。","a":0,"e":"借賃の額・支払時期・支払方法は貸借の37条書面の必要的記載事項で、当事者の承諾があっても省略できない（宅建業法37条2項）。","m":"借賃は承諾でも省略不可"},{"f":"業法","t":"37条書面","ref":"R06-44-3","s":"宅建業者Aが宅建業者D・E間の宅地の売買を媒介した場合、当事者がいずれも宅建業者であるから、37条書面に宅地の引渡しの時期を記載する必要はない。","a":0,"e":"37条書面は業者間取引でも交付が必要で、引渡しの時期は必要的記載事項（宅建業法37条1項）。業者間でも省略できない。","m":"業者間でも引渡時期必須"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R06-45-1","s":"自ら売主として新築住宅を販売する宅建業者は、基準日前10年間に新築住宅を引き渡していれば、基準日前1年間に引渡しが0戸であっても、資力確保措置の状況の届出をしなければならない。","a":1,"e":"届出は基準日前10年間に引き渡した新築住宅を対象とする（住宅瑕疵担保履行法11条・12条）。直近1年の引渡しがなくても届出が必要。","m":"10年分を見て届出"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R06-45-3","s":"住宅販売瑕疵担保責任保険契約を締結した新築住宅を、買主が引渡しから10年以内に第三者へ転売した場合、その保険契約は当然に解除される。","a":0,"e":"保険契約は引渡しから10年以上の期間で、国土交通大臣の承認なく変更・解除できないものと定められており、転売で解除されない（同法2条）。","m":"転売でも保険は続く"},{"f":"税他","t":"住宅金融支援機構","ref":"R06-46-2","s":"住宅金融支援機構は、地震に対する安全性の向上を主たる目的とする住宅の改良に必要な資金の貸付けを業務として行っている。","a":1,"e":"耐震改修のための住宅改良資金の貸付けは機構の直接融資業務に含まれる（機構法13条1項）。","m":"耐震改修は直接融資"},{"f":"税他","t":"住宅金融支援機構","ref":"R06-46-4","s":"住宅金融支援機構は、住宅のエネルギー消費性能の向上を主たる目的とする住宅の改良に必要な資金の貸付けを業務として行っている。","a":1,"e":"省エネ性能向上のための住宅改良資金の貸付けも機構の業務である（グリーンリフォームローン等）。","m":"省エネ改修も融資対象"},{"f":"税他","t":"景品表示法","ref":"R06-47-1","s":"新築分譲住宅の予告広告を新聞折込チラシで行った宅建業者は、その後の本広告を新聞折込チラシ以外の媒体で行うことはできない。","a":0,"e":"本広告は予告広告と同じ媒体で同一以上の地域に行うほか、インターネット広告で行うこともできる。","m":"本広告はネットでも可"},{"f":"税他","t":"景品表示法","ref":"R06-47-3","s":"不動産広告で電車・バス等の所要時間を表示するときは、朝の通勤ラッシュ時ではなく、平常時の所要時間を明示しなければならない。","a":0,"e":"原則は朝の通勤ラッシュ時の所要時間を明示する。平常時の所要時間は、その旨を明記すれば併記できる。","m":"所要時間はラッシュ時"},{"f":"税他","t":"土地・建物","ref":"R06-50-1","s":"建築物の構造のうちラーメン構造は、柱を鉛直方向に、梁を水平方向に配置し、柱と梁の接合部を剛に固めて骨組を構成する構造である。","a":1,"e":"ラーメン構造は柱と梁を剛接合した骨組で力を受ける構造。ラーメンはドイツ語で「枠」の意味。","m":"ラーメン＝剛な枠"},{"f":"税他","t":"土地・建物","ref":"R06-50-2","s":"建築物の構造のうちブレース構造は、柱や梁で構成された四角形の骨組の対角線上に斜材を入れて、水平力による変形を抑える構造である。","a":1,"e":"ブレースは対角線に入れる斜材（筋かい）で、地震・風の水平力に抵抗する。他の構造と併用し一部を補強することが多い。","m":"ブレース＝対角の斜材"},{"f":"権利","t":"物権変動・対抗","ref":"R07-01-1","s":"AがBに甲土地を売り、BがさらにCに転売したが、登記はA名義のままである。この場合、BはCに売却した後は、Aに対して自分への所有権移転登記を求めることができない。","a":0,"e":"BはCへ登記を移す義務を負うので、Cに転売した後もAに対する登記請求権を失わない（判例）。","m":"中間者も登記請求OK"},{"f":"権利","t":"保証・連帯債務","ref":"R07-02-1","s":"個人Aが、建物賃貸借の賃借人の債務については連帯保証人となり、建物売買の代金債務については通常の保証人となる場合、前者は書面が必要だが、後者は口頭の合意でも効力を生じる。","a":0,"e":"保証契約は種類を問わず書面（または電磁的記録）でしなければ効力を生じない（民法446条2項・3項）。","m":"保証は全部書面"},{"f":"権利","t":"保証・連帯債務","ref":"R07-02-3","s":"個人Aが建物賃貸借の賃借人の一切の債務を連帯保証する契約は極度額を定めなければ効力を生じないが、建物の売買代金債務という特定の債務を保証する契約では極度額を定める必要はない。","a":1,"e":"個人の根保証は極度額の定めが必要（民法465条の2）。特定債務の保証は額が確定しているので不要。","m":"根保証だけ極度額"},{"f":"権利","t":"保証・連帯債務","ref":"R07-02-4","s":"主たる債務者の委託を受けた保証人から、主たる債務の履行状況について情報提供を求められた場合でも、債権者は契約上の守秘義務を理由にこれを拒むことができる。","a":0,"e":"委託を受けた保証人の請求があれば、債権者は不履行の有無や残額等を遅滞なく提供しなければならない（民法458条の2）。","m":"委託保証人に情報開示"},{"f":"権利","t":"意思表示・行為能力","ref":"R07-03-ウ","s":"法律行為の目的と取引上の社会通念に照らして重要な錯誤に基づく意思表示は無効であり、その無効は善意無過失の第三者に対抗することができない。","a":0,"e":"錯誤による意思表示は「無効」ではなく「取り消すことができる」（民法95条1項）。第三者保護は同条4項。","m":"錯誤は取消し"},{"f":"権利","t":"抵当権・担保","ref":"R07-04-1","s":"AがBから1,000万円を借り入れる場合、Aは自己所有の不動産にBのための抵当権を設定することはできるが、不動産に質権を設定することはできない。","a":0,"e":"質権は動産だけでなく不動産にも設定できる（不動産質、民法356条）。ただし目的物の引渡しが必要。","m":"不動産にも質権OK"},{"f":"権利","t":"相続","ref":"R07-05-ア","s":"Aの子がB、Bの子がCである家族で、Aが死亡するより前にBが死亡していた場合、Aの死亡により、CはBを代襲してAの相続人となる。","a":1,"e":"子が相続開始以前に死亡したときは、その子（被相続人の直系卑属）が代襲相続する（民法887条2項）。","m":"先に死亡→代襲"},{"f":"権利","t":"相続","ref":"R07-05-イ","s":"Aの子Bが、相続に関するAの遺言書を偽造したため相続人の資格を失った場合、Bの子CはBを代襲してAの相続人となることができる。","a":1,"e":"遺言書の偽造は相続欠格事由（民法891条5号）。欠格は代襲原因なのでCが代襲する（887条2項）。","m":"欠格でも代襲あり"},{"f":"権利","t":"相続","ref":"R07-05-ウ","s":"Aの子Bが、Aの請求により家庭裁判所の審判で推定相続人から廃除された場合、Bの子CはBを代襲してAの相続人となることはできない。","a":0,"e":"廃除も死亡・欠格と同じく代襲原因であり、CはBを代襲してAの相続人となる（民法887条2項）。","m":"廃除でも代襲あり"},{"f":"権利","t":"物権変動・対抗","ref":"R07-06-4","s":"Aが甲土地上の立木の所有権を自分に残したまま甲土地をJに売却し、Jが土地と立木をKに売却した。この場合、Aは立木について登記か明認方法を備えなければ、Kに立木の所有権を主張できない。","a":1,"e":"立木の所有権を留保しても、登記または明認方法という公示がなければ後の譲受人に対抗できない（判例）。","m":"留保の立木は明認方法"},{"f":"権利","t":"共有・相隣","ref":"R07-08-3","s":"A・B・Cが各3分の1の持分で甲土地を共有している。Aが死亡しEとFが相続した場合、B及びCは、遺産分割の前であっても、E及びFを相手に共有物分割の訴えを提起できる。","a":1,"e":"BCは相続人ではないので遺産分割を待つ必要はなく、相続人を相手に共有物分割を請求できる（判例）。","m":"他の共有者は分割請求可"},{"f":"権利","t":"保証・連帯債務","ref":"R07-09-1","s":"A・Bが連帯債務を負う場合に、債権者がAに対して履行の請求をしても、別段の意思表示がなければ、その効力はBには及ばない。","a":1,"e":"履行の請求は相対効であり、他の連帯債務者には効力を生じない（民法441条）。","m":"請求は相対効"},{"f":"権利","t":"保証・連帯債務","ref":"R07-09-3","s":"連帯債務者の一人が債権者に対する自己の債権で相殺を援用した場合、その相殺による債権の消滅は、他の連帯債務者のためにも効力を生じる。","a":1,"e":"相殺の援用は絶対効で、相殺した分だけ全員の債務が消滅する（民法439条1項）。","m":"相殺は絶対効"},{"f":"権利","t":"保証・連帯債務","ref":"R07-09-4","s":"A・Bが連帯債務を負う場合に、Aと債権者との間で更改がされても、別段の意思表示がなければ、Bの債務には何の影響も生じない。","a":0,"e":"更改は絶対効であり、債権は全ての連帯債務者の利益のために消滅する（民法438条）。","m":"更改は絶対効"},{"f":"業法","t":"8種制限","ref":"R07-10-2","s":"宅建業者Aが自ら売主として宅建業者でないBに宅地を売却し、「引渡しから3年以内に通知しなければ契約不適合責任を負わない」と特約した。Aが重大な過失なく不適合を知らなかった場合、Bが引渡しから4年後に通知しても損害賠償は請求できない。","a":1,"e":"引渡しから2年以上とする通知期間の特約は有効（宅建業法40条）。3年の特約は有効で、4年後の通知では遅い。","m":"引渡し2年以上ならOK"},{"f":"権利","t":"借地","ref":"R07-11-2","s":"存続期間50年の一般定期借地権を設定する場合、一定期間は地代を減額しない旨の特約を定めれば、その期間中は借地権者からの地代減額請求を排除できる。","a":0,"e":"定期借地でも地代増減請求の規定は適用される。排除できるのは増額しない特約だけで、減額しない特約は無効（借地借家法11条1項）。","m":"減額しない特約は無効"},{"f":"権利","t":"借地","ref":"R07-11-4","s":"居住用建物の所有を目的とする普通借地契約を公正証書で締結し、存続期間を20年と定めた場合、貸主は正当事由があれば20年経過時に更新を拒絶できる。","a":0,"e":"普通借地権は30年未満の期間を定めても30年となり（借地借家法3条）、公正証書でも変わらない。","m":"普通借地は最短30年"},{"f":"権利","t":"借家","ref":"R07-12-1","s":"期間の定めのない建物賃貸借（定期・一時使用を除く）では、賃貸人と賃借人のどちらが解約の申入れをした場合でも、申入れの日から6か月を経過すると契約は終了する。","a":0,"e":"賃貸人からは6か月（借地借家法27条、正当事由必要）だが、賃借人からは3か月で終了する（民法617条）。","m":"貸主6か月・借主3か月"},{"f":"権利","t":"借家","ref":"R07-12-2","s":"期間2年の建物賃貸借で、当事者双方が期間満了の1年前から6か月前までに更新しない旨の通知をしなかった場合、従前と同一の条件で、期間2年の契約として更新したものとみなされる。","a":0,"e":"従前と同一条件で更新されるが、期間は定めのないものとなる（借地借家法26条1項）。","m":"法定更新は期間なし"},{"f":"権利","t":"区分所有法","ref":"R07-13-2","s":"区分所有建物の共用部分に対する各区分所有者の共有持分は、規約に別段の定めがない限り、各自が有する専有部分の床面積の割合によって決まる。","a":1,"e":"共用部分の持分は専有部分の床面積割合（内法で計算）による。規約で別に定めることもできる（区分所有法14条）。","m":"持分は床面積割合"},{"f":"権利","t":"区分所有法","ref":"R07-13-4","s":"区分所有者が建物の保存に有害な行為をするおそれがある場合、他の区分所有者の全員又は管理組合法人は、その行為の予防に必要な措置をとるよう請求できる。","a":1,"e":"共同の利益に反する行為（おそれを含む）には、停止・結果の除去・予防措置を請求できる（区分所有法57条1項）。","m":"停止・除去・予防"},{"f":"権利","t":"不動産登記法","ref":"R07-14-2","s":"不動産の登記事項証明書の交付の請求は、登記所の窓口や郵送で行うほか、電子情報処理組織を使用してオンラインで行うこともできる。","a":1,"e":"登記事項証明書の交付請求はオンラインでもできる（不動産登記規則194条）。","m":"証明書はネット請求可"},{"f":"権利","t":"不動産登記法","ref":"R07-14-3","s":"売買による所有権移転登記のような権利に関する登記の申請は、法令に別段の定めがある場合を除き、登記権利者と登記義務者が共同してしなければならない。","a":1,"e":"権利の登記は共同申請が原則（不動産登記法60条）。判決・相続・名変などは単独申請の例外。","m":"権利の登記は共同申請"},{"f":"法令","t":"盛土規制法","ref":"R07-19-1","s":"特定盛土等規制区域内で許可を要する規模の特定盛土等の工事について許可を申請しようとする工事主は、あらかじめ説明会の開催などにより周辺住民に工事内容を周知させなければならない。","a":1,"e":"許可申請前に、説明会・書面配布・掲示とネット公表等で周辺住民へ周知する義務がある。","m":"申請前に住民周知"},{"f":"法令","t":"盛土規制法","ref":"R07-19-3","s":"都道府県知事は、宅地造成等工事規制区域内の土地について災害防止のため必要があるときは、土地の所有者等のほか工事主や工事施行者に対しても、擁壁等の設置などの措置を勧告できる。","a":1,"e":"知事は所有者・管理者・占有者・工事主・工事施行者に対し、擁壁等の設置・改造などを勧告できる（盛土規制法22条2項）。","m":"工事主にも勧告可"},{"f":"法令","t":"土地区画整理法","ref":"R07-20-1","s":"個人施行者が換地計画の認可を申請しようとするときは、施行地区内の宅地の所有者（施行者に対抗できない者を除く）の同意を得なければならない。","a":1,"e":"個人施行は権利者の合意が前提のため、換地計画の認可申請にも宅地所有者等の同意が必要とされる。","m":"個人施行は同意が要"},{"f":"法令","t":"土地区画整理法","ref":"R07-20-2","s":"国や地方公共団体以外の者が所有する道路の用地について、事業により代わりの道路が設置されて元の道路が廃止される場合などには、換地計画でその土地に換地を定めないことができる。","a":1,"e":"道路として提供されていた土地は換地を受けなくても不利益が小さいため、換地を定めないことができる（土地区画整理法95条6項）。","m":"廃止道路は換地なし可"},{"f":"法令","t":"土地区画整理法","ref":"R07-20-4","s":"土地区画整理事業の施行地区内の土地については、仮換地の指定があった日後は、原則として事業による変動に係る登記がされるまで他の登記をすることができない。","a":0,"e":"他の登記が制限されるのは仮換地指定後ではなく「換地処分の公告があった日後」から（土地区画整理法107条3項）。","m":"登記制限は公告後"},{"f":"法令","t":"農地法","ref":"R07-21-1","s":"市街化区域外の農地を住宅用地として造成するため転用する場合でも、その農地の全てを住宅の用に供することが確実と認められないときは、農地法4条又は5条の許可を受けることができない。","a":1,"e":"転用の確実性がない場合は一般基準により許可されない（農地法4条6項、5条2項）。","m":"転用が確実でなきゃ不可"},{"f":"法令","t":"農地法","ref":"R07-21-2","s":"市街化区域外の農地に仮設工作物を設置する目的で、その農地の所有権を取得しようとする場合、農地法5条の許可を受けることはできない。","a":1,"e":"一時的な利用なら賃借権等で足りるため、所有権取得は許可されない（農地法5条2項）。","m":"一時利用で所有権×"},{"f":"法令","t":"農地法","ref":"R07-21-3","s":"農地の賃貸借は、その登記がなくても、農地の引渡しを受けていれば、その後にその農地の所有権を取得した者に対抗することができる。","a":1,"e":"耕作者保護のため、農地の賃貸借は引渡しがあれば第三者に対抗できる（農地法16条）。","m":"農地は引渡しで対抗"},{"f":"法令","t":"国土利用計画法","ref":"R07-22-1","s":"市街化区域内のA所有の3,500㎡の土地を、Bが2,000㎡、Cが1,500㎡に分けて売買で取得した場合、BとCはいずれも事後届出をしなければならない。","a":0,"e":"事後届出は買主ごとの取得面積で判断。市街化区域は2,000㎡以上が対象なのでBのみ必要でCは不要。","m":"買主ごとに面積判定"},{"f":"法令","t":"国土利用計画法","ref":"R07-22-2","s":"都市計画区域外にある12,000㎡の土地を、担保権の実行としての競売によって取得した者は、事後届出をしなければならない。","a":0,"e":"競売は当事者の合意による契約ではないため、面積にかかわらず事後届出は不要。","m":"競売は届出不要"},{"f":"法令","t":"国土利用計画法","ref":"R07-22-3","s":"市街化調整区域内の7,000㎡の土地を売買で取得した買主は、契約締結の日から起算して1か月以内に事後届出をしなければならない。","a":0,"e":"5,000㎡以上なので届出対象だが、期限は契約締結日から起算して2週間以内（国土利用計画法23条1項）。","m":"事後届出は2週間"},{"f":"税他","t":"印紙税・登録免許税","ref":"R07-23-2","s":"土地の売買による所有権の移転登記に係る登録免許税の税率の軽減措置は、その土地の価額が1,000万円未満である場合に限り適用される。","a":0,"e":"この軽減措置（本則2%→1.5%）に土地の価額の要件はない。適用期限には注意。","m":"土地軽減に価額要件なし"},{"f":"税他","t":"印紙税・登録免許税","ref":"R07-23-4","s":"土地の売買による所有権の移転登記に係る登録免許税の税率の軽減措置は、取得する土地の面積が1,000㎡未満である場合に限って適用される。","a":0,"e":"面積による制限はなく、地目や取得者が個人か法人かも問わない（本則2%→1.5%）。","m":"土地軽減に面積要件なし"},{"f":"業法","t":"報酬","ref":"R07-26-ア","s":"課税事業者である宅建業者が店舗用建物の賃貸借を媒介し、返還されない権利金1,400万円（税抜）が授受される場合、貸主・借主からそれぞれ52万8,000円の報酬を受け取っても宅建業法に違反しない。","a":1,"e":"居住用以外の賃貸借で権利金があれば売買代金とみなせる。1,400万×3%＋6万＝48万円、税込52.8万円が各依頼者の上限。","m":"権利金は売買とみなす"},{"f":"業法","t":"報酬","ref":"R07-26-ウ","s":"課税事業者である宅建業者が、税抜価格190万円の宅地建物の売買を媒介した場合、低廉な空家等の特例の合意がなくても、売主は少なくとも10万4,500円の報酬を支払わなければならない。","a":0,"e":"報酬規定は受領できる上限額を定めたもので、最低額の支払いを義務付けるものではない。","m":"報酬規定は上限だけ"},{"f":"業法","t":"37条書面","ref":"R07-29-1","s":"宅建業者が事業用宅地の賃貸借を媒介して契約が成立した場合、相手方が宅建業者であれば、37条書面の交付を省略することができる。","a":0,"e":"37条書面には業者間取引で省略できる例外がなく、相手方が宅建業者でも交付が必要（宅建業法37条）。","m":"37条は業者間でも交付"},{"f":"業法","t":"37条書面","ref":"R07-29-4","s":"宅建業者が自ら売主として建物を売却する際、代金についてローンのあっせんの定めがある場合でも、ローンが成立しないときの措置を37条書面に記載する必要はない。","a":0,"e":"ローンのあっせんの定めがあるときは、不成立時の措置を37条書面に記載しなければならない（宅建業法37条1項9号）。","m":"ローン不成立時も記載"},{"f":"業法","t":"37条書面","ref":"R07-33-ア","s":"宅建業者が建物の賃貸借を媒介する場合、建物の引渡しの時期は重要事項説明書に記載する必要はないが、37条書面には記載しなければならない。","a":1,"e":"引渡時期は契約内容として37条書面の必要的記載事項。35条の重要事項説明の対象ではない。","m":"引渡時期は37条だけ"},{"f":"業法","t":"37条書面","ref":"R07-33-エ","s":"宅建業者が建物の賃貸借を媒介して契約が成立し、当事者に37条書面を交付するときは、宅地建物取引士にその書面の内容を説明させなければならない。","a":0,"e":"37条書面は宅建士の記名が必要だが、内容の説明義務はない。説明義務があるのは35条書面。","m":"37条は記名のみ"},{"f":"業法","t":"重要事項説明","ref":"R07-37-1","s":"建物の貸借の媒介において、その建物が準防火地域内にあり建築基準法による構造の制限があるときは、その制限の概要を重要事項として説明しなければならない。","a":0,"e":"建物の貸借では借主が建て替えないため、建築基準法の制限は説明事項でない（施行令3条3項）。","m":"建物貸借に建築制限なし"},{"f":"業法","t":"重要事項説明","ref":"R07-37-2","s":"分譲マンションの売買の媒介において、専有部分の用途その他の利用の制限に関する規約がまだ案の段階であれば、その内容を説明する必要はない。","a":0,"e":"専有部分の利用制限に関する規約の定めは、案の段階でも説明が必要である（規則16条の2）。","m":"規約は案でも説明"},{"f":"業法","t":"重要事項説明","ref":"R07-37-3","s":"建物の貸借の媒介において、借賃以外に授受される金銭があるときは、その額と授受の目的に加え、その金銭の保管方法も説明しなければならない。","a":0,"e":"説明事項は借賃以外の金銭の額と授受の目的まで（法35条1項7号）。保管方法は説明事項ではない。","m":"保管方法は説明不要"},{"f":"業法","t":"媒介契約","ref":"R07-39-1","s":"宅建業者Aが売主Bと専属専任媒介契約を締結した場合、Bから申出があれば、Aは物件を指定流通機構に登録しなくてよい。","a":0,"e":"専属専任媒介では契約締結日から5日以内（休業日除く）の登録義務があり、依頼者の申出でも省略できない（34条の2）。","m":"登録義務は申出でも免除なし"},{"f":"業法","t":"媒介契約","ref":"R07-39-3","s":"宅建業者Aが中古住宅の売却の媒介契約を締結したときに交付する媒介契約書面には、宅地建物取引士の記名が必要である。","a":0,"e":"媒介契約書面は宅建業者の記名押印で足り、宅建士の記名は不要。宅建士の記名が要るのは35条・37条書面（34条の2）。","m":"媒介書面に宅建士は不要"},{"f":"業法","t":"業務上の規制","ref":"R07-44-1","s":"宅建業者が自然人の買主と宅地の売買契約を締結する際、犯罪収益移転防止法に基づき、本人特定事項（氏名・住居・生年月日）、取引の目的、職業を確認した。","a":1,"e":"自然人の取引時確認事項は本人特定事項・取引の目的・職業で、この対応は同法に違反しない。","m":"本人・目的・職業を確認"},{"f":"業法","t":"業務上の規制","ref":"R07-44-2","s":"宅建業者は、犯罪収益移転防止法に基づき作成した確認記録と取引記録を、取引の日などから5年間保存すれば足り、その後は廃棄してよい。","a":0,"e":"確認記録・取引記録の保存期間はいずれも7年間。5年で廃棄すると犯罪収益移転防止法に違反する。","m":"犯収法の記録は7年"},{"f":"業法","t":"業務上の規制","ref":"R07-44-3","s":"宅建業者は、売買で収受した代金が犯罪による収益である疑いがあると認めるときは、速やかに免許権者（国土交通大臣又は都道府県知事）に届け出なければならない。","a":1,"e":"疑わしい取引の届出は宅建業者の場合、行政庁である免許権者に速やかに行う。届出を受けた免許権者は国家公安委員会に通知する。","m":"疑わしきは免許権者へ"},{"f":"業法","t":"業務上の規制","ref":"R07-44-4","s":"犯罪収益移転防止法上、取引時確認等を的確に行うための従業員に対する教育訓練の実施は、特定事業者である宅建業者の努力義務とされている。","a":1,"e":"教育訓練の実施など体制整備は努力義務（犯収法11条）。確認した事項を最新に保つ措置とは区別する。","m":"教育訓練は努力義務"},{"f":"税他","t":"住宅金融支援機構","ref":"R07-46-1","s":"住宅金融支援機構は、災害により住宅が滅失した者に対する代わりの住宅の建設・購入資金の貸付けについて、元金の返済を据え置く期間を設けることができる。","a":1,"e":"災害復興住宅融資では、被災者の負担を軽くするため元金返済の据置期間を設けることができる。","m":"災害融資は据置あり"},{"f":"税他","t":"住宅金融支援機構","ref":"R07-46-4","s":"独立行政法人住宅金融支援機構は、市街地の土地の合理的な利用に寄与する一定の建築物の建設に必要な資金の貸付けを業務として行っている。","a":1,"e":"市街地の土地の合理的利用に寄与する建築物の建設資金の貸付けは、機構の直接融資業務の一つである。","m":"市街地の建築も融資"},{"f":"法令","t":"国土利用計画法","ref":"確認","s":"市街化区域内で、Aが甲から1,500㎡の土地を購入し、隣接する1,000㎡の土地を乙から贈与された場合、Aは事後届出をする必要がない。","a":1,"e":"事後届出は対価のある契約が対象で、贈与分は面積に含めない。売買の1,500㎡は市街化区域の2,000㎡未満で届出不要（23条）。","m":"贈与は面積に数えない"},{"f":"法令","t":"国土利用計画法","ref":"確認","s":"土地の交換契約では両当事者がそれぞれ権利取得者となるので、各自の取得する土地が届出対象面積以上であれば、双方が事後届出をしなければならない。","a":1,"e":"交換は対価のある契約で、当事者双方が権利取得者になる。それぞれ取得面積が基準以上なら各自届出が必要（23条）。","m":"交換は双方が届出"},{"f":"税他","t":"印紙税・登録免許税","ref":"確認","s":"1通の不動産売買契約書に、土地の譲渡金額6,000万円と建物の譲渡金額3,500万円が区分して記載されている場合、印紙税の記載金額は9,500万円となる。","a":1,"e":"同じ号の課税事項の金額が複数記載されているときは、その合計額が印紙税の記載金額となる。","m":"同じ号なら合計"},{"f":"業法","t":"クーリング・オフ","ref":"確認","s":"宅建業者Aが自ら売主となり宅建業者でないBと宅地の売買契約を結んだ。Bがクーリング・オフで契約を解除した場合でも、違約金の定めがあれば、AはBに違約金を請求できる。","a":0,"e":"クーリング・オフによる解除では、売主は損害賠償や違約金の支払を請求できない（宅建業法37条の2第1項）。","m":"クーリング・オフに違約金なし"},{"f":"権利","t":"抵当権・担保","ref":"確認","s":"根抵当権の極度額は、元本が確定した後は、後順位抵当権者など利害関係を有する者の承諾を得たとしても、変更することができない。","a":0,"e":"極度額の変更は利害関係人の承諾があればでき、元本確定の前後を問わない（398条の5）。確定前に限るのは被担保債権の範囲の変更。","m":"極度額は確定後も変更可"},{"f":"業法","t":"重要事項説明","ref":"確認","s":"建物の貸借の媒介を行う場合でも、その建物が津波防災地域づくり法による津波災害警戒区域内にあるときは、その旨を重要事項として説明しなければならない。","a":1,"e":"津波災害警戒区域内にある旨は、売買・交換だけでなく貸借でも重要事項の説明対象となる。","m":"津波警戒区域は貸借も説明"},{"f":"業法","t":"クーリング・オフ","ref":"確認","s":"宅建業者Aが自ら売主となる宅地の売買で、宅建業者でないBが、Aから媒介の依頼を受けた宅建業者Cの事務所で買受けの申込みをした。Bはクーリング・オフについて告げられていなければ、契約を解除できる。","a":0,"e":"媒介を依頼された他の宅建業者の事務所は「事務所等」に当たり、そこでの申込みは告知の有無にかかわらずクーリング・オフできない。","m":"媒介業者の事務所も不可"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"確認","s":"固定資産税に関して、固定資産評価審査委員会に審査の申出ができるのは、固定資産課税台帳に登録された価格に関する不服に限られる。","a":1,"e":"審査の申出の対象は台帳に登録された価格に関する不服（地方税法432条1項）。減免の不許可などは対象外。","m":"審査申出は価格だけ"},{"f":"権利","t":"弁済・相殺・債権譲渡","ref":"確認","s":"譲渡制限の意思表示がされた債権の譲受人が、その意思表示を重大な過失なく知らなかった場合、債務者は譲受人からの履行請求を拒むことができない。","a":1,"e":"譲渡制限特約に反する譲渡も有効で、債務者が履行を拒めるのは譲受人が悪意又は重過失の場合に限られる（466条3項）。","m":"善意無重過失には拒めない"},{"f":"業法","t":"クーリング・オフ","ref":"確認","s":"宅建業者が自ら売主となる宅地の売買で、業者でない買主は、クーリング・オフの告知から8日以内であっても、代金全額を支払い、かつ引渡しを受けた後は解除できない。","a":1,"e":"宅地の引渡しを受け、かつ代金全額を支払った後はクーリング・オフできない（法37条の2第1項2号）。","m":"引渡し＋全額払いで終了"},{"f":"法令","t":"建築基準法","ref":"確認","s":"防火地域内で、地階を含む階数が3以上又は延べ面積が100㎡を超える建築物は、耐火建築物又はこれと同等以上の延焼防止性能を有する建築物としなければならない。","a":1,"e":"防火地域内で階数3以上又は延べ面積100㎡超の建築物は、耐火建築物等としなければならない（61条、施行令136条の2）。","m":"防火は3階・100㎡で耐火"},{"f":"業法","t":"8種制限","ref":"確認","s":"自ら売主の宅建業者と売買契約を結んだ買主は、手付に加えて中間金を支払っていても、売主業者が履行に着手するまでは、手付を放棄して契約を解除できる。","a":1,"e":"業者が受領した手付は解約手付とされ、相手方である売主が履行に着手するまでは、買主は手付を放棄して解除できる（法39条2項）。","m":"相手方の着手まで解除可"},{"f":"税他","t":"住宅金融支援機構","ref":"確認","s":"住宅金融支援機構の証券化支援事業（買取型）には、省エネルギー性や耐震性などに優れた住宅を取得する場合に、貸付金利を一定期間引き下げる制度がある。","a":1,"e":"機構は証券化支援事業において、性能の優れた住宅の取得について金利を一定期間引き下げる優良住宅取得支援制度を設けている。","m":"良い家は金利引下げ"},{"f":"権利","t":"意思表示・行為能力","ref":"確認","s":"民法上、意思表示をした時に意思能力を有しなかった者がした法律行為は、無効ではなく、本人側が取り消すことができるにとどまる。","a":0,"e":"法律行為の当事者が意思表示をした時に意思能力を有しなかったときは、その法律行為は無効とされている（民法3条の2）。","m":"意思無能力は無効"},{"f":"税他","t":"住宅金融支援機構","ref":"確認","s":"住宅金融支援機構は、証券化支援事業（買取型）において、賃貸住宅の建設・購入に必要な資金の貸付債権も買取りの対象としている。","a":0,"e":"買取型の対象は自ら居住する住宅または親族が居住する住宅の資金の貸付債権で、投資用の賃貸住宅は対象外。","m":"賃貸用は買い取らない"},{"f":"税他","t":"土地・建物","ref":"確認","s":"木造の小屋組のうち、和小屋はトラス構造で陸梁・束・方杖などから成り、洋小屋は小屋梁・小屋束・母屋・垂木などを組み合わせて造る。","a":0,"e":"説明が逆。和小屋は小屋梁・小屋束・母屋・垂木などで組み、洋小屋はトラス構造で陸梁・束・方杖などから成る。","m":"洋小屋＝トラス"},{"f":"税他","t":"土地・建物","ref":"確認","s":"建物の構造のうち鉄筋コンクリート構造は、躯体の断面が小さく材料の質量も小さいため、建物の自重を軽くできる点に特徴がある。","a":0,"e":"逆である。鉄筋コンクリート構造は躯体断面が大きく材料も重いため、建物の自重が大きくなる。","m":"RCは自重が大きい"},{"f":"権利","t":"保証・連帯債務","ref":"確認","s":"民法上、保証人と債権者の間で結ぶ保証契約は、口頭の合意だけでは足りず、書面（又はその内容を記録した電磁的記録）でしなければ、その効力を生じない。","a":1,"e":"保証人を保護するため、保証契約は書面又は電磁的記録で行わなければ効力を生じないと定められている（民法446条2項・3項）。","m":"保証は書面が必須"},{"f":"業法","t":"監督・罰則","ref":"H25-42-1","s":"甲県知事登録の宅建士Aが、乙県内の業務で自己の名義の使用を他人に許し、その者が宅建士として表示した場合、Aは乙県知事から指示処分を受けることはあっても、事務禁止処分を受けることはない。","a":0,"e":"業務地の知事も、指示処分だけでなく1年以内の事務禁止処分をすることができる（宅建業法68条3項・4項）。","m":"業務地知事も事務禁止OK"},{"f":"業法","t":"監督・罰則","ref":"H25-42-2","s":"甲県知事登録の宅建士Aが乙県内の業務で提示した宅建士証が不正の手段で交付を受けたものであった場合でも、Aが乙県知事から登録を消除されることはない。","a":1,"e":"登録消除ができるのは登録をしている甲県知事だけで、業務地の乙県知事には消除の権限がない（68条の2第1項）。","m":"消除は登録知事だけ"},{"f":"業法","t":"監督・罰則","ref":"H25-42-3","s":"甲県知事登録の宅建士Aが、乙県知事から事務禁止処分を受けたのにこれに違反して宅建士の事務を行った場合でも、甲県知事がAの登録を消除することはない。","a":0,"e":"事務禁止処分に違反した宅建士は、登録地の甲県知事により登録を消除される（宅建業法68条の2第1項4号）。","m":"禁止違反→登録消除"},{"f":"業法","t":"監督・罰則","ref":"H25-42-4","s":"甲県知事登録の宅建士Aが乙県内で業務を行った場合、Aは甲県知事や乙県知事から業務について報告を求められることはあるが、乙県知事から指示処分を受けることはない。","a":0,"e":"業務地の乙県知事も報告を求められ、指示処分もできる（宅建業法72条3項、68条3項）。","m":"業務地知事も指示できる"},{"f":"業法","t":"業務上の規制","ref":"H28-38-イ","s":"宅建業者の代表取締役である宅建士は、取引の関係者から従業者証明書の提示を求められても、従業者証明書を携帯する義務がないので提示しなくてよい。","a":0,"e":"従業者証明書は代表者や非常勤役員を含む全従業者に携帯させ、請求があれば提示しなければならない（宅建業法48条1項・2項）。","m":"社長も従業者証明書"},{"f":"業法","t":"業務上の規制","ref":"R02-39-1","s":"宅建業者は、事務所に備える従業者名簿について、取引の関係者であるかどうかにかかわらず、閲覧の請求をした者には誰にでも閲覧させなければならない。","a":0,"e":"従業者名簿の閲覧義務は、取引の関係者から請求があった場合に限られる（宅建業法48条4項）。","m":"閲覧は取引関係者から"},{"f":"業法","t":"業務上の規制","ref":"R02-39-3","s":"宅建業者は、事務所ごとに備える従業者名簿に記載した従業者が退職したときは、その退職と同時に、従業者名簿から当該退職者に関する記載を消去しなければならない。","a":0,"e":"退職者の記載を消す義務はなく、従業者名簿は最終の記載をした日から10年間保存しなければならない（宅建業法48条3項、規則17条の2）。","m":"名簿は最終記載から10年"},{"f":"業法","t":"業務上の規制","ref":"R02-39-4","s":"宅建業者は、従業者のうち非常勤の役員や、繁忙期に一時的に事務の補助をするだけのアルバイトについては、従業者証明書を携帯させなくてもよい。","a":0,"e":"非常勤役員や一時的な事務補助者も従業者にあたり、従業者証明書を携帯させる必要がある（宅建業法48条1項）。","m":"一時的な補助者も携帯"},{"f":"税他","t":"土地・建物","ref":"R02-50-1","s":"建物は大きく基礎構造と上部構造から構成されており、基礎構造は、地盤に施す工事である地業と、その上の基礎盤から構成されている。","a":1,"e":"基礎構造は上部構造を支える部分で、地盤に施す地業と、その上の基礎盤からなる。記述は適当である。","m":"基礎構造＝地業＋基礎盤"},{"f":"税他","t":"土地・建物","ref":"R02-50-2","s":"建物の基礎は、その形式により、支持地盤が浅い場合に上部構造の荷重を地盤に直接伝える直接基礎と、支持地盤が深い場合に用いる杭基礎とに大別される。","a":1,"e":"支持地盤が浅ければ直接基礎、深ければ杭を打って支える杭基礎を用いる。記述は適当である。","m":"浅い直接・深い杭"},{"f":"税他","t":"土地・建物","ref":"R02-50-4","s":"建物の構造のうち基礎の上に載る上部構造は、建物の骨格として荷重に耐える役目を負う主要構造と、屋根・壁・床などの仕上げ部分等から構成されている。","a":1,"e":"上部構造は骨格として荷重を支える主要構造と、仕上げ部分などに分けられる。記述は適当である。","m":"主要構造が荷重を負う"},{"f":"業法","t":"媒介契約","ref":"R03-38-イ","s":"宅建業者が宅地の売却について一般媒介契約を締結した場合、依頼者に対して業務の処理状況を定期的に報告する法律上の義務は負わない。","a":1,"e":"処理状況の定期報告義務は専任媒介（2週間に1回以上）・専属専任媒介（1週間に1回以上）に限られる（宅建業法34条の2第9項）。","m":"定期報告は専任だけ"},{"f":"業法","t":"媒介契約","ref":"R03-38-ウ","s":"一般媒介契約を締結した宅建業者が任意に物件を指定流通機構に登録した場合でも、登録を証する書面を遅滞なく依頼者に引き渡す義務はない。","a":1,"e":"登録義務と登録を証する書面の引渡し義務は専任媒介契約の場合のものである（宅建業法34条の2第5項・6項）。","m":"一般は登録証明も不要"},{"f":"業法","t":"8種制限","ref":"R03-42-1","s":"宅建業者Aが自ら売主として、宅建業者でないBに代金3,200万円の土地付建物を割賦販売で引き渡した場合、Bから800万円の賦払金の支払を受けるまでに、Aは所有権移転登記をしなければならない。","a":0,"e":"登記義務が生じるのは代金の10分の3を超える支払を受けるまで。800万円は25%なので登記は不要（宅建業法43条1項）。","m":"割賦は3割超で登記"},{"f":"業法","t":"8種制限","ref":"R03-42-2","s":"宅建業者Aが自ら売主として、宅建業者でないBと工事完了前の建物を代金3,200万円で売る契約を結び、手付金100万円と中間金60万円を受領する場合、Aは保全措置を講じなくてよい。","a":1,"e":"未完成物件は代金の5%（160万円）を超えると保全措置が必要。合計160万円は超えないので不要（宅建業法41条1項）。","m":"未完成は5%超で保全"},{"f":"業法","t":"8種制限","ref":"R03-42-3","s":"宅建業者Aが自ら売主として、宅建業者でないBと代金3,200万円の売買契約を結び、損害賠償の予定額を400万円、違約金を240万円とする特約をした場合、この特約は無効となる。","a":0,"e":"予定額と違約金の合計は代金の20%（640万円）まで。合計640万円は上限内なので特約は有効（宅建業法38条1項）。","m":"予定＋違約金で2割"},{"f":"税他","t":"土地・建物","ref":"R03s-49-1","s":"沿岸地域で地震時の津波の被害を免れるためには巨大な防波堤が役立つが、防波堤には限度があり、津波の襲来を完全に防ぐことはできない。","a":1,"e":"防波堤で津波被害を完全に防ぐことはできず、避難の時間を稼ぐ役割が中心となる。記述は適当である。","m":"防波堤にも限界あり"},{"f":"税他","t":"土地・建物","ref":"R03s-49-2","s":"斜面の地質として、花崗岩が風化してできたマサ土の地盤は、一般に崩壊しにくく、がけ崩れや土石流の心配が少ない地盤である。","a":0,"e":"マサ土は粒子の間にすき間が多く、水を含むと流れやすいため、崖崩れや土石流が起きやすい。","m":"マサ土は崩れやすい"},{"f":"税他","t":"土地・建物","ref":"R03s-49-3","s":"低地は、一般に洪水や地震などに対して弱いものの、水田や宅地として利用されることが多く、大都市の大部分は低地に立地している。","a":1,"e":"低地は水田・宅地として利用され、大都市の多くも低地に広がっている。記述は適当である。","m":"大都市の多くは低地"},{"f":"税他","t":"土地・建物","ref":"R03s-49-4","s":"平地に乏しい地域では、丘陵や山麓に住宅地が広がっていることが多く、そのような場所では土砂崩れなどの土砂災害が起きやすい。","a":1,"e":"丘陵や山麓に広がった住宅地では、がけ崩れなどの土砂災害の危険がある。記述は適当である。","m":"山麓の宅地は土砂災害"},{"f":"業法","t":"営業保証金","ref":"R04-41-ア","s":"法人である宅建業者Aの代表取締役が拘禁刑に処せられ、Aの免許が取り消された場合、Aは免許取消しの日から5年を経過しなければ営業保証金を取り戻すことができない。","a":0,"e":"免許取消し後も、6か月以上の期間を定めて公告し申出がなければ取り戻せる。5年は欠格期間の話（宅建業法30条）。","m":"取戻しは公告6か月"},{"f":"業法","t":"保証協会","ref":"R04-41-ウ","s":"保証協会が社員の取引に関する苦情の解決のために必要があると認めて社員に資料の提出を求めた場合、その社員は正当な理由がなければ拒むことができない。","a":1,"e":"保証協会は苦情解決のため社員に説明や資料提出を求めることができ、社員は正当な理由なく拒めない（宅建業法64条の5）。","m":"苦情の資料は拒めない"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R05-45-1","s":"信託会社が自ら売主として、宅建業者でない買主に新築住宅を販売する場合、信託会社は住宅販売瑕疵担保保証金の供託または保険契約の締結を行う必要はない。","a":0,"e":"信託会社も宅建業者とみなされ、宅建業者でない買主に新築住宅を売るときは資力確保措置が必要である。","m":"信託会社も資力確保"},{"f":"業法","t":"住宅瑕疵担保履行法","ref":"R05-45-2","s":"新築住宅の売主である宅建業者が、供託所の所在地等について説明する際、買主の承諾があっても、書面の交付に代えて電磁的方法で提供することはできない。","a":0,"e":"売買契約締結までに書面を交付して説明するが、買主の承諾があれば電磁的方法による提供もできる（住宅瑕疵担保履行法15条）。","m":"承諾あれば電磁的OK"},{"f":"税他","t":"土地・建物","ref":"R05-49-3","s":"1923年に発生した関東地震の際には、軟弱な地盤が厚く堆積した東京の谷底低地において、多くの水道管や建物が被害を受けた。","a":1,"e":"関東地震では軟弱な谷底低地で揺れが大きく、水道管や建物に多くの被害が出た。記述は適当である。","m":"谷底低地は揺れが大"},{"f":"税他","t":"土地・建物","ref":"R05-49-4","s":"丘陵地で丘を削り谷部に盛土して宅地を造成する場合、盛土部分には地下水位を下げる排水施設を設け、十分に締め固める必要がある。","a":1,"e":"谷を埋めた盛土は崩れやすいため、排水施設の設置と締固めなどの対策が必要となる。記述は適当である。","m":"谷埋め盛土は排水と締固め"},{"f":"業法","t":"重要事項説明","ref":"R06-37-イ","s":"宅建業者が木造の既存住宅の売買を媒介する場合、実施後1年を経過していない建物状況調査があるときは、その実施の有無と結果の概要を重要事項として説明しなければならない。","a":1,"e":"既存建物の売買・貸借では、実施後1年以内（RC造等の共同住宅は2年以内）の建物状況調査の有無と結果の概要を説明する（宅建業法35条1項6号の2）。","m":"状況調査は1年以内"},{"f":"業法","t":"重要事項説明","ref":"R06-37-ウ","s":"宅建業者が造成工事完了前の宅地の売買を媒介する場合、工事完了時の形状・構造に加え、完了時に当該宅地に接する道路の構造と幅員も重要事項として説明しなければならない。","a":1,"e":"未完成物件では完了時の形状・構造を説明し、宅地の場合は接する道路の構造・幅員も含まれる（宅建業法35条1項5号、規則16条）。","m":"未完成宅地は道路も説明"},{"f":"税他","t":"景品表示法","ref":"R07-47-2","s":"分譲マンションの広告で、住戸により管理費が異なり全住戸の管理費を示すことが困難な場合には、管理費の最高額のみを表示すればよい。","a":0,"e":"管理費は1戸当たりの月額を表示し、全戸の表示が困難なときは最低額と最高額を表示する（表示規約施行規則）。","m":"管理費は最低と最高"},{"f":"税他","t":"景品表示法","ref":"R07-47-4","s":"広告の徒歩所要時間を道路距離80mにつき1分として計算した結果が15分50秒となった場合、「徒歩15分」と表示することができる。","a":0,"e":"1分未満の端数は1分として切り上げるため、「徒歩16分」と表示しなければならない（表示規約施行規則）。","m":"端数は切り上げ"},{"f":"業法","t":"宅建士","ref":"確認","s":"宅建士資格登録簿は一般の閲覧に供されないが、事務所ごとに置かれる専任の宅建士の氏名は宅建業者名簿に登載され、業者名簿は一般の閲覧に供される。","a":1,"e":"専任宅建士の氏名は業者名簿の登載事項で業者名簿は閲覧できるが、資格登録簿は閲覧の対象ではない（宅建業法8条2項、10条）。","m":"登録簿は非公開・業者名簿は公開"}];
const LESSON={"業法|免許":{"pts":["自ら当事者として売買・交換、または売買・交換・貸借の代理・媒介を業として行うには免許が必要。自ら貸主・転貸は宅建業に当たらない。","事務所が1つの都道府県内のみなら数に関係なく知事免許、2以上の都道府県に事務所を置くなら国土交通大臣免許。物件所在地は無関係。","免許の有効期間は5年。更新申請は満了日の90日前から30日前まで。満了日までに処分がなければ従前の免許は処分まで効力を有する。","免許権者は免許（更新を含む）に条件を付けられ、条件違反は任意的取消事由。免許は一身専属で、合併・相続によっても承継されない。","廃業等の届出は30日以内。死亡は相続人が死亡を知った日から、合併消滅は消滅法人の代表役員だった者がその日から届け出る。","破産・解散・廃止の届出は破産管財人・清算人・業者本人等。死亡・合併は事実発生時、それ以外は届出時に免許が失効する。","免許失効後も、一般承継人等は締結済み取引を結了する目的の範囲内で宅建業者とみなされる（76条）。"],"traps":["「他県の物件を扱うので大臣免許への免許換えが必要」と出たら×。区分は事務所の所在地だけで決まる。","「相続人は死亡の日から30日以内に届出」と出たら×。正しくは死亡を知った日から30日以内。","「合併後の会社が届出をすれば免許を承継できる」と出たら×。免許は承継されず、新たに免許を受ける必要がある。"],"rel":["業法|免許の基準","業法|監督・罰則","業法|宅建士"],"bridge":"免許は「誰が・どこで営業するか」の入口の手続、免許の基準は「免許を受けられない人」の中身。取消や失効後の処理は監督・罰則とつながる。","sys":{"overview":"宅建業法の入口となる制度。何が宅建業に当たるか、知事免許と大臣免許の区分、有効期間5年と更新、変更・廃業等の届出と失効時期を押さえれば得点できる。","tree":[{"h":"宅建業の定義","items":["宅地＝建物の敷地用の土地＋用途地域内の土地","用途地域内でも道路・公園・河川等は除く","取引＝自ら売買・交換＋売買等の代理・媒介","自ら貸主・転貸は取引に当たらない","業＝不特定多数相手に反復継続して行う"]},{"h":"免許の要否","items":["国・地方公共団体等は免許不要","信託会社・信託銀行は大臣への届出で足りる","業者に代理・媒介を任せても売主は免許必要","無免許・名義貸しは3年以下拘禁刑等"]},{"h":"免許の区分","items":["1都道府県内のみに事務所→その知事免許","2以上の都道府県に事務所→国土交通大臣免許","物件所在地・営業地域は区分に無関係","区分が変われば免許換え（従前免許は失効）","大臣免許の申請は知事を経由しない"]},{"h":"有効期間・更新","items":["有効期間は5年（知事・大臣とも）","更新申請は満了の90日前から30日前まで","処分未了なら従前免許は処分まで有効","更新後の有効期間は従前満了日の翌日から5年","免許・更新に条件を付すことができる"]},{"h":"変更の届出","items":["名簿登載事項の変更は30日以内に届出","商号・名称、事務所の名称・所在地","役員・政令使用人・専任宅建士の氏名","事務所の新設・廃止も変更の届出"]},{"h":"廃業等の届出","items":["届出期限はすべて30日以内","死亡：相続人が知った日から30日以内","死亡・合併は事実発生時に免許失効","破産・解散・廃業は届出時に免許失効","失効後も取引の結了の範囲で業者とみなす"]}],"flow":{"title":"免許取得から更新まで","steps":["事務所の所在から知事か大臣かを判断","免許申請し免許を受ける（有効期間5年）","営業保証金供託か保証協会加入で営業開始","変更があれば30日以内に変更の届出","満了90日前〜30日前に更新申請","処分まで従前免許が存続し更新後5年"]},"tables":[{"title":"取引の当否","head":["行為","自ら","代理・媒介"],"rows":[["売買","○","○"],["交換","○","○"],["貸借","×（自ら貸主）","○"],["転貸","×（自ら転貸）","○"]]},{"title":"廃業等の届出","head":["事由","届出義務者","失効時期"],"rows":[["死亡","相続人（知った日から）","死亡時"],["合併消滅","消滅法人の代表役員","合併時"],["破産","破産管財人","届出時"],["解散","清算人","届出時"],["廃業","本人・代表役員","届出時"]]},{"title":"免許換えの要否","head":["ケース","免許換え"],"rows":[["甲県のみ→甲県内で事務所増設","不要"],["甲県知事→乙県に支店新設","必要（大臣へ）"],["甲県知事→乙県へ全事務所移転","必要（乙県知事へ）"],["大臣→1県のみに縮小","必要（その知事へ）"],["他県の物件を扱うだけ","不要"]]}]},"ex":[{"t":"自ら貸主と分譲","s":"A社は自社所有のアパート5棟（計60室）を自ら貸主として入居者に貸している。さらにA社は所有地を20区画に分け、宅建業者Bに販売代理を依頼して不特定多数に分譲しようとしている。","p":"アパートの賃貸は「自ら貸主」なので取引に当たらず免許不要。一方、分譲は自ら売主として反復継続する売買なので、代理をBに任せてもA自身に免許が必要。","kw":["自ら貸主","代理","分譲","不特定多数","反復継続"]},{"t":"物件の所在地は無関係","s":"甲県知事免許のA（甲県内に本店と支店2か所）が、乙県にある宅地の売買の媒介を依頼された。翌年、Aは乙県に支店を新設することにした。","p":"乙県の物件を扱うだけなら免許換えは不要。区分は事務所の所在地だけで決まるので、乙県に支店を置いた時点で国土交通大臣への免許換えが必要になる。","kw":["免許換え","国土交通大臣","乙県","事務所","媒介"]},{"t":"更新中に満了日が来た","s":"Aの免許は2026年9月30日に満了する。Aは8月15日（満了の90日前〜30日前の期間内）に更新を申請したが、9月30日までに処分がされなかった。","p":"従前の免許は満了後も処分がされるまで効力を有し、Aは営業を続けられる。更新されれば新しい有効期間は10月1日（従前の満了日の翌日）から5年となる。","kw":["更新","90日前","30日前","有効期間","処分"]}],"around":[{"h":"届出の起算点","b":"廃業等の届出はすべて30日以内だが、死亡だけは相続人が「死亡を知った日」から起算する。合併消滅は消滅会社の代表役員だった者が合併の日から届け出る。"},{"h":"事業を始めないと","b":"免許を受けてから1年以内に事業を開始しない、または引き続き1年以上休止すると、免許は必ず取り消される（必要的取消）。この取消しは5年間の欠格事由にはならない。"},{"h":"変更の届出の範囲","b":"名簿登載事項（商号、事務所の名称・所在地、役員・政令使用人・専任宅建士の氏名など）の変更は30日以内に届出。役員の住所は登載事項でないので届出不要。"},{"h":"免許不要の主体","b":"国・地方公共団体等には宅建業法が適用されず免許不要。ただし地方公共団体から依頼を受けて媒介する民間業者は免許が必要。信託会社・信託銀行は大臣への届出で足りる。"},{"h":"宅建士の届出と比較","b":"宅建業者の変更は30日以内の「届出」、宅建士の登録事項の変更は「遅滞なく」変更の登録。主体と期限をセットで区別すると混同しにくい。"}]},"業法|免許の基準":{"pts":["拘禁刑以上の刑に処せられ、執行を終わり又は受けなくなった日から5年を経過しない者は欠格。罪の種類は問わない。","罰金刑が欠格となるのは宅建業法違反、傷害・暴行・脅迫等の暴力系の罪、背任罪などに限られ、執行終了等から5年間。","拘留・科料は欠格事由にならない。控訴・上告中で刑が確定していない間も「刑に処せられた」に当たらない。","執行猶予期間中は欠格だが、猶予期間を満了すれば刑の言渡しが効力を失い、5年を待たずに直ちに免許を受けられる。","不正手段による免許取得・業務停止事由で情状が特に重い・業務停止処分違反で免許を取り消された者は取消しの日から5年間欠格。","破産手続開始決定を受けて復権を得ない者、暴力団員等（脱退後5年を経過しない者を含む）、心身の故障で業務を適正に行えない者は欠格。","法人は役員（非常勤・相談役等を含む）や政令で定める使用人（支店長等）に欠格者がいれば免許を受けられない。専任宅建士は審査対象外。"],"traps":["「非常勤の取締役だから会社の免許に影響しない」と出たら×。非常勤でも役員として審査対象になる。","「執行猶予期間が満了しても、その日から5年を経過しないと免許を受けられない」と出たら×。満了で直ちに受けられる。","「所得税法違反の罰金で免許が取り消される」と出たら×。罰金で欠格となる罪は宅建業法違反・暴力系・背任等に限られる。"],"rel":["業法|免許","業法|宅建士","業法|監督・罰則"],"bridge":"宅建士の登録欠格もほぼ同じ構造だが、未成年者の扱いや事務禁止処分中の登録消除など宅建士特有の事由がある。該当すれば監督・罰則の必要的取消につながる。","sys":{"overview":"免許の欠格事由（5条）は宅建士の登録欠格とほぼ共通の土台。刑罰による欠格（拘禁刑以上は罪を問わず、罰金は特定の罪のみ）と5年の起算点、法人役員への波及を押さえれば得点できる。","tree":[{"h":"本人の能力","items":["心身の故障で業務を適正に行えない者","破産者で復権を得ない者（復権で直ちに可）","未成年者は法定代理人が欠格なら不可","成年者と同一の行為能力ある未成年者は可"]},{"h":"刑罰","items":["拘禁刑以上：罪を問わず執行終了等から5年","罰金：業法違反・暴力系・背任のみ5年","暴力系＝傷害・現場助勢・暴行・脅迫等","拘留・科料は欠格事由にならない","上訴中で未確定なら欠格でない","執行猶予中は欠格、満了で直ちに可"]},{"h":"処分歴","items":["不正取得・情状特に重い・業務停止違反で取消","上記取消から5年間は欠格","法人：聴聞公示前60日内の役員も5年","聴聞公示後のかけこみ廃業は届出から5年"]},{"h":"不正・暴力団","items":["申請前5年以内に宅建業で不正等をした者","不正・不誠実な行為をするおそれが明らか","暴力団員・脱退後5年未経過の者","暴力団員等が事業活動を支配する者"]},{"h":"関係者","items":["法人：役員（非常勤・相談役等含む）","法人・個人：政令で定める使用人（支店長等）","専任宅建士は審査対象外","欠格者がいれば法人自体が免許不可"]},{"h":"その他","items":["事務所に専任宅建士の法定数が不足","申請書・添付書類の重要事項の虚偽記載","免許後に該当すれば原則必要的取消"]}],"flow":{"title":"刑罰による欠格の判定","steps":["刑が確定しているか（上訴中なら欠格でない）","刑の種類は拘禁刑以上か罰金か拘留・科料か","拘留・科料なら欠格事由にならない","罰金なら業法違反・暴力系・背任か確認","執行猶予なら猶予中のみ欠格、満了で回復","実刑なら執行終了等から5年経過で回復"]},"tables":[{"title":"刑罰と欠格","head":["刑","罪の種類","欠格期間"],"rows":[["拘禁刑以上","問わない","執行終了等から5年"],["罰金","業法違反","執行終了等から5年"],["罰金","傷害・暴行・脅迫等","執行終了等から5年"],["罰金","背任","執行終了等から5年"],["罰金","暴対法・暴力行為等処罰法","執行終了等から5年"],["罰金","上記以外（所得税法等）","欠格でない"],["拘留・科料","問わない","欠格でない"],["執行猶予付","問わない","猶予中のみ（満了で可）"]]},{"title":"5年待つもの・待たないもの","head":["事由","回復"],"rows":[["破産者の復権","直ちに"],["執行猶予期間の満了","直ちに"],["実刑の執行終了","5年経過後"],["不正取得等による免許取消","取消から5年"],["暴力団員の脱退","脱退から5年"]]},{"title":"法人の審査対象","head":["地位","対象"],"rows":[["代表取締役・取締役","○"],["非常勤役員・相談役等","○"],["政令使用人（支店長）","○"],["専任宅建士","×"],["一般の従業者","×"]]}]},"ex":[{"t":"罰金は罪の種類次第","s":"A社の常勤取締役Xが所得税法違反で罰金100万円、非常勤取締役Yが脅迫罪で罰金30万円に処せられた。","p":"所得税法違反の罰金は欠格事由に当たらないが、脅迫罪は暴力系の罪なので罰金でも欠格。非常勤でも役員なので、Yを理由にA社の免許は取り消される。","kw":["罰金","所得税法","脅迫","非常勤","取締役"]},{"t":"執行猶予と控訴中","s":"B社の支店長（政令使用人）Zは傷害罪で拘禁刑1年・執行猶予3年の判決を受けた。別の役員Wは第一審で拘禁刑の判決を受け、控訴中である。","p":"Zの猶予期間中はB社は免許を受けられないが、猶予期間を満了すれば5年を待たず直ちに受けられる。Wは刑が確定していないので「刑に処せられた」に当たらない。","kw":["執行猶予","政令で定める使用人","猶予期間を満了","控訴","確定"]},{"t":"取消し前60日の役員","s":"C社は不正の手段で免許を受けたとして免許を取り消された。聴聞の期日・場所の公示日の30日前まで取締役だったDと、支店長だったEが、それぞれ新会社を設立しようとしている。","p":"不正取得等による取消しでは、公示日前60日以内に役員だったDも取消しの日から5年間欠格。政令使用人だったEはこの対象に含まれない。","kw":["不正の手段","免許取消","60日以内","役員","5年"]}],"around":[{"h":"拘禁刑への一本化","b":"2025年6月1日施行で懲役・禁錮は拘禁刑に一本化された。「拘禁刑以上の刑なら罪を問わず5年」という欠格の仕組み自体は変わらない。"},{"h":"かけこみ廃業","b":"不正取得等による取消処分の聴聞の公示後に、相当の理由なく廃業等の届出をした者は、届出の日から5年間欠格となる。処分逃れを防ぐ趣旨。"},{"h":"刑罰なしでも欠格","b":"免許申請前5年以内に宅建業に関し不正又は著しく不当な行為をした者や、不正・不誠実な行為をするおそれが明らかな者は、刑を受けていなくても欠格。"},{"h":"事務所の要件","b":"事務所に法定数の成年の専任宅建士を置いていないことも免許の基準に当たる。申請書の重要事項の虚偽記載・記載欠如も免許されない。"},{"h":"宅建士の登録欠格","b":"宅建士の登録欠格事由も刑罰・破産・暴力団員等はほぼ共通。宅建士では営業に関し成年者と同一の行為能力を有しない未成年者が登録できない点が独自。"}]},"業法|宅建士":{"pts":["登録は試験を行った都道府県知事に申請する。住所地や勤務地は関係なく、2年以上の実務経験か国土交通大臣の登録実務講習修了が必要。","登録の移転は他県の業者の事務所に従事する（予定）場合に「できる」任意の手続で、事務禁止処分期間中は申請できない。","氏名・住所・本籍、勤務先業者の商号・名称・免許証番号に変更があれば、専任かどうかを問わず遅滞なく変更の登録を申請する。","宅建士証の有効期間は5年。交付・更新の際は登録先知事が指定する講習（交付申請前6か月以内）を受講する。試験合格後1年以内の交付は講習免除。","宅建士証は取引関係者から請求があれば提示し、重要事項説明の際は請求がなくても提示する。住所欄へのシール貼付や旧姓併記が認められる。","事務禁止処分を受けたら速やかに交付知事へ宅建士証を提出し、効力を失ったら速やかに返納する。違反は10万円以下の過料。","営業に関し成年者と同一の行為能力を有しない未成年者は登録できないが、営業許可等で同一の行為能力があれば登録できる。"],"traps":["「他県の業者の専任宅建士になるには登録の移転をしなければならない」と出たら×。登録の移転は任意。","「専任でない宅建士は勤務先が変わっても変更の登録は不要」と出たら×。勤務先業者は登録事項で専任かを問わない。","「宅建士証の更新では国土交通大臣が指定する講習を受講」と出たら×。登録先の都道府県知事が指定する講習。"],"rel":["業法|免許の基準","業法|事務所・案内所","業法|重要事項説明"],"bridge":"登録欠格は免許の基準と似ているが別制度。宅建士の独占業務は35条の説明と35条・37条書面への記名で、専任宅建士の設置数は事務所・案内所の規制で決まる。","sys":{"overview":"宅建士は試験合格→登録→宅建士証交付の3段階で成立する資格。登録先（試験地の知事）、登録の移転・変更の登録、宅建士証の有効期間5年と講習、提示・提出・返納の区別を押さえれば得点できる。","tree":[{"h":"登録","items":["試験を行った都道府県知事に申請","実務2年以上か登録実務講習の修了が必要","登録は一生有効（消除されない限り）","登録欠格は免許の基準とほぼ同じ","事務禁止中に自ら消除→満了まで再登録不可"]},{"h":"登録の移転","items":["他県の業者の事務所に従事（予定）の場合","移転は任意で義務ではない","事務禁止処分期間中は申請できない","現登録知事を経由して移転先知事へ申請","新宅建士証は従前の残存期間で交付"]},{"h":"変更・死亡等","items":["氏名・住所・本籍の変更は変更の登録","勤務先業者の商号・免許証番号も対象","専任か否かを問わず遅滞なく申請","死亡等の届出は30日以内（相続人は知った日から）"]},{"h":"宅建士証","items":["有効期間5年","交付申請前6か月以内の法定講習を受講","講習は登録先知事が指定","合格後1年以内・移転時の交付は講習免除","旧姓併記・住所欄シール貼付が可能"]},{"h":"提示・提出・返納","items":["関係者の請求があれば提示","重要事項説明時は請求なしで提示","事務禁止処分→交付知事に速やかに提出","失効・登録消除→速やかに返納","提出・返納違反は10万円以下の過料"]},{"h":"独占業務と義務","items":["35条の重要事項説明","35条書面への記名","37条書面への記名","公正誠実・信用失墜行為の禁止","知識・能力の維持向上の努力義務"]}],"flow":{"title":"合格から宅建士証の更新","steps":["試験合格（合格は一生有効）","試験地の知事に登録申請（実務2年等）","登録を受ける（宅建士証はまだない）","法定講習を受け宅建士証交付（1年内は免除）","宅建士証の有効期間は5年","更新前6か月以内に法定講習を受け更新"]},"tables":[{"title":"提示・提出・返納","head":["場面","行為","相手"],"rows":[["関係者から請求","提示","請求者"],["重要事項説明","提示（請求不要）","相手方"],["事務禁止処分","提出","交付知事"],["禁止期間満了","返還請求で返還","交付知事"],["失効・登録消除","返納","交付知事"]]},{"title":"登録の移転と変更の登録","head":["項目","登録の移転","変更の登録"],"rows":[["性質","任意（できる）","義務"],["きっかけ","他県業者の事務所に従事","登録事項の変更"],["申請先","現登録知事を経由して移転先知事へ","登録先知事"],["期限","定めなし","遅滞なく"],["事務禁止中","不可","可"]]},{"title":"講習の要否","head":["場面","法定講習"],"rows":[["合格後1年以内の交付","不要"],["合格後1年超の交付","必要"],["有効期間の更新","必要"],["登録の移転に伴う交付","不要"]]}]},"ex":[{"t":"登録の移転は任意","s":"甲県知事の登録を受けている宅建士Aが、乙県知事免許の業者の乙県内の事務所で専任宅建士として働くことになった。同僚Bは勤務先は甲県のまま、住所だけ乙県に移した。","p":"Aは登録を乙県知事に移転「できる」が義務ではない（甲県知事を経由して申請）。Bは乙県の事務所に従事しないので移転できず、住所変更の変更の登録をする。","kw":["登録の移転","専任","乙県知事","住所","変更の登録"]},{"t":"移転後の宅建士証の期限","s":"宅建士Cの宅建士証は2028年3月31日まで有効。Cは2026年10月に乙県知事へ登録の移転を申請し、同時に宅建士証の交付も申請した。","p":"新しい宅建士証の有効期間は旧証の残り期間（2028年3月31日まで）で、新たに5年ではない。この交付には法定講習も不要。","kw":["登録の移転","宅建士証","有効期間","交付","講習"]},{"t":"事務禁止の提出先","s":"甲県知事の登録・宅建士証の交付を受けているDが、乙県内の事務所で不正行為をし、乙県知事から6か月の事務禁止処分を受けた。","p":"宅建士証は処分をした乙県知事ではなく、交付を受けた甲県知事に速やかに提出する。期間満了後に返還を請求すれば直ちに返還され、提出を怠ると10万円以下の過料。","kw":["事務禁止","提出","交付を受けた","甲県知事","過料"]}],"around":[{"h":"講習の要否","b":"交付申請前6か月以内の知事指定講習が原則必要。合格から1年以内の交付と登録の移転に伴う交付は免除。合格から交付までの年数に上限はない。"},{"h":"死亡等の届出","b":"宅建士が死亡したら相続人が死亡を知った日から30日以内、心身の故障で事務を適正に行えなくなったら本人・法定代理人・同居の親族が30日以内に登録知事へ届け出る。"},{"h":"変更の登録の範囲","b":"氏名・住所・本籍、勤務先業者の商号・名称・免許証番号の変更は、専任かどうかを問わず遅滞なく変更の登録。氏名・住所の変更なら宅建士証の書換え交付も申請する。"},{"h":"宅建士だけの事務","b":"重要事項の説明、35条書面への記名、37条書面への記名の3つ。重説では請求がなくても宅建士証を提示し、37条書面の交付時は請求があれば提示する。"},{"h":"登録消除と5年","b":"不正登録、事務禁止事由で情状が特に重い、事務禁止処分違反で登録を消除されると、消除処分の日から5年間は再登録できない。"}]},"業法|営業保証金":{"pts":["主たる事務所1,000万円、従たる事務所1か所ごとに500万円を、全事務所分まとめて主たる事務所の最寄りの供託所に供託する。","金銭のほか有価証券も可。評価額は国債100%、地方債・政府保証債90%、その他の有価証券80%。","供託後、供託書の写しを添付して免許権者に届け出た後でなければ事業を開始できない。新設事務所分も供託・届出後に業務開始。","免許後3か月以内に届出がなければ免許権者は催告しなければならず、催告到達から1か月以内に届出がなければ免許を取り消せる。","主たる事務所移転で供託所が変わったとき、金銭のみなら保管替えを請求し、有価証券を含むなら新たに供託する（二重供託後に取戻し）。","還付を受けられるのは業者と宅建業の取引をした者で宅建業者を除く。還付で不足したら通知を受けた日から2週間以内に不足額を供託する。","取戻しには6か月以上の公告が必要（一部の事務所廃止も同じ）。保証協会加入時・保管替え時・取戻し事由発生から10年経過時は公告不要。"],"traps":["「国債は額面の90%、地方債は80%で評価」と出たら×。国債100%、地方債90%、その他80%。","「免許失効による取戻しの公告期間は3か月」と出たら×。還付請求権者への公告は6か月を下らない期間が必要。","「金銭のみで供託していても移転先の供託所に新たに供託し直す」と出たら×。金銭のみなら保管替えの請求。"],"rel":["業法|保証協会","業法|住宅瑕疵担保履行法","業法|免許"],"bridge":"保証協会は営業保証金に代わる制度で、分担金は60万・30万と小さく金銭のみ。還付の限度額は営業保証金相当額で同じだが、公告や期限の細部が異なる。","sys":{"overview":"取引相手の損害を担保する業者自身の供託制度。供託額（本店1,000万円・支店500万円）、有価証券の評価割合、供託→届出→営業開始の順序、還付・不足額供託・取戻し（6か月公告）の期限を押さえれば得点できる。","tree":[{"h":"供託","items":["主たる事務所1,000万円","従たる事務所1か所ごとに500万円","主たる事務所の最寄りの供託所に一括供託","金銭・有価証券（国債100%等）で可"]},{"h":"営業開始","items":["供託後、供託書の写しを添えて免許権者に届出","届出後でなければ事業開始できない","事務所新設時も供託・届出後に業務開始","免許後3か月届出なし→催告","催告到達後1か月届出なし→取消できる"]},{"h":"保管替え等","items":["主たる事務所移転で最寄り供託所が変わる場合","金銭のみ→保管替えを請求","有価証券を含む→新たに供託し旧分を取戻し","移転後遅滞なく供託"]},{"h":"還付","items":["業者と宅建業の取引をした者が対象","宅建業者は還付を受けられない","上限は供託した営業保証金の額","不足通知から2週間以内に不足額供託","供託から2週間以内に免許権者へ届出"]},{"h":"取戻し","items":["免許失効・取消、一部事務所廃止など","原則6か月以上の公告が必要","保管替え・保証協会加入時は公告不要","取戻し事由発生から10年経過で公告不要"]}],"flow":{"title":"供託から還付・補充まで","steps":["主たる事務所最寄りの供託所に供託","供託書の写しを添えて免許権者に届出","届出後に事業開始（3か月で催告）","取引相手が供託所に還付請求","免許権者から不足額供託の通知","通知受領から2週間以内に不足額を供託","供託から2週間以内に免許権者へ届出"]},"tables":[{"title":"有価証券の評価額","head":["種類","評価"],"rows":[["金銭","100%"],["国債証券","額面の100%"],["地方債・政府保証債","額面の90%"],["その他の有価証券","額面の80%"]]},{"title":"取戻しの公告","head":["取戻し事由","公告"],"rows":[["免許失効・取消","必要（6か月以上）"],["一部の事務所廃止","必要（6か月以上）"],["保証協会の社員となった","不要"],["保管替え後の旧供託所分","不要"],["事由発生から10年経過","不要"]]},{"title":"供託額の計算例","head":["事務所","供託額"],"rows":[["本店のみ","1,000万円"],["本店＋支店1","1,500万円"],["本店＋支店2","2,000万円"],["本店＋支店5","3,500万円"]]}]},"ex":[{"t":"有価証券の評価額","s":"本店と支店2か所で開業するAは、2,000万円の営業保証金が必要。Aは額面1,000万円の国債と額面1,000万円の地方債で供託しようとしている。","p":"国債は100%で1,000万円、地方債は90%で900万円と評価され、合計1,900万円で100万円不足する。供託額は額面ではなく評価額で計算する。","kw":["有価証券","国債","地方債","90%","供託"]},{"t":"他県に支店を新設","s":"甲県に本店を置く大臣免許の業者Bが、乙県に支店を新設した。Bは乙県の支店の最寄りの供託所に500万円を供託しようとしている。","p":"新設分の500万円も主たる事務所（甲県の本店）の最寄りの供託所に供託する。供託して免許権者に届け出た後でなければ、その支店で業務を開始できない。","kw":["従たる事務所","500万円","主たる事務所","最寄りの供託所","届出"]},{"t":"還付で不足したら","s":"業者Cとの売買で損害を受けた個人Dが営業保証金から300万円の還付を受けた。同じくCと取引した宅建業者Eも還付を求めている。","p":"Cは免許権者から不足額供託の通知を受けた日から2週間以内に供託し、供託した日から2週間以内に届け出る。宅建業者であるEは還付を受けられない。","kw":["還付","不足額","2週間以内","通知","宅建業者を除く"]}],"around":[{"h":"事業開始届の催告","b":"免許後3か月以内に供託の届出がなければ免許権者は催告しなければならず、催告到達から1か月以内に届出がなければ免許を取り消すことができる（任意的）。"},{"h":"届出前の開業は罰則","b":"供託の届出前に事業を開始すると、監督処分のほか6か月以下の拘禁刑又は100万円以下の罰金（併科あり）の対象になる。"},{"h":"移転と保管替え","b":"主たる事務所の移転で供託所が変わったら、金銭のみなら保管替えを請求、有価証券を含むなら新たに供託してから旧供託所分を取り戻す（公告不要）。"},{"h":"取戻しの公告","b":"免許失効・一部事務所廃止による取戻しは6か月以上の公告が必要。保証協会加入、保管替え、取戻し事由発生から10年経過の場合は不要。"},{"h":"保証協会と比較","b":"営業保証金は本店1,000万円・支店500万円で有価証券可。保証協会の分担金は本店60万円・支店30万円で金銭のみ。還付限度はどちらも営業保証金相当額。"}]},"業法|保証協会":{"pts":["弁済業務保証金分担金は主たる事務所60万円、その他の事務所1か所につき30万円で、金銭のみ。加入しようとする日までに納付する。","加入後に事務所を新設したときは、その日から2週間以内に追加の分担金を納付する。怠ると社員の地位を失う。","保証協会は分担金の受領日から1週間以内に、同額の弁済業務保証金を法務大臣及び国土交通大臣が定める供託所に供託する。","還付の限度額は、その社員が社員でなければ供託すべき営業保証金相当額。社員となる前に取引した者（宅建業者を除く）も対象。","還付を受けるには保証協会の認証が必要で、認証事務は認証申出書の受理の順序に従って処理する。","還付後、保証協会は大臣の通知から2週間以内に還付額を供託し、社員は協会の通知から2週間以内に還付充当金を納付する。","社員の地位を失ったら1週間以内に営業保証金を供託する。分担金返還の公告（6か月以上）は社員の地位を失った場合のみで、一部事務所廃止なら不要。"],"traps":["「分担金を国債証券で納付できる」と出たら×。分担金は金銭のみ（協会が供託する弁済業務保証金は有価証券も可）。","「分担金は加入した日から1週間以内に納付」と出たら×。加入しようとする日までに納付する。","「納付した弁済業務保証金の額の範囲内で弁済を受けられる」と出たら×。限度は営業保証金相当額。"],"rel":["業法|営業保証金","業法|監督・罰則","業法|住宅瑕疵担保履行法"],"bridge":"営業保証金は業者自身が主たる事務所最寄りに供託、保証協会は協会が供託し業者は分担金を納める。期限は「2週間」と「1週間」が入り混じるので主体ごとに整理する。","sys":{"overview":"営業保証金に代わる弁済制度。分担金（本店60万円・支店30万円、金銭のみ）の納付時期、協会の1週間以内供託、還付の認証と限度額、還付充当金の2週間、社員地位喪失後の1週間を主体別に整理すれば得点できる。","tree":[{"h":"保証協会","items":["国土交通大臣が指定する一般社団法人","宅建業者のみが社員","業者は1つの協会の社員にしかなれない","社員加入時は協会が免許権者に報告"]},{"h":"業務","items":["必須：苦情の解決","必須：研修","必須：弁済業務","任意：一般保証・手付金等保管・研修費助成","その他必要な業務は大臣の承認が必要"]},{"h":"分担金","items":["主たる事務所60万円","その他の事務所1か所30万円","金銭のみ（有価証券不可）","加入しようとする日までに納付","事務所新設は2週間以内に追加納付"]},{"h":"弁済業務保証金","items":["協会が分担金受領から1週間以内に供託","供託先は法務大臣及び国交大臣が定める供託所","協会の供託は有価証券も可","社員加入で営業保証金は公告なく取戻し可"]},{"h":"還付","items":["社員加入前の取引も対象","宅建業者は対象外","限度は営業保証金相当額","保証協会の認証が必要（受理順に処理）","協会は通知から2週間以内に還付額を供託"]},{"h":"社員の地位喪失","items":["還付充当金は通知から2週間以内","未納付なら社員の地位を失う","喪失から1週間以内に営業保証金を供託","分担金返還は6か月以上の公告後","一部事務所廃止の返還は公告不要"]}],"flow":{"title":"還付から補充まで","steps":["取引相手が保証協会に認証を申し出る","協会が認証（申出書の受理順）","供託所に還付請求し還付を受ける","大臣の通知から2週間以内に協会が供託","協会が社員に還付充当金納付を通知","社員は通知から2週間以内に納付","未納付なら地位喪失→1週間以内に営業保証金"]},"tables":[{"title":"営業保証金と保証協会","head":["項目","営業保証金","保証協会"],"rows":[["額（本店）","1,000万円","60万円"],["額（支店1か所）","500万円","30万円"],["納付方法","金銭・有価証券","金銭のみ"],["供託・納付先","最寄りの供託所","保証協会"],["事務所新設","供託・届出後開始","2週間以内に納付"],["還付の認証","不要","必要"],["還付限度","供託額","営業保証金相当額"]]},{"title":"期限の整理","head":["主体","場面","期限"],"rows":[["業者","加入時の分担金","加入しようとする日まで"],["業者","事務所新設の追加分","2週間以内"],["協会","分担金受領後の供託","1週間以内"],["協会","還付後の補充供託","通知から2週間以内"],["業者","還付充当金","通知から2週間以内"],["業者","地位喪失後の営業保証金","1週間以内"]]},{"title":"還付限度額の計算例","head":["事務所","分担金","還付限度"],"rows":[["本店のみ","60万円","1,000万円"],["本店＋支店1","90万円","1,500万円"],["本店＋支店3","150万円","2,500万円"]]}]},"ex":[{"t":"還付の限度額","s":"本店と支店2か所を持つ社員Aは、分担金として120万円（60万円＋30万円×2）を納付している。Aとの取引で損害を受けた個人Bが還付を求めた。","p":"限度は納付した120万円ではなく、Aが社員でなければ供託すべき営業保証金相当額の2,000万円。Aが社員になる前の取引でも還付の対象となる。","kw":["還付","限度","分担金","営業保証金の額に相当","社員となる前"]},{"t":"加入後に支店を新設","s":"保証協会の社員Cが支店を1か所新設した。Cは手元の国債で30万円分を納付しようと考えている。","p":"追加の分担金30万円は新設の日から2週間以内に金銭で納付する（有価証券不可）。期限内に納付しなければ社員の地位を失い、1週間以内に営業保証金を供託しないと営業できない。","kw":["事務所を設置","2週間以内","金銭","社員の地位","1週間以内"]},{"t":"還付から充当金まで","s":"社員Dとの取引で損害を受けた個人Eが

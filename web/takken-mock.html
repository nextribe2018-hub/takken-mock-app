の同意が必要である（区分所有法36条）。","m":"招集省略は全員同意"},{"f":"権利","t":"区分所有法","ref":"R05-13-3","s":"区分所有建物の共用部分について、その保存行為は、規約に別段の定めがない限り、集会の決議を経ることなく各共有者がすることができる。","a":1,"e":"保存行為は各共有者が単独ですることができる（区分所有法18条1項ただし書）。","m":"保存行為は各自単独で"},{"f":"権利","t":"区分所有法","ref":"R04-13-1","s":"区分所有建物の管理者が、規約により、その職務に関して区分所有者のために原告となって訴えを提起したときは、管理者は、各区分所有者にその旨を通知する必要はない。","a":0,"e":"規約により原告・被告となったときは、遅滞なく区分所有者に通知しなければならない（区分所有法26条5項）。","m":"規約で訴訟したら通知必要"},{"f":"権利","t":"区分所有法","ref":"R04-13-2","s":"区分所有建物に管理者がないときは、区分所有者の5分の1以上で議決権の5分の1以上を有するものが集会を招集することができ、この定数は規約で減ずることができる。","a":1,"e":"管理者がないときは5分の1以上の者が招集でき、その定数は規約で減ずることができる（区分所有法34条5項）。","m":"管理者不在は1/5で招集"},{"f":"権利","t":"区分所有法","ref":"R03s-13-2","s":"新築マンションの分譲業者Aのように、最初に建物の専有部分の全部を所有する者は、公正証書により、廊下や階段室などの法定共用部分を共用部分とする旨の規約を設定することができる。","a":0,"e":"公正証書で設定できるのは規約共用部分などに関する規約であり、法定共用部分を定める規約は設定できない（区分所有法32条）。","m":"公正証書規約に法定共用部分なし"},{"f":"権利","t":"区分所有法","ref":"R02-13-2","s":"Aマンションの共用部分を区分所有者全員で共有している場合において、共用部分の管理に要する費用は、規約に別段の定めがない限り、各共有者が等しい割合で負担する。","a":0,"e":"各共有者は規約に別段の定めがない限り、その持分に応じて負担する（区分所有法19条）。","m":"管理費は持分に応じて"},{"f":"権利","t":"不動産登記法","ref":"R07-14-1","s":"Aが所有する一筆の甲土地の一部が別の地目となった場合であっても、登記官は、職権で甲土地について分筆の登記をすることはできない。","a":0,"e":"一部が別地目となったときは、登記官は職権で分筆の登記をしなければならない（不動産登記法39条2項）。","m":"一部別地目は職権分筆"},{"f":"権利","t":"不動産登記法","ref":"R07-14-4","s":"Aが所有する甲建物と乙建物とを一個の建物とするための建物の合併の登記は、表題部所有者又は所有権の登記名義人以外の者は申請することができない。","a":1,"e":"建物の合併の登記の申請人は表題部所有者又は所有権の登記名義人に限られる（不動産登記法54条1項）。","m":"合併登記は所有者のみ申請"},{"f":"権利","t":"不動産登記法","ref":"R06-14-1","s":"AがBに甲土地を売却する際に買戻しの特約をし、その旨の登記がされた場合において、売買契約の日から10年を経過したときは、登記権利者は、単独で当該買戻しの特約の登記の抹消を申請することができる。","a":1,"e":"契約日から10年経過した買戻し特約の登記は、登記権利者が単独で抹消申請できる（不動産登記法69条の2）。","m":"買戻し登記は10年で単独抹消"},{"f":"権利","t":"不動産登記法","ref":"R06-14-3","s":"Aが自己所有の甲土地を相続人ではないBに遺贈した場合、Aの死亡後、甲土地についての遺贈による所有権移転の登記は、受遺者Bが単独で申請することができる。","a":0,"e":"単独申請できるのは相続人に対する遺贈の場合であり、相続人以外への遺贈は共同申請が原則（不動産登記法63条3項）。","m":"単独申請は相続人への遺贈のみ"},{"f":"権利","t":"不動産登記法","ref":"R05-14-1","s":"Aが所有権の登記名義人である甲建物が火災により滅失したときは、Aは、滅失の日から1か月以内に、甲建物の滅失の登記を申請しなければならない。","a":1,"e":"建物の滅失の登記は滅失の日から1か月以内に申請しなければならない（不動産登記法57条）。","m":"建物滅失登記は1か月以内"},{"f":"権利","t":"不動産登記法","ref":"R05-14-2","s":"登記簿の附属書類のうち、Aが所有権移転の登記を申請した際の申請書については、何人も、正当な理由の有無にかかわらず、手数料を納付すれば閲覧することができる。","a":0,"e":"申請書の閲覧は、請求人に正当な理由があると認められる部分に限られる（不動産登記法121条3項）。","m":"申請書閲覧は正当理由が必要"},{"f":"権利","t":"不動産登記法","ref":"R04-14-2","s":"AがBに甲土地を売却し、資格者代理人に依頼して所有権移転の登記を申請する場合には、登記義務者Aの登記識別情報を提供する必要はない。","a":0,"e":"資格者代理人による申請でも登記識別情報の提供は必要であり、正当な理由がある場合に限り不要となる（不動産登記法22条）。","m":"代理人申請でも識別情報必要"},{"f":"権利","t":"不動産登記法","ref":"R03s-14-1","s":"Aが表題登記のされていない甲土地の所有権を取得した場合、Aは、その所有権の取得の日から1か月以内に、甲土地の表題登記を申請しなければならない。","a":1,"e":"表題登記のない土地の所有権取得者には1か月以内の表題登記の申請義務がある（不動産登記法36条）。","m":"土地表題登記は1か月以内"},{"f":"権利","t":"不動産登記法","ref":"R02s-14-2","s":"Aが所有する甲土地に、所有権の登記以外の権利に関する登記がされているときは、Aは、甲土地について分筆の登記をすることができない。","a":0,"e":"そのような制限があるのは合筆の登記であり、分筆の登記はすることができる（不動産登記法41条）。","m":"制限は合筆、分筆はOK"},{"f":"権利","t":"相続","ref":"R04-02-1","s":"Aには子B及びCがいる。Bは、Aの生前であっても、家庭裁判所の許可を受ければ、将来のAの相続についての遺留分を放棄することができる。","a":1,"e":"相続開始前の遺留分の放棄は家庭裁判所の許可を受けたときに限り効力を生ずる（民法1049条1項）。","m":"生前の遺留分放棄は家裁許可"},{"f":"権利","t":"相続","ref":"R04-02-2","s":"Aには子B及びCがいる。Bは、Aの生前に、家庭裁判所に対して将来のAの相続についての相続放棄の申述をすることはできない。","a":1,"e":"相続放棄は相続開始後にのみでき、生前の相続放棄は認められない（民法915条・938条）。","m":"相続放棄は生前不可"},{"f":"権利","t":"相続","ref":"R04-02-3","s":"Aには子B及びCがいる。Bが、Aの生前に家庭裁判所の許可を受けて遺留分を放棄した場合、Bは、その後に開始したAの相続において遺産を相続する権利を失う。","a":0,"e":"遺留分を放棄しても相続人の地位は失わず、遺産を相続することはできる。","m":"遺留分放棄≠相続放棄"},{"f":"権利","t":"相続","ref":"R04-02-4","s":"Aが遺言で全財産を友人Dに遺贈して死亡し、Aの相続人がAの配偶者Bと兄Cである場合、兄弟姉妹であるCには遺留分がない。","a":1,"e":"遺留分は兄弟姉妹以外の相続人にのみ認められる（民法1042条）。","m":"兄弟姉妹に遺留分なし"},{"f":"権利","t":"相続","ref":"R02-08-2","s":"Aの子Bが既に死亡しており、Bの子CもAより先に死亡していた場合において、その後Aが死亡したときは、Cの子DがAの相続人となることはない。","a":0,"e":"直系卑属には再代襲が認められ、ひ孫が相続人となる（民法887条3項）。","m":"子の系統は再代襲あり"},{"f":"権利","t":"相続","ref":"R02-08-4","s":"Aの相続人となるべき弟B及びBの子Cが、いずれもAの相続開始以前に死亡していた場合、Cの子DがAの相続人となることはない。","a":1,"e":"兄弟姉妹の代襲はその子（甥・姪）までで、再代襲はない（民法889条2項）。","m":"兄弟姉妹は甥姪まで"},{"f":"権利","t":"相続","ref":"R07-05-エ","s":"Aが死亡し、その相続人が子B及びDであった場合において、Bが家庭裁判所に申述して相続の放棄をしたときは、Bの子CがBを代襲してAの相続人となる。","a":0,"e":"代襲原因は相続開始以前の死亡・欠格・廃除であり、相続放棄は代襲原因とならない（民法887条2項）。","m":"放棄は代襲しない"},{"f":"権利","t":"相続","ref":"R01-06-1","s":"Aが死亡し、その相続人が子B及びCである場合、Aは、生前に作成した遺言によって、B及びCによる遺産の分割を禁止することはできない。","a":0,"e":"被相続人は遺言で相続開始から5年を超えない期間を定めて遺産分割を禁止できる（民法908条）。","m":"遺言で分割禁止5年まで"},{"f":"権利","t":"相続","ref":"R05-07-1","s":"Aが死亡し、配偶者Bが遺産分割によってAの所有していた居住建物について配偶者居住権を取得した場合において、その存続期間を定めなかったときは、存続期間は20年となる。","a":0,"e":"存続期間の定めがなければ配偶者の終身の間となる（民法1030条）。","m":"配偶者居住権は原則終身"},{"f":"権利","t":"賃貸借","ref":"R02s-06-3","s":"Aが所有する甲建物をBが賃借して居住している場合において、Aが甲建物をDに売却したときは、AD間に特段の合意がない限り、賃貸人たる地位はDに移転する。","a":1,"e":"対抗要件を備えた賃貸不動産が譲渡されると、賃貸人たる地位は原則として譲受人に移転する（民法605条の2）。","m":"売買で貸主の地位も移転"},{"f":"法令","t":"都市計画法","ref":"R05-15-1","s":"市街化調整区域は、そのまま土地利用を整序することなく放置すれば、将来における一体の都市としての整備に支障が生じるおそれがある区域として、都市計画に定められるものである。","a":0,"e":"記述は準都市計画区域の考え方に近い。市街化調整区域は「市街化を抑制すべき区域」である。","m":"調整区域＝市街化を抑制"},{"f":"法令","t":"都市計画法","ref":"H30-16-3","s":"都市計画区域について区域区分を定めた場合、市街化区域については少なくとも用途地域を定めるものとし、市街化調整区域については原則として用途地域を定めないものとする。","a":1,"e":"市街化区域は用途地域必須、市街化調整区域は原則として定めない。","m":"市街化区域は用途地域必須"},{"f":"法令","t":"都市計画法","ref":"R05-15-2","s":"高度利用地区は、用途地域内の市街地における土地の合理的かつ健全な高度利用を図るため、都市計画に建築物の高さの最低限度を定める地区である。","a":0,"e":"高度利用地区で定めるのは容積率の最高・最低限度、建蔽率の最高限度、建築面積の最低限度等。高さを定めるのは高度地区。","m":"高さは高度地区"},{"f":"法令","t":"都市計画法","ref":"R04-15-3","s":"用途地域内に高度地区を定める場合には、高度地区に関する都市計画において、建築物の容積率の最高限度又は最低限度を定めるものとされている。","a":0,"e":"高度地区で定めるのは建築物の高さの最高限度又は最低限度。容積率は高度利用地区。","m":"高度地区＝高さだけ"},{"f":"法令","t":"都市計画法","ref":"R01-15-1","s":"高度地区は、用途地域内において市街地の環境を維持し、又は土地利用の増進を図るため、建築物の高さの最高限度又は最低限度を定める地区である。","a":1,"e":"高度地区は用途地域内で高さの最高限度又は最低限度を定める。","m":"高度地区は高さ上下"},{"f":"法令","t":"都市計画法","ref":"R05-15-3","s":"特定用途制限地域は、用途地域が定められている土地の区域内において、その良好な環境の形成又は保持のため、制限すべき特定の建築物等の用途の概要を定める地域である。","a":0,"e":"特定用途制限地域は用途地域が定められていない区域（市街化調整区域を除く）に定める。","m":"特定用途制限＝用途地域の外"},{"f":"法令","t":"都市計画法","ref":"R04-15-2","s":"準都市計画区域は都市計画区域外に指定される区域であるが、この準都市計画区域についても、都市計画に特別用途地区を定めることができる。","a":1,"e":"準都市計画区域では用途地域・特別用途地区・高度地区（最高限度）・景観地区・風致地区等を定められる。","m":"準都計でも特別用途地区OK"},{"f":"法令","t":"都市計画法","ref":"R02s-15-4","s":"準都市計画区域は都市計画区域外に指定される区域であるため、準都市計画区域については、都市計画に高度地区を定めることができない。","a":0,"e":"準都市計画区域でも高度地区（高さの最高限度）は定められる。定められないのは高度利用地区。","m":"準都計：高度地区○高度利用×"},{"f":"法令","t":"都市計画法","ref":"H28-16-2","s":"準都市計画区域は都市計画区域外に指定される区域であるが、この準都市計画区域については、市街地における火災の危険を防除するため、都市計画に準防火地域を定めることができる。","a":0,"e":"準都市計画区域には防火地域・準防火地域を定めることはできない。","m":"準都計に防火系なし"},{"f":"法令","t":"都市計画法","ref":"R06-15-2","s":"準都市計画区域については、その区域内に用途地域が定められている場合であっても、都市計画に市街地開発事業を定めることはできない。","a":1,"e":"準都市計画区域には都市施設は定められるが、市街地開発事業は定められない。","m":"準都計に市街地開発事業なし"},{"f":"法令","t":"都市計画法","ref":"R06-15-1","s":"都市計画区域外の区域であっても、特に必要があるときは、当該都市計画区域外の区域に道路や公園などの都市施設に関する都市計画を定めることができる。","a":1,"e":"都市施設は特に必要があるときは都市計画区域外にも定められる。","m":"都市施設は区域外もOK"},{"f":"法令","t":"都市計画法","ref":"R06-15-4","s":"地区計画は、用途地域が定められている土地の区域内においてのみ定めることができ、また、地区計画を定める際には、地区整備計画も必ず定めなければならない。","a":0,"e":"地区計画は一定の場合用途地域外にも定められ、地区整備計画は特別な事情があれば定めなくてもよい。","m":"地区計画は用途地域外もOK"},{"f":"法令","t":"都市計画法","ref":"R03-15-4","s":"地区計画の区域内において、建築物の建築等に関する事項を詳細に定める地区整備計画においては、建築物の建蔽率の最高限度を定めることができる。","a":1,"e":"地区整備計画では建蔽率の最高限度、容積率の最高・最低限度、高さ等を定められる。","m":"地区整備計画で建蔽率OK"},{"f":"法令","t":"都市計画法","ref":"R03-15-3","s":"地区計画の区域内において定められる地区整備計画においては、当該区域について区域区分を決定するかどうかを定めることができる。","a":0,"e":"区域区分の有無は都市計画区域マスタープランで定める事項で、地区整備計画の内容ではない。","m":"区域区分はマスタープラン"},{"f":"法令","t":"都市計画法","ref":"R06-15-3","s":"準住居地域は、道路の沿道としての地域の特性にふさわしい業務の利便の増進を図りつつ、これと調和した住居の環境を保護するため定める地域である。","a":1,"e":"準住居地域の定義そのもの。","m":"準住居＝沿道"},{"f":"法令","t":"開発許可","ref":"R04-16-1","s":"市街化区域内において、市街地再開発事業の施行として行う開発行為で、その規模が1haであるものについては、都道府県知事の許可を受けなければならない。","a":0,"e":"市街地再開発事業・土地区画整理事業・都市計画事業の施行として行う開発行為は規模を問わず許可不要。","m":"〇〇事業の施行は許可不要"},{"f":"法令","t":"開発許可","ref":"R03-16-4","s":"区域区分が定められていない都市計画区域内において、土地区画整理事業の施行として行う開発行為で、その規模が8,000㎡であるものについては、都道府県知事の許可を受けなければならない。","a":0,"e":"土地区画整理事業の施行として行う開発行為は区域・規模を問わず許可不要。","m":"区画整理事業は許可不要"},{"f":"法令","t":"開発許可","ref":"R06-16-3","s":"市街化調整区域内において、都市計画事業の施行として行う開発行為については、その規模にかかわらず、都道府県知事の許可を受けなければならない。","a":0,"e":"都市計画事業の施行として行う開発行為は許可不要。","m":"都市計画事業は許可不要"},{"f":"法令","t":"開発許可","ref":"R04-16-2","s":"区域区分が定められていない都市計画区域内において、博物館の建築の用に供する目的で行う8,000㎡の開発行為については、都道府県知事の許可を受ける必要はない。","a":1,"e":"博物館・図書館・公民館・駅舎・変電所など公益上必要な建築物のための開発行為は許可不要。","m":"図書館・公民館・博物館は不要"},{"f":"法令","t":"開発許可","ref":"R03-16-1","s":"市街化区域内において、都市公園法に規定する公園施設である建築物の建築の用に供する目的で行う5,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":0,"e":"公園施設は公益上必要な建築物にあたり、開発許可は不要。","m":"公園施設は公益で不要"},{"f":"法令","t":"開発許可","ref":"R06-16-1","s":"市街化区域内において、病院の建築の用に供する目的で行う1,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":1,"e":"病院・学校・社会福祉施設は公益上の例外に当たらない。市街化区域で1,000㎡以上なので許可必要。","m":"病院・学校は例外にならない"},{"f":"法令","t":"開発許可","ref":"R03-16-2","s":"首都圏整備法に規定する既成市街地内にある市街化区域において、住宅の建築の用に供する目的で行う800㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":1,"e":"三大都市圏の既成市街地等にある市街化区域では500㎡以上で許可が必要。","m":"三大都市圏は500㎡"},{"f":"法令","t":"開発許可","ref":"R03-16-3","s":"準都市計画区域内において、商業施設の建築の用に供する目的で行う2,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":0,"e":"準都市計画区域は3,000㎡未満なら許可不要。","m":"準都計は3,000㎡未満不要"},{"f":"法令","t":"開発許可","ref":"H29-17-3","s":"都市計画区域外の区域内において、変電所の建築の用に供する目的で行う1,000㎡の開発行為については、都道府県知事の許可を受けなければならない。","a":0,"e":"変電所は公益上必要な建築物で許可不要。なお区域外は1ha未満でも不要。","m":"区域外は1ha以上"},{"f":"法令","t":"開発許可","ref":"R06-16-2","s":"開発行為を伴わずに建築物を建築する場合であっても、その規模が1,000㎡以上であるときは、その建築について開発許可を受けなければならない。","a":0,"e":"開発許可は開発行為（区画形質の変更）について必要。開発行為を伴わない建築には不要。","m":"区画形質の変更がなければ不要"},{"f":"法令","t":"開発許可","ref":"R05-16-1","s":"開発許可を申請しようとする者は、あらかじめ、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。","a":1,"e":"既存の関係公共施設の管理者とは協議＋同意、新設公共施設の管理者となる者とは協議が必要。","m":"既存は同意、新設は協議"},{"f":"法令","t":"開発許可","ref":"R02-16-3","s":"開発許可を受けた開発行為により設置された公共施設は、工事完了の公告の日の翌日において、原則として、その公共施設の存する市町村の管理に属する。","a":1,"e":"他の法律や協議で別段の定めがない限り、市町村の管理に属する。","m":"公共施設は原則市町村管理"},{"f":"法令","t":"開発許可","ref":"R02-16-4","s":"開発許可を受けた者から当該開発区域内の土地の所有権その他工事を施行する権原を取得した者は、都道府県知事の承認を受けて、開発許可に基づく地位を承継することができる。","a":1,"e":"特定承継は知事の承認が必要。相続等の一般承継は当然に承継。","m":"特定承継は承認、相続は当然"},{"f":"法令","t":"開発許可","ref":"R06-16-4","s":"都道府県知事から開発許可を受けた者は、開発登録簿に、開発許可の年月日や予定建築物の用途などの必要事項を自ら登録しなければならない。","a":0,"e":"開発登録簿に登録するのは都道府県知事。","m":"登録簿は知事が作る"},{"f":"法令","t":"開発許可","ref":"R04-16-3","s":"主として自己の業務の用に供する施設の建築の用に供する目的で行う開発行為にあっては、開発区域内に土砂災害警戒区域内の土地を含んではならない。","a":0,"e":"自己業務用で含めないのは災害危険区域・土砂災害特別警戒区域等（レッドゾーン）。土砂災害警戒区域は対象外。","m":"レッドは特別警戒区域"},{"f":"法令","t":"開発許可","ref":"R04-16-4","s":"市街化調整区域内における開発行為は、市街化を促進するおそれがあるか否かにかかわらず、開発審査会の議を経れば、都道府県知事が許可をすることができる。","a":0,"e":"開発審査会の議を経て許可できるのは、市街化を促進するおそれがなく、市街化区域内で行うことが困難又は著しく不適当と認めるもの。","m":"審査会も促進おそれなしが前提"},{"f":"法令","t":"建築基準法","ref":"R06-17-1","s":"高さ25ｍの建築物を建築する場合には、周囲の状況によって安全上支障がない場合を除き、有効に避雷設備を設けなければならない。","a":1,"e":"高さ20ｍを超える建築物には原則として避雷設備が必要。","m":"避雷は20ｍ超"},{"f":"法令","t":"建築基準法","ref":"R06-17-2","s":"特定行政庁は、違反建築物について緊急の必要があるため仮に使用禁止の命令をする場合であっても、意見書の提出先等を記載した通知書を所有者等に交付しなければならない。","a":0,"e":"緊急の必要がある場合は、通知書交付等の手続によらず仮に使用禁止・使用制限を命じられる。","m":"緊急なら手続省略"},{"f":"法令","t":"建築基準法","ref":"R06-17-3","s":"防火地域内において、床面積300㎡の共同住宅について増築をする場合、その増築に係る部分の床面積の合計が10㎡以内であっても、建築確認を受ける必要がある。","a":1,"e":"10㎡以内の増改築・移転で確認不要となるのは防火・準防火地域外の場合のみ。","m":"防火地域は10㎡以内でも確認"},{"f":"法令","t":"建築基準法","ref":"H27-17-1","s":"防火地域及び準防火地域外において建築物を改築する場合で、その改築に係る部分の床面積の合計が10㎡以内であるときは、建築確認を受ける必要はない。","a":1,"e":"防火・準防火地域外での10㎡以内の増築・改築・移転は確認不要。","m":"地域外の10㎡以内は不要"},{"f":"法令","t":"建築基準法","ref":"R06-17-4","s":"建築物の所有者が、既存の劇場の用途を変更して床面積の合計が500㎡の映画館とする場合においては、両者は政令で定める類似の用途相互間の変更に当たるため、建築主事等の建築確認を受ける必要はない。","a":1,"e":"劇場・映画館・演芸場等の類似用途間の変更は確認不要。","m":"類似用途間は確認不要"},{"f":"法令","t":"建築基準法","ref":"H29-18-4","s":"既存のホテルの用途を変更して、その用途に供する部分の床面積の合計が300㎡の共同住宅とする場合においては、特殊建築物相互間の用途変更であるため、建築主事等の建築確認を受ける必要はない。","a":0,"e":"200㎡超の特殊建築物への用途変更は、類似用途でない限り確認が必要。ホテルと共同住宅は類似用途でない。","m":"200㎡超の特殊建築物へは確認"},{"f":"法令","t":"建築基準法","ref":"R04-17-2","s":"延べ面積が500㎡を超える建築物であっても、その建築物が都市計画区域及び準都市計画区域の外に所在する場合には、当該建築物について大規模の修繕を行うに当たり、建築確認を受ける必要はない。","a":0,"e":"階数2以上又は延べ面積200㎡超の新2号建築物（500㎡超の特殊建築物等も同様）は、都市計画区域の内外を問わず全国で大規模修繕に建築確認が必要。","m":"新2号は区域外も確認"},{"f":"法令","t":"建築基準法","ref":"R02-17-1","s":"鉄骨造、地上2階建て、延べ面積200㎡の共同住宅について大規模の修繕を行おうとする場合においては、その所在地のいかんにかかわらず、工事に着手する前に建築確認を受けなければならない。","a":1,"e":"2階以上の建築物は新2号建築物として、大規模修繕・模様替にも確認が必要。","m":"2階以上は修繕も確認"},{"f":"法令","t":"建築基準法","ref":"R04-17-1","s":"建築基準法の改正により、現に存する建築物が改正後の規定に適合しなくなった場合には、当該建築物は違反建築物となり、所有者は速やかに改正後の規定に適合するよう改修しなければならない。","a":0,"e":"既存不適格建築物には改正後の規定は適用されず、違反建築物とはならない（増改築時等に適合が必要）。","m":"既存不適格は違反でない"},{"f":"法令","t":"建築基準法","ref":"R04-17-4","s":"地方公共団体が条例で災害危険区域を指定した場合において、当該区域内においては、建築基準法の規定により、住居の用に供する建築物の建築は条例の内容にかかわらず一律に禁止される。","a":0,"e":"住居用建築物の禁止その他の制限は条例で定めるもので、一律禁止ではない。","m":"災害危険区域は条例で制限"},{"f":"法令","t":"建築基準法","ref":"R05-17-3","s":"建築物が防火地域及び準防火地域にわたる場合においては、原則として、その建築物の全部について、規制の緩やかな準防火地域内の建築物に関する規定が適用される。","a":0,"e":"原則として全部に厳しい方の防火地域の規定が適用される。","m":"またがりは厳しい方"},{"f":"法令","t":"建築基準法","ref":"R03-17-3","s":"防火地域又は準防火地域内にある建築物で、外壁が防火構造であるものについては、その外壁を隣地境界線に接して設けることができる旨が建築基準法に定められている。","a":0,"e":"隣地境界線に接して設けられるのは外壁が耐火構造の建築物。","m":"隣地に接するのは耐火構造"},{"f":"法令","t":"建築基準法","ref":"R05-17-4","s":"建築物を建築する場合において、石綿をあらかじめ添加した建築材料については、石綿を飛散又は発散させるおそれがないものとして国土交通大臣が定めたもの又は大臣の認定を受けたものを除き、使用してはならない。","a":1,"e":"石綿等の飛散・発散による衛生上の支障防止のための規定。","m":"石綿添加材は原則禁止"},{"f":"法令","t":"建築基準法","ref":"R06-18-1","s":"映画館で客席部分の床面積の合計が300㎡のものは、第二種住居地域内においては建築することができないが、準住居地域内においては特定行政庁の許可を受けなくても建築することができる。","a":0,"e":"準住居地域で建築できる映画館は客席200㎡未満のみ。300㎡は準住居地域でも建築不可。","m":"準住居の映画館は200㎡未満"},{"f":"法令","t":"建築基準法","ref":"R04-18-1","s":"第一種低層住居専用地域内においては、良好な住居の環境を保護するため、神社、寺院及び教会は、特定行政庁の許可を受けた場合を除き、建築することができない。","a":0,"e":"神社・寺院・教会はすべての用途地域で建築できる。","m":"宗教施設は全地域OK"},{"f":"法令","t":"建築基準法","ref":"R01-18-2","s":"工業地域内においては、幼保連携型認定こども園は、保育所と同様に、特定行政庁の許可を受けなくても建築することができ、用途地域による建築制限を受けることはない。","a":1,"e":"幼保連携型認定こども園は保育所と同様に全用途地域で建築可能。","m":"保育所系は全地域OK"},{"f":"法令","t":"建築基準法","ref":"R06-18-4","s":"都市計画において定められた建蔽率の限度が10分の8とされている地域内で、かつ、防火地域内にある耐火建築物については、特定行政庁の許可を受けた場合に限り、建蔽率の制限が適用されない。","a":0,"e":"この場合は許可なしで当然に建蔽率制限が適用されない。","m":"80％＋防火＋耐火で無制限"},{"f":"法令","t":"建築基準法","ref":"R05-18-1","s":"都市計画において定められた建蔽率の限度が10分の6の準防火地域内にある準耐火建築物で、街区の角にある敷地として特定行政庁が指定するものの内にある建築物については、建蔽率の限度に10分の2を加えた数値が限度となる。","a":1,"e":"準防火地域内の耐火・準耐火建築物等で＋1/10、角地で＋1/10、合計＋2/10。","m":"防火＋角地で2/10加算"},{"f":"法令","t":"建築基準法","ref":"R05-18-4","s":"日影による中高層の建築物の高さの制限の対象区域外にある建築物については、冬至日において対象区域内の土地に日影を生じさせるものであっても、当該制限の適用を受けることはない。","a":0,"e":"対象区域外でも高さ10ｍ超で冬至日に対象区域内に日影を生じさせるものは規制を受ける。","m":"区域外でも10ｍ超は対象"},{"f":"法令","t":"建築基準法","ref":"R02s-18-4","s":"田園住居地域内の建築物については、第一種低層住居専用地域内の建築物と異なり、北側の前面道路又は隣地との関係についての建築物の各部分の高さの制限（北側斜線制限）は適用されない。","a":0,"e":"北側斜線制限は低層住居専用地域・田園住居地域・中高層住居専用地域に適用される。","m":"北側斜線は低層・田園・中高層"},{"f":"法令","t":"建築基準法","ref":"H30-19-1","s":"田園住居地域内においては、建築物の高さは、一定の場合を除き、10ｍ又は12ｍのうち当該地域に関する都市計画において定められた建築物の高さの限度を超えてはならない。","a":1,"e":"第一種・第二種低層住居専用地域と田園住居地域には絶対高さ制限（10ｍ又は12ｍ）がある。","m":"低層・田園は10ｍか12ｍ"},{"f":"法令","t":"盛土規制法","ref":"R06-19-1","s":"都道府県知事は、宅地造成、特定盛土等又は土石の堆積に伴う災害の防止のための基礎調査を行うため必要があるときは、他人の占有する土地に立ち入ることができ、当該土地の占有者は、正当な理由がない限り、これを拒み、又は妨げてはならない。","a":1,"e":"基礎調査のための立入りは認められ、占有者は正当な理由なく拒み、妨げてはならない。","m":"基礎調査の立入りは拒めない"},{"f":"法令","t":"盛土規制法","ref":"R02s-19-3","s":"都道府県知事又はその命じた者が、基礎調査のために他人の占有する土地に立ち入ったことにより他人に損失を与えた場合においては、都道府県は、その損失を受けた者に対して、通常生ずべき損失を補償しなければならない。","a":1,"e":"立入りによる損失は、都道府県が通常生ずべき損失を補償しなければならない。","m":"立入りの損失は都道府県が補償"},{"f":"法令","t":"盛土規制法","ref":"R06-19-3","s":"宅地造成等工事規制区域内において、許可を要する宅地造成等に関する工事を行おうとする工事主は、当該工事に着手した日から2週間以内に、工事の施行に係る土地の周辺地域の住民に対し、工事の内容を周知させるための措置を講じれば足りる。","a":0,"e":"周知措置は許可申請の前に、あらかじめ講じなければならない。着手後では遅い。","m":"住民周知は申請前にあらかじめ"},{"f":"法令","t":"盛土規制法","ref":"R06-19-4","s":"特定盛土等規制区域内において、一定規模の特定盛土等に関する工事を行おうとする工事主は、許可を要する場合を除き、当該工事に着手する日の30日前までに、工事の計画を都道府県知事に届け出なければならない。","a":1,"e":"特定盛土等規制区域では一定規模の工事は届出制で、工事着手日の30日前までに知事へ届け出る。","m":"特定盛土区域は30日前届出"},{"f":"法令","t":"盛土規制法","ref":"R07-19-2","s":"宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害が生じないよう、その土地を常時安全な状態に維持するよう努めなければならないのは、土地の所有者等ではなく、工事主及び工事施行者である。","a":0,"e":"努力義務を負うのは土地の所有者・管理者・占有者である。工事主等に限られない。","m":"安全維持の努力は所有者等"},{"f":"法令","t":"盛土規制法","ref":"R07-19-4","s":"宅地造成等工事規制区域内において宅地造成等に関する工事の許可を受けた工事主は、当該許可に係る工事の現場の見やすい場所に、主務省令で定めるところにより、所定の事項を記載した標識を掲げなければならない。","a":1,"e":"許可を受けた工事主には、工事現場への標識掲示義務がある。","m":"許可工事は現場に標識"},{"f":"法令","t":"盛土規制法","ref":"R05-19-1","s":"都道府県知事は、宅地造成又は特定盛土等に伴う災害で相当数の居住者等に危害を生ずるものの発生のおそれが大きい一団の造成宅地の区域であれば、宅地造成等工事規制区域内の土地であっても、造成宅地防災区域として指定することができる。","a":0,"e":"造成宅地防災区域は、宅地造成等工事規制区域内の土地には指定できない。","m":"防災区域は規制区域の外だけ"},{"f":"法令","t":"盛土規制法","ref":"R04-19-1","s":"宅地造成等工事規制区域内の土地において、高さが2ｍを超える擁壁や排水施設の全部又は一部の除却の工事を行おうとする者は、一定の場合を除き、工事に着手する日の14日前までに、その旨を都道府県知事に届け出なければならない。","a":1,"e":"許可不要な除却工事でも、擁壁（2m超）・排水施設等の除却は着手日の14日前までに知事へ届出が必要。","m":"擁壁・排水の除却は14日前"},{"f":"法令","t":"盛土規制法","ref":"R03-19-3","s":"都道府県知事は、その地方の気候、風土又は地勢の特殊性により、政令で定める技術的基準のみによっては災害の防止の目的を達し難いと認める場合においては、規則で、宅地造成等に関する工事の技術的基準を強化し、又は必要な技術的基準を付加することができる。","a":1,"e":"都道府県知事は、一定の場合、規則で政令の技術的基準を強化・付加できる。","m":"知事は規則で基準を上乗せ可"},{"f":"法令","t":"盛土規制法","ref":"R02s-19-1","s":"宅地造成等工事規制区域は、国土交通大臣が、宅地造成、特定盛土等又は土石の堆積に伴う災害の防止に関する基本方針に基づき、関係都道府県知事の意見を聴いたうえで指定する。","a":0,"e":"宅地造成等工事規制区域を指定するのは都道府県知事（指定都市等の長）である。","m":"規制区域の指定は知事"},{"f":"法令","t":"盛土規制法","ref":"R03s-19-1","s":"宅地造成等工事規制区域及び特定盛土等規制区域のいずれにも指定されていない区域内において盛土を行う場合であっても、その盛土が一定規模以上のものであるときは、工事主は、都道府県知事に届け出なければならない。","a":0,"e":"規制区域・特定盛土等規制区域の外で行う工事には、盛土規制法上の許可も届出も不要。","m":"区域外は許可も届出も不要"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-1","s":"土地区画整理事業の施行者が仮換地を指定した場合において、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。","a":1,"e":"仮換地指定の効力発生日から換地処分公告日まで、従前と同内容で仮換地を使用収益できる。","m":"仮換地で従前どおり使える"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-4","s":"土地区画整理事業の施行者は、仮換地を指定する場合において、その仮換地に使用又は収益の障害となる物件が存するときその他特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を、仮換地の指定の効力発生の日と別に定めることができる。","a":1,"e":"施行者は特別の事情があれば、使用収益開始日を別に定めることができる。","m":"特別事情なら開始日を別に"},{"f":"法令","t":"土地区画整理法","ref":"H30-21-4","s":"土地区画整理事業の施行者が仮換地を指定する場合において、その仮換地について使用又は収益を開始することができる日は、特別の事情の有無にかかわらず、仮換地の指定の効力発生の日と同じ日としなければならない。","a":0,"e":"特別の事情があるときは、施行者は使用収益開始日を別に定めることができる。","m":"開始日は必ず同日、ではない"},{"f":"法令","t":"土地区画整理法","ref":"R07-20-3","s":"土地区画整理事業の施行者が仮換地の使用又は収益を開始することができる日を別に定めたことにより、従前の宅地及び仮換地のいずれも使用収益できずに損失を受けた者がある場合においては、施行者はその者に対して通常生ずべき損失を補償しなければならない。","a":1,"e":"開始日を別に定めたため使用収益できず損失を受けた者には、施行者が損失補償をする。","m":"開始日ずれの損失は施行者補償"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-2","s":"土地区画整理事業における換地処分は、施行者が、換地計画において定められた関係事項を官報又は公報により公告することによって行うものとされ、関係権利者への通知は要しない。","a":0,"e":"換地処分は関係権利者に換地計画で定めた事項を通知して行う。公告は換地処分があった旨の公告である。","m":"換地処分は通知で行う"},{"f":"法令","t":"土地区画整理法","ref":"R06-20-3","s":"土地区画整理事業の換地計画において保留地として定められた土地は、換地処分の公告があった日の翌日において、施行者が取得し、施行者はこれを処分して事業費に充てることができる。","a":1,"e":"保留地は換地処分公告の翌日に施行者が取得する。","m":"保留地は公告翌日に施行者へ"},{"f":"法令","t":"土地区画整理法","ref":"R05-20-1","s":"土地区画整理事業の換地計画において定められた清算金は、換地処分の公告があった日の翌日において確定し、施行者はこれを徴収し、又は交付することとなる。","a":1,"e":"清算金は換地処分公告の翌日において確定する。","m":"清算金は公告翌日に確定"},{"f":"法令","t":"土地区画整理法","ref":"R04-20-4","s":"土地区画整理事業において換地処分の公告があった後に、換地の所有権が第三者に移転した場合であっても、確定した清算金の徴収又は交付に関する権利義務は、当然には新たな所有者に移転しない。","a":1,"e":"清算金は換地処分時点の所有者との間で確定し、その後の譲受人には当然には承継されない。","m":"清算金は処分時の所有者"},{"f":"法令","t":"土地区画整理法","ref":"R05-20-4","s":"土地区画整理組合が施行する土地区画整理事業において、組合が施行地区内の宅地について仮換地を指定しようとする場合には、あらかじめ、土地区画整理審議会の同意を得なければならない。","a":0,"e":"組合施行では総会（総代会）の同意を得る。審議会は公的施行の場合に置かれる。","m":"組合は総会、審議会は公的施行"},{"f":"法令","t":"土地区画整理法","ref":"R03-20-3","s":"土地区画整理組合が施行する土地区画整理事業の施行地区内において、事業の施行の障害となるおそれがある建築物の新築を行おうとする者は、当該組合の許可を受ければ足り、他の許可を受ける必要はない。","a":0,"e":"建築行為等の許可権者は施行者ではなく、知事等（市の区域内は市長）である。","m":"建築制限の許可は知事等"},{"f":"法令","t":"土地区画整理法","ref":"R02-20-3","s":"土地区画整理組合は、事業に要する経費に充てるため組合員に賦課金を課する場合において、定款で定めれば、賦課金の額を宅地の位置や地積等にかかわらず組合員全員について一律の額とすることができる。","a":0,"e":"賦課金は宅地の位置・地積等を考慮して公平に定めなければならない。","m":"賦課金は公平に、一律不可"},{"f":"法令","t":"農地法","ref":"R05-21-1","s":"農地の所有者が死亡し、相続人以外の者に対する特定遺贈によりその農地の所有権を取得する場合には、受遺者は農地法第3条第1項の許可を受ける必要がある。","a":1,"e":"相続や相続人への特定遺贈は許可不要だが、相続人以外への特定遺贈は3条許可が必要。","m":"相続人以外への遺贈は許可要"},{"f":"法令","t":"農地法","ref":"R03-21-1","s":"遺産分割により農地の所有権を取得した者は、農地法第3条第1項の許可を受ける必要はないが、遅滞なく、その農地の存する市町村の農業委員会にその旨を届け出なければならない。","a":1,"e":"遺産分割による取得は許可不要。ただし遅滞なく農業委員会へ届け出る必要がある。","m":"遺産分割は許可不要・届出要"},{"f":"法令","t":"農地法","ref":"R05-21-2","s":"農業者が、自己の所有する農地4アールを、自らの耕作の事業のための農業用施設の敷地に転用しようとする場合には、農地法第4条第1項の許可を受ける必要はない。","a":0,"e":"許可不要となる農業用施設への転用は2アール未満に限られる。4アールなら4条許可が必要。","m":"農業用施設は2a未満のみ不要"},{"f":"法令","t":"農地法","ref":"R05-21-3","s":"農地の所有者と買主が耕作目的で農地の売買契約を締結したが、農地法第3条第1項の許可を受けていない場合には、当該売買契約による所有権移転の効力は生じない。","a":1,"e":"許可を受けない権利移動は効力を生じない。","m":"無許可売買は効力なし"},{"f":"法令","t":"農地法","ref":"R04-21-2","s":"農地所有適格法人の要件を満たしていない株式会社は、いかなる場合であっても、耕作の目的で農地を借り入れることについて農地法第3条第1項の許可を受けることができない。","a":0,"e":"適格法人でない法人も、一定の要件を満たせば3条許可を受けて農地を借り入れられる。","m":"適格法人以外も借りるのは可"},{"f":"法令","t":"農地法","ref":"R04-21-1","s":"耕作目的で農地の使用貸借による権利の設定を受けた者は、その登記がなくても、農地の引渡しを受けていれば、その後にその農地について物権を取得した第三者に対抗することができる。","a":0,"e":"引渡しで対抗できるのは農地の賃貸借である。使用貸借には適用されない。","m":"引渡し対抗は賃貸借だけ"},{"f":"法令","t":"農地法","ref":"R04-21-3","s":"農地法の規定に違反して農地を転用した者がいる場合において、都道府県知事等が行う原状回復等の措置命令の対象には、当該転用に係る工事を請け負った者は含まれない。","a":0,"e":"原状回復等の命令は、違反転用者だけでなく工事の請負人・下請人にも出せる。","m":"請負人も原状回復命令の対象"},{"f":"法令","t":"農地法","ref":"R06-21-4","s":"農地の賃貸借の当事者は、農事調停による場合等一定の場合を除き、都道府県知事の許可を受けなければ、賃貸借の解除をし、解約の申入れをし、又は更新をしない旨の通知をしてはならない。","a":1,"e":"賃貸借の解除・解約申入れ等は原則知事の許可が必要（農事調停による場合等は除く）。","m":"賃貸借解約は知事許可"},{"f":"法令","t":"農地法","ref":"R03s-21-3","s":"登記簿上の地目が宅地とされている土地であれば、現況が耕作の目的に供されている農地であっても、その土地の売買や転用について農地法の規制を受けることはない。","a":0,"e":"農地か否かは登記簿の地目ではなく現況で判断する。","m":"農地かは現況で判断"},{"f":"法令","t":"農地法","ref":"R02-21-2","s":"市街化区域内にある農地を住宅の敷地に転用する場合には、転用した後に遅滞なく農業委員会に届け出れば、農地法第4条第1項の許可を受ける必要はない。","a":0,"e":"市街化区域内の特例は、あらかじめ（転用前に）農業委員会へ届け出ることが要件。","m":"市街化区域は事前届出"},{"f":"法令","t":"農地法","ref":"R07-21-4","s":"法人の代表者が、その法人の業務に関し、農地法第4条第1項の許可を受けずに農地を転用した場合には、行為者のほか、その法人にも罰金刑が科されるが、その上限は300万円である。","a":0,"e":"4条・5条違反等の法人重科は1億円以下の罰金である。","m":"法人罰金は1億円以下"},{"f":"法令","t":"農地法","ref":"R03-21-4","s":"都道府県が病院の用に供するため農地を取得しようとする場合においては、都道府県と都道府県知事等との協議が成立することをもって、農地法第5条第1項の許可があったものとみなされる。","a":1,"e":"国・都道府県等が一定の目的で転用目的取得をする場合、協議成立で許可があったものとみなされる。","m":"国・県は協議成立で許可みなし"},{"f":"法令","t":"国土利用計画法","ref":"R06-22-1","s":"市街化調整区域内に所在する4,000㎡の土地について、土地の所有者が対価を得て第三者のために地上権を設定する契約を締結した場合には、当該地上権者は事後届出を行わなければならない。","a":0,"e":"市街化調整区域の届出対象面積は5,000㎡以上。4,000㎡なら不要。","m":"調整区域は5,000㎡以上"},{"f":"法令","t":"国土利用計画法","ref":"R03s-22-1","s":"都市計画区域外に所在する12,000㎡の土地について、土地の所有者が対価を得て第三者のために地上権を設定する契約を締結した場合には、当該地上権者は事後届出を行わなければならない。","a":1,"e":"対価を伴う地上権設定は土地売買等の契約に当たり、区域外は10,000㎡以上で届出対象。","m":"区域外は1万㎡以上"},{"f":"法令","t":"国土利用計画法","ref":"R06-22-2","s":"一定面積以上の土地について土地の交換契約を締結した場合において、当事者間で交換差金の授受がないときは、届出対象面積の要件を満たしていても、事後届出を行う必要はない。","a":0,"e":"交換も対価のある契約として土地売買等の契約に当たり、面積要件を満たせば届出が必要。","m":"交換は金銭なしでも対象"},{"f":"法令","t":"国土利用計画法","ref":"R06-22-3","s":"土地売買等の契約を締結した者が、必要な事後届出を行わなかった場合において、都道府県知事はその者に対して勧告をすることができるにとどまり、無届出について罰則の適用はない。","a":0,"e":"無届出は罰則（6月以下の拘禁刑又は100万円以下の罰金）の対象となる。","m":"無届出は罰則あり"},{"f":"法令","t":"国土利用計画法","ref":"R05-22-1","s":"国から一定面積以上の土地を購入する売買契約を締結した場合には、当事者の一方が国であるため、その面積にかかわらず、権利取得者は事後届出を行う必要はない。","a":1,"e":"当事者の一方又は双方が国等である場合は、事後届出は不要。","m":"国等が当事者なら届出不要"},{"f":"法令","t":"国土利用計画法","ref":"R05-22-3","s":"一定面積以上の土地について土地売買等の契約を締結した場合には、売主と買主は、共同して、契約締結日から起算して2週間以内に、都道府県知事に事後届出を行わなければならない。","a":0,"e":"事後届出をするのは権利取得者（買主等）のみで、売主に義務はない。","m":"届出は権利取得者だけ"},{"f":"法令","t":"国土利用計画法","ref":"R04-22-2","s":"国土利用計画法に基づく事後届出においては、土地の利用目的は届出事項とされているが、土地売買等の契約に係る土地に関する権利の移転又は設定の対価の額は届出事項とされていない。","a":0,"e":"対価の額も届出事項である。ただし勧告は利用目的についてのみ行う。","m":"対価の額も届出事項"},{"f":"法令","t":"国土利用計画法","ref":"R04-22-3","s":"市街化調整区域内において、Aが一団の土地である甲土地3,500㎡と乙土地2,500㎡を、それぞれ別の所有者から別々の売買契約により購入した場合には、Aは事後届出を行わなければならない。","a":1,"e":"一団の土地は合計6,000㎡で判定し、調整区域の5,000㎡以上に当たるため届出が必要。","m":"一団の土地は合計で判定"},{"f":"法令","t":"国土利用計画法","ref":"R04-22-4","s":"事後届出を受けた都道府県知事が土地の利用目的について勧告をしたにもかかわらず、届出をした者がその勧告に従わなかった場合には、当該土地売買等の契約は無効となる。","a":0,"e":"勧告に従わないときは公表されることがあるが、契約の効力には影響しない。","m":"勧告違反でも契約は有効"},{"f":"法令","t":"国土利用計画法","ref":"R03-22-1","s":"土地売買等の契約を締結した権利取得者は、事後届出が必要な場合には、契約を締結した日の翌日から起算して3週間以内に、所定の事項を都道府県知事に届け出ればよい。","a":0,"e":"事後届出の期限は契約締結日から起算して2週間以内である。","m":"事後届出は2週間以内"},{"f":"法令","t":"国土利用計画法","ref":"R02-22-1","s":"市街化調整区域内に所在する6,000㎡の土地について、売買の予約を締結した場合には、本契約を締結していなくても、予約上の権利者は事後届出を行わなければならない。","a":1,"e":"予約も土地売買等の契約に含まれ、5,000㎡以上なので届出が必要。","m":"予約も届出対象"},{"f":"法令","t":"国土利用計画法","ref":"R07-22-4","s":"市街化区域内の一団の土地のうち、Aが1,200㎡を購入するとともに、これに隣接する1,300㎡を所有者から無償で借り受けた場合には、Aは事後届出を行う必要はない。","a":1,"e":"無償の賃借は対価がなく対象外。購入分1,200㎡は2,000㎡未満なので届出不要。","m":"無償の貸借は面積に含めない"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R05-24-3","s":"不動産取得税は、不動産の取得に対し、当該不動産の所在する市町村において、当該不動産の取得者に課する税であり、市町村の条例で税率等が定められる。","a":0,"e":"不動産取得税は都道府県税。不動産所在の都道府県が取得者に課する。","m":"取得税は都道府県"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R05-24-4","s":"不動産取得税は、市町村や特別区が不動産を取得した場合には、その取得の目的や不動産の用途にかかわらず、これらの者に対して課することができない。","a":1,"e":"国・都道府県・市町村・特別区等には不動産取得税を課することができない（人的非課税）。","m":"国・自治体は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H30-24-1","s":"不動産取得税の納税義務者は、不動産を取得した日の翌日から起算して3か月以内に、当該不動産の所在する都道府県に対して税額を申告し、これを納付しなければならない。","a":0,"e":"不動産取得税は普通徴収（納税通知書による納付）で、申告納付ではない。","m":"取得税は普通徴収"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"H30-24-3","s":"相続により土地や家屋を取得した場合には、その取得は形式的な所有権の移転等に当たるため、取得した不動産の価格にかかわらず、不動産取得税は課されない。","a":1,"e":"相続・法人の合併など形式的な移転は非課税。","m":"相続・合併は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02-24-4","s":"共有物の分割により不動産を取得した場合には、当該不動産の取得者の分割前の当該共有物に係る持分の割合を超えない部分の取得については、不動産取得税は課されない。","a":1,"e":"持分を超えない部分は形式的取得として非課税。超過部分は課税。","m":"持分内の分割は非課税"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R04-24-1","s":"固定資産税の徴収については、市町村は、納税通知書を納税者に交付する方法ではなく、給与所得に係る住民税と同様に、特別徴収の方法によらなければならないとされている。","a":0,"e":"固定資産税は普通徴収（納税通知書による）。","m":"固定資産税も普通徴収"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R04-24-3","s":"固定資産税の賦課期日は、地方税法に定めがなく、当該固定資産の所在する市町村の条例で定める日とされており、市町村ごとに異なる日を定めることができる。","a":0,"e":"賦課期日は地方税法で当該年度の初日の属する年の1月1日と定められている。","m":"賦課期日は1月1日"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R04-24-4","s":"固定資産税の課税対象となる土地や家屋が第三者に賃貸されている場合には、当該固定資産税は、所有者ではなく、その固定資産を現に使用している賃借人に対して課される。","a":0,"e":"賃借人は納税義務者とならない。原則は所有者に課税。","m":"賃借人には課税なし"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R01-24-4","s":"質権又は100年より永い存続期間の定めのある地上権の目的である土地については、その所有者ではなく、その質権者又は地上権者が固定資産税の納税義務者となる。","a":1,"e":"質権者・100年超の地上権者は所有者に代わり固定資産税の納税義務者となる。","m":"質権・百年地上権は例外"},{"f":"税他","t":"不動産取得税・固定資産税","ref":"R02s-24-3","s":"固定資産税の納期は、4月、7月、12月及び2月中において、当該市町村の条例で定めるが、特別の事情がある場合においては、これと異なる納期を定めることができる。","a":1,"e":"原則4月・7月・12月・2月中で条例で定め、特別の事情があれば異なる納期も可。","m":"納期は変更可"},{"f":"税他","t":"印紙税・登録免許税","ref":"R05-23-1","s":"土地の売買契約において、売主、買主及び媒介をした宅地建物取引業者がそれぞれ1通ずつ保存するために同一内容の契約書を3通作成した場合には、その3通すべてが印紙税の課税文書となる。","a":1,"e":"仲介人保存分も含め、同一内容を2通以上作成すればすべて課税文書。","m":"仲介人保存分も課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R04-23-1","s":"土地の譲渡に関する基本的事項を合意し、後日正式な本契約書を作成することとして作成した覚書は、契約の成立を証するものであっても、印紙税は課されない。","a":0,"e":"仮契約書・覚書でも契約の成立を証すれば課税文書となる。","m":"覚書・仮契約も課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R04-23-3","s":"既に締結されている土地の賃貸借契約について、その契約期間を変更することを証するために作成した覚書は、重要な事項を変更するものとして、印紙税の課税文書となる。","a":1,"e":"契約期間など重要事項を変更する文書は課税文書となる。","m":"重要事項変更は課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R05-23-3","s":"時価2,000万円の土地を無償で譲渡することを内容とする贈与契約書を作成した場合には、当該契約書の記載金額は2,000万円として印紙税が課される。","a":0,"e":"贈与は対価がないため「記載金額のない」譲渡契約書として扱う（200円）。","m":"贈与は記載金額なし"},{"f":"税他","t":"印紙税・登録免許税","ref":"R05-23-4","s":"当初5,000万円と記載された土地の売買契約書について、売買金額を1,000万円減額する旨を記載した変更契約書を作成した場合には、当該変更契約書の記載金額は1,000万円となる。","a":0,"e":"減額の変更契約書は記載金額のない文書として扱う。増額なら増加額が記載金額。","m":"減額変更は金額なし"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02-23-3","s":"国と株式会社が共同で土地の売買契約書を2通作成し、それぞれが1通ずつ保存する場合には、当該株式会社が保存する契約書については、印紙税は課されない。","a":1,"e":"会社が保存する文書は国が作成したものとみなされ非課税となる。","m":"国作成とみなす分は非課税"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02-23-4","s":"建物の所有を目的とする土地の賃貸借契約書に、返還されない権利金の額と月額賃料の額がともに記載されている場合には、印紙税の課税標準となる記載金額は権利金の額のみとなる。","a":1,"e":"土地賃借権設定契約書の記載金額は権利金等の返還されない金額。賃料は含まない。","m":"賃料は記載金額外"},{"f":"税他","t":"印紙税・登録免許税","ref":"R02s-23-3","s":"個人が土地を購入し、売買による所有権の移転登記を受ける場合において、当該登記に係る登録免許税の課税標準は、当該土地の売買契約書に記載された実際の取引価格とされている。","a":0,"e":"不動産の課税標準は登記時の価額で、固定資産課税台帳の価格がある場合はそれを基礎とする。","m":"課税標準は台帳価格"},{"f":"税他","t":"印紙税・登録免許税","ref":"R03s-23-3","s":"個人が一定の要件を満たす住宅用家屋を取得し、所有権の移転登記について登録免許税の税率の軽減措置の適用を受ける場合には、その敷地である土地の所有権の移転登記についても同様に当該軽減措置が適用される。","a":0,"e":"この軽減措置は住宅用家屋の登記が対象で、敷地の土地には適用されない。","m":"家屋のみ対象"},{"f":"税他","t":"印紙税・登録免許税","ref":"H30-23-2","s":"住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置は、個人が当該住宅用家屋を交換により取得した場合には、他の要件を満たしていても適用されない。","a":1,"e":"適用は売買又は競落による取得に限られる。交換・贈与・相続は対象外。","m":"売買・競落のみ"},{"f":"税他","t":"所得税・譲渡","ref":"R03-23-2","s":"個人が土地建物を譲渡した場合における譲渡所得の金額の計算上、取得費には、その資産の取得に要した金額は含まれるが、その資産の設備費や改良費は含まれない。","a":0,"e":"取得費には取得に要した金額のほか設備費・改良費も含まれる。","m":"改良費も取得費"},{"f":"税他","t":"所得税・譲渡","ref":"R03-23-1","s":"総合課税の対象となる譲渡所得の金額の計算上、短期譲渡所得と長期譲渡所得がある場合には、譲渡所得の特別控除額は、まず短期譲渡所得の金額から控除し、残額を長期譲渡所得の金額から控除する。","a":1,"e":"総合課税の譲渡所得の特別控除50万円は短期分から先に控除する。","m":"控除は短期から"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-2","s":"建物の所有を目的とする借地権の設定に際して受け取った権利金の額が、その土地の価額の10分の5を超える場合には、その権利金は譲渡所得ではなく不動産所得として課税される。","a":0,"e":"一定の場合、借地権設定の対価は譲渡所得として課税される。","m":"権利金5/10超は譲渡"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-3","s":"不動産業者である個人が、営利を目的として継続的に行う土地の譲渡により生ずる所得は、事業所得や雑所得ではなく、譲渡所得として所得税が課税される。","a":0,"e":"営利目的で継続的に行う譲渡は事業所得（又は雑所得）となる。","m":"業としての売買は事業"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-4","s":"個人が相続により取得した土地を譲渡した場合において、その土地の取得費は、被相続人の取得費を引き継ぐのではなく、相続の時におけるその土地の価額によるものとされている。","a":0,"e":"相続で取得した資産は被相続人の取得費・取得時期を引き継ぐ。","m":"相続は取得費引継ぎ"},{"f":"税他","t":"所得税・譲渡","ref":"H29-23-1","s":"個人が所有する別荘など、生活に通常必要でない資産について災害により損失を受けた場合には、その損失の金額は、その年分又はその翌年分の譲渡所得の金額の計算上控除するものとされている。","a":1,"e":"生活に通常必要でない資産の災害損失は、その年・翌年の譲渡所得の金額から控除する。","m":"別荘損失は譲渡から"},{"f":"税他","t":"所得税・譲渡","ref":"R01-23-3","s":"個人が居住用財産を譲渡した場合において、その譲渡の相手方が自己の孫であるときは、その孫と同居していないときであっても、居住用財産の譲渡所得の3,000万円特別控除の適用を受けることはできない。","a":1,"e":"配偶者・直系血族への譲渡は同居の有無にかかわらず3,000万円控除の対象外。","m":"直系血族へは不可"},{"f":"税他","t":"所得税・譲渡","ref":"R01-23-1","s":"個人が収用等により居住用財産を譲渡した場合において、収用等の場合の5,000万円特別控除の適用を受けるときは、その控除後の譲渡益について、居住用財産を譲渡した場合の軽減税率の特例を重ねて適用することができる。","a":1,"e":"5,000万円控除後の残額に軽減税率の特例を適用できる。","m":"収用控除と軽減税率は併用"},{"f":"税他","t":"所得税・譲渡","ref":"R06-23-1","s":"個人が居住用財産を譲渡し、その譲渡について居住用財産を譲渡した場合の軽減税率の特例の適用を受けた場合において、同じ年に新たに取得した住宅を居住の用に供したときは、その住宅について住宅ローン控除の適用を受けることはできない。","a":1,"e":"居住年等に軽減税率特例など一定の譲渡特例を受けると住宅ローン控除は不可。","m":"軽減税率とローン控除は×"},{"f":"税他","t":"所得税・譲渡","ref":"R06-23-2","s":"個人が居住用財産を譲渡し、居住用財産の買換え等の場合の譲渡損失の損益通算の特例の適用を受けた場合には、新たに取得した住宅について住宅ローン控除の適用を受けることはできない。","a":0,"e":"譲渡損失の損益通算・繰越控除の特例とは併用できる。","m":"損失特例とは併用可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R04-25-1","s":"土地鑑定委員会は、標準地の単位面積当たりの正常な価格を判定したときは、標準地の所在地、単位面積当たりの価格及び価格判定の基準日のほか、標準地の地積及び形状についても官報で公示しなければならない。","a":1,"e":"所在地・単位面積当たり価格・価格判定基準日・地積・形状等を官報で公示する。","m":"地積・形状も公示"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R04-25-2","s":"地価公示法における正常な価格とは、土地について自由な取引が行われるとした場合に通常成立すると認められる価格をいい、当該土地に建物がある場合には、その建物が存するものとして算定する。","a":0,"e":"建物や地上権等がある場合は、それらが存しないものとして算定する（更地価格）。","m":"正常価格は更地前提"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02s-25-1","s":"土地鑑定委員会が標準地を選定するに当たり、その土地に地上権その他使用収益を制限する権利が存する場合であっても、その土地を標準地として選定することができる。","a":1,"e":"地上権等があっても選定可能。価格はそれが存しないものとして求める。","m":"地上権付きも選定可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02s-25-3","s":"土地鑑定委員会は、標準地の正常な価格を判定したときは、標準地の単位面積当たりの価格のほか、当該標準地の地積に応じた価格の総額についても官報で公示しなければならない。","a":0,"e":"公示するのは単位面積当たりの価格で、総額は公示事項ではない。","m":"総額は公示しない"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R01-25-4","s":"標準地は、土地鑑定委員会が、自然的及び社会的条件からみて類似の利用価値を有すると認められる地域において、土地の利用状況、環境等が特に良好と認められる一団の土地について選定する。","a":0,"e":"自然的・社会的条件からみて類似する地域で、環境等が通常と認められる土地から選定。","m":"標準地は通常の土地"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R03s-25-2","s":"不動産鑑定士は、公示区域内の土地について鑑定評価を行う場合において、当該土地の正常な価格を求めるときは、公示価格と実際の取引価格を規準としなければならない。","a":0,"e":"不動産鑑定士が規準とするのは公示価格のみ。","m":"規準は公示価格だけ"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R05-25-2","s":"不動産の鑑定評価における原価法は、対象不動産が建物又は建物及びその敷地である場合に適用されるものであり、対象不動産が土地のみである場合には、いかなる場合においても適用することができない。","a":0,"e":"造成地・埋立地など再調達原価を適切に求められれば土地にも適用できる。","m":"造成地なら原価法可"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R06-25-3","s":"不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用を前提として把握される価格を標準として形成されるが、これを不動産の価格に関する諸原則のうち適合の原則という。","a":0,"e":"これは最有効使用の原則。適合の原則は周辺環境への適合をいう。","m":"最高度＝最有効使用"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R06-25-4","s":"不動産の鑑定評価における収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求める手法であり、賃貸用不動産又は賃貸以外の事業の用に供する不動産の価格を求める場合に特に有効である。","a":1,"e":"純収益の現在価値の総和を求める手法で、賃貸用・事業用不動産に特に有効。","m":"収益還元は賃貸に有効"},{"f":"税他","t":"地価公示・鑑定評価","ref":"R02-25-3","s":"特殊価格とは、一般的に市場性を有しない不動産について、その利用現況等を前提とした経済価値を適正に表示する価格をいい、その例としては、文化財の指定を受けた建造物等が挙げられる。","a":1,"e":"特殊価格は市場性を有しない不動産の経済価値。文化財等が典型例。","m":"文化財は特殊価格"},{"f":"税他","t":"住宅金融支援機構","ref":"R05-46-2","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において、民間金融機関が貸し付けた住宅ローン債権のうち、新築住宅の建設又は購入に必要な資金の貸付けに係るもののみを買取りの対象としている。","a":0,"e":"中古住宅の購入資金に係る債権も買取りの対象。","m":"中古も買取対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R04-46-1","s":"独立行政法人住宅金融支援機構の証券化支援事業（買取型）において譲受けの対象となる貸付債権には、住宅の建設に付随する土地又は借地権の取得に必要な資金の貸付けに係るものは含まれない。","a":0,"e":"住宅の建設・購入に付随する土地・借地権の取得資金も対象に含まれる。","m":"付随の土地も対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R06-46-1","s":"独立行政法人住宅金融支援機構の証券化支援事業（買取型）において譲受けの対象となる貸付債権には、住宅の購入に付随する当該住宅の改良に必要な資金の貸付けに係るものは含まれない。","a":0,"e":"住宅購入に付随する当該住宅の改良資金も対象に含まれる。","m":"付随の改良も対象"},{"f":"税他","t":"住宅金融支援機構","ref":"R07-46-2","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において、自ら居住する住宅のための貸付債権のほか、賃貸住宅の建設又は購入に必要な資金の貸付けに係る債権についても譲受けの対象としている。","a":0,"e":"対象は本人又は親族が居住する住宅のための貸付債権。賃貸住宅は対象外。","m":"賃貸住宅は対象外"},{"f":"税他","t":"住宅金融支援機構","ref":"R05-46-4","s":"独立行政法人住宅金融支援機構は、マンション管理組合や区分所有者に対し、マンションの共用部分の改良に必要な資金の貸付けを行うことを業務として行っている。","a":1,"e":"マンション管理組合等への共用部分改良資金の直接融資は機構の業務。","m":"マンション共用部融資"},{"f":"税他","t":"住宅金融支援機構","ref":"R04-46-2","s":"独立行政法人住宅金融支援機構は、団体信用生命保険業務として、貸付けを受けた者が死亡した場合だけでなく、重度障害の状態となった場合にも、支払われる保険金を当該貸付けに係る債務の弁済に充当している。","a":1,"e":"死亡のほか重度障害の場合の保険金も債務弁済に充当する業務を行う。","m":"団信は重度障害も"},{"f":"税他","t":"住宅金融支援機構","ref":"R04-46-4","s":"独立行政法人住宅金融支援機構は、証券化支援事業（買取型）において買い取った住宅ローン債権を担保としてMBS（資産担保証券）を発行することにより、債券市場から資金を調達している。","a":1,"e":"買取型で買い取った住宅ローン債権を担保にMBSを発行し資金調達する。","m":"買取型はMBS発行"},{"f":"税他","t":"住宅金融支援機構","ref":"R02-46-2","s":"独立行政法人住宅金融支援機構が行う、災害により滅失した住宅に代わるべき建築物の建設又は購入に必要な資金の貸付けについては、元金据置期間を設けることができない。","a":0,"e":"災害復興建築物の貸付金は元金据置期間を設けることができる。","m":"災害復興は据置可"},{"f":"税他","t":"住宅金融支援機構","ref":"R07-46-3","s":"独立行政法人住宅金融支援機構は、高齢者が自ら居住する住宅について行うバリアフリー工事に必要な資金の貸付けについて、貸付けを受けた者の死亡時に一括して償還する方法をとることができる制度を設けている。","a":1,"e":"高齢者向け返済特例制度として死亡時一括償還が設けられている。","m":"高齢者は死亡時一括"},{"f":"税他","t":"住宅金融支援機構","ref":"R06-46-3","s":"独立行政法人住宅金融支援機構は、民間金融機関が貸し付けた住宅ローンについて住宅融資保険を引き受けることにより、民間金融機関による住宅資金の供給を支援している。","a":1,"e":"住宅融資保険により民間金融機関の住宅資金供給を支援している。","m":"融資保険で民間支援"},{"f":"税他","t":"景品表示法","ref":"R04-47-1","s":"宅地建物取引業者が新聞折込チラシに分譲住宅の広告を掲載する場合において、駅からの徒歩による所要時間は、道路距離80ｍにつき1分間を要するものとして算出し、1分未満の端数が生じたときは切り捨てて表示しなければならない。","a":0,"e":"1分未満の端数は切り上げる。","m":"徒歩80m1分切上げ"},{"f":"税他","t":"景品表示法","ref":"R04-47-2","s":"宅地建物取引業者が、既に売買契約が成立している物件をインターネット広告に掲載し続けた場合であっても、顧客からの問合せがあった際に契約済みである旨を説明すれば、不当表示には当たらない。","a":0,"e":"契約済み物件の掲載はおとり広告に当たり、事後に説明しても不当表示となる。","m":"契約済み掲載はおとり"},{"f":"税他","t":"景品表示法","ref":"R05-47-1","s":"宅地建物取引業者が広告に掲載した物件が実際に存在するものであっても、その業者に当該物件を取引する意思がない場合には、その表示は不当表示に当たる。","a":1,"e":"実際には取引する意思がない物件の表示はおとり広告として禁止される。","m":"意思なき広告はおとり"},{"f":"税他","t":"景品表示法","ref":"R04-47-4","s":"宅地建物取引業者が建築条件付土地の取引について広告をする場合には、取引の対象が土地である旨、建築請負契約を締結すべき期限等の条件の内容及び条件が成就しなかったときの措置の内容を明示しなければならない。","a":1,"e":"対象が土地である旨、条件の内容、条件不成就時の措置を明示する必要がある。","m":"建築条件付は3点明示"},{"f":"税他","t":"景品表示法","ref":"R07-47-1","s":"宅地建物取引業者が分譲団地の広告を行う場合において、団地と最寄駅との間の道路距離又は所要時間は、団地内の最も近い区画又は最も遠い区画のいずれか一方を起点として算出した数値を表示すれば足りる。","a":0,"e":"最も近い区画と最も遠い区画を起点とした数値の両方を表示する。","m":"団地は近遠両方"},{"f":"税他","t":"景品表示法","ref":"R03s-47-4","s":"宅地建物取引業者が中古マンションの広告を行う場合において、修繕積立金が住戸により異なり、全ての住戸の修繕積立金を示すことが困難であるときは、最低額及び最高額のみで表示することができる。","a":1,"e":"全住戸の表示が困難なときは最低額と最高額のみで表示できる。平均額は不可。","m":"最低と最高のみ"},{"f":"税他","t":"景品表示法","ref":"R06-47-2","s":"宅地建物取引業者が土地の売買の広告を行う場合において、当該土地上に古家が存在するときであっても、現地を見れば古家の存在が容易に分かるのであれば、広告においてその旨を明示する必要はない。","a":0,"e":"古家・廃屋等が存在するときはその旨を明示しなければならない。","m":"古家は必ず明示"},{"f":"税他","t":"景品表示法","ref":"R06-47-4","s":"宅地建物取引業者が建物の売買の広告を行う場合において、当該建物が建築工事完了後1年以上経過していても、一度も居住の用に供されたことがないものであれば、「新築」と表示することができる。","a":0,"e":"新築は建築工事完了後1年未満で、かつ居住の用に供されたことがないもの。","m":"新築は1年未満未使用"},{"f":"税他","t":"景品表示法","ref":"R07-47-3","s":"宅地建物取引業者が物件の広告を行う場合において、新設予定の鉄道の駅については、当該路線の運行主体が公表したものに限り、その新設予定時期を明示して表示することができる。","a":1,"e":"運行主体が公表したものに限り、新設予定時期を明示して表示できる。","m":"新駅は公表分のみ"},{"f":"税他","t":"景品表示法","ref":"R02s-47-2","s":"宅地建物取引業者が物件の広告を行う場合において、取引態様については、「売主」、「貸主」、「代理」又は「媒介（仲介）」の別をこれらの用語を用いて表示しなければならない。","a":1,"e":"取引態様はこれらの用語で明示する。「直販」等は不可。","m":"態様は4用語"},{"f":"税他","t":"土地・建物","ref":"R05-49-2","s":"谷底低地に軟弱層が厚く堆積している所では、地震の際に軟弱層によって地震動が吸収されるため、周辺の台地に比べて地震動が小さくなり、被害も小さくなる傾向がある。","a":0,"e":"軟弱層が厚い所では地震動が増幅され揺れが大きくなる。","m":"軟弱層は揺れ増幅"},{"f":"税他","t":"土地・建物","ref":"R05-49-1","s":"河川の両側に形成される自然堤防の後背湿地側の縁は、砂が緩く堆積していて地下水位も浅いため、地震の際に液状化被害が生じやすい地盤である。","a":1,"e":"砂が緩く堆積し地下水位が浅いため液状化しやすい。","m":"後背湿地側は液状化"},{"f":"税他","t":"土地・建物","ref":"R04-49-2","s":"河川の下流部や海岸沿いに広がる低地は、一般に地盤が安定しており洪水や地震などの自然災害に対して強いことから、防災的見地から住宅地として好ましい土地であるといえる。","a":0,"e":"低地は軟弱地盤が多く、洪水・地震・津波等の災害リスクが高い。","m":"低地は災害に弱い"},{"f":"税他","t":"土地・建物","ref":"R04-49-1","s":"台地は一般に水はけが良く住宅地として適しているが、台地上の浅い谷は、豪雨時には周囲から水が集まり、一時的に浸水することがあるので注意を要する。","a":1,"e":"台地上でも浅い谷には水が集まり浸水することがある。","m":"台地の谷は浸水注意"},{"f":"税他","t":"土地・建物","ref":"R01-49-3","s":"台地・段丘は、農地として利用されることが多く、都市的な土地利用も多いが、一般に水はけが悪く地盤も軟弱であることから、自然災害に対して安全度の低い所である。","a":0,"e":"台地・段丘は水はけが良く地盤も安定し、自然災害に対して安全度が高い。","m":"台地は安全度高い"},{"f":"税他","t":"土地・建物","ref":"R05-50-3","s":"鉄筋コンクリート構造において、鉄筋とコンクリートを一体化するためには、表面に突起のある異形棒鋼よりも、表面が平滑な丸鋼を用いる方が優れている。","a":0,"e":"表面に突起のある異形棒鋼の方が付着力が高く一体化に優れる。","m":"異形棒鋼が付着良"},{"f":"税他","t":"土地・建物","ref":"R04-50-4","s":"木造建築物の壁の構造において、柱を壁の中に隠す大壁ではなく柱を露出させる真壁のみで構成するのが洋風構造であり、大壁のみで構成するのが和風構造である。","a":0,"e":"真壁は和風、大壁は洋風。両者を併用する場合もある。","m":"真壁＝和、大壁＝洋"},{"f":"税他","t":"土地・建物","ref":"R06-50-3","s":"ブレース構造は、柱と梁で囲まれた部分に斜材（筋かい）を入れて地震力等による建築物の変形を抑える構造であり、ラーメン構造など他の構造と併用されることはない。","a":0,"e":"ブレース構造はラーメン構造等と併用されることがある。","m":"ブレースは併用可"},{"f":"税他","t":"土地・建物","ref":"R06-50-4","s":"建築物の構造のうち壁式構造は、板状の壁体と床版を一体として箱形の構造体を構成するものであり、原則として柱や梁を用いず、壁で荷重を支える構造である。","a":1,"e":"壁式構造は壁と床で箱形をつくり、柱・梁を用いない構造。","m":"壁式は柱梁なし"},{"f":"税他","t":"土地・建物","ref":"R02-50-3","s":"建築物の基礎のうち直接基礎の形式として、建物の底部全体を一枚の鉄筋コンクリートの版で支えるように設けるものを布基礎といい、地盤が比較的軟弱な場合などに用いられる。","a":0,"e":"底部全体に設けるのはべた基礎。布基礎は壁体等の下に連続して設ける。","m":"全体＝べた、壁下＝布"}];
const LESSON={"業法|免許":{"pts":["自ら当事者として売買・交換、または売買・交換・貸借の代理・媒介を業として行うには免許が必要。自ら貸主・転貸は宅建業に当たらない。","事務所が1つの都道府県内のみなら数に関係なく知事免許、2以上の都道府県に事務所を置くなら国土交通大臣免許。物件所在地は無関係。","免許の有効期間は5年。更新申請は満了日の90日前から30日前まで。満了日までに処分がなければ従前の免許は処分まで効力を有する。","免許権者は免許（更新を含む）に条件を付けられ、条件違反は任意的取消事由。免許は一身専属で、合併・相続によっても承継されない。","廃業等の届出は30日以内。死亡は相続人が死亡を知った日から、合併消滅は消滅法人の代表役員だった者がその日から届け出る。","破産・解散・廃止の届出は破産管財人・清算人・業者本人等。死亡・合併は事実発生時、それ以外は届出時に免許が失効する。","免許失効後も、一般承継人等は締結済み取引を結了する目的の範囲内で宅建業者とみなされる（76条）。"],"traps":["「他県の物件を扱うので大臣免許への免許換えが必要」と出たら×。区分は事務所の所在地だけで決まる。","「相続人は死亡の日から30日以内に届出」と出たら×。正しくは死亡を知った日から30日以内。","「合併後の会社が届出をすれば免許を承継できる」と出たら×。免許は承継されず、新たに免許を受ける必要がある。"],"rel":["業法|免許の基準","業法|監督・罰則","業法|宅建士"],"bridge":"免許は「誰が・どこで営業するか」の入口の手続、免許の基準は「免許を受けられない人」の中身。取消や失効後の処理は監督・罰則とつながる。","sys":{"overview":"宅建業法の入口となる制度。何が宅建業に当たるか、知事免許と大臣免許の区分、有効期間5年と更新、変更・廃業等の届出と失効時期を押さえれば得点できる。","tree":[{"h":"宅建業の定義","items":["宅地＝建物の敷地用の土地＋用途地域内の土地","用途地域内でも道路・公園・河川等は除く","取引＝自ら売買・交換＋売買等の代理・媒介","自ら貸主・転貸は取引に当たらない","業＝不特定多数相手に反復継続して行う"]},{"h":"免許の要否","items":["国・地方公共団体等は免許不要","信託会社・信託銀行は大臣への届出で足りる","業者に代理・媒介を任せても売主は免許必要","無免許・名義貸しは3年以下拘禁刑等"]},{"h":"免許の区分","items":["1都道府県内のみに事務所→その知事免許","2以上の都道府県に事務所→国土交通大臣免許","物件所在地・営業地域は区分に無関係","区分が変われば免許換え（従前免許は失効）","大臣免許の申請は知事を経由しない"]},{"h":"有効期間・更新","items":["有効期間は5年（知事・大臣とも）","更新申請は満了の90日前から30日前まで","処分未了なら従前免許は処分まで有効","更新後の有効期間は従前満了日の翌日から5年","免許・更新に条件を付すことができる"]},{"h":"変更の届出","items":["名簿登載事項の変更は30日以内に届出","商号・名称、事務所の名称・所在地","役員・政令使用人・専任宅建士の氏名","事務所の新設・廃止も変更の届出"]},{"h":"廃業等の届出","items":["届出期限はすべて30日以内","死亡：相続人が知った日から30日以内","死亡・合併は事実発生時に免許失効","破産・解散・廃業は届出時に免許失効","失効後も取引の結了の範囲で業者とみなす"]}],"flow":{"title":"免許取得から更新まで","steps":["事務所の所在から知事か大臣かを判断","免許申請し免許を受ける（有効期間5年）","営業保証金供託か保証協会加入で営業開始","変更があれば30日以内に変更の届出","満了90日前〜30日前に更新申請","処分まで従前免許が存続し更新後5年"]},"tables":[{"title":"取引の当否","head":["行為","自ら","代理・媒介"],"rows":[["売買","○","○"],["交換","○","○"],["貸借","×（自ら貸主）","○"],["転貸","×（自ら転貸）","○"]]},{"title":"廃業等の届出","head":["事由","届出義務者","失効時期"],"rows":[["死亡","相続人（知った日から）","死亡時"],["合併消滅","消滅法人の代表役員","合併時"],["破産","破産管財人","届出時"],["解散","清算人","届出時"],["廃業","本人・代表役員","届出時"]]},{"title":"免許換えの要否","head":["ケース","免許換え"],"rows":[["甲県のみ→甲県内で事務所増設","不要"],["甲県知事→乙県に支店新設","必要（大臣へ）"],["甲県知事→乙県へ全事務所移転","必要（乙県知事へ）"],["大臣→1県のみに縮小","必要（その知事へ）"],["他県の物件を扱うだけ","不要"]]}]}},"業法|免許の基準":{"pts":["拘禁刑以上の刑に処せられ、執行を終わり又は受けなくなった日から5年を経過しない者は欠格。罪の種類は問わない。","罰金刑が欠格となるのは宅建業法違反、傷害・暴行・脅迫等の暴力系の罪、背任罪などに限られ、執行終了等から5年間。","拘留・科料は欠格事由にならない。控訴・上告中で刑が確定していない間も「刑に処せられた」に当たらない。","執行猶予期間中は欠格だが、猶予期間を満了すれば刑の言渡しが効力を失い、5年を待たずに直ちに免許を受けられる。","不正手段による免許取得・業務停止事由で情状が特に重い・業務停止処分違反で免許を取り消された者は取消しの日から5年間欠格。","破産手続開始決定を受けて復権を得ない者、暴力団員等（脱退後5年を経過しない者を含む）、心身の故障で業務を適正に行えない者は欠格。","法人は役員（非常勤・相談役等を含む）や政令で定める使用人（支店長等）に欠格者がいれば免許を受けられない。専任宅建士は審査対象外。"],"traps":["「非常勤の取締役だから会社の免許に影響しない」と出たら×。非常勤でも役員として審査対象になる。","「執行猶予期間が満了しても、その日から5年を経過しないと免許を受けられない」と出たら×。満了で直ちに受けられる。","「所得税法違反の罰金で免許が取り消される」と出たら×。罰金で欠格となる罪は宅建業法違反・暴力系・背任等に限られる。"],"rel":["業法|免許","業法|宅建士","業法|監督・罰則"],"bridge":"宅建士の登録欠格もほぼ同じ構造だが、未成年者の扱いや事務禁止処分中の登録消除など宅建士特有の事由がある。該当すれば監督・罰則の必要的取消につながる。","sys":{"overview":"免許の欠格事由（5条）は宅建士の登録欠格とほぼ共通の土台。刑罰による欠格（拘禁刑以上は罪を問わず、罰金は特定の罪のみ）と5年の起算点、法人役員への波及を押さえれば得点できる。","tree":[{"h":"本人の能力","items":["心身の故障で業務を適正に行えない者","破産者で復権を得ない者（復権で直ちに可）","未成年者は法定代理人が欠格なら不可","成年者と同一の行為能力ある未成年者は可"]},{"h":"刑罰","items":["拘禁刑以上：罪を問わず執行終了等から5年","罰金：業法違反・暴力系・背任のみ5年","暴力系＝傷害・現場助勢・暴行・脅迫等","拘留・科料は欠格事由にならない","上訴中で未確定なら欠格でない","執行猶予中は欠格、満了で直ちに可"]},{"h":"処分歴","items":["不正取得・情状特に重い・業務停止違反で取消","上記取消から5年間は欠格","法人：聴聞公示前60日内の役員も5年","聴聞公示後のかけこみ廃業は届出から5年"]},{"h":"不正・暴力団","items":["申請前5年以内に宅建業で不正等をした者","不正・不誠実な行為をするおそれが明らか","暴力団員・脱退後5年未経過の者","暴力団員等が事業活動を支配する者"]},{"h":"関係者","items":["法人：役員（非常勤・相談役等含む）","法人・個人：政令で定める使用人（支店長等）","専任宅建士は審査対象外","欠格者がいれば法人自体が免許不可"]},{"h":"その他","items":["事務所に専任宅建士の法定数が不足","申請書・添付書類の重要事項の虚偽記載","免許後に該当すれば原則必要的取消"]}],"flow":{"title":"刑罰による欠格の判定","steps":["刑が確定しているか（上訴中なら欠格でない）","刑の種類は拘禁刑以上か罰金か拘留・科料か","拘留・科料なら欠格事由にならない","罰金なら業法違反・暴力系・背任か確認","執行猶予なら猶予中のみ欠格、満了で回復","実刑なら執行終了等から5年経過で回復"]},"tables":[{"title":"刑罰と欠格","head":["刑","罪の種類","欠格期間"],"rows":[["拘禁刑以上","問わない","執行終了等から5年"],["罰金","業法違反","執行終了等から5年"],["罰金","傷害・暴行・脅迫等","執行終了等から5年"],["罰金","背任","執行終了等から5年"],["罰金","暴対法・暴力行為等処罰法","執行終了等から5年"],["罰金","上記以外（所得税法等）","欠格でない"],["拘留・科料","問わない","欠格でない"],["執行猶予付","問わない","猶予中のみ（満了で可）"]]},{"title":"5年待つもの・待たないもの","head":["事由","回復"],"rows":[["破産者の復権","直ちに"],["執行猶予期間の満了","直ちに"],["実刑の執行終了","5年経過後"],["不正取得等による免許取消","取消から5年"],["暴力団員の脱退","脱退から5年"]]},{"title":"法人の審査対象","head":["地位","対象"],"rows":[["代表取締役・取締役","○"],["非常勤役員・相談役等","○"],["政令使用人（支店長）","○"],["専任宅建士","×"],["一般の従業者","×"]]}]}},"業法|宅建士":{"pts":["登録は試験を行った都道府県知事に申請する。住所地や勤務地は関係なく、2年以上の実務経験か国土交通大臣の登録実務講習修了が必要。","登録の移転は他県の業者の事務所に従事する（予定）場合に「できる」任意の手続で、事務禁止処分期間中は申請できない。","氏名・住所・本籍、勤務先業者の商号・名称・免許証番号に変更があれば、専任かどうかを問わず遅滞なく変更の登録を申請する。","宅建士証の有効期間は5年。交付・更新の際は登録先知事が指定する講習（交付申請前6か月以内）を受講する。試験合格後1年以内の交付は講習免除。","宅建士証は取引関係者から請求があれば提示し、重要事項説明の際は請求がなくても提示する。住所欄へのシール貼付や旧姓併記が認められる。","事務禁止処分を受けたら速やかに交付知事へ宅建士証を提出し、効力を失ったら速やかに返納する。違反は10万円以下の過料。","営業に関し成年者と同一の行為能力を有しない未成年者は登録できないが、営業許可等で同一の行為能力があれば登録できる。"],"traps":["「他県の業者の専任宅建士になるには登録の移転をしなければならない」と出たら×。登録の移転は任意。","「専任でない宅建士は勤務先が変わっても変更の登録は不要」と出たら×。勤務先業者は登録事項で専任かを問わない。","「宅建士証の更新では国土交通大臣が指定する講習を受講」と出たら×。登録先の都道府県知事が指定する講習。"],"rel":["業法|免許の基準","業法|事務所・案内所","業法|重要事項説明"],"bridge":"登録欠格は免許の基準と似ているが別制度。宅建士の独占業務は35条の説明と35条・37条書面への記名で、専任宅建士の設置数は事務所・案内所の規制で決まる。","sys":{"overview":"宅建士は試験合格→登録→宅建士証交付の3段階で成立する資格。登録先（試験地の知事）、登録の移転・変更の登録、宅建士証の有効期間5年と講習、提示・提出・返納の区別を押さえれば得点できる。","tree":[{"h":"登録","items":["試験を行った都道府県知事に申請","実務2年以上か登録実務講習の修了が必要","登録は一生有効（消除されない限り）","登録欠格は免許の基準とほぼ同じ","事務禁止中に自ら消除→満了まで再登録不可"]},{"h":"登録の移転","items":["他県の業者の事務所に従事（予定）の場合","移転は任意で義務ではない","事務禁止処分期間中は申請できない","現登録知事を経由して移転先知事へ申請","新宅建士証は従前の残存期間で交付"]},{"h":"変更・死亡等","items":["氏名・住所・本籍の変更は変更の登録","勤務先業者の商号・免許証番号も対象","専任か否かを問わず遅滞なく申請","死亡等の届出は30日以内（相続人は知った日から）"]},{"h":"宅建士証","items":["有効期間5年","交付申請前6か月以内の法定講習を受講","講習は登録先知事が指定","合格後1年以内・移転時の交付は講習免除","旧姓併記・住所欄シール貼付が可能"]},{"h":"提示・提出・返納","items":["関係者の請求があれば提示","重要事項説明時は請求なしで提示","事務禁止処分→交付知事に速やかに提出","失効・登録消除→速やかに返納","提出・返納違反は10万円以下の過料"]},{"h":"独占業務と義務","items":["35条の重要事項説明","35条書面への記名","37条書面への記名","公正誠実・信用失墜行為の禁止","知識・能力の維持向上の努力義務"]}],"flow":{"title":"合格から宅建士証の更新","steps":["試験合格（合格は一生有効）","試験地の知事に登録申請（実務2年等）","登録を受ける（宅建士証はまだない）","法定講習を受け宅建士証交付（1年内は免除）","宅建士証の有効期間は5年","更新前6か月以内に法定講習を受け更新"]},"tables":[{"title":"提示・提出・返納","head":["場面","行為","相手"],"rows":[["関係者から請求","提示","請求者"],["重要事項説明","提示（請求不要）","相手方"],["事務禁止処分","提出","交付知事"],["禁止期間満了","返還請求で返還","交付知事"],["失効・登録消除","返納","交付知事"]]},{"title":"登録の移転と変更の登録","head":["項目","登録の移転","変更の登録"],"rows":[["性質","任意（できる）","義務"],["きっかけ","他県業者の事務所に従事","登録事項の変更"],["申請先","移転先知事（経由）","登録先知事"],["期限","定めなし","遅滞なく"],["事務禁止中","不可","可"]]},{"title":"講習の要否","head":["場面","法定講習"],"rows":[["合格後1年以内の交付","不要"],["合格後1年超の交付","必要"],["有効期間の更新","必要"],["登録の移転に伴う交付","不要"]]}]}},"業法|営業保証金":{"pts":["主たる事務所1,000万円、従たる事務所1か所ごとに500万円を、全事務所分まとめて主たる事務所の最寄りの供託所に供託する。","金銭のほか有価証券も可。評価額は国債100%、地方債・政府保証債90%、その他の有価証券80%。","供託後、供託書の写しを添付して免許権者に届け出た後でなければ事業を開始できない。新設事務所分も供託・届出後に業務開始。","免許後3か月以内に届出がなければ免許権者は催告しなければならず、催告到達から1か月以内に届出がなければ免許を取り消せる。","主たる事務所移転で供託所が変わったとき、金銭のみなら保管替えを請求し、有価証券を含むなら新たに供託する（二重供託後に取戻し）。","還付を受けられるのは業者と宅建業の取引をした者で宅建業者を除く。還付で不足したら通知を受けた日から2週間以内に不足額を供託する。","取戻しには6か月以上の公告が必要（一部の事務所廃止も同じ）。保証協会加入時・保管替え時・取戻し事由発生から10年経過時は公告不要。"],"traps":["「国債は額面の90%、地方債は80%で評価」と出たら×。国債100%、地方債90%、その他80%。","「免許失効による取戻しの公告期間は3か月」と出たら×。還付請求権者への公告は6か月を下らない期間が必要。","「金銭のみで供託していても移転先の供託所に新たに供託し直す」と出たら×。金銭のみなら保管替えの請求。"],"rel":["業法|保証協会","業法|住宅瑕疵担保履行法","業法|免許"],"bridge":"保証協会は営業保証金に代わる制度で、分担金は60万・30万と小さく金銭のみ。還付の限度額は営業保証金相当額で同じだが、公告や期限の細部が異なる。","sys":{"overview":"取引相手の損害を担保する業者自身の供託制度。供託額（本店1,000万円・支店500万円）、有価証券の評価割合、供託→届出→営業開始の順序、還付・不足額供託・取戻し（6か月公告）の期限を押さえれば得点できる。","tree":[{"h":"供託","items":["主たる事務所1,000万円","従たる事務所1か所ごとに500万円","主たる事務所の最寄りの供託所に一括供託","金銭・有価証券（国債100%等）で可"]},{"h":"営業開始","items":["供託後、供託書の写しを添えて免許権者に届出","届出後でなければ事業開始できない","事務所新設時も供託・届出後に業務開始","免許後3か月届出なし→催告","催告到達後1か月届出なし→取消できる"]},{"h":"保管替え等","items":["主たる事務所移転で最寄り供託所が変わる場合","金銭のみ→保管替えを請求","有価証券を含む→新たに供託し旧分を取戻し","移転後遅滞なく供託"]},{"h":"還付","items":["業者と宅建業の取引をした者が対象","宅建業者は還付を受けられない","上限は供託した営業保証金の額","不足通知から2週間以内に不足額供託","供託から2週間以内に免許権者へ届出"]},{"h":"取戻し","items":["免許失効・取消、一部事務所廃止など","原則6か月以上の公告が必要","保管替え・保証協会加入時は公告不要","取戻し事由発生から10年経過で公告不要"]}],"flow":{"title":"供託から還付・補充まで","steps":["主たる事務所最寄りの供託所に供託","供託書の写しを添えて免許権者に届出","届出後に事業開始（3か月で催告）","取引相手が供託所に還付請求","免許権者から不足額供託の通知","通知受領から2週間以内に不足額を供託","供託から2週間以内に免許権者へ届出"]},"tables":[{"title":"有価証券の評価額","head":["種類","評価"],"rows":[["金銭","100%"],["国債証券","額面の100%"],["地方債・政府保証債","額面の90%"],["その他の有価証券","額面の80%"]]},{"title":"取戻しの公告","head":["取戻し事由","公告"],"rows":[["免許失効・取消","必要（6か月以上）"],["一部の事務所廃止","必要（6か月以上）"],["保証協会の社員となった","不要"],["保管替え後の旧供託所分","不要"],["事由発生から10年経過","不要"]]},{"title":"供託額の計算例","head":["事務所","供託額"],"rows":[["本店のみ","1,000万円"],["本店＋支店1","1,500万円"],["本店＋支店2","2,000万円"],["本店＋支店5","3,500万円"]]}]}},"業法|保証協会":{"pts":["弁済業務保証金分担金は主たる事務所60万円、その他の事務所1か所につき30万円で、金銭のみ。加入しようとする日までに納付する。","加入後に事務所を新設したときは、その日から2週間以内に追加の分担金を納付する。怠ると社員の地位を失う。","保証協会は分担金の受領日から1週間以内に、同額の弁済業務保証金を法務大臣及び国土交通大臣が定める供託所に供託する。","還付の限度額は、その社員が社員でなければ供託すべき営業保証金相当額。社員となる前に取引した者（宅建業者を除く）も対象。","還付を受けるには保証協会の認証が必要で、認証事務は認証申出書の受理の順序に従って処理する。","還付後、保証協会は大臣の通知から2週間以内に還付額を供託し、社員は協会の通知から2週間以内に還付充当金を納付する。","社員の地位を失ったら1週間以内に営業保証金を供託する。分担金返還の公告（6か月以上）は社員の地位を失った場合のみで、一部事務所廃止なら不要。"],"traps":["「分担金を国債証券で納付できる」と出たら×。分担金は金銭のみ（協会が供託する弁済業務保証金は有価証券も可）。","「分担金は加入した日から1週間以内に納付」と出たら×。加入しようとする日までに納付する。","「納付した弁済業務保証金の額の範囲内で弁済を受けられる」と出たら×。限度は営業保証金相当額。"],"rel":["業法|営業保証金","業法|監督・罰則","業法|住宅瑕疵担保履行法"],"bridge":"営業保証金は業者自身が主たる事務所最寄りに供託、保証協会は協会が供託し業者は分担金を納める。期限は「2週間」と「1週間」が入り混じるので主体ごとに整理する。","sys":{"overview":"営業保証金に代わる弁済制度。分担金（本店60万円・支店30万円、金銭のみ）の納付時期、協会の1週間以内供託、還付の認証と限度額、還付充当金の2週間、社員地位喪失後の1週間を主体別に整理すれば得点できる。","tree":[{"h":"保証協会","items":["国土交通大臣が指定する一般社団法人","宅建業者のみが社員","業者は1つの協会の社員にしかなれない","社員加入時は協会が免許権者に報告"]},{"h":"業務","items":["必須：苦情の解決","必須：研修","必須：弁済業務","任意：一般保証・手付金等保管・研修費助成","その他必要な業務は大臣の承認が必要"]},{"h":"分担金","items":["主たる事務所60万円","その他の事務所1か所30万円","金銭のみ（有価証券不可）","加入しようとする日までに納付","事務所新設は2週間以内に追加納付"]},{"h":"弁済業務保証金","items":["協会が分担金受領から1週間以内に供託","供託先は法務大臣及び国交大臣が定める供託所","協会の供託は有価証券も可","社員加入で営業保証金は公告なく取戻し可"]},{"h":"還付","items":["社員加入前の取引も対象","宅建業者は対象外","限度は営業保証金相当額","保証協会の認証が必要（受理順に処理）","協会は通知から2週間以内に還付額を供託"]},{"h":"社員の地位喪失","items":["還付充当金は通知から2週間以内","未納付なら社員の地位を失う","喪失から1週間以内に営業保証金を供託","分担金返還は6か月以上の公告後","一部事務所廃止の返還は公告不要"]}],"flow":{"title":"還付から補充まで","steps":["取引相手が保証協会に認証を申し出る","協会が認証（申出書の受理順）","供託所に還付請求し還付を受ける","大臣の通知から2週間以内に協会が供託","協会が社員に還付充当金納付を通知","社員は通知から2週間以内に納付","未納付なら地位喪失→1週間以内に営業保証金"]},"tables":[{"title":"営業保証金と保証協会","head":["項目","営業保証金","保証協会"],"rows":[["額（本店）","1,000万円","60万円"],["額（支店1か所）","500万円","30万円"],["納付方法","金銭・有価証券","金銭のみ"],["供託・納付先","最寄りの供託所","保証協会"],["事務所新設","供託・届出後開始","2週間以内に納付"],["還付の認証","不要","必要"],["還付限度","供託額","営業保証金相当額"]]},{"title":"期限の整理","head":["主体","場面","期限"],"rows":[["業者","加入時の分担金","加入しようとする日まで"],["業者","事務所新設の追加分","2週間以内"],["協会","分担金受領後の供託","1週間以内"],["協会","還付後の補充供託","通知から2週間以内"],["業者","還付充当金","通知から2週間以内"],["業者","地位喪失後の営業保証金","1週間以内"]]},{"title":"還付限度額の計算例","head":["事務所","分担金","還付限度"],"rows":[["本店のみ","60万円","1,000万円"],["本店＋支店1","90万円","1,500万円"],["本店＋支店3","150万円","2,500万円"]]}]}},"業法|事務所・案内所":{"pts":["事務所とは本店・支店・継続的に業務を行い契約締結権限を持つ使用人を置く場所。本店は常に事務所、支店は宅建業を営む場合のみ。登記の有無は無関係。","事務所ごとに業務従事者5人に1人以上の成年の専任宅建士を置く。契約行為等を行う案内所等は1人以上。不足は2週間以内に補充等の措置。","事務所には標識・報酬額の掲示、帳簿・従業者名簿の備付けが必要。案内所等には標識のみ必要で、報酬額の掲示は不要。","帳簿は事業年度末に閉鎖し閉鎖後5年間（自ら売主の新築住宅は10年間）、従業者名簿は最終記載日から10年間保存する。電子保存も可。","契約行為等（申込み受付を含む）を行う案内所等は、業務開始の10日前までに免許権者と所在地の知事の双方に届け出る。","業者本人や法人の役員が宅建士であれば、主として業務に従事する事務所等で成年者である専任宅建士とみなされる（未成年でも可）。","全従業者に従業者証明書を携帯させなければならず、宅建士証で代用することはできない。取引関係者の請求があれば提示する。"],"traps":["「事務所に免許証を掲示しなければならない」と出たら×。掲示義務は標識と報酬額で、免許証はない。","「専任宅建士の不足は30日以内に補充すれば足りる」と出たら×。不足したら2週間以内に補充等の措置を執る。","「契約をしない案内所には標識不要」と出たら×。標識はすべての案内所等に必要、不要なのは専任宅建士と届出。"],"rel":["業法|宅建士","業法|クーリング・オフ","業法|免許"],"bridge":"専任宅建士を置く「契約行為等を行う案内所」は、クーリング・オフの「事務所等」と重なる。テント張りの案内所など土地に定着しない場所は事務所等に当たらない点も比較される。","sys":{"overview":"業者の営業拠点ごとの設置義務の論点。事務所の定義、専任宅建士の数（5人に1人・案内所1人）、標識・報酬額掲示・帳簿・名簿の区別、案内所の10日前届出を表で整理すれば得点できる。","tree":[{"h":"事務所","items":["本店は常に事務所（支店のみで営業しても）","支店は宅建業を営む場合のみ事務所","継続的業務の場所で契約権限者を置く所","登記の有無は無関係"]},{"h":"案内所等","items":["継続的業務を行う事務所以外の場所","一団の宅地建物の分譲の案内所","他業者の分譲の代理・媒介の案内所","展示会その他の催しの会場"]},{"h":"専任宅建士","items":["事務所：業務従事者5人に1人以上","契約行為等の案内所等：1人以上","成年者であることが必要","業者本人・役員の宅建士は成年者とみなす","不足は2週間以内に補充等の措置"]},{"h":"備付け・掲示","items":["標識：事務所・すべての案内所等","報酬額の掲示：事務所のみ","帳簿：事務所ごと、閉鎖後5年（新築自ら売主10年）","従業者名簿：最終記載から10年","電子的な保存も可","事務所の標識は専任宅建士の数を表示"]},{"h":"案内所の届出","items":["契約行為等（申込み受付含む）を行う場合","業務開始の10日前まで","免許権者と所在地の知事の双方","契約行為等をしなければ届出不要","大臣宛ても知事を経由せず直接提出"]},{"h":"従業者証明書","items":["全従業者に携帯させる","宅建士証では代用できない","関係者の請求があれば提示","役員・非常勤も対象"]}],"flow":{"title":"案内所を設けるときの判定","steps":["その場所で契約・申込み受付をするか","しないなら標識の掲示のみで足りる","するなら成年の専任宅建士を1人以上置く","業務開始10日前までに双方の知事等へ届出","標識を掲示（報酬額の掲示は不要）","業務開始後も従業者証明書を携帯させる"]},"tables":[{"title":"場所ごとの義務","head":["義務","事務所","案内所(契約等)","案内所(契約なし)"],"rows":[["標識","○","○","○"],["報酬額の掲示","○","×","×"],["帳簿","○","×","×"],["従業者名簿","○","×","×"],["専任宅建士","5人に1人","1人以上","×"],["50条2項届出","×（変更届）","10日前","×"]]},{"title":"保存期間","head":["書類","保存期間","起算"],"rows":[["帳簿","5年","各事業年度末の閉鎖後"],["帳簿（新築住宅を自ら売主）","10年","閉鎖後"],["従業者名簿","10年","最終の記載をした日"]]},{"title":"よくあるひっかけ","head":["記述","正誤"],"rows":[["免許証を掲示する","×（標識と報酬額）"],["専任宅建士の補充は30日以内","×（2週間以内）"],["案内所届出は所在地知事のみ","×（免許権者にも）"],["宅建士証で従業者証明書を代用","×"],["未登記の支店は事務所でない","×"]]}]}},"業法|業務上の規制":{"pts":["勧誘に先立ち、業者の商号・名称、勧誘者の氏名、契約締結の勧誘目的である旨を告げなければならない。","相手方が契約を締結しない意思を示した後の再勧誘は禁止。担当者を替えても同じ。迷惑を覚える時間の電話・訪問も禁止。","手付の貸付け・分割受領・後払いなどの信用供与による契約誘引は禁止され、契約が成立しなくても誘引した時点で違反。","正当な理由なく判断に必要な時間を与えることを拒むこと、申込み撤回時に受領済みの預り金の返還を拒むことは禁止。","業者・従業者は正当な理由なく業務上知り得た秘密を漏らしてはならず、廃業後・退職後も続く。本人の承諾や裁判での証言は正当な理由。","宅建業法上の割賦販売は、引渡し後1年以上の期間にわたり2回以上に分割して代金を受領することを条件とする販売をいう。","宅地建物の売買及びその代理・媒介は犯罪収益移転防止法の特定取引で、取引時確認や記録の保存が必要。"],"traps":["「勧誘前に自分の氏名を告げれば商号は告げなくてよい」と出たら×。商号・氏名・目的のすべてを告げる。","「契約が成立しなかったので手付貸付けの申出は違反でない」と出たら×。誘引行為自体が違反。","「依頼者の承諾があっても秘密を漏らせない」と出たら×。本人の承諾は正当な理由に当たる。"],"rel":["業法|広告","業法|8種制限","業法|監督・罰則"],"bridge":"手付の貸付けは禁止だが手付の減額は信用供与に当たらず可。手付の額の上限や性質は8種制限で規律され、違反の重さは監督・罰則で問われる。","sys":{"overview":"業法の行為規制のうち勧誘・契約誘引・守秘に関する禁止事項。宅建業者間でも適用される点、手付の信用供与禁止（減額は可）、再勧誘・威迫・時間不付与の禁止、守秘義務の継続と正当理由を押さえれば得点できる。","tree":[{"h":"基本原則","items":["信義を旨とし誠実に業務を行う","従業者への教育の努力義務","業務に関し不当な履行遅延の禁止","業者間取引にも適用（8種制限と異なる）"]},{"h":"勧誘時の規制","items":["商号・勧誘者氏名・勧誘目的を事前に告知","断る意思表示後の再勧誘禁止","担当者を替えても再勧誘は違反","迷惑な時間の電話・訪問の禁止","威迫・断定的判断の提供の禁止"]},{"h":"契約誘引","items":["重要事項の故意の不告知・不実告知禁止","手付の貸付け・分割・後払いは禁止","契約不成立でも誘引時点で違反","手付の減額は信用供与に当たらない","不当に高額の報酬要求の禁止"]},{"h":"契約前後","items":["判断に必要な時間を与えない行為の禁止","撤回時の預り金返還拒否の禁止","手付放棄による解除の不当拒否の禁止","供託所等の説明は契約成立前（業者相手不要）"]},{"h":"守秘義務","items":["業者・従業者とも正当理由なく漏洩禁止","廃業後・退職後も継続","本人の承諾は正当な理由","裁判での証言も正当な理由"]},{"h":"その他","items":["割賦販売：引渡し後1年以上・2回以上分割","売買とその代理・媒介は犯収法の特定取引","特定取引では取引時確認・記録保存","確認記録・取引記録は7年保存"]}],"flow":{"title":"勧誘から契約までの規制","steps":["勧誘前に商号・氏名・目的を告げる","迷惑な時間・威迫・断定的判断をしない","断られたら担当を替えても再勧誘しない","重要事項を偽らず、手付で信用供与しない","判断に必要な時間を与える","撤回されたら預り金を返還する"]},"tables":[{"title":"手付をめぐる行為","head":["行為","可否"],"rows":[["手付の貸付け","×"],["手付の分割受領","×"],["手付の後払い","×"],["手付の減額","○"],["銀行ローンのあっせん","○"]]},{"title":"守秘義務の正当な理由","head":["場面","漏らしてよいか"],"rows":[["本人の承諾","○"],["裁判での証人として証言","○"],["税務署等の法令に基づく調査","○"],["廃業・退職後に他人へ話す","×"],["同業者に参考として話す","×"]]},{"title":"勧誘時の禁止と許容","head":["行為","可否"],"rows":[["商号を告げず氏名のみ","×"],["断られた翌日に再度電話","×"],["担当者を替えて再勧誘","×"],["「必ず値上がり」と断定","×"],["深夜の電話勧誘","×"]]}]}},"業法|広告":{"pts":["未完成物件は開発許可・建築確認等の処分があった後でなければ広告できない。この広告開始時期の制限は売買だけでなく貸借にも及ぶ。","契約締結時期の制限（処分前の売買・交換の契約禁止）は貸借には適用されない。広告と契約で範囲が異なる。","確認後に変更確認を申請中なら、変更予定である旨と当初の確認内容を併記すれば広告できる。確認申請中の表示では広告できない。","所在・規模・形質、利用の制限、環境・交通、代金・借賃、代金の融資等について、著しく事実に相違する表示や誤認させる表示は禁止。","誇大広告は広告した時点で違反で、取引成立や問合せの有無は問わない。成約済み物件の掲載継続もおとり広告として違反。","誇大広告等は監督処分の対象で、6か月以下の拘禁刑又は100万円以下の罰金（併科あり）が科され得る。","取引態様の別は広告のたびに明示し、注文を受けたときにも改めて遅滞なく明示する。自ら貸主の募集広告は業法の規制外。"],"traps":["「建築確認申請中と明示すれば広告できる」と出たら×。確認を受けるまで広告できない。","「確認前でも貸借の媒介の広告はできる」と出たら×。広告開始時期の制限は貸借にも及ぶ。","「問合せや申込みがなければ誇大広告でも違反でない」と出たら×。広告をした時点で違反が成立する。"],"rel":["税他|景品表示法","業法|報酬","業法|監督・罰則"],"bridge":"広告の表示ルールは景品表示法・公正競争規約でも細かく規制される。依頼者の依頼による広告料金は報酬とは別に受領できる点は報酬の論点で問われる。","sys":{"overview":"業法の広告規制は、誇大広告等の禁止、広告開始時期の制限、取引態様の明示の3本柱。開始時期制限は貸借にも及ぶが契約締結時期制限は及ばない点、違反は広告した時点で成立する点を押さえれば得点できる。","tree":[{"h":"誇大広告等","items":["著しく事実と相違・誤認させる表示の禁止","所在・規模・形質","現在・将来の利用の制限","環境・交通その他の利便","代金・借賃と金銭貸借のあっせん"]},{"h":"違反の成立","items":["広告した時点で違反成立","問合せ・取引成立の有無は不問","成約済み物件の掲載継続はおとり広告","表示しないことによる誤認も違反","監督処分＋6か月以下拘禁刑等の罰則"]},{"h":"開始時期制限","items":["工事完了前は処分後でなければ広告不可","処分＝開発許可・建築確認等","売買・交換・貸借すべてに適用","確認申請中の表示があっても不可","変更確認申請中は当初内容等の併記で可"]},{"h":"契約時期制限","items":["工事完了前は処分後でなければ契約不可","売買・交換（代理・媒介含む）に適用","貸借には適用されない","予約も契約と同じく制限"]},{"h":"取引態様の明示","items":["自ら当事者・代理・媒介の別","広告をするたびに明示","注文を受けたときも遅滞なく明示","口頭でも可、業者相手でも必要","自ら貸主・転貸の広告は業法の対象外"]},{"h":"広告料金","items":["報酬と別の受領は原則不可","依頼者の依頼による広告の実費は可","依頼がなければ受領できない"]}],"flow":{"title":"広告を出す前の確認","steps":["自ら貸主・転貸なら業法の広告規制外","工事完了前か確認","完了前なら開発許可・建築確認等を受けたか","変更確認申請中なら当初内容と予定を併記","取引態様の別を明示","表示内容に誤認のおそれがないか確認"]},"tables":[{"title":"時期制限の適用範囲","head":["取引","広告開始時期","契約締結時期"],"rows":[["売買","○制限","○制限"],["交換","○制限","○制限"],["貸借","○制限","×制限なし"],["代理・媒介","○制限","○（貸借除く）"]]},{"title":"広告できるか","head":["状態","広告"],"rows":[["建築確認申請中","×"],["「確認申請済」と表示","×"],["建築確認後","○"],["確認後に変更確認申請中","○（併記すれば）"],["開発許可申請中","×"]]},{"title":"誇大広告の判定","head":["ケース","違反"],"rows":[["問合せがない","○違反"],["取引が成立しなかった","○違反"],["成約済み物件を掲載継続","○違反"],["利用制限の一部を省き誤認","○違反"],["ネット広告","○違反（媒体不問）"]]}]}},"業法|媒介契約":{"pts":["34条の2の規制は宅地建物の売買・交換の媒介・代理に適用され、貸借の媒介には適用されない。相手が宅建業者でも書面交付は必要。","契約後遅滞なく業者が記名押印した書面を交付する（依頼者の承諾で電磁的方法も可）。宅建士の記名は不要。","専任・専属専任の有効期間は3か月以内で、超える定めは3か月に短縮。更新は依頼者の申出による場合のみで、自動更新特約は無効。","業務処理状況の報告は専任が2週間に1回以上、専属専任が1週間に1回以上（休業日を含む）。方法は口頭でもよい。","指定流通機構への登録は専任が契約日から7日以内、専属専任が5日以内（いずれも休業日を除く）。登録証明書は遅滞なく依頼者に引き渡す。","申込みがあれば種類を問わず遅滞なく依頼者に報告する。価額に意見を述べるときは根拠を示す（方法自由・費用請求不可）。","書面には売買すべき価額、既存建物の建物状況調査を実施する者のあっせんに関する事項（あっせん無しでもその旨）等を記載する。"],"traps":["「専任媒介の登録期限は休業日を含めて7日以内」と出たら×。休業日を除いて7日以内。","「一般媒介なら書面に売買すべき価額の記載は不要」と出たら×。価額は全媒介契約の必要的記載事項。","「依頼者の申出がなければ自動更新する特約は有効」と出たら×。更新は依頼者の申出がある場合に限る。"],"rel":["業法|報酬","業法|重要事項説明","業法|37条書面"],"bridge":"媒介契約書は業者の記名押印で依頼者（売主側が多い）に交付、35条書面と37条書面は宅建士の記名が必要。誰が何に記名し誰に交付するかで混同しやすい。","sys":{"overview":"宅建業者の業務規制のうち、売買・交換の媒介・代理の依頼を受けた場面のルール。3種類の媒介契約の違い（有効期間・報告・指定流通機構登録）と、媒介契約書面の記載事項を数字ごと押さえれば得点源になる。","tree":[{"h":"適用範囲","items":["宅地建物の売買・交換の媒介・代理","貸借の媒介・代理には適用なし","依頼者が宅建業者でも適用あり"]},{"h":"契約の種類","items":["一般：複数業者に重ねて依頼可","専任：他業者への依頼不可・自己発見可","専属専任：自己発見取引も不可","一般は明示型・非明示型がある"]},{"h":"専任系の規制","items":["有効期間3か月以内（超過分は3か月に）","更新は依頼者の申出時のみ・自動更新不可","報告：専任2週1回・専属1週1回以上","機構登録：専任7日・専属5日（休業日除く）","申込み受付状況も登録し変更時は更新"]},{"h":"全類型の義務","items":["契約後遅滞なく書面交付（業者が記名押印）","依頼者の承諾で電磁的方法も可","価額の意見には根拠明示（費用請求不可）","申込みは遅滞なく依頼者へ報告"]},{"h":"書面記載事項","items":["物件特定・売買すべき価額・報酬","媒介契約の種類・有効期間・解除","建物状況調査のあっせんの有無（既存建物）","標準媒介契約約款に基づくか否か","依頼者の違反時の措置・機構登録事項"]}],"flow":{"title":"専任媒介の手続の流れ","steps":["依頼受付・価額に意見なら根拠を明示","媒介契約締結→遅滞なく書面交付","指定流通機構へ登録（専任7日・専属5日）","登録証明書を遅滞なく依頼者へ引渡し","業務処理状況を定期報告（2週・1週）","申込みがあれば遅滞なく依頼者へ報告","成約したら遅滞なく機構へ通知"]},"tables":[{"title":"媒介契約3類型の比較","head":["項目","一般","専任","専属専任"],"rows":[["他業者への重ねた依頼","○","×","×"],["自己発見取引","○","○","×"],["有効期間の制限","なし","3か月以内","3か月以内"],["業務処理状況の報告","義務なし","2週に1回以上","1週に1回以上"],["機構への登録","任意","7日以内","5日以内"],["申込みの報告","必要","必要","必要"],["書面の交付","必要","必要","必要"]]},{"title":"日数の数え方","head":["義務","期間","休業日"],"rows":[["機構登録（専任）","契約日から7日以内","除く"],["機構登録（専属専任）","契約日から5日以内","除く"],["業務報告（専任）","2週間に1回以上","含む"],["業務報告（専属専任）","1週間に1回以上","含む"]]}]}},"業法|重要事項説明":{"pts":["契約成立までに、宅建士が宅建士証を提示（請求不要）のうえ記名した35条書面を交付して、買主・借主等に説明する。売主・貸主への説明は不要。","相手方が宅建業者なら書面交付のみで説明は不要。相手方の承諾があれば電磁的方法での提供やIT重説も可だが、宅建士証の提示は省略できない。","既存建物では1年以内（共同住宅等は2年以内）の建物状況調査の有無と結果の概要を、売買・貸借とも説明する。","建築・維持保全の書類（検査済証・設計図書等）の保存状況は既存建物の売買・交換のみ説明。存在しなければその旨を説明する。","水害ハザードマップ上の所在地、造成宅地防災区域・土砂災害警戒区域・津波災害警戒区域内である旨は、売買・貸借を問わず説明する。","石綿調査の記録があればその内容、旧耐震（昭和56年5月31日以前着工）の耐震診断があればその内容を説明。業者に調査義務はない。","登記された権利（抹消予定でも）、代金以外の金銭の額と目的、契約解除、損害賠償予定・違約金、手付金等保全措置、担保責任の履行確保措置等を説明。"],"traps":["「代金の額・支払時期」「引渡しの時期」を重要事項として説明と出たら×。これらは37条書面の記載事項。","「IT重説なら相手方の承諾で宅建士証の提示を省略できる」と出たら×。画面上で視認できるよう提示が必要。","「水害ハザードマップの説明は貸借では不要」と出たら×。売買・交換・貸借いずれも必要。"],"rel":["業法|37条書面","業法|宅建士","業法|住宅瑕疵担保履行法"],"bridge":"35条は契約前に買主・借主へ説明（宅建士必須）、37条は契約後に両当事者へ交付（説明不要）。記載事項の振り分けが頻出で、引渡し時期・代金は37条側。","sys":{"overview":"宅建業法35条。契約成立前に、宅建士が買主・借主等へ書面を交付して説明する義務で、業法で最頻出の論点。説明の方法（誰が・誰に・いつ）と、売買／貸借・区分所有建物ごとの説明事項の振り分けが得点の鍵。","tree":[{"h":"説明の方法","items":["契約成立までに宅建士が説明（専任不要）","宅建士証は請求なしで提示・記名した書面","相手：買主・借主・交換の両当事者","売主・貸主への説明は不要","場所の制限なし"]},{"h":"特例","items":["相手方が業者なら書面交付のみで説明不要","承諾があれば書面を電磁的方法で提供可","IT重説も可。画面で宅建士証の提示必要"]},{"h":"物件の事項","items":["登記された権利（抹消予定でも）","法令上の制限・私道負担","飲用水・電気・ガス・排水の整備状況","未完成物件は完了時の形状・構造","災害区域・水害ハザードマップ上の所在地"]},{"h":"既存建物","items":["建物状況調査の有無・結果概要","調査は1年以内（RC共同住宅等は2年）","建築・維持保全書類の保存状況（売買のみ）","石綿調査の記録があればその内容","耐震診断はS56.6.1前着工の建物のみ"]},{"h":"取引条件","items":["代金・借賃以外の金銭の額と目的","契約解除・損害賠償予定・違約金","手付金等保全措置・支払金預り金保全","ローンのあっせん内容と不成立時の措置","担保責任の履行確保措置の有無"]},{"h":"区分・貸借","items":["区分：敷地権利・共用部分規約・積立金等","区分売買：管理業者が管理者を兼ねる旨","貸借：期間・更新・用途制限・敷金精算","貸借：管理委託先、建物は台所等の設備","定期借地・定期建物賃貸借である旨"]}],"flow":null,"tables":[{"title":"35条と37条の比較","head":["項目","35条書面","37条書面"],"rows":[["時期","契約成立まで","契約成立後遅滞なく"],["相手","買主・借主等","契約当事者双方"],["宅建士の記名","必要","必要"],["宅建士の説明","必要（業者相手は不要）","不要"],["宅建士証の提示","説明時に必要","不要"],["電磁的方法","承諾で可","承諾で可"],["代金額・引渡し時期","記載不要","必要的記載事項"]]},{"title":"取引態様別の説明要否","head":["説明事項","売買","貸借"],"rows":[["登記された権利","○","○"],["私道負担","○","建物貸借は×"],["建物状況調査の結果概要","○（既存）","○（既存）"],["建築・維持保全書類の保存","○（既存）","×"],["水害ハザードマップの所在地","○","○"],["石綿調査記録・耐震診断","建物のみ○","建物のみ○"],["手付金等保全措置","○","×"],["担保責任の履行確保措置","○","×"],["契約期間・更新・敷金精算","×","○"]]},{"title":"区分所有建物の追加事項","head":["説明事項","売買","貸借"],"rows":[["敷地に関する権利","○","×"],["共用部分の規約","○","×"],["専有部分の用途・利用制限","○","○"],["専用使用権の規約","○","×"],["修繕積立金・管理費","○","×"],["維持修繕の実施状況の記録","○","×"],["管理の委託先","○","○"],["管理業者が管理者等を兼ねる旨","○","×"]]}]}},"業法|37条書面":{"pts":["契約成立後遅滞なく、契約当事者双方（自ら当事者なら相手方）に交付する。関与した業者全員に交付義務があり、相手方の承諾でも省略不可。","宅建士の記名が必要（専任でなくてよい、押印は不要）。説明義務はなく、交付は宅建士でない従業者でもよい。","相手方が宅建業者でも交付・宅建士の記名・必要的記載事項は省略できない。相手方の承諾があれば電磁的方法での提供も可。","必要的記載事項は当事者の氏名・住所、物件特定表示、代金・借賃の額と支払時期・方法、引渡し時期、売買では移転登記の申請時期など。","既存建物の売買・交換では、構造耐力上主要な部分等の状況について当事者双方が確認した事項が必要的記載事項（貸借は不要）。","任意的記載事項（解除、損害賠償予定・違約金、代金等以外の金銭、危険負担、担保責任特約、租税公課の負担等）は定めがあれば記載。","代金等以外の金銭は額・授受の時期・目的のすべてを記載する。未完成建物は重説で使用した図書の交付で特定表示に代えられる。"],"traps":["「37条書面は宅建士に内容を説明させなければならない」と出たら×。記名は必要だが説明義務はない。","「定めがなければ『定めなし』と記載する」と出たら×。任意的記載事項は定めがなければ記載不要。","「登記された抵当権の内容を37条書面に記載」と出たら×。登記された権利は35条書面の説明事項。"],"rel":["業法|重要事項説明","業法|媒介契約","業法|クーリング・オフ"],"bridge":"35条は契約前に説明、37条は契約後に交付で説明不要。クーリング・オフの告知書面は宅建士の記名不要で、書面ごとに記名の主体と要否を比較して覚える。","sys":{"overview":"宅建業法37条。契約成立後に、契約内容を書面化して当事者双方へ交付する義務。35条書面との違い（時期・相手・説明不要）と、必要的記載事項／任意的記載事項の振り分け、売買と貸借の差を押さえる。","tree":[{"h":"交付の方法","items":["契約成立後遅滞なく交付","相手：契約当事者双方（自ら当事者は相手方）","関与した業者全員に交付義務","承諾があれば電磁的方法で提供可"]},{"h":"宅建士の関与","items":["宅建士の記名が必要（専任不要・押印不要）","説明義務なし","交付は宅建士でない従業者でも可"]},{"h":"業者間の扱い","items":["相手方が業者でも交付省略不可","記名・記載事項も省略不可","承諾があっても交付は省略不可"]},{"h":"必要的記載","items":["当事者の氏名・住所、物件の特定表示","代金・借賃の額、支払時期・方法","引渡し時期","移転登記の申請時期（売買・交換）","既存建物の構造等の双方確認事項（売買）"]},{"h":"任意的記載","items":["代金等以外の金銭：額・時期・目的","契約解除、損害賠償予定・違約金","危険負担（天災等の損害負担）","担保責任の特約・履行確保措置","ローン不成立時の措置、租税公課の負担"]}],"flow":null,"tables":[{"title":"売買と貸借の記載事項","head":["記載事項","売買","貸借"],"rows":[["代金・借賃の額・支払時期・方法","必要","必要"],["引渡し時期","必要","必要"],["移転登記の申請時期","必要","不要"],["既存建物の構造等確認事項","必要","不要"],["代金等以外の金銭","定めあれば","定めあれば"],["解除・損害賠償予定・違約金","定めあれば","定めあれば"],["危険負担","定めあれば","定めあれば"],["担保責任・ローンあっせん","定めあれば","不要"],["租税公課の負担","定めあれば","不要"]]},{"title":"書面ごとの記名と説明","head":["書面","記名する者","説明"],"rows":[["媒介契約書","宅建業者（記名押印）","不要"],["35条書面","宅建士","宅建士が説明"],["37条書面","宅建士","不要"],["クーリング・オフ告知書面","宅建士の記名不要","書面で告知"]]}]}},"業法|クーリング・オフ":{"pts":["宅建業者が自ら売主、買主が宅建業者でない売買で、事務所等以外の場所で申込み・契約をした場合に適用される。申込み場所で判断する。","事務所等には、事務所、契約行為等を行う土地に定着した案内所、媒介・代理業者の事務所等、買主が自ら申し出た自宅・勤務先が含まれる。","業者から書面で告げられた日から起算して8日を経過するか、引渡しを受け、かつ代金全部を支払ったときはできなくなる。","告知・撤回等は書面で行い、電磁的方法は不可。撤回等の効力は書面を発した時に生じる（発信主義）。告知書面に宅建士の記名は不要。","業者は損害賠償・違約金を請求できず、受領した手付金その他の金銭を速やかに全額返還する。","クーリング・オフの規定に反する買主に不利な特約は無効。期間を8日より長くするなど買主に有利な特約は有効。","テント張りなど土地に定着しない案内所や喫茶店・ホテルのロビー、業者の申出による買主の自宅・勤務先は事務所等に当たらない。"],"traps":["「買主の承諾があれば告知・撤回を電磁的方法で行える」と出たら×。書面に限られる。","「解除の効力は書面が業者に到達した時に生じる」と出たら×。書面を発した時に生じる。","「引渡しを受けたらクーリング・オフできない」と出たら×。引渡し＋代金全額支払の両方が必要。"],"rel":["業法|8種制限","業法|事務所・案内所","業法|37条書面"],"bridge":"クーリング・オフは8種制限の一つで、業者が売主・買主が非業者の取引に限られる。「事務所等」の範囲は専任宅建士を置く案内所の規制とセットで覚える。","sys":{"overview":"8種制限の一つ（宅建業法37条の2）。業者が自ら売主・買主が非業者の売買で、事務所等以外で申込み等をした買主を保護する制度。「事務所等」の範囲、8日の起算点、書面・発信主義を押さえる。","tree":[{"h":"適用要件","items":["宅建業者が自ら売主・買主は非業者","事務所等以外で申込み・契約","申込みと契約の場所が違えば申込み場所で判断"]},{"h":"事務所等","items":["売主業者の事務所","土地に定着し契約等を行う案内所","媒介・代理業者の事務所等","買主が自ら申し出た自宅・勤務先"]},{"h":"事務所等外","items":["テント張りなど定着しない案内所","喫茶店・ホテルのロビー","業者の申出による自宅・勤務先"]},{"h":"できない時","items":["書面告知の日から起算して8日経過","引渡し＋代金全額支払の両方済み","告知がなければ8日の期間は進行しない"]},{"h":"方法と効果","items":["告知・撤回等とも書面（電磁的方法不可）","効力は書面を発した時（発信主義）","損害賠償・違約金の請求不可","手付金等は速やかに全額返還","買主に不利な特約は無効、有利は有効"]}],"flow":{"title":"クーリング・オフ可否の判定","steps":["売主が業者・買主が非業者か（違えば不可）","申込み場所は事務所等か（該当なら不可）","自宅・勤務先は誰の申出か確認","書面告知から8日経過していないか","引渡し＋代金全額支払が済んでいないか","すべてクリアなら書面で撤回・解除可"]},"tables":[{"title":"場所ごとの可否","head":["申込みの場所","C・O"],"rows":[["売主業者の事務所","不可"],["媒介・代理業者の事務所","不可"],["土地に定着した案内所（契約等を行う）","不可"],["テント張りの案内所","可"],["喫茶店・ホテルのロビー","可"],["買主が申し出た自宅・勤務先","不可"],["業者が申し出た自宅・勤務先","可"]]},{"title":"書面と時点の整理","head":["場面","ルール"],"rows":[["業者の告知","書面のみ・宅建士記名不要"],["買主の撤回・解除","書面のみ"],["効力発生","書面を発した時"],["期間","告知日から起算8日"],["期間延長の特約","有効（買主に有利）"]]}]}},"業法|8種制限":{"pts":["8種制限は宅建業者が自ら売主、買主が宅建業者でない場合のみ適用。業者間取引には適用されない。","損害賠償額の予定と違約金は合算して代金の2/10以内。超える部分は無効。予定がなければ実損額を請求できる。","手付は代金の2/10以内で、常に解約手付となる。相手方の履行着手前なら、買主は放棄、売主業者は倍額の現実の提供で解除できる。","担保責任の通知期間を「引渡しから2年以上」とする特約以外で民法より買主に不利な特約は無効。無効なら民法の原則（知った時から1年）に戻る。","手付金等保全措置は未完成物件で代金の5%超又は1,000万円超、完成物件で10%超又は1,000万円超のとき、受領前に講じる。","未完成物件の保全措置は保証委託契約か保証保険契約のみ、完成物件はこれに指定保管機関の手付金等寄託契約が加わる。講じなければ買主は支払拒否できる。","他人物・未完成物件の売買は原則禁止（停止条件付取得契約は不可）。割賦販売の解除は30日以上の書面催告が必要、代金の3/10超受領後は所有権留保不可。"],"traps":["「担保責任を引渡しから1年とする特約は有効」と出たら×。2年以上でなければ無効。","「売主業者は手付と同額を返還すれば解除できる」と出たら×。倍額を現実に提供する必要がある。","「業者間取引でも損害賠償予定は2割まで」と出たら×。8種制限は業者間には適用されない。"],"rel":["業法|クーリング・オフ","権利|売買・契約不適合","業法|住宅瑕疵担保履行法"],"bridge":"8種制限は民法の売買・契約不適合の原則を買主有利に修正するもの。新築住宅の構造部分の10年責任は品確法・履行法の資力確保措置とセットで出る。","sys":{"overview":"宅建業者が自ら売主・買主が非業者の売買にだけ適用される8つの規制（業者間には不適用）。民法の原則を買主有利に修正する点が軸で、2/10・5%・10%・1,000万円・2年・30日・3/10の数字が頻出。","tree":[{"h":"適用場面","items":["業者が自ら売主・買主が非業者","業者間取引・業者が買主の場合は不適用","媒介・代理の場合は不適用"]},{"h":"契約の制限","items":["クーリング・オフ（8日）","他人物・未完成物件の売買の原則禁止","未完成は保全措置を講じれば売買可","損害賠償予定＋違約金は合計2/10以内"]},{"h":"手付の規制","items":["手付は代金の2/10以内・常に解約手付","相手方の履行着手前なら解除可","買主は放棄、売主は倍額を現実に提供","買主に不利な特約は無効"]},{"h":"保全措置","items":["未完成：5%超又は1,000万円超で必要","完成：10%超又は1,000万円超で必要","受領前に講じる。なければ支払拒否可","買主が所有権登記をしたら不要"]},{"h":"担保責任","items":["民法より買主に不利な特約は無効","例外：通知期間を引渡しから2年以上","無効なら民法（知った時から1年通知）"]},{"h":"割賦販売","items":["解除・一括請求は30日以上の書面催告","3/10超受領後は所有権留保不可","譲渡担保による留保も同様に制限"]}],"flow":{"title":"手付金等保全措置の要否","steps":["業者が売主・買主は非業者か確認","買主が所有権登記をしたか（済なら不要）","契約時に未完成物件か完成物件か判定","受領額累計が代金の5%（完成10%）超か","又は1,000万円超か（どちらも以下なら不要）","超えるなら受領前に全額について措置"]},"tables":[{"title":"8種制限の一覧","head":["制限","ポイント"],"rows":[["クーリング・オフ","告知から8日・書面・発信主義"],["他人物売買等の制限","取得契約（停止条件付除く）・保全措置で可"],["損害賠償予定等","違約金と合計2/10以内"],["手付の額・性質","2/10以内・解約手付"],["手付金等保全措置","未完成5%・完成10%・1,000万円"],["担保責任の特約","引渡しから2年以上のみ有効"],["割賦販売の解除等","30日以上の書面催告"],["所有権留保等の禁止","3/10超受領後は留保不可"]]},{"title":"保全措置の比較","head":["項目","未完成物件","完成物件"],"rows":[["必要となる額","5%超又は1,000万円超","10%超又は1,000万円超"],["保証委託契約","○","○"],["保証保険契約","○","○"],["指定保管機関の寄託","×","○"]]},{"title":"代金別の上限（計算例）","head":["代金","手付・賠償予定上限","保全不要の上限"],"rows":[["2,000万円・未完成","400万円","100万円まで"],["2,000万円・完成","400万円","200万円まで"],["5,000万円・未完成","1,000万円","250万円まで"],["1億2,000万円・完成","2,400万円","1,000万円まで"]]}]}},"業法|報酬":{"pts":["売買の媒介の上限は、代金（税抜）200万円以下5%、200万円超400万円以下4%、400万円超3%。400万円超は「3%＋6万円」で計算し消費税を加える。","代理は媒介の2倍以内。同一取引で双方から受領する場合も合計で媒介報酬の2倍以内に収める。","代金800万円以下の宅地建物（低廉な空家等）の売買・交換の媒介は、事前に依頼者と合意すれば売主・買主それぞれから30万円（＋税）まで受領できる（2024年改正）。代理はその2倍以内。","貸借の媒介は双方合計で借賃1か月分（＋税）以内。居住用建物は承諾がない限り依頼者の一方から0.5か月分（＋税）まで。","長期の空家等（1年超不使用等）の貸借の媒介は、事前合意により貸主・借主合計で借賃2か月分（＋税）まで受領できる特例があるが、居住用の借主からは通常どおり0.5か月分（＋税）が上限。","居住用以外の建物の貸借で権利金の授受があれば、権利金を売買代金とみなして計算できる。居住用建物には適用されない。","報酬とは別に受領できるのは、依頼者の依頼による広告料金と、依頼者の特別の依頼による費用で事前に承諾を得たものだけ。"],"traps":["「双方の承諾があれば居住用貸借で合計1か月分超を受領できる」と出たら×。合計1か月分（＋税）が上限（長期の空家等の特例を除く）。","「低廉な空家等の特例は売主からの報酬のみ」と出たら×。2024年改正で買主からの媒介報酬にも適用される。","「契約書作成費用を報酬とは別に受領できる」と出たら×。通常業務の費用は報酬に含まれる。"],"rel":["業法|媒介契約","業法|広告","業法|監督・罰則"],"bridge":"報酬は媒介契約に基づく成功報酬で、上限超過は業務停止処分や罰則の対象。依頼者の依頼による広告料金のみ別途受領できる点が広告の論点と交差する。","sys":{"overview":"宅建業法46条と国土交通大臣告示による報酬の上限規制。売買の速算式（5%・4%＋2万・3%＋6万）、代理は2倍、貸借は1か月分、居住用は0.5か月分、2024年改正の空家等特例を計算できれば得点できる。","tree":[{"h":"売買の媒介","items":["200万円以下：5%","200万超400万以下：4%＋2万円","400万円超：3%＋6万円","代金は税抜で計算し最後に消費税加算","交換は高い方の価額で計算","免税業者は税抜額に4%上乗せ"]},{"h":"売買の代理","items":["媒介報酬の2倍以内","相手方からも受領なら合計2倍以内"]},{"h":"空家等特例","items":["800万円以下の宅地建物（低廉な空家等）","売主・買主それぞれ30万円（＋税）まで","事前に依頼者へ説明し合意が必要","長期空家等の貸借：合計2か月分まで","長期空家等＝1年超不使用等の建物","代理の特例は媒介特例額の2倍以内"]},{"h":"貸借","items":["双方合計で借賃1か月分（＋税）以内","居住用建物：一方から0.5か月分","居住用でも依頼者の承諾で一方1か月分可","非居住用は権利金を代金とみなし計算可"]},{"h":"別途受領","items":["依頼者の依頼による広告料金","特別の依頼による費用で事前承諾あり","契約書作成費等の通常費用は不可"]}],"flow":null,"tables":[{"title":"売買媒介の速算式","head":["代金（税抜）","上限（税抜）"],"rows":[["200万円以下","代金×5%"],["200万円超400万円以下","代金×4%＋2万円"],["400万円超","代金×3%＋6万円"],["800万円以下の空家等","各依頼者から30万円まで（事前合意）"],["代理","上記の2倍以内"]]},{"title":"貸借の報酬上限","head":["区分","上限（税抜）"],"rows":[["貸借の媒介（原則）","双方合計で借賃1か月分"],["居住用建物の媒介","一方から0.5か月分（承諾で1か月）"],["貸借の代理","借賃1か月分（相手方と合計）"],["非居住用で権利金あり","権利金を代金とみなし計算可"],["長期の空家等（特例）","貸主から上乗せ、合計2か月分"],["使用貸借","通常の借賃を基準に計算"]]},{"title":"計算例（課税業者）","head":["取引","税抜","税込"],"rows":[["売買媒介 1,000万円","36万円","39.6万円"],["売買代理 1,000万円","72万円","79.2万円"],["売買媒介 300万円","14万円","15.4万円"],["600万円・空家特例（一方から）","30万円","33万円"],["居住用貸借 月10万円・一方","5万円","5.5万円"]]}]}},"業法|監督・罰則":{"pts":["必要的取消は欠格事由該当、不正手段による免許取得、業務停止事由で情状が特に重い、業務停止処分違反、免許後1年以内の事業不開始・1年以上休止など。","免許の条件違反、事務所の所在地等を確知できず公告から30日を経過しても申出がない場合は任意的取消。","指示・業務停止は免許権者のほか業務地の知事もできるが、免許取消は免許権者だけができる。業務停止は1年以内の期間。","監督処分の前には聴聞が必要で、審理は公開で行う。業務停止と免許取消は公告が必要、指示処分は公告不要。","国土交通大臣が消費者保護に関わる規定違反で大臣免許業者を処分する場合は、あらかじめ内閣総理大臣に協議する。","無免許営業・名義貸し・不正免許取得・業務停止違反は3年以下の拘禁刑か300万円以下の罰金（併科あり）、法人は1億円以下の罰金。","重要な事項の不告知・不実告知は2年以下の拘禁刑等、誇大広告は6か月以下の拘禁刑等。報酬額不掲示・標識不掲示は50万円以下の罰金。"],"traps":["「免許の条件違反は必ず取り消さなければならない」と出たら×。取り消すことが「できる」任意的取消。","「業務停止処分をしたときは公告不要」と出たら×。業務停止・免許取消は公告が必要で、不要なのは指示処分だけ。","「知事が大臣免許業者を処分するとき内閣総理大臣と協議」と出たら×。協議が必要なのは国土交通大臣が処分する場合。"],"rel":["業法|免許の基準","業法|免許","業法|宅建士"],"bridge":"必要的取消の多くは免許の基準（欠格事由）と表裏一体。宅建士に対する監督（指示・事務禁止・登録消除）も同じ構造なので並べて覚える。","sys":{"overview":"宅建業者・宅建士の違反に対する行政処分（指示・業務停止・免許取消）と刑事罰。必要的取消と任意的取消の区別、処分権者（免許権者／業務地の知事）、聴聞・公告の要否、罰則の重さの序列を押さえる。","tree":[{"h":"業者の処分","items":["指示処分：免許権者・業務地の知事","業務停止（1年以内）：同上","免許取消：免許権者のみ"]},{"h":"必要的取消","items":["欠格事由に該当","不正の手段で免許取得","業務停止事由で情状特に重い・停止違反","免許後1年以内に事業不開始・1年以上休止"]},{"h":"任意的取消","items":["免許に付された条件に違反","所在不明で公告後30日経過し申出なし"]},{"h":"手続","items":["処分前に聴聞（審理は公開）","聴聞は期日1週間前までに通知・公示","業務停止・取消は公告、指示は不要","大臣が消費者保護規定違反で処分→首相協議","知事が他の免許業者を処分→免許権者に報告等"]},{"h":"宅建士処分","items":["指示・事務禁止（1年以内）","登録消除は登録知事のみ","指示・事務禁止は行為地の知事も可"]},{"h":"罰則","items":["無免許・名義貸し等：3年以下拘禁刑","重要事項の不告知等：2年以下拘禁刑","誇大広告：6か月以下拘禁刑","法人重科：最大1億円以下の罰金"]}],"flow":{"title":"業者への監督処分の流れ","steps":["違反行為の発覚（報告徴収・立入検査等）","処分権者を確認（取消は免許権者のみ）","大臣処分で消費者保護規定なら首相と協議","聴聞を実施（期日の審理は公開）","指示・業務停止・免許取消の処分","業務停止・免許取消は公告（指示は不要）","他の行政庁が処分したら免許権者へ報告等"]},"tables":[{"title":"監督処分の比較","head":["処分","処分権者","公告"],"rows":[["指示処分","免許権者・業務地知事","不要"],["業務停止（1年以内）","免許権者・業務地知事","必要"],["免許取消","免許権者のみ","必要"],["宅建士の事務禁止","登録知事・行為地知事","不要"],["宅建士の登録消除","登録知事のみ","不要"]]},{"title":"主な罰則","head":["違反","罰則"],"rows":[["無免許営業・名義貸し","3年以下拘禁刑・300万円以下"],["不正手段の免許取得","3年以下拘禁刑・300万円以下"],["業務停止処分違反","3年以下拘禁刑・300万円以下"],["重要事項の不告知・不実告知","2年以下拘禁刑・300万円以下"],["不当に高額の報酬の要求","1年以下拘禁刑・100万円以下"],["誇大広告","6か月以下拘禁刑・100万円以下"],["限度額を超える報酬の受領","100万円以下の罰金"],["37条書面の不交付","50万円以下の罰金"],["報酬額・標識の不掲示","50万円以下の罰金"],["重説時の士証不提示・提出・返納違反","10万円以下の過料"]]}]}},"業法|住宅瑕疵担保履行法":{"pts":["宅建業者が自ら売主となり、宅建業者でない買主に新築住宅を引き渡す場合に、保証金の供託か保険契約締結による資力確保措置が必要。","対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵。これらの免責特約は品確法上無効で、資力確保義務は残る。","保証金は主たる事務所の最寄りの供託所に供託。販売戸数の算定では床面積55㎡以下の住宅は2戸をもって1戸と数える。","保険契約は国土交通大臣指定の保険法人と締結し、引渡しから10年以上有効でなければならない。買主の承諾があっても短縮できない。","基準日（毎年3月31日）ごとに、基準日から3週間以内に資力確保措置の状況を免許権者に届け出る。","届出をしないと、基準日の翌日から起算して50日を経過した日以後、新たに自ら売主となる新築住宅の売買契約を締結できない。","供託する場合は契約締結までに供託所の所在地等を書面（承諾があれば電磁的方法）で説明する。保険付き住宅は指定住宅紛争処理機関を利用できる。"],"traps":["「買主が宅建業者でも資力確保措置が必要」と出たら×。資力確保措置は買主が宅建業者でない場合に限られる。","「保証金は販売した新築住宅の所在地の最寄りの供託所に供託」と出たら×。主たる事務所の最寄りの供託所。","「床面積25㎡以下は3戸を1戸と数える」と出たら×。55㎡以下は2戸をもって1戸。"],"rel":["業法|8種制限","業法|営業保証金","業法|重要事項説明"],"bridge":"8種制限の担保責任特約制限が「特約の効力」の問題なのに対し、履行法は責任を確実に果たすための「お金の手当て」。供託先が主たる事務所最寄りという点は営業保証金と共通。","sys":{"overview":"品確法の新築住宅10年責任を確実に履行させるため、業者売主に保証金供託か保険加入を義務づける法律。適用場面、供託先、55㎡・2戸1戸、10年以上、基準日3月31日・3週間・50日の数字を押さえる。","tree":[{"h":"適用場面","items":["業者が自ら売主・買主は非業者","新築住宅の引渡し（媒介は対象外）","買主が業者なら資力確保措置不要","新築＝完成1年内かつ未入居の住宅"]},{"h":"対象の瑕疵","items":["構造耐力上主要な部分","雨水の浸入を防止する部分","品確法で10年責任・免責特約は無効"]},{"h":"保証金供託","items":["主たる事務所の最寄りの供託所","過去10年の供給戸数に応じた額","55㎡以下は2戸をもって1戸","契約締結までに供託所所在地等を書面説明"]},{"h":"保険契約","items":["国土交通大臣指定の保険法人と締結","引渡しから10年以上有効","買主の承諾でも期間短縮不可","保険付き住宅は指定住宅紛争処理機関可"]},{"h":"届出","items":["基準日：毎年3月31日","基準日から3週間以内に免許権者へ届出","未届出：基準日翌日から50日経過日以後","新たな新築住宅の売買契約が禁止"]}],"flow":{"title":"資力確保措置の手順","steps":["売主業者・非業者買主・新築住宅か確認","供託か保険契約かを選択","供託なら契約締結までに供託所等を説明","引渡し（保険は10年以上有効で締結）","基準日（3月31日）の状況を集計","3週間以内に免許権者へ届出"]},"tables":[{"title":"履行法の重要数字","head":["項目","内容"],"rows":[["責任期間","引渡しから10年"],["保険の有効期間","10年以上"],["戸数算定の特例","55㎡以下は2戸で1戸"],["基準日","毎年3月31日"],["届出期限","基準日から3週間以内"],["新規契約禁止","基準日翌日から50日経過日以後"]]},{"title":"営業保証金との比較","head":["項目","営業保証金","瑕疵担保保証金"],"rows":[["供託先","主たる事務所最寄り","主たる事務所最寄り"],["対象者","全宅建業者","新築住宅の業者売主"],["額の基準","事務所数","過去10年の供給戸数"],["保険で代替","×","○（保険契約）"]]}]}},"権利|意思表示・行為能力":{"pts":["通謀虚偽表示は当事者間で無効。ただし無効を善意の第三者に対抗できず、第三者は無過失や登記を要しない（94条2項）。","錯誤は無効でなく取消し。重要な錯誤が要件で、動機の錯誤はその事情が法律行為の基礎とされていると表示されていた場合に限る。","表意者に重過失があると錯誤取消しはできない。ただし相手方が悪意・重過失のとき又は共通錯誤のときは取り消せる。","詐欺取消しは善意無過失の第三者に対抗できない。第三者詐欺は相手方が詐欺を知り又は知ることができたときに限り取り消せる。","強迫による取消しは、第三者が善意無過失でも対抗できる。第三者による強迫でも相手方の善意・悪意を問わず取り消せる。","成年は18歳。未成年者の行為は法定代理人の同意が必要だが、単に権利を得・義務を免れる行為や許可された営業は単独でできる。","成年被後見人の行為は後見人の同意があっても取り消せる（日用品の購入等を除く）。制限行為能力者が詐術を用いたときは取消し不可。"],"traps":["「錯誤による意思表示は無効」と出たら×。2020年改正後は取消しで、善意無過失の第三者には対抗できない。","「虚偽表示の第三者は善意無過失でなければ保護されない」と出たら×。94条2項は善意で足り、登記も不要。","「強迫の取消しは善意無過失の第三者に対抗できない」と出たら×。保護されないのは詐欺の場合で、強迫は対抗できる。"],"rel":["権利|代理","権利|物権変動・対抗"],"bridge":"代理では意思表示の瑕疵を原則として代理人について判断する。取消し前の第三者は意思表示の規定で、取消し後の第三者は登記の先後（177条）で処理する。","sys":{"overview":"民法総則のうち、契約が有効に成立するかを左右する分野。意思表示の5類型（心裡留保・虚偽表示・錯誤・詐欺・強迫）の効果と第三者保護要件、制限行為能力者4類型の保護者の権限を比較で押さえれば得点できる。","tree":[{"h":"意思の欠缺","items":["心裡留保：原則有効、相手方悪意・有過失なら無効","虚偽表示：当事者間で無効、善意の第三者に対抗不可","虚偽表示の第三者は善意で足り無過失・登記不要"]},{"h":"錯誤","items":["重要な錯誤なら取消し（無効ではない）","動機の錯誤は基礎事情の表示が必要","表意者に重過失→原則取消し不可","相手方悪意・重過失、共通錯誤なら重過失でも可","善意無過失の第三者に対抗不可"]},{"h":"詐欺・強迫","items":["詐欺：取消し、善意無過失の第三者に対抗不可","第三者詐欺：相手方が悪意・有過失なら取消し可","強迫：取消し、第三者が善意無過失でも対抗可","第三者強迫：相手方の善意悪意を問わず取消し可"]},{"h":"制限行為能力","items":["成年は18歳（婚姻による成年擬制は廃止）","未成年者：同意なき行為は取消し可","成年被後見人：同意があっても取消し可","被保佐人：13条所定の重要行為に同意必要","被補助人：審判で定めた特定の行為のみ同意必要"]},{"h":"例外・相手方","items":["単に権利を得・義務を免れる行為は単独で可","許可された営業はその営業に関してのみ単独で可","日用品の購入等は成年被後見人も取消し不可","詐術を用いたときは取消し不可（21条）","相手方の催告：1か月以上の期間を定める"]},{"h":"取消し・追認","items":["取消権は追認できる時から5年で消滅","行為の時から20年でも消滅","取消し後は初めから無効、現存利益の返還（制限行為能力者）","取消し後の第三者とは登記の先後で決まる"]}],"flow":{"title":"錯誤取消しの判定","steps":["錯誤が法律行為の目的・取引通念上重要か","動機の錯誤なら基礎事情が表示されていたか","表意者に重大な過失がないか","重過失でも相手方悪意・重過失か共通錯誤なら可","要件充足→取消し可（はじめから無効）","第三者が善意無過失なら取消しを対抗できない"]},"tables":[{"title":"意思表示の5類型比較","head":["類型","効果","善意の第三者"],"rows":[["心裡留保","原則有効（悪意・有過失の相手方→無効）","対抗不可（善意で保護）"],["虚偽表示","無効","対抗不可（善意で保護）"],["錯誤","取消し","善意無過失なら対抗不可"],["詐欺","取消し","善意無過失なら対抗不可"],["強迫","取消し","対抗できる（保護なし）"]]},{"title":"制限行為能力者4類型","head":["類型","保護者","同意権","代理権"],"rows":[["未成年者","親権者・未成年後見人","○","○"],["成年被後見人","成年後見人","×（同意しても取消可）","○"],["被保佐人","保佐人","○（13条の行為）","審判で付与"],["被補助人","補助人","審判で定めた行為","審判で付与"]]},{"title":"相手方の催告と確答なし","head":["催告の相手","確答なしの効果"],"rows":[["能力者となった本人","追認とみなす"],["法定代理人・保佐人・補助人","追認とみなす"],["被保佐人・被補助人本人","取消しとみなす"]]}]}},"権利|代理":{"pts":["代理人は行為能力者であることを要しない。制限行為能力者が代理人としてした行為は、行為能力の制限を理由に取り消せない。","自己契約・双方代理は無権代理とみなす。ただし債務の履行と本人があらかじめ許諾した行為は有効（108条）。","代理権濫用は、相手方が代理人の目的を知り又は知ることができたとき無権代理とみなす（107条）。","任意代理人は本人の許諾又はやむを得ない事由があるときのみ復代理人を選任可。法定代理人は自己の責任でいつでも選任できる。","代理権は本人の死亡、代理人の死亡・破産手続開始・後見開始で消滅する。任意代理では本人の破産手続開始でも消滅する。","無権代理の追認は契約時にさかのぼって効力を生ずる。相手方は催告でき、本人が期間内に確答しなければ追認拒絶とみなす。","表見代理（代理権授与表示・権限外・代理権消滅後）は相手方の善意無過失が必要。無権代理人の責任は相手方が選択できる。"],"traps":["「双方代理は本人の許諾があっても無効」と出たら×。あらかじめ許諾した行為や債務の履行は有効となる。","「無権代理の追認は追認の時から効力を生ずる」と出たら×。別段の意思表示がない限り契約時にさかのぼる。","「善意の相手方は表見代理を主張できる」と出たら要注意。表見代理は善意だけでなく無過失も必要で、過失があれば不成立。"],"rel":["権利|意思表示・行為能力","権利|相続"],"bridge":"代理行為の瑕疵は代理人を基準に判断し、意思表示の規定がそのまま使われる。無権代理と相続では、本人が相続すれば追認拒絶でき、無権代理人が単独相続すれば追認拒絶できない。","sys":{"overview":"民法総則の代理制度。有効な代理の3要件（代理権・顕名・代理行為）を軸に、代理権の制限（自己契約・双方代理・濫用）、復代理、消滅事由、無権代理と表見代理での相手方の手段を要件の違いで押さえる。","tree":[{"h":"代理の要件","items":["代理権の存在・顕名・代理行為の3つ","顕名なし→代理人自身の行為とみなす","相手方が悪意・有過失なら本人に効果（100条）","代理人は行為能力者でなくてよい（102条）","代理行為の瑕疵は原則代理人を基準に判断"]},{"h":"代理権の制限","items":["自己契約・双方代理は無権代理とみなす","債務の履行・本人があらかじめ許諾した行為は有効","利益相反行為も無権代理とみなす","濫用：相手方悪意・有過失なら無権代理とみなす"]},{"h":"復代理","items":["任意代理：本人の許諾かやむを得ない事由が必要","法定代理：自己の責任でいつでも選任可","復代理人は本人を直接代理する","代理人の代理権消滅で復代理権も消滅"]},{"h":"代理権の消滅","items":["本人の死亡","代理人の死亡・破産手続開始・後見開始","任意代理は本人の破産手続開始でも消滅","本人の後見開始は消滅事由でない"]},{"h":"無権代理","items":["本人は追認・追認拒絶できる","追認は契約時にさかのぼる（116条）","相手方：催告・取消し・責任追及","無権代理人の責任：履行か損害賠償を相手方が選択"]},{"h":"表見代理","items":["代理権授与表示（109条）","権限外の行為（110条）・正当な理由","代理権消滅後（112条）","いずれも相手方の善意無過失が必要","日常家事代理権を基本代理権とする110条の趣旨類推（判例）"]}],"flow":{"title":"無権代理の相手方の手段","steps":["本人に相当期間を定めて追認を催告（悪意でも可）","確答なし→追認拒絶とみなす","善意なら本人の追認前に契約を取り消せる","善意無過失なら表見代理の成立を主張","善意無過失なら無権代理人に履行か損害賠償請求","無権代理人が悪意なら相手方に過失があっても可"]},"tables":[{"title":"相手方の手段と要件","head":["手段","善意","無過失","備考"],"rows":[["催告","不要","不要","確答なし→追認拒絶"],["取消し","必要","不要","本人の追認前に限る"],["表見代理","必要","必要","本人に効果帰属"],["無権代理人の責任","必要","原則必要","代理人が制限行為能力者なら×"]]},{"title":"代理権の消滅事由","head":["事由","本人","代理人"],"rows":[["死亡","消滅","消滅"],["破産手続開始","任意代理のみ消滅","消滅"],["後見開始","消滅しない","消滅"]]},{"title":"無権代理と相続","head":["場面","追認拒絶"],"rows":[["無権代理人が本人を単独相続","×（できない）"],["本人が無権代理人を相続","○（ただし責任は承継）"],["無権代理人が他の相続人と共同相続","全員の追認がなければ当然有効とならない"]]}]}},"権利|時効":{"pts":["所有権の取得時効は、所有の意思をもって平穏・公然に占有し、占有開始時に善意無過失なら10年、それ以外は20年で完成する。","所有の意思は占有取得の原因（権原）で客観的に決まる。賃借人は何年占有しても原則として所有権を時効取得できない。","前の占有者の占有を併合でき、その場合は瑕疵も承継する。善意無過失は最初の占有者の占有開始時で判断する。","債権は、権利行使できることを知った時から5年、行使できる時から10年で時効消滅する。生命・身体侵害の損害賠償は後者が20年。","裁判上の請求は終了まで完成猶予、確定判決等で権利が確定すれば更新。確定せず終了したときは終了から6か月完成猶予にとどまる。","催告は6か月間の完成猶予のみで、猶予中の再度の催告に効力はない。承認は更新事由で、処分の行為能力・権限は不要。","時効は当事者（保証人・物上保証人・第三取得者等）が援用して初めて確定する。時効の利益は完成前に放棄できない。"],"traps":["「後順位抵当権者は先順位の被担保債権の消滅時効を援用できる」と出たら×。順位上昇は反射的利益で援用権者でない。","「時効完成を知らずに承認した債務者は時効を援用できる」と出たら×。判例は信義則上援用できないとする。","「途中で他人の物と知った占有者は所有の意思を失う」と出たら×。善意・悪意は占有開始時で判断し、所有の意思は失わない。"],"rel":["権利|物権変動・対抗","権利|保証・連帯債務"],"bridge":"時効取得者は時効完成前の第三者には登記なく対抗でき、完成後の第三者とは対抗関係になる。保証人は主債務の時効を援用でき、主債務者の時効利益放棄の効果は保証人に及ばない。","sys":{"overview":"民法総則の時効制度。取得時効（10年・20年）と消滅時効（5年・10年）の期間、完成猶予と更新の事由の区別、援用権者の範囲を整理すれば得点できる。2020年改正で「中断・停止」は「更新・完成猶予」に再編された。","tree":[{"h":"取得時効","items":["所有の意思・平穏・公然の占有","占有開始時に善意無過失→10年","それ以外→20年","所有の意思は権原で客観的に判断","賃借人を通じた間接占有でも可"]},{"h":"占有の承継","items":["前主の占有を併合できる（瑕疵も承継）","善意無過失は最初の占有者の開始時で判断","占有回収の訴えで回復→占有は継続扱い"]},{"h":"消滅時効","items":["債権：知った時から5年","債権：行使できる時から10年","生命・身体侵害の損害賠償：20年（客観）","債権以外の財産権：20年、所有権は消滅しない","判決で確定した権利：10年"]},{"h":"完成猶予","items":["裁判上の請求等：終了まで（不確定なら+6か月）","催告：6か月（再度の催告は無効）","協議の書面合意：最長1年、通算5年まで","仮差押え・仮処分：終了から6か月","天災等：障害消滅から3か月"]},{"h":"更新","items":["確定判決・裁判上の和解等で権利確定","強制執行等の終了","承認（処分の能力・権限は不要）","更新後は新たに時効が進行"]},{"h":"援用・放棄","items":["援用で効果確定、効果は起算日にさかのぼる","援用権者：保証人・物上保証人・第三取得者","後順位抵当権者は援用不可（判例）","完成前の放棄は不可、完成後の放棄は相対効","完成後の承認→知らなくても援用不可（判例）"]}],"flow":{"title":"時効の進行から完成まで","steps":["起算点：占有開始／権利行使可能・知った時","完成猶予事由が生じれば期間満了が延びる","更新事由が生じればゼロから再スタート","期間満了で時効完成","当事者が援用して効果が確定","効果は起算日にさかのぼる（144条）"]},"tables":[{"title":"時効期間の整理","head":["種類","期間","起算点"],"rows":[["所有権の取得（善意無過失）","10年","占有開始時"],["所有権の取得（上記以外）","20年","占有開始時"],["債権（主観）","5年","行使できると知った時"],["債権（客観）","10年","行使できる時"],["生命・身体侵害の損害賠償","5年／20年","知った時／行使できる時"],["債権・所有権以外の財産権","20年","行使できる時"],["判決で確定した権利","10年","確定時"]]},{"title":"完成猶予と更新","head":["事由","完成猶予","更新"],"rows":[["裁判上の請求","○ 終了まで","○ 権利確定時"],["請求の取下げ等","○ 終了から6か月","×"],["強制執行等","○ 終了まで","○ 終了時"],["仮差押え・仮処分","○ 終了から6か月","×"],["催告","○ 6か月","×"],["協議の書面合意","○ 最長1年","×"],["承認","—","○"]]},{"title":"援用権者に当たるか","head":["立場","援用"],"rows":[["保証人","○"],["物上保証人","○"],["抵当不動産の第三取得者","○"],["後順位抵当権者","×"],["一般債権者（原則）","×"]]}]}},"権利|物権変動・対抗":{"pts":["不動産物権の得喪変更は、登記がなければ第三者に対抗できない（177条）。二重譲渡の優劣は契約の先後でなく登記の先後で決まる。","177条の第三者は登記の欠缺を主張する正当な利益を有する者。不法占拠者・無権利者・背信的悪意者には登記なく対抗できる。","単なる悪意者は第三者に当たる。背信的悪意者からの転得者も、自身が背信的悪意者でなければ177条の第三者として保護される。","取消し前の第三者は意思表示の規定で処理し、取消し後の第三者とは登記の先後で決まる。解除後の第三者も登記の先後。","解除前の第三者は、善意・悪意を問わず権利保護要件として登記を備えれば保護される（545条1項ただし書）。","時効取得者は完成前の第三者には登記不要、完成後の第三者とは登記の先後。相続人が法定相続分を超える部分は登記なく対抗できない。","共同相続人の1人が勝手に単独名義で登記し譲渡しても、他の相続人の持分について譲受人は権利を取得できない（登記に公信力なし）。"],"traps":["「先に売買契約をした買主は登記がなくても後の買主に優先する」と出たら×。優劣は登記の先後で決まる。","「悪意の第二買主には登記なく対抗できる」と出たら×。単なる悪意者は177条の第三者で、対抗できないのは背信的悪意者のみ。","「解除前の第三者は善意であれば登記なしで保護される」と出たら×。善意悪意不問だが、登記は必要。"],"rel":["権利|不動産登記法","権利|意思表示・行為能力","権利|時効"],"bridge":"177条は「登記がなければ対抗できない」という実体法のルールで、不動産登記法はその登記の申請手続を定める。取消し・解除・時効・相続の各場面で、第三者が出現した時期により処理が変わる。","sys":{"overview":"物権編の基本原則。不動産の物権変動は登記がなければ第三者に対抗できない（177条）。「第三者」に当たる者・当たらない者の区別と、取消し・解除・時効・相続で第三者が現れた時期ごとの処理を図で押さえる。","tree":[{"h":"基本原則","items":["物権変動は意思表示のみで生じる（176条）","第三者への対抗には登記が必要（177条）","二重譲渡の優劣は登記の先後","登記に公信力はない"]},{"h":"第三者の範囲","items":["登記の欠缺を主張する正当な利益を有する者","単なる悪意者は第三者に当たる","背信的悪意者・不法占拠者・無権利者は除外","背信的悪意者からの転得者は保護されうる","順次譲渡の前々主は当事者類似で登記不要"]},{"h":"取消し・解除","items":["取消し前の第三者：意思表示の規定で判断","取消し後の第三者：登記の先後","解除前の第三者：善意悪意不問、登記が必要","解除後の第三者：登記の先後"]},{"h":"時効と登記","items":["完成前の第三者：登記なく対抗できる","完成後の第三者：登記の先後","起算点は任意に選べない（判例）"]},{"h":"相続と登記","items":["法定相続分は登記なく対抗できる","法定相続

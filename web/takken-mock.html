のための開発行為は公益上必要なので許可不要」と出たら×。病院・学校・社会福祉施設は公益の例外に当たらない。","「土地の区画形質の変更を伴わない建築にも開発許可が必要」と出たら×。開発許可は開発行為についてのもの。","「市街化区域内の農業用倉庫のための開発行為は規模を問わず許可不要」と出たら×。農林漁業用の例外は市街化区域外のみ。"],"rel":["法令|都市計画法","法令|盛土規制法","法令|土地区画整理法"],"bridge":"開発許可の要否面積は都市計画法の区域区分で決まる。開発許可を受けた土地は盛土規制法の許可を受けたものとみなされ、土地区画整理事業の施行として行う開発行為は許可不要。","sys":{"overview":"都市計画法のうち、土地の造成（区画形質の変更）段階の規制。開発行為の定義→許可不要の例外（規模・農林漁業・公益・事業）→申請手続→完了公告前後の建築制限の順に押さえれば得点できる。","tree":[{"h":"開発行為","items":["建築物・特定工作物のための区画形質の変更","第一種特定工作物：コンクリートプラント等","第二種：ゴルフコース（規模不問）","第二種：1ha以上の野球場・遊園地・墓園等","区画形質の変更なしの建築は許可不要"]},{"h":"許可不要","items":["区域ごとの規模未満（市街化1,000㎡未満等）","市街化区域外の農林漁業用建築物・農家住宅","駅舎・図書館・公民館・変電所等の公益施設","都市計画事業・区画整理事業等の施行として","非常災害の応急措置・通常の管理行為等"]},{"h":"申請・許可","items":["既存公共施設の管理者と協議し同意","新設公共施設の管理者となる者と協議","申請は書面、処分も遅滞なく文書で","33条技術基準：全区域に適用","34条立地基準：市街化調整区域のみ"]},{"h":"許可後","items":["知事が開発登録簿に登録・閲覧","軽微な変更は届出、その他の変更は許可","廃止は遅滞なく知事へ届出","一般承継は当然、特定承継は知事の承認"]},{"h":"建築制限","items":["完了公告前：原則建築不可（例外3つ）","公告後：予定建築物以外は原則不可","用途地域が定められていれば公告後の制限なし","調整区域の開発区域外の建築も原則許可"]}],"flow":{"title":"開発許可の流れ","steps":["公共施設管理者と協議・同意","知事へ書面で許可申請","許可・不許可を文書で通知","開発登録簿に登録","工事完了を知事へ届出・検査","検査済証交付→工事完了公告","公共施設は翌日原則市町村管理へ"]},"tables":[{"title":"許可不要となる規模","head":["区域","許可不要の規模"],"rows":[["市街化区域","1,000㎡未満"],["三大都市圏の既成市街地等","500㎡未満"],["市街化調整区域","規模の例外なし"],["非線引都市計画区域","3,000㎡未満"],["準都市計画区域","3,000㎡未満"],["都市計画区域・準都計区域外","1ha未満"]]},{"title":"主な例外と区域","head":["例外","市街化区域","それ以外"],"rows":[["農林漁業用建築物・農家住宅","×（規模で判断）","○不要"],["駅舎・図書館・公民館・変電所","○不要","○不要"],["病院・学校・社会福祉施設","×必要","×必要"],["区画整理・都市計画事業の施行","○不要","○不要"],["非常災害の応急措置","○不要","○不要"]]},{"title":"完了公告前に建築できる例外","head":["例外","可否"],"rows":[["工事用の仮設建築物","○"],["知事が支障ないと認めたもの","○"],["開発に不同意の土地所有者等","○"],["上記以外","×"]]}]}},"法令|建築基準法":{"pts":["2025年4月改正で、階数2以上又は延べ面積200㎡超の建築物（新2号）は全国で新築・大規模修繕・模様替に建築確認が必要。","防火・準防火地域外での10㎡以内の増築・改築・移転は確認不要。200㎡超の特殊建築物への用途変更は類似用途間を除き確認が必要。","建築物の敷地は幅員4m以上の道路に2m以上接しなければならない。2項道路は原則として道路中心線から2m後退した線が境界。","防火地域内の耐火建築物等（建蔽率8/10の地域以外）・準防火地域内の耐火・準耐火建築物等で+1/10、角地で+1/10緩和される。","建蔽率8/10の地域内で防火地域内にある耐火建築物等は建蔽率制限が適用されない。前面道路12m未満なら容積率は道路幅員で制限される。","建築物が防火地域と準防火地域等にわたるときは原則全部に厳しい方を適用。用途制限は敷地の過半の属する地域による。","第一種・第二種低層住居専用地域・田園住居地域は10m又は12mの絶対高さ制限があり、北側斜線は低層・中高層住居専用・田園住居地域に適用。"],"traps":["「防火地域内でも10㎡以内の増築なら確認不要」と出たら×。10㎡以内の確認不要は防火・準防火地域外に限る。","「神社・寺院は工業専用地域では建築できない」と出たら×。神社・寺院・教会、保育所、診療所等は全用途地域で建築可。","「都市計画区域外の木造2階建ての新築は確認不要」と出たら×。2025年改正後は新2号建築物として全国で確認が必要。"],"rel":["法令|都市計画法","法令|開発許可"],"bridge":"用途地域や防火地域は都市計画法で定め、そこでの具体的な建築制限は建築基準法が定める。開発許可は土地の造成段階、建築確認は個々の建築物の段階の規制。","sys":{"overview":"都市計画で決めた用途地域等の中で、個々の建築物を規制する法律。建築確認（2025年改正の新2号・新3号）→単体規定→集団規定（道路・用途・建蔽率・容積率・高さ・防火）の順に整理し、数字と例外を押さえる。","tree":[{"h":"建築確認","items":["1号：特殊建築物で用途200㎡超","新2号：階数2以上又は延べ200㎡超","新3号：平屋かつ200㎡以下（区域内のみ）","防火・準防火外の10㎡以内増改築等は不要","200㎡超の特殊建築物への用途変更は必要"]},{"h":"単体規定","items":["高さ20m超：避雷設備","高さ31m超：非常用の昇降機","住宅居室の採光1/7以上（照明等で1/10可）","換気に有効な開口は床面積の1/20以上","石綿添加建材は原則使用禁止"]},{"h":"道路・接道","items":["道路は幅員4m以上（指定区域は6m）","敷地は道路に2m以上接する","2項道路は中心線から2m後退","道路内には原則建築不可（地下等除く）"]},{"h":"用途制限","items":["敷地の過半が属する地域の制限を適用","神社・診療所・保育所等は全地域で可","住宅は工業専用地域のみ不可","大学・病院は低層系・田園・工業・工専で不可"]},{"h":"建蔽率・容積率","items":["防火内の耐火等・準防火内の準耐火等+1/10","角地+1/10、両方で+2/10","8/10地域・防火内の耐火等は制限なし","前面道路12m未満は幅員×4/10又は6/10","敷地が地域にまたがれば加重平均"]},{"h":"高さ・防火","items":["低層住専・田園：絶対高さ10m又は12m","北側斜線：低層・田園・中高層住専","日影規制：商業・工業・工専は対象外","防火地域：3階以上又は100㎡超は耐火等","準防火：4階以上又は1,500㎡超は耐火等"]}],"flow":{"title":"建築確認〜使用開始","steps":["建築主事等に確認申請","確認済証の交付（35日／7日以内）","着工（特定工程は中間検査）","工事完了から4日以内に完了検査申請","受理から7日以内に検査","検査済証の交付","1号・2号は検査済証後に使用開始"]},"tables":[{"title":"2025年改正後の確認対象","head":["区分","範囲","確認が必要な行為"],"rows":[["1号","特殊建築物200㎡超","全国：新築・増改築・大規模修繕等"],["新2号","階数2以上又は延べ200㎡超","全国：新築・増改築・大規模修繕等"],["新3号","平屋かつ延べ200㎡以下","区域内：新築・増改築・移転"],["用途変更","200㎡超の特殊建築物へ","類似用途間は不要"]]},{"title":"主な用途制限","head":["建築物","建築できない地域"],"rows":[["神社・寺院・診療所・保育所","なし（全地域で可）"],["住宅・共同住宅","工業専用地域"],["小・中・高校","工業・工業専用"],["大学・病院","一低・二低・田園・工業・工専"],["ホテル・旅館","一低〜二中高・田園・工業・工専"],["映画館（客席200㎡未満）","一低〜二住・田園・工業・工専"],["映画館（客席200㎡以上）","近商・商業・準工以外"]]},{"title":"建蔽率の緩和","head":["条件","緩和"],"rows":[["防火地域内の耐火建築物等","+1/10"],["準防火地域内の耐火・準耐火等","+1/10"],["特定行政庁指定の角地","+1/10"],["上記の防火系＋角地","+2/10"],["8/10地域かつ防火内の耐火等","制限なし"]]}]}},"法令|盛土規制法":{"pts":["宅地造成等工事規制区域・特定盛土等規制区域は都道府県知事（指定都市・中核市はその長）が基礎調査をもとに指定する。","宅地造成等工事規制区域内で一定規模の宅地造成・特定盛土等・土石の堆積を行う工事主は、着手前に知事の許可を受けなければならない。","許可対象は、盛土で高さ1m超の崖、切土で高さ2m超の崖、盛土切土合わせ高さ2m超の崖、盛土で高さ2m超、面積500㎡超など。","許可申請前に、工事主は周辺住民へ説明会の開催等の周知措置を講じなければならない。許可後は工事現場に標識を掲示する。","特定盛土等規制区域内では一定規模の工事は着手日の30日前までに知事へ届出が必要。大規模な工事は許可が必要となる。","宅地造成等工事規制区域内で高さ2m超の擁壁・排水施設等の除却工事を行う者は、許可不要の場合でも着手日の14日前までに知事へ届け出る。","規制区域内の土地の所有者・管理者・占有者は、災害が生じないよう常時安全な状態に維持するよう努めなければならない。"],"traps":["「造成宅地防災区域は宅地造成等工事規制区域内にも指定できる」と出たら×。規制区域内の土地には指定できない。","「周知措置は工事着手後に行えばよい」と出たら×。許可申請の前にあらかじめ講じなければならない。","「規制区域外の盛土にも盛土規制法の届出が必要」と出たら×。規制区域・特定盛土等規制区域の外では許可も届出も不要。"],"rel":["法令|開発許可","法令|農地法"],"bridge":"規制区域内で都市計画法の開発許可を受けた工事は盛土規制法の許可を受けたものとみなされる。農地での盛土も宅地造成等の対象となり得て、農地転用許可とは別に許可が問題となる。","sys":{"overview":"旧宅地造成等規制法を改正・改称し2023年5月に施行された法律。規制区域の指定（2種類）→許可・届出が必要な規模→許可手続と検査→その他の届出→監督・造成宅地防災区域の順に整理し、数字と届出期限を押さえる。","tree":[{"h":"区域の指定","items":["指定権者：知事（指定都市・中核市は市長）","宅地造成等工事規制区域：市街地・集落等","特定盛土等規制区域：上記以外で危険な区域","造成宅地防災区域：宅造工事規制区域外","基礎調査の立入り損失は都道府県が補償"]},{"h":"対象行為","items":["宅地造成：宅地以外を宅地にする造成","特定盛土等：宅地・農地等での盛土等","土石の堆積：一定期間の仮置き","農地・森林での盛土も対象になり得る"]},{"h":"規制区域","items":["一定規模以上は着手前に知事の許可","申請前に周辺住民へ説明会等の周知","許可後は現場に標識を掲示","開発許可を受ければ許可を受けたものとみなす"]},{"h":"特定盛土区域","items":["一定規模は着手30日前までに知事へ届出","大規模（高さ5m超等）は許可","許可後の手続は規制区域と同様"]},{"h":"その他の届出","items":["区域指定時に工事中：指定日から21日以内","2m超の擁壁・排水施設の除却：14日前","公共施設用地を宅地に転用：14日以内"]},{"h":"監督・義務","items":["所有者・管理者・占有者は安全維持の努力義務","知事は所有者等に勧告・改善命令","原因行為者にも改善命令を出せる","知事は規則で技術的基準を強化・付加可"]}],"flow":{"title":"許可〜完了検査","steps":["周辺住民へ説明会等の周知措置","知事へ許可申請","許可（条件付けも可）","現場に標識を掲示して着工","特定工程の中間検査・定期報告","完了後に完了検査を申請","検査済証の交付"]},"tables":[{"title":"許可・届出が必要な規模","head":["行為","規制区域：許可","特定盛土区域：許可"],"rows":[["盛土で生じる崖","高さ1m超","高さ2m超"],["切土で生じる崖","高さ2m超","高さ5m超"],["盛土＋切土の崖","高さ2m超","高さ5m超"],["崖を生じない盛土","高さ2m超","高さ5m超"],["盛土・切土の面積","500㎡超","3,000㎡超"],["土石の堆積","2m超かつ300㎡超／500㎡超","5m超かつ1,500㎡超／3,000㎡超"]]},{"title":"届出の期限","head":["場面","期限","届出先"],"rows":[["特定盛土区域の中規模工事","着手30日前まで","知事"],["区域指定時に工事中","指定日から21日以内","知事"],["2m超擁壁・排水施設の除却","着手14日前まで","知事"],["公共施設用地→宅地転用","転用から14日以内","知事"]]},{"title":"区域の違い","head":["項目","規制区域","特定盛土区域"],"rows":[["対象地","市街地・集落等","それ以外の危険区域"],["中規模工事","許可","届出（30日前）"],["大規模工事","許可","許可"],["区域外","許可・届出とも不要","許可・届出とも不要"]]}]}},"法令|土地区画整理法":{"pts":["施行者は個人・組合・区画整理会社・地方公共団体・国土交通大臣・機構等。組合設立には7人以上で定款・事業計画を定め知事の認可が必要。","組合施行区域内の宅地の所有者・借地権者はすべて組合員となる。未登記の借地権は施行者への申告がなければ存在しないものとみなす。","事業計画の決定等の公告後、換地処分公告までの間、施行区域内で建築や土地の形質変更等をするには知事等（市の区域内は市長）の許可が必要。","仮換地指定の効力発生日から換地処分公告の日まで、従前の宅地の権利者は仮換地を従前と同じ内容で使用収益でき、従前の宅地は使用できない。","仮換地の使用収益開始日を別に定めることができ、そのため使用収益できず損失を受けた者には施行者が損失補償する。","換地処分は関係権利者に換地計画で定めた事項を通知して行い、公告日の終了時に仮換地指定の効力が消滅し、翌日に換地が従前の宅地とみなされる。","清算金と保留地の取得は換地処分公告の翌日に確定・効力発生する。換地処分後は施行者が遅滞なく登記所に通知し換地処分の登記を行う。"],"traps":["「施行区域内の建築行為は施行者の許可を受ける」と出たら×。許可権者は知事等（市の区域内は市長）で、施行者ではない。","「組合施行の仮換地指定には土地区画整理審議会の意見を聴く」と出たら×。組合施行は総会等の同意で、審議会は公的施行の場合。","「清算金は換地処分後に土地を買った者に当然承継される」と出たら×。換地処分時の所有者との間で確定する。"],"rel":["法令|都市計画法","法令|開発許可"],"bridge":"土地区画整理事業は都市計画で定める市街地開発事業の一つで、施行区域は都市計画法で決まる。その施行として行う開発行為は区域・規模を問わず開発許可が不要となる。","sys":{"overview":"都市計画で定める市街地開発事業の一つ。施行者と組合→建築行為等の制限→換地計画→仮換地→換地処分とその効果→登記の順に事業の時間軸で整理し、許可権者と効果の発生時点を押さえる。","tree":[{"h":"施行者","items":["個人・組合・区画整理会社（民間施行）","都道府県・市町村・大臣・機構等（公的施行）","組合：7人以上で定款・事業計画、知事認可","設立は所有者・借地権者の各2/3以上同意","組合員：区域内の所有者・借地権者全員"]},{"h":"建築等制限","items":["事業計画等の公告〜換地処分公告まで","建築・形質変更・重量物設置等が対象","許可権者は知事（市の区域は市長）","施行者の許可ではない点に注意"]},{"h":"換地計画","items":["照応の原則：位置・地積・環境等が照応","保留地：事業費に充てる土地","清算金で不均衡を金銭調整","公的施行は審議会の意見を聴く"]},{"h":"仮換地","items":["指定は書面通知、効力発生日を定める","権利者は仮換地を従前同様に使用収益","従前の宅地は使用収益できない","使用収益開始日を別に定められる（補償あり）","組合施行は総会等の同意、公的は審議会"]},{"h":"換地処分","items":["権利者に換地計画の事項を通知して行う","原則は工事全部の完了後","公告日の終了時：仮換地の効力消滅","公告の翌日：換地が従前の宅地とみなされる","翌日：清算金確定・保留地を施行者取得"]},{"h":"登記","items":["施行者が遅滞なく登記所へ通知","施行者が換地処分の登記を申請・嘱託","登記完了まで原則他の登記不可"]}],"flow":{"title":"土地区画整理事業の流れ","steps":["組合設立認可・事業計画決定の公告","施行地区内の建築等は知事等の許可制","換地計画の作成・認可","仮換地の指定（効力発生日に使用開始）","工事の実施","換地処分の通知→知事が公告","公告翌日に換地確定・換地処分の登記"]},"tables":[{"title":"換地処分公告の効果","head":["時点","効果"],"rows":[["公告日の終了時","仮換地指定の効力が消滅"],["公告日の終了時","換地を定めない従前地の権利消滅"],["公告日の翌日","換地が従前の宅地とみなされる"],["公告日の翌日","清算金が確定"],["公告日の翌日","保留地を施行者が取得"],["公告日の翌日","公共施設は原則市町村管理"]]},{"title":"施行者による違い","head":["項目","組合施行","公的施行"],"rows":[["根拠","定款・事業計画","施行規程・事業計画"],["仮換地指定の手続","総会等の同意","審議会の意見"],["施行場所","都市計画区域内","施行区域内（都市計画事業）"],["建築制限の許可権者","知事等","知事等（大臣施行は大臣）"]]},{"title":"仮換地指定の効果","head":["土地","使用収益できる者"],"rows":[["仮換地","従前の宅地の権利者"],["従前の宅地","権利者は不可（施行者が管理）"],["仮換地の元の権利者","効力発生日から使用不可"],["開始日を別に定めた場合","損失は施行者が補償"]]}]}},"法令|農地法":{"pts":["農地か否かは登記簿上の地目でなく現況で判断する。一時的に耕作していない休耕地も農地に当たる。","3条（権利移動）は農業委員会、4条（転用）・5条（転用目的の権利移動）は知事等（指定市町村は市町村長）の許可が必要。","相続・遺産分割・相続人への特定遺贈は許可不要だが、農業委員会への届出が必要。相続人以外への特定遺贈は3条許可が必要。","市街化区域内の農地は、あらかじめ農業委員会に届け出れば4条・5条許可が不要。3条にはこの特例はない。","2アール未満の農業用施設への自己転用は4条許可不要。国・都道府県等の一定の転用は協議成立で許可があったものとみなす。","許可のない権利移動・転用目的の権利移動は効力を生じない。違反転用者・工事請負人等に原状回復等を命じられる。","農地の賃貸借は引渡しで対抗でき、解除・解約申入れ等には原則知事の許可が必要。適格法人以外の法人も一定要件で借りられる。"],"traps":["「市街化区域内なら3条の権利移動も届出で足りる」と出たら×。市街化区域の届出特例は4条・5条のみ。","「登記簿の地目が山林なら耕作していても農地法の適用はない」と出たら×。現況で判断する。","「相続人以外への特定遺贈も許可不要」と出たら×。相続人以外への特定遺贈は3条許可が必要。"],"rel":["法令|国土利用計画法","法令|都市計画法"],"bridge":"農地法3条許可を受ける場合は国土法の事後届出が不要。市街化区域では4条・5条許可に代えて届出で足り、都市計画の区域区分が手続を左右する。","sys":{"overview":"農地・採草放牧地の権利移動と転用を規制する法律。農地の判定（現況主義）→3条・4条・5条の許可と例外→市街化区域の届出特例→違反の効果→賃貸借の保護の順に、3つの条文を比較で押さえる。","tree":[{"h":"農地の判定","items":["登記地目でなく現況で判断","休耕地も農地に当たる","採草放牧地：3条・5条の対象、4条は対象外","家庭菜園は農地に当たらない"]},{"h":"3条 権利移動","items":["許可権者：農業委員会","相続・遺産分割・相続人への特定遺贈は不要","相続等で取得した者は農業委員会へ届出","市街化区域の届出特例はない","下限面積要件は2023年4月に廃止"]},{"h":"4条 転用","items":["許可権者：知事（指定市町村は市町村長）","2a未満の農業用施設への転用は不要","国・都道府県等は協議成立で許可みなし","市街化区域：事前に農業委員会へ届出"]},{"h":"5条 転用目的","items":["転用目的の権利移動・設定が対象","許可権者は4条と同じ","市街化区域：事前届出で許可不要","許可がなければ契約は効力を生じない"]},{"h":"違反・罰則","items":["3条・5条違反の契約は無効","違反転用には原状回復等の命令","命令は工事請負人・下請人にも可","法人の4・5条違反は1億円以下の罰金"]},{"h":"賃貸借","items":["引渡しで第三者に対抗可（使用貸借は不可）","解除・解約申入れ等は原則知事の許可","一般法人も一定要件で借りられる","抵当権の設定は許可不要"]}],"flow":{"title":"5条転用許可の流れ","steps":["市街化区域内なら農業委員会へ事前届出","区域外は農業委員会経由で知事等に申請","農業委員会が意見を付して送付","知事等が許可・不許可を判断","許可後に契約が効力を生じ転用可能"]},"tables":[{"title":"3条・4条・5条の比較","head":["項目","3条","4条","5条"],"rows":[["内容","権利移動","自己転用","転用目的の権利移動"],["許可権者","農業委員会","知事等","知事等"],["市街化区域の特例","なし","事前届出","事前届出"],["無許可の効果","無効","原状回復等","無効・原状回復等"],["採草放牧地","対象","対象外","対象"]]},{"title":"許可不要となる主な場面","head":["場面","3条","4条・5条"],"rows":[["相続・遺産分割","○不要（届出）","—"],["相続人以外への特定遺贈","×必要","—"],["2a未満の農業用施設","—","4条のみ不要"],["国・都道府県等","○不要","協議成立でみなし"],["土地収用","○不要","○不要"],["抵当権の設定","○不要","—"]]},{"title":"罰則","head":["違反","個人","法人"],"rows":[["3条違反","3年以下拘禁刑又は300万円以下","300万円以下の罰金"],["4条・5条違反","3年以下拘禁刑又は300万円以下","1億円以下の罰金"]]}]}},"法令|国土利用計画法":{"pts":["事後届出は、土地売買等の契約を締結した権利取得者（買主等）が、契約締結日から起算して2週間以内に市町村長経由で知事に行う。","届出対象面積は、市街化区域2,000㎡以上、その他の都市計画区域5,000㎡以上、都市計画区域外10,000㎡以上。","土地売買等の契約は対価を得て所有権・地上権・賃借権を移転・設定する契約で、予約や交換も含む。贈与・相続・無償の賃借は対象外。","買主側が一団の土地を取得する場合は合計面積で判断する（買いの一団）。個々の契約が小さくても合計が基準以上なら届出必要。","当事者の一方又は双方が国・地方公共団体等の場合、民事調停による場合、農地法3条許可を受ける場合などは事後届出不要。","届出事項には対価の額も含むが、知事の勧告は土地の利用目的についてのみ行い、届出から3週間以内にする。","勧告に従わないと公表されることがあるが契約は有効。無届は6か月以下の拘禁刑又は100万円以下の罰金の対象（契約は有効）。"],"traps":["「売主と買主が共同で事後届出をする」と出たら×。届出義務者は権利取得者（買主等）のみで、売主に義務はない。","「勧告に従わなければ契約は無効」と出たら×。公表されることがあるだけで、無届・勧告不服従でも契約は有効。","「対価の額が著しく不適正なら勧告できる」と出たら×。事後届出の勧告は利用目的についてのみ。"],"rel":["法令|農地法","法令|都市計画法"],"bridge":"事後届出の対象面積は都市計画法の区域区分（市街化区域・その他の区域・区域外）で決まる。農地法3条許可を受ける取引は国土法の事後届出が不要となる。","sys":{"overview":"大規模な土地取引を届出・許可で監視する法律。試験の中心は事後届出で、土地売買等の契約の範囲→届出対象面積（区域区分で決まる）→届出不要の例外→勧告と効果の順に押さえる。事前届出・許可制は概要でよい。","tree":[{"h":"制度の全体","items":["原則：事後届出制","注視区域・監視区域：事前届出制","規制区域：許可制（不許可は買取請求）","監視区域は規則で届出面積を引下げ可"]},{"h":"売買等の契約","items":["所有権・地上権・賃借権の移転・設定","対価があることが要件","売買・交換・予約・代物弁済は該当","贈与・相続・時効・抵当権設定は非該当"]},{"h":"届出面積","items":["市街化区域：2,000㎡以上","その他の都市計画区域：5,000㎡以上","都市計画区域外：1ha以上","買主側の一団の土地は合計で判断"]},{"h":"届出手続","items":["届出者は権利取得者（買主等）のみ","契約締結日から2週間以内","市町村長を経由して知事へ","対価の額・利用目的等を届出"]},{"h":"届出不要","items":["当事者の一方又は双方が国・地方公共団体等","民事調停による契約","農地法3条許可を受ける場合","面積が基準未満・対価なし"]},{"h":"勧告・効果","items":["勧告は利用目的についてのみ","届出から3週間以内（延長可）","不服従は公表されることがある","無届・不服従でも契約は有効","無届は6月以下拘禁刑又は100万円以下罰金"]}],"flow":{"title":"事後届出の流れ","steps":["土地売買等の契約を締結","2週間以内に権利取得者が届出","市町村長を経由して知事へ","知事が利用目的を審査","3週間以内に勧告又は助言","不服従なら公表（契約は有効）"]},"tables":[{"title":"事後届出の対象面積","head":["区域","届出が必要な面積"],"rows":[["市街化区域","2,000㎡以上"],["市街化調整区域","5,000㎡以上"],["非線引都市計画区域","5,000㎡以上"],["準都市計画区域","1ha以上"],["都市計画区域外","1ha以上"]]},{"title":"土地売買等の契約か","head":["取引","該当"],"rows":[["売買・売買の予約","○"],["交換（差金なしでも）","○"],["対価ある地上権・賃借権設定","○"],["贈与・相続・遺産分割","×"],["無償の賃借・使用貸借","×"],["抵当権・質権の設定","×"],["時効取得","×"]]},{"title":"事後届出と事前届出","head":["項目","事後届出","事前届出"],"rows":[["区域","注視・監視・規制区域以外","注視区域・監視区域"],["届出者","権利取得者のみ","当事者双方"],["時期","契約後2週間以内","契約前"],["勧告の対象","利用目的のみ","対価の額・利用目的"],["一団の判定","買主側のみ","売主・買主双方"],["勧告の期限","届出から3週間以内","届出から6週間以内"]]}]}},"税他|不動産取得税・固定資産税":{"pts":["不動産取得税は都道府県が不動産の取得者に課す。有償・無償や登記の有無を問わず、家屋の改築で価格が増加した場合も課税。","相続・法人の合併・共有物分割（持分を超えない部分）などの形式的な移転は非課税。国・地方公共団体等には課税できない。","不動産取得税の課税標準は固定資産課税台帳の価格。免税点（2026年4月1日以後の取得）は土地16万円、家屋は建築1戸66万円・その他1戸34万円未満。","固定資産税は市町村が1月1日（賦課期日）時点の固定資産課税台帳上の所有者に課す。年の途中で売却しても納税義務者は変わらない。","質権者・100年より長い存続期間の地上権者は、所有者に代わり固定資産税の納税義務者となる。賃借人は納税義務者にならない。","住宅用地の課税標準は、200㎡以下の小規模住宅用地は価格の1/6、それを超える部分は1/3とする特例がある。","いずれも普通徴収（納税通知書）。固定資産税の納期は原則4月・7月・12月・2月中で、特別の事情があれば条例で別に定められる。"],"traps":["「不動産取得税は申告納付である」と出たら×。不動産取得税・固定資産税とも普通徴収。","「相続による取得にも不動産取得税が課される」と出たら×。相続は形式的移転で非課税。贈与・交換は課税。","「4月1日の所有者に固定資産税が課される」と出たら×。賦課期日は1月1日で、その時点の所有者に課す。"],"rel":["税他|印紙税・登録免許税","税他|地価公示・鑑定評価"],"bridge":"不動産取得税・固定資産税・登録免許税はいずれも固定資産課税台帳の価格を課税標準の基礎にする。地価公示価格とは別の評価制度である。","sys":{"overview":"地方税のうち不動産に関わる2税。不動産取得税（都道府県・取得時に1回）と固定資産税（市町村・毎年1月1日の所有者）を、課税主体→納税義務者→非課税→課税標準と特例→税率・免税点→徴収の順で比較して押さえる。","tree":[{"h":"不取：課税","items":["都道府県が不動産の取得者に課す","有償・無償、登記の有無を問わない","改築で価格増加した場合も課税","新築家屋は最初の使用・譲渡時に取得とみなす","未使用で6か月経過でも取得とみなす（業者1年）"]},{"h":"不取：非課税","items":["相続・法人の合併等の形式的移転","共有物分割（持分を超えない部分）","国・地方公共団体等の取得","贈与・交換・売買は課税"]},{"h":"不取：計算","items":["課税標準：固定資産課税台帳の価格","宅地等の課税標準1/2（2027年3月まで）","新築住宅は1,200万円控除（50〜240㎡）","税率：本則4%、土地・住宅3%（同上）","免税点：土地16万・家屋建築66万・他34万円"]},{"h":"固：課税","items":["市町村が課す（東京23区は都）","1月1日時点の台帳上の所有者に課税","年途中で売却しても納税義務者は不変","質権者・100年超の地上権者が納税義務者","賃借人は納税義務者にならない"]},{"h":"固：計算","items":["課税標準：台帳価格（3年ごと評価替え）","住宅用地200㎡以下は1/6、超部分1/3","標準税率1.4%","免税点：土地30万・家屋20万円","新築住宅は3年度（中高層耐火5年度）1/2"]},{"h":"徴収・不服","items":["両税とも普通徴収（納税通知書）","固定資産税の納期：4・7・12・2月","特別の事情があれば条例で別の納期","価格の不服は固定資産評価審査委員会"]}],"flow":null,"tables":[{"title":"2税の比較","head":["項目","不動産取得税","固定資産税"],"rows":[["課税主体","都道府県","市町村"],["課税時期","取得時に1回","毎年（賦課期日1月1日）"],["納税義務者","取得者","1月1日の台帳所有者"],["課税標準","台帳価格","台帳価格"],["税率","4%（土地・住宅3%）","標準1.4%"],["免税点（土地）","16万円未満","30万円未満"],["免税点（家屋）","建築66万・他34万円未満","20万円未満"],["徴収方法","普通徴収","普通徴収"]]},{"title":"主な特例","head":["特例","内容"],"rows":[["不取：宅地等","課税標準×1/2"],["不取：新築住宅","1,200万円控除（50〜240㎡）"],["不取：住宅用土地","税額から一定額を減額"],["固：小規模住宅用地","200㎡以下は価格×1/6"],["固：一般住宅用地","200㎡超部分は価格×1/3"],["固：新築住宅","120㎡まで税額1/2（3年度・中高層5年度）"]]},{"title":"不動産取得税の課否","head":["取得の原因","課税"],"rows":[["売買・交換","○"],["贈与","○"],["家屋の新築・増改築","○"],["相続・法人の合併","×"],["共有物分割（持分内）","×"],["国・地方公共団体の取得","×"]]}]}},"税他|印紙税・登録免許税":{"pts":["不動産の譲渡契約書、地上権・土地賃借権の設定・譲渡契約書、請負契約書、金銭消費貸借契約書は課税文書。建物賃貸借契約書は非課税。","契約の成立を証する文書なら仮契約書・覚書も課税文書。同一内容で複数作成すれば、仲介人保存分も含め各通が課税される。","土地賃借権設定の記載金額は権利金等の返還されない金額で、賃料・敷金は含まない。贈与契約書は記載金額のない文書となる。","国等と私人が共同作成した文書は、私人が保存するものは国等が作成したものとみなされ非課税、国等が保存するものは課税。","印紙の貼付漏れは過怠税（原則納付すべき額の3倍、自主的申出で1.1倍）。消印のない場合も過怠税が課される。","登録免許税は登記を受ける者が連帯して納付する。不動産の課税標準は登記時の価額で、固定資産課税台帳の価格を基礎とする。","住宅用家屋の軽減税率特例は、個人が自己居住用に取得し床面積50㎡以上、取得後1年以内の登記等が要件。敷地の土地には適用されない。"],"traps":["「建物の賃貸借契約書は印紙税の課税文書」と出たら×。課税文書となるのは土地の賃借権設定契約書で、建物賃貸借は非課税。","「住宅用家屋の所有権移転登記の軽減は贈与・相続でも適用」と出たら×。売買又は競落による取得に限られる。","「減額の変更契約書は減額後の金額が記載金額」と出たら×。減額の変更契約書は記載金額のない文書となる。"],"rel":["税他|不動産取得税・固定資産税","権利|不動産登記法"],"bridge":"登録免許税は登記という手続にかかる国税で、不動産取得税は取得にかかる地方税。課税標準は同じく固定資産課税台帳の価格を基礎とする。","sys":{"overview":"いずれも不動産取引に伴う国税。印紙税は契約書等の文書に、登録免許税は登記に課される。課税文書の範囲と記載金額の決め方、登録免許税の課税標準と住宅用家屋の軽減要件が得点源。","tree":[{"h":"印紙税の対象","items":["不動産譲渡契約書・地上権/土地賃借権の設定譲渡","請負契約書・金銭消費貸借契約書","売上代金の受取書（5万円未満は非課税）","建物賃貸借・抵当権設定の契約書は課税対象外","仮契約書・覚書・変更契約書も課税対象"]},{"h":"記載金額","items":["土地賃借権設定は返還されない権利金等","賃料・敷金・保証金は含めない","贈与・減額変更は記載金額のない文書(200円)","増額変更は増加額が記載金額","交換は高い方の価額（差金のみ記載なら差金）"]},{"h":"納税義務者等","items":["課税文書の作成者（共同作成は連帯納付）","国等と私人の共同作成は私人保存分が非課税","同一内容の複数通は各通が課税（仲介人分も）","消費税額の区分記載があれば税抜額で判定"]},{"h":"納付・過怠税","items":["印紙を貼付し消印して納付","貼付漏れは納付額の3倍（本来分含む）","自主的申出なら1.1倍","消印漏れは消印のない印紙の額面相当"]},{"h":"登録免許税","items":["登記を受ける者が連帯して納付する国税","課税標準は固定資産課税台帳の価格が基礎","抵当権設定の課税標準は債権金額","本則：売買移転2%・相続0.4%・保存0.4%","土地の売買移転は1.5%（2029年3月まで）"]},{"h":"住宅用家屋軽減","items":["個人が自己居住用に新築・取得","床面積50㎡以上","新築・取得後1年以内に登記","移転は売買・競落のみ（贈与・交換不可）","敷地の土地には適用なし","適用期限は2027年3月31日まで"]}],"flow":{"title":"印紙税の判定手順","steps":["契約の成立・変更を証する文書か確認","課税文書の号別（譲渡・請負等）を判定","非課税文書・国等の作成文書か確認","記載金額を決める（権利金・増加額等）","税額表で税額を確認（金額なしは200円）","印紙を貼付し消印する"]},"tables":[{"title":"文書ごとの課税関係","head":["文書","課税","記載金額"],"rows":[["土地売買契約書","○","売買金額"],["土地賃借権設定契約書","○","権利金等（賃料除く）"],["建物賃貸借契約書","×","―"],["贈与契約書","○","記載金額なし(200円)"],["増額の変更契約書","○","増加額"],["減額の変更契約書","○","記載金額なし"],["交換契約書","○","高い方の価額"],["抵当権設定契約書","×","―"]]},{"title":"登録免許税の税率","head":["登記","本則","住宅用家屋の軽減"],"rows":[["所有権保存","0.4%","0.15%"],["売買による移転","2%","0.3%"],["土地の売買による移転","2%","適用なし（土地特例1.5%）"],["相続による移転","0.4%","適用なし"],["贈与・交換による移転","2%","適用なし"],["抵当権設定","0.4%","0.1%"]]},{"title":"住宅用家屋軽減の要件","head":["要件","内容"],"rows":[["取得者","個人のみ"],["用途","自己の居住用"],["床面積","50㎡以上"],["登記時期","新築・取得後1年以内"],["取得原因(移転)","売買・競落のみ"],["中古住宅","新耐震基準適合が必要"],["対象","家屋のみ（土地×）"]]}]}},"税他|所得税・譲渡":{"pts":["譲渡所得は譲渡した年の1月1日時点で所有期間5年超なら長期、5年以下なら短期。相続・贈与では被相続人等の取得費・取得時期を引き継ぐ。","取得費には購入代金のほか設備費・改良費を含む。営利目的で継続的に行う譲渡は事業所得又は雑所得となる。","居住用財産の3,000万円特別控除は所有期間を問わない。配偶者・直系血族・生計を一にする親族等への譲渡には適用されない。","居住しなくなった日から3年を経過する日の属する年の12月31日までの譲渡なら適用可。前年・前々年に同特例等を受けていると不可。","所有期間10年超の居住用財産は、3,000万円控除後の金額に軽減税率の特例を併用できる。収用等の5,000万円控除後も同様。","居住用財産の譲渡損失の損益通算・繰越控除の特例は、住宅ローン控除と併用することができる。","居住年等に3,000万円控除や軽減税率の特例などを受けると、住宅ローン控除は適用されない。"],"traps":["「同居していない配偶者への譲渡なら3,000万円控除を受けられる」と出たら×。配偶者・直系血族への譲渡は同居の有無を問わず不可。","「所有期間は譲渡日現在で判定する」と出たら×。長期・短期は譲渡した年の1月1日現在の所有期間で判定する。","「3,000万円特別控除は所有期間10年超が要件」と出たら×。所有期間要件はなく、10年超が要件なのは軽減税率の特例。"],"rel":["権利|相続","税他|不動産取得税・固定資産税"],"bridge":"相続で取得した不動産は被相続人の取得費・取得時期を引き継ぎ、長期・短期の判定もそれによる。不動産取得税は取得時に、所得税は譲渡益に課される。","sys":{"overview":"所得税のうち不動産の譲渡益に課される分離課税の譲渡所得が出題の中心。長期・短期の判定、取得費、居住用財産の特例（3,000万円控除・軽減税率・買換え・譲渡損失）の要件と併用関係を押さえれば得点できる。","tree":[{"h":"所得区分","items":["土地建物の譲渡は分離課税の譲渡所得","営利目的の継続的譲渡は事業所得・雑所得","借地権設定の権利金が土地価額の1/2超→譲渡所得","別荘等の災害損失はその年・翌年の譲渡所得から控除"]},{"h":"長期と短期","items":["譲渡年の1月1日で所有期間5年超→長期","5年以下→短期","相続・贈与は取得時期・取得費を引き継ぐ","長期：所得税15%＋住民税5%","短期：所得税30%＋住民税9%"]},{"h":"計算","items":["譲渡収入−(取得費＋譲渡費用)−特別控除","取得費に設備費・改良費を含む","取得費は収入金額の5%（概算）でも可","譲渡損失は原則他の所得と通算不可"]},{"h":"居住用の特例","items":["3,000万円特別控除（所有期間不問）","10年超所有の軽減税率（6,000万円以下部分）","買換え特例（2027年12月までの譲渡）","譲渡損失の損益通算・繰越控除（3年）","収用等は5,000万円特別控除"]},{"h":"適用除外","items":["配偶者・直系血族への譲渡は不可","生計を一にする親族・同族会社等も不可","前年・前々年に同特例を受けていると不可","居住しなくなって3年目の年末まで適用可"]},{"h":"併用関係","items":["3,000万円控除＋軽減税率は併用○","3,000万円控除と買換え特例は選択","譲渡損失の特例＋住宅ローン控除は併用○","3,000万円等を受けると住宅ローン控除×"]}],"flow":{"title":"譲渡所得の計算手順","steps":["所得区分を判定（譲渡か事業・雑か）","1月1日時点の所有期間で長期・短期を判定","譲渡収入金額を確定する","取得費（不明なら5%）と譲渡費用を控除","特別控除（3,000万円等）を差し引く","税率を適用（軽減税率の可否を確認）"]},"tables":[{"title":"居住用財産の特例比較","head":["特例","所有期間","主な要件"],"rows":[["3,000万円控除","不問","親族等への譲渡は不可"],["軽減税率","10年超","3,000万円控除と併用可"],["買換え特例","10年超","居住10年以上・1億円以下"],["譲渡損失の特例","5年超","住宅ローン控除と併用可"],["収用5,000万円控除","不問","軽減税率と併用可"]]},{"title":"税率の整理","head":["区分","所得税","住民税"],"rows":[["短期（5年以下）","30%","9%"],["長期（5年超）","15%","5%"],["軽減（6,000万以下）","10%","4%"],["軽減（6,000万超）","15%","5%"]]},{"title":"住宅ローン控除との関係","head":["譲渡側の特例","ローン控除"],"rows":[["3,000万円特別控除","×"],["軽減税率の特例","×"],["買換え特例","×"],["譲渡損失の損益通算・繰越","○"]]}]}},"税他|地価公示・鑑定評価":{"pts":["土地鑑定委員会が都市計画区域その他の公示区域内の標準地について、毎年1月1日の正常な価格を判定し官報で公示する。","標準地は自然的・社会的条件からみて類似する地域で、土地の利用状況・環境等が通常と認められる一団の土地から選定する。","正常な価格の判定は2人以上の不動産鑑定士の鑑定評価を求めて行う。建物や地上権等があっても存しないものとして（更地として）求める。","公示事項は所在地、単位面積当たりの価格、価格判定の基準日、地積・形状、周辺の状況等。総額は公示しない。","不動産鑑定士は公示区域内の土地の鑑定評価で公示価格を規準としなければならない。一般の土地取引は指標とするよう努める。","鑑定評価は原価法・取引事例比較法・収益還元法を併用する。原価法は造成地・埋立地等の土地にも適用できる。","価格は正常価格・限定価格・特定価格・特殊価格に分かれる。特殊価格は文化財等の市場性を有しない不動産の価格。"],"traps":["「標準地の公示価格は総額で公示される」と出たら×。公示されるのは単位面積当たりの価格。","「地上権が設定された土地は標準地に選定できない」と出たら×。選定でき、価格は地上権が存しないものとして求める。","「原価法は土地には適用できない」と出たら×。再調達原価を適切に求められる造成地・埋立地には適用できる。"],"rel":["税他|不動産取得税・固定資産税","法令|国土利用計画法"],"bridge":"地価公示は土地取引の指標となる正常価格で、固定資産税等の評価額とは別の制度。国土法の事後届出の対価は届出事項だが、勧告対象は利用目的のみ。","sys":{"overview":"地価公示法と不動産鑑定評価基準から1問。土地鑑定委員会が毎年1月1日の正常な価格を公示する流れと公示事項、鑑定評価の3手法と価格の種類・価格原則を押さえれば得点できる。","tree":[{"h":"地価公示の主体","items":["土地鑑定委員会（国土交通省に置かれる）","公示区域：都市計画区域その他の区域","国土法の規制区域は除く","基準日は毎年1月1日"]},{"h":"標準地の選定","items":["自然的・社会的条件が類似する地域","利用状況・環境等が通常と認められる土地","地上権等があっても選定可能"]},{"h":"正常な価格","items":["2人以上の不動産鑑定士の鑑定評価","自由な取引で通常成立する価格","建物・地上権等は存しないものとして算定","公示は単位面積当たりの価格（総額×）"]},{"h":"公示の効力","items":["一般の土地取引：指標とするよう努める","不動産鑑定士：公示価格を規準とする義務","公共事業用地の取得価格も規準とする"]},{"h":"鑑定評価手法","items":["原価法→積算価格（造成地等の土地も可）","取引事例比較法→比準価格","収益還元法→収益価格（自用不動産も可）","複数手法を併用するのが原則"]},{"h":"価格の種類","items":["正常価格：通常の市場価格","限定価格：隣地併合など市場が限定","特定価格：証券化・早期売却など","特殊価格：文化財等、市場性なし"]},{"h":"価格の諸原則","items":["最有効使用：最も効果的な使い方を前提","変動・予測：価格は常に変動し将来を予測","代替・競争：代わりの物件と比べて決まる","適合・均衡：環境との適合、内部の均衡"]}],"flow":{"title":"地価公示の流れ","steps":["土地鑑定委員会が標準地を選定","2人以上の不動産鑑定士が鑑定評価","委員会が審査・調整し1月1日の価格を判定","所在地・単位面積当たり価格等を官報で公示","関係市町村長に書面・図面を送付","市町村の事務所で一般の閲覧に供する"]},"tables":[{"title":"鑑定評価の3手法","head":["手法","求める価格","ポイント"],"rows":[["原価法","積算価格","再調達原価−減価修正"],["取引事例比較法","比準価格","事情補正・時点修正を行う"],["収益還元法","収益価格","純収益の現在価値の総和"]]},{"title":"価格の種類","head":["種類","内容","例"],"rows":[["正常価格","合理的な市場での価格","通常の売買"],["限定価格","市場が相対的に限定","隣地の併合・借地人の底地買取"],["特定価格","正常価格の前提を欠く","証券化・民事再生の早期売却"],["特殊価格","市場性を有しない","文化財の建造物"]]},{"title":"公示事項かどうか","head":["事項","公示"],"rows":[["標準地の所在地","○"],["単位面積当たりの価格","○"],["価格判定の基準日","○"],["地積・形状","○"],["周辺の土地の利用現況","○"],["価格の総額","×"]]}]}},"税他|住宅金融支援機構":{"pts":["証券化支援業務（買取型）は、民間金融機関の住宅ローン債権を買い取り、これを担保にMBSを発行して資金調達する。","買取対象は本人又は親族が居住する住宅の建設・購入資金の貸付債権で、中古住宅や付随する土地・借地権、購入に付随する改良資金も含む。賃貸住宅は対象外。","住宅融資保険業務では、民間金融機関の住宅ローンについて保険を引き受け、民間による住宅資金の供給を支援する。","直接融資は原則民間が困難な分野に限られ、災害復興建築物、マンション共用部分の改良（管理組合等への融資）などが対象。","団体信用生命保険業務で、債務者の死亡のほか重度障害の場合も保険金を債務の弁済に充当する。","災害復興建築物の貸付金では元金据置期間を設けられる。高齢者向け返済特例として死亡時一括償還制度がある。"],"traps":["「賃貸住宅の建設資金の貸付債権も買取対象」と出たら×。買取対象は本人又は親族が居住する住宅に係る債権。","「中古住宅の購入資金は買取対象外」と出たら×。新築に限られず中古住宅購入資金も対象。","「機構は一般の個人向け住宅ローンを広く直接融資する」と出たら×。直接融資は災害関連など政策上必要な分野に限られる。"],"rel":["税他|景品表示法","税他|土地・建物"],"bridge":"機構は住宅ローンの資金供給を担う制度で、免除科目の中で景品表示法・土地建物と並ぶ5問免除の一角。数字より業務の対象・範囲の理解が問われる。","sys":{"overview":"5問免除科目の1問。機構は民間の住宅ローン供給を支える独立行政法人で、証券化支援（買取型・保証型）が中心業務。買取対象債権の範囲と、直接融資が政策上必要な分野に限られる点を押さえれば得点できる。","tree":[{"h":"機構の性格","items":["独立行政法人（旧住宅金融公庫の業務を承継）","民間金融機関の住宅資金供給を支援","一般の住宅ローン直接融資は原則行わない"]},{"h":"証券化支援","items":["買取型：債権を買い取りMBSを発行","保証型：民間ローンの債務を保証","対象：本人・親族が住む住宅の資金","中古住宅・付随する土地/借地権も対象","購入に付随する改良資金も対象"]},{"h":"保険・保証","items":["住宅融資保険：民間ローンに保険を引受","団体信用生命保険：死亡・重度障害で弁済"]},{"h":"直接融資","items":["災害復興建築物・災害予防の資金","マンション共用部分の改良（管理組合等）","子育て・高齢者向け賃貸住宅の建設等","高齢者のバリアフリー等の改良資金"]},{"h":"返済上の配慮","items":["災害復興の貸付は元金据置期間を設定可","高齢者向けの死亡時一括償還制度","経済事情の変動による返済条件の変更"]}],"flow":{"title":"証券化支援(買取型)","steps":["民間金融機関が個人に長期固定ローンを融資","機構が当該住宅ローン債権を買い取る","機構が債権を信託し担保とする","MBSを発行し投資家から資金を調達","調達資金で次の債権買取りに充てる"]},"tables":[{"title":"買取型の対象債権","head":["資金の内容","対象"],"rows":[["自ら居住する新築住宅","○"],["親族が居住する住宅","○"],["中古住宅の購入","○"],["付随する土地・借地権取得","○"],["購入に付随する改良資金","○"],["賃貸住宅の建設・購入","×"],["投資用・事業用物件","×"]]},{"title":"業務の区分","head":["業務","区分","主な内容"],"rows":[["証券化支援（買取型）","間接","債権買取・MBS発行"],["証券化支援（保証型）","間接","民間ローンの保証"],["住宅融資保険","間接","民間ローンに保険"],["団体信用生命保険","付随","死亡・重度障害で弁済"],["災害復興融資","直接","据置期間の設定可"],["マンション共用部分改良","直接","管理組合等に融資"]]}]}},"税他|景品表示法":{"pts":["徒歩所要時間は道路距離80mにつき1分で計算し、1分未満の端数は1分に切り上げる。起点は物件の区画のうち駅に最も近い地点等。","新築は建築工事完了後1年未満で、かつ居住の用に供されたことがない /* ---------- review: 解説 → 付随論点 → 確認例題3問 ---------- */
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// 間違えた問題と最も関係の深い枝（大項目）を文字の2文字組の重なりで推定する
function bigr(x){const s=String(x).replace(/[\s、。・：（）()「」，,．.0-9０-９]/g,"");const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o}
function overlap(a,b){let n=0;b.forEach(x=>{if(a.has(x))n++});return n}
function cellHtml(x){x=esc(x);if(/^(○|◯|必要|可|あり|できる)/.test(x))return `<span class="o">${x}</span>`;if(/^(×|✕|不要|不可|なし|できない)/.test(x))return `<span class="x">${x}</span>`;return x}
// 間違えた問題に最も関係する枝・項目を推定（2文字組の重なり）
function hitOf(S,missed){
  let b=-1,it=-1;if(!S||!missed)return {b,it};
  const qb=bigr(missed.q.s+missed.q.e);let best=1;
  S.tree.forEach((x,i)=>{const sc=overlap(qb,bigr(x.h+x.items.join("")));if(sc>best){best=sc;b=i}});
  if(b>=0){let bi=0;S.tree[b].items.forEach((x,j)=>{const sc=overlap(qb,bigr(x));if(sc>bi){bi=sc;it=j}})}
  return {b,it};
}
const brHtml=(x,i,hit,tag)=>`<div class="br ${hit.b===i?"hit":""}" id="br-${i}"><h4><span class="no">${i+1}</span>${esc(x.h)}${hit.b===i&&tag?`<span class="tag">${tag}</span>`:""}</h4><ul>${x.items.map((y,j)=>`<li class="${hit.b===i&&hit.it===j?"hit":""}">${esc(y)}</li>`).join("")}</ul></div>`;
const tblHtml=(tb,rows,note)=>`<div><div style="font-weight:700;margin-bottom:6px">${esc(tb.title)}</div><div class="tw"><table class="st"><thead><tr>${tb.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${cellHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${note?`<p class="note" style="margin:4px 0 0">${note}</p>`:""}</div>`;
const missedHtml=missed=>missed?`<article class="card"><div class="meta">あなたが間違えた問題　${missed.q.ref==="確認"?"確認問題":missed.q.ref}</div><p class="stmt">${missed.q.s}</p>
    <div class="res ng"><span class="v">あなた：${missed.your==null?"未回答":missed.your?"○":"×"}　答え：${missed.q.a?"○":"×"}</span><span>${missed.q.e}</span><span class="memo">覚え方：<b>${missed.q.m}</b></span></div></article>`:"";

/* 1段目：間違えた範囲だけに絞った解説＋体系へのリンク */
function focusHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const S=L.sys;const t=key.split("|")[1];
  const qb=missed?bigr(missed.q.s+missed.q.e):null;
  const hit=hitOf(S,missed);
  let body="";
  if(S&&hit.b>=0){body+=brHtml(S.tree[hit.b],hit.b,hit,"間違えた範囲")}
  else{body+=`<ul class="ul">${L.pts.slice(0,4).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
  // 関係する表の行だけを抜き出す
  if(S&&qb){let best=null;
    S.tables.forEach(tb=>{const rs=tb.rows.map((r,i)=>({i,r,sc:overlap(qb,bigr(r.join("")))})).filter(o=>o.sc>=2);
      const top=rs.sort((a,b)=>b.sc-a.sc).slice(0,4).sort((a,b)=>a.i-b.i);const sc=top.reduce((a,o)=>a+o.sc,0);
      if(top.length&&(!best||sc>best.sc))best={tb,top,sc}});
    if(best)body+=tblHtml(best.tb,best.top.map(o=>o.r),best.top.length<best.tb.rows.length?`表の一部（${best.top.length}／${best.tb.rows.length}行）。全体は下の「体系的に学ぶ」で。`:"")}
  // 関係するひっかけ
  let traps=L.traps||[];
  if(qb){const r=traps.map(x=>({x,sc:overlap(qb,bigr(x))})).filter(o=>o.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,2).map(o=>o.x);traps=r.length?r:traps.slice(0,1)}else traps=traps.slice(0,2);
  if(traps.length)body+=`<div class="trap"><b>この範囲のひっかけ</b><ul class="ul">${traps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  const head=S&&hit.b>=0?`${esc(t)}：${esc(S.tree[hit.b].h)}`:`${esc(t)}の要点`;
  const map=S?`<div class="mini">${S.tree.map((x,i)=>`<button class="mchip ${i===hit.b?"on":""}" data-deep="${i}"><span class="no">${i+1}</span>${esc(x.h)}</button>`).join("")}</div>`:"";
  const rel=(L.rel||[]).filter(k=>LESSON[k]);
  return `<article class="card"><div class="meta">間違えた範囲の解説</div><h2>${head}</h2>${body}</article>
  ${S?`<article class="card"><div class="meta">体系的に広げる</div><p class="note" style="margin:0">「${esc(t)}」は全${S.tree.length}項目。項目を押すと、その場所から詳しい解説を開きます。</p>${map}
    <button class="btn deeplink" data-deep="all">${esc(t)}を体系的に学ぶ<span class="sub2">全体像・流れ図・比較表・要点</span></button>
    ${rel.length?`<div><div class="note" style="margin-bottom:6px">${esc(L.bridge||"関連する論点")}</div><div class="mini">${rel.map(k=>`<button class="mchip rel" data-deeprel="${k}">${esc(k.split("|")[1])} →</button>`).join("")}</div></div>`:""}</article>`:""}`;
}

/* 2段目：論点を体系的に深く学ぶページ */
function deepHtml(key,missed){
  const L=LESSON[key]||{pts:[],traps:[],rel:[]};const S=L.sys;const [f,t]=key.split("|");
  const hit=hitOf(S,missed);
  let h="";
  if(S){
    h+=`<article class="card"><div class="meta">全体像（体系図）　${FIELDS.find(x=>x[0]===f)[1]}</div><h2>${esc(t)}の全体像</h2><p class="ov">${esc(S.overview)}</p><div class="systree"><div class="sysroot">${esc(t)}</div><div class="sysbr">${S.tree.map((x,i)=>brHtml(x,i,hit,"間違えた範囲")).join("")}</div></div></article>`;
    if(S.flow&&S.flow.steps&&S.flow.steps.length)h+=`<article class="card"><div class="meta">流れで覚える</div><h2>${esc(S.flow.title)}</h2><ol class="flow">${S.flow.steps.map((x,i)=>`<li><span class="n">${i+1}</span><span class="s">${esc(x)}</span></li>`).join("")}</ol></article>`;
    if(S.tables&&S.tables.length)h+=`<article class="card"><div class="meta">比較表・数字</div><div class="tbls">${S.tables.map(tb=>tblHtml(tb,tb.rows,"")).join("")}</div></article>`;
  }
  h+=`<article class="card"><div class="meta">要点のまとめ</div><h2>${esc(t)}の要点</h2><ul class="ul">${L.pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${L.traps&&L.traps.length?`<div class="trap"><b>よく出るひっかけ</b><ul class="ul">${L.traps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}</article>`;
  const rel=(L.rel||[]).filter(k=>LESSON[k]);
  if(rel.length)h+=`<article class="card"><div class="meta">つながる論点</div><p style="margin:0">${esc(L.bridge||"")}</p><div class="mini">${rel.map(k=>`<button class="mchip rel" data-deeprel="${k}">${esc(k.split("|")[1])} →</button>`).join("")}</div></article>`;
  return h;
}
function deepView(key,focus,missed,back,trail){
  trail=trail||[];const t=key.split("|")[1];
  app.innerHTML=`<div class="exam-top"><div><div class="note">体系的に学ぶ${trail.length?"　"+trail.map(k=>esc(k.split("|")[1])).join(" › ")+" ›":""}</div><div style="font-weight:700">${esc(t)}</div></div><button class="btn" id="back">← 復習に戻る</button></div>
  ${deepHtml(key,missed)}
  <div class="row"><button class="btn pri" id="back2">← 復習に戻る</button></div>`;
  $("#back").onclick=back;$("#back2").onclick=back;
  document.querySelectorAll("[data-deeprel]").forEach(b=>b.onclick=()=>deepView(b.dataset.deeprel,-1,null,back,[...trail,key]));
  if(focus>=0){const el=document.getElementById("br-"+focus);if(el){el.classList.add("focus");el.scrollIntoView({block:"center"});return}}
  window.scrollTo(0,0);
}
function startReview(queue){ // queue: [{key, missed?}]
  if(!queue.length){home();return}
  const item=queue[0],rest=queue.slice(1);const key=item.key;const [f,t]=key.split("|");
  app.innerHTML=`<div class="exam-top"><div><div class="note">復習　残り${queue.length}論点</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
  ${missedHtml(item.missed)}
  ${focusHtml(key,item.missed)}
  <div class="row"><button class="btn pri" id="toq">確認例題3問へ</button></div>`;
  $("#home").onclick=home;
  $("#toq").onclick=()=>checkQs(item,rest);
  const back=()=>startReview(queue);
  document.querySelectorAll("[data-deep]").forEach(b=>b.onclick=()=>deepView(key,b.dataset.deep==="all"?-1:+b.dataset.deep,item.missed,back));
  document.querySelectorAll("[data-deeprel]").forEach(b=>b.onclick=()=>deepView(b.dataset.deeprel,-1,null,back,[key]));
  if(voice){const L=LESSON[key];if(L){const S=L.sys,h=hitOf(S,item.missed);speak(h.b>=0?t+"、"+S.tree[h.b].h+"。"+S.tree[h.b].items.join("。"):t+"の要点。"+L.pts.slice(0,4).join("。"))}}
  window.scrollTo(0,0);
}
function checkQs(item,rest){
  const [f,t]=item.key.split("|");
  const ex=new Set(item.missed?[item.missed.q.i]:[]);
  let pool=BANK.filter(q=>q.f===f&&q.t===t);
  let real=pool.filter(q=>q.ref!=="確認");
  const qs=pick(real.length>=3?real:pool,3,ex);
  let k=0,right=0;
  const render=()=>{
    if(k>=qs.length){
      const ok=right===qs.length;
      app.innerHTML=`<section class="card"><h2>${t}　確認例題の結果</h2><div class="row"><span class="big">${right}<span style="font-size:1.2rem"> / ${qs.length}</span></span><span class="judge ${ok?"j-ok":right>=2?"j-mid":"j-ng"}">${ok?"習得":right>=2?"もう一息":"要復習"}</span></div>
      <p class="note">${ok?"この論点は理解できています。":"もう一度、解説を読んでから別の3問に挑戦できます。"}</p>
      <div class="row">${ok?"":`<button class="btn" id="again">解説に戻ってもう一度</button>`}
      ${rest.length?`<button class="btn pri" id="next">次の論点へ（残り${rest.length}）</button>`:`<button class="btn pri" id="nx">第${SET.round+1}回の模試へ</button>`}
      <button class="btn" id="home">ホームへ</button></div></section>`;
      if(!ok)$("#again").onclick=()=>startReview([{key:item.key,missed:item.missed},...rest]);
      if(rest.length)$("#next").onclick=()=>startReview(rest);else $("#nx").onclick=()=>startExam();
      $("#home").onclick=home;window.scrollTo(0,0);return}
    const q=qs[k];
    app.innerHTML=`<div class="exam-top"><div><div class="note">確認例題　${k+1} / ${qs.length}　正解 ${right}</div><div style="font-weight:700">${t}</div></div><button class="btn" id="home">ホームへ</button></div>
    <article class="card"><div class="meta">過去問　${q.ref==="確認"?"確認問題":q.ref}</div><p class="stmt">${q.s}</p>
    ${canSpeak?`<button class="btn" id="spk" style="align-self:flex-start;font-weight:500;font-size:.85rem">読み上げ</button>`:""}
    <div class="ox"><button class="btn" id="o">○</button><button class="btn" id="x">×</button></div><div id="res"></div></article>`;
    const go=v=>{$("#o").disabled=$("#x").disabled=true;const ok=v===q.a;if(ok)right++;rec(q,ok);save();
      $("#res").innerHTML=`<div class="res ${ok?"ok":"ng"}"><span class="v">${ok?"正解":"不正解"}　答えは ${q.a?"○":"×"}</span><span>${q.e}</span><span class="memo">覚え方：<b>${q.m}</b></span></div><div class="row" style="margin-top:10px"><button class="btn pri" id="nx">次へ</button></div>`;
      if(voice)speak((ok?"正解。":"不正解。")+"答えは"+(q.a?"まる":"ばつ")+"。"+q.e);
      $("#nx").onclick=()=>{k++;render();if(voice&&k<qs.length)speak(qs[k].s)};$("#nx").focus()};
    $("#o").onclick=()=>go(1);$("#x").onclick=()=>go(0);$("#home").onclick=home;
    if(canSpeak)$("#spk").onclick=()=>speak(q.s);
    window.scrollTo(0,0);
  };
  render();if(voice&&qs.length)speak(qs[0].s);
}
if(canSpeak){try{speechSynthesis.getVoices()}catch(e){}}
home();
connect();
</script>

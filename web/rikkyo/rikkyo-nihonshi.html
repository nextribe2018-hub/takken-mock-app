<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>立教日本史 10問テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 一枚の答案用紙。中央1カラム（最大640px）。問題文は試験冊子と同じ明朝、操作と数字はゴシック。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){ .q{font-size:17px} .score b{font-size:44px} .fi{grid-template-columns:minmax(0,1fr)} .fi .btn{grid-column:1;grid-row:auto;justify-self:start} }
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

<script>
(function(){
"use strict";
var QS=[{"id":1,"k":"past","ref":"2026年度 2月8日 Ⅰ-A-イ","f":"原始・古代","t":"新羅との関係","y":759,"q":"奈良時代の日本は、676年に朝鮮半島を統一した国と使節を往来させたが、日本がこの国を従属国として扱おうとしたため関係が悪化し、8世紀半ばには藤原仲麻呂が征討を計画した。この国はどれか。","c":["新羅","渤海","百済","高句麗"],"e":"正解は新羅です。新羅は唐と結んで百済（660年）・高句麗（668年）を滅ぼし、676年に半島を統一しました。日本は遣新羅使を送る一方で新羅を従属国として扱おうとしたため緊張が生じ、8世紀末には使節の派遣がまれになりましたが、商人の往来はむしろ活発になりました。渤海は698年に中国東北部におこり、727年以降、日本と友好的に通交した国です。","m":"新羅とは緊張、渤海とは友好。百済・高句麗は7世紀に滅亡"},{"id":2,"k":"past","ref":"2026年度 2月8日 Ⅰ-A-ロ","f":"原始・古代","t":"阿倍仲麻呂","y":717,"q":"717年に留学生として唐に渡り、玄宗皇帝に重く用いられて高官となり、李白ら詩人とも交わったが、帰国の船が遭難したため日本に戻れず、唐で生涯を終えた人物はだれか。","c":["阿倍仲麻呂","吉備真備","玄昉","山上憶良"],"e":"正解は阿倍仲麻呂です。717年に入唐して唐の朝廷に仕え、753年に帰国を図りましたが船が難破して果たせず、唐で亡くなりました。「天の原ふりさけ見れば…」の歌で知られます。吉備真備と玄昉は同じ717年に唐へ渡りましたが、帰国して橘諸兄政権で活躍しました。山上憶良は702年出発の遣唐使に加わり、帰国後に「貧窮問答歌」を詠んだ歌人です。","m":"717年入唐の3人：真備・玄昉は帰国、仲麻呂は唐で没"},{"id":3,"k":"past","ref":"2026年度 2月8日 Ⅰ-A-ハ","f":"原始・古代","t":"円仁","y":838,"q":"838年に遣唐使に従って唐に渡り、五台山や長安で学び、帰国後は天台宗に本格的に密教を取り入れた僧で、唐での体験を『入唐求法巡礼行記（にっとうぐほうじゅんれいこうき）』に記したのはだれか。","c":["円仁","円珍","最澄","空海"],"e":"正解は円仁です。最澄の弟子で、838年に入唐して847年に帰国し、天台宗の密教化（台密）を進めました。旅行記『入唐求法巡礼行記』には唐の武宗による仏教弾圧のようすも記されています。円珍は853年に入唐した天台宗の僧で、のちに円仁の門流（山門派）と対立する寺門派の祖とされます。最澄と空海はともに804年に入唐し、それぞれ天台宗と真言宗を開いた人物です。","m":"円仁＝838年入唐・山門派、円珍＝853年入唐・寺門派"},{"id":4,"k":"past","ref":"2026年度 2月8日 Ⅰ-A-ニ","f":"近世","t":"ルイス＝フロイス","y":1569,"q":"1563年に来日したポルトガル人のイエズス会宣教師で、織田信長や豊臣秀吉と会見し、布教のあゆみや当時の日本の政治・社会を詳しく記録した『日本史』を著したのはだれか。","c":["ルイス＝フロイス","ヴァリニャーノ","ガスパル＝ヴィレラ","フランシスコ＝ザビエル"],"e":"正解はルイス＝フロイスです。1563年に来日し、1569年に織田信長から京都での布教を認められ、その後も長く日本にとどまって見聞を『日本史』にまとめました。ヴァリニャーノは1579年に来日した巡察師で、天正遣欧使節の派遣を勧め、活字印刷機をもたらしました。ガスパル＝ヴィレラは堺の自治のようすを書簡で報告した宣教師、ザビエルは1549年に鹿児島に来てキリスト教を伝えた人物です。","m":"ザビエル1549→フロイス1563→ヴァリニャーノ1579"},{"id":5,"k":"past","ref":"2026年度 2月8日 Ⅰ-A-ホ","f":"近世","t":"鳴滝塾","y":1824,"q":"1823年にオランダ商館の医師として来日したドイツ人シーボルトが、翌年に長崎の郊外に開いて診療と医学などの講義を行い、高野長英らの人材を育てた私塾はどれか。","c":["鳴滝塾","適塾（適々斎塾）","芝蘭堂","咸宜園"],"e":"正解は鳴滝塾（なるたきじゅく）です。シーボルトは1824年に長崎郊外の鳴滝に塾を開き、各地から集まった門人に西洋医学などを教えました。1828年には帰国の際に日本地図の持ち出しが発覚し、のち国外追放となりました（シーボルト事件）。適塾は緒方洪庵が大坂に開いた蘭学塾で、福沢諭吉らが学びました。芝蘭堂は大槻玄沢が江戸に開いた蘭学塾、咸宜園は広瀬淡窓が豊後日田に開いた私塾です。","m":"鳴滝塾＝長崎・シーボルト、適塾＝大坂・緒方洪庵"},{"id":6,"k":"past","ref":"2026年度 2月8日 Ⅰ-A-ヘ","f":"近世","t":"ラクスマン来航","y":1792,"q":"1792年、漂流民の大黒屋光太夫らを送り届けるとともに日本に通商を求めるため、使節ラクスマンを根室に派遣したロシアの皇帝はだれか。","c":["エカチェリーナ2世","ピョートル1世","アレクサンドル1世","ニコライ2世"],"e":"正解はエカチェリーナ2世です。18世紀後半のロシアの女帝で、1792年にラクスマンを根室に送りました。幕府は通商を認めず、長崎への入港許可証を与えて帰国させました。ピョートル1世は17世紀末から18世紀前半にロシアの西欧化を進めた皇帝です。アレクサンドル1世は1804年にレザノフが長崎に来航した時の皇帝、ニコライ2世は皇太子時代の1891年に大津事件で負傷した人物です。","m":"ラクスマン1792根室＝エカチェリーナ2世、レザノフ1804長崎"},{"id":7,"k":"past","ref":"2026年度 2月8日 Ⅰ-A-ト","f":"近代","t":"咸臨丸","y":1860,"q":"1860年、日米修好通商条約の批准書を交換するため渡米した幕府の使節に随行し、勝海舟らが乗り組んで太平洋を横断した幕府の軍艦はどれか。","c":["咸臨丸","ポーハタン号","開陽丸","モリソン号"],"e":"正解は咸臨丸（かんりんまる）です。1860年、外国奉行新見正興を正使とする使節がアメリカ軍艦で渡米した際、幕府はオランダ製の軍艦咸臨丸を随行させ、勝海舟や福沢諭吉らが乗って太平洋横断に成功しました。ポーハタン号は使節一行を運んだアメリカの軍艦です。開陽丸は榎本武揚が率いて戊辰戦争で蝦夷地に向かった旧幕府の軍艦、モリソン号は1837年に異国船打払令によって砲撃されたアメリカ商船です。","m":"1860年、使節はポーハタン号、随行の咸臨丸に勝海舟"},{"id":8,"k":"past","ref":"2026年度 2月8日 Ⅰ-B-5","f":"中世","t":"只管打坐","y":1227,"q":"13世紀前半に宋に渡って禅を学んだ道元は、帰国後に曹洞宗を伝え、のち越前に永平寺を開いた。道元が説いた、ただひたすらに坐禅に打ち込むことを意味する語はどれか。","c":["只管打坐","専修念仏","悪人正機","公案問答"],"e":"正解は只管打坐（しかんたざ）です。道元は1227年に宋から帰国し、ひたすら坐禅に徹することで悟りにいたると説き、権力から距離をおいて越前の永平寺で弟子を育てました。主著は『正法眼蔵』です。専修念仏は、ひたすら念仏を唱えれば救われるとする法然の教えです。悪人正機は親鸞の教え、公案問答は師から与えられた問題を解いて悟りに近づくという、栄西が伝えた臨済宗の修行法です。","m":"道元＝曹洞宗・只管打坐・永平寺、栄西＝臨済宗・公案"},{"id":9,"k":"past","ref":"2026年度 2月8日 Ⅰ-B-12ⅰ","f":"近代","t":"幕末の貿易相手国","y":1865,"q":"1859年に始まった欧米諸国との貿易では、最初に通商条約を結んだアメリカではなく、イギリスが最大の取引相手国となった。その理由として最も適切なものはどれか。","c":["アメリカで南北戦争が起こって対日貿易が停滞し、イギリスが貿易の主導権を握ったため","クリミア戦争に勝利したイギリスが、東アジアの貿易から他国の商人を締め出したため","幕府が薩英戦争の賠償として、イギリス商人だけに横浜での自由な取引を認めたため","イギリスだけが日本に関税自主権を認め、日本の商人が有利な条件で取引できたため"],"e":"1861年に始まった南北戦争（〜65年）のためアメリカは対日貿易に力を注げなくなり、世界最大の工業国だったイギリスが取引の中心となりました。貿易は横浜に集中し、生糸・茶を輸出し、毛織物・綿織物・武器などを輸入しました。クリミア戦争は1853〜56年で開港より前のことであり、他国の排除もありません。薩英戦争は薩摩藩とイギリスの戦いで、貿易の独占は認められていません。関税自主権の回復は1911年です。","m":"ペリーで開国させた米は南北戦争で後退、貿易の主役は英"},{"id":10,"k":"past","ref":"2026年度 2月8日 Ⅰ-B-12ⅱ","f":"近代","t":"改税約書","y":1866,"q":"1865年、列国は通商条約の勅許を得たが、兵庫の開港は認められなかった。翌1866年、列国はこれを理由に幕府に迫って改税約書に調印させた。その内容として最も適切なものはどれか。","c":["輸入品の関税を、平均約20％の従価税から一律5％を基準とする従量税に改めた","日本の関税自主権を一部認め、輸入品の関税を約5％から平均約20％へ引き上げた","生糸など五品目について、産地から開港場への直送を禁じ、江戸の問屋を経由させた","金貨の海外流出を防ぐため、金の含有量を大きく減らした小判に改鋳することを定めた"],"e":"改税約書は1866年に幕府がイギリス・アメリカ・フランス・オランダと結んだ協定です。それまで平均約20％だった輸入品の従価税を、一律5％を基準とする従量税に改めたため、安い外国製品が流入しやすくなり、列国に有利で日本に不利な内容でした。関税率の引き上げは逆の内容で、関税自主権の回復は明治時代の条約改正の課題です。五品目の規制は1860年の五品江戸廻送令、小判の改鋳は同年の万延貨幣改鋳にあたります。","m":"改税約書1866：従価約20％→従量5％、列国に有利"},{"id":11,"k":"past","ref":"2026年度 2月8日 Ⅱ-A-イ","f":"近代","t":"兵部省","y":1869,"q":"1869年、版籍奉還後の官制改革で設けられて軍事全般を担当し、徴兵令公布の前年にあたる1872年に陸軍省と海軍省とに分けられた官庁はどれか。","c":["兵部省","民部省","工部省","刑部省"],"e":"正解は兵部省（ひょうぶしょう）です。1869年に太政官の下の省の一つとして置かれ、大村益次郎、ついで山県有朋らが近代的な軍隊づくりを進めました。1872年に陸軍省と海軍省に分かれ、翌1873年に徴兵令が出されました。民部省は地方行政や租税などを担当した官庁、工部省は1870年に置かれて鉄道・鉱山などの殖産興業を進めた官庁、刑部省は裁判・刑罰を担当し、1871年に司法省に改められた官庁です。","m":"兵部省1869→陸軍省・海軍省1872→徴兵令1873"},{"id":12,"k":"past","ref":"2026年度 2月8日 Ⅱ-A-ロ","f":"近代","t":"枢密院","y":1888,"q":"1888年、憲法草案を審議するために設置され、伊藤博文が初代議長となり、憲法制定後も天皇の最高諮問機関として重要な国務を審議した機関はどれか。","c":["枢密院","元老院","貴族院","大審院"],"e":"正解は枢密院です。1888年に設けられ、伊藤博文が首相を辞して初代議長となり、天皇臨席のもとで憲法草案を審議しました。憲法発布後も条約や緊急勅令などについて天皇の諮問に答える機関として存続しました。元老院は1875年の大阪会議後に置かれた立法諮問機関、貴族院は1890年に開かれた帝国議会の上院、大審院は1875年に置かれた最上級の裁判所で、いずれも役割が異なります。","m":"1888枢密院（議長伊藤）で審議→1889憲法発布"},{"id":13,"k":"past","ref":"2026年度 2月8日 Ⅱ-A-ハ","f":"近代","t":"皇室典範","y":1889,"q":"1889年、大日本帝国憲法の発布と同じ日に制定され、皇位の継承や摂政の設置など皇室に関する事項を定め、議会が関与できないものとされた法典はどれか。","c":["皇室典範","貴族院令","衆議院議員選挙法","華族令"],"e":"正解は皇室典範です。1889年2月11日、憲法と同時に制定され、皇位は男系の男子が継承することや摂政の制度などを定めました。皇室の事柄に国民や議会は関与すべきでないとされ、憲法と並ぶ最高の法典と位置づけられました。貴族院令と衆議院議員選挙法も同じ日に公布されましたが、議会の構成や選挙資格を定めた法令です。華族令は1884年に公・侯・伯・子・男の五爵を定めたものです。","m":"1889年2月11日：憲法と皇室典範、二本立ての最高法規"},{"id":14,"k":"past","ref":"2026年度 2月8日 Ⅱ-A-ニ","f":"近代","t":"天皇機関説","y":1935,"q":"統治権の主体は法人としての国家であり、天皇はその最高機関として憲法に従い統治権を行使すると説いた憲法学者で、1935年に貴族院で学説を攻撃され、著書が発禁となったのはだれか。","c":["美濃部達吉","滝川幸辰","津田左右吉","矢内原忠雄"],"e":"正解は美濃部達吉です。その天皇機関説は政党内閣を支える学説として広く認められていましたが、1935年に貴族院で反国体的と非難され、岡田啓介内閣は国体明徴声明を出してこれを否定しました。滝川幸辰は1933年に刑法学説を理由に京都帝国大学を追われた人物、津田左右吉は1940年に古代史研究の著書が発禁となった人物、矢内原忠雄は1937年に政府の大陸政策を批判して大学を追われた人物です。","m":"滝川事件1933→天皇機関説事件1935→矢内原1937→津田1940"},{"id":15,"k":"past","ref":"2026年度 2月8日 Ⅱ-A-ホ","f":"近代","t":"軍部大臣現役武官制","y":1900,"q":"1900年に第2次山県有朋内閣が政党の影響力が軍に及ぶのを防ぐために定め、1913年に第1次山本権兵衛内閣が条件をゆるめ、1936年に広田弘毅内閣が元に戻した、陸・海軍大臣の資格に関する制度はどれか。","c":["軍部大臣現役武官制","文官任用令","治安警察法","文官分限令"],"e":"正解は軍部大臣現役武官制です。陸・海軍大臣を現役の大将・中将に限る制度で、軍が大臣を出さなければ内閣が成り立たなくなりました。1913年に予備役・後備役まで広げられましたが、二・二六事件後の1936年に復活し、軍の政治的発言力を強めました。文官任用令は高級官吏の任用資格を定めた法令で、山県内閣は1899年に改正して政党員の進出を防ぎました。治安警察法は1900年に労働運動などを取り締まった法律、文官分限令は官吏の身分を保障した法令です。","m":"現役武官制：1900山県→1913山本が緩和→1936広田が復活"},{"id":16,"k":"past","ref":"2026年度 2月8日 Ⅱ-A-ヘ","f":"現代","t":"吉田茂","y":1951,"q":"1951年、サンフランシスコ講和会議に首席全権として出席して平和条約に調印し、同じ日に日米安全保障条約にも調印して、独立後もアメリカ軍の駐留を認めた首相はだれか。","c":["吉田茂","鳩山一郎","岸信介","芦田均"],"e":"正解は吉田茂です。吉田は西側諸国を中心とする講和（単独講和）を選び、1951年9月に平和条約を結んで翌年の独立回復を実現するとともに、日米安全保障条約でアメリカ軍の駐留継続を認めました。再軍備の負担を抑えて経済復興を優先する路線をとりました。鳩山一郎は1956年に日ソ共同宣言に調印した首相、岸信介は1960年に日米新安保条約を結んだ首相、芦田均は1948年に昭和電工事件で退陣した首相です。","m":"吉田＝1951講和・安保、鳩山＝1956日ソ、岸＝1960新安保"},{"id":17,"k":"past","ref":"2026年度 2月8日 Ⅱ-A-ト","f":"現代","t":"保安隊","y":1952,"q":"1950年、朝鮮戦争の勃発を受けてGHQの指令で創設された警察予備隊は、平和条約発効後の1952年に改組され、さらに1954年に自衛隊となった。1952年の改組で発足した組織はどれか。","c":["保安隊","国家地方警察","海上保安庁","防衛庁"],"e":"正解は保安隊です。1950年に創設された警察予備隊は、独立回復後の1952年に保安隊に改組され、海上には警備隊が置かれました。1954年、アメリカとMSA協定を結んだ吉田茂内閣は防衛庁を設け、保安隊・警備隊を陸上・海上・航空の自衛隊に改めました。国家地方警察は1947年の警察法で自治体警察とともに置かれた警察組織、海上保安庁は1948年に設けられた海上の警備・救難機関です。","m":"警察予備隊1950→保安隊1952→自衛隊1954"},{"id":18,"k":"past","ref":"2026年度 2月8日 Ⅱ-B-4","f":"近代","t":"植木枝盛","y":1881,"q":"土佐出身の自由民権運動の理論家で、1881年、一院制の議会や、政府の圧政に対する人民の抵抗権・革命権を盛り込んだ私擬憲法「東洋大日本国国憲按」を起草したのはだれか。","c":["植木枝盛","千葉卓三郎","中江兆民","大井憲太郎"],"e":"正解は植木枝盛（うえきえもり）です。立志社で活動し、『民権自由論』などで民権思想を広めました。1881年の「東洋大日本国国憲按」は、広い人権保障に加えて抵抗権・革命権を認めた点で、私擬憲法のなかでもとくに急進的でした。千葉卓三郎は東京近郊の農村青年らと五日市憲法草案をまとめた人物、中江兆民はルソーの著作を『民約訳解』として紹介した思想家、大井憲太郎は1885年の大阪事件の中心人物です。","m":"植木枝盛＝抵抗権・革命権、千葉卓三郎＝五日市憲法"},{"id":19,"k":"past","ref":"2026年度 2月8日 Ⅱ-B-5","f":"近代","t":"参謀本部","y":1878,"q":"1878年、陸軍省から切り離されて設置され、陸軍の作戦・用兵などの軍令を担当した天皇直属の機関で、政府からの統帥権の独立が形づくられるきっかけとなったものはどれか。","c":["参謀本部","陸軍省","海軍軍令部","大本営"],"e":"正解は参謀本部です。1878年に設けられ、軍隊の指揮・作戦にかかわる軍令事項は政府を通さず天皇に直属することになりました。この原則は大日本帝国憲法の天皇の統帥権として引きつがれ、のちに軍部が政府の統制を離れて行動する根拠となりました。陸軍省は予算・人事などの軍政を担当する内閣の一省です。海軍軍令部は1893年に設けられた海軍の軍令機関、大本営は戦時に置かれる最高の統帥機関です。","m":"軍政＝陸軍省・海軍省、軍令＝参謀本部・軍令部（天皇直属）"},{"id":20,"k":"past","ref":"2026年度 2月9日 Ⅰ-A-イ","f":"原始・古代","t":"推古天皇の即位","y":592,"q":"592年に崇峻天皇が蘇我馬子に暗殺されると、欽明天皇の娘が女性の天皇として即位し、甥の厩戸王らと政治を進めた。この女性は、即位する前にはある天皇の皇后であった。その天皇は誰か。","c":["敏達天皇","用明天皇","崇峻天皇","舒明天皇"],"e":"推古天皇は欽明天皇の娘で、異母兄にあたる敏達天皇の皇后でした。敏達天皇の没後、用明・崇峻天皇をへて、592年に崇峻天皇が蘇我馬子に暗殺されると即位し、甥の厩戸王（聖徳太子）や馬子が政治を支えました。用明天皇は推古天皇の同母兄で厩戸王の父、崇峻天皇は暗殺された異母弟です。舒明天皇は推古天皇の次の天皇で、その皇后がのちの皇極天皇です。","m":"敏達の皇后→推古天皇、舒明の皇后→皇極天皇"},{"id":21,"k":"past","ref":"2026年度 2月9日 Ⅰ-A-ロ","f":"原始・古代","t":"山背大兄王","y":643,"q":"皇極天皇の時代の643年、権力を強めた蘇我入鹿は、厩戸王（聖徳太子）の子で有力な皇位継承候補であった人物を斑鳩（いかるが）に襲い、一族とともに自害に追い込んだ。この人物は誰か。","c":["山背大兄王","古人大兄皇子","有間皇子","大津皇子"],"e":"山背大兄王は厩戸王の子で、推古天皇の没後に田村皇子（舒明天皇）と皇位を争った有力な王族でした。皇極天皇が即位したのち、蘇我入鹿が643年に斑鳩宮を襲い、一族は滅ぼされました。この事件は645年の乙巳の変の背景の一つとなります。古人大兄皇子は蘇我氏が推した舒明天皇の皇子で乙巳の変の後に討たれ、有間皇子は孝徳天皇の皇子で658年に処刑、大津皇子は天武天皇の皇子で686年に自害しました。","m":"643年山背大兄王の滅亡→645年乙巳の変で蘇我本宗家滅亡"},{"id":22,"k":"past","ref":"2026年度 2月9日 Ⅰ-A-ハ","f":"原始・古代","t":"阿倍比羅夫","y":658,"q":"斉明天皇の時代、朝廷は日本海側の北方へ勢力を広げようとした。658年ごろから水軍を率いて秋田・津軽方面の蝦夷を服属させ、のちに百済救援の軍にも将軍として加わった人物は誰か。","c":["阿倍比羅夫","坂上田村麻呂","文室綿麻呂","阿倍仲麻呂"],"e":"阿倍比羅夫は斉明天皇のもとで、658年ごろから水軍を率いて日本海沿岸を北上し、秋田・能代・津軽方面の蝦夷を服属させ、粛慎（みしはせ）とも戦ったと伝えられます。のちに百済救援の将軍として朝鮮半島へ出兵しました。坂上田村麻呂は桓武天皇の時代の征夷大将軍で802年に胆沢城を築き、文室綿麻呂は嵯峨天皇の時代に蝦夷を攻めた将軍です。阿倍仲麻呂は奈良時代に唐へ渡り、玄宗に仕えた留学生です。","m":"斉明朝＝阿倍比羅夫（日本海側）、桓武朝＝坂上田村麻呂"},{"id":23,"k":"past","ref":"2026年度 2月9日 Ⅰ-A-ニ","f":"原始・古代","t":"庚寅年籍","y":690,"q":"天武天皇の皇后であった持統天皇は、689年に施行した飛鳥浄御原令にもとづき、翌690年に全国的な戸籍を作成させて民衆の把握を進めた。この戸籍を何というか。","c":["庚寅年籍","庚午年籍","壬申戸籍","計帳"],"e":"庚寅年籍は690年、持統天皇が飛鳥浄御原令にもとづいて作らせた戸籍です。以後、戸籍は6年ごとに作成され、班田収授を行う基礎となりました。持統天皇は694年に藤原京へ遷都し、律令国家の形成を進めました。庚午年籍は670年に天智天皇のもとで作られた最初の全国的戸籍で、氏姓を正す根本台帳として永久保存とされました。壬申戸籍は1872年に明治政府が作成した戸籍、計帳は調・庸を課すために毎年作られた台帳です。","m":"庚午年籍670＝天智、庚寅年籍690＝持統（20年後）"},{"id":24,"k":"past","ref":"2026年度 2月9日 Ⅰ-A-ホ","f":"原始・古代","t":"元正天皇","y":715,"q":"715年、元明天皇は娘に譲位し、女性の天皇が2代続いた。この天皇の在位中には養老律令の編纂や『日本書紀』の完成、三世一身法の施行があり、724年に甥の聖武天皇へ譲位した。この天皇は誰か。","c":["元正天皇","持統天皇","孝謙天皇","皇極天皇"],"e":"元正天皇は草壁皇子と元明天皇の娘で、文武天皇の姉にあたります。715年に母から譲位されて即位し、在位中の718年に藤原不比等らが養老律令をまとめ、720年に『日本書紀』が完成、723年に三世一身法が出されました。724年に文武天皇の子の聖武天皇に譲位しています。持統天皇は天武天皇の皇后で694年に藤原京へ遷都し、孝謙天皇は聖武天皇の娘、皇極天皇は乙巳の変のときの天皇で、のちに斉明天皇として重祚しました。","m":"元明（母）710平城遷都→元正（娘）→聖武（甥）"},{"id":25,"k":"past","ref":"2026年度 2月9日 Ⅰ-A-ヘ","f":"中世","t":"慈円と愚管抄","y":1220,"q":"鎌倉時代前期、摂関家出身で天台座主をつとめた僧が、承久の乱の直前に、歴史を道理の移り変わりとして論じた史論書を著した。同書には、女性が政治を仕上げる国という意味の「女人入眼の日本国」という表現もみえる。著者は誰か。","c":["慈円","北畠親房","九条兼実","虎関師錬"],"e":"慈円は関白九条兼実の弟で、天台座主をつとめた僧です。1220年ごろ、後鳥羽上皇の討幕の動きをいさめる意図もこめて『愚管抄』を著し、歴史の移り変わりを「道理」によって説明しました。北畠親房は南北朝時代に南朝の正統性を説く『神皇正統記』を著した公家、九条兼実は慈円の兄で日記『玉葉』を残した人物、虎関師錬は鎌倉時代末期に仏教史書『元亨釈書』をまとめた禅僧です。","m":"慈円『愚管抄』＝道理・承久の乱直前／親房『神皇正統記』＝南朝"},{"id":26,"k":"past","ref":"2026年度 2月9日 Ⅰ-A-ト","f":"中世","t":"八条院領","y":1161,"q":"院政期、鳥羽上皇は美福門院との間に生まれた皇女に多くの荘園を伝えた。全国に広がるこの荘園群は、鎌倉時代に亀山上皇に伝わり、大覚寺統の経済基盤となった。この皇女の女院号は何か。","c":["八条院","宣陽門院","建礼門院","待賢門院"],"e":"八条院（暲子内親王）は鳥羽上皇と美福門院の娘で、1161年に院号を受けました。父母から譲られた荘園群は八条院領とよばれ、平安時代末に約100か所、のちには200か所以上に及んだとされ、鎌倉時代に亀山上皇に伝わって大覚寺統の経済基盤となりました。宣陽門院は後白河上皇の皇女で、のちに持明院統に伝わる長講堂領を継承した女院です。建礼門院は平清盛の娘で安徳天皇の母、待賢門院は鳥羽天皇の中宮で崇徳・後白河天皇の母です。","m":"八条院領→大覚寺統、長講堂領→持明院統"},{"id":27,"k":"past","ref":"2026年度 2月9日 Ⅰ-A-チ","f":"近世","t":"和子入内と明正天皇","y":1620,"q":"江戸幕府は朝廷への統制を強めるなかで、1620年にある将軍の娘和子（まさこ、のちの東福門院）を後水尾天皇に入内させた。その間に生まれた皇女は1629年に明正天皇として即位した。この将軍は誰か。","c":["徳川秀忠","徳川家康","徳川家光","徳川家綱"],"e":"2代将軍徳川秀忠は、1620年に娘の和子を後水尾天皇に入内させました。1629年、紫衣事件などで幕府と対立した後水尾天皇が突然譲位し、和子の生んだ皇女が明正天皇として即位しました。奈良時代の称徳天皇以来の女性天皇で、秀忠は天皇の外祖父となりました。徳川家康は初代将軍で和子の祖父、家光は明正天皇が即位したときの3代将軍で和子の兄、家綱は家光の子の4代将軍です。","m":"秀忠の娘和子→後水尾天皇→明正天皇（称徳以来の女帝）"},{"id":28,"k":"past","ref":"2026年度 2月9日 Ⅰ-B-2","f":"原始・古代","t":"倭の五王と遣隋使","y":607,"q":"『宋書』倭国伝にみえる5世紀の倭の五王の外交と、『隋書』倭国伝にみえる7世紀初めの推古朝の遣隋使の外交とを比べたとき、中国皇帝に対する姿勢の違いを正しく説明した文はどれか。","c":["倭の五王は宋に朝貢して称号を求め冊封を受けたが、推古朝は隋に朝貢しつつも冊封を求めなかった。","倭の五王は宋に冊封を求めなかったが、推古朝は隋の皇帝から倭王の称号を授かり冊封を受けた。","倭の五王も推古朝も、朝鮮半島での立場を有利にするため、中国皇帝に冊封を求めて称号を得た。","倭の五王も推古朝も、中国皇帝に朝貢することなく、対等な立場で国交を結ぼうとした。"],"e":"『宋書』倭国伝によると、讃・珍・済・興・武の倭の五王は5世紀に南朝の宋へ朝貢し、朝鮮半島南部での立場を有利にするため、安東大将軍・倭王などの称号を求めて冊封を受けました。これに対し『隋書』倭国伝では、607年に小野妹子が「日出づる処の天子」で始まる国書を持参して煬帝の不興をかっており、推古朝は朝貢はしても冊封は求めず、臣属しない姿勢をとったことが分かります。ほかの文は両者の関係を逆にしたり、同じ姿勢とした点が誤りです。","m":"倭の五王＝朝貢＋冊封、遣隋使＝朝貢するが冊封は受けない"},{"id":29,"k":"past","ref":"2026年度 2月9日 Ⅱ-A-イ","f":"近世","t":"恋川春町","y":1789,"q":"1775年に『金々先生栄花夢』を著して黄表紙という分野を開いた武士出身の作者は、1789年に寛政の改革の文武奨励を風刺した『鸚鵡返文武二道』を刊行して幕府に呼び出され、同年に没した。この人物は誰か。","c":["恋川春町","山東京伝","柳亭種彦","為永春水"],"e":"恋川春町は駿河小島藩の藩士で、1775年の『金々先生栄花夢』は黄表紙の最初の作品とされます。松平定信による寛政の改革が始まると、文武奨励を皮肉った『鸚鵡返文武二道』を1789年に出して幕府に呼び出され、まもなく亡くなりました。山東京伝は洒落本『仕懸文庫』などで1791年に手鎖の刑を受けた作者です。柳亭種彦は合巻『偐紫田舎源氏』、為永春水は人情本『春色梅児誉美』の作者で、ともに天保の改革で処罰されました。","m":"寛政＝春町・京伝（黄表紙・洒落本）、天保＝春水・種彦"},{"id":30,"k":"past","ref":"2026年度 2月9日 Ⅱ-A-ロ","f":"近代","t":"官板バタビヤ新聞","y":1862,"q":"1862年、幕府の蕃書調所は、ジャワ島にあったオランダの植民地政庁の機関紙から海外事情の記事を選んで翻訳し、冊子の形で刊行した。日本で最初の新聞とされるこの刊行物を何というか。","c":["官板バタビヤ新聞","中外新聞","江湖新聞","太政官日誌"],"e":"官板バタビヤ新聞は、1862年に幕府の洋学研究機関である蕃書調所が、バタビア（現在のジャカルタ）のオランダ総督府の機関紙を抄訳して刊行したもので、日本最初の新聞とされます。幕府が得た海外情報を公開したものでした。中外新聞は1868年に柳河春三が、江湖新聞は同年に福地源一郎が江戸で創刊した民間の新聞です。太政官日誌は1868年から新政府が法令や人事などを知らせるために発行した刊行物です。","m":"1862官板バタビヤ新聞（翻訳）→1870横浜毎日新聞（日刊）"},{"id":31,"k":"past","ref":"2026年度 2月9日 Ⅱ-A-ハ","f":"近代","t":"最初の日刊新聞","y":1870,"q":"明治初期、活版印刷の技術が広まるなかで、1870年（明治3年）末に開港地のある神奈川県で日本最初の日刊新聞が創刊された。貿易や商業に関する記事を多く載せたこの新聞を何というか。","c":["横浜毎日新聞","東京日日新聞","郵便報知新聞","朝野新聞"],"e":"横浜毎日新聞は1870年（明治3年12月）に横浜で創刊された日本最初の日刊新聞です。本木昌造が鉛製活字の量産に成功したことが、新聞や雑誌の発行がさかんになる背景となりました。東京日日新聞は1872年に東京で創刊され、のち福地源一郎が主筆となって政府寄りの論調をとった新聞です。郵便報知新聞は1872年に前島密らが創刊し、のち立憲改進党系となりました。朝野新聞は1874年から成島柳北らが政府批判を展開した新聞です。","m":"最初の新聞＝官板バタビヤ、最初の日刊＝横浜毎日（1870）"},{"id":32,"k":"past","ref":"2026年度 2月9日 Ⅱ-A-ニ","f":"近代","t":"新聞紙条例","y":1875,"q":"1875年、政府は漸次立憲政体樹立の詔を出す一方、讒謗律（ざんぼうりつ）とあわせて、新聞・雑誌で政府を攻撃する民権派の言論を取り締まる法令を定め、編集者らへの処罰を規定した。この法令は何か。","c":["新聞紙条例","集会条例","保安条例","治安警察法"],"e":"新聞紙条例は1875年6月に讒謗律とともに定められ、政府を批判する新聞・雑誌の記事を取り締まり、編集者らに禁獄や罰金を科しました。同年の大阪会議をうけて漸次立憲政体樹立の詔が出される一方、民権派の言論は厳しく抑えられました。集会条例は1880年に国会期成同盟の運動に対して政治集会・結社を規制した法令、保安条例は1887年に三大事件建白運動の活動家を東京から追放した法令、治安警察法は1900年に労働運動などを取り締まった法令です。","m":"1875讒謗律・新聞紙条例→1880集会条例→1887保安条例"},{"id":33,"k":"past","ref":"2026年度 2月9日 Ⅱ-A-ホ","f":"近代","t":"日本鉄道会社","y":1881,"q":"1881年、華族の金禄公債などを資金に、政府の手厚い保護を受けて最初の私鉄会社が設立された。同社は1891年に上野・青森間を全通させ、鉄道網の拡大は新聞や雑誌の全国的な流通も支えた。この会社は何か。","c":["日本鉄道会社","山陽鉄道会社","九州鉄道会社","関西鉄道会社"],"e":"日本鉄道会社は1881年に華族を主体として設立された最初の私鉄会社で、政府の保護を受けて1883年に上野・熊谷間を開業し、1891年には上野・青森間を全通させました。その成功は企業勃興期の私鉄設立ブームをまねき、1889年には営業キロ数で民営が官営を上回りました。山陽鉄道・九州鉄道・関西鉄道はいずれもその後に設立された私鉄で、日本鉄道とともに1906年の鉄道国有法によって買収され、国有化されました。","m":"1881日本鉄道（華族出資）→1889民営＞官営→1906鉄道国有法"},{"id":34,"k":"past","ref":"2026年度 2月9日 Ⅱ-A-ヘ","f":"近代","t":"新中間層","y":1925,"q":"大正期から昭和初期の都市では、会社員・銀行員・公務員など俸給で生活する人びとが増え、郊外の文化住宅に住み、『キング』のような大衆雑誌や円本の読者となった。こうした社会層を何とよぶか。","c":["新中間層","成金","職業婦人","高等遊民"],"e":"新中間層は、第一次世界大戦後の都市化と高等教育の拡充を背景に増えた、会社員・銀行員・公務員などの俸給生活者（サラリーマン）をさす語です。新聞・雑誌の主な読者となり、1925年創刊の『キング』や1冊1円の円本など、出版の大衆化を支えました。成金は大戦景気で急に富を得た人、職業婦人はタイピストや電話交換手など仕事をもつ女性をさします。高等遊民は高い教育を受けながら定職につかない人をいう明治末期の語です。","m":"新中間層＝俸給生活者→文化住宅・『キング』・円本"},{"id":35,"k":"past","ref":"2026年度 2月9日 Ⅱ-A-ト","f":"現代","t":"中間小説","y":1947,"q":"敗戦後、出版界が復興して小説雑誌や週刊誌が次々に刊行されると、芸術性を重んじる純文学と、娯楽性の強い大衆文学との間に位置づけられる小説がさかんに書かれ、多くの読者を得た。こうした小説を何とよぶか。","c":["中間小説","私小説","戦後派文学","無頼派文学"],"e":"中間小説は、純文学と大衆文学の中間に位置する小説という意味で、第二次世界大戦後に使われるようになった語です。『小説新潮』などの小説雑誌を舞台に石坂洋次郎らが活躍し、高度経済成長期には松本清張や司馬遼太郎らの作品が幅広い読者を得ました。私小説は作者自身の体験を素材とする小説で大正期から純文学の主流となったもの、戦後派文学は野間宏や大岡昇平らが戦争体験をもとに書いた文学、無頼派文学は太宰治や坂口安吾らの作品をさします。","m":"純文学と大衆文学の中間＝中間小説（戦後の小説雑誌）"},{"id":36,"k":"past","ref":"2026年度 2月9日 Ⅱ-A-チ","f":"現代","t":"社会派推理小説","y":1958,"q":"1950年代前半に芥川賞を受けたのち、1957年から雑誌に連載した『点と線』で社会派推理小説という分野を開き、『砂の器』や占領期の事件を追った『日本の黒い霧』でも広く読まれた作家は誰か。","c":["松本清張","司馬遼太郎","江戸川乱歩","大江健三郎"],"e":"松本清張は『或る「小倉日記」伝』で芥川賞を受けたのち、1957〜58年に発表した『点と線』で、犯罪の背後にある社会のしくみを描く社会派推理小説を確立しました。作品は新書判の単行本や週刊誌を通じて広く読まれ、『日本の黒い霧』などのノンフィクションも手がけました。司馬遼太郎は『竜馬がゆく』『坂の上の雲』などの歴史小説の作家、江戸川乱歩は大正末期から活躍した探偵小説の作家、大江健三郎は1994年にノーベル文学賞を受けた作家です。","m":"清張＝社会派推理『点と線』、司馬＝歴史小説『坂の上の雲』"},{"id":37,"k":"past","ref":"2026年度 2月9日 Ⅱ-B-3","f":"近世","t":"人足寄場","y":1790,"q":"寛政の改革では、出版統制などの風俗取締りとともに江戸の治安対策が進められた。1790年、火付盗賊改の長谷川平蔵の建議により石川島に設けられ、無宿人を収容して職業技術を身につけさせた施設は何か。","c":["人足寄場","小石川養生所","町会所","御救小屋"],"e":"人足寄場は1790年、老中松平定信が長谷川平蔵の建議を入れて江戸の石川島に設けた施設で、無宿人らを収容して大工や紙すきなどの技術を身につけさせ、社会復帰をはかりました。天明の飢饉後に江戸へ流れこんだ人びとへの治安対策でした。小石川養生所は享保の改革で目安箱の投書をもとに設けられた医療施設、町会所は寛政の改革で七分積金を運用し貧民救済にあたった機関、御救小屋は飢饉や災害の際に困窮者を収容した小屋です。","m":"寛政の改革：無宿人→人足寄場、町費節約→七分積金"},{"id":38,"k":"past","ref":"2026年度 2月9日 Ⅱ-B-6","f":"近代","t":"太政官札","y":1868,"q":"1868年、成立まもない明治新政府は、戊辰戦争の戦費など財政の不足を補うため、由利公正の建議により、金貨や銀貨と交換できない最初の政府紙幣を発行した。この紙幣を何というか。","c":["太政官札","民部省札","国立銀行券","日本銀行券"],"e":"太政官札は1868年に由利公正（三岡八郎）の建議で発行された最初の政府紙幣で、10両から1朱までの5種がありました。正貨と交換できない不換紙幣で、新政府の信用も低かったため価値が下がり、経済を混乱させました。民部省札は翌1869年に小額取引用として発行された政府紙幣です。国立銀行券は1872年の国立銀行条例にもとづき各国立銀行が発行した銀行券、日本銀行券は1882年設立の日本銀行が1885年から発行した銀兌換の銀行券です。","m":"1868太政官札→1869民部省札→1872国立銀行条例"},{"id":39,"k":"past","ref":"2026年度 2月9日 Ⅱ-B-7","f":"近代","t":"南満洲鉄道","y":1906,"q":"日露戦争後の1906年、ポーツマス条約でロシアから譲り受けた長春・旅順間の鉄道と、沿線の炭鉱などを経営するため、半官半民の国策会社が設立され、大連に本社を置いた。この会社は何か。","c":["南満洲鉄道株式会社","東洋拓殖会社","満洲重工業開発会社","北支那開発会社"],"e":"南満洲鉄道株式会社（満鉄）は1906年に設立された半官半民の会社で、初代総裁は後藤新平です。ロシアから得た長春・旅順間の鉄道に加え、撫順炭鉱や鞍山製鉄所なども経営し、関東都督府とともに日本の満洲進出の中心となりました。東洋拓殖会社は1908年に朝鮮の土地開発のために設立された国策会社、満洲重工業開発会社は1937年に日産の鮎川義介が満洲国に移って設立した会社、北支那開発会社は日中戦争下の1938年に華北の開発のためつくられた会社です。","m":"1906満鉄（大連・後藤新平）と関東都督府（旅順）をセットで"},{"id":40,"k":"past","ref":"2026年度 2月9日 Ⅱ-B-9","f":"近代","t":"母性保護論争","y":1918,"q":"1918年から翌年にかけて、『婦人公論』などの雑誌上で、女性の経済的自立を重んじる与謝野晶子と、国家が妊娠・出産・育児期の女性を保護すべきだと説く平塚らいてうらが意見をたたかわせた。この論争を何というか。","c":["母性保護論争","アナ・ボル論争","日本資本主義論争","天皇機関説論争"],"e":"母性保護論争は1918〜19年に『婦人公論』や『太陽』などで行われた論争です。与謝野晶子は、国家に保護を求めるのは依頼主義だとして女性の経済的自立を説き、平塚らいてうはエレン＝ケイの思想をもとに国家による母性の保護を主張し、山川菊栄は社会主義の立場から両者を批判しました。アナ・ボル論争は1920年代初めの無政府主義と共産主義の対立、日本資本主義論争は1930年代の講座派と労農派の論争、天皇機関説論争は1912年の美濃部達吉と上杉慎吉の論争です。","m":"晶子＝経済的自立、らいてう＝国家の母性保護、菊栄＝社会主義"},{"id":41,"k":"past","ref":"2026年度 2月11日 Ⅰ-A-イ","f":"近代","t":"東京招魂社の改称","y":1879,"q":"戊辰戦争の戦没者を祀るため1869年に東京九段に設けられた東京招魂社は、1879年に改称され、以後、対外戦争の戦死者も合祀して、遺族となった女性たちの参拝の場ともなった。改称後のこの神社はどれか。","c":["靖国神社","明治神宮","平安神宮","橿原神宮"],"e":"正解は靖国神社です。1869年に創建された東京招魂社が1879年に靖国神社と改称され、別格官幣社として戦死した軍人らを祭神に合祀しました。明治神宮は明治天皇と昭憲皇太后を祀って1920年に創建、平安神宮は平安遷都1100年を記念して1895年に創建された桓武天皇を祀る神社、橿原神宮は1890年創建で神武天皇を祀る神社であり、いずれも戦没者を祀るために設けられたものではありません。","m":"東京招魂社（1869）→靖国神社（1879）、場所は九段"},{"id":42,"k":"past","ref":"2026年度 2月11日 Ⅰ-A-ロ","f":"原始・古代","t":"卑弥呼の呪術","y":239,"q":"「魏志」倭人伝によれば、3世紀に倭の諸国に共立されて邪馬台国の女王となった卑弥呼は、呪術的な力によって人々を従え、政治は弟が補佐したという。同書で卑弥呼が用いたとされるこの呪術を表す語はどれか。","c":["鬼道","太占","盟神探湯","禊"],"e":"正解は鬼道です。「魏志」倭人伝は卑弥呼について「鬼道を事とし、能く衆を惑わす」と記し、巫女として神の意思を聞く力で国を治めたことを伝えます。卑弥呼は239年に魏に使いを送り「親魏倭王」の称号を得ました。太占（ふとまに）は鹿の骨を焼いて吉凶を占う方法、盟神探湯（くかたち）は熱湯に手を入れさせて真偽を判定する神判、禊（みそぎ）は水で穢れを落とす行為で、いずれも古墳時代の習俗として知られるものです。","m":"卑弥呼＝鬼道で統治、239年に魏へ遣使し親魏倭王"},{"id":43,"k":"past","ref":"2026年度 2月11日 Ⅰ-A-ハ","f":"原始・古代","t":"乙巳の変後の即位","y":645,"q":"645年、中大兄皇子らが蘇我蝦夷・入鹿を滅ぼした乙巳の変の直後、女帝の皇極天皇から位を譲られて即位した天皇は誰か。皇極天皇の弟にあたり、都を飛鳥から難波に移して改新の政治を進めた。","c":["孝徳天皇","斉明天皇","天智天皇","天武天皇"],"e":"正解は孝徳天皇です。乙巳の変ののち皇極天皇が譲位し、弟の軽皇子が即位して孝徳天皇となりました。中大兄皇子を皇太子とし、難波宮（難波長柄豊碕宮）に都を移して、646年に改新の詔を出したとされます。斉明天皇は孝徳天皇の死後に皇極天皇が再び即位（重祚）したときの名、天智天皇は中大兄皇子が668年に即位したもの、天武天皇は672年の壬申の乱に勝って即位した大海人皇子です。","m":"皇極→孝徳（難波宮）→斉明（皇極の重祚）→天智"},{"id":44,"k":"past","ref":"2026年度 2月11日 Ⅰ-A-ニ","f":"原始・古代","t":"光明皇后の社会事業","y":730,"q":"聖武天皇の皇后で藤原不比等の娘である光明皇后（光明子）は、仏教をあつく信仰し、社会事業にも力を注いだ。皇后が設けたと伝えられる施設のうち、貧しい人や孤児を収容して救済するためのものはどれか。","c":["悲田院","施薬院","綜芸種智院","勧学院"],"e":"正解は悲田院です。光明皇后は仏教の慈悲の教えにもとづき、貧窮者や孤児を収容する悲田院と、病人に薬を与えて治療する施薬院を設けたとされます。施薬院も皇后の事業ですが、医療・施薬のための施設で目的が異なります。綜芸種智院は9世紀に空海が京都に開いた庶民にも開かれた教育施設、勧学院は藤原氏が一族の子弟のために設けた大学別曹で、いずれも社会救済の施設ではありません。","m":"光明皇后：悲田院＝収容・救済、施薬院＝薬と治療"},{"id":45,"k":"past","ref":"2026年度 2月11日 Ⅰ-B-3","f":"近代","t":"総力戦","y":1914,"q":"第一次世界大戦は、軍事力だけでなく経済力や国民の労働力など国力のすべてを動員する新しい形の戦争となり、各国で女性も軍需工場などで働いた。日本でも1938年の国家総動員法制定につながる、この戦争形態を何というか。","c":["総力戦","電撃戦","冷戦","代理戦争"],"e":"正解は総力戦です。第一次世界大戦（1914〜18年）は長期化し、前線の兵力だけでなく後方の工業生産や国民生活までを戦争に動員する総力戦となりました。日本でも日中戦争下の1938年に国家総動員法が制定され、女性も勤労動員の対象となっていきます。電撃戦は戦車や航空機で短期決着をねらう戦法、冷戦は第二次世界大戦後の米ソ両陣営の対立、代理戦争は大国が直接戦わず他国の紛争を支援して争う形です。","m":"総力戦＝前線＋銃後を総動員、日本は1938年国家総動員法"},{"id":46,"k":"past","ref":"2026年度 2月11日 Ⅰ-B-8","f":"近世","t":"京都を描く屛風絵","y":1574,"q":"16世紀以降、京都の市中と郊外の名所や祭礼、商いや芸能にたずさわる男女の暮らしを、高い視点から見下ろすように描いた屛風絵が数多く作られた。狩野永徳の作で、織田信長が上杉謙信に贈ったと伝えられる作品が有名なこの絵画はどれか。","c":["洛中洛外図屛風","南蛮屛風","唐獅子図屛風","職人尽図屛風"],"e":"正解は洛中洛外図屛風です。京都の市中（洛中）と郊外（洛外）のようすを描いた風俗画で、戦国期から江戸時代にかけて制作されました。狩野永徳筆のものは、織田信長が上杉謙信に贈ったと伝えられます。南蛮屛風は来航した南蛮人や南蛮船を描いたもの、唐獅子図屛風は同じ永徳の代表作ですが雄大な獅子を描いた作品、職人尽図屛風はさまざまな職人の仕事ぶりを描いたもので、京都全体の景観を描いたものではありません。","m":"洛中洛外図＝京都の内と外、永徳筆を信長が謙信へ"},{"id":47,"k":"past","ref":"2026年度 2月11日 Ⅰ-B-9","f":"中世","t":"田楽の流行","y":1096,"q":"田植えのときに豊作を祈って行われた歌や踊りから発達し、院政期の1096年には京都で貴族から庶民までが熱狂する大流行をみせた芸能はどれか。鎌倉時代の末には、得宗の北条高時が好んだことでも知られる。","c":["田楽","猿楽","今様","催馬楽"],"e":"正解は田楽です。農耕儀礼の歌舞に始まり、専門の田楽法師も現れました。1096年の大流行のようすは大江匡房が『洛陽田楽記』に記しています。のち猿楽とともに能の源流となりました。猿楽は滑稽な物まねなどを中心とする芸能で、室町時代に観阿弥・世阿弥が能として大成しました。今様は平安後期に流行した歌謡で後白河上皇が『梁塵秘抄』に集め、催馬楽（さいばら）は古代の歌謡を貴族が雅楽風に歌ったもので、農耕儀礼の歌舞ではありません。","m":"田楽＝田植えの歌舞、猿楽＝物まね芸、ともに能の源流"},{"id":48,"k":"past","ref":"2026年度 2月11日 Ⅰ-B-13","f":"近代","t":"民俗学の確立","y":1910,"q":"農商務省の官僚などを務めるかたわら各地の民間伝承や年中行事を調べ、文字記録に残りにくい庶民（常民）の生活史を明らかにする民俗学を確立した人物は誰か。1910年に岩手県の伝承をまとめた『遠野物語』を著した。","c":["柳田国男","折口信夫","南方熊楠","柳宗悦"],"e":"正解は柳田国男です。1910年の『遠野物語』をはじめ、雑誌『郷土研究』の刊行などを通じて、民間伝承から「常民」の生活文化を探る日本民俗学を確立しました。女性の霊的な役割を論じた『妹の力』もあります。折口信夫は柳田に学び国文学と民俗学を結びつけた学者、南方熊楠は粘菌の研究や神社合祀反対運動で知られる博物学者、柳宗悦は日用の雑器に美を見いだした民芸運動の提唱者です。","m":"柳田国男＝『遠野物語』・常民・民俗学の確立"},{"id":49,"k":"past","ref":"2026年度 2月11日 Ⅰ-C","f":"中世","t":"尼将軍北条政子","y":1219,"q":"源頼朝の妻北条政子は、1219年に3代将軍源実朝が暗殺されて源氏の将軍が絶えたのち「尼将軍」と呼ばれた。このころの政子の立場を説明した文として、最も適切なものはどれか。","c":["征夷大将軍には就任しなかったが、幼い藤原頼経を後見し、幕府の長として将軍の権力を行使した。","朝廷から正式に征夷大将軍に任命され、女性として初めて将軍職について御家人を統率した。","初代の執権に就任し、政所別当として幕府の政務をとりしきる地位を北条氏で初めて得た。","出家後は政治から身を引き、幕府の運営は執権と評定衆による合議にすべてゆだねた。"],"e":"政子は将軍職には就いていません。実朝の死後、摂関家から藤原（九条）頼経が後継者として迎えられましたが幼少であったため、政子が後見として実質的に幕府の長の役割を果たし、弟の執権北条義時が支えました。1221年の承久の乱では御家人に頼朝の恩を説いて結束させています。初代執権は父の北条時政です。評定衆は政子の死（1225年）ののち北条泰時が設けたもので、政子が政治から退いた事実もありません。","m":"尼将軍＝将軍職には就かず、幼い頼経に代わり将軍権力を行使"},{"id":50,"k":"past","ref":"2026年度 2月11日 Ⅱ-A-イ","f":"近世","t":"元禄の貨幣改鋳","y":1695,"q":"5代将軍徳川綱吉の時代、鉱山収入の減少や明暦の大火後の復興費、寺社造営などで幕府財政が悪化した。勘定吟味役（のち勘定奉行）として1695年に金の含有率を下げた小判への改鋳を行い、差益（出目）で収入を増やした人物は誰か。","c":["荻原重秀","新井白石","柳沢吉保","堀田正俊"],"e":"正解は荻原重秀です。重秀の建議により、慶長小判より金の含有率を下げた元禄小判が1695年から鋳造され、幕府は改鋳の差益（出目）で多額の収入を得ましたが、貨幣価値の下落で物価が上がり人々の生活を圧迫しました。新井白石は6代家宣・7代家継に仕え、正徳小判を出して金の含有率を慶長小判の水準に戻した人物です。柳沢吉保は綱吉の側用人、堀田正俊は綱吉初期の政治を補佐した大老で、改鋳の担当者ではありません。","m":"元禄＝荻原重秀が質を落とす、正徳＝新井白石が元に戻す"},{"id":51,"k":"past","ref":"2026年度 2月11日 Ⅱ-A-ロ","f":"近世","t":"長崎貿易の輸出品","y":1785,"q":"18世紀後半、田沼意次は長崎貿易で金・銀の流出を抑え、逆に輸入をはかるため、銅とともに海産物の輸出を奨励した。いりこ（干しなまこ）・干し鮑・ふかのひれなど、中国料理の高級食材として清に輸出された海産物の総称はどれか。","c":["俵物","蔵物","納屋物","干鰯"],"e":"正解は俵物（たわらもの）です。蝦夷地などで産するいりこ・干し鮑・ふかのひれなどを俵に詰めて長崎から清へ輸出したもので、田沼意次は銅や俵物の輸出を増やして金・銀の輸入をはかりました。蔵物は諸藩が蔵屋敷に送って販売した年貢米や特産物、納屋物は蔵屋敷を通さず民間の商人が扱った商品、干鰯（ほしか）は鰯を干して作る金肥（購入肥料）で、いずれも輸出用海産物の総称ではありません。","m":"俵物＝いりこ・干し鮑・ふかひれ、長崎から清へ"},{"id":52,"k":"past","ref":"2026年度 2月11日 Ⅱ-A-ハ","f":"近代","t":"円・銭・厘の制定","y":1871,"q":"1871年、明治政府は伊藤博文らの建議をうけ、円・銭・厘の十進法を単位とする新しい硬貨を発行する法令を定めた。金本位制を建前としたが、貿易では銀貨も使われ、実際には金銀複本位制となったこの法令はどれか。","c":["新貨条例","国立銀行条例","日本銀行条例","貨幣法"],"e":"正解は新貨条例です。1871年に制定され、両・分・朱の四進法に代えて円・銭・厘の十進法を採用しました。金本位制をめざしましたが、アジアの貿易では銀が主に用いられていたため開港場では銀貨が通用し、実態は金銀複本位制でした。国立銀行条例（1872年）は渋沢栄一らが中心となり兌換銀行券の発行をめざした法令、日本銀行条例（1882年）は中央銀行設立のための法令、貨幣法（1897年）は金本位制を確立した法律です。","m":"1871新貨条例（円銭厘）→1897貨幣法（金本位確立）"},{"id":53,"k":"past","ref":"2026年度 2月11日 Ⅱ-A-ニ","f":"近代","t":"金本位制の確立","y":1897,"q":"1897年、第2次松方正義内閣は、日清戦争の賠償金の一部を準備金にあて、欧米諸国と同じ金本位制を確立して貿易の振興と外資導入をはかった。このとき制定された法律はどれか。","c":["貨幣法","新貨条例","国立銀行条例","兌換銀行券条例"],"e":"正解は貨幣法です。1880年代に松方財政のもとで銀本位制が整いましたが、欧米の主要国は金本位制をとっており、銀価格の下落で為替相場が不安定でした。そこで1897年、日清戦争の賠償金を準備金として貨幣法を制定し、金本位制を確立しました。新貨条例（1871年）は円・銭・厘を定めた法令、国立銀行条例（1872年）は民間の銀行に銀行券を発行させた法令、兌換銀行券条例（1884年）は日本銀行による銀兌換の銀行券発行を定めた法令です。","m":"日清戦争の賠償金→1897年貨幣法→金本位制確立"},{"id":54,"k":"past","ref":"2026年度 2月11日 Ⅱ-A-ホ","f":"近代","t":"金輸出再禁止","y":1931,"q":"1931年12月、満州事変への対応をめぐって立憲民政党の内閣が総辞職したあと、立憲政友会を与党として組閣し、高橋是清を蔵相にすえて直ちに金輸出再禁止を断行した首相は誰か。翌年の五・一五事件で暗殺された。","c":["犬養毅","浜口雄幸","斎藤実","田中義一"],"e":"正解は犬養毅です。1931年12月に成立した犬養内閣は、蔵相高橋是清のもとで成立直後に金輸出再禁止を行い、円の金兌換も停止して金本位制から離れました。円安を利用して輸出が伸び、日本は恐慌からいち早く脱出します。犬養は1932年の五・一五事件で海軍青年将校らに暗殺されました。浜口雄幸は1930年に金解禁を実施した立憲民政党の首相、斎藤実は犬養の後を継いだ挙国一致内閣の首相、田中義一は金融恐慌を収拾した立憲政友会の首相です。","m":"金解禁＝浜口・井上、再禁止＝犬養・高橋"},{"id":55,"k":"past","ref":"2026年度 2月11日 Ⅱ-A-ヘ","f":"近代","t":"金本位制離脱後","y":1931,"q":"1931年12月、金輸出が再び禁止され、円と金との兌換も停止された。これ以後の日本でとられた、通貨の発行量を金の保有量にしばられず、政府と中央銀行が政策的に調整する通貨制度を何というか。","c":["管理通貨制度","銀本位制","金銀複本位制","固定為替相場制"],"e":"正解は管理通貨制度です。金本位制では通貨の発行量が正貨（金）の保有量に制約されますが、1931年の金輸出再禁止と兌換停止によって日本はこれを離れ、政府・日本銀行が通貨量を調整する管理通貨制度に事実上移行しました。銀本位制は1880年代の松方財政で整えられた制度、金銀複本位制は1871年の新貨条例のもとでの実態です。固定為替相場制は通貨どうしの交換比率を固定するしくみで、通貨発行の方式を指す語ではありません。","m":"金本位制＝金の量が上限、管理通貨制度＝政府・日銀が調整"},{"id":56,"k":"past","ref":"2026年度 2月11日 Ⅱ-A-ト","f":"現代","t":"戦後の国際通貨体制","y":1952,"q":"日本は1952年に国際通貨基金（IMF）と世界銀行に加盟し、1ドル＝360円の固定為替相場のもとで経済成長を進めた。1944年の連合国の会議で合意された、金と交換できるドルを基軸通貨とする戦後のこの国際通貨体制を何というか。","c":["ブレトン＝ウッズ体制","ワシントン体制","ヴェルサイユ体制","サンフランシスコ体制"],"e":"正解はブレトン＝ウッズ体制です。1944年にアメリカのブレトン＝ウッズで開かれた連合国の会議で、IMFと国際復興開発銀行（世界銀行）の設立が決まり、金と交換できるドルを基軸通貨とする固定為替相場制が戦後の国際経済の枠組みとなりました。ヴェルサイユ体制とワシントン体制は第一次世界大戦後のヨーロッパとアジア・太平洋の国際秩序、サンフランシスコ体制は1951年の平和条約と日米安全保障条約にもとづく戦後日本の外交の枠組みです。","m":"ブレトン＝ウッズ体制＝IMF＋世界銀行＋ドル基軸の固定相場"},{"id":57,"k":"past","ref":"2026年度 2月11日 Ⅱ-A-チ","f":"現代","t":"金・ドル交換停止","y":1971,"q":"1971年8月、ベトナム戦争の戦費などで国際収支が悪化したアメリカは、金とドルの交換停止を突然発表し、戦後の国際通貨体制を大きく揺るがした。その前月に中国訪問の計画も発表していた、このときのアメリカ大統領は誰か。","c":["ニクソン","ジョンソン","ケネディ","レーガン"],"e":"正解はニクソンです。1971年8月、ニクソン大統領はドル防衛のため金とドルの交換停止などを発表しました（ドル＝ショック）。同年末のスミソニアン協定で1ドル＝308円に切り上げられましたが、1973年には変動為替相場制に移行しました。ケネディは1962年のキューバ危機当時の大統領、ジョンソンは北爆を始めてベトナム戦争を本格化させた大統領、レーガンは1985年のプラザ合意当時の大統領で、いずれも時期が異なります。","m":"1971年ニクソン＝ショック→308円→1973年変動相場制"},{"id":58,"k":"past","ref":"2026年度 2月11日 Ⅱ-B-3","f":"近世","t":"田沼時代の計数銀貨","y":1772,"q":"田沼意次が幕政を主導していた1772年、幕府は金貨の単位で額面を示した良質の銀貨を発行した。8枚で小判1両と交換でき、重さを量って使われていた銀を金貨中心の貨幣体系に組み込もうとしたこの貨幣はどれか。","c":["南鐐二朱銀","丁銀","豆板銀","天保一分銀"],"e":"正解は南鐐二朱銀です。1772年に発行され、8枚で小判1両に換えるという趣旨の文言が刻まれた、金貨の単位（朱）で通用する計数銀貨です。東日本の金遣いと西日本の銀遣いに分かれていた貨幣制度を、金を中心に一本化しようとするねらいがありました。丁銀と豆板銀は重さを量って使う秤量貨幣の銀貨です。天保一分銀は同じく金貨の単位をもつ計数銀貨ですが、1837年の発行で、4枚で1両にあたるため当てはまりません。","m":"南鐐二朱銀＝1772年・田沼・8枚で1両の計数銀貨"},{"id":59,"k":"past","ref":"2026年度 2月11日 Ⅱ-B-8","f":"近代","t":"金解禁の蔵相","y":1930,"q":"1929年に成立した立憲民政党の浜口雄幸内閣で蔵相となり、緊縮財政と産業合理化を進めたうえで、1930年1月に旧平価による金解禁を実施した人物は誰か。日本銀行総裁の経験があり、1932年に血盟団員に暗殺された。","c":["井上準之助","高橋是清","片岡直温","団琢磨"],"e":"正解は井上準之助です。浜口雄幸内閣の蔵相として緊縮財政と産業合理化を進め、1930年1月に旧平価で金解禁を実施しましたが、世界恐慌と重なって輸出が減り、正貨が大量に流出して昭和恐慌を招きました。1932年、血盟団事件で暗殺されました。高橋是清は犬養毅内閣の蔵相として1931年に金輸出を再禁止した人物、片岡直温は1927年の失言が金融恐慌のきっかけとなった蔵相、団琢磨は血盟団事件で同じく暗殺された三井合名会社の理事長です。","m":"浜口内閣・井上蔵相＝1930年金解禁→昭和恐慌"},{"id":60,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-イ","f":"原始・古代","t":"奴国王の朝貢","y":57,"q":"57年に倭の奴国の王が後漢の都洛陽に使者を送り、光武帝から印綬を授けられたこと、107年に倭国王帥升らが生口160人を献上したことを記す中国の歴史書はどれか。","c":["『後漢書』東夷伝","『漢書』地理志","『魏志』倭人伝","『宋書』倭国伝"],"e":"『後漢書』東夷伝は、57年に奴国王の使者が光武帝から印綬を受けたこと、107年に倭国王帥升（すいしょう）らが生口を献じたことを伝えます。福岡県志賀島で見つかった金印は、このときの印と考えられています。『漢書』地理志は紀元前1世紀ごろ倭人が百余国に分かれていたこと、『魏志』倭人伝は3世紀の邪馬台国と卑弥呼、『宋書』倭国伝は5世紀の倭の五王を記す史料です。","m":"漢書=百余国→後漢書=奴国・帥升→魏志=卑弥呼→宋書=五王"},{"id":61,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-ロ","f":"原始・古代","t":"倭王武の上表文","y":478,"q":"478年に倭王武が宋の順帝に送った上表文の一節「東は毛人を征すること五十五国、西は衆夷を服すること六十六国、渡りて（　）を平ぐること九十五国」の空欄に入る語はどれか。","c":["海北","海東","遼東","江南"],"e":"『宋書』倭国伝に引かれた倭王武の上表文は、祖先が東の毛人、西の衆夷を従え、さらに海を渡って「海北」の95国を平定したと述べます。海北は朝鮮半島を指すとみられ、半島南部での軍事的な立場を宋に認めさせようとする姿勢がうかがえます。武はワカタケル大王（雄略天皇）にあたると考えられています。海東・遼東・江南はこの一節には現れず、遼東は中国東北部の南端、江南は長江下流の南側を指す地名です。","m":"東は毛人55・西は衆夷66・渡りて海北95（武の上表文）"},{"id":62,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-ハ","f":"原始・古代","t":"磐井の乱","y":527,"q":"527年、朝鮮半島南部へ向かう近江毛野（おうみのけぬ）の軍を、筑紫国造磐井が九州北部で阻んで戦乱となった。このとき磐井が結んでいたとされる朝鮮半島の国はどれか。","c":["新羅","百済","高句麗","加耶"],"e":"6世紀前半、新羅は加耶諸国へ勢力を伸ばしており、ヤマト政権は加耶を支えるため近江毛野の軍を送ろうとしました。筑紫国造磐井は新羅と結んでこれを妨げ、527年に磐井の乱が起こりますが、翌年、物部麁鹿火（もののべのあらかひ）らに鎮圧されました。百済はヤマト政権と友好関係にあった国、高句麗は半島北部の国で、加耶は新羅に圧迫されていた側の小国群なので、いずれもあてはまりません。","m":"磐井は新羅と結ぶ→527年の乱→物部麁鹿火が鎮圧"},{"id":63,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-ニ","f":"原始・古代","t":"風土記の編纂","y":713,"q":"713年、元明天皇のもとで政府は諸国に対し、郡や郷の名に好い字をつけ、産物、土地の肥えぐあい、地名の由来、古老の伝える話などを記して提出するよう命じた。これによりつくられた地誌はどれか。","c":["『風土記』","『古事記』","『日本書紀』","『懐風藻』"],"e":"713年の命令を受けて諸国が編んだ地誌が『風土記』です。現存するのは常陸・出雲・播磨・豊後・肥前の5か国分で、ほぼ完全に残るのは出雲だけです。『古事記』は712年に太安万侶（おおのやすまろ）が稗田阿礼の誦習した内容を筆録した書、『日本書紀』は720年に舎人親王らがまとめた漢文・編年体の正史、『懐風藻』は751年成立の現存最古の漢詩集で、いずれも諸国に提出させた地誌ではありません。","m":"712古事記→713風土記の命令→720日本書紀"},{"id":64,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-ホ","f":"中世","t":"院政と武士","y":1086,"q":"11世紀末に院政を始めた白河上皇が、院の御所を警備させるために新たに置き、源氏・平氏などの武士を登用して院の軍事力とした組織はどれか。","c":["北面の武士","西面の武士","滝口の武者","検非違使"],"e":"白河上皇は1086年に院政を始め、院の御所に北面の武士を置いて源平の武士を側近にしました。院の武力は僧兵の強訴への対応にも用いられ、武士が中央政界へ進出するきっかけとなります。西面の武士は13世紀初めに後鳥羽上皇が置いたもの、滝口の武者は9世紀末から宮中の警備にあたった武士、検非違使は9世紀初めに嵯峨天皇が設けた京内の警察を担う官職で、いずれも白河上皇の創設ではありません。","m":"白河上皇=北面の武士、後鳥羽上皇=西面の武士"},{"id":65,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-ヘ","f":"中世","t":"高麗の抵抗","y":1270,"q":"高麗がモンゴルに服属したのち、1270年から珍島、ついで済州島を拠点に抵抗を続け、1273年に鎮圧された高麗の軍事組織はどれか。その抵抗は元の日本遠征を遅らせる一因となった。","c":["三別抄","両班","刀伊","倭寇"],"e":"三別抄（さんべつしょう）は高麗の武人政権のもとで編成された軍隊で、国王がモンゴルに降ったあとも1270年から抵抗を続け、1273年に済州島で鎮圧されました。文永の役はその翌年の1274年です。両班（ヤンバン）は高麗・朝鮮の文武の官僚層、刀伊は1019年に九州北部を襲った女真人、倭寇は朝鮮半島や中国の沿岸を襲った海賊集団を指す語で、いずれもモンゴルへの抵抗組織ではありません。","m":"三別抄の抵抗（1270〜73）→翌1274年に文永の役"},{"id":66,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-ト","f":"中世","t":"元寇時の執権","y":1274,"q":"フビライの国書が届いた1268年に執権となり、元の服属要求を退けて文永の役・弘安の役の二度の襲来に対処し、のちに無学祖元を招いて円覚寺を開いた人物はだれか。","c":["北条時宗","北条時頼","北条貞時","北条泰時"],"e":"北条時宗は1268年に8代執権となり、元の要求を拒んで1274年の文永の役、1281年の弘安の役を戦いました。文永の役のあとには異国警固番役を強化し、博多湾岸に石築地（いしついじ）を築かせています。時頼は時宗の父で、宝治合戦で三浦氏を滅ぼし引付を設けた5代執権、貞時は時宗の子で永仁の徳政令を出した9代執権、泰時は御成敗式目を定めた3代執権で、いずれも元寇時の執権ではありません。","m":"時頼（父）→時宗（元寇）→貞時（子・永仁の徳政令）"},{"id":67,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-チ","f":"中世","t":"日明国交の開始","y":1401,"q":"1401年、足利義満は明に使者を送って国交を開いた。このとき、義満の側近であった正使とともに、副使として派遣された博多の商人はだれか。","c":["肥富","祖阿","島井宗室","神屋宗湛"],"e":"1401年、義満は側近の祖阿（そあ）を正使、博多商人の肥富（こいつみ）を副使として明に送りました。翌年、明の皇帝から「日本国王源道義」あての返書と暦が与えられ、1404年から勘合を用いる朝貢形式の貿易が始まります。祖阿は正使であって博多の商人ではありません。島井宗室と神屋宗湛は16世紀後半に活躍し、豊臣秀吉とも関係の深かった博多の豪商で、時代が異なります。","m":"1401年の遣明使：正使=祖阿、副使=博多商人の肥富"},{"id":68,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-リ","f":"近代","t":"甲申事変後の日清","y":1885,"q":"1884年の甲申事変で悪化した日清関係を調整するため、翌年に伊藤博文と李鴻章が結び、両国軍の朝鮮からの撤兵と、今後出兵する際の相互の事前通告を定めた条約はどれか。","c":["天津条約","漢城条約","済物浦条約","日清修好条規"],"e":"1885年の天津条約は、日清両軍の朝鮮からの撤退と、将来出兵する場合に互いに事前通告することを取り決めました。1894年の甲午農民戦争では、清がこの条約に従って出兵を通知し、日本も対抗して出兵したことから日清戦争へ進みます。漢城条約は甲申事変について日本と朝鮮が1885年に結んだ条約、済物浦（さいもっぽ）条約は1882年の壬午軍乱後に日本と朝鮮が結んだ条約、日清修好条規は1871年に結ばれた条約です。","m":"壬午軍乱→済物浦条約、甲申事変→漢城条約（朝）・天津条約（清）"},{"id":69,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-ヌ","f":"近代","t":"脱亜論","y":1885,"q":"福沢諭吉が1882年に創刊し、甲申事変後の1885年には、近隣諸国の開明を待たずに欧米列強と行動をともにすべきだと説く社説「脱亜論」を載せた日刊新聞はどれか。","c":["『時事新報』","『国民新聞』","『万朝報』","『日本』"],"e":"『時事新報』は福沢諭吉が1882年に創刊した新聞です。1885年3月に載った社説「脱亜論」は、甲申事変で朝鮮の改革派への期待が崩れたことを背景に書かれたものでした。『国民新聞』は平民的欧化主義を唱えた徳富蘇峰が1890年に創刊した新聞、『万朝報（よろずちょうほう）』は黒岩涙香が1892年に創刊した新聞、『日本』は陸羯南（くがかつなん）が1889年に創刊し国民主義を唱えた新聞で、いずれも福沢の新聞ではありません。","m":"福沢=時事新報、蘇峰=国民新聞、羯南=日本、涙香=万朝報"},{"id":70,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-ル","f":"近代","t":"日清戦争の講和","y":1895,"q":"1895年4月、伊藤博文・陸奥宗光と李鴻章との間で調印され、清が朝鮮の独立を認め、台湾・澎湖諸島などを日本に譲り、賠償金2億両を支払うことなどを定めた条約はどれか。","c":["下関条約","天津条約","北京議定書","ポーツマス条約"],"e":"下関条約は日清戦争の講和条約で、朝鮮の独立の承認、遼東半島・台湾・澎湖諸島の割譲、賠償金2億両の支払い、沙市・重慶・蘇州・杭州の開市・開港などを定めました。天津条約は1885年に甲申事変後の日清関係を調整した条約、北京議定書は1901年に北清事変（義和団事件）の処理として列国と清が結んだ取り決め、ポーツマス条約は1905年に結ばれた日露戦争の講和条約で、いずれも内容が異なります。","m":"下関条約=朝鮮独立・遼東/台湾/澎湖・2億両・4港開港"},{"id":71,"k":"past","ref":"2026年度 2月12日 Ⅰ-A-ヲ","f":"近代","t":"三国干渉","y":1895,"q":"1895年、ロシアがフランス・ドイツを誘って日本に清への返還を勧告し、日本がこれを受け入れて、代わりに清から3000万両を得ることになった地域はどれか。","c":["遼東半島","山東半島","台湾","澎湖諸島"],"e":"下関条約で日本が得た遼東半島について、東アジアへの進出をめざすロシアは、フランス・ドイツとともに清への返還を求めました（三国干渉）。日本は勧告を受け入れ、国内では「臥薪嘗胆」の標語のもとロシアへの対抗心が高まります。その後1898年、ロシアは同半島の旅順・大連を租借しました。山東半島は1898年にドイツが膠州湾を租借した地域で、台湾と澎湖諸島は下関条約のとおり日本領となりました。","m":"三国干渉=露・仏・独→遼東半島返還→臥薪嘗胆"},{"id":72,"k":"past","ref":"2026年度 2月12日 Ⅱ-A-イ","f":"近世","t":"清の敗北と幕府","y":1840,"q":"1840年に始まり、清がイギリスに敗れて1842年の南京条約で香港を譲り、上海など5港を開くことになった戦争はどれか。この情報は幕府に衝撃を与え、対外方針を改めさせた。","c":["アヘン戦争","アロー戦争","清仏戦争","クリミア戦争"],"e":"アヘン戦争（1840〜42年）で清が敗れたことは日本に伝わり、幕府は1842年に異国船打払令を緩めて薪水給与令を出しました。アロー戦争は1856年に始まり、清がイギリス・フランスに敗れて天津条約・北京条約を結んだ戦争、清仏戦争は1884年にベトナムをめぐって起きた清とフランスの戦争、クリミア戦争は1853年に始まったロシアとオスマン帝国・イギリス・フランスなどとの戦争で、いずれも年代と当事国が合いません。","m":"アヘン戦争→南京条約1842→同年、薪水給与令"},{"id":73,"k":"past","ref":"2026年度 2月12日 Ⅱ-A-ロ","f":"近世","t":"打払令の緩和","y":1842,"q":"清がイギリスに敗れたとの情報を受けて、1842年、老中水野忠邦のもとで幕府が出した、漂着した外国船に燃料や食料・水を与えて帰らせることを認めた法令はどれか。","c":["薪水給与令","異国船打払令","海舶互市新例","上知令"],"e":"幕府は1825年の異国船打払令で外国船の撃退を命じていましたが、アヘン戦争の情報を受けて1842年にこれを緩め、薪水給与令を出しました。1806年にも同じ趣旨の法令があるため、天保の薪水給与令とも呼ばれます。異国船打払令は逆に撃退を命じた法令、海舶互市新例は1715年に新井白石が長崎貿易を制限した法令、上知令（あげちれい）は1843年に江戸・大坂周辺を直轄地にしようとして実施できなかった法令です。","m":"1825打払令→アヘン戦争→1842薪水給与令（水野忠邦）"},{"id":74,"k":"past","ref":"2026年度 2月12日 Ⅱ-A-ハ","f":"近代","t":"津田梅子","y":1900,"q":"1871年に岩倉使節団に同行した最初の女子留学生の一人としてアメリカに渡った津田梅子が、帰国後の1900年、女性の高等教育をめざして東京に開いた学校はどれか。","c":["女子英学塾","日本女子大学校","同志社英学校","東京女子師範学校"],"e":"津田梅子は1871年に女子留学生のなかで最年少で渡米し、帰国後に再び留学したのち、1900年に女子英学塾（現在の津田塾大学）を開いて、英語教育を通じた女性の自立をめざしました。日本女子大学校は1901年に成瀬仁蔵が設立した学校、同志社英学校は1875年に新島襄が京都に開いたキリスト教主義の学校、東京女子師範学校は1874年に設けられた官立の女性教員養成機関で、いずれも津田の設立ではありません。","m":"津田梅子=女子英学塾1900、成瀬仁蔵=日本女子大学校1901"},{"id":75,"k":"past","ref":"2026年度 2月12日 Ⅱ-A-ニ","f":"近代","t":"日本美術の再評価","y":1887,"q":"1878年に来日して東京大学で哲学などを教え、日本の伝統美術を高く評価して、岡倉天心とともに1887年の東京美術学校の設立に力を尽くしたアメリカ人はだれか。","c":["フェノロサ","フォンタネージ","ラグーザ","コンドル"],"e":"フェノロサは日本美術の価値を説き、狩野芳崖（ほうがい）らを見いだして日本画の復興を後押ししました。岡倉天心と設立に尽力した東京美術学校は、当初、西洋美術を除いて発足しています。フォンタネージは工部美術学校で洋画を教えたイタリア人画家、ラグーザは同校で彫刻を教えたイタリア人、コンドルは鹿鳴館やニコライ堂を設計し、辰野金吾らを育てたイギリス人建築家で、いずれも伝統美術の復興運動の中心人物ではありません。","m":"フェノロサ+岡倉天心→東京美術学校（当初は西洋美術を除く）"},{"id":76,"k":"past","ref":"2026年度 2月12日 Ⅱ-A-ホ","f":"近代","t":"岡倉天心と日本画","y":1898,"q":"1898年、東京美術学校の校長を辞した岡倉天心が、橋本雅邦・横山大観・菱田春草らとともに結成し、新しい日本画の創造をめざした美術団体はどれか。","c":["日本美術院","明治美術会","白馬会","二科会"],"e":"岡倉天心は1898年に東京美術学校を去り、日本美術院を設立して日本画の革新を進めました。同院はのちに一時衰えますが、1914年に横山大観らが再興し、その展覧会は院展と呼ばれます。明治美術会は1889年に浅井忠らがつくった日本最初の洋画団体、白馬会は1896年に黒田清輝らが結成した洋画団体、二科会は1914年に文展の洋画部門に不満をもつ画家たちがつくった洋画団体で、いずれも日本画の団体ではありません。","m":"日本画=日本美術院（天心）、洋画=明治美術会→白馬会→二科会"},{"id":77,"k":"past","ref":"2026年度 2月12日 Ⅱ-B-4","f":"近代","t":"ペリー来航と幕府","y":1853,"q":"1853年のペリー来航に際し、老中首座としてこれを朝廷に報告して諸大名や幕臣にも広く意見を求め、翌年に日米和親条約を結んだのち、台場の築造や大船建造の解禁などの改革を進めた人物はだれか。","c":["阿部正弘","堀田正睦","井伊直弼","安藤信正"],"e":"阿部正弘は従来の方針を改めて朝廷への報告と諸大名への諮問をおこない、これが朝廷の権威を高め、雄藩の発言力を強めるきっかけになりました。前水戸藩主徳川斉昭の幕政参与などを含む一連の改革は、安政の改革と呼ばれます。堀田正睦（まさよし）は通商条約の勅許を求めて得られなかった老中、井伊直弼は1858年に勅許のないまま通商条約に調印した大老、安藤信正は和宮降嫁を進め坂下門外の変で負傷した老中です。","m":"阿部=和親条約・安政の改革→堀田=勅許失敗→井伊=無勅許調印"},{"id":78,"k":"past","ref":"2026年度 2月12日 Ⅱ-B-10","f":"近代","t":"対米英開戦の内閣","y":1941,"q":"1941年10月、日米交渉の行きづまりから第3次近衛文麿内閣が総辞職したあと、陸軍大臣から首相となり、同年12月に対米英開戦に踏み切った人物はだれか。1944年7月、サイパン島陥落後に退陣した。","c":["東条英機","小磯国昭","鈴木貫太郎","米内光政"],"e":"東条英機は木戸幸一内大臣の推挙で首相となり、陸相・内相を兼ねました。11月末にアメリカが示したハル=ノートを最後通告とみなし、12月8日に開戦します。1944年7月、サイパン島の陥落で責任を問われて総辞職しました。小磯国昭は東条のあとを継いだ陸軍大将の首相、鈴木貫太郎は1945年4月に組閣しポツダム宣言の受諾を決めた首相、米内光政は1940年に組閣した海軍大将で、いずれも開戦時の首相ではありません。","m":"近衛③→東条（開戦〜サイパン陥落）→小磯→鈴木貫太郎（終戦）"},{"id":79,"k":"past","ref":"2026年度 2月12日 Ⅱ-B-11","f":"近代","t":"海運の競争と合併","y":1885,"q":"海運を独占していた三菱に対抗させるため、政府の支援と三井などの出資によって1882年に設立され、激しい運賃引下げ競争をくり広げたのち、1885年に三菱と合併して日本郵船会社となった会社はどれか。","c":["共同運輸会社","大阪商船会社","日本鉄道会社","大阪紡績会社"],"e":"三菱は政府の保護を受けて海運を独占していましたが、三菱と関係の深かった大隈重信が明治十四年の政変で政府を去ったのち、政府は共同運輸会社をつくらせて対抗させました。値下げ競争で両社とも経営が悪化したため、1885年に合併して日本郵船会社が生まれます。大阪商船会社は1884年に瀬戸内海の船主らが合同した別の海運会社、日本鉄道会社は1881年設立の最初の私鉄会社、大阪紡績会社は渋沢栄一らが設立し1883年に開業した紡績会社です。","m":"三菱+共同運輸会社→1885年合併→日本郵船会社"},{"id":80,"k":"past","ref":"2026年度 2月12日 Ⅱ-B-12","f":"現代","t":"MSA協定と自衛隊","y":1954,"q":"1954年に吉田茂内閣がアメリカと結んだMSA協定（日米相互防衛援助協定など）の内容と、それを受けた政府の対応について述べた文として正しいものはどれか。","c":["日本がアメリカの援助を受ける代わりに防衛力増強の義務を負う内容で、政府は防衛庁を設置し自衛隊を発足させた。","アメリカ軍の日本駐留を認める代わりにアメリカが日本防衛の義務を負う内容で、政府は警察予備隊を新設した。","日米が共同で日本の領域を防衛する義務を定める内容で、政府は警察予備隊を保安隊に改組した。","日本が経済援助を受ける代わりに沖縄の施政権をアメリカに委ねる内容で、政府は破壊活動防止法を制定した。"],"e":"MSA協定は1954年3月に結ばれ、日本はアメリカから兵器や農産物などの援助を受ける代わりに、自衛力を増強する義務を負いました。同年7月、防衛庁が置かれ、保安隊・警備隊を統合した陸・海・空の自衛隊が発足します。警察予備隊の新設は朝鮮戦争が始まった1950年、保安隊への改組と破壊活動防止法は1952年です。米軍駐留を定めた1951年の安保条約に日本防衛の義務は明記されず、共同防衛義務は1960年の新安保条約、沖縄の施政権は平和条約の規定です。","m":"警察予備隊1950→保安隊1952→MSA協定・自衛隊1954"},{"id":81,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-イ","f":"原始・古代","t":"古事記の編纂","y":712,"q":"712年に完成した現存最古の歴史書は、天武天皇が「帝紀」「旧辞」をよみならわせた人物の記憶をもとに、元明天皇の命で太安万侶（安麻呂）が筆録したものである。この、よみならった人物はだれか。","c":["稗田阿礼","舎人親王","淡海三船","山上憶良"],"e":"『古事記』は、天武天皇が稗田阿礼（ひえだのあれ）に「帝紀」「旧辞」をよみならわせ、それを元明天皇の命で太安万侶が文章にまとめて712年に完成しました。神話から推古天皇までを、漢字の音と訓を使って日本語で書き表しています。舎人親王は720年完成の『日本書紀』の編纂の中心人物、淡海三船は奈良時代後期の漢詩文にすぐれた文人、山上憶良は「貧窮問答歌」で知られる万葉歌人で、いずれも誦習（しょうしゅう）した人物ではありません。","m":"古事記＝阿礼が誦習→安万侶が筆録（712年）、日本書紀＝舎人親王（720年）"},{"id":82,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-ロ","f":"原始・古代","t":"奈良時代の漢詩集","y":751,"q":"751年に成立した現存最古の漢詩集で、7世紀後半以降の大友皇子・大津皇子・長屋王らの作品をおさめ、奈良時代の貴族に漢詩文の教養が重んじられたことを示す書物はどれか。","c":["『懐風藻』","『凌雲集』","『文華秀麗集』","『経国集』"],"e":"『懐風藻』は751年に成立した現存最古の漢詩集で、大友皇子・大津皇子・長屋王など、7世紀後半から奈良時代の人々の漢詩をおさめています。編者ははっきりしていません。『凌雲集』と『文華秀麗集』は嵯峨天皇の命で、『経国集』は淳和天皇の命で編まれた勅撰の漢詩文集で、いずれも9世紀前半、平安時代初期の弘仁・貞観文化の作品です。『懐風藻』は奈良時代の天平文化に属し、勅撰ではない点で区別できます。","m":"奈良＝懐風藻（最古の漢詩集）、平安初期＝凌雲集・文華秀麗集・経国集（勅撰）"},{"id":83,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-ハ","f":"原始・古代","t":"日本霊異記","y":822,"q":"9世紀前半に、善悪の行いには必ず報いがあるという因果応報の考えにもとづいて民間の説話を集め、現存最古の仏教説話集とされる『日本霊異記』を著した薬師寺の僧はだれか。","c":["景戒","源信","円仁","無住"],"e":"景戒（きょうかい・けいかい）は薬師寺の僧で、弘仁年間（9世紀前半）に『日本霊異記』をまとめました。因果応報の話を数多く集めた、現存最古の仏教説話集です。源信は10世紀末に『往生要集』を著して浄土教を広めた僧、円仁は唐に渡って『入唐求法巡礼行記』を残した天台宗の僧です。無住は鎌倉時代に仏教説話集『沙石集』を著した僧で、同じ説話集でも時代が大きく異なります。","m":"霊異記＝景戒（平安初期）、沙石集＝無住（鎌倉）、往生要集＝源信"},{"id":84,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-ニ","f":"中世","t":"俳諧連歌","y":1530,"q":"戦国時代の16世紀前半、規則を重んじる正統な連歌に対して、こっけいさや自由な気風を特色とする俳諧連歌をさかんにし、その句集『犬筑波集』を編んだ人物はだれか。","c":["宗鑑","宗祇","二条良基","宗長"],"e":"宗鑑（山崎宗鑑）は、形式にとらわれないこっけいな俳諧連歌をつくり、16世紀前半に『犬筑波集』を編集しました。俳諧連歌は、のちの江戸時代の俳諧のもとになります。宗祇は15世紀後半に正風連歌を確立し、『新撰菟玖波集』を編んだ連歌師です。二条良基は南北朝時代に『菟玖波集』を編み、連歌の規則『応安新式』を定めた公家、宗長は宗祇の弟子で『水無瀬三吟百韻』に加わった連歌師です。","m":"良基＝菟玖波集→宗祇＝新撰菟玖波集（正風）→宗鑑＝犬筑波集（俳諧）"},{"id":85,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-ホ","f":"中世","t":"南北朝の軍記物語","y":1370,"q":"後醍醐天皇の討幕計画から始まる約50年間の南北朝の動乱を全40巻にえがいた軍記物語で、のちに講釈師によって語り広められ、人々に親しまれた作品はどれか。","c":["『太平記』","『梅松論』","『増鏡』","『神皇正統記』"],"e":"『太平記』は、後醍醐天皇の即位と討幕計画から、鎌倉幕府の滅亡、南北朝の動乱までの約50年間をえがいた全40巻の軍記物語で、14世紀後半に成立しました。のちに「太平記読み」と呼ばれる講釈によって広く普及しました。『梅松論』は足利氏の立場から同じ時期の戦乱を記した歴史書、『増鏡』は公家の立場から鎌倉時代の歴史をかな文でつづった歴史物語、『神皇正統記』は北畠親房が南朝の正統性を主張した歴史書で、いずれも性格が異なります。","m":"太平記＝動乱全体の軍記、梅松論＝足利側、神皇正統記＝南朝側（親房）"},{"id":86,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-ヘ","f":"中世","t":"小歌の流行","y":1518,"q":"1518年に成立した歌謡集で、室町時代に庶民のあいだで流行した小歌を中心に、恋愛などを自由な形式でうたった当時の歌謡300首あまりをおさめた書物はどれか。","c":["『閑吟集』","『梁塵秘抄』","『新撰菟玖波集』","『水無瀬三吟百韻』"],"e":"『閑吟集』は1518年に成立した歌謡集で、室町時代に流行した小歌などをおさめています。恋愛を主題にした自由な形式の歌が多く、当時の人々の感情を伝える史料です。『梁塵秘抄』は平安時代末期に後白河法皇が今様などを集めた歌謡集で、歌の種類と時代が異なります。『新撰菟玖波集』は宗祇が編んだ連歌集、『水無瀬三吟百韻』は宗祇・肖柏・宗長がよんだ連歌で、どちらも歌謡ではなく連歌の作品です。","m":"今様＝梁塵秘抄（後白河・平安末）、小歌＝閑吟集（1518年・室町）"},{"id":87,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-ト","f":"近世","t":"元禄期の古典研究","y":1690,"q":"元禄期に、僧の契沖が徳川光圀の依頼をうけて著した注釈書で、多くの文献にもとづいて『万葉集』を実証的に研究し、のちの国学の出発点の一つとなった書物はどれか。","c":["『万葉代匠記』","『万葉考』","『古事記伝』","『源氏物語湖月抄』"],"e":"『万葉代匠記』は、契沖が徳川光圀の依頼で著した『万葉集』の注釈書で、1690年に完成しました。古い文献を根拠に実証的に読み解く方法は、のちの国学に受けつがれます。『万葉考』は18世紀に賀茂真淵が著した『万葉集』の研究書、『古事記伝』は本居宣長が1798年に完成させた『古事記』の注釈書です。『源氏物語湖月抄』は北村季吟が1673年に著した『源氏物語』の注釈書で、著者も対象の古典も異なります。","m":"契沖＝万葉代匠記→真淵＝万葉考→宣長＝古事記伝の順"},{"id":88,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-チ","f":"近代","t":"文明開化と戯作","y":1871,"q":"明治初期、牛鍋店に出入りする客たちの会話を通して文明開化の世相をこっけいにえがいた『安愚楽鍋』を著し、江戸時代以来の戯作の流れをついだ作家はだれか。","c":["仮名垣魯文","河竹黙阿弥","矢野龍溪","末広鉄腸"],"e":"仮名垣魯文（かながきろぶん）は幕末から明治初期の戯作者で、1871年から刊行した『安愚楽鍋（あぐらなべ）』で、牛鍋を食べる人々の姿を通して文明開化の風俗をえがきました。河竹黙阿弥は幕末から明治に活躍した歌舞伎の脚本作者です。矢野龍溪は『経国美談』、末広鉄腸は『雪中梅』を著した政治小説の作家で、自由民権運動が高まった1880年代に政治思想の宣伝をめざした点で、戯作とは異なります。","m":"戯作＝魯文『安愚楽鍋』→政治小説＝龍溪・散士→写実主義＝逍遙"},{"id":89,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-リ","f":"近代","t":"政治小説","y":1883,"q":"立憲改進党の結成に加わった矢野龍溪が、古代ギリシアのテーベの興隆を題材にして1880年代前半に発表し、自由民権運動の時期に広く読まれた政治小説はどれか。","c":["『経国美談』","『佳人之奇遇』","『雪中梅』","『浮雲』"],"e":"『経国美談』は矢野龍溪が1883年から刊行した政治小説で、古代ギリシアのテーベが民主政を回復し勢力をのばす過程をえがき、民権思想を広めました。『佳人之奇遇』は東海散士、『雪中梅』は末広鉄腸の作品で、同じ政治小説ですが作者と題材が異なります。『浮雲』は二葉亭四迷が1887年から発表した小説で、話し言葉に近い言文一致体で書かれた写実主義の作品であり、政治小説ではありません。","m":"政治小説＝龍溪『経国美談』・散士『佳人之奇遇』・鉄腸『雪中梅』"},{"id":90,"k":"past","ref":"2026年度 2月13日 Ⅰ-A-ヌ","f":"近代","t":"写実主義","y":1885,"q":"1885年に評論『小説神髄』を発表して、勧善懲悪の考え方や政治小説を批判し、人間の心理や世相をありのままにえがく写実主義をとなえた人物はだれか。","c":["坪内逍遙","二葉亭四迷","尾崎紅葉","幸田露伴"],"e":"坪内逍遙は1885年に『小説神髄』を著し、文学を道徳や政治の手段とする考えを退けて、人情や世相をありのままに写す写実主義を主張しました。二葉亭四迷はこの主張をうけて、言文一致体の『浮雲』を書いた作家です。尾崎紅葉は硯友社を結成して『金色夜叉』などを書いた作家、幸田露伴は『五重塔』などで東洋的な理想を追求した作家で、いずれも『小説神髄』の著者ではありません。","m":"逍遙『小説神髄』で写実主義→四迷『浮雲』で言文一致"},{"id":91,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-イ","f":"近代","t":"太平洋戦争の開戦","y":1941,"q":"1941年12月8日、日本海軍がハワイの真珠湾を攻撃したのとほぼ同時に、日本陸軍が奇襲上陸し、イギリスの拠点シンガポールをめざして南下を始めた、当時イギリス領であった地域はどこか。","c":["マレー半島","ルソン島","ジャワ島","スマトラ島"],"e":"1941年12月8日、日本陸軍はイギリス領マレー半島に上陸し、海軍はハワイ真珠湾を攻撃して、日本はアメリカ・イギリスに宣戦を布告しました。これが太平洋戦争の始まりです。日本軍は半島を南下し、翌1942年2月にシンガポールを占領しました。ルソン島はアメリカ領フィリピンの中心となる島、ジャワ島とスマトラ島はオランダ領東インドの島で、いずれもイギリス領ではなく、シンガポール攻略の出発点でもありません。","m":"1941年12月8日：陸軍＝マレー半島上陸、海軍＝真珠湾攻撃"},{"id":92,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-ロ","f":"近代","t":"戦局の悪化と防衛線","y":1943,"q":"1943年9月の御前会議は、戦局の悪化をうけて、千島・小笠原・マリアナ諸島・西部ニューギニア・ビルマなどを結ぶ線の内側を、戦争遂行のために確保すべき範囲と定めた。この範囲を何というか。","c":["絶対国防圏","大東亜共栄圏","東亜新秩序","利益線"],"e":"絶対国防圏は、ガダルカナル島からの撤退など戦局が悪化するなかで、1943年9月の御前会議で定められた、確保が必要とされた範囲です。しかし翌1944年7月には、その一角のサイパン島が陥落しました。大東亜共栄圏は日本を中心とするアジアの共存共栄をとなえた戦時中のスローガン、東亜新秩序は1938年に近衛文麿内閣が声明した日中戦争の目的です。利益線は、1890年に山県有朋首相が主権線とともに説いた語です。","m":"1943年絶対国防圏を設定→1944年サイパン島陥落で崩れる"},{"id":93,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-ハ","f":"近代","t":"東条内閣の総辞職","y":1944,"q":"1944年7月に守備隊が全滅してアメリカ軍に占領され、東条英機内閣が総辞職するきっかけとなり、その後はB29爆撃機による日本本土空襲の基地の一つとなった、マリアナ諸島の島はどこか。","c":["サイパン島","硫黄島","ガダルカナル島","アッツ島"],"e":"サイパン島はマリアナ諸島の島で、絶対国防圏の重要な拠点でしたが、1944年7月に陥落しました。その責任を問われて東条英機内閣は総辞職し、小磯国昭内閣にかわります。同年末からは、マリアナ諸島を基地とするB29の本土空襲が本格化しました。硫黄島は1945年3月に占領された島、ガダルカナル島は1943年2月に日本軍が撤退したソロモン諸島の島、アッツ島は1943年5月に守備隊が全滅したアリューシャン列島の島です。","m":"サイパン島陥落（1944年7月）→東条内閣総辞職→本土空襲の本格化"},{"id":94,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-ニ","f":"近世","t":"東南アジアとの貿易","y":1604,"q":"17世紀初め、徳川家康が発行した海外渡航の許可状をたずさえて東南アジア各地におもむいた貿易船を何というか。渡航先には日本町がつくられ、アユタヤでは山田長政が活躍した。","c":["朱印船","奉書船","勘合船","北前船"],"e":"朱印船は、幕府が発行した渡航許可状（朱印状）をもつ貿易船で、西国の大名や京都・長崎などの豪商が東南アジア各地に派遣しました。生糸などを輸入し、おもに銀を輸出しています。渡航先には日本町ができ、アユタヤの山田長政が知られます。奉書船は、1631年以降、朱印状に加えて老中奉書をもつことを求められた船で、家康の時期のものではありません。勘合船は室町時代の日明貿易の船、北前船は江戸時代に日本海側と大坂を結んだ国内の廻船です。","m":"朱印状をもつ朱印船→1631年奉書船→1635年日本人の渡航・帰国禁止"},{"id":95,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-ホ","f":"近代","t":"大東亜共同宣言","y":1943,"q":"1943年11月、東条英機内閣が、占領地域の協力を確保するために満州国・汪兆銘政権・タイ・ビルマ・フィリピンなどの代表を東京に集めて開き、共同宣言を発表した会議はどれか。","c":["大東亜会議","カイロ会談","ヤルタ会談","アジア＝アフリカ会議"],"e":"大東亜会議は1943年11月に東京で開かれ、満州国、中国の汪兆銘政権、タイ、ビルマ、フィリピンなどの代表が出席して、共存共栄などをうたう大東亜共同宣言を採択しました。戦局が悪化するなかで、占領地域の結束を示すねらいがありました。カイロ会談は同じ1943年11月にアメリカ・イギリス・中国の首脳が対日方針を協議した会談、ヤルタ会談は1945年2月の米・英・ソの首脳会談、アジア＝アフリカ会議は1955年にバンドンで開かれた会議です。","m":"1943年11月：東京＝大東亜会議、連合国＝カイロ会談（米英中）"},{"id":96,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-ヘ","f":"現代","t":"戦後50年談話","y":1995,"q":"日本社会党の委員長として自民党・新党さきがけとの連立内閣をひきい、戦後50年にあたる1995年8月15日に、過去の植民地支配と侵略への反省とおわびを表明する談話を発表した首相はだれか。","c":["村山富市","細川護熙","橋本龍太郎","小渕恵三"],"e":"村山富市は日本社会党の委員長で、1994年に自民党・社会党・新党さきがけの連立内閣の首相となりました。戦後50年の1995年8月15日に、植民地支配と侵略によってアジア諸国の人々に損害と苦痛を与えたことへの反省とおわびを表明する談話を出しています。細川護熙は1993年に非自民8党派の連立内閣を組織した日本新党の首相です。橋本龍太郎は1996年に村山内閣のあとをついだ自民党の首相、小渕恵三はその次の自民党の首相です。","m":"細川（1993年非自民）→羽田→村山（自社さ連立・戦後50年談話）→橋本"},{"id":97,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-ト","f":"現代","t":"インドシナ休戦協定","y":1954,"q":"1920年に発足した国際連盟の本部がおかれ、1954年にはインドシナ戦争の休戦協定を結んだ国際会議が、翌1955年には米・英・仏・ソの4カ国首脳会談が開かれた都市はどこか。","c":["ジュネーブ","ハーグ","パリ","ロンドン"],"e":"ジュネーブはスイスの都市で、国際連盟の本部がおかれました。1954年にはここで開かれた会議でインドシナ休戦協定が結ばれ、1955年には米・英・仏・ソの4巨頭会談が開かれて、東西対立の緊張緩和（雪どけ）が進みました。ハーグは1907年の万国平和会議と韓国皇帝の密使事件で知られるオランダの都市、パリは1919年の講和会議や1928年の不戦条約調印の地、ロンドンは1930年の海軍軍縮会議の開催地です。","m":"ジュネーブ＝国際連盟本部・1954年インドシナ休戦・1955年4巨頭会談"},{"id":98,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-チ","f":"近代","t":"パリ講和会議","y":1919,"q":"1919年、パリ講和会議の結果として連合国とドイツとのあいだで結ばれ、日本が山東省の旧ドイツ権益の継承と、赤道以北の旧ドイツ領南洋諸島の委任統治権を認められた条約はどれか。","c":["ヴェルサイユ条約","九カ国条約","四カ国条約","不戦条約"],"e":"ヴェルサイユ条約は、第一次世界大戦の講和条約として1919年6月に結ばれました。日本は西園寺公望らを全権として送り、山東省の旧ドイツ権益の継承と赤道以北の南洋諸島の委任統治権を得ました。中国では、山東権益の返還要求が講和会議で退けられたことに反発して、調印前の同年5月に五・四運動がおこっています。九カ国条約は1922年に中国の主権尊重・門戸開放を定めた条約、四カ国条約は1921年に太平洋の現状維持を約し日英同盟を終了させた条約、不戦条約は1928年に戦争放棄を約した条約です。","m":"1919年ヴェルサイユ条約→1921年四カ国→1922年九カ国→1928年不戦条約"},{"id":99,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-リ","f":"現代","t":"第五福竜丸事件","y":1955,"q":"1954年、アメリカが中部太平洋のビキニ環礁でおこなった水爆実験で第五福竜丸が被爆した事件をきっかけに、東京都杉並区の主婦らの署名から全国に広がり、翌年広島で第1回世界大会を開いた運動はどれか。","c":["原水爆禁止運動","米軍基地反対闘争","安保改定阻止運動","ベトナム反戦運動"],"e":"1954年3月の第五福竜丸事件をうけて、核実験に反対する署名運動が杉並区から全国に広がり、1955年8月に広島で第1回原水爆禁止世界大会が開かれました。これが原水爆禁止運動です。米軍基地反対闘争は、石川県内灘や東京都砂川などで1950年代におきた基地の使用・拡張に反対する運動です。安保改定阻止運動は1960年に岸信介内閣の新安保条約に反対した運動、ベトナム反戦運動は1960年代後半にアメリカの北爆などに抗議した運動です。","m":"1954年第五福竜丸事件→杉並の署名→1955年広島で原水爆禁止世界大会"},{"id":100,"k":"past","ref":"2026年度 2月13日 Ⅱ-A-ヌ","f":"現代","t":"日本人初のノーベル賞","y":1949,"q":"中間子の存在を予言した理論によって1949年に日本人で初めてノーベル賞を受賞し、1955年には核兵器の廃絶と戦争の放棄を訴えるラッセル・アインシュタイン宣言に署名した物理学者はだれか。","c":["湯川秀樹","朝永振一郎","江崎玲於奈","仁科芳雄"],"e":"湯川秀樹は中間子理論によって1949年に日本人初のノーベル賞（物理学賞）を受賞し、敗戦後の人々を勇気づけました。その後は核兵器廃絶をめざす科学者の運動にも加わり、1955年のラッセル・アインシュタイン宣言に署名しています。朝永振一郎は1965年、江崎玲於奈は1973年にノーベル物理学賞を受賞した物理学者で、日本人初ではありません。仁科芳雄は戦前から原子核の研究を指導した物理学者ですが、ノーベル賞は受賞していません。","m":"湯川秀樹＝1949年・日本人初のノーベル賞（物理学賞・中間子理論）"},{"id":101,"k":"past","ref":"2026年度 2月13日 Ⅱ-B-5","f":"現代","t":"沖縄返還交渉","y":1969,"q":"1960年代後半に本格化し、1971年の協定調印を経て翌1972年に実現した沖縄の日本復帰をめぐる日米交渉の内容について述べた文として、最も適切なものはどれか。","c":["佐藤栄作首相が「核抜き」を掲げてニクソン大統領と交渉し返還が決まったが、広大な米軍基地は返還後も残された。","田中角栄首相がニクソン大統領と交渉し、返還と同時に沖縄の米軍基地をすべて撤去することが協定で定められた。","吉田茂首相が日米安全保障条約の改定交渉のなかで返還を求め、新条約の発効と同時に沖縄の施政権が返還された。","佐藤栄作首相がサンフランシスコ平和条約の調印とあわせて返還を実現したが、小笠原諸島の返還は見送られた。"],"e":"沖縄返還は佐藤栄作内閣が進め、1969年の佐藤首相とニクソン大統領の会談で「核抜き・本土並み」での1972年返還が合意されました。1971年に沖縄返還協定が調印され、1972年5月に復帰が実現しましたが、米軍基地の多くは残りました。田中角栄は復帰後に首相となった人物で、基地の全面撤去も定められていません。安保条約の改定は1960年の岸信介内閣、サンフランシスコ平和条約の調印は1951年の吉田茂内閣のことで、小笠原諸島は沖縄より早く1968年に返還されました。","m":"佐藤栄作：1968年小笠原返還→1969年佐藤・ニクソン会談→1972年沖縄復帰"},{"id":102,"k":"plan","ref":"想定問題","f":"原始・古代","t":"旧石器文化の確認","y":-25000,"q":"1946年に相沢忠洋が関東ローム層の中から打製石器を発見し、1949年の学術調査によって、日本列島にも旧石器時代の文化があったことを明らかにした群馬県の遺跡はどれか。","c":["岩宿遺跡","野尻湖遺跡","大森貝塚","登呂遺跡"],"e":"正解は岩宿遺跡です。それまで日本列島には縄文時代より前の文化はないと考えられていましたが、更新世に堆積した関東ローム層から打製石器が見つかり、1949年の調査で旧石器時代の文化の存在が確かめられました。野尻湖遺跡は長野県にあり、ナウマンゾウの化石と石器が出土した遺跡です。大森貝塚は1877年にモースが調査した縄文時代の貝塚、登呂遺跡は静岡県にある弥生時代の水田跡で知られる遺跡です。","m":"岩宿＝群馬・相沢忠洋・関東ローム層→旧石器文化の確認"},{"id":103,"k":"plan","ref":"想定問題","f":"原始・古代","t":"縄文時代の大集落","y":-3000,"q":"青森県にある縄文時代前期から中期の大規模な集落跡で、多数の竪穴住居や大型の掘立柱建物の跡が見つかり、クリ林の管理が行われていたことも分かった遺跡はどれか。","c":["三内丸山遺跡","吉野ヶ里遺跡","加曽利貝塚","板付遺跡"],"e":"正解は三内丸山遺跡です。長期間にわたって多くの人が定住した集落で、大型の建物跡や、ヒスイ・黒曜石など遠方との交易を示す品も出土し、縄文時代の社会の豊かさを示しました。吉野ヶ里遺跡は佐賀県にある弥生時代の大規模な環濠集落です。加曽利貝塚は千葉県にある縄文時代の大型の貝塚、板付遺跡は福岡県にあり、縄文時代晩期の水田跡が見つかった遺跡です。","m":"縄文の大集落＝青森の三内丸山、弥生の環濠集落＝佐賀の吉野ヶ里"},{"id":104,"k":"plan","ref":"想定問題","f":"原始・古代","t":"縄文・弥生の文化","y":-100,"q":"縄文時代・弥生時代の人びとの生活や道具、祭りについて述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["銅鐸は九州北部を中心に、銅矛・銅戈は近畿地方を中心に分布する。","縄文時代には弓矢が使われ、動きの速い中小の動物を狩るようになった。","縄文時代の土偶は、女性をかたどったものが多い。","弥生時代には、石包丁を用いて稲の穂首刈りが行われた。","すべて正しい"],"e":"誤りは銅鐸と銅矛・銅戈の分布を逆にした文です。弥生時代の青銅製祭器は地域によって種類が異なり、銅鐸は近畿地方を中心に、銅矛・銅戈は九州北部を中心に分布します。ほかの文は正しい内容です。縄文時代には気候の温暖化で動きの速い中小の動物が増え、弓矢が使われるようになりました。土偶は女性をかたどったものが多く、豊かなめぐみを祈る呪術に用いられたと考えられています。石包丁は稲の穂をつみとる道具です。","m":"銅鐸＝近畿、銅矛・銅戈＝九州北部、平形銅剣＝瀬戸内","last":true},{"id":105,"k":"plan","ref":"想定問題","f":"原始・古代","t":"『漢書』地理志","y":-50,"q":"紀元前1世紀ごろの倭について、「楽浪海中に倭人有り、分れて百余国と為る」と記し、倭人が楽浪郡に定期的に使いを送っていたことを伝える中国の歴史書はどれか。","c":["『漢書』地理志","『後漢書』東夷伝","「魏志」倭人伝","『宋書』倭国伝"],"e":"正解は『漢書』地理志です。前漢の歴史を記した書物で、倭が多くの小国に分かれ、漢が朝鮮半島においた楽浪郡に使いを送っていたことが分かります。『後漢書』東夷伝は、57年の奴国王の遣使と107年の倭国王帥升らの遣使を伝えます。「魏志」倭人伝は3世紀の邪馬台国と女王卑弥呼について、『宋書』倭国伝は5世紀の倭の五王の遣使について記した史料です。","m":"漢書＝百余国→後漢書＝奴国・帥升→魏志＝卑弥呼→宋書＝五王"},{"id":106,"k":"plan","ref":"想定問題","f":"原始・古代","t":"卑弥呼の後継者","y":248,"q":"「魏志」倭人伝によると、卑弥呼の死後に男の王が立ったが国内がおさまらず、卑弥呼の一族の13歳の女性が王に立てられて、ようやく争いがしずまったという。この女性はだれか。","c":["壱与（台与）","難升米","帥升","卑弥弓呼"],"e":"正解は壱与（台与）です。3世紀半ばに卑弥呼が亡くなると男王が立ちましたが争いがおこり、宗女（一族の女性）の壱与が王となっておさまったと記されています。266年に晋へ使いを送った倭の女王も壱与とみられています。難升米は239年に卑弥呼が魏へ送った使者です。帥升は107年に後漢へ生口を献上した倭国王で、卑弥弓呼は邪馬台国と対立した狗奴国の男王です。","m":"卑弥呼→男王で乱れる→13歳の壱与でおさまる"},{"id":107,"k":"plan","ref":"想定問題","f":"原始・古代","t":"好太王碑","y":414,"q":"4世紀末から5世紀初めに朝鮮半島へ進出した倭の軍と戦い、その経過を王の功績として石碑に刻んだ国はどれか。この碑は現在の中国吉林省にのこっている。","c":["高句麗","百済","加耶（加羅）","新羅"],"e":"正解は高句麗です。この碑は好太王（広開土王）碑とよばれ、王の死後の414年に子の長寿王が建てました。碑文には、倭が海を渡って百済や新羅に勢力をおよぼし、南下してきた高句麗と交戦したことが記されています。百済は半島南西部の国で、倭と結んで高句麗に対抗しました。加耶（加羅）は半島南部の小国群で、倭が鉄資源を求めて密接な関係をもった地域です。新羅は半島南東部の国です。","m":"好太王碑＝高句麗が建てた（414年）。倭と結んだのは百済"},{"id":108,"k":"plan","ref":"想定問題","f":"原始・古代","t":"古墳とヤマト政権","y":450,"q":"古墳時代の古墳やヤマト政権のしくみについて述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["前期の古墳には、銅鏡など呪術的な色合いの強い副葬品が多い。","中期には、大仙陵古墳など巨大な前方後円墳が近畿地方に造られた。","ヤマト政権は、蘇我氏に連、大伴氏や物部氏に臣の姓を与えた。","後期には横穴式石室が広まり、小規模な古墳が集まる群集墳が増えた。","すべて正しい"],"e":"誤りは姓（かばね）を逆にした文です。ヤマト政権は豪族を氏という集団にまとめ、姓を与えて序列づけました。蘇我氏や葛城氏のように地名を氏の名とする近畿の有力豪族には臣、大伴氏や物部氏のように特定の職務で政権に仕えた豪族には連が与えられました。古墳についての文はどれも正しく、副葬品は前期の呪術的なものから、中期には武器・武具や馬具など武人的なものへと変わり、後期には横穴式石室と群集墳が広まりました。","m":"臣＝蘇我・葛城（地名）、連＝大伴・物部（職務）","a":2,"last":true},{"id":109,"k":"plan","ref":"想定問題","f":"原始・古代","t":"白村江から壬申の乱","y":670,"q":"7世紀後半の出来事ア〜エを古い順に正しく並べたものはどれか。ア＝庚午年籍の作成　イ＝白村江の戦い　ウ＝壬申の乱　エ＝近江大津宮への遷都","c":["イ→エ→ア→ウ","イ→ア→エ→ウ","エ→イ→ア→ウ","イ→エ→ウ→ア"],"e":"白村江の戦い（663年）→近江大津宮への遷都（667年）→庚午年籍の作成（670年）→壬申の乱（672年）の順です。百済復興をめざした倭の軍は唐・新羅の連合軍に大敗し、中大兄皇子は防衛を固めたうえで都を近江に移し、翌年に即位して天智天皇となりました。天智天皇は最初の全国的な戸籍である庚午年籍をつくりましたが、その死後、子の大友皇子と弟の大海人皇子が皇位を争う壬申の乱がおこり、大海人皇子が勝利しました。","m":"白村江の敗戦→近江遷都→庚午年籍→天智の死→壬申の乱"},{"id":110,"k":"plan","ref":"想定問題","f":"原始・古代","t":"藤原京遷都","y":694,"q":"天武天皇の皇后で、天皇の死後に政治を引きつぎ、飛鳥浄御原令を施行したのち、694年に中国の都城にならった本格的な都である藤原京へ都を移した天皇はだれか。","c":["持統天皇","元明天皇","斉明天皇","推古天皇"],"e":"正解は持統天皇です。夫の天武天皇が進めた律令国家づくりを受けつぎ、689年に飛鳥浄御原令を施行し、翌年に戸籍をつくり、694年に藤原京へ遷都しました。元明天皇は710年に平城京へ都を移した女性天皇です。斉明天皇は皇極天皇が再び即位したときの名で、百済救援の軍を送る途中に九州で亡くなりました。推古天皇は592年に即位した最初の女性天皇で、厩戸王や蘇我馬子が政治を支えました。","m":"持統＝藤原京（694年）、元明＝平城京（710年）"},{"id":111,"k":"plan","ref":"想定問題","f":"原始・古代","t":"律令制の労役","y":701,"q":"律令制のもとで成年男性に課された負担のうち、国司の命令によって、年間60日を限度に、国内の水利工事や国府の雑用などにあたらせた労役はどれか。","c":["雑徭","歳役","運脚","仕丁"],"e":"正解は雑徭（ぞうよう）です。正丁の場合は年間60日以内と定められ、国司が地方での土木工事などに人びとを使うことができたため、農民にとって重い負担となりました。歳役は都で年間10日の労役につく義務で、ふつうはそのかわりに布などを庸として納めました。運脚は調や庸を都まで運ぶ人夫のことです。仕丁は50戸ごとに2人の割合で都に送られ、中央の役所の雑用にあたった人びとです。","m":"雑徭＝地方で60日以内、歳役＝都で10日（かわりに庸）"},{"id":112,"k":"plan","ref":"想定問題","f":"原始・古代","t":"光明子の立后","y":729,"q":"藤原不比等の娘で、729年に長屋王が自殺に追いこまれた直後、皇族以外から初めて皇后に立てられ、施薬院を設けて病人の救済にもあたった人物はだれか。","c":["光明子（光明皇后）","藤原宮子","県犬養三千代","藤原薬子"],"e":"正解は光明子です。皇后は皇族から立てるならわしでしたが、不比等の子の藤原四子は、左大臣の長屋王を729年に策謀によって自殺させ、妹の光明子を聖武天皇の皇后に立てることに成功しました。藤原宮子は不比等の娘で文武天皇の夫人となり、聖武天皇を生んだ人物です。県犬養三千代は光明子の母、藤原薬子は810年に平城太上天皇の復位をはかって失敗した人物です。","m":"長屋王の変（729年）→光明子が立后。皇族以外で初の皇后"},{"id":113,"k":"plan","ref":"想定問題","f":"原始・古代","t":"奈良時代の政争","y":740,"q":"奈良時代の出来事ア〜エを古い順に正しく並べたものはどれか。ア＝藤原広嗣の乱　イ＝恵美押勝の乱　ウ＝長屋王の変　エ＝東大寺大仏の開眼供養","c":["ウ→ア→エ→イ","ウ→エ→ア→イ","ア→ウ→エ→イ","ウ→ア→イ→エ"],"e":"長屋王の変（729年）→藤原広嗣の乱（740年）→大仏の開眼供養（752年）→恵美押勝の乱（764年）の順です。長屋王をたおした藤原四子が疫病で亡くなると橘諸兄が政権をにぎり、これに不満をもつ広嗣が九州で反乱をおこしました。動揺のなかで聖武天皇は大仏造立を命じ、娘の孝謙天皇の時代に開眼供養が行われました。その後、藤原仲麻呂（恵美押勝）は道鏡を重んじる孝謙太上天皇と対立して兵をあげ、敗死しました。","m":"長屋王→広嗣→大仏開眼→押勝（729・740・752・764年）"},{"id":114,"k":"plan","ref":"想定問題","f":"原始・古代","t":"墾田永年私財法","y":743,"q":"743年に出された法令の一節「今より以後は、任（まま）に私財と為し、三世一身を論ずること無く、咸悉（ことごと）くに永年取る莫（なか）れ」の趣旨として最も適切なものはどれか。","c":["開墾した田は、期限を設けて収公することをやめ、永久に私有を認める。","開墾した田は、本人から三代の間に限って私有を認め、その後は収公する。","6歳以上の男女に口分田を与え、本人が死ねば班田の年に収公する。","荒れた田の再開発を禁じ、すでに私有されている墾田をすべて収公する。"],"e":"この史料は聖武天皇のもとで出された墾田永年私財法です。723年の三世一身法では、開墾した田の私有は期限つきで、期限がくると国に収められたため、農民が耕作をなまけて田が再び荒れるという問題がありました。そこで、身分に応じた面積の制限はあるものの、墾田の永久私有を認めたのです。これにより貴族や大寺院が大規模な開墾を進め、初期荘園が生まれました。三代に限るのは三世一身法、6歳以上に口分田を与えるのは班田収授法の内容です。","m":"三世一身法（723年）＝期限つき→墾田永年私財法（743年）＝永久"},{"id":115,"k":"plan","ref":"想定問題","f":"原始・古代","t":"戒律の伝来","y":753,"q":"日本からの留学僧の求めに応じ、たび重なる渡航の失敗をのりこえて753年に来日し、僧尼が守るべき戒律を伝え、のちに唐招提寺を開いた唐の僧はだれか。","c":["鑑真","行基","玄昉","良弁"],"e":"正解は鑑真です。当時の日本には正式に戒を授ける制度が整っておらず、鑑真は失明しながらも来日して東大寺に戒壇を設け、聖武太上天皇らに戒を授けました。行基は民間に布教して社会事業を進め、のちに大仏造立に協力した僧です。玄昉は唐に留学して帰国し、吉備真備とともに橘諸兄の政権で活躍しました。良弁は東大寺の建立に力をつくした僧で、いずれも日本の僧です。","m":"鑑真＝戒律・東大寺戒壇・唐招提寺（来日753年）"},{"id":116,"k":"plan","ref":"想定問題","f":"原始・古代","t":"蔵人頭の設置","y":810,"q":"810年、平城太上天皇と対立した嵯峨天皇が、天皇の命令をすみやかに太政官に伝え、機密がもれるのを防ぐために新しく設け、藤原冬嗣らを任命した官職はどれか。","c":["蔵人頭","検非違使","勘解由使","関白"],"e":"正解は蔵人頭（くろうどのとう）です。平城太上天皇が平城京への再遷都を命じて「二所朝廷」とよばれる混乱がおきたとき、嵯峨天皇は側近の藤原冬嗣と巨勢野足を蔵人頭に任じて機密を守り、兵を出して太上天皇側をおさえました。検非違使は同じく嵯峨天皇が設けた京内の警察にあたる官職、勘解由使は桓武天皇が国司交替の際の不正を防ぐために設けた官職です。関白は9世紀後半に藤原基経が最初についた地位です。","m":"嵯峨天皇＝蔵人頭（冬嗣）と検非違使、桓武天皇＝勘解由使"},{"id":117,"k":"plan","ref":"想定問題","f":"原始・古代","t":"遣唐使と渤海","y":894,"q":"7世紀から9世紀にかけての日本と唐・渤海との交流について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["最初の遣唐使として、630年に犬上御田鍬らが派遣された。","8世紀には新羅との関係が悪化し、遣唐使は東シナ海を横断する航路をとった。","渤海は727年に日本へ使節を送り、以後、使節の往来が続いた。","894年、遣唐大使に任じられた菅原道真の建議で、派遣は中止された。","すべて正しい"],"e":"4つの文はどれも正しいので、「すべて正しい」が正解です。遣唐使は630年の犬上御田鍬に始まり、初めは朝鮮半島沿いの北路をとりましたが、8世紀には新羅との関係が悪化したため、危険の多い東シナ海横断の南路をとるようになりました。698年に中国東北部に建国された渤海は、唐や新羅に対抗する必要から727年に日本へ使節を送りました。894年には、唐の衰えや航海の危険を理由とする菅原道真の建議で派遣が中止されました。","m":"遣唐使＝630年犬上御田鍬に始まり、894年道真の建議で中止","a":4,"last":true},{"id":118,"k":"plan","ref":"想定問題","f":"原始・古代","t":"摂関政治と武士","y":939,"q":"平安時代の政変や武士の反乱ア〜エを古い順に正しく並べたものはどれか。ア＝平将門の乱　イ＝承和の変　ウ＝平忠常の乱　エ＝安和の変","c":["イ→ア→エ→ウ","イ→エ→ア→ウ","ア→イ→エ→ウ","イ→ア→ウ→エ"],"e":"承和の変（842年）→平将門の乱（939年）→安和の変（969年）→平忠常の乱（1028年）の順です。承和の変では藤原良房が伴健岑・橘逸勢らを退けて北家の地位を固めました。10世紀前半には東国で平将門が反乱をおこして新皇と名のりましたが、平貞盛・藤原秀郷らに討たれました。安和の変で左大臣源高明が左遷されると藤原氏の他氏排斥は完了し、摂関がつねにおかれるようになります。平忠常の乱は源頼信がしずめました。","m":"承和の変842→将門939→安和の変969→忠常1028"},{"id":119,"k":"plan","ref":"想定問題","f":"原始・古代","t":"女性の日記文学","y":975,"q":"藤原兼家の妻の一人となり、のちに右大将となる道綱を生んだ女性が、夫との結婚生活の苦悩をかな文でつづった、10世紀後半成立の日記文学はどれか。","c":["『蜻蛉日記』","『更級日記』","『和泉式部日記』","『紫式部日記』"],"e":"正解は『蜻蛉日記』です。作者は藤原道綱の母とよばれ、摂関家の有力者である兼家の訪れを待つ妻の立場から、自分の心の動きを見つめて書きました。女性によるかな日記文学の先がけです。『更級日記』は菅原孝標の女が少女時代からの一生を回想した11世紀の作品です。『和泉式部日記』は和泉式部の恋愛をえがいた作品、『紫式部日記』は中宮彰子に仕えた紫式部が宮廷のようすを記した作品です。","m":"蜻蛉＝道綱の母（夫は兼家）、更級＝孝標の女"},{"id":120,"k":"plan","ref":"想定問題","f":"原始・古代","t":"平安仏教と浄土教","y":985,"q":"平安時代に広まった新しい仏教の動きと、それをになった僧について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["最澄は唐で学んで天台宗を開き、比叡山を拠点とした。","空海は高野山に金剛峯寺を建て、真言宗を開いた。","空也は10世紀半ばに京の市で念仏を勧め、市聖とよばれた。","源信（恵心僧都）は『日本往生極楽記』を著し、念仏往生の教えを説いた。","すべて正しい"],"e":"誤りは源信の著作についての文です。源信が985年に著したのは『往生要集』で、極楽往生のための念仏の方法を説き、浄土教が貴族から庶民にまで広まるもとになりました。『日本往生極楽記』は、慶滋保胤が往生をとげたと信じられた人びとの伝記を集めた書物です。最澄と空海はともに9世紀初めに唐へ渡り、帰国後に天台宗と真言宗を開きました。空也は源信より早く京で念仏を広めた僧です。","m":"源信＝往生要集（985年）、慶滋保胤＝日本往生極楽記","a":3,"last":true},{"id":121,"k":"plan","ref":"想定問題","f":"原始・古代","t":"受領と荘園整理","y":988,"q":"10世紀以降の地方政治と土地制度の変化について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["10世紀には、任国におもむく国司の最上席者である受領の権限が強まった。","902年、後三条天皇は延喜の荘園整理令を出し、違法な土地所有を禁じた。","尾張国の郡司や百姓は、国守藤原元命の暴政を朝廷に訴えた。","田堵とよばれる有力農民は、名という土地の耕作と納税を請け負った。","すべて正しい"],"e":"誤りは延喜の荘園整理令を出した天皇です。902年にこれを出したのは醍醐天皇で、律令制の立て直しをめざしましたが、戸籍や班田による支配はもはや立て直せませんでした。後三条天皇は1069年に延久の荘園整理令を出した天皇です。ほかの文は正しく、政府は受領に一定額の税の納入を請け負わせて一国の統治をまかせ、受領は田堵に名の耕作を請け負わせて徴税しました。988年の尾張国郡司百姓等解は、受領の強欲さを示す史料です。","m":"延喜（902年）＝醍醐天皇、延久（1069年）＝後三条天皇","a":1,"last":true},{"id":122,"k":"plan","ref":"想定問題","f":"原始・古代","t":"望月の歌","y":1018,"q":"1018年、藤原道長は娘の威子が後一条天皇の中宮に立った日の宴で「此の世をば我が世とぞ思ふ望月の欠けたることも無しと思へば」とよんだ。この歌の背景として最も適切なものはどれか。","c":["娘たちを次々に天皇の后とし、天皇の外戚として権力をにぎった。","上皇として院庁を開き、天皇家の家長の立場から政治の実権をにぎった。","東国の反乱をしずめた功績により、武家の棟梁としての地位を固めた。","関白として3代の天皇に仕え、約50年にわたって政治を主導した。"],"e":"この歌は藤原実資の日記『小右記』に記されています。道長は彰子・妍子・威子の3人の娘を一条・三条・後一条天皇の后とし、生まれた皇子を天皇に立てて外戚（母方の親戚）として権力をふるいました。威子の立后で一家から3人の后が並んだ得意の気持ちをよんだものです。上皇が院庁を開くのは白河上皇に始まる院政、武家の棟梁は源氏や平氏の説明です。約50年間摂政・関白をつとめたのは子の頼通で、道長自身は関白になっていません。","m":"望月の歌＝1018年・威子立后・一家三后・出典は小右記"},{"id":123,"k":"plan","ref":"想定問題","f":"原始・古代","t":"刀伊の入寇","y":1019,"q":"1019年、沿海州地方に住む女真人が対馬・壱岐をおそい、さらに博多湾に侵入した。このとき大宰権帥として九州の武士たちを指揮し、これを撃退した人物はだれか。","c":["藤原隆家","藤原伊周","小野好古","源頼信"],"e":"正解は藤原隆家です。この事件は刀伊の入寇とよばれ、藤原道長が全盛をほこった時期におこりました。隆家のもとで戦ったのは九州の地方武士たちで、武士の実力が地方で高まっていたことを示します。藤原伊周は隆家の兄で、道長と政権を争って敗れた人物です。小野好古は10世紀に藤原純友の乱の鎮圧にあたった人物、源頼信は1028年におこった平忠常の乱をしずめ、源氏が東国に進出するきっかけをつくった人物です。","m":"刀伊の入寇（1019年）＝女真人の来襲を大宰権帥の隆家が撃退"},{"id":124,"k":"plan","ref":"想定問題","f":"中世","t":"院政から平氏政権へ","y":1167,"q":"院政期から平氏政権期の出来事ア〜エを古い順に正しく並べたものはどれか。ア 鹿ケ谷で平氏打倒の陰謀が発覚した。イ 白河上皇が院政を始めた。ウ 保元の乱がおこった。エ 平清盛が太政大臣になった。","c":["イ→ウ→エ→ア","イ→ウ→ア→エ","ウ→イ→エ→ア","イ→エ→ウ→ア"],"e":"白河上皇の院政開始は1086年、保元の乱は1156年、平清盛の太政大臣就任は1167年、鹿ケ谷の陰謀は1177年です。院政のもとで武士が中央政界に進出し、保元・平治の乱を勝ち抜いた清盛が武士として初めて太政大臣となりました。しかし平氏一門の専横に対する反発が強まり、後白河法皇の近臣である藤原成親や僧の俊寛らが平氏打倒をはかった鹿ケ谷の陰謀がおこります。","m":"院政開始→保元の乱→清盛太政大臣→鹿ケ谷の陰謀"},{"id":125,"k":"plan","ref":"想定問題","f":"中世","t":"大輪田泊と日宋貿易","y":1173,"q":"平清盛は日宋貿易の利益に着目し、瀬戸内海の航路を整えるとともに、摂津国の港を修築して宋の商船を畿内近くまで招き入れようとした。現在の神戸市にあたるこの港はどれか。","c":["大輪田泊","博多津","坊津","敦賀"],"e":"平清盛は父忠盛以来の日宋貿易に力を入れ、摂津の大輪田泊（現在の神戸港の一部）を修築して、宋船を瀬戸内海の奥まで引き入れようとしました。貿易では宋銭・陶磁器・書籍などが輸入され、金・硫黄・刀剣などが輸出されて、平氏政権の重要な経済基盤となりました。大量の宋銭は国内の貨幣流通を促しました。博多津は古くからの対外窓口である筑前の港、坊津は薩摩の港、敦賀は越前の日本海側の港で、いずれも摂津ではありません。","m":"清盛＝大輪田泊を修築→宋船を畿内へ。輸入は宋銭・陶磁器"},{"id":126,"k":"plan","ref":"想定問題","f":"中世","t":"承久の乱","y":1221,"q":"1221年におこった承久の乱と、その後の幕府による戦後処理について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["乱後、後鳥羽上皇は佐渡に、順徳上皇は隠岐に流された。","後鳥羽上皇は北条義時追討の兵をあげたが、幕府軍に敗れた。","幕府は京都に六波羅探題を置き、朝廷の監視と西国の統轄にあたらせた。","上皇方の所領3000余か所が没収され、戦功のあった御家人が地頭に任じられた。","すべて正しい"],"e":"1221年、後鳥羽上皇は北条義時追討の兵をあげましたが、幕府軍に敗れました。乱後、後鳥羽上皇は隠岐、順徳上皇は佐渡、土御門上皇は土佐（のち阿波）に流されたので、隠岐と佐渡を入れ替えた文が誤りです。幕府は仲恭天皇を廃し、京都に六波羅探題を置いて朝廷の監視と西国御家人の統轄にあたらせ、没収した上皇方の所領3000余か所に新たに地頭を任命しました。これにより幕府の支配は西国にも広く及ぶようになりました。","m":"後鳥羽＝隠岐、順徳＝佐渡、土御門＝土佐。乱後に六波羅探題","last":true},{"id":127,"k":"plan","ref":"想定問題","f":"中世","t":"御成敗式目の趣旨","y":1232,"q":"執権北条泰時は御成敗式目の制定にあたり、六波羅探題であった弟の重時に宛てた書状で、制定の趣旨を説明している。その書状に述べられた内容として最も適切なものはどれか。","c":["武家社会の道理にもとづく武家のための法であり、朝廷の裁判や律令の規定を改めるものではない。","律令は時代に合わないので廃止し、今後は公家も寺社もこの式目に従って裁判を行うべきである。","承久の乱で朝廷に勝利したことを記念し、後鳥羽上皇の命令を受けて編纂した法典である。","得宗家の家臣である御内人の特権を定め、一般の御家人が訴訟をおこすことを制限する法である。"],"e":"御成敗式目（貞永式目）は1232年、執権北条泰時が定めた51か条の武家法で、源頼朝以来の先例と、武家社会の慣習・道徳である道理を基準としました。泰時は書状のなかで、これは武家の人々のための法であり、朝廷の裁判や律令を少しも変えるものではないと述べています。したがって律令を廃止する、公家や寺社にも適用するという説明は誤りです。後鳥羽上皇は承久の乱で配流されており、御内人の台頭は鎌倉時代後期のことです。","m":"式目＝道理と先例にもとづく武家の法。律令・公家法は改めない"},{"id":128,"k":"plan","ref":"想定問題","f":"中世","t":"建長寺と渡来僧","y":1253,"q":"13世紀半ばに南宋から来日した禅僧は、執権北条時頼の帰依を受け、時頼が鎌倉に建立した建長寺の開山となった。幕府の保護のもとで臨済宗の発展に寄与したこの僧は誰か。","c":["蘭溪道隆","無学祖元","一山一寧","夢窓疎石"],"e":"蘭溪道隆（らんけいどうりゅう）は1246年に南宋から来日し、北条時頼の帰依を受けて、1253年に時頼が創建した鎌倉の建長寺の開山となりました。幕府は臨済宗を重んじ、南宋から多くの禅僧を招いています。無学祖元は北条時宗に招かれて来日し円覚寺を開いた僧、一山一寧は元の使者として1299年に来日した僧、夢窓疎石は足利尊氏の帰依を受けた南北朝期の日本人の僧で、いずれも時期や関係する寺院が異なります。","m":"蘭溪道隆＝時頼＝建長寺／無学祖元＝時宗＝円覚寺"},{"id":129,"k":"plan","ref":"想定問題","f":"中世","t":"十六夜日記","y":1279,"q":"鎌倉時代中期、歌人藤原為家の側室であった女性は、実子為相の所領相続をめぐる訴訟のために京都から鎌倉へ下り、その旅と鎌倉滞在のようすを紀行文『十六夜日記』に著した。この女性は誰か。","c":["阿仏尼","後深草院二条","建礼門院右京大夫","菅原孝標女"],"e":"阿仏尼は歌人藤原為家の側室で、為家の死後、実子為相と先妻の子為氏とのあいだにおこった播磨国細川荘の相続争いを幕府に訴えるため、1279年に鎌倉へ下りました。その旅と鎌倉滞在を記したのが『十六夜日記』で、中世の女性と所領相続のかかわりを示す作品でもあります。後深草院二条は『とはずがたり』の作者、建礼門院右京大夫は平徳子に仕えた歌人、菅原孝標女は平安時代中期の『更級日記』の作者です。","m":"阿仏尼＝十六夜日記＝所領訴訟のため鎌倉へ下る"},{"id":130,"k":"plan","ref":"想定問題","f":"中世","t":"蒙古襲来と日元関係","y":1281,"q":"13世紀後半の蒙古襲来と、その前後の日本と元との関係について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["蒙古襲来ののち日元間の交流は途絶え、貿易船や禅僧の往来もなくなった。","フビライは高麗を服属させたのち、日本にもたびたび朝貢を求めた。","文永の役ののち、幕府は博多湾沿いに石築地を築かせ、異国警固番役を強化した。","弘安の役は、元が南宋を滅ぼしたのちにおこした2度目の襲来である。","すべて正しい"],"e":"フビライは高麗を服属させたのち日本に朝貢を求め、北条時宗がこれを拒んだため、1274年に文永の役がおこりました。幕府は異国警固番役を強化し、博多湾沿いに石築地（防塁）を築いて備え、南宋を滅ぼした元が1281年に再び襲来した弘安の役も退けました。しかしその後も、正式な国交がないまま民間の貿易や禅僧の往来はさかんに続き、1325年には建長寺の修造費を得るための建長寺船も派遣されています。交流が途絶えたとする文が誤りです。","m":"元とは戦っても交易は続く。建長寺船→天龍寺船","last":true},{"id":131,"k":"plan","ref":"想定問題","f":"中世","t":"得宗専制への道","y":1285,"q":"鎌倉時代の出来事ア〜エを古い順に正しく並べたものはどれか。ア 永仁の徳政令が出された。イ 元・高麗軍が初めて博多湾に上陸した。ウ 安達泰盛が平頼綱に滅ぼされた。エ 北条時頼が三浦泰村一族を滅ぼした。","c":["エ→イ→ウ→ア","イ→エ→ウ→ア","エ→イ→ア→ウ","エ→ウ→イ→ア"],"e":"三浦泰村が滅ぼされた宝治合戦は1247年、文永の役は1274年、霜月騒動は1285年、永仁の徳政令は1297年です。北条時頼は有力御家人の三浦氏を滅ぼして北条氏の地位を固めました。蒙古襲来を経て得宗の権力はさらに強まり、御内人の代表である内管領平頼綱が有力御家人安達泰盛を滅ぼした霜月騒動ののち、得宗専制が確立します。その後、窮乏する御家人を救うために永仁の徳政令が出されましたが、効果は一時的でした。","m":"宝治合戦→文永の役→霜月騒動→永仁の徳政令"},{"id":132,"k":"plan","ref":"想定問題","f":"中世","t":"女性の相続と一期分","y":1300,"q":"鎌倉時代の武家では女性も所領を相続し、地頭になる例もあったが、分割相続で所領の細分化が進んだ後期には、本人一代に限って知行を認め、死後は惣領に返させる相続が女性に多くなった。これを何というか。","c":["一期分","悔返し","新恩給与","下地中分"],"e":"鎌倉時代の武家社会では女性の地位は比較的高く、所領の相続権をもち、御家人や地頭になる例もありました。しかし分割相続のくり返しで所領が細分化し、蒙古襲来後は御家人の窮乏も進んだため、女性への譲与は本人一代限りで死後は惣領に返す一期分（いちごぶん）が多くなりました。悔返しは親が譲った所領を取り戻すこと、新恩給与は将軍が新たな所領を与える御恩、下地中分は荘園領主と地頭が土地を分け合う紛争の解決法です。","m":"一期分＝一生（一期）の分だけ。死後は惣領へ返す"},{"id":133,"k":"plan","ref":"想定問題","f":"中世","t":"建武の新政の機構","y":1334,"q":"鎌倉幕府の滅亡後、後醍醐天皇が始めた建武の新政では、中央に諸機関が置かれた。そのうち、幕府の引付の役割を受け継ぎ、所領に関する訴訟の裁判を担当した機関はどれか。","c":["雑訴決断所","記録所","武者所","恩賞方"],"e":"1333年に鎌倉幕府が滅ぶと、後醍醐天皇は天皇親政をめざす建武の新政を始めました。中央には重要政務を扱う記録所、鎌倉幕府の引付を受け継いで所領関係の訴訟を扱う雑訴決断所、恩賞の事務にあたる恩賞方、京都の警備にあたる武者所などが置かれました。しかし、所領の安堵に天皇の綸旨を必要とするなど武家社会の慣習を無視した政策は混乱を招き、武士の不満が高まって、新政は足利尊氏の離反により3年足らずでくずれました。","m":"記録所＝重要政務、雑訴決断所＝所領訴訟、武者所＝京都警備"},{"id":134,"k":"plan","ref":"想定問題","f":"中世","t":"天龍寺船","y":1342,"q":"足利尊氏・直義兄弟は、夢窓疎石の勧めにより後醍醐天皇の冥福を祈る寺院の建立を計画し、その造営費を得るために1342年、元へ貿易船を派遣した。この船を何というか。","c":["天龍寺船","建長寺船","勘合船","奉書船"],"e":"天龍寺船は、足利尊氏らが夢窓疎石の勧めで後醍醐天皇の冥福を祈る天龍寺を建てるにあたり、その造営費を得るため1342年に元へ派遣した貿易船です。元とは正式な国交がありませんでしたが、民間の貿易や禅僧の往来はさかんでした。建長寺船は1325年に鎌倉幕府が建長寺の修造費を得るために元へ送った船、勘合船は15世紀以降の日明貿易の船、奉書船は江戸時代に老中奉書を受けて海外へ渡航した船です。","m":"建長寺船（鎌倉幕府）→天龍寺船（尊氏・夢窓疎石）どちらも元へ"},{"id":135,"k":"plan","ref":"想定問題","f":"中世","t":"半済令","y":1352,"q":"1352年、足利尊氏は近江・美濃・尾張の3国に限り、荘園・公領の年貢の半分を兵粮米として1年間だけ守護が徴発し、配下の武士に分け与えることを認めた。のちに全国へ広がり永続化したこの措置を何というか。","c":["半済","守護請","使節遵行","下地中分"],"e":"半済（はんぜい）は、荘園・公領の年貢の半分を兵粮米として守護が徴発し、配下の武士に分け与えることを認めた措置です。1352年、観応の擾乱による戦乱が激しかった近江・美濃・尾張に1年限りで出されましたが、やがて全国に広がって永続化し、守護が国内の武士を統制する手段となりました。守護請は荘園の年貢徴収を守護が請け負うこと、使節遵行は幕府の判決を守護が強制執行する権限、下地中分は鎌倉時代に荘園領主と地頭が土地を分けた方法です。","m":"半済＝年貢の半分を守護へ。1352年、近江・美濃・尾張から"},{"id":136,"k":"plan","ref":"想定問題","f":"中世","t":"日明貿易","y":1404,"q":"足利義満が始めた室町時代の日明貿易（勘合貿易）について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["日本からの主な輸出品は銅銭・生糸で、輸入品は刀剣・銅・硫黄であった。","明の皇帝に朝貢する形式をとり、使節の滞在費や運搬費は明が負担した。","4代将軍足利義持が朝貢形式を嫌って中断し、6代将軍義教が再開した。","寧波の乱ののちは、博多商人と結んだ大内氏が貿易を独占した。","すべて正しい"],"e":"日明貿易は、日本国王に任じられた将軍が明の皇帝に朝貢し、その返礼として品物を受け取る形式で、1404年から勘合を用いて行われました。滞在費や運搬費は明側が負担したため、日本側の利益は大きいものでした。輸出品は刀剣・銅・硫黄など、輸入品は銅銭・生糸・高級織物・陶磁器・書籍などで、これを逆にした文が誤りです。足利義持による中断と義教による再開、寧波の乱（1523年）後の大内氏の独占はいずれも正しい内容です。","m":"日明貿易：出るのは刀剣・銅・硫黄、入るのは銅銭・生糸","last":true},{"id":137,"k":"plan","ref":"想定問題","f":"中世","t":"大山崎の油座","y":1400,"q":"中世には、灯油の原料となる荏胡麻の買い付けや油の販売について、畿内を中心とする広い地域で独占的な権利を認められた大山崎の油神人（油座）が活動した。この座が本所とした神社はどれか。","c":["石清水八幡宮","北野社","祇園社","日吉神社"],"e":"大山崎の油神人は石清水八幡宮を本所とし、灯油の原料である荏胡麻の買い付けと油の販売について、畿内を中心に10か国近くで独占権を認められていました。座は、公家や寺社を本所として座役を納めるかわりに、関銭の免除や販売の独占といった特権を得た同業者の団体です。北野社は京都の酒麹座、祇園社は綿座の本所として知られます。日吉神社は近江坂本にある延暦寺の鎮守で、大山崎の油座の本所ではありません。","m":"大山崎油座＝石清水八幡宮／酒麹座＝北野社／綿座＝祇園社"},{"id":138,"k":"plan","ref":"想定問題","f":"中世","t":"琉球王国の成立","y":1429,"q":"15世紀初めの沖縄本島では北山・中山・南山の三つの勢力が争っていたが、1429年に中山王がこれを統一し、首里を都とする琉球王国を建てた。この人物は誰か。","c":["尚巴志","尚円","尚寧","尚泰"],"e":"沖縄本島では、グスクを拠点とする按司（あじ）をまとめた北山・中山・南山の三山が争っていましたが、1429年に中山王の尚巴志（しょうはし）が統一して琉球王国を建てました。琉球は明の海禁政策のもとで、明・日本・朝鮮・東南アジアを結ぶ中継貿易によって栄え、首里の外港である那覇は国際港となりました。尚円は15世紀後半に第二尚氏王統を開いた王、尚寧は1609年に島津氏の侵攻を受けた王、尚泰は明治政府による琉球処分のときの最後の王です。","m":"1429年、中山王尚巴志が三山統一→首里・那覇・中継貿易"},{"id":139,"k":"plan","ref":"想定問題","f":"中世","t":"惣村と土一揆","y":1428,"q":"室町時代の惣村の自治と、各地でおこった土一揆・国一揆について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["山城の国一揆は、浄土真宗本願寺派の門徒が守護富樫政親を倒したものである。","惣村では寄合で惣掟を定め、村民がみずから警察権を行使する地下検断も行われた。","正長の土一揆は、近江坂本の馬借の蜂起をきっかけとして徳政を要求した。","嘉吉の土一揆では、将軍の代始めの徳政を求められた幕府が徳政令を出した。","すべて正しい"],"e":"惣村では寄合を開いて惣掟を定め、村民がみずから警察権を行使する地下検断（自検断）や、年貢の納入を村で請け負う地下請も行われました。1428年の正長の土一揆は近江坂本の馬借の蜂起がきっかけで、1441年の嘉吉の土一揆では代始めの徳政を求められた幕府が徳政令を出しました。1485年の山城の国一揆は、南山城の国人らが畠山氏の軍を退去させて8年間の自治を行ったものです。守護富樫政親を倒したのは1488年の加賀の一向一揆なので、この文が誤りです。","m":"山城の国一揆＝畠山軍を追い出す／加賀の一向一揆＝富樫政親を倒す","last":true},{"id":140,"k":"plan","ref":"想定問題","f":"中世","t":"室町期の対外関係","y":1457,"q":"室町時代の対外関係に関する出来事ア〜エを古い順に正しく並べたものはどれか。ア 大内氏と細川氏が寧波で衝突した。イ 朝鮮軍が対馬を襲った。ウ 朝鮮の三浦で日本人居留民が暴動をおこした。エ コシャマインが蜂起した。","c":["イ→エ→ウ→ア","イ→エ→ア→ウ","エ→イ→ウ→ア","イ→ウ→エ→ア"],"e":"応永の外寇は1419年、コシャマインの戦いは1457年、三浦の乱は1510年、寧波の乱は1523年です。朝鮮は倭寇の根拠地とみなした対馬を襲いましたが、その後も宗氏を仲立ちとする日朝貿易は続き、三浦の乱を境にしだいに衰えました。蝦夷ヶ島では和人の進出に圧迫されたアイヌが大首長コシャマインを中心に蜂起し、これを鎮めた蠣崎氏が勢力をのばします。寧波の乱に勝った大内氏は、以後の日明貿易を独占しました。","m":"応永の外寇→コシャマイン→三浦の乱→寧波の乱"},{"id":141,"k":"plan","ref":"想定問題","f":"中世","t":"応仁の乱と将軍家","y":1467,"q":"8代将軍足利義政の妻で、実子の義尚を将軍の後継者に推し、義政の弟義視とのあいだに将軍家の家督争いを生んだ女性は誰か。この争いは管領家の家督争いなどとからんで応仁の乱へ発展した。","c":["日野富子","北条政子","阿仏尼","八条院"],"e":"日野富子は8代将軍足利義政の妻です。義政は弟の義視を後継者としていましたが、富子が義尚を生むと将軍家に家督争いがおこり、これに畠山・斯波両氏の家督争い、細川勝元と山名持豊（宗全）の対立がからんで、1467年に応仁の乱が始まりました。乱は11年に及び、京都は荒廃して幕府の権威は衰えました。北条政子は源頼朝の妻、阿仏尼は『十六夜日記』の作者、八条院は鳥羽上皇の娘で、いずれも時代が異なります。","m":"義政の弟義視 対 子の義尚（母は日野富子）→応仁の乱"},{"id":142,"k":"plan","ref":"想定問題","f":"中世","t":"分国法と城下町集住","y":1480,"q":"戦国大名が定めた家法のうち、家臣が領内に城を構えることを禁じ、有力家臣に対して本拠地の一乗谷へ移り住むよう命じた条文を含む、越前の大名のものはどれか。","c":["『朝倉孝景条々』","『今川仮名目録』","『甲州法度之次第』","『塵芥集』"],"e":"『朝倉孝景条々』は、越前の朝倉孝景（敏景）が15世紀後半に定めたとされる家訓で、朝倉氏の館のほかに国内に城を構えることを禁じ、有力家臣を一乗谷に移住させて領地には代官を置くよう命じています。家臣の城下町集住を示す史料としてよく取り上げられます。『今川仮名目録』は駿河の今川氏親、『甲州法度之次第』は甲斐の武田信玄、『塵芥集』は陸奥の伊達稙宗が定めた分国法で、いずれも16世紀のものです。","m":"朝倉＝一乗谷に集住、今川＝仮名目録、武田＝甲州法度、伊達＝塵芥集"},{"id":143,"k":"plan","ref":"想定問題","f":"中世","t":"正風連歌","y":1495,"q":"応仁の乱のころ、和歌の伝統を生かした深みのある正風連歌を確立し、『新撰菟玖波集』を編集したほか、弟子の肖柏・宗長とともに『水無瀬三吟百韻』を詠んだ連歌師は誰か。","c":["宗祇","二条良基","山崎宗鑑","宗長"],"e":"宗祇（そうぎ）は応仁の乱のころに活躍した連歌師で、和歌の伝統を生かした深みのある正風連歌を確立しました。1495年に『新撰菟玖波集』を編集し、弟子の肖柏・宗長と詠んだ『水無瀬三吟百韻』は連歌の模範とされます。各地を旅して連歌を広め、地方文化の発展にも寄与しました。二条良基は南北朝期に『菟玖波集』を編み、規則書『応安新式』を定めた公家、山崎宗鑑は自由な気風の俳諧連歌を始めた人物、宗長は宗祇の弟子です。","m":"良基＝菟玖波集、宗祇＝新撰菟玖波集（正風連歌）、宗鑑＝犬筑波集"},{"id":144,"k":"plan","ref":"想定問題","f":"中世","t":"撰銭令","y":1500,"q":"15世紀末から16世紀にかけて、室町幕府や戦国大名はしばしば撰銭令を出した。撰銭令が出された背景とそのねらいの説明として最も適切なものはどれか。","c":["粗悪な私鋳銭が出回り悪銭を嫌う撰銭で流通が滞ったため、銭の交換比率や使用を禁じる銭を定めた。","明から輸入した銅銭の使用を全面的に禁じ、幕府が鋳造した金貨・銀貨だけを通用させようとした。","年貢の銭納をやめさせて米納に戻すため、農民が良質の銭を選んでたくわえることを奨励した。","土倉や酒屋の高利貸しを取り締まり、借金の帳消しを求める土一揆の要求にこたえようとした。"],"e":"貨幣経済の発達で銭の需要が高まると、宋銭や永楽通宝などの明銭に加えて、粗悪な私鋳銭も多く出回りました。そのため取引の際に悪銭を嫌い良質の銭を選ぶ撰銭が広まり、流通が混乱しました。幕府や戦国大名は撰銭令を出し、良銭と悪銭の交換比率を定めたり、特定の悪銭の使用を禁じるかわりにそれ以外の銭の受け取りを強制したりして、取引の円滑化をはかりました。中世の幕府は貨幣を鋳造しておらず、借金の帳消しを命じるのは徳政令です。","m":"撰銭令＝悪銭えらびを制限して流通を円滑に（徳政令と区別）"},{"id":145,"k":"plan","ref":"想定問題","f":"中世","t":"北山・東山文化","y":1397,"q":"北山文化・東山文化など室町時代の文化について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["足利義満が京都の北山に建てた金閣は、寝殿造風と禅宗様を折衷した建築である。","観阿弥・世阿弥父子は足利義満の保護を受け、猿楽能を芸術性の高いものに大成した。","足利義政が東山に建てた東求堂の同仁斎は、書院造の代表例として知られる。","村田珠光は茶と禅の精神の統一を主張し、簡素な侘茶を創始した。","すべて正しい"],"e":"4つの文はすべて正しい内容です。足利義満の時代の北山文化を代表する金閣は、寝殿造風と禅宗様を折衷した建築で、公家文化と武家文化・禅宗文化の融合を示します。観阿弥・世阿弥父子は義満の保護を受けて猿楽能を大成し、世阿弥は理論書『風姿花伝』を残しました。足利義政の時代の東山文化では、東求堂同仁斎に見られる書院造が近代の和風住宅の原型となり、村田珠光が茶と禅の精神の統一を説いて侘茶を始めました。侘茶はのち武野紹鷗を経て千利休が大成します。","m":"北山＝義満・金閣・能／東山＝義政・書院造・侘茶","a":4,"last":true},{"id":146,"k":"plan","ref":"想定問題","f":"近世","t":"秀吉のキリスト教政策","y":1587,"q":"1587年、九州平定を終えた豊臣秀吉が博多で発し、宣教師に20日以内の国外退去を命じた法令は何か。ただし南蛮貿易は引き続き奨励したため、禁教は徹底されなかった。","c":["バテレン追放令","海賊取締令","人掃令","禁教令"],"e":"秀吉は当初キリスト教の布教を認めていましたが、九州平定の際に大村純忠が長崎をイエズス会に寄進していたことを知り、1587年に博多でバテレン追放令を出しました。しかし南蛮貿易は奨励したため、取締りは不徹底に終わりました。海賊取締令は1588年に倭寇などの海賊行為を禁じた法令、人掃令は1590年代初めに身分の移動を禁じた法令、禁教令は江戸幕府が1612年に直轄領、翌年全国に出したものです。","m":"1587年博多：宣教師は追放、でも貿易は奨励で不徹底"},{"id":147,"k":"plan","ref":"想定問題","f":"近世","t":"桃山文化の障壁画","y":1576,"q":"織田信長・豊臣秀吉に仕えて安土城や大坂城の障壁画を制作し、『唐獅子図屛風』『洛中洛外図屛風』などの作品を残した、桃山文化を代表する画家は誰か。","c":["狩野永徳","狩野山楽","長谷川等伯","海北友松"],"e":"狩野永徳は、水墨画と大和絵を融合させ、金箔地に青や緑を濃く彩色する濃絵（だみえ）の豪壮な障壁画を大成し、信長・秀吉に重用されました。狩野山楽は永徳の門人で『松鷹図』『牡丹図』、長谷川等伯は水墨の『松林図屛風』や濃絵の智積院襖絵、海北友松は『山水図屛風』で知られます。いずれも桃山文化の画家ですが、『唐獅子図屛風』は永徳の代表作です。","m":"永徳＝唐獅子・洛中洛外、等伯＝松林図、山楽＝松鷹図"},{"id":148,"k":"plan","ref":"想定問題","f":"近世","t":"太閤検地と刀狩","y":1582,"q":"豊臣秀吉の検地・刀狩・朝鮮出兵とその影響について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["検地帳には実際の耕作者が登録され、一地一作人の原則がとられた。","1588年の刀狩令は、方広寺の大仏造営を口実に百姓の武器を没収した。","太閤検地では1段を360歩とし、枡の容量を京枡に統一した。","朝鮮出兵で連れ帰られた陶工により、有田焼や萩焼などが始まった。","すべて正しい"],"e":"太閤検地では、それまでの1段＝360歩を改めて1

段＝300歩とし、枡も京枡に統一して、田畑の等級ごとの石盛から石高を定めました。したがって「360歩」とする文が誤りです。検地帳に耕作者を登録する一地一作人の原則、1588年の刀狩令が方広寺の大仏造営を口実としたこと、朝鮮出兵で連行された陶工が有田焼・萩焼・薩摩焼などを始めたことは、いずれも正しい内容です。","m":"太閤検地：6尺3寸四方が1歩、300歩で1段、枡は京枡","a":2,"last":true},{"id":149,"k":"plan","ref":"想定問題","f":"近世","t":"三貨と秤量貨幣","y":1601,"q":"江戸時代の三貨のうち、取引のたびに重さをはかって用いる秤量貨幣で、豆板銀とともに主に大坂など上方の取引で使われた銀貨は何か。","c":["丁銀","南鐐二朱銀","一分金","寛永通宝"],"e":"江戸時代の金貨は小判・一分金など枚数で数える計数貨幣でしたが、銀貨の丁銀・豆板銀は重さをはかって使う秤量貨幣でした。東日本では主に金、西日本では主に銀が取引の中心で、三貨の交換比率も変動したため両替商が発達しました。南鐐二朱銀は1772年に田沼意次が鋳造させた計数銀貨、一分金は金貨、寛永通宝は銭貨で、いずれも秤量貨幣ではありません。","m":"江戸の金遣い（計数）・大坂の銀遣い（秤量の丁銀・豆板銀）"},{"id":150,"k":"plan","ref":"想定問題","f":"近世","t":"幕府の統制策","y":1615,"q":"江戸幕府による大名・朝廷・宗教・百姓の統制について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["寛永の武家諸法度で、大名の参勤交代が制度として定められた。","朝廷との連絡にあたる武家伝奏には、譜代大名が任じられた。","寺請制度が設けられ、人々は檀那寺の檀家であることを証明させられた。","1643年の田畑永代売買の禁止令は、百姓の田畑の売買を禁じた。","すべて正しい"],"e":"武家伝奏は公家から2人が選ばれ、京都所司代と連絡をとりながら朝廷に幕府の意向を伝えた役職なので、譜代大名とする文が誤りです。朝廷の監視にあたる京都所司代のほうが譜代大名から任じられました。1635年に徳川家光が出した寛永の武家諸法度で参勤交代が制度化されたこと、キリスト教禁止を徹底するための寺請制度、1643年の田畑永代売買の禁止令は、いずれも正しい内容です。","m":"武家伝奏は公家2人、京都所司代は譜代大名（朝廷の監視）","a":1,"last":true},{"id":151,"k":"plan","ref":"想定問題","f":"近世","t":"鎖国への過程","y":1639,"q":"鎖国にいたる過程の出来事ア〜エを古い順に正しく並べたものはどれか。ア 島原の乱がおこる　イ スペイン船の来航を禁止する　ウ ポルトガル船の来航を禁止する　エ 日本人の海外渡航と帰国を全面的に禁止する","c":["イ→エ→ア→ウ","イ→ア→エ→ウ","エ→イ→ア→ウ","イ→エ→ウ→ア"],"e":"幕府は1624年にスペイン船の来航を禁じ（イ）、1633年に奉書船以外の渡航を禁じたのち、1635年には日本人の海外渡航と帰国を全面的に禁止しました（エ）。1637年に島原の乱がおこると（ア）、幕府はキリスト教への警戒をいっそう強め、1639年にポルトガル船の来航を禁止しました（ウ）。さらに1641年、平戸のオランダ商館を長崎の出島に移して、いわゆる鎖国の状態が完成しました。","m":"スペイン1624→渡航全面禁止1635→島原1637→ポルトガル1639"},{"id":152,"k":"plan","ref":"想定問題","f":"近世","t":"鎖国下の四つの口","y":1641,"q":"いわゆる鎖国のもとでの「四つの口」について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["長崎では、オランダ商館を出島に置き、のち清国人の居住も唐人屋敷に限った。","対馬藩の宗氏は己酉約条を結び、釜山の倭館で朝鮮との貿易をおこなった。","琉球は薩摩藩の支配下で、将軍の代替わりごとに慶賀使を幕府に送った。","松前藩は、アイヌとの交易権を家臣に分与する商場知行制をとった。","すべて正しい"],"e":"四つの文はすべて正しい内容です。長崎では1641年にオランダ商館が平戸から出島に移され、1689年には清国人の居住地として唐人屋敷が設けられました。対馬の宗氏は1609年に朝鮮と己酉約条を結び、琉球は同年に薩摩藩に征服されたのちも、将軍の代替わりに慶賀使、国王の代替わりに謝恩使を江戸に送りました。松前藩では、アイヌとの交易権を家臣に与える商場知行制がとられました。","m":"四つの口＝長崎（蘭・清）・対馬（朝鮮）・薩摩（琉球）・松前（アイヌ）","a":4,"last":true},{"id":153,"k":"plan","ref":"想定問題","f":"近世","t":"有田焼と赤絵","y":1645,"q":"朝鮮出兵の際に連れてこられた陶工によって始まった肥前の有田焼で、17世紀前半に上絵付の技法を研究して赤絵を完成させた陶工は誰か。","c":["酒井田柿右衛門","野々村仁清","尾形乾山","本阿弥光悦"],"e":"有田では朝鮮出兵の際に連れてこられた朝鮮人陶工の手で磁器の生産が始まり、酒井田柿右衛門が1640年代に上絵付の技法で赤絵を完成させました。寛永期の文化を代表する工芸です。野々村仁清は17世紀後半に色絵を完成して京焼の祖とされた陶工、尾形乾山は尾形光琳の弟で元禄期の陶工、本阿弥光悦は寛永期に蒔絵や楽焼の茶碗を残した京都の文化人です。","m":"有田の赤絵＝柿右衛門（寛永）、京焼の色絵＝仁清（元禄）"},{"id":154,"k":"plan","ref":"想定問題","f":"近世","t":"元禄文化の浮世草子","y":1688,"q":"大坂の町人の出身で、はじめ談林派の俳諧で名をあげ、のち浮世草子に転じて『好色一代男』や、町人の経済生活を描いた『日本永代蔵』を著した人物は誰か。","c":["井原西鶴","近松門左衛門","西山宗因","松尾芭蕉"],"e":"井原西鶴は西山宗因に学んだ談林派の俳人でしたが、1682年の『好色一代男』以後は浮世草子の作者として活躍し、好色物のほか、町人物の『日本永代蔵』『世間胸算用』、武家物の『武道伝来記』を著しました。近松門左衛門は『曽根崎心中』などの人形浄瑠璃・歌舞伎の脚本作者、西山宗因は談林俳諧の中心人物、松尾芭蕉は蕉風俳諧を確立し『奥の細道』を残した俳人です。","m":"西鶴＝浮世草子、近松＝浄瑠璃、芭蕉＝蕉風俳諧（元禄の三人）"},{"id":155,"k":"plan","ref":"想定問題","f":"近世","t":"正徳の政治と長崎貿易","y":1715,"q":"1715年、新井白石が長崎貿易による金銀の海外流出を防ぐために定め、年間の貿易額を清船30隻・銀6000貫、オランダ船2隻・銀3000貫に制限した法令は何か。","c":["海舶互市新例","糸割符制度","相対済し令","上知令"],"e":"長崎貿易では輸入品の支払いで多くの金銀が流出していたため、新井白石は1715年に海舶互市新例（長崎新令・正徳新令）を出して貿易額を制限しました。糸割符制度は1604年に特定の商人に輸入生糸を一括購入させた制度、相対済し令は1719年に徳川吉宗が金銭貸借の訴訟を当事者間で解決させた法令、上知令は1843年に水野忠邦が江戸・大坂周辺の直轄化をはかった法令です。","m":"正徳の政治＝白石：正徳金銀で質を戻し、互市新例で流出防止"},{"id":156,"k":"plan","ref":"想定問題","f":"近世","t":"女子教育と教訓書","y":1716,"q":"江戸時代中期から広く流布し、女子の手習いの教材にも用いられた教訓書で、貝原益軒の著作をもとにつくられたとされ、女性に夫や舅・姑への服従を説いたものは何か。","c":["『女大学』","『庭訓往来』","『塵劫記』","『都鄙問答』"],"e":"『女大学』は18世紀前半（享保期）に刊行された女子教訓書で、貝原益軒の『和俗童子訓』の一部をもとに後人が通俗化したものとされます。嫁いだ女性は夫や舅・姑によく仕え従うべきだとする儒教的な道徳を説き、手習いの教材としても広く使われました。『庭訓往来』は中世に成立し寺子屋でも使われた往来物、『塵劫記』は吉田光由の和算書、『都鄙問答』は石田梅岩が町人の道徳を説いた心学の書です。","m":"女大学＝益軒の著作がもと・女子の教訓書、庭訓往来＝往来物"},{"id":157,"k":"plan","ref":"想定問題","f":"近世","t":"貨幣改鋳の流れ","y":1736,"q":"江戸幕府の貨幣政策ア〜エを古い順に正しく並べたものはどれか。ア 計数銀貨の南鐐二朱銀を鋳造する　イ 質を慶長金銀に戻した正徳金銀を鋳造する　ウ 金の含有率を下げた元禄金銀を鋳造する　エ 徳川吉宗が元文金銀を鋳造する","c":["ウ→イ→エ→ア","イ→ウ→エ→ア","ウ→エ→イ→ア","ウ→イ→ア→エ"],"e":"1695年、徳川綱吉のもとで金の含有率を下げた元禄金銀が鋳造され（ウ）、幕府は差益を得ましたが物価が上がりました。新井白石はこれを改め、1714年に慶長金銀と同じ質の正徳金銀を鋳造させました（イ）。徳川吉宗は1736年、質を落とした元文金銀を鋳造して通貨量を増やし（エ）、田沼意次は1772年に、金貨の単位で通用する計数銀貨の南鐐二朱銀を鋳造させました（ア）。","m":"元禄（下げる）→正徳（戻す）→元文（下げる）→南鐐二朱銀"},{"id":158,"k":"plan","ref":"想定問題","f":"近世","t":"近世の女性と社会","y":1750,"q":"江戸時代の女性をめぐる社会や文化について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["出雲阿国のかぶき踊りに始まる女歌舞伎は、のちに幕府に禁止された。","関所では、江戸に入る鉄砲と江戸から出る女性が特に厳しく調べられた。","鎌倉の東慶寺などの縁切寺に駆け込めば、妻の側からも離婚を求められた。","離婚の際の離縁状（三行半）は、妻が夫に渡すのが原則であった。","すべて正しい"],"e":"離縁状（三行半）は夫から妻に渡すもので、これがないと妻は再婚できませんでした。したがって「妻が夫に渡す」とする文が誤りです。ただし、鎌倉の東慶寺などの縁切寺に駆け込めば、妻の側から離婚を求めることもできました。女歌舞伎は風俗を乱すとして1629年に禁止され、若衆歌舞伎をへて野郎歌舞伎に移りました。関所では「入鉄砲に出女」が厳しく取り締まられました。","m":"三行半は夫→妻、妻からは縁切寺（鎌倉の東慶寺）","a":3,"last":true},{"id":159,"k":"plan","ref":"想定問題","f":"近世","t":"海国兵談の主張","y":1791,"q":"林子平は『海国兵談』で「江戸の日本橋より唐、阿蘭陀迄境なしの水路也」と述べた。この記述を通じて彼が主張した内容として最も適当なものはどれか。","c":["日本は海に囲まれ外国船はどこへでも来航できるから、長崎だけでなく江戸湾など沿岸の防備が必要だ。","江戸と長崎を結ぶ海運を整え、清やオランダとの貿易を拡大して幕府の財政を立て直すべきだ。","蝦夷地を開発してロシアと交易をおこない、その利益で国を豊かにすべきだ。","漂流民を送り届けに来た外国船まで打ち払うのは誤りであり、打払いの方針を改めるべきだ。"],"e":"林子平は『海国兵談』で、日本は海に囲まれた海国で、江戸も海路で外国とつながっているのだから、長崎だけでなく江戸湾などの防備を固めるべきだと説きました。しかし幕府は、世間を惑わすものとして版木を没収し、1792年に子平を蟄居させました。蝦夷地の開発とロシアとの交易を説いたのは工藤平助ら、打払い政策を批判したのは高野長英・渡辺崋山で、貿易拡大による財政再建は史料の趣旨と合いません。","m":"海国兵談（1791年）→翌年ラクスマン来航、海防が現実の課題に"},{"id":160,"k":"plan","ref":"想定問題","f":"近世","t":"寛政の出版統制","y":1791,"q":"寛政の改革の出版統制により、1791年に洒落本『仕懸文庫』などが風俗を乱すとして手鎖50日の刑を受けた作者は誰か。このとき、版元の蔦屋重三郎も処罰された。","c":["山東京伝","恋川春町","為永春水","柳亭種彦"],"e":"松平定信は出版統制令を出して、政治への風刺や風俗を乱す出版物を取り締まりました。山東京伝は黄表紙『江戸生艶気樺焼』でも知られる人気作者でしたが、洒落本が咎められて処罰されました。恋川春町は寛政の改革を風刺した黄表紙『鸚鵡返文武二道』の作者です。人情本の為永春水と合巻『偐紫田舎源氏』の柳亭種彦は、のちの天保の改革で処罰されました。","m":"寛政＝京伝（洒落本）・春町（黄表紙）、天保＝春水・種彦"},{"id":161,"k":"plan","ref":"想定問題","f":"近世","t":"国学と和学講談所","y":1793,"q":"幼くして失明しながら国学を学び、1793年に幕府の援助を受けて江戸に和学講談所を設け、日本の古典や史料を集めた『群書類従』の編纂・刊行を進めた人物は誰か。","c":["塙保己一","賀茂真淵","本居宣長","平田篤胤"],"e":"塙保己一は賀茂真淵らに学んだ盲目の国学者で、和学講談所で古典や史料の収集・校訂を進め、『群書類従』を刊行して、のちの国史学・国文学の基礎を築きました。賀茂真淵は『万葉集』などを研究して『国意考』を著した人物、本居宣長は『古事記伝』を著して国学を大成した人物、平田篤胤は復古神道をとなえ幕末の尊王攘夷運動に影響を与えた人物です。","m":"真淵『国意考』→宣長『古事記伝』→篤胤 復古神道、塙は群書類従"},{"id":162,"k":"plan","ref":"想定問題","f":"近世","t":"蘭学と鎖国論","y":1801,"q":"長崎のオランダ通詞の出身で、『暦象新書』でニュートンの万有引力説や地動説を紹介し、またケンペル『日本誌』の一部を訳して「鎖国論」と題した人物は誰か。","c":["志筑忠雄","大槻玄沢","稲村三伯","宇田川玄随"],"e":"志筑忠雄は元オランダ通詞の蘭学者で、『暦象新書』によりニュートンの力学や地動説を紹介しました。1801年にはケンペルの著書の一部を「鎖国論」として訳し、これが「鎖国」という言葉のもとになりました。大槻玄沢は入門書『蘭学階梯』を著し江戸に芝蘭堂を開いた人物、稲村三伯は蘭日辞書『ハルマ和解』をつくった人物、宇田川玄随は西洋内科書を訳した『西説内科撰要』の著者です。","m":"志筑＝暦象新書と鎖国論、玄沢＝蘭学階梯、三伯＝ハルマ和解"},{"id":163,"k":"plan","ref":"想定問題","f":"近世","t":"列強の接近と幕府","y":1825,"q":"列強の接近に関する出来事ア〜エを古い順に正しく並べたものはどれか。ア フェートン号が長崎に侵入する　イ 蛮社の獄がおこる　ウ レザノフが長崎に来航する　エ 異国船打払令が出される","c":["ウ→ア→エ→イ","ア→ウ→エ→イ","ウ→エ→ア→イ","ウ→ア→イ→エ"],"e":"1804年、ロシア使節レザノフが長崎に来航して通商を求めましたが、幕府は拒否しました（ウ）。1808年にはイギリス軍艦フェートン号がオランダ船を追って長崎に侵入し（ア）、その後も異国船の接近が続いたため、幕府は1825年に異国船打払令を出しました（エ）。1837年のモリソン号事件での打払いを批判した渡辺崋山・高野長英らは、1839年の蛮社の獄で処罰されました（イ）。","m":"レザノフ1804→フェートン号1808→打払令1825→蛮社の獄1839"},{"id":164,"k":"plan","ref":"想定問題","f":"近世","t":"薩摩藩の藩政改革","y":1827,"q":"19世紀前半の薩摩藩で、三都の商人からの約500万両の負債を無利子250年賦返済として事実上棚上げし、奄美の黒砂糖の専売強化や琉球を通じた貿易で藩財政を再建した人物は誰か。","c":["調所広郷","村田清風","鍋島直正","藤田東湖"],"e":"薩摩藩では下級武士から登用された調所広郷が1820年代後半から改革に着手し、巨額の負債を事実上棚上げにしたうえで、黒砂糖の専売や琉球を通じた清との貿易で利益をあげました。村田清風は長州藩で借財を整理し、下関に越荷方をおいて収益をあげた人物、鍋島直正は肥前藩主で均田制や反射炉の建設を進めた人物、藤田東湖は水戸藩主徳川斉昭のもとで藩政改革にあたった人物です。","m":"薩摩＝調所・黒砂糖、長州＝村田・越荷方、肥前＝鍋島・均田制"},{"id":165,"k":"plan","ref":"想定問題","f":"近世","t":"化政文化の風景版画","y":1833,"q":"天保期に、東海道の宿場の風景や旅人の姿を叙情的に描いた錦絵の連作『東海道五十三次』を刊行し、風景版画の流行を担った浮世絵師は誰か。","c":["歌川広重","葛飾北斎","喜多川歌麿","歌川国芳"],"e":"化政文化では錦絵の風景版画が流行し、歌川広重は1833年頃から『東海道五十三次』を刊行して人気を得ました。背景には庶民の旅の流行もあります。葛飾北斎は『富嶽三十六景』を描いた絵師、喜多川歌麿は寛政期に美人画の大首絵で活躍した絵師、歌川国芳は武者絵や風刺画を得意とした絵師です。広重や北斎の作品は、のちにヨーロッパの印象派の画家にも影響を与えました。","m":"北斎＝富嶽三十六景、広重＝東海道五十三次（どちらも風景版画）"},{"id":166,"k":"plan","ref":"想定問題","f":"近世","t":"株仲間の解散","y":1841,"q":"1841年、天保の改革を進める老中水野忠邦は、十組問屋などの株仲間に解散を命じた。幕府がこの政策をとった理由として最も適当なものはどれか。","c":["物価騰貴の原因は株仲間による流通の独占にあると考え、自由な取引で物価を引き下げようとした。","株仲間が納める運上・冥加が減少したので、新たな商人に営業権を与えて増収をはかろうとした。","株仲間が百姓一揆や打ちこわしを資金面で支援していたため、その組織を解体しようとした。","株仲間が外国船との密貿易で利益をあげていたため、鎖国の体制を守ろうとした。"],"e":"水野忠邦は、十組問屋などの株仲間が上方からの商品流通を独占していることが物価騰貴の原因だと判断し、1841年に解散を命じました。しかし実際の原因は、生産地から上方市場に入る商品の量が減っていたことにあったため、解散はかえって江戸への商品輸送を滞らせて逆効果となり、1851年に株仲間の再興が認められました。運上・冥加の増収をねらって株仲間を積極的に公認したのは田沼意次で、一揆の支援や密貿易は理由ではありません。","m":"株仲間：田沼が公認→天保で解散（1841年）→1851年に再興"},{"id":167,"k":"plan","ref":"想定問題","f":"近世","t":"幕政改革と田沼時代","y":1843,"q":"江戸時代の幕政改革や田沼時代の政策について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["水野忠邦は上知令を出し、江戸・大坂周辺の直轄化を実現した。","徳川吉宗は公事方御定書を編纂させ、裁判や刑罰の基準を定めた。","田沼意次は株仲間を広く公認し、運上・冥加を納めさせて増収をはかった。","天明の打ちこわしの直後に老中となった松平定信は、囲米や七分積金を命じた。","すべて正しい"],"e":"水野忠邦は1843年に上知令を出して江戸・大坂周辺の約50万石を直轄地にしようとしましたが、大名・旗本らの反対で撤回に追い込まれ、まもなく失脚しました。したがって「実現した」とする文が誤りです。公事方御定書は1742年に徳川吉宗が定めたもの、株仲間の公認は田沼意次の政策で、松平定信は1787年の天明の打ちこわしの直後に老中となり、囲米や七分積金を命じました。","m":"上知令（1843年）は反対で撤回→水野忠邦は失脚","last":true},{"id":168,"k":"plan","ref":"想定問題","f":"近代","t":"開港と金貨の流出","y":1859,"q":"1859年に横浜などで貿易が始まると、日本から大量の金貨が海外に流出した。その理由を説明した文として最も適切なものはどれか。","c":["金銀の交換比率が日本は1：5、外国は1：15と異なり、外国人が銀貨を持ち込んで金貨と交換したから。","貿易が大幅な輸入超過となり、綿織物などの輸入代金の支払いに金貨があてられたから。","幕府が金の含有量を増やした小判を新たに鋳造し、外国商人がこれを競って買い求めたから。","通商条約で、輸入品の代金は金貨で支払うことが日本側に義務づけられていたから。"],"e":"金と銀の交換比率は、日本では約1：5、外国では約1：15で、日本では金が割安でした。そのため外国人は銀貨を持ち込んで日本の金貨に替え、海外に持ち出して利益を得たので、10万両以上の金貨が流出しました。幕府は1860年、金の含有量を大幅に減らした万延小判を鋳造して流出を防ぎましたが、貨幣価値が下がって物価上昇に拍車がかかりました。開港直後の貿易は生糸の輸出が中心の輸出超過で、条約に金貨での支払い義務もありません。","m":"金銀比価 日本1：5・外国1：15→金流出→万延小判→物価高"},{"id":169,"k":"plan","ref":"想定問題","f":"近代","t":"文久の改革","y":1862,"q":"1862年、勅使を奉じて江戸に下り、徳川慶喜の将軍後見職就任などの幕政改革を幕府に求め、その帰途に従士が生麦事件を起こした薩摩藩主の父は誰か。","c":["島津久光","島津斉彬","松平慶永","山内豊信"],"e":"島津久光は薩摩藩主島津忠義の父で、1862年に勅使大原重徳とともに江戸に下り、幕政改革を要求しました。幕府はこれを受けて徳川慶喜を将軍後見職、松平慶永を政事総裁職、松平容保を京都守護職に任じ、参勤交代を緩和しました（文久の改革）。帰途に起きた生麦事件は、翌1863年の薩英戦争につながります。島津斉彬は久光の兄で1858年に死去しており、松平慶永は越前藩主、山内豊信は土佐藩主です。","m":"久光の江戸下向→文久の改革→帰途に生麦事件→翌年薩英戦争"},{"id":170,"k":"plan","ref":"想定問題","f":"近代","t":"明治初期の諸改革","y":1873,"q":"明治政府が1870年代前半に進めた廃藩置県・徴兵令・地租改正・学制について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["廃藩置県では、知藩事を罷免して東京に住まわせ、中央から府知事・県令を派遣した。","徴兵令は満20歳に達した男性に兵役を課したが、戸主や代人料を納めた者は免除された。","地租改正では、収穫高の3％を地租と定め、土地所有者に現金で納めさせた。","学制は、フランスの制度にならい、国民皆学をめざして小学校の設置を進めた。","すべて正しい"],"e":"誤りは地租改正の文です。1873年の地租改正条例は、収穫高ではなく地価を課税の基準とし、その3％を地券所有者に金納させました。これにより政府の税収は豊凶に左右されず安定しましたが、負担は軽くならず、各地で反対一揆が起こり、1877年に税率は2.5％に引き下げられます。廃藩置県は1871年、学制は1872年、徴兵令は1873年で、ほかの3文は正しい内容です。徴兵令の免役規定は、のちの改正でしだいに縮小されました。","m":"地租は「地価」の3％を「金納」。1877年に2.5％へ","a":2,"last":true},{"id":171,"k":"plan","ref":"想定問題","f":"近代","t":"啓蒙思想の団体","y":1873,"q":"1873年、森有礼の発議で福沢諭吉・西周・加藤弘之らが参加して結成され、翌年から機関誌を発行して西洋近代思想の普及につとめた啓蒙団体は何か。","c":["明六社","民友社","政教社","硯友社"],"e":"明六社は明治6（1873）年に森有礼らが結成した啓蒙思想団体で、翌年から『明六雑誌』を発行し、演説会も開いて西洋の近代思想を紹介しました。1875年に讒謗律・新聞紙条例が出されると雑誌は廃刊となります。民友社は1887年に徳富蘇峰が設立し『国民之友』で平民的欧化主義を唱えた団体、政教社は1888年に三宅雪嶺らが設立し『日本人』で国粋保存主義を唱えた団体、硯友社は尾崎紅葉らの文学結社です。","m":"明治6年だから明六社。森有礼・福沢諭吉・『明六雑誌』"},{"id":172,"k":"plan","ref":"想定問題","f":"近代","t":"士族の特権廃止","y":1876,"q":"1876年、政府は華族・士族に金禄公債証書を与えるかわりに、国家財政の重い負担となっていた家禄などの支給を全廃した。この措置を何というか。","c":["秩禄処分","版籍奉還","士族授産","地租改正"],"e":"秩禄処分は、家禄と賞典禄（あわせて秩禄）の支給を打ち切った措置です。政府は1873年に希望者に対して秩禄奉還の法を定め、1876年にはすべての受給者に金禄公債証書を与えて秩禄を全廃しました。同年の廃刀令とあわせて士族は主な特権を失い、不満は士族反乱へとつながります。版籍奉還は1869年に藩主が土地と人民を天皇に返上したこと、士族授産は困窮した士族への就業支援策、地租改正は1873年からの土地・税制の改革です。","m":"1876年は廃刀令と秩禄処分。金禄公債証書で禄を全廃"},{"id":173,"k":"plan","ref":"想定問題","f":"近代","t":"国会開設運動","y":1880,"q":"1880年、大阪で開かれた愛国社の大会で結成され、片岡健吉・河野広中らが国会開設を求める請願書を政府に提出しようとした全国的組織は何か。","c":["国会期成同盟","立志社","立憲改進党","立憲帝政党"],"e":"国会期成同盟は、1880年3月の愛国社第4回大会で結成された国会開設運動の全国組織です。各地で集めた署名をもとに請願書を提出しようとしましたが政府は受理せず、同年4月に集会条例を定めて運動を取り締まりました。翌1881年に国会開設の勅諭が出ると、この組織を母体に板垣退助を党首とする自由党が結成されます。立志社は1874年に土佐で結成された政社、立憲改進党は1882年に大隈重信が結成した政党、立憲帝政党は同年に福地源一郎らが結成した政府系の政党です。","m":"愛国社→国会期成同盟（1880）→集会条例→自由党（1881）"},{"id":174,"k":"plan","ref":"想定問題","f":"近代","t":"自由民権運動の展開","y":1881,"q":"自由民権運動に関する出来事ア〜エを古い順に正しく並べたものはどれか。ア 民撰議院設立の建白書の提出　イ 国会開設の勅諭　ウ 秩父事件　エ 西南戦争","c":["ア→エ→イ→ウ","ア→イ→エ→ウ","エ→ア→イ→ウ","ア→エ→ウ→イ"],"e":"ア（1874年）→エ（1877年）→イ（1881年）→ウ（1884年）の順です。1874年、征韓論争で下野した板垣退助らが民撰議院設立の建白書を左院に提出し、民権運動が始まりました。1877年の西南戦争で士族の武力反乱が終わると、運動は言論中心となり豪農層にも広がります。1881年、開拓使官有物払下げ事件で批判が高まるなか、政府は大隈重信を罷免し、1890年の国会開設を約束しました。その後、松方財政下の不況で運動は急進化し、1884年に秩父事件が起こります。","m":"建白書1874→西南戦争1877→勅諭1881→秩父事件1884"},{"id":175,"k":"plan","ref":"想定問題","f":"近代","t":"松方財政","y":1881,"q":"明治十四年の政変の直後、1881年に大蔵卿となった松方正義が進めた財政政策と、その社会への影響を説明した文として最も適切なものはどれか。","c":["増税と歳出の緊縮で不換紙幣を整理し日本銀行を設立したが、深刻なデフレで自作農の没落が進んだ。","不換紙幣を増発して殖産興業の資金をまかなったため、物価が上がり農民の収入が増えた。","国立銀行条例を改正して兌換の義務をなくし、各地の国立銀行に銀行券を発行させた。","日清戦争の賠償金を準備金として金本位制を確立し、官営事業を大幅に拡大した。"],"e":"松方正義は、西南戦争の戦費調達などで増発された不換紙幣によるインフレをおさえるため、酒税などの増税と軍事費以外の歳出の緊縮で紙幣を整理し、1882年に中央銀行として日本銀行を設立しました。1885年から銀兌換の銀行券を発行し、銀本位制が整います。一方、米や繭の価格が下落して地租の負担が重くなり、土地を手放して小作農に転落する自作農が増えました。紙幣の増発は松方以前の状況、兌換義務の廃止は1876年、金本位制の確立は1897年のことです。","m":"松方財政＝紙幣整理・日本銀行（1882）・銀兌換（1885）・デフレ"},{"id":176,"k":"plan","ref":"想定問題","f":"近代","t":"紡績業の機械化","y":1883,"q":"渋沢栄一らが設立して1883年に開業した紡績会社で、輸入の紡績機械と蒸気機関を用いた1万錘規模の大経営に成功し、機械制生産が広がるきっかけとなったのはどこか。","c":["大阪紡績会社","鐘淵紡績会社","富岡製糸場","鹿児島紡績所"],"e":"大阪紡績会社は1882年に設立、翌1883年に開業し、イギリス製の紡績機械と蒸気機関を使い、電灯を用いた昼夜2交替制で大規模な生産をおこないました。この成功に刺激されて1880年代後半に紡績会社の設立が相次ぎ、1890年には綿糸の生産量が輸入量を上回り、1897年には輸出量が輸入量を上回ります。鐘淵紡績会社はこれより後に東京で設立された紡績会社、富岡製糸場は1872年開業の官営の製糸工場、鹿児島紡績所は幕末に薩摩藩が建てた洋式工場です。","m":"大阪紡績＝渋沢栄一・1883年開業・蒸気機関・1万錘"},{"id":177,"k":"plan","ref":"想定問題","f":"近代","t":"憲法と初期議会","y":1890,"q":"1889年に発布された大日本帝国憲法と、翌年に始まった初期議会について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["第一議会では、民党が主権線と利益線の防衛を唱えて軍備拡張を求めた。","憲法は、天皇が定めて国民に与える欽定憲法の形式で発布された。","帝国議会は衆議院と貴族院からなり、予算や法律の成立には議会の同意が必要とされた。","最初の総選挙の選挙権は、直接国税15円以上を納める満25歳以上の男性に限られた。","すべて正しい"],"e":"誤りは第一議会の文です。1890年の第一議会で「主権線」（国境）と「利益線」（朝鮮）の防衛のための軍備拡張を説いたのは山県有朋首相で、衆議院の過半数を占めた民党（立憲自由党・立憲改進党）は「政費節減・民力休養」を掲げて予算の削減を迫りました。憲法は天皇が定める欽定憲法で、議会は二院制、予算・法律には議会の協賛が必要でした。第1回総選挙の有権者は直接国税15円以上を納める満25歳以上の男性で、全人口の約1％でした。","m":"政府（山県）＝主権線・利益線、民党＝政費節減・民力休養","last":true},{"id":178,"k":"plan","ref":"想定問題","f":"近代","t":"大津事件と条約改正","y":1891,"q":"条約改正交渉でイギリスの同意を得つつあったが、1891年、来日中のロシア皇太子が巡査に切りつけられた大津事件の責任をとって辞任した外務大臣は誰か。","c":["青木周蔵","井上馨","大隈重信","陸奥宗光"],"e":"青木周蔵は、シベリア鉄道建設を進めるロシアを警戒したイギリスが日本に好意的になったことを背景に、領事裁判権の撤廃を中心とする交渉を進めましたが、1891年の大津事件で引責辞任し、交渉は中断しました。井上馨は外国人判事の任用案や極端な欧化政策への批判を受けて1887年に辞任、大隈重信は大審院への外国人判事任用が問題となり1889年に襲撃されて辞任しました。陸奥宗光は1894年に日英通商航海条約の調印に成功した外相です。","m":"井上（欧化）→大隈（遭難）→青木（大津事件）→陸奥（調印）"},{"id":179,"k":"plan","ref":"想定問題","f":"近代","t":"条約改正の歩み","y":1894,"q":"条約改正に関する出来事ア〜エを古い順に正しく並べたものはどれか。ア ノルマントン号事件　イ 日英通商航海条約の調印　ウ 岩倉使節団の出発　エ 関税自主権の完全回復","c":["ウ→ア→イ→エ","ア→ウ→イ→エ","ウ→イ→ア→エ","ウ→ア→エ→イ"],"e":"ウ（1871年）→ア（1886年）→イ（1894年）→エ（1911年）の順です。岩倉使節団は条約改正の予備交渉を目的の一つとして1871年に出発しましたが、交渉は成功しませんでした。1886年、イギリス船が沈没し日本人乗客が全員死亡したノルマントン号事件で、領事裁判権の撤廃を求める世論が高まります。1894年、日清戦争の直前に陸奥宗光外相が日英通商航海条約に調印して領事裁判権の撤廃を実現し、1911年に小村寿太郎外相が関税自主権の完全回復を達成しました。","m":"1894陸奥＝領事裁判権撤廃、1911小村＝関税自主権回復"},{"id":180,"k":"plan","ref":"想定問題","f":"近代","t":"白馬会と洋画","y":1896,"q":"フランスで学んで明るい色彩の画風をもたらし、1896年に白馬会を結成、同年に新設された東京美術学校西洋画科で指導にあたった、「湖畔」「読書」の作者は誰か。","c":["黒田清輝","浅井忠","高橋由一","青木繁"],"e":"黒田清輝はフランスでラファエル＝コランに学び、帰国後、外光派と呼ばれる明るい画風を伝えました。1896年に久米桂一郎らと白馬会を結成し、東京美術学校に新設された西洋画科の指導者となります。浅井忠は1889年に日本最初の洋画団体である明治美術会を結成した画家で「収穫」が代表作、高橋由一は明治初期に「鮭」を描いた洋画の先駆者、青木繁は白馬会展に出品し「海の幸」などを描いたロマン的な画風の画家です。","m":"明治美術会＝浅井忠（1889）、白馬会＝黒田清輝（1896）"},{"id":181,"k":"plan","ref":"想定問題","f":"近代","t":"労働運動の始まり","y":1897,"q":"1897年、アメリカで労働運動を学んで帰国した高野房太郎らが片山潜らとともに結成し、鉄工組合などの労働組合の結成を指導した団体は何か。","c":["労働組合期成会","友愛会","社会民主党","日本労働総同盟"],"e":"労働組合期成会は、日清戦争後に工場労働者のストライキが増えるなか、1897年に高野房太郎・片山潜らが結成した団体で、その指導のもとに鉄工組合や日本鉄道矯正会などが生まれました。これに対し政府は1900年に治安警察法を定め、労働運動を取り締まります。友愛会は1912年に鈴木文治が結成した労資協調的な団体で、1921年に日本労働総同盟へ発展しました。社会民主党は1901年結成の最初の社会主義政党で、結成直後に解散を命じられました。","m":"1897期成会（高野・片山）→1900治安警察法→1912友愛会"},{"id":182,"k":"plan","ref":"想定問題","f":"近代","t":"女子高等教育","y":1901,"q":"高等女学校令の公布から2年後の1901年、成瀬仁蔵が東京に設立し、のちに『青鞜』を創刊する平塚らいてうも学んだ、女子の高等教育機関は何か。","c":["日本女子大学校","女子英学塾","東京女子師範学校","明治女学校"],"e":"日本女子大学校は1901年に成瀬仁蔵が創立した私立の女子高等教育機関です。1899年の高等女学校令で女子の中等教育が整えられたのち、1900年前後には女子英学塾（津田梅子、1900年）や東京女医学校（吉岡弥生、1900年）など、女子の専門教育機関が相次いで生まれました。東京女子師範学校は1870年代に設けられた官立の女子教員養成機関、明治女学校は1885年創立のキリスト教系の女学校で、巌本善治が校長をつとめました。","m":"1899高等女学校令→1900女子英学塾→1901日本女子大学校"},{"id":183,"k":"plan","ref":"想定問題","f":"近代","t":"日露戦争と韓国併合","y":1905,"q":"日露戦争とその後の東アジアをめぐる国際関係について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["日本は1902年、ロシアの南下に対抗するためイギリスと日英同盟協約を結んだ。","ポーツマス条約により、日本は旅順・大連の租借権と長春以南の鉄道利権を得た。","1910年、日本は韓国を併合して朝鮮総督府を置き、寺内正毅が初代総督となった。","講和会議は、アメリカ大統領ウィルソンの仲介により、アメリカのポーツマスで開かれた。","すべて正しい"],"e":"誤りは講和会議の仲介者の文です。1905年のポーツマス講和会議を仲介したのはアメリカ大統領セオドア＝ローズヴェルトで、日本全権は小村寿太郎、ロシア全権はウィッテでした。ウィルソンは第一次世界大戦期の大統領です。条約で日本は韓国に対する指導・監督権、旅順・大連の租借権、長春以南の鉄道とその付属利権、北緯50度以南の樺太などを得ましたが、賠償金は得られず、日比谷焼打ち事件が起こりました。日英同盟は1902年、韓国併合は1910年です。","m":"ポーツマス仲介＝セオドア＝ローズヴェルト、全権は小村とウィッテ","a":3,"last":true},{"id":184,"k":"plan","ref":"想定問題","f":"近代","t":"韓国の保護国化","y":1905,"q":"日露戦争の講和後の1905年11月、日本が韓国の外交権を奪って保護国とし、漢城に統監府を置くことを定めた取り決めは何か。初代統監には伊藤博文が就いた。","c":["第2次日韓協約","日韓議定書","第1次日韓協約","第3次日韓協約"],"e":"第2次日韓協約（1905年）は、アメリカとの桂・タフト協定、イギリスとの日英同盟改定、ポーツマス条約で列強に韓国への指導権を認めさせたうえで結ばれ、韓国の外交権を奪いました。日韓議定書（1904年2月）は開戦直後に軍事上必要な土地の収用などを認めさせたもの、第1次日韓協約（1904年8月）は日本政府推薦の財政・外交顧問を置かせたもの、第3次日韓協約（1907年）はハーグ密使事件を機に内政権を奪ったもので、ついで韓国軍が解散されました。","m":"第1次＝顧問、第2次＝外交権・統監府、第3次＝内政権"},{"id":185,"k":"plan","ref":"想定問題","f":"近代","t":"民本主義と雑誌","y":1916,"q":"1916年、吉野作造が「憲政の本義を説いて其有終の美を済すの途を論ず」を発表して民本主義を唱え、大正デモクラシーの論壇を主導した総合雑誌は何か。","c":["『中央公論』","『改造』","『太陽』","『キング』"],"e":"吉野作造は1916年、『中央公論』に論文を発表し、主権の所在を問わず、政治の目的は民衆の福利にあり、政策決定は民衆の意向によるべきだとする民本主義を唱えて、政党内閣制や普通選挙の実現を説きました。『改造』は1919年創刊の総合雑誌で、社会主義的な論文も多く載せました。『太陽』は1895年に博文館が創刊した明治期の代表的な総合雑誌、『キング』は1925年に講談社が創刊し、発行部数が100万部をこえた大衆娯楽雑誌です。","m":"吉野作造の民本主義は1916年『中央公論』。『改造』は1919年創刊"},{"id":186,"k":"plan","ref":"想定問題","f":"近代","t":"大正期の政党政治","y":1918,"q":"第一次護憲運動から普通選挙法の成立までの大正時代の政治について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["第3次桂太郎内閣は、「閥族打破・憲政擁護」を掲げる運動が高まるなかで退陣した。","米騒動で寺内正毅内閣が倒れると、立憲政友会総裁の原敬が内閣を組織した。","原敬内閣は、選挙権の納税資格を直接国税3円以上に引き下げ、小選挙区制を導入した。","加藤高明内閣は、普通選挙法を成立させた年に治安維持法も成立させた。","すべて正しい"],"e":"4文ともすべて正しい内容です。1912年末に成立した第3次桂内閣は、立憲政友会の尾崎行雄や立憲国民党の犬養毅らを中心とする第一次護憲運動により、1913年2月に50日余りで退陣しました（大正政変）。1918年、米騒動の責任をとって寺内内閣が総辞職すると、原敬が本格的な政党内閣を組織し、1919年に選挙法を改正しましたが、普通選挙には慎重でした。1925年、護憲三派の加藤高明内閣は満25歳以上の男性に選挙権を認める普通選挙法と、治安維持法を成立させました。","m":"1913大正政変→1918原内閣→1919納税3円→1925普選と治安維持法","a":4,"last":true},{"id":187,"k":"plan","ref":"想定問題","f":"近代","t":"大戦期の対外関係","y":1919,"q":"第一次世界大戦期以降の日本の対外関係に関する出来事ア〜エを古い順に正しく並べたものはどれか。ア 二十一カ条の要求　イ ワシントン会議の開催　ウ シベリア出兵の開始　エ 三・一独立運動","c":["ア→ウ→エ→イ","ア→エ→ウ→イ","ウ→ア→エ→イ","ア→ウ→イ→エ"],"e":"ア（1915年）→ウ（1918年）→エ（1919年）→イ（1921年）の順です。1914年に参戦した日本は、翌1915年、第2次大隈重信内閣が袁世凱政権に二十一カ条の要求をつきつけ、山東省のドイツ権益の継承などを認めさせました。1917年にロシア革命が起こると、1918年、寺内正毅内閣はアメリカなどとともにシベリア出兵を始めます。1919年、パリ講和会議が開かれるなか、朝鮮で三・一独立運動が起こりました。1921年からはワシントン会議が開かれ、東アジア・太平洋の新しい国際秩序がつくられました。","m":"二十一カ条1915→シベリア出兵1918→三・一運動1919→ワシントン会議1921"},{"id":188,"k":"plan","ref":"想定問題","f":"近代","t":"女性運動の展開","y":1920,"q":"1920年に平塚らいてう・市川房枝らが設立し、女性の政治運動への参加を禁じた治安警察法第5条の改正を求める運動を進め、1922年にその一部改正を実現した団体は何か。","c":["新婦人協会","青鞜社","赤瀾会","婦人参政権獲得期成同盟会"],"e":"新婦人協会は1920年に設立され、女性の参政権や地位向上を求めて議会への請願運動をおこないました。その結果、1922年に治安警察法第5条が改正され、女性も政治演説会に参加できるようになります。青鞜社は1911年に平塚らが結成した文学団体で、雑誌『青鞜』を発行しました。赤瀾会は1921年に山川菊栄・伊藤野枝らが結成した社会主義の立場の女性団体、婦人参政権獲得期成同盟会は1924年に市川らが結成した団体で、いずれも時期や性格が異なります。","m":"青鞜社1911→新婦人協会1920→赤瀾会1921→期成同盟会1924"},{"id":189,"k":"plan","ref":"想定問題","f":"近代","t":"ワシントン体制","y":1922,"q":"1922年、ワシントン会議で結ばれ、中国の領土と主権の尊重、中国における門戸開放・機会均等を約束した条約は何か。これにより石井・ランシング協定は廃棄された。","c":["九カ国条約","四カ国条約","ワシントン海軍軍縮条約","不戦条約"],"e":"九カ国条約は、アメリカ・イギリス・日本・フランス・イタリアにベルギー・オランダ・ポルトガル・中国を加えた9カ国が結び、中国の主権尊重と門戸開放・機会均等を定めました。あわせて日本は山東省の旧ドイツ権益を中国に返還しています。四カ国条約（1921年）は太平洋の現状維持を定めて日英同盟を終了させたもの、海軍軍縮条約（1922年）は主力艦の保有比率を定めたもの、不戦条約は1928年にパリで結ばれた戦争放棄の条約です。","m":"四カ国＝太平洋・日英同盟終了、九カ国＝中国、五カ国＝主力艦"},{"id":190,"k":"plan","ref":"想定問題","f":"近代","t":"金融恐慌","y":1927,"q":"第一次世界大戦中に急成長した神戸の総合商社で、戦後に経営が悪化し、1927年の金融恐慌のなかで台湾銀行からの巨額の融資が焦げついたまま倒産したのはどこか。","c":["鈴木商店","三井物産","日本産業","東京渡辺銀行"],"e":"鈴木商店は大戦景気で三井・三菱にせまる勢いをみせましたが、戦後恐慌で経営が悪化しました。1927年、震災手形の処理をめぐる議会審議中に片岡直温蔵相の失言から取付け騒ぎが起こり、鈴木商店への不良債権を抱えた台湾銀行が危機に陥ります。若槻礼次郎内閣は緊急勅令による救済を図りましたが枢密院に否決され総辞職しました。三井物産は三井財閥の商社、日本産業は鮎川義介の新興財閥、東京渡辺銀行は片岡蔵相の失言で名指しされた銀行です。","m":"片岡失言→取付け→鈴木商店・台湾銀行の危機→若槻内閣総辞職"},{"id":191,"k":"plan","ref":"想定問題","f":"近代","t":"近代の学問と文学","y":1929,"q":"明治から昭和戦前期にかけての学問・文学の展開について述べた次の文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["北里柴三郎は破傷風の血清療法を確立し、志賀潔は赤痢菌を発見した。","小林多喜二は、雑誌『白樺』の同人として人道主義の立場から『蟹工船』を書いた。","与謝野晶子は、雑誌『明星』で活躍し、歌集『みだれ髪』を発表した。","西田幾多郎は、『善の研究』を著して独自の哲学を打ち立てた。","すべて正しい"],"e":"誤りは小林多喜二の文です。小林多喜二は1920年代後半に盛んになったプロレタリア文学の作家で、『蟹工船』は1929年に雑誌『戦旗』に発表されました。『白樺』は1910年創刊で、武者小路実篤・志賀直哉・有島武郎らが人道主義・理想主義の立場から作品を発表した雑誌です。北里柴三郎はドイツ留学中に破傷風の血清療法を確立し、志賀潔は1897年に赤痢菌を発見しました。『みだれ髪』は1901年、『善の研究』は1911年の刊行です。","m":"白樺派＝武者小路・志賀・有島。小林多喜二＝『戦旗』『蟹工船』","a":1,"last":true},{"id":192,"k":"plan","ref":"想定問題","f":"近代","t":"恐慌と経済政策","y":1930,"q":"1920年代後半から1930年代前半の恐慌と経済政策について述べた次の文のうち、正しいものはどれか。あてはまるものがない場合は最後の選択肢を選べ。","c":["金融恐慌では、若槻礼次郎内閣がモラトリアム（支払猶予令）を出して混乱をしずめた。","昭和恐慌では、繭の価格が暴落し、東北地方を中心に農村の困窮が深刻になった。","浜口雄幸内閣は、円安となる新平価で金輸出を解禁し、輸出を大きく伸ばした。","高橋是清蔵相は、緊縮財政を徹底して軍事費を大きく削り、恐慌からの脱出を図った。","あてはまるものがない"],"e":"正しいのは昭和恐慌の文です。1930年の金解禁と世界恐慌が重なって昭和恐慌となり、アメリカ向け生糸輸出の激減で繭価が暴落、1931年には東北・北海道の大凶作も加わって、欠食児童や女子の身売りが社会問題になりました。モラトリアムを出したのは若槻内閣の次の田中義一内閣（高橋是清蔵相）です。浜口内閣の金解禁は円高となる旧平価でおこなわれ、輸出は減少しました。高橋蔵相は赤字国債の発行による積極財政で軍事費や農村救済費を増やし、景気を回復させました。","m":"モラトリアム＝田中内閣、金解禁＝旧平価で円高、高橋＝積極財政","a":1,"last":true},{"id":193,"k":"plan","ref":"想定問題","f":"近代","t":"満洲事変から開戦へ","y":1936,"q":"昭和戦前期の政治と戦争に関する出来事ア〜エを古い順に正しく並べたものはどれか。ア 二・二六事件　イ 柳条湖事件　ウ ミッドウェー海戦　エ 日独伊三国同盟の締結","c":["イ→ア→エ→ウ","ア→イ→エ→ウ","イ→エ→ア→ウ","イ→ア→ウ→エ"],"e":"イ（1931年）→ア（1936年）→エ（1940年）→ウ（1942年）の順です。1931年9月、関東軍が奉天郊外の柳条湖で南満洲鉄道の線路を爆破し、満洲事変が始まりました。翌1932年には五・一五事件で政党内閣が終わり、1936年の二・二六事件後は軍部の政治的発言力がいっそう強まります。1937年に日中戦争が始まり、1940年9月、第2次近衛文麿内閣は北部仏印進駐とほぼ同時に日独伊三国同盟を結びました。1941年12月に太平洋戦争が始まり、1942年6月のミッドウェー海戦の敗北で戦局は転換しました。","m":"柳条湖1931→二・二六1936→三国同盟1940→ミッドウェー1942"},{"id":194,"k":"plan","ref":"想定問題","f":"近代","t":"第1次近衛声明","y":1938,"q":"1938年1月、第1次近衛文麿内閣は「帝国政府ハ爾後（じご）国民政府ヲ対手（あいて）トセズ」とする声明を出した。この声明の意味と結果を説明した文として最も適切なものはどれか。","c":["蔣介石の国民政府との和平交渉を日本がみずから打ち切るもので、戦争終結の手がかりを失わせた。","国民政府を中国の正統な政府と認め、対等な立場で講和を結ぶ方針を内外に示した。","中国との戦争を終わらせ、アメリカ・イギリスとの開戦に備えて南方に兵力を移す方針を示した。","満洲国の承認を取り消して国際連盟に復帰し、列国との協調を回復する方針を示した。"],"e":"1937年7月の盧溝橋事件から始まった日中戦争で、日本軍は同年12月に国民政府の首都南京を占領しましたが、国民政府は漢口、ついで重慶に移って抗戦を続けました。ドイツを仲介とする和平交渉もまとまらず、近衛内閣は1938年1月にこの声明を出して交渉を打ち切り、みずから和平の道を閉ざしました。その後、同年11月の東亜新秩序声明で方針を修正し、汪兆銘を重慶から脱出させて1940年に南京に新政府をつくらせましたが、戦争は終わりませんでした。ほかの3文のような事実はありません。","m":"1938年1月「対手とせず」→11月東亜新秩序→1940汪兆銘政権"},{"id":195,"k":"plan","ref":"想定問題","f":"近代","t":"戦時統制経済","y":1938,"q":"日中戦争の長期化を受けて1938年に第1次近衛文麿内閣が制定し、戦時に必要な物資や労働力を、議会の承認なしに勅令で動員できる権限を政府に与えた法律は何か。","c":["国家総動員法","重要産業統制法","臨時資金調整法","輸出入品等臨時措置法"],"e":"国家総動員法は1938年4月に公布され、政府は議会の審議を経ずに勅令で国民生活全般を統制できるようになりました。これにもとづき1939年には国民徴用令や価格等統制令が出されます。重要産業統制法は1931年、昭和恐慌下でカルテルの結成を助成した法律です。臨時資金調整法と輸出入品等臨時措置法はどちらも日中戦争開始直後の1937年に定められ、前者は軍需産業への資金の優先的な配分、後者は貿易に関係する物資の統制を目的としたものです。","m":"1937資金・貿易の統制→1938国家総動員法→1939国民徴用令"},{"id":196,"k":"plan","ref":"想定問題","f":"現代","t":"五大改革指令","y":1945,"q":"1945年10月以降、GHQの指令のもとで進められた占領期の民主化政策について述べた文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["マッカーサーは1945年10月、東久邇宮稔彦首相に五大改革を指示した。","持株会社整理委員会が設けられ、財閥の持株を譲り受けて一般に売却した。","1945年の労働組合法は、労働者の団結権・団体交渉権・争議権を保障した。","1947年の教育基本法は、教育の機会均等や男女共学、義務教育9年制を定めた。","すべて正しい"],"e":"五大改革指令を受けたのは幣原喜重郎首相なので、東久邇宮稔彦とした文が誤りです。東久邇宮内閣は1945年10月初めの人権指令を実行できずに総辞職し、後継の幣原にマッカーサーが女性参政権の付与・労働組合の結成奨励・教育の自由主義化・秘密警察などの廃止・経済機構の民主化を口頭で指示しました。持株会社整理委員会（1946年発足）、労働組合法（1945年12月）、教育基本法（1947年）の文はいずれも正しい内容です。","m":"人権指令→東久邇宮内閣総辞職→幣原内閣に五大改革指令（1945年10月）","last":true},{"id":197,"k":"plan","ref":"想定問題","f":"現代","t":"農地改革","y":1946,"q":"1946年、GHQの勧告を受けた第二次農地改革を実施するために制定され、不在地主の全貸付地と、在村地主の貸付地のうち一定面積を超える分を国が強制的に買い上げ、小作人に安く売り渡す根拠となった法律は何か。","c":["自作農創設特別措置法","農業基本法","食糧管理法","農業協同組合法"],"e":"正解は自作農創設特別措置法です。1945年末の農地調整法改正による第一次農地改革は、在村地主に5町歩の貸付地を認めるなど不徹底だったため、GHQの勧告で1946年に本法が制定されました。在村地主の貸付地は都府県平均1町歩（北海道は4町歩）に制限され、小作地は全農地の約1割に減って寄生地主制は解体しました。農業基本法は1961年の農業近代化の法律、食糧管理法は1942年の戦時の米の統制法、農業協同組合法は1947年の農協設立の根拠法です。","m":"第一次＝5町歩で不徹底→第二次＝1町歩・国が強制買収"},{"id":198,"k":"plan","ref":"想定問題","f":"現代","t":"女性の地位向上","y":1947,"q":"敗戦後の日本では、女性の法的・社会的地位が大きく変化した。戦後の女性をめぐる動きについて述べた文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["1947年の民法改正では、戸主が家族を統率する戸主制度が維持された。","1945年12月の選挙法改正で、満20歳以上の男女に選挙権が与えられた。","1946年4月の戦後初の総選挙では、39名の女性議員が誕生した。","1999年、男女が対等に社会に参画することをめざす男女共同参画社会基本法が制定された。","すべて正しい"],"e":"1947年に改正された民法（新民法）は、戸主制度と家督相続を廃止し、男女同権・夫婦中心の家族制度を定めたので、「戸主制度が維持された」とした文が誤りです。日本国憲法が個人の尊厳と両性の本質的平等を定めたことを受けた改正でした。女性参政権は1945年12月の衆議院議員選挙法改正で実現し、翌年4月の総選挙で39名の女性議員が生まれました。男女共同参画社会基本法の制定は1999年で、これらの文は正しい内容です。","m":"参政権（1945）→女性議員39名（1946）→新民法で戸主制度廃止（1947）","last":true},{"id":199,"k":"plan","ref":"想定問題","f":"現代","t":"ドッジ＝ライン","y":1949,"q":"1949年、GHQの経済顧問として来日し、赤字を許さない超均衡予算の編成や1ドル＝360円の単一為替レートの設定など、経済安定九原則を実行に移す一連の施策を指示したデトロイト銀行頭取は誰か。","c":["ドッジ","シャウプ","ロイヤル","ダレス"],"e":"正解はドッジです。1948年12月、GHQは第2次吉田茂内閣に経済安定九原則を指令し、翌1949年に来日したドッジが超均衡予算と単一為替レートを実施させました（ドッジ＝ライン）。インフレは収束しましたが、不況が深刻化し、失業者が増えました。シャウプは同年に来日し直接税中心の税制改革を勧告した財政学者、ロイヤルは1948年に対日政策の転換を演説で示した陸軍長官、ダレスは講和条約の交渉にあたったアメリカの外交顧問です。","m":"ドッジ＝予算と為替（360円）、シャウプ＝税制。どちらも1949年"},{"id":200,"k":"plan","ref":"想定問題","f":"現代","t":"占領政策の転換","y":1950,"q":"占領政策の転換から独立後の防衛体制の整備にかけての出来事ア〜エを、古い順に正しく並べたものはどれか。ア＝自衛隊の発足　イ＝経済安定九原則の指令　ウ＝警察予備隊の創設　エ＝二・一ゼネストの中止指令","c":["エ→イ→ウ→ア","イ→エ→ウ→ア","エ→ウ→イ→ア","エ→イ→ア→ウ"],"e":"古い順に、エ二・一ゼネストの中止指令（1947年）→イ経済安定九原則の指令（1948年）→ウ警察予備隊の創設（1950年）→ア自衛隊の発足（1954年）です。GHQは官公庁労働者を中心とするゼネストを前日に中止させ、冷戦の進行とともに日本の経済自立を急いで九原則を指令しました。1950年に朝鮮戦争が始まると警察予備隊が創設され、独立後の1952年に保安隊へ改組、1954年のMSA協定を受けて自衛隊が発足しました。","m":"警察予備隊（1950）→保安隊（1952）→自衛隊（1954）"},{"id":201,"k":"plan","ref":"想定問題","f":"現代","t":"サンフランシスコ平和条約","y":1951,"q":"1951年9月に調印され、翌年4月の発効によって日本が独立を回復したサンフランシスコ平和条約の内容や調印の状況を説明した文として、正しいものはどれか。","c":["日本は朝鮮の独立を認め、台湾・南樺太・千島列島を放棄し、沖縄・小笠原はアメリカの施政権下におかれた。","ソ連や中華人民共和国を含むすべての交戦国が調印し、国内で求められていた全面講和が実現した。","日本はすべての交戦国に対して多額の賠償金を現金で支払うことを義務づけられた。","独立後は外国軍隊の日本駐留を一切認めないと定められ、アメリカ軍はすべて撤退した。"],"e":"正解は領土に関する文です。条約で日本は朝鮮の独立を承認し、台湾・澎湖諸島、南樺太・千島列島を放棄し、沖縄・小笠原諸島はアメリカの施政権下におかれました。ソ連は会議に出席したものの調印せず、中国は会議に招かれなかったため、西側諸国中心の単独講和となりました。賠償は多くの国が請求権を放棄し、東南アジア4カ国との間で生産物や役務による賠償が行われました。同じ日に日米安全保障条約が結ばれ、独立後もアメリカ軍が駐留しました。","m":"講和＝単独（片面）講和。同日に安保条約で米軍駐留が継続"},{"id":202,"k":"plan","ref":"想定問題","f":"現代","t":"日ソ共同宣言","y":1956,"q":"1954年に日本民主党の総裁として組閣し、憲法改正・再軍備と「自主外交」を掲げ、1956年10月にモスクワを訪れてソ連との国交を回復する共同宣言に調印した首相は誰か。","c":["鳩山一郎","岸信介","石橋湛山","池田勇人"],"e":"正解は鳩山一郎です。吉田茂内閣の退陣後に組閣し、1955年の保守合同で結成された自由民主党の初代総裁となりました。1956年10月の日ソ共同宣言で戦争状態の終結と国交回復が実現し、ソ連が支持に回ったことで同年12月に日本の国際連合加盟が実現しました。領土問題は未解決のまま残りました。石橋湛山は鳩山の後継首相で病気のため短期間で辞職、岸信介は1960年に安保条約を改定、池田勇人は所得倍増政策を進めた首相です。","m":"鳩山一郎＝自主外交→日ソ共同宣言（1956年10月）→国連加盟（同年12月）"},{"id":203,"k":"plan","ref":"想定問題","f":"現代","t":"安保改定","y":1960,"q":"1950年代後半から1960年にかけての日本の政治と外交について述べた文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["新安保条約は、アメリカの日本防衛義務を削除し、条約の期限も定めなかった。","1955年、左右に分裂していた日本社会党が統一し、続いて自由民主党が結成された。","1956年、日ソ共同宣言の調印を受けて、日本の国際連合加盟が実現した。","新安保条約の発効後、岸信介内閣は総辞職し、池田勇人内閣が成立した。","すべて正しい"],"e":"1960年に岸信介内閣が調印した新安保条約（日米相互協力及び安全保障条約）は、アメリカの日本防衛義務を明文化し、条約の期限を10年と定めたので、「防衛義務を削除し期限も定めなかった」とした文が誤りです。在日米軍の行動に関する事前協議制も定められました。1955年の社会党統一と保守合同による自由民主党の結成、1956年の日ソ共同宣言と国連加盟、安保闘争後の岸内閣総辞職と池田勇人内閣の成立は、いずれも正しい内容です。","m":"新安保（1960）＝米の防衛義務を明文化・期限10年・事前協議制","last":true},{"id":204,"k":"plan","ref":"想定問題","f":"現代","t":"高度成長期の社会","y":1964,"q":"1950年代半ばから1970年代初めにかけての高度経済成長期の社会と文化について述べた文のうち、正しくないものはどれか。すべて正しい場合は最後の選択肢を選べ。","c":["1953年にテレビ放送が始まり、のちに白黒テレビは「三種の神器」の一つとされた。","1964年、東京オリンピックの開催にあわせて東海道新幹線が開通した。","1968年、日本の国民総生産（GNP）は資本主義国でアメリカに次ぐ第2位となった。","1970年、「人類の進歩と調和」をテーマに大阪で日本万国博覧会が開かれた。","すべて正しい"],"e":"四つの文はすべて正しい内容です。テレビ放送は1953年に始まり、白黒テレビ・電気洗濯機・電気冷蔵庫が「三種の神器」と呼ばれて普及しました。1964年には東京オリンピックの直前に東海道新幹線が開通し、1968年には国民総生産が西ドイツを抜いて資本主義国で第2位になりました。1970年の日本万国博覧会は「人類の進歩と調和」をテーマに大阪で開かれました。年代や順位、開催地を入れ替えた誤文に注意が必要です。","m":"テレビ1953→新幹線・五輪1964→GNP2位1968→万博1970","a":4,"last":true},{"id":205,"k":"plan","ref":"想定問題","f":"現代","t":"日韓基本条約","y":1965,"q":"1965年、佐藤栄作内閣が朴正熙（パクチョンヒ）政権との間で結び、1910年の併合以前の諸条約の失効を確認するとともに、相手国政府を「朝鮮にある唯一の合法的な政府」と認めて国交を樹立した条約は何か。","c":["日韓基本条約","日華平和条約","日中平和友好条約","日印平和条約"],"e":"正解は日韓基本条約です。日韓会談は1952年に始まりましたが、植民地支配の評価や請求権・漁業問題で難航し、1965年にようやく調印されました。同時に漁業、請求権・経済協力、在日韓国人の法的地位などの協定も結ばれました。日華平和条約は1952年に台湾の中華民国政府と結んだ条約、日中平和友好条約は1978年に福田赳夫内閣が中華人民共和国と結んだ条約、日印平和条約は1952年にインドと結んだ条約です。","m":"1965年・佐藤栄作と朴正熙＝日韓基本条約。「唯一の合法的な政府」"},{"id":206,"k":"plan","ref":"想定問題","f":"現代","t":"公害対策","y":1967,"q":"高度経済成長のかげで公害病の被害が広がり、住民運動や訴訟があいつぐなか、1967年に制定され、大気汚染・水質汚濁などを公害と定めて事業者・国・地方公共団体の責任を明らかにした法律は何か。","c":["公害対策基本法","環境基本法","大気汚染防止法","公害健康被害補償法"],"e":"正解は公害対策基本法です。水俣病・新潟水俣病・イタイイタイ病・四日市ぜんそくの被害が社会問題となり、1967年に制定されました。1970年の改正で経済発展との調和を求める条項が削られ、1971年には環境庁が発足しました。環境基本法は1993年に本法にかわって制定され地球環境問題にも対応した法律、大気汚染防止法は1968年の個別の規制法、公害健康被害補償法は1973年に被害者の救済のために定められた法律です。","m":"公害対策基本法（1967）→環境庁（1971）→環境基本法（1993）"},{"id":207,"k":"plan","ref":"想定問題","f":"現代","t":"ノーベル文学賞","y":1968,"q":"『伊豆の踊子』『雪国』などの作品で日本的な美の世界を描き、高度経済成長期の1968年に、日本人として初めてノーベル文学賞を受賞した作家は誰か。","c":["川端康成","大江健三郎","三島由紀夫","谷崎潤一郎"],"e":"正解は川端康成です。大正末期に横光利一らと新感覚派の作家として出発し、1968年にノーベル文学賞を受賞しました。日本人のノーベル賞受賞は、物理学賞の湯川秀樹（1949年）・朝永振一郎（1965年）に続く3人目でした。大江健三郎は『飼育』などの作者で、1994年に日本人で2人目の文学賞を受けました。三島由紀夫は『金閣寺』などの作者で1970年に自決、谷崎潤一郎は『細雪』の作者で、どちらも受賞はしていません。","m":"文学賞は川端康成（1968）→大江健三郎（1994）の順"},{"id":208,"k":"plan","ref":"想定問題","f":"現代","t":"領土返還と外交","y":1972,"q":"戦後日本の領土の返還と近隣諸国との外交に関する出来事ア〜エを、古い順に正しく並べたものはどれか。ア＝日中平和友好条約の調印　イ＝日韓基本条約の調印　ウ＝沖縄の日本復帰　エ＝奄美群島の返還","c":["エ→イ→ウ→ア","イ→エ→ウ→ア","エ→ウ→イ→ア","エ→イ→ア→ウ"],"e":"古い順に、エ奄美群島の返還（1953年）→イ日韓基本条約の調印（1965年）→ウ沖縄の日本復帰（1972年）→ア日中平和友好条約の調印（1978年）です。平和条約でアメリカの施政権下におかれた地域のうち、奄美群島は1953年、小笠原諸島は1968年に返還され、沖縄は佐藤栄作内閣が結んだ沖縄返還協定により1972年5月に復帰しました。同年9月の日中共同声明で国交が正常化し、6年後の福田赳夫内閣のとき平和友好条約が結ばれました。","m":"返還は奄美1953→小笠原1968→沖縄1972の順"},{"id":209,"k":"plan","ref":"想定問題","f":"現代","t":"日中国交正常化","y":1972,"q":"1972年、「日本列島改造論」を掲げて組閣し、同年9月にみずから北京を訪れて周恩来首相と共同声明を発表し、中華人民共和国との国交正常化を実現した首相は誰か。","c":["田中角栄","佐藤栄作","福田赳夫","三木武夫"],"e":"正解は田中角栄です。1972年2月のニクソン訪中で米中が接近したのを受け、同年7月に組閣した田中は9月に訪中し、日中共同声明を発表しました。日本は中華人民共和国を中国の唯一の合法政府と認め、中国は賠償請求を放棄し、台湾の国民政府とは断交しました。佐藤栄作は前任の首相で沖縄返還を実現、福田赳夫は1978年に日中平和友好条約を締結、三木武夫は田中の後継首相でロッキード事件の解明にあたりました。","m":"田中角栄＝日中共同声明（1972）、福田赳夫＝日中平和友好条約（1978）"},{"id":210,"k":"plan","ref":"想定問題","f":"現代","t":"行財政改革","y":1985,"q":"1982年に成立し、「戦後政治の総決算」を掲げた中曽根康弘内閣が、財政赤字の拡大を背景に進めた行財政改革の内容を説明した文として、正しいものはどれか。","c":["第2次臨時行政調査会の答申を受けて、電電公社・専売公社・国鉄の民営化を実現した。","列島改造を掲げて公共投資を大幅に増やし、新幹線や高速道路の建設計画を打ち出した。","郵政事業の民営化を争点に衆議院を解散し、総選挙に大勝して郵政民営化法を成立させた。","税率3％の消費税を導入し、所得税中心の税制を改める大型間接税を初めて実施した。"],"e":"正解は三公社の民営化の文です。石油危機後に赤字国債が累積したため、1981年に発足した第2次臨時行政調査会が「増税なき財政再建」を掲げ、中曽根内閣は1985年に電電公社（NTT）と専売公社（JT）、1987年に国鉄（JR）を民営化しました。列島改造は1972年成立の田中角栄内閣、郵政民営化は2005年の小泉純一郎内閣、消費税の導入は1989年の竹下登内閣の政策です。中曽根内閣も大型間接税を検討しましたが実現しませんでした。","m":"中曽根＝三公社民営化（NTT・JT・JR）、竹下＝消費税、小泉＝郵政"},{"id":211,"k":"plan","ref":"想定問題","f":"現代","t":"プラザ合意","y":1985,"q":"1985年、ニューヨークで開かれた5カ国蔵相・中央銀行総裁会議（G5）で、アメリカの貿易赤字を背景にドル高を是正するための協調介入が決められた。急速な円高の出発点となったこの取り決めを何というか。","c":["プラザ合意","スミソニアン協定","ルーブル合意","日米構造協議"],"e":"正解はプラザ合意です。会場となったホテルの名にちなみます。1ドル＝240円前後だった円相場は1987年末には120円台まで上昇し、輸出産業が打撃を受けて円高不況となりました。その後の低金利政策のもとで地価・株価が高騰し、バブル経済につながりました。スミソニアン協定は1971年に1ドル＝308円とした取り決め、ルーブル合意は1987年にドル安の行き過ぎを抑えようとした合意、日米構造協議は1989年に始まった貿易摩擦をめぐる交渉です。","m":"プラザ合意（1985）→円高不況→低金利→バブル経済"},{"id":212,"k":"plan","ref":"想定問題","f":"現代","t":"男女雇用機会均等法","y":1985,"q":"1985年、国際連合の女子差別撤廃条約を批准するために国内法の整備が進められるなかで制定され、募集・採用・配置・昇進などについて女性を差別しないよう事業主に求めた法律は何か。","c":["男女雇用機会均等法","男女共同参画社会基本法","育児休業法","労働基準法"],"e":"正解は男女雇用機会均等法です。1979年に国連総会で採択された女子差別撤廃条約を日本は1985年に批准し、それにあわせて同年にこの法律が制定されました（施行は翌年）。当初、募集・採用・昇進などの均等な扱いは事業主の努力義務でしたが、1997年の改正で差別の禁止に強められました。男女共同参画社会基本法は1999年、育児休業法は1991年の制定で、労働基準法は1947年に男女同一賃金の原則などを定めた法律です。","m":"女子差別撤廃条約の批准（1985）と男女雇用機会均等法はセット"},{"id":213,"k":"plan","ref":"想定問題","f":"現代","t":"石油危機以降の経済","y":1987,"q":"1970年代から1990年代にかけての経済と社会に関する出来事ア〜エを、古い順に正しく並べたものはどれか。ア＝第1次石油危機　イ＝消費税の導入　ウ＝阪神・淡路大震災　エ＝国鉄の分割民営化","c":["ア→エ→イ→ウ","ア→イ→エ→ウ","エ→ア→イ→ウ","ア→エ→ウ→イ"],"e":"古い順に、ア第1次石油危機（1973年）→エ国鉄の分割民営化（1987年）→イ消費税の導入（1989年）→ウ阪神・淡路大震災（1995年）です。第4次中東戦争をきっかけとする石油危機で高度経済成長は終わり、翌1974年には戦後初のマイナス成長となりました。国鉄の分割民営化は中曽根康弘内閣、消費税の導入はその後を継いだ竹下登内閣のときです。阪神・淡路大震災は村山富市内閣のときで、バブル経済崩壊後の不況のなかで起こりました。","m":"中曽根＝国鉄民営化（1987）→竹下＝消費税（1989）"},{"id":214,"k":"plan","ref":"想定問題","f":"現代","t":"PKO協力法","y":1992,"q":"湾岸戦争を機に国際貢献のあり方が議論となり、1992年に宮沢喜一内閣のもとで国連平和維持活動（PKO）協力法が成立した。この法律にもとづいて同年、自衛隊が最初に派遣された国はどこか。","c":["カンボジア","イラク","東ティモール","モザンビーク"],"e":"正解はカンボジアです。1991年の湾岸戦争で日本は多国籍軍に巨額の資金を援助しましたが、人的貢献を求める声が国内外で高まり、戦後にペルシア湾へ掃海艇を派遣しました。1992年にPKO協力法が成立すると、同年、内戦後のカンボジアに自衛隊が派遣されました。モザンビークは1993年、東ティモールは2002年のPKO派遣先です。イラクへの派遣は2003年のイラク復興支援特別措置法によるもので、PKO協力法にもとづくものではありません。","m":"湾岸戦争（1991）→PKO協力法（1992・宮沢内閣）→カンボジア派遣"},{"id":215,"k":"plan","ref":"想定問題","f":"現代","t":"55年体制の崩壊","y":1993,"q":"冷戦終結後の1990年前後から2000年代初めにかけての日本の政治について述べた文のうち、正しいものはどれか。あてはまるものがない場合は最後の選択肢を選べ。","c":["1993年、非自民8党派の連立による細川護熙内閣が成立し、55年体制が崩壊した。","消費税は、1989年に中曽根康弘内閣のもとで税率5％で導入された。","1994年、村山富市内閣が衆議院に小選挙区比例代表並立制を導入した。","2003年、橋本龍太郎内閣がイラク復興支援特別措置法を成立させた。","あてはまるものがない"],"e":"正しいのは細川護熙内閣の文です。1993年、自由民主党が分裂して総選挙で過半数を割り、非自民8党派の連立内閣が成立して55年体制は崩壊しました。消費税は1989年に竹下登内閣が税率3％で導入したもので、5％への引き上げは1997年の橋本龍太郎内閣のときです。小選挙区比例代表並立制の導入は1994年の細川内閣の政治改革によるものです。イラク復興支援特別措置法は2003年に小泉純一郎内閣が成立させました。","m":"竹下＝消費税3％、細川＝選挙制度改革、小泉＝イラク特措法","last":true}];
var FIELDS=["原始・古代","中世","近世","近代","現代"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="rikkyo-jh-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.k==="past"?"過去問ベース：立教大学 "+esc(q.ref)+"（解答例の用語や論述から作り直した問題です）":"想定問題（立教大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+"abcde".charAt(j)+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+KIND[q.k]+'</p><h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。立教の日本史は、出来事を年代順に並べる設問が多くの日程で出ます。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+KIND[q.k]+"</small></span></summary>"+
        '<div class="it-body"><p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

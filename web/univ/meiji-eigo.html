:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;

  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.passage{font-family:var(--f-exam);font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:50vh;overflow-y:auto}
.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){ .q{font-size:17px} .score b{font-size:44px} .fi{grid-template-columns:minmax(0,1fr)} .fi .btn{grid-column:1;grid-row:auto;justify-self:start} }
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

oofs cool the street level more effectively than the roof itself.","Researchers recommend that every city install green roofs regardless of its climate.","Tax breaks have made green roofs especially common in regions with water shortages."],"e":"第3段落で、街路樹は人を直接日陰にし、冷却1度あたりの費用が安い傾向にある（cheaper for each degree of cooling achieved）と述べられているので、これが正解です。緑化屋根の冷却効果は屋上で最も強く、歩行者の高さでは弱まるとあるので2つ目は逆です。研究者は緑化屋根を万能薬と見なすなと警告し、気候と予算に合わせた組み合わせを勧めているので3つ目も誤り。水不足地域ではむしろ散水が問題になると書かれており4つ目も不一致です。","m":"by contrast の後に筆者の比較の結論がある"},{"id":4,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：incentive","p":"When a smartphone application costs nothing to download, it is tempting to conclude that it is a gift. Economists, however, like to remind us that there is rarely such a thing as a free lunch. Companies that offer services at no charge must earn money somehow, and in many cases they do so by selling advertisers access to their users. In this arrangement, the user is less a customer than a product: what is actually being sold is human attention.\nThis business model has consequences for how applications are designed. If revenue depends on the number of minutes people spend looking at a screen, then designers have a strong ( A ) to make their products difficult to put down. Features such as endless scrolling, which removes the natural stopping point at the bottom of a page, and notifications timed to draw users back are not accidental. They are the fruit of careful experiments measuring which designs keep people engaged the longest.\nCritics argue that this creates a conflict between the interests of companies and those of users, many of whom say they wish they spent less time on their devices. Defenders reply that people are free to stop whenever they like, and that free services have given billions of people access to information that was once ( B ) to the wealthy. Both sides have a point. Perhaps the more useful question is not whether such services should exist, but whether users understand the bargain they are making when they click \"accept.\" ","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["incentive","reluctance","doubt","objection"],"e":"直前の「収益が画面を見る時間で決まるなら」という条件を受けて、「設計者には製品を手放しにくくする強い動機がある」とつながります。have an incentive to do（〜する動機・誘因がある）が正解です。reluctance は「気が進まないこと」で文脈と逆、doubt は「疑い」（have a doubt to do の形も取らない）、objection は「反対」で、いずれも〈強い〜があるから手放しにくく作る〉という因果に合いません。","m":"incentive＝やる気を起こさせる誘因（経済の頻出語）"},{"id":5,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：confined to","p":"When a smartphone application costs nothing to download, it is tempting to conclude that it is a gift. Economists, however, like to remind us that there is rarely such a thing as a free lunch. Companies that offer services at no charge must earn money somehow, and in many cases they do so by selling advertisers access to their users. In this arrangement, the user is less a customer than a product: what is actually being sold is human attention.\nThis business model has consequences for how applications are designed. If revenue depends on the number of minutes people spend looking at a screen, then designers have a strong ( A ) to make their products difficult to put down. Features such as endless scrolling, which removes the natural stopping point at the bottom of a page, and notifications timed to draw users back are not accidental. They are the fruit of careful experiments measuring which designs keep people engaged the longest.\nCritics argue that this creates a conflict between the interests of companies and those of users, many of whom say they wish they spent less time on their devices. Defenders reply that people are free to stop whenever they like, and that free services have given billions of people access to information that was once ( B ) to the wealthy. Both sides have a point. Perhaps the more useful question is not whether such services should exist, but whether users understand the bargain they are making when they click \"accept.\" ","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["confined","exposed","opposed","indebted"],"e":"擁護派の主張として「無料サービスは、かつては裕福な人々に限られていた情報へのアクセスを何十億人に与えた」という内容が入ります。be confined to〜は「〜に限られている」の意味で正解です。exposed to は「〜にさらされた」、opposed to は「〜に反対の」、indebted to は「〜に恩を受けている」で、どれも「かつては一部の人だけのものだった」という対比を表せません。","m":"be confined to＝〜に限定される（limited to と同義）"},{"id":6,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"筆者の主張（無料アプリ）","p":"When a smartphone application costs nothing to download, it is tempting to conclude that it is a gift. Economists, however, like to remind us that there is rarely such a thing as a free lunch. Companies that offer services at no charge must earn money somehow, and in many cases they do so by selling advertisers access to their users. In this arrangement, the user is less a customer than a product: what is actually being sold is human attention.\nThis business model has consequences for how applications are designed. If revenue depends on the number of minutes people spend looking at a screen, then designers have a strong ( A ) to make their products difficult to put down. Features such as endless scrolling, which removes the natural stopping point at the bottom of a page, and notifications timed to draw users back are not accidental. They are the fruit of careful experiments measuring which designs keep people engaged the longest.\nCritics argue that this creates a conflict between the interests of companies and those of users, many of whom say they wish they spent less time on their devices. Defenders reply that people are free to stop whenever they like, and that free services have given billions of people access to information that was once ( B ) to the wealthy. Both sides have a point. Perhaps the more useful question is not whether such services should exist, but whether users understand the bargain they are making when they click \"accept.\" ","q":"次の英文を読み、最終段落で筆者が最も言いたいこととして最も適当なものを選びなさい。","c":["It matters more whether users understand what they give in exchange for free services.","Free services should be prohibited because they harm their users.","The defenders of free services are entirely right and the critics are wrong.","Companies should start charging users instead of selling advertising."],"e":"最終段落では批判派と擁護派の両方を紹介した後、Both sides have a point. と双方に理があると認め、より有益な問いは「サービスが存在すべきか」ではなく「利用者が『同意』を押すときに自分の取引を理解しているか」だと述べています。よって1つ目が正解です。禁止すべきだとは言っておらず、擁護派だけが正しいとも言っていません。有料化を勧める記述もありません。","m":"not A but B の B に筆者の主張"},{"id":7,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"既定値の効果","p":"Imagine two companies that offer identical retirement savings plans. At the first, new employees must fill out a form if they wish to join. At the second, employees are enrolled automatically but may leave the plan at any time by filling out a form. From the standpoint of traditional economics, the two arrangements should produce nearly the same results, since the cost of completing a form is trivial compared with the value of decades of savings. In practice, however, participation tends to be dramatically higher at the second company.\nThis finding illustrates the power of what behavioral economists call the default option, the choice that takes effect when a person does nothing. People tend to stick with defaults for several reasons. Some simply put off decisions that seem complicated; others interpret the default as an implicit recommendation from the organization. Whatever the cause, the way a choice is presented can ( A ) behavior as much as the substance of the choice itself.\nPolicymakers have taken note. Some governments now design programs so that the socially desirable option is the default, an approach sometimes called a \"nudge.\" Supporters praise nudges because they preserve freedom of choice: nobody is forced to save or to donate. Skeptics, though, worry that the same techniques can be used for less admirable purposes, such as automatically renewing subscriptions that customers have forgotten about. The tool itself is neutral; whether it serves the public depends on who designs the default and why.","q":"次の英文を読み、本文で述べられている2つの会社の比較の結果として最も適当なものを選びなさい。","c":["Far more employees took part in the plan when they were enrolled automatically.","Both companies had almost the same rate of participation, as economists predicted.","More employees joined the plan when they had to fill out a form to do so.","Employees at the second company could not leave the plan once they joined."],"e":"第1段落最後に In practice, however, participation tends to be dramatically higher at the second company. とあり、自動加入の2社目で加入率が大幅に高いので1つ目が正解です。「ほぼ同じ結果になる」のは伝統的経済学の予想であって実際の結果ではありません。用紙提出が必要なのは1社目で、加入率が高いのはそちらではありません。2社目でも用紙を出せばいつでも脱退できると書かれています。","m":"however の後が「実際の結果」"},{"id":8,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：shape behavior","p":"Imagine two companies that offer identical retirement savings plans. At the first, new employees must fill out a form if they wish to join. At the second, employees are enrolled automatically but may leave the plan at any time by filling out a form. From the standpoint of traditional economics, the two arrangements should produce nearly the same results, since the cost of completing a form is trivial compared with the value of decades of savings. In practice, however, participation tends to be dramatically higher at the second company.\nThis finding illustrates the power of what behavioral economists call the default option, the choice that takes effect when a person does nothing. People tend to stick with defaults for several reasons. Some simply put off decisions that seem complicated; others interpret the default as an implicit recommendation from the organization. Whatever the cause, the way a choice is presented can ( A ) behavior as much as the substance of the choice itself.\nPolicymakers have taken note. Some governments now design programs so that the socially desirable option is the default, an approach sometimes called a \"nudge.\" Supporters praise nudges because they preserve freedom of choice: nobody is forced to save or to donate. Skeptics, though, worry that the same techniques can be used for less admirable purposes, such as automatically renewing subscriptions that customers have forgotten about. The tool itself is neutral; whether it serves the public depends on who designs the default and why.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["shape","conceal","imitate","postpone"],"e":"段落全体は「何もしなければ適用される既定値が人の選択を大きく左右する」という内容です。よって「選択肢の示し方は、選択の中身と同じくらい行動を形づくり得る」となる shape（〜を形成する・左右する）が正解です。conceal（隠す）、imitate（まねる）、postpone（延期する）は、示し方が行動に影響するという趣旨を表せません。","m":"shape＝形づくる→「影響を与える」の意味でよく使う"},{"id":9,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"ナッジへの懸念","p":"Imagine two companies that offer identical retirement savings plans. At the first, new employees must fill out a form if they wish to join. At the second, employees are enrolled automatically but may leave the plan at any time by filling out a form. From the standpoint of traditional economics, the two arrangements should produce nearly the same results, since the cost of completing a form is trivial compared with the value of decades of savings. In practice, however, participation tends to be dramatically higher at the second company.\nThis finding illustrates the power of what behavioral economists call the default option, the choice that takes effect when a person does nothing. People tend to stick with defaults for several reasons. Some simply put off decisions that seem complicated; others interpret the default as an implicit recommendation from the organization. Whatever the cause, the way a choice is presented can ( A ) behavior as much as the substance of the choice itself.\nPolicymakers have taken note. Some governments now design programs so that the socially desirable option is the default, an approach sometimes called a \"nudge.\" Supporters praise nudges because they preserve freedom of choice: nobody is forced to save or to donate. Skeptics, though, worry that the same techniques can be used for less admirable purposes, such as automatically renewing subscriptions that customers have forgotten about. The tool itself is neutral; whether it serves the public depends on who designs the default and why.","q":"次の英文を読み、本文の内容と一致するものを選びなさい。","c":["Skeptics point out that defaults can also be used in ways that do not benefit consumers.","Traditional economics predicted that automatic enrollment would greatly raise participation.","Nudges work by taking away people's freedom to refuse the default option.","The author argues that businesses should be forbidden from using defaults."],"e":"第3段落で懐疑派は、同じ手法が「忘れられた定期購読の自動更新」のような感心しない目的にも使えると懸念しているので1つ目が正解です。伝統的経済学は両社で結果はほぼ同じと予想していたので2つ目は誤り。ナッジは選択の自由を保つ点が評価されているので3つ目も逆です。筆者は「道具自体は中立」と述べるだけで、企業の利用禁止は主張していません。","m":"The tool itself is neutral＝筆者は中立の立場"},{"id":10,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：embody","p":"Of the roughly seven thousand languages spoken in the world today, linguists estimate that nearly half may disappear by the end of this century. Most of these languages have only a few thousand speakers, and many have far fewer. When the last fluent speaker of a language dies, something more than a set of words is lost. Each language ( A ) a particular way of organizing experience: how its speakers divide up colors, describe family relationships, or express certainty and doubt.\nWhy do languages die? Rarely is it because speakers are forbidden to use them, although that has happened. More often, the process is gradual and quiet. Parents who speak a minority language at home may decide that their children will have better opportunities in school and at work if they speak the dominant language of the country. Within a generation or two, the old language survives only among the elderly.\nEfforts to reverse this trend have had mixed results. Recording the speech of elderly speakers preserves valuable information for scholars, but a language that exists only in archives is, ( B ) speaking, no longer alive. The most successful revival programs have focused instead on creating situations in which children use the language every day, such as schools where all subjects are taught in it. Such programs depend on the commitment of the community itself; outsiders can offer support, but they cannot decide on a community's behalf that a language is worth keeping.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["embodies","abandons","resembles","postpones"],"e":"直前で「話者がいなくなると単語の集まり以上のものが失われる」と述べ、コロン以下で色の分け方や家族関係の表し方など「経験を整理する独自の方法」を例示しています。よって「各言語は特有の経験の整理の仕方を体現している」となる embodies（具現する）が正解です。abandons（捨てる）は逆の意味、resembles（似ている）や postpones（延期する）は文意が成り立ちません。","m":"embody＝（考え・性質を）形にして表す"},{"id":11,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：strictly speaking","p":"Of the roughly seven thousand languages spoken in the world today, linguists estimate that nearly half may disappear by the end of this century. Most of these languages have only a few thousand speakers, and many have far fewer. When the last fluent speaker of a language dies, something more than a set of words is lost. Each language ( A ) a particular way of organizing experience: how its speakers divide up colors, describe family relationships, or express certainty and doubt.\nWhy do languages die? Rarely is it because speakers are forbidden to use them, although that has happened. More often, the process is gradual and quiet. Parents who speak a minority language at home may decide that their children will have better opportunities in school and at work if they speak the dominant language of the country. Within a generation or two, the old language survives only among the elderly.\nEfforts to reverse this trend have had mixed results. Recording the speech of elderly speakers preserves valuable information for scholars, but a language that exists only in archives is, ( B ) speaking, no longer alive. The most successful revival programs have focused instead on creating situations in which children use the language every day, such as schools where all subjects are taught in it. Such programs depend on the commitment of the community itself; outsiders can offer support, but they cannot decide on a community's behalf that a language is worth keeping.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["strictly","highly","newly","deeply"],"e":"「記録だけが残る言語も情報としては存在するが、厳密に言えばもはや生きた言語ではない」という意味にするには strictly speaking（厳密に言えば）が適切です。記録として存在はしていても「生きている」とは言えない、という厳密な区別を示す文脈です。highly speaking、newly speaking、deeply speaking という慣用表現はありません。","m":"strictly speaking＝厳密に言えば（frankly/roughly speaking も覚える）"},{"id":12,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"言語消滅の主な原因","p":"Of the roughly seven thousand languages spoken in the world today, linguists estimate that nearly half may disappear by the end of this century. Most of these languages have only a few thousand speakers, and many have far fewer. When the last fluent speaker of a language dies, something more than a set of words is lost. Each language ( A ) a particular way of organizing experience: how its speakers divide up colors, describe family relationships, or express certainty and doubt.\nWhy do languages die? Rarely is it because speakers are forbidden to use them, although that has happened. More often, the process is gradual and quiet. Parents who speak a minority language at home may decide that their children will have better opportunities in school and at work if they speak the dominant language of the country. Within a generation or two, the old language survives only among the elderly.\nEfforts to reverse this trend have had mixed results. Recording the speech of elderly speakers preserves valuable information for scholars, but a language that exists only in archives is, ( B ) speaking, no longer alive. The most successful revival programs have focused instead on creating situations in which children use the language every day, such as schools where all subjects are taught in it. Such programs depend on the commitment of the community itself; outsiders can offer support, but they cannot decide on a community's behalf that a language is worth keeping.","q":"次の英文を読み、本文によると言語が消滅する最もよくある経緯として最も適当なものを選びなさい。","c":["Parents choose to raise their children in the dominant language for the sake of their future.","Governments forbid people to speak minority languages in public.","Scholars record the language but fail to publish their findings.","Children refuse to learn the language that their parents speak."],"e":"第2段落で、話すことを禁じられるのはまれだ（Rarely is it because ...）とした上で、More often として、親が子どもの進学や就職の機会を考えて国の主流言語で育てることを挙げています。よって1つ目が正解です。禁止は「起きたことはあるがまれ」なので最もよくある経緯ではありません。研究者の記録や子どもの拒否は、消滅の原因としては述べられていません。","m":"Rarely A. More often B.→答えは B"},{"id":13,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：consequences","p":"Before the nineteenth century, every town kept its own time. Noon was simply the moment when the sun stood highest in the sky, so a clock in one city might differ by several minutes from a clock in another city only a hundred kilometers to the east or west. For most people this caused no difficulty, because few traveled far enough or fast enough to notice.\nThe railways changed that. A train leaving one town at a scheduled hour would arrive in another where the clocks showed a different time, and timetables listing dozens of local times became nearly impossible to read. Worse, confusion over time could lead to two trains being placed on the same track, with fatal ( A ). Railway companies therefore began to adopt a single standard time for their entire networks, usually based on the clock of a major city.\nGovernments followed more slowly. Many people resisted the change, regarding local time as natural and the new standard as an artificial imposition by distant businesses. Some public clocks even displayed two minute hands, one for local time and one for railway time. Eventually, however, the convenience of a shared system won out, and in 1884 an international conference chose a line passing through Greenwich, England, as the starting point for measuring longitude around the world.\nIt is worth noting how recent this arrangement is. The idea that everyone in a region should agree on what time it is, which we now take for granted, was a response to a specific technological problem rather than a natural feature of human life.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["consequences","intentions","ingredients","permissions"],"e":"時刻の混乱で2本の列車が同じ線路に置かれれば、命にかかわる結果（事故）を招きます。with fatal consequences（致命的な結果を伴って）が正解です。intentions（意図）、ingredients（材料）、permissions（許可）は fatal と結びついても列車衝突の結果を表せません。consequence は「結果・影響」で、with serious consequences などの形でもよく使われます。","m":"with fatal consequences＝悲惨な結果を伴って"},{"id":14,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"時刻表が読みにくい理由","p":"Before the nineteenth century, every town kept its own time. Noon was simply the moment when the sun stood highest in the sky, so a clock in one city might differ by several minutes from a clock in another city only a hundred kilometers to the east or west. For most people this caused no difficulty, because few traveled far enough or fast enough to notice.\nThe railways changed that. A train leaving one town at a scheduled hour would arrive in another where the clocks showed a different time, and timetables listing dozens of local times became nearly impossible to read. Worse, confusion over time could lead to two trains being placed on the same track, with fatal ( A ). Railway companies therefore began to adopt a single standard time for their entire networks, usually based on the clock of a major city.\nGovernments followed more slowly. Many people resisted the change, regarding local time as natural and the new standard as an artificial imposition by distant businesses. Some public clocks even displayed two minute hands, one for local time and one for railway time. Eventually, however, the convenience of a shared system won out, and in 1884 an international conference chose a line passing through Greenwich, England, as the starting point for measuring longitude around the world.\nIt is worth noting how recent this arrangement is. The idea that everyone in a region should agree on what time it is, which we now take for granted, was a response to a specific technological problem rather than a natural feature of human life.","q":"次の英文を読み、本文によると鉄道の時刻表が非常に読みにくくなった理由として最も適当なものを選びなさい。","c":["Timetables had to show many different local times.","Trains often left their stations later than scheduled.","Railway companies refused to publish their timetables.","Clocks at stations had two minute hands."],"e":"第2段落に timetables listing dozens of local times became nearly impossible to read とあり、何十もの地方時を載せなければならなかったことが理由です。列車の遅れや時刻表の非公開は本文にありません。2本の分針をもつ時計は第3段落で、標準時への移行期に地方時と鉄道時を併記した例として出てくるもので、時刻表が読みにくい理由ではありません。","m":"理由を問う問題は該当箇所の主語・目的語を確認"},{"id":15,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"筆者の結論（標準時）","p":"Before the nineteenth century, every town kept its own time. Noon was simply the moment when the sun stood highest in the sky, so a clock in one city might differ by several minutes from a clock in another city only a hundred kilometers to the east or west. For most people this caused no difficulty, because few traveled far enough or fast enough to notice.\nThe railways changed that. A train leaving one town at a scheduled hour would arrive in another where the clocks showed a different time, and timetables listing dozens of local times became nearly impossible to read. Worse, confusion over time could lead to two trains being placed on the same track, with fatal ( A ). Railway companies therefore began to adopt a single standard time for their entire networks, usually based on the clock of a major city.\nGovernments followed more slowly. Many people resisted the change, regarding local time as natural and the new standard as an artificial imposition by distant businesses. Some public clocks even displayed two minute hands, one for local time and one for railway time. Eventually, however, the convenience of a shared system won out, and in 1884 an international conference chose a line passing through Greenwich, England, as the starting point for measuring longitude around the world.\nIt is worth noting how recent this arrangement is. The idea that everyone in a region should agree on what time it is, which we now take for granted, was a response to a specific technological problem rather than a natural feature of human life.","q":"次の英文を読み、本文の内容と一致するものを選びなさい。","c":["A shared standard time is a fairly recent idea that arose from a practical problem.","People in every period of history have agreed on a single time for their region.","Governments adopted standard time earlier than the railway companies did.","Most people welcomed standard time as soon as it was introduced."],"e":"最終段落で、地域で時刻をそろえるという考えは比較的新しく、特定の技術的問題（鉄道）への対応だったと述べているので1つ目が正解です。19世紀以前は町ごとに時刻が違ったので2つ目は誤り。Governments followed more slowly. とあり政府は鉄道会社より遅れたので3つ目も誤り。多くの人が人工的な押しつけだとして抵抗したので4つ目も不一致です。","m":"follow more slowly＝後から遅れて従う"},{"id":16,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：overturn","p":"For a long time, sleep was regarded as a period of rest in which the brain simply switched off. Research over the past few decades has ( A ) this view. During sleep, the brain remains remarkably active, and some of that activity appears to play a central role in memory.\nIn one type of experiment, participants learn a list of word pairs or a sequence of finger movements in the evening and are tested the next morning. Those who sleep between learning and testing generally perform better than those who stay awake for the same number of hours. The improvement seems to depend not merely on the absence of new information interfering with the old, but on processes that occur during particular stages of sleep. Recordings of brain activity suggest that patterns produced while learning are replayed during sleep, as though the brain were rehearsing what it had experienced.\nThese findings have practical implications for students. Staying up all night before an examination may allow a few more hours of study, but it also deprives the brain of the opportunity to ( B ) what has been learned. Some researchers go further and suggest that sleep helps people find hidden rules or connections in information, which may explain why the solution to a difficult problem sometimes seems obvious after a night's rest.\nNot every claim about sleep and learning has been confirmed, however. Products promising that people can learn a foreign language by listening to recordings while asleep have little scientific support. Sleep appears to strengthen what was learned while awake; it is not a substitute for learning itself.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["overturned","confirmed","inspired","repeated"],"e":"直前の「睡眠は脳が停止する休息の時間だと考えられてきた」という見方に対し、直後で「睡眠中も脳は非常に活発だ」と反対の内容が続きます。よって「研究がこの見方を覆した」となる overturned が正解です。confirmed（裏づけた）や repeated（繰り返した）では、後の内容と矛盾します。inspired（着想を与えた）も「古い見方を否定する」流れに合いません。","m":"For a long time ... と来たら「覆す」展開を予想"},{"id":17,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：consolidate","p":"For a long time, sleep was regarded as a period of rest in which the brain simply switched off. Research over the past few decades has ( A ) this view. During sleep, the brain remains remarkably active, and some of that activity appears to play a central role in memory.\nIn one type of experiment, participants learn a list of word pairs or a sequence of finger movements in the evening and are tested the next morning. Those who sleep between learning and testing generally perform better than those who stay awake for the same number of hours. The improvement seems to depend not merely on the absence of new information interfering with the old, but on processes that occur during particular stages of sleep. Recordings of brain activity suggest that patterns produced while learning are replayed during sleep, as though the brain were rehearsing what it had experienced.\nThese findings have practical implications for students. Staying up all night before an examination may allow a few more hours of study, but it also deprives the brain of the opportunity to ( B ) what has been learned. Some researchers go further and suggest that sleep helps people find hidden rules or connections in information, which may explain why the solution to a difficult problem sometimes seems obvious after a night's rest.\nNot every claim about sleep and learning has been confirmed, however. Products promising that people can learn a foreign language by listening to recordings while asleep have little scientific support. Sleep appears to strengthen what was learned while awake; it is not a substitute for learning itself.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["consolidate","forget","overlook","postpone"],"e":"本文は睡眠中に学習時の脳活動が再生され、記憶が強化されると説明しています。徹夜は勉強時間を増やしても「学んだことを定着させる機会」を脳から奪う、という文脈なので consolidate（固める・定着させる）が正解です。forget（忘れる）や overlook（見落とす）を入れると「忘れる機会を奪う」となり、徹夜の欠点を述べる文脈と合いません。postpone（延期する）も意味が通りません。","m":"consolidate＝強固にする（記憶の定着に使う）"},{"id":18,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"睡眠学習の効果","p":"For a long time, sleep was regarded as a period of rest in which the brain simply switched off. Research over the past few decades has ( A ) this view. During sleep, the brain remains remarkably active, and some of that activity appears to play a central role in memory.\nIn one type of experiment, participants learn a list of word pairs or a sequence of finger movements in the evening and are tested the next morning. Those who sleep between learning and testing generally perform better than those who stay awake for the same number of hours. The improvement seems to depend not merely on the absence of new information interfering with the old, but on processes that occur during particular stages of sleep. Recordings of brain activity suggest that patterns produced while learning are replayed during sleep, as though the brain were rehearsing what it had experienced.\nThese findings have practical implications for students. Staying up all night before an examination may allow a few more hours of study, but it also deprives the brain of the opportunity to ( B ) what has been learned. Some researchers go further and suggest that sleep helps people find hidden rules or connections in information, which may explain why the solution to a difficult problem sometimes seems obvious after a night's rest.\nNot every claim about sleep and learning has been confirmed, however. Products promising that people can learn a foreign language by listening to recordings while asleep have little scientific support. Sleep appears to strengthen what was learned while awake; it is not a substitute for learning itself.","q":"次の英文を読み、本文の内容と一致するものを選びなさい。","c":["There is little evidence that people can learn a new language while they are asleep.","People who stay awake after learning usually do better on the next day's test.","Sleep improves memory only because no new information enters the brain.","Staying up all night is an effective way to prepare for an examination."],"e":"最終段落に、眠りながら録音を聞いて外国語を学べるとする製品には科学的裏づけがほとんどない（have little scientific support）とあり1つ目が正解です。眠った人の方が成績が良いので2つ目は逆。改善は「新しい情報が入らないこと」だけによるのではない（not merely ...）とあるので3つ目も誤り。徹夜は記憶の定着の機会を奪うと述べられているので4つ目も不一致です。","m":"not merely A but B＝A だけでなく B"},{"id":19,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"平均が正確になる理由","p":"Suppose several hundred visitors to a fair are each asked to guess the weight of a large animal. Few individual guesses will be accurate; some will be far too high, others far too low. Yet when the guesses are averaged, the result is often surprisingly close to the true figure, sometimes closer than the estimates of experts. This phenomenon, often called the wisdom of crowds, has been observed in tasks ranging from estimating quantities to forecasting elections.\nThe explanation lies partly in the way errors behave. If each person's mistakes are random, the overestimates and underestimates tend to cancel each other out, leaving the accurate information that individuals possess. For this to work, however, certain conditions must be met. The most important is independence: people must form their judgments on their own. When individuals can see one another's guesses, they are likely to move toward what others have said, and the errors stop canceling out. Instead, they pile up in the same direction.\nThis insight has implications for how organizations make decisions. In many meetings, the most senior person speaks first, and others, consciously or not, ( A ) their opinions to match. The group then appears to agree, but its agreement reflects the view of one individual rather than the combined knowledge of many. Some managers therefore ask team members to write down their estimates privately before any discussion begins. The practice costs little, yet it can make a group considerably wiser than the sum of its loudest voices.","q":"次の英文を読み、本文によると多数の推測の平均が正確になりやすい理由として最も適当なものを選びなさい。","c":["Errors in opposite directions tend to cancel each other out.","Most people at a fair are experts at judging weight.","People usually change their guesses after hearing others.","The highest guesses are removed before the average is taken."],"e":"第2段落に、誤りがランダムなら過大評価と過小評価が打ち消し合い（cancel each other out）、個人のもつ正確な情報が残るとあるので1つ目が正解です。来場者の多くが専門家だという記述はなく、むしろ平均は専門家より正確なこともあるとされています。他人の推測を見て修正すると誤差が同じ方向に積み重なり、かえって不正確になります。最大値を除くという記述もありません。","m":"cancel out＝相殺する→平均が真値に近づく"},{"id":20,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：adjust","p":"Suppose several hundred visitors to a fair are each asked to guess the weight of a large animal. Few individual guesses will be accurate; some will be far too high, others far too low. Yet when the guesses are averaged, the result is often surprisingly close to the true figure, sometimes closer than the estimates of experts. This phenomenon, often called the wisdom of ing from estimating quantities to forecasting elections.\nThe explanation lies partly in the way errors behave. If each person's mistakes are random, the overestimates and underestimates tend to cancel each other out, leaving the accurate information that individuals possess. For this to work, however, certain conditions must be met. The most important is independence: people must form their judgments on their own. When individuals can see one another's guesses, they are likely to move toward what others have said, and the errors stop canceling out. Instead, they pile up in the same direction.\nThis insight has implications for how organizations make decisions. In many meetings, the most senior person speaks first, and others, consciously or not, ( A ) their opinions to match. The group then appears to agree, but its agreement reflects the view of one individual rather than the combined knowledge of many. Some managers therefore ask team members to write down their estimates privately before any discussion begins. The practice costs little, yet it can make a group considerably wiser than the sum of its loudest voices.","q":"次の英文を読み、本文の内容と一致するものを選びなさい。","c":["Letting people see one another's guesses can make the group's average less accurate.","The wisdom of crowds works best when people discuss their estimates first.","The most senior person in a meeting usually has the most accurate opinion.","Writing estimates down privately is an expensive practice for organizations."],"e":"第2段落で、互いの推測が見えると人は他人の意見に寄っていき、誤差が打ち消されず同じ方向に積み重なると述べているので1つ目が正解です。独立性が最も重要な条件なので、先に話し合うのは逆効果で2つ目は誤り。上位者の意見が最も正確だという記述はありません。個別に書き出す方法は The practice costs little とあり、費用が高いという4つ目も誤りです。","m":"独立性が崩れると誤差が同じ方向にたまる"},{"id":22,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：reflect","p":"In many democracies, young people vote at lower rates than their elders. This pattern worries observers for a simple reason: politicians, who need votes to win office, have an incentive to pay more attention to groups that reliably turn out on election day. If young people stay home, policies may increasingly ( A ) the concerns of older generations, which in turn may persuade the young that voting makes no difference. A vicious circle can result.\nExplanations for low youth turnout vary. Some point to apathy, but surveys often find that young people care deeply about issues such as employment, education, and the environment. A more convincing explanation may be practical. Voting for the first time involves unfamiliar procedures, such as registering and finding a polling station, and young adults frequently move for school or work, which can complicate both. Moreover, voting appears to be a habit: people who vote in the first elections for which they are eligible are more likely to keep voting throughout their lives.\nIf habit matters, then the first experience of voting is especially important. Some researchers have proposed lowering the voting age so that people cast their first ballot while still living at home and attending school, where they can receive guidance and are less likely to be in the middle of a move. Critics counter that sixteen-year-olds lack the maturity for such a responsibility. Whatever one thinks of the proposal, it ( B ) attention away from the question of whether young people are interested in politics and toward the question of how easy it is for them to participate.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["reflect","neglect","oppose","question"],"e":"政治家は確実に投票に来る集団に注意を向ける動機があると述べた後なので、若者が棄権すれば政策はますます高齢世代の関心を反映するようになる、という流れです。reflect（反映する）が正解です。neglect（無視する）、oppose（反対する）、question（疑問視する）は、投票率の高い高齢世代が優遇されるという因果と逆向きになります。","m":"reflect the concerns of〜＝〜の関心を反映する"},{"id":23,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"若者の低投票率の要因","p":"In many democracies, young people vote at lower rates than their elders. This pattern worries observers for a simple reason: politicians, who need votes to win office, have an incentive to pay more attention to groups that reliably turn out on election day. If young people stay home, policies may increasingly ( A ) the concerns of older generations, which in turn may persuade the young that voting makes no difference. A vicious circle can result.\nExplanations for low youth turnout vary. Some point to apathy, but surveys often find that young people care deeply about issues such as employment, education, and the environment. A more convincing explanation may be practical. Voting for the first time involves unfamiliar procedures, such as registering and finding a polling station, and young adults frequently move for school or work, which can complicate both. Moreover, voting appears to be a habit: people who vote in the first elections for which they are eligible are more likely to keep voting throughout their lives.\nIf habit matters, then the first experience of voting is especially important. Some researchers have proposed lowering the voting age so that people cast their first ballot while still living at home and attending school, where they can receive guidance and are less likely to be in the middle of a move. Critics counter that sixteen-year-olds lack the maturity for such a responsibility. Whatever one thinks of the proposal, it ( B ) attention away from the question of whether young people are interested in politics and toward the question of how easy it is for them to participate.","q":"次の英文を読み、本文で「より説得力がある」とされている若者の低投票率の説明として最も適当なものを選びなさい。","c":["Unfamiliar procedures and frequent moves make voting harder for young adults.","Young people care very little about employment or education.","Politicians have made it illegal for students to vote while at school.","Young people believe that their parents should vote on their behalf."],"e":"第2段落で、無関心説は調査結果と合わないとした上で、A more convincing explanation may be practical. として、登録や投票所探しなどの不慣れな手続きと、進学・就職による頻繁な転居を挙げています。よって1つ目が正解です。若者は雇用や教育に強い関心をもつと書かれているので2つ目は逆です。3つ目・4つ目のような記述は本文にありません。","m":"Some point to A, but ... → A は否定される"},{"id":24,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：shift attention","p":"In many democracies, young people vote at lower rates than their elders. This pattern worries observers for a simple reason: politicians, who need votes to win office, have an incentive to pay more attention to groups that reliably turn out on election day. If young people stay home, policies may increasingly ( A ) the concerns of older generations, which in turn may persuade the young that voting makes no difference. A vicious circle can result.\nExplanations for low youth turnout vary. Some point to apathy, but surveys often find that young people care deeply about issues such as employment, education, and the environment. A more convincing explanation may be practical. Voting for the first time involves unfamiliar procedures, such as registering and finding a polling station, and young adults frequently move for school or work, which can complicate both. Moreover, voting appears to be a habit: people who vote in the first elections for which they are eligible are more likely to keep voting throughout their lives.\nIf habit matters, then the first experience of voting is especially important. Some researchers have proposed lowering the voting age so that people cast their first ballot while still living at home and attending school, where they can receive guidance and are less likely to be in the middle of a move. Critics counter that sixteen-year-olds lack the maturity for such a responsibility. Whatever one thinks of the proposal, it ( B ) attention away from the question of whether young people are interested in politics and toward the question of how easy it is for them to participate.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["shifts","pays","holds","catches"],"e":"空所の後は attention away from A and toward B（A から B へ注意を）という形なので、「注意を移す」の意味になる shifts が正解です。この提案は、若者が政治に関心があるかどうかという問題から、参加しやすいかどうかという問題へと関心を移す、という意味になります。pay attention to（〜に注意を払う）、hold/catch attention（注意を引きつける）は away from ... toward ... と一緒に使えません。","m":"shift A away from B toward C＝A を B から C へ移す"},{"id":25,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：assumption","p":"A placebo is a treatment that contains no active ingredient, such as a sugar pill. Yet patients who receive placebos often report real improvements, particularly in symptoms such as pain and fatigue. This placebo effect is the reason new drugs are tested against placebos rather than against no treatment at all: a drug is considered effective only if it performs better than a pill that patients merely believe might help.\nFor many years, it was assumed that the placebo effect depended on deception. If patients knew their pill was inactive, the reasoning went, it could not possibly help them. Some recent studies have challenged this ( A ). In these experiments, patients were told openly that they were receiving placebos, yet many still reported feeling better than patients who received nothing. Researchers suggest that the ritual of treatment itself, including visiting a doctor, being examined, and taking a pill at regular times, may trigger expectations of recovery even when patients understand what the pill contains.\nThese results should be interpreted with care. Placebos do not shrink tumors or cure infections, and their effects are largest for symptoms that patients report themselves rather than for those measured by instruments. Still, the research suggests that the relationship between doctor and patient is not merely a background to treatment but may be part of it.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["assumption","prescription","ingredient","symptom"],"e":"this ( A ) は直前の内容、つまり「プラセボ効果はだますことに依存する（偽薬だと知れば効かない）」という長年の前提を指します。it was assumed that ... と対応する assumption（想定・前提）が正解です。続く実験は、偽薬と知らされても改善を感じる患者がいたことを示し、その前提に異議を唱えています。prescription（処方箋）、ingredient（成分）、symptom（症状）は直前の内容を言い換えられません。","m":"this＋名詞＝前文の言い換え（assume→assumption）"},{"id":26,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"プラセボ効果の限界","p":"A placebo is a treatment that contains no active ingredient, such as a sugar pill. Yet patients who receive placebos often report real improvements, particularly in symptoms such as pain and fatigue. This placebo effect is the reason new drugs are tested against placebos rather than against no treatment at all: a drug is considered effective only if it performs better than a pill that patients merely believe might help.\nFor many years, it was assumed that the placebo effect depended on deception. If patients knew their pill was inactive, the reasoning went, it could not possibly help them. Some recent studies have challenged this ( A ). In these experiments, patients were told openly that they were receiving placebos, yet many still reported feeling better than patients who received nothing. Researchers suggest that the ritual of treatment itself, including visiting a doctor, being examined, and taking a pill at regular times, may trigger expectations of recovery even when patients understand what the pill contains.\nThese results should be interpreted with care. Placebos do not shrink tumors or cure infections, and their effects are largest for symptoms that patients report themselves rather than for those measured by instruments. Still, the research suggests that the relationship between doctor and patient is not merely a background to treatment but may be part of it.","q":"次の英文を読み、本文の内容と一致するものを選びなさい。","c":["Placebos tend to have larger effects on symptoms that patients report themselves.","Placebos can cure infections if patients believe in them strongly enough.","Patients who know they are taking placebos never feel any better.","New drugs are usually compared with no treatment rather than with placebos."],"e":"最終段落に、効果は機器で測る症状よりも患者自身が報告する症状で最も大きいとあるので1つ目が正解です。プラセボは腫瘍を縮めたり感染症を治したりしないとあるので2つ目は誤り。偽薬と知らされても多くの患者が改善を報告したので3つ目も誤り。新薬は無治療ではなくプラセボと比較して試験される（rather than against no treatment）ので4つ目も逆です。","m":"A rather than B の向きを取り違えない"},{"id":27,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所）","t":"空所補充：replicate","p":"When large numbers of office employees began working from home, some commentators predicted the decline of big cities. If people no longer had to travel to an office each day, why would they pay high rents to live near one? The picture that has emerged since then is more complicated than either enthusiasts or pessimists expected.\nIt is true that many workers have moved farther from city centers, and that some offices stand partly empty. Shops and restaurants that once depended on lunchtime crowds have suffered. Yet cities have not emptied. One reason is that their attractions were never limited to offices. People also value the variety of entertainment, culture, and social life that only a dense population can support.\nAnother reason concerns the nature of work itself. Routine tasks can often be performed anywhere, but much innovation depends on chance encounters, such as a conversation in a hallway or an introduction at a conference, that are difficult to ( A ) online. Many firms have therefore settled on hybrid arrangements, asking employees to come in on certain days so that they can collaborate in person while enjoying flexibility the rest of the week.\nThe long-term effects remain uncertain. What seems clear is that the office will not disappear but will change its role, from a place where people go to work alone at desks to a place where they go to meet one another.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["replicate","avoid","exaggerate","postpone"],"e":"廊下での会話や会議での紹介といった偶然の出会いはオンラインで再現しにくい、だから企業は出社日を設けるハイブリッド型にした、という流れです。replicate（再現する）が正解です。avoid（避ける）を入れると「オンラインでは避けにくい」となり、出社の必要性を説明できません。exaggerate（誇張する）、postpone（延期する）も意味が通りません。","m":"replicate＝複製・再現する（reproduce と近い）"},{"id":28,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"オフィスの役割の変化","p":"When large numbers of office employees began working from home, some commentators predicted the decline of big cities. If people no longer had to travel to an office each day, why would they pay high rents to live near one? The picture that has emerged since then is more complicated than either enthusiasts or pessimists expected.\nIt is true that many workers have moved farther from city centers, and that some offices stand partly empty. Shops and restaurants that once depended on lunchtime crowds have suffered. Yet cities have not emptied. One reason is that their attractions were never limited to offices. People also value the variety of entertainment, culture, and social life that only a dense population can support.\nAnother reason concerns the nature of work itself. Routine tasks can often be performed anywhere, but much innovation depends on chance encounters, such as a conversation in a hallway or an introduction at a conference, that are difficult to ( A ) online. Many firms have therefore settled on hybrid arrangements, asking employees to come in on certain days so that they can collaborate in person while enjoying flexibility the rest of the week.\nThe long-term effects remain uncertain. What seems clear is that the office will not disappear but will change its role, from a place where people go to work alone at desks to a place where they go to meet one another.","q":"次の英文を読み、本文によると今後オフィスはどうなると考えられているか、最も適当なものを選びなさい。","c":["It will remain but serve mainly as a place for people to meet one another.","It will disappear because all work can now be done online.","It will become a quiet place where people work alone at desks.","It will be replaced by shops and restaurants in city centers."],"e":"最終段落に、オフィスは消えないが役割を変え、「机で1人で働く場所」から「人と会うために行く場所」になる（from A to B）とあるので1つ目が正解です。the office will not disappear とあるので2つ目は誤り。3つ目は変化前の役割で、向きが逆です。店や飲食店はむしろ昼の客が減って打撃を受けたと書かれており、4つ目も本文にありません。","m":"from A to B＝A から B へ変わる（B が今後）"},{"id":29,"k":"plan","ref":"想定問題","f":"文法・語法","t":"It is high time＋仮定法過去","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nIt's already past midnight. It is high time you (　　) to bed.","c":["went","go","will go","had gone"],"e":"〈It is (high) time＋主語＋動詞の過去形〉で「もう〜してもよい頃だ（なのにまだしていない）」を表します。これは仮定法過去の一種なので、現在のことでも過去形 went を使います。go や will go は直説法で、この構文では使いません。had gone は過去完了で、時制が1つずれてしまいます。なお〈It is time for＋人＋to do〉の形でも同じ内容を表せます。","m":"It is high time＋過去形＝とっくに〜すべき時"},{"id":30,"k":"plan","ref":"想定問題","f":"文法・語法","t":"Not until の倒置","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nNot until he lost his job (　　) the importance of having savings.","c":["did he realize","he realized","he did realize","realized he"],"e":"否定語句 Not until ... が文頭に出ると、主節は疑問文と同じ語順の倒置〈助動詞＋主語＋動詞の原形〉になります。過去の文なので did he realize が正解です。he realized は倒置していないので不可。he did realize は強調の do で、語順が倒置になっていません。realized he は一般動詞をそのまま主語の前に出しており誤りです。","m":"否定語が文頭→疑問文の語順（did＋S＋V）"},{"id":31,"k":"plan","ref":"想定問題","f":"文法・語法","t":"But for＝〜がなければ","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\n(　　) the heavy rain, the final match would have been played as planned.","c":["But for","Thanks to","Because of","Instead of"],"e":"主節が would have been played（仮定法過去完了）なので、前半は「もし大雨がなかったら」という仮定の条件になります。But for〜（＝Without〜／If it had not been for〜）が正解です。Because of では「大雨のせいで予定通り行われただろう」となり意味が通りません。Thanks to（〜のおかげで）も同じく原因を表すので不可。Instead of（〜の代わりに）も仮定の条件を表せません。","m":"But for＝Without＝If it had not been for"},{"id":32,"k":"plan","ref":"想定問題","f":"文法・語法","t":"would rather＋仮定法","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nI'd rather you (　　) anything about the surprise party to Lisa.","c":["didn't say","haven't said","won't say","not to say"],"e":"〈would rather＋主語＋過去形〉で「（人に）〜してほしい」という現在・未来への願望を表します。仮定法過去なので否定は didn't say が正解です。haven't said（現在完了）、won't say（未来）は直説法の形なので、この構文では用いません。not to say は不定詞で、would rather の後に主語＋動詞の節を続ける形になっていません。自分の行為なら I'd rather not say ... のように原形を使います。","m":"would rather＋S＋過去形＝S に〜してほしい"},{"id":33,"k":"plan","ref":"想定問題","f":"文法・語法","t":"the number of の一致","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe number of foreign tourists visiting the town (　　) increased sharply over the past five years.","c":["has","have","are","were"],"e":"〈the number of＋複数名詞〉は「〜の数」で、主語の中心は number なので単数扱いです。また over the past five years（この5年間で）は現在完了と相性がよいので has が正解です。have は複数扱いで不可。are や were も複数扱いのうえ、are increased は受動態になり、「この5年間で増えた」という完了の意味を表せません。〈a number of＋複数名詞〉（多くの〜）は複数扱いになる点と区別しましょう。","m":"the number of＝単数／a number of＝複数"},{"id":34,"k":"plan","ref":"想定問題","f":"文法・語法","t":"be used to doing","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nAs a former news reader, she is used to (　　) in front of large audiences.","c":["speaking","speak","be spoken","have spoken"],"e":"〈be used to＋名詞・動名詞〉で「〜に慣れている」を表し、この to は前置詞です。したがって動名詞 speaking が正解です。speak（原形）を続けると〈used to do〉（以前はよく〜した）と混同した形になり、be が付いているので誤りです。be spoken は受動態の原形、have spoken は完了形の原形で、いずれも前置詞の後に置けません。","m":"be used to＋～ing＝慣れている／used to do＝以前は"},{"id":35,"k":"plan","ref":"想定問題","f":"文法・語法","t":"Hardly ... when","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nHardly had the meeting begun (　　) the fire alarm went off.","c":["when","than","then","that"],"e":"〈Hardly [Scarcely] had＋S＋過去分詞 ... when [before]＋S＋過去形〉で「〜するとすぐに…した」を表します。when が正解です。than は〈No sooner had S done ... than〉の形で使うので、Hardly とは組み合わせません。then は副詞で節をつなげられず、that もこの構文では使いません。","m":"Hardly … when／No sooner … than"},{"id":36,"k":"plan","ref":"想定問題","f":"文法・語法","t":"関係代名詞と関係副詞","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThis is the old castle town (　　) I visited with my grandparents last summer.","c":["which","where","in which","when"],"e":"空所の後の I visited ... は、visit の目的語が欠けた不完全な文です。目的語の役割をする関係代名詞 which が正解です。where（関係副詞）や in which（前置詞＋関係代名詞）は、後ろに完全な文（例：I stayed）が続くときに使います。先行詞が場所だからといって where を選ばないこと。when は時を表す先行詞に使います。","m":"後ろが不完全→関係代名詞／完全→関係副詞"},{"id":37,"k":"plan","ref":"想定問題","f":"文法・語法","t":"the＋比較級, the＋比較級","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe more you practice speaking in front of others, (　　) you will become.","c":["the more confident","more confident","the most confident","the confident more"],"e":"〈The＋比較級 ..., the＋比較級 ...〉で「〜すればするほど、ますます…」を表します。後半も the＋比較級を文頭に置くので the more confident が正解です。more confident は the が欠けています。the most confident は最上級で、この構文には使えません。the confident more は語順が誤りです。","m":"The＋比較級〜, the＋比較級…＝〜するほど…"},{"id":38,"k":"plan","ref":"想定問題","f":"文法・語法","t":"完了不定詞","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nMy grandfather is said (　　) quite wealthy when he was young.","c":["to have been","to be","being","having been"],"e":"〈S is said to do〉は「S は〜だと言われている」。言われているのは現在（is said）ですが、裕福だったのは若い頃（過去）なので、述語動詞より前の時を表す完了不定詞 to have been が正解です。to be では「今裕福だと言われている」となり、when he was young と合いません。being や having been は is said の後に置く形として誤りです。","m":"述語より前の時→to have＋過去分詞"},{"id":39,"k":"plan","ref":"想定問題","f":"文法・語法","t":"Should で始まる倒置","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\n(　　) you have any questions about the application, please contact our office.","c":["Should","Would","Unless","Had"],"e":"〈Should＋S＋動詞の原形〉は If S should do の if を省略した倒置で、「万一〜なら」を表します。主節が please contact という命令文で、後ろが have（原形）なので Should が正解です。Had を使う倒置は Had＋S＋過去分詞（仮定法過去完了）の形になります。Would にはこの用法はありません。Unless では「質問がない限り連絡せよ」となり、意味が通りません。","m":"Should S do＝If S should do（万一〜なら）"},{"id":40,"k":"plan","ref":"想定問題","f":"文法・語法","t":"one ... the other","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nI have two older brothers. One lives in Osaka, and (　　) lives in Sendai.","c":["the other","another","other","the others"],"e":"2つ（2人）のうち、一方を one で表したら、残りのもう一方は特定されるので the other を使います。another は「（3つ以上あるうちの）別のもう1つ」で、2人の場合には使いません。other は単独で代名詞として主語にできません。the others は「残り全部（複数）」で、動詞 lives とも一致しません。","m":"2つ→one / the other、3つ以上→another"},{"id":41,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"call off","q":"次の英文の【 】内の語句の意味に最も近いものを選びなさい。\nThe outdoor concert was 【called off】 because of the approaching typhoon.","c":["canceled","postponed","announced","approved"],"e":"call off は「（予定していた行事など）を中止する」で、cancel とほぼ同じ意味です。postpone（延期する）は put off に当たり、「中止」ではなく「後にずらす」ことなので区別が必要です。announce（発表する）、approve（承認する）は台風が近づいているという理由と合いません。call off と put off の違いは頻出です。","m":"call off＝cancel／put off＝postpone"},{"id":42,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"make out","q":"次の英文の【 】内の語句の意味に最も近いものを選びなさい。\nThe letters on the old sign were so faded that I could not 【make out】 what it said.","c":["understand","change","ignore","forget"],"e":"make out は「（見たり聞いたりして）〜を理解する・判読する」の意味で、ここでは「文字が薄れていて何と書いてあるか読み取れなかった」となります。understand が最も近い意味です。change（変える）、ignore（無視する）、forget（忘れる）は make out の意味と異なり、 so faded that ...（あまりに薄れていたので）という理由とつながりません。","m":"make out＝判読する・理解する"},{"id":43,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"take effect","q":"次の英文の【 】内の語句の意味に最も近いものを選びなさい。\nThe new regulations on plastic packaging will 【take effect】 next April.","c":["come into force","be debated","be withdrawn","be criticized"],"e":"take effect は「（法律・規則が）発効する、効力を生じる」で、come into force と同じ意味です。be debated（議論される）は発効前の段階、be withdrawn（撤回される）は逆の結果、be criticized（批判される）は効力の有無と関係しません。法律や制度に関する文章で頻出の表現です。","m":"take effect＝come into force＝発効する"},{"id":44,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"compete with","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe two smartphone makers have been (　　) with each other for a larger share of the market.","c":["competing","consisting","complying","composing"],"e":"compete with A for B で「B を求めて A と競争する」を表します。市場シェアを争うという文脈なので competing が正解です。consist は consist of（〜から成る）、comply は comply with（〜に従う）で、with は取りますが「シェアを求めて互いに従う」では意味が通りません。compose は「構成する・作曲する」で、with each other for ... の形に合いません。","m":"compete with A for B＝B を求めて A と争う"},{"id":45,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"ambiguous","q":"次の英文の【 】内の語句の意味に最も近いものを選びなさい。\nHis answer was so 【ambiguous】 that nobody could tell whether he agreed or not.","c":["unclear","accurate","persuasive","offensive"],"e":"ambiguous は「（2通り以上に解釈できて）あいまいな」で、unclear が最も近い意味です。that 以下の「賛成か反対か誰にも分からなかった」という結果ともよく合います。accurate（正確な）や persuasive（説得力のある）は逆の方向、offensive（不快な）も文脈に合いません。","m":"ambiguous＝あいまいな（⇔ clear, explicit）"},{"id":46,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"take into account","q":"次の英文の【 】内の語句の意味に最も近いものを選びなさい。\nWhen planning the event, we must 【take into account】 the cost of transportation.","c":["consider","reduce","ignore","postpone"],"e":"take A into account（take into account A）は「A を考慮に入れる」で consider と同じ意味です。ここでは目的語が長いので take into account the cost ... の語順になっています。reduce（減らす）は「費用」と結びつきますが「考慮する」の意味ではなく、postpone（延期する）も意味が異なります。ignore（無視する）は逆の意味です。","m":"take A into account＝consider A"},{"id":47,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"corroborate","q":"次の英文の【 】内の語句の意味に最も近いものを選びなさい。\nThe scientist's findings were later 【corroborated】 by several independent studies.","c":["confirmed","contradicted","ignored","simplified"],"e":"corroborate は「（証拠などによって説・発見）を裏づける、確証する」で、confirmed が最も近い意味です。independent studies（独立した複数の研究）によって後から裏づけられた、という文脈です。contradict（矛盾する・否定する）はほぼ逆の意味です。ignore（無視する）、simplify（単純化する）も「研究によって〜された」の意味としては合いません。私大上位校レベルの語彙です。","m":"corroborate＝confirm（裏づける）"},{"id":48,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"step down","q":"次の英文の【 】内の語句の意味に最も近いものを選びなさい。\nAfter the scandal came to light, the minister had no choice but to 【step down】.","c":["resign","apologize","protest","hide"],"e":"step down は「（職・地位から）退く、辞任する」で、resign が最も近い意味です。have no choice but to do は「〜するしかない」。不祥事が明るみに出て辞任せざるを得なかった、という流れです。apologize（謝罪する）は不祥事の後に行うことはありますが、step down の意味ではありません。protest（抗議する）、hide（隠れる）も意味が異なります。","m":"step down＝resign（辞任する）"},{"id":49,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"attribute A to B","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nMany scientists (　　) the decline in bee populations to the use of certain pesticides.","c":["attribute","contribute","distribute","devote"],"e":"attribute A to B で「A（結果）の原因を B だと考える」を表します。ミツバチの減少の原因を農薬の使用に帰するという文脈なので attribute が正解です。contribute A to B は「A を B に寄付・提供する」、distribute A to B は「A を B に配る」、devote A to B は「A を B にささげる」で、いずれも原因を表しません。形の似た語の区別がポイントです。","m":"attribute A to B＝A を B のせいにする"},{"id":50,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"pay off","q":"次の英文の【 】内の語句の意味に最も近いものを選びなさい。\nIt took years of hard work, but in the end his efforts 【paid off】.","c":["brought good results","cost too much","were wasted","were forgotten"],"e":"自動詞の pay off は「（努力・計画などが）報われる、成果を生む」の意味で、brought good results が最も近い意味です。but in the end（しかし最後には）という逆接から、長年の努力が実を結んだという肯定的な内容が入ると判断できます。cost too much、were wasted、were forgotten はいずれも否定的な結果で文脈と合いません。他動詞では pay off a debt（借金を完済する）という用法もあります。","m":"pay off（自動詞）＝報われる・うまくいく"},{"id":51,"k":"plan","ref":"想定問題","f":"会話文","t":"図書館：延滞と貸出","p":"(At a university library)\nStudent: Excuse me. The machine won't let me check out this book.\nLibrarian: Let me take a look. I see. You still have two books that were due last week. ( 1 )\nStudent: Oh no, I was sure I'd returned those. They must still be in my bag at home.\nLibrarian: That's all right. Just bring them back as soon as you can. ( 2 )\nStudent: Then I'll come back first thing tomorrow morning. Thank you so much.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["Until they're returned, you can't borrow anything new.","You may borrow up to five more books today.","That's why the machine is out of order today.","Would you like to renew this book for another week?"],"e":"司書は、貸出機が受け付けない理由として先週が期限の本が2冊未返却だと説明しています。その流れで「それが返却されるまで新しい本は借りられません」と続けるのが自然です。「今日あと5冊借りられる」は貸出できない状況と矛盾します。機械が故障しているわけではなく、まだ借りていない本を「延長」することもできません。","m":"直前の発言の「理由」とつながる文を選ぶ"},{"id":52,"k":"plan","ref":"想定問題","f":"会話文","t":"図書館：取り置きの申し出","p":"(At a university library)\nStudent: Excuse me. The machine won't let me check out this book.\nLibrarian: Let me take a look. I see. You still have two books that were due last week. ( 1 )\nStudent: Oh no, I was sure I'd returned those. They must still be in my bag at home.\nLibrarian: That's all right. Just bring them back as soon as you can. ( 2 )\nStudent: Then I'll come back first thing tomorrow morning. Thank you so much.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["I can keep this book aside for you until then, if you like.","Unfortunately, students are not allowed to borrow this book at all.","You will have to buy new copies of both books.","The library will be closed for the next two weeks."],"e":"学生は直後に「では明日の朝一番にまた来ます」と答えています。したがって司書は「それまでこの本を取っておきましょうか」と申し出たと考えるのが自然です。「学生はこの本を一切借りられない」なら翌朝に来る意味がありません。司書は「できるだけ早く返せば大丈夫」と言っているので、新しい本の購入は不要です。2週間休館なら翌朝来ることもできません。","m":"空所の直後の返答から逆算する"},{"id":53,"k":"plan","ref":"想定問題","f":"会話文","t":"電話：予定変更の依頼","p":"(On the phone)\nMark: Hello, Ms. Tanaka. This is Mark Hill from Greenfield Trading. I'm calling about our meeting on Thursday.\nMs. Tanaka: Yes, at two o'clock, isn't it?\nMark: That's right. I'm afraid something urgent has come up, and ( 1 )\nMs. Tanaka: I see. How about Friday morning, then?\nMark: ( 2 ) I'll be visiting a client in Yokohama all morning. Would the afternoon work for you?\nMs. Tanaka: Sure. Let's say three o'clock.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["I was wondering if we could move it to another day.","I'm really looking forward to seeing you then.","I'd like to confirm that I'll arrive on time.","could you tell me how to get to your office?"],"e":"I'm afraid something urgent has come up（あいにく急用ができまして）と言った後なので、予定変更をお願いする内容が続きます。田中さんも「では金曜の朝はどうですか」と別の日を提案しています。I was wondering if ...（〜していただけないでしょうか）は丁寧な依頼の定型表現です。「楽しみにしている」「時間通りに着くことを確認したい」「道順を教えて」は、急用ができたという前置きと合いません。","m":"I was wondering if＝丁寧な依頼"},{"id":54,"k":"plan","ref":"想定問題","f":"会話文","t":"電話：都合が悪いと伝える","p":"(On the phone)\nMark: Hello, Ms. Tanaka. This is Mark Hill from Greenfield Trading. I'm calling about our meeting on Thursday.\nMs. Tanaka: Yes, at two o'clock, isn't it?\nMark: That's right. I'm afraid something urgent has come up, and ( 1 )\nMs. Tanaka: I see. How about Friday morning, then?\nMark: ( 2 ) I'll be visiting a client in Yokohama all morning. Would the afternoon work for you?\nMs. Tanaka: Sure. Let's say three o'clock.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["Unfortunately, I'm tied up then.","That would be perfect for me.","Thursday is fine with me after all.","I'll be free all day on Friday."],"e":"マークは直後に「午前中はずっと横浜の顧客を訪問する予定なので、午後はどうですか」と言っているので、金曜の朝は都合が悪いと答えたはずです。be tied up は「手がふさがっている、忙しい」の意味です。「それは最適です」「金曜は一日空いている」は午前に予定がある説明と矛盾します。木曜は急用で変更を頼んだばかりなので、「結局木曜で大丈夫」も不自然です。","m":"be tied up＝忙しくて手が離せない"},{"id":55,"k":"plan","ref":"想定問題","f":"会話文","t":"送別会：店の広さ","p":"Aya: Have you decided where to hold Kenji's farewell party?\nBen: Not yet. I was thinking of that Italian place near the station, but ( 1 )\nAya: Really? I heard it's quite good.\nBen: The food is great, but it only seats about fifteen people, and we're expecting more than twenty.\nAya: Then ( 2 ) There's a Chinese restaurant upstairs with a private room for thirty.\nBen: Perfect. I'll give them a call this afternoon.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["I'm not sure it's big enough.","the food there is terrible.","Kenji doesn't like parties.","it's already been booked for us."],"e":"ベンは後で「料理はとてもおいしいが、15人ほどしか座れず、20人以上来る予定だ」と説明しています。したがって最初に「十分な広さがあるか分からない」と懸念を述べたと考えられます。「料理がひどい」は The food is great と矛盾します。ケンジがパーティー嫌いという話は出てきません。すでに予約済みなら、まだ決めていない（Not yet）という発言と合いません。","m":"後の詳しい説明が空所の言い換えになる"},{"id":56,"k":"plan","ref":"想定問題","f":"会話文","t":"送別会：別の店の提案","p":"Aya: Have you decided where to hold Kenji's farewell party?\nBen: Not yet. I was thinking of that Italian place near the station, but ( 1 )\nAya: Really? I heard it's quite good.\nBen: The food is great, but it only seats about fifteen people, and we're expecting more than twenty.\nAya: Then ( 2 ) There's a Chinese restaurant upstairs with a private room for thirty.\nBen: Perfect. I'll give them a call this afternoon.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["why don't we try somewhere else in the same building?","we'd better cancel the party altogether.","how about holding it at the Italian place anyway?","we should ask Kenji to pay for the party."],"e":"アヤは直後に「上の階に30人入れる個室のある中華料理店がある」と具体的な代案を出しています。その前置きとして「同じ建物の別の店にしてはどうか」と提案するのが自然です。why don't we ...? は「〜しませんか」という提案の定型表現です。パーティーの中止は代案の提示と合わず、「とにかくイタリア料理店で」は広さの問題が解決しません。主役に支払わせるという話も文脈にありません。","m":"Why don't we …?＝〜しようよ（提案）"},{"id":57,"k":"plan","ref":"想定問題","f":"会話文","t":"薬局：服用方法の確認","p":"(At a pharmacy)\nPharmacist: Here's your medicine. Take one tablet three times a day after meals.\nCustomer: After meals? ( 1 )\nPharmacist: Not really. These tablets can upset your stomach if you take them without food.\nCustomer: I see. And how long should I keep taking them?\nPharmacist: Until you've finished the whole package, even if you start feeling better before then.\nCustomer: ( 2 )\nPharmacist: Because if you stop too early, the infection may come back.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["Is it all right to take them on an empty stomach?","How many tablets are there in the package?","Do I need a prescription to buy these?","Can I get these at any drugstore?"],"e":"薬剤師は Not really（あまりよくありません）と答え、「食べ物なしで飲むと胃を荒らすことがある」と理由を述べています。よって客は「空腹時に飲んでもいいか」と尋ねたと分かります。on an empty stomach は「空腹時に」の意味です。錠剤の数や処方箋、購入場所の質問に対しては、Not really の後に胃への影響を説明する答えは合いません。","m":"on an empty stomach＝空腹時に"},{"id":58,"k":"plan","ref":"想定問題","f":"会話文","t":"薬局：理由を尋ねる","p":"(At a pharmacy)\nPharmacist: Here's your medicine. Take one tablet three times a day after meals.\nCustomer: After meals? ( 1 )\nPharmacist: Not really. These tablets can upset your stomach if you take them without food.\nCustomer: I see. And how long should I keep taking them?\nPharmacist: Until you've finished the whole package, even if you start feeling better before then.\nCustomer: ( 2 )\nPharmacist: Because if you stop too early, the infection may come back.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["Why is that necessary?","How much do I owe you?","Can I take two at a time instead?","Where can I get some more?"],"e":"薬剤師は直後に Because ...（なぜなら早くやめると感染症がぶり返すかもしれないから）と理由を答えています。よって客は、良くなっても飲み切る必要がある理由を尋ねたはずです。「いくらですか」「2錠ずつ飲んでもいいか」「どこで追加を買えるか」には、Because で始まる今の答えはかみ合いません。会話文では空所直後の Because, Sure, Not really などが大きな手がかりです。","m":"直後が Because→空所は Why の質問"},{"id":59,"k":"plan","ref":"想定問題","f":"会話文","t":"教授との会話：事情の説明","p":"Student: Professor Lee, do you have a minute?\nProfessor: Of course. What's on your mind?\nStudent: It's about the report due on Monday. I've been sick for most of this week, and ( 1 )\nProfessor: I'm sorry to hear that. Are you feeling better now?\nStudent: Much better, thank you. Would it be possible to submit it a few days late?\nProfessor: ( 2 ) Bring me a note from the health center, and you can hand it in by Thursday.\nStudent: Thank you so much. I'll do that.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["I've hardly been able to work on it.","I've already finished writing it.","I won't need any extra time for it.","I'd like to change the topic of the course."],"e":"学生は今週ほとんど体調を崩していたと述べ、後で提出を数日遅らせてもらえないかと頼んでいます。よって「レポートにほとんど取り組めていない」と事情を説明する文が入ります。hardly は「ほとんど〜ない」という否定の意味です。「もう書き終えた」「追加の時間は必要ない」は締め切り延長の依頼と矛盾し、「授業のテーマを変えたい」は話題がずれています。","m":"hardly＝ほとんど〜ない（否定語）"},{"id":60,"k":"plan","ref":"想定問題","f":"会話文","t":"教授との会話：依頼への応答","p":"Student: Professor Lee, do you have a minute?\nProfessor: Of course. What's on your mind?\nStudent: It's about the report due on Monday. I've been sick for most of this week, and ( 1 )\nProfessor: I'm sorry to hear that. Are you feeling better now?\nStudent: Much better, thank you. Would it be possible to submit it a few days late?\nProfessor: ( 2 ) Bring me a note from the health center, and you can hand it in by Thursday.\nStudent: Thank you so much. I'll do that.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["I think that can be arranged.","I'm afraid the deadline is final.","You should have asked me last month.","Then I'll see you on Monday as planned."],"e":"教授は直後に「保健センターの証明書を持ってくれば木曜までに提出してよい」と言っており、延長を認めています。したがって「それは何とかなると思います」と受け入れる表現が入ります。can be arranged は「手配・調整できる」の意味です。「締め切りは変えられない」「予定通り月曜に」は、延長を認める直後の発言と矛盾します。「先月頼むべきだった」は、病気になったのが今週なので不自然です。","m":"That can be arranged.＝何とかしましょう"}];

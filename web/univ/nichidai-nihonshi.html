り替え"},{"id":163,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問44","f":"現代","t":"朝鮮戦争と日本","y":1950,"q":"1950年に始まった朝鮮戦争と日本の関係について、正しい説明はどれですか。","c":["日本は国連軍の出撃・補給の基地となり、特需景気が生じた。","日本は国連軍に自衛隊を派遣し、朝鮮半島で直接の戦闘にあたった。","日本は戦争の影響で貿易がとだえ、深刻な不況に陥った。","戦争は北緯38度線をこえた韓国軍の侵攻で始まり、日本は中立を保った。"],"e":"朝鮮戦争では、日本は国連軍（アメリカ軍）の出撃・補給基地となり、米軍が大量の物資やサービスを日本で調達する特需が生じて、特需景気となりました。また戦争の勃発を機に警察予備隊が設けられました。戦争は北朝鮮軍が北緯38度線をこえて南に侵攻して始まりました。自衛隊はまだ存在せず、1954年に発足します。","m":"朝鮮戦争（1950）＝日本は国連軍基地、特需景気、警察予備隊"},{"id":164,"k":"past","ref":"2026年度 商学部A個別第2期 Ⅰ 問2","f":"現代","t":"第五福竜丸事件と首相","y":1954,"q":"1954年のビキニ環礁での水爆実験で、第五福竜丸が被爆した当時の内閣総理大臣は誰ですか。","c":["吉田茂","鳩山一郎","岸信介","石橋湛山"],"e":"第五福竜丸の被爆は1954年3月で、当時は第5次吉田茂内閣でした。吉田内閣は造船疑獄などで批判を受け、同年12月に鳩山一郎内閣に代わりました。この事件をきっかけに原水爆禁止の署名運動が広がり、翌1955年に広島で第1回原水爆禁止世界大会が開かれました。岸信介は1957年、石橋湛山は1956年末に首相となっています。","m":"第五福竜丸（1954.3）＝吉田内閣、翌年に原水禁世界大会"},{"id":165,"k":"past","ref":"2026年度 商学部A個別第2期 Ⅰ 問5","f":"現代","t":"GATT11条国への移行","y":1963,"q":"日本が1963年に移行した国際的な地位として、正しいものはどれですか。","c":["GATT11条国","IMF8条国","OECD加盟国","世界銀行加盟国"],"e":"日本は1963年にGATT11条国に移行し、国際収支を理由に輸入制限をおこなえなくなりました。その翌1964年にはIMF8条国に移行して為替の自由化を進め、同じ年に経済協力開発機構（OECD）にも加盟して資本の自由化をはかりました。世界銀行への加盟は1952年のことで、1960年代の貿易・資本の自由化とは別の出来事です。","m":"1963 GATT11条国→1964 IMF8条国・OECD加盟"},{"id":166,"k":"past","ref":"2026年度 商学部A個別第2期 Ⅰ 問6","f":"現代","t":"非核三原則と佐藤栄作","y":1967,"q":"「もたず、つくらず、もちこませず」の非核三原則を国会ではじめて表明した首相について、正しい説明はどれですか。","c":["小笠原諸島の返還と沖縄の日本復帰を実現した。","「日本列島改造論」を掲げ、日中国交正常化を実現した。","日米相互協力及び安全保障条約（新安保条約）を結んだ。","日ソ共同宣言に調印し、ソ連との国交を回復した。"],"e":"非核三原則は、1967年に佐藤栄作首相が国会で表明した方針で、のち1971年に国会で決議されました。佐藤内閣は1968年に小笠原諸島の返還、1972年に沖縄の日本復帰を実現しました。日本列島改造論と日中国交正常化は田中角栄、新安保条約は岸信介、日ソ共同宣言は鳩山一郎に関する事項です。","m":"非核三原則（1967）＝佐藤栄作、小笠原・沖縄の返還"},{"id":167,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅳ 問38","f":"現代","t":"沖縄返還の日米共同声明","y":1969,"q":"1969年に沖縄の日本復帰の方針を確認した日米共同声明を発表した、日本の首相とアメリカの大統領の組み合わせとして、正しいものはどれですか。","c":["佐藤栄作―ニクソン","佐藤栄作―ジョンソン","池田勇人―ニクソン","岸信介―ケネディ"],"e":"1969年11月、佐藤栄作首相とニクソン大統領は日米共同声明を出し、核抜き・本土並みで1972年に沖縄を返還する方針を確認しました。1971年に沖縄返還協定が調印され、1972年5月15日に沖縄が日本に復帰しました。池田勇人はケネディ大統領と、岸信介はアイゼンハワー大統領と同時期の首相で、ジョンソン大統領は1960年代後半の大統領です。","m":"沖縄返還の日米共同声明（1969）＝佐藤栄作・ニクソン"},{"id":168,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅳ 問39","f":"現代","t":"ニクソン＝ショックとブレトン＝ウッズ体制","y":1971,"q":"1972年の沖縄復帰の際、ドルを円に交換する比率が問題になった背景として、正しいものはどれですか。","c":["1971年にアメリカがドルと金との交換を停止し、国際通貨体制が動揺したこと","1964年に日本がIMF8条国へ移行し、為替と資本の自由化を進めたこと","1973年に原油価格が急騰し、急激なインフレーションが発生したこと","1980年代に日米間の貿易摩擦が深刻化し、日本が市場の開放を迫られたこと"],"e":"1971年8月、ニクソン大統領はドルと金の交換停止を発表し（ニクソン＝ショック）、ブレトン＝ウッズ体制が動揺して、円は切り上げ圧力を受けました。12月のスミソニアン協定で円は1ドル＝308円になり、1972年5月の沖縄復帰では1ドル＝305円で交換されました。IMF8条国への移行は1964年、石油危機は1973年、日米貿易摩擦の深刻化は1980年代で、1972年の為替の変更とは別です。","m":"ニクソン＝ショック（1971）→ブレトン＝ウッズ体制の動揺"},{"id":169,"k":"plan","ref":"想定問題","f":"原始・古代","t":"岩宿遺跡と旧石器時代","y":1949,"q":"相沢忠洋が関東ローム層から石器を見つけ、日本にも旧石器時代の文化があったことを明らかにした遺跡はどれですか。","c":["岩宿遺跡","三内丸山遺跡","吉野ヶ里遺跡","加曽利貝塚"],"e":"群馬県の岩宿遺跡では、相沢忠洋が関東ローム層（約1万年以上前の火山灰層）から打製石器を発見し、1949年の発掘調査で、日本にも旧石器時代の文化があったことが確かめられました。三内丸山遺跡は縄文時代の大規模な集落跡、吉野ヶ里遺跡は弥生時代の環濠集落、加曽利貝塚は縄文時代の貝塚です。","m":"岩宿遺跡＝関東ローム層の打製石器→旧石器時代の確認"},{"id":170,"k":"plan","ref":"想定問題","f":"原始・古代","t":"弥生時代の青銅器","y":-100,"q":"弥生時代の青銅製の祭器について、正しい説明はどれですか。","c":["銅鐸は近畿地方を中心に分布し、集落の祭りに用いられたと考えられている。","銅鐸は九州北部を中心に分布し、銅剣や銅矛は近畿地方を中心に分布している。","銅鐸は朝廷が各地の豪族に配った武器で、戦いのたびに用いられた。","青銅器は弥生時代のはじめから、農具として広く用いられた。"],"e":"銅鐸は近畿地方を中心に分布する青銅製の祭器で、豊作を祈る集落の祭りなどに用いられたと考えられています。銅剣・銅矛・銅戈は、もとは武器でしたが、日本では祭器として大型化し、銅矛や銅戈は九州北部、平形銅剣は瀬戸内海沿岸に多く分布します。実用の農具や武器には、主に鉄器や石器が使われました。","m":"銅鐸＝近畿の祭器、銅矛・銅戈＝九州北部の祭器"},{"id":171,"k":"plan","ref":"想定問題","f":"原始・古代","t":"卑弥呼と親魏倭王","y":239,"q":"239年に魏に使いを送り、「親魏倭王」の称号と金印、銅鏡などを授けられた邪馬台国の女王は誰ですか。","c":["卑弥呼","壱与（台与）","倭王武","奴国王"],"e":"『魏志』倭人伝によると、邪馬台国の女王卑弥呼は239年に魏の皇帝に使者を送り、「親魏倭王」の称号と金印、銅鏡100枚などを授けられました。壱与（台与）は卑弥呼の死後に女王となった人物、倭王武は5世紀に宋に使いを送った王、奴国王は1世紀に後漢から「漢委奴国王」の金印を授けられた王です。","m":"卑弥呼＝239年に魏へ遣使、親魏倭王"},{"id":172,"k":"plan","ref":"想定問題","f":"原始・古代","t":"古墳時代の巨大古墳","y":450,"q":"古墳時代の古墳について、正しい説明はどれですか。","c":["大阪府堺市の大仙陵古墳は、日本最大級の前方後円墳である。","前方後円墳は、弥生時代の終わりに東北地方で最初につくられた。","大型の前方後円墳は、近畿地方ではなく東北地方に最も集中してつくられた。","古墳の副葬品は、時代が下るほど銅鏡や銅鐸などの呪術的な祭器が中心となった。"],"e":"大仙陵古墳（仁徳天皇陵古墳とされる）は、大阪府堺市にある全長約486mの前方後円墳で、日本最大級の古墳です。前方後円墳は3世紀中ごろから後半に近畿地方（奈良盆地）で出現し、全国に広がりました。副葬品は、前期には銅鏡などの呪術的なもの、後期には馬具や武具などの実用的なものが増えていきました。","m":"大仙陵古墳（堺市）＝日本最大級の前方後円墳"},{"id":173,"k":"plan","ref":"想定問題","f":"原始・古代","t":"改新の詔の内容","y":646,"q":"645年に中大兄皇子と中臣鎌足が蘇我入鹿を倒したあと、646年に出された改新の詔の内容として、正しいものはどれですか。","c":["豪族が私有していた土地と人民を廃止し、公地公民制へ移る方針を示した。","貴族や寺社が開墾した土地を、永久に私有することを認める方針を示した。","冠位十二階を定めて、家柄にかかわらず人材を登用する方針を示した。","全国に大宰府と按察使を置いて、国司の不正を取り締まる方針を示した。"],"e":"646年の改新の詔は、それまで豪族が私有していた土地（田荘）と人民（部曲）を廃止して公地公民制に移ることや、国・郡などの地方制度を整えること、戸籍・計帳をつくり班田収授をおこなうこと、新しい税制を定めることなどを示しました。墾田の永久私有は743年の墾田永年私財法、冠位十二階は603年の推古天皇の時の制度です。","m":"改新の詔（646）＝公地公民・地方制度・班田収授・新税制"},{"id":174,"k":"plan","ref":"想定問題","f":"原始・古代","t":"白村江の戦いと防衛策","y":663,"q":"663年の白村江の戦いで唐・新羅の連合軍に敗れたのち、日本がとった対応として、正しいものはどれですか。","c":["九州に水城や大野城を築き、防人を置いて国土の防衛を固めた。","博多に鎮西探題を置き、九州の御家人に異国警固番役を課した。","平城京に都を移し、国郡里制による地方支配を整えた。","新羅と同盟を結び、高句麗への出兵を決めた。"],"e":"百済の復興を助けるために出兵した倭軍は、663年の白村江の戦いで唐・新羅の連合軍に大敗しました。その後、天智天皇は九州北部に水城や大野城を築き、防人を置いて、唐・新羅の侵攻に備えました。鎮西探題や異国警固番役は鎌倉時代の元寇への対策で、時代が異なります。","m":"白村江の敗戦（663）→水城・大野城・防人で防衛強化"},{"id":175,"k":"plan","ref":"想定問題","f":"原始・古代","t":"壬申の乱","y":672,"q":"天智天皇の死後、皇位をめぐって672年に起こった壬申の乱に勝利して即位した天皇は誰ですか。","c":["天武天皇","持統天皇","文武天皇","聖武天皇"],"e":"壬申の乱は、天智天皇の子の大友皇子と、天智天皇の弟の大海人皇子が争った内乱で、大海人皇子が勝利して天武天皇として即位しました。天武天皇は飛鳥浄御原宮で皇族を中心とする政治を進めました。持統天皇は天武天皇の皇后で、藤原京を造営し、文武天皇はその孫、聖武天皇は奈良時代の天皇です。","m":"壬申の乱（672）＝大海人皇子が勝利→天武天皇"},{"id":176,"k":"plan","ref":"想定問題","f":"原始・古代","t":"長屋王の変と光明子","y":729,"q":"729年に長屋王が自殺に追い込まれたあと、聖武天皇の皇后に立てられた人物は誰ですか。","c":["光明子","橘三千代","藤原宮子","持統上皇"],"e":"長屋王の変（729年）のあと、藤原不比等の娘の光明子が皇后に立てられました。皇后は皇族出身者が就くのが通例でしたが、臣下出身の光明子が立后されたのは、藤原氏の力が強まっていたことを示します。橘三千代は光明子の母、藤原宮子は聖武天皇の母、持統上皇はすでに亡くなっていた人物です。","m":"長屋王の変（729）→藤原不比等の娘・光明子が皇后に"},{"id":177,"k":"plan","ref":"想定問題","f":"原始・古代","t":"最澄と空海","y":806,"q":"平安時代の初めに唐から新しい仏教を伝えた最澄と空海について、正しい説明はどれですか。","c":["最澄は比叡山に延暦寺を開いて天台宗を伝え、空海は高野山に金剛峯寺を開いて真言宗を伝えた。","最澄は高野山に金剛峯寺を開いて真言宗を伝え、空海は比叡山に延暦寺を開いて天台宗を伝えた。","最澄は比叡山に延暦寺を開いて浄土宗を伝え、空海は高野山に金剛峯寺を開いて法相宗を伝えた。","最澄は東大寺で華厳宗を広め、空海は唐招提寺で律宗を広めた。"],"e":"最澄は比叡山に延暦寺を開いて天台宗を、空海は高野山に金剛峯寺を開いて真言宗を伝えました。空海は京都の東寺（教王護国寺）も嵯峨天皇から与えられています。二人の開いた寺と宗派を入れ替えた選択肢や、浄土宗・法相宗とした選択肢は誤りです。浄土宗は鎌倉時代に法然が開いた宗派です。","m":"最澄＝天台宗・延暦寺、空海＝真言宗・金剛峯寺"},{"id":178,"k":"plan","ref":"想定問題","f":"中世","t":"承久の乱の結果","y":1221,"q":"1221年の承久の乱の結果として、正しいものはどれですか。","c":["幕府は六波羅探題を置き、上皇方の所領を没収して新しい地頭を任命した。","幕府は後鳥羽上皇を京都に残し、朝廷の人事に口出ししないことを約束した。","幕府は鎮西探題を置いて九州を支配し、御家人に異国警固番役を課した。","幕府は後鳥羽上皇を隠岐に流したが、没収した所領は朝廷に返還した。"],"e":"承久の乱で後鳥羽上皇の軍を破った幕府は、後鳥羽上皇を隠岐に、順徳上皇を佐渡に流し、京都に六波羅探題を置いて朝廷を監視しました。上皇方の貴族や武士の所領は没収されて、東国の御家人が新補地頭として任命されました。鎮西探題の設置や異国警固番役は、元寇に関係する13世紀後半の出来事です。","m":"承久の乱（1221）→六波羅探題の設置・上皇方の所領没収"},{"id":179,"k":"plan","ref":"想定問題","f":"中世","t":"御成敗式目","y":1232,"q":"1232年に北条泰時らが定めた御成敗式目について、正しい説明はどれですか。","c":["源頼朝以来の先例や武家社会の道理にもとづく、最初の武家法である。","律令を修正して、公家と武家の両方に同じように適用される法として定められた。","足利尊氏が建武の新政を批判して、今後の政治方針として定めた17か条の法である。","戦国大名が領国を支配するために、独自に定めた分国法である。"],"e":"御成敗式目（貞永式目）は、執権北条泰時が連署や評定衆と協議して1232年に定めた51か条の法で、源頼朝以来の先例や武家社会の慣習・道理にもとづく最初の武家法です。適用範囲は主に幕府の支配下の武家でした。尊氏が建武の新政の際に定めたのは建武式目で、分国法は戦国時代に戦国大名が定めた法です。","m":"御成敗式目（1232）＝北条泰時、最初の武家法"},{"id":180,"k":"plan","ref":"想定問題","f":"中世","t":"建武の新政","y":1334,"q":"後醍醐天皇がおこなった建武の新政について、正しい説明はどれですか。","c":["記録所や雑訴決断所を置いて親政を進めたが、武士の不満で短期間で崩壊した。","天皇は摂政・関白を置いて政治を進め、院政を復活させようとした。","武士への恩賞を公平におこなったため、武士の不満はほとんど生じなかった。","天皇は足利尊氏を征夷大将軍に任じ、武家の幕府の再興を認めた。"],"e":"後醍醐天皇は1333年に鎌倉幕府を倒すと、翌年から天皇中心の建武の新政を始め、記録所や雑訴決断所などの機関を置きました。しかし、公家を重んじて武士への恩賞が不十分だったため不満が広がり、1336年に足利尊氏が離反して、政権は短期間で崩壊しました。摂関や院政に頼る政治ではなく、尊氏を征夷大将軍に任じたのも後醍醐天皇ではありません。","m":"建武の新政（1334～）＝記録所・雑訴決断所、武士の不満で崩壊"},{"id":181,"k":"plan","ref":"想定問題","f":"中世","t":"応仁の乱","y":1467,"q":"1467年に始まった応仁の乱について、正しい説明はどれですか。","c":["将軍家や畠山・斯波氏の相続争いに、細川勝元と山名持豊の対立が結びついて起こった。","3代将軍足利義満と有力守護の大内義弘の対立に、南朝の勢力が加わって起こった。","6代将軍足利義教の暗殺をきっかけに、赤松氏と山名氏の武力衝突として起こった。","鎌倉公方の足利持氏と、関東管領の上杉憲実の対立から関東で起こった。"],"e":"応仁の乱は、8代将軍足利義政の後継ぎをめぐる弟義視と子義尚の争いに、畠山氏・斯波氏の家督争い、さらに細川勝元と山名持豊（宗全）の対立が結びついて起こった大乱です。京都は焼け野原になり、幕府の権威は大きく低下しました。応永の乱や嘉吉の変、永享の乱は、それぞれ別の時期に起きた事件です。","m":"応仁の乱（1467）＝将軍家・畠山・斯波の相続争い＋細川と山名の対立"},{"id":182,"k":"plan","ref":"想定問題","f":"中世","t":"法然と専修念仏","y":1198,"q":"法然について述べた文として、正しいものはどれですか。","c":["『選択本願念仏集』を著し、念仏を唱えれば誰でも往生できるという専修念仏を説いた。","『歎異抄』を著して、悪人こそが阿弥陀仏の救いの対象であるという悪人正機説を説いた。","『立正安国論』を著して、法華経の題目を唱えれば国も人も救われると人々に説いた。","宋から臨済宗を伝え、『興禅護国論』を著して、禅が国家を守ると朝廷に訴えた。"],"e":"法然は浄土宗を開き、『選択本願念仏集』で、阿弥陀仏の救いを信じてひたすら念仏を唱える専修念仏を説きました。『歎異抄』は親鸞の教えを弟子の唯円が記した書、『立正安国論』は日蓮が北条時頼に提出した書、『興禅護国論』は臨済宗を伝えた栄西の著作です。","m":"法然＝浄土宗・『選択本願念仏集』・専修念仏"},{"id":183,"k":"plan","ref":"想定問題","f":"近世","t":"太閤検地","y":1582,"q":"豊臣秀吉がおこなった太閤検地について、正しい説明はどれですか。","c":["枡や単位を統一し、耕作者を検地帳に登録して、石高制の基礎をつくった。","荘園領主を検地帳に登録して、荘園制にもとづく土地支配を整えた。","全国一律の年貢率を定め、土地の売買を自由にして年貢を銀で納めさせた。","検地帳には武士の名だけを登録し、百姓は村ごとにまとめて記録した。"],"e":"太閤検地は、秀吉が全国で進めた土地調査で、枡や面積の単位を統一し、田畑の等級や面積から石高を定めて、実際に耕作している百姓を検地帳に登録しました。これにより一つの土地に一人の耕作者が対応する一地一作人の原則が確立し、荘園制が解体して石高制が成立しました。","m":"太閤検地＝単位の統一・石高・一地一作人"},{"id":184,"k":"plan","ref":"想定問題","f":"近世","t":"参勤交代","y":1635,"q":"3代将軍徳川家光の時の武家諸法度（寛永令）で制度化された参勤交代について、正しい説明はどれですか。","c":["大名は1年おきに江戸と領国を往復し、妻子は人質として江戸に住まわされた。","大名は毎年江戸に常住し、妻子だけが領国に残って藩の政務をとるよう定められた。","旗本と御家人が、1年ごとに江戸と京都の勤務を交代する制度として定められた。","外様大名だけに義務づけられ、譜代大名は江戸に常住するよう定められた。"],"e":"参勤交代は、1635年の武家諸法度（寛永令）で制度化され、大名は原則として1年おきに江戸と領国を往復し、妻子は江戸に住まわされました。往復の費用や江戸での生活費は大名の大きな負担となり、藩の財政を圧迫しました。譜代大名も参勤交代をおこない、旗本・御家人の制度ではありません。","m":"参勤交代（1635）＝大名が1年おきに江戸と領国を往復"},{"id":185,"k":"plan","ref":"想定問題","f":"近世","t":"享保の改革の人材登用","y":1723,"q":"8代将軍徳川吉宗の享保の改革でおこなわれた政策として、正しいものはどれですか。","c":["足高の制を定めて、禄高の低い有能な人材を役職に登用した。","株仲間を公認して、運上や冥加を増やし幕府財政の再建をはかった。","棄捐令を出して、旗本・御家人の札差からの借金を帳消しにした。","上知令を出して、江戸・大坂周辺の大名・旗本の領地を幕府領にしようとした。"],"e":"吉宗は享保の改革で、役職に就いた人の禄高を在職中だけ補う足高の制を定めて、禄高の低い有能な人材を登用しました。このほか上げ米、公事方御定書、目安箱の設置などもおこなっています。株仲間の公認は田沼意次、棄捐令は松平定信、上知令は水野忠邦の政策です。","m":"享保の改革＝足高の制・上げ米・公事方御定書・目安箱"},{"id":186,"k":"plan","ref":"想定問題","f":"近世","t":"天保の改革","y":1841,"q":"老中水野忠邦がおこなった天保の改革について、正しい説明はどれですか。","c":["株仲間を解散させて物価の引き下げをはかったが、かえって流通が混乱した。","寛政異学の禁を出して、朱子学以外の学問を湯島聖堂で教えることを禁じた。","囲米の制を設けて、飢饉に備え各藩に米を蓄えさせた。","目安箱を設置して、庶民の意見を政治に取り入れた。"],"e":"天保の改革で水野忠邦は、物価高の原因を株仲間の独占にあると考えて株仲間を解散させましたが、流通が混乱して物価はかえって下がりませんでした。江戸・大坂周辺を幕領にする上知令も大名や旗本の反対で撤回され、忠邦は失脚しました。寛政異学の禁や囲米は寛政の改革、目安箱は享保の改革の政策です。","m":"天保の改革＝株仲間の解散・上知令の失敗→忠邦の失脚"},{"id":187,"k":"plan","ref":"想定問題","f":"近世","t":"『解体新書』の刊行","y":1774,"q":"1774年に刊行された『解体新書』について、正しい説明はどれですか。","c":["前野良沢・杉田玄白らが、オランダ語の解剖書を翻訳した。","大槻玄沢・稲村三伯らが、オランダ語の解剖書を翻訳して刊行した。","平賀源内・司馬江漢らが、ドイツ語の天文書を翻訳して刊行した。","高野長英・渡辺崋山らが、英語の医学書を翻訳して刊行した。"],"e":"『解体新書』は、前野良沢や杉田玄白らがオランダ語の解剖書『ターヘル＝アナトミア』を翻訳し、1774年に刊行した医学書です。西洋の科学書を翻訳した最初の本格的な業績として、のちの蘭学の発展に大きな影響を与えました。大槻玄沢は玄白・良沢の弟子、稲村三伯は蘭日辞書『ハルマ和解』をつくった人物で、『解体新書』の翻訳者ではありません。","m":"『解体新書』（1774）＝前野良沢・杉田玄白らが翻訳"},{"id":188,"k":"plan","ref":"想定問題","f":"近世","t":"蛮社の獄","y":1839,"q":"1837年のモリソン号事件への幕府の対応を批判して、1839年の蛮社の獄で処罰された人物の組み合わせはどれですか。","c":["渡辺崋山・高野長英","吉田松陰・橋本左内","林子平・山東京伝","大塩平八郎・生田万"],"e":"モリソン号事件で幕府が異国船打払令にもとづいて砲撃したことを、渡辺崋山は『慎機論』、高野長英は『戊戌夢物語』で批判し、1839年の蛮社の獄で処罰されました。吉田松陰と橋本左内は1859年の安政の大獄、林子平と山東京伝は寛政の改革、大塩平八郎と生田万は1837年の反乱に関わった人物です。","m":"蛮社の獄（1839）＝渡辺崋山・高野長英"},{"id":189,"k":"plan","ref":"想定問題","f":"近代","t":"日米和親条約","y":1854,"q":"1854年に結ばれた日米和親条約で定められた内容として、正しいものはどれですか。","c":["下田と箱館を開き、アメリカ船に燃料や食料を供給することを定めた。","神奈川など5港を開いて自由貿易を認め、領事裁判権も認めた。","関税率を日米の協議で決める協定関税制を定め、自由貿易を始めた。","長崎と平戸を開いて、オランダ以外の国にも貿易を認めた。"],"e":"日米和親条約は、ペリーとの交渉で1854年に結ばれ、下田と箱館の2港を開いてアメリカ船に燃料や食料を供給すること、漂流民を保護すること、下田にアメリカ領事を置くことなどを定めました。貿易は認められておらず、自由貿易や領事裁判権、協定関税を定めたのは1858年の日米修好通商条約です。","m":"日米和親条約（1854）＝下田・箱館の開港、貿易は未開始"},{"id":190,"k":"plan","ref":"想定問題","f":"近代","t":"廃藩置県","y":1871,"q":"1871年の廃藩置県について、正しい説明はどれですか。","c":["藩を廃止して府県を置き、中央から府知事・県令を派遣して直接支配した。","藩主に領地と領民を朝廷へ返させ、藩主をそのまま知藩事に任命して統治を続けさせた。","藩士の俸禄をすべて廃止し、士族全員に新しい土地を与えて生活を保障した。","藩を廃止して郡県制を復活させ、世襲の郡司に地方を統治させた。"],"e":"廃藩置県は、1871年に政府が藩を廃止して府県を置き、旧藩主を東京に住まわせ、中央から府知事・県令を派遣した改革です。これで中央集権体制が確立しました。藩主を知藩事に任命して統治を続けさせたのは、1869年の版籍奉還のあとの措置で、俸禄の廃止は1876年の秩禄処分です。","m":"廃藩置県（1871）＝藩を廃止、府知事・県令を中央から派遣"},{"id":191,"k":"plan","ref":"想定問題","f":"近代","t":"地租改正","y":1873,"q":"1873年から始まった地租改正について、正しい説明はどれですか。","c":["土地の所有者に地券を発行し、地価の3％を現金で納めさせた。","収穫量に応じて米で納めさせ、豊凶によって税額を毎年変えた。","耕作者ではなく名主に課税し、税額は村全体で決めさせた。","地価の10％を税と定め、土地の売買を禁止した。"],"e":"地租改正は、土地の所有者に地券を発行し、地価の3％（のち2.5％）を現金で納めさせた税制改革です。これにより政府は豊凶に左右されない安定した収入を得ましたが、負担が重く、各地で地租改正反対一揆が起こりました。収穫量に応じた米納は江戸時代の年貢で、売買の禁止ではなく、売買や所有権は認められました。","m":"地租改正（1873）＝地券・地価の3％・現金納"},{"id":192,"k":"plan","ref":"想定問題","f":"近代","t":"西南戦争","y":1877,"q":"1877年の西南戦争について、正しい説明はどれですか。","c":["西郷隆盛を中心とする士族最大で最後の反乱で、徴兵制の政府軍が鎮圧した。","江藤新平が佐賀で起こした士族の反乱で、政府軍がただちに鎮圧した。","熊本の神風連が起こした反乱で、士族反乱のなかで最初のものだった。","自由民権運動の不平士族が起こした反乱で、この後も士族反乱は続いた。"],"e":"西南戦争は、鹿児島の士族が西郷隆盛を担いで1877年に起こした反乱で、士族反乱の最大のものです。徴兵制にもとづく政府軍が鎮圧し、これ以後の政府への反対運動は、武力ではなく言論による自由民権運動が中心となりました。佐賀の乱は1874年、神風連の乱は1876年に起こった別の反乱です。","m":"西南戦争（1877）＝西郷隆盛、最後で最大の士族反乱"},{"id":193,"k":"plan","ref":"想定問題","f":"近代","t":"内閣制度の創設","y":1885,"q":"1885年に創設された内閣制度について、正しい説明はどれですか。","c":["太政官制を廃止して内閣制度を創設し、伊藤博文が初代の内閣総理大臣になった。","太政官制を廃止して内閣制度を創設し、黒田清隆が初代の内閣総理大臣になった。","内閣制度の創設と同時に帝国議会が開設され、内閣は議会に責任を負った。","内閣制度は大日本帝国憲法の発布後に創設され、宮中と府中の区別がなくなった。"],"e":"1885年、政府は太政官制を廃止して内閣制度を創設し、伊藤博文が初代の内閣総理大臣になりました。宮中と政府（府中）を分けるため、宮内大臣と内大臣は内閣の外に置かれました。黒田清隆は第2代の首相、帝国議会の開設は1890年、憲法の発布は1889年で、内閣制度の創設のほうが先です。","m":"内閣制度（1885）＝初代首相は伊藤博文"},{"id":194,"k":"plan","ref":"想定問題","f":"近代","t":"三国干渉","y":1895,"q":"1895年の下関条約のあと、日本に遼東半島の返還を勧告した国の組み合わせとして、正しいものはどれですか。","c":["ロシア・フランス・ドイツ","ロシア・イギリス・アメリカ","フランス・ドイツ・イギリス","ロシア・ドイツ・オーストリア"],"e":"下関条約で日本が遼東半島を得ると、ロシアが満洲への進出を妨げられることを恐れ、フランス・ドイツを誘って、1895年に日本に遼東半島の返還を勧告しました（三国干渉）。日本は国力の差を考えて受け入れ、返還しました。以後、国内では「臥薪嘗胆」を合言葉にロシアへの対抗心が高まりました。","m":"三国干渉（1895）＝露・仏・独が遼東半島の返還を勧告"},{"id":195,"k":"plan","ref":"想定問題","f":"近代","t":"米騒動","y":1918,"q":"1918年の米騒動について、正しい説明はどれですか。","c":["富山県の漁村の女性たちの行動から全国に広がり、寺内内閣が退陣した。","東京の労働者が米屋を襲ったことから全国に広がり、原敬内閣が退陣した。","シベリア出兵の中止を求める運動として全国に広がり、加藤高明内閣が成立した。","米価の暴落に抗議する農民の運動として全国に広がり、桂太郎内閣が退陣した。"],"e":"米騒動は、米価の急騰に苦しんだ富山県の漁村の女性たちが米の移出を阻もうとした行動から、全国に広がった民衆運動です。政府は軍隊を出動して鎮圧しましたが、寺内正毅内閣は責任をとって総辞職し、原敬の政党内閣が成立しました。米価は暴落ではなく高騰し、桂太郎内閣の退陣は1913年の第一次護憲運動によるものです。","m":"米騒動（1918）＝米価高騰、寺内内閣が総辞職→原内閣"},{"id":196,"k":"plan","ref":"想定問題","f":"近代","t":"二・二六事件","y":1936,"q":"1936年の二・二六事件について、正しい説明はどれですか。","c":["皇道派の青年将校が約1400人の兵と決起し、高橋是清蔵相らを殺害したが鎮圧された。","海軍の青年将校らが首相官邸を襲って犬養毅首相を暗殺し、政党内閣の時代が終わった。","皇道派の将校が決起して、ロンドン海軍軍縮条約に調印した浜口雄幸首相を狙撃した。","血盟団の団員が決起して、井上準之助や団琢磨ら財界の要人を次々に暗殺した。"],"e":"二・二六事件は、皇道派の青年将校が約1400人の兵を率いて決起し、高橋是清蔵相、斎藤実内大臣、渡辺錠太郎教育総監らを殺害した事件です。天皇の意向で反乱軍とされて鎮圧され、のち軍部の政治的発言力が強まりました。犬養首相の暗殺は1932年の五・一五事件、浜口首相の狙撃は1930年、血盟団事件は1932年の別の事件です。","m":"二・二六事件（1936）＝皇道派青年将校の決起、高橋是清らを殺害"},{"id":197,"k":"plan","ref":"想定問題","f":"現代","t":"日本国憲法の公布と施行","y":1946,"q":"日本国憲法の公布と施行の日付の組み合わせとして、正しいものはどれですか。","c":["1946年11月3日に公布され、1947年5月3日に施行された。","1946年5月3日に公布され、1947年11月3日に施行された。","1945年11月3日に公布され、1946年5月3日に施行された。","1947年5月3日に公布され、1948年11月3日に施行された。"],"e":"日本国憲法は、帝国議会での審議を経て1946年11月3日に公布され、半年後の1947年5月3日に施行されました。国民主権・基本的人権の尊重・平和主義を三原則としています。11月3日は現在「文化の日」、5月3日は「憲法記念日」として祝日になっています。公布と施行の日付を入れ替えた選択肢は誤りです。","m":"日本国憲法＝1946.11.3公布、1947.5.3施行"},{"id":198,"k":"plan","ref":"想定問題","f":"現代","t":"日ソ共同宣言と国連加盟","y":1956,"q":"1956年の日ソ共同宣言について、正しい説明はどれですか。","c":["鳩山一郎首相がモスクワで調印し、国交が回復して、日本の国連加盟が実現した。","吉田茂首相がモスクワで調印し、平和条約が結ばれて、北方領土の問題は解決した。","岸信介首相が調印し、国交が回復したが、ソ連の拒否権で日本の国連加盟は見送られた。","鳩山一郎首相がワシントンで調印し、ソ連との戦争状態が正式に終結した。"],"e":"1956年、鳩山一郎首相がモスクワで日ソ共同宣言に調印し、ソ連との国交が回復しました。ソ連が日本の国連加盟に反対しなくなり、同年12月に日本は国連への加盟を実現しました。平和条約は北方領土問題が解決しなかったため結ばれていません。調印したのは吉田茂や岸信介ではなく、場所もモスクワです。","m":"日ソ共同宣言（1956）＝鳩山一郎、国交回復→国連加盟"},{"id":199,"k":"plan","ref":"想定問題","f":"現代","t":"日米安全保障条約の改定","y":1960,"q":"1960年の日米安全保障条約（新安保条約）の改定について、正しい説明はどれですか。","c":["岸信介内閣が改定し、アメリカの日本防衛義務を明記し、事前協議制を設けた。","池田勇人内閣が改定し、アメリカ軍が日本から撤退することを定めた。","佐藤栄作内閣が改定し、沖縄の施政権の返還をあわせて条約の中に定めた。","吉田茂内閣が改定し、日本の再軍備と警察予備隊の創設を新たに定めた。"],"e":"1960年、岸信介内閣は日米相互協力及び安全保障条約（新安保条約）に調印しました。アメリカの日本防衛義務を明記し、在日米軍の配置などに関する事前協議制を設けた一方、経済協力の条項も加えました。強行採決に反対する安保闘争が高まり、条約の成立後に岸内閣は退陣しました。池田・佐藤・吉田の各内閣による改定ではなく、沖縄の返還は1971年の沖縄返還協定で決められました。","m":"新安保条約（1960）＝岸信介内閣、事前協議制、安保闘争"},{"id":200,"k":"plan","ref":"想定問題","f":"現代","t":"日中共同声明","y":1972,"q":"1972年の日中国交正常化について、正しい説明はどれですか。","c":["田中角栄首相が訪中して周恩来首相と日中共同声明に調印し、国交が正常化した。","佐藤栄作首相が訪中して毛沢東と日中共同声明に調印し、日中平和友好条約が結ばれた。","福田赳夫首相が訪中して日中共同声明に調印し、国交が正常化した。","田中角栄首相が訪中して周恩来首相と調印し、日中平和友好条約が結ばれた。"],"e":"1972年、田中角栄首相が中国を訪問して周恩来首相と会談し、日中共同声明に調印して日中の国交を正常化しました。日本は中華人民共和国を中国唯一の合法政府と認め、台湾の中華民国とは断交しました。日中平和友好条約が結ばれたのは1978年の福田赳夫内閣のときで、共同声明の調印とは別の出来事です。","m":"日中共同声明（1972）＝田中角栄・周恩来、平和友好条約は1978年"},{"id":201,"k":"plan","ref":"想定問題","f":"原始・古代","t":"縄文時代の生活","y":-5000,"q":"縄文時代の人々の生活について述べた文として、正しいものはどれですか。","c":["弓矢が使われるようになり、シカやイノシシなどの中・小型の動物を狩った。","石包丁を使って、稲の穂首を刈り取った。","収穫した米を高床倉庫に蓄えた。","有力者は副葬品とともに前方後円墳に葬られた。"],"e":"縄文時代には気候の温暖化で森林が広がり、すばやい中・小型の動物を狩るために弓矢が使われました。土器で煮炊きし、竪穴住居に住みました。「石包丁で稲の穂首を刈る」「高床倉庫に米を蓄える」は、水稲耕作が始まった弥生時代のことです。「前方後円墳に葬られた」のは古墳時代の有力者で、縄文時代ではありません。","m":"縄文＝弓矢・土器・竪穴住居／稲作は弥生から"},{"id":202,"k":"plan","ref":"想定問題","f":"原始・古代","t":"弥生時代の集落と墓制","y":-100,"q":"弥生時代について述べた文として、正しいものはどれですか。","c":["佐賀県の吉野ヶ里遺跡のように、周囲を濠で囲んだ環濠集落がつくられた。","青銅器は主に農具として、鉄器は主に祭器として用いられた。","水稲耕作は北海道や南西諸島にまで広がった。","死者は手足を折り曲げて葬る屈葬が一般的で、甕棺墓は見られなかった。"],"e":"弥生時代には稲作の広まりとともに争いが起こり、吉野ヶ里遺跡のような防御的な環濠集落がつくられました。青銅器（銅鐸・銅剣など）は主に祭器で、鉄器は農具や工具に使われたので、用途が逆です。北海道では続縄文文化、南西諸島では貝塚文化が続き、水稲耕作は広がりませんでした。弥生時代は伸展葬が多く、九州北部では甕棺墓も見られたので、屈葬が一般的という文も誤りです。","m":"弥生＝環濠集落・青銅器は祭器・鉄器は実用"},{"id":203,"k":"plan","ref":"想定問題","f":"原始・古代","t":"奴国の朝貢","y":57,"q":"57年に倭の奴国の王が中国に使いを送り、印綬を受けました。このとき使いを受けた中国の皇帝と、そのことを記した歴史書の組み合わせとして正しいものはどれですか。","c":["光武帝―『後漢書』東夷伝","光武帝―『漢書』地理志","武帝―『後漢書』東夷伝","武帝―『漢書』地理志"],"e":"『後漢書』東夷伝には、57年に倭の奴国の王の使者が洛陽に来て、後漢の光武帝から印綬を与えられたことが記されています。福岡県志賀島で見つかった「漢委奴国王」の金印がこれにあたると考えられています。『漢書』地理志は、紀元前1世紀ごろ倭人が百余国に分かれ楽浪郡に使いを送っていたことを伝える書物です。武帝は前漢の皇帝で、楽浪郡などを置いた人物です。","m":"57年 奴国→後漢の光武帝『後漢書』東夷伝"},{"id":204,"k":"plan","ref":"想定問題","f":"原始・古代","t":"卑弥呼の外交","y":239,"q":"『魏志』倭人伝に記された邪馬台国の女王卑弥呼について述べた文として、正しいものはどれですか。","c":["239年に魏に使いを送り、「親魏倭王」の称号と金印、銅鏡などを授けられた。","中国の南朝の宋に使いを送り、倭王としての地位を認めるよう求めた。","卑弥呼の死後に男王が立つと国内はよくおさまり、そのまま男王の時代が続いた。","邪馬台国には身分の差がなく、大人と下戸の区別もなかった。"],"e":"卑弥呼は239年に魏の皇帝に使いを送り、「親魏倭王」の称号と金印、多数の銅鏡を与えられました。宋に使いを送ったのは5世紀の倭の五王です。卑弥呼の死後は男王が立ったものの国内が乱れ、一族の女性壱与（台与）が王となってようやくおさまりました。倭人伝には大人と下戸などの身分の差があったことが記されています。","m":"卑弥呼 239年 魏→親魏倭王／宋は倭の五王"},{"id":205,"k":"plan","ref":"想定問題","f":"原始・古代","t":"稲荷山古墳出土鉄剣","y":471,"q":"埼玉県の稲荷山古墳から出土した鉄剣について述べた文として、正しいものはどれですか。","c":["「獲加多支鹵大王」の名が刻まれ、5世紀後半にはヤマト政権の勢力が関東地方に及んでいたことがうかがえる。","卑弥呼が魏から与えられたものと考えられ、邪馬台国の位置を示す証拠とされている。","銘文に刻まれた大王は、『宋書』倭国伝に記された倭王讃にあたると考えられている。","銘文は、平安時代に発達したかな文字で記されている。"],"e":"稲荷山古墳の鉄剣の銘文には「獲加多支鹵（ワカタケル）大王」の名があり、熊本県江田船山古墳の大刀の銘も同じ大王を指すとみられます。このことから5世紀後半、大王の勢力が関東から九州中部まで及んでいたと考えられます。ワカタケル大王は倭王讃ではなく倭王武（雄略天皇）にあたるとされます。鉄剣は卑弥呼の時代のものではなく、銘文はかなではなく漢字で刻まれています。","m":"稲荷山鉄剣＝ワカタケル大王＝倭王武"},{"id":206,"k":"plan","ref":"想定問題","f":"原始・古代","t":"氏姓制度","y":500,"q":"ヤマト政権の氏姓制度について述べた文として、正しいものはどれですか。","c":["中央の有力豪族のうち、臣の姓をもつ蘇我氏などから大臣が、連の姓をもつ大伴氏・物部氏などから大連が任じられた。","豪族が私有した民は名代・子代とよばれた。","大王家の直轄地は田荘とよばれた。","地方の豪族は国司に任じられ、その地方の支配をまかされた。"],"e":"ヤマト政権では、豪族を氏として組織し臣・連・君・直などの姓を与えました。中央の政治は臣の蘇我氏から出る大臣と、連の大伴氏・物部氏から出る大連が中心となりました。名代・子代は大王家に属する部民で、豪族の私有民は部曲です。大王家の直轄地は屯倉で、田荘は豪族の私有地です。地方豪族は国造に任じられました。国司は律令制のもとで中央から派遣された役人です。","m":"大臣＝臣・大連＝連／屯倉＝大王、田荘＝豪族"},{"id":207,"k":"plan","ref":"想定問題","f":"原始・古代","t":"遣隋使","y":607,"q":"推古天皇の時代の遣隋使について述べた文として、正しいものはどれですか。","c":["607年に小野妹子が派遣され、翌年には隋の使者裴世清が来日した。","倭の王は隋の皇帝から冊封を受け、倭王の称号を与えられた。","608年に派遣された留学生・学問僧のなかには、最澄や空海がいた。","隋の煬帝は倭の国書を喜び、対等な外交を正式に認めた。"],"e":"607年に小野妹子が隋に派遣され、翌608年には答礼の使者裴世清が来日しました。倭は冊封を受けない立場で国書を送り、煬帝はその国書を無礼として不快に思ったと『隋書』倭国伝は伝えています。608年に同行した留学生・学問僧は高向玄理・旻・南淵請安らで、最澄・空海は平安初期の遣唐使に加わった僧です。","m":"小野妹子607→裴世清608来日／冊封は受けず"},{"id":208,"k":"plan","ref":"想定問題","f":"原始・古代","t":"飛鳥文化の仏師","y":623,"q":"飛鳥文化を代表する法隆寺金堂釈迦三尊像をつくった仏師とされる人物はだれですか。","c":["鞍作鳥（止利仏師）","定朝","運慶","康勝"],"e":"法隆寺金堂釈迦三尊像は623年に鞍作鳥（止利仏師）がつくったと光背の銘に記され、中国の北魏の様式の影響を受けています。定朝は11世紀に平等院鳳凰堂の阿弥陀如来像をつくり寄木造を完成させた仏師です。運慶は鎌倉時代に東大寺南大門金剛力士像などを手がけた仏師、康勝は運慶の子で六波羅蜜寺の空也上人像で知られます。","m":"止利＝飛鳥（法隆寺）、定朝＝平安、運慶＝鎌倉"},{"id":209,"k":"plan","ref":"想定問題","f":"原始・古代","t":"改新の詔","y":646,"q":"646年に出されたとされる改新の詔について述べた文として、正しいものはどれですか。","c":["豪族の私有地・私有民を廃止し、公地公民への移行をめざす方針が示された。","詔が出されたときの都は、近江大津宮であった。","詔が出される前年、中大兄皇子は壬申の乱で大友皇子を破った。","この詔によって、初めての全国的な戸籍である庚午年籍がつくられた。"],"e":"改新の詔は、豪族の田荘・部曲を廃して公地公民制へ移ることや、戸籍・計帳・班田収授などの方針を示したものです。このときの都は難波長柄豊碕宮で、近江大津宮は667年の遷都先です。前年の645年に起こったのは、蘇我入鹿を倒した乙巳の変です。壬申の乱は672年、大海人皇子が大友皇子を破った戦いです。庚午年籍は670年に天智天皇のもとでつくられました。","m":"改新の詔646＝公地公民の方針（都は難波）"},{"id":210,"k":"plan","ref":"想定問題","f":"原始・古代","t":"白村江の敗戦後の防衛","y":664,"q":"663年の白村江の戦いののち、倭（日本）がとった対応として正しいものはどれですか。","c":["大宰府を守るために水城を築き、朝鮮式山城の大野城などを各地に設けた。","唐・新羅の連合軍に勝利したことで、百済の復興を実現した。","東北地方の防衛を強めるため、陸奥に多賀城を築いた。","敗戦の直後に都を平城京に移し、律令を完成させた。"],"e":"白村江の戦いで唐・新羅の連合軍に大敗した倭は、侵攻に備えて対馬・壱岐・筑紫に防人と烽を置き、大宰府の北に水城を、亡命した百済の貴族の指導で大野城・基肄城などの朝鮮式山城を築きました。百済の復興は失敗に終わりました。多賀城は8世紀前半に東北経営の拠点として築かれたもので、防衛の対象も異なります。このあと移った都は近江大津宮で、平城京遷都は710年です。","m":"白村江663→水城・大野城・防人・烽"},{"id":211,"k":"plan","ref":"想定問題","f":"原始・古代","t":"天武天皇の政治","y":684,"q":"壬申の乱に勝利して即位した天武天皇の政策として、正しいものはどれですか。","c":["八色の姓を定め、豪族を天皇中心の新しい身分秩序に組み入れた。","大宝律令を完成させ、律令による政治のしくみを整えた。","藤原京を造営し、そこに都を移した。","近江大津宮で即位し、近江令を定めた。"],"e":"天武天皇（大海人皇子）は672年の壬申の乱で大友皇子を破り、飛鳥浄御原宮で即位しました。684年には八色の姓を定め、真人・朝臣などの姓で豪族を天皇中心の秩序に組み入れました。大宝律令の完成は701年の文武天皇のとき、藤原京遷都は694年の持統天皇のときです。近江大津宮で即位したのは天智天皇です。","m":"天武＝飛鳥浄御原宮・八色の姓（684）"},{"id":212,"k":"plan","ref":"想定問題","f":"原始・古代","t":"律令の官制","y":701,"q":"律令制のもとでの官制について述べた文として、正しいものはどれですか。","c":["中央には神祇官と太政官が置かれ、太政官のもとで八省が政務を分担した。","郡司には中央から貴族が派遣され、任期は6年と定められた。","九州には外交と防衛にあたる鎮守府が置かれた。","京の行政・治安は大宰府が担当した。"],"e":"律令の中央官制は、祭祀をつかさどる神祇官と、政治を担う太政官の二官があり、太政官のもとで八省が政務を分けて受け持ちました。中央から派遣されたのは国司で、郡司には地方の豪族（旧国造など）が任じられ、終身の職でした。九州に置かれ外交・防衛にあたったのは大宰府で、鎮守府は陸奥に置かれた蝦夷対策の機関です。京の行政は京職が担当しました。","m":"二官八省／国司＝中央派遣、郡司＝地方豪族"},{"id":213,"k":"plan","ref":"想定問題","f":"原始・古代","t":"長屋王の変","y":729,"q":"729年の長屋王の変について述べた文として、正しいものはどれですか。","c":["左大臣長屋王が謀反の疑いをかけられて自害し、その後、光明子が皇后に立てられた。","長屋王は九州で挙兵したが、政府軍によって鎮められた。","変の後に政権を握った藤原四子が病死すると、道鏡が実権を握った。","長屋王は藤原不比等の子で、藤原氏の勢力を代表していた。"],"e":"長屋王の変では、天武天皇の孫で左大臣の長屋王が、藤原四子（武智麻呂・房前・宇合・麻呂）の策謀により自害に追い込まれ、その後、不比等の娘光明子が皇族以外から初めて皇后となりました。九州で挙兵したのは740年の藤原広嗣です。藤原四子が737年に天然痘で相次いで亡くなった後に政権を担ったのは橘諸兄で、道鏡が台頭するのはさらに後です。長屋王は高市皇子の子で、不比等の子ではありません。","m":"長屋王の変729→光明子立后（藤原四子）"},{"id":214,"k":"plan","ref":"想定問題","f":"原始・古代","t":"記紀の編纂","y":716,"q":"8世紀初めにまとめられた『古事記』と『日本書紀』について述べた文として、正しいものはどれですか。","c":["『日本書紀』は舎人親王らが編纂し、漢文の編年体で記された、六国史の最初の書物である。","『古事記』は、太安万侶がよみならわしていた内容を稗田阿礼が筆録したものである。","『古事記』は六国史の一つで、神代から持統天皇までを扱っている。","『日本書紀』は、平安時代に発達したかな文字で記されている。"],"e":"『日本書紀』は720年に舎人親王らが完成させた歴史書で、中国の正史にならい漢文の編年体で書かれ、のちの六国史の最初にあたります。『古事記』（712年）は、稗田阿礼がよみならわしていた帝紀・旧辞を太安万侶が筆録したもので、役割が逆になっています。『古事記』は六国史に含まれず、推古天皇までを扱います。『日本書紀』も漢文で書かれ、かなではありません。","m":"古事記712＝阿礼→安万侶／書紀720＝舎人親王"},{"id":215,"k":"plan","ref":"想定問題","f":"原始・古代","t":"嵯峨天皇と令外官","y":810,"q":"9世紀初めの嵯峨天皇の政治について述べた文として、正しいものはどれですか。","c":["平城太上天皇と対立する中で、機密の文書を扱う蔵人頭を置き、藤原冬嗣らを任じた。","勘解由使を初めて置き、国司の交替を厳しく監督させた。","延喜格式を編纂させ、律令を補う法を整えた。","京の治安を守るために鎮守府を置いた。"],"e":"嵯峨天皇は810年、平城太上天皇との対立（平城太上天皇の変）の際に蔵人頭を置き、藤原冬嗣・巨勢野足を任じました。また京の警察・裁判を担う検非違使を置き、弘仁格式を編纂させました。勘解由使は桓武天皇が置いた令外官です。延喜格式は10世紀の醍醐天皇の時代のものです。京の治安を担ったのは検非違使で、鎮守府は陸奥の蝦夷対策の機関です。","m":"嵯峨＝蔵人頭・検非違使・弘仁格式"},{"id":216,"k":"plan","ref":"想定問題","f":"原始・古代","t":"承平・天慶の乱","y":939,"q":"10世紀前半に起こった承平・天慶の乱について述べた文として、正しいものはどれですか。","c":["平将門は常陸・下野・上野などの国府を攻め落として新皇と称したが、平貞盛と藤原秀郷に討たれた。","藤原純友は東国で反乱を起こし、源義家によって鎮められた。","平将門は瀬戸内海の海賊を率いて大宰府を攻め落とした。","乱の鎮圧にあたったのは、すべて朝廷が都から派遣した貴族の軍隊であった。"],"e":"平将門は下総を拠点に一族の争いから反乱へ進み、常陸・下野・上野などの国府を攻略して新皇と称しましたが、940年に平貞盛・藤原秀郷に討たれました。一方、もと伊予の国司であった藤原純友は瀬戸内海の海賊を率いて大宰府を攻めましたが、小野好古・源経基らに鎮められました。乱の鎮圧は地方の武士の力によるところが大きく、朝廷は武士の実力を知ることになりました。源義家は11世紀後半の人物です。","m":"東の将門（新皇）・西の純友（瀬戸内）"},{"id":217,"k":"plan","ref":"想定問題","f":"中世","t":"保元の乱","y":1156,"q":"1156年に起こった保元の乱について述べた文として、正しいものはどれですか。","c":["後白河天皇方が平清盛・源義朝らの武力で勝利し、崇徳上皇は讃岐に流された。","崇徳上皇方が勝利し、後白河天皇は隠岐に流された。","平清盛と源義朝が対立し、敗れた義朝は東国へ逃れる途中で討たれた。","左大臣藤原頼長は後白河天皇方について勝利し、摂政となった。"],"e":"鳥羽法皇の死後、皇位継承をめぐる崇徳上皇と後白河天皇の対立に、摂関家の藤原頼長と忠通の争いが結びついて保元の乱が起こりました。後白河天皇方が平清盛・源義朝らを動員して勝ち、崇徳上皇は讃岐に流され、頼長は戦死しました。清盛と義朝が戦い義朝が敗れたのは1159年の平治の乱です。頼長は崇徳上皇方で敗れています。","m":"保元1156＝崇徳vs後白河／平治1159＝清盛vs義朝"},{"id":218,"k":"plan","ref":"想定問題","f":"中世","t":"平清盛の政権","y":1167,"q":"平清盛が築いた政権について述べた文として、正しいものはどれですか。","c":["娘の徳子を高倉天皇の中宮とし、その子が安徳天皇として即位すると外戚として権勢をふるった。","征夷大将軍に任じられ、福原に幕府を開いた。","武士として初めて摂政に任じられ、天皇にかわって政治を行った。","後白河法皇と最後まで協調し、院政を支え続けた。"],"e":"平清盛は1167年に武士として初めて太政大臣となり、娘の徳子（建礼門院）を高倉天皇の中宮に入れ、その子安徳天皇の外祖父として権力をふるいました。征夷大将軍に任じられ幕府を開いたのは源頼朝です。清盛が就いたのは太政大臣で、摂政ではありません。清盛は1179年に後白河法皇を幽閉して院政を停止しており、協調し続けたわけではありません。","m":"清盛＝太政大臣1167・外戚（安徳天皇）"},{"id":219,"k":"plan","ref":"想定問題","f":"中世","t":"守護と地頭の設置","y":1185,"q":"1185年に源頼朝が全国に設置を認められた守護と地頭について述べた文として、正しいものはどれですか。","c":["守護は国ごとに置かれ、大番催促と謀反人・殺害人の逮捕を主な職務とした。","守護・地頭の設置は、平氏の追討を名目に後鳥羽上皇から認められた。","地頭は国ごとに一人ずつ置かれ、国司にかわって国衙の政治を行った。","地頭には、全国一律に田地1段につき5升の加徴米が初めから認められていた。"],"e":"守護は国ごとに主に東国の有力御家人が任じられ、大番催促・謀反人の逮捕・殺害人の逮捕（大犯三カ条）を職務としました。設置は、源義経の追討を名目に後白河法皇から認められたものです。地頭は荘園や公領ごとに置かれ、年貢の徴収や土地の管理、治安維持にあたりました。段別5升の加徴米は、承久の乱後に定められた新補率法による取り分です。","m":"守護＝国ごと・大犯三カ条／地頭＝荘園・公領ごと"},{"id":220,"k":"plan","ref":"想定問題","f":"中世","t":"承久の乱","y":1221,"q":"1221年の承久の乱について述べた文として、正しいものはどれですか。","c":["乱の後、京都に六波羅探題が置かれ、朝廷の監視や西国の御家人の統轄にあたった。","後鳥羽上皇は佐渡に、順徳上皇は隠岐に流された。","上皇方から没収した所領は朝廷に返還され、幕府の力は西国には及ばなかった。","後鳥羽上皇は、執権北条時頼を追討せよとの命令を出した。"],"e":"後鳥羽上皇は執権北条義時の追討を命じて挙兵しましたが、北条泰時・時房の率いる幕府軍に敗れました。後鳥羽上皇は隠岐に、順徳上皇は佐渡に流されています。乱後、京都に六波羅探題が置かれ、朝廷の監視と西国御家人の統轄にあたりました。上皇方の所領3000余カ所は没収されて御家人が新補地頭に任じられ、幕府の力は西国にも広く及ぶようになりました。","m":"承久の乱1221→六波羅探題・新補地頭"},{"id":221,"k":"plan","ref":"想定問題","f":"中世","t":"御成敗式目","y":1232,"q":"1232年に制定された御成敗式目について述べた文として、正しいものはどれですか。","c":["頼朝以来の先例や、武家社会の道理とよばれた慣習をもとに定められた。","制定されると朝廷の支配下にもそのまま適用され、公家法は廃止された。","執権北条時宗が、蒙古襲来に備えるために制定した。","女性が所領を相続することは、いっさい認められなかった。"],"e":"御成敗式目は執権北条泰時が、頼朝以来の先例や武家社会の道理をもとに、御家人どうしや御家人と荘園領主の紛争を公平に裁くための基準として定めた51カ条の法です。適用されるのは幕府の勢力の範囲で、朝廷の支配下では公家法、荘園では本所法がなお効力をもちました。時宗は蒙古襲来時の執権です。当時は女性にも所領の相続が認められ、女性が地頭になる例もありました。","m":"御成敗式目1232＝泰時・先例と道理・51カ条"},{"id":222,"k":"plan","ref":"想定問題","f":"中世","t":"引付の設置","y":1249,"q":"5代執権北条時頼の政治について述べた文として、正しいものはどれですか。","c":["御家人の所領に関する訴訟を迅速・公正に処理するため、評定衆のもとに引付衆を置いた。","執権を補佐する連署を初めて設け、叔父の北条時房を任じた。","有力御家人による合議機関として、評定衆を初めて置いた。","後鳥羽上皇の挙兵に対し、幕府軍を率いて京都を攻めた。"],"e":"北条時頼は1247年の宝治合戦で三浦泰村一族を滅ぼして北条氏の地位を固め、1249年には評定衆のもとに引付衆を置いて、御家人の所領に関する訴訟の処理を迅速・公正にしようとしました。連署を設けて時房を任じたこと、評定衆を置いたことは3代執権北条泰時の政策です。後鳥羽上皇の挙兵（承久の乱）で京都に攻め上ったのは泰時・時房です。","m":"時頼＝宝治合戦・引付衆／泰時＝連署・評定衆"},{"id":223,"k":"plan","ref":"想定問題","f":"中世","t":"蒙古襲来と幕府の防備","y":1276,"q":"13世紀後半の蒙古襲来（元寇）について述べた文として、正しいものはどれですか。","c":["文永の役ののち、幕府は博多湾の沿岸に石塁（防塁）を築かせ、異国警固番役を強化した。","文永の役では、元は高麗の軍勢を伴わず単独で日本に攻め寄せた。","弘安の役で元軍は長門に上陸し、京都の近くまで攻め上った。","元の襲来を受けたときの執権は北条泰時であった。"],"e":"1274年の文永の役で元・高麗の連合軍が博多湾に上陸した後、幕府は九州の御家人らに異国警固番役を課して警備を強化し、博多湾沿岸に石塁（防塁）を築かせました。1281年の弘安の役では、東路軍と江南軍が攻め寄せましたが、防塁などに阻まれて上陸できず、暴風雨により大損害を受けました。文永の役にも高麗軍が加わっています。襲来時の執権は北条時宗です。","m":"文永1274→防塁・異国警固番役→弘安1281"},{"id":224,"k":"plan","ref":"想定問題","f":"中世","t":"永仁の徳政令","y":1297,"q":"1297年に鎌倉幕府が出した永仁の徳政令について述べた文として、正しいものはどれですか。","c":["御家人が質入れや売却をした所領を、原則として無償で取り戻させることを定めた。","土一揆の要求に応じて出され、民衆の借金をすべて帳消しにした。","執権北条時宗が、蒙古襲来での恩賞の不足を補うために出した。","この法令によって御家人の窮乏は解消され、幕府の支配は安定した。"],"e":"永仁の徳政令は執権北条貞時のとき、困窮した御家人を救うため、所領の質入れ・売買を禁じ、すでに手放した所領を原則として無償で取り戻させたものです（御家人どうしで20年以上たったものなどは除く）。土一揆が徳政を求めるのは室町時代の正長の土一揆以降です。時宗は1284年に亡くなっています。御家人は以後金融を受けにくくなり、窮乏はかえって深まりました。","m":"永仁の徳政令1297＝貞時・御家人の所領を取り戻す"},{"id":225,"k":"plan","ref":"想定問題","f":"中世","t":"鎌倉新仏教の開祖と著書","y":1224,"q":"鎌倉時代に新しい宗派を開いた僧とその著書の組み合わせとして、正しいものはどれですか。","c":["親鸞―『教行信証』","法然―『正法眼蔵』","日蓮―『興禅護国論』","道元―『立正安国論』"],"e":"親鸞は浄土真宗の開祖で、『教行信証』を著しました。法然の主著は『選択本願念仏集』です。『正法眼蔵』は曹洞宗を開いた道元の著書、『興禅護国論』は臨済宗を伝えた栄西の著書、『立正安国論』は日蓮宗（法華宗）を開いた日蓮が北条時頼に提出した書物です。誤りの選択肢は、著者と書名を入れかえたものです。","m":"親鸞『教行信証』道元『正法眼蔵』日蓮『立正安国論』"},{"id":226,"k":"plan","ref":"想定問題","f":"中世","t":"東大寺再建と金剛力士像","y":1203,"q":"鎌倉時代初めの東大寺の再建について述べた文として、正しいものはどれですか。","c":["東大寺南大門の金剛力士像は、運慶・快慶らが寄木造の技法で制作した。","東大寺南大門は、禅宗様（唐様）の代表的な建築である。","再建は、承久の乱で焼けた東大寺を復興するために行われた。","再建にあたって、興福寺の無著・世親像を定朝がつくった。"],"e":"平重衡の南都焼打ち（1180年）で焼けた東大寺は、重源が勧進して再建されました。南大門には宋から伝わった大仏様が用いられ、門内の金剛力士像は1203年に運慶・快慶らが寄木造で短期間につくりました。禅宗様の代表は円覚寺舎利殿です。焼失の原因は承久の乱ではありません。興福寺の無著・世親像は運慶らの作で、定朝は平安時代中期の仏師です。","m":"南大門＝大仏様・金剛力士像（運慶・快慶）"},{"id":227,"k":"plan","ref":"想定問題","f":"中世","t":"建武の新政","y":1334,"q":"後醍醐天皇による建武の新政について述べた文として、正しいものはどれですか。","c":["中央に記録所や雑訴決断所が置かれ、地方には陸奥将軍府・鎌倉将軍府が設けられた。","後醍醐天皇は摂政・関白を置き、政治を藤原氏にゆだねた。","足利尊氏は征夷大将軍に任じられ、新政の中心となった。","武士の慣習を尊重したため武士の強い支持を集め、新政は長く続いた。"],"e":"建武の新政では、中央に記録所・雑訴決断所・恩賞方・武者所などが置かれ、地方には陸奥将軍府・鎌倉将軍府が設けられました。後醍醐天皇は摂政・関白を置かず、天皇親政をめざしました。新政で征夷大将軍に任じられたのは護良親王で、尊氏ではありません。土地の権利の確認に天皇の綸旨を必要としたことなどが武士の慣習を無視するものとして不満を招き、新政は2年あまりで崩れました。","m":"建武の新政＝記録所・雑訴決断所・将軍府"},{"id":228,"k":"plan","ref":"想定問題","f":"中世","t":"室町幕府の機構","y":1390,"q":"室町幕府のしくみについて述べた文として、正しいものはどれですか。","c":["将軍を補佐する管領には、細川・斯波・畠山の三氏が交代で任じられた。","侍所の長官である所司には、北条氏の一門が任じられた。","管領には、赤松・一色・山名・京極の四氏が交代で任じられた。","関東を治める鎌倉府の長官は九州探題とよばれた。"],"e":"室町幕府では、将軍を補佐する管領に足利氏一門の細川・斯波・畠山の三氏（三管領）が交代で就きました。京都の警備や刑事裁判を担う侍所の長官（所司）には、赤松・一色・山名・京極の四氏（四職）が任じられました。北条氏は鎌倉幕府の執権の家で、室町幕府の要職には就いていません。鎌倉府の長官は鎌倉公方で、九州探題は九州の統治にあたった機関です。","m":"三管領＝細川・斯波・畠山／四職＝赤松・一色・山名・京極"},{"id":229,"k":"plan","ref":"想定問題","f":"中世","t":"足利義満と守護の統制","y":1391,"q":"3代将軍足利義満が行ったこととして、正しいものはどれですか。","c":["明徳の乱で、一族で11カ国の守護を兼ねていた山名氏清らを討った。","応永の乱で、鎌倉公方足利持氏を滅ぼした。","南北朝の合一を実現し、北朝の天皇が南朝の天皇に位を譲る形をとった。","播磨の守護赤松満祐を討ち、将軍の権力を強めた。"],"e":"足利義満は有力守護の勢力をおさえ、1391年の明徳の乱で、一族で全国66カ国のうち11カ国の守護を兼ね「六分の一殿」とよばれた山名氏清らを討ちました。1399年の応永の乱で討ったのは大内義弘で、持氏を滅ぼしたのは6代義教の永享の乱です。1392年の南北朝の合一は、南朝の後亀山天皇が北朝の後小松天皇に譲位する形でした。赤松満祐は1441年に義教を殺害した人物です。","m":"義満＝明徳の乱（山名）・応永の乱（大内）"},{"id":230,"k":"plan","ref":"想定問題","f":"中世","t":"嘉吉の変と徳政一揆","y":1441,"q":"1441年の出来事について述べた文として、正しいものはどれですか。","c":["6代将軍足利義教が播磨の守護赤松満祐に殺され、同じ年の嘉吉の徳政一揆に対して幕府は徳政令を出した。","8代将軍足利義政が赤松満祐に殺され、その跡継ぎ争いから応仁の乱が起こった。","嘉吉の徳政一揆は近江坂本の馬借の蜂起から始まり、幕府は徳政令を出さなかった。","赤松満祐は幕府軍に勝利し、播磨で独立した政権を長く保った。"],"e":"1441年、専制的な政治を行った6代将軍足利義教が赤松満祐に殺されました（嘉吉の変）。満祐はまもなく山名持豊らに討たれています。同じ年、数万人の土一揆が京都を占拠して「代始めの徳政」を要求し、幕府は初めて徳政令を出しました。近江坂本の馬借の蜂起から始まり、幕府が徳政令を出さなかったのは1428年の正長の徳政一揆です。義政は義教の子で、殺されてはいません。","m":"嘉吉の変1441＝義教殺害／嘉吉の一揆→初の徳政令"},{"id":231,"k":"plan","ref":"想定問題","f":"中世","t":"応仁の乱","y":1467,"q":"1467年に始まった応仁の乱について述べた文として、正しいものはどれですか。","c":["将軍家や畠山・斯波両家の家督争いに、細川勝元と山名持豊の対立がからんで起こった。","細川勝元が西軍、山名持豊が東軍の中心となった。","戦いは1年ほどで終わり、京都はほとんど被害を受けなかった。","この乱の結果、将軍の権威が高まり、守護大名はみな京都に住むようになった。"],"e":"応仁の乱は、将軍足利義政の後継をめぐる義視と義尚の争いや、畠山・斯波両家の家督争いに、幕府の実権を争う細川勝元（東軍）と山名持豊（宗全、西軍）の対立が結びついて起こりました。戦乱は11年に及び、足軽の活動もあって京都は荒廃しました。乱後は将軍の権威が衰え、守護の多くは領国に下って、各地で下剋上の風潮が強まりました。","m":"東軍＝細川勝元・西軍＝山名持豊（11年）"},{"id":232,"k":"plan","ref":"想定問題","f":"中世","t":"山城の国一揆と加賀の一向一揆","y":1486,"q":"15世紀後半に起こった山城の国一揆と加賀の一向一揆について述べた文として、正しいものはどれですか。","c":["山城の国一揆では、国人と農民が畠山氏の両軍を国外に退去させ、8年間にわたって自治を行った。","加賀の一向一揆は、守護の赤松氏を倒して約100年間加賀を支配した。","加賀の一向一揆の中心となったのは、日蓮宗（法華宗）の信者であった。","山城の国一揆は、約100年間にわたって南山城を支配した。"],"e":"1485年、南山城の国人たちは農民の支持を得て、争っていた畠山義就・政長の両軍を国外に退去させ、8年間自治を行いました（山城の国一揆）。1488年には、浄土真宗（一向宗）の門徒が国人と結んで守護の富樫政親を倒し、その後約100年にわたって加賀を実質的に支配しました（加賀の一向一揆）。守護は赤松氏ではなく富樫氏で、約100年続いたのは加賀の一向一揆の方です。","m":"山城の国一揆＝8年／加賀一向一揆＝富樫を倒し約100年"},{"id":233,"k":"plan","ref":"想定問題","f":"中世","t":"室町時代の商業と金融","y":1470,"q":"室町時代の商業・金融について述べた文として、正しいものはどれですか。","c":["応仁の乱の後には、月に6回開かれる六斎市が一般化した。","京都の土倉・酒屋は幕府に保護され、税を課されることはなかった。","陸上の物資輸送は、問丸が馬を使って行った。","大山崎の油座は、延暦寺を本所として油の販売を独占した。"],"e":"室町時代には定期市の回数が増え、応仁の乱の後には月6回の六斎市が一般化しました。高利貸しを営んだ土倉・酒屋は、幕府から土倉役・酒屋役を課され、幕府の重要な財源となりました。陸上輸送を担ったのは馬借・車借で、問丸（のちの問屋）は港などで商品の保管や中継ぎをしました。大山崎の油座の本所は石清水八幡宮です。","m":"六斎市・土倉役酒屋役・馬借・大山崎油座＝石清水"},{"id":234,"k":"plan","ref":"想定問題","f":"中世","t":"東山文化","y":1489,"q":"8代将軍足利義政の時代を中心とする東山文化について述べた文として、正しいものはどれですか。","c":["慈照寺東求堂同仁斎は、書院造の代表的な建築である。","足利義政は北山の山荘に金閣を建てた。","雪舟は狩野派を開き、水墨画と大和絵を融合させた。","村田珠光は北山文化の時代に、茶の湯を大成して侘茶を完成させた。"],"e":"東山文化を代表する慈照寺東求堂同仁斎は、付書院・違い棚を備えた書院造の代表例です。金閣は3代将軍足利義満が北山に建てたもので、義政が東山に建てたのは銀閣です。雪舟は明で学び日本的な水墨画を大成した画僧で、水墨画と大和絵を融合させ狩野派を開いたのは狩野正信・元信父子です。村田珠光は東山文化の時代の人で、侘茶を始め、のちに千利休が大成しました。","m":"東山＝銀閣・東求堂同仁斎（書院造）・雪舟"},{"id":235,"k":"plan","ref":"想定問題","f":"近世","t":"鉄砲の伝来","y":1543,"q":"16世紀の鉄砲の伝来について述べた文として、正しいものはどれですか。","c":["1543年、ポルトガル人を乗せた中国人倭寇の船が種子島に漂着し、鉄砲が伝えられた。","スペイン人を乗せた船が平戸に来航し、鉄砲が伝えられた。","鉄砲は輸入に頼り、国内で生産されることはなかった。","鉄砲の伝来は、ザビエルによるキリスト教の伝来よりも後のことである。"],"e":"1543年、ポルトガル人を乗せた中国人倭寇の船が種子島に漂着し、領主の種子島時堯が鉄砲を買い求めました。鉄砲はまもなく和泉の堺、紀伊の根来・雑賀、近江の国友などで大量に生産されるようになり、戦い方や城の造りを変えました。スペイン人が肥前の平戸に来航したのは1584年で、鉄砲の伝来とは関係がありません。ザビエルが鹿児島に来たのは1549年で、鉄砲伝来の方が先です。","m":"1543 種子島に鉄砲→堺・国友で生産"},{"id":236,"k":"plan","ref":"想定問題","f":"近世","t":"天正遣欧使節","y":1582,"q":"1582年に派遣された天正遣欧使節について述べた文として、正しいものはどれですか。","c":["宣教師ヴァリニャーニのすすめで、大友義鎮・有馬晴信・大村純忠が少年使節をローマ教皇のもとへ送った。","仙台藩主伊達政宗が、家臣の支倉常長をスペインに派遣した。","織田信長の命令によって派遣され、ポルトガル国王との通商条約を結んだ。","使節が帰国したとき、キリスト教の布教は豊臣秀吉によって全面的に保護されていた。"],"e":"天正遣欧使節は、イエズス会のヴァリニャーニのすすめで九州のキリシタン大名大友義鎮（宗麟）・有馬晴信・大村純忠が、伊東マンショら4人の少年をローマ教皇のもとへ送ったものです。伊達政宗が支倉常長を派遣したのは1613年の慶長遣欧使節です。使節は信長の命によるものではありません。1590年の帰国時には、すでに1587年のバテレン追放令が出されていました。","m":"天正遣欧使節＝ヴァリニャーニ・九州3大名・伊東マンショ"},{"id":237,"k":"plan","ref":"想定問題","f":"近世","t":"織田信長の政策","y":1577,"q":"織田信長の政策や戦いについて述べた文として、正しいものはどれですか。","c":["安土城下に楽市令を出し、商工業者に自由な営業活動を認めた。","長篠合戦で、武田信玄の率いる軍を破った。","一向宗（浄土真宗）を保護し、各地の一向一揆と同盟を結んだ。","支配地の各地に関所を新たに設け、関銭を徴収して財源とした。"],"e":"信長は1577年、安土山下町に楽市令を出し、座の特権を否定して商工業者の自由な営業を認めました。1575年の長篠合戦で、徳川家康と連合して鉄砲を活用して破ったのは武田勝頼の軍です。信長は1571年に比叡山延暦寺を焼打ちにし、伊勢長島や越前の一向一揆を鎮圧し、石山本願寺（顕如）とは10年余り戦った末に1580年に退去させており、一向宗と同盟を結んだわけではありません。信長は関所を撤廃して流通の円滑化をはかりました。","m":"信長＝楽市令・関所撤廃・長篠（勝頼）"},{"id":238,"k":"plan","ref":"想定問題","f":"近世","t":"太閤検地の方法","y":1590,"q":"豊臣秀吉が行った太閤検地について述べた文として、正しいものはどれですか。","c":["土地の面積の単位を統一し、1段を300歩とした。","年貢を量る升は、地域ごとに異なるものをそのまま用いた。","土地の生産力は、銭の額で表す貫高で示された。","検地帳には荘園領主の名が記され、実際に耕作する百姓の名は記されなかった。"],"e":"太閤検地では、それまで1段＝360歩とされることが多かった面積の単位を1段＝300歩に統一し、升も京枡に統一しました。そのうえで田畑の等級を定め、生産力を米の量で表す石高で示しました。貫高は戦国大名の検地などで用いられた方法です。検地帳には実際に耕作する百姓を登録し（一地一作人）、その百姓に年貢を納める責任を負わせました。","m":"太閤検地＝1段300歩・京枡・石高・一地一作人"},{"id":239,"k":"plan","ref":"想定問題","f":"近世","t":"バテレン追放令","y":1587,"q":"1587年に豊臣秀吉が出したバテレン追放令について述べた文として、正しいものはどれですか。","c":["宣教師の国外退去を命じたが、南蛮貿易は奨励したため、禁教は徹底しなかった。","宣教師の追放とともに、ポルトガルとの南蛮貿易も全面的に禁止した。","サン＝フェリペ号事件をきっかけに出された。","江戸幕府によって全国に出された最初の禁教令である。"],"e":"秀吉は九州平定の際、大村純忠が長崎をイエズス会に寄進していたことなどを知り、1587年に博多でバテレン追放令を出して宣教師の国外退去を命じました。しかし南蛮貿易は奨励したため、取り締まりは不徹底に終わりました。サン＝フェリペ号事件は1596年で、その後に26聖人殉教が起こっています。江戸幕府の禁教令は1612年（直轄領）・1613年（全国）に出されました。","m":"バテレン追放令1587＝宣教師追放・貿易は奨励"},{"id":240,"k":"plan","ref":"想定問題","f":"近世","t":"武家諸法度寛永令","y":1635,"q":"江戸幕府の武家諸法度について述べた文として、正しいものはどれですか。","c":["3代将軍徳川家光が出した寛永令で、大名の参勤交代が制度として定められた。","元和令は林羅山が起草し、3代将軍徳川家光の名で出された。","寛永令では、大名の妻子は国元に住むよう定められた。","大名が居城を修理するときは、幕府に届け出なくてもよいとされた。"],"e":"1635年の寛永令は林羅山が起草し、3代将軍家光の名で出されたもので、大名に1年おきの江戸と国元の往復（参勤交代）を義務づけ、500石積以上の大船の建造を禁じました。1615年の元和令は金地院崇伝が起草し、2代将軍秀忠の名で出されました。参勤交代のもとで大名の妻子は江戸に住むこととされました。居城の修理には幕府への届け出が必要でした。","m":"元和令1615＝崇伝・秀忠／寛永令1635＝羅山・家光・参勤交代"},{"id":241,"k":"plan","ref":"想定問題","f":"近世","t":"紫衣事件","y":1627,"q":"1627年に起こった紫衣事件について述べた文として、正しいものはどれですか。","c":["幕府は天皇が与えた紫衣の勅許を無効とし、これに抗議した大徳寺の沢庵らを処罰した。","事件の後、後水尾天皇が譲位し、孝明天皇が即位した。","事件の解決のために、幕府は初めて禁中並公家諸法度を定めた。","幕府は紫衣の勅許を認め、朝廷の権限を広げた。"],"e":"後水尾天皇が幕府の許可なく大徳寺などの僧に紫衣着用を許したことを、幕府は禁中並公家諸法度に反するとして無効とし、抗議した沢庵らを処罰しました。この事件は、幕府の法が天皇の勅許より優先することを示しました。後水尾天皇はその後譲位し、娘の明正天皇が奈良時代以来の女性天皇として即位しました。禁中並公家諸法度は1615年に定められており、事件より前です。","m":"紫衣事件＝沢庵処罰→明正天皇へ譲位"},{"id":242,"k":"plan","ref":"想定問題","f":"近世","t":"田畑永代売買の禁止","y":1643,"q":"1643年に江戸幕府が出した田畑永代売買の禁止令について述べた文として、正しいものはどれですか。","c":["寛永の飢饉の後、本百姓の没落を防ぐために田畑の売買を禁じた。","享保の改革の一つとして出され、質流れによる土地の移動を公認した。","百姓が田畑でたばこや木綿などを自由に栽培することを奨励した。","幕府の財政を立て直すため、田畑の売買に新たな税をかけた。"],"e":"1641〜42年の寛永の飢饉で多くの百姓が困窮したことから、幕府は1643年に田畑永代売買の禁止令を出し、年貢を負担する本百姓が土地を失って没落するのを防ごうとしました。1673年の分地制限令も同じ目的です。この法令は17世紀前半のもので、享保の改革ではありません。幕府は田畑勝手作りの禁で、田畑にたばこなどの商品作物を自由に作ることを制限していました。","m":"田畑永代売買禁止1643＝寛永の飢饉後・本百姓維持"},{"id":243,"k":"plan","ref":"想定問題","f":"近世","t":"河村瑞賢と海運","y":1672,"q":"17世紀後半、幕府の命を受けて東廻り海運・西廻り海運を整備した江戸の商人はだれですか。","c":["河村瑞賢","角倉了以","茶屋四郎次郎","淀屋辰五郎"],"e":"河村瑞賢は1671年に東廻り海運、1672年に出羽の酒田から日本海沿岸・下関・瀬戸内海を経て大坂に至る西廻り海運を整備しました。また大坂の安治川を開削しています。角倉了以は17世紀初めに富士川・高瀬川などの水路を開いた京都の豪商です。茶屋四郎次郎は朱印船貿易で知られる京都の豪商、淀屋辰五郎は大坂の豪商で、ぜいたくをとがめられ財産を没収されました。","m":"東廻り・西廻り海運＝河村瑞賢／高瀬川＝角倉了以"},{"id":244,"k":"plan","ref":"想定問題","f":"近世","t":"上げ米と足高の制","y":1722,"q":"8代将軍徳川吉宗が行った上げ米・足高の制について述べた文として、正しいものはどれですか。","c":["上げ米では、大名に1万石につき100石を上納させるかわりに、参勤交代で江戸にいる期間を半年に縮めた。","足高の制は、役職についた旗本の家禄を永久に引き上げる制度であった。","上げ米は、老中松平定信が寛政の改革の中で始めた。","上げ米の実施によって、参勤交代は廃止された。"],"e":"上げ米は1722年に始められ、大名に1万石につき100石の米を上納させるかわりに、参勤交代での江戸在府期間を1年から半年に縮めました。財政が好転したため1731年に停止されています。1723年の足高の制は、家禄の少ない者を高い役職に就ける際、在職中だけ不足分を補う制度で、家禄を永久に増やすものではありませんでした。どちらも享保の改革の政策で、参勤交代は廃止されていません。","m":"上げ米＝1万石に100石・在府半年／足高＝在職中だけ"},{"id":245,"k":"plan","ref":"想定問題","f":"近世","t":"田沼意次の政治","y":1772,"q":"18世紀後半、老中田沼意次が行った政策として、正しいものはどれですか。","c":["金貨の単位で額面を表した計数銀貨である南鐐二朱銀を鋳造した。","株仲間の解散を命じ、商人の自由な取引を促した。","旗本・御家人を救うため、棄捐令を出して札差からの借金を帳消しにした。","長崎貿易で俵物の輸出を禁じ、金銀の流出を防いだ。"],"e":"田沼意次は1772年に南鐐二朱銀を鋳造し、銀貨を金貨の単位で通用させて金と銀の貨幣制度の一本化をはかりました。株仲間は田沼が広く公認して運上・冥加を納めさせたもので、解散させたのは天保の改革の水野忠邦です。棄捐令は寛政の改革で松平定信が出しました。田沼は長崎貿易で銅や俵物の輸出を奨励し、金銀を輸入しようとしました。","m":"田沼＝株仲間公認・南鐐二朱銀・俵物輸出"},{"id":246,"k":"plan","ref":"想定問題","f":"近世","t":"寛政の改革の社会政策","y":1790,"q":"老中松平定信が行った寛政の改革について述べた文として、正しいものはどれですか。","c":["江戸の町々に町入用の節約分の7割を積み立てさせる七分積金を命じ、飢饉などに備えた。","上知令を出し、江戸・大坂周辺の大名・旗本の領地を直轄地にしようとした。","棄捐令を出し、大名が札差から借りた借金を帳消しにした。","人返しの法を出し、江戸に流入した百姓を強制的に村へ帰らせた。"],"e":"松平定信は、江戸の町入用（町の運営費）の節約分の7割を積み立てさせる七分積金を命じ、町会所で運用して飢饉や災害に備えました。また大名に囲米を命じました。上知令と、百姓の帰村を強制した人返しの法は天保の改革の政策です。寛政の改革では旧里帰農令で帰村を奨励するにとどまりました。棄捐令で救済の対象となったのは、札差から借金をしていた旗本・御家人です。","m":"寛政＝七分積金・囲米・棄捐令（旗本御家人）"},{"id":247,"k":"plan","ref":"想定問題","f":"近世","t":"天保の改革","y":1843,"q":"老中水野忠邦が行った天保の改革について述べた文として、正しいものはどれですか。","c":["物価の引き下げをねらって株仲間の解散を命じたが、かえって流通が混乱した。","上知令が実施され、江戸・大坂周辺の大名・旗本の領地が直轄地とされた。","異国船打払令をいっそう厳しくし、清の情勢に関係なく外国船を砲撃させた。","改革の成功により、水野忠邦は大老に就任した。"],"e":"水野忠邦は、株仲間が物価高騰の原因と考えて解散を命じましたが、商品の流通がかえって混乱しました。1843年の上知令は、大名・旗本の強い反対で撤回され、忠邦は失脚しました。アヘン戦争での清の敗北を知った幕府は、1842年に異国船打払令を緩め、天保の薪水給与令を出しています。忠邦は改革の失敗で老中を退いており、大老には就いていません。","m":"天保＝株仲間解散・人返し・上知令（撤回）"},{"id":248,"k":"plan","ref":"想定問題","f":"近世","t":"大塩の乱","y":1837,"q":"1837年に起こった大塩の乱について述べた文として、正しいものはどれですか。","c":["大坂町奉行所の元与力で陽明学者の大塩平八郎が、飢饉に苦しむ民衆の救済を求めて大坂で挙兵した。","朱子学者の大塩平八郎が、江戸の町奉行所を襲撃した。","乱は数か月にわたって続き、大坂の町は一揆勢によって長く占拠された。","大塩平八郎は乱の後、蛮社の獄で処罰された。"],"e":"天保の飢饉で大坂でも餓死者が出るなか、大坂町奉行所の元与力で陽明学者の大塩平八郎は、奉行所の無策と豪商の米の買い占めに抗議し、門弟や周辺の民衆とともに大坂で挙兵しました。乱はわずか半日ほどで鎮圧されましたが、幕府の直轄都市で元役人が起こした反乱は幕府に衝撃を与えました。大塩は朱子学者ではなく陽明学者で、江戸では挙兵していません。蛮社の獄は1839年、渡辺崋山・高野長英らが処罰された事件です。","m":"大塩の乱1837＝大坂・元与力・陽明学者"},{"id":249,"k":"plan","ref":"想定問題","f":"近世","t":"国学の発達","y":1798,"q":"江戸時代の国学について述べた文として、正しいものはどれですか。","c":["本居宣長は『古事記伝』を著し、国学を大成した。","賀茂真淵は、和学講談所を設けて『群書類従』を編纂した。","平田篤胤は『万葉代匠記』を著し、万葉集の研究を進めた。","契沖は復古神道を唱え、幕末の尊王攘夷運動に影響を与えた。"],"e":"本居宣長は『古事記』の研究を進めて『古事記伝』を著し、国学を大成しました。和学講談所を設けて『群書類従』を編纂したのは塙保己一で、賀茂真淵は『国意考』『万葉考』を著した人物です。『万葉代匠記』は17世紀後半の契沖の著書です。復古神道を唱えて尊王攘夷運動に影響を与えたのは平田篤胤です。いずれも人物と業績を入れかえた誤りです。","m":"宣長『古事記伝』・保己一『群書類従』・篤胤＝復古神道"},{"id":250,"k":"plan","ref":"想定問題","f":"近世","t":"江戸時代の農具","y":1700,"q":"江戸時代に普及した農具とその主な用途の組み合わせとして、正しいものはどれですか。","c":["千歯扱―稲の脱穀","備中鍬―田への水のくみ上げ","唐箕―田畑を深く耕すこと","踏車―穀粒ともみ殻の選別"],"e":"江戸時代には農具の改良が進み、千歯扱は稲の脱穀の能率を大きく高めました。備中鍬は刃が分かれた鍬で、田畑を深く耕すのに使われました。唐箕は風を起こして穀粒ともみ殻・ごみを選別する道具、踏車は足で踏んで回し、低い所から田に水をくみ上げる道具です。誤りの選択肢は、それぞれの用途を入れかえたものです。","m":"備中鍬＝深耕・千歯扱＝脱穀・唐箕＝選別・踏車＝揚水"},{"id":251,"k":"plan","ref":"想定問題","f":"近代","t":"廃藩置県","y":1871,"q":"1871年の廃藩置県について述べた文として、正しいものはどれですか。","c":["薩摩・長州・土佐の3藩から集めた御親兵の武力を背景に断行され、知藩事は罷免されて東京に住むよう命じられた。","旧藩主はそのまま知藩事に任命され、引き続き藩の政治を担当した。","新しく置かれた府県の長官には、原則として旧藩主が県令として任命された。","廃藩置県の直後に、全国の府県は3府43県に整理された。"],"e":"廃藩置県は、御親兵約1万の武力を背景に一挙に行われ、知藩事（旧藩主）は罷免されて東京居住を命じられ、府知事・県令は中央から派遣されました。旧藩主を知藩事に任命したのは1869年の版籍奉還のときです。府県は当初3府302県で、同じ年のうちに3府72県に整理されました。3府43県となったのは1888年です。","m":"版籍奉還＝藩主が知藩事に／廃藩置県＝知藩事罷免・県令派遣"},{"id":252,"k":"plan","ref":"想定問題","f":"近代","t":"地租改正","y":1873,"q":"1873年に始まった地租改正について述べた文として、正しいものはどれですか。","c":["課税の基準を収穫高から地価に改め、地価の3％を土地所有者が貨幣で納めることとした。","地券は実際に田畑を耕している小作人に交付され、小作人が納税者となった。","地租は従来どおり米などの現物で納めることとされた。","各地で地租改正反対一揆が起こったため、1877年に税率は地価の1％に引き下げられた。"],"e":"地租改正では、地券を交付して土地所有者を確定し、地価の3％を土地所有者が金納することにしました。これにより政府の財政収入は豊凶に左右されにくくなりました。地券は土地所有者に交付され、小作人は地主に現物で小作料を納め続けました。反対一揆を受けて1877年に税率は2.5％に引き下げられましたが、1％ではありません。","m":"地租改正＝地価の3％・金納・所有者が納税（1877年に2.5％）"},{"id":253,"k":"plan","ref":"想定問題","f":"近代","t":"徴兵令","y":1873,"q":"1873年に出された徴兵令について述べた文として、正しいものはどれですか。","c":["満20歳に達した男性に兵役の義務を課したが、戸主やその跡継ぎ、代人料270円を納めた者などは免除された。","国民皆兵の原則を徹底し、兵役を免除される規定は一切設けられなかった。","兵役の対象は士族の男性に限られ、平民は対象外とされた。","満18歳以上の男女に、等しく兵役の義務が課された。"],"e":"徴兵令は、大村益次郎が構想し山県有朋が実現したもので、身分に関係なく満20歳の男性を徴兵の対象としました。ただし、戸主やその跡継ぎ、官吏・学生、代人料270円を納めた者などは兵役を免除されたため、実際に兵役についたのは農家の次男・三男が中心でした。士族に限る、免除規定がない、女性も対象、という内容はいずれも誤りです。","m":"徴兵令＝満20歳男子、ただし戸主・代人料270円などは免除"},{"id":254,"k":"plan","ref":"想定問題","f":"近代","t":"学制","y":1872,"q":"1872年に公布された学制について述べた文として、正しいものはどれですか。","c":["フランスの学校制度にならって全国を学区に分け、国民皆学をめざした。","アメリカの制度にならい、学校の設置や運営を地方の自主性にゆだねた。","小学校の授業料は国が負担し、無償とされた。","初代文部大臣森有礼のもとで公布され、小学校から帝国大学までの学校体系を整えた。"],"e":"学制はフランスの学区制にならい、身分や性別に関係なく国民すべてに教育を受けさせる国民皆学をめざしました。しかし授業料は受益者負担だったため、学制反対の一揆も起こりました。アメリカにならって地方の自主性を重んじたのは1879年の教育令です。森有礼文部大臣のもとで帝国大学令・小学校令などの学校令が出されたのは1886年です。","m":"学制（1872）＝フランス式・学区制・国民皆学、授業料は自己負担"},{"id":255,"k":"plan","ref":"想定問題","f":"近代","t":"岩倉使節団","y":1871,"q":"1871年に横浜を出発した岩倉使節団について述べた文として、正しいものはどれですか。","c":["岩倉具視を大使、大久保利通・木戸孝允・伊藤博文らを副使とし、条約改正の予備交渉はうまくいかず欧米の視察に重点を移した。","大隈重信を大使とし、アメリカで条約改正の調印に成功した。","西郷隆盛も副使として参加し、帰国後に内治優先を主張した。","使節団の帰国後、ただちに領事裁判権の撤廃が実現した。"],"e":"岩倉使節団は、岩倉具視を大使、大久保利通・木戸孝允・伊藤博文・山口尚芳を副使とし、最初の訪問国アメリカで条約改正の予備交渉を試みましたが失敗し、その後は欧米の制度や産業の視察に力を注ぎました。西郷隆盛は日本に残る留守政府の中心人物でした。領事裁判権の撤廃は1894年の日英通商航海条約まで待たなければなりません。","m":"岩倉使節団＝大使岩倉・副使大久保・木戸・伊藤、改正交渉は失敗"},{"id":256,"k":"plan","ref":"想定問題","f":"近代","t":"明治六年の政変","y":1873,"q":"1873年の明治六年の政変について述べた文として、正しいものはどれですか。","c":["西郷隆盛の朝鮮派遣が、帰国した岩倉具視・大久保利通らの反対で中止され、西郷や板垣退助らが参議を辞職した。","大隈重信が国会の早期開設を主張したため、政府から追放された。","木戸孝允が朝鮮への派兵を強く主張し、受け入れられずに下野した。","政変で下野した江藤新平は、山口県で萩の乱を起こした。"],"e":"明治六年の政変では、留守政府が決めた西郷隆盛の朝鮮派遣が、欧米から帰国した岩倉・大久保・木戸らの内治優先論によって取り消され、西郷・板垣退助・後藤象二郎・江藤新平・副島種臣が参議を辞めました。大隈重信の追放は1881年の明治十四年の政変です。木戸は内治派です。江藤新平が起こしたのは1874年の佐賀の乱で、萩の乱は前原一誠が起こしました。","m":"明治六年の政変＝征韓論争、西郷・板垣・江藤らが下野"},{"id":257,"k":"plan","ref":"想定問題","f":"近代","t":"西南戦争","y":1877,"q":"1877年の西南戦争について述べた文として、正しいものはどれですか。","c":["鹿児島の私学校の生徒らに推された西郷隆盛が挙兵したが、徴兵制による政府軍に鎮圧された。","廃刀令に反発した熊本の敬神党が中心となって起こした反乱である。","戦費をまかなうための紙幣の増発により、戦後は激しい物価の下落が起こった。","戦争のさなかに、政府の中心であった大久保利通が東京で暗殺された。"],"e":"西南戦争は西郷隆盛を首領とする最大で最後の士族反乱で、徴兵制による政府軍が勝利し、以後は言論による反政府運動が中心になりました。敬神党（神風連）の乱は1876年の別の反乱です。戦費調達のための不換紙幣の増発は激しいインフレを招き、のちの松方財政によるデフレにつながりました。大久保利通が紀尾井坂で暗殺されたのは翌1878年です。","m":"西南戦争（1877）＝西郷・私学校、戦後はインフレ→松方デフレ"},{"id":258,"k":"plan","ref":"想定問題","f":"近代","t":"内閣制度の創設","y":1885,"q":"1885年の内閣制度の創設について述べた文として、正しいものはどれですか。","c":["太政官制を廃止して内閣制度が設けられ、伊藤博文が初代の内閣総理大臣となった。","内閣は帝国議会に対して責任を負うことが、このとき定められた。","宮内大臣と内大臣も国務大臣として内閣に加わった。","大日本帝国憲法の発布を受けて、内閣制度がつくられた。"],"e":"1885年、太政官制が廃止されて内閣制度が創設され、伊藤博文が初代総理大臣に就任しました。宮中と府中（政府）の区別がはかられ、宮内大臣と内大臣は内閣の外に置かれました。内閣制度は1889年の憲法発布より前にできており、憲法でも国務大臣は天皇に対して責任を負うとされ、議会に責任を負う議院内閣制ではありませんでした。","m":"内閣制度（1885）＝初代伊藤博文、宮中・府中の別、憲法より前"},{"id":259,"k":"plan","ref":"想定問題","f":"近代","t":"大日本帝国憲法の内容","y":1889,"q":"1889年に発布された大日本帝国憲法について述べた文として、正しいものはどれですか。","c":["天皇が定めて国民に与える欽定憲法の形式をとり、黒田清隆内閣のときに発布された。","貴族院議員は、すべて国民の選挙によって選ばれた。","予算は貴族院が先に審議することと定められた。","国民の権利は、法律によっても制限することのできない基本的人権として保障された。"],"e":"大日本帝国憲法は、伊藤博文らがドイツ（プロイセン）の憲法を参考に起草し、黒田清隆内閣のときに欽定憲法として発布されました。貴族院は皇族・華族・勅任議員などで構成され、選挙は行われません。予算の先議権は衆議院にありました。国民（臣民）の権利は「法律の範囲内」で認められたもので、法律によって制限できました。","m":"明治憲法＝欽定憲法・黒田内閣で発布・臣民の権利は法律の範囲内"},{"id":260,"k":"plan","ref":"想定問題","f":"近代","t":"日英通商航海条約","y":1894,"q":"1894年に調印された日英通商航海条約について述べた文として、正しいものはどれですか。","c":["第2次伊藤博文内閣の外務大臣陸奥宗光がイギリスと結び、領事裁判権の撤廃と関税率の一部引き上げを実現した。","外務大臣井上馨が、外国人判事の任用を条件に結んだ。","この条約によって、日本は関税自主権を完全に回復した。","ロシアの南下を警戒するイギリスとの交渉は、日露戦争の後に始められた。"],"e":"日英通商航海条約は日清戦争開戦の直前に陸奥宗光外相のもとで調印され、領事裁判権（治外法権）の撤廃が実現しました。ほかの国とも同様の条約が結ばれ、1899年に施行されました。井上馨は外国人判事任用などの案が反発を受けて辞任しています。関税自主権の完全回復は1911年、小村寿太郎外相のときです。","m":"1894陸奥＝領事裁判権撤廃／1911小村＝関税自主権回復"},{"id":261,"k":"plan","ref":"想定問題","f":"近代","t":"日英同盟協約","y":1902,"q":"1902年に結ばれた日英同盟協約について述べた文として、正しいものはどれですか。","c":["第1次桂太郎内閣のときに結ばれ、締約国の一方が2国以上と戦うときは、もう一方が参戦すると定めた。","伊藤博文らが強く推進し、日露協商論をおさえて実現した。","ワシントン会議で結ばれた四か国条約によって、同盟はさらに強化された。","日本が清国で持つ利益を、イギリスは一切認めなかった。"],"e":"日英同盟はロシアの南下に対抗するため第1次桂太郎内閣のときに結ばれ、一方が1国と交戦するときは他方は中立を守り、2国以上と交戦するときは参戦すると定めました。伊藤博文や井上馨はロシアとの協調をめざす日露協商論の立場でした。同盟は1921年の四か国条約の締結により廃棄が決まりました。協約では清国における両国の利益と、韓国における日本の利益が認められています。","m":"日英同盟（1902）＝桂内閣、対露、四か国条約で廃棄"},{"id":262,"k":"plan","ref":"想定問題","f":"近代","t":"韓国併合までの過程","y":1909,"q":"次の出来事を古いものから順に並べたとき、3番目にくるものはどれですか。\n・統監府の設置　・第3次日韓協約による韓国軍隊の解散　・伊藤博文がハルビン駅で暗殺される　・朝鮮総督府の設置","c":["伊藤博文がハルビン駅で暗殺される","統監府の設置","第3次日韓協約による韓国軍隊の解散","朝鮮総督府の設置"],"e":"1905年の第2次日韓協約で韓国の外交権を奪い、統監府を置いて伊藤博文が初代統監となりました。1907年のハーグ密使事件の後、第3次日韓協約で内政権を握り、韓国軍隊を解散させました。1909年、伊藤は安重根にハルビン駅で暗殺され、翌1910年の韓国併合で朝鮮総督府が置かれました。したがって3番目は伊藤博文の暗殺です。","m":"統監府1905→軍隊解散1907→伊藤暗殺1909→総督府1910"},{"id":263,"k":"plan","ref":"想定問題","f":"近代","t":"足尾鉱毒事件","y":1901,"q":"足尾銅山の鉱毒問題で、衆議院議員を辞職したのち、1901年に明治天皇への直訴を試みた人物はだれですか。","c":["田中正造","片山潜","幸徳秋水","安部磯雄"],"e":"足尾銅山の鉱毒は渡良瀬川流域の農業や漁業に大きな被害を与えました。栃木県選出の衆議院議員田中正造は議会で被害を追及し、1901年には議員を辞職して天皇に直訴しようとしました。直訴状の文章を書いたのは幸徳秋水ですが、直訴を試みたのは田中です。片山潜と安部磯雄は社会主義運動家で、1901年に幸徳らと社会民主党を結成しました。","m":"足尾鉱毒＝田中正造の直訴（1901）、渡良瀬川流域"},{"id":264,"k":"plan","ref":"想定問題","f":"近代","t":"工場法","y":1911,"q":"1911年に制定された工場法について述べた文として、正しいものはどれですか。","c":["制定はされたが施行は1916年まで延期され、適用されるのは15人以上を使用する工場に限られた。","労働時間を1日8時間とする8時間労働制を定めた。","規模にかかわらず、すべての工場に適用された。","国際労働機関（ILO）への加盟をきっかけに制定された。"],"e":"工場法は日本で最初の労働者保護法で、第2次桂太郎内閣のときに制定されました。12歳未満の就業禁止や、少年・女性の労働時間を12時間までとすることなどを定めましたが、資本家の反対で施行は1916年に延期され、適用は15人以上の工場に限られるなど不十分なものでした。8時間労働制は戦後の労働基準法で定められ、ILOの創設は1919年です。","m":"工場法＝1911制定・1916施行・15人以上・12時間"},{"id":265,"k":"plan","ref":"想定問題","f":"近代","t":"大阪紡績会社と紡績業","y":1883,"q":"明治時代の紡績業について述べた文として、正しいものはどれですか。","c":["渋沢栄一らが設立した大阪紡績会社が1883年に開業し、蒸気機関を使った大規模な経営で成功した。","豊田佐吉が発明したガラ紡が、在来の手紡ぎにかわって広まった。","日清戦争後の1897年には、綿糸の輸入量が輸出量を上回るようになった。","官営の富岡製糸場は、イギリスの技術を導入して開設された。"],"e":"大阪紡績会社は輸入の紡績機械と蒸気機関を使い、昼夜二交代制で大きな利益をあげ、これをきっかけに紡績会社の設立が続きました。ガラ紡を発明したのは臥雲辰致で、豊田佐吉は国産の力織機を発明しました。1897年には綿糸の輸出量が輸入量を上回りました。富岡製糸場はフランスの技術と技師を導入しています。","m":"大阪紡績（1883）＝渋沢・蒸気機関／1897綿糸輸出＞輸入"},{"id":266,"k":"plan","ref":"想定問題","f":"近代","t":"米騒動","y":1918,"q":"1918年の米騒動について述べた文として、正しいものはどれですか。","c":["シベリア出兵を見こした米の買い占めで米価が急騰し、富山県の漁村の女性たちの行動をきっかけに全国に広がった。","米騒動の責任をとって、原敬内閣が総辞職した。","騒動は東京など大都市だけで起こり、軍隊は出動しなかった。","政府は騒動をしずめるため、ただちに普通選挙法を制定した。"],"e":"米騒動は、大戦景気による物価上昇に加え、シベリア出兵を見こした米の買い占めで米価が急騰して起こりました。富山県の漁村の主婦らの行動が報じられると全国に広がり、政府は軍隊も出動させて鎮圧しました。その責任を問われて寺内正毅内閣が総辞職し、かわって原敬の政党内閣が成立しました。普通選挙法の成立は1925年です。","m":"米騒動（1918）→寺内内閣総辞職→原敬の政党内閣"},{"id":267,"k":"plan","ref":"想定問題","f":"近代","t":"原敬内閣","y":1918,"q":"1918年に成立した原敬内閣について述べた文として、正しいものはどれですか。","c":["陸軍・海軍・外務の3大臣以外の閣僚を、すべて立憲政友会の党員で占める本格的な政党内閣であった。","男性の普通選挙制を実現し、選挙権の納税資格を撤廃した。","首相の原敬は爵位をもつ華族で、「平民宰相」とはよばれなかった。","原敬は在任中、五・一五事件で海軍の青年将校に暗殺された。"],"e":"原敬は衆議院に議席をもつ初めての首相で、爵位をもたなかったため「平民宰相」とよばれました。内閣は陸・海軍大臣と外務大臣を除いて立憲政友会員で構成されました。普通選挙には慎重で、選挙権の納税資格を3円以上に引き下げ、小選挙区制を導入するにとどめました。原は1921年に東京駅で暗殺されました。五・一五事件（1932年）で殺されたのは犬養毅です。","m":"原敬＝平民宰相・初の本格的政党内閣・納税資格3円"},{"id":268,"k":"plan","ref":"想定問題","f":"近代","t":"ワシントン会議","y":1922,"q":"1921〜22年のワシントン会議について述べた文として、正しいものはどれですか。","c":["九か国条約で中国の主権尊重と門戸開放が約束され、これにともない石井・ランシング協定は廃棄された。","日本の首席全権は西園寺公望で、牧野伸顕が随行した。","補助艦の保有量について、英米日の比率がおよそ10対10対7と定められた。","四か国条約によって、日英同盟は内容をさらに強めて更新された。"],"e":"ワシントン会議には加藤友三郎・幣原喜重郎らが全権として参加しました。四か国条約で太平洋の現状維持を約束して日英同盟の廃棄が決まり、九か国条約で中国の主権・領土の尊重や門戸開放が確認され、石井・ランシング協定は廃棄されました。海軍軍縮条約で定めたのは主力艦の比率です。補助艦の比率はロンドン海軍軍縮会議（1930年）、西園寺公望はパリ講和会議の全権です。","m":"ワシントン会議＝四か国（日英同盟廃棄）・九か国・主力艦制限"},{"id":269,"k":"plan","ref":"想定問題","f":"近代","t":"金解禁","y":1930,"q":"1930年の金解禁について述べた文として、正しいものはどれですか。","c":["浜口雄幸内閣の大蔵大臣井上準之助が旧平価で金輸出を解禁したが、世界恐慌と重なって深刻な不況を招いた。","高橋是清大蔵大臣が、実勢に合わせた新平価で金輸出を解禁した。","金解禁によって円安となり、輸出が大きく伸びて景気が回復した。","金解禁は、関東大震災の直後に震災恐慌への対策として実施された。"],"e":"浜口内閣の井上準之助蔵相は、為替相場の安定と産業の合理化をめざし、実勢より円高の旧平価で金解禁を断行しました。しかし前年に始まった世界恐慌と重なって輸出が激減し、昭和恐慌とよばれる深刻な不況になりました。1931年に犬養毅内閣の高橋是清蔵相が金輸出を再禁止し、円安で輸出が伸びました。関東大震災は1923年です。","m":"金解禁（1930）＝浜口・井上、旧平価→昭和恐慌／再禁止は高橋"},{"id":270,"k":"plan","ref":"想定問題","f":"近代","t":"満洲事変","y":1931,"q":"1931年に始まった満洲事変について述べた文として、正しいものはどれですか。","c":["関東軍が奉天郊外の柳条湖で南満洲鉄道の線路を爆破し、これを中国軍のしわざとして軍事行動を始めた。","北京郊外の盧溝橋で起こった日中両軍の衝突をきっかけに始まった。","犬養毅内閣は日満議定書を結んで満洲国を承認した。","国際連盟はリットン調査団の報告をもとに、満洲国を独立国として認める勧告を採択した。"],"e":"満洲事変は柳条湖事件から始まり、関東軍は満洲の主要地域を占領して1932年に満洲国を建国させました。満洲国を承認する日満議定書を結んだのは斎藤実内閣です。国際連盟はリットン報告書にもとづき、満洲国を認めず日本軍の撤退を求める勧告を採択したため、日本は1933年に連盟脱退を通告しました。盧溝橋事件は1937年の日中戦争のきっかけです。","m":"柳条湖事件（1931）→満洲国（1932）→連盟脱退通告（1933）"},{"id":271,"k":"plan","ref":"想定問題","f":"近代","t":"二・二六事件","y":1936,"q":"1936年の二・二六事件について述べた文として、正しいものはどれですか。","c":["皇道派の陸軍青年将校が部隊を率いて内大臣斎藤実や大蔵大臣高橋是清らを殺害し、首相官邸などを占拠した。","海軍の青年将校らが首相官邸をおそい、犬養毅首相を殺害した。","事件後、統制派が排除されて、皇道派が陸軍の主導権をにぎった。","事件後には近衛文麿内閣が成立し、軍部大臣現役武官制を廃止した。"],"e":"二・二六事件は北一輝の思想の影響を受けた皇道派の青年将校が起こしたクーデタで、戒厳令がしかれ反乱軍として鎮圧されました。その後、皇道派は排除され、統制派が陸軍の主導権を確立しました。事件後に成立したのは広田弘毅内閣で、軍部大臣現役武官制を復活させました。犬養毅首相が殺されたのは1932年の五・一五事件です。","m":"二・二六（1936）＝皇道派・斎藤実/高橋是清殺害→広田内閣"},{"id":272,"k":"plan","ref":"想定問題","f":"近代","t":"国家総動員法","y":1938,"q":"1938年に制定された国家総動員法について述べた文として、正しいものはどれですか。","c":["第1次近衛文麿内閣のもとで制定され、政府は議会の承認なしに勅令で人や物資を戦争に動員できるようになった。","太平洋戦争の開戦を受けて、東条英機内閣のもとで制定された。","議会で否決されたため、緊急勅令の形で公布された。","大政翼賛会の結成と同時に制定され、政党の解散を定めた。"],"e":"国家総動員法は日中戦争が長期化するなか、第1次近衛文麿内閣が議会に提出して成立させた法律です。戦時に際して、政府は議会の審議を経ずに勅令によって労働力や物資を統制・動員できるようになり、翌1939年にはこれにもとづいて国民徴用令が出されました。大政翼賛会の結成は1940年の第2次近衛内閣のときです。","m":"国家総動員法（1938）＝第1次近衛、勅令で動員→国民徴用令"},{"id":273,"k":"plan","ref":"想定問題","f":"近代","t":"太平洋戦争開戦までの過程","y":1941,"q":"次の出来事を古いものから順に並べたとき、2番目にくるものはどれですか。\n・日独伊三国同盟の締結　・日ソ中立条約の締結　・南部仏印への進駐　・アメリカがハル・ノートを提示","c":["日ソ中立条約の締結","日独伊三国同盟の締結","南部仏印への進駐","アメリカがハル・ノートを提示"],"e":"日独伊三国同盟は1940年9月、北部仏印進駐と同じころに第2次近衛文麿内閣が結びました。日ソ中立条約は1941年4月に松岡洋右外相が調印しました。南部仏印進駐は1941年7月で、アメリカは対日石油輸出の禁止で応じました。ハル・ノートは1941年11月に示され、東条英機内閣は開戦を決めました。したがって2番目は日ソ中立条約です。","m":"三国同盟1940.9→日ソ中立1941.4→南部仏印1941.7→ハル・ノート1941.11"},{"id":274,"k":"plan","ref":"想定問題","f":"近代","t":"吉野作造と民本主義","y":1916,"q":"1916年に雑誌『中央公論』に論文を発表し、主権の所在は問わずに、政治の目的を民衆の幸福におき政策決定は民衆の意向によるべきだとする民本主義を説いた人物はだれですか。","c":["吉野作造","美濃部達吉","北一輝","河上肇"],"e":"吉野作造は東京帝国大学の政治学者で、民本主義を唱えて普通選挙や政党内閣の実現を主張し、大正デモクラシーの理論的支えとなりました。美濃部達吉は天皇機関説を唱えた憲法学者、北一輝は『日本改造法案大綱』を著した国家主義者、河上肇は『貧乏物語』を著した経済学者でのちにマルクス主義に進みました。","m":"民本主義＝吉野作造／天皇機関説＝美濃部達吉"},{"id":275,"k":"plan","ref":"想定問題","f":"現代","t":"日本国憲法の制定","y":1946,"q":"日本国憲法の制定について述べた文として、正しいものはどれですか。","c":["GHQの草案をもとに政府が改正案をつくり、帝国議会で一部修正のうえ可決されて、1946年11月3日に公布された。","松本烝治を委員長とする憲法問題調査委員会の案が、そのまま採用された。","新憲法のもとで選ばれた国会で審議・可決された。","公布されたその日に施行された。"],"e":"幣原喜重郎内閣の憲法問題調査委員会（委員長松本烝治）の案は天皇の統治権を残す保守的なものだったため、GHQはみずから草案を作成して政府に示しました。政府はこれをもとに改正案をつくり、大日本帝国憲法の改正手続きにしたがって帝国議会で修正・可決され、1946年11月3日に公布、1947年5月3日に施行されました。","m":"日本国憲法＝GHQ草案→帝国議会、公布1946.11.3・施行1947.5.3"},{"id":276,"k":"plan","ref":"想定問題","f":"現代","t":"財閥解体","y":1947,"q":"戦後の財閥解体について述べた文として、正しいものはどれですか。","c":["過度経済力集中排除法で325社が分割の対象に指定されたが、実際に分割されたのは日本製鉄など11社にとどまった。","指定された325社はすべて分割され、巨大企業はなくなった。","銀行も財閥の中核として分割の対象となり、多くが分割された。","独占禁止法の制定により、財閥家族の保有株式は国が無償で没収した。"],"e":"GHQの指令で持株会社整理委員会が設けられ、財閥家族や持株会社の株式は譲渡されて一般に売り出されました。1947年には独占禁止法と過度経済力集中排除法が制定されましたが、占領政策の転換で分割は大幅に緩められ、325社の指定に対し実際の分割は11社だけでした。銀行は分割の対象とされず、のちの企業集団の中心となりました。","m":"集中排除法＝325社指定→分割は11社、銀行は対象外"},{"id":277,"k":"plan","ref":"想定問題","f":"現代","t":"労働三法","y":1947,"q":"労働三法のうち、8時間労働制など労働条件の最低基準を定めた法律と、その制定年の組合せとして正しいものはどれですか。","c":["労働基準法・1947年","労働組合法・1945年","労働関係調整法・1946年","労働基準法・1945年"],"e":"戦後の労働改革では、1945年に労働組合法（団結権・団体交渉権・争議権を保障）、1946年に労働関係調整法（労働争議の調整方法を規定）、1947年に労働基準法（8時間労働制など労働条件の最低基準を規定）が制定されました。労働条件の最低基準を定めたのは労働基準法で、その制定は1947年です。","m":"労組法1945→労調法1946→労基法1947（8時間労働）"},{"id":278,"k":"plan","ref":"想定問題","f":"現代","t":"教育改革と教育基本法","y":1947,"q":"戦後の教育改革について述べた文として、正しいものはどれですか。","c":["1947年に教育基本法が制定されて教育の機会均等や男女共学が定められ、同年の学校教育法で六・三・三・四制が始まった。","義務教育の年限は、戦前と同じく6年のままとされた。","教育委員は当初から、都道府県知事や市町村長による任命制とされた。","教育基本法の制定にあわせて、教育勅語が改めて教育の基本とされた。"],"e":"教育基本法は教育の機会均等、男女共学、義務教育9年などを定め、学校教育法により六・三・三・四の新しい学校制度が始まりました。1948年に教育委員会法が制定され、教育委員は当初公選制でしたが、1956年に任命制に改められました。教育勅語は1948年、衆議院で排除、参議院で失効確認が決議されています。","m":"教育基本法（1947）＝機会均等・男女共学・義務教育9年"},{"id":279,"k":"plan","ref":"想定問題","f":"現代","t":"ドッジ・ライン","y":1949,"q":"1949年に実施されたドッジ・ラインについて述べた文として、正しいものはどれですか。","c":["赤字を許さない超均衡予算を組ませ、1ドル＝360円の単一為替レートを設定した。","赤字国債を大量に発行する積極財政で、景気の拡大をはかった。","1ドル＝308円の為替レートを設定し、輸出の拡大をはかった。","インフレは収まらず、むしろ物価の上昇が加速した。"],"e":"GHQは日本経済の自立と安定のために経済安定九原則を示し、銀行家ドッジが来日して超均衡予算の編成などを指示しました。1ドル＝360円の単一為替レートで日本経済は国際経済に結びつけられ、インフレは収束しましたが、逆に不況が深刻化して中小企業の倒産や人員整理が増えました。1ドル＝308円は1971年のスミソニアン協定でのレートです。","m":"ドッジ・ライン＝超均衡予算・360円レート→インフレ収束・不況"},{"id":280,"k":"plan","ref":"想定問題","f":"現代","t":"シャウプ勧告","y":1949,"q":"1949年に来日し、直接税中心主義と累進所得税制を柱とする税制改革を勧告したアメリカの財政学者はだれですか。","c":["シャウプ","ドッジ","ダレス","ケナン"],"e":"シャウプの勧告にもとづき、所得税など直接税を中心とし、所得が多いほど税率が高くなる累進課税を柱とする税制が整えられました。ドッジは超均衡予算と360円レートを指示した銀行家、ダレスはサンフランシスコ平和条約の締結を進めたアメリカの外交官、ケナンは対日占領政策の転換に関わった国務省の外交官です。","m":"シャウプ＝税制（直接税中心）／ドッジ＝予算・為替"},{"id":281,"k":"plan","ref":"想定問題","f":"現代","t":"朝鮮戦争と警察予備隊","y":1950,"q":"1950年に始まった朝鮮戦争と日本について述べた文として、正しいものはどれですか。","c":["在日アメリカ軍が朝鮮に出動したため、その空白を埋めるためにGHQの指令で警察予備隊が創設された。","戦争の影響で日本からの輸出が止まり、深刻な不況におちいった。","日本は国連軍の一員として、自衛隊の部隊を朝鮮半島に派遣した。","戦争は翌1951年のサンフランシスコ平和条約の締結と同時に休戦した。"],"e":"朝鮮戦争が始まると在日米軍が朝鮮半島に動員され、GHQの指令で1950年に警察予備隊が創設されました（1952年に保安隊、1954年に自衛隊）。アメリカ軍の物資やサービスの需要（特需）で日本経済はドッジ・ライン後の不況から立ち直りました。日本は部隊を派遣していません。休戦協定が結ばれたのは1953年です。","m":"朝鮮戦争（1950）→警察予備隊・特需景気、休戦は1953"},{"id":282,"k":"plan","ref":"想定問題","f":"現代","t":"日米安全保障条約（1951年）","y":1951,"q":"1951年に調印された日米安全保障条約について述べた文として、正しいものはどれですか。","c":["サンフランシスコ平和条約と同じ日に調印され、米軍の日本駐留を認めたが、アメリカの日本防衛義務は明記されなかった。","岸信介内閣のもとで調印された。","条約の期限は10年とされ、その後は一方の通告で終了できると定められた。","アメリカの日本防衛義務と、在日米軍の行動についての事前協議制が定められた。"],"e":"1951年、吉田茂首相はサンフランシスコ平和条約と同じ日に日米安全保障条約に調印し、独立後も米軍が日本に駐留することになりました。この条約ではアメリカの日本防衛義務が明記されず、期限も定められていませんでした。防衛義務の明記や事前協議制、10年の期限は、1960年に岸信介内閣が結んだ新安保条約で定められたものです。","m":"旧安保（1951吉田）＝駐留のみ／新安保（1960岸）＝防衛義務明記"},{"id":283,"k":"plan","ref":"想定問題","f":"現代","t":"55年体制の成立","y":1955,"q":"1955年に成立した、いわゆる55年体制について述べた文として、正しいものはどれですか。","c":["左右に分裂していた日本社会党が統一し、これに対抗して日本民主党と自由党が合同して自由民主党が結成された。","自由民主党が結成されたときの首相は岸信介であった。","日本社会党は、憲法改正の発議に必要な3分の2以上の議席を獲得した。","日本社会党と自由民主党が連立して、長期政権を維持した。"],"e":"1955年、講和問題で左右に分裂していた日本社会党が再統一すると、財界の後押しで日本民主党と自由党が保守合同して自由民主党を結成しました。このときの首相は鳩山一郎です。以後、自民党が政権を握り続け、社会党は改憲を阻止できる3分の1程度の議席を保つ「1と2分の1政党制」が1993年まで続きました。","m":"55年体制＝社会党統一＋保守合同（自民党）、鳩山内閣のとき"},{"id":284,"k":"plan","ref":"想定問題","f":"現代","t":"日ソ共同宣言","y":1956,"q":"1956年の日ソ共同宣言について述べた文として、正しいものはどれですか。","c":["鳩山一郎内閣が調印してソ連との国交が回復し、ソ連の支持が得られたことで同じ年に日本の国際連合加盟が実現した。","国後島・択捉島を含む北方四島を日本に返すことが約束された。","吉田茂内閣が調印し、同時に日ソ平和条約も結ばれた。","この宣言により、日本はソ連より先に中華人民共和国とも国交を回復した。"],"e":"日ソ共同宣言で戦争状態が終わり国交が回復しました。それまで日本の国連加盟に反対していたソ連が支持にまわり、1956年12月に加盟が実現しました。平和条約は結ばれず、条約締結後に歯舞群島・色丹島を引き渡すとされましたが、国後島・択捉島は含まれていません。中国との国交正常化は1972年です。","m":"日ソ共同宣言（1956）＝鳩山、国交回復→国連加盟"},{"id":285,"k":"plan","ref":"想定問題","f":"現代","t":"新安保条約と安保闘争","y":1960,"q":"1960年の日米新安全保障条約と安保闘争について述べた文として、正しいものはどれですか。","c":["岸信介内閣が衆議院で条約承認を強行採決すると反対運動が激化し、条約は自然成立したが内閣は総辞職した。","反対運動の高まりによって、条約は国会で承認されず発効しなかった。","参議院の議決を経て、正式に承認された。","新しい条約では、アメリカの日本防衛義務は定められなかった。"],"e":"岸信介内閣は日米対等をめざして安保条約を改定し、アメリカの日本防衛義務や在日米軍の行動に関する事前協議を定めました。衆議院での強行採決に対し、国会を取り巻く大規模な安保闘争が起こり、予定されたアイゼンハワー大統領の訪日は中止されました。条約は参議院の議決がないまま衆議院の議決から30日後に自然成立し、岸内閣は総辞職しました。","m":"新安保（1960）＝岸・強行採決→自然成立→総辞職"},{"id":286,"k":"plan","ref":"想定問題","f":"現代","t":"国民所得倍増計画","y":1960,"q":"「寛容と忍耐」をかかげて政治の対立をやわらげ、10年間で国民所得を2倍にする国民所得倍増計画を決定した首相はだれですか。","c":["池田勇人","岸信介","佐藤栄作","鳩山一郎"],"e":"1960年に岸内閣の後を受けた池田勇人内閣は、経済成長を最優先する政策をとり、国民所得倍増計画を決定しました。高度経済成長が進み、国民所得はほぼ計画どおりに伸びました。岸信介は新安保条約、佐藤栄作は日韓基本条約や沖縄返還、鳩山一郎は日ソ国交回復で知られる首相です。","m":"所得倍増計画＝池田勇人「寛容と忍耐」（1960）"},{"id":287,"k":"plan","ref":"想定問題","f":"現代","t":"開放経済体制への移行","y":1964,"q":"1960年代の貿易・資本の自由化について述べた文として、正しいものはどれですか。","c":["1964年、日本はIMF8条国に移行し、さらに経済協力開発機構（OECD）に加盟した。","日本は1964年に初めてGATTに加盟した。","日本がOECDに加盟したのは、第一次石油危機の後である。","自由化の結果、外国企業との競争を避けるため企業合併は禁止された。"],"e":"日本は1955年にGATTに加盟し、1963年にGATT11条国に移行して貿易の自由化を進めました。1964年にはIMF8条国に移って為替の自由化が義務づけられ、同じ年にOECDに加盟して資本の自由化も進めました。国際競争に備えて、1964年の三菱重工業再合併、1970年の新日本製鉄の発足など大型合併が進んだのも特徴です。","m":"GATT加盟1955→GATT11条国1963→IMF8条国・OECD1964"},{"id":288,"k":"plan","ref":"想定問題","f":"現代","t":"公害問題と環境行政","y":1971,"q":"高度経済成長期の公害問題について述べた文として、正しいものはどれですか。","c":["1967年に公害対策基本法が制定され、1971年には環境庁が発足した。","四大公害訴訟は、いずれも原告である被害者側の敗訴に終わった。","イタイイタイ病は、三重県四日市市の石油化学コンビナートによる大気汚染が原因であった。","水俣病は、新潟県の阿賀野川流域だけで発生した。"],"e":"公害の深刻化を受けて、佐藤栄作内閣のもとで1967年に公害対策基本法、1971年に環境庁が設けられました。四大公害訴訟はいずれも被害者側が勝訴しています。イタイイタイ病は富山県神通川流域のカドミウムが原因で、四日市ぜんそくが三重県の大気汚染です。水俣病は熊本県の水俣湾周辺で発生し、新潟県阿賀野川流域では新潟水俣病が起こりました。","m":"公害対策基本法1967・環境庁1971、四大公害訴訟は被害者勝訴"},{"id":289,"k":"plan","ref":"想定問題","f":"現代","t":"沖縄返還","y":1972,"q":"沖縄の日本復帰について述べた文として、正しいものはどれですか。","c":["佐藤栄作内閣がアメリカと沖縄返還協定に調印し、1972年に沖縄は日本に復帰したが、広大な米軍基地は残された。","小笠原諸島と同じ年に、沖縄も日本に返還された。","返還にともない、沖縄の米軍基地はすべて撤去された。","沖縄返還協定は、田中角栄内閣のもとで調印された。"],"e":"佐藤栄作首相は1969年にニクソン大統領と会談して「核抜き」での返還に合意し、1971年に沖縄返還協定に調印、1972年5月に沖縄の日本復帰が実現しました。しかし米軍基地の多くはそのまま残りました。小笠原諸島の返還は1968年です。田中角栄内閣の成立は返還後の1972年7月です。","m":"小笠原返還1968→沖縄返還協定1971→沖縄復帰1972（佐藤）"},{"id":290,"k":"plan","ref":"想定問題","f":"現代","t":"日中国交正常化","y":1972,"q":"日本と中華人民共和国の関係について述べた文として、正しいものはどれですか。","c":["1972年、田中角栄首相が中国を訪れて日中共同声明を発表して国交を正常化し、1978年には福田赳夫内閣が日中平和友好条約を結んだ。","日中共同声明は、佐藤栄作内閣のもとで発表された。","日中国交正常化の後も、台湾の中華民国政府との日華平和条約は有効とされた。","日中平和友好条約は、日中共同声明と同じ年に結ばれた。"],"e":"ニクソン大統領の訪中発表などを受け、田中角栄首相は1972年に北京を訪れて日中共同声明を発表し、中華人民共和国を中国で唯一の合法政府と認めました。これにより1952年に台湾と結んだ日華平和条約は終了しました。日中平和友好条約は1978年、福田赳夫内閣のときに結ばれています。","m":"日中共同声明1972（田中）→日中平和友好条約1978（福田）"},{"id":291,"k":"plan","ref":"想定問題","f":"現代","t":"ドル・ショックと変動相場制","y":1971,"q":"1970年代初めの国際通貨体制の変化について述べた文として、正しいものはどれですか。","c":["1971年にアメリカが金とドルの交換停止を発表し、同年末に1ドル＝308円に切り上げられ、1973年には変動相場制に移った。","1971年のスミソニアン協定で、1ドル＝360円の固定相場が新たに定められた。","変動相場制への移行は、1985年のプラザ合意によって初めて実現した。","金とドルの交換停止によって、円の価値は大きく下がり円安が進んだ。"],"e":"ニクソン大統領が金とドルの交換停止などを発表したドル・ショック（1971年）で、ブレトン・ウッズ体制はゆらぎました。同年末のスミソニアン協定で円は1ドル＝308円に切り上げられましたが、ドル不安は続き、1973年に日本も変動相場制に移行しました。360円は1949年のドッジ・ラインで設定されたレートです。","m":"ドル・ショック1971→308円（スミソニアン）→変動相場制1973"},{"id":292,"k":"plan","ref":"想定問題","f":"現代","t":"三井三池争議","y":1960,"q":"1960年、石炭から石油へのエネルギー転換が進むなかで起こった、大量の人員整理に反対する大規模な労働争議はどれですか。","c":["三井三池炭鉱争議","東宝争議","二・一ゼネスト計画","足尾銅山暴動"],"e":"エネルギー革命で石炭産業が衰退するなか、三井鉱山が三池炭鉱で大量の指名解雇を行うと、労働組合が激しく抵抗し、安保闘争と同じ時期に「総資本対総労働」とよばれる大争議になりました。東宝争議は1946〜48年の映画会社の争議、二・一ゼネストは1947年にGHQの命令で中止されたもの、足尾銅山暴動は1907年の出来事です。","m":"三井三池争議（1960）＝エネルギー革命・石炭→石油"},{"id":293,"k":"plan","ref":"想定問題","f":"現代","t":"プラザ合意","y":1985,"q":"1985年のプラザ合意について述べた文として、正しいものはどれですか。","c":["先進5か国の財務相・中央銀行総裁会議でドル高の是正が合意され、急速な円高が進んで日本は一時円高不況となった。","円高を是正するため、各国が協調して円売りを行うことが合意された。","合意後は円安が進み、日本の輸出が急増した。","合意の結果、日本は固定相場制に戻った。"],"e":"1985年、ニューヨークのプラザホテルで開かれたG5でドル高是正のための協調介入が合意され、円高が急激に進みました。輸出産業が打撃を受けて円高不況となりましたが、政府・日本銀行は低金利政策などで内需拡大をはかり、その後の地価や株価の高騰（バブル経済）につながりました。日本は1973年以降、変動相場制を続けています。","m":"プラザ合意（1985）＝G5・ドル高是正→円高不況→バブル"},{"id":294,"k":"plan","ref":"想定問題","f":"現代","t":"バブル経済の崩壊","y":1991,"q":"バブル経済とその崩壊について述べた文として、正しいものはどれですか。","c":["低金利のもとで地価や株価が実態以上に高騰したが、1990年代初めに崩壊し、1997年には北海道拓殖銀行や山一証券が経営破綻した。","日経平均株価は、1990年代の終わりに史上最高値を記録した。","地価は1980年代前半から下がり続け、1980年代後半には底を打った。","バブル崩壊の後、金融機関の不良債権はほとんど発生しなかった。"],"e":"プラザ合意後の円高不況に対して低金利政策がとられ、余った資金が土地や株に流れこみ、1980年代後半にバブル経済が生まれました。日経平均株価は1989年末に当時の最高値をつけ（この値を超えたのは2024年）、1990年代初めに株価・地価が暴落してバブルは崩壊しました。金融機関は巨額の不良債権をかかえ、1997年には北海道拓殖銀行や山一証券の破綻が続く金融危機となりました。","m":"バブル＝1980年代後半、株価は1989年末に当時の最高値、1997金融危機"},{"id":295,"k":"plan","ref":"想定問題","f":"現代","t":"細川連立内閣","y":1993,"q":"1993年に成立した細川護熙内閣について述べた文として、正しいものはどれですか。","c":["総選挙で自民党が過半数を割り、日本新党の細川護熙を首相とする非自民8党派の連立内閣が成立して、55年体制が終わった。","自民党と日本社会党、新党さきがけの3党が連立して成立した。","日本社会党を除く野党が連立して成立し、社会党は野党にとどまった。","細川内閣のもとで、衆議院議員選挙は中選挙区制に改められた。"],"e":"1993年、自民党の分裂を経た総選挙で自民党が過半数を割り、日本新党・新生党・日本社会党などの非自民8党派が細川護熙を首相とする連立内閣をつくり、55年体制が崩壊しました。細川内閣は政治改革を進め、1994年に小選挙区比例代表並立制を導入しました。自民・社会・さきがけの3党連立は1994年の村山富市内閣です。","m":"細川内閣（1993）＝非自民8党派、55年体制の終わり"},{"id":296,"k":"plan","ref":"想定問題","f":"現代","t":"三公社の民営化","y":1987,"q":"日本電信電話公社・日本専売公社・日本国有鉄道の民営化を実現し、「戦後政治の総決算」をとなえた首相はだれですか。","c":["中曽根康弘","大平正芳","竹下登","小泉純一郎"],"e":"中曽根康弘内閣は行財政改革を進め、1985年に日本電信電話公社をNTT、日本専売公社をJTに、1987年に日本国有鉄道をJR各社に分割・民営化しました。大平正芳は一般消費税の導入を断念した首相、竹下登は消費税を導入した首相、小泉純一郎は2000年代に郵政民営化を進めた首相です。","m":"三公社民営化（電電・専売1985、国鉄1987）＝中曽根"},{"id":297,"k":"plan","ref":"想定問題","f":"現代","t":"PKO協力法と自衛隊派遣","y":1992,"q":"1992年に宮沢喜一内閣のもとでPKO協力法が成立し、この法律にもとづいて自衛隊の部隊が初めて派遣された国はどこですか。","c":["カンボジア","イラク","モザンビーク","東ティモール"],"e":"湾岸戦争（1991年）で多額の資金を出しながら評価されなかったことなどから、国連平和維持活動に自衛隊が参加できるようにするPKO協力法が1992年に成立し、同年カンボジアに自衛隊の部隊が派遣されました。モザンビークへの派遣は1993年、東ティモールへは2002年です。イラクへの派遣（2004年）は別の特別措置法にもとづくものです。","m":"PKO協力法（1992宮沢）→初派遣はカンボジア"},{"id":298,"k":"plan","ref":"想定問題","f":"現代","t":"極東国際軍事裁判","y":1948,"q":"極東国際軍事裁判（東京裁判）について述べた文として、正しいものはどれですか。","c":["東条英機ら28名がA級戦犯の容疑で起訴され、東条ら7名が死刑とされた。","昭和天皇も起訴され、裁判の被告となった。","裁判はドイツのニュルンベルクで開かれた。","判事は全員がアメリカ人であった。"],"e":"極東国際軍事裁判は1946年から東京で開かれ、戦争を計画・遂行した「平和に対する罪」などを問われた28名が起訴されました。1948年に判決が出され、東条英機ら7名が絞首刑となりました。昭和天皇はアメリカの方針で起訴されませんでした。判事は連合国11か国から出ており、インドのパル判事は全員無罪を主張しました。ニュルンベルク裁判はドイツの戦争指導者を裁いたものです。","m":"東京裁判＝28名起訴・7名死刑（1948判決）、天皇は不起訴"},{"id":299,"k":"plan","ref":"想定問題","f":"現代","t":"湯川秀樹のノーベル賞","y":1949,"q":"1949年、中間子理論により日本人として初めてノーベル賞を受け、敗戦後の国民に大きな希望を与えた物理学者はだれですか。","c":["湯川秀樹","朝永振一郎","野口英世","江崎玲於奈"],"e":"湯川秀樹は中間子の存在を理論的に予言し、1949年にノーベル物理学賞を受賞しました。同じ年には古橋広之進が水泳で世界記録を出すなど、明るい話題が続きました。朝永振一郎の受賞は1965年、江崎玲於奈は1973年です。野口英世は黄熱病の研究で知られる細菌学者で、ノーベル賞は受けていません。","m":"湯川秀樹＝1949年、日本人初のノーベル賞（中間子論）"},{"id":300,"k":"plan","ref":"想定問題","f":"現代","t":"消費税の導入","y":1989,"q":"1989年、税率3％の消費税を導入した内閣の首相はだれですか。","c":["竹下登","中曽根康弘","大平正芳","橋本龍太郎"],"e":"大型間接税は大平正芳内閣の一般消費税、中曽根康弘内閣の売上税がいずれも反対で実現しませんでしたが、竹下登内閣が1988年に消費税法を成立させ、1989年4月から税率3％で実施しました。竹下内閣はリクルート事件で退陣しています。橋本龍太郎内閣は1997年に税率を5％に引き上げました。","m":"消費税3％＝竹下（1989）→5％＝橋本（1997）"}];
var FIELDS=["原始・古代","中世","近世","近代","現代"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="nichidai-nihonshi-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);if(!q.fix)a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.fix?"出典：日本大学 "+esc(q.ref)+"（試験問題を原文のまま掲載。解説・覚え方は独自に作成したもので、試験実施団体とは関係ありません）":q.k==="past"?"過去問ベース：日本大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（日本大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+(q.fix?String(ci+1):"abcde".charAt(j))+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+(q.fix?"過去問題（原文）":KIND[q.k])+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+(q.fix?"過去問題（原文）":KIND[q.k])+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

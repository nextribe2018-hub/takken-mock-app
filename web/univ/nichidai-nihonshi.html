<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>日大 日本史 10問テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 一枚の答案用紙。中央1カラム（最大640px）。問題文は試験冊子と同じ明朝、操作と数字はゴシック。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.passage{font-family:var(--f-exam);font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:50vh;overflow-y:auto}
.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){ .q{font-size:17px} .score b{font-size:44px} .fi{grid-template-columns:minmax(0,1fr)} .fi .btn{grid-column:1;grid-row:auto;justify-self:start} }
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

<script>
(function(){
"use strict";
var QS=[{"id":1,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問1","f":"原始・古代","t":"口分田の規定","y":701,"q":"律令制のもとで班給された口分田について述べた文として、正しいものはどれですか。","c":["口分田は売買することが禁じられていた。","口分田の収穫にかかる租は、すべて都の倉庫に運ばれた。","口分田を受けた人が死ぬと、次の班年を待たずにその年のうちに収公された。","女性には男性の3分の1の面積が班給された。"],"e":"口分田は国家から貸し与えられた田なので売買は禁止されていました。租は収穫の約3％で、大部分は国衙（諸国の役所）の正倉に蓄えられ、都へすべて運ばれたわけではありません。死者の口分田は次の班年に収公されました。女性の班給額は男性の3分の2で、3分の1は私奴婢の場合です。","m":"口分田＝売買禁止、女性は男性の2/3、死後は次の班年に収公"},{"id":2,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問2","f":"原始・古代","t":"班田収授の性格と変化","y":800,"q":"班田収授について述べた次の文ａ・ｂの正誤の組み合わせとして正しいものはどれですか。\nａ．人々に一定の耕地を与え、生活の基盤を保障するという面をもっていた。\nｂ．9世紀になると戸籍の偽りなどが増え、規定どおりに実施することが難しくなった。","c":["ａ・ｂともに正しい","ａは正しくｂは誤り","ａは誤りでｂは正しい","ａ・ｂともに誤り"],"e":"班田収授は6歳以上の男女に口分田を与えて生活を支え、そのかわりに租・調・庸などを負担させるしくみでした（ａは正しい）。9世紀には戸籍に女性を多く登録する偽籍や浮浪・逃亡が広がり、班田は長い間行われなくなっていきました（ｂも正しい）。10世紀初めの延喜の班田が最後とされます。","m":"班田は生活保障＋課税の基盤、9世紀に偽籍で行き詰まる"},{"id":3,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問3","f":"原始・古代","t":"律令制下の農民の困窮","y":750,"q":"律令制のもとで、凶作や重い負担のために困窮した農民について述べた文として、正しいものはどれですか。","c":["戸籍に登録された土地を離れ、他の地へ移る浮浪や逃亡をする者がいた。","困窮した農民は、政府の許可がなくても自由に出家して僧になることが認められていた。","困窮した農民を救うため、墾田永年私財法で口分田の売買が許された。","困窮した農民の様子は、山上憶良の漢詩として『懐風藻』に収められている。"],"e":"負担に耐えられない農民の中には、本籍地を離れる浮浪・逃亡をする者や、許可なく僧になる私度僧もいました。許可のない出家（私度）は禁じられていたので、自由に出家できたとする文は誤りです。墾田永年私財法は開墾地の私有を認めた法で、口分田の売買を許したものではありません。山上憶良の「貧窮問答歌」は和歌で、『万葉集』に収められています。","m":"負担から逃れる＝浮浪・逃亡・私度僧（無許可の出家は禁止）"},{"id":4,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問4","f":"原始・古代","t":"墾田永年私財法","y":743,"q":"743年に出された墾田永年私財法について述べた文として、正しいものはどれですか。","c":["開墾した田も政府に登録されて租を納める田とされ、政府の土地把握が広がった。","開墾した田は政府の管理から外れて租を納めない田となり、政府の土地支配は縮小した。","開墾した田は口分田と同じく、6年ごとに収公されることになった。","開墾できる面積に制限はなく、身分に関係なく無制限に私有できた。"],"e":"墾田永年私財法は開墾地の永久私有を認めましたが、墾田は租を納める輸租田であり、政府が把握する田地が増えたことから、律令国家の土地支配を広げる面がありました。不輸租田になったわけではありません。収公されないことが「永年私財」の意味です。また私有できる面積は位階などによって上限が定められていました。","m":"墾田＝永久私有だが輸租田、面積は位階で制限"},{"id":5,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問6","f":"原始・古代","t":"8世紀の新羅との関係","y":752,"q":"8世紀、日本と新羅の間ではしばしば緊張が生じました。その理由として最も適当なものはどれですか。","c":["日本は新羅を、自国に貢ぎ物を納める従属的な国として位置づけようとしたため。","日本が唐の冊封を受け、新羅より上位に立とうとしたため。","新羅が渤海と結んで九州北部に攻め込んだため。","日本は新羅との間で使節のやりとりをまったく行わなかったため。"],"e":"唐との関係を安定させた新羅は日本と対等の関係を求めましたが、日本は新羅を従属国（朝貢国）として扱おうとしたため、緊張が生じました。日本は遣唐使を送りましたが唐の冊封は受けていません。新羅と渤海はむしろ対立していました。日本からは遣新羅使も派遣されています。","m":"日本は新羅を従属国扱い→新羅は対等を主張して対立"},{"id":6,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問7","f":"原始・古代","t":"渤海との通交","y":727,"q":"7世紀末に中国東北部に建てられた渤海と日本との関係について述べた文として、正しいものはどれですか。","c":["唐・新羅との対立を背景に渤海が使節を派遣し、日本との間で親密な通交が続いた。","日本は渤海を自国より上位の国としてあつかった。","渤海は日本を対等の国としたため、両国は対立し使節の往来はなかった。","渤海は朝鮮半島南部を拠点とし、日本と海上で争った。"],"e":"渤海は靺鞨族や旧高句麗の人々が建てた国で、唐・新羅と対抗するために727年から日本に使節を送りました。日本は渤海を朝貢国のように位置づけましたが関係は良好で、のちには交易が中心となりました。越前の松原客院や能登客院が使節の受け入れに使われました。朝鮮半島南部は新羅の領域です。","m":"渤海は唐・新羅に対抗して日本と友好（727年から来日）"},{"id":7,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問8","f":"原始・古代","t":"鴻臚館","y":840,"q":"9世紀に九州北部に置かれ、外国使節の接待や、来航した新羅・唐の商人との交易の場となった施設はどれですか。","c":["鴻臚館","大輪田泊","松原客院","坊津"],"e":"大宰府の管理下で博多に置かれた鴻臚館は、外国使節の迎賓施設であり、9世紀以降は来航する新羅・唐の商人との交易の場となりました。大輪田泊は摂津の港で、平清盛が日宋貿易のために修築しました。松原客院は越前に置かれた渤海使の宿泊施設、坊津は薩摩の港です。","m":"博多の鴻臚館＝外交と交易の窓口（大宰府が管理）"},{"id":8,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問10","f":"原始・古代","t":"刀伊の入寇","y":1019,"q":"1019年、沿海州地方の女真族（刀伊）が対馬・壱岐や九州北部を襲いました。このときの対応として正しいものはどれですか。","c":["大宰権帥藤原隆家が九州の武士らを指揮して撃退した。","藤原秀郷が九州の武士らを指揮して撃退した。","大宰権帥藤原隆家が朝廷から派遣された東国の武士を指揮して撃退した。","源頼信が東国の武士を率いて九州に下り、撃退した。"],"e":"刀伊の入寇では、大宰権帥であった藤原隆家が九州の在地の武士たちを指揮して撃退しました。中央から軍勢が派遣されたわけではありません。藤原秀郷は10世紀に平将門の乱を鎮めた人物、源頼信は11世紀前半に平忠常の乱を鎮めた人物です。","m":"刀伊の入寇（1019）＝藤原隆家＋九州の武士"},{"id":9,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問11","f":"原始・古代","t":"前九年合戦","y":1062,"q":"源頼義が陸奥の豪族と戦った前九年合戦について、頼義に滅ぼされた豪族と、頼義に味方した出羽の豪族の組み合わせとして正しいものはどれですか。","c":["滅ぼされた豪族―安倍氏、味方した豪族―清原氏","滅ぼされた豪族―清原氏、味方した豪族―安倍氏","滅ぼされた豪族―安倍氏、味方した豪族―奥州藤原氏","滅ぼされた豪族―安藤氏、味方した豪族―清原氏"],"e":"前九年合戦（1051〜62年）では、陸奥の安倍氏が源頼義・義家と戦い、出羽の清原氏の助けを得た頼義が安倍氏を滅ぼしました。その後、清原氏の内紛から後三年合戦がおこり、源義家が藤原（清原）清衡を助けて平定し、奥州藤原氏の繁栄につながります。安藤氏は鎌倉〜室町期に津軽の十三湊を拠点とした豪族です。","m":"前九年＝安倍氏滅亡（清原氏が援軍）、後三年＝清原氏の内紛"},{"id":10,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問13","f":"中世","t":"和田合戦","y":1213,"q":"1213年の和田合戦について述べた文として、正しいものはどれですか。","c":["北条義時が侍所別当の和田義盛を滅ぼし、政所別当とあわせて侍所別当の地位も得た。","北条貞時が和田義盛を滅ぼし、得宗とその家臣である御内人の権力が強まった。","和田義盛が北条氏に勝利し、侍所別当として幕府の実権を握った。","北条時頼が和田義盛を滅ぼし、執権政治が確立した。"],"e":"和田合戦は、侍所別当の和田義盛が北条義時の挑発を受けて挙兵し、敗れて一族が滅んだ戦いです。これにより義時は政所別当に加えて侍所別当も兼ね、執権の地位を固めました。北条貞時は13世紀末の執権、北条時頼は1247年の宝治合戦で三浦泰村を滅ぼした執権です。","m":"和田合戦（1213）→義時が政所＋侍所の別当を兼ねる"},{"id":11,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問15","f":"中世","t":"鎌倉幕府の滅亡","y":1333,"q":"1333年、北条高時ら得宗一門が鎌倉で自害し、鎌倉幕府は滅亡しました。その直接のきっかけとなった出来事として正しいものはどれですか。","c":["御家人の新田義貞が幕府に背き、鎌倉を攻めた。","内管領平頼綱が専横をふるい、御家人の反発を招いた。","有力御家人の安達泰盛が平頼綱と対立した。","楠木正成が千早城から鎌倉に攻め上って陥落させた。"],"e":"1333年、上野の御家人新田義貞が挙兵して鎌倉を攻め落とし、得宗の北条高時らは自害しました。同じころ足利高氏（尊氏）も六波羅探題を攻め落としています。安達泰盛が平頼綱に滅ぼされたのは1285年の霜月騒動、平頼綱の専横とその滅亡（平禅門の乱）は1293年です。楠木正成は畿内で幕府軍と戦いましたが鎌倉は攻めていません。","m":"鎌倉攻略＝新田義貞、六波羅攻略＝足利高氏"},{"id":12,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問16","f":"中世","t":"初代鎌倉公方","y":1349,"q":"1349年に鎌倉に下り、関東を治める最初の鎌倉公方となった人物はだれですか。","c":["足利基氏","足利成氏","足利義詮","足利持氏"],"e":"足利尊氏は子の基氏を鎌倉に下し、関東の支配を担う鎌倉府の長官（鎌倉公方）としました。以後、基氏の子孫が鎌倉公方を世襲します。足利義詮は基氏の兄で2代将軍です。足利持氏は永享の乱で滅ぼされた4代鎌倉公方、成氏は持氏の子で、のちに下総古河に移り古河公方となりました。","m":"鎌倉公方は基氏の子孫が世襲（基氏→氏満→満兼→持氏→成氏）"},{"id":13,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問17","f":"中世","t":"観応の擾乱と半済令","y":1350,"q":"観応の擾乱について、その原因と、この動乱のなかで出された法令の組み合わせとして正しいものはどれですか。","c":["足利尊氏の執事高師直と、尊氏の弟直義の対立―半済令","足利尊氏の執事高師直と、尊氏の弟直義の対立―撰銭令","足利直義と後醍醐天皇の対立―半済令","足利直義と後醍醐天皇の対立―撰銭令"],"e":"観応の擾乱（1350〜52年）は、新しい勢力に支えられた執事高師直と、秩序を重んじる足利直義との対立から始まり、尊氏・直義兄弟の争いに発展しました。この動乱の中、1352年に近江・美濃・尾張の荘園の年貢の半分を軍費として守護に認める半済令が出されました。撰銭令は悪銭の流通を規制する法令で、室町幕府や戦国大名が出しました。","m":"観応の擾乱（師直vs直義）→1352年 半済令"},{"id":14,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問18","f":"中世","t":"永享の乱","y":1439,"q":"鎌倉公方足利持氏と関東管領上杉憲実の対立から起こった永享の乱の結果として、正しいものはどれですか。","c":["6代将軍足利義教が軍を送り、持氏を滅ぼした。","6代将軍足利義教が軍を送り、上杉憲実を滅ぼした。","8代将軍足利義政が軍を送り、持氏を滅ぼした。","8代将軍足利義政が軍を送り、上杉憲実を滅ぼした。"],"e":"持氏は将軍の地位を望み幕府と対立していました。これをいさめた関東管領上杉憲実と持氏が対立すると、専制的な政治を進めた6代将軍足利義教は軍を送り、1439年に持氏を滅ぼしました（永享の乱）。義教自身は1441年の嘉吉の変で赤松満祐に殺されます。義政は8代将軍で、応仁の乱の時期の将軍です。","m":"永享の乱＝義教が持氏を討つ→嘉吉の変で義教暗殺"},{"id":15,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問19","f":"中世","t":"戦国初期の関東","y":1480,"q":"15世紀後半以降の関東・東国の情勢について述べた文として、正しいものはどれですか。","c":["上杉氏は山内家と扇谷家に分かれて抗争し、関東の戦乱が長く続いた。","持氏の子足利成氏は伊豆に移って堀越公方となった。","甲斐の武田氏は分国法として「塵芥集」を定めた。","伊勢宗瑞（北条早雲）は下総の古河公方を倒し、これを足がかりに相模へ進んだ。"],"e":"鎌倉府の分裂後、上杉氏の扇谷家と山内家が争い、関東は戦国の争乱に入りました。足利成氏は下総古河に移って古河公方となり、将軍義政の兄弟足利政知が伊豆の堀越公方となりました。「塵芥集」は陸奥の伊達氏の分国法で、武田氏は「甲州法度之次第」です。伊勢宗瑞が滅ぼしたのは堀越公方です。","m":"成氏＝古河公方、政知＝堀越公方（宗瑞が滅ぼす）"},{"id":16,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問20","f":"中世","t":"南北朝期の出来事の時期","y":1378,"q":"1352年から1392年までの間に起こった出来事として、正しいものはどれですか。","c":["足利義満が京都の室町に花の御所を造営した。","正長の徳政一揆が起こった。","朝鮮軍が倭寇の根拠地とみなした対馬を襲撃した。","鎌倉幕府が建長寺再建の費用を得るため、元に船を送った。"],"e":"足利義満は1378年に京都室町に花の御所を造営し、ここで政治を行いました。正長の徳政一揆は1428年、朝鮮が対馬を襲った応永の外寇は1419年で、いずれも1392年より後です。建長寺船の派遣は1325年で、鎌倉幕府の時期です。","m":"花の御所1378、応永の外寇1419、正長の一揆1428"},{"id":17,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問22","f":"近世","t":"養生所と人足寄場","y":1722,"q":"江戸幕府の改革のなかで江戸に設けられた施設と、その設置が行われた改革の組み合わせとして、正しいものはどれですか。","c":["小石川養生所―享保の改革、石川島人足寄場―寛政の改革","小石川養生所―寛政の改革、石川島人足寄場―享保の改革","小石川養生所―享保の改革、石川島人足寄場―天保の改革","小石川養生所―天保の改革、石川島人足寄場―寛政の改革"],"e":"小石川養生所は、徳川吉宗の享保の改革で、目安箱への小川笙船の投書をきっかけに設けられた貧しい病人のための施療施設です。石川島の人足寄場は、松平定信の寛政の改革で、無宿人を収容して職業訓練を行うために設けられました。天保の改革（水野忠邦）では株仲間の解散や人返しの法が出されています。","m":"目安箱→養生所（享保）、無宿人→人足寄場（寛政）"},{"id":18,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問23","f":"近世","t":"ケンペル『日本誌』","y":1801,"q":"元禄期に来日したドイツ人医師ケンペルの著書『日本誌』について述べた文として、正しいものはどれですか。","c":["長崎のオランダ通詞志筑忠雄がその一部を訳し、訳書に『鎖国論』の題をつけた。","杉田玄白らによって訳され、『解体新書』として刊行された。","オランダ語と日本語を対照させた辞書であった。","日本に潜入した宣教師シドッチの話をもとにまとめられた。"],"e":"ケンペルはオランダ商館の医師として来日し、帰国後に日本を紹介する著作を残しました。その付録の論文を長崎の通詞志筑忠雄が1801年に訳した際、「鎖国論」と題したことから「鎖国」という語が生まれました。『解体新書』の原書はドイツ人の解剖書のオランダ語訳『ターヘル＝アナトミア』です。シドッチを尋問して書かれたのは新井白石の『西洋紀聞』です。","m":"ケンペル『日本誌』→志筑忠雄『鎖国論』で「鎖国」の語が誕生"},{"id":19,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問24","f":"近世","t":"シーボルト事件","y":1828,"q":"1828年、オランダ商館医シーボルトが帰国の際に日本地図を持ち出そうとして発覚した事件について、正しいものはどれですか。","c":["地図を渡した幕府天文方の高橋景保が処罰された。","シーボルトはこの事件の前、長崎の芝蘭堂で蘭学を教えていた。","この事件を批判した渡辺崋山と高野長英が処罰された。","この事件をきっかけに、天文方に蛮書和解御用が設けられた。"],"e":"シーボルト事件では、伊能忠敬の測量に基づく地図をシーボルトに渡した天文方の高橋景保が投獄され、シーボルトは国外追放となりました。シーボルトが長崎郊外に開いた塾は鳴滝塾で、芝蘭堂は大槻玄沢が江戸に開いた塾です。渡辺崋山・高野長英が処罰された蛮社の獄はモリソン号事件への批判が原因です。蛮書和解御用は1811年に設けられました。","m":"シーボルト事件→高橋景保処罰、塾は鳴滝塾"},{"id":20,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問25","f":"近世","t":"近世の蝦夷地と北方探査","y":1809,"q":"近世の蝦夷地や北方地域について述べた文として、正しいものはどれですか。","c":["間宮林蔵が樺太と大陸の間に海峡があることを確かめた。","北前船は東廻り航路で蝦夷地・北陸と大坂を結んだ。","松前藩は蝦夷地の米の生産高をもとに石高を与えられていた。","蝦夷地の漁業ではカツオ漁が中心で、干鰯の原料となった。"],"e":"間宮林蔵は1808〜09年に樺太を調査し、樺太が島であることを確認しました（間宮海峡）。北前船は日本海から下関を回る西廻り航路で蝦夷地・北陸と大坂を結びました。松前藩は米がとれないため石高がなく、アイヌとの交易権を家臣に与える商場知行制をとりました。蝦夷地ではニシンやサケの漁が盛んで、ニシンは〆粕などの肥料に加工されました。","m":"間宮林蔵＝樺太は島、北前船＝西廻り、松前藩＝商場知行制"},{"id":21,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問26","f":"近世","t":"ラクスマンの来航","y":1792,"q":"1792年に来航したロシア使節ラクスマンについて述べた文として、正しいものはどれですか。","c":["漂流民大黒屋光太夫を連れて根室に来航し、通商を求めた。","長崎に来航し、幕府の拒絶に怒った部下が樺太や択捉島を攻撃した。","幕府はその求めに応じ、箱館での通商を始めた。","皇帝ニコライ1世の命を受けて来航した。"],"e":"ラクスマンはエカチェリーナ2世の使節として、伊勢の漂流民大黒屋光太夫を送り届けるため根室に来航し、通商を求めました。幕府は通商を認めず、長崎への入港許可証（信牌）を与えました。その信牌を持って1804年に長崎に来航したのがレザノフで、拒絶ののち部下が樺太・択捉を攻撃しました。","m":"ラクスマン＝根室・光太夫、レザノフ＝長崎"},{"id":22,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問27","f":"近世","t":"四つの口","y":1650,"q":"江戸時代の対外関係について述べた文として、正しいものはどれですか。","c":["長崎・対馬・薩摩・松前の四つの窓口を通じて、異国や異民族と交流した。","長崎・平戸・薩摩・松前の四つの窓口を通じて、異国や異民族と交流した。","徳川家康の時代に、明との正式な国交が回復した。","琉球との外交は、対馬の宗氏を通じて行われた。"],"e":"江戸幕府は長崎（オランダ・中国）、対馬（朝鮮）、薩摩（琉球）、松前（アイヌ）の「四つの口」を通じて対外関係を持ちました。平戸のオランダ商館は1641年に長崎の出島に移されています。家康は明との国交回復を望みましたが実現せず、中国船との私貿易が長崎で行われました。琉球は薩摩の島津氏の支配下にありました。","m":"四つの口＝長崎・対馬・薩摩・松前（平戸は×）"},{"id":23,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問28","f":"近世","t":"徳川家宣の政治","y":1709,"q":"6代将軍徳川家宣の時代について述べた文として、正しいものはどれですか。","c":["前将軍の時代に出された生類憐みの令が廃止された。","海舶互市新例で、長崎に来航する清・オランダ船との取引額の枠を広げた。","朝廷との融和をはかる新井白石の意見に反対し、閑院宮家の創設を認めなかった。","天皇の父への太上天皇号の宣下を求める朝廷の要求を退けた。"],"e":"家宣は将軍就任後すぐに生類憐みの令を廃止しました。新井白石の正徳の政治では、海舶互市新例で長崎貿易の額を制限し（引き上げではない）、朝廷との関係強化のため閑院宮家を創設しました。太上天皇号をめぐる朝廷の要求を退けたのは、寛政期の尊号一件（松平定信）です。","m":"家宣＝生類憐み廃止、白石が閑院宮家創設・貿易制限"},{"id":24,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問30","f":"近世","t":"朝鮮通信使と将軍の称号","y":1711,"q":"江戸時代の朝鮮との関係について述べた文として、正しいものはどれですか。","c":["新井白石は朝鮮の国書での将軍の称号を「大君」から「日本国王」に改めたが、徳川吉宗は「大君」に戻した。","朝鮮通信使は、朝鮮で新しい国王が即位するたびに来日した。","1811年の朝鮮通信使は江戸まで行列し、将軍に謁見した。","朝鮮との外交や貿易は、薩摩藩が仲介して行われた。"],"e":"朝鮮通信使は主に将軍の代替わりを祝う目的で来日しました。新井白石は通信使の待遇を簡素化し、将軍の称号を「日本国王」としましたが、吉宗は「大君」に戻しました。1811年の通信使は経費削減のため対馬で応接され（易地聘礼）、江戸には来ていません。朝鮮との窓口は対馬の宗氏でした。","m":"通信使＝将軍代替わり、白石「国王」→吉宗「大君」"},{"id":25,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問31","f":"近代","t":"明治十四年の政変","y":1881,"q":"1881年の明治十四年の政変について述べた文として、正しいものはどれですか。","c":["大隈重信が政府から追放され、国会開設の勅諭で1890年の国会開設が約束された。","伊藤博文が政府から追放され、大隈重信が政府の主導権を握った。","国会開設の勅諭で、1885年に国会を開設することが約束された。","大隈重信はドイツ流の君主権の強い憲法の制定を主張した。"],"e":"政変の背景には、イギリス流の議院内閣制と早期の国会開設を唱えた大隈重信と、これに反対する岩倉具視・伊藤博文らとの対立がありました。開拓使官有物払下げ事件で世論が高まるなか、政府は大隈を罷免し、同時に国会開設の勅諭を出して1890年の国会開設を約束しました。ドイツ流の憲法を目指したのは伊藤らです。","m":"大隈追放＋国会開設の勅諭（1890年開設を約束）"},{"id":26,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問32","f":"近代","t":"秩父事件","y":1884,"q":"松方デフレのもとで負債に苦しんだ農民たちが困民党をつくり、1884年、自由党の一部の党員とともに高利貸や郡役所を襲う大規模な武装蜂起を起こしました。この事件はどれですか。","c":["秩父事件","福島事件","加波山事件","大阪事件"],"e":"埼玉県秩父地方の農民が困民党を結成し、高利貸への負債の減免などを求めて蜂起したのが秩父事件で、軍隊によって鎮圧されました。福島事件（1882年）は県令三島通庸と自由党員の衝突、加波山事件（1884年）は茨城の急進的自由党員の蜂起、大阪事件（1885年）は朝鮮の改革を企てた大井憲太郎らの計画です。","m":"困民党の大蜂起＝秩父事件（1884）"},{"id":27,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問33","f":"近代","t":"ポーツマス条約後の満洲・韓国","y":1906,"q":"日露戦争とその講和条約（ポーツマス条約）に関連して述べた文として、正しいものはどれですか。","c":["条約で譲られた長春以南の鉄道などをもとに、南満洲鉄道株式会社が設立された。","南満洲鉄道株式会社は、アメリカとの共同出資で設立された。","第1次日韓協約は、ポーツマス条約の締結後に結ばれた。","日本はポーツマス条約で、ロシアから多額の賠償金を得た。"],"e":"ポーツマス条約で日本は長春以南の鉄道と付属の権利を得て、1906年に半官半民の南満洲鉄道株式会社を設立しました。アメリカの鉄道王ハリマンの共同経営案は日本が断っています。第1次日韓協約は戦争中の1904年に結ばれました。条約では賠償金が得られず、日比谷焼打ち事件が起こりました。","m":"満鉄（1906）＝半官半民、ハリマン案は拒否、賠償金なし"},{"id":28,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問34","f":"近代","t":"尾崎行雄と第一次護憲運動","y":1913,"q":"第一次護憲運動の際、帝国議会で、天皇の詔勅を利用して政敵を倒そうとしていると第3次桂太郎内閣を激しく批判する演説を行った立憲政友会の議員はだれですか。","c":["尾崎行雄","犬養毅","浜口雄幸","山県有朋"],"e":"1913年、立憲政友会の尾崎行雄は内閣不信任案の説明演説で、桂首相が天皇を盾とし詔勅を弾丸の代わりにしていると批判しました。犬養毅は立憲国民党の立場から尾崎とともに運動の先頭に立った人物ですが、この演説の主ではありません。浜口雄幸は昭和初期の首相、山県有朋は長州閥の元老で、運動の批判対象の側です。","m":"「玉座を胸壁とし詔勅を弾丸に」＝尾崎行雄の桂批判"},{"id":29,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問36","f":"近代","t":"1925年普通選挙法の有権者","y":1925,"q":"1925年に成立した普通選挙法により、満25歳以上の男性に選挙権が与えられました。この改正時点での有権者は全人口のおよそ何％にあたりますか。","c":["約20％","約5.5％","約1.1％","約48％"],"e":"有権者の割合は、1889年の衆議院議員選挙法（直接国税15円以上）で約1.1％、1919年の改正（3円以上）で約5.5％、1925年の普通選挙法で約20％となり、1945年の改正で女性参政権が認められ約48％に拡大しました。数字は選挙法改正の内容と組み合わせて覚えましょう。","m":"1.1％→2.2％→5.5％→20％→48％"},{"id":30,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問37","f":"近代","t":"1928年総選挙と無産政党","y":1928,"q":"1928年の初の男性普通選挙による総選挙で、議席を獲得した無産政党に含まれないものはどれですか。","c":["日本共産党","社会民衆党","日本労農党","労働農民党"],"e":"1928年の総選挙では、社会民衆党・日本労農党・労働農民党などの無産政党が計8名の当選者を出しました。日本共産党は非合法の政党で、党として公然と候補者を立てることはできず、一部の党員が労働農民党から立候補しました。選挙後、政府は三・一五事件で共産党員を一斉に検挙しました。","m":"共産党は非合法→1928年 三・一五事件で検挙"},{"id":31,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問38","f":"近代","t":"1928年の治安維持法改正","y":1928,"q":"1928年の出来事として、正しいものはどれですか。","c":["緊急勅令により治安維持法が改正され、最高刑が死刑に引き上げられた。","加藤高明内閣のもとで治安維持法が初めて制定された。","特別高等警察が初めて警視庁に設けられた。","満25歳以上の男性に選挙権を与える普通選挙法が成立した。"],"e":"田中義一内閣は1928年、緊急勅令で治安維持法を改正し、「国体」の変革を目的とする結社の指導者などへの最高刑を死刑としました。同年、特別高等警察（特高）が全国に置かれています。治安維持法と普通選挙法の成立はともに1925年（加藤高明内閣）、特高が警視庁に初めて置かれたのは大逆事件後の1911年です。","m":"1928年 田中義一内閣：治安維持法に死刑、特高を全国設置"},{"id":32,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問39","f":"近代","t":"1930年代の思想統制","y":1937,"q":"満洲事変以降の言論・思想の統制について述べた文として、正しいものはどれですか。","c":["日中戦争が始まると、第1次近衛文麿内閣は節約・貯蓄など国民の戦争協力をよびかける国民精神総動員運動を始めた。","天皇機関説を否定する国体明徴声明は、斎藤実内閣が出した。","滝川事件で休職処分を受けた滝川幸辰は、東京帝国大学の教授であった。","日本共産党の幹部は、獄中でも全員が転向を拒み続けた。"],"e":"日中戦争が始まった1937年、第1次近衛内閣は国民精神総動員運動を始めました。国体明徴声明（1935年）を出したのは岡田啓介内閣です。滝川事件（1933年）で休職処分となった滝川幸辰は京都帝国大学の教授です。1933年には共産党幹部の佐野学・鍋山貞親が獄中から転向声明を出し、転向が相次ぎました。","m":"国体明徴＝岡田内閣、滝川事件＝京大、精神総動員＝近衛"},{"id":33,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問40","f":"現代","t":"単独講和と全面講和","y":1951,"q":"サンフランシスコ平和条約の締結をめぐる講和論争について述べた文として、正しいものはどれですか。","c":["日本社会党や日本共産党などは、ソ連・中国を含むすべての交戦国との全面講和を主張した。","吉田茂内閣は全面講和を主張し、西側諸国だけとの講和に反対した。","単独講和とは、すべての交戦国と一度に講和条約を結ぶことをいう。","南原繁ら知識人の多くは、単独講和の早期実現を求めた。"],"e":"冷戦のもとで、吉田茂内閣はアメリカなど西側諸国との講和（単独講和・片面講和）を進めました。これに対し、日本社会党・日本共産党などの革新勢力や南原繁ら知識人は、ソ連・中国を含む全交戦国との全面講和を主張しました。単独講和とは一部の交戦国とだけ講和することです。","m":"吉田＝単独講和、革新勢力・南原繁＝全面講和"},{"id":34,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問42","f":"近代","t":"大戦景気と化学工業","y":1916,"q":"第一次世界大戦期の日本経済（大戦景気）について述べた文として、正しいものはどれですか。","c":["ドイツなどからの薬品・染料・肥料の輸入がとだえ、国内で化学工業がおこった。","物価が大きく下落し、都市の労働者の生活は楽になった。","生糸は主にアジア諸国向けに輸出を伸ばした。","日本は債権国から債務国に転落し、対外投資は減少した。"],"e":"大戦中、ドイツなどからの輸入がとだえたため、薬品・染料・肥料などの化学工業がおこりました。物価は大きく上昇し、米騒動の背景となりました。生糸はアメリカ向けに、綿織物はアジア市場向けに輸出が伸びました。日本は債務国から債権国となり、中国への投資も拡大しました。","m":"大戦景気：化学工業発達、生糸は対米・綿織物はアジア、債権国へ"},{"id":35,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問43","f":"近代","t":"大衆雑誌『キング』","y":1925,"q":"1925年に創刊され、まもなく発行部数100万部を超えた大衆娯楽雑誌はどれですか。","c":["『キング』","『改造』","『赤い鳥』","『中央公論』"],"e":"大正末から昭和初期にかけて大衆文化が広がり、講談社の『キング』は1925年に創刊され、100万部を超えました。『改造』（1919年創刊）と『中央公論』は大正デモクラシーを支えた総合雑誌、『赤い鳥』は鈴木三重吉が創刊した児童文芸雑誌です。","m":"100万部の大衆雑誌＝『キング』、総合雑誌＝『中央公論』『改造』"},{"id":36,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問44","f":"現代","t":"米の生産調整","y":1970,"q":"高度経済成長期の社会について述べた文として、正しいものはどれですか。","c":["食生活の変化で米が余るようになり、1970年から米の生産調整（減反）が始められた。","1960年の時点で、すでに8割を超える世帯がカラーテレビを持っていた。","東京オリンピックと同じ1964年に、大阪で日本万国博覧会が開かれた。","1970年に東京でオリンピックが開かれた。"],"e":"食生活の洋風化で米の消費が減り、食糧管理制度のもとで米が余ったため、政府は1970年から減反政策を始めました。1960年代前半に普及したのは白黒テレビで、カラーテレビの普及は1970年前後からです。東京オリンピックは1964年、大阪の日本万国博覧会は1970年です。","m":"東京五輪1964、大阪万博1970、減反開始1970"},{"id":37,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問45","f":"現代","t":"全国総合開発計画","y":1962,"q":"1960年代以降の地域開発について述べた文として、正しいものはどれですか。","c":["1962年、池田勇人内閣は地域間の格差是正をめざす全国総合開発計画を決定した。","佐藤栄作は「日本列島改造論」をかかげて首相となった。","全国総合開発計画は、1950年代前半に鳩山一郎内閣が策定した。","池田勇人内閣は「日本列島改造論」にもとづき、新幹線網の整備を進めた。"],"e":"地域間の格差是正をめざし、1962年に池田勇人内閣のもとで全国総合開発計画が策定され、新産業都市などが指定されました。「日本列島改造論」は1972年に首相となった田中角栄がかかげた政策で、地価の高騰を招きました。鳩山一郎内閣は日ソ共同宣言で国交を回復した内閣です。","m":"全総（1962）＝池田、日本列島改造論＝田中角栄"},{"id":38,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問1","f":"原始・古代","t":"庚午年籍","y":670,"q":"667年に都を近江大津宮に移し、翌年即位した天皇（中大兄皇子）の政策として、正しいものはどれですか。","c":["初めての全国的な戸籍である庚午年籍をつくった。","筑紫国造磐井の反乱を鎮め、各地に屯倉を設けた。","富本銭とよばれる銅銭を鋳造させた。","飛鳥浄御原令を施行した。"],"e":"天智天皇は670年に最初の全国的戸籍である庚午年籍をつくりました。庚午年籍は氏姓の根本台帳として永久保存とされました。磐井の乱（527年）は6世紀の継体天皇の時代、富本銭は天武天皇の時代に鋳造されたと考えられる銭、飛鳥浄御原令は持統天皇が689年に施行しました。","m":"天智天皇＝近江大津宮・庚午年籍（670、永久保存）"},{"id":39,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問2","f":"原始・古代","t":"藤原京の構造","y":694,"q":"694年に遷都された藤原京について述べた文として、正しいものはどれですか。","c":["宮が京のほぼ中央に置かれ、日本で最初の本格的な条坊制をもつ都城であった。","宮が京の北端に置かれ、京の東側には外京が張り出していた。","宮が京のほぼ中央に置かれ、京の東側には外京が張り出していた。","宮が京の北端に置かれ、桓武天皇が遷都した。"],"e":"藤原京は持統天皇が遷都した、条坊制を取り入れた最初の本格的な都城で、宮（藤原宮）は京のほぼ中央に位置していました。宮が北端に置かれ、東側に外京が張り出していたのは平城京の特徴です。桓武天皇が遷都したのは長岡京と平安京です。","m":"藤原京＝宮は中央、平城京＝宮は北端＋外京"},{"id":40,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問4","f":"原始・古代","t":"長岡京の放棄","y":794,"q":"784年に遷都された長岡京は、10年ほどで放棄されました。その事情として最も適当なものはどれですか。","c":["洪水の被害に加え、早良親王の怨霊によるとされる災いが相次いだため。","造営長官藤原種継の怨霊が災いを起こすと恐れられたため。","菅野真道の主張によって、造都事業そのものが打ち切られたため。","蝦夷との戦いを優先し、遷都の計画が取りやめられたため。"],"e":"長岡京では造営長官藤原種継が暗殺され、関わったとされた皇太子早良親王が死去しました。その後、天皇の近親者の死や病気が続いて早良親王の怨霊のせいとされ、さらに洪水の被害もあって、794年に平安京へ移りました。怨霊とされたのは種継ではありません。菅野真道が関わったのは805年の徳政相論で、平安京の造作と蝦夷との戦いの継続を主張した側であり、長岡京の放棄とは関係がありません。蝦夷との戦いも長岡京の時代に続けられていました。","m":"長岡京：種継暗殺→早良親王の怨霊＋洪水→平安京へ"},{"id":41,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問5","f":"原始・古代","t":"奈良時代の政変と詔の順序","y":743,"q":"次の出来事を古いものから順に並べたとき、2番目にくるものはどれですか。\n・国分寺建立の詔　・大仏造立の詔　・橘奈良麻呂の変　・恵美押勝の乱","c":["大仏造立の詔","国分寺建立の詔","橘奈良麻呂の変","恵美押勝の乱"],"e":"聖武天皇は741年に恭仁京で国分寺建立の詔を、743年に紫香楽宮で大仏造立の詔を出しました。その後、藤原仲麻呂が台頭し、757年に仲麻呂打倒をはかった橘奈良麻呂の変が鎮圧されました。仲麻呂（恵美押勝）は764年に道鏡を除こうとして反乱を起こし敗死しました。","m":"国分寺741→大仏743→奈良麻呂757→押勝764"},{"id":42,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問7","f":"原始・古代","t":"『土佐日記』","y":935,"q":"「男もすなる日記といふものを、女もしてみむとてするなり」と書き出され、作者が女性に仮託して、かな文字で記した日記の作者はだれですか。","c":["紀貫之","和泉式部","藤原道綱母","菅原孝標女"],"e":"これは『土佐日記』の冒頭で、土佐守の任期を終えた紀貫之が帰京の旅を女性の筆に仮託して、かなで記しました。紀貫之は『古今和歌集』の撰者でもあります。和泉式部は『和泉式部日記』、藤原道綱母は『蜻蛉日記』、菅原孝標女は『更級日記』の作者です。","m":"かな日記の始まり＝紀貫之『土佐日記』"},{"id":43,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問8","f":"原始・古代","t":"貴族の日記","y":1000,"q":"摂関期の貴族は、儀式や先例を子孫に伝えるため漢文の日記を残しました。日記とその筆者の組み合わせとして、正しいものはどれですか。","c":["『小右記』―藤原実資","『御堂関白記』―藤原頼通","『更級日記』―和泉式部","『西宮記』―藤原公任"],"e":"『小右記』は藤原実資の日記で、藤原道長が「この世をば…」の歌を詠んだ場面を記録したことで知られます。『御堂関白記』は道長の日記です。『更級日記』は菅原孝標女のかな日記です。『西宮記』は源高明の儀式書で、藤原公任の儀式書は『北山抄』です。","m":"『小右記』＝実資、『御堂関白記』＝道長"},{"id":44,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問9","f":"原始・古代","t":"空也","y":950,"q":"10世紀、京の市で念仏を広め、「市聖」「阿弥陀聖」とよばれた僧はだれですか。","c":["空也","行基","源信","一遍"],"e":"空也は10世紀半ばに京の市で人々に念仏をすすめ、市聖とよばれました。行基は奈良時代に民間布教や社会事業を行った僧、源信は『往生要集』を著した天台僧、一遍は鎌倉時代に踊念仏で時宗を広めた僧です。浄土教は空也・源信らによって貴族から庶民へ広がりました。","m":"市聖＝空也（10世紀）、踊念仏＝一遍（鎌倉）"},{"id":45,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問10","f":"原始・古代","t":"『往生要集』","y":985,"q":"経典から極楽往生に関する重要な文を集め、念仏による往生を説いて985年に源信が著した書物はどれですか。","c":["『往生要集』","『日本往生極楽記』","『扶桑略記』","『選択本願念仏集』"],"e":"源信（恵心僧都）は『往生要集』で地獄と極楽のありさまを示し、念仏による往生を説きました。『日本往生極楽記』は慶滋保胤による往生伝、『扶桑略記』は皇円による歴史書、『選択本願念仏集』は鎌倉初期に法然が専修念仏を説いた書です。","m":"源信『往生要集』、慶滋保胤『日本往生極楽記』"},{"id":46,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問11","f":"原始・古代","t":"平忠常の乱","y":1028,"q":"1028年に東国で起こった平忠常の乱について述べた文として、正しいものはどれですか。","c":["房総半島の上総・下総などを舞台とし、源頼信によって鎮められた。","上野国で起こり、藤原秀郷によって鎮められた。","上総国で起こり、平貞盛と藤原秀郷によって鎮められた。","陸奥国で起こり、源頼義・義家によって鎮められた。"],"e":"平忠常は上総・下総・安房で反乱を起こし、源頼信が平定しました。これをきっかけに源氏は東国に勢力を広げます。平貞盛と藤原秀郷が鎮めたのは939年に始まる平将門の乱、源頼義・義家が戦ったのは陸奥の前九年合戦です。平忠常の乱は房総一帯を荒廃させた大規模な反乱でした。","m":"平忠常の乱＝房総・源頼信→源氏の東国進出"},{"id":47,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問12","f":"原始・古代","t":"後三条天皇の親政","y":1069,"q":"1068年に即位した後三条天皇の政治について述べた文として、正しいものはどれですか。","c":["延久の荘園整理令を出し、記録荘園券契所を設けて荘園の証拠書類を審査した。","院の御所に北面の武士に加えて西面の武士を置いた。","摂津の大輪田泊を改修し、日宋貿易を盛んにした。","摂関家の娘を母にもち、藤原頼通に政治をまかせた。"],"e":"後三条天皇は摂関家を外戚としない天皇で、大江匡房ら中下級の学者・官人を登用して親政を行いました。1069年には延久の荘園整理令を出し、記録荘園券契所で荘園の証拠書類を厳しく審査しました。西面の武士は後鳥羽上皇、大輪田泊の修築は平清盛です。","m":"後三条＝摂関家と外戚関係なし、記録荘園券契所"},{"id":48,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問13","f":"中世","t":"院政期の建築","y":1100,"q":"1124年に奥州藤原氏の藤原清衡が建てた中尊寺金色堂と同じ院政期の建築物はどれですか。","c":["富貴寺大堂","円覚寺舎利殿","東大寺法華堂","室生寺金堂"],"e":"院政期には浄土教が地方にも広がり、豊後の富貴寺大堂、陸奥の白水阿弥陀堂などの阿弥陀堂が建てられました。円覚寺舎利殿は禅宗様の建築（鎌倉〜室町期）、東大寺法華堂は奈良時代、室生寺金堂は平安時代初期の建築です。金色堂は奥州藤原氏の繁栄を示す阿弥陀堂として知られます。","m":"院政期の地方阿弥陀堂＝中尊寺金色堂・富貴寺大堂・白水阿弥陀堂"},{"id":49,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問15","f":"中世","t":"日明貿易の中断と再開","y":1432,"q":"15世紀に始まった日明貿易について述べた文として、正しいものはどれですか。","c":["4代将軍足利義持が朝貢の形式を嫌って中断したが、6代将軍足利義教が再開した。","日本からの主な輸出品は生糸で、明からは銅や刀剣が輸入された。","勘合は日本の幕府が発行し、明の船に持たせて貿易を管理した。","明から輸入された銭には、永楽通宝のほか和同開珎も含まれていた。"],"e":"足利義満が始めた日明貿易は朝貢形式だったため、義持は中断しましたが、義教が1432年に再開しました。日本は銅・硫黄・刀剣などを輸出し、明から銅銭・生糸などを輸入しました。勘合は明が発行したもので、和同開珎は8世紀の日本の銭です。","m":"義満開始→義持中断→義教再開、勘合は明が発行"},{"id":50,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問16","f":"中世","t":"寧波の乱","y":1523,"q":"応仁の乱後、日明貿易の実権を争っていた細川氏と大内氏の使節が、1523年に中国の港で衝突した事件はどれですか。","c":["寧波の乱","三浦の乱","応永の外寇","嘉吉の変"],"e":"1523年、堺商人と結ぶ細川氏と博多商人と結ぶ大内氏が寧波で衝突しました（寧波の乱）。その後は大内氏が貿易を独占しましたが、大内氏の滅亡で勘合貿易は断絶しました。三浦の乱（1510年）は朝鮮の三浦での日本人の暴動、応永の外寇（1419年）は朝鮮による対馬襲撃、嘉吉の変（1441年）は将軍義教の暗殺です。","m":"寧波の乱（1523）＝細川vs大内→大内の独占"},{"id":51,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問17","f":"近世","t":"豊臣秀吉と海賊取締令","y":1588,"q":"1588年に海賊取締令を出した人物と、その人物について述べた文の組み合わせとして、正しいものはどれですか。","c":["豊臣秀吉―大坂城を拠点とし、長宗我部氏や島津氏を屈服させた。","織田信長―安土城を拠点とし、足利義昭を奉じて入京した。","豊臣秀吉―安土城を拠点とし、足利義昭を奉じて入京した。","織田信長―大坂城を拠点とし、長宗我部氏や島津氏を屈服させた。"],"e":"海賊取締令は豊臣秀吉が刀狩令と同じ1588年に出したもので、倭寇などの海賊行為を禁じました。秀吉は石山本願寺の跡に大坂城を築いて拠点とし、1585年に四国の長宗我部氏、1587年に九州の島津氏を降しました。足利義昭（13代義輝の弟）を奉じて入京し、安土城を築いたのは織田信長です。","m":"秀吉1588年：刀狩令・海賊取締令、拠点は大坂城"},{"id":52,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問18","f":"中世","t":"惣村の自治","y":1400,"q":"室町時代の惣村について述べた文として、正しいものはどれですか。","c":["村人が自ら警察・裁判の権限を行使する地下検断（自検断）が行われることがあった。","惣掟は幕府の奉行人が作成し、村に一方的に与えたものであった。","惣の寄合は荘園領主の代官が主宰し、農民は参加できなかった。","村が年貢を一括して請け負うことは禁じられていた。"],"e":"惣村では、おとな・沙汰人などの指導者のもとで寄合が開かれ、村人自身が惣掟を定めました。違反者を村が処罰する地下検断（自検断）や、村が年貢をまとめて請け負う地下請（百姓請）も行われました。惣は領主の支配に対して自治的な結合を強めた村です。","m":"惣村：寄合・惣掟・地下検断・地下請"},{"id":53,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問21","f":"近世","t":"関ヶ原の戦いの戦後処理","y":1600,"q":"1600年の関ヶ原の戦いの戦後処理について述べた文として、正しいものはどれですか。","c":["五奉行の一人であった石田三成は捕らえられて処刑された。","五大老の一人であった石田三成は、所領を減らされたうえで大名として存続した。","西軍の総大将とされた毛利輝元は改易され、すべての領地を失った。","豊臣秀頼は改易され、大坂城を明け渡した。"],"e":"石田三成は豊臣政権の五奉行の一人で、関ヶ原の敗戦後に捕らえられ処刑されました。五大老は徳川家康・毛利輝元などの有力大名です。毛利輝元は減封されて周防・長門の2国となり、豊臣秀頼は摂津・河内・和泉約65万石の大名として大坂城にとどまりました。","m":"三成＝五奉行で処刑、毛利は減封、秀頼は65万石で存続"},{"id":54,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問22","f":"近世","t":"島原・天草一揆","y":1637,"q":"1637年から翌年にかけて九州で起こった島原・天草一揆（島原の乱）について述べた文として、正しいものはどれですか。","c":["益田（天草）四郎時貞を首領とする一揆勢は、廃城となっていた原城にこもった。","幕府は鎮圧を九州の外様大名にまかせ、みずからは関与しなかった。","有馬晴信・小西行長の苛酷な年貢収奪が、一揆の直接の原因であった。","一揆の鎮圧後も、ポルトガル船の来航は引き続き認められた。"],"e":"島原の松倉氏、天草の寺沢氏の圧政とキリシタン弾圧に抵抗した百姓らは、益田時貞を首領に原城跡に立てこもりました。幕府は老中松平信綱を派遣し、九州の大名を動員して鎮圧しました。有馬晴信・小西行長はかつての領主（キリシタン大名）です。乱の後、1639年にポルトガル船の来航が禁止されました。","m":"島原の乱→松平信綱が鎮圧→1639年ポルトガル船来航禁止"},{"id":55,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問24","f":"近世","t":"文治政治への転換","y":1709,"q":"17世紀後半から18世紀初めの文治政治について述べた文として、正しいものはどれですか。","c":["6代家宣は、朱子学者の新井白石や側用人の間部詮房を重く用いて政治を進めた。","4代将軍家綱の時、殉死が禁じられ、家臣は主君個人に仕えるべきことが強調された。","5代将軍綱吉の武家諸法度では、「文武弓馬の道」に励むことが第一とされた。","4代将軍家綱の時、末期養子が全面的に禁止された。"],"e":"家綱の時代には末期養子の禁が緩和され、殉死が禁止されました。殉死の禁止は、家臣が主君個人ではなく主君の家に仕えることを示すものです。綱吉は武家諸法度の第1条を「文武忠孝を励し、礼儀を正すべき事」に改めました。家宣は新井白石と間部詮房を登用して正徳の政治を進めました。","m":"家綱＝殉死禁止・末期養子緩和、綱吉＝「文武忠孝」"},{"id":56,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問25","f":"近世","t":"徳川綱吉の時代","y":1701,"q":"5代将軍徳川綱吉の時代について述べた文として、正しいものはどれですか。","c":["江戸城内で刃傷事件を起こした赤穂藩主浅野長矩が切腹となり、赤穂藩は改易された。","側用人を廃止し、譜代大名や旗本を重んじる政治に改めた。","正徳金銀を鋳造し、貨幣の質を慶長金銀の水準に戻した。","海舶互市新例を出し、長崎貿易の額を制限した。"],"e":"綱吉の時代、1701年に赤穂藩主浅野長矩が江戸城内で吉良義央に斬りつけ、切腹・改易となりました（翌年、赤穂浪士の討入り）。綱吉は柳沢吉保を側用人に重用しました。正徳金銀の鋳造や海舶互市新例は、新井白石が中心となった正徳の政治の政策です。","m":"綱吉＝側用人柳沢吉保、浅野長矩の改易（1701）"},{"id":57,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問27","f":"近世","t":"将軍と政策の対応","y":1790,"q":"江戸幕府の将軍と、その時代の政策の組み合わせとして、正しいものはどれですか。","c":["徳川家斉―老中松平定信のもとで、石川島に無宿人を収容する人足寄場が設けられた。","徳川家継―相対済し令が出され、金銀の貸し借りをめぐる訴訟を受け付けないことにした。","徳川家綱―荻原重秀の意見で、質を落とした元禄小判が発行された。","徳川家治―寛政異学の禁が出され、湯島の学問所で朱子学以外の講義が禁じられた。"],"e":"人足寄場は、11代将軍家斉のもとで老中松平定信が進めた寛政の改革（1790年）で石川島に設けられました。相対済し令（1719年）は8代吉宗の享保の改革、荻原重秀の意見による元禄小判の発行（1695年）は5代綱吉の時代です。寛政異学の禁（1790年）も家斉の時代の寛政の改革の政策で、10代家治の時代は田沼意次が老中として活躍した時期です。","m":"家斉＝寛政の改革（人足寄場・異学の禁）、家治＝田沼時代"},{"id":58,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問29","f":"近世","t":"歌川広重","y":1833,"q":"初代歌川広重の作品として、正しいものはどれですか。","c":["「東海道五十三次」","「富嶽三十六景」","「十便十宜図」","「見返り美人図」"],"e":"歌川広重は化政文化を代表する浮世絵師で、風景版画「東海道五十三次」で知られます。「富嶽三十六景」は葛飾北斎、「十便十宜図」は池大雅と与謝蕪村の合作による文人画、「見返り美人図」は元禄期の菱川師宣の肉筆画です。広重・北斎の風景画は、庶民の旅行の流行を背景に人気を集めました。","m":"広重＝東海道五十三次、北斎＝富嶽三十六景"},{"id":59,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問30","f":"近世","t":"江戸時代の教育機関","y":1724,"q":"江戸時代の教育について述べた文として、正しいものはどれですか。","c":["大坂の町人たちの出資で懐徳堂が設けられ、山片蟠桃らが学んだ。","岡山藩の閑谷学校は、藩士の子弟だけを教育する藩校であった。","寺子屋は19世紀に入ると急速に数を減らした。","『広益国産考』は、宮崎安貞が17世紀末にまとめた農書である。"],"e":"懐徳堂は1724年に大坂の町人の出資で設立され、富永仲基や山片蟠桃を出しました。閑谷学校は池田光政が設けた郷学（郷校）で、庶民も学びました。寺子屋は19世紀にかけてむしろ大きく増加しました。『広益国産考』は19世紀に大蔵永常が著した農書で、宮崎安貞の著書は元禄期の『農業全書』です。","m":"懐徳堂＝大坂町人、閑谷学校＝郷学、農業全書＝宮崎安貞"},{"id":60,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問31","f":"近代","t":"通商条約前の国際情勢","y":1856,"q":"1858年に日米修好通商条約が結ばれる前の国際情勢として、正しいものはどれですか。","c":["洪秀全の率いる太平天国軍が南京を落とし、ここを都として清に対抗していた。","アメリカで大陸横断鉄道が全線開通していた。","イギリス国王がインド皇帝を兼ねるインド帝国が、すでに成立していた。","イギリスは清からアヘンを買い入れ、その代金を茶で支払っていた。"],"e":"太平天国は1851年に挙兵し、1853年に南京を占領して天京と称しました。アメリカの大陸横断鉄道の完成は1869年、インド帝国の成立は1877年で、いずれも条約より後です。イギリスは清から茶を輸入し、その支払いにあてるためインド産のアヘンを清に輸出していたので、清からアヘンを買い入れたのではありません。","m":"太平天国1851〜64（南京占領1853）、インド帝国1877"},{"id":61,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問32","f":"近代","t":"井伊直弼","y":1858,"q":"1858年に大老となり、勅許を得ないまま日米修好通商条約の調印を断行した井伊直弼について述べた文として、正しいものはどれですか。","c":["南紀派の推す紀伊藩主徳川慶福を、将軍家定の跡継ぎに定めた。","ペリー来航時に、諸大名や幕臣に広く意見を求めて対応を協議した。","公武合体を進め、孝明天皇の妹和宮を将軍の妻に迎えた。","条約勅許を求めて自ら京都に上ったが、朝廷に拒まれた。"],"e":"井伊直弼は将軍継嗣問題で南紀派として徳川慶福（家茂）を後継ぎに決め、一橋派を安政の大獄で弾圧しました。ペリー来航時に諸大名の意見を求めたのは老中阿部正弘、和宮降嫁を進めたのは老中安藤信正、勅許を得ようとして失敗したのは老中堀田正睦です。","m":"井伊＝慶福擁立・無勅許調印・安政の大獄"},{"id":62,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問34","f":"近代","t":"開港初期の貿易品","y":1865,"q":"1859年に始まった開港場での貿易について述べた文として、正しいものはどれですか。","c":["輸入品の大半は毛織物や綿織物などの繊維製品であった。","最大の輸出品は綿糸であった。","アヘンの輸入も自由に認められていた。","五品江戸廻送令は在郷商人や外国商人に歓迎された。"],"e":"開港後の貿易では、生糸・茶が主な輸出品で、毛織物・綿織物などの繊維製品が輸入の大半を占めました。綿糸が輸出の中心となるのは明治後期です。通商条約ではアヘンの輸入は禁止されていました。五品江戸廻送令は生糸などを江戸の問屋経由とさせる統制で、在郷商人や外国商人は反対しました。","m":"輸出＝生糸・茶、輸入＝毛織物・綿織物"},{"id":63,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問35","f":"近代","t":"協定関税制","y":1858,"q":"安政の五か国条約での関税（運上）について述べた文として、正しいものはどれですか。","c":["関税率を改めるには、相手国の同意が必要であった。","1866年の改税約書は日本に有利な改定で、輸入税が引き上げられた。","1894年に結ばれた日英通商航海条約によって、関税自主権が全面的に回復した。","関税率は輸出品・輸入品ともに一律20％と定められた。"],"e":"通商条約では関税率を日本だけでは決められない協定関税制がとられました（関税自主権の欠如）。改税約書では輸入関税が一律5％程度に引き下げられ、日本に不利になりました。日英通商航海条約（1894年）では法権の回復と関税率の一部引き上げにとどまり、関税自主権の完全回復は1911年の小村寿太郎による条約改正です。","m":"関税自主権の回復＝1911年（小村寿太郎）"},{"id":64,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問36","f":"近代","t":"開港と金の流出","y":1859,"q":"開港当時、日本の金銀比価は約1対5、海外は約1対15でした。このため、外国商人が利益を得た方法として正しいものはどれですか。","c":["外国の銀貨を日本の一分銀に交換し、それを小判に両替して国外に持ち出した。","外国の金貨を小判に交換し、それを一分銀に両替して国外に持ち出した。","外国の銀貨を一分銀に交換し、そのまま国外に持ち出した。","外国の金貨を国内で売却し、得た銀を国外に持ち出した。"],"e":"日本では海外に比べ金が銀に対して安かったため、外国の銀貨を一分銀に替え、さらに小判（金貨）に両替して国外に持ち出すと、海外で約3倍の銀に替えることができました。このため大量の金貨が流出しました（教科書では10万両以上とされ、推計には諸説あります）。幕府は1860年の万延の改鋳で小判の金の含有量を大きく減らして対応しました。","m":"銀→一分銀→小判で国外へ→万延小判で金を減らす"},{"id":65,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問38","f":"近代","t":"天津条約","y":1885,"q":"19世紀後半の日本・清・朝鮮の関係について述べた文として、正しいものはどれですか。","c":["甲申事変の後に結ばれた天津条約で、日清両国は朝鮮からの撤兵と、再び出兵するときの事前通知を約束した。","壬午軍乱をきっかけに、閔氏政権は日本寄りの姿勢を強めた。","清は朝鮮を属国とはみなしていなかった。","下関条約の後、朝鮮では大院君が親露派の政権を樹立した。"],"e":"甲申事変（1884年）の後、伊藤博文と李鴻章が1885年に天津条約を結び、日清両軍の撤兵と出兵時の事前通知を定めました。壬午軍乱（1882年）後、閔氏政権は清への依存を強めました。清は朝鮮を属国とみなしていました。下関条約後にロシアに近づいたのは閔妃らで、日本は1895年に閔妃殺害事件を起こしました。","m":"天津条約（1885）＝撤兵＋出兵時の相互通知（伊藤・李鴻章）"},{"id":66,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問39","f":"近代","t":"児玉源太郎と台湾統治","y":1898,"q":"1898年に第4代台湾総督となり、民政長官後藤新平とともに土地調査事業などを進めた人物はだれですか。","c":["児玉源太郎","後藤新平","樺山資紀","乃木希典"],"e":"児玉源太郎は第4代台湾総督として、民政長官に後藤新平を起用し、土地調査事業や鉄道・港湾の整備を進めました。樺山資紀は初代台湾総督、乃木希典は第3代台湾総督です。後藤新平は総督ではなく民政局長（のち民政長官）で、のちに満鉄の初代総裁となりました。","m":"台湾総督：初代樺山資紀、4代児玉源太郎＋後藤新平"},{"id":67,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問40","f":"近代","t":"日清戦争の賠償金と金本位制","y":1897,"q":"日清戦争で得た賠償金とその使途について述べた文として、正しいものはどれですか。","c":["賠償金の一部を準備金として、1897年に貨幣法を制定し金本位制を確立した。","賠償金の多くは官営八幡製鉄所の建設にまわされた。","金本位制を定めた1897年の法律は新貨条例である。","賠償金は銀貨で受け取り、銀本位制を確立した。"],"e":"下関条約で得た賠償金（遼東半島還付の代償を含む）の大部分は軍備拡張費にあてられ、一部が八幡製鉄所の建設費などに使われました。また賠償金を準備金として、1897年に貨幣法を制定し金本位制を確立しました。新貨条例は1871年の法令で、十進法の円・銭・厘を定めたものです。","m":"賠償金の大半は軍備拡張、1897年貨幣法で金本位制"},{"id":68,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問41","f":"近代","t":"列強の中国分割","y":1898,"q":"日清戦争後の列強による中国分割について述べた文として、正しいものはどれですか。","c":["イギリスは威海衛と九竜半島の新界を租借し、長江流域を勢力圏とした。","ドイツが租借したのは威海衛で、ここを拠点に山東省へ進出した。","フランスは広州湾に加えてマカオも租借し、華南に勢力を伸ばした。","ロシアは義和団戦争を機に初めて旅順・大連を租借した。"],"e":"1898年前後、ドイツは膠州湾、ロシアは旅順・大連、イギリスは威海衛と九竜半島（新界）、フランスは広州湾を租借しました。イギリスは長江流域を勢力範囲としています。マカオはポルトガルの拠点です。ロシアの旅順・大連租借は1898年で、義和団戦争（1900年）の前です。","m":"独＝膠州湾、露＝旅順・大連、英＝威海衛・九竜、仏＝広州湾"},{"id":69,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問42","f":"現代","t":"傾斜生産方式","y":1947,"q":"敗戦直後の日本経済の復興について述べた文として、正しいものはどれですか。","c":["1946年末、第1次吉田茂内閣は石炭と鉄鋼の生産に資材・資金を集中させる傾斜生産方式をとった。","経済安定九原則で、GHQは公共投資の拡大を指示した。","ドッジ=ラインにより、1ドル＝308円の単一為替レートが設定された。","シャウプ勧告で、間接税中心の税制が導入された。"],"e":"1946年末、第1次吉田茂内閣は石炭・鉄鋼の生産に資材と資金を集中させる傾斜生産方式を採用しました。経済安定九原則（1948年）は予算の均衡などインフレを抑えるための緊縮を求めるものです。ドッジ=ラインで設定された単一為替レートは1ドル＝360円です。シャウプ勧告は直接税中心の税制を求めました。","m":"傾斜生産（吉田）→九原則・ドッジ=ライン（360円）"},{"id":70,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問44","f":"現代","t":"第一次石油危機","y":1973,"q":"1973年、第4次中東戦争をきっかけに第一次石油危機が起こったときの首相はだれですか。","c":["田中角栄","佐藤栄作","三木武夫","福田赳夫"],"e":"1972年に首相となった田中角栄は日中共同声明で日中国交正常化を実現し、「日本列島改造論」をかかげましたが、1973年の第一次石油危機で「狂乱物価」が生じました。佐藤栄作は1972年まで首相で沖縄返還を実現しました。三木武夫は田中の後の首相、福田赳夫は三木の後の首相で日中平和友好条約を結びました。","m":"第一次石油危機（1973）＝田中角栄内閣、日中平和友好条約＝福田"},{"id":71,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問45","f":"現代","t":"1960年代の出来事の順序","y":1964,"q":"次の出来事を古いものから順に並べたとき、2番目にくるものはどれですか。\n・日米相互協力及び安全保障条約の締結　・東海道新幹線の開通　・日韓基本条約の締結　・核兵器拡散防止条約への調印","c":["東海道新幹線の開通","日米相互協力及び安全保障条約の締結","日韓基本条約の締結","核兵器拡散防止条約への調印"],"e":"新安保条約は1960年（岸信介内閣）、東海道新幹線の開通は東京オリンピック直前の1964年、日韓基本条約は1965年（佐藤栄作内閣）、核兵器拡散防止条約への調印は1970年（批准は1976年）です。したがって2番目は東海道新幹線の開通です。","m":"新安保1960→新幹線1964→日韓1965→NPT調印1970"},{"id":72,"k":"plan","ref":"想定問題","f":"原始・古代","t":"大森貝塚とモース","y":1877,"q":"近代以降の日本の考古学の進展について述べた文として、正しいものはどれですか。","c":["1877年、アメリカ人モースが大森貝塚を発掘し、近代的な考古学研究の出発点となった。","相沢忠洋が静岡県の登呂遺跡で打製石器を見つけ、旧石器文化の存在が明らかになった。","群馬県の岩宿遺跡で、弥生時代の水田跡や高床倉庫跡が発見された。","大森貝塚の発掘によって、日本列島に旧石器時代の人類がいたことが初めて証明された。"],"e":"大森貝塚はお雇い外国人の動物学者モースが発掘した縄文時代の貝塚で、日本の近代考古学の出発点とされます。打製石器が見つかり旧石器文化の存在が確認されたのは群馬県の岩宿遺跡で、発見者は相沢忠洋です。弥生時代の水田跡などが見つかったのは静岡県の登呂遺跡です。","m":"大森貝塚＝モース、岩宿＝相沢忠洋（旧石器）、登呂＝水田"},{"id":73,"k":"plan","ref":"想定問題","f":"原始・古代","t":"登呂遺跡と戦後の発掘","y":1947,"q":"第二次世界大戦後まもなく本格的な発掘調査が行われ、弥生時代の水田跡や住居跡、高床倉庫跡などが見つかった静岡県の遺跡はどれですか。","c":["登呂遺跡","岩宿遺跡","三内丸山遺跡","吉野ヶ里遺跡"],"e":"登呂遺跡は戦後まもなく発掘され、水田跡や木製農具などから弥生時代の農耕生活が明らかになりました。岩宿遺跡（群馬県）は旧石器時代、三内丸山遺跡（青森県）は大規模な縄文時代の集落、吉野ヶ里遺跡（佐賀県）は環濠をもつ弥生時代の大規模集落で、1980年代後半の調査で注目されました。","m":"登呂＝弥生の水田（静岡）、三内丸山＝縄文（青森）"},{"id":74,"k":"plan","ref":"想定問題","f":"原始・古代","t":"富本銭の発見","y":683,"q":"1990年代末に奈良県の飛鳥池遺跡から多数出土し、和同開珎より古い7世紀後半の銭貨と考えられるようになったものはどれですか。","c":["富本銭","乾元大宝","開元通宝","寛永通宝"],"e":"飛鳥池遺跡からは富本銭とその鋳造に関わる遺物が見つかり、天武天皇の時代に鋳造された日本最古級の銭貨と考えられるようになりました。乾元大宝は958年の皇朝十二銭の最後の銭、開元通宝は唐の銭、寛永通宝は江戸時代に大量に鋳造された銭です。","m":"富本銭（天武期・飛鳥池遺跡）→和同開珎（708）"},{"id":75,"k":"plan","ref":"想定問題","f":"原始・古代","t":"和同開珎と蓄銭叙位令","y":708,"q":"708年に鋳造された和同開珎について述べた文として、正しいものはどれですか。","c":["武蔵国から銅が献上されたことを機に鋳造され、政府は蓄銭叙位令を出して流通を促した。","皇朝十二銭の最後の銭で、これ以後国家による銭の鋳造は途絶えた。","平安京の造営費をまかなうために鋳造された。","鋳造後すぐに全国の農村に広まり、物々交換はほとんど見られなくなった。"],"e":"武蔵国秩父郡から銅が献上されたことを受けて年号を和銅と改め、和同開珎が鋳造されました。平城京造営の費用支払いなどに使われ、政府は711年に蓄銭叙位令を出して流通を促しましたが、畿内とその周辺以外では稲や布による交易が中心でした。皇朝十二銭の最後は乾元大宝です。","m":"和同開珎（708）→蓄銭叙位令（711）、流通は畿内中心"},{"id":76,"k":"plan","ref":"想定問題","f":"原始・古代","t":"多賀城と東北経営","y":724,"q":"7〜8世紀の律令国家による東北地方の経営について述べた文として、正しいものはどれですか。","c":["8世紀前半、陸奥に多賀城が築かれ、陸奥国府と鎮守府が置かれた。","7世紀半ば、太平洋側の陸奥に渟足柵・磐舟柵が築かれた。","出羽国は9世紀に入ってから初めて置かれた。","坂上田村麻呂は秋田城を築き、鎮守府をここに移した。"],"e":"724年ごろ、陸奥に多賀城が築かれ、国府と蝦夷対策の鎮守府が置かれました。渟足柵・磐舟柵は7世紀半ばに日本海側の越後に築かれた城柵です。出羽国は712年に置かれ、733年には出羽柵が秋田に移されました（のちの秋田城）。坂上田村麻呂が築き、鎮守府を移したのは胆沢城です。","m":"渟足柵・磐舟柵＝日本海側、多賀城＝陸奥国府＋鎮守府"},{"id":77,"k":"plan","ref":"想定問題","f":"原始・古代","t":"坂上田村麻呂と阿弖流為","y":802,"q":"桓武天皇の時代の蝦夷との戦いについて述べた文として、正しいものはどれですか。","c":["征夷大将軍坂上田村麻呂は胆沢城を築き、蝦夷の族長阿弖流為を降伏させた。","蝦夷の豪族伊治呰麻呂は征夷大将軍に任じられ、蝦夷を平定した。","藤原緒嗣の主張によって、征夷と造都の事業がいっそう拡大された。","坂上田村麻呂は多賀城を築き、ここに初めて陸奥国府を置いた。"],"e":"802年、坂上田村麻呂は胆沢城を築き、阿弖流為を降伏させました。翌年には志波城も築いています。伊治呰麻呂は780年に反乱を起こし、多賀城を焼いた人物です。805年の徳政相論では藤原緒嗣が「軍事と造作」が民を苦しめていると主張し、桓武天皇は二大事業を中止しました。","m":"田村麻呂＝胆沢城・阿弖流為降伏、徳政相論で中止（805）"},{"id":78,"k":"plan","ref":"想定問題","f":"中世","t":"伴大納言絵巻","y":1170,"q":"866年に起こった応天門の変を題材とし、院政期に描かれた絵巻物はどれですか。","c":["伴大納言絵巻","信貴山縁起絵巻","鳥獣戯画","源氏物語絵巻"],"e":"伴大納言絵巻は、伴善男が応天門に放火し、その罪を他人に着せようとした応天門の変を描いた院政期の絵巻で、群衆の生き生きとした描写が特徴です。信貴山縁起絵巻は僧命蓮の霊験、鳥獣戯画は動物を擬人化した戯画、源氏物語絵巻は『源氏物語』を題材とする大和絵です。","m":"応天門の変（866）を描く＝伴大納言絵巻"},{"id":79,"k":"plan","ref":"想定問題","f":"中世","t":"院政期の絵巻物の題材","y":1150,"q":"院政期の絵巻物とその題材の組み合わせとして、正しいものはどれですか。","c":["信貴山縁起絵巻―信貴山の僧命蓮にまつわる霊験の話","鳥獣戯画―菅原道真の生涯と北野天神の由来","源氏物語絵巻―一遍の諸国遊行のありさま","伴大納言絵巻―元軍と戦う御家人の姿"],"e":"信貴山縁起絵巻は信貴山の僧命蓮をめぐる霊験譚で、「飛倉」の場面が有名です。鳥獣戯画はカエルやウサギなどを擬人化して描いた戯画です。菅原道真の生涯を描くのは鎌倉時代の北野天神縁起絵巻、一遍の遊行は一遍上人絵伝、元軍との戦いは蒙古襲来絵詞です。","m":"院政期の四大絵巻：源氏物語・伴大納言・信貴山縁起・鳥獣戯画"},{"id":80,"k":"plan","ref":"想定問題","f":"中世","t":"鎌倉時代の絵巻物","y":1293,"q":"鎌倉時代の絵巻物について述べた文として、正しいものはどれですか。","c":["『蒙古襲来絵詞』は、肥後の御家人竹崎季長が元軍との戦いでの自らの活躍を描かせたものである。","『一遍上人絵伝』は、浄土真宗を開いた親鸞の生涯を描いたものである。","『北野天神縁起絵巻』は、空也が京の市で念仏を広める姿を描いたものである。","『男衾三郎絵詞』は、院政期の貴族の恋愛を描いたものである。"],"e":"『蒙古襲来絵詞』は竹崎季長が文永・弘安の役での戦功と恩賞獲得の経緯を描かせた絵巻です。『一遍上人絵伝』は時宗の開祖一遍の遊行を描きます。『北野天神縁起絵巻』は菅原道真の生涯と天神信仰の由来を、『男衾三郎絵詞』は東国武士の生活を描いています。","m":"竹崎季長＝蒙古襲来絵詞、一遍上人絵伝＝時宗の一遍"},{"id":81,"k":"plan","ref":"想定問題","f":"中世","t":"応永の外寇","y":1419,"q":"1419年に起こった応永の外寇について述べた文として、正しいものはどれですか。","c":["朝鮮軍が倭寇の根拠地とみなした対馬を襲撃した。","明の軍が倭寇の取り締まりを理由に博多を攻撃した。","対馬の宗氏が朝鮮の三浦に攻め込み、占領した。","足利義満が倭寇を討つため朝鮮半島に出兵した。"],"e":"応永の外寇は、倭寇の根拠地と考えた朝鮮が1419年に対馬を襲撃した事件で、日朝貿易は一時中断しましたが、まもなく再開されました。三浦で日本人が起こした暴動は1510年の三浦の乱です。足利義満は1408年に没しており、朝鮮に出兵したことはありません。","m":"応永の外寇（1419）＝朝鮮が対馬を攻撃"},{"id":82,"k":"plan","ref":"想定問題","f":"中世","t":"日朝貿易","y":1450,"q":"室町時代の日朝貿易について述べた文として、正しいものはどれですか。","c":["朝鮮から木綿（綿布）が大量に輸入され、人々の衣料などに広く用いられた。","貿易は幕府が独占し、守護大名や商人は参加できなかった。","貿易港は中国の寧波に限られていた。","朝鮮への主な輸出品は木綿や大蔵経であった。"],"e":"日朝貿易は幕府だけでなく守護・国人・商人なども参加し、対馬の宗氏が統制にあたりました。貿易港は朝鮮の三浦（富山浦・乃而浦・塩浦）です。日本からは銅・硫黄や、琉球経由の南方の産物などを輸出し、朝鮮からは木綿や大蔵経を輸入しました。木綿は庶民の衣料を大きく変えました。","m":"日朝貿易：三浦・宗氏、輸入＝木綿・大蔵経"},{"id":83,"k":"plan","ref":"想定問題","f":"中世","t":"コシャマインの戦い","y":1457,"q":"室町時代の蝦夷ヶ島（北海道）について述べた文として、正しいものはどれですか。","c":["1457年、アイヌの首長コシャマインが和人に対して蜂起したが、蠣崎氏によって鎮められた。","シャクシャインの戦いが起こり、松前藩が鎮圧した。","道南十二館は、アイヌが和人の侵入を防ぐために築いた拠点である。","和人の渡来は江戸時代に入ってから始まった。"],"e":"津軽の十三湊を拠点とする安藤（安東）氏の交易などを通じて和人が渡り、道南に館（道南十二館）を築きました。和人の進出に対し、1457年にコシャマインが蜂起しましたが、蠣崎氏に鎮圧されました。蠣崎氏はのちの松前氏です。シャクシャインの戦いは1669年、江戸時代の出来事です。","m":"コシャマイン（1457・室町）、シャクシャイン（1669・江戸）"},{"id":84,"k":"plan","ref":"想定問題","f":"中世","t":"琉球王国の成立","y":1429,"q":"15世紀の琉球について述べた文として、正しいものはどれですか。","c":["中山王尚巴志が北山・中山・南山の三山を統一し、琉球王国が成立した。","琉球王国は明の冊封を受けず、日本とだけ通交した。","琉球王国は那覇を拠点に、東南アジアとの貿易を禁じた。","北山王が中山・南山を滅ぼして統一し、首里を都とした。"],"e":"1429年、中山王尚巴志が三山を統一して琉球王国を建てました。琉球は明の冊封を受けて朝貢し、首里を都、那覇を外港として、明・日本・朝鮮・東南アジアを結ぶ中継貿易で栄えました。明の冊封を受けない、日本とだけ通交したなどの記述は誤りで、北山王による統一でもありません。","m":"尚巴志が三山統一（1429）→首里・那覇で中継貿易"},{"id":85,"k":"plan","ref":"想定問題","f":"近世","t":"寛永期の文化","y":1630,"q":"17世紀前半の寛永期の文化について述べた文として、正しいものはどれですか。","c":["京都を中心に展開し、俵屋宗達が「風神雷神図屛風」を描いた。","江戸を中心に展開し、喜多川歌麿が美人画を描いた。","江戸を中心に展開し、葛飾北斎が風景版画で人気を集めた。","京都を中心に展開し、井原西鶴が浮世草子を書いた。"],"e":"寛永期の文化は、京都の朝廷・上層町衆を担い手とし、桂離宮、本阿弥光悦の工芸、俵屋宗達の「風神雷神図屛風」などが生まれました。喜多川歌麿と葛飾北斎は江戸の町人文化が栄えた18世紀末〜19世紀前半の浮世絵師です。井原西鶴は上方で活躍した元禄期の作家です。","m":"寛永＝京都（宗達・光悦・桂離宮）、化政＝江戸"},{"id":86,"k":"plan","ref":"想定問題","f":"近世","t":"元禄文化と化政文化の比較","y":1700,"q":"元禄文化と化政文化を比べた文として、正しいものはどれですか。","c":["元禄文化は上方の町人が中心となり、化政文化は江戸の町人が中心となった。","元禄文化は江戸の町人が中心となり、化政文化は上方の町人が中心となった。","近松門左衛門は化政期の江戸で人形浄瑠璃の脚本を書いた。","十返舎一九は元禄期の大坂で滑稽本を書いた。"],"e":"元禄文化は京都・大坂などの上方を中心に、井原西鶴（浮世草子）、近松門左衛門（人形浄瑠璃）、松尾芭蕉（俳諧）らが活躍しました。化政文化は江戸の町人を中心に広がり、十返舎一九『東海道中膝栗毛』などの滑稽本、浮世絵の錦絵が流行しました。文化の中心が上方から江戸へ移ったことが重要です。","m":"元禄＝上方（西鶴・近松・芭蕉）→化政＝江戸（一九・北斎）"},{"id":87,"k":"plan","ref":"想定問題","f":"近世","t":"身分統制令","y":1591,"q":"豊臣秀吉による兵農分離の政策について述べた文として、正しいものはどれですか。","c":["1591年の身分統制令（人掃令）で、武家奉公人が町人・百姓になることや、百姓が商人になることなどが禁じられた。","刀狩令は、百姓に武器の所持を認め、自ら村を守らせることを目的とした。","太閤検地は荘園領主の権利を強め、一つの土地に多くの権利が重なる状態を広げた。","兵農分離によって、武士は農村に住むことを義務づけられた。"],"e":"秀吉は1588年の刀狩令で百姓から武器を取り上げ、1591年の身分統制令（人掃令）で武士・町人・百姓の身分の移動を禁じました。太閤検地は一地一作人の原則で荘園制を解体しました。これらにより、武士は城下町に集住し、百姓は村に住んで耕作する兵農分離が進みました。","m":"刀狩（1588）＋身分統制令（1591）＋太閤検地＝兵農分離"},{"id":88,"k":"plan","ref":"想定問題","f":"近世","t":"熊沢蕃山の武士土着論","y":1687,"q":"17世紀後半、『大学或問』で武士を農村に土着させることなどを説き、幕政を批判したとして幕府から処罰された儒学者はだれですか。","c":["熊沢蕃山","荻生徂徠","新井白石","林羅山"],"e":"陽明学者の熊沢蕃山は岡山藩主池田光政に仕えたのち、『大学或問』で武士の土着などを説いて幕政を批判し、下総古河に幽閉されました。荻生徂徠も『政談』で武士の土着を説きましたが、18世紀前半に徳川吉宗の諮問に応じた人物で、処罰はされていません。林羅山は家康以来の幕府に仕えた朱子学者です。","m":"武士土着論：前期＝熊沢蕃山『大学或問』、享保期＝荻生徂徠『政談』"},{"id":89,"k":"plan","ref":"想定問題","f":"近世","t":"荻生徂徠『政談』","y":1726,"q":"享保期、城下町に集住する武士の生活を「旅宿の境界」にたとえて批判し、武士を農村に土着させることを説いた書物と著者の組み合わせとして、正しいものはどれですか。","c":["『政談』―荻生徂徠","『経済録』―太宰春台","『大学或問』―新井白石","『西域物語』―本多利明"],"e":"荻生徂徠は徳川吉宗に献じた『政談』で、武士が城下町で貨幣を使う消費生活をしていることを「旅宿の境界」と表現して批判し、武士の土着を説きました。太宰春台は徂徠の弟子で『経済録』を書き、藩専売による利益を説きました。『大学或問』は熊沢蕃山、『西域物語』は本多利明の著書で、本多は海外貿易による富国を説きました。","m":"徂徠『政談』「旅宿の境界」→武士土着論"},{"id":90,"k":"plan","ref":"想定問題","f":"近世","t":"安藤昌益","y":1755,"q":"18世紀半ば、陸奥八戸の医師で、『自然真営道』を著し、武士が耕さずに農民から収奪する社会を批判して、すべての人が耕作する「自然世」を理想とした人物はだれですか。","c":["安藤昌益","二宮尊徳","海保青陵","本多利明"],"e":"安藤昌益は『自然真営道』で、万人が自ら耕して生活する「万人直耕」の自然世を理想とし、身分制の社会を鋭く批判しました。二宮尊徳は19世紀に農村復興（報徳仕法）を指導した人物、海保青陵は商業を重視する立場から藩の殖産を説いた人物、本多利明は開国・貿易による富国を説いた人物です。","m":"安藤昌益『自然真営道』＝万人直耕・身分制批判"},{"id":91,"k":"plan","ref":"想定問題","f":"近代","t":"大政奉還","y":1867,"q":"1867年10月の大政奉還について述べた文として、正しいものはどれですか。","c":["土佐藩の前藩主山内豊信のすすめを受けて、将軍徳川慶喜が政権の返上を朝廷に申し出た。","朝廷から討幕の密勅を受けた慶喜が、それに従って政権を返上した。","大政奉還の後、慶喜は小御所会議で内大臣に昇進し、新政府の中心となった。","長州藩の木戸孝允の建白を受けて、慶喜は政権を返上した。"],"e":"土佐藩は後藤象二郎・坂本竜馬の構想をもとに、前藩主山内豊信（容堂）を通じて大政奉還を慶喜に勧め、慶喜はこれを受け入れました。同じ日、薩長両藩には討幕の密勅が下されていました。その後、王政復古の大号令が出され、小御所会議で慶喜には辞官納地（内大臣の辞任と領地の返上）が命じられました。","m":"大政奉還＝土佐藩（山内豊信）の建白、同日に討幕の密勅"},{"id":92,"k":"plan","ref":"想定問題","f":"近代","t":"王政復古の大号令","y":1867,"q":"「…自今摂関幕府等廃絶…」という語句を含む、1867年12月に出された王政復古の大号令について述べた文として、正しいものはどれですか。","c":["摂政・関白と幕府を廃止し、総裁・議定・参与の三職を置いた。","太政官を廃止して内閣制度を設けた。","五箇条の誓文と同時に出され、公議世論の尊重を誓った。","大政奉還より前に出され、徳川慶喜に政権の返上を求めた。"],"e":"王政復古の大号令は大政奉還の後、薩摩藩などが主導して出したもので、摂関・幕府を廃止し、天皇のもとに総裁・議定・参与の三職を置く新政府を樹立しました。同夜の小御所会議で慶喜の辞官納地が決まり、戊辰戦争につながります。内閣制度は1885年、五箇条の誓文は1868年3月です。","m":"王政復古の大号令（1867.12）＝摂関・幕府廃止、三職設置"},{"id":93,"k":"plan","ref":"想定問題","f":"近代","t":"民撰議院設立建白書","y":1874,"q":"1874年に提出された民撰議院設立の建白書について述べた文として、正しいものはどれですか。","c":["板垣退助らが左院に提出し、政府の有司専制を批判して議会の開設を求めた。","大隈重信らが元老院に提出し、イギリス流の議院内閣制の即時導入を求めた。","提出を受けて、政府は同じ年のうちに国会を開いた。","国会期成同盟が中心となってまとめ、国会開設を求める請願として提出しようとしたものである。"],"e":"征韓論争に敗れて下野した板垣退助・後藤象二郎らは、1874年に民撰議院設立の建白書を左院に提出し、一部の官僚による政治（有司専制）を批判しました。これが新聞に掲載され、自由民権運動の出発点となりました。国会期成同盟は1880年に結成され、8万7000人余りの署名を集めた国会開設請願書を提出しようとした団体です（政府は受理しませんでした）。建白書が出された1874年には元老院はまだなく（1875年設置）、国会の開設は1890年です。","m":"1874年 板垣ら→左院に建白、有司専制を批判"},{"id":94,"k":"plan","ref":"想定問題","f":"近代","t":"青鞜社","y":1911,"q":"近代の女性の地位や主張について述べた文として、正しいものはどれですか。","c":["平塚らいてうらが青鞜社を結成し、女性の自覚と解放を訴える雑誌『青鞜』を発行した。","与謝野晶子が新婦人協会を結成し、女性参政権を実現させた。","市川房枝らが青鞜社を結成し、治安警察法の改正を実現させた。","岸田俊子は大正期に青鞜社に加わり、女性の政治参加を訴えた。"],"e":"1911年、平塚らいてうらは女性だけの文芸団体青鞜社を結成し、雑誌『青鞜』を発行しました。新婦人協会は1920年に平塚らいてう・市川房枝らが結成した団体です。女性参政権の実現は1945年の衆議院議員選挙法改正によります。岸田俊子は自由民権運動期に男女同権を演説した女性です。","m":"青鞜社（1911）＝らいてう、新婦人協会（1920）＝らいてう・市川房枝"},{"id":95,"k":"plan","ref":"想定問題","f":"近代","t":"新婦人協会と治安警察法改正","y":1922,"q":"1920年に結成された新婦人協会の活動について述べた文として、正しいものはどれですか。","c":["その運動により1922年に治安警察法第5条が改正され、女性も政治演説会に参加できるようになった。","その運動により1925年に女性の参政権が認められた。","自由民権運動の中で1880年代に結成された。","治安警察法による女性の政党加入の禁止は、この協会の運動で撤廃された。"],"e":"治安警察法第5条は女性の政治結社への加入や政談集会への参加を禁じていました。新婦人協会の運動の結果、1922年に改正され、女性も政談集会に参加できるようになりましたが、政党への加入の禁止は残りました。1925年の普通選挙法は男性のみが対象で、女性参政権は1945年に実現しました。","m":"1922年 治安警察法5条改正＝集会参加のみ可、政党加入は不可"},{"id":96,"k":"plan","ref":"想定問題","f":"現代","t":"五大改革指令","y":1945,"q":"1945年10月、マッカーサーが幣原喜重郎首相に口頭で示した五大改革指令に含まれないものはどれですか。","c":["警察予備隊の創設","女性の解放（参政権の付与）","労働組合の結成の奨励","経済機構の民主化"],"e":"五大改革指令は、女性の解放、労働組合の結成奨励、教育の自由主義化、秘密警察などの圧政的諸制度の撤廃、経済機構の民主化の五つです。警察予備隊は1950年の朝鮮戦争勃発をきっかけにGHQの指令で創設されたもので、占領政策が転換した後のことです。","m":"五大改革＝女性解放・労組・教育・圧政撤廃・経済民主化"},{"id":97,"k":"plan","ref":"想定問題","f":"現代","t":"農地改革","y":1946,"q":"第二次世界大戦後の農地改革について述べた文として、正しいものはどれですか。","c":["第2次農地改革では、不在地主の貸付地はすべて、在村地主の貸付地は一定の面積を超える部分が国によって買い上げられた。","第1次農地改革の案は徹底していると評価され、GHQの修正なしに実施された。","農地改革により、小作料は金納から物納に改められた。","農地改革により、寄生地主制はかえって強化された。"],"e":"第1次農地改革案は不十分とされ、GHQの勧告により1946年に自作農創設特別措置法が制定されました（第2次農地改革）。不在地主の全貸付地と、在村地主の貸付地のうち原則1町歩（北海道は4町歩）を超える分を国が買い上げて小作人に安く売り渡しました。小作料は金納とされ、寄生地主制は解体されました。","m":"第2次農地改革：自作農創設特別措置法、不在地主の全貸付地"},{"id":98,"k":"plan","ref":"想定問題","f":"現代","t":"戦後の民主化諸法","y":1946,"q":"敗戦後の民主化政策について述べた文として、正しいものはどれですか。","c":["1946年4月の総選挙で、39名の女性議員が当選した。","労働三法のうち最初に制定されたのは、1945年の労働基準法である。","1947年の教育基本法で、義務教育が6年と定められた。","独占禁止法と過度経済力集中排除法は、1950年代に制定された。"],"e":"1945年の選挙法改正で満20歳以上の男女に選挙権が与えられ、翌年の総選挙で39名の女性議員が誕生しました。労働三法は労働組合法（1945年）、労働関係調整法（1946年）、労働基準法（1947年）の順に制定されました。教育基本法は義務教育を9年とし、独占禁止法と過度経済力集中排除法は1947年に制定されました。","m":"女性議員39名（1946）、労働組合法→調整法→基準法"},{"id":99,"k":"plan","ref":"想定問題","f":"現代","t":"日韓基本条約","y":1965,"q":"1965年に結ばれた日韓基本条約について述べた文として、正しいものはどれですか。","c":["佐藤栄作内閣が朴正煕政権との間で結び、韓国政府を朝鮮にある唯一の合法的な政府と確認した。","吉田茂内閣が李承晩政権との間で結んだ。","韓国併合以前に結ばれた条約や協定は、今後も有効であることが確認された。","条約の締結と同時に、日本は朝鮮民主主義人民共和国とも国交を開いた。"],"e":"日韓基本条約は佐藤栄作内閣と朴正煕政権の間で結ばれ、両国の国交が正常化しました。条約では、1910年の韓国併合以前の条約や協定は「もはや無効」であることが確認され、韓国政府が朝鮮にある唯一の合法的な政府とされました。北朝鮮とは現在も国交がありません。","m":"日韓基本条約（1965）＝佐藤・朴正煕、韓国を唯一の合法政府に"},{"id":100,"k":"plan","ref":"想定問題","f":"現代","t":"日韓請求権協定と李承晩ライン","y":1965,"q":"戦後の日韓関係について述べた文として、正しいものはどれですか。","c":["日韓基本条約と同時に協定が結ばれ、日本は韓国に経済協力を行い、両国間の請求権の問題は解決されたとされた。","韓国は1970年代に李承晩ラインを設定し、日本漁船の操業を制限した。","日韓基本条約の締結によって、竹島（独島）の帰属問題は決着した。","日韓の国交正常化交渉は、サンフランシスコ平和条約の締結前に妥結した。"],"e":"1965年、日韓基本条約と同時に請求権・経済協力協定などが結ばれ、日本は無償・有償の経済協力を行い、請求権問題は解決されたとされました。李承晩ラインは1952年に韓国が一方的に設定したもので、この協定に伴う漁業協定で廃止されました。竹島の問題は未解決のまま残され、国交正常化交渉は1951年に始まり14年かかりました。","m":"1965年 請求権・経済協力協定、李承晩ライン（1952）は廃止"},{"id":101,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅰ 問6","f":"原始・古代","t":"宝亀の乱と伊治呰麻呂","y":780,"q":"光仁天皇の時代に陸奥で反乱を起こし、多賀城を焼き打ちした蝦夷の豪族は誰ですか。","c":["伊治呰麻呂","阿弖流為","文室綿麻呂","紀古佐美"],"e":"780年、陸奥の郡司であった伊治呰麻呂が反乱を起こし、按察使の紀広純を殺して多賀城を焼きました。阿弖流為は胆沢を拠点に朝廷軍と戦った蝦夷の族長で、時期は桓武天皇の時代です。紀古佐美は789年に阿弖流為に敗れた朝廷軍の大将、文室綿麻呂は嵯峨天皇の時代に蝦夷征討をまとめた将軍で、どちらも朝廷側の人物です。","m":"伊治呰麻呂＝780年に多賀城を焼く（阿弖流為とは別人）"},{"id":102,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅰ 問7","f":"原始・古代","t":"六国史の最後と天暦の治","y":901,"q":"六国史の最後にあたる書物の書名と、「延喜・天暦の治」の「天暦」の時代の天皇の組み合わせとして、正しいものはどれですか。","c":["『日本三代実録』―村上天皇","『日本三代実録』―清和天皇","『日本文徳天皇実録』―村上天皇","『日本文徳天皇実録』―清和天皇"],"e":"六国史は『日本書紀』『続日本紀』『日本後紀』『続日本後紀』『日本文徳天皇実録』『日本三代実録』の順に編まれ、最後の『日本三代実録』は醍醐天皇の時代の901年に完成しました。「天暦」は村上天皇の年号で、958年には乾元大宝も発行されました。清和天皇は9世紀後半の天皇で、藤原良房が摂政になった時の天皇です。","m":"六国史の最後＝日本三代実録（901）、天暦＝村上天皇"},{"id":103,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅰ 問8","f":"原始・古代","t":"宇多天皇と阿衡の紛議","y":888,"q":"阿衡の紛議で藤原基経に抗議されて勅書を撤回した、宇多天皇について述べた文として、正しいものはどれですか。","c":["藤原基経の死後は摂政も関白も置かず、菅原道真らを用いて政治を進めた。","院政を始めるにあたって北面の武士を設け、上皇の御所の警備を固めさせた。","陽成天皇から譲位を受けて即位し、基経の補佐のもとで政治を始めた。","藤原時平の訴えを受け入れて、菅原道真を大宰権帥に左遷した。"],"e":"宇多天皇は887年に即位し、基経に与えた勅書の「阿衡」の語をめぐって基経が抗議すると、勅書を撤回しました（阿衡の紛議）。基経の死後（891年）は摂政・関白を置かず、菅原道真らを用いて親政を進めました。北面の武士は白河上皇が置いたもの、陽成天皇から即位したのは光孝天皇、道真を左遷したのは醍醐天皇の時です。","m":"宇多天皇＝阿衡の紛議のあと、基経没後は摂政・関白を置かず"},{"id":104,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅰ 問9","f":"原始・古代","t":"嵯峨天皇と検非違使","y":810,"q":"嵯峨天皇の時代に新しく設けられた令外官のうち、京の治安維持と裁判を担当したものはどれですか。","c":["検非違使","勘解由使","押領使","追捕使"],"e":"嵯峨天皇は薬子の変（810年）の際に、天皇の命令を太政官に速く伝える蔵人頭を置き、その後（816年ごろ）京の治安維持と裁判をおこなう検非違使も設けました。勘解由使は桓武天皇が国司交替の不正を監督するために置いたもの、押領使は10世紀前後に反乱鎮圧のため諸国に置かれた役職、追捕使は盗賊や反乱を捕らえる臨時の使いです。","m":"嵯峨天皇＝蔵人頭と検非違使、勘解由使は桓武天皇"},{"id":105,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅰ 問10","f":"原始・古代","t":"平安初期から中期の出来事の順序","y":887,"q":"次のａ～ｄを古いものから順に並べたものとして、正しいものはどれですか。\nａ．薬子の変が起こる\nｂ．阿衡の紛議が起こる\nｃ．伊治呰麻呂が多賀城を焼く\nｄ．乾元大宝が発行される","c":["ｃ→ａ→ｂ→ｄ","ａ→ｃ→ｂ→ｄ","ｃ→ａ→ｄ→ｂ","ｃ→ｂ→ａ→ｄ"],"e":"伊治呰麻呂の反乱は光仁天皇の780年、薬子の変は嵯峨天皇の810年、阿衡の紛議は宇多天皇の887～888年、乾元大宝の発行は村上天皇の958年です。したがって、ｃ→ａ→ｂ→ｄの順になります。蝦夷との戦い、律令国家の引き締め、摂関政治の確立、天皇親政という流れで整理すると覚えやすくなります。","m":"780（伊治呰麻呂）→810（薬子の変）→887（阿衡）→958（乾元大宝）"},{"id":106,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅰ 問4","f":"原始・古代","t":"調の負担","y":701,"q":"律令制の税のうち、絹・糸などの郷土の産物を納める調について、正しい説明はどれですか。","c":["正丁には、本来の調のほかに染料などの副物もあわせて納めさせた。","主に刑部省に納められ、囚人の労働や獄舎の運営の費用に当てられた。","原則として中央から派遣された官僚が、税物を都まで責任をもって運んだ。","京と畿内の住民だけに課され、地方の諸国の農民には課されなかった。"],"e":"調は絹・糸・布や海産物などの郷土の産物を納める税で、農民が運脚として都まで運びました。正丁には本来の調のほかに、染料などの調の副物も課されました。調は刑部省ではなく大蔵省に納められ、運搬も中央の官僚ではなく農民の役目で、京・畿内の負担は軽くても全国に課されました。","m":"調＝郷土の産物、運脚で都へ、正丁は調の副物も"},{"id":107,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅰ 問5","f":"原始・古代","t":"三世一身法","y":723,"q":"723年に出された三世一身法について、正しい説明はどれですか。","c":["新しく灌漑施設をつくって開墾した場合は三世、既存の施設を利用した場合は本人一代の所有を認めた。","新しく灌漑施設をつくって開墾した場合は本人一代、既存の施設を利用した場合は三世の所有を認めた。","開墾した田は身分や位階にかかわらず、永久に私有することを認めた。","開墾した田の私有を認める代わりに、その田にはすべて租を課さないこととした。"],"e":"三世一身法は、人口の増加で口分田が不足し税収も足りなくなったため、長屋王政権のもとで723年に出されました。新たに灌漑施設をつくって開墾すれば三世（本人・子・孫）、既存の施設を利用すれば本人一代の所有が認められました。期限が来ると収公されるため耕作を放棄する者が多く、743年の墾田永年私財法につながりました。","m":"三世一身法（723）＝新設は三世、既設は一代"},{"id":108,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅰ 問7","f":"原始・古代","t":"初期荘園の経営","y":760,"q":"墾田永年私財法のあとに寺社や貴族がつくった初期荘園の経営について、正しい説明はどれですか。","c":["付近の農民に田を賃租して耕作させ、収穫の一部を納めさせる形が中心だった。","専属の荘民が定住して、耕作から収穫の管理までをすべて担当する形が中心だった。","寺院の僧尼が自ら田を耕し、経営の全体を直接おこなうことが中心だった。","不輸不入の特権が認められ、国司の立ち入りも一切認められなかった。"],"e":"大寺社や貴族は、浮浪人や付近の農民を使って原野を開墾し、初期荘園をつくりました。初期荘園は自前の労働力が少なく、周辺の農民に田を賃租して耕作させる経営が中心でした。専属の荘民による経営や僧尼の直接経営が中心だったわけではなく、不輸不入の特権は平安時代の荘園で広がったもので、初期荘園は租を納める輸租田でした。","m":"初期荘園＝輸租田、周辺農民への賃租で経営"},{"id":109,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅰ 問8","f":"原始・古代","t":"本所","y":1100,"q":"寄進地系荘園で、領家と本家のうち、実質的な支配権をもって荘園に強い影響力を及ぼした者を何と呼びますか。","c":["本所","預所","下司","保司"],"e":"開発領主が土地を寄進した相手の領家と、さらにその上の本家のうち、実質的な支配権をもつ者を本所といいます。預所は領家などが現地に置いた管理者、下司は現地で荘園を管理した荘官、保司は国衙領の保を管理した役人で、いずれも荘園領主にあたる呼び名ではありません。","m":"領家・本家のうち実質的な支配権をもつ者＝本所"},{"id":110,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅰ 問9","f":"原始・古代","t":"国免荘と官省符荘","y":1050,"q":"荘園が税を免除される不輸の権を得る方法のうち、国司に認めてもらった荘園を何と呼びますか。","c":["国免荘","官省符荘","墾田地系荘園","寄進地系荘園"],"e":"不輸の特権には、太政官符や民部省符で認められた官省符荘と、国司が認めた国免荘の2種類があります。官省符荘は中央の公認なので安定していました。墾田地系荘園は開墾によって成立した荘園、寄進地系荘園は所領を貴族や寺社に寄進して成立した荘園という区別で、不輸の認可の種類を示す語ではありません。","m":"官省符荘＝中央の許可、国免荘＝国司の許可"},{"id":111,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅰ 問10","f":"原始・古代","t":"不入の権","y":1100,"q":"荘園が得た不入の権について、正しい説明はどれですか。","c":["検田使の立ち入りを拒み、のちには警察権の介入まで拒むようになった。","検田使の立ち入りは認めたが、警察権の介入だけを拒むことができる権利だった。","租や調などの税を、国司を通さず荘園領主に直接納めることができる権利だった。","検田使の立ち入りを拒んだが、のちには警察権の介入を受け入れるようになった。"],"e":"不入の権は、国司が派遣する検田使などが荘園に立ち入ることを拒否できる特権です。のちには警察権の介入も拒めるようになり、荘園は国衙からの独立性を強めました。税を免除される不輸の権とは別の特権で、両方を得た荘園が増えていきました。拒否できる範囲を逆に述べた選択肢は誤りです。","m":"不入の権＝検田使の立入り拒否→警察権の介入も拒否"},{"id":112,"k":"past","ref":"2026年度 国際関係学部A個別第2期 Ⅰ 問2","f":"原始・古代","t":"ワカタケル大王の鉄剣","y":471,"q":"倭王武にあたる雄略天皇の名とされる「獲加多支鹵大王」が刻まれた鉄剣が出土した古墳として、正しいものはどれですか。","c":["稲荷山古墳（埼玉県）","箸墓古墳（奈良県）","高松塚古墳（奈良県）","岩戸山古墳（福岡県）"],"e":"埼玉県の稲荷山古墳から出土した鉄剣には、「獲加多支鹵大王」の名が金象嵌で刻まれ、辛亥年（471年）の年代があるとされます。この大王は『宋書』倭国伝の倭王武、つまり雄略天皇にあたると考えられます。箸墓古墳は3世紀後半の大型前方後円墳、高松塚古墳は7世紀末から8世紀初めの壁画古墳、岩戸山古墳は筑紫君磐井の墓とされる古墳です。","m":"ワカタケル＝雄略天皇＝倭王武、稲荷山古墳の鉄剣"},{"id":113,"k":"past","ref":"2026年度 国際関係学部A個別第2期 Ⅰ 問4","f":"原始・古代","t":"倭王武の上表文の年","y":478,"q":"『宋書』倭国伝にある、倭王武が宋の順帝に上表文を送った年（昇明2年）の西暦として、正しいものはどれですか。","c":["478年","239年","107年","369年"],"e":"倭王武は478年（昇明2年）に宋の順帝へ上表文を送り、高句麗の圧迫を訴えて「安東大将軍」などの称号を求めました。107年は倭国王帥升が後漢に使者を送った年、239年は邪馬台国の卑弥呼が魏に使いを送った年、369年は七支刀がつくられたとされる年で、いずれも倭の五王の時代ではありません。","m":"倭王武の上表文＝478年、宋の順帝に送る"},{"id":114,"k":"past","ref":"2026年度 国際関係学部A個別第2期 Ⅰ 問5","f":"原始・古代","t":"国分寺と国分尼寺","y":741,"q":"聖武天皇が741年の詔で諸国に建てさせた寺について、正しい説明はどれですか。","c":["国分寺は金光明四天王護国之寺、国分尼寺は法華滅罪之寺と呼ばれ、都の総国分寺は東大寺である。","国分寺は法華滅罪之寺、国分尼寺は金光明四天王護国之寺と呼ばれ、都の総国分寺は東大寺である。","国分寺は金光明四天王護国之寺、国分尼寺は法華滅罪之寺と呼ばれ、都の総国分寺は興福寺である。","国分寺は法華滅罪之寺、国分尼寺は金光明四天王護国之寺と呼ばれ、都の総国分寺は興福寺である。"],"e":"聖武天皇は741年の詔で、諸国に国分寺（金光明四天王護国之寺）と国分尼寺（法華滅罪之寺）を建てさせ、仏教の力で国家の安定をはかりました。都の総国分寺が東大寺（総国分尼寺は法華寺）です。僧寺と尼寺の名を入れ替えた選択肢や、総国分寺を興福寺とした選択肢は誤りです。興福寺は藤原氏の氏寺です。","m":"国分寺＝金光明四天王護国之寺、総国分寺は東大寺"},{"id":115,"k":"past","ref":"2026年度 国際関係学部A個別第1期 Ⅰ 問8","f":"原始・古代","t":"遣唐使の停止","y":894,"q":"宇多天皇の時代に、遣唐使の派遣の停止を建議した人物は誰ですか。","c":["菅原道真","藤原時平","紀貫之","橘広相"],"e":"894年、遣唐大使に任じられた菅原道真は、唐の衰えと航海の危険を理由に、派遣の再検討を宇多天皇に建議し、遣唐使は事実上廃止されました。藤原時平は道真と対立した左大臣、紀貫之は『古今和歌集』の撰者の一人、橘広相は阿衡の紛議の勅書を起草した学者で、停止の建議にはかかわっていません。","m":"遣唐使の停止＝894年、菅原道真の建議"},{"id":116,"k":"past","ref":"2026年度 国際関係学部A個別第1期 Ⅰ 問10","f":"原始・古代","t":"遣唐使停止後の出来事の順序","y":935,"q":"遣唐使の停止後から刀伊の入寇までに起こった次のａ～ｄを、古いものから順に並べたものはどれですか。\nａ．安和の変\nｂ．平将門の乱\nｃ．延喜の荘園整理令\nｄ．『古今和歌集』の成立","c":["ｃ→ｄ→ｂ→ａ","ｃ→ｂ→ｄ→ａ","ｄ→ｃ→ｂ→ａ","ｃ→ｄ→ａ→ｂ"],"e":"延喜の荘園整理令は902年、『古今和歌集』の成立は905年、平将門の乱は935年から940年、安和の変は969年のことです。したがって、ｃ→ｄ→ｂ→ａの順になります。荘園整理令は醍醐天皇が出し、安和の変で源高明が左遷されて、藤原氏による摂関政治が確立しました。","m":"902（荘園整理令）→905（古今和歌集）→935（将門）→969（安和の変）"},{"id":117,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅱ 問13","f":"中世","t":"法勝寺と六勝寺","y":1077,"q":"白河天皇が京都の白河の地に建てた寺で、のちに「六勝寺」と総称される寺院の最初のものはどれですか。","c":["法勝寺","法成寺","平等院","中尊寺"],"e":"白河天皇は1077年、白河の地に法勝寺を建てました。以後も尊勝寺・最勝寺など、「勝」の字のつく寺院が天皇や皇后によって建てられ、六勝寺と総称されます。法成寺は藤原道長が建てた寺、平等院は藤原頼通が宇治に建てた寺、中尊寺は奥州藤原氏の初代清衡が平泉に建てた寺で、いずれも六勝寺ではありません。","m":"六勝寺の最初＝白河天皇の法勝寺"},{"id":118,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅱ 問12","f":"中世","t":"梁塵秘抄","y":1170,"q":"院政期の文化について述べた文として、正しいものはどれですか。","c":["後白河法皇が今様を集めて、歌謡集『梁塵秘抄』を編んだ。","『梁塵秘抄』は、古くからの宮廷の儀式の次第を集めて編まれた書物である。","源平の争乱を描いた軍記物語として、『太平記』が書かれた。","平将門の乱を描いた軍記物語の『将門記』が、院政期に成立した。"],"e":"後白河法皇は、当時の流行歌だった今様を集めて『梁塵秘抄』を編みました。宮廷儀礼を集めた書ではなく歌謡集です。『太平記』は南北朝の動乱を描いた軍記物語で、源平の争乱を描いたのは『平家物語』（鎌倉時代）です。『将門記』は10世紀半ばの平将門の乱を描いたもので、成立も院政期より前です。","m":"梁塵秘抄＝後白河法皇が編んだ今様の歌謡集"},{"id":119,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅱ 問11","f":"中世","t":"平家納経と厳島神社","y":1164,"q":"平清盛が一門の繁栄を願って『平家納経』を納めた神社はどこですか。","c":["厳島神社","春日大社","熱田神宮","石清水八幡宮"],"e":"平清盛は安芸の厳島神社を厚く信仰し、1164年に一門で『平家納経』を奉納しました。清盛は瀬戸内海航路と日宋貿易に力を入れ、厳島神社も海上交通の守り神として信仰されました。春日大社は藤原氏の氏神、熱田神宮は草薙剣を祀る尾張の神社、石清水八幡宮は源氏が氏神として崇めた神社です。","m":"平家納経＝平清盛が厳島神社に奉納"},{"id":120,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅱ 問14","f":"中世","t":"按司とグスク","y":1350,"q":"琉球で、グスク（城）を拠点として各地に勢力をもった有力者は、何と呼ばれましたか。","c":["按司","郷司","保司","下司"],"e":"琉球では12世紀ごろから各地にグスクが築かれ、そこを拠点とする有力者が按司と呼ばれました。14世紀には按司の勢力がまとまって北山・中山・南山の三山が並び立ち、のちに尚巴志によって統一されました。郷司・保司は本土の国衙領で郡・郷・保を管理した役人、下司は荘園の現地を管理した荘官です。","m":"グスクの有力者＝按司（三山時代へ）"},{"id":121,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅰ 問6","f":"中世","t":"地下請（百姓請）","y":1400,"q":"惣村が荘園領主に納める年貢の徴収と納入を、村として一括して請け負うことを何といいますか。","c":["地下請（百姓請）","地頭請（地頭による請負）","守護請（守護による請負）","半済（年貢の半分の徴収）"],"e":"室町時代には、惣村が荘園領主への年貢の納入を一括して請け負う地下請（百姓請・村請）が広がりました。地頭請は地頭が領主から荘園の管理を請け負うもの、守護請は守護が請け負うもの、半済は守護が荘園の年貢の半分を軍費として取るもので、請け負う主体が村ではありません。","m":"地下請＝村（惣村）が年貢の納入を請け負う"},{"id":122,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅰ 問7","f":"中世","t":"鎌倉時代の商業と金融","y":1250,"q":"鎌倉時代の商工業と金融について、正しい説明はどれですか。","c":["年貢の運用などで金融を営む高利貸業者を、借上と呼んだ。","遠隔地への送金には、銭の代わりに主として紙幣が使われた。","月6回開かれる六斎市が、すでに全国の定期市の中心となっていた。","大山崎離宮八幡宮に属する酒麹座が、座の代表例であった。"],"e":"借上は年貢の運用や貸付で利益を得た金融業者で、鎌倉時代から活動しました。遠隔地の取引では紙幣ではなく為替（割符）が使われ、六斎市が広がったのは室町時代で、鎌倉時代の定期市は月3回の三斎市が中心でした。大山崎離宮八幡宮に属したのは油座で、酒麹座は京都の北野神社に属した座です。","m":"借上＝鎌倉の金融業者、為替は割符、市は三斎市"},{"id":123,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅰ 問8","f":"中世","t":"撰銭と撰銭令","y":1500,"q":"撰銭について述べた文として、正しいものはどれですか。","c":["悪銭を嫌って良銭を選ぶ行為で、幕府や戦国大名が撰銭令を出して規制した。","私鋳銭を防ぐため、室町幕府が自ら銅銭を大量に鋳造して全国に流通させた。","幕府は撰銭令を出さず、戦国大名だけが領内に撰銭令を出して悪銭の流通を制限した。","撰銭が広がった結果、悪銭が良銭にかわって流通し、貨幣の価値は全国で統一された。"],"e":"室町時代には、私鋳銭などの粗悪な銭が出回り、人々が悪銭を嫌って良銭を選ぶ撰銭が広がって、取引が混乱しました。そこで室町幕府や戦国大名は、悪銭と良銭の交換比率や受け取りの方法を定める撰銭令を出しました。幕府が自ら貨幣を大量に鋳造したわけではなく、撰銭令を出したのも戦国大名だけではありません。","m":"撰銭＝悪銭を嫌う→幕府・戦国大名が撰銭令"},{"id":124,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅰ 問10","f":"中世","t":"嘉吉の徳政一揆","y":1441,"q":"1441年に起きた嘉吉の徳政一揆について、正しい説明はどれですか。","c":["義教が殺された嘉吉の変の後、義勝の代始めを機に、徳政を求めて京都周辺で起こった。","正長の徳政一揆の後、8代将軍義政の代始めを機に、山城国の国人たちが徳政を求めて起こした。","播磨国で起こり、守護赤松氏の軍勢を国外に追い出すことを求めた。","幕府は一揆を鎮圧し、徳政令を出さないまま、分一銭を取り立てただけだった。"],"e":"1441年、6代将軍足利義教が赤松満祐に殺される嘉吉の変が起こると、7代義勝の代始めを理由に、徳政を求める土一揆が京都周辺で起こりました。幕府はこの時、初めて徳政令を出しました。播磨の土一揆は1429年で、赤松氏の軍勢の国外退去を求めたものです。分一銭は、徳政令にあたって債務者や債権者から幕府が取った手数料です。","m":"嘉吉の徳政一揆（1441）＝義勝の代始め、初の徳政令"},{"id":125,"k":"past","ref":"2026年度 国際関係学部A個別第2期 Ⅱ 問19","f":"中世","t":"天文法華の乱","y":1536,"q":"1536年に京都で起こった天文法華の乱について、正しい説明はどれですか。","c":["延暦寺の僧兵が、京都の日蓮宗（法華宗）の寺院の多くを焼き払った。","本願寺の一向宗徒が、京都の日蓮宗の寺院を焼き払い、法華一揆が衰えた。","山城国の国人や農民が、京都の日蓮宗の寺院を焼き払い、守護を追い出した。","加賀の一向一揆が、日蓮宗の寺院を焼き払い、守護の富樫政親を倒した。"],"e":"天文法華の乱では、京都で勢力を強めていた日蓮宗（法華宗）の町衆に対して、比叡山延暦寺の僧兵が近江の六角氏の援軍を得て攻め込み、日蓮宗の寺院の多くを焼き払いました。法華一揆はこれで力を失いました。加賀の一向一揆が守護の富樫政親を倒したのは1488年で、別の事件です。","m":"天文法華の乱（1536）＝延暦寺が京都の法華宗寺院を焼く"},{"id":126,"k":"past","ref":"2026年度 国際関係学部A個別第2期 Ⅱ 問20","f":"中世","t":"大内氏の滅亡","y":1551,"q":"1551年に大内義隆を討って、大内氏の実権を握った重臣は誰ですか。","c":["陶晴賢","毛利元就","尼子晴久","大友義鎮"],"e":"1551年、大内義隆は重臣の陶晴賢（隆房）の謀反で滅ぼされました（大寧寺の変）。陶晴賢は1555年の厳島の戦いで毛利元就に敗れ、のちに大内氏は完全に滅びます。毛利元就は安芸の国人から勢力を伸ばし陶氏を倒した人物で、義隆を討った人物ではありません。尼子氏は出雲、大友氏は豊後の戦国大名です。","m":"大内義隆を討ったのは陶晴賢（1551）、のち毛利氏に敗れる"},{"id":127,"k":"past","ref":"2026年度 国際関係学部A個別第2期 Ⅱ 問12","f":"中世","t":"応永の乱","y":1399,"q":"1392年の南北朝の合体から1419年の応永の外寇までの間に起こった出来事として、正しいものはどれですか。","c":["足利義満が、周防・長門など6か国の守護大内義弘を堺で討った。","足利義満が、「六分一殿」と呼ばれた守護の山名氏清を京都で討った。","鎌倉公方の足利成氏が、関東管領の上杉憲忠を殺害して戦乱が始まった。","足利義満が、美濃・尾張・伊勢の守護である土岐康行を討った。"],"e":"大内義弘は朝鮮との貿易で力を蓄え、1399年に足利義満の圧迫に反抗して挙兵し、堺で討たれました（応永の乱）。山名氏清を討った明徳の乱は1391年、土岐康行を討った土岐氏の乱は1390年で、どちらも1392年の南北朝合体より前です。上杉憲忠の殺害は1454年の享徳の乱のきっかけで、1419年より後のことです。","m":"応永の乱（1399）＝大内義弘、明徳の乱（1391）より後"},{"id":128,"k":"past","ref":"2026年度 国際関係学部A個別第1期 Ⅱ 問19","f":"中世","t":"勘合貿易の輸出品","y":1430,"q":"日明貿易（勘合貿易）で日本から明へ輸出された品として、正しい組み合わせはどれですか。","c":["銅・硫黄・刀剣・扇・屏風など","生糸・絹織物・陶磁器・書籍など","銅銭・生糸・絹織物・書画など","銀・俵物・樟脳・漆器など"],"e":"勘合貿易では、日本から銅・硫黄・刀剣・扇・屏風などが輸出され、明からは銅銭・生糸・絹織物・陶磁器・書画・書籍などが輸入されました。とくに大量の銅銭は日本の貨幣流通に大きな影響を与えました。生糸や陶磁器は輸入品で、銀や俵物を主に輸出したのは江戸時代の長崎貿易です。","m":"輸出＝銅・硫黄・刀剣・扇、輸入＝銅銭・生糸・絹織物"},{"id":129,"k":"past","ref":"2026年度 国際関係学部A個別第1期 Ⅱ 問13","f":"中世","t":"元寇への備え","y":1276,"q":"文永の役（1274年）の前後に、鎌倉幕府が元の再来襲に備えておこなった対策として、正しいものはどれですか。","c":["九州の御家人に異国警固番役を課し、博多湾沿岸に石築地を築かせた。","九州の御家人に鎮西探題を課して、博多湾沿岸に水城を築かせた。","九州の御家人に異国警固番役を課して、博多湾沿岸に大野城を築かせた。","九州の御家人に鎮西探題を課して、博多湾沿岸に石築地を築かせた。"],"e":"幕府は元の襲来に備え、九州の御家人に沿岸の警備にあたる異国警固番役を課し、文永の役のあとには博多湾沿岸に石築地（元寇防塁）を築かせました。鎮西探題は1293年に博多に置かれた九州の軍事・裁判の機関で、御家人に課される役ではありません。水城や大野城は、白村江の戦いのあとに築かれた古代の防衛施設です。","m":"異国警固番役＋石築地、鎮西探題は1293年"},{"id":130,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅲ 問24","f":"近世","t":"諸国の特産品","y":1800,"q":"江戸時代の特産物である藍玉・黒砂糖・最上紅花の主な産地の組み合わせとして、正しいものはどれですか。","c":["藍玉―阿波、黒砂糖―薩摩、最上紅花―出羽","藍玉―薩摩、黒砂糖―阿波、最上紅花―出羽","藍玉―阿波、黒砂糖―出羽、最上紅花―薩摩","藍玉―出羽、黒砂糖―薩摩、最上紅花―阿波"],"e":"藍玉は阿波（徳島）の特産で、染料の藍から作られ、大坂を中心に流通しました。黒砂糖は薩摩藩が奄美・琉球で生産させ、藩の財政を支えました。最上紅花は出羽の最上地方の特産で、染料や口紅の原料として京都などで需要がありました。産地を入れ替えた選択肢は誤りです。","m":"阿波＝藍玉、薩摩＝黒砂糖、出羽＝最上紅花"},{"id":131,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅲ 問22","f":"近世","t":"幕府直轄の鉱山","y":1700,"q":"江戸時代の鉱山について、正しい説明はどれですか。","c":["佐渡の金山や石見・生野の銀山は幕府の直轄で、奉行や代官が支配した。","佐渡の金山や石見・生野の銀山は所在する藩が管理し、幕府は運上金だけを受け取った。","銀の産出は江戸時代を通じて増え続け、金の産出が減っても貨幣の原料に不足しなかった。","銅は国内で消費されるだけで、長崎貿易の輸出品としては扱われなかった。"],"e":"佐渡金山（佐渡奉行）・石見銀山（大森代官）・生野銀山（生野奉行）などの主要な鉱山は、幕府が直轄して奉行や代官に支配させました。金銀の産出は17世紀前半に最盛期を迎えたあと次第に減り、かわって銅が長崎貿易の主要な輸出品となりました。藩が管理して幕府は運上金だけを受け取ったわけではありません。","m":"佐渡・石見・生野＝幕府直轄、銅は輸出品に"},{"id":132,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅲ 問27","f":"近世","t":"宝永の富士山噴火と高役金","y":1707,"q":"徳川綱吉の時代に富士山が大噴火したあと、その復興費用を全国から集めるために課された臨時の税はどれですか。","c":["高役金","運上金","冥加金","口米"],"e":"1707年（宝永4年）に富士山が大噴火し、周辺は降灰で大きな被害を受けました。幕府は復興費用として、幕領・私領を問わず全国に石高100石につき金2両の高役金を課しました。運上金・冥加金は商工業者などから取る営業税、口米は年貢に付け加えて取る米納の付加税で、噴火の復興とは関係がありません。","m":"宝永の富士山噴火（1707）→全国に高役金"},{"id":133,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅲ 問28","f":"近世","t":"国訴","y":1823,"q":"文政期に畿内の村々が、綿や菜種を自由に売買できるよう求めて団結した、合法的な訴願運動を何といいますか。","c":["国訴","村方騒動","打ちこわし","代表越訴型一揆"],"e":"国訴は、文政6年（1823年）に摂津・河内などの1000か村以上が、綿や菜種の販売を大坂の問屋に独占されることに反対して、自由な取引を求めた訴願運動です。村方騒動は村内の役人や有力者への不満、打ちこわしは都市の貧民が米屋などを襲う行動、代表越訴型一揆は村の代表が領主に直訴する一揆で、いずれも国をこえた合法的な訴願運動ではありません。","m":"国訴＝畿内の村々が綿・菜種の自由販売を求めた訴願"},{"id":134,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅲ 問29","f":"近世","t":"地廻りもの","y":1750,"q":"江戸時代に関東で生産されて江戸へ送られた「地廻りもの」の例として、正しいものはどれですか。","c":["下総の野田でつくられた醤油","摂津の灘や伊丹でつくられた清酒","山城の宇治でつくられた上質な茶","大和の三輪でつくられた手延べ素麺"],"e":"江戸の人口が増えると、上方から送られる下り物だけでなく、関東周辺でつくられた品も江戸に出回るようになり、これを地廻りものといいます。下総の野田や銚子の醤油はその代表です。灘の酒、宇治の茶、三輪の素麺はいずれも上方の特産品で、下り物として江戸に送られました。","m":"地廻りもの＝関東産（野田・銚子の醤油）、下り物＝上方産"},{"id":135,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅲ 問25","f":"近世","t":"元禄期の農書・本草書","y":1697,"q":"元禄期に実学が発達するなかで書かれた書物と著者の組み合わせとして、正しいものはどれですか。","c":["『農業全書』―宮崎安貞、『大和本草』―貝原益軒","『大和本草』―宮崎安貞、『農業全書』―貝原益軒","『農政本論』―宮崎安貞、『大和本草』―貝原益軒","『農業全書』―宮崎安貞、『農政本論』―貝原益軒"],"e":"宮崎安貞の『農業全書』（1697年）は各地の農業技術を整理した体系的な農書、貝原益軒の『大和本草』（1709年）は薬用植物など動植物を分類・解説した本草学の書です。『農政本論』は江戸後期に佐藤信淵が著した農政の書で、元禄期のものではありません。","m":"農業全書＝宮崎安貞、大和本草＝貝原益軒"},{"id":136,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅲ 問23","f":"近世","t":"田畑永代売買の禁止令","y":1643,"q":"17世紀前半に、幕府が本百姓の没落を防ぐために出した法令と、その内容の組み合わせとして、正しいものはどれですか。","c":["田畑永代売買の禁止令―田畑を永久に売り渡すことを禁じた","人返しの法―江戸に出てきた農民を強制的に村へ戻した","質流地禁止令―質流れの形で田畑が流出するのを禁じた","囲米の制―飢饉に備えて諸大名に領内で米を蓄えさせた"],"e":"幕府は1643年、田畑永代売買の禁止令を出し、百姓が田畑を売って没落するのを防いで、年貢の基盤を守ろうとしました。人返しの法は天保の改革で江戸に流入した貧民を帰村させた政策、質流地禁止令は享保期に質流れによる土地の集中を防ぐため出された法令、囲米は寛政の改革で飢饉に備えて大名に米を蓄えさせた政策です。","m":"田畑永代売買の禁止（1643）＝本百姓の没落防止"},{"id":137,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅲ 問27","f":"近世","t":"寛政の改革の出版統制","y":1791,"q":"寛政の改革の出版統制で処罰された人物と作品の組み合わせとして、正しいものはどれですか。","c":["山東京伝―洒落本","林子平―『赤蝦夷風説考』","工藤平助―『海国兵談』","杉田玄白―『解体新書』"],"e":"寛政の改革では出版統制がおこなわれ、洒落本作家の山東京伝は1791年に処罰され、『海国兵談』で海防を説いた林子平も幕政批判として処罰されました。『赤蝦夷風説考』は仙台藩医の工藤平助の著作で、田沼意次に蝦夷地の開発を考えさせたものです。杉田玄白は『解体新書』を著した蘭学者で、この改革で処罰されたわけではありません。","m":"寛政の出版統制＝山東京伝（洒落本）・林子平（海国兵談）"},{"id":138,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅲ 問29","f":"近世","t":"化政文化の文人","y":1820,"q":"化政文化期の文人と作品・活動の組み合わせとして、正しいものはどれですか。","c":["小林一茶―信濃出身で、庶民の生活を俳句に詠んだ","鈴木牧之―『南総里見八犬伝』を著した読本作家","柳亭種彦―越後の雪国の暮らしを描いた『北越雪譜』を著した","曲亭馬琴―『偐紫田舎源氏』を著した合巻作者"],"e":"小林一茶は信濃国の農家の出身で、『おらが春』などで庶民の生活や素朴な感情を俳句に詠みました。『南総里見八犬伝』は曲亭（滝沢）馬琴の読本、『北越雪譜』は越後の鈴木牧之の作品で、『偐紫田舎源氏』は柳亭種彦の合巻です。作者と作品を入れ替えた選択肢はいずれも誤りです。","m":"化政：一茶（俳諧）・馬琴（読本）・牧之（北越雪譜）"},{"id":139,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅲ 問30","f":"近世","t":"生田万の乱","y":1837,"q":"大塩平八郎の乱の影響を受けて、国学者の生田万が陣屋を襲って蜂起した場所はどこですか。","c":["越後国（柏崎）","武蔵国（川越）","信濃国（松本）","越前国（福井）"],"e":"1837年、大塩平八郎の乱に影響を受けた国学者の生田万が、越後国柏崎にあった桑名藩の陣屋を襲って蜂起しました（生田万の乱）。生田万は平田篤胤の門人で、飢饉に苦しむ人々の救済を訴えましたが、すぐに鎮圧されました。大塩の乱が幕府や藩に与えた衝撃の大きさを示す事件です。武蔵・信濃・越前は事件が起きた地ではありません。","m":"生田万の乱（1837）＝越後柏崎の陣屋を襲撃"},{"id":140,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅳ 問31","f":"近世","t":"琉球の使節","y":1634,"q":"江戸時代の琉球について、正しい説明はどれですか。","c":["将軍の代替わりには慶賀使、琉球国王の代替わりには謝恩使を江戸に派遣した。","島津氏に服属して以降は、明（のち清）への朝貢をやめ、幕府にだけ使節を送った。","琉球国王は江戸に参勤し、大名と同じように一定期間を江戸で過ごした。","琉球との交渉は長崎奉行が統制し、琉球の使節は長崎の出島に滞在した。"],"e":"1609年に島津氏の侵攻を受けた琉球王国は、薩摩藩の支配下に入りながらも明（のち清）への朝貢を続けました。幕府へは、将軍の代替わりに慶賀使、琉球国王の代替わりに謝恩使を江戸に派遣しました。国王が参勤することはなく、琉球との窓口は薩摩藩で、長崎奉行が統制したのはオランダ・中国との貿易です。","m":"琉球使節＝将軍代替わりは慶賀使、国王代替わりは謝恩使"},{"id":141,"k":"past","ref":"2026年度 商学部A個別第2期 Ⅳ 問38","f":"近世","t":"オランダ風説書","y":1640,"q":"江戸幕府が長崎のオランダ商館長に毎年出させ、通詞が訳した、海外の情勢をまとめた報告書を何といいますか。","c":["オランダ風説書","唐船風説書","『華夷通商考』","『蘭学事始』"],"e":"オランダ風説書は、長崎に入港したオランダ船がもたらした情報をもとに、商館長が幕府に提出した海外情勢の報告書で、通詞が翻訳しました。幕府はこれによってアヘン戦争などの世界の動きを知りました。唐船風説書は中国船の船主から出させた報告書、『華夷通商考』は西川如見が著した世界地誌、『蘭学事始』は杉田玄白の回想録です。","m":"オランダ風説書＝商館長が出した海外情報（唐船風説書は中国船）"},{"id":142,"k":"past","ref":"2026年度 商学部A個別第2期 Ⅳ 問37","f":"近世","t":"唐人屋敷","y":1689,"q":"1689年、長崎で清の商人を集めて居住させるために、郊外に設けられた施設はどれですか。","c":["唐人屋敷（長崎）","出島（長崎）","倭館（釜山）","鴻臚館（福岡）"],"e":"長崎では密貿易を防ぐため、1689年に郊外に唐人屋敷がつくられ、それまで市中に雑居していた清の商人が集められました。出島はオランダ人、倭館は朝鮮の釜山などに置かれた日本人の居留地、鴻臚館は古代の福岡や難波に置かれた外国使節をもてなす施設です。","m":"唐人屋敷（1689）＝長崎の清商人の居住地、出島はオランダ"},{"id":143,"k":"past","ref":"2026年度 国際関係学部A個別第1期 Ⅲ 問25","f":"近世","t":"出島","y":1641,"q":"長崎の出島について、正しい説明はどれですか。","c":["1641年にオランダ商館が平戸から移され、西洋に開かれた唯一の窓口となった。","1634年の完成当初から、オランダ人が居住して貿易をおこなっていた。","出島に移された商館は、もとはイギリス東インド会社が平戸に開いた商館だった。","出島の貿易は、オランダと幕府が協定関税にもとづいて取引をおこなった。"],"e":"出島は1634年に長崎の町人の出資で築かれ、はじめはポルトガル人が収容されました。1639年にポルトガル船の来航が禁止されると、1641年に平戸のオランダ商館が出島に移され、オランダは西洋に開かれた唯一の貿易国になりました。イギリスは1623年に平戸の商館を閉鎖しており、協定関税は幕末の不平等条約によるものです。","m":"出島：1634築造、1641オランダ商館移転"},{"id":144,"k":"past","ref":"2026年度 国際関係学部A個別第2期 Ⅲ 問24","f":"近世","t":"南鐐二朱銀","y":1772,"q":"田沼意次が1772年に鋳造させた、貨幣制度の一本化をめざした計数銀貨はどれですか。","c":["南鐐二朱銀","天保一分銀","丁銀","豆板銀"],"e":"田沼意次は1772年に南鐐二朱銀を鋳造しました。これは重さをはからず枚数で通用する計数銀貨で、8枚で金1両にあたり、東日本の金遣いと西日本の銀遣いを一本化する狙いがありました。丁銀・豆板銀は重さをはかって使う秤量貨幣、天保一分銀は1837年に鋳造された計数銀貨で、田沼時代のものではありません。","m":"南鐐二朱銀（1772）＝田沼期の計数銀貨"},{"id":145,"k":"past","ref":"2026年度 国際関係学部A個別第2期 Ⅲ 問29","f":"近世","t":"最上徳内","y":1785,"q":"田沼意次の時代の1785年、幕府が送った蝦夷地調査隊に加わって千島を調べた人物で、経世家本多利明の弟子でもあったのは誰ですか。","c":["最上徳内","間宮林蔵","近藤重蔵","伊能忠敬"],"e":"最上徳内は出羽の出身で、本多利明に学んだのち、1785年に幕府が派遣した蝦夷地調査に参加し、千島を探査しました。間宮林蔵は1808年に樺太を探査して島であることを確認した人物、近藤重蔵は1798年に択捉島を探査した人物、伊能忠敬は全国の測量をおこなって地図をつくった人物です。","m":"最上徳内（本多利明の弟子）＝1785年に千島を探査"},{"id":146,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問33","f":"近代","t":"国会期成同盟の請願","y":1880,"q":"1880年に国会期成同盟が国会開設を求める請願書を提出しようとした際の結果として、正しいものはどれですか。","c":["太政官と元老院に提出しようとしたが、どちらにも受理されなかった。","太政官は受理したが、元老院が受理せず、請願は却下された。","元老院が受理して審議し、国会開設の時期を翌年に決定した。","政府は請願を受理し、ただちに憲法制定のための調査委員会を設けた。"],"e":"1880年、大阪で結成された国会期成同盟（愛国社の流れをくむ）は、国会開設を求める請願書を太政官と元老院に提出しようとしましたが、受理されませんでした。政府は同じ年に集会条例を出して運動を取り締まりました。国会開設を約束したのは翌1881年の国会開設の勅諭で、これは明治十四年の政変の結果です。","m":"国会期成同盟（1880）の請願は受理されず→集会条例"},{"id":147,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問32","f":"近代","t":"中村正直と『西国立志編』","y":1871,"q":"スマイルズの『自助論』を『西国立志編』、ミルの『自由論』を『自由之理』として翻訳・出版した啓蒙思想家は誰ですか。","c":["中村正直","福沢諭吉","中江兆民","馬場辰猪"],"e":"中村正直は旧幕臣で明六社の同人でもあり、スマイルズの『自助論』を『西国立志編』（1871年）、J.S.ミルの『自由論』を『自由之理』として訳し、青年たちに大きな影響を与えました。福沢諭吉は『学問のすゝめ』、中江兆民はルソーの『社約論』を訳した『民約訳解』、馬場辰猪は『天賦人権論』を著した人物です。","m":"『西国立志編』『自由之理』の訳者＝中村正直"},{"id":148,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問35","f":"近代","t":"伊藤博文の憲法調査","y":1882,"q":"1882年から翌年にかけてヨーロッパに渡った伊藤博文が、憲法について教えを受けた人物と場所の組み合わせとして、正しいものはどれですか。","c":["ベルリン大学のグナイストとウィーン大学のシュタイン","ウィーン大学のグナイストとベルリン大学のシュタイン","ベルリン大学のロエスレルとウィーン大学のモッセ","ウィーン大学のロエスレルとベルリン大学のグナイスト"],"e":"伊藤博文は1882年にヨーロッパへ渡り、ドイツ（ベルリン大学）ではグナイストとモッセ、オーストリア（ウィーン大学）ではシュタインから、君主権の強い立憲制の理論を学びました。ロエスレルは日本に招かれたドイツ人法学者で、帰国後の憲法起草に助言し、モッセは地方制度の整備に助言しました。","m":"ベルリン＝グナイスト、ウィーン＝シュタイン"},{"id":149,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問36","f":"近代","t":"大日本帝国憲法の性格","y":1889,"q":"大日本帝国憲法について、正しい説明はどれですか。","c":["天皇が定めて臣民に与える欽定憲法で、天皇は統帥権や条約締結権をもった。","国民の代表が議会で制定した民定憲法として発布され、天皇の権限は象徴にとどまった。","天皇が国民との契約によって定めた協約憲法で、軍の指揮権は内閣が握っていた。","天皇が定めた欽定憲法で、宣戦や講和には帝国議会の協賛が必要とされた。"],"e":"大日本帝国憲法は1889年2月11日に、天皇が臣民に与える形の欽定憲法として発布されました。天皇は陸海軍の統帥権をはじめ、宣戦・講和・条約の締結などの天皇大権をもち、議会の関与は限られていました。民定憲法や協約憲法ではなく、軍の統帥は内閣から独立していました。","m":"大日本帝国憲法＝欽定憲法、天皇大権（統帥・宣戦講和・条約）"},{"id":150,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問38","f":"近代","t":"金輸出再禁止と高橋是清","y":1931,"q":"世界恐慌のなかで1931年末に金輸出を再禁止し、管理通貨制度に移行した大蔵大臣は誰ですか。","c":["高橋是清","井上準之助","浜口雄幸","片岡直温"],"e":"1931年12月に成立した犬養毅内閣の蔵相高橋是清は、ただちに金輸出を再禁止して、金の保有量に関係なく通貨を発行できる管理通貨制度に移りました。井上準之助は1930年に金解禁を実施した浜口雄幸内閣の蔵相、片岡直温は1927年に失言して金融恐慌のきっかけをつくった蔵相です。","m":"金輸出再禁止（1931）＝犬養内閣の高橋是清"},{"id":151,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問39","f":"近代","t":"パリ不戦条約と国際協調","y":1928,"q":"1920年代の国際協調について、正しい説明はどれですか。","c":["1928年のパリ不戦条約は、国際紛争を解決する手段としての戦争を放棄した。","ワシントン会議の四か国条約は、中国の領土保全と門戸開放・機会均等の原則を定めた。","ワシントン海軍軍縮条約は、日本の主力艦の保有比率を英米の7割と定めた。","ロンドン海軍軍縮条約は、五か国の補助艦の保有量を一律に制限した。"],"e":"パリ不戦条約（1928年）は、国際紛争を解決する手段としての戦争を放棄することを15か国が調印した条約です。中国の領土保全と門戸開放・機会均等は九か国条約で、四か国条約は太平洋の現状維持を定めました。ワシントン海軍軍縮条約で日本の主力艦は対英米約6割とされ、ロンドン海軍軍縮条約は英米日の補助艦を制限しましたが、フランス・イタリアは一部しか加わっていません。","m":"不戦条約（1928）＝戦争放棄、九か国条約＝門戸開放"},{"id":152,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問40","f":"近代","t":"日満議定書","y":1932,"q":"1932年の日満議定書について、正しい説明はどれですか。","c":["日本は満洲国を承認し、満洲国内での日本の権益の尊重と日本軍の駐留を認めさせた。","日本は満洲国を承認する代わりに、満洲国内に日本軍を置かないことを約束した。","日本は国際連盟のリットン報告書に従って、満洲国を中国の主権下にある自治国と認めた。","日本は満洲国を承認し、日本が満洲に持つ権益をすべて満洲国に返還した。"],"e":"1932年9月、斎藤実内閣は日満議定書を取り交わして満洲国を承認しました。この議定書で満洲国は日本の既得権益を尊重し、日本軍の駐留を認めました。五・一五事件後に成立した斎藤内閣のときのことで、血盟団事件は同年に犬養内閣のもとで起きています。リットン報告書は満洲国を認めない内容でした。","m":"日満議定書（1932）＝斎藤内閣、日本軍の駐留と権益を承認"},{"id":153,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問41","f":"近代","t":"国策の基準","y":1936,"q":"1936年に日独防共協定を結んだ広田弘毅内閣が決めた、国防方針「国策の基準」の内容として、正しいものはどれですか。","c":["北進（ソ連）と南進（南方）の両方を、国策として並べて掲げた。","軍部大臣現役武官制を廃止して、政党内閣の復活をはかった。","国体明徴声明を出して、天皇機関説を政府として否定した。","軍と財界を一体にする軍財抱合の方針を、国策として打ち出した。"],"e":"広田弘毅内閣は二・二六事件の後に成立し、1936年に「国策の基準」で、北方のソ連に備えつつ南方へも進出する、北進と南進の併記を決めました。また軍部大臣現役武官制を復活させ、同年に日独防共協定も結びました。国体明徴声明は岡田啓介内閣が1935年に出したもので、軍財抱合は広田内閣の方針ではありません。","m":"広田内閣（1936）＝国策の基準（北進と南進）・日独防共協定"},{"id":154,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅳ 問32","f":"近代","t":"台湾出兵","y":1874,"q":"1874年の台湾出兵について、正しい説明はどれですか。","c":["士族の不満をそらす意図があり、清が事実上の賠償金を支払い、日本は撤兵した。","出兵の可否をめぐって政府が二つに分裂し、板垣退助らが政府を去った。","アメリカのグラント前大統領の調停で、日本は清に賠償金を支払って撤兵した。","出兵は琉球の帰属を清から日本に移すために、清の了承を得て実施された。"],"e":"1871年の琉球漂流民殺害事件を口実に、政府は1874年に台湾へ出兵しました。士族の不満をそらす狙いもあったとされます。イギリス公使ウェードの調停で、清が日本に事実上の賠償金を支払い、日本は撤兵しました。台湾出兵に反対して政府を去ったのは木戸孝允で、板垣退助らが政府を去ったのは征韓論に敗れた1873年です。また、グラントは1879年の琉球の帰属問題で調停を試みた人物です。","m":"台湾出兵（1874）＝士族の不満をそらす、清が賠償金"},{"id":155,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅳ 問34","f":"近代","t":"沖縄県設置と旧慣温存","y":1879,"q":"1879年の沖縄県設置後の沖縄について、正しい説明はどれですか。","c":["土地・租税の制度に旧来のものが残され、のちに謝花昇が参政権を求めて運動した。","琉球藩の廃止と同時に、本土と同じ地租改正や徴兵令がただちに沖縄でも実施された。","琉球国王の尚泰が初代の沖縄県知事に任命され、王府の役人とともに県政を主導した。","沖縄県には、本土と同じ府県制や衆議院議員選挙が、県の設置と同時に実施された。"],"e":"沖縄県の設置（琉球処分、1879年）後も、土地・租税・地方制度は旧来のものを残す旧慣温存策がとられ、本土並みの制度は遅れて導入されました。沖縄出身の謝花昇は県政改革や参政権を求めて運動しました。尚泰は華族となって東京に住み、初代県令は鍋島直彬でした。府県制の実施は1909年、最初の衆議院議員選挙は1912年です。","m":"沖縄県設置（1879）後は旧慣温存、謝花昇が参政権運動"},{"id":156,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅳ 問36","f":"近代","t":"太平洋戦争中の出来事の順序","y":1943,"q":"次のａ～ｃを古いものから順に並べたものとして、正しいものはどれですか。\nａ．サイパン島の陥落\nｂ．ミッドウェー海戦\nｃ．大東亜会議の開催","c":["ｂ→ｃ→ａ","ｂ→ａ→ｃ","ｃ→ｂ→ａ","ａ→ｂ→ｃ"],"e":"ミッドウェー海戦は1942年6月で、日本海軍が大敗し戦局の転機となりました。大東亜会議は1943年11月に東条英機内閣が東京で開いた会議、サイパン島の陥落は1944年7月で、これが東条内閣総辞職の原因になりました。順序はミッドウェー海戦→大東亜会議→サイパン島陥落です。","m":"ミッドウェー（1942）→大東亜会議（1943）→サイパン陥落（1944）"},{"id":157,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅳ 問43","f":"近代","t":"岩倉使節団","y":1871,"q":"1871年に欧米へ派遣された岩倉使節団に参加した人物として、正しいものはどれですか。","c":["伊藤博文","福沢諭吉","大隈重信","西郷従道"],"e":"岩倉使節団は、右大臣岩倉具視を大使に、木戸孝允・大久保利通・伊藤博文・山口尚芳らを副使として1871年に出発し、条約改正の予備交渉と欧米の制度の視察をおこないました。津田梅子らの女子留学生も同行しました。福沢諭吉は民間の啓蒙家、大隈重信と西郷従道は国内で活動しており、使節団には加わっていません。","m":"岩倉使節団＝岩倉が大使、木戸・大久保・伊藤・山口が副使"},{"id":158,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅳ 問44","f":"近代","t":"在華紡と紡績業","y":1917,"q":"日本の紡績業について、正しい説明はどれですか。","c":["第一次世界大戦のころから、日本の紡績会社が中国に工場を建てて進出した。","日本の綿糸の生産量が輸入量を上回ったのは、1897年のことである。","紡績業は蚕の繭から生糸をつくる産業で、製糸業とも呼ばれる。","紡績業の生産は主に男性の熟練工が担い、女性労働者はほとんどいなかった。"],"e":"日本の紡績会社は、第一次世界大戦のころから、安い労働力と市場を求めて上海・青島などの中国に工場を建てて進出しました（在華紡）。綿糸の生産量が輸入量を上回ったのは1890年ごろで、1897年は輸出量が輸入量を上回った年です。繭から生糸をつくるのは製糸業で、綿花から糸をつくる紡績業とは別です。紡績業では多くの女性労働者（女工）が働きました。","m":"在華紡＝第一次大戦期から中国に進出した日本の紡績会社"},{"id":159,"k":"past","ref":"2026年度 商学部A個別第2期 Ⅱ 問16","f":"近代","t":"官営事業の払い下げ","y":1884,"q":"明治政府が1880年代に民間へ払い下げた官営事業と払い下げ先の組み合わせとして、正しいものはどれですか。","c":["院内銀山―古河市兵衛、兵庫造船所―川崎正蔵、深川セメント製造所―浅野総一郎","院内銀山―浅野総一郎、兵庫造船所―古河市兵衛、深川セメント製造所―川崎正蔵","院内銀山―川崎正蔵、兵庫造船所―浅野総一郎、深川セメント製造所―古河市兵衛","院内銀山―古河市兵衛、兵庫造船所―浅野総一郎、深川セメント製造所―川崎正蔵"],"e":"松方財政のもとで、政府は財政の整理を進めるため、1880年代に官営事業を民間に払い下げました。院内銀山は古河市兵衛、兵庫造船所は川崎正蔵（のちの川崎造船所）、深川セメント製造所は浅野総一郎に払い下げられました。このほか長崎造船所は三菱、富岡製糸場は三井に払い下げられ、のちの財閥の基礎が築かれました。","m":"院内→古河、兵庫造船所→川崎、深川セメント→浅野"},{"id":160,"k":"past","ref":"2026年度 商学部A個別第2期 Ⅱ 問18","f":"近代","t":"大津事件","y":1891,"q":"1891年の大津事件で、犯人の巡査を死刑にせよという政府の圧力に屈せず、刑法の通常の規定で裁かせて司法権の独立を守った大審院長は誰ですか。","c":["児島惟謙","陸奥宗光","山田顕義","井上毅"],"e":"大津事件は、来日中のロシア皇太子ニコライを巡査の津田三蔵が切りつけた事件です。政府はロシアとの関係悪化を恐れて大逆罪の適用による死刑を求めましたが、大審院長の児島惟謙は通常の謀殺未遂罪を適用して無期徒刑とし、司法権の独立を守りました。陸奥宗光は外相、山田顕義は司法大臣、井上毅は憲法起草に関わった官僚です。","m":"大津事件（1891）＝児島惟謙が司法権の独立を守る"},{"id":161,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅳ 問40","f":"近代","t":"志賀潔と赤痢菌","y":1897,"q":"北里柴三郎のもとで学び、1897年に赤痢菌を発見した細菌学者は誰ですか。","c":["志賀潔","野口英世","高峰譲吉","鈴木梅太郎"],"e":"志賀潔は北里柴三郎の伝染病研究所で学び、1897年に赤痢菌を発見しました。野口英世は梅毒や黄熱病の研究、高峰譲吉はタカジアスターゼの発明とアドレナリンの抽出、鈴木梅太郎はビタミンB1（オリザニン）の抽出で知られます。いずれも明治・大正期に活躍した日本人科学者です。","m":"志賀潔＝赤痢菌（1897）、北里柴三郎の弟子"},{"id":162,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問43","f":"現代","t":"金融緊急措置令","y":1946,"q":"戦後の激しいインフレを抑えるため、1946年に出された金融緊急措置令の内容として、正しいものはどれですか。","c":["預金を封鎖し、旧円を新円に切り替えて、引き出せる額を制限した。","全商品の公定価格を新しく定め、闇取引を厳しく取り締まった。","予算を均衡させ、1ドル＝360円の単一為替レートを設定した。","石炭と鉄鋼に資材と資金を重点的に集中させる方針を決めた。"],"e":"金融緊急措置令（1946年2月）は、幣原喜重郎内閣が出したインフレ対策で、預金を封鎖し、旧円から新円への切り替えをおこなって、引き出せる額を制限しました。しかしインフレはすぐには収まらず、1949年のドッジ＝ラインでようやく鎮静化に向かいました。傾斜生産方式は第1次吉田茂内閣が炭鉱・鉄鋼の復興をはかった政策です。","m":"金融緊急措置令（1946）＝預金封鎖・新円切

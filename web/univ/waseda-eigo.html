も語らない」と、楽観的な話が見落としている点を指摘しているので、「十分な注意を払っていない」が最も近い意味です。「詳しく説明する」「強調する」は逆の意味です。「公然と否定する」も、触れずに済ませるという意味とは異なります。","m":"gloss over＝ごまかす・さっと済ませる"},{"id":21,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：On the other hand","p":"Every wave of technological change has been accompanied by fears that machines will leave large numbers of people without work. In the early nineteenth century, textile workers in England smashed the machines they believed were destroying their livelihoods. Similar fears returned with the computer. Today, advances in artificial intelligence have ( A ) the debate once more.\nLooking back, economists generally conclude that the most dramatic predictions did not come true. Although particular jobs vanished, new ones emerged. Rising productivity lowered prices, which left consumers with more money to spend on other goods and services, and that spending in turn created demand for workers elsewhere.\nThis reassuring story, however, [glosses over] an important point. The fact that employment recovered in the long run says little about the people who lost their jobs in the short run. A weaver in his fifties could not easily become a railway engineer, and many displaced workers never regained their former income. The gains from technology were real, but they were unevenly shared, across groups and generations.\nSome researchers argue that the present wave may differ from earlier ones in a crucial respect. Earlier machines mainly replaced physical labor or routine calculation, leaving tasks that required judgment, language and social skill to human beings. Newer systems are beginning to perform some of these tasks as well. If so, the range of work in which humans keep a clear advantage may shrink faster than before. ( B ), others caution that such predictions have been made before, and that the capacity of economies to invent new kinds of work has often been underestimated. Both sides agree that the pace of adjustment, and who bears its costs, will depend heavily on public policy.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["On the other hand","As a result","For this reason","In other words"],"e":"空所の前では「今回の波は判断や言語の仕事まで代替し始めており、人間の優位な領域が以前より速く縮むかもしれない」という一部の研究者の主張、後では「他の人々は、そうした予測は以前にもなされ、新しい仕事を生む経済の力は過小評価されてきたと警告する」という反対の立場が述べられています。対立する見解を並べる On the other hand が正解です。As a result と For this reason は因果関係、In other words は言い換えを表すので不適当です。","m":"some argue ～ / others caution ～＝対比"},{"id":22,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：credible","p":"Democratic politics is usually imagined as a contest. Parties compete for votes and seats, interest groups lobby for advantage, and elections decide which side wins. Critics have long complained that this model rewards slogans more than reasoning, and that voters are rarely asked to consider the arguments of those they disagree with. In response, a number of countries and cities have experimented with an alternative: the citizens' assembly.\nA citizens' assembly brings together a group of ordinary people, chosen at random but balanced to reflect the population by age, gender, region and other traits. Over several weekends, members hear from experts and advocates on a disputed issue, discuss the evidence in small groups, and finally make recommendations. Because members are not seeking reelection, they are free to change their minds, and observers often report that they do.\nSupporters claim that such bodies can break deadlocks that elected politicians are unable or unwilling to resolve. When a proposal comes from people much like themselves who have studied the question carefully, voters may find it more ( A ) than one produced by professional politicians. Several assemblies have tackled divisive social issues and produced proposals that voters later approved.\nSkeptics raise practical and principled objections. Randomly selected members, they note, have no mandate from the electorate and cannot be held [accountable] at the next election. The results also depend heavily on how the agenda is framed and which experts are invited, which gives considerable influence to the organizers. For these reasons, most proposals treat assemblies not as a ( B ) for elected legislatures but as a supplement to them, offering advice that politicians or voters remain free to accept or reject.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["credible","obscure","partisan","trivial"],"e":"空所を含む文は「自分たちとよく似た人々が問題を注意深く検討して出した提案は、職業政治家の提案より〜だと有権者は感じるかもしれない」という意味です。この段落は市民議会の支持者の主張を述べており、次の文で「その提案が後に有権者に承認された」と続くので、「信頼できる」の credible が正解です。obscure（不明瞭な）、partisan（党派的な）、trivial（ささいな）は、いずれも支持者の主張として肯定的な流れに合いません。","m":"credible＝信頼できる（credit と同語源）"},{"id":23,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：accountable","p":"Democratic politics is usually imagined as a contest. Parties compete for votes and seats, interest groups lobby for advantage, and elections decide which side wins. Critics have long complained that this model rewards slogans more than reasoning, and that voters are rarely asked to consider the arguments of those they disagree with. In response, a number of countries and cities have experimented with an alternative: the citizens' assembly.\nA citizens' assembly brings together a group of ordinary people, chosen at random but balanced to reflect the population by age, gender, region and other traits. Over several weekends, members hear from experts and advocates on a disputed issue, discuss the evidence in small groups, and finally make recommendations. Because members are not seeking reelection, they are free to change their minds, and observers often report that they do.\nSupporters claim that such bodies can break deadlocks that elected politicians are unable or unwilling to resolve. When a proposal comes from people much like themselves who have studied the question carefully, voters may find it more ( A ) than one produced by professional politicians. Several assemblies have tackled divisive social issues and produced proposals that voters later approved.\nSkeptics raise practical and principled objections. Randomly selected members, they note, have no mandate from the electorate and cannot be held [accountable] at the next election. The results also depend heavily on how the agenda is framed and which experts are invited, which gives considerable influence to the organizers. For these reasons, most proposals treat assemblies not as a ( B ) for elected legislatures but as a supplement to them, offering advice that politicians or voters remain free to accept or reject.","q":"次の英文を読み、下線部［accountable］の意味として最も適当なものを選びなさい。","c":["responsible to voters for their decisions","able to count votes accurately","eligible to stand as candidates","well informed about the issues"],"e":"be held accountable は「（行動・決定について）責任を問われる」の意味です。くじで選ばれた議員は有権者から委任を受けておらず、次の選挙で落選させることで責任を問うこともできない、という懐疑派の指摘です。正解は「自分の決定について有権者に責任を負う」です。count（数える）からの連想で「票を正確に数えられる」を選ばないよう注意が必要です。「立候補資格がある」「問題に詳しい」も語の意味とは違います。","m":"hold A accountable＝Aに責任を問う"},{"id":24,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：substitute for","p":"Democratic politics is usually imagined as a contest. Parties compete for votes and seats, interest groups lobby for advantage, and elections decide which side wins. Critics have long complained that this model rewards slogans more than reasoning, and that voters are rarely asked to consider the arguments of those they disagree with. In response, a number of countries and cities have experimented with an alternative: the citizens' assembly.\nA citizens' assembly brings together a group of ordinary people, chosen at random but balanced to reflect the population by age, gender, region and other traits. Over several weekends, members hear from experts and advocates on a disputed issue, discuss the evidence in small groups, and finally make recommendations. Because members are not seeking reelection, they are free to change their minds, and observers often report that they do.\nSupporters claim that such bodies can break deadlocks that elected politicians are unable or unwilling to resolve. When a proposal comes from people much like themselves who have studied the question carefully, voters may find it more ( A ) than one produced by professional politicians. Several assemblies have tackled divisive social issues and produced proposals that voters later approved.\nSkeptics raise practical and principled objections. Randomly selected members, they note, have no mandate from the electorate and cannot be held [accountable] at the next election. The results also depend heavily on how the agenda is framed and which experts are invited, which gives considerable influence to the organizers. For these reasons, most proposals treat assemblies not as a ( B ) for elected legislatures but as a supplement to them, offering advice that politicians or voters remain free to accept or reject.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["substitute","tribute","sequel","motive"],"e":"空所の後で「議会の補完物として（as a supplement to them）」と対比されているので、not as a substitute for A but as a supplement to A（Aの代わりではなく補完として）とするのが自然です。市民議会は議会に取って代わるのではなく、政治家や有権者が採否を決められる助言を与える、という最後の部分とも合います。tribute（賛辞）、sequel（続編）、motive（動機）はいずれも for と組み合わせても文意が通りません。","m":"substitute for A＝Aの代わり／supplement to A＝Aの補足"},{"id":25,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：withstand","p":"When antibiotics came into wide use in the 1940s, they transformed medicine. Infections that had routinely killed patients became easy to treat, and operations that had been too dangerous to attempt became common. Yet even some of the scientists who developed these drugs warned that bacteria might learn to ( A ) them, and that warning has proved accurate.\nResistance arises through natural selection. In any large population of bacteria, a few individuals may carry genetic changes that allow them to survive a particular drug. When the drug is applied, the others die, while the resistant ones survive and multiply until they dominate the population. Bacteria can also pass resistance genes to one another, even across species, which lets resistance spread far faster than it would through inheritance alone.\nHuman behavior has sped up this process. Antibiotics are often prescribed for illnesses caused by viruses, such as the common cold, against which they are useless. In many countries, large quantities of antibiotics are given to farm animals, not to cure disease but to promote growth, creating ideal conditions for resistant strains to emerge.\nThe problem is made worse by economics. Developing a new antibiotic is expensive, and because doctors are rightly urged to save new drugs for cases in which older ones fail, sales of a successful new antibiotic are likely to be modest. Drug companies therefore have little [incentive] to invest in the field, and few new classes of antibiotics have reached the market in recent decades. Some experts have proposed that governments pay companies a fixed reward for developing useful antibiotics, ( B ) of how many doses are eventually sold, so that the goal of protecting new drugs no longer conflicts with the goal of making a profit.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["withstand","produce","detect","imitate"],"e":"科学者たちが警告したのは、細菌がやがて抗生物質に「耐える」ようになるかもしれないということで、それが正しかったとわかったと述べています。第2段落の「耐性は自然選択によって生じる」という説明にもつながるので、withstand（耐える・持ちこたえる）が正解です。細菌が抗生物質を produce（作る）、detect（検出する）、imitate（まねる）では、耐性の話につながりません。","m":"withstand＝resist＝耐える"},{"id":26,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：incentive","p":"When antibiotics came into wide use in the 1940s, they transformed medicine. Infections that had routinely killed patients became easy to treat, and operations that had been too dangerous to attempt became common. Yet even some of the scientists who developed these drugs warned that bacteria might learn to ( A ) them, and that warning has proved accurate.\nResistance arises through natural selection. In any large population of bacteria, a few individuals may carry genetic changes that allow them to survive a particular drug. When the drug is applied, the others die, while the resistant ones survive and multiply until they dominate the population. Bacteria can also pass resistance genes to one another, even across species, which lets resistance spread far faster than it would through inheritance alone.\nHuman behavior has sped up this process. Antibiotics are often prescribed for illnesses caused by viruses, such as the common cold, against which they are useless. In many countries, large quantities of antibiotics are given to farm animals, not to cure disease but to promote growth, creating ideal conditions for resistant strains to emerge.\nThe problem is made worse by economics. Developing a new antibiotic is expensive, and because doctors are rightly urged to save new drugs for cases in which older ones fail, sales of a successful new antibiotic are likely to be modest. Drug companies therefore have little [incentive] to invest in the field, and few new classes of antibiotics have reached the market in recent decades. Some experts have proposed that governments pay companies a fixed reward for developing useful antibiotics, ( B ) of how many doses are eventually sold, so that the goal of protecting new drugs no longer conflicts with the goal of making a profit.","q":"次の英文を読み、下線部［incentive］に最も意味が近いものを選びなさい。","c":["motive","permission","capacity","obligation"],"e":"incentive は「（行動を促す）動機・誘因」です。新しい抗生物質は開発費が高いのに、医師が切り札として温存するので売上は控えめになる。だから製薬会社にはこの分野に投資する動機がほとんどない、という流れです。motive が最も近い意味です。permission（許可）、capacity（能力）、obligation（義務）は、利益が見込めないので投資しない、という経済的な理由づけと合いません。","m":"incentive＝motive（やる気を起こさせるもの）"},{"id":27,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：regardless of","p":"When antibiotics came into wide use in the 1940s, they transformed medicine. Infections that had routinely killed patients became easy to treat, and operations that had been too dangerous to attempt became common. Yet even some of the scientists who developed these drugs warned that bacteria might learn to ( A ) them, and that warning has proved accurate.\nResistance arises through natural selection. In any large population of bacteria, a few individuals may carry genetic changes that allow them to survive a particular drug. When the drug is applied, the others die, while the resistant ones survive and multiply until they dominate the population. Bacteria can also pass resistance genes to one another, even across species, which lets resistance spread far faster than it would through inheritance alone.\nHuman behavior has sped up this process. Antibiotics are often prescribed for illnesses caused by viruses, such as the common cold, against which they are useless. In many countries, large quantities of antibiotics are given to farm animals, not to cure disease but to promote growth, creating ideal conditions for resistant strains to emerge.\nThe problem is made worse by economics. Developing a new antibiotic is expensive, and because doctors are rightly urged to save new drugs for cases in which older ones fail, sales of a successful new antibiotic are likely to be modest. Drug companies therefore have little [incentive] to invest in the field, and few new classes of antibiotics have reached the market in recent decades. Some experts have proposed that governments pay companies a fixed reward for developing useful antibiotics, ( B ) of how many doses are eventually sold, so that the goal of protecting new drugs no longer conflicts with the goal of making a profit.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["regardless","because","instead","ahead"],"e":"提案の趣旨は、最終的な販売量と関係なく一定の報酬を払えば、新薬を温存するという目標と利益を上げるという目標が対立しなくなる、というものです。「〜に関係なく」の regardless of が正解です。because of を入れると「販売量のために」となり、販売量と報酬を切り離すという趣旨と逆になります。instead of、ahead of は文意が通りません。","m":"regardless of＝irrespective of＝～に関係なく"},{"id":28,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：opaque","p":"It is natural to assume that native speakers of English hold an advantage in international communication. They can express subtle ideas without searching for words. Yet researchers who study conversations among speakers from many countries have reported a surprising pattern: native speakers are sometimes the hardest participants to understand.\nThe reason lies partly in habits that native speakers rarely notice. They tend to speak quickly, to use idioms drawn from local culture, and to make jokes whose meaning depends on shared background. Non-native speakers, by contrast, often develop a simpler, more explicit style when talking with one another. They check whether they have been understood, rephrase difficult points, and avoid expressions that might be [opaque] to listeners from other regions. As a result, a meeting among people who all learned English as a second language may run more smoothly than one that includes a single native speaker.\nThis finding challenges the view that the goal of language learning is to sound as much like a native speaker as possible. If English is used mainly as a common tool among people with different first languages, then the measure of success may be ( A ) rather than accuracy in imitating any one national variety. A learner who speaks with a clear accent but adapts readily to different listeners may communicate better than one who has mastered every local idiom.\nNone of this means that standards no longer matter. Grammar that departs too far from shared norms can still cause misunderstanding, and learners preparing for certain careers may need a specific variety. ( B ), the research suggests that native speakers themselves may need to learn something: how to adjust their language for listeners who do not share their assumptions.","q":"次の英文を読み、下線部［opaque］の意味として最も適当なものを選びなさい。","c":["difficult to understand","likely to offend","very familiar","too formal"],"e":"opaque はもともと「不透明な」ですが、ここでは表現について「意味がわかりにくい」の意味です。非母語話者どうしは、理解されたかを確かめ、難しい点を言い換え、他の地域の聞き手には〜かもしれない表現を避ける、という流れで、前の段落の「母語話者は地域文化の慣用句を使う」とも対応しています。「不快にさせる」「なじみがある」「堅すぎる」では、理解しやすさを論じる段落に合いません。","m":"opaque⇔transparent（わかりやすい）"},{"id":29,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：intelligibility","p":"It is natural to assume that native speakers of English hold an advantage in international communication. They can express subtle ideas without searching for words. Yet researchers who study conversations among speakers from many countries have reported a surprising pattern: native speakers are sometimes the hardest participants to understand.\nThe reason lies partly in habits that native speakers rarely notice. They tend to speak quickly, to use idioms drawn from local culture, and to make jokes whose meaning depends on shared background. Non-native speakers, by contrast, often develop a simpler, more explicit style when talking with one another. They check whether they have been understood, rephrase difficult points, and avoid expressions that might be [opaque] to listeners from other regions. As a result, a meeting among people who all learned English as a second language may run more smoothly than one that includes a single native speaker.\nThis finding challenges the view that the goal of language learning is to sound as much like a native speaker as possible. If English is used mainly as a common tool among people with different first languages, then the measure of success may be ( A ) rather than accuracy in imitating any one national variety. A learner who speaks with a clear accent but adapts readily to different listeners may communicate better than one who has mastered every local idiom.\nNone of this means that standards no longer matter. Grammar that departs too far from shared norms can still cause misunderstanding, and learners preparing for certain careers may need a specific variety. ( B ), the research suggests that native speakers themselves may need to learn something: how to adjust their language for listeners who do not share their assumptions.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["intelligibility","authenticity","uniformity","speed"],"e":"英語が母語の異なる人々の共通の道具として使われるなら、成功の尺度は特定の国の英語をまねる正確さではなく「わかってもらえること」かもしれない、という主張です。直後の「なまりがあっても聞き手に合わせられる学習者のほうがよく伝わる」もこれを支えるので、intelligibility（理解されやすさ）が正解です。authenticity（本物らしさ）は母語話者らしさを目指す従来の見方に近く、文脈と逆です。uniformity（画一性）や speed（速さ）も本文の論点と合いません。","m":"intelligible＝理解できる（intelligent と区別）"},{"id":30,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：At the same time","p":"It is natural to assume that native speakers of English hold an advantage in international communication. They can express subtle ideas without searching for words. Yet researchers who study conversations among speakers from many countries have reported a surprising pattern: native speakers are sometimes the hardest participants to understand.\nThe reason lies partly in habits that native speakers rarely notice. They tend to speak quickly, to use idioms drawn from local culture, and to make jokes whose meaning depends on shared background. Non-native speakers, by contrast, often develop a simpler, more explicit style when talking with one another. They check whether they have been understood, rephrase difficult points, and avoid expressions that might be [opaque] to listeners from other regions. As a result, a meeting among people who all learned English as a second language may run more smoothly than one that includes a single native speaker.\nThis finding challenges the view that the goal of language learning is to sound as much like a native speaker as possible. If English is used mainly as a common tool among people with different first languages, then the measure of success may be ( A ) rather than accuracy in imitating any one national variety. A learner who speaks with a clear accent but adapts readily to different listeners may communicate better than one who has mastered every local idiom.\nNone of this means that standards no longer matter. Grammar that departs too far from shared norms can still cause misunderstanding, and learners preparing for certain careers may need a specific variety. ( B ), the research suggests that native speakers themselves may need to learn something: how to adjust their language for listeners who do not share their assumptions.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["At the same time","In short","For example","As a result"],"e":"空所の前では「基準が不要になったわけではない（文法の逸脱は誤解を生み、特定の英語が必要な人もいる）」と学習者側への留保を述べ、後では「母語話者自身も学ぶべきことがある」と別の観点を加えています。「その一方で・同時に」と別の面を示す At the same time が正解です。In short（要するに）はまとめ、For example は具体例、As a result は結果を導く表現で、どれも前後の関係に合いません。","m":"At the same time＝その一方で（譲歩・別の観点）"},{"id":31,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：Hardly ... when","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nHardly [had] the committee [announced] its decision [than] protests [broke out] across the country.","c":["than","had","announced","broke out"],"e":"「〜するとすぐに…した」は Hardly [Scarcely] had S p.p. when [before] S' V（過去形）で表します。than と組むのは No sooner had S p.p. than ... のほうなので、than を when か before に直す必要があります。Hardly が文頭に来ると倒置が起こるので had the committee announced は正しく、主節が過去完了、後半が過去形 broke out という時制の組み合わせも正しい形です。","m":"Hardly … when／No sooner … than"},{"id":32,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：受動態 be influenced","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nNot until the late twentieth century [did] most economists [begin] to take seriously the idea that [people's] choices [are often influencing] by emotion.","c":["are often influencing","did","begin","people's"],"e":"choices（選択）は感情に「影響される」側なので、受動態の are often influenced by emotion とすべきです。by emotion という行為者を示す句も受動態であることを示しています。Not until ～ が文頭に出ると主節は疑問文の語順に倒置されるので、did most economists begin は正しい形です。people's choices の所有格も正しい表現です。","m":"Not until ～ did S V＝～になって初めて"},{"id":33,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：despite の用法","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\n[Despite of] the heavy rain, the opening ceremony [was held] [as scheduled] [in] the open air.","c":["Despite of","was held","as scheduled","in"],"e":"despite は前置詞なので、後ろに直接名詞を置き、of は付けません。「〜にもかかわらず」は despite the heavy rain か in spite of the heavy rain とします。in spite of と混同して despite of とする誤りが狙われやすいポイントです。was held（開催された）、as scheduled（予定どおり）、in the open air（屋外で）はいずれも正しい表現です。","m":"despite＝in spite of（despite of は不可）"},{"id":34,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：a number of の一致","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nA number of [critical] questions [remains] unanswered, [despite] the [considerable] effort the researchers have made.","c":["remains","critical","despite","considerable"],"e":"A number of ～ は「いくつかの〜・多くの〜」の意味で、主語の中心は questions（複数）なので、動詞は remain とすべきです。The number of ～（〜の数）なら number が主語なので単数で受けますが、ここは a number of です。despite は前置詞として名詞 the effort を直接とっており正しく、critical や considerable も形容詞として正しく名詞を修飾しています。","m":"a number of＋複数動詞／the number of＋単数動詞"},{"id":35,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：懸垂分詞","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nHaving been raised [in] a bilingual household, [it was] easy for her [to switch] between the two languages [without] hesitation.","c":["it was","in","to switch","without"],"e":"分詞構文の意味上の主語は、原則として主節の主語と一致しなければなりません。「バイリンガルの家庭で育てられた」のは彼女なので、主節の主語を she にして she found it easy to switch ～ とする必要があります。it was のままでは it が育てられたことになってしまいます（懸垂分詞）。raised in a household（家庭で育つ）の in、easy for her to switch の不定詞、without hesitation（ためらわずに）はいずれも正しい表現です。","m":"分詞構文の主語＝主節の主語"},{"id":36,"k":"plan","ref":"想定問題","f":"文法・語法","t":"仮定法：Without ～","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\n( ) the support of his colleagues, the project would have failed long before its completion.","c":["Without","With","Unless","Except"],"e":"主節が would have failed（仮定法過去完了）なので、「もし〜がなかったら」という条件を表す Without が入ります（But for や If it had not been for と同じ意味）。With では「支援があったら失敗しただろう」となり意味が逆になります。Unless は接続詞なので、後ろに名詞だけでなく節が必要です。Except は「〜を除いて」で、条件の意味になりません。","m":"Without A＝But for A＝If it had not been for A"},{"id":37,"k":"plan","ref":"想定問題","f":"文法・語法","t":"仮定法現在：demand that","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe opposition party demanded that the full report ( ) published before the vote.","c":["be","being","to be","has been"],"e":"demand, insist, require, suggest など要求・提案を表す動詞の後の that 節では、動詞の原形（仮定法現在）か should＋原形を使います。主語が the full report で「公表される」という受動の意味なので be published が正解です。that 節には主語に対応する述語動詞が必要なので、分詞の being や不定詞の to be は入りません。has been は直説法の現在完了で、過去の要求の内容を表す that 節には使いません。","m":"要求・提案の that 節＝(should)＋原形"},{"id":38,"k":"plan","ref":"想定問題","f":"文法・語法","t":"so ～ that 構文","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe village is ( ) that it does not appear on most maps of the region.","c":["so small","such small","too small","very small"],"e":"「とても小さいので〜」は so＋形容詞＋that 節で表します。such は名詞を含む句と組むので、such a small village that ～ なら可能ですが、such small だけでは不可です。too ～ は that 節ではなく to 不定詞と組み（too small to appear ～）、very small that という形もありません。","m":"so＋形容詞＋that／such (a)＋形容詞＋名詞＋that"},{"id":39,"k":"plan","ref":"想定問題","f":"文法・語法","t":"仮定法：倒置 Had S p.p.","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nHad the government acted sooner, the economic crisis ( ) avoided.","c":["could have been","could be","can have been","had been"],"e":"文頭の Had the government acted は If the government had acted の if を省略した倒置で、過去の事実に反する仮定（仮定法過去完了）です。主節は助動詞の過去形＋have p.p. になるので could have been avoided が正解です。could be は現在の推量になり、時制が合いません。can have been は「〜したはずがある」という推量で、仮定法の主節には使いません。had been を入れると主節の形として成り立ちません。","m":"Had S p.p., S would/could have p.p."},{"id":40,"k":"plan","ref":"想定問題","f":"文法・語法","t":"前置詞＋関係代名詞","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe theory, ( ) he devoted the last decade of his life, was finally accepted by the scientific community.","c":["to which","which","in that","for what"],"e":"devote A to B（AをBにささげる）の B が先行詞 the theory にあたるので、前置詞 to を関係代名詞の前に置いた to which が正解です。which だけでは to が不足します。that は前置詞の直後に置けず、カンマの後の非制限用法にも使えません。what は先行詞を含む関係代名詞なので、the theory という先行詞があるこの文には使えません。","m":"devote A to B → to which"},{"id":41,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"ambiguous（あいまいな）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe minister's remarks were deliberately ( ), allowing supporters and critics alike to read into them whatever they wished.","c":["ambiguous","explicit","candid","concise"],"e":"支持者も批判者も「好きな意味を読み取れる」ようにした、という後半から、発言はわざと「あいまいな」ものだったとわかります。ambiguous が正解です。explicit（明確な）や candid（率直な）だと、解釈の余地がなくなるので後半と矛盾します。concise（簡潔な）は短さを表す語で、多様に解釈できることの説明にはなりません。","m":"ambiguous＝2通り以上に解釈できる"},{"id":42,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"cast doubt on","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe newly discovered documents ( ) doubt on the long-accepted account of the treaty's origins.","c":["cast","made","took","gave"],"e":"cast doubt on A で「Aに疑いを投げかける」というコロケーション（決まった語の組み合わせ）です。cast は過去形も cast なので、ここでは過去の意味で使われています。made、took、gave は doubt on とは結びつきません。ほかにも throw doubt on、raise doubts about などの言い方があります。","m":"cast doubt on＝～に疑問を投げかける"},{"id":43,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"hold water","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nHer argument sounds attractive, but it does not [hold water] once you examine the statistics.","c":["remain logically convincing","move people emotionally","attract public attention","follow the usual format"],"e":"hold water は「（理論・議論が）筋が通る・正しいと認められる」という意味のイディオムで、主に否定文で使います。統計を調べると議論が成り立たない、という文意なので「論理的に説得力を保つ」が正解です。水を入れても漏れない器のように、穴のない議論というイメージです。感情に訴える、注目を集める、形式に従う、はいずれも意味が違います。","m":"not hold water＝穴があって成り立たない"},{"id":44,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"attribute A to B","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nAnalysts ( ) the sharp rise in food prices to the poor harvest of the previous year.","c":["attributed","contributed","distributed","accounted"],"e":"attribute A to B で「AをBのせいにする・Aの原因をBに帰する」です。価格の高騰の原因を不作に帰した、という意味になります。contribute A to B は「AをBに寄付・貢献する」、distribute A to B は「AをBに配る」で文意に合いません。account は account for A（Aを説明する）の形で使い、account A to B という形はありません。","m":"attribute A to B＝AをBのせいにする"},{"id":45,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"in the absence of","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nIn the ( ) of reliable evidence, the court had no choice but to dismiss the case.","c":["absence","vacancy","emptiness","omission"],"e":"in the absence of A で「Aがないので・Aがない場合に」という決まった表現です。信頼できる証拠がないので裁判所は訴えを退けるしかなかった、という意味になります。vacancy（空席・空室）、emptiness（空っぽであること）、omission（省略・脱落）はいずれも「〜がない」に通じる語ですが、in the ～ of の形で「〜がないので」という意味にはなりません。lack を使うなら for lack of A という形になります。","m":"in the absence of＝～がないので"},{"id":46,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"shelve（棚上げする）","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nFacing strong opposition, the committee decided to [shelve] the redevelopment plan for the time being.","c":["postpone consideration of","put into practice","reject permanently","announce publicly"],"e":"shelve は「棚に置く」から転じて「（計画などを）棚上げする・先送りする」の意味です。for the time being（当分の間）という語句とも合い、「検討を延期する」が正解です。put into practice（実行する）は逆の意味です。reject permanently（永久に却下する）は、一時的な保留という shelve の意味とずれます。announce publicly（公表する）も違います。","m":"shelve＝put off＝棚上げ"},{"id":47,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"indispensable（不可欠な）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nHer contribution to the project was ( ); without it, nothing of value would have been achieved.","c":["indispensable","negligible","superficial","redundant"],"e":"後半の「それがなければ価値あることは何も達成されなかっただろう」から、貢献は「不可欠な」ものだったとわかります。indispensable が正解です。negligible（無視できるほど小さい）、superficial（表面的な）、redundant（余分な）はいずれも貢献を低く評価する語で、後半と矛盾します。","m":"indispensable＝essential＝なくてはならない"},{"id":48,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"undermine（むしばむ）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe series of scandals seriously ( ) public trust in the government.","c":["undermined","underwent","understated","undertook"],"e":"undermine は「（信頼・権威などを）徐々に損なう・むしばむ」で、trust を目的語にとるのに最も適しています。一連のスキャンダルが政府への信頼を大きく損なった、という意味です。underwent（undergo：経験する・受ける）、understated（understate：控えめに言う）、undertook（undertake：引き受ける）は、いずれも under- で始まる紛らわしい語ですが、文意に合いません。","m":"undermine＝徐々に弱める"},{"id":49,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"come to terms with","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nIt took him several years to [come to terms with] the failure of his first company.","c":["accept","forget","explain","repeat"],"e":"come to terms with A は「A（つらい現実など）を受け入れる・Aと折り合いをつける」という意味のイディオムです。最初の会社の失敗を受け入れるのに数年かかった、という意味なので accept が最も近い意味です。forget（忘れる）は受け入れるのとは違い、explain（説明する）や repeat（繰り返す）も意味が違います。","m":"come to terms with＝受け入れる・折り合う"},{"id":50,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"abstruse（難解な）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe professor's lecture was so ( ) that even specialists in the field struggled to follow it.","c":["abstruse","lucid","trivial","brief"],"e":"so ～ that 構文で「専門家でさえついていくのに苦労した」と続くので、講義は「難解な」ものだったはずです。abstruse（難解な）が正解です。lucid（明快な）は逆の意味です。trivial（ささいな）や brief（短い）では、専門家が苦労する理由になりません。abstruse は難度の高い語なので、obscure（わかりにくい）とあわせて覚えておきましょう。","m":"abstruse⇔lucid（明快な）"},{"id":51,"k":"plan","ref":"想定問題","f":"会話文","t":"ゼミ前の会話：同意して理由を述べる","p":"Kenta: Did you finish the reading for tomorrow's seminar?\nMaya: Most of it. The chapter on urban planning was heavy going, though.\nKenta: Tell me about it. ( 1 ) I had to read some paragraphs three times.\nMaya: Same here. But I think the main argument is that cities should be designed around people, not cars.\nKenta: Right. Although I'm not sure I buy it entirely. ( 2 )\nMaya: That's a fair point. Rural areas would need a different approach.\nKenta: Exactly. Anyway, do you want to meet up before the seminar to compare notes?\nMaya: ( 3 ) How about the library café at ten?\nKenta: Perfect. See you there.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["The author's style isn't exactly reader-friendly.","I finished it in about ten minutes.","I haven't even opened the book yet.","The chapter was surprisingly light reading."],"e":"Maya が「都市計画の章は読むのが大変だった（heavy going）」と言い、Kenta は Tell me about it.（まったくだよ）と同意しています。空所の後で「段落によっては3回読まなければならなかった」と続くので、「著者の文体は読み手に優しいとは言えない」が入ります。「10分で読み終えた」「軽い読み物だった」は同意の内容と矛盾し、「まだ本を開いてもいない」は3回読んだという発言と矛盾します。","m":"Tell me about it.＝まったくだ（同意）"},{"id":52,"k":"plan","ref":"想定問題","f":"会話文","t":"ゼミ前の会話：反論の提示","p":"Kenta: Did you finish the reading for tomorrow's seminar?\nMaya: Most of it. The chapter on urban planning was heavy going, though.\nKenta: Tell me about it. ( 1 ) I had to read some paragraphs three times.\nMaya: Same here. But I think the main argument is that cities should be designed around people, not cars.\nKenta: Right. Although I'm not sure I buy it entirely. ( 2 )\nMaya: That's a fair point. Rural areas would need a different approach.\nKenta: Exactly. Anyway, do you want to meet up before the seminar to compare notes?\nMaya: ( 3 ) How about the library café at ten?\nKenta: Perfect. See you there.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["What about people who live where there's no public transport?","Cars are becoming more expensive every year.","I've never actually been to a big city.","The author is a famous architect, isn't she?"],"e":"Kenta は「全面的には賛成できない（I'm not sure I buy it）」と述べ、Maya が「もっともな指摘ね。地方では違うやり方が必要でしょうね」と応じています。したがって空所には、車中心でない都市設計が当てはまらない例として「公共交通機関がない所に住む人はどうなの？」が入ります。車の値段や大都市に行った経験、著者の職業は、地方では違うやり方が必要という Maya の返答につながりません。","m":"buy＝（意見を）受け入れる、That's a fair point.＝もっともだ"},{"id":53,"k":"plan","ref":"想定問題","f":"会話文","t":"ゼミ前の会話：誘いへの応答","p":"Kenta: Did you finish the reading for tomorrow's seminar?\nMaya: Most of it. The chapter on urban planning was heavy going, though.\nKenta: Tell me about it. ( 1 ) I had to read some paragraphs three times.\nMaya: Same here. But I think the main argument is that cities should be designed around people, not cars.\nKenta: Right. Although I'm not sure I buy it entirely. ( 2 )\nMaya: That's a fair point. Rural areas would need a different approach.\nKenta: Exactly. Anyway, do you want to meet up before the seminar to compare notes?\nMaya: ( 3 ) How about the library café at ten?\nKenta: Perfect. See you there.","q":"次の会話文を読み、空所（3）に入れるのに最も適当なものを選びなさい。","c":["Sounds good.","I'm afraid I can't make it.","No, I've already compared them.","That's none of your business."],"e":"Kenta が「ゼミの前に会ってノートを比べないか」と誘い、Maya は空所の後で「10時に図書館のカフェはどう？」と具体的な時間と場所を提案しています。誘いを受け入れる Sounds good. が正解です。「都合がつかない」「もう比べた」と断ったあとに待ち合わせを提案するのは不自然です。「あなたには関係ない」は失礼なうえ、文脈にも合いません。","m":"Sounds good.＝いいね（誘いへの承諾）"},{"id":54,"k":"plan","ref":"想定問題","f":"会話文","t":"取引交渉：感想を尋ねる","p":"Client: Thank you for sending the revised proposal. My team has gone through it carefully.\nSupplier: I'm glad to hear that. ( 1 )\nClient: On the whole, yes. The design is excellent. The problem is the delivery schedule. Six weeks is longer than we can afford.\nSupplier: I see. ( 2 ) If we bring in additional staff, we could probably cut it to four weeks, but that would add about ten percent to the cost.\nClient: Hmm, that's a significant increase. Is there any room for compromise?\nSupplier: Well, if you could accept delivery in two stages, say half the order in four weeks and the rest in six, ( 3 )\nClient: That might work. Let me discuss it with my team and get back to you.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["Did it meet your expectations?","When will you send us the payment?","Why did you reject it so quickly?","Have you received it yet?"],"e":"直後に顧客が On the whole, yes.（全体としてはそうです）と答え、デザインは優れているが納期が問題だと続けています。したがって「ご期待に沿えましたか」と評価を尋ねる質問が入ります。冒頭で顧客が「丁寧に検討した」と言っているので、「もう受け取りましたか」「なぜすぐ却下したのか」は不自然です。支払いの時期を尋ねる質問には yes で答えられません。","m":"On the whole＝全体として（一部に不満あり）"},{"id":55,"k":"plan","ref":"想定問題","f":"会話文","t":"取引交渉：対応を約束する","p":"Client: Thank you for sending the revised proposal. My team has gone through it carefully.\nSupplier: I'm glad to hear that. ( 1 )\nClient: On the whole, yes. The design is excellent. The problem is the delivery schedule. Six weeks is longer than we can afford.\nSupplier: I see. ( 2 ) If we bring in additional staff, we could probably cut it to four weeks, but that would add about ten percent to the cost.\nClient: Hmm, that's a significant increase. Is there any room for compromise?\nSupplier: Well, if you could accept delivery in two stages, say half the order in four weeks and the rest in six, ( 3 )\nClient: That might work. Let me discuss it with my team and get back to you.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["Let me see what we can do.","I'm afraid that's out of the question.","Then we'll cancel the order.","You should have told us earlier."],"e":"納期が長すぎるという指摘を受け、供給側は空所の後で「追加の人員を入れれば4週間に短縮できる」と解決策を示しています。「何ができるか検討させてください」が自然な流れです。「それは論外です」「では注文を取り消します」と言った直後に短縮案を出すのは矛盾します。「もっと早く言うべきだった」は相手を責める言い方で、そのまま提案に移る流れに合いません。","m":"Let me see what we can do.＝検討してみます"},{"id":56,"k":"plan","ref":"想定問題","f":"会話文","t":"取引交渉：妥協案","p":"Client: Thank you for sending the revised proposal. My team has gone through it carefully.\nSupplier: I'm glad to hear that. ( 1 )\nClient: On the whole, yes. The design is excellent. The problem is the delivery schedule. Six weeks is longer than we can afford.\nSupplier: I see. ( 2 ) If we bring in additional staff, we could probably cut it to four weeks, but that would add about ten percent to the cost.\nClient: Hmm, that's a significant increase. Is there any room for compromise?\nSupplier: Well, if you could accept delivery in two stages, say half the order in four weeks and the rest in six, ( 3 )\nClient: That might work. Let me discuss it with my team and get back to you.","q":"次の会話文を読み、空所（3）に入れるのに最も適当なものを選びなさい。","c":["we could keep the price as it is.","we would need to raise the price by twenty percent.","we could not deliver anything for six weeks.","you would have to find another supplier."],"e":"顧客は「10%の値上げは大きい。妥協の余地はないか」と尋ねています。供給側が「2回に分けて納品してよければ」と条件を出しているので、その見返りとして「価格は据え置ける」が入ります。顧客も That might work.（それなら何とかなりそうだ）と前向きに応じています。20%の値上げや6週間何も届かない案、他社を探せという返答は妥協案にならず、顧客の反応とも合いません。","m":"if you could ～, we could ～＝条件付きの譲歩"},{"id":57,"k":"plan","ref":"想定問題","f":"会話文","t":"ボランティアの会話：期間を尋ねる","p":"Aya: You look exhausted. Rough day?\nBen: Kind of. I spent the whole afternoon at the food bank sorting donations.\nAya: I didn't know you volunteered there. ( 1 )\nBen: About a year now. It started as a class assignment, but I kept going.\nAya: That's impressive. I've been meaning to do something like that, but I never seem to find the time.\nBen: ( 2 ) They're always short of people on weekend mornings, and it's only a couple of hours.\nAya: Maybe I'll give it a try.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["How long have you been doing that?","Why did you decide to quit?","How much do they pay you?","When is it going to open?"],"e":"空所の直後で Ben が「もう1年くらいになる（About a year now.）」と期間を答えているので、継続期間を尋ねる How long have you been doing that? が正解です。Ben は今日も活動しており、続けている（I kept going）ので、「なぜやめたのか」は誤りです。ボランティアなので給料の質問は不自然です。フードバンクはすでに活動しているので、「いつ開くのか」も合いません。","m":"How long have you been ～ing?→期間で答える"},{"id":58,"k":"plan","ref":"想定問題","f":"会話文","t":"ボランティアの会話：誘う","p":"Aya: You look exhausted. Rough day?\nBen: Kind of. I spent the whole afternoon at the food bank sorting donations.\nAya: I didn't know you volunteered there. ( 1 )\nBen: About a year now. It started as a class assignment, but I kept going.\nAya: That's impressive. I've been meaning to do something like that, but I never seem to find the time.\nBen: ( 2 ) They're always short of people on weekend mornings, and it's only a couple of hours.\nAya: Maybe I'll give it a try.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["Why not come along with me this Saturday?","Then you'd better stay away from it.","I don't blame you. It's a waste of time.","They don't take any new volunteers."],"e":"Aya は「やりたいと思っているが時間が見つからない」と言っています。Ben は空所の後で「週末の朝はいつも人手不足だし、2時間くらいだけだ」と、気軽に参加できることを伝えています。「今週の土曜に一緒に来ない？」と誘う表現が入り、Aya の「やってみようかな」にもつながります。「近づかないほうがいい」「時間の無駄だ」「新しいボランティアは受け入れていない」は、どれも後の流れと矛盾します。","m":"Why not ～?＝～してはどう？（勧誘）"},{"id":59,"k":"plan","ref":"想定問題","f":"会話文","t":"図書館での会話：状況の説明","p":"Student: Excuse me. I'm looking for a book that's listed in the catalog, but it isn't on the shelf.\nLibrarian: Let me check. It says here that it was returned yesterday afternoon, so ( 1 )\nStudent: I see. Could you let me know when it's available? I need it for a paper due on Friday.\nLibrarian: Certainly. But ( 2 ) There's an electronic version you can read on the library website.\nStudent: Oh, that's even better. Thank you so much.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["it may not have been put back on the shelf yet.","it has been missing for several months.","you'll have to wait until next year.","you must have borrowed it yourself."],"e":"司書は「昨日の午後に返却された」と確認し、so（だから）で結論を続けています。返却されたばかりなので「まだ棚に戻されていないのかもしれない」が自然です。may not have p.p. は「〜していないかもしれない」という過去の推量です。「数か月行方不明」は昨日返却されたことと矛盾します。「来年まで待つ」は理由がつながらず、「あなた自身が借りたに違いない」も根拠がありません。","m":"may not have p.p.＝～しなかったかもしれない"},{"id":60,"k":"plan","ref":"想定問題","f":"会話文","t":"図書館での会話：代案の提示","p":"Student: Excuse me. I'm looking for a book that's listed in the catalog, but it isn't on the shelf.\nLibrarian: Let me check. It says here that it was returned yesterday afternoon, so ( 1 )\nStudent: I see. Could you let me know when it's available? I need it for a paper due on Friday.\nLibrarian: Certainly. But ( 2 ) There's an electronic version you can read on the library website.\nStudent: Oh, that's even better. Thank you so much.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["you may not need to wait at all.","I'm afraid you're out of luck.","you should choose a different topic.","the book can't be read anywhere else."],"e":"空所の後で司書は「図書館のウェブサイトで読める電子版がある」と代わりの方法を示し、学生も「そのほうがいい」と喜んでいます。したがって「待つ必要はまったくないかもしれません」が入ります。But で始まり、知らせを待つという前の話から流れを変えている点もヒントです。「運が悪い」「テーマを変えるべき」「ほかでは読めない」は、電子版があるという直後の発言と矛盾します。","m":"Alternatively／But ～＝代案を出す合図"},{"id":61,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"市民科学：科学者にとっての利点","p":"For most of the history of modern science, research was carried out by trained professionals in universities, laboratories and government agencies. Ordinary people appeared mainly as subjects to be studied or as an audience to be informed. In recent decades, however, a growing number of projects have invited members of the public to take part in research itself. Volunteers count birds in their gardens, record the dates on which flowers bloom, or classify galaxies in images posted online.\nThe appeal for scientists is easy to see. Many questions in ecology require observations spread across huge areas and long periods. No research team could afford to send paid staff to thousands of places every spring for decades, but volunteers can collect such data at little cost.\nProfessional researchers were at first doubtful about data gathered by amateurs. Their concern was not unreasonable: a beginner may confuse similar species or record observations carelessly. Project designers have responded by providing training and simple identification guides, asking several volunteers to classify the same item independently, and using statistical methods to detect records that look unusual. Studies comparing volunteer and expert data have found that, with such safeguards, the two are often similar in accuracy.\nSupporters argue that the benefits go beyond the data. Participants often say they have come to notice their local environment more closely, and some become active in protecting it. Critics, though, point out that volunteers tend to be concentrated in wealthier, more urban areas, so the resulting maps may say more about where people live than about where animals do.","q":"次の英文を読み、科学者が一般の参加者を研究に招くことの利点として、本文に最も合うものを選びなさい。","c":["Volunteers make it possible to gather observations over areas and periods too large for paid staff.","Volunteers are generally more accurate observers than professional researchers.","Volunteers can see galaxies that professional astronomers are unable to observe.","Universities no longer employ enough trained researchers to carry out field work."],"e":"第2段落に「広大な地域・長期間にわたる観察が必要だが、有給の職員を何千か所にも毎春何十年も派遣する余裕はない。ボランティアなら少ない費用で集められる」とあり、正解と一致します。「専門家より正確」は、第3段落で「安全策があれば同程度の正確さ」とあるだけで、上回るとは述べていません。「専門家に見えない銀河が見える」「大学の研究者が足りない」は本文に書かれていません。","m":"市民科学の強み＝広い範囲・長い期間のデータ"},{"id":62,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"市民科学：データの質","p":"For most of the history of modern science, research was carried out by trained professionals in universities, laboratories and government agencies. Ordinary people appeared mainly as subjects to be studied or as an audience to be informed. In recent decades, however, a growing number of projects have invited members of the public to take part in research itself. Volunteers count birds in their gardens, record the dates on which flowers bloom, or classify galaxies in images posted online.\nThe appeal for scientists is easy to see. Many questions in ecology require observations spread across huge areas and long periods. No research team could afford to send paid staff to thousands of places every spring for decades, but volunteers can collect such data at little cost.\nProfessional researchers were at first doubtful about data gathered by amateurs. Their concern was not unreasonable: a beginner may confuse similar species or record observations carelessly. Project designers have responded by providing training and simple identification guides, asking several volunteers to classify the same item independently, and using statistical methods to detect records that look unusual. Studies comparing volunteer and expert data have found that, with such safeguards, the two are often similar in accuracy.\nSupporters argue that the benefits go beyond the data. Participants often say they have come to notice their local environment more closely, and some become active in protecting it. Critics, though, point out that volunteers tend to be concentrated in wealthier, more urban areas, so the resulting maps may say more about where people live than about where animals do.","q":"次の英文を読み、一般の参加者が集めたデータの質について、本文の内容に最も合うものを選びなさい。","c":["With suitable safeguards, volunteer data can be about as accurate as data collected by experts.","Professional researchers' doubts turned out to be groundless from the very beginning.","Volunteers must pass a formal examination before they are allowed to record data.","Records that look unusual are automatically deleted without being checked by anyone."],"e":"第3段落の最後に「そうした安全策があれば、両者はしばしば正確さが同程度である」とあり、正解と一致します。専門家の懸念については not unreasonable（もっともな）と述べているので、「最初から根拠がなかった」は誤りです。行われているのは訓練や識別ガイドの提供で、「正式な試験」は書かれていません。統計的手法は異常な記録を「見つける（detect）」ためのもので、「自動的に削除する」とは述べていません。","m":"not unreasonable＝もっともな（二重否定）"},{"id":63,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"市民科学：批判派の懸念","p":"For most of the history of modern science, research was carried out by trained professionals in universities, laboratories and government agencies. Ordinary people appeared mainly as subjects to be studied or as an audience to be informed. In recent decades, however, a growing number of projects have invited members of the public to take part in research itself. Volunteers count birds in their gardens, record the dates on which flowers bloom, or classify galaxies in images posted online.\nThe appeal for scientists is easy to see. Many questions in ecology require observations spread across huge areas and long periods. No research team could afford to send paid staff to thousands of places every spring for decades, but volunteers can collect such data at little cost.\nProfessional researchers were at first doubtful about data gathered by amateurs. Their concern was not unreasonable: a beginner may confuse similar species or record observations carelessly. Project designers have responded by providing training and simple identification guides, asking several volunteers to classify the same item independently, and using statistical methods to detect records that look unusual. Studies comparing volunteer and expert data have found that, with such safeguards, the two are often similar in accuracy.\nSupporters argue that the benefits go beyond the data. Participants often say they have come to notice their local environment more closely, and some become active in protecting it. Critics, though, point out that volunteers tend to be concentrated in wealthier, more urban areas, so the resulting maps may say more about where people live than about where animals do.","q":"次の英文を読み、批判的な人々が指摘する問題として最も適当なものを選びなさい。","c":["The data may reflect where participants live rather than where wildlife is actually found.","Volunteers gradually lose interest in their local environment.","Wealthy volunteers tend to exaggerate the number of animals they observe.","Urban areas contain too few species to be worth studying at all."],"e":"最終段落で批判派は「参加者は裕福で都市的な地域に集中しがちなので、できあがった地図は動物のいる場所より人の住む場所を示しているかもしれない」と述べており、正解と一致します。「地元の環境への関心を失う」は、参加者が環境をよく見るようになるという記述と逆です。「数を誇張する」や「都市には研究する価値がない」は本文にありません。","m":"say more about A than B＝BよりAを示す"},{"id":64,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"プラセボ：新薬の試験での位置づけ","p":"Doctors have long known that patients sometimes feel better after receiving a treatment that contains no active ingredient. A sugar pill presented as a painkiller can reduce reported pain. This phenomenon, the placebo effect, was once regarded mainly as a nuisance. When a new drug is tested, it is compared with a placebo, and the drug is judged effective only if it performs better than the dummy treatment. In this setting, the placebo effect is simply background noise to be subtracted.\nMore recently, researchers have begun to study the effect for its own sake. Several factors appear to strengthen it. Expensive-looking pills tend to work better than cheap ones, and injections better than tablets. The manner of the doctor also matters: patients who are treated warmly and given time to describe their symptoms often report greater improvement than those who receive the same placebo from a hurried, distant doctor.\nPerhaps the most surprising finding comes from studies in which patients are told openly that they are receiving a placebo. One might expect the effect to vanish once the deception is removed. In several small trials, however, patients with conditions such as chronic back pain reported improvements even though they knew the pills contained nothing active. Researchers suspect that the ritual of treatment itself, taking a pill at fixed times as part of a plan, may trigger the body's own responses.\nNone of this means that placebos can cure everything. Their effects are strongest on symptoms that patients report themselves, such as pain, fatigue or nausea, and much weaker on measurable conditions such as the size of a tumor. Still, the findings suggest that the relationship between doctor and patient is not an extra added to medicine but part of the treatment.","q":"次の英文を読み、新薬の試験においてプラセボが従来果たしてきた役割として、本文に最も合うものを選びなさい。","c":["It served as a standard that a new drug had to outperform.","It was regarded as a cheap substitute for expensive drugs.","It was used mainly to make patients trust their doctors more.","It was given only to patients who refused to take real drugs."],"e":"第1段落に「新薬を試験するときはプラセボと比較され、偽の治療より効果が上回った場合にだけ有効と判断される」とあり、プラセボは新薬が超えるべき基準だったことがわかります。「高価な薬の安い代用品」「医師への信頼を高めるため」「本物の薬を拒んだ患者だけに与えた」という記述は本文にありません。むしろプラセボ効果は「差し引くべき雑音」として扱われていたと述べています。","m":"dummy treatment＝偽の治療（比較の基準）"},{"id":65,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"プラセボ：だまさない投与","p":"Doctors have long known that patients sometimes feel better after receiving a treatment that contains no active ingredient. A sugar pill presented as a painkiller can reduce reported pain. This phenomenon, the placebo effect, was once regarded mainly as a nuisance. When a new drug is tested, it is compared with a placebo, and the drug is judged effective only if it performs better than the dummy treatment. In this setting, the placebo effect is simply background noise to be subtracted.\nMore recently, researchers have begun to study the effect for its own sake. Several factors appear to strengthen it. Expensive-looking pills tend to work better than cheap ones, and injections better than tablets. The manner of the doctor also matters: patients who are treated warmly and given time to describe their symptoms often report greater improvement than those who receive the same placebo from a hurried, distant doctor.\nPerhaps the most surprising finding comes from studies in which patients are told openly that they are receiving a placebo. One might expect the effect to vanish once the deception is removed. In several small trials, however, patients with conditions such as chronic back pain reported improvements even though they knew the pills contained nothing active. Researchers suspect that the ritual of treatment itself, taking a pill at fixed times as part of a plan, may trigger the body's own responses.\nNone of this means that placebos can cure everything. Their effects are strongest on symptoms that patients report themselves, such as pain, fatigue or nausea, and much weaker on measurable conditions such as the size of a tumor. Still, the findings suggest that the relationship between doctor and patient is not an extra added to medicine but part of the treatment.","q":"次の英文を読み、患者にプラセボであることを伝えたうえで投与した研究の結果として、本文に最も合うものを選びなさい。","c":["Some patients reported improvements even though they knew the pills contained nothing active.","The effect disappeared as soon as patients learned the truth about the pills.","The openly given placebos worked better than real painkillers.","Researchers concluded that the patients had secretly received active drugs."],"e":"第3段落に「効果は消えると予想されるが、いくつかの小規模な試験では、慢性の腰痛などの患者が、有効成分が入っていないと知っていたにもかかわらず改善を報告した」とあり、正解と一致します。「真実を知るとすぐ効果が消えた」は予想（One might expect）であって結果とは逆です。「本物の鎮痛剤より効いた」「実は有効な薬が与えられていた」は本文にありません。","m":"One might expect ～, however …＝予想を覆す展開"},{"id":66,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"プラセボ：筆者の結論","p":"Doctors have long known that patients sometimes feel better after receiving a treatment that contains no active ingredient. A sugar pill presented as a painkiller can reduce reported pain. This phenomenon, the placebo effect, was once regarded mainly as a nuisance. When a new drug is tested, it is compared with a placebo, and the drug is judged effective only if it performs better than the dummy treatment. In this setting, the placebo effect is simply background noise to be subtracted.\nMore recently, researchers have begun to study the effect for its own sake. Several factors appear to strengthen it. Expensive-looking pills tend to work better than cheap ones, and injections better than tablets. The manner of the doctor also matters: patients who are treated warmly and given time to describe their symptoms often report greater improvement than those who receive the same placebo from a hurried, distant doctor.\nPerhaps the most surprising finding comes from studies in which patients are told openly that they are receiving a placebo. One might expect the effect to vanish once the deception is removed. In several small trials, however, patients with conditions such as chronic back pain reported improvements even though they knew the pills contained nothing active. Researchers suspect that the ritual of treatment itself, taking a pill at fixed times as part of a plan, may trigger the body's own responses.\nNone of this means that placebos can cure everything. Their effects are strongest on symptoms that patients report themselves, such as pain, fatigue or nausea, and much weaker on measurable conditions such as the size of a tumor. Still, the findings suggest that the relationship between doctor and patient is not an extra added to medicine but part of the treatment.","q":"次の英文を読み、最終段落から読み取れる筆者の考えとして最も適当なものを選びなさい。","c":["The way doctors treat their patients can itself contribute to the effect of treatment.","Placebos could replace most conventional drugs if they were given openly.","Placebos have their strongest effects on measurable conditions such as tumors.","The placebo effect is merely background noise and should be ignored by doctors."],"e":"最終段落の最後で「医師と患者の関係は医療に付け足されたおまけではなく、治療の一部だ」と述べており、正解と合います。冒頭で「プラセボが何でも治せるわけではない」と断っているので「大部分の薬の代わりになる」は誤りです。効果が強いのは痛み・疲労など患者が自分で報告する症状で、腫瘍の大きさのような測定できる状態には弱いので、その記述も逆です。「雑音として無視すべき」は、かつての見方で筆者の結論ではありません。","m":"not A but B＝AではなくB（筆者の主張）"},{"id":67,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"文化財返還：「普遍的博物館」の主張","p":"Many of the great museums of Europe and North America hold objects that were taken from other parts of the world during the colonial era. Some were purchased, some were given as gifts, and some were seized during military campaigns. For a long time, museums defended their right to keep such collections by arguing that they are \"universal\" institutions, where visitors from every country can compare the achievements of different cultures side by side under one roof.\nIn recent years, this argument has come under growing pressure. Governments and communities in the countries of origin have asked for the return of objects that they regard as part of their history, and in some cases as sacred. They point out that it is far easier for a tourist in London or Paris to see these objects than for the descendants of the people who made them. Several museums have now agreed to return particular items, especially those whose removal was clearly violent.\nMuseum officials often raise practical objections. They ask whether the receiving institutions have the facilities to preserve fragile materials, and they worry that returning one object will lead to claims for thousands of others. Supporters of return respond that the first concern can be addressed through cooperation, such as sharing conservation expertise and arranging loans, and that the second is not a valid reason to refuse claims that are justified.\nSome observers suggest that the debate is gradually changing what museums understand themselves to be. Rather than owners who guard objects forever, museums may come to see themselves as temporary caretakers, responsible for telling the full story of how each object arrived in their galleries, including the parts of that story that reflect badly on the museum.","q":"次の英文を読み、博物館が収蔵品を保持する根拠として長く主張してきた内容に最も合うものを選びなさい。","c":["Keeping objects from many cultures in one place allows visitors to compare them.","Objects that were bought legally can never be claimed by other countries.","Museums in the countries of origin are too small to attract visitors.","Sacred objects should be shown only to people who share the same beliefs."],"e":"第1段落で、博物館は自らを「普遍的」な施設だとし、「あらゆる国の来館者が一つの屋根の下で異なる文化の業績を並べて比べられる」と主張してきたと述べています。正解はこの内容です。「合法的に買ったものは請求されない」「原産国の博物館は小さい」「信仰を同じくする人だけに見せるべき」は、どれも本文で博物館の主張として述べられていません。","m":"side by side under one roof＝一か所に並べて"},{"id":68,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"文化財返還：返還支持派の反論","p":"Many of the great museums of Europe and North America hold objects that were taken from other parts of the world during the colonial era. Some were purchased, some were given as gifts, and some were seized during military campaigns. For a long time, museums defended their right to keep such collections by arguing that they are \"universal\" institutions, where visitors from every country can compare the achievements of different cultures side by side under one roof.\nIn recent years, this argument has come under growing pressure. Governments and communities in the countries of origin have asked for the return of objects that they regard as part of their history, and in some cases as sacred. They point out that it is far easier for a tourist in London or Paris to see these objects than for the descendants of the people who made them. Several museums have now agreed to return particular items, especially those whose removal was clearly violent.\nMuseum officials often raise practical objections. They ask whether the receiving institutions have the facilities to preserve fragile materials, and they worry that returning one object will lead to claims for thousands of others. Supporters of return respond that the first concern can be addressed through cooperation, such as sharing conservation expertise and arranging loans, and that the second is not a valid reason to refuse claims that are justified.\nSome observers suggest that the debate is gradually changing what museums understand themselves to be. Rather than owners who guard objects forever, museums may come to see themselves as temporary caretakers, responsible for telling the full story of how each object arrived in their galleries, including the parts of that story that reflect badly on the museum.","q":"次の英文を読み、博物館側の実務上の懸念に対する返還支持派の反論として最も適当なものを選びなさい。","c":["Worries about preservation can be dealt with through cooperation between institutions.","Fragile objects should remain permanently where they are now displayed.","Museums should return every object at once to avoid further claims.","Receiving institutions already have better facilities than European museums."],"e":"第3段落で返還支持派は、保存設備の懸念（the first concern）は「保存技術の共有や貸し出しなどの協力で対処できる」と答えています。正解はこの内容です。「壊れやすい物はそのまま置くべき」は博物館側に近い考えで、支持派の反論ではありません。「すべてを一度に返す」とは述べておらず、二つ目の懸念には「正当な請求を拒む理由にならない」と答えているだけです。「受け入れ側の設備のほうが優れている」も本文にありません。","m":"the first / the second＝前に挙げた二つの懸念"},{"id":69,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"文化財返還：博物館像の変化","p":"Many of the great museums of Europe and North America hold objects that were taken from other parts of the world during the colonial era. Some were purchased, some were given as gifts, and some were seized during military campaigns. For a long time, museums defended their right to keep such collections by arguing that they are \"universal\" institutions, where visitors from every country can compare the achievements of different cultures side by side under one roof.\nIn recent years, this argument has come under growing pressure. Governments and communities in the countries of origin have asked for the return of objects that they regard as part of their history, and in some cases as sacred. They point out that it is far easier for a tourist in London or Paris to see these objects than for the descendants of the people who made them. Several museums have now agreed to return particular items, especially those whose removal was clearly violent.\nMuseum officials often raise practical objections. They ask whether the receiving institutions have the facilities to preserve fragile materials, and they worry that returning one object will lead to claims for thousands of others. Supporters of return respond that the first concern can be addressed through cooperation, such as sharing conservation expertise and arranging loans, and that the second is not a valid reason to refuse claims that are justified.\nSome observers suggest that the debate is gradually changing what museums understand themselves to be. Rather than owners who guard objects forever, museums may come to see themselves as temporary caretakers, responsible for telling the full story of how each object arrived in their galleries, including the parts of that story that reflect badly on the museum.","q":"次の英文を読み、最終段落から推測できる今後の博物館の姿として最も適当なものを選びなさい。","c":["Museums may explain how their objects were acquired, even when this is unflattering to them.","Museums will stop displaying objects from other cultures entirely.","Museums will become permanent owners with stronger legal rights.","Museums will focus only on stories that improve their reputation."],"e":"最終段落に、博物館は永久の所有者ではなく一時的な管理者と考えるようになり、「その物が展示室に来た経緯の全体を、博物館にとって不名誉な部分も含めて語る責任を負う」とあります。正解はこの内容に合います。「他文化の物の展示をやめる」とは述べていません。「永久の所有者」は Rather than で否定された姿です。「評判を高める話だけ」は reflect badly（悪く映る）部分も語るという記述と逆です。","m":"reflect badly on ～＝～の評判を落とす"},{"id":70,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"ヒートアイランド：原因（NOT問題）","p":"On a hot summer night, the center of a large city can be several degrees warmer than the surrounding countryside. This difference, known as the urban heat island effect, arises because roads, roofs and walls absorb sunlight during the day and release the stored heat slowly at night. Air conditioners, cars and factories add still more heat, while the lack of vegetation means that less water evaporates to cool the air.\nThe consequences are not merely a matter of comfort. During heat waves, death rates rise, particularly among elderly people living alone and those without access to cooling. Because poorer neighborhoods often have fewer parks and trees, and more of their residents cannot afford air conditioning, the burden of extreme heat tends to fall unequally.\nCities have experimented with many responses. Painting roofs white or light gray allows them to reflect more sunlight. Some pavements are designed to let rainwater soak in and later evaporate. The most popular measure, however, has been planting trees. A mature tree shades the ground beneath it and releases water vapor through its leaves, and a street lined with trees can be noticeably cooler than a bare one nearby.\nYet planting trees is not as simple as it sounds. Young trees need regular watering for several years, and in crowded streets their roots must compete for space with pipes and cables underground. A tree planted today will provide significant shade only a decade or more later. Urban planners therefore stress that trees work best as part of a broader strategy, combined with changes to buildings and materials and with programs that check on vulnerable residents during heat waves.","q":"次の英文を読み、都市の中心部が周辺より暑くなる原因として、本文で挙げられていないものを選びなさい。","c":["Clouds trap more heat over cities than over the countryside.","Roads and roofs store heat during the day and release it at night.","Machines such as air conditioners and cars give off additional heat.","A lack of plants means that less cooling occurs through evaporation."],"e":"第1段落は原因として、道路・屋根・壁が昼に熱をため夜にゆっくり放出すること、エアコン・車・工場がさらに熱を加えること、植物が少なく蒸発による冷却が減ることの三つを挙げています。「雲が都市の上で熱を閉じ込める」という説明は本文のどこにもないので、これが正解です。ほかの三つはそれぞれ本文の記述と一致します。","m":"原因は「蓄熱・排熱・緑の不足」の三つ"},{"id":71,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"ヒートアイランド：負担の不平等","p":"On a hot summer night, the center of a large city can be several degrees warmer than the surrounding countryside. This difference, known as t 場に近い」「高齢者が裕福な地区に移る」「裕福な住民のエアコンが貧しい地区を暑くする」は、どれも本文に書かれていない理由です。because 節の中身がそのまま答えになっています。","m":"Because ～, the burden … falls unequally"},{"id":72,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"ヒートアイランド：植樹の位置づけ","p":"On a hot summer night, the center of a large city can be several degrees warmer than the surrounding countryside. This difference, known as the urban heat island effect, arises because roads, roofs and walls absorb sunlight during the day and release the stored heat slowly at night. Air conditioners, cars and factories add still more heat, while the lack of vegetation means that less water evaporates to cool the air.\nThe consequences are not merely a matter of comfort. During heat waves, death rates rise, particularly among elderly people living alone and those without access to cooling. Because poorer neighborhoods often have fewer parks and trees, and more of their residents cannot afford air conditioning, the burden of extreme heat tends to fall unequally.\nCities have experimented with many responses. Painting roofs white or light gray allows them to reflect more sunlight. Some pavements are designed to let rainwater soak in and later evaporate. The most popular measure, however, has been planting trees. A mature tree shades the ground beneath it and releases water vapor through its leaves, and a street lined with trees can be noticeably cooler than a bare one nearby.\nYet planting trees is not as simple as it sounds. Young trees need regular watering for several years, and in crowded streets their roots must compete for space with pipes and cables underground. A tree planted today will provide significant shade only a decade or more later. Urban planners therefore stress that trees work best as part of a broader strategy, combined with changes to buildings and materials and with programs that check on vulnerable residents during heat waves.","q":"次の英文を読み、都市計画の専門家の考えとして最も適当なものを選びなさい。","c":["Trees should be combined with other measures, since their benefits take time and they need care.","Trees are ineffective and should be replaced entirely by white roofs.","Trees can provide full shade within a year if they are watered regularly.","Trees should be planted only on streets with no pipes or cables underground."],"e":"最終段落で、若木は数年間水やりが必要で、十分な日陰をつくるのは10年以上先だと述べたうえで、専門家は「木は建物や素材の変更、弱い立場の住民を見回る取り組みと組み合わせた、より広い戦略の一部として最もよく機能する」と強調しています。正解はこの内容です。木に効果がないとは述べておらず、「1年で十分な日陰」は a decade or more に反します。地下の管との競合は課題として挙げているだけで、そうした道に植えるなとは言っていません。","m":"work best as part of a broader strategy"},{"id":73,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"消滅危機言語：言語が失われる過程","p":"Of the roughly seven thousand languages spoken in the world today, linguists estimate that a large share may no longer be spoken by the end of this century. A language rarely dies because its speakers suddenly abandon it. More often, parents who speak a minority language decide that their children will have better opportunities if they grow up speaking the dominant language of schools, jobs and the media. Each generation then uses the old language a little less, until only a few elderly speakers remain.\nWhy should the loss of a language concern anyone other than its speakers? One answer is scientific. Each language represents a distinct solution to the problem of organizing sounds, words and meanings, and linguists cannot understand the full range of what human language can do if they study only a few major languages. Another answer concerns knowledge. Long-settled communities often encode detailed information about local plants, animals and seasons in their vocabulary, and some of that information is recorded nowhere else.\nEfforts to revive endangered languages have produced mixed results. Recording the last speakers preserves a valuable archive, but a dictionary on a shelf does not keep a language alive. The most successful programs have been those that create new speakers, for example by running nursery schools in which young children spend the whole day immersed in the language. Such programs depend on the commitment of parents, who must be persuaded that the language is worth passing on.\nSome scholars warn against treating revival purely as a matter of saving data. For many communities, regaining their language is bound up with recovering a sense of identity and dignity that was damaged by past policies which punished children for speaking it at school.","q":"次の英文を読み、言語が話されなくなる典型的な過程として、本文に最も合うものを選びなさい。","c":["Parents choose the dominant language for their children, and the old language is used less with each generation.","Speakers usually give up the language all at once when they move to a large city.","Children refuse to learn the language even when their parents want to pass it on.","Linguists fail to record the language before the last speaker dies."],"e":"第1段落に「話者が突然捨てることはまれで、多くは親が支配的な言語で育てたほうが子の機会が広がると判断し、世代ごとに使用が少しずつ減る」とあり、正解と一致します。「一度に捨てる」は rarely ... suddenly abandon に反します。「親が望んでも子が拒む」は本文の説明（親の判断）と逆です。記録の失敗は言語が失われる過程として述べられていません。","m":"rarely ～. More often …＝典型はあとの方"},{"id":74,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"消滅危機言語：成功した再生策","p":"Of the roughly seven thousand languages spoken in the world today, linguists estimate that a large share may no longer be spoken by the end of this century. A language rarely dies because its speakers suddenly abandon it. More often, parents who speak a minority language decide that their children will have better opportunities if they grow up speaking the dominant language of schools, jobs and the media. Each generation then uses the old language a little less, until only a few elderly speakers remain.\nWhy should the loss of a language concern anyone other than its speakers? One answer is scientific. Each language represents a distinct solution to the problem of organizing sounds, words and meanings, and linguists cannot understand the full range of what human language can do if they study only a few major languages. Another answer concerns knowledge. Long-settled communities often encode detailed information about local plants, animals and seasons in their vocabulary, and some of that information is recorded nowhere else.\nEfforts to revive endangered languages have produced mixed results. Recording the last speakers preserves a valuable archive, but a dictionary on a shelf does not keep a language alive. The most successful programs have been those that create new speakers, for example by running nursery schools in which young children spend the whole day immersed in the language. Such programs depend on the commitment of parents, who must be persuaded that the language is worth passing on.\nSome scholars warn against treating revival purely as a matter of saving data. For many communities, regaining their language is bound up with recovering a sense of identity and dignity that was damaged by past policies which punished children for speaking it at school.","q":"次の英文を読み、言語の再生の取り組みのうち最も成功してきたものとして、本文に合うものを選びなさい。","c":["Programs that create new speakers, such as nursery schools that immerse children in the language","Projects that produce dictionaries and recordings of the last remaining speakers","Classes that teach the language only to adults who already speak it well","Efforts to translate local knowledge into the dominant language"],"e":"第3段落に「最も成功したのは新しい話者を生み出すもので、たとえば幼い子どもが一日中その言語に浸る保育施設を運営するものだ」とあり、正解と一致します。辞書や録音は「貴重な記録になるが、棚の上の辞書は言語を生かし続けない」と、成功例とは区別されています。「すでに話せる大人だけに教える」「支配的な言語に翻訳する」は本文にありません。","m":"create new speakers＝話し手を新たに育てる"},{"id":75,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"消滅危機言語：話者以外への影響","p":"Of the roughly seven thousand languages spoken in the world today, linguists estimate that a large share may no longer be spoken by the end of this century. A language rarely dies because its speakers suddenly abandon it. More often, parents who speak a minority language decide that their children will have better opportunities if they grow up speaking the dominant language of schools, jobs and the media. Each generation then uses the old language a little less, until only a few elderly speakers remain.\nWhy should the loss of a language concern anyone other than its speakers? One answer is scientific. Each language represents a distinct solution to the problem of organizing sounds, words and meanings, and linguists cannot understand the full range of what human language can do if they study only a few major languages. Another answer concerns knowledge. Long-settled communities often encode detailed information about local plants, animals and seasons in their vocabulary, and some of that information is recorded nowhere else.\nEfforts to revive endangered languages have produced mixed results. Recording the last speakers preserves a valuable archive, but a dictionary on a shelf does not keep a language alive. The most successful programs have been those that create new speakers, for example by running nursery schools in which young children spend the whole day immersed in the language. Such programs depend on the commitment of parents, who must be persuaded that the language is worth passing on.\nSome scholars warn against treating revival purely as a matter of saving data. For many communities, regaining their language is bound up with recovering a sense of identity and dignity that was damaged by past policies which punished children for speaking it at school.","q":"次の英文を読み、言語の消滅が話者以外の人々にとっても問題になる理由として、本文で述べられているものを選びなさい。","c":["Some knowledge about local nature exists only in the vocabulary of such languages.","Minority languages are easier for linguists to learn than major languages.","Major languages would become less useful if minority languages disappeared.","Every endangered language is closely related to a major world language."],"e":"第2段落は理由を二つ挙げています。一つは科学的理由（少数の大言語だけでは人間の言語の可能性の全体がわからない）、もう一つは知識に関するもので「地元の動植物や季節についての詳しい情報が語彙に織り込まれ、その一部はほかのどこにも記録されていない」とあります。正解は後者に一致します。「学びやすい」「大言語が役に立たなくなる」「大言語と近縁」はどれも本文にありません。","m":"recorded nowhere else＝ほかに記録がない"},{"id":76,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：fail to engage","p":"Boredom has a poor reputation. It is usually treated as an unpleasant state to be escaped as quickly as possible, and modern technology makes escape easy: a phone in one's pocket offers an endless supply of distraction. Psychologists, however, have begun to ask whether boredom might serve a useful purpose.\nOne proposal is that boredom works like a signal. Just as pain warns us that something is wrong with the body, boredom tells us that our current activity is failing to ( A ) us, and pushes us to look for something more meaningful. On this view, the problem is not boredom itself but the way we respond to it. If we immediately reach for a screen, we silence the signal without acting on its message.\nSome experiments suggest that boredom can also [foster] creativity. In one kind of study, participants first complete a dull task, such as copying numbers from a list, and are then asked to think of as many uses as possible for an ordinary object, such as a paper cup. Those who had been bored often produce more, and more unusual, ideas than those who skipped the dull task. Researchers suggest that when the outside world offers little stimulation, the mind begins to wander, and wandering thoughts can form unexpected connections.\nThe evidence is not yet ( B ). Some attempts to repeat such experiments have found weaker effects, and chronic boredom, which some people experience day after day, is linked to unhappiness rather than inspiration. Nevertheless, the research invites us to reconsider the habit of filling every idle moment. A few minutes without input may be less a waste of time than an opportunity.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["engage","bother","tire","delay"],"e":"退屈は痛みと同じく「信号」で、今の活動が自分を（ A ）できていないことを知らせ、もっと意味のあることを探すよう促す、という文脈です。「心を引きつける・夢中にさせる」engage を入れると、退屈＝今の活動に心が向いていない、という意味になり筋が通ります。bother（悩ませる）や tire（疲れさせる）を入れると「悩ませ／疲れさせられていない」となり退屈の説明になりません。delay（遅らせる）も意味が通りません

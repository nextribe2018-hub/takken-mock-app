も語らない」と、楽観的な話が見落としている点を指摘しているので、「十分な注意を払っていない」が最も近い意味です。「詳しく説明する」「強調する」は逆の意味です。「公然と否定する」も、触れずに済ませるという意味とは異なります。","m":"gloss over＝ごまかす・さっと済ませる"},{"id":21,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：On the other hand","p":"Every wave of technological change has been accompanied by fears that machines will leave large numbers of people without work. In the early nineteenth century, textile workers in England smashed the machines they believed were destroying their livelihoods. Similar fears returned with the computer. Today, advances in artificial intelligence have ( A ) the debate once more.\nLooking back, economists generally conclude that the most dramatic predictions did not come true. Although particular jobs vanished, new ones emerged. Rising productivity lowered prices, which left consumers with more money to spend on other goods and services, and that spending in turn created demand for workers elsewhere.\nThis reassuring story, however, [glosses over] an important point. The fact that employment recovered in the long run says little about the people who lost their jobs in the short run. A weaver in his fifties could not easily become a railway engineer, and many displaced workers never regained their former income. The gains from technology were real, but they were unevenly shared, across groups and generations.\nSome researchers argue that the present wave may differ from earlier ones in a crucial respect. Earlier machines mainly replaced physical labor or routine calculation, leaving tasks that required judgment, language and social skill to human beings. Newer systems are beginning to perform some of these tasks as well. If so, the range of work in which humans keep a clear advantage may shrink faster than before. ( B ), others caution that such predictions have been made before, and that the capacity of economies to invent new kinds of work has often been underestimated. Both sides agree that the pace of adjustment, and who bears its costs, will depend heavily on public policy.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["On the other hand","As a result","For this reason","In other words"],"e":"空所の前では「今回の波は判断や言語の仕事まで代替し始めており、人間の優位な領域が以前より速く縮むかもしれない」という一部の研究者の主張、後では「他の人々は、そうした予測は以前にもなされ、新しい仕事を生む経済の力は過小評価されてきたと警告する」という反対の立場が述べられています。対立する見解を並べる On the other hand が正解です。As a result と For this reason は因果関係、In other words は言い換えを表すので不適当です。","m":"some argue ～ / others caution ～＝対比"},{"id":22,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：credible","p":"Democratic politics is usually imagined as a contest. Parties compete for votes and seats, interest groups lobby for advantage, and elections decide which side wins. Critics have long complained that this model rewards slogans more than reasoning, and that voters are rarely asked to consider the arguments of those they disagree with. In response, a number of countries and cities have experimented with an alternative: the citizens' assembly.\nA citizens' assembly brings together a group of ordinary people, chosen at random but balanced to reflect the population by age, gender, region and other traits. Over several weekends, members hear from experts and advocates on a disputed issue, discuss the evidence in small groups, and finally make recommendations. Because members are not seeking reelection, they are free to change their minds, and observers often report that they do.\nSupporters claim that such bodies can break deadlocks that elected politicians are unable or unwilling to resolve. When a proposal comes from people much like themselves who have studied the question carefully, voters may find it more ( A ) than one produced by professional politicians. Several assemblies have tackled divisive social issues and produced proposals that voters later approved.\nSkeptics raise practical and principled objections. Randomly selected members, they note, have no mandate from the electorate and cannot be held [accountable] at the next election. The results also depend heavily on how the agenda is framed and which experts are invited, which gives considerable influence to the organizers. For these reasons, most proposals treat assemblies not as a ( B ) for elected legislatures but as a supplement to them, offering advice that politicians or voters remain free to accept or reject.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["credible","obscure","partisan","trivial"],"e":"空所を含む文は「自分たちとよく似た人々が問題を注意深く検討して出した提案は、職業政治家の提案より〜だと有権者は感じるかもしれない」という意味です。この段落は市民議会の支持者の主張を述べており、次の文で「その提案が後に有権者に承認された」と続くので、「信頼できる」の credible が正解です。obscure（不明瞭な）、partisan（党派的な）、trivial（ささいな）は、いずれも支持者の主張として肯定的な流れに合いません。","m":"credible＝信頼できる（credit と同語源）"},{"id":23,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：accountable","p":"Democratic politics is usually imagined as a contest. Parties compete for votes and seats, interest groups lobby for advantage, and elections decide which side wins. Critics have long complained that this model rewards slogans more than reasoning, and that voters are rarely asked to consider the arguments of those they disagree with. In response, a number of countries and cities have experimented with an alternative: the citizens' assembly.\nA citizens' assembly brings together a group of ordinary people, chosen at random but balanced to reflect the population by age, gender, region and other traits. Over several weekends, members hear from experts and advocates on a disputed issue, discuss the evidence in small groups, and finally make recommendations. Because members are not seeking reelection, they are free to change their minds, and observers often report that they do.\nSupporters claim that such bodies can break deadlocks that elected politicians are unable or unwilling to resolve. When a proposal comes from people much like themselves who have studied the question carefully, voters may find it more ( A ) than one produced by professional politicians. Several assemblies have tackled divisive social issues and produced proposals that voters later approved.\nSkeptics raise practical and principled objections. Randomly selected members, they note, have no mandate from the electorate and cannot be held [accountable] at the next election. The results also depend heavily on how the agenda is framed and which experts are invited, which gives considerable influence to the organizers. For these reasons, most proposals treat assemblies not as a ( B ) for elected legislatures but as a supplement to them, offering advice that politicians or voters remain free to accept or reject.","q":"次の英文を読み、下線部［accountable］の意味として最も適当なものを選びなさい。","c":["responsible to voters for their decisions","able to count votes accurately","eligible to stand as candidates","well informed about the issues"],"e":"be held accountable は「（行動・決定について）責任を問われる」の意味です。くじで選ばれた議員は有権者から委任を受けておらず、次の選挙で落選させることで責任を問うこともできない、という懐疑派の指摘です。正解は「自分の決定について有権者に責任を負う」です。count（数える）からの連想で「票を正確に数えられる」を選ばないよう注意が必要です。「立候補資格がある」「問題に詳しい」も語の意味とは違います。","m":"hold A accountable＝Aに責任を問う"},{"id":24,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：substitute for","p":"Democratic politics is usually imagined as a contest. Parties compete for votes and seats, interest groups lobby for advantage, and elections decide which side wins. Critics have long complained that this model rewards slogans more than reasoning, and that voters are rarely asked to consider the arguments of those they disagree with. In response, a number of countries and cities have experimented with an alternative: the citizens' assembly.\nA citizens' assembly brings together a group of ordinary people, chosen at random but balanced to reflect the population by age, gender, region and other traits. Over several weekends, members hear from experts and advocates on a disputed issue, discuss the evidence in small groups, and finally make recommendations. Because members are not seeking reelection, they are free to change their minds, and observers often report that they do.\nSupporters claim that such bodies can break deadlocks that elected politicians are unable or unwilling to resolve. When a proposal comes from people much like themselves who have studied the question carefully, voters may find it more ( A ) than one produced by professional politicians. Several assemblies have tackled divisive social issues and produced proposals that voters later approved.\nSkeptics raise practical and principled objections. Randomly selected members, they note, have no mandate from the electorate and cannot be held [accountable] at the next election. The results also depend heavily on how the agenda is framed and which experts are invited, which gives considerable influence to the organizers. For these reasons, most proposals treat assemblies not as a ( B ) for elected legislatures but as a supplement to them, offering advice that politicians or voters remain free to accept or reject.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["substitute","tribute","sequel","motive"],"e":"空所の後で「議会の補完物として（as a supplement to them）」と対比されているので、not as a substitute for A but as a supplement to A（Aの代わりではなく補完として）とするのが自然です。市民議会は議会に取って代わるのではなく、政治家や有権者が採否を決められる助言を与える、という最後の部分とも合います。tribute（賛辞）、sequel（続編）、motive（動機）はいずれも for と組み合わせても文意が通りません。","m":"substitute for A＝Aの代わり／supplement to A＝Aの補足"},{"id":25,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：withstand","p":"When antibiotics came into wide use in the 1940s, they transformed medicine. Infections that had routinely killed patients became easy to treat, and operations that had been too dangerous to attempt became common. Yet even some of the scientists who developed these drugs warned that bacteria might learn to ( A ) them, and that warning has proved accurate.\nResistance arises through natural selection. In any large population of bacteria, a few individuals may carry genetic changes that allow them to survive a particular drug. When the drug is applied, the others die, while the resistant ones survive and multiply until they dominate the population. Bacteria can also pass resistance genes to one another, even across species, which lets resistance spread far faster than it would through inheritance alone.\nHuman behavior has sped up this process. Antibiotics are often prescribed for illnesses caused by viruses, such as the common cold, against which they are useless. In many countries, large quantities of antibiotics are given to farm animals, not to cure disease but to promote growth, creating ideal conditions for resistant strains to emerge.\nThe problem is made worse by economics. Developing a new antibiotic is expensive, and because doctors are rightly urged to save new drugs for cases in which older ones fail, sales of a successful new antibiotic are likely to be modest. Drug companies therefore have little [incentive] to invest in the field, and few new classes of antibiotics have reached the market in recent decades. Some experts have proposed that governments pay companies a fixed reward for developing useful antibiotics, ( B ) of how many doses are eventually sold, so that the goal of protecting new drugs no longer conflicts with the goal of making a profit.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["withstand","produce","detect","imitate"],"e":"科学者たちが警告したのは、細菌がやがて抗生物質に「耐える」ようになるかもしれないということで、それが正しかったとわかったと述べています。第2段落の「耐性は自然選択によって生じる」という説明にもつながるので、withstand（耐える・持ちこたえる）が正解です。細菌が抗生物質を produce（作る）、detect（検出する）、imitate（まねる）では、耐性の話につながりません。","m":"withstand＝resist＝耐える"},{"id":26,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：incentive","p":"When antibiotics came into wide use in the 1940s, they transformed medicine. Infections that had routinely killed patients became easy to treat, and operations that had been too dangerous to attempt became common. Yet even some of the scientists who developed these drugs warned that bacteria might learn to ( A ) them, and that warning has proved accurate.\nResistance arises through natural selection. In any large population of bacteria, a few individuals may carry genetic changes that allow them to survive a particular drug. When the drug is applied, the others die, while the resistant ones survive and multiply until they dominate the population. Bacteria can also pass resistance genes to one another, even across species, which lets resistance spread far faster than it would through inheritance alone.\nHuman behavior has sped up this process. Antibiotics are often prescribed for illnesses caused by viruses, such as the common cold, against which they are useless. In many countries, large quantities of antibiotics are given to farm animals, not to cure disease but to promote growth, creating ideal conditions for resistant strains to emerge.\nThe problem is made worse by economics. Developing a new antibiotic is expensive, and because doctors are rightly urged to save new drugs for cases in which older ones fail, sales of a successful new antibiotic are likely to be modest. Drug companies therefore have little [incentive] to invest in the field, and few new classes of antibiotics have reached the market in recent decades. Some experts have proposed that governments pay companies a fixed reward for developing useful antibiotics, ( B ) of how many doses are eventually sold, so that the goal of protecting new drugs no longer conflicts with the goal of making a profit.","q":"次の英文を読み、下線部［incentive］に最も意味が近いものを選びなさい。","c":["motive","permission","capacity","obligation"],"e":"incentive は「（行動を促す）動機・誘因」です。新しい抗生物質は開発費が高いのに、医師が切り札として温存するので売上は控えめになる。だから製薬会社にはこの分野に投資する動機がほとんどない、という流れです。motive が最も近い意味です。permission（許可）、capacity（能力）、obligation（義務）は、利益が見込めないので投資しない、という経済的な理由づけと合いません。","m":"incentive＝motive（やる気を起こさせるもの）"},{"id":27,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：regardless of","p":"When antibiotics came into wide use in the 1940s, they transformed medicine. Infections that had routinely killed patients became easy to treat, and operations that had been too dangerous to attempt became common. Yet even some of the scientists who developed these drugs warned that bacteria might learn to ( A ) them, and that warning has proved accurate.\nResistance arises through natural selection. In any large population of bacteria, a few individuals may carry genetic changes that allow them to survive a particular drug. When the drug is applied, the others die, while the resistant ones survive and multiply until they dominate the population. Bacteria can also pass resistance genes to one another, even across species, which lets resistance spread far faster than it would through inheritance alone.\nHuman behavior has sped up this process. Antibiotics are often prescribed for illnesses caused by viruses, such as the common cold, against which they are useless. In many countries, large quantities of antibiotics are given to farm animals, not to cure disease but to promote growth, creating ideal conditions for resistant strains to emerge.\nThe problem is made worse by economics. Developing a new antibiotic is expensive, and because doctors are rightly urged to save new drugs for cases in which older ones fail, sales of a successful new antibiotic are likely to be modest. Drug companies therefore have little [incentive] to invest in the field, and few new classes of antibiotics have reached the market in recent decades. Some experts have proposed that governments pay companies a fixed reward for developing useful antibiotics, ( B ) of how many doses are eventually sold, so that the goal of protecting new drugs no longer conflicts with the goal of making a profit.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["regardless","because","instead","ahead"],"e":"提案の趣旨は、最終的な販売量と関係なく一定の報酬を払えば、新薬を温存するという目標と利益を上げるという目標が対立しなくなる、というものです。「〜に関係なく」の regardless of が正解です。because of を入れると「販売量のために」となり、販売量と報酬を切り離すという趣旨と逆になります。instead of、ahead of は文意が通りません。","m":"regardless of＝irrespective of＝～に関係なく"},{"id":28,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：opaque","p":"It is natural to assume that native speakers of English hold an advantage in international communication. They can express subtle ideas without searching for words. Yet researchers who study conversations among speakers from many countries have reported a surprising pattern: native speakers are sometimes the hardest participants to understand.\nThe reason lies partly in habits that native speakers rarely notice. They tend to speak quickly, to use idioms drawn from local culture, and to make jokes whose meaning depends on shared background. Non-native speakers, by contrast, often develop a simpler, more explicit style when talking with one another. They check whether they have been understood, rephrase difficult points, and avoid expressions that might be [opaque] to listeners from other regions. As a result, a meeting among people who all learned English as a second language may run more smoothly than one that includes a single native speaker.\nThis finding challenges the view that the goal of language learning is to sound as much like a native speaker as possible. If English is used mainly as a common tool among people with different first languages, then the measure of success may be ( A ) rather than accuracy in imitating any one national variety. A learner who speaks with a clear accent but adapts readily to different listeners may communicate better than one who has mastered every local idiom.\nNone of this means that standards no longer matter. Grammar that departs too far from shared norms can still cause misunderstanding, and learners preparing for certain careers may need a specific variety. ( B ), the research suggests that native speakers themselves may need to learn something: how to adjust their language for listeners who do not share their assumptions.","q":"次の英文を読み、下線部［opaque］の意味として最も適当なものを選びなさい。","c":["difficult to understand","likely to offend","very familiar","too formal"],"e":"opaque はもともと「不透明な」ですが、ここでは表現について「意味がわかりにくい」の意味です。非母語話者どうしは、理解されたかを確かめ、難しい点を言い換え、他の地域の聞き手には〜かもしれない表現を避ける、という流れで、前の段落の「母語話者は地域文化の慣用句を使う」とも対応しています。「不快にさせる」「なじみがある」「堅すぎる」では、理解しやすさを論じる段落に合いません。","m":"opaque⇔transparent（わかりやすい）"},{"id":29,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：intelligibility","p":"It is natural to assume that native speakers of English hold an advantage in international communication. They can express subtle ideas without searching for words. Yet researchers who study conversations among speakers from many countries have reported a surprising pattern: native speakers are sometimes the hardest participants to understand.\nThe reason lies partly in habits that native speakers rarely notice. They tend to speak quickly, to use idioms drawn from local culture, and to make jokes whose meaning depends on shared background. Non-native speakers, by contrast, often develop a simpler, more explicit style when talking with one another. They check whether they have been understood, rephrase difficult points, and avoid expressions that might be [opaque] to listeners from other regions. As a result, a meeting among people who all learned English as a second language may run more smoothly than one that includes a single native speaker.\nThis finding challenges the view that the goal of language learning is to sound as much like a native speaker as possible. If English is used mainly as a common tool among people with different first languages, then the measure of success may be ( A ) rather than accuracy in imitating any one national variety. A learner who speaks with a clear accent but adapts readily to different listeners may communicate better than one who has mastered every local idiom.\nNone of this means that standards no longer matter. Grammar that departs too far from shared norms can still cause misunderstanding, and learners preparing for certain careers may need a specific variety. ( B ), the research suggests that native speakers themselves may need to learn something: how to adjust their language for listeners who do not share their assumptions.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["intelligibility","authenticity","uniformity","speed"],"e":"英語が母語の異なる人々の共通の道具として使われるなら、成功の尺度は特定の国の英語をまねる正確さではなく「わかってもらえること」かもしれない、という主張です。直後の「なまりがあっても聞き手に合わせられる学習者のほうがよく伝わる」もこれを支えるので、intelligibility（理解されやすさ）が正解です。authenticity（本物らしさ）は母語話者らしさを目指す従来の見方に近く、文脈と逆です。uniformity（画一性）や speed（速さ）も本文の論点と合いません。","m":"intelligible＝理解できる（intelligent と区別）"},{"id":30,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：At the same time","p":"It is natural to assume that native speakers of English hold an advantage in international communication. They can express subtle ideas without searching for words. Yet researchers who study conversations among speakers from many countries have reported a surprising pattern: native speakers are sometimes the hardest participants to understand.\nThe reason lies partly in habits that native speakers rarely notice. They tend to speak quickly, to use idioms drawn from local culture, and to make jokes whose meaning depends on shared background. Non-native speakers, by contrast, often develop a simpler, more explicit style when talking with one another. They check whether they have been understood, rephrase difficult points, and avoid expressions that might be [opaque] to listeners from other regions. As a result, a meeting among people who all learned English as a second language may run more smoothly than one that includes a single native speaker.\nThis finding challenges the view that the goal of language learning is to sound as much like a native speaker as possible. If English is used mainly as a common tool among people with different first languages, then the measure of success may be ( A ) rather than accuracy in imitating any one national variety. A learner who speaks with a clear accent but adapts readily to different listeners may communicate better than one who has mastered every local idiom.\nNone of this means that standards no longer matter. Grammar that departs too far from shared norms can still cause misunderstanding, and learners preparing for certain careers may need a specific variety. ( B ), the research suggests that native speakers themselves may need to learn something: how to adjust their language for listeners who do not share their assumptions.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["At the same time","In short","For example","As a result"],"e":"空所の前では「基準が不要になったわけではない（文法の逸脱は誤解を生み、特定の英語が必要な人もいる）」と学習者側への留保を述べ、後では「母語話者自身も学ぶべきことがある」と別の観点を加えています。「その一方で・同時に」と別の面を示す At the same time が正解です。In short（要するに）はまとめ、For example は具体例、As a result は結果を導く表現で、どれも前後の関係に合いません。","m":"At the same time＝その一方で（譲歩・別の観点）"},{"id":31,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：Hardly ... when","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nHardly [had] the committee [announced] its decision [than] protests [broke out] across the country.","c":["than","had","announced","broke out"],"e":"「〜するとすぐに…した」は Hardly [Scarcely] had S p.p. when [before] S' V（過去形）で表します。than と組むのは No sooner had S p.p. than ... のほうなので、than を when か before に直す必要があります。Hardly が文頭に来ると倒置が起こるので had the committee announced は正しく、主節が過去完了、後半が過去形 broke out という時制の組み合わせも正しい形です。","m":"Hardly … when／No sooner … than"},{"id":32,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：受動態 be influenced","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nNot until the late twentieth century [did] most economists [begin] to take seriously the idea that [people's] choices [are often influencing] by emotion.","c":["are often influencing","did","begin","people's"],"e":"choices（選択）は感情に「影響される」側なので、受動態の are often influenced by emotion とすべきです。by emotion という行為者を示す句も受動態であることを示しています。Not until ～ が文頭に出ると主節は疑問文の語順に倒置されるので、did most economists begin は正しい形です。people's choices の所有格も正しい表現です。","m":"Not until ～ did S V＝～になって初めて"},{"id":33,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：despite の用法","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\n[Despite of] the heavy rain, the opening ceremony [was held] [as scheduled] [in] the open air.","c":["Despite of","was held","as scheduled","in"],"e":"despite は前置詞なので、後ろに直接名詞を置き、of は付けません。「〜にもかかわらず」は despite the heavy rain か in spite of the heavy rain とします。in spite of と混同して despite of とする誤りが狙われやすいポイントです。was held（開催された）、as scheduled（予定どおり）、in the open air（屋外で）はいずれも正しい表現です。","m":"despite＝in spite of（despite of は不可）"},{"id":34,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：a number of の一致","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nA number of [critical] questions [remains] unanswered, [despite] the [considerable] effort the researchers have made.","c":["remains","critical","despite","considerable"],"e":"A number of ～ は「いくつかの〜・多くの〜」の意味で、主語の中心は questions（複数）なので、動詞は remain とすべきです。The number of ～（〜の数）なら number が主語なので単数で受けますが、ここは a number of です。despite は前置詞として名詞 the effort を直接とっており正しく、critical や considerable も形容詞として正しく名詞を修飾しています。","m":"a number of＋複数動詞／the number of＋単数動詞"},{"id":35,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：懸垂分詞","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nHaving been raised [in] a bilingual household, [it was] easy for her [to switch] between the two languages [without] hesitation.","c":["it was","in","to switch","without"],"e":"分詞構文の意味上の主語は、原則として主節の主語と一致しなければなりません。「バイリンガルの家庭で育てられた」のは彼女なので、主節の主語を she にして she found it easy to switch ～ とする必要があります。it was のままでは it が育てられたことになってしまいます（懸垂分詞）。raised in a household（家庭で育つ）の in、easy for her to switch の不定詞、without hesitation（ためらわずに）はいずれも正しい表現です。","m":"分詞構文の主語＝主節の主語"},{"id":36,"k":"plan","ref":"想定問題","f":"文法・語法","t":"仮定法：Without ～","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\n( ) the support of his colleagues, the project would have failed long before its completion.","c":["Without","With","Unless","Except"],"e":"主節が would have failed（仮定法過去完了）なので、「もし〜がなかったら」という条件を表す Without が入ります（But for や If it had not been for と同じ意味）。With では「支援があったら失敗しただろう」となり意味が逆になります。Unless は接続詞なので、後ろに名詞だけでなく節が必要です。Except は「〜を除いて」で、条件の意味になりません。","m":"Without A＝But for A＝If it had not been for A"},{"id":37,"k":"plan","ref":"想定問題","f":"文法・語法","t":"仮定法現在：demand that","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe opposition party demanded that the full report ( ) published before the vote.","c":["be","being","to be","has been"],"e":"demand, insist, require, suggest など要求・提案を表す動詞の後の that 節では、動詞の原形（仮定法現在）か should＋原形を使います。主語が the full report で「公表される」という受動の意味なので be published が正解です。that 節には主語に対応する述語動詞が必要なので、分詞の being や不定詞の to be は入りません。has been は直説法の現在完了で、過去の要求の内容を表す that 節には使いません。","m":"要求・提案の that 節＝(should)＋原形"},{"id":38,"k":"plan","ref":"想定問題","f":"文法・語法","t":"so ～ that 構文","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe village is ( ) that it does not appear on most maps of the region.","c":["so small","such small","too small","very small"],"e":"「とても小さいので〜」は so＋形容詞＋that 節で表します。such は名詞を含む句と組むので、such a small village that ～ なら可能ですが、such small だけでは不可です。too ～ は that 節ではなく to 不定詞と組み（too small to appear ～）、very small that という形もありません。","m":"so＋形容詞＋that／such (a)＋形容詞＋名詞＋that"},{"id":39,"k":"plan","ref":"想定問題","f":"文法・語法","t":"仮定法：倒置 Had S p.p.","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nHad the government acted sooner, the economic crisis ( ) avoided.","c":["could have been","could be","can have been","had been"],"e":"文頭の Had the government acted は If the government had acted の if を省略した倒置で、過去の事実に反する仮定（仮定法過去完了）です。主節は助動詞の過去形＋have p.p. になるので could have been avoided が正解です。could be は現在の推量になり、時制が合いません。can have been は「〜したはずがある」という推量で、仮定法の主節には使いません。had been を入れると主節の形として成り立ちません。","m":"Had S p.p., S would/could have p.p."},{"id":40,"k":"plan","ref":"想定問題","f":"文法・語法","t":"前置詞＋関係代名詞","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe theory, ( ) he devoted the last decade of his life, was finally accepted by the scientific community.","c":["to which","which","in that","for what"],"e":"devote A to B（AをBにささげる）の B が先行詞 the theory にあたるので、前置詞 to を関係代名詞の前に置いた to which が正解です。which だけでは to が不足します。that は前置詞の直後に置けず、カンマの後の非制限用法にも使えません。what は先行詞を含む関係代名詞なので、the theory という先行詞があるこの文には使えません。","m":"devote A to B → to which"},{"id":41,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"ambiguous（あいまいな）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe minister's remarks were deliberately ( ), allowing supporters and critics alike to read into them whatever they wished.","c":["ambiguous","explicit","candid","concise"],"e":"支持者も批判者も「好きな意味を読み取れる」ようにした、という後半から、発言はわざと「あいまいな」ものだったとわかります。ambiguous が正解です。explicit（明確な）や candid（率直な）だと、解釈の余地がなくなるので後半と矛盾します。concise（簡潔な）は短さを表す語で、多様に解釈できることの説明にはなりません。","m":"ambiguous＝2通り以上に解釈できる"},{"id":42,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"cast doubt on","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe newly discovered documents ( ) doubt on the long-accepted account of the treaty's origins.","c":["cast","made","took","gave"],"e":"cast doubt on A で「Aに疑いを投げかける」というコロケーション（決まった語の組み合わせ）です。cast は過去形も cast なので、ここでは過去の意味で使われています。made、took、gave は doubt on とは結びつきません。ほかにも throw doubt on、raise doubts about などの言い方があります。","m":"cast doubt on＝～に疑問を投げかける"},{"id":43,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"hold water","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nHer argument sounds attractive, but it does not [hold water] once you examine the statistics.","c":["remain logically convincing","move people emotionally","attract public attention","follow the usual format"],"e":"hold water は「（理論・議論が）筋が通る・正しいと認められる」という意味のイディオムで、主に否定文で使います。統計を調べると議論が成り立たない、という文意なので「論理的に説得力を保つ」が正解です。水を入れても漏れない器のように、穴のない議論というイメージです。感情に訴える、注目を集める、形式に従う、はいずれも意味が違います。","m":"not hold water＝穴があって成り立たない"},{"id":44,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"attribute A to B","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nAnalysts ( ) the sharp rise in food prices to the poor harvest of the previous year.","c":["attributed","contributed","distributed","accounted"],"e":"attribute A to B で「AをBのせいにする・Aの原因をBに帰する」です。価格の高騰の原因を不作に帰した、という意味になります。contribute A to B は「AをBに寄付・貢献する」、distribute A to B は「AをBに配る」で文意に合いません。account は account for A（Aを説明する）の形で使い、account A to B という形はありません。","m":"attribute A to B＝AをBのせいにする"},{"id":45,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"in the absence of","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nIn the ( ) of reliable evidence, the court had no choice but to dismiss the case.","c":["absence","vacancy","emptiness","omission"],"e":"in the absence of A で「Aがないので・Aがない場合に」という決まった表現です。信頼できる証拠がないので裁判所は訴えを退けるしかなかった、という意味になります。vacancy（空席・空室）、emptiness（空っぽであること）、omission（省略・脱落）はいずれも「〜がない」に通じる語ですが、in the ～ of の形で「〜がないので」という意味にはなりません。lack を使うなら for lack of A という形になります。","m":"in the absence of＝～がないので"},{"id":46,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"shelve（棚上げする）","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nFacing strong opposition, the committee decided to [shelve] the redevelopment plan for the time being.","c":["postpone consideration of","put into practice","reject permanently","announce publicly"],"e":"shelve は「棚に置く」から転じて「（計画などを）棚上げする・先送りする」の意味です。for the time being（当分の間）という語句とも合い、「検討を延期する」が正解です。put into practice（実行する）は逆の意味です。reject permanently（永久に却下する）は、一時的な保留という shelve の意味とずれます。announce publicly（公表する）も違います。","m":"shelve＝put off＝棚上げ"},{"id":47,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"indispensable（不可欠な）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nHer contribution to the project was ( ); without it, nothing of value would have been achieved.","c":["indispensable","negligible","superficial","redundant"],"e":"後半の「それがなければ価値あることは何も達成されなかっただろう」から、貢献は「不可欠な」ものだったとわかります。indispensable が正解です。negligible（無視できるほど小さい）、superficial（表面的な）、redundant（余分な）はいずれも貢献を低く評価する語で、後半と矛盾します。","m":"indispensable＝essential＝なくてはならない"},{"id":48,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"undermine（むしばむ）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe series of scandals seriously ( ) public trust in the government.","c":["undermined","underwent","understated","undertook"],"e":"undermine は「（信頼・権威などを）徐々に損なう・むしばむ」で、trust を目的語にとるのに最も適しています。一連のスキャンダルが政府への信頼を大きく損なった、という意味です。underwent（undergo：経験する・受ける）、understated（understate：控えめに言う）、undertook（undertake：引き受ける）は、いずれも under- で始まる紛らわしい語ですが、文意に合いません。","m":"undermine＝徐々に弱める"},{"id":49,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"come to terms with","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nIt took him several years to [come to terms with] the failure of his first company.","c":["accept","forget","explain","repeat"],"e":"come to terms with A は「A（つらい現実など）を受け入れる・Aと折り合いをつける」という意味のイディオムです。最初の会社の失敗を受け入れるのに数年かかった、という意味なので accept が最も近い意味です。forget（忘れる）は受け入れるのとは違い、explain（説明する）や repeat（繰り返す）も意味が違います。","m":"come to terms with＝受け入れる・折り合う"},{"id":50,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"abstruse（難解な）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe professor's lecture was so ( ) that even specialists in the field struggled to follow it.","c":["abstruse","lucid","trivial","brief"],"e":"so ～ that 構文で「専門家でさえついていくのに苦労した」と続くので、講義は「難解な」ものだったはずです。abstruse（難解な）が正解です。lucid（明快な）は逆の意味です。trivial（ささいな）や brief（短い）では、専門家が苦労する理由になりません。abstruse は難度の高い語なので、obscure（わかりにくい）とあわせて覚えておきましょう。","m":"abstruse⇔lucid（明快な）"},{"id":51,"k":"plan","ref":"想定問題","f":"会話文","t":"ゼミ前の会話：同意して理由を述べる","p":"Kenta: Did you finish the reading for tomorrow's seminar?\nMaya: Most of it. The chapter on urban planning was heavy going, though.\nKenta: Tell me about it. ( 1 ) I had to read some paragraphs three times.\nMaya: Same here. But I think the main argument is that cities should be designed around people, not cars.\nKenta: Right. Although I'm not sure I buy it entirely. ( 2 )\nMaya: That's a fair point. Rural areas would need a different approach.\nKenta: Exactly. Anyway, do you want to meet up before the seminar to compare notes?\nMaya: ( 3 ) How about the library café at ten?\nKenta: Perfect. See you there.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["The author's style isn't exactly reader-friendly.","I finished it in about ten minutes.","I haven't even opened the book yet.","The chapter was surprisingly light reading."],"e":"Maya が「都市計画の章は読むのが大変だった（heavy going）」と言い、Kenta は Tell me about it.（まったくだよ）と同意しています。空所の後で「段落によっては3回読まなければならなかった」と続くので、「著者の文体は読み手に優しいとは言えない」が入ります。「10分で読み終えた」「軽い読み物だった」は同意の内容と矛盾し、「まだ本を開いてもいない」は3回読んだという発言と矛盾します。","m":"Tell me about it.＝まったくだ（同意）"},{"id":52,"k":"plan","ref":"想定問題","f":"会話文","t":"ゼミ前の会話：反論の提示","p":"Kenta: Did you finish the reading for tomorrow's seminar?\nMaya: Most of it. The chapter on urban planning was heavy going, though.\nKenta: Tell me about it. ( 1 ) I had to read some paragraphs three times.\nMaya: Same here. But I think the main argument is that cities should be designed around people, not cars.\nKenta: Right. Although I'm not sure I buy it entirely. ( 2 )\nMaya: That's a fair point. Rural areas would need a different approach.\nKenta: Exactly. Anyway, do you want to meet up before the seminar to compare notes?\nMaya: ( 3 ) How about the library café at ten?\nKenta: Perfect. See you there.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["What about people who live where there's no public transport?","Cars are becoming more expensive every year.","I've never actually been to a big city.","The author is a famous architect, isn't she?"],"e":"Kenta は「全面的には賛成できない（I'm not sure I buy it）」と述べ、Maya が「もっともな指摘ね。地方では違うやり方が必要でしょうね」と応じています。したがって空所には、車中心でない都市設計が当てはまらない例として「公共交通機関がない所に住む人はどうなの？」が入ります。車の値段や大都市に行った経験、著者の職業は、地方では違うやり方が必要という Maya の返答につながりません。","m":"buy＝（意見を）受け入れる、That's a fair point.＝もっともだ"},{"id":53,"k":"plan","ref":"想定問題","f":"会話文","t":"ゼミ前の会話：誘いへの応答","p":"Kenta: Did you finish the reading for tomorrow's seminar?\nMaya: Most of it. The chapter on urban planning was heavy going, though.\nKenta: Tell me about it. ( 1 ) I had to read some paragraphs three times.\nMaya: Same here. But I think the main argument is that cities should be designed around people, not cars.\nKenta: Right. Although I'm not sure I buy it entirely. ( 2 )\nMaya: That's a fair point. Rural areas would need a different approach.\nKenta: Exactly. Anyway, do you want to meet up before the seminar to compare notes?\nMaya: ( 3 ) How about the library café at ten?\nKenta: Perfect. See you there.","q":"次の会話文を読み、空所（3）に入れるのに最も適当なものを選びなさい。","c":["Sounds good.","I'm afraid I can't make it.","No, I've already compared them.","That's none of your business."],"e":"Kenta が「ゼミの前に会ってノートを比べないか」と誘い、Maya は空所の後で「10時に図書館のカフェはどう？」と具体的な時間と場所を提案しています。誘いを受け入れる Sounds good. が正解です。「都合がつかない」「もう比べた」と断ったあとに待ち合わせを提案するのは不自然です。「あなたには関係ない」は失礼なうえ、文脈にも合いません。","m":"Sounds good.＝いいね（誘いへの承諾）"},{"id":54,"k":"plan","ref":"想定問題","f":"会話文","t":"取引交渉：感想を尋ねる","p":"Client: Thank you for sending the revised proposal. My team has gone through it carefully.\nSupplier: I'm glad to hear that. ( 1 )\nClient: On the whole, yes. The design is excellent. The problem is the delivery schedule. Six weeks is longer than we can afford.\nSupplier: I see. ( 2 ) If we bring in additional staff, we could probably cut it to four weeks, but that would add about ten percent to the cost.\nClient: Hmm, that's a significant increase. Is there any room for compromise?\nSupplier: Well, if you could accept delivery in two stages, say half the order in four weeks and the rest in six, ( 3 )\nClient: That might work. Let me discuss it with my team and get back to you.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["Did it meet your expectations?","When will you send us the payment?","Why did you reject it so quickly?","Have you received it yet?"],"e":"直後に顧客が On the whole, yes.（全体としてはそうです）と答え、デザインは優れているが納期が問題だと続けています。したがって「ご期待に沿えましたか」と評価を尋ねる質問が入ります。冒頭で顧客が「丁寧に検討した」と言っているので、「もう受け取りましたか」「なぜすぐ却下したのか」は不自然です。支払いの時期を尋ねる質問には yes で答えられません。","m":"On the whole＝全体として（一部に不満あり）"},{"id":55,"k":"plan","ref":"想定問題","f":"会話文","t":"取引交渉：対応を約束する","p":"Client: Thank you for sending the revised proposal. My team has gone through it carefully.\nSupplier: I'm glad to hear that. ( 1 )\nClient: On the whole, yes. The design is excellent. The problem is the delivery schedule. Six weeks is longer than we can afford.\nSupplier: I see. ( 2 ) If we bring in additional staff, we could probably cut it to four weeks, but that would add about ten percent to the cost.\nClient: Hmm, that's a significant increase. Is there any room for compromise?\nSupplier: Well, if you could accept delivery in two stages, say half the order in four weeks and the rest in six, ( 3 )\nClient: That might work. Let me discuss it with my team and get back to you.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["Let me see what we can do.","I'm afraid that's out of the question.","Then we'll cancel the order.","You should have told us earlier."],"e":"納期が長すぎるという指摘を受け、供給側は空所の後で「追加の人員を入れれば4週間に短縮できる」と解決策を示しています。「何ができるか検討させてください」が自然な流れです。「それは論外です」「では注文を取り消します」と言った直後に短縮案を出すのは矛盾します。「もっと早く言うべきだった」は相手を責める言い方で、そのまま提案に移る流れに合いません。","m":"Let me see what we can do.＝検討してみます"},{"id":56,"k":"plan","ref":"想定問題","f":"会話文","t":"取引交渉：妥協案","p":"Client: Thank you for sending the revised proposal. My team has gone through it carefully.\nSupplier: I'm glad to hear that. ( 1 )\nClient: On the whole, yes. The design is excellent. The problem is the delivery schedule. Six weeks is longer than we can afford.\nSupplier: I see. ( 2 ) If we bring in additional staff, we could probably cut it to four weeks, but that would add about ten percent to the cost.\nClient: Hmm, that's a significant increase. Is there any room for compromise?\nSupplier: Well, if you could accept delivery in two stages, say half the order in four weeks and the rest in six, ( 3 )\nClient: That might work. Let me discuss it with my team and get back to you.","q":"次の会話文を読み、空所（3）に入れるのに最も適当なものを選びなさい。","c":["we could keep the price as it is.","we would need to raise the price by twenty percent.","we could not deliver anything for six weeks.","you would have to find another supplier."],"e":"顧客は「10%の値上げは大きい。妥協の余地はないか」と尋ねています。供給側が「2回に分けて納品してよければ」と条件を出しているので、その見返りとして「価格は据え置ける」が入ります。顧客も That might work.（それなら何とかなりそうだ）と前向きに応じています。20%の値上げや6週間何も届かない案、他社を探せという返答は妥協案にならず、顧客の反応とも合いません。","m":"if you could ～, we could ～＝条件付きの譲歩"},{"id":57,"k":"plan","ref":"想定問題","f":"会話文","t":"ボランティアの会話：期間を尋ねる","p":"Aya: You look exhausted. Rough day?\nBen: Kind of. I spent the whole afternoon at the food bank sorting donations.\nAya: I didn't know you volunteered there. ( 1 )\nBen: About a year now. It started as a class assignment, but I kept going.\nAya: That's impressive. I've been meaning to do something like that, but I never seem to find the time.\nBen: ( 2 ) They're always short of people on weekend mornings, and it's only a couple of hours.\nAya: Maybe I'll give it a try.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["How long have you been doing that?","Why did you decide to quit?","How much do they pay you?","When is it going to open?"],"e":"空所の直後で Ben が「もう1年くらいになる（About a year now.）」と期間を答えているので、継続期間を尋ねる How long have you been doing that? が正解です。Ben は今日も活動しており、続けている（I kept going）ので、「なぜやめたのか」は誤りです。ボランティアなので給料の質問は不自然です。フードバンクはすでに活動しているので、「いつ開くのか」も合いません。","m":"How long have you been ～ing?→期間で答える"},{"id":58,"k":"plan","ref":"想定問題","f":"会話文","t":"ボランティアの会話：誘う","p":"Aya: You look exhausted. Rough day?\nBen: Kind of. I spent the whole afternoon at the food bank sorting donations.\nAya: I didn't know you volunteered there. ( 1 )\nBen: About a year now. It started as a class assignment, but I kept going.\nAya: That's impressive. I've been meaning to do something like that, but I never seem to find the time.\nBen: ( 2 ) They're always short of people on weekend mornings, and it's only a couple of hours.\nAya: Maybe I'll give it a try.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["Why not come along with me this Saturday?","Then you'd better stay away from it.","I don't blame you. It's a waste of time.","They don't take any new volunteers."],"e":"Aya は「やりたいと思っているが時間が見つからない」と言っています。Ben は空所の後で「週末の朝はいつも人手不足だし、2時間くらいだけだ」と、気軽に参加できることを伝えています。「今週の土曜に一緒に来ない？」と誘う表現が入り、Aya の「やってみようかな」にもつながります。「近づかないほうがいい」「時間の無駄だ」「新しいボランティアは受け入れていない」は、どれも後の流れと矛盾します。","m":"Why not ～?＝～してはどう？（勧誘）"},{"id":59,"k":"plan","ref":"想定問題","f":"会話文","t":"図書館での会話：状況の説明","p":"Student: Excuse me. I'm looking for a book that's listed in the catalog, but it isn't on the shelf.\nLibrarian: Let me check. It says here that it was returned yesterday afternoon, so ( 1 )\nStudent: I see. Could you let me know when it's available? I need it for a paper due on Friday.\nLibrarian: Certainly. But ( 2 ) There's an electronic version you can read on the library website.\nStudent: Oh, that's even better. Thank you so much.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["it may not have been put back on the shelf yet.","it has been missing for several months.","you'll have to wait until next year.","you must have borrowed it yourself."],"e":"司書は「昨日の午後に返却された」と確認し、so（だから）で結論を続けています。返却されたばかりなので「まだ棚に戻されていないのかもしれない」が自然です。may not have p.p. は「〜していないかもしれない」という過去の推量です。「数か月行方不明」は昨日返却されたことと矛盾します。「来年まで待つ」は理由がつながらず、「あなた自身が借りたに違いない」も根拠がありません。","m":"may not have p.p.＝～しなかったかもしれない"},{"id":60,"k":"plan","ref":"想定問題","f":"会話文","t":"図書館での会話：代案の提示","p":"Student: Excuse me. I'm looking for a book that's listed in the catalog, but it isn't on the shelf.\nLibrarian: Let me check. It says here that it was returned yesterday afternoon, so ( 1 )\nStudent: I see. Could you let me know when it's available? I need it for a paper due on Friday.\nLibrarian: Certainly. But ( 2 ) There's an electronic version you can read on the library website.\nStudent: Oh, that's even better. Thank you so much.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["you may not need to wait at all.","I'm afraid you're out of luck.","you should choose a different topic.","the book can't be read anywhere else."],"e":"空所の後で司書は「図書館のウェブサイトで読める電子版がある」と代わりの方法を示し、学生も「そのほうがいい」と喜んでいます。したがって「待つ必要はまったくないかもしれません」が入ります。But で始まり、知らせを待つという前の話から流れを変えている点もヒントです。「運が悪い」「テーマを変えるべき」「ほかでは読めない」は、電子版があるという直後の発言と矛盾します。","m":"Alternatively／But ～＝代案を出す合図"}];
var FIELDS=["長文読解（内容一致）","長文読解（語句・空所・言い換え）","文法・語法","語彙・イディオム","会話文"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="waseda-eigo-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.k==="past"?"過去問ベース：早稲田大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（早稲田大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+"abcde".charAt(j)+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+KIND[q.k]+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+KIND[q.k]+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

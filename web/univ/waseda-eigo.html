。","m":"engage＝（注意・関心を）引きつける"},{"id":77,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：foster","p":"Boredom has a poor reputation. It is usually treated as an unpleasant state to be escaped as quickly as possible, and modern technology makes escape easy: a phone in one's pocket offers an endless supply of distraction. Psychologists, however, have begun to ask whether boredom might serve a useful purpose.\nOne proposal is that boredom works like a signal. Just as pain warns us that something is wrong with the body, boredom tells us that our current activity is failing to ( A ) us, and pushes us to look for something more meaningful. On this view, the problem is not boredom itself but the way we respond to it. If we immediately reach for a screen, we silence the signal without acting on its message.\nSome experiments suggest that boredom can also [foster] creativity. In one kind of study, participants first complete a dull task, such as copying numbers from a list, and are then asked to think of as many uses as possible for an ordinary object, such as a paper cup. Those who had been bored often produce more, and more unusual, ideas than those who skipped the dull task. Researchers suggest that when the outside world offers little stimulation, the mind begins to wander, and wandering thoughts can form unexpected connections.\nThe evidence is not yet ( B ). Some attempts to repeat such experiments have found weaker effects, and chronic boredom, which some people experience day after day, is linked to unhappiness rather than inspiration. Nevertheless, the research invites us to reconsider the habit of filling every idle moment. A few minutes without input may be less a waste of time than an opportunity.","q":"次の英文を読み、下線部［foster］に最も意味が近いものを選びなさい。","c":["encourage","prevent","measure","replace"],"e":"直後に、退屈な作業をした人のほうが紙コップの使い道を多く、しかも独創的に思いついたという実験が紹介されています。つまり退屈が創造性を「育てる・促す」ということで、foster は encourage に近い意味です。prevent（妨げる）は実験結果と逆です。measure（測る）や replace（取って代わる）では、退屈と創造性の関係を述べる文になりません。","m":"foster＝育てる・促進する（＝promote）"},{"id":78,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：not yet conclusive","p":"Boredom has a poor reputation. It is usually treated as an unpleasant state to be escaped as quickly as possible, and modern technology makes escape easy: a phone in one's pocket offers an endless supply of distraction. Psychologists, however, have begun to ask whether boredom might serve a useful purpose.\nOne proposal is that boredom works like a signal. Just as pain warns us that something is wrong with the body, boredom tells us that our current activity is failing to ( A ) us, and pushes us to look for something more meaningful. On this view, the problem is not boredom itself but the way we respond to it. If we immediately reach for a screen, we silence the signal without acting on its message.\nSome experiments suggest that boredom can also [foster] creativity. In one kind of study, participants first complete a dull task, such as copying numbers from a list, and are then asked to think of as many uses as possible for an ordinary object, such as a paper cup. Those who had been bored often produce more, and more unusual, ideas than those who skipped the dull task. Researchers suggest that when the outside world offers little stimulation, the mind begins to wander, and wandering thoughts can form unexpected connections.\nThe evidence is not yet ( B ). Some attempts to repeat such experiments have found weaker effects, and chronic boredom, which some people experience day after day, is linked to unhappiness rather than inspiration. Nevertheless, the research invites us to reconsider the habit of filling every idle moment. A few minutes without input may be less a waste of time than an opportunity.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["conclusive","collected","irrelevant","harmful"],"e":"直後に「同じ実験を繰り返すと効果が弱かった例もある」「慢性的な退屈は不幸と結びつく」と、前段の主張を弱める事実が続きます。したがって「証拠はまだ決定的ではない」となる conclusive が正解です。collected（集められた）を入れると、すでに実験が行われている本文と矛盾します。irrelevant（無関係な）や harmful（有害な）は、続く内容とつながりません。","m":"conclusive＝決定的な（evidence と相性がよい）"},{"id":79,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：allow O to do","p":"Complaints about information overload are often treated as a uniquely modern problem, a side effect of the internet and the smartphone. Historians of the book, however, point out that similar complaints were heard soon after printing spread across fifteenth-century Europe. Before printing, books were copied by hand, and even a wealthy scholar might own only a few dozen. Within a few generations of the first presses, the number of available titles had multiplied, and scholars began to worry that no one could read everything worth knowing.\nTheir response was not to stop reading but to invent new tools for managing texts. Printers added tables of contents and alphabetical indexes so that readers could find what they needed without reading a book from beginning to end. Scholars compiled huge reference works that collected extracts from many authors, ( A ) readers to consult a single volume instead of a whole library. Some kept notebooks in which they copied useful passages under headings, creating personal systems of retrieval.\nThese techniques changed how people read. Reading had once meant slow, repeated study of a small number of texts; it increasingly came to include rapid searching and selective consultation. Critics at the time complained that readers were becoming [superficial], gathering fragments without grasping whole arguments. ( B ), defenders argued that no one could master the expanding world of learning without such shortcuts.\nThe parallel with our own era is striking. Search engines and digital summaries are, in a sense, descendants of the index and the reference book, and the debate about whether they make us shallower echoes a debate of five centuries ago. History suggests that each flood of information produces both anxiety and invention.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["allowing","forbidding","warning","reminding"],"e":"学者たちは多くの著者の抜粋を集めた大部の参考書を編み、それが「読者が図書館全体ではなく一冊を調べれば済むようにした」という文脈です。〈allow O to do〉（Oが～できるようにする）の分詞構文 allowing が正解です。forbidding（禁じる）では情報を扱いやすくする工夫という段落の趣旨と逆になります。warning（警告する）や reminding（思い出させる）も to do を続けられますが、意味が通りません。","m":"allow O to do＝Oが～できるようにする"},{"id":80,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：superficial","p":"Complaints about information overload are often treated as a uniquely modern problem, a side effect of the internet and the smartphone. Historians of the book, however, point out that similar complaints were heard soon after printing spread across fifteenth-century Europe. Before printing, books were copied by hand, and even a wealthy scholar might own only a few dozen. Within a few generations of the first presses, the number of available titles had multiplied, and scholars began to worry that no one could read everything worth knowing.\nTheir response was not to stop reading but to invent new tools for managing texts. Printers added tables of contents and alphabetical indexes so that readers could find what they needed without reading a book from beginning to end. Scholars compiled huge reference works that collected extracts from many authors, ( A ) readers to consult a single volume instead of a whole library. Some kept notebooks in which they copied useful passages under headings, creating personal systems of retrieval.\nThese techniques changed how people read. Reading had once meant slow, repeated study of a small number of texts; it increasingly came to include rapid searching and selective consultation. Critics at the time complained that readers were becoming [superficial], gathering fragments without grasping whole arguments. ( B ), defenders argued that no one could master the expanding world of learning without such shortcuts.\nThe parallel with our own era is striking. Search engines and digital summaries are, in a sense, descendants of the index and the reference book, and the debate about whether they make us shallower echoes a debate of five centuries ago. History suggests that each flood of information produces both anxiety and invention.","q":"次の英文を読み、下線部［superficial］の意味として最も適当なものを選びなさい。","c":["lacking depth of understanding","too critical of authors","unwilling to read new books","dependent on their teachers"],"e":"直後の分詞句 gathering fragments without grasping whole arguments（議論全体をつかまずに断片を集めている）が superficial の中身を説明しています。したがって「理解の深さに欠ける」が正解です。「著者に批判的すぎる」「新しい本を読みたがらない」「教師に頼りきり」は、断片的な読み方への批判という文脈と関係がありません。最終段落の shallower（より浅い）とも対応しています。","m":"superficial＝表面的な（⇔ profound）"},{"id":81,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：In reply","p":"Complaints about information overload are often treated as a uniquely modern problem, a side effect of the internet and the smartphone. Historians of the book, however, point out that similar complaints were heard soon after printing spread across fifteenth-century Europe. Before printing, books were copied by hand, and even a wealthy scholar might own only a few dozen. Within a few generations of the first presses, the number of available titles had multiplied, and scholars began to worry that no one could read everything worth knowing.\nTheir response was not to stop reading but to invent new tools for managing texts. Printers added tables of contents and alphabetical indexes so that readers could find what they needed without reading a book from beginning to end. Scholars compiled huge reference works that collected extracts from many authors, ( A ) readers to consult a single volume instead of a whole library. Some kept notebooks in which they copied useful passages under headings, creating personal systems of retrieval.\nThese techniques changed how people read. Reading had once meant slow, repeated study of a small number of texts; it increasingly came to include rapid searching and selective consultation. Critics at the time complained that readers were becoming [superficial], gathering fragments without grasping whole arguments. ( B ), defenders argued that no one could master the expanding world of learning without such shortcuts.\nThe parallel with our own era is striking. Search engines and digital summaries are, in a sense, descendants of the index and the reference book, and the debate about whether they make us shallower echoes a debate of five centuries ago. History suggests that each flood of information produces both anxiety and invention.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["In reply","For example","Similarly","In addition"],"e":"前の文は批判者の不満（読者が表面的になっている）、空所の後は擁護者の反論（そうした近道なしには学問を修められない）です。批判に対して応じる流れなので「それに答えて」の In reply が入ります。For example は具体例を導く語で、反論の前には置けません。Similarly（同様に）や In addition（さらに）は同じ方向の内容を続ける語なので、対立する二つの立場をつなぐのに合いません。","m":"批判 → In reply → 反論"},{"id":82,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：vulnerable to","p":"When a species is carried by humans to a region where it did not previously live, it usually fails to survive. Occasionally, however, a newcomer thrives, spreads rapidly and causes serious harm to the plants and animals already there. Such species are called invasive, and they are considered one of the leading threats to biodiversity worldwide.\nIslands have been especially ( A ) to invasions. Many island birds evolved without ground-dwelling predators and therefore never developed the habit of fleeing or nesting out of reach. When rats, cats or snakes arrived on ships, these birds had no defense, and a number of species were wiped out within a few decades.\nOne reason invaders can be so successful is that they leave their natural enemies behind. In its native range, a plant may be kept in check by insects and diseases that have evolved alongside it. In a new environment, free from these pressures, it may grow faster and produce more seeds than any local competitor. This insight has led to biological control: the deliberate release of an invader's natural enemy to [curb] its spread.\nBiological control, however, carries risks of its own. In several notorious cases, an animal introduced to control a pest ignored its intended target and attacked native species instead, creating a second invasion on top of the first. Today, candidates for release are tested extensively to confirm that they feed only on the target species. Prevention is still regarded as far cheaper than cure. Inspecting cargo, cleaning ships and restricting the trade in risky species cost little ( B ) the expense of trying to remove an invader once it has become established.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["vulnerable","resistant","indifferent","accustomed"],"e":"続く文で、島の鳥は地上の捕食者のいない環境で進化したため逃げる習性がなく、船でネズミやネコが来ると身を守れず、数十年で絶滅した種もあると説明しています。島は外来種の侵入に「弱い」ので vulnerable to が正解です。resistant（抵抗力がある）は逆の意味です。indifferent（無関心な）は意味が合わず、accustomed to（慣れている）も、防御手段がなかったという説明と矛盾します。","m":"be vulnerable to ～＝～に弱い・さらされやすい"},{"id":83,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：curb","p":"When a species is carried by humans to a region where it did not previously live, it usually fails to survive. Occasionally, however, a newcomer thrives, spreads rapidly and causes serious harm to the plants and animals already there. Such species are called invasive, and they are considered one of the leading threats to biodiversity worldwide.\nIslands have been especially ( A ) to invasions. Many island birds evolved without ground-dwelling predators and therefore never developed the habit of fleeing or nesting out of reach. When rats, cats or snakes arrived on ships, these birds had no defense, and a number of species were wiped out within a few decades.\nOne reason invaders can be so successful is that they leave their natural enemies behind. In its native range, a plant may be kept in check by insects and diseases that have evolved alongside it. In a new environment, free from these pressures, it may grow faster and produce more seeds than any local competitor. This insight has led to biological control: the deliberate release of an invader's natural enemy to [curb] its spread.\nBiological control, however, carries risks of its own. In several notorious cases, an animal introduced to control a pest ignored its intended target and attacked native species instead, creating a second invasion on top of the first. Today, candidates for release are tested extensively to confirm that they feed only on the target species. Prevention is still regarded as far cheaper than cure. Inspecting cargo, cleaning ships and restricting the trade in risky species cost little ( B ) the expense of trying to remove an invader once it has become established.","q":"次の英文を読み、下線部［curb］に最も意味が近いものを選びなさい。","c":["restrain","encourage","observe","explain"],"e":"生物的防除とは、外来種の天敵をわざと放して、その広がりを「抑える」ことです。直前の段落の kept in check（抑えられている）とも対応しており、curb は restrain（抑制する）に近い意味です。encourage（促す）は逆の意味です。observe（観察する）や explain（説明する）では、天敵を放つ目的になりません。","m":"curb＝抑える（＝restrain, check）"},{"id":84,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：compared with","p":"When a species is carried by humans to a region where it did not previously live, it usually fails to survive. Occasionally, however, a newcomer thrives, spreads rapidly and causes serious harm to the plants and animals already there. Such species are called invasive, and they are considered one of the leading threats to biodiversity worldwide.\nIslands have been especially ( A ) to invasions. Many island birds evolved without ground-dwelling predators and therefore never developed the habit of fleeing or nesting out of reach. When rats, cats or snakes arrived on ships, these birds had no defense, and a number of species were wiped out within a few decades.\nOne reason invaders can be so successful is that they leave their natural enemies behind. In its native range, a plant may be kept in check by insects and diseases that have evolved alongside it. In a new environment, free from these pressures, it may grow faster and produce more seeds than any local competitor. This insight has led to biological control: the deliberate release of an invader's natural enemy to [curb] its spread.\nBiological control, however, carries risks of its own. In several notorious cases, an animal introduced to control a pest ignored its intended target and attacked native species instead, creating a second invasion on top of the first. Today, candidates for release are tested extensively to confirm that they feed only on the target species. Prevention is still regarded as far cheaper than cure. Inspecting cargo, cleaning ships and restricting the trade in risky species cost little ( B ) the expense of trying to remove an invader once it has become established.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["compared with","in addition to","as well as","instead of"],"e":"直前の文で「予防は駆除よりはるかに安い」と述べ、具体的に「積み荷の検査などの費用は、定着した外来種を取り除く費用と比べればわずかだ」と続けています。比較の基準を示す compared with が正解です。in addition to や as well as（～に加えて）を入れると、予防の費用が駆除の費用に上乗せされる意味になり、主張と合いません。instead of（～の代わりに）では cost little とつながりません。","m":"A cost little compared with B＝Bに比べAは安い"},{"id":85,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：economical","p":"Lists of \"untranslatable\" words circulate widely. They typically include a term from another language that supposedly has no equivalent in English, such as a word for the pleasure of reading in bed or for sunlight filtering through leaves. Such lists are entertaining, but translators often find the idea behind them misleading.\nThe claim that a word is untranslatable usually means only that English has no single word with the same meaning. Yet translation has never been a matter of replacing words one by one. A skilled translator can convey the meaning of a compact foreign term with a phrase, a sentence or a carefully chosen context. Something may be lost in style, since a single word is more ( A ) than a long explanation, but the idea itself can be communicated.\nA more serious difficulty lies elsewhere. Every language makes some distinctions [obligatory]. Some languages require speakers to mark whether they saw an event themselves or heard about it from someone else; others require a choice between formal and informal forms of \"you.\" When translating from a language that does not mark such a distinction into one that does, the translator is forced to make a decision the original author never made. It is these hidden choices, rather than exotic vocabulary, that make translation genuinely hard.\nSome writers go further and claim that because languages divide experience differently, their speakers live in different mental worlds. Most linguists today accept only a weak version of this idea. Language may make certain distinctions easier to notice or remember, but it does not ( B ) speakers from understanding concepts for which their language lacks a word. If it did, explaining an \"untranslatable\" word would be impossible, and the lists themselves could not exist.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["economical","tedious","clumsy","repetitive"],"e":"訳者は外国語の短い一語の意味を句や文で伝えられるが、「一語のほうが長い説明より（ A ）なので、文体の面では何かが失われるかもしれない」という文脈です。一語の利点を表す語が必要なので、「むだがない・簡潔な」の economical が正解です。tedious（退屈な）、clumsy（ぎこちない）、repetitive（繰り返しの多い）は、むしろ長い説明の欠点にあたる語で、一語のほうがそうだとすると、失われるものがあるという流れになりません。","m":"economical＝（言葉に）むだがない"},{"id":86,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：obligatory","p":"Lists of \"untranslatable\" words circulate widely. They typically include a term from another language that supposedly has no equivalent in English, such as a word for the pleasure of reading in bed or for sunlight filtering through leaves. Such lists are entertaining, but translators often find the idea behind them misleading.\nThe claim that a word is untranslatable usually means only that English has no single word with the same meaning. Yet translation has never been a matter of replacing words one by one. A skilled translator can convey the meaning of a compact foreign term with a phrase, a sentence or a carefully chosen context. Something may be lost in style, since a single word is more ( A ) than a long explanation, but the idea itself can be communicated.\nA more serious difficulty lies elsewhere. Every language makes some distinctions [obligatory]. Some languages require speakers to mark whether they saw an event themselves or heard about it from someone else; others require a choice between formal and informal forms of \"you.\" When translating from a language that does not mark such a distinction into one that does, the translator is forced to make a decision the original author never made. It is these hidden choices, rather than exotic vocabulary, that make translation genuinely hard.\nSome writers go further and claim that because languages divide experience differently, their speakers live in different mental worlds. Most linguists today accept only a weak version of this idea. Language may make certain distinctions easier to notice or remember, but it does not ( B ) speakers from understanding concepts for which their language lacks a word. If it did, explaining an \"untranslatable\" word would be impossible, and the lists themselves could not exist.","q":"次の英文を読み、下線部［obligatory］に最も意味が近いものを選びなさい。","c":["compulsory","optional","occasional","artificial"],"e":"直後に「目撃したか伝聞かの区別を話者に求める（require）言語」「敬称と親称の you の選択を求める言語」が例として挙げられています。つまり、その言語では区別することが「義務的・必須」であり、obligatory は compulsory に近い意味です。optional（任意の）は逆の意味です。occasional（時々の）や artificial（人工的な）は、require を用いた具体例と対応しません。","m":"obligatory＝義務的な（⇔ optional）"},{"id":87,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：prevent O from -ing","p":"Lists of \"untranslatable\" words circulate widely. They typically include a term from another language that supposedly has no equivalent in English, such as a word for the pleasure of reading in bed or for sunlight filtering through leaves. Such lists are entertaining, but translators often find the idea behind them misleading.\nThe claim that a word is untranslatable usually means only that English has no single word with the same meaning. Yet translation has never been a matter of replacing words one by one. A skilled translator can convey the meaning of a compact foreign term with a phrase, a sentence or a carefully chosen context. Something may be lost in style, since a single word is more ( A ) than a long explanation, but the idea itself can be communicated.\nA more serious difficulty lies elsewhere. Every language makes some distinctions [obligatory]. Some languages require speakers to mark whether they saw an event themselves or heard about it from someone else; others require a choice between formal and informal forms of \"you.\" When translating from a language that does not mark such a distinction into one that does, the translator is forced to make a decision the original author never made. It is these hidden choices, rather than exotic vocabulary, that make translation genuinely hard.\nSome writers go further and claim that because languages divide experience differently, their speakers live in different mental worlds. Most linguists today accept only a weak version of this idea. Language may make certain distinctions easier to notice or remember, but it does not ( B ) speakers from understanding concepts for which their language lacks a word. If it did, explaining an \"untranslatable\" word would be impossible, and the lists themselves could not exist.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["prevent","protect","release","derive"],"e":"言語は区別を気づきやすくするかもしれないが、「話者が、自分の言語に語のない概念を理解するのを妨げはしない」という文脈です。〈prevent O from -ing〉（Oが～するのを妨げる）の prevent が正解です。次の文の「もし妨げるなら、訳せない語の説明は不可能になる」とも合います。protect O from（Oを～から守る）や release O from（Oを～から解放する）では「理解から守る・解放する」となり意味が通りません。derive O from ～（Oを～から引き出す）も「理解から話者を引き出す」となり文意に合いません。","m":"prevent O from -ing＝Oが～するのを妨げる"},{"id":88,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：the predicted decline","p":"Before the pandemic, many commentators predicted that the internet would eventually make cities unnecessary. If people could work, shop and socialize online, why would they pay high rents to live in crowded urban centers? For decades, the opposite happened: the largest cities attracted ever more people and investment. The sudden shift to remote work in 2020 seemed to offer a chance to test the old prediction.\nThe early results were mixed. Many office workers left expensive city centers for suburbs or smaller towns, and in some cities office buildings stood half empty. Yet the predicted ( A ) of the city did not occur. As restrictions eased, many companies adopted hybrid arrangements in which employees spent part of the week in the office and part at home.\nEconomists who study cities offer an explanation for this resilience. Cities, they argue, are valuable not only because they bring workers close to their offices but because they bring people close to one another. Casual encounters, overheard conversations and chance meetings allow ideas to spread and new collaborations to form. Such interactions are hard to [replicate] online, where communication tends to happen only between people who have already decided to talk.\nThis does not mean that cities will return unchanged. Shops and restaurants that depended on daily office workers have struggled, and some cities are considering turning empty offices into housing. Young workers in particular may still value the city, ( B ) the training and contacts that come from working near experienced colleagues are hard to obtain from home. The future city may be organized less around the daily commute and more around the occasions that make meeting in person worthwhile.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["decline","expansion","revival","planning"],"e":"第1段落の「インターネットが都市を不要にする」という古い予測が、2020年の在宅勤務への移行で試される流れです。空所を含む文は Yet で始まり、人が郊外に移った事実に続けて「予測された都市の（ A ）は起こらなかった」と述べています。予測されていたのは都市の衰退なので decline が正解です。expansion（拡大）や revival（復活）は予測の内容と逆です。planning（計画）は「予測された」と結びつきません。","m":"Yet＝予想に反して（直前と逆の展開）"},{"id":89,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：replicate","p":"Before the pandemic, many commentators predicted that the internet would eventually make cities unnecessary. If people could work, shop and socialize online, why would they pay high rents to live in crowded urban centers? For decades, the opposite happened: the largest cities attracted ever more people and investment. The sudden shift to remote work in 2020 seemed to offer a chance to test the old prediction.\nThe early results were mixed. Many office workers left expensive city centers for suburbs or smaller towns, and in some cities office buildings stood half empty. Yet the predicted ( A ) of the city did not occur. As restrictions eased, many companies adopted hybrid arrangements in which employees spent part of the week in the office and part at home.\nEconomists who study cities offer an explanation for this resilience. Cities, they argue, are valuable not only because they bring workers close to their offices but because they bring people close to one another. Casual encounters, overheard conversations and chance meetings allow ideas to spread and new collaborations to form. Such interactions are hard to [replicate] online, where communication tends to happen only between people who have already decided to talk.\nThis does not mean that cities will return unchanged. Shops and restaurants that depended on daily office workers have struggled, and some cities are considering turning empty offices into housing. Young workers in particular may still value the city, ( B ) the training and contacts that come from working near experienced colleagues are hard to obtain from home. The future city may be organized less around the daily commute and more around the occasions that make meeting in person worthwhile.","q":"次の英文を読み、下線部［replicate］に最も意味が近いものを選びなさい。","c":["reproduce","avoid","record","prohibit"],"e":"偶然の出会いや漏れ聞こえる会話などの交流は、オンラインでは「再現する」のが難しい、という文脈です。オンラインでは話すと決めた人どうしの間でしか会話が起こらない、という説明が理由になっています。replicate は reproduce（再現する）に近い意味です。avoid（避ける）、record（記録する）、prohibit（禁止する）では「オンラインでは難しい」理由と結びつきません。","m":"replicate＝再現する・複製する"},{"id":90,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：理由の since","p":"Before the pandemic, many commentators predicted that the internet would eventually make cities unnecessary. If people could work, shop and socialize online, why would they pay high rents to live in crowded urban centers? For decades, the opposite happened: the largest cities attracted ever more people and investment. The sudden shift to remote work in 2020 seemed to offer a chance to test the old prediction.\nThe early results were mixed. Many office workers left expensive city centers for suburbs or smaller towns, and in some cities office buildings stood half empty. Yet the predicted ( A ) of the city did not occur. As restrictions eased, many companies adopted hybrid arrangements in which employees spent part of the week in the office and part at home.\nEconomists who study cities offer an explanation for this resilience. Cities, they argue, are valuable not only because they bring workers close to their offices but because they bring people close to one another. Casual encounters, overheard conversations and chance meetings allow ideas to spread and new collaborations to form. Such interactions are hard to [replicate] online, where communication tends to happen only between people who have already decided to talk.\nThis does not mean that cities will return unchanged. Shops and restaurants that depended on daily office workers have struggled, and some cities are considering turning empty offices into housing. Young workers in particular may still value the city, ( B ) the training and contacts that come from working near experienced colleagues are hard to obtain from home. The future city may be organized less around the daily commute and more around the occasions that make meeting in person worthwhile.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["since","although","unless","whereas"],"e":"若い労働者がなお都市を重視するかもしれない理由として、「経験のある同僚の近くで働くことで得られる訓練や人脈は、家にいては得にくい」が続いています。理由を導く since が正解です。although（～だけれども）では、理由が譲歩になって意味が逆になります。unless（～でない限り）は条件の意味になり不自然です。whereas（～である一方）は対比を表し、前後が対立していないので合いません。","m":"since＝～なので（理由）"},{"id":91,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：不可算名詞 information","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nThe guide provided us [with] a great deal of useful [informations] [about] the exhibits [before] the tour began.","c":["informations","with","about","before"],"e":"information は数えられない名詞なので複数形の -s を付けません。informations を information に直す必要があります。a great deal of は不可算名詞と使う表現で、information と正しく組み合わさります。provide A with B（AにBを与える）の with、「～について」の about、「～する前に」の接続詞 before はいずれも正しい用法です。","m":"information・advice・furniture は複数形にしない"},{"id":92,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：one of the ＋複数名詞の一致","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nOne of the main [reasons] the plan failed [were] that [few] residents had [been consulted] in advance.","c":["were","reasons","few","been consulted"],"e":"主語の中心は One（一つ）なので、動詞は単数の was にしなければなりません。of the main reasons は One を修飾しているだけです。One of the＋複数名詞 の形なので reasons は正しく、few residents（ほとんどいない住民）も可算名詞に few で正しい形です。住民は「相談される」側なので受け身の had been consulted も正しい用法です。","m":"One of the 複数名詞 ＋ 単数動詞"},{"id":93,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：be accustomed to -ing","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nSince moving to the countryside, she has [become accustomed to] [walk] several kilometers [a day], a distance she [once] found exhausting.","c":["walk","become accustomed to","a day","once"],"e":"be [become] accustomed to の to は前置詞なので、後ろには名詞か動名詞が来ます。walk を walking に直す必要があります（be used to -ing と同じ）。現在完了 has become accustomed to は Since ～ と合っていて正しく、a day は「1日につき」の意味で正しい用法です。once は「かつて」の意味で過去形 found と正しく組み合わさっています。","m":"be accustomed to -ing（to は前置詞）"},{"id":94,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：他動詞 mention","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nThe report [did not] [mention about] the risks [that] the new policy [might pose] to small businesses.","c":["mention about","did not","that","might pose"],"e":"mention は「～に言及する」という意味の他動詞で、目的語を直接とります。about は不要で、mention the risks とします（discuss, reach, enter なども同様）。did not＋原形は正しく、that は the risks を先行詞とする目的格の関係代名詞です。pose a risk to ～（～に危険をもたらす）の pose を might と組み合わせた might pose も正しい形です。","m":"mention / discuss / reach は前置詞なしで目的語"},{"id":95,"k":"plan","ref":"想定問題","f":"文法・語法","t":"誤り指摘：lie と lay の区別","q":"次の英文の［ ］で示した部分のうち、誤りを含むものを一つ選びなさい。\nThe letters had [laid] untouched [in] the archive for [nearly] a century [before] a graduate student discovered them.","c":["laid","in","nearly","before"],"e":"「（物が）置かれている・横たわる」は自動詞 lie で、活用は lie－lay－lain です。過去完了なので had lain としなければなりません。laid は他動詞 lay（～を置く）の過去分詞で、目的語がないこの文には合いません。in the archive（保管庫の中に）、nearly a century（ほぼ1世紀）、接続詞の before はいずれも正しい用法です。","m":"lie-lay-lain（自）／lay-laid-laid（他）"},{"id":96,"k":"plan","ref":"想定問題","f":"文法・語法","t":"仮定法：Were it not for ～","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\n( ) it not for her scholarship, she would not be able to study abroad this year.","c":["Were","Had","If","Should"],"e":"主節が would not be able と仮定法過去なので、「もし～がなければ」を表す If it were not for ～ を倒置した Were it not for ～ が正解です。Had it not been for ～ は仮定法過去完了の形で、been が必要になり、主節の時制とも合いません。If を使うなら If it were not for と were が必要です。Should it ～ は可能性の低い未来の仮定で、not for と結びつきません。","m":"Were it not for＝If it were not for"},{"id":97,"k":"plan","ref":"想定問題","f":"文法・語法","t":"語順：as ＋形容詞＋ a ＋名詞＋ as","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThis software is ( ) as any researcher could wish for.","c":["as useful a tool","as a useful tool","so a useful tool","such useful a tool"],"e":"as, so, too, how の後に〈形容詞＋a＋名詞〉を続けるときは、as useful a tool のように〈as＋形容詞＋a＋名詞〉の語順になります。as a useful tool では原級比較の形になりません。so を使う場合も so useful a tool の語順で、so a useful tool は誤りです。such を使うなら such a useful tool の語順になり、such useful a tool は誤りです。","m":"as / so / too ＋形容詞＋a＋名詞"},{"id":98,"k":"plan","ref":"想定問題","f":"文法・語法","t":"not so much A as B","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe success of the campaign was due not so much to its budget ( ) to the enthusiasm of its volunteers.","c":["as","than","but","for"],"e":"not so much A as B は「AというよりむしろB」という意味で、ここでは「予算というよりボランティアの熱意のおかげだった」となります。A と B には to its budget と to the enthusiasm のように同じ形が並びます。than は rather A than B の形で使い、not so much と組みません。not A but B と混同して but を選ばないよう注意が必要です。for では構文が成り立ちません。","m":"not so much A as B＝AというよりB"},{"id":99,"k":"plan","ref":"想定問題","f":"文法・語法","t":"the ＋比較級, the ＋比較級","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe longer the negotiations dragged on, ( ) likely it seemed that an agreement would be reached.","c":["the less","the least","less","so less"],"e":"前半が The longer ～ なので、「～すればするほど、ますます…」を表す〈the＋比較級, the＋比較級〉の構文です。後半にも the＋比較級が必要で、the less likely（ますます可能性が低く）が正解です。最上級の the least は使えません。the を欠く less では構文が完成しません。so less という形は英語にありません。","m":"The 比較級 ～, the 比較級 …"},{"id":100,"k":"plan","ref":"想定問題","f":"文法・語法","t":"関係代名詞 what","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\n( ) surprised the researchers most was not the size of the effect but how quickly it appeared.","c":["What","That","Which","It"],"e":"空所から most までが文の主語になり、動詞 was に続いています。「研究者を最も驚かせたこと」という名詞節をつくるには、先行詞を含む関係代名詞 what（＝the thing which）が必要です。That や Which は先行詞がないので、この位置で主語の名詞節をつくれません。It を入れると It surprised ～ と was の二つの動詞が並び、文が成り立ちません。","m":"what＝the thing(s) which（先行詞を含む）"},{"id":101,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"meticulous（細心の）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nThe editor was so ( ) that she checked every date and name in the manuscript twice.","c":["meticulous","careless","reluctant","arrogant"],"e":"so ～ that ... の構文で、結果が「原稿の日付と名前をすべて二度確認した」なので、空所には「細部まで注意深い」を表す meticulous が入ります。careless（不注意な）は結果と逆です。reluctant（気が進まない）や arrogant（傲慢な）は、二度確認したことの理由になりません。","m":"meticulous＝細部まで注意深い"},{"id":102,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"make up for（埋め合わせる）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nHe stayed late at the office every night that week to ( ) for the time he had lost while he was ill.","c":["make up","take up","give in","put off"],"e":"病気で失った時間を、毎晩残業して「埋め合わせる」という文脈なので、make up for ～（～の埋め合わせをする）が正解です。take up は「（場所・時間を）とる、始める」、give in は「屈する」、put off は「延期する」で、いずれも for と組んでこの意味にはなりません。","m":"make up for＝compensate for"},{"id":103,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"rule out（除外する）","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nInvestigators have not [ruled out] the possibility that the fire was started deliberately.","c":["eliminated from consideration","proved to be true","announced to the public","explained in detail"],"e":"rule out は「（可能性などを）除外する、排除する」という意味で、eliminated from consideration（考慮の対象から外した）が最も近い意味です。文全体では「放火の可能性を排除していない」となります。proved to be true（真実だと証明した）は、可能性を残しているだけの文意とずれます。announced（公表した）や explained（説明した）も意味が異なります。","m":"rule out＝除外する（＝exclude）"},{"id":104,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"scrutiny（精査）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nEvery claim in the proposal will be subject to close ( ) by an independent panel before any funds are released.","c":["scrutiny","negligence","sympathy","ambition"],"e":"資金を出す前に、独立した委員会が提案の主張を一つ一つ「綿密に調べる」という文脈なので、close scrutiny（厳しい精査）が正解です。be subject to ～ は「～を受ける」という意味です。negligence（怠慢）、sympathy（同情）、ambition（野心）は、委員会が提案に対して行う手続きを表しません。","m":"close scrutiny＝綿密な精査"},{"id":105,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"on the verge of（～の寸前で）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nSeveral of the region's traditional crafts are on the ( ) of disappearing, as few young people are willing to learn them.","c":["verge","side","top","line"],"e":"on the verge of -ing は「今にも～しそうで、～の寸前で」という意味で、若者が学ぼうとしないため伝統工芸が「消えかけている」という文脈に合います。on the side of は「～の味方で」、on (the) top of は「～の上に、～に加えて」で意味が合いません。on the line は「危険にさらされて」ですが、of -ing を続ける形にはなりません。","m":"on the verge of -ing＝今にも～しそう"},{"id":106,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"alleviate（和らげる）","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nThe new medicine did little to [alleviate] her symptoms.","c":["relieve","worsen","identify","conceal"],"e":"alleviate は「（苦痛・問題を）和らげる、軽くする」という意味で、relieve が最も近い意味です。did little to ～ は「ほとんど～しなかった」なので、文全体は「新薬は症状をほとんど和らげなかった」となります。worsen（悪化させる）は逆の意味です。identify（特定する）や conceal（隠す）は意味が異なります。","m":"alleviate＝relieve（苦痛を和らげる）"},{"id":107,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"by no means（決して～ない）","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nHis explanation of the missing funds was [by no means] satisfactory.","c":["not at all","in some ways","almost entirely","at least partly"],"e":"by no means は「決して～ない、まったく～ない」という強い否定を表すので、not at all と同じ意味です。in some ways（いくつかの点で）、almost entirely（ほぼ完全に）、at least partly（少なくとも部分的に）は、いずれも説明がある程度は満足できるという肯定の意味になり、否定の by no means とは逆になります。","m":"by no means＝not at all（強い否定）"},{"id":108,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"in the wake of（～のあとで）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nIn the ( ) of the scandal, the company replaced its entire board of directors.","c":["wake","trace","turn","way"],"e":"in the wake of ～ は「～のあとで、～の結果として」という意味で、不祥事のあとに取締役を総入れ替えしたという文脈に合います。wake はもともと船が通ったあとの航跡のことです。in the trace of、in the turn of という表現はありません。in the way of は「～として（の）、～の点で」という意味の表現で（例：nothing in the way of help）、この文には合いません。","m":"in the wake of＝～の直後に・～を受けて"},{"id":109,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"plausible（もっともらしい）","q":"次の英文の空所に入れるのに最も適当なものを選びなさい。\nAlthough his story sounded ( ), the detectives soon found evidence that contradicted it.","c":["plausible","absurd","irrelevant","inaudible"],"e":"Although（～だけれども）で始まるので、前半と後半は対立する内容になります。後半が「話と矛盾する証拠を見つけた」なので、前半は「話はもっともらしく聞こえた」となる plausible が正解です。absurd（ばかげた）では、矛盾する証拠が見つかることと対立せず、Although が不自然になります。irrelevant（無関係な）や inaudible（聞き取れない）も文意に合いません。","m":"plausible＝もっともらしい（Although に注目）"},{"id":110,"k":"plan","ref":"想定問題","f":"語彙・イディオム","t":"inevitable（避けられない）","q":"次の英文の下線部［ ］に最も意味が近いものを選びなさい。\nThe decline of the town's main industry was [inevitable] once cheaper imports became widely available.","c":["impossible to avoid","difficult to explain","easy to reverse","slow to begin"],"e":"inevitable は「避けられない、必然的な」という意味で、impossible to avoid が最も近い意味です。once ～ は「いったん～すると」で、「安い輸入品が広く出回ると、町の主要産業の衰退は避けられなかった」となります。difficult to explain（説明しにくい）、easy to reverse（元に戻しやすい）、slow to begin（始まるのが遅い）は、いずれも意味が異なります。","m":"inevitable＝unavoidable"},{"id":111,"k":"plan","ref":"想定問題","f":"会話文","t":"留学相談：迷っていることを伝える","p":"Haruto: I've been thinking about applying for the exchange program next year.\nMs. Lee: That's wonderful. Have you decided where you'd like to go?\nHaruto: Not yet. ( 1 ) Some of my friends say I should choose a big city, but I'm not so sure.\nMs. Lee: Well, a smaller town can be a good choice. You'd probably have more chances to talk with local people.\nHaruto: That makes sense. My only worry is my English. ( 2 )\nMs. Lee: Nobody is when they start. Most students find that they improve quickly once they're there.\nHaruto: I hope so. By the way, when is the application deadline?\nMs. Lee: The end of November, I think. ( 3 ) Let me check the website.\nHaruto: Thank you. I'll start working on my essay this weekend.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["I'm still weighing the pros and cons of several universities.","I've already booked my flight to London.","I've decided not to apply after all.","My friends are going to choose for me."],"e":"行き先を決めたかと聞かれて Not yet.（まだです）と答え、空所の後で「友人は大都市を勧めるが確信がない」と続けています。まだ迷っていることを表す「いくつかの大学の長所と短所をまだ比べているところです」が自然です。「ロンドン行きの航空券を予約した」は Not yet と矛盾します。「結局応募しないことにした」は冒頭の発言や最後の「作文に取りかかる」と合いません。「友人が決めてくれる」は I'm not so sure の流れに合いません。","m":"weigh the pros and cons＝長所と短所を比べる"},{"id":112,"k":"plan","ref":"想定問題","f":"会話文","t":"留学相談：不安を述べる","p":"Haruto: I've been thinking about applying for the exchange program next year.\nMs. Lee: That's wonderful. Have you decided where you'd like to go?\nHaruto: Not yet. ( 1 ) Some of my friends say I should choose a big city, but I'm not so sure.\nMs. Lee: Well, a smaller town can be a good choice. You'd probably have more chances to talk with local people.\nHaruto: That makes sense. My only worry is my English. ( 2 )\nMs. Lee: Nobody is when they start. Most students find that they improve quickly once they're there.\nHaruto: I hope so. By the way, when is the application deadline?\nMs. Lee: The end of November, I think. ( 3 ) Let me check the website.\nHaruto: Thank you. I'll start working on my essay this weekend.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["I'm afraid I'm not fluent enough yet.","I've been speaking it since I was a child.","I think it's better than most teachers'.","I don't think I'll need it there."],"e":"「唯一の心配は英語だ」に続く発言で、Ms. Lee が Nobody is when they start.（最初からそうである人はいない）と答えています。この is の後には fluent が省略されていると考えると、「まだ十分に流ちょうではないと思う」が入ります。「子どものころから話している」「たいていの先生より上手」は心配の内容と矛盾します。「向こうでは必要ない」では心配の理由にならず、Ms. Lee の返答ともかみ合いません。","m":"Nobody is (fluent) ～＝省略を補って読む"},{"id":113,"k":"plan","ref":"想定問題","f":"会話文","t":"留学相談：記憶があいまいなことを示す","p":"Haruto: I've been thinking about applying for the exchange program next year.\nMs. Lee: That's wonderful. Have you decided where you'd like to go?\nHaruto: Not yet. ( 1 ) Some of my friends say I should choose a big city, but I'm not so sure.\nMs. Lee: Well, a smaller town can be a good choice. You'd probably have more chances to talk with local people.\nHaruto: That makes sense. My only worry is my English. ( 2 )\nMs. Lee: Nobody is when they start. Most students find that they improve quickly once they're there.\nHaruto: I hope so. By the way, when is the application deadline?\nMs. Lee: The end of November, I think. ( 3 ) Let me check the website.\nHaruto: Thank you. I'll start working on my essay this weekend.","q":"次の会話文を読み、空所（3）に入れるのに最も適当なものを選びなさい。","c":["But don't quote me on that.","I'm absolutely certain of it.","You've missed it already.","There's no deadline this year."],"e":"Ms. Lee は締め切りを「11月末だと思う（I think）」と答え、空所の後で「ウェブサイトを確認させて」と言っています。確信がないことを表す But don't quote me on that.（でも当てにしないでね）が自然です。「絶対に確かだ」なら確認する必要がありません。「もう締め切りを過ぎた」「今年は締め切りがない」は、11月末と答えた直前の発言と矛盾します。","m":"don't quote me on that＝確かではないけど"},{"id":114,"k":"plan","ref":"想定問題","f":"会話文","t":"ルームメイト：苦情を伝える","p":"Sam: Hey, do you have a minute? There's something I've been meaning to talk to you about.\nJun: Sure. What's up?\nSam: It's about the music late at night. ( 1 ) I have an early class three days a week.\nJun: Oh, I had no idea it was that loud. I'm really sorry.\nSam: It's not a big deal. I just thought I should mention it before it bothered me too much.\nJun: I appreciate that. ( 2 ) I could use headphones after eleven.\nSam: That would be great. And if anything I do bothers you, please tell me.\nJun: Well, now that you mention it, ( 3 )\nSam: Fair enough. I'll make sure to clean up right after I cook.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["I can hear it through the wall, and it's keeping me awake.","I'd like you to turn it up a little.","I really enjoy listening to it while I fall asleep.","I've never noticed any music at all."],"e":"Sam は「前から話そうと思っていたこと」として深夜の音楽を持ち出し、空所の後で「週3日は早い授業がある」と理由を述べています。Jun も「そんなにうるさいとは知らなかった」と謝っているので、「壁越しに聞こえて眠れない」が入ります。「少し音を大きくしてほしい」「眠りながら聞くのが好き」は苦情になりません。「音楽にはまったく気づかなかった」は話題を持ち出したことと矛盾します。","m":"keep O awake＝Oを眠らせない"},{"id":115,"k":"plan","ref":"想定問題","f":"会話文","t":"ルームメイト：解決策を提案する","p":"Sam: Hey, do you have a minute? There's something I've been meaning to talk to you about.\nJun: Sure. What's up?\nSam: It's about the music late at night. ( 1 ) I have an early class three days a week.\nJun: Oh, I had no idea it was that loud. I'm really sorry.\nSam: It's not a big deal. I just thought I should mention it before it bothered me too much.\nJun: I appreciate that. ( 2 ) I could use headphones after eleven.\nSam: That would be great. And if anything I do bothers you, please tell me.\nJun: Well, now that you mention it, ( 3 )\nSam: Fair enough. I'll make sure to clean up right after I cook.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["How about this?","Why should I care?","That's not my problem.","I'm going to move out tomorrow."],"e":"Jun は「言ってくれてありがたい」と述べ、空所の後で「11時以降はヘッドホンを使える」と具体的な解決策を示しています。提案を切り出す How about this?（こうするのはどう？）が自然です。「なぜ気にしなきゃいけないの」「それは自分の問題じゃない」は直前の感謝や謝罪と矛盾します。「明日引っ越す」は、続く提案や Sam の That would be great. とつながりません。","m":"How about this?＝提案の切り出し"},{"id":116,"k":"plan","ref":"想定問題","f":"会話文","t":"ルームメイト：こちらからの要望","p":"Sam: Hey, do you have a minute? There's something I've been meaning to talk to you about.\nJun: Sure. What's up?\nSam: It's about the music late at night. ( 1 ) I have an early class three days a week.\nJun: Oh, I had no idea it was that loud. I'm really sorry.\nSam: It's not a big deal. I just thought I should mention it before it bothered me too much.\nJun: I appreciate that. ( 2 ) I could use headphones after eleven.\nSam: That would be great. And if anything I do bothers you, please tell me.\nJun: Well, now that you mention it, ( 3 )\nSam: Fair enough. I'll make sure to clean up right after I cook.","q":"次の会話文を読み、空所（3）に入れるのに最も適当なものを選びなさい。","c":["the dishes do tend to pile up in the sink.","everything you do is absolutely perfect.","I'd rather not talk about the music anymore.","you should play your music louder too."],"e":"Sam が「自分のすることで気になることがあれば言って」と言い、Jun は now that you mention it（そう言われてみれば）と切り出しています。Sam の返答が「料理のあとすぐ片づける」なので、「流しに皿がたまりがちだ」が入ります。do tend は強調の do です。「あなたのすることはすべて完璧」では、Sam が片づけを約束する理由がありません。「音楽の話はもうしたくない」「あなたも音楽をもっと大きく」は Sam の返答とつながりません。","m":"now that you mention it＝そう言われてみれば"},{"id":117,"k":"plan","ref":"想定問題","f":"会話文","t":"面接：志望理由を述べる","p":"Interviewer: Thank you for coming in today. Could you tell me why you're interested in this position?\nApplicant: Certainly. I've followed your company's work on renewable energy for some time, and ( 1 )\nInterviewer: I see. Our team often works under tight deadlines. How do you handle pressure?\nApplicant: I try to break large tasks into smaller steps. In my last job, for example, we had to finish a major report in a week, and careful planning helped us meet the deadline.\nInterviewer: That's good to know. Do you have any questions for us?\nApplicant: Yes. ( 2 )\nInterviewer: New staff usually spend their first month working alongside an experienced colleague, and there are workshops every quarter.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["I'd like to contribute to projects that I believe in.","I've never really been interested in energy.","I'm not sure what your company actually does.","I'm mainly hoping to find a job close to my home."],"e":"志望理由を聞かれ、「御社の再生可能エネルギーの仕事をしばらく追ってきた」と述べたあとに and で続くので、その関心から自然につながる「自分が価値を信じる事業に貢献したい」が入ります。「エネルギーには興味がなかった」「御社が何をしているのかよくわからない」は前半の内容と矛盾します。「家の近くの仕事を探している」は、会社の仕事を追ってきたという前半とつながらず、志望理由として成り立ちません。","m":"前半との一貫性で選ぶ（and でつながる）"},{"id":118,"k":"plan","ref":"想定問題","f":"会話文","t":"面接：研修について質問する","p":"Interviewer: Thank you for coming in today. Could you tell me why you're interested in this position?\nApplicant: Certainly. I've followed your company's work on renewable energy for some time, and ( 1 )\nInterviewer: I see. Our team often works under tight deadlines. How do you handle pressure?\nApplicant: I try to break large tasks into smaller steps. In my last job, for example, we had to finish a major report in a week, and careful planning helped us meet the deadline.\nInterviewer: That's good to know. Do you have any questions for us?\nApplicant: Yes. ( 2 )\nInterviewer: New staff usually spend their first month working alongside an experienced colleague, and there are workshops every quarter.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["What kind of training do new employees receive?","How many days off can I take in my first week?","Who will be interviewing me next time?","When did your company start working on energy?"],"e":"面接官の答えが「新しい社員は最初の1か月を経験ある同僚と一緒に働き、四半期ごとに研修会がある」なので、新入社員の研修について尋ねる質問が入ります。「最初の週に何日休めるか」「次は誰が面接するのか」「いつからエネルギー事業を始めたのか」は、どれも面接官の答えとかみ合いません。会話文では、空所の直後の返答から質問の内容を逆にたどるのが基本です。","m":"空所の直後の返答から質問を決める"},{"id":119,"k":"plan","ref":"想定問題","f":"会話文","t":"共同発表：反省を述べる","p":"Mika: The presentation is on Friday, and we still haven't finished the slides.\nTom: I know. ( 1 ) I've been busy with my part-time job all week.\nMika: Me too. Maybe we should divide the remaining work. Could you handle the data section?\nTom: Sure, I can do that tonight. What about the conclusion?\nMika: I'll write it. ( 2 ) Then we can practice together on Thursday.\nTom: Good idea. Let's meet in the library after lunch on Thursday.","q":"次の会話文を読み、空所（1）に入れるのに最も適当なものを選びなさい。","c":["I should have started earlier.","We finished everything last week.","Friday is still too far away to worry about.","Let's just cancel the presentation."],"e":"Mika が「金曜が発表なのにスライドがまだ終わっていない」と言い、Tom は I know.（わかってる）と受けたあと、「今週はずっとアルバイトで忙しかった」と言い訳めいた理由を続けています。間に入るのは「もっと早く始めるべきだった」という反省です。〈should have p.p.〉は「～すべきだったのに（しなかった）」を表します。「先週すべて終えた」は直前の発言と矛盾し、「まだ心配するには早い」「発表を中止しよう」は、続いて作業を分担する流れと合いません。","m":"should have p.p.＝～すべきだったのに"},{"id":120,"k":"plan","ref":"想定問題","f":"会話文","t":"共同発表：期限を約束する","p":"Mika: The presentation is on Friday, and we still haven't finished the slides.\nTom: I know. ( 1 ) I've been busy with my part-time job all week.\nMika: Me too. Maybe we should divide the remaining work. Could you handle the data section?\nTom: Sure, I can do that tonight. What about the conclusion?\nMika: I'll write it. ( 2 ) Then we can practice together on Thursday.\nTom: Good idea. Let's meet in the library after lunch on Thursday.","q":"次の会話文を読み、空所（2）に入れるのに最も適当なものを選びなさい。","c":["I'll send it to you by Wednesday night.","I don't think we need one at all.","You'd better write it instead.","I finished it a month ago."],"e":"Mika は「結論は私が書く」と引き受け、空所の後で「そうすれば木曜に一緒に練習できる」と言っています。練習の前に原稿を共有する段取りとして「水曜の夜までに送る」が自然です。by は「～までに（期限）」を表します。「結論は必要ない」「代わりにあなたが書いて」は I'll write it. と矛盾します。「1か月前に終えた」は、まだ終わっていないという会話の前提と合いません。","m":"by＝～までに（期限）／until＝～までずっと"}];
var FIELDS=["長文読解（内容一致）","長文読解（語句・空所・言い換え）","文法・語法","語彙・イディオム","会話文"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="waseda-eigo-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);if(!q.fix)a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.fix?"出典：早稲田大学 "+esc(q.ref)+"（試験問題を原文のまま掲載。解説・覚え方は独自に作成したもので、試験実施団体とは関係ありません）":q.k==="past"?"過去問ベース：早稲田大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（早稲田大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+(q.fix?String(ci+1):"abcde".charAt(j))+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+(q.fix?"過去問題（原文）":KIND[q.k])+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+(q.fix?"過去問題（原文）":KIND[q.k])+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}

.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}

.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}

.opts{display:flex;flex-direction:column;gap:8px}

.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}

.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}

.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}

.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}

"use strict";
var QS=[{"id":1,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"デフォルト効果：自動加入の結果","p":"When people are asked to make a choice, economists traditionally assumed that the way the options are presented should not matter. A rational person, the argument went, weighs costs and benefits and picks whatever serves her best, regardless of which box happens to be ticked in advance. A large body of research now suggests otherwise. In many settings, the option that takes effect when a person does nothing, known as the default, exerts a remarkable pull on behavior.\nConsider workplace pension plans. When firms require new employees to sign up actively, many of them never get around to it, even though the plan offers generous matching funds. When the same firms enroll workers automatically and let them leave if they wish, participation often rises sharply. Few of those enrolled by default go on to quit, and most keep the contribution rate the employer happened to choose.\nWhy should a mere starting point carry so much weight? Several explanations have been offered. Making a decision requires effort, and people tend to put off tasks whose rewards lie far in the future. A default may also be read as a quiet recommendation: if the employer chose this rate, perhaps it is sensible. Finally, giving up something one already has tends to feel like a loss, and a loss tends to be felt more strongly than a gain of the same size.\nCritics worry that designing defaults amounts to manipulation, since it steers people without their full awareness. Defenders reply that some option must be the default anyway; there is no neutral way to present a form. The real question, they argue, is not whether to shape choices but how to do so openly. Even so, a default that suits the average worker may serve poorly those whose needs differ.","q":"次の英文を読み、企業が従業員を年金制度に自動加入させた場合について、本文の内容に最も合うものを選びなさい。","c":["Participation tends to increase, and most workers keep the contribution rate set by the employer.","Participation increases at first, but most workers later decide to leave the plan.","Workers who are enrolled automatically usually choose a higher contribution rate than the employer set.","Participation rises only among workers who were already planning to join actively."],"e":"第2段落に「自動加入にして脱退を認めると参加率が急上昇することが多い」「デフォルトで加入した人のうち脱退する人は少なく、多くは雇用主がたまたま選んだ拠出率を維持する」とあり、正解の内容と一致します。「多くが後で脱退する」は Few ... go on to quit に反します。「雇用主の設定より高い率を選ぶ」は本文の記述と逆です。「もともと加入予定だった人だけ増える」という限定は本文にありません。","m":"Few ... go on to quit＝やめる人はほとんどいない"},{"id":2,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"デフォルト効果：理由（NOT問題）","p":"When people are asked to make a choice, economists traditionally assumed that the way the options are presented should not matter. A rational person, the argument went, weighs costs and benefits and picks whatever serves her best, regardless of which box happens to be ticked in advance. A large body of research now suggests otherwise. In many settings, the option that takes effect when a person does nothing, known as the default, exerts a remarkable pull on behavior.\nConsider workplace pension plans. When firms require new employees to sign up actively, many of them never get around to it, even though the plan offers generous matching funds. When the same firms enroll workers automatically and let them leave if they wish, participation often rises sharply. Few of those enrolled by default go on to quit, and most keep the contribution rate the employer happened to choose.\nWhy should a mere starting point carry so much weight? Several explanations have been offered. Making a decision requires effort, and people tend to put off tasks whose rewards lie far in the future. A default may also be read as a quiet recommendation: if the employer chose this rate, perhaps it is sensible. Finally, giving up something one already has tends to feel like a loss, and a loss tends to be felt more strongly than a gain of the same size.\nCritics worry that designing defaults amounts to manipulation, since it steers people without their full awareness. Defenders reply that some option must be the default anyway; there is no neutral way to present a form. The real question, they argue, is not whether to shape choices but how to do so openly. Even so, a default that suits the average worker may serve poorly those whose needs differ.","q":"次の英文を読み、デフォルト（初期設定）が行動に強い影響を与える理由として、本文で挙げられていないものを選びなさい。","c":["People believe that defaults are legally difficult to change.","People tend to postpone decisions whose benefits lie in the distant future.","People may interpret a default as an implicit recommendation.","People tend to feel that giving up what they already have is a loss."],"e":"第3段落は理由を3つ挙げています。①決定には労力がかかり、見返りが遠い先の課題は先送りされがち、②デフォルトは暗黙の推奨と受け取られうる、③すでに持っているものを手放すのは損失に感じられ、損失は同じ大きさの利得より強く感じられる。「デフォルトは法的に変更しにくいと信じている」という理由は本文になく、これが正解です。本文ではむしろ「脱退してもよい（let them leave if they wish）」と変更が自由なことが示されています。","m":"理由列挙は段落内の Making… / may also… / Finally… を数える"},{"id":3,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"デフォルト効果：擁護派の主張","p":"When people are asked to make a choice, economists traditionally assumed that the way the options are presented should not matter. A rational person, the argument went, weighs costs and benefits and picks whatever serves her best, regardless of which box happens to be ticked in advance. A large body of research now suggests otherwise. In many settings, the option that takes effect when a person does nothing, known as the default, exerts a remarkable pull on behavior.\nConsider workplace pension plans. When firms require new employees to sign up actively, many of them never get around to it, even though the plan offers generous matching funds. When the same firms enroll workers automatically and let them leave if they wish, participation often rises sharply. Few of those enrolled by default go on to quit, and most keep the contribution rate the employer happened to choose.\nWhy should a mere starting point carry so much weight? Several explanations have been offered. Making a decision requires effort, and people tend to put off tasks whose rewards lie far in the future. A default may also be read as a quiet recommendation: if the employer chose this rate, perhaps it is sensible. Finally, giving up something one already has tends to feel like a loss, and a loss tends to be felt more strongly than a gain of the same size.\nCritics worry that designing defaults amounts to manipulation, since it steers people without their full awareness. Defenders reply that some option must be the default anyway; there is no neutral way to present a form. The real question, they argue, is not whether to shape choices but how to do so openly. Even so, a default that suits the average worker may serve poorly those whose needs differ.","q":"次の英文を読み、デフォルトの設計を擁護する人々の考えとして最も適当なものを選びなさい。","c":["Because some option must be preset anyway, the real issue is how to shape choices transparently.","Defaults should be eliminated so that people can make fully neutral choices.","Defaults never influence people without their awareness, so they cannot be manipulative.","A default that suits the average worker will serve all workers equally well."],"e":"第4段落で擁護派は「どれかの選択肢はどうしてもデフォルトになる。中立的な書式の示し方はない」と述べ、「問題は選択に影響を与えるかどうかではなく、どう公然と行うかだ」と主張しています。正解はこの要約です。「デフォルトを廃止すべき」は「中立はありえない」という主張と矛盾します。「意識されずに影響することはない」は批判派の前提（without their full awareness）を否定するもので、擁護派の論点ではありません。最後の選択肢は本文末尾の「平均に合わない人には不向き」と逆です。","m":"not whether A but how B＝AかどうかではなくBの仕方が問題"},{"id":4,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"標準時：鉄道以前","p":"Before the middle of the nineteenth century, most towns kept their own time. Noon was the moment the sun stood highest over the local church or town hall, and because the sun moves westward, a town a few dozen kilometers to the east reached noon a little earlier than its neighbor. For centuries this caused little trouble. Travel was slow, and a gap of several minutes between places hardly mattered to someone who needed a whole day to cover the distance between them.\nThe railway changed this. Trains made it possible to cross a region in hours, and timetables had to tell passengers when a train would leave one station and reach another. If each station followed its own local time, a single schedule might refer to dozens of slightly different clocks, and the risk of confusion, and even of collision on single-track lines, grew. Railway companies therefore began to adopt one standard time across their networks, usually that of a major city. Over the following decades, governments turned this practice into law, and the world was eventually divided into time zones.\nThe change was not welcomed everywhere. In some places residents complained that an abstract time set by distant authorities had replaced the natural rhythm of the sun. A few towns kept two clocks on public buildings, one showing local time and the other railway time, as if unwilling to choose between them.\nHistorians have argued that standard time did more than make travel efficient. It encouraged people to coordinate their lives with strangers far away, and it turned punctuality, measured to the minute, into a widely shared value. In this sense, the clock on the station wall helped to shape a new kind of social discipline, one that factories and schools would later reinforce.","q":"次の英文を読み、鉄道の普及以前に町ごとの時刻の違いがほとんど問題にならなかった理由として、本文に最も合うものを選びなさい。","c":["Travel was so slow that a difference of a few minutes made little practical difference.","Every town adjusted its clocks to the time of the nearest large city.","The sun reached its highest point at the same moment in all nearby towns.","Governments had already passed laws requiring towns to share the same time."],"e":"第1段落に「移動は遅く、二つの場所の間を移動するのに丸一日かかる人にとって、数分の差はほとんど問題にならなかった」とあります。正解はこれを言い換えたものです。「最寄りの大都市の時刻に合わせた」は鉄道会社が後に行ったことで、それ以前の話ではありません。太陽が最も高くなる時刻は東の町ほど早いと本文にあり、「同時」は誤りです。法律化は鉄道の普及後の出来事です。","m":"hardly mattered＝ほとんど問題にならなかった"},{"id":5,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"標準時：二つの時計","p":"Before the middle of the nineteenth century, most towns kept their own time. Noon was the moment the sun stood highest over the local church or town hall, and because the sun moves westward, a town a few dozen kilometers to the east reached noon a little earlier than its neighbor. For centuries this caused little trouble. Travel was slow, and a gap of several minutes between places hardly mattered to someone who needed a whole day to cover the distance between them.\nThe railway changed this. Trains made it possible to cross a region in hours, and timetables had to tell passengers when a train would leave one station and reach another. If each station followed its own local time, a single schedule might refer to dozens of slightly different clocks, and the risk of confusion, and even of collision on single-track lines, grew. Railway companies therefore began to adopt one standard time across their networks, usually that of a major city. Over the following decades, governments turned this practice into law, and the world was eventually divided into time zones.\nThe change was not welcomed everywhere. In some places residents complained that an abstract time set by distant authorities had replaced the natural rhythm of the sun. A few towns kept two clocks on public buildings, one showing local time and the other railway time, as if unwilling to choose between them.\nHistorians have argued that standard time did more than make travel efficient. It encouraged people to coordinate their lives with strangers far away, and it turned punctuality, measured to the minute, into a widely shared value. In this sense, the clock on the station wall helped to shape a new kind of social discipline, one that factories and schools would later reinforce.","q":"次の英文を読み、一部の町が公共の建物に時計を二つ掲げた理由について、本文から最も適切に推測できるものを選びなさい。","c":["They were reluctant to give up local solar time completely, even while accepting railway time.","The law required every public building to display both local time and railway time.","Train drivers needed a second clock to avoid collisions on single-track lines.","Two competing railway companies used different standard times in the same town."],"e":"第3段落は、標準時が歓迎されなかった例として「現地時刻と鉄道時刻の二つの時計を掲げ、どちらかを選びたくないかのようだった（as if unwilling to choose between them）」と述べています。ここから、鉄道時刻を受け入れつつも太陽に基づく現地時刻を完全には手放したくなかった、と推測できます。法律で義務づけられた、運転士のため、鉄道会社が二社あった、という記述はいずれも本文にありません。","m":"as if unwilling to ～＝～したくないかのように"},{"id":6,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"標準時：歴史家の見解","p":"Before the middle of the nineteenth century, most towns kept their own time. Noon was the moment the sun stood highest over the local church or town hall, and because the sun moves westward, a town a few dozen kilometers to the east reached noon a little earlier than its neighbor. For centuries this caused little trouble. Travel was slow, and a gap of several minutes between places hardly mattered to someone who needed a whole day to cover the distance between them.\nThe railway changed this. Trains made it possible to cross a region in hours, and timetables had to tell passengers when a train would leave one station and reach another. If each station followed its own local time, a single schedule might refer to dozens of slightly different clocks, and the risk of confusion, and even of collision on single-track lines, grew. Railway companies therefore began to adopt one standard time across their networks, usually that of a major city. Over the following decades, governments turned this practice into law, and the world was eventually divided into time zones.\nThe change was not welcomed everywhere. In some places residents complained that an abstract time set by distant authorities had replaced the natural rhythm of the sun. A few towns kept two clocks on public buildings, one showing local time and the other railway time, as if unwilling to choose between them.\nHistorians have argued that standard time did more than make travel efficient. It encouraged people to coordinate their lives with strangers far away, and it turned punctuality, measured to the minute, into a widely shared value. In this sense, the clock on the station wall helped to shape a new kind of social discipline, one that factories and schools would later reinforce.","q":"次の英文を読み、最終段落で述べられている歴史家の見解に最も合うものを選びなさい。","c":["Standard time helped make minute-level punctuality a common social value.","Standard time was first introduced by factories and schools and later adopted by railways.","Standard time weakened the connection between people in distant places.","Standard time was valued only because it made travel more efficient."],"e":"最終段落では、標準時は移動を効率化した以上のことをした、すなわち遠く離れた見知らぬ人と生活を調整させ、分単位の時間厳守を広く共有された価値に変えたと述べています。正解はこれと一致します。工場や学校は後にこの規律を「強化した（would later reinforce）」のであり、起源ではありません。「遠くの人とのつながりを弱めた」は本文と逆です。「効率化のためだけ」は did more than と矛盾します。","m":"did more than ～＝～以上のことをした"},{"id":7,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"出版バイアス：20チームの例","p":"Scientific journals have long preferred to publish studies that report striking, positive results. A paper showing that a new drug works, or that some habit predicts success, is more likely to attract readers than one concluding that nothing of interest was found. This preference seems harmless, but it can distort the picture of the world that the published record presents.\nImagine that twenty research teams test whether a certain food improves memory, and that in reality it has no effect. By chance alone, one or two of these teams may obtain results that appear significant. If only those studies are published while the others stay in desk drawers, readers will conclude that the evidence for the effect is consistent, when in fact it is nothing of the kind. Researchers call this the \"file drawer problem.\"\nThe difficulty is made worse by the pressures on scientists themselves. Careers depend on publications, and publications depend on findings that editors find exciting. Under such conditions, researchers may be tempted, often with no intention to deceive, to try several ways of analyzing their data and report only the one that yields a clear result.\nIn recent years, a number of reforms have been proposed. One is preregistration, in which researchers state their hypotheses and methods before collecting data, so that later changes become visible. Another is the \"registered report,\" which a journal agrees to publish on the basis of its design rather than its outcome. Supporters argue that such measures reward careful questions rather than lucky answers. Skeptics note that not all research can be planned in advance, and that exploratory work, which often leads to unexpected discoveries, should not be viewed with suspicion simply because its path was not mapped beforehand.","q":"次の英文を読み、20の研究チームの例で読者が誤った結論に至る理由として、本文に最も合うものを選びなさい。","c":["Only the few studies that happened to show an effect by chance are published.","Most of the twenty teams deliberately falsify their data.","The food actually improves memory, but most teams fail to detect it.","Journals publish all twenty studies but readers ignore the negative ones."],"e":"第2段落の想定では、実際には効果がないのに、偶然だけで1〜2チームが有意に見える結果を得ます。それだけが出版され、残りが机の引き出しにしまわれると、読者は「証拠は一貫している」と誤解します。正解はこの仕組みです。意図的な改ざんの話はここにはありません。「実際は効果がある」は in reality it has no effect と逆です。全研究が出版されるなら、この問題は起きません。","m":"file drawer problem＝否定的結果がしまい込まれる問題"},{"id":8,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"出版バイアス：研究者の分析","p":"Scientific journals have long preferred to publish studies that report striking, positive results. A paper showing that a new drug works, or that some habit predicts success, is more likely to attract readers than one concluding that nothing of interest was found. This preference seems harmless, but it can distort the picture of the world that the published record presents.\nImagine that twenty research teams test whether a certain food improves memory, and that in reality it has no effect. By chance alone, one or two of these teams may obtain results that appear significant. If only those studies are published while the others stay in desk drawers, readers will conclude that the evidence for the effect is consistent, when in fact it is nothing of the kind. Researchers call this the \"file drawer problem.\"\nThe difficulty is made worse by the pressures on scientists themselves. Careers depend on publications, and publications depend on findings that editors find exciting. Under such conditions, researchers may be tempted, often with no intention to deceive, to try several ways of analyzing their data and report only the one that yields a clear result.\nIn recent years, a number of reforms have been proposed. One is preregistration, in which researchers state their hypotheses and methods before collecting data, so that later changes become visible. Another is the \"registered report,\" which a journal agrees to publish on the basis of its design rather than its outcome. Supporters argue that such measures reward careful questions rather than lucky answers. Skeptics note that not all research can be planned in advance, and that exploratory work, which often leads to unexpected discoveries, should not be viewed with suspicion simply because its path was not mapped beforehand.","q":"次の英文を読み、データ分析に関する研究者の行動について、本文の内容に最も合うものを選びなさい。","c":["Researchers may report only a favorable analysis even without meaning to mislead anyone.","Researchers usually invent data in order to satisfy journal editors.","Researchers are required by editors to report every analysis they have tried.","Researchers' careers rarely depend on the number of papers they publish."],"e":"第3段落に「研究者は、しばしば欺く意図がまったくないまま、データをいくつかの方法で分析し、明確な結果が出たものだけを報告したくなることがある」とあります。正解はこの内容です。データの捏造は述べられていません。編集者がすべての分析の報告を求めるという記述もありません。「キャリアは出版に左右されない」は Careers depend on publications と逆です。","m":"with no intention to deceive＝だますつもりなく"},{"id":9,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"出版バイアス：懐疑派の懸念","p":"Scientific journals have long preferred to publish studies that report striking, positive results. A paper showing that a new drug works, or that some habit predicts success, is more likely to attract readers than one concluding that nothing of interest was found. This preference seems harmless, but it can distort the picture of the world that the published record presents.\nImagine that twenty research teams test whether a certain food improves memory, and that in reality it has no effect. By chance alone, one or two of these teams may obtain results that appear significant. If only those studies are published while the others stay in desk drawers, readers will conclude that the evidence for the effect is consistent, when in fact it is nothing of the kind. Researchers call this the \"file drawer problem.\"\nThe difficulty is made worse by the pressures on scientists themselves. Careers depend on publications, and publications depend on findings that editors find exciting. Under such conditions, researchers may be tempted, often with no intention to deceive, to try several ways of analyzing their data and report only the one that yields a clear result.\nIn recent years, a number of reforms have been proposed. One is preregistration, in which researchers state their hypotheses and methods before collecting data, so that later changes become visible. Another is the \"registered report,\" which a journal agrees to publish on the basis of its design rather than its outcome. Supporters argue that such measures reward careful questions rather than lucky answers. Skeptics note that not all research can be planned in advance, and that exploratory work, which often leads to unexpected discoveries, should not be viewed with suspicion simply because its path was not mapped beforehand.","q":"次の英文を読み、改革案に対する懐疑派の懸念として最も適当なものを選びなさい。","c":["Exploratory research might be unfairly regarded as less trustworthy.","Preregistration would make it impossible to change methods at all.","Registered reports would encourage journals to publish only positive results.","Careful research questions would no longer be rewarded."],"e":"最終段落で懐疑派は「すべての研究を事前に計画できるわけではない」「予想外の発見につながることが多い探索的研究を、道筋が事前に描かれていないという理由だけで疑いの目で見るべきではない」と述べています。正解はこれに対応します。事前登録は「後の変更を見えるようにする」ものであり、変更を不可能にするとは書かれていません。登録報告は結果でなく設計で採否を決めるので、肯定的結果だけを載せる方向には働きません。最後の選択肢は支持派の主張と逆です。","m":"skeptics note that ～＝懐疑派の論点を拾う"},{"id":10,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"贈与：関係が強まる理由","p":"In many societies, a gift is never simply a gift. Anthropologists who studied exchange in small communities observed that offering something to another person created an expectation that something would eventually be returned. To refuse a gift could be taken as an insult, and to accept one without ever giving back could leave a person in a position of lasting inferiority. Gifts, in other words, built and maintained relationships precisely because they placed people in each other's debt.\nAt first sight, modern market exchange seems to work on the opposite principle. When I buy bread from a shop, I pay the agreed price, and the deal is complete. Neither the baker nor I owe each other anything further, and we may never meet again. The very purpose of money, one might say, is to settle accounts so fully that no relationship needs to remain.\nYet the contrast can be overstated. Even in highly commercial societies, people take great care over the gifts they give to friends and relatives. Giving cash to a close friend on her birthday is often thought awkward, while a carefully chosen object, though it may cost the same, is welcomed. This suggests that what matters is not the value transferred but the attention and knowledge that the choice reveals. Similarly, people who return a favor too quickly, as if eager to be free of the obligation, may be thought cold.\nSome scholars therefore argue that the two forms of exchange coexist within every society, each governing a different sphere of life. Markets allow strangers to trade efficiently without trust, while gifts sustain the ties of intimacy that markets cannot create. Problems arise, they suggest, when the logic of one sphere invades the other, as when friendship is measured in money.","q":"次の英文を読み、人類学者の観察によると、贈り物が人間関係を築き維持した理由として最も適当なものを選びなさい。","c":["Gifts created obligations that bound giver and receiver to each other.","Gifts allowed people to settle their accounts completely.","Gifts were always of equal value, so no one felt inferior.","Gifts could be refused without causing any offense."],"e":"第1段落の最後に「贈り物は、人々を互いに借りのある状態に置くからこそ（precisely because）、関係を築き維持した」とあります。正解は「義務を生み、贈り手と受け手を結びつけた」です。「貸し借りを完全に清算する」は第2段落で述べられた貨幣の役割です。「等価なので劣位を感じない」は、お返しをしないと劣位に置かれるという記述に反します。断ることは侮辱と受け取られうるとあるので、最後の選択肢も誤りです。","m":"in each other's debt＝互いに借りがある"},{"id":11,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"贈与：現金が気まずい理由","p":"In many societies, a gift is never simply a gift. Anthropologists who studied exchange in small communities observed that offering something to another person created an expectation that something would eventually be returned. To refuse a gift could be taken as an insult, and to accept one without ever giving back could leave a person in a position of lasting inferiority. Gifts, in other words, built and maintained relationships precisely because they placed people in each other's debt.\nAt first sight, modern market exchange seems to work on the opposite principle. When I buy bread from a shop, I pay the agreed price, and the deal is complete. Neither the baker nor I owe each other anything further, and we may never meet again. The very purpose of money, one might say, is to settle accounts so fully that no relationship needs to remain.\nYet the contrast can be overstated. Even in highly commercial societies, people take great care over the gifts they give to friends and relatives. Giving cash to a close friend on her birthday is often thought awkward, while a carefully chosen object, though it may cost the same, is welcomed. This suggests that what matters is not the value transferred but the attention and knowledge that the choice reveals. Similarly, people who return a favor too quickly, as if eager to be free of the obligation, may be thought cold.\nSome scholars therefore argue that the two forms of exchange coexist within every society, each governing a different sphere of life. Markets allow strangers to trade efficiently without trust, while gifts sustain the ties of intimacy that markets cannot create. Problems arise, they suggest, when the logic of one sphere invades the other, as when friendship is measured in money.","q":"次の英文を読み、親しい友人の誕生日に現金を贈ることが気まずいと考えられる理由として、本文から最も適切に推測できるものを選びなさい。","c":["Cash does not reveal the giver's attention to and knowledge of the friend.","Cash is usually worth less than a carefully chosen object.","Giving cash is forbidden by custom in most commercial societies.","Cash makes the receiver feel obliged to return the gift too quickly."],"e":"第3段落は、同じ値段でも現金は気まずく、よく選んだ品物は喜ばれると述べ、「大切なのは移転される価値ではなく、選択が示す気配りと知識だ」と結論しています。したがって、現金にはその気配りや相手への理解が表れないことが理由です。「品物より価値が低い」は though it may cost the same に反します。「慣習で禁じられている」は言い過ぎです。お返しが早すぎることは別の例として出ているだけで、現金の理由ではありません。","m":"not the value but the attention＝価値でなく気配り"},{"id":12,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"贈与：全体の要旨","p":"In many societies, a gift is never simply a gift. Anthropologists who studied exchange in small communities observed that offering something to another person created an expectation that something would eventually be returned. To refuse a gift could be taken as an insult, and to accept one without ever giving back could leave a person in a position of lasting inferiority. Gifts, in other words, built and maintained relationships precisely because they placed people in each other's debt.\nAt first sight, modern market exchange seems to work on the opposite principle. When I buy bread from a shop, I pay the agreed price, and the deal is complete. Neither the baker nor I owe each other anything further, and we may never meet again. The very purpose of money, one might say, is to settle accounts so fully that no relationship needs to remain.\nYet the contrast can be overstated. Even in highly commercial societies, people take great care over the gifts they give to friends and relatives. Giving cash to a close friend on her birthday is often thought awkward, while a carefully chosen object, though it may cost the same, is welcomed. This suggests that what matters is not the value transferred but the attention and knowledge that the choice reveals. Similarly, people who return a favor too quickly, as if eager to be free of the obligation, may be thought cold.\nSome scholars therefore argue that the two forms of exchange coexist within every society, each governing a different sphere of life. Markets allow strangers to trade efficiently without trust, while gifts sustain the ties of intimacy that markets cannot create. Problems arise, they suggest, when the logic of one sphere invades the other, as when friendship is measured in money.","q":"次の英文を読み、本文全体の主張に最も合うものを選びなさい。","c":["Market exchange and gift exchange each have their proper sphere within the same society.","Modern commercial societies have completely abandoned the logic of the gift.","Money is the most effective means of creating lasting personal ties.","Gift exchange allows strangers to trade more efficiently than markets do."],"e":"筆者はまず贈与と市場交換を対比したうえで、その対比は誇張されうると述べ、最終段落で「二つの交換形態はすべての社会に共存し、それぞれ生活の異なる領域を支配する」とまとめています。正解はこれと一致します。商業社会でも贈り物に気を遣うとあるので「完全に捨てた」は誤りです。貨幣は関係を残さないために清算するものなので、3番目も誤りです。見知らぬ人どうしの効率的な取引は市場の役割として書かれています。","m":"最終段落の some scholars argue が要旨になりやすい"},{"id":13,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"共有資源：破滅の予測","p":"For much of the twentieth century, a simple argument dominated thinking about shared natural resources such as fisheries, forests and pastures. If a resource belongs to no one in particular, each user has a reason to take as much as possible before others do, since the benefit of taking more goes to the individual while the cost of depletion is spread across everyone. The predicted result is ruin. Two remedies seemed to follow: either the state should take control of the resource, or it should be divided into private property so that each owner bears the results of his own actions.\nField research later complicated this picture. Investigators who visited villages managing irrigation systems, mountain pastures and coastal fisheries found that many communities had used shared resources sustainably for generations, without either central control or private ownership. They had developed rules about who could use the resource, when, and how much, and they had ways of monitoring one another and of punishing those who broke the rules, with penalties that grew more severe for repeated offenses.\nThese arrangements were not always successful. They tended to work best where the group of users was clearly defined, where members could take part in changing the rules, and where outside authorities respected the community's right to organize itself. Where those conditions were absent, collapse remained a danger.\nThe lesson drawn by researchers was not that communities always know best, but that the choice between state and market was too narrow. Rules designed by distant officials could ignore local knowledge, and private ownership could be impossible for resources such as migrating fish. Institutions built from below offered a third option, one that policy makers had overlooked.","q":"次の英文を読み、第1段落で共有資源の「破滅」が予測された理由として最も適当なものを選びなさい。","c":["Each user gains individually from taking more, while the costs are shared by all.","The state usually takes too much of the resource for its own purposes.","Private owners tend to ignore the results of their own actions.","Natural resources such as fish migrate too often to be counted."],"e":"第1段落では、資源が誰のものでもない場合、多く取る利益は個人に入り、枯渇の損失は全員に分散されるので、各利用者は他人より先にできるだけ多く取ろうとし、その結果が破滅だと説明されています。正解はこれを言い換えたものです。国家の取りすぎは述べられていません。私有化は「各所有者が自分の行為の結果を負う」ための解決策として挙げられており、3番目は逆です。魚の回遊は最終段落で私有化の難しさの例として出てくるもので、破滅の理由ではありません。","m":"benefit は個人、cost は全員に＝共有地の悲劇"},{"id":14,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"共有資源：成功の条件（NOT問題）","p":"For much of the twentieth century, a simple argument dominated thinking about shared natural resources such as fisheries, forests and pastures. If a resource belongs to no one in particular, each user has a reason to take as much as possible before others do, since the benefit of taking more goes to the individual while the cost of depletion is spread across everyone. The predicted result is ruin. Two remedies seemed to follow: either the state should take control of the resource, or it should be divided into private property so that each owner bears the results of his own actions.\nField research later complicated this picture. Investigators who visited villages managing irrigation systems, mountain pastures and coastal fisheries found that many communities had used shared resources sustainably for generations, without either central control or private ownership. They had developed rules about who could use the resource, when, and how much, and they had ways of monitoring one another and of punishing those who broke the rules, with penalties that grew more severe for repeated offenses.\nThese arrangements were not always successful. They tended to work best where the group of users was clearly defined, where members could take part in changing the rules, and where outside authorities respected the community's right to organize itself. Where those conditions were absent, collapse remained a danger.\nThe lesson drawn by researchers was not that communities always know best, but that the choice between state and market was too narrow. Rules designed by distant officials could ignore local knowledge, and private ownership could be impossible for resources such as migrating fish. Institutions built from below offered a third option, one that policy makers had overlooked.","q":"次の英文を読み、共同体による資源管理がうまくいきやすい条件として、本文で述べられていないものを選びなさい。","c":["The users are wealthy enough to hire outside inspectors.","The group of users is clearly defined.","Members can participate in changing the rules.","Outside authorities respect the community's right to organize itself."],"e":"第3段落は、うまくいきやすい条件として①利用者の集団が明確に定められている、②成員がルールの変更に参加できる、③外部の当局が共同体の自己組織の権利を尊重する、の3つを挙げています。「利用者が外部の監視員を雇えるほど豊かである」は述べられていません。第2段落にあるとおり、監視は互いに行う（monitoring one another）ものとして書かれています。","m":"条件は where ～, where ～, where ～ の並列で探す"},{"id":15,"k":"plan","ref":"想定問題","f":"長文読解（内容一致）","t":"共有資源：研究者の教訓","p":"For much of the twentieth century, a simple argument dominated thinking about shared natural resources such as fisheries, forests and pastures. If a resource belongs to no one in particular, each user has a reason to take as much as possible before others do, since the benefit of taking more goes to the individual while the cost of depletion is spread across everyone. The predicted result is ruin. Two remedies seemed to follow: either the state should take control of the resource, or it should be divided into private property so that each owner bears the results of his own actions.\nField research later complicated this picture. Investigators who visited villages managing irrigation systems, mountain pastures and coastal fisheries found that many communities had used shared resources sustainably for generations, without either central control or private ownership. They had developed rules about who could use the resource, when, and how much, and they had ways of monitoring one another and of punishing those who broke the rules, with penalties that grew more severe for repeated offenses.\nThese arrangements were not always successful. They tended to work best where the group of users was clearly defined, where members could take part in changing the rules, and where outside authorities respected the community's right to organize itself. Where those conditions were absent, collapse remained a danger.\nThe lesson drawn by researchers was not that communities always know best, but that the choice between state and market was too narrow. Rules designed by distant officials could ignore local knowledge, and private ownership could be impossible for resources such as migrating fish. Institutions built from below offered a third option, one that policy makers had overlooked.","q":"次の英文を読み、研究者たちが引き出した教訓として最も適当なものを選びなさい。","c":["Choosing only between state control and private ownership overlooks a third possibility.","Local communities always manage resources better than governments do.","Private ownership is the best solution for resources such as migrating fish.","Rules designed by distant officials are more reliable than local knowledge."],"e":"最終段落に「教訓は、共同体が常に最善を知っているということではなく、国家か市場かという選択が狭すぎたということだ」とあり、下から作られる制度が第三の選択肢だと述べています。正解はこれと一致します。「常に共同体のほうがよい」は not that communities always know best で否定されています。回遊魚は私有が不可能な例として挙げられています。遠くの役人のルールは地域の知識を無視しうると批判されています。","m":"not that A but that B＝Aではなく、Bということ"},{"id":16,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：hard to maintain","p":"Most of us assume that memory works like a recording. We experience an event, store a copy of it somewhere in the brain, and later play it back more or less faithfully. Decades of psychological research have made this picture hard to ( A ). Remembering, it turns out, is less like replaying a video than like rebuilding a scene from scattered pieces, with gaps filled in by expectation and later information.\nIn one well-known type of experiment, people watch a short film of a traffic accident and are then asked questions about it. When the question uses a more violent verb, asking how fast the cars were going when they \"smashed\" rather than \"hit\" each other, people give higher estimates of speed. Some even report seeing broken glass that was never in the film. The wording of a single question, in other words, can [alter] what people believe they saw.\nSuch findings carry serious implications for the courtroom. Eyewitness testimony is often highly persuasive to juries, especially when a witness speaks with confidence. Yet confidence and accuracy are only loosely related, and a witness's certainty may grow over time as the story is retold, even as the memory itself becomes less reliable. Several cases in which convicted people were later cleared by new evidence had relied heavily on witnesses who were ( B ) but mistaken.\nIt would be wrong, however, to conclude that memory is simply defective. A system that rebuilds rather than records has advantages. It allows us to draw general lessons from particular experiences, to combine fragments into new ideas, and to imagine the future by rearranging pieces of the past. The flexibility that makes memory unreliable as a witness may be the very feature that makes it useful as a guide to action.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["maintain","abandon","criticize","overlook"],"e":"直前の文は「記憶は録画のようなものだ」という通念、直後の文は「想起は断片から場面を組み立て直すことに近い」と、通念を否定しています。したがって「数十年の研究によって、この見方は維持しにくくなった」となる maintain が正解です。abandon（捨てる）や criticize（批判する）を入れると「捨てにくく／批判しにくくなった」となり、通念を支持する逆の意味になります。overlook（見落とす）も文脈に合いません。","m":"make A hard to maintain＝Aを支持しにくくする"},{"id":17,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：alter","p":"Most of us assume that memory works like a recording. We experience an event, store a copy of it somewhere in the brain, and later play it back more or less faithfully. Decades of psychological research have made this picture hard to ( A ). Remembering, it turns out, is less like replaying a video than like rebuilding a scene from scattered pieces, with gaps filled in by expectation and later information.\nIn one well-known type of experiment, people watch a short film of a traffic accident and are then asked questions about it. When the question uses a more violent verb, asking how fast the cars were going when they \"smashed\" rather than \"hit\" each other, people give higher estimates of speed. Some even report seeing broken glass that was never in the film. The wording of a single question, in other words, can [alter] what people believe they saw.\nSuch findings carry serious implications for the courtroom. Eyewitness testimony is often highly persuasive to juries, especially when a witness speaks with confidence. Yet confidence and accuracy are only loosely related, and a witness's certainty may grow over time as the story is retold, even as the memory itself becomes less reliable. Several cases in which convicted people were later cleared by new evidence had relied heavily on witnesses who were ( B ) but mistaken.\nIt would be wrong, however, to conclude that memory is simply defective. A system that rebuilds rather than records has advantages. It allows us to draw general lessons from particular experiences, to combine fragments into new ideas, and to imagine the future by rearranging pieces of the past. The flexibility that makes memory unreliable as a witness may be the very feature that makes it useful as a guide to action.","q":"次の英文を読み、下線部［alter］に最も意味が近いものを選びなさい。","c":["modify","confirm","record","reveal"],"e":"alter は「変える・改変する」の意味で、modify が最も近いです。直前で、質問の動詞を smashed にすると速度の推定が上がり、存在しなかった割れたガラスを見たと報告する人まで出る、と述べています。つまり質問の言い回し一つで「見たと信じている内容」が変わってしまうということです。confirm（確認する）、record（記録する）、reveal（明らかにする）では、記憶が書き換わるという実験の要点を表せません。","m":"alter＝modify＝change"},{"id":18,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：confident but mistaken","p":"Most of us assume that memory works like a recording. We experience an event, store a copy of it somewhere in the brain, and later play it back more or less faithfully. Decades of psychological research have made this picture hard to ( A ). Remembering, it turns out, is less like replaying a video than like rebuilding a scene from scattered pieces, with gaps filled in by expectation and later information.\nIn one well-known type of experiment, people watch a short film of a traffic accident and are then asked questions about it. When the question uses a more violent verb, asking how fast the cars were going when they \"smashed\" rather than \"hit\" each other, people give higher estimates of speed. Some even report seeing broken glass that was never in the film. The wording of a single question, in other words, can [alter] what people believe they saw.\nSuch findings carry serious implications for the courtroom. Eyewitness testimony is often highly persuasive to juries, especially when a witness speaks with confidence. Yet confidence and accuracy are only loosely related, and a witness's certainty may grow over time as the story is retold, even as the memory itself becomes less reliable. Several cases in which convicted people were later cleared by new evidence had relied heavily on witnesses who were ( B ) but mistaken.\nIt would be wrong, however, to conclude that memory is simply defective. A system that rebuilds rather than records has advantages. It allows us to draw general lessons from particular experiences, to combine fragments into new ideas, and to imagine the future by rearranging pieces of the past. The flexibility that makes memory unreliable as a witness may be the very feature that makes it useful as a guide to action.","q":"次の英文を読み、空所（ B ）に入れるのに最も適当なものを選びなさい。","c":["confident","hesitant","dishonest","absent"],"e":"この段落は「陪審員は自信をもって話す証人に説得されやすいが、自信と正確さの関係は弱い」と述べています。その例として、後に無実とわかった事件は「自信はあるが間違っていた」証人に大きく頼っていた、とつながるので confident が正解です。hesitant（ためらいがちな）では、自信の問題を論じる段落の流れに合いません。dishonest（不誠実な）は意図的なうそを意味し、記憶の誤りという論点とずれます。absent（不在の）は証言と両立しません。","m":"confidence と accuracy は別物"},{"id":19,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"空所補充：revived the debate","p":"Every wave of technological change has been accompanied by fears that machines will leave large numbers of people without work. In the early nineteenth century, textile workers in England smashed the machines they believed were destroying their livelihoods. Similar fears returned with the computer. Today, advances in artificial intelligence have ( A ) the debate once more.\nLooking back, economists generally conclude that the most dramatic predictions did not come true. Although particular jobs vanished, new ones emerged. Rising productivity lowered prices, which left consumers with more money to spend on other goods and services, and that spending in turn created demand for workers elsewhere.\nThis reassuring story, however, [glosses over] an important point. The fact that employment recovered in the long run says little about the people who lost their jobs in the short run. A weaver in his fifties could not easily become a railway engineer, and many displaced workers never regained their former income. The gains from technology were real, but they were unevenly shared, across groups and generations.\nSome researchers argue that the present wave may differ from earlier ones in a crucial respect. Earlier machines mainly replaced physical labor or routine calculation, leaving tasks that required judgment, language and social skill to human beings. Newer systems are beginning to perform some of these tasks as well. If so, the range of work in which humans keep a clear advantage may shrink faster than before. ( B ), others caution that such predictions have been made before, and that the capacity of economies to invent new kinds of work has often been underestimated. Both sides agree that the pace of adjustment, and who bears its costs, will depend heavily on public policy.","q":"次の英文を読み、空所（ A ）に入れるのに最も適当なものを選びなさい。","c":["revived","settled","abandoned","prevented"],"e":"第1段落は、機械が仕事を奪うという不安が19世紀の織物労働者の時代からコンピュータの時代まで繰り返し現れてきたと述べています。そして「今日、AIの進歩がその議論を再び（once more）〜した」と続くので、「よみがえらせた」の revived が正解です。settled（決着させた）や abandoned（放棄した）は once more と合わず、第4段落で議論が続いていることとも矛盾します。prevented（妨げた）も文意に合いません。","m":"once more がヒント＝revive（再燃させる）"},{"id":20,"k":"plan","ref":"想定問題","f":"長文読解（語句・空所・言い換え）","t":"言い換え：gloss over","p":"Every wave of technological change has been

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>早稲田 日本史 10問テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 一枚の答案用紙。中央1カラム（最大640px）。問題文は試験冊子と同じ明朝、操作と数字はゴシック。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.passage{font-family:var(--f-exam);font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:50vh;overflow-y:auto}
.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){ .q{font-size:17px} .score b{font-size:44px} .fi{grid-template-columns:minmax(0,1fr)} .fi .btn{grid-column:1;grid-row:auto;justify-self:start} }
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

<script>
(function(){
"use strict";
var QS=[{"id":1,"k":"plan","ref":"想定問題","f":"原始・古代","t":"岩宿遺跡","y":-20000,"q":"1946年、群馬県の関東ローム層の中から打製石器を発見し、日本列島に旧石器時代の文化が存在したことを明らかにするきっかけをつくった人物はだれですか。","c":["相沢忠洋","モース","直良信夫","坪井正五郎"],"e":"相沢忠洋は行商のかたわら考古資料を集め、群馬県の岩宿で関東ローム層（更新世の火山灰層）から打製石器を見つけました。その後の発掘調査で、日本にも旧石器時代の文化があったことが確かめられました。モースは大森貝塚を発掘したアメリカ人、直良信夫は明石で人骨（明石原人骨）を発見した人物、坪井正五郎は明治期の人類学者です。","m":"岩宿＝群馬・関東ローム層・相沢忠洋"},{"id":2,"k":"plan","ref":"想定問題","f":"原始・古代","t":"縄文時代の生活","y":-3000,"q":"縄文時代について述べた次のア〜エのうち、正しいものの組合せはどれですか。\nア 青森県の三内丸山遺跡は大規模な集落跡で、大型の掘立柱建物の跡が見つかっている。\nイ 黒曜石の産地として長野県の和田峠や北海道の白滝が知られ、広い範囲に運ばれた。\nウ 死者は手足を伸ばした伸展葬で葬るのが一般的だった。\nエ 土器は窖窯（あながま）を用いて高温で焼かれた。","c":["ア・イ","ア・ウ","イ・エ","ウ・エ"],"e":"ア：三内丸山遺跡は縄文時代前期〜中期の大集落で、大型掘立柱建物跡が有名です。イ：黒曜石は和田峠・白滝・隠岐・姫島などから遠くまで運ばれ、交易があったことを示します。ウは誤りで、縄文時代は手足を折り曲げた屈葬が多く見られます。エも誤りで、窖窯で高温で焼くのは古墳時代に朝鮮半島から伝わった須恵器です。縄文土器は野焼きの低温焼成です。","m":"縄文＝屈葬・野焼き、窖窯は須恵器"},{"id":3,"k":"plan","ref":"想定問題","f":"原始・古代","t":"初期の水田遺跡","y":-400,"q":"佐賀県唐津市で発見され、縄文時代晩期にさかのぼる水田跡が確認されたことで、水稲耕作の開始時期を見直すきっかけとなった遺跡はどれですか。","c":["菜畑遺跡","吉野ヶ里遺跡","登呂遺跡","唐古・鍵遺跡"],"e":"菜畑遺跡（佐賀県唐津市）では縄文時代晩期の水田跡が見つかり、福岡県の板付遺跡とともに稲作が弥生時代より前に始まっていたことを示しました。吉野ヶ里遺跡も佐賀県ですが、弥生時代の大規模な環濠集落です。登呂遺跡は静岡県の弥生時代後期の水田・集落跡、唐古・鍵遺跡は奈良県の弥生時代の環濠集落です。","m":"縄文晩期の水田＝菜畑（佐賀）・板付（福岡）"},{"id":4,"k":"plan","ref":"想定問題","f":"原始・古代","t":"漢書地理志","y":-50,"q":"次の史料の出典として正しいものはどれですか。\n「夫れ楽浪海中に倭人有り、分れて百余国と為る。歳時を以て来り献見すと云ふ。」","c":["『漢書』地理志","『後漢書』東夷伝","『魏志』倭人伝","『宋書』倭国伝"],"e":"この一節は『漢書』地理志で、紀元前1世紀ごろの倭が百余りの小国に分かれ、前漢が朝鮮半島に置いた楽浪郡に定期的に使いを送っていたことを伝えます。『後漢書』東夷伝は57年の奴国の朝貢や107年の帥升の朝貢、『魏志』倭人伝は3世紀の邪馬台国と卑弥呼、『宋書』倭国伝は5世紀の倭の五王を記しています。","m":"百余国・楽浪＝漢書地理志（前1世紀）"},{"id":5,"k":"plan","ref":"想定問題","f":"原始・古代","t":"帥升の朝貢","y":107,"q":"『後漢書』東夷伝によれば、107年に後漢の安帝に生口160人を献じた倭の国王はだれですか。","c":["帥升","難升米","壱与（台与）","武"],"e":"『後漢書』東夷伝は、57年に倭の奴国王が光武帝から印綬を受けたこと、107年に倭国王帥升らが生口（奴隷とみられる人々）160人を献じたことを記しています。難升米は卑弥呼が魏に送った使者、壱与は卑弥呼の死後に王となった一族の娘、武は5世紀に宋に上表文を送った倭王で、雄略天皇にあたると考えられています。","m":"57年奴国王→107年帥升（生口160人）"},{"id":6,"k":"plan","ref":"想定問題","f":"原始・古代","t":"ワカタケル大王の刀剣","y":471,"q":"「獲加多支鹵大王」の名を記した銘文をもつ刀剣について、出土した古墳・所在地・刀剣の種類の組合せとして正しいものはどれですか。","c":["稲荷山古墳（埼玉県）―鉄剣、江田船山古墳（熊本県）―鉄刀","稲荷山古墳（熊本県）―鉄剣、江田船山古墳（埼玉県）―鉄刀","稲荷山古墳（埼玉県）―鉄刀、江田船山古墳（熊本県）―鉄剣","稲荷山古墳（埼玉県）―鉄剣、江田船山古墳（奈良県）―鉄刀"],"e":"埼玉県行田市の稲荷山古墳から出土した鉄剣には「辛亥年」（471年とする説が有力）と「獲加多支鹵大王」の銘が金象嵌で刻まれています。熊本県の江田船山古墳出土の鉄刀（大刀）にも同じ大王名と読める銘があります。東西の遠く離れた地域で同じ大王名が見えることから、5世紀後半にヤマト政権の支配が関東から九州に及んでいたと考えられます。","m":"稲荷山＝埼玉・剣、江田船山＝熊本・刀"},{"id":7,"k":"plan","ref":"想定問題","f":"原始・古代","t":"天武・持統朝の整序","y":684,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 八色の姓が定められた。\nイ 最初の全国的な戸籍である庚午年籍がつくられた。\nウ 飛鳥浄御原令が施行された。\nエ 藤原京に都が移された。","c":["イ→ア→ウ→エ","ア→イ→ウ→エ","イ→ウ→ア→エ","ア→イ→エ→ウ"],"e":"庚午年籍は天智天皇のもとで670年に作られました（イ）。天武天皇は684年に八色の姓を定めて豪族を天皇中心の秩序に組み込みました（ア）。天武の死後、持統天皇が689年に飛鳥浄御原令を施行し（ウ）、694年に藤原京へ遷都しました（エ）。天智朝→天武朝→持統朝という流れで整理すると間違えにくくなります。","m":"670庚午年籍→684八色の姓→689浄御原令→694藤原京"},{"id":8,"k":"plan","ref":"想定問題","f":"原始・古代","t":"改新の詔","y":646,"q":"次の史料は、646年に出されたとされる詔の一節です。この史料が収められている書物はどれですか。\n「昔在の天皇等の立てたまへる子代の民、処々の屯倉、及び、別には臣・連・伴造・国造・村首の所有る部曲の民、処々の田荘を罷めよ。」","c":["『日本書紀』","『続日本紀』","『古事記』","『日本後紀』"],"e":"これは改新の詔の第一条で、皇族の私有民（子代）や直轄地（屯倉）、豪族の私有民（部曲）や私有地（田荘）を廃止して公地公民制をめざす方針を示したものです。『日本書紀』（720年完成、六国史の最初）に収められています。ただし文言には後の大宝令による潤色があるとされます。『続日本紀』は文武天皇から桓武天皇の時代、『日本後紀』は桓武〜淳和天皇の時代を扱い、『古事記』は推古天皇までの神話・伝承の書です。","m":"改新の詔＝日本書紀所収（潤色説あり）"},{"id":9,"k":"plan","ref":"想定問題","f":"原始・古代","t":"律令の八省","y":701,"q":"律令制の八省とその主な職務の組合せとして正しいものはどれですか。","c":["治部省―仏事・僧尼の管理や外交事務","式部省―戸籍・租税の管理","中務省―武官の人事と軍事","宮内省―大学寮を通じた官吏の養成"],"e":"治部省は仏事・僧尼の管理、外交使節の接待、諸氏の姓の管理などを担当しました。戸籍・租税を扱ったのは民部省で、式部省は文官の人事と大学寮を管轄しました。中務省は天皇の側近として詔書の作成などを担当し、武官の人事・軍事は兵部省です。宮内省は宮中の事務を扱いましたが、大学寮は式部省の管轄です。","m":"大学寮は式部省、戸籍・租税は民部省"},{"id":10,"k":"plan","ref":"想定問題","f":"原始・古代","t":"加墾禁止令","y":765,"q":"765年、寺院や一部の開墾を除いて新たな墾田の開発を禁止する法令が出されました。このときに政権の中心にいた人物はだれですか。","c":["道鏡","藤原仲麻呂","橘諸兄","藤原百川"],"e":"恵美押勝（藤原仲麻呂）の乱（764年）の後、称徳天皇の信任を得た道鏡が太政大臣禅師・法王として権力をにぎりました。765年の加墾禁止令は寺院を例外とし、貴族や豪族の開墾を抑えたもので、772年に解除されました。墾田永年私財法（743年）は橘諸兄政権、藤原仲麻呂は淳仁天皇のもとで権力をふるいました。藤原百川は道鏡失脚後に光仁天皇の擁立に関わった人物です。","m":"743永年私財法→765加墾禁止（道鏡）→772解除"},{"id":11,"k":"plan","ref":"想定問題","f":"原始・古代","t":"奈良時代の政変","y":740,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 橘奈良麻呂が藤原仲麻呂の打倒をはかり、失敗した。\nイ 大宰府で藤原広嗣が反乱をおこした。\nウ 宇佐八幡宮の神託をめぐり、和気清麻呂が配流された。\nエ 左大臣長屋王が謀反の疑いで自害させられた。","c":["エ→イ→ア→ウ","イ→エ→ア→ウ","エ→ア→イ→ウ","エ→イ→ウ→ア"],"e":"長屋王の変は729年で、藤原四子が勢力を伸ばすきっかけとなりました（エ）。四子の死後、橘諸兄政権下で玄昉・吉備真備の排除を求めて藤原広嗣が740年に挙兵しました（イ）。757年には橘奈良麻呂の変がおこり、仲麻呂の権力が強まりました（ア）。769年の宇佐八幡宮神託事件では、道鏡を皇位につけようとする動きを和気清麻呂が阻み、配流されました（ウ）。","m":"729長屋王→740広嗣→757奈良麻呂→769神託事件"},{"id":12,"k":"plan","ref":"想定問題","f":"原始・古代","t":"天平彫刻の技法","y":750,"q":"天平期の仏像とその制作技法の組合せとして正しいものはどれですか。","c":["東大寺法華堂執金剛神像―塑像","興福寺阿修羅像―塑像","唐招提寺鑑真像―一木造","東大寺法華堂不空羂索観音像―寄木造"],"e":"天平期には粘土で造る塑像と、漆で麻布を貼り固める乾漆像が盛んでした。東大寺法華堂の執金剛神像や日光・月光菩薩像は塑像です。興福寺阿修羅像、唐招提寺鑑真像、東大寺法華堂不空羂索観音像はいずれも乾漆像です。一木造は平安初期（弘仁・貞観文化）、寄木造は平安中期に定朝が完成させた技法なので、時代も合いません。","m":"法華堂執金剛神＝塑像、阿修羅・鑑真＝乾漆"},{"id":13,"k":"plan","ref":"想定問題","f":"原始・古代","t":"平安初期の政治改革","y":810,"q":"平安時代初期の政治について述べた文として正しいものはどれですか。","c":["嵯峨天皇は平城太上天皇との対立に際して蔵人頭を置き、藤原冬嗣らを任じた。","桓武天皇は東北・九州などを除いて軍団を廃し、郡司の子弟から防人を選んだ。","醍醐天皇の命で、養老令の官撰注釈書である『令義解』が編纂された。","清和天皇の時代に、弘仁格式が完成した。"],"e":"嵯峨天皇は810年の平城太上天皇の変（薬子の変）に際して蔵人所を設け、藤原冬嗣・巨勢野足を蔵人頭としました。桓武天皇が軍団に代えて置いたのは健児で、郡司の子弟などから選ばれました。『令義解』は淳和天皇の命で清原夏野らが編纂した官撰注釈書です。弘仁格式は嵯峨天皇、貞観格式が清和天皇、延喜格式が醍醐天皇の時代です。","m":"蔵人頭＝嵯峨・冬嗣、令義解＝淳和・清原夏野"},{"id":14,"k":"plan","ref":"想定問題","f":"原始・古代","t":"阿衡の紛議","y":887,"q":"宇多天皇が藤原基経を関白に任じる際の勅書の文言をめぐって基経が政務を見なくなった事件で、勅書を起草した責任を問われた人物はだれですか。","c":["橘広相","菅原道真","伴善男","橘逸勢"],"e":"887年、宇多天皇が基経を関白とする勅書に「阿衡に任ず」とあったことから、基経は阿衡は位だけで職務がないとして政務を放棄しました（阿衡の紛議）。天皇は勅書を撤回し、起草者の橘広相が責任を問われました。菅原道真は宇多天皇に重用され、901年に大宰府に左遷されました。伴善男は応天門の変（866年）、橘逸勢は承和の変（842年）で失脚した人物です。","m":"阿衡の紛議＝基経・宇多・起草者橘広相"},{"id":15,"k":"plan","ref":"想定問題","f":"原始・古代","t":"鹿子木荘","y":1086,"q":"次の史料は寄進地系荘園の成立を示すものとして知られています。この荘園が所在した国はどこですか。\n「鹿子木の事　一、当寺の相承は、開発領主沙弥寿妙嫡々相伝の次第なり。」","c":["肥後国","紀伊国","大和国","山城国"],"e":"これは東寺に伝わった「東寺百合文書」中の鹿子木荘の由来を記した文書で、肥後国（現在の熊本県）の荘園です。開発領主寿妙の子孫中原高方が、1086年に大宰大弐藤原実政に寄進して預所職を確保し、さらに実政の子孫が高陽院内親王に寄進して本家とした経緯が書かれています。開発領主→領家→本家という重層的な寄進の仕組みを示す代表的な史料です。","m":"鹿子木荘＝肥後、開発領主→領家→本家"},{"id":16,"k":"plan","ref":"想定問題","f":"原始・古代","t":"浄土教と国風文化","y":985,"q":"国風文化について述べた次のア〜エのうち、正しいものの組合せはどれですか。\nア 慶滋保胤は、往生を遂げた人々の伝記を集めた『日本往生極楽記』を著した。\nイ 良源は、念仏による極楽往生の方法を説いた『往生要集』を著した。\nウ 定朝は寄木造の技法を完成させ、平等院鳳凰堂の阿弥陀如来像を制作した。\nエ 『古今和歌集』は、村上天皇の命によって編纂された。","c":["ア・ウ","ア・イ","イ・エ","ウ・エ"],"e":"アは正しく、『日本往生極楽記』は慶滋保胤による往生伝です。イは誤りで、『往生要集』（985年）の著者は源信（恵心僧都）です。良源は源信の師にあたる天台座主です。ウは正しく、定朝は寄木造を完成させ、藤原頼通が建てた平等院鳳凰堂の阿弥陀如来像を造りました。エは誤りで、『古今和歌集』は醍醐天皇の命で紀貫之らが編纂した最初の勅撰和歌集です。","m":"往生要集＝源信、極楽記＝保胤、古今集＝醍醐"},{"id":17,"k":"plan","ref":"想定問題","f":"原始・古代","t":"尾張国郡司百姓等解","y":988,"q":"988年、尾張国の郡司や百姓が国守の非法を31か条にわたって太政官に訴え、その国守は解任されました。この国守はだれですか。","c":["藤原元命","藤原陳忠","藤原純友","平将門"],"e":"「尾張国郡司百姓等解」は、受領の藤原元命が不当な徴税や非法を行ったことを訴えた文書で、受領の強欲な支配を示す史料として知られます。藤原陳忠は信濃守で、『今昔物語集』に「受領は倒るる所に土をつかめ」の話が残る人物です。藤原純友は伊予を拠点に瀬戸内海で、平将門は関東で10世紀前半に反乱をおこしました（承平・天慶の乱）。","m":"尾張の訴え＝藤原元命、倒るる所に土＝陳忠"},{"id":18,"k":"plan","ref":"想定問題","f":"原始・古代","t":"院政期の荘園群","y":1190,"q":"後白河法皇が自らの持仏堂に寄進して形成され、のちに持明院統に伝えられた荘園群はどれですか。","c":["長講堂領","八条院領","殿下渡領","安楽寿院領"],"e":"院政期には上皇のもとに多くの荘園が寄進されました。長講堂領は後白河法皇が持仏堂の長講堂に寄せた荘園群で、皇女宣陽門院を経て持明院統の経済基盤となりました。八条院領は鳥羽上皇が皇女八条院（暲子内親王）に伝えたもので、のち大覚寺統に伝わりました。殿下渡領は摂関家の氏長者が受け継ぐ所領、安楽寿院領は鳥羽上皇が建立した安楽寿院に寄進された荘園群で、八条院領に含まれていきました。","m":"長講堂領→持明院統、八条院領→大覚寺統"},{"id":19,"k":"plan","ref":"想定問題","f":"原始・古代","t":"平氏政権の展開","y":1179,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 鹿ケ谷で平氏打倒の陰謀が発覚した。\nイ 平清盛が太政大臣に就任した。\nウ 以仁王が平氏打倒の令旨を発して挙兵した。\nエ 清盛が後白河法皇を幽閉し、院政を停止させた。","c":["イ→ア→エ→ウ","ア→イ→エ→ウ","イ→エ→ア→ウ","イ→ア→ウ→エ"],"e":"平清盛は1167年に武士として初めて太政大臣となりました（イ）。1177年、藤原成親や僧俊寛らによる鹿ケ谷の陰謀が発覚しました（ア）。1179年、清盛は後白河法皇を鳥羽殿に幽閉し、多数の貴族を解官しました（治承三年の政変、エ）。翌1180年、以仁王が源頼政とともに挙兵し（ウ）、源平の争乱が始まりました。","m":"1167太政大臣→1177鹿ケ谷→1179幽閉→1180以仁王"},{"id":20,"k":"plan","ref":"想定問題","f":"原始・古代","t":"巨大古墳の分布","y":450,"q":"岡山県に所在し、全国でも上位の規模をもつ5世紀の前方後円墳で、吉備地方の豪族の強大な力を示すものはどれですか。","c":["造山古墳","箸墓古墳","大仙陵古墳","誉田御廟山古墳"],"e":"造山古墳（岡山市）は墳丘長約350mで全国第4位の規模をもち、吉備の豪族がヤマト政権の大王に匹敵する力をもっていたことを示します。箸墓古墳は奈良県桜井市の出現期（3世紀後半）の前方後円墳です。大仙陵古墳（大阪府堺市、伝仁徳天皇陵）と誉田御廟山古墳（大阪府羽曳野市、伝応神天皇陵）は5世紀の巨大古墳ですが、いずれも大阪府にあります。","m":"吉備の巨大古墳＝造山古墳（岡山）"},{"id":21,"k":"plan","ref":"想定問題","f":"中世","t":"鎌倉幕府の初期機構","y":1184,"q":"源頼朝が整えた鎌倉幕府の機関と、その長官（初代）の組合せとして正しいものはどれですか。","c":["問注所―三善康信","侍所―三善康信","公文所―和田義盛","政所―梶原景時"],"e":"1180年に御家人を統率する侍所が置かれ、別当に和田義盛が任じられました。1184年には一般政務を扱う公文所（のちの政所）が設けられ、京下りの官人大江広元が別当となりました。同じ年、訴訟を扱う問注所が置かれ、三善康信が執事となりました。梶原景時は侍所の所司（次官）を務めた人物で、政所の長官ではありません。","m":"侍所＝和田義盛、公文所＝大江広元、問注所＝三善康信"},{"id":22,"k":"plan","ref":"想定問題","f":"中世","t":"承久の乱の処分","y":1221,"q":"承久の乱の後、幕府は乱にかかわった上皇を配流しました。上皇と配流先の組合せとして正しいものはどれですか。","c":["後鳥羽上皇―隠岐、順徳上皇―佐渡","後鳥羽上皇―佐渡、順徳上皇―隠岐","後鳥羽上皇―隠岐、順徳上皇―土佐","後鳥羽上皇―土佐、順徳上皇―佐渡"],"e":"1221年、後鳥羽上皇は北条義時追討の院宣を出しましたが、幕府軍に敗れました。幕府は後鳥羽上皇を隠岐、順徳上皇を佐渡に流し、乱に直接加わらなかった土御門上皇も自ら土佐（のち阿波）に移りました。仲恭天皇は廃され、後堀河天皇が立てられました。幕府は京都に六波羅探題を置き、上皇方の所領に新補地頭を任命しました。","m":"後鳥羽＝隠岐、順徳＝佐渡、土御門＝土佐"},{"id":23,"k":"plan","ref":"想定問題","f":"中世","t":"御成敗式目","y":1232,"q":"次の史料は1232年に制定された法の一節です。この法を制定した執権と、文中の「右大将家」にあたる人物の組合せとして正しいものはどれですか。\n「諸国守護人奉行の事　右、右大将家の御時定め置かるる所は、大番催促・謀叛・殺害人付たり。夜討・強盗・山賊・海賊等の事なり。」","c":["北条泰時―源頼朝","北条泰時―源実朝","北条時頼―源頼朝","北条義時―源頼朝"],"e":"御成敗式目（貞永式目）は1232年に執権北条泰時が制定した武家法で、頼朝以来の先例と武家社会の道理を基準としました。この条文は守護の職権を大犯三カ条（大番催促・謀叛人と殺害人の逮捕）などに限ると定めたもので、「右大将家」は右近衛大将に任じられた源頼朝を指します。北条義時は泰時の父で承久の乱時の執権、北条時頼は引付衆を設けた5代執権です。","m":"式目＝泰時、右大将家＝頼朝、大犯三カ条"},{"id":24,"k":"plan","ref":"想定問題","f":"中世","t":"北条時頼の政治","y":1249,"q":"鎌倉幕府の5代執権北条時頼の事績として誤っているものはどれですか。","c":["評定衆を新たに設け、有力御家人らによる合議で政務を決定する体制をつくった。","引付衆を置いて、御家人の所領に関する訴訟を迅速・公正に処理しようとした。","宝治合戦で有力御家人の三浦泰村一族を滅ぼした。","摂家将軍を廃して後嵯峨上皇の皇子宗尊親王を将軍に迎えた。"],"e":"評定衆を設けたのは3代執権北条泰時で、1225年に連署とともに置かれました。時頼は1247年の宝治合戦で三浦泰村を滅ぼして北条氏の地位を固め、1249年に評定衆のもとに引付衆を置いて所領訴訟の迅速化をはかりました。また1252年には藤原（九条）頼嗣を廃して宗尊親王を最初の皇族将軍として迎えました。","m":"泰時＝評定衆・連署、時頼＝引付衆・宝治合戦"},{"id":25,"k":"plan","ref":"想定問題","f":"中世","t":"蒙古襲来後の幕府","y":1285,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 安達泰盛が内管領平頼綱に滅ぼされた。\nイ 博多に鎮西探題が置かれた。\nウ 御家人の所領の売却・質入れを禁じ、売却地を無償で取り戻させる法令が出された。\nエ 元・高麗軍に旧南宋軍を加えた大軍が九州北部に襲来した。","c":["エ→ア→イ→ウ","ア→エ→イ→ウ","エ→ア→ウ→イ","エ→イ→ア→ウ"],"e":"1281年の弘安の役（エ）の後、1285年に御家人の代表格の安達泰盛が内管領平頼綱に滅ぼされ（霜月騒動、ア）、得宗専制が強まりました。1293年には九州の御家人を統轄し裁判を行う鎮西探題が博多に置かれました（イ）。1297年には困窮した御家人を救うため永仁の徳政令が出されました（ウ）。","m":"1281弘安→1285霜月騒動→1293鎮西探題→1297永仁徳政令"},{"id":26,"k":"plan","ref":"想定問題","f":"中世","t":"旧仏教の革新","y":1212,"q":"法然の『選択本願念仏集』を批判して『摧邪輪』を著した華厳宗の僧はだれですか。","c":["明恵（高弁）","貞慶（解脱）","叡尊","忍性"],"e":"鎌倉時代には新仏教の広がりに対して旧仏教側でも革新の動きがおこりました。華厳宗の明恵（高弁）は京都栂尾の高山寺を再興し、『摧邪輪』で法然の専修念仏を批判しました。法相宗の貞慶（解脱）も「興福寺奏状」で法然の教えを批判しましたが、『摧邪輪』の著者ではありません。律宗の叡尊は西大寺を拠点に戒律を復興し、弟子の忍性は奈良に北山十八間戸を設けて病人の救済に努めました。","m":"摧邪輪＝明恵、興福寺奏状＝貞慶"},{"id":27,"k":"plan","ref":"想定問題","f":"中世","t":"鎌倉時代の建築様式","y":1200,"q":"鎌倉時代の建築とその様式の組合せとして正しいものはどれですか。","c":["観心寺金堂―折衷様","円覚寺舎利殿―大仏様","東大寺南大門―禅宗様","蓮華王院本堂―折衷様"],"e":"東大寺南大門は重源が宋から取り入れた大仏様（天竺様）の代表で、豪放な構造が特色です。円覚寺舎利殿は細かな部材を整然と組む禅宗様（唐様）の代表です。蓮華王院本堂（三十三間堂）は日本古来の和様の建築です。河内の観心寺金堂は、和様に大仏様・禅宗様の要素を取り入れた折衷様の代表例です。","m":"南大門＝大仏様、舎利殿＝禅宗様、観心寺＝折衷様"},{"id":28,"k":"plan","ref":"想定問題","f":"中世","t":"二条河原落書","y":1334,"q":"次の史料は建武の新政期の京都の混乱を風刺したものです。この史料が収められている書物はどれですか。\n「此比都ニハヤル物　夜討　強盗　謀綸旨　召人　早馬　虚騒動」","c":["『建武年間記』","『太平記』","『梅松論』","『神皇正統記』"],"e":"これは二条河原落書の冒頭で、建武の新政の混乱や、にせの綸旨が出回る様子を風刺しています。『建武年間記』（建武記）に収められています。『太平記』は南北朝の動乱を描いた軍記物語、『梅松論』は足利氏の立場から幕府成立の経緯を述べた歴史書、『神皇正統記』は北畠親房が南朝の正統性を説いた歴史書です。","m":"二条河原落書＝『建武年間記』所収"},{"id":29,"k":"plan","ref":"想定問題","f":"中世","t":"観応の半済令","y":1352,"q":"1352年に室町幕府が出した最初の半済令で、荘園・公領の年貢の半分を兵粮料として徴発することが認められた国の組合せはどれですか。","c":["近江・美濃・尾張","山城・大和・河内","近江・美濃・伊勢","尾張・三河・遠江"],"e":"観応の擾乱のさなかの1352年、幕府は近江・美濃・尾張の3国に限り、1年間だけ荘園・公領の年貢の半分を軍費として守護に徴収させる半済令を出しました。その後、対象地域と期間は広がり、1368年の応安の半済令では土地そのものを分割する形となりました。半済によって守護は国内の武士を家臣化し、守護大名へと成長していきました。","m":"最初の半済＝近江・美濃・尾張、1年限り"},{"id":30,"k":"plan","ref":"想定問題","f":"中世","t":"室町幕府の四職","y":1400,"q":"室町幕府で侍所の長官（所司）に任じられる家柄を四職といいます。四職に含まれない家はどれですか。","c":["斯波氏","赤松氏","一色氏","京極氏"],"e":"四職は赤松・一色・山名・京極の4氏で、京都の警備や刑事裁判をつかさどる侍所の所司に交代で任じられました。斯波氏は細川・畠山両氏とともに将軍を補佐する管領に任じられる三管領の家柄です。三管領はいずれも足利一門ですが、四職には赤松氏のような外様の家も含まれます。","m":"三管領＝細川・斯波・畠山、四職＝赤松・一色・山名・京極"},{"id":31,"k":"plan","ref":"想定問題","f":"中世","t":"有力守護の反乱","y":1391,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 山名氏清らが幕府に反抗して敗れた。\nイ 堺で挙兵した大内義弘が幕府軍に討たれた。\nウ 美濃などの守護土岐康行が討伐された。\nエ 前関東管領上杉氏憲（禅秀）が鎌倉公方足利持氏にそむいた。","c":["ウ→ア→イ→エ","ア→ウ→イ→エ","ウ→イ→ア→エ","ア→イ→ウ→エ"],"e":"足利義満は有力守護の勢力削減をはかり、1390年に土岐康行を討ち（土岐康行の乱、ウ）、1391年には「六分の一殿」と呼ばれた山名氏の内紛に乗じて山名氏清を滅ぼしました（明徳の乱、ア）。1399年には大内義弘を堺で討ちました（応永の乱、イ）。1416年の上杉禅秀の乱（エ）は義満の死後、鎌倉府内部でおこった反乱です。","m":"1390土岐→1391明徳→1399応永→1416禅秀"},{"id":32,"k":"plan","ref":"想定問題","f":"中世","t":"日明貿易の展開","y":1523,"q":"日明貿易について述べた文として正しいものはどれですか。","c":["寧波で大内氏と細川氏の使節が争ったのち、貿易は大内氏がほぼ独占した。","足利義持は明の冊封を積極的に受け入れ、貿易を拡大した。","日明貿易では朝貢形式をとらず、両国が対等な立場で交易を行った。","足利義満は博多商人肥富と禅僧絶海中津を明に派遣して国交を開いた。"],"e":"1523年、大内氏と細川氏の派遣した使節が寧波で衝突し（寧波の乱）、その後は博多商人と結ぶ大内氏が貿易を独占しましたが、1551年の大内氏滅亡で途絶えました。足利義持は朝貢形式を嫌って貿易を一時中断し、義教が再開しました。日明貿易は日本国王が明皇帝に朝貢する形式で、勘合を用いました。1401年に義満が派遣したのは僧の祖阿と博多商人の肥富です。","m":"1401祖阿・肥富→義持中断→義教再開→寧波の乱"},{"id":33,"k":"plan","ref":"想定問題","f":"中世","t":"コシャマインの戦い","y":1457,"q":"1457年におこったアイヌの首長コシャマインの蜂起を鎮圧し、のちに蠣崎氏を継いでその勢力拡大の基礎をつくった人物はだれですか。","c":["武田信広","蠣崎慶広","安藤（安東）季長","尚巴志"],"e":"14世紀には津軽の十三湊を拠点とする安藤（安東）氏が蝦夷ヶ島との交易で栄え、道南には和人の館（道南十二館）がつくられました。1457年、和人の進出に反発したアイヌがコシャマインを中心に蜂起しましたが、武田信広が鎮圧し、のち蠣崎氏を継ぎました。蠣崎慶広はその子孫で、豊臣秀吉や徳川家康から蝦夷地での交易独占を認められ、松前氏を称しました。尚巴志は1429年に琉球王国を統一した人物です。","m":"コシャマイン鎮圧＝武田信広→蠣崎→松前氏"},{"id":34,"k":"plan","ref":"想定問題","f":"中世","t":"正長の土一揆","y":1428,"q":"次の史料の出典として正しいものはどれですか。\n「一天下の土民蜂起す。徳政と号し、酒屋、土倉、寺院等を破却せしめ、雑物等恣にこれを取り、借銭等悉くこれを破る。（中略）日本開白以来、土民蜂起是れ初めなり。」","c":["『大乗院日記目録』","『看聞日記』","『蔭凉軒日録』","『実悟記拾遺』"],"e":"これは1428年の正長の土一揆を記した『大乗院日記目録』の一節で、興福寺大乗院の尋尊が編んだものです。近江の馬借の蜂起を発端に、畿内一帯で土民が徳政を求めて酒屋・土倉を襲いました。『看聞日記』は伏見宮貞成親王の日記で、嘉吉の変などを記します。『蔭凉軒日録』は山城の国一揆の記事で、『実悟記拾遺』は加賀の一向一揆を「百姓ノ持タル国」と記したことで知られます。","m":"正長＝大乗院日記目録、山城国一揆＝蔭凉軒日録"},{"id":35,"k":"plan","ref":"想定問題","f":"中世","t":"応仁の乱の対立構図","y":1467,"q":"応仁の乱で西軍に属した人物の組合せとして正しいものはどれですか。","c":["山名持豊・畠山義就・斯波義廉","山名持豊・畠山政長・斯波義廉","細川勝元・畠山義就・斯波義敏","山名持豊・畠山義就・斯波義敏"],"e":"応仁の乱（1467〜77年）は、将軍家の家督争い（足利義視と義尚）と、管領家の畠山氏・斯波氏の家督争いに、幕府の実権をめぐる細川勝元と山名持豊（宗全）の対立が結びついておこりました。西軍は山名持豊を中心に畠山義就・斯波義廉らが属し、東軍は細川勝元を中心に畠山政長・斯波義敏らが属しました。","m":"西軍＝山名・義就・義廉、東軍＝細川・政長・義敏"},{"id":36,"k":"plan","ref":"想定問題","f":"中世","t":"五山の制","y":1386,"q":"室町幕府が定めた五山・十刹の制で、京都五山に含まれない寺院はどれですか。","c":["建長寺","天龍寺","相国寺","東福寺"],"e":"足利義満のころに整えられた五山の制では、南禅寺を五山の上に置き、京都五山を天龍寺・相国寺・建仁寺・東福寺・万寿寺、鎌倉五山を建長寺・円覚寺・寿福寺・浄智寺・浄妙寺としました。建長寺は北条時頼が蘭溪道隆を招いて開いた寺で、鎌倉五山の第一位です。五山の禅僧は外交文書の作成や五山文学・朱子学の研究でも活躍しました。","m":"南禅寺は別格、建長寺・円覚寺は鎌倉五山"},{"id":37,"k":"plan","ref":"想定問題","f":"中世","t":"連歌の発展","y":1495,"q":"連歌の撰集・作品とその中心人物の組合せとして正しいものはどれですか。","c":["『新撰菟玖波集』―宗祇","『新撰菟玖波集』―二条良基","『菟玖波集』―山崎宗鑑","『犬筑波集』―宗祇"],"e":"南北朝期の二条良基は『菟玖波集』を編み、連歌の規則書『応安新式』を定めました。『菟玖波集』は勅撰に準じる扱いを受け、連歌の地位を高めました。東山文化期には宗祇が正風連歌を確立して『新撰菟玖波集』を編み、弟子の肖柏・宗長と『水無瀬三吟百韻』を詠みました。山崎宗鑑は自由な気風の俳諧連歌を広め、『犬筑波集』を編みました。","m":"菟玖波集＝良基、新撰＝宗祇、犬筑波＝宗鑑"},{"id":38,"k":"plan","ref":"想定問題","f":"中世","t":"分国法","y":1536,"q":"戦国大名の分国法と制定した大名家の組合せとして正しいものはどれですか。","c":["『塵芥集』―伊達氏","『甲州法度之次第』―今川氏","『今川仮名目録』―朝倉氏","『結城氏新法度』―長宗我部氏"],"e":"『塵芥集』は陸奥の伊達稙宗が1536年に制定した分国法で、条文数が多いことで知られます。『甲州法度之次第』は武田晴信（信玄）、『今川仮名目録』は今川氏親（のち義元が追加）、『結城氏新法度』は下総の結城政勝が定めました。このほか朝倉氏の『朝倉孝景条々』、六角氏の『六角氏式目』、長宗我部氏の『長宗我部氏掟書』などがあり、喧嘩両成敗などの規定が見られます。","m":"塵芥集＝伊達、甲州法度＝武田、仮名目録＝今川"},{"id":39,"k":"plan","ref":"想定問題","f":"中世","t":"中世の座","y":1400,"q":"中世に大山崎の油神人が結成した油座の本所として、正しいものはどれですか。","c":["石清水八幡宮","北野社","祇園社","興福寺"],"e":"座は商工業者が本所となる寺社や貴族に奉仕・座役を納める代わりに、販売・製造の独占権や関銭免除などの特権を認められた同業者団体です。大山崎の油座は石清水八幡宮を本所とし、荏胡麻の購入と灯油販売の独占権を広い範囲で認められました。北野社は麹座、祇園社は綿座の本所として知られます。興福寺も大和の多くの座の本所でしたが、大山崎油座とは関係ありません。","m":"大山崎油座＝石清水、麹座＝北野、綿座＝祇園"},{"id":40,"k":"plan","ref":"想定問題","f":"中世","t":"惣村の自治","y":1450,"q":"室町時代の惣村で、村が領主に納める年貢を村全体で一括して請け負ったことを何といいますか。","c":["地下請（百姓請・村請）","地下検断（自検断）","守護請","地頭請"],"e":"惣村は寄合で村の掟（惣掟）を定め、入会地や用水を共同で管理しました。年貢を村がまとめて請け負うことを地下請（百姓請）といいます。村内の警察・裁判権を自ら行使することは地下検断（自検断）です。守護請は守護が荘園の年貢納入を請け負うこと、地頭請は鎌倉時代に地頭が荘園領主に一定額の年貢納入を請け負ったことで、いずれも村の自治とは異なります。","m":"地下請＝年貢の村請、地下検断＝村の警察・裁判"},{"id":41,"k":"plan","ref":"想定問題","f":"近世","t":"天正遣欧使節","y":1582,"q":"1582年、イエズス会の宣教師ヴァリニャーノの勧めでローマ教皇のもとに少年使節が派遣されました。この使節を派遣したキリシタン大名に含まれない人物はだれですか。","c":["小西行長","大友義鎮（宗麟）","大村純忠","有馬晴信"],"e":"天正遣欧使節は、九州のキリシタン大名である大友義鎮（豊後）・大村純忠（肥前）・有馬晴信（肥前）が、伊東マンショ・千々石ミゲル・中浦ジュリアン・原マルチノの4人の少年をローマに送ったもので、1590年に帰国しました。小西行長もキリシタン大名ですが、豊臣秀吉に仕えた堺の商人出身の武将で、この使節の派遣には関わっていません。","m":"遣欧使節＝大友・大村・有馬、ヴァリニャーノ"},{"id":42,"k":"plan","ref":"想定問題","f":"近世","t":"太閤検地","y":1582,"q":"豊臣秀吉の太閤検地について述べた次のア〜エのうち、正しいものの組合せはどれですか。\nア 6尺3寸を1間とし、1段を300歩とする新しい基準を用いた。\nイ 枡を京枡に統一し、田畑の等級に応じた石盛をもとに石高を定めた。\nウ 1段を360歩とする従来の基準をそのまま用いた。\nエ 原則として領主からの自己申告による指出検地の方式で行われた。","c":["ア・イ","ア・ウ","イ・エ","ウ・エ"],"e":"太閤検地では6尺3寸四方を1歩、300歩を1段とする新基準を採用し（ア）、それまでの360歩＝1段より面積の単位を小さくしました（ウは誤り）。枡も京枡に統一し、田畑を上・中・下・下々に分けて石盛を定め、面積×石盛で石高を算出しました（イ）。検地奉行を派遣して実地に測量するのが原則で、戦国大名に多かった指出検地とは異なります（エは誤り）。","m":"太閤検地＝1段300歩・京枡・実地測量"},{"id":43,"k":"plan","ref":"想定問題","f":"近世","t":"刀狩令","y":1588,"q":"次の史料は豊臣秀吉が出した法令の一節です。この法令が出された年と、没収した武具の使い道とされたものの組合せとして正しいものはどれですか。\n「諸国百姓、刀、脇指、弓、やり、てつはう、其外武具のたぐひ所持候事、堅く御停止候。」","c":["1588年―方広寺の大仏造営の釘・かすがい","1587年―方広寺の大仏造営の釘・かすがい","1588年―東大寺大仏の再建の資材","1591年―方広寺の大仏造営の釘・かすがい"],"e":"これは1588年の刀狩令の第1条です。秀吉は一揆を防ぎ百姓を農業に専念させることを目的に武器を没収し、その名目として京都の方広寺に造る大仏の釘やかすがいに用いれば、百姓は来世まで救われると説きました。1587年はバテレン追放令、1591年は武家奉公人が町人・百姓になることなどを禁じた人掃令（身分統制令）の年です。刀狩と身分統制で兵農分離が進みました。","m":"1587バテレン追放→1588刀狩（方広寺）→1591人掃令"},{"id":44,"k":"plan","ref":"想定問題","f":"近世","t":"江戸幕府の職制","y":1635,"q":"江戸幕府の職制について述べた文として正しいものはどれですか。","c":["大目付は老中のもとで大名の監察にあたった。","目付は老中のもとで大名の監察にあたった。","寺社奉行は老中の支配下に置かれ、旗本から任じられた。","若年寄は大名を監察する大目付を指揮した。"],"e":"大目付は老中に属して大名や朝廷を監察しました。目付は若年寄に属し、旗本・御家人を監察しました。三奉行のうち寺社奉行は将軍直属で譜代大名から任じられ、町奉行・勘定奉行は老中の支配下で旗本から任じられました。若年寄は老中を補佐して旗本・御家人を統轄し、目付を指揮しました。","m":"大目付＝老中下・大名、目付＝若年寄下・旗本"},{"id":45,"k":"plan","ref":"想定問題","f":"近世","t":"天和の武家諸法度","y":1683,"q":"武家諸法度の第1条を「文武弓馬の道、専ら相嗜むべき事」から「文武忠孝を励し、礼儀を正すべき事」に改めた法令と、それを出した将軍の組合せとして正しいものはどれですか。","c":["天和令―徳川綱吉","寛永令―徳川家光","正徳令―徳川家宣","寛文令―徳川家綱"],"e":"1683年、5代将軍徳川綱吉が出した天和令は、第1条を「文武忠孝を励し、礼儀を正すべき事」と改め、武力より忠孝・礼儀による秩序を重んじる文治政治の姿勢を示しました。元和令（1615年、秀忠、金地院崇伝起草）が最初の武家諸法度で、寛永令（1635年、家光）で参勤交代が制度化されました。家宣の正徳令は新井白石が和文で起草したものです。","m":"天和令（綱吉）＝文武忠孝・礼儀"},{"id":46,"k":"plan","ref":"想定問題","f":"近世","t":"鎖国政策の過程","y":1635,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア スペイン船の来航を禁止した。\nイ ポルトガル船の来航を禁止した。\nウ 日本人の海外渡航と在外日本人の帰国を全面的に禁止した。\nエ 平戸のオランダ商館を長崎の出島に移した。","c":["ア→ウ→イ→エ","ウ→ア→イ→エ","ア→イ→ウ→エ","ア→ウ→エ→イ"],"e":"1624年にスペイン船の来航を禁じました（ア）。1633年には奉書船以外の海外渡航を禁止し、1635年には日本人の海外渡航・帰国を全面的に禁止しました（ウ）。島原・天草一揆（1637〜38年）の後、1639年にポルトガル船の来航を禁止し（イ）、1641年に平戸のオランダ商館を出島に移しました（エ）。イギリスは1623年に自ら平戸の商館を閉じて撤退しています。","m":"1624西→1635渡航全面禁止→1639葡→1641出島"},{"id":47,"k":"plan","ref":"想定問題","f":"近世","t":"己酉約条","y":1609,"q":"江戸時代初期に朝鮮との間で結ばれ、近世の日朝貿易の基本となった約条について、締結年・名称・朝鮮との交易を担った藩の組合せとして正しいものはどれですか。","c":["1609年―己酉約条―対馬藩（宗氏）","1609年―己酉約条―松前藩（松前氏）","1669年―己酉約条―対馬藩（宗氏）","1609年―癸亥約条―対馬藩（宗氏）"],"e":"文禄・慶長の役で途絶えた朝鮮との国交は、徳川家康の時代に対馬の宗氏の仲介で回復し、1609年に宗氏と朝鮮の間で己酉約条が結ばれました。釜山に倭館が置かれ、宗氏が貿易を独占しました。癸亥約条は室町時代の1443年に宗氏が朝鮮と結んだ嘉吉条約のことです。1669年はアイヌのシャクシャインが松前藩に対して蜂起した年です。","m":"己酉約条1609・宗氏・釜山倭館"},{"id":48,"k":"plan","ref":"想定問題","f":"近世","t":"正徳の政治","y":1712,"q":"新井白石が中心となった正徳の政治について述べた文として誤っているものはどれですか。","c":["勘定吟味役荻原重秀の建議を受け、金の含有率を下げた小判を発行した。","閑院宮家を創設して、朝廷との協調をはかった。","朝鮮通信使の待遇を簡素にし、朝鮮からの国書の将軍の称号を「日本国王」に改めさせた。","海舶互市新例を出して、長崎での清・オランダとの貿易額を制限した。"],"e":"金の含有率を下げた元禄小判は、5代将軍綱吉の時代に勘定吟味役（のち勘定奉行）の荻原重秀の建議で発行されたもので、物価上昇を招きました。白石は荻原を罷免し、慶長小判と同じ質に戻した正徳小判を発行しました。そのほか閑院宮家の創設、朝鮮通信使の待遇簡素化と将軍の称号の変更、1715年の海舶互市新例による金銀流出の抑制は、いずれも正徳の政治の内容です。","m":"元禄金銀＝荻原重秀、正徳金銀＝白石（質を戻す）"},{"id":49,"k":"plan","ref":"想定問題","f":"近世","t":"上げ米","y":1722,"q":"徳川吉宗が1722年に実施した上げ米の内容として正しいものはどれですか。","c":["大名に石高1万石につき100石を上納させ、代わりに参勤交代の江戸在府期間を半年に縮めた。","大名に石高1万石につき50石を上納させ、代わりに参勤交代の江戸在府期間を半年に縮めた。","大名に石高1万石につき100石を上納させ、代わりに参勤交代を3年に1度とした。","旗本に役職の基準石高との差額を在職中だけ支給する代わりに、米を上納させた。"],"e":"上げ米は幕府財政の窮乏を一時的にしのぐための制度で、大名に1万石につき100石の米を上納させ、その代わりに参勤交代の江戸在府期間を1年から半年に短縮しました。1730年まで続けられました。選択肢の最後は1723年の足高の制の内容と混同させたもので、足高の制は役職の基準石高に満たない者に在職中だけ不足分を支給する制度です。","m":"上げ米＝1万石に100石、在府半年"},{"id":50,"k":"plan","ref":"想定問題","f":"近世","t":"南鐐二朱銀","y":1772,"q":"田沼時代に発行された南鐐二朱銀について述べた文として正しいものはどれですか。","c":["額面が刻まれた計数銀貨で、8枚で金1両と交換できるとされた。","重さで価値を量る秤量銀貨で、丁銀・豆板銀とともに用いられた。","額面が刻まれた計数銀貨で、16枚で金1両と交換できるとされた。","新井白石の建議で、元禄期に低下した銀の品位を回復させるために発行された。"],"e":"田沼意次が老中となった1772年に発行された南鐐二朱銀は、それまで重さで価値を量っていた銀貨を、金貨の単位（朱）で額面を表す計数貨幣としたものです。金1両＝4分＝16朱なので、二朱銀8枚で1両となります。これにより金を中心とする貨幣制度への一本化が進みました。丁銀・豆板銀は秤量貨幣です。新井白石の貨幣改鋳は正徳期のことです。","m":"1両＝4分＝16朱、二朱銀8枚で1両"},{"id":51,"k":"plan","ref":"想定問題","f":"近世","t":"寛政の改革","y":1790,"q":"老中松平定信の寛政の改革の政策として誤っているものはどれですか。","c":["上知令を出して、江戸・大坂周辺の土地を幕府直轄地にしようとした。","棄捐令を出して、旗本・御家人が札差から借りた金の一部を帳消しにさせた。","江戸の町々に町入用の節約分の7割を積み立てさせ、飢饉や災害に備えさせた。","湯島聖堂の学問所で朱子学以外の学派の講義や研究を禁じた。"],"e":"上知令は1843年、天保の改革で老中水野忠邦が出した法令で、大名・旗本の反対で撤回され、水野失脚の原因となりました。寛政の改革では、1789年の棄捐令、町入用の節約分の7割を積み立てる七分積金、1790年の寛政異学の禁、石川島の人足寄場の設置、旧里帰農令、囲米などが行われました。","m":"上知令は天保、寛政は棄捐令・七分積金・異学の禁"},{"id":52,"k":"plan","ref":"想定問題","f":"近世","t":"天保期の内外情勢","y":1840,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 渡辺崋山・高野長英らが幕府の対外政策を批判したとして処罰された。\nイ 大坂町奉行所の元与力が貧民救済を掲げて武装蜂起した。\nウ 異国船打払令を改め、漂着した外国船に燃料・食料を与えることにした。\nエ 江戸・大坂周辺の大名・旗本領を幕府直轄地にしようとする法令が出された。","c":["イ→ア→ウ→エ","ア→イ→ウ→エ","イ→ウ→ア→エ","イ→ア→エ→ウ"],"e":"1837年、大坂町奉行所の元与力で陽明学者の大塩平八郎が乱をおこしました（イ）。同年のモリソン号事件への幕府の対応を批判した渡辺崋山（『慎機論』）・高野長英（『戊戌夢物語』）が1839年に処罰されました（蛮社の獄、ア）。アヘン戦争での清の敗北を受けて1842年に天保の薪水給与令が出され（ウ）、1843年に上知令が出されました（エ）。","m":"1837大塩→1839蛮社の獄→1842薪水給与令→1843上知令"},{"id":53,"k":"plan","ref":"想定問題","f":"近世","t":"ラクスマンの来航","y":1792,"q":"1792年に来航したロシア使節について、使節名・来航地・送還した日本人漂流民の組合せとして正しいものはどれですか。","c":["ラクスマン―根室―大黒屋光太夫","レザノフ―根室―大黒屋光太夫","ラクスマン―長崎―大黒屋光太夫","ラクスマン―根室―高田屋嘉兵衛"],"e":"1792年、ロシアのラクスマンは漂流民大黒屋光太夫らを伴って根室に来航し、通商を求めました。幕府は長崎への入港許可証（信牌）を与えて帰国させました。1804年にはレザノフがその信牌を持って長崎に来航しましたが、幕府は通商を拒否しました。高田屋嘉兵衛は1811年のゴローウニン事件の報復としてロシア側に捕らえられた商人で、解決に尽力しました。","m":"ラクスマン＝1792根室・光太夫、レザノフ＝1804長崎"},{"id":54,"k":"plan","ref":"想定問題","f":"近世","t":"近世の農書","y":1844,"q":"近世の農学者とその著作の組合せとして正しいものはどれですか。","c":["大蔵永常―『広益国産考』","宮崎安貞―『広益国産考』","大蔵永常―『農業全書』","二宮尊徳―『農具便利論』"],"e":"宮崎安貞の『農業全書』（1697年）は中国の農書を参考に日本の農業技術をまとめた体系的な農書です。大蔵永常は19世紀前半に『農具便利論』で農具を紹介し、『広益国産考』（1844年成立、1859年刊）で商品作物の栽培と加工を説きました。二宮尊徳（金次郎）は報徳仕法と呼ばれる勤労・倹約を基本とした方法で農村の復興に努めた人物です。","m":"農業全書＝宮崎安貞、広益国産考・農具便利論＝大蔵永常"},{"id":55,"k":"plan","ref":"想定問題","f":"近世","t":"海運の整備","y":1672,"q":"17世紀後半、幕府の命を受けて、出羽の酒田から日本海沿岸・下関・瀬戸内海を経て大坂・江戸に至る西廻り海運を整備した人物はだれですか。","c":["河村瑞賢","角倉了以","末次平蔵","茶屋四郎次郎"],"e":"江戸の商人河村瑞賢は幕府の命で1671年に東廻り海運、1672年に西廻り海運を整備し、東北・北陸の年貢米を江戸・大坂に効率よく運べるようにしました。のちに大坂の安治川も開削しています。角倉了以は京都の豪商で、朱印船貿易のほか富士川・高瀬川などの河川を開削しました。末次平蔵は長崎の朱印船貿易家、茶屋四郎次郎は京都の呉服商・朱印船貿易家です。","m":"河村瑞賢＝東廻り・西廻り、角倉了以＝高瀬川"},{"id":56,"k":"plan","ref":"想定問題","f":"近世","t":"井原西鶴","y":1688,"q":"井原西鶴の浮世草子のうち、町人が富を築く知恵や苦心を描いた町人物に分類される作品はどれですか。","c":["『日本永代蔵』","『好色一代男』","『武道伝来記』","『国性爺合戦』"],"e":"井原西鶴の浮世草子は好色物・武家物・町人物に分けられます。『日本永代蔵』（1688年）や『世間胸算用』は町人物で、町人の経済生活を描きました。『好色一代男』は好色物、『武道伝来記』は敵討ちを扱った武家物です。『国性爺合戦』は近松門左衛門の人形浄瑠璃の時代物で、明の遺臣鄭成功をモデルとしています。","m":"町人物＝日本永代蔵・世間胸算用"},{"id":57,"k":"plan","ref":"想定問題","f":"近世","t":"儒学の諸学派","y":1666,"q":"江戸時代の儒学者について述べた文として正しいものはどれですか。","c":["山鹿素行は『聖教要録』で朱子学を批判したため、赤穂に配流された。","熊沢蕃山は京都の堀川に古義堂を開き、多くの門人を育てた。","荻生徂徠は『大学或問』で政治を批判したため、幕府から処罰された。","伊藤仁斎は柳沢吉保に仕え、将軍吉宗の諮問に答えて『政談』を著した。"],"e":"山鹿素行は古学の立場から『聖教要録』で朱子学を批判し、1666年に赤穂へ流されました。古義堂を開いたのは伊藤仁斎です。『大学或問』で幕政を批判して処罰されたのは陽明学者の熊沢蕃山です。柳沢吉保に仕え、吉宗の諮問に答えて『政談』を著したのは荻生徂徠で、江戸に蘐園塾を開きました。","m":"聖教要録＝素行、古義堂＝仁斎、政談＝徂徠"},{"id":58,"k":"plan","ref":"想定問題","f":"近世","t":"暦象新書","y":1802,"q":"オランダ通詞出身で、『暦象新書』を著してニュートンの力学やコペルニクスの地動説を紹介した人物はだれですか。","c":["志筑忠雄","大槻玄沢","稲村三伯","高橋至時"],"e":"長崎のオランダ通詞であった志筑忠雄は『暦象新書』で地動説や万有引力を紹介し、ケンペルの著作を訳した『鎖国論』でも知られます。大槻玄沢は蘭学の入門書『蘭学階梯』を著し、江戸に芝蘭堂を開きました。稲村三伯は最初の蘭日辞書『ハルマ和解』を作りました。高橋至時は幕府天文方として寛政暦を作り、伊能忠敬の師となった人物です。","m":"暦象新書＝志筑忠雄、ハルマ和解＝稲村三伯"},{"id":59,"k":"plan","ref":"想定問題","f":"近世","t":"懐徳堂の学者","y":1820,"q":"大坂の懐徳堂に学び、『夢の代』を著して霊魂の存在を否定する無鬼論や地動説を説いた町人学者はだれですか。","c":["山片蟠桃","富永仲基","海保青陵","本多利明"],"e":"懐徳堂は大坂町人の出資で設立された学問所です。升屋の番頭であった山片蟠桃は懐徳堂で学び、『夢の代』で無鬼論や合理的な宇宙観を説きました。富永仲基も懐徳堂出身ですが、『出定後語』で仏教経典の成立を歴史的に批判した人物です。海保青陵は『稽古談』で商業活動を肯定し、本多利明は『経世秘策』で開国・交易による富国策を説きました。","m":"夢の代＝山片蟠桃、出定後語＝富永仲基"},{"id":60,"k":"plan","ref":"想定問題","f":"近世","t":"村方三役","y":1700,"q":"江戸時代の村の運営で、名主（庄屋）や組頭の村政を監視する役割を担った、本百姓の代表はどれですか。","c":["百姓代","組頭","五人組","名主（庄屋）"],"e":"江戸時代の村は、名主（庄屋・肝煎）・組頭・百姓代の村方三役を中心とする本百姓によって運営されました。名主は村の長として年貢納入や村政を統括し、組頭はそれを補佐しました。百姓代は本百姓の代表として名主・組頭の村政を監視しました。五人組は年貢納入や治安について連帯責任を負わせるための近隣組織で、村役人ではありません。","m":"村方三役＝名主・組頭・百姓代（監視役）"},{"id":61,"k":"plan","ref":"想定問題","f":"近代","t":"日米修好通商条約","y":1858,"q":"1858年に日米修好通商条約が調印されたときの幕府の大老と、アメリカ側の代表の組合せとして正しいものはどれですか。","c":["井伊直弼―ハリス","阿部正弘―ハリス","堀田正睦―ペリー","井伊直弼―ペリー"],"e":"アメリカ総領事ハリスは下田に着任して通商条約の締結を求めました。老中首座堀田正睦は条約の勅許を得ようとしましたが、孝明天皇の許可は得られませんでした。その後大老に就いた井伊直弼が勅許のないまま1858年に調印しました。阿部正弘は1854年の日米和親条約締結時の老中首座で、ペリーは和親条約のときのアメリカ代表です。","m":"和親＝阿部・ペリー、通商＝井伊・ハリス"},{"id":62,"k":"plan","ref":"想定問題","f":"近代","t":"開港後の貿易","y":1860,"q":"開港後の貿易について述べた次のア〜エのうち、正しいものの組合せはどれですか。\nア 輸出入額ともに最大の貿易港は横浜であった。\nイ 最大の取引相手国はアメリカであった。\nウ 幕府は五品江戸廻送令を出し、生糸など5品目を江戸の問屋を経て輸出させようとした。\nエ 金貨の流出を防ぐため、幕府は金の含有量を増やした万延小判を発行した。","c":["ア・ウ","ア・イ","イ・エ","ウ・エ"],"e":"アは正しく、貿易の中心は横浜でした。イは誤りで、最大の相手国はイギリスです。アメリカは南北戦争の影響で後退しました。ウは正しく、1860年の五品江戸廻送令は雑穀・水油・蠟・呉服・生糸を江戸の問屋経由とするものでした。エは誤りで、日本の金銀比価（約1対5）が海外（約1対15）と違ったため金が流出し、幕府は金の含有量を大幅に減らした万延小判を発行しました。","m":"貿易＝横浜・イギリス・生糸、万延小判は量を減らす"},{"id":63,"k":"plan","ref":"想定問題","f":"近代","t":"文久〜元治の政局","y":1863,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 薩摩・会津両藩が中心となり、長州藩勢力と急進派の公家を京都から追放した。\nイ 長州藩兵が京都に攻め上り、御所周辺で会津・薩摩などの兵と戦って敗れた。\nウ 老中安藤信正が江戸城の坂下門外で水戸浪士らに襲われ負傷した。\nエ 生麦事件の報復のため、イギリス艦隊が鹿児島を砲撃した。","c":["ウ→エ→ア→イ","ウ→ア→エ→イ","エ→ウ→ア→イ","ウ→エ→イ→ア"],"e":"1862年1月、公武合体を進めた老中安藤信正が坂下門外の変で負傷しました（ウ）。1862年の生麦事件の報復として、1863年7月に薩英戦争がおこりました（エ）。同年8月18日、薩摩・会津が長州勢力と三条実美ら急進派公家を京都から追放しました（八月十八日の政変、ア）。1864年7月、長州藩は勢力回復をはかって京都に攻め上りましたが敗れました（禁門の変、イ）。","m":"1862坂下門→1863.7薩英→1863.8政変→1864禁門"},{"id":64,"k":"plan","ref":"想定問題","f":"近代","t":"明治初期の諸改革","y":1873,"q":"明治初期の諸改革について述べた文として誤っているものはどれですか。","c":["学制はアメリカの教育制度にならい、全国を学区に分けて学校を設置しようとした。","廃藩置県に先立って、薩摩・長州・土佐の3藩の兵を集めて御親兵とした。","地租改正条例では、地価の3％を地租として土地所有者に金納させることとした。","1876年、華族・士族に金禄公債証書を交付して家禄の支給を打ち切った。"],"e":"1872年の学制はフランスの学区制にならったもので、国民皆学をめざしました。アメリカの制度にならったのは1879年の教育令です。1871年、政府は薩長土3藩の兵約1万を御親兵として軍事力を固めたうえで廃藩置県を断行しました。1873年の地租改正条例は地価の3％の金納を定め（1877年に2.5％に引き下げ）、1876年には金禄公債証書の交付で秩禄処分が完了しました。","m":"学制＝フランス式、教育令＝アメリカ式"},{"id":65,"k":"plan","ref":"想定問題","f":"近代","t":"民撰議院設立建白書","y":1874,"q":"1874年、板垣退助・後藤象二郎らが提出した民撰議院設立建白書の提出先はどこですか。","c":["左院","右院","正院","元老院"],"e":"1871年の廃藩置県後、太政官は正院・左院・右院の三院制となりました。正院は最高機関、左院は立法の諮問機関、右院は各省の長官・次官の協議機関です。征韓論争で下野した板垣・後藤・江藤新平・副島種臣らは愛国公党を結成し、民撰議院設立建白書を左院に提出しました。元老院は1875年の大阪会議後、漸次立憲政体樹立の詔によって左院・右院に代わって設けられた立法機関です。","m":"建白書は左院へ、元老院は1875年設置"},{"id":66,"k":"plan","ref":"想定問題","f":"近代","t":"開拓使官有物払下げ事件","y":1881,"q":"1881年、開拓使の官有物を不当に安い価格で払い下げようとしたことが問題となりました。開拓長官黒田清隆が払い下げようとした相手として正しいものはどれですか。","c":["五代友厚らの関西貿易社","岩崎弥太郎らの三菱","渋沢栄一らの第一国立銀行","大倉喜八郎らの大倉組"],"e":"開拓長官黒田清隆は、同じ薩摩出身の五代友厚らが設立した関西貿易社に、1400万円余りを投じた官有物を約39万円・無利息30年賦で払い下げようとしました。これが報道されると世論の激しい批判を浴び、払下げは中止されました。政府はこの動きに大隈重信が関わっているとして大隈を罷免し、同時に国会開設の勅諭を出して1890年の国会開設を約束しました（明治十四年の政変）。","m":"官有物払下げ＝黒田→五代友厚（関西貿易社）"},{"id":67,"k":"plan","ref":"想定問題","f":"近代","t":"民法典論争","y":1891,"q":"ボアソナードらが起草した民法の施行をめぐる論争で、「民法出デテ忠孝亡ブ」という論文を発表して施行延期を主張した人物はだれですか。","c":["穂積八束","梅謙次郎","井上毅","植木枝盛"],"e":"フランス人法学者ボアソナードが起草に関わった民法は1890年に公布されましたが、家族道徳を損なうとして激しい反対がおこりました。東京帝国大学教授の穂積八束は「民法出デテ忠孝亡ブ」を発表して延期を主張しました。梅謙次郎は断行派の中心で、のち新しい民法の起草者の一人となりました。民法は施行が延期され、1896年・98年に戸主権の強い家制度を定めた新民法が公布されました。","m":"延期派＝穂積八束、断行派＝梅謙次郎"},{"id":68,"k":"plan","ref":"想定問題","f":"近代","t":"第2回総選挙の選挙干渉","y":1892,"q":"1892年の第2回衆議院議員総選挙で、民党の候補者に対して大規模な選挙干渉を行った内務大臣はだれですか。","c":["品川弥二郎","樺山資紀","山県有朋","井上馨"],"e":"第2議会で海軍大臣樺山資紀が藩閥政府の功績を強調する「蛮勇演説」を行って民党と対立し、第1次松方正義内閣は衆議院を解散しました。続く第2回総選挙では内務大臣品川弥二郎が警察などを使って激しい選挙干渉を行い、死傷者が出ましたが、民党の優勢は変わりませんでした。山県有朋は第1議会で「主権線・利益線」を述べた首相です。","m":"選挙干渉＝品川弥二郎、蛮勇演説＝樺山資紀"},{"id":69,"k":"plan","ref":"想定問題","f":"近代","t":"条約改正交渉","y":1889,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア イギリス船が紀伊半島沖で沈没し、日本人乗客が全員死亡した事件で、イギリス領事裁判所が船長に軽い刑を科した。\nイ 滋賀県でロシア皇太子が巡査に切りつけられ、外務大臣が辞任した。\nウ 領事裁判権の撤廃などを定めた日英通商航海条約が調印された。\nエ 外務大臣が国家主義団体の青年に爆弾を投げつけられて負傷した。","c":["ア→エ→イ→ウ","エ→ア→イ→ウ","ア→イ→エ→ウ","ア→エ→ウ→イ"],"e":"1886年のノルマントン号事件（ア）は領事裁判権撤廃を求める世論を高め、井上馨の交渉にも影響しました。1889年、大審院への外国人判事任用を認めた交渉が批判を受け、外相大隈重信が玄洋社の来島恒喜に襲われました（エ）。1891年の大津事件（イ）で外相青木周蔵が辞任しました。1894年、陸奥宗光外相のもとで日英通商航海条約が調印されました（ウ）。","m":"1886ノルマントン→1889大隈遭難→1891大津→1894日英"},{"id":70,"k":"plan","ref":"想定問題","f":"近代","t":"下関条約","y":1895,"q":"日清戦争の講和条約である下関条約によって、新たに開市・開港されることになった中国の都市に含まれないものはどれですか。","c":["天津","沙市","重慶","杭州"],"e":"1895年、日本全権伊藤博文・陸奥宗光と清国全権李鴻章が下関条約に調印しました。清は朝鮮の独立を認め、遼東半島・台湾・澎湖諸島を割譲し、賠償金2億両を支払い、沙市・重慶・蘇州・杭州の4都市を開くことになりました。天津は第2次アヘン戦争後の1860年の北京条約で開港された都市です。遼東半島はロシア・フランス・ドイツの三国干渉で返還されました。","m":"下関条約の開市港＝沙市・重慶・蘇州・杭州"},{"id":71,"k":"plan","ref":"想定問題","f":"近代","t":"ポーツマス条約","y":1905,"q":"日露戦争の講和条約について述べた文として正しいものはどれですか。","c":["ロシアは北緯50度以南の樺太とその付属の諸島を日本に譲った。","ロシアは日本に賠償金を支払うことに同意した。","ロシアは東清鉄道のハルビン以南の権益を日本に譲った。","条約はアメリカの仲介によって、首都ワシントンで調印された。"],"e":"1905年、アメリカ大統領セオドア＝ローズヴェルトの仲介で、日本全権小村寿太郎とロシア全権ウィッテがアメリカのポーツマスで条約に調印しました。日本は韓国への指導・監督権、旅順・大連の租借権、長春以南の鉄道とその付属の権利、北緯50度以南の樺太、沿海州・カムチャツカの漁業権を得ました。賠償金は得られず、不満をもった民衆による日比谷焼打ち事件がおこりました。","m":"ポーツマス＝賠償金なし・長春以南・樺太南半"},{"id":72,"k":"plan","ref":"想定問題","f":"近代","t":"韓国併合への過程","y":1907,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 韓国皇帝がハーグの万国平和会議に密使を送り、日本の支配の不当を訴えようとした。\nイ 漢城に統監府が置かれ、伊藤博文が初代統監となった。\nウ 前統監の伊藤博文がハルビン駅で暗殺された。\nエ 日本政府の推薦する財政・外交の顧問を韓国政府に置くことを定めた協約が結ばれた。","c":["エ→イ→ア→ウ","イ→エ→ア→ウ","エ→ア→イ→ウ","エ→イ→ウ→ア"],"e":"1904年の第1次日韓協約で日本推薦の顧問が置かれました（エ）。1905年の第2次日韓協約で韓国の外交権を奪い、統監府を置いて伊藤博文が初代統監となりました（イ）。1907年のハーグ密使事件（ア）を機に高宗を退位させ、第3次日韓協約で内政権を握り、軍隊を解散させました。1909年に伊藤が安重根に暗殺され（ウ）、翌1910年に韓国併合が行われました。","m":"1904顧問→1905統監府→1907ハーグ→1909伊藤暗殺"},{"id":73,"k":"plan","ref":"想定問題","f":"近代","t":"大正政変と山本内閣","y":1913,"q":"大正初期の政治について述べた文として正しいものはどれですか。","c":["第1次山本権兵衛内閣は軍部大臣現役武官制を改め、予備役・後備役の将官も大臣になれるようにした。","第3次桂太郎内閣は立憲政友会の支持を得て長期政権を維持した。","シーメンス事件の責任を問われて第2次大隈重信内閣が総辞職した。","尾崎行雄と犬養毅は立憲同志会を率いて第一次護憲運動を指導した。"],"e":"第3次桂内閣は「閥族打破・憲政擁護」を掲げる第一次護憲運動で、1913年に約50日で倒れました（大正政変）。桂は新党（立憲同志会）を計画しましたが、政友会とは対立しました。運動の中心の尾崎行雄は立憲政友会、犬養毅は立憲国民党です。後を継いだ第1次山本内閣は政友会を与党とし、軍部大臣現役武官制を改正しましたが、1914年の海軍の汚職事件（シーメンス事件）で総辞職しました。","m":"山本内閣＝現役武官制緩和→シーメンス事件で辞職"},{"id":74,"k":"plan","ref":"想定問題","f":"近代","t":"二十一カ条の要求","y":1915,"q":"1915年に中国の袁世凱政府に二十一カ条の要求を突きつけた内閣と外務大臣の組合せとして正しいものはどれですか。","c":["第2次大隈重信内閣―加藤高明","寺内正毅内閣―本野一郎","原敬内閣―内田康哉","寺内正毅内閣―後藤新平"],"e":"第一次世界大戦に参戦した第2次大隈内閣は、加藤高明外相のもとで1915年に二十一カ条の要求を出しました。山東省のドイツ権益の継承、旅順・大連の租借期限と南満州鉄道などの権益期限の99年延長、漢冶萍公司の日中合弁化などを内容とし、最後通牒を発して大部分を受諾させました。寺内内閣は段祺瑞政権に西原借款を行い、原内閣はパリ講和会議に臨んだ内閣です。","m":"二十一カ条＝大隈内閣・加藤高明・袁世凱"},{"id":75,"k":"plan","ref":"想定問題","f":"近代","t":"原内閣の選挙法改正","y":1919,"q":"1919年に原敬内閣が行った衆議院議員選挙法の改正内容として正しいものはどれですか。","c":["選挙権の納税資格を直接国税3円以上に引き下げ、小選挙区制を導入した。","選挙権の納税資格を直接国税10円以上に引き下げ、大選挙区制を導入した。","選挙権の納税資格を直接国税3円以上に引き下げ、大選挙区制を導入した。","納税資格を撤廃し、満25歳以上の男性に選挙権を与えた。"],"e":"選挙権の納税資格は、1889年の15円以上から、1900年の第2次山県内閣の改正で10円以上（大選挙区制）、1919年の原内閣の改正で3円以上へと引き下げられました。原内閣は政友会に有利な小選挙区制を導入する一方、普通選挙には慎重でした。納税資格を撤廃して満25歳以上の男性に選挙権を与えたのは、1925年の加藤高明内閣のときの普通選挙法です。","m":"15円→10円（1900）→3円・小選挙区（1919）→普選（1925）"},{"id":76,"k":"plan","ref":"想定問題","f":"近代","t":"大正期の社会運動団体","y":1922,"q":"大正期の社会運動団体とその設立に関わった人物の組合せとして正しいものはどれですか。","c":["日本農民組合―杉山元治郎・賀川豊彦","友愛会―賀川豊彦","赤瀾会―平塚らいてう","新婦人協会―山川菊栄"],"e":"日本農民組合は1922年に杉山元治郎・賀川豊彦らが結成した小作人組合の全国組織です。友愛会は1912年に鈴木文治が結成した労働者の修養・共済団体で、のち日本労働総同盟に発展しました。赤瀾会は1921年に山川菊栄・伊藤野枝らが結成した社会主義的な女性団体です。新婦人協会は1920年に平塚らいてう・市川房枝らが結成し、治安警察法第5条の改正を実現させました。","m":"新婦人協会＝らいてう・市川、赤瀾会＝山川菊栄"},{"id":77,"k":"plan","ref":"想定問題","f":"近代","t":"金融恐慌","y":1927,"q":"1927年の金融恐慌について述べた文として正しいものはどれですか。","c":["台湾銀行を救済するための緊急勅令案が枢密院で否決され、第1次若槻礼次郎内閣が総辞職した。","浜口雄幸内閣の井上準之助蔵相がモラトリアム（支払猶予令）を出して混乱を収めた。","経営が破綻した鈴木商店に巨額の融資をしていたのは第一銀行であった。","田中義一内閣は恐慌を収めた後、ただちに金輸出解禁を実施した。"],"e":"片岡直温蔵相の失言をきっかけに取付け騒ぎがおこり、鈴木商店に巨額の融資をしていた台湾銀行が経営危機に陥りました。第1次若槻内閣は緊急勅令で救済しようとしましたが枢密院で否決され、総辞職しました。続く田中義一内閣の高橋是清蔵相が3週間のモラトリアムと日本銀行の非常貸出で恐慌を鎮めました。金輸出解禁は1930年、浜口内閣の井上準之助蔵相が行いました。","m":"金融恐慌＝若槻辞職→田中・高橋のモラトリアム"},{"id":78,"k":"plan","ref":"想定問題","f":"近代","t":"ワシントン体制","y":1922,"q":"ワシントン会議とその後の協調外交について述べた文として誤っているものはどれですか。","c":["四カ国条約の締結にともない、石井・ランシング協定が廃棄された。","九カ国条約は、中国の主権尊重・門戸開放・機会均等を定めた。","海軍軍縮条約で、主力艦の保有比率をアメリカ・イギリス各5に対し日本3とした。","ロンドン海軍軍縮条約は、補助艦の保有量を制限するものであった。"],"e":"ワシントン会議（1921〜22年）で結ばれた四カ国条約（米・英・日・仏）は太平洋の島々の現状維持を約したもので、これにともない日英同盟が廃棄されました。石井・ランシング協定は九カ国条約の成立を受けて1923年に廃棄されました。海軍軍縮条約では主力艦の比率を米英5・日3・仏伊1.67としました。1930年のロンドン海軍軍縮条約は補助艦の制限を定め、統帥権干犯問題をひきおこしました。","m":"四カ国→日英同盟廃棄、九カ国→石井・ランシング廃棄"},{"id":79,"k":"plan","ref":"想定問題","f":"近代","t":"満州事変後の展開","y":1932,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 日本が日満議定書に調印し、満州国を承認した。\nイ 塘沽停戦協定が結ばれ、満州事変は一応終結した。\nウ 海軍青年将校らが首相官邸を襲い、犬養毅首相を射殺した。\nエ 日本が国際連盟に脱退を通告した。","c":["ウ→ア→エ→イ","ア→ウ→エ→イ","ウ→ア→イ→エ","ウ→エ→ア→イ"],"e":"1932年3月の満州国建国宣言の後、満州国承認に慎重だった犬養毅首相は5月15日に暗殺されました（五・一五事件、ウ）。続く斎藤実内閣が9月に日満議定書に調印して満州国を承認しました（ア）。1933年2月、国際連盟総会がリットン報告書にもとづく勧告を採択したため、日本は3月に脱退を通告しました（エ）。同年5月、塘沽停戦協定が結ばれました（イ）。","m":"1932.5五・一五→1932.9日満議定書→1933.3脱退→1933.5塘沽"},{"id":80,"k":"plan","ref":"想定問題","f":"近代","t":"国民徴用令","y":1939,"q":"国家総動員法にもとづいて1939年に出された勅令で、国民を軍需産業などに強制的に動員できるようにしたものはどれですか。","c":["国民徴用令","価格等統制令","女子挺身勤労令","国民精神総動員実施要綱"],"e":"1938年、第1次近衛文麿内閣のもとで国家総動員法が制定され、政府は議会の承認なしに勅令で人や物資を戦争に動員できるようになりました。1939年の国民徴用令はこれにもとづき国民を軍需産業に動員するものです。同年の価格等統制令は物価の統制を目的とした勅令です。女子挺身勤労令は1944年の勅令で、国民精神総動員運動は1937年に始まった国民運動で勅令ではありません。","m":"国家総動員法1938→国民徴用令1939（勅令）"},{"id":81,"k":"plan","ref":"想定問題","f":"近代","t":"明治の美術","y":1898,"q":"明治期の美術について述べた文として正しいものはどれですか。","c":["フェノロサと岡倉天心の尽力で東京美術学校が設立され、のち天心は日本美術院を創立した。","黒田清輝は明治美術会を結成し、脂派と呼ばれる暗い色調の画風を広めた。","工部美術学校には、フランスから画家フォンタネージが招かれた。","文部省美術展覧会（文展）は、日本美術院の主催で開かれた。"],"e":"フェノロサと岡倉天心は伝統美術の復興を進め、1887年に東京美術学校が設立されました。天心は校長を退いた後、1898年に橋本雅邦・横山大観らと日本美術院を創立しました。フランスで学んだ黒田清輝は明るい外光派の画風を伝え、白馬会を結成しました。明治美術会は浅井忠らの団体です。工部美術学校にはイタリアのフォンタネージやラグーザが招かれました。文展は1907年に文部省が始めた官展です。","m":"東京美術学校→日本美術院（天心）、黒田＝白馬会"},{"id":82,"k":"plan","ref":"想定問題","f":"近代","t":"明治の文学","y":1893,"q":"雑誌『文学界』を拠点に、恋愛や内面の自由を重んじるロマン主義文学の先駆けとなった評論家・詩人はだれですか。","c":["北村透谷","尾崎紅葉","二葉亭四迷","武者小路実篤"],"e":"1893年創刊の『文学界』では、北村透谷が「内部生命論」などで人間の内面の自由を説き、島崎藤村らとともにロマン主義文学を推進しました。尾崎紅葉は硯友社を結成して『我楽多文庫』を発行し、『金色夜叉』を書いた人物です。二葉亭四迷は坪内逍遙の写実主義を受けて言文一致体の『浮雲』を書きました。武者小路実篤は明治末の1910年に創刊された『白樺』の同人です。","m":"文学界＝透谷・ロマン主義、硯友社＝紅葉"},{"id":83,"k":"plan","ref":"想定問題","f":"現代","t":"五大改革指令","y":1945,"q":"1945年10月、マッカーサーが口頭で五大改革を指示した相手の内閣はどれですか。","c":["幣原喜重郎内閣","東久邇宮稔彦内閣","第1次吉田茂内閣","片山哲内閣"],"e":"敗戦直後に成立した東久邇宮稔彦内閣は、GHQの人権指令（治安維持法の廃止、政治犯の釈放など）を実行できずに1945年10月に総辞職しました。続く幣原喜重郎内閣に対し、マッカーサーは女性の解放、労働組合の結成奨励、教育の自由主義化、圧政的諸制度の撤廃、経済機構の民主化の五大改革を指示しました。第1次吉田内閣は1946年5月、片山内閣は1947年5月に成立しています。","m":"人権指令で東久邇宮辞職→幣原に五大改革指令"},{"id":84,"k":"plan","ref":"想定問題","f":"現代","t":"第2次農地改革","y":1946,"q":"1946年の自作農創設特別措置法による第2次農地改革で、在村地主に保有が認められた小作地の面積は、北海道を除く都府県で平均いくらまでとされましたか。","c":["1町歩","5町歩","3町歩","4町歩"],"e":"第1次農地改革案は在村地主に5町歩までの小作地保有を認めるなど不徹底だったため、GHQの勧告を受けて第2次農地改革が行われました。不在地主の全小作地と、在村地主の小作地のうち都府県で平均1町歩（北海道は4町歩）を超える分を国が強制的に買い上げ、小作人に安く売り渡しました。小作料も金納とされ、寄生地主制は解体されました。","m":"第2次農地改革＝在村地主1町歩（北海道4町歩）"},{"id":85,"k":"plan","ref":"想定問題","f":"現代","t":"戦後の労働改革と憲法","y":1946,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 労働基準法が制定された。\nイ 労働組合法が制定された。\nウ 日本国憲法が公布された。\nエ 労働関係調整法が制定された。","c":["イ→エ→ウ→ア","イ→ウ→エ→ア","エ→イ→ウ→ア","イ→エ→ア→ウ"],"e":"労働組合法は1945年12月に制定され、団結権・団体交渉権・争議権を保障しました（イ）。労働関係調整法は1946年9月に制定され（エ）、日本国憲法は同年11月3日に公布されました（ウ）。労働基準法は1947年4月に制定され、8時間労働制などを定めました（ア）。労働三法の順序と憲法公布の時期をあわせて覚えることが大切です。","m":"1945.12労組法→1946.9労調法→1946.11憲法公布→1947労基法"},{"id":86,"k":"plan","ref":"想定問題","f":"現代","t":"経済復興政策","y":1949,"q":"戦後の経済復興政策について述べた文として誤っているものはどれですか。","c":["シャウプ勧告によって、間接税中心の税制がつくられた。","第1次吉田茂内閣は、石炭・鉄鋼などの基幹産業に資金と資材を集中する傾斜生産方式を採用した。","ドッジ＝ラインのもとで、1ドル＝360円の単一為替レートが設定された。","1948年、GHQは経済安定九原則を指令し、インフレの収束をめざした。"],"e":"1949年のシャウプ勧告は、所得税など直接税を中心とする税制と累進所得税制を提言したもので、間接税中心ではありません。傾斜生産方式は1946年末に第1次吉田内閣が有沢広巳の提案で採用しました。1948年の経済安定九原則を実施するため来日したドッジは超均衡予算を組ませ、1ドル＝360円の単一為替レートを設定しました。","m":"シャウプ＝直接税中心、ドッジ＝360円"},{"id":87,"k":"plan","ref":"想定問題","f":"現代","t":"サンフランシスコ講和会議","y":1951,"q":"1951年のサンフランシスコ講和会議に出席しながら、平和条約に調印しなかった国の組合せとして正しいものはどれですか。","c":["ソ連・ポーランド・チェコスロヴァキア","ソ連・インド・ビルマ","インド・ビルマ・ユーゴスラヴィア","ソ連・中華人民共和国・ポーランド"],"e":"講和会議には日本を含む52か国が参加し、日本は48か国と平和条約に調印しました。ソ連・ポーランド・チェコスロヴァキアは会議に出席しましたが調印を拒否しました。インド・ビルマ・ユーゴスラヴィアは招請に応じず不参加でした。中国については、中華人民共和国・中華民国のどちらも招かれず、日本は1952年に中華民国と日華平和条約を結びました。","m":"出席・不調印＝ソ・ポ・チェコ、不参加＝印・緬・ユーゴ"},{"id":88,"k":"plan","ref":"想定問題","f":"現代","t":"日ソ共同宣言","y":1956,"q":"1956年の日ソ共同宣言について述べた文として正しいものはどれですか。","c":["平和条約締結後に、ソ連が歯舞群島と色丹島を日本に引き渡すことが約束された。","平和条約締結後に、国後島・択捉島を含む4島を返還することが約束された。","この宣言によって日ソ間の平和条約が締結された。","この宣言は岸信介内閣のもとで調印された。"],"e":"1956年、鳩山一郎首相がモスクワで日ソ共同宣言に調印し、戦争状態の終結と国交回復が実現しました。平和条約は結ばれず、締結後に歯舞群島・色丹島を引き渡すことだけが約されました。国後・択捉は含まれず、北方領土問題は未解決のままです。国交回復によってソ連の反対がなくなり、日本は同年12月に国際連合に加盟しました。","m":"日ソ共同宣言＝鳩山、歯舞・色丹は平和条約後"},{"id":89,"k":"plan","ref":"想定問題","f":"現代","t":"日米安保条約の改定","y":1960,"q":"1960年の日米新安全保障条約について述べた文として誤っているものはどれですか。","c":["衆議院・参議院の両院で可決され、正式に国会の承認を得て成立した。","アメリカの日本防衛義務が明記された。","在日アメリカ軍の配置や装備の重要な変更などについて、事前協議制が定められた。","条約の期限は10年とされた。"],"e":"岸信介内閣は1960年1月に新安保条約に調印しました。アメリカの日本防衛義務を明記し、交換公文で事前協議制を定め、期限を10年としました。衆議院で警官隊を導入して強行採決したことで安保闘争が激化し、条約は参議院の議決がないまま30日後に自然承認されました。岸内閣は発効後に総辞職し、池田勇人内閣が成立しました。","m":"新安保＝事前協議・10年・参議院議決なく自然承認"},{"id":90,"k":"plan","ref":"想定問題","f":"現代","t":"高度経済成長期の政策","y":1964,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 公害対策基本法が制定された。\nイ 農業基本法が制定された。\nウ 日本が経済協力開発機構（OECD）に加盟した。\nエ 環境庁が設置された。","c":["イ→ウ→ア→エ","ウ→イ→ア→エ","イ→ア→ウ→エ","イ→ウ→エ→ア"],"e":"1961年、池田内閣のもとで農業と他産業の格差是正をめざす農業基本法が制定されました（イ）。1964年、日本はIMF8条国に移行するとともに、OECDに加盟して資本の自由化を進めました（ウ）。公害が社会問題化するなか、1967年に公害対策基本法が制定され（ア）、1971年に環境庁が設置されました（エ）。","m":"1961農業基本法→1964OECD→1967公害対策基本法→1971環境庁"},{"id":91,"k":"plan","ref":"想定問題","f":"現代","t":"戦後の近隣外交","y":1978,"q":"戦後の外交の取り決めと、それを結んだときの内閣の組合せとして正しいものはどれですか。","c":["日中平和友好条約―福田赳夫内閣","日中共同声明―佐藤栄作内閣","日韓基本条約―池田勇人内閣","日中平和友好条約―田中角栄内閣"],"e":"日韓基本条約は1965年、佐藤栄作内閣のもとで結ばれ、韓国政府を朝鮮半島の唯一の合法政府と確認しました。日中共同声明は1972年、田中角栄首相が訪中して周恩来首相と調印し、日中国交正常化が実現しました。日中平和友好条約は1978年、福田赳夫内閣のもとで締結されました。佐藤内閣は沖縄返還（1972年）を実現した内閣です。","m":"日韓1965佐藤、日中声明1972田中、条約1978福田"},{"id":92,"k":"plan","ref":"想定問題","f":"現代","t":"スミソニアン協定","y":1971,"q":"1971年のニクソン＝ショック後、主要国が合意したスミソニアン協定で定められた円の対ドル基準相場はどれですか。","c":["1ドル＝308円","1ドル＝360円","1ドル＝240円","1ドル＝270円"],"e":"1971年8月、アメリカのニクソン大統領が金とドルの交換停止を発表しました（ドル＝ショック）。同年12月のスミソニアン協定で、円は1949年以来の1ドル＝360円から1ドル＝308円に切り上げられました。しかしドルへの信頼は回復せず、1973年に日本を含む主要国は変動為替相場制に移行しました。","m":"360円（1949）→308円（1971スミソニアン）→1973変動相場"},{"id":93,"k":"plan","ref":"想定問題","f":"現代","t":"1980年代の政治と経済","y":1989,"q":"1980年代の政治・経済について述べた文として正しいものはどれですか。","c":["竹下登内閣のもとで、税率3％の消費税が導入された。","国鉄の分割・民営化は、竹下登内閣のもとで実施された。","プラザ合意では、円安・ドル高への誘導が合意された。","日本電信電話公社の民営化は、大平正芳内閣のもとで行われた。"],"e":"中曽根康弘内閣は行財政改革を進め、1985年に電電公社をNTT、専売公社をJTとし、1987年4月に国鉄を分割・民営化してJRグループを発足させました。1985年のプラザ合意はドル高是正のための協調介入を決めたもので、急速な円高を招きました。消費税は竹下登内閣のもとで成立し、1989年4月に税率3％で導入されました。","m":"中曽根＝NTT・JT・JR、竹下＝消費税3％"},{"id":94,"k":"plan","ref":"想定問題","f":"現代","t":"1990年代の政治","y":1994,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 非自民8党派による細川護熙内閣が成立した。\nイ 阪神・淡路大震災がおこった。\nウ 自民党・社会党・新党さきがけの連立による村山富市内閣が成立した。\nエ 消費税率が5％に引き上げられた。","c":["ア→ウ→イ→エ","ア→イ→ウ→エ","ウ→ア→イ→エ","ア→ウ→エ→イ"],"e":"1993年8月に細川護熙内閣が成立し、55年体制が崩れました（ア）。細川内閣は小選挙区比例代表並立制を導入しました。羽田内閣の後、1994年6月に村山富市内閣が成立しました（ウ）。1995年1月に阪神・淡路大震災がおこり（イ）、同年3月には地下鉄サリン事件もありました。1997年4月、橋本龍太郎内閣のもとで消費税率が5％に引き上げられました（エ）。","m":"1993細川→1994村山→1995震災→1997消費税5％"},{"id":95,"k":"plan","ref":"想定問題","f":"現代","t":"PKO協力法","y":1992,"q":"1992年に成立したPKO協力法にもとづいて、自衛隊が初めて国連平和維持活動に派遣された国・地域はどこですか。","c":["カンボジア","モザンビーク","ゴラン高原","東ティモール"],"e":"1991年の湾岸戦争で、日本は多額の資金を拠出しましたが人的貢献がないと批判され、戦後にペルシア湾へ掃海艇を派遣しました。1992年、宮沢喜一内閣のもとでPKO協力法が成立し、同年自衛隊がカンボジアに派遣されました。その後、モザンビーク（1993年）、ゴラン高原（1996年）、東ティモール（2002年）などにも派遣されています。","m":"PKO協力法1992宮沢→初派遣カンボジア"},{"id":96,"k":"plan","ref":"想定問題","f":"現代","t":"戦後の文化と学術","y":1950,"q":"戦後の文化・学術について述べた文として正しいものはどれですか。","c":["1949年の法隆寺金堂壁画の焼損をきっかけに、翌年文化財保護法が制定された。","湯川秀樹は、くりこみ理論によって日本人初のノーベル賞を受賞した。","黒澤明監督の『羅生門』は、カンヌ国際映画祭で最高賞を受賞した。","日本学術会議は、高度経済成長が始まった1956年に設立された。"],"e":"1949年に法隆寺金堂の壁画が焼損したことを受け、1950年に文化財保護法が制定されました。湯川秀樹は中間子理論で1949年に日本人初のノーベル賞（物理学賞）を受け、くりこみ理論は1965年に受賞した朝永振一郎の業績です。『羅生門』は1951年にヴェネツィア国際映画祭で金獅子賞を受けました。日本学術会議は1949年に設立されました。","m":"法隆寺壁画焼損1949→文化財保護法1950"},{"id":97,"k":"plan","ref":"想定問題","f":"現代","t":"占領期の内閣","y":1947,"q":"次のア〜エの内閣を、成立の古いものから順に並べたものとして正しいものはどれですか。\nア 片山哲内閣\nイ 芦田均内閣\nウ 第1次吉田茂内閣\nエ 幣原喜重郎内閣","c":["エ→ウ→ア→イ","エ→ア→ウ→イ","ウ→エ→ア→イ","エ→ウ→イ→ア"],"e":"幣原喜重郎内閣（1945年10月）は戦後初の総選挙を実施しました（エ）。1946年4月の総選挙で日本自由党が第一党となりましたが、総裁の鳩山一郎が公職追放されたため、吉田茂が第1次内閣を組織しました（ウ）。1947年4月の総選挙で日本社会党が第一党となり、片山哲内閣が成立しました（ア）。1948年に民主党の芦田均内閣が続きましたが（イ）、昭和電工事件で総辞職しました。","m":"幣原→吉田①→片山→芦田→吉田②"},{"id":98,"k":"plan","ref":"想定問題","f":"現代","t":"教育委員会制度","y":1956,"q":"1948年に発足した教育委員会の委員の選出方法と、1956年の法改正による変更の組合せとして正しいものはどれですか。","c":["公選制→地方公共団体の首長による任命制","首長による任命制→公選制","公選制→文部大臣による任命制","地方議会による選出→公選制"],"e":"1947年の教育基本法・学校教育法に続き、1948年の教育委員会法で都道府県・市町村に教育委員会が置かれ、委員は住民の選挙で選ばれる公選制とされました。教育の地方分権と民主化をめざしたものです。しかし1956年、第3次鳩山一郎内閣のもとで地方教育行政の組織及び運営に関する法律が成立し、委員は首長が議会の同意を得て任命する任命制に改められました。","m":"教育委員＝1948公選制→1956任命制（鳩山）"},{"id":99,"k":"plan","ref":"想定問題","f":"現代","t":"朝鮮戦争と再軍備","y":1950,"q":"朝鮮戦争前後の日本について述べた文として正しいものはどれですか。","c":["朝鮮戦争が始まると、GHQの指令によって警察予備隊が新設された。","1952年、警察予備隊は防衛庁のもとで自衛隊に改組された。","朝鮮戦争の特需は、主にアメリカ軍向けの石油の輸出によるものであった。","共産主義者を公職や企業から追放するレッドパージは、占領初期の1946年に行われた。"],"e":"1950年6月に朝鮮戦争が始まると、マッカーサーの指令で同年8月に警察予備隊が新設されました。1952年には保安庁のもとで保安隊に改組され、1954年のMSA協定締結を受けて防衛庁と自衛隊が発足しました。特需はアメリカ軍が日本で調達した兵器・弾薬、繊維製品、車両の修理などによるもので、石油の輸出ではありません。レッドパージは1950年に本格化しました。","m":"1950警察予備隊→1952保安隊→1954自衛隊"},{"id":100,"k":"plan","ref":"想定問題","f":"現代","t":"1990年代末以降の動き","y":2002,"q":"次のア〜エを古いものから年代順に並べたものとして正しいものはどれですか。\nア 郵政民営化関連法が成立した。\nイ 地球温暖化防止のための京都議定書が採択された。\nウ 日本の首相が平壌を訪問し、日朝平壌宣言に署名した。\nエ 総選挙で民主党が大勝し、鳩山由紀夫内閣が成立した。","c":["イ→ウ→ア→エ","ウ→イ→ア→エ","イ→ア→ウ→エ","イ→ウ→エ→ア"],"e":"京都議定書は1997年12月、気候変動枠組条約の締約国会議（京都）で採択されました（イ）。2002年9月、小泉純一郎首相が平壌を訪問して日朝平壌宣言に署名し、北朝鮮は日本人拉致を認めました（ウ）。小泉内閣は2005年の衆議院解散・総選挙を経て郵政民営化関連法を成立させました（ア）。2009年の総選挙で民主党が大勝し、鳩山由紀夫内閣が成立しました（エ）。","m":"1997京都議定書→2002平壌宣言→2005郵政→2009政権交代"}];
var FIELDS=["原始・古代","中世","近世","近代","現代"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="waseda-nihonshi-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.k==="past"?"過去問ベース：早稲田大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（早稲田大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+"abcde".charAt(j)+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+KIND[q.k]+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+KIND[q.k]+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

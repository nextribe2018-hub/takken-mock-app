ケットに手を入れると、指先にやわらかいものが触れた。引き出してみると、灰色の毛糸のマフラーが小さく丸めて押しこんであった。いつの間に入れたのだろう。②私は駅のほうを一度だけ振り返り、それから、マフラーを首に巻いて歩き出した。","q":"次の文章で、遥がマフラーを「私」の上着のポケットに押しこんでいたことから読み取れる遥の気持ちとして、最も適切なものを選びなさい。","c":["口では冗談めかしていたが、別れに際して「私」に自分の思いを形にして残したいと思っていた","三本もあるマフラーが荷物になって邪魔なので、早く手放したいと思っていた","見送りに来た「私」を困らせて、別れの悲しさをごまかしたいと思っていた","マフラーを受け取らなかった「私」に腹を立て、無理にでも持たせようと意地になっていた"],"e":"会話では「一本、あげようか」と冗談のように言っていましたが、実際には「私」に気づかれないようポケットに入れていました。改まった言葉は交わさなかったものの、別れの気持ちを品物に託したと読めます。荷物を減らしたかったという理由では、わざわざ気づかれないように入れた意味が説明できません。困らせる、意地になる、という気持ちを示す描写はありません。","m":"言葉にしない思いは行動・小道具に表れる"},{"id":83,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情把握（マフラーを巻いて歩き出す）","p":"改札の前で、遥は大きなリュックを背負い直した。来週から、遥は父親の転勤で北の町の高校に移る。今日はその引っ越しの日だった。\n「見送りなんていいって言ったのに」\n遥はそう言って笑ったが、私が来たことを怒っているようには見えなかった。私たちは小学校からずっと同じクラスで、言いたいことはたいてい言い合ってきた。それなのに、今朝家を出るときから考えていた言葉が、一つも出てこない。\n「向こう、寒いんでしょ」\n「うん。マフラー三本買った」\n「三本もいらないでしょ」\n「一本、あげようか」\n遥は本当にリュックを下ろしかけたので、私はあわてて首を振った。①くだらないやりとりが、いつもと何も変わらないことが、かえって胸にこたえた。\n発車のベルが鳴りはじめた。遥は「じゃあね」とだけ言って、改札を抜けた。階段の手前で一度だけ振り返り、片手を上げた。私も手を上げた。言うはずだった言葉は、結局どれも言わなかった。\n帰り道、上着のポケットに手を入れると、指先にやわらかいものが触れた。引き出してみると、灰色の毛糸のマフラーが小さく丸めて押しこんであった。いつの間に入れたのだろう。②私は駅のほうを一度だけ振り返り、それから、マフラーを首に巻いて歩き出した。","q":"次の文章の傍線部②「私は駅のほうを一度だけ振り返り、それから、マフラーを首に巻いて歩き出した」から読み取れる「私」の心情として、最も適切なものを選びなさい。","c":["言えなかった言葉の代わりに遥の思いを受け止め、別れをかみしめながらも前を向こうとしている","遥にマフラーを返さなければならないと思い、急いで駅へ引き返そうとしている","遥がマフラーを勝手に入れたことに納得できず、怒りをこらえて帰ろうとしている","別れの悲しさに耐えられず、何も考えないようにしてその場を離れようとしている"],"e":"駅のほうを振り返るしぐさには遥への思いが、マフラーを首に巻いて歩き出す動作には、遥の気持ちを受け止めて前へ進もうとする姿勢が表れています。マフラーを首に巻いて帰り道を歩き出しているので、返しに引き返すという説明は誤りです。怒りを示す描写はありません。マフラーを身につけている点から、何も考えないようにしているとも言えません。","m":"最後の動作に心情の決着が表れる"},{"id":84,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・内容一致（遥と「私」）","p":"改札の前で、遥は大きなリュックを背負い直した。来週から、遥は父親の転勤で北の町の高校に移る。今日はその引っ越しの日だった。\n「見送りなんていいって言ったのに」\n遥はそう言って笑ったが、私が来たことを怒っているようには見えなかった。私たちは小学校からずっと同じクラスで、言いたいことはたいてい言い合ってきた。それなのに、今朝家を出るときから考えていた言葉が、一つも出てこない。\n「向こう、寒いんでしょ」\n「うん。マフラー三本買った」\n「三本もいらないでしょ」\n「一本、あげようか」\n遥は本当にリュックを下ろしかけたので、私はあわてて首を振った。①くだらないやりとりが、いつもと何も変わらないことが、かえって胸にこたえた。\n発車のベルが鳴りはじめた。遥は「じゃあね」とだけ言って、改札を抜けた。階段の手前で一度だけ振り返り、片手を上げた。私も手を上げた。言うはずだった言葉は、結局どれも言わなかった。\n帰り道、上着のポケットに手を入れると、指先にやわらかいものが触れた。引き出してみると、灰色の毛糸のマフラーが小さく丸めて押しこんであった。いつの間に入れたのだろう。②私は駅のほうを一度だけ振り返り、それから、マフラーを首に巻いて歩き出した。","q":"次の文章の内容と合致するものとして、最も適切なものを選びなさい。","c":["「私」と遥は小学校からずっと同じクラスで、言いたいことをたいてい言い合ってきた","遥は、見送りに来た「私」に腹を立て、強い口調でとがめた","遥は、改札を抜けたあと階段の手前で何度も振り返り、手を振りつづけた","「私」は、遥からマフラーを手渡しで受け取り、その場で礼を言った"],"e":"「私たちは小学校からずっと同じクラスで、言いたいことはたいてい言い合ってきた」と本文にあります。遥は「見送りなんていいって言ったのに」と言いながら笑っており、「怒っているようには見えなかった」とあります。振り返ったのは「一度だけ」です。マフラーは帰り道にポケットの中で気づいたもので、手渡しではありません。","m":"回数・手段など細部を本文と照合"},{"id":85,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（懐）","q":"次の文のカタカナ部分「カイ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「専門家の説明にもカイギ的な目を向ける」","c":["カイコ趣味の強い人","条文のカイシャクが分かれる","友人を先生にショウカイする","台風の接近にケイカイする"],"e":"カイギは「懐疑（疑いをいだくこと）」で、「カイ」は「懐」です。同じ字を含むのは「懐古（カイコ）」で、昔をなつかしく思うことです。「解釈（カイシャク）」は「解」、「紹介（ショウカイ）」は「介」、「警戒（ケイカイ）」は「戒」です。「懐」は「ふところ・なつかしい・いだく」の意味をもち、「懐疑」の場合は「疑いを心にいだく」ことを表します。","m":"懐＝いだく（懐疑・懐古・懐中）"},{"id":86,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（偏）","q":"次の文のカタカナ部分「ヘン」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「富が一部の地域にヘンザイする」","c":["他人にヘンケンを持つ","フヘン的な真理を求める","雑誌のヘンシュウに携わる","町並みがヘンボウする"],"e":"「一部の地域に」かたよって存在するので、ヘンザイは「偏在」で、「ヘン」は「偏（かたよる）」です。同じ字を含むのは「偏見（ヘンケン）」です。「普遍（フヘン）」の「遍」は「あまねく・すみずみまで」の意味で、「遍在」と書くと「どこにでもある」という反対に近い意味になります。「編集」は「編」、「変貌」は「変」です。","m":"偏在＝かたよってある／遍在＝あまねくある"},{"id":87,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（概）","q":"次の文のカタカナ部分「ガイ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「議論の前にガイネンを整理する」","c":["タイガイの人は知っている","条件にガイトウする","不正にフンガイする","ガイロジュが色づく"],"e":"ガイネンは「概念」で、「ガイ」は「概（おおむね・おおよそ）」です。同じ字を含むのは「大概（タイガイ）」で、「おおかた・たいてい」の意味です。「該当（ガイトウ）」は「該」、「憤慨（フンガイ）」は「慨」、「街路樹（ガイロジュ）」は「街」です。「概」と「慨」は形が似ているので、「慨」は心（りっしんべん）の動きを表すと覚えて区別しましょう。","m":"概＝おおむね（概念・大概・概略）"},{"id":88,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（啓）","q":"次の文のカタカナ部分「ケイ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「住民の防災意識をケイハツする」","c":["手紙をハイケイと書き出す","業者とケイヤクを結ぶ","掲示板にポスターをケイジする","伝統の技をケイゾクする"],"e":"ケイハツは「啓発（気づかせ、理解を深めさせること）」で、「ケイ」は「啓（ひらく・もうす）」です。同じ字を含むのは手紙の書き出しの「拝啓（ハイケイ）」です。「契約（ケイヤク）」は「契」、「掲示（ケイジ）」は「掲」、「継続（ケイゾク）」は「継」です。「啓」には「教えみちびく」と「申し上げる」の意味があり、「啓蒙」「拝啓」などに使われます。","m":"啓＝ひらく・もうす（啓発・拝啓・啓蒙）"},{"id":89,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（拍）","q":"次の文のカタカナ部分「ハク」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「新しい技術が改革にハクシャをかける」","c":["演奏後にハクシュが起こる","ハクリョクのある映像","万国ハクランカイが開かれる","ケイハクな言動を慎む"],"e":"「ハクシャをかける」は「拍車をかける（物事の進み方をいっそう速める）」で、「ハク」は「拍」です。同じ字を含むのは「拍手（ハクシュ）」です。「迫力（ハクリョク）」は「迫」、「博覧会（ハクランカイ）」は「博」、「軽薄（ケイハク）」は「薄」です。拍車は乗馬靴のかかとに付ける金具で、馬の腹をけって速く走らせることから、この慣用句が生まれました。","m":"拍車をかける＝勢いを速める"},{"id":90,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（冗）","q":"次の文のカタカナ部分「ジョウ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「ジョウチョウな説明を短くまとめる」","c":["ジョウダンを言って笑わせる","社会のジョウシキに反する","相手の主張にジョウホする","信頼関係をジョウセイする"],"e":"ジョウチョウは「冗長（むだが多くて長たらしいこと）」で、「ジョウ」は「冗（むだ）」です。同じ字を含むのは「冗談（ジョウダン）」です。「常識（ジョウシキ）」は「常」、「譲歩（ジョウホ）」は「譲」、「醸成（ジョウセイ）」は「醸」で、醸成は「雰囲気や気運を徐々につくり出すこと」です。評論では「冗長」と並んで「簡潔」が対の語としてよく使われます。","m":"冗＝むだ（冗長・冗談・冗漫）"},{"id":91,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（蓋然性）","q":"「この説明には一定の蓋然性がある」の「蓋然性」の意味として、最も適切なものを選びなさい。","c":["ある事柄が実際に起こったり、真実であったりする確からしさの度合い","ある事柄が必ずそうなり、ほかの可能性がまったくないこと","ある事柄が何の原因もなく、たまたま起こること","ある事柄がこれまでに例のない、まったく新しいものであること"],"e":"「蓋然性」は、ある事柄が起こる、または真実である見込みの度合いのことで、「蓋然性が高い」のように使います。数学でいう確率に近い考え方です。必ずそうなることは「必然性」、たまたま起こることは「偶然性」、新しさは「新奇性」などと言います。「蓋然」は「必然」と「偶然」の中間にあたる言葉だと押さえておくと区別しやすくなります。","m":"蓋然性＝確からしさ（必然と偶然の間）"},{"id":92,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（捨象）","q":"「個々の事例の違いを捨象して法則を導く」の「捨象」の意味として、最も適切なものを選びなさい。","c":["共通する性質を取り出す際に、それ以外の個別の性質を考えの外に置くこと","具体的な事柄から、それらに共通する性質を抜き出すこと","不要になった資料や物を、まとめて廃棄すること","形のある物を、点や線などの図形に置きかえて表すこと"],"e":"「捨象」は、物事を一般化するときに、共通点以外の個々の性質を切り捨てて考えないことです。共通する性質を抜き出すことは「抽象」で、抽象と捨象は同じ作業の表と裏の関係にあります。この問題では「違いを」捨てる側を表しているので「捨象」です。物を廃棄する意味はありません。図形に置きかえることは「図式化」などと言います。","m":"抽象＝抜き出す／捨象＝切り捨てる"},{"id":93,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"慣用句（二の足を踏む）","q":"「二の足を踏む」の意味として、最も適切なものを選びなさい。","c":["思い切ることができず、ためらう","前の人と同じ失敗を繰り返す","一歩ずつ着実に物事を進める","先に進んだ人の後を追いかける"],"e":"「二の足を踏む」は、一歩目は出したものの二歩目をためらって足踏みすることから、決心がつかずにためらうことを表します。「高い値段に二の足を踏む」のように使います。前の人と同じ失敗を繰り返すのは「二の舞を演じる」で（「二の舞を踏む」は二つを混同した誤用とされます）、形が似ているので混同しやすい慣用句です。着実に進める、後を追う、という意味はありません。","m":"二の足＝ためらう／二の舞＝同じ失敗"},{"id":94,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"四字熟語（換骨奪胎）","q":"「換骨奪胎」の意味として、最も適切なものを選びなさい。","c":["先人の作品の発想や形式を生かしながら、新しい工夫を加えて独自のものを作ること","他人の作品を、ほとんどそのまま自分の作品として発表すること","古いしきたりをすべて捨て去り、根本から作り直すこと","外見だけを取りつくろい、中身は以前のままにしておくこと"],"e":"「換骨奪胎」はもともと詩文の作り方を表す言葉で、古人の詩文の趣旨や表現をもとにしながら、新しい工夫を加えて自分の作品を生み出すことを言います。そのまま発表するのは盗用で、本来の意味とは異なります。古いものをすべて捨てる意味ではなく、先人のものを生かす点が大切です。外見だけを取りつくろって中身を変えないという意味もありません。","m":"換骨奪胎＝先人を生かして新しく作る"},{"id":95,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"慣用句（にべもない）","q":"「頼みごとをしたが、にべもなく断られた」の「にべもなく」の意味として、最も適切なものを選びなさい。","c":["愛想がなく、そっけない様子で","取るに足りない理由で","少しの見込みもない様子で","相手に遠慮することなく、丁寧に"],"e":"「にべ」はニベという魚から作る粘りの強いにかわのことで、そこから人と人との親密さや愛想を表すようになりました。「にべもない」は、愛想がまったくなく、そっけないことです。「にべもなく断る」の形でよく使われます。取るに足りないは「たわいない」など、見込みがないは「望みがない」などで別の言葉です。丁寧に断るのでは意味が反対になります。","m":"にべ＝にかわ→愛想。にべもない＝そっけない"},{"id":96,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（アイロニー）","q":"「この題名には作者のアイロニーがこめられている」の「アイロニー」の意味として、最も適切なものを選びなさい。","c":["皮肉","郷愁","象徴","誇張"],"e":"「アイロニー」は、表面の意味とは逆のことを言外に表す言い方で、「皮肉・反語」と訳されます。たとえば、失敗した人に「さすがだね」と言うのがその例です。「郷愁」は「ノスタルジー」、「象徴」は「シンボル」、「誇張」は大げさに言う表現で、それぞれ別の語です。評論や小説の読解でもよく出るので、カタカナ語と訳語をセットで覚えましょう。","m":"アイロニー＝皮肉・反語"},{"id":97,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「まし」（反実仮想・ましかば）","q":"次は『徒然草』第十一段の一節です（本文は校註日本文学大系本による）。傍線部「この木なからましかば」の意味として、最も適切なものを選びなさい。\n「大きなる柑子の木の、枝もたわゝになりたるが、まはりを嚴しく圍ひたりしこそ、少しことさめて、この木なからましかばと覺えしか。」","c":["この木がなかったらよかったのに","この木はなかったにちがいない","この木はやがてなくなってしまうだろう","この木はなかったのだろうか"],"e":"「ましか」は反実仮想の助動詞「まし」の未然形で、「ましかば」は「もし〜だったら」と事実に反する仮定を表します。後ろに続くはずの「よからまし」などが省略され、「この木がなかったらよかったのに」という意味になります。実の盗難を恐れて厳重に囲った柑子の木を見て、作者は興ざめしたのです。断定的な推量、未来の推量、疑問の意味はありません。","m":"ましかば〜まし＝もし〜ならば〜だろうに"},{"id":98,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「けり」の意味（詠嘆）","q":"次は『徒然草』第十一段の一節で、山里の庵を見た作者の思いを述べた部分です（本文は校註日本文学大系本による）。傍線部「ける」の意味として、最も適切なものを選びなさい。\n「かくても在られけるよと、あはれに見る程に」（傍線部は「在られけるよ」の「ける」）","c":["詠嘆","過去","完了","伝聞"],"e":"「けり」には過去と詠嘆の用法があります。ここは、ひっそりとした庵を目の前にした作者が、その場で「こんなふうにしても住んでいられるのだなあ」と感じ入っている場面で、終助詞「よ」とともに、今はじめて気づいたことへの感動を表す詠嘆です。過去の出来事を伝えているのではありません。完了は「ぬ・つ・たり・り」、伝聞は「なり」などが表します。","m":"気づき・感動の「けり」＝〜だなあ"},{"id":99,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"「あなる」の文法（伝聞・推定「なり」）","q":"次は『徒然草』第八十九段の一節です（本文は校註日本文学大系本による）。傍線部「あなる」の文法的説明として、最も適切なものを選びなさい。\n「山ならねども、これらにも、猫の經あがりて、猫またになりて、人とる事はあなるものを。」","c":["ラ変動詞「あり」の連体形の撥音便「あん」の「ん」が表記されない形＋伝聞・推定の助動詞「なり」","ラ変動詞「あり」の連体形＋断定の助動詞「なり」","形容動詞「あなり」の連体形","四段動詞「あなる」の連体形"],"e":"「あなる」は、ラ変動詞「あり」の連体形「ある」が撥音便で「あん」となり、その「ん」が書かれない形に、伝聞・推定の助動詞「なり」が付いたものです。伝聞・推定の「なり」はラ変型の語には連体形に付き、撥音便を起こしやすいのが特徴です。ここは「人を取ることはあるということだのに」と人から聞いた話を述べています。断定の「なり」ならば「あるなり」となり撥音便は起こりません。","m":"あなる・ざなる・なかなる＝伝聞推定"},{"id":100,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「む」の意味（婉曲）","q":"次は『徒然草』第八十九段の一節で、猫またの話を聞いた法師が思ったことです（本文は校註日本文学大系本による）。傍線部「む」の意味として、最も適切なものを選びなさい。\n「一人ありかむ身は心すべきことにこそ」（傍線部は「ありかむ」の「む」）","c":["婉曲","意志","勧誘","推量"],"e":"「む」は文中で連体形となり、すぐ後に体言（ここでは「身」）が続くとき、「〜ような」と断定を避けて表現をやわらげる婉曲の用法になります。「一人で歩き回るような身は、用心しなければならないことだ」という意味です。意志は主に文末で話し手自身の行為に、勧誘は相手への誘いに使います。推量は文末で「〜だろう」となる用法で、ここは文中・体言の前なので婉曲です。","m":"む＋体言＝婉曲（〜ような）"},{"id":101,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（心にくし）","q":"次は『徒然草』第百五十段の一節で、芸を身につけようとする人がよく言う言葉です（本文は校註日本文学大系本による）。傍線部「心にくから」の意味として、最も適切なものを選びなさい。\n「よくせざらむ程は、なまじひに人に知られじ、内々よく習ひ得てさし出でたらむこそ、いと心にくからめ。」","c":["奥ゆかしい","憎らしい","うらやましい","心が痛む"],"e":"「心にくし」は、奥深くて心ひかれる様子、つまり「奥ゆかしい・上品だ」という意味のほめ言葉です。ここは「うまくできないうちは人に知られないようにし、こっそり習得してから人前に出るのが、たいそう奥ゆかしいだろう」という考えです。現代語の「憎い」から「憎らしい」と誤らないように注意しましょう。うらやましいは「うらやまし」、心が痛むは「心苦し」などが表します。","m":"心にくし＝奥ゆかしい（ほめ言葉）"},{"id":102,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"呼応の副詞（よも〜じ）","q":"次は『徒然草』第百八十四段の一節で、松下禅尼が兄の申し出に答えた言葉です（本文は校註日本文学大系本による）。傍線部「よも勝り侍らじ」の意味として、最も適切なものを選びなさい。\n「その男、尼が細工によも勝り侍らじ。」","c":["まさか勝ることはないでしょう","決して勝とうとは思いません","少しは勝っているでしょう","勝ってはなりません"],"e":"副詞「よも」は打消推量の助動詞「じ」と呼応して「まさか〜ないだろう」という意味を表します。障子張りの職人を呼ぼうという兄の申し出に、禅尼が「その男も、尼（わたくし）の細工にまさか勝りはしないでしょう」と答えた場面です。「侍り」は丁寧語です。「じ」を打消意志と取ると「勝とうとは思わない」となりますが、主語は「その男」で、禅尼自身の意志ではありません。","m":"よも〜じ＝まさか〜ないだろう"},{"id":103,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「す」の意味（使役）","q":"次は『徒然草』第百八十四段の一節で、障子を自分で張る松下禅尼に、兄の義景が申し出た言葉です（本文は校註日本文学大系本による）。傍線部「せ」の意味として、最も適切なものを選びなさい。\n「たまはりて、なにがし男に張らせ候はむ。」（傍線部は「張らせ」の「せ」）","c":["使役","尊敬","受身","自発"],"e":"「す」は使役と尊敬の意味をもつ助動詞です。ここは「なにがし男に」と、動作をさせる相手が示されていて、「（その仕事を）いただいて、某という男に張らせましょう」という意味なので使役です。尊敬の「す」は、ふつう「給ふ」などの尊敬語と重なって「せ給ふ」の形で用いられます。受身や自発の意味は「す」にはなく、「る・らる」が表します。","m":"「〜に」＋せ（給ふなし）→使役"},{"id":104,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"敬語（二方面・申さる）","q":"次は『徒然草』第百八十四段の一節で、兄の義景が母である松下禅尼に言った場面です（本文は校註日本文学大系本による）。傍線部「申さ」と「れ」は、それぞれ作者から誰への敬意を表しているか。最も適切なものを選びなさい。\n「斑に候も見苦しくや。」と、重ねて申されければ","c":["「申さ」は禅尼への敬意、「れ」は義景への敬意","「申さ」は義景への敬意、「れ」は禅尼への敬意","「申さ」も「れ」も禅尼への敬意","「申さ」も「れ」も義景への敬意"],"e":"「申す」は「言ふ」の謙譲語で、言う相手（動作の受け手）である禅尼を高めます。「れ」は尊敬の助動詞「る」の連用形で、言う人（動作の主体）である義景を高めます。このように、謙譲語と尊敬語を重ねて、動作の受け手と主体の両方に敬意を表す言い方を二方面への敬語と言います。地の文なので、どちらも作者からの敬意です。","m":"謙譲語→受け手へ、尊敬語→主体へ"},{"id":105,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「らる」の意味（可能）","q":"次は『更級日記』の一節で、旅の途中で雨に降られた夜のことです（本文は有朋堂文庫本による）。傍線部「られ」の意味として、最も適切なものを選びなさい。\n「庵なども、浮きぬばかりに雨降りなどすれば、恐しくて寢も寢られず。」（傍線部は「寢られず」の「られ」）","c":["可能","自発","受身","尊敬"],"e":"「らる」には受身・尊敬・自発・可能の意味があります。ここは打消の「ず」を伴い、「仮の小屋も浮いてしまいそうなほど雨が降るので、恐ろしくて寝ることもできない」という意味になるので可能です。平安時代の可能の「る・らる」は、このように打消の語と一緒に使われるのがふつうです。自然にそうなる自発、他から何かをされる受身、身分の高い人の動作を表す尊敬では文意が通りません。","m":"る・らる＋打消＝可能（〜できない）"},{"id":106,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（はかばかし）","q":"次は『宇治拾遺物語』「秦兼久向通俊卿許悪口事」の一節で、どんな歌を詠んだかと尋ねられた兼久の答えです（本文は国史大系本による。踊り字は仮名に直した）。傍線部「はかばかしき」の意味として、最も適切なものを選びなさい。\n「いかなるうたかよみたるといはれければ。はかばかしき候はず。」","c":["しっかりしていてきわだった（歌）","急いでまとめた（歌）","人に聞かせるのが恥ずかしい（歌）","長く続いている（歌）"],"e":"「はかばかし」は、物事がはかどる様子から、「しっかりしている・きわだっている・頼もしい」という意味を表します。ここは打消を伴い、「たいした歌はございません」と謙遜して答えている場面です。そのあと兼久は自作の歌を披露しています。「急いで」は現代語の「はかどる」からの連想による誤りです。恥ずかしい、長い、という意味はありません。","m":"はかばかし＝しっかりしている・きわだつ"},{"id":107,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（つれなし）","q":"次は『徒然草』第百五十段の一節で、上達する人の様子を述べた部分です（本文は校註日本文学大系本による）。傍線部「つれなくて」の意味として、最も適切なものを選びなさい。\n「上手の中にまじりて、譏り笑はるゝにも恥ぢず、つれなくて過ぎてたしなむ人」","c":["平然として、気にかけない様子で","つらさに耐えかね、うちひしがれた様子で","退屈して、気が乗らない様子で","人目を避けて、こっそりと"],"e":"「つれなし」は、周りの状況に関係なく変わらない様子を表し、「平然としている・素知らぬ顔だ」という意味と、人に対して「冷淡だ・薄情だ」という意味があります。ここは、上手な人の中で非難され笑われても恥じずに「平然として」稽古を続ける人のことなので、前者の意味です。他人への態度を述べているのではないので、冷淡・薄情の意味でもありません。「恥ぢず」とあるので、うちひしがれた様子は合いません。退屈、こっそり、という意味もありません。","m":"つれなし＝平然としている／冷淡だ"},{"id":108,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（やがて）","q":"次は『徒然草』第八十九段の一節で、法師が猫また（と思ったもの）に飛びつかれた場面です（本文は校註日本文学大系本による）。傍線部「やがて」の意味として、最も適切なものを選びなさい。\n「音に聞きし猫またあやまたず足もとへふと寄り來て、やがて掻きつくまゝに、頚のほどを食はむとす。」","c":["すぐに","そのうちに","やっとのことで","ひそかに"],"e":"古語の「やがて」には「すぐに・ただちに」と「そのまま」の意味があります。ここは、足もとへ寄ってきた猫またが「すぐに」飛びつくやいなや首のあたりに食いつこうとした、という場面です。現代語の「やがて（そのうちに・まもなく）」とは意味が違うので注意しましょう。「やっとのことで」「ひそかに」という意味はありません。","m":"やがて＝すぐに／そのまま"},{"id":109,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・語句の意味（やはら）","p":"これも今はむかし。ゐ中のちごのひえの山へのぼりたりけるが。桜のめでたくさきたりけるに。風のはげしくふきけるをみて。このちごさめざめとなきけるをみて。僧のやはらよりてなどかうはなかせ給ふぞ。この花のちるおしうおぼえさせ給か。桜ははかなき物にてかくほどなくうつろひ候なり。されどもさのみぞさぶらふとなぐさめければ。桜のちらんはあながちにいかゞせんくるしからず。我てゝの作たる麦の花ちりて実のいらざらんおもふがわびしきといひて。さくりあげてよゝとなきける。うたてしやな。\n（『宇治拾遺物語』巻一「田舎のちご桜のちるを見てなく事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章の「僧のやはらよりて」の「やはら」の意味として、最も適切なものを選びなさい。","c":["そっと、静かに","急いで、あわただしく","荒々しく、乱暴に","しかたなく、しぶしぶ"],"e":"「やはら」は「そっと・静かに・おもむろに」という意味の副詞で、「やをら」とも言います。桜を見て泣いている児のそばへ、僧が驚かせないようにそっと近寄り、「などかうはなかせ給ふぞ（どうしてこのようにお泣きになるのですか）」と声をかけた場面です。急いで、荒々しく、しぶしぶ、という意味はなく、泣く児を慰めようとする僧の様子にも合いません。","m":"やはら・やをら＝そっと・静かに"},{"id":110,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・理由説明（児が泣いたわけ）","p":"これも今はむかし。ゐ中のちごのひえの山へのぼりたりけるが。桜のめでたくさきたりけるに。風のはげしくふきけるをみて。このちごさめざめとなきけるをみて。僧のやはらよりてなどかうはなかせ給ふぞ。この花のちるおしうおぼえさせ給か。桜ははかなき物にてかくほどなくうつろひ候なり。されどもさのみぞさぶらふとなぐさめければ。桜のちらんはあながちにいかゞせんくるしからず。我てゝの作たる麦の花ちりて実のいらざらんおもふがわびしきといひて。さくりあげてよゝとなきける。うたてしやな。\n（『宇治拾遺物語』巻一「田舎のちご桜のちるを見てなく事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章で、児（ちご）が泣いていた本当の理由として、最も適切なものを選びなさい。","c":["父が作っている麦の花が風で散って、実が入らないのではないかと思うとつらかったから","桜の花がすぐに散ってしまうことが、はかなく悲しく思われたから","僧に泣いているところを見られ、からかわれたのが恥ずかしかったから","比叡山に来てから故郷の父に会えず、さびしくてたまらなかったから"],"e":"児は「我てゝの作たる麦の花ちりて実のいらざらんおもふがわびしき」と答えています。「てて」は父、「実のいらざらん」は実が入らないだろうこと、「わびし」はつらいという意味です。桜が散るのは「くるしからず（かまわない）」と言っているので、桜のはかなさを悲しんだのではありません。僧は慰めているので、からかわれたわけではありません。父に会えないさびしさも述べていません。","m":"わびし＝つらい・やりきれない"},{"id":111,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・解釈（あながちにいかがせん）","p":"これも今はむかし。ゐ中のちごのひえの山へのぼりたりけるが。桜のめでたくさきたりけるに。風のはげしくふきけるをみて。このちごさめざめとなきけるをみて。僧のやはらよりてなどかうはなかせ給ふぞ。この花のちるおしうおぼえさせ給か。桜ははかなき物にてかくほどなくうつろひ候なり。されどもさのみぞさぶらふとなぐさめければ。桜のちらんはあながちにいかゞせんくるしからず。我てゝの作たる麦の花ちりて実のいらざらんおもふがわびしきといひて。さくりあげてよゝとなきける。うたてしやな。\n（『宇治拾遺物語』巻一「田舎のちご桜のちるを見てなく事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章の「桜のちらんはあながちにいかゞせんくるしからず」の解釈として、最も適切なものを選びなさい。","c":["桜が散るようなことは、しいてどうしようもないことで、かまわない","桜が散るのは、何としても止めなければならず、見ているのはつらい","桜が散るのを見ると、どうしようもなく苦しくなってしまう","桜を散らしたのはいったい誰なのか、決して許すことはできない"],"e":"「ちらん」の「ん（む）」は連体形で婉曲、「あながちに」は「むやみに・しいて」、「いかゞせん」は「どうしようか、いや、どうしようもない」という反語、「くるしからず」は「さしつかえない・かまわない」という意味です。児は、桜が散るのはどうしようもないことで気にしていない、と言っているのです。「くるしからず」を「苦しい」と取り違えた選択肢は、打消の「ず」を見落としています。","m":"いかがせん＝どうしようもない（反語）"},{"id":112,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・語り手の評（うたてしやな）","p":"これも今はむかし。ゐ中のちごのひえの山へのぼりたりけるが。桜のめでたくさきたりけるに。風のはげしくふきけるをみて。このちごさめざめとなきけるをみて。僧のやはらよりてなどかうはなかせ給ふぞ。この花のちるおしうおぼえさせ給か。桜ははかなき物にてかくほどなくうつろひ候なり。されどもさのみぞさぶらふとなぐさめければ。桜のちらんはあながちにいかゞせんくるしからず。我てゝの作たる麦の花ちりて実のいらざらんおもふがわびしきといひて。さくりあげてよゝとなきける。うたてしやな。\n（『宇治拾遺物語』巻一「田舎のちご桜のちるを見てなく事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章の最後にある「うたてしやな」は、語り手のどのような気持ちを表しているか。最も適切なものを選びなさい。","c":["桜の散るのを惜しむ風流心からではなく、麦の実りを心配して泣いていたと分かり、興ざめだと思う気持ち","父の作る麦のことまで気にかける児の孝行心に、深く感心する気持ち","見当違いの慰めを言った僧の思慮のなさを、厳しく非難する気持ち","桜を散らしてしまうほど激しく吹いた風を、恨めしく思う気持ち"],"e":"「うたてし」は「いやだ・情けない・興ざめだ」という意味で、「やな」は詠嘆です。僧は、児が桜のはかなさを惜しんで泣いていると思い、風流な心をもつ子だと受け取って慰めました。ところが実際には麦の実りを心配していたので、語り手は「がっかりだなあ」と評しているのです。「うたてし」はほめ言葉ではないので、感心する気持ちは合いません。僧や風を非難する文脈でもありません。","m":"うたてし＝いやだ・情けない・興ざめだ"},{"id":113,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・理由説明（上人の感涙）","p":"丹波に出雲といふ所あり。大社（おほやしろ）を遷して、めでたく造れり。志太の某（なにがし）とかやしる所なれば、秋の頃、聖海上人、その外も人數多誘ひて、「いざたまへ、出雲拜みに。かいもちひ召させむ。」とて、具しもていきたるに、おのおの拜みて、ゆゝしく信起したり。御前なる獅子狛犬、そむきて後ざまに立ちたりければ、上人いみじく感じて、「あなめでたや。この獅子の立ちやういと珍し。深き故あらむ。」と涙ぐみて、「いかに殿ばら、殊勝の事は御覽じとがめずや。無下なり。」といへば、おのおのあやしみて、「まことに他に異なりけり、都のつとにかたらむ。」などいふに、上人なほゆかしがりて、おとなしく物知りぬべき顔したる神官をよびて、「この御社の獅子の立てられやう、定めてならひあることにはべらむ。ちと承らばや。」といはれければ、「そのことに候。さがなき童（わらはべ）どもの仕りける、奇怪に候ことなり。」とて、さし寄りてすゑ直して往にければ、上人の感涙いたづらになりにけり。\n（『徒然草』第二百三十六段。校註日本文学大系本による。（　）内は原本の振り仮名。踊り字は仮名に直した）","q":"次の文章で、聖海上人が涙ぐんだのはなぜか。最も適切なものを選びなさい。","c":["獅子と狛犬が互いに背を向けて後ろ向きに立っているのを見て、深い由緒があるにちがいないと思い感動したから","出雲大社をわざわざ丹波に遷して、立派に造った人々の信仰の深さに心を打たれたから","一緒に来た人々が獅子と狛犬の珍しさに気づかず、無関心なのを嘆かわしく思ったから","神官に獅子と狛犬の置き方を尋ねたところ、由来を詳しく教えてもらえてうれしかったから"],"e":"上人は、獅子と狛犬が「そむきて後ざまに立ちたりければ」、「この獅子の立ちやういと珍し。深き故あらむ」と言って涙ぐんでいます。珍しい置き方に深い理由があると思いこんで感動したのです。社を遷した人々の信仰に涙したのではありません。人々の無関心を「無下なり」ととがめてはいますが、それは涙ぐんだ後の言葉です。神官の答えは、由来ではなく子どものいたずらでした。","m":"涙の直前の言葉「深き故あらむ」に理由"},{"id":114,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・語句の意味（おとなし）","p":"丹波に出雲といふ所あり。大社（おほやしろ）を遷して、めでたく造れり。志太の某（なにがし）とかやしる所なれば、秋の頃、聖海上人、その外も人數多誘ひて、「いざたまへ、出雲拜みに。かいもちひ召させむ。」とて、具しもていきたるに、おのおの拜みて、ゆゝしく信起したり。御前なる獅子狛犬、そむきて後ざまに立ちたりければ、上人いみじく感じて、「あなめでたや。この獅子の立ちやういと珍し。深き故あらむ。」と涙ぐみて、「いかに殿ばら、殊勝の事は御覽じとがめずや。無下なり。」といへば、おのおのあやしみて、「まことに他に異なりけり、都のつとにかたらむ。」などいふに、上人なほゆかしがりて、おとなしく物知りぬべき顔したる神官をよびて、「この御社の獅子の立てられやう、定めてならひあることにはべらむ。ちと承らばや。」といはれければ、「そのことに候。さがなき童（わらはべ）どもの仕りける、奇怪に候ことなり。」とて、さし寄りてすゑ直して往にければ、上人の感涙いたづらになりにけり。\n（『徒然草』第二百三十六段。校註日本文学大系本による。（　）内は原本の振り仮名。踊り字は仮名に直した）","q":"次の文章の「おとなしく物知りぬべき顔したる神官」の「おとなしく」の意味として、最も適切なものを選びなさい。","c":["年配で分別がありそうな様子で","口数が少なく、おだやかな様子で","まだ若く、子どもっぽい様子で","身分が低く、みすぼらしい様子で"],"e":"古語の「おとなし」は「大人（おとな）」と同じ語源で、「大人びている・年配で思慮分別がある」という意味です。ここも、物事をよく知っていそうな、年かさで分別のありそうな神官を指しています。現代語の「おとなしい（静かでおだやか）」とは意味が違うので注意が必要です。子どもっぽいは反対の意味です。身分の低さ、みすぼらしさを表す語は「あやし」などです。","m":"おとなし＝大人びている・分別がある"},{"id":115,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・内容理解（神官の答え）","p":"丹波に出雲といふ所あり。大社（おほやしろ）を遷して、めでたく造れり。志太の某（なにがし）とかやしる所なれば、秋の頃、聖海上人、その外も人數多誘ひて、「いざたまへ、出雲拜みに。かいもちひ召させむ。」とて、具しもていきたるに、おのおの拜みて、ゆゝしく信起したり。御前なる獅子狛犬、そむきて後ざまに立ちたりければ、上人いみじく感じて、「あなめでたや。この獅子の立ちやういと珍し。深き故あらむ。」と涙ぐみて、「いかに殿ばら、殊勝の事は御覽じとがめずや。無下なり。」といへば、おのおのあやしみて、「まことに他に異なりけり、都のつとにかたらむ。」などいふに、上人なほゆかしがりて、おとなしく物知りぬべき顔したる神官をよびて、「この御社の獅子の立てられやう、定めてならひあることにはべらむ。ちと承らばや。」といはれければ、「そのことに候。さがなき童（わらはべ）どもの仕りける、奇怪に候ことなり。」とて、さし寄りてすゑ直して往にければ、上人の感涙いたづらになりにけり。\n（『徒然草』第二百三十六段。校註日本文学大系本による。（　）内は原本の振り仮名。踊り字は仮名に直した）","q":"次の文章で、神官は獅子と狛犬が後ろ向きに立っていたわけをどのように説明したか。最も適切なものを選びなさい。","c":["いたずらな子どもたちがしたことで、けしからぬことだ","出雲大社から伝わる古いしきたりによるものだ","都から来た職人が、わざと珍しい置き方をしたものだ","神のお告げに従って、向きを変えたものだ"],"e":"神官は「さがなき童どもの仕りける、奇怪に候ことなり」と答えています。「さがなし」は「いたずらだ・たちが悪い」、「奇怪なり」は「けしからぬ・不都合だ」という意味です。そう言って獅子と狛犬を元の向きに直して去りました。上人は「定めてならひあることにはべらむ（きっといわれのあることでしょう）」と期待しましたが、しきたりや職人、お告げによるものではなかったのです。","m":"さがなし＝いたずらだ・たちが悪い"},{"id":116,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・主旨（感涙いたづら）","p":"丹波に出雲といふ所あり。大社（おほやしろ）を遷して、めでたく造れり。志太の某（なにがし）とかやしる所なれば、秋の頃、聖海上人、その外も人數多誘ひて、「いざたまへ、出雲拜みに。かいもちひ召させむ。」とて、具しもていきたるに、おのおの拜みて、ゆゝしく信起したり。御前なる獅子狛犬、そむきて後ざまに立ちたりければ、上人いみじく感じて、「あなめでたや。この獅子の立ちやういと珍し。深き故あらむ。」と涙ぐみて、「いかに殿ばら、殊勝の事は御覽じとがめずや。無下なり。」といへば、おのおのあやしみて、「まことに他に異なりけり、都のつとにかたらむ。」などいふに、上人なほゆかしがりて、おとなしく物知りぬべき顔したる神官をよびて、「この御社の獅子の立てられやう、定めてならひあることにはべらむ。ちと承らばや。」といはれければ、「そのことに候。さがなき童（わらはべ）どもの仕りける、奇怪に候ことなり。」とて、さし寄りてすゑ直して往にければ、上人の感涙いたづらになりにけり。\n（『徒然草』第二百三十六段。校註日本文学大系本による。（　）内は原本の振り仮名。踊り字は仮名に直した）","q":"次の文章の結び「上人の感涙いたづらになりにけり」の説明として、最も適切なものを選びなさい。","c":["深い理由があると思いこんで流した上人の感動の涙が、まったくの無駄になってしまったということ","上人の感動の涙が、周りの人々にも伝わって、みなを深く感動させたということ","上人が涙を流しながら、人々に自分の思いちがいを謝ったということ","上人の流した涙がいつまでも乾かず、旅の終わりまで泣きつづけたということ"],"e":"「いたづらなり」は「無駄だ・役に立たない」という意味です。上人は獅子と狛犬の置き方に深い由緒があると思いこんで涙ぐみましたが、実は子どものいたずらだったので、その感涙は無駄になってしまいました。早合点して感動した上人の姿をおかしみをこめて描いています。人々が感動した、上人が謝った、泣きつづけた、という内容は本文にありません。","m":"いたづらなり＝無駄だ（現代語の「いたずら」と区別）"},{"id":117,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"更級日記・語句の意味（あやし）","p":"東路の道のはてよりも、なほ奧つかたに生ひ出（で）たる人、いかばかりかはあやしかりけむを、いかに思ひ始めけることにか、世中に物語といふもののあなるを、いかで見ばやと思ひつゝ、徒然なるひるまよひゐなどに、姉、繼母などやうの人々の、その物語かの物語、光源氏のあるやうなど、ところどころ語るを聞くに、いとゞゆかしさまされど、我が思ふまゝに、そらにいかでか覺え語らむ。いみじく心もとなきまゝに、等身（とうしん）に藥師佛（ぶつ）を作りて、手洗などしてひとまに密（みそか）に入りつゝ、京（みやこ）にとくのぼせ給ひて、物語の多くさぶらふなる、あるかぎり見せ給へ、と身を捨てて額（ぬか）をつき祈り申すほどに、十三になる年のぼらむとて、九月（ながづき）三日かどでして、今立（いまだち）といふ所にうつる。年ごろ遊びなれつる所を、あらはに毀ちちらして立ちさわぎて、日の入際のいとすごく霧わたりたるに、車に乘るとてうち見やりたれば、ひとまには參りつゝ額をつきし、藥師佛の立ち給へるを、見捨て奉るかなしくて、人知れずうち泣かれぬ。\n（『更級日記』冒頭。有朋堂文庫本による。（　）内は原本の振り仮名。踊り字は仮名に直した）","q":"次の文章の「いかばかりかはあやしかりけむを」の解釈として、最も適切なものを選びなさい。","c":["どれほどか田舎びていたであろうに","どれほど不思議な力をもっていたことだろうか","どれほど人から疑わしく思われていたことか","どれほど美しく成長していたことだろう"],"e":"東国の道の果てよりもさらに奥の地方で育った作者が、自分のことを述べた部分です。「あやし」には「不思議だ」のほかに「身分が低い・みすぼらしい・田舎びている」という意味があり、ここは都から遠く離れた土地で育った人の様子なので「田舎びていた」と取ります。「けむ」は過去推量の助動詞で、「〜ただろう」の意味です。不思議な力、疑わしい、美しいでは文脈に合いません。","m":"あやし＝不思議／身分が低い・田舎びている"},{"id":118,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"更級日記・解釈（いかで〜ばや）","p":"東路の道のはてよりも、なほ奧つかたに生ひ出（で）たる人、いかばかりかはあやしかりけむを、いかに思ひ始めけることにか、世中に物語といふもののあなるを、いかで見ばやと思ひつゝ、徒然なるひるまよひゐなどに、姉、繼母などやうの人々の、その物語かの物語、光源氏のあるやうなど、ところどころ語るを聞くに、いとゞゆかしさまされど、我が思ふまゝに、そらにいかでか覺え語らむ。いみじく心もとなきまゝに、等身（とうしん）に藥師佛（ぶつ）を作りて、手洗などしてひとまに密（みそか）に入りつゝ、京（みやこ）にとくのぼせ給ひて、物語の多くさぶらふなる、あるかぎり見せ給へ、と身を捨てて額（ぬか）をつき祈り申すほどに、十三になる年のぼらむとて、九月（ながづき）三日かどでして、今立（いまだち）といふ所にうつる。年ごろ遊びなれつる所を、あらはに毀ちちらして立ちさわぎて、日の入際のいとすごく霧わたりたるに、車に乘るとてうち見やりたれば、ひとまには參りつゝ額をつきし、藥師佛の立ち給へるを、見捨て奉るかなしくて、人知れずうち泣かれぬ。\n（『更級日記』冒頭。有朋堂文庫本による。（　）内は原本の振り仮名。踊り字は仮名に直した）","q":"次の文章の「世中に物語といふもののあなるを、いかで見ばや」の解釈として、最も適切なものを選びなさい。","c":["世の中に物語というものがあるそうだが、それを何とかして見たい","世の中に物語というものがあるそうだが、どうして見ることができようか","世の中に物語というものがあるそうだが、それを誰かに見せてほしい","世の中に物語というものがあるそうだが、どうして見なければならないのか"],"e":"「あなる」は伝聞の「なり」を含み、「あるそうだが」と人から聞いたことを表します。そのうえで「いかで」は願望の表現と呼応して「何とかして」の意味になり、「ばや」は自分の行為についての願望を表す終助詞で「〜したい」です。「いかで」を反語（どうして〜できようか）や疑問（どうして〜しなければならないのか）と取ると、「ばや」の願望と合いません。他者に望む「〜してほしい」は終助詞「なむ」の意味で、「ばや」とは区別します。","m":"いかで〜ばや＝何とかして〜したい（ばや＝自分の願望／なむ＝他への願望）"},{"id":119,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"更級日記・内容理解（薬師仏への祈り）","p":"東路の道のはてよりも、なほ奧つかたに生ひ出（で）たる人、いかばかりかはあやしかりけむを、いかに思ひ始めけることにか、世中に物語といふもののあなるを、いかで見ばやと思ひつゝ、徒然なるひるまよひゐなどに、姉、繼母などやうの人々の、その物語かの物語、光源氏のあるやうなど、ところどころ語るを聞くに、いとゞゆかしさまされど、我が思ふまゝに、そらにいかでか覺え語らむ。いみじく心もとなきまゝに、等身（とうしん）に藥師佛（ぶつ）を作りて、手洗などしてひとまに密（みそか）に入りつゝ、京（みやこ）にとくのぼせ給ひて、物語の多くさぶらふなる、あるかぎり見せ給へ、と身を捨てて額（ぬか）をつき祈り申すほどに、十三になる年のぼらむとて、九月（ながづき）三日かどでして、今立（いまだち）といふ所にうつる。年ごろ遊びなれつる所を、あらはに毀ちちらして立ちさわぎて、日の入際のいとすごく霧わたりたるに、車に乘るとてうち見やりたれば、ひとまには參りつゝ額をつきし、藥師佛の立ち給へるを、見捨て奉るかなしくて、人知れずうち泣かれぬ。\n（『更級日記』冒頭。有朋堂文庫本による。（　）内は原本の振り仮名。踊り字は仮名に直した）","q":"次の文章で、作者が薬師仏に祈ったことの内容として、最も適切なものを選びなさい。","c":["早く京に上らせて、京にたくさんあるという物語を、あるだけすべて見せてほしいということ","姉や継母のように、物語をそらで覚えて人に語れるようにしてほしいということ","等身大の薬師仏を立派に作りあげることができるようにしてほしいということ","京へ上る旅の途中で、病気にならず無事に過ごせるようにしてほしいということ"],"e":"作者は「京にとくのぼせ給ひて、物語の多くさぶらふなる、あるかぎり見せ給へ」と祈っています。「とく」は「早く」、「さぶらふなる」は「あるそうだ」、「あるかぎり」は「あるだけ全部」という意味です。姉や継母が語るのを聞いても、作者の思いどおりには語ってもらえないので、京で実物を読みたいと願ったのです。物語をそらで語れるように、薬師仏を作れるように、旅の無事を、という祈りは書かれていません。","m":"祈りの内容は「〜給へ」の前を訳す"},{"id":120,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"更級日記・敬語（見捨て奉る）","p":"東路の道のはてよりも、なほ奧つかたに生ひ出（で）たる人、いかばかりかはあやしかりけむを、いかに思ひ始めけることにか、世中に物語といふもののあなるを、いかで見ばやと思ひつゝ、徒然なるひるまよひゐなどに、姉、繼母などやうの人々の、その物語かの物語、光源氏のあるやうなど、ところどころ語るを聞くに、いとゞゆかしさまされど、我が思ふまゝに、そらにいかでか覺え語らむ。いみじく心もとなきまゝに、等身（とうしん）に藥師佛（ぶつ）を作りて、手洗などしてひとまに密（みそか）に入りつゝ、京（みやこ）にとくのぼせ給ひて、物語の多くさぶらふなる、あるかぎり見せ給へ、と身を捨てて額（ぬか）をつき祈り申すほどに、十三になる年のぼらむとて、九月（ながづき）三日かどでして、今立（いまだち）といふ所にうつる。年ごろ遊びなれつる所を、あらはに毀ちちらして立ちさわぎて、日の入際のいとすごく霧わたりたるに、車に乘るとてうち見やりたれば、ひとまには參りつゝ額をつきし、藥師佛の立ち給へるを、見捨て奉るかなしくて、人知れずうち泣かれぬ。\n（『更級日記』冒頭。有朋堂文庫本による。（　）内は原本の振り仮名。踊り字は仮名に直した）","q":"次の文章の「見捨て奉るかなしくて」の「奉る」は、誰から誰への敬意を表しているか。最も適切なものを選びなさい。","c":["作者から薬師仏への敬意","作者から姉や継母への敬意","作者から読者への敬意","薬師仏から作者への敬意"],"e":"「奉る」は動詞の連用形に付く謙譲の補助動詞で、動作の受け手を高めます。「見捨て」る動作の主体は作者、受け手は、それまでひそかに額をついて祈っていた薬師仏です。したがって作者から薬師仏への敬意です。作者は仏を置いて旅立つのがつらくて、人知れず泣いたのです。姉や継母はこの場面の動作の受け手ではありません。読者への敬意を表すのは丁寧語です。","m":"謙譲語は動作の受け手を高める"}];

var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.k==="past"?"過去問ベース：明治大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（明治大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+"abcde".charAt(j)+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+KIND[q.k]+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+KIND[q.k]+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

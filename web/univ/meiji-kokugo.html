<title>明治 国語 10問テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 一枚の答案用紙。中央1カラム（最大640px）。問題文は試験冊子と同じ明朝、操作と数字はゴシック。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.passage{font-family:var(--f-exam);font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:50vh;overflow-y:auto}
.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}

@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

var QS=[{"id":1,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（市場と人間関係）","p":"市場経済は、見知らぬ者どうしが取引できる仕組みとして発達してきた。顔なじみの間でしか物をやりとりできない社会では、交換の範囲は村や親族の外へ広がりにくい。貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具であり、①人間関係の重みから取引を解き放つことで、交換を飛躍的に拡大させたのである。\nしかし、ここには見落とされやすい逆説がある。契約書がどれほど精密に作られていても、起こりうる事態のすべてを書き尽くすことはできない。予期しない出来事が起きたとき、当事者が条文の隙間をついて自分の利益だけを追い求めれば、取引はたちまち立ちゆかなくなる。実際の取引を支えているのは、書かれた条文そのものよりも、書かれていない部分で相手が誠実にふるまうだろうという見込みである。［　Ａ　］、市場は人格的な関係を切り離すことで成立しながら、その運営においては、切り離したはずの信頼にひそかに寄りかかっているのだ。\n近年、評価の数値化によってこの信頼を置き換えようとする動きが目立つ。取引相手の過去の実績を点数にして公開すれば、誰もが安心して見知らぬ相手と取引できるというわけである。たしかに点数は便利だ。だが、点数が高いことを目的として人がふるまいはじめると、②点数は信頼の目印であることをやめてしまう。評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出されるからである。\n信頼とは、相手がこちらの見ていないところでも約束を守るだろうと考えることにほかならない。そうだとすれば、すべてを監視し記録しようとする試みは、信頼を強めるどころか、信頼という態度そのものを不要にし、やがては掘り崩してしまうおそれがある。市場を支える最後の土台は、計測しきれない部分にこそ置かれている。","q":"次の文章を読んで、傍線部①「人間関係の重みから取引を解き放つ」とはどういうことか。最も適切なものを選びなさい。","c":["相手がどういう人物かを知らなくても、貨幣や契約を通じて取引できるようにしたということ","人間関係を断ち切ること自体を、取引の目的として位置づけたということ","親族や村の内部での物のやりとりを禁じ、外部との取引だけを認めたということ","取引の前に相手の人柄を慎重に調べ、信頼できる者とだけ取引するようにしたということ"],"e":"直前に「貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具」とあり、これを言いかえたのが傍線部です。顔なじみでなくても取引できるようになった、という内容をとらえた選択肢が正解です。人間関係を断つことが「目的」になったわけではなく、親族内の取引を禁じたとも書かれていません。相手の人柄を調べるという説明は、本文と正反対です。","m":"傍線部は直前の文の言いかえを探す"},{"id":2,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・空所補充（接続語）","p":"市場経済は、見知らぬ者どうしが取引できる仕組みとして発達してきた。顔なじみの間でしか物をやりとりできない社会では、交換の範囲は村や親族の外へ広がりにくい。貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具であり、①人間関係の重みから取引を解き放つことで、交換を飛躍的に拡大させたのである。\nしかし、ここには見落とされやすい逆説がある。契約書がどれほど精密に作られていても、起こりうる事態のすべてを書き尽くすことはできない。予期しない出来事が起きたとき、当事者が条文の隙間をついて自分の利益だけを追い求めれば、取引はたちまち立ちゆかなくなる。実際の取引を支えているのは、書かれた条文そのものよりも、書かれていない部分で相手が誠実にふるまうだろうという見込みである。［　Ａ　］、市場は人格的な関係を切り離すことで成立しながら、その運営においては、切り離したはずの信頼にひそかに寄りかかっているのだ。\n近年、評価の数値化によってこの信頼を置き換えようとする動きが目立つ。取引相手の過去の実績を点数にして公開すれば、誰もが安心して見知らぬ相手と取引できるというわけである。たしかに点数は便利だ。だが、点数が高いことを目的として人がふるまいはじめると、②点数は信頼の目印であることをやめてしまう。評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出されるからである。\n信頼とは、相手がこちらの見ていないところでも約束を守るだろうと考えることにほかならない。そうだとすれば、すべてを監視し記録しようとする試みは、信頼を強めるどころか、信頼という態度そのものを不要にし、やがては掘り崩してしまうおそれがある。市場を支える最後の土台は、計測しきれない部分にこそ置かれている。","q":"次の文章の空所［　Ａ　］に入る語として、最も適切なものを選びなさい。","c":["つまり","しかし","たとえば","なぜなら"],"e":"空所の前では「取引を支えているのは、書かれていない部分で相手が誠実にふるまうだろうという見込みだ」と述べ、空所の後で「市場は人間関係を切り離して成立しながら、運営では信頼に寄りかかっている」とまとめています。前の内容を要約・言いかえているので「つまり」が入ります。前後は対立していないので「しかし」は不適、具体例ではないので「たとえば」も不適です。後ろは理由ではなく結論なので「なぜなら」も合いません。","m":"後ろがまとめ・言いかえなら「つまり」"},{"id":3,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・理由説明（数値評価の限界）","p":"市場経済は、見知らぬ者どうしが取引できる仕組みとして発達してきた。顔なじみの間でしか物をやりとりできない社会では、交換の範囲は村や親族の外へ広がりにくい。貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具であり、①人間関係の重みから取引を解き放つことで、交換を飛躍的に拡大させたのである。\nしかし、ここには見落とされやすい逆説がある。契約書がどれほど精密に作られていても、起こりうる事態のすべてを書き尽くすことはできない。予期しない出来事が起きたとき、当事者が条文の隙間をついて自分の利益だけを追い求めれば、取引はたちまち立ちゆかなくなる。実際の取引を支えているのは、書かれた条文そのものよりも、書かれていない部分で相手が誠実にふるまうだろうという見込みである。［　Ａ　］、市場は人格的な関係を切り離すことで成立しながら、その運営においては、切り離したはずの信頼にひそかに寄りかかっているのだ。\n近年、評価の数値化によってこの信頼を置き換えようとする動きが目立つ。取引相手の過去の実績を点数にして公開すれば、誰もが安心して見知らぬ相手と取引できるというわけである。たしかに点数は便利だ。だが、点数が高いことを目的として人がふるまいはじめると、②点数は信頼の目印であることをやめてしまう。評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出されるからである。\n信頼とは、相手がこちらの見ていないところでも約束を守るだろうと考えることにほかならない。そうだとすれば、すべてを監視し記録しようとする試みは、信頼を強めるどころか、信頼という態度そのものを不要にし、やがては掘り崩してしまうおそれがある。市場を支える最後の土台は、計測しきれない部分にこそ置かれている。","q":"次の文章の傍線部②「点数は信頼の目印であることをやめてしまう」のはなぜか。最も適切なものを選びなさい。","c":["点数を得ること自体が目的になると、評価されない場面での誠実さは保証されず、点数が相手の本当の信頼性を示さなくなるから","点数の計算方法には誤りが多く、取引相手の実績を正確に数値に表すことができないから","点数が高い人ほど他人からねたまれ、かえって取引の相手として避けられるようになるから","点数は過去の取引をもとにしたものであり、将来の取引とはまったく関係がないから"],"e":"直後の「評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出される」が理由です。点数のための誠実さは見られていないところでは守られないので、点数が高くても信頼できるとは限らなくなる、ということです。計算方法の誤りやねたみは本文に書かれていません。過去と将来が無関係だという説明も、本文の理由とは違います。","m":"理由は傍線部の直後の「〜からである」に"},{"id":4,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・内容一致（市場と信頼）","p":"市場経済は、見知らぬ者どうしが取引できる仕組みとして発達してきた。顔なじみの間でしか物をやりとりできない社会では、交換の範囲は村や親族の外へ広がりにくい。貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具であり、①人間関係の重みから取引を解き放つことで、交換を飛躍的に拡大させたのである。\nしかし、ここには見落とされやすい逆説がある。契約書がどれほど精密に作られていても、起こりうる事態のすべてを書き尽くすことはできない。予期しない出来事が起きたとき、当事者が条文の隙間をついて自分の利益だけを追い求めれば、取引はたちまち立ちゆかなくなる。実際の取引を支えているのは、書かれた条文そのものよりも、書かれていない部分で相手が誠実にふるまうだろうという見込みである。［　Ａ　］、市場は人格的な関係を切り離すことで成立しながら、その運営においては、切り離したはずの信頼にひそかに寄りかかっているのだ。\n近年、評価の数値化によってこの信頼を置き換えようとする動きが目立つ。取引相手の過去の実績を点数にして公開すれば、誰もが安心して見知らぬ相手と取引できるというわけである。たしかに点数は便利だ。だが、点数が高いことを目的として人がふるまいはじめると、②点数は信頼の目印であることをやめてしまう。評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出されるからである。\n信頼とは、相手がこちらの見ていないところでも約束を守るだろうと考えることにほかならない。そうだとすれば、すべてを監視し記録しようとする試みは、信頼を強めるどころか、信頼という態度そのものを不要にし、やがては掘り崩してしまうおそれがある。市場を支える最後の土台は、計測しきれない部分にこそ置かれている。","q":"次の文章の内容と合致するものとして、最も適切なものを選びなさい。","c":["市場は人格的な関係を切り離して成り立ったが、実際の取引は、書かれていない部分での相手の誠実さへの期待に支えられている","契約書を十分に精密に作成すれば、予期しない事態にも対応でき、信頼に頼る必要はなくなる","評価の数値化は信頼を強めるはたらきをもつので、社会全体にさらに広げていくべきである","見知らぬ者どうしの取引には危険が多いので、顔なじみの間だけの取引に戻るべきである"],"e":"第二段落の「市場は人格的な関係を切り離すことで成立しながら、その運営においては…信頼にひそかに寄りかかっている」と合致します。契約書は「すべてを書き尽くすことはできない」とあるので二つ目は誤りです。数値化はむしろ信頼を「掘り崩してしまうおそれがある」と述べているので三つ目も誤りです。顔なじみの取引に戻れという主張は本文にありません。","m":"筆者の「逆説」の指摘が論旨の中心"},{"id":5,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（多数決と支配）","p":"民主主義といえば、まず多数決が思い浮かぶ。意見が分かれたとき、数の多いほうに従う。この手続きは単純で公平に見えるが、多数決が正当であるためには、いくつかの前提が満たされていなければならない。\nその第一は、少数派が次の機会には多数派になりうるということである。今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる。もし特定の集団が常に少数の側に固定されているなら、多数決は決定の方法ではなく、①一方による他方の支配を数の形で正当化する装置になってしまう。\n第二の前提は、投票の前に十分な話し合いがなされていることである。話し合いの意味は、単に互いの意見を表明し合うことにあるのではない。他者の理由に耳を傾けるうちに、自分の考えが変わるかもしれないという可能性に開かれていることにある。はじめから結論が決まっており、相手を説得することしか念頭にない議論は、［　Ｂ　］にすぎない。\nこう考えると、多数決は民主主義の中心ではなく、その末端に置かれた手続きだと言える。重要なのは票を数える瞬間ではなく、そこに至るまでの過程で、意見を異にする者どうしが互いを、ともに決める仲間として認め合っているかどうかである。②数えることは、数えられない営みに支えられてはじめて意味を持つ。","q":"次の文章の傍線部①「一方による他方の支配を数の形で正当化する装置」とはどういうことか。最も適切なものを選びなさい。","c":["多数の側が固定されたまま少数の側を従わせることを、数が多いという理由で正しいことのように見せかける仕組み","少数の側が巧みな話し合いによって、多数の側の意見を数の上で覆すことを可能にする仕組み","数を正確に数えることで、どちらの集団にも有利にならないように決定を下す公平な仕組み","勝ち負けが毎回入れ替わることで、すべての集団に順番に決定権を与える仕組み"],"e":"傍線部の前提は「特定の集団が常に少数の側に固定されている」場合です。そのとき多数決は、固定された多数派が少数派を従わせることを、「数が多い」という形式で正当なものに見せる道具になる、というのが傍線部の意味です。少数派が覆す、公平な決定、勝ち負けの入れ替わりは、いずれも「固定」という条件と合わず、「支配」の意味も含んでいません。","m":"傍線部は直前の条件（もし〜なら）と合わせて読む"},{"id":6,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・空所補充（語句）","p":"民主主義といえば、まず多数決が思い浮かぶ。意見が分かれたとき、数の多いほうに従う。この手続きは単純で公平に見えるが、多数決が正当であるためには、いくつかの前提が満たされていなければならない。\nその第一は、少数派が次の機会には多数派になりうるということである。今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる。もし特定の集団が常に少数の側に固定されているなら、多数決は決定の方法ではなく、①一方による他方の支配を数の形で正当化する装置になってしまう。\n第二の前提は、投票の前に十分な話し合いがなされていることである。話し合いの意味は、単に互いの意見を表明し合うことにあるのではない。他者の理由に耳を傾けるうちに、自分の考えが変わるかもしれないという可能性に開かれていることにある。はじめから結論が決まっており、相手を説得することしか念頭にない議論は、［　Ｂ　］にすぎない。\nこう考えると、多数決は民主主義の中心ではなく、その末端に置かれた手続きだと言える。重要なのは票を数える瞬間ではなく、そこに至るまでの過程で、意見を異にする者どうしが互いを、ともに決める仲間として認め合っているかどうかである。②数えることは、数えられない営みに支えられてはじめて意味を持つ。","q":"次の文章の空所［　Ｂ　］に入る語句として、最も適切なものを選びなさい。","c":["対話の体裁をとった独白","真剣な合意形成の試み","少数派への細やかな配慮","理性に基づく熟議"],"e":"空所の直前では、本当の話し合いとは「自分の考えが変わるかもしれない可能性に開かれていること」だと述べています。結論が決まっていて相手を説得することしか考えない議論は、形は話し合いでも、実際は一方的に自分の考えを述べているだけです。そこで「対話の体裁をとった独白」が入ります。ほかの三つは、筆者が評価する本来の話し合いの性質であり、「〜にすぎない」と低く評価する文脈に合いません。","m":"「〜にすぎない」は否定的評価の語が入る"},{"id":7,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（数えることの意味）","p":"民主主義といえば、まず多数決が思い浮かぶ。意見が分かれたとき、数の多いほうに従う。この手続きは単純で公平に見えるが、多数決が正当であるためには、いくつかの前提が満たされていなければならない。\nその第一は、少数派が次の機会には多数派になりうるということである。今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる。もし特定の集団が常に少数の側に固定されているなら、多数決は決定の方法ではなく、①一方による他方の支配を数の形で正当化する装置になってしまう。\n第二の前提は、投票の前に十分な話し合いがなされていることである。話し合いの意味は、単に互いの意見を表明し合うことにあるのではない。他者の理由に耳を傾けるうちに、自分の考えが変わるかもしれないという可能性に開かれていることにある。はじめから結論が決まっており、相手を説得することしか念頭にない議論は、［　Ｂ　］にすぎない。\nこう考えると、多数決は民主主義の中心ではなく、その末端に置かれた手続きだと言える。重要なのは票を数える瞬間ではなく、そこに至るまでの過程で、意見を異にする者どうしが互いを、ともに決める仲間として認め合っているかどうかである。②数えることは、数えられない営みに支えられてはじめて意味を持つ。","q":"次の文章の傍線部②「数えることは、数えられない営みに支えられてはじめて意味を持つ」とはどういうことか。最も適切なものを選びなさい。","c":["票を数えて決める手続きは、その前に意見の違う人々が互いを共に決める仲間と認め、話し合う過程があってこそ正当なものになるということ","票の数は不正確になりやすいので、最終的には指導者の判断によって決定を補う必要があるということ","多数決の結果は数字でしか表せないため、人々の感情とは無関係に受け入れなければならないということ","話し合いの内容を数値として記録することで、はじめて多数決が民主的なものになるということ"],"e":"「数えること」は投票・多数決、「数えられない営み」は直前に述べられた、互いを仲間として認め合い、話し合う過程を指します。多数決は「民主主義の末端に置かれた手続き」であり、それを支える過程があって初めて正当になる、という論旨です。指導者の判断、感情と無関係に受け入れる、話し合いの数値化は、いずれも本文にない内容です。","m":"比喩的表現は直前の段落で中身を特定する"},{"id":8,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・内容一致（民主主義の前提）","p":"民主主義といえば、まず多数決が思い浮かぶ。意見が分かれたとき、数の多いほうに従う。この手続きは単純で公平に見えるが、多数決が正当であるためには、いくつかの前提が満たされていなければならない。\nその第一は、少数派が次の機会には多数派になりうるということである。今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる。もし特定の集団が常に少数の側に固定されているなら、多数決は決定の方法ではなく、①一方による他方の支配を数の形で正当化する装置になってしまう。\n第二の前提は、投票の前に十分な話し合いがなされていることである。話し合いの意味は、単に互いの意見を表明し合うことにあるのではない。他者の理由に耳を傾けるうちに、自分の考えが変わるかもしれないという可能性に開かれていることにある。はじめから結論が決まっており、相手を説得することしか念頭にない議論は、［　Ｂ　］にすぎない。\nこう考えると、多数決は民主主義の中心ではなく、その末端に置かれた手続きだと言える。重要なのは票を数える瞬間ではなく、そこに至るまでの過程で、意見を異にする者どうしが互いを、ともに決める仲間として認め合っているかどうかである。②数えることは、数えられない営みに支えられてはじめて意味を持つ。","q":"次の文章の内容と合致するものとして、最も適切なものを選びなさい。","c":["今日の少数派が次には多数派になりうるという見込みは、人が不本意な決定にもひとまず従うことのできる理由の一つである","多数決は民主主義の中心にある手続きであり、票を数える瞬間こそが最も重要である","話し合いの目的は、相手を説得して自分の結論を受け入れさせることにある","少数派の意見は常に正しいので、どのような場合も多数派の意見より優先されるべきである"],"e":"第二段落の「今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる」と合致します。筆者は多数決を「中心ではなく、その末端に置かれた手続き」としているので二つ目は誤りです。相手を説得することしか考えない議論は否定されているので三つ目も誤りです。少数派が常に正しいとは述べていません。","m":"「〜こそ」「〜ではなく」の対比を押さえる"},{"id":9,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（点と線の記憶）","p":"道を調べるのに紙の地図を広げる人は少なくなった。行き先を入力すれば、画面上の矢印が曲がるべき角を一つずつ教えてくれる。おかげで私たちは迷わなくなったが、その代わりに、自分がいまどこにいるのかを知らないまま目的地に着くようになった。矢印に従って歩いた道は、あとで思い出そうとしても、①点と点を結ぶ線としてしか残っていない。\n迷うことには、無駄の一言では片づけられない働きがある。道に迷った人は、見覚えのある建物を探し、太陽の向きを確かめ、通りの傾きから川の方角を推し量る。そうした手探りのなかで、街は少しずつ一枚の広がりとして身体に刻まれていく。目的地へ最短でたどり着くことだけを考えるなら、こうした過程はすべて省いてよい。しかし省かれたのは、余分な時間だけではなかった。［　Ｃ　］もまた、いっしょに手放されたのである。\nもちろん、昔に戻るべきだと言いたいのではない。案内の技術が多くの人の移動を助けていることは疑えない。問題は、効率という物差しが、それ以外の価値を測る物差しをも押しのけてしまうことにある。②速く着くことと、その土地を知ることとは、本来は別々の事柄であった。それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている。便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること。技術とともに生きるとは、そのような二重の視線を保ち続けることなのだろう。","q":"次の文章の傍線部①「点と点を結ぶ線としてしか残っていない」とはどういうことか。最も適切なものを選びなさい。","c":["歩いた道が周囲の街の広がりとの関わりの中で記憶されず、出発地と目的地をつなぐだけのものとして残るということ","歩いた道が実際よりも短く感じられ、移動にかかった時間をまったく思い出せないということ","画面上の矢印の形だけがはっきりと記憶に残り、目的地の名前を忘れてしまうということ","道の途中で見た建物や景色が、写真のように細部まで正確に記憶されるということ"],"e":"第二段落で、迷う人は手探りする中で街を「一枚の広がり」として身体に刻むと述べています。これと対比すると、矢印に従った道は、周りの街との関係を持たず、出発点と到着点を結ぶだけの「線」として残る、という意味になります。時間を思い出せない、矢印の形が残る、景色が細部まで残るという説明は、「広がり」との対比をとらえていません。","m":"「線」と「広がり（面）」の対比"},{"id":10,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・空所補充（失われたもの）","p":"道を調べるのに紙の地図を広げる人は少なくなった。行き先を入力すれば、画面上の矢印が曲がるべき角を一つずつ教えてくれる。おかげで私たちは迷わなくなったが、その代わりに、自分がいまどこにいるのかを知らないまま目的地に着くようになった。矢印に従って歩いた道は、あとで思い出そうとしても、①点と点を結ぶ線としてしか残っていない。\n迷うことには、無駄の一言では片づけられない働きがある。道に迷った人は、見覚えのある建物を探し、太陽の向きを確かめ、通りの傾きから川の方角を推し量る。そうした手探りのなかで、街は少しずつ一枚の広がりとして身体に刻まれていく。目的地へ最短でたどり着くことだけを考えるなら、こうした過程はすべて省いてよい。しかし省かれたのは、余分な時間だけではなかった。［　Ｃ　］もまた、いっしょに手放されたのである。\nもちろん、昔に戻るべきだと言いたいのではない。案内の技術が多くの人の移動を助けていることは疑えない。問題は、効率という物差しが、それ以外の価値を測る物差しをも押しのけてしまうことにある。②速く着くことと、その土地を知ることとは、本来は別々の事柄であった。それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている。便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること。技術とともに生きるとは、そのような二重の視線を保ち続けることなのだろう。","q":"次の文章の空所［　Ｃ　］に入る語句として、最も適切なものを選びなさい。","c":["自分の力で街の全体をつかんでいく経験","目的地へ速く着くという成果","案内の技術がもたらす安心","無駄な時間を省くという効率"],"e":"空所には、最短経路をたどることで「余分な時間」とともに手放されたものが入ります。直前で、迷う中で手探りし、街を「一枚の広がりとして身体に刻」むことが述べられているので、「自分の力で街の全体をつかんでいく経験」が適切です。速く着く成果、技術の安心、時間を省く効率は、いずれも案内の技術によって得られたものであり、手放されたものではありません。","m":"「〜もまた手放された」→失ったものを入れる"},{"id":11,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・筆者の問題意識（効率と価値）","p":"道を調べるのに紙の地図を広げる人は少なくなった。行き先を入力すれば、画面上の矢印が曲がるべき角を一つずつ教えてくれる。おかげで私たちは迷わなくなったが、その代わりに、自分がいまどこにいるのかを知らないまま目的地に着くようになった。矢印に従って歩いた道は、あとで思い出そうとしても、①点と点を結ぶ線としてしか残っていない。\n迷うことには、無駄の一言では片づけられない働きがある。道に迷った人は、見覚えのある建物を探し、太陽の向きを確かめ、通りの傾きから川の方角を推し量る。そうした手探りのなかで、街は少しずつ一枚の広がりとして身体に刻まれていく。目的地へ最短でたどり着くことだけを考えるなら、こうした過程はすべて省いてよい。しかし省かれたのは、余分な時間だけではなかった。［　Ｃ　］もまた、いっしょに手放されたのである。\nもちろん、昔に戻るべきだと言いたいのではない。案内の技術が多くの人の移動を助けていることは疑えない。問題は、効率という物差しが、それ以外の価値を測る物差しをも押しのけてしまうことにある。②速く着くことと、その土地を知ることとは、本来は別々の事柄であった。それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている。便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること。技術とともに生きるとは、そのような二重の視線を保ち続けることなのだろう。","q":"次の文章で、筆者が傍線部②「速く着くことと、その土地を知ることとは、本来は別々の事柄であった」と述べて問題にしているのはどのようなことか。最も適切なものを選びなさい。","c":["効率よく目的地に着けることが、土地を理解することまで果たしたかのように取り違えられていること","土地をよく知る人ほど目的地に速く着けるので、案内の技術はもともと不要であったこと","速く着くための技術が未熟なため、土地を知ることがおろそかになっていること","土地を知るためには、必ず遠回りをして時間をかけなければならないこと"],"e":"傍線部の直後に「それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている」とあります。速く着くこと（効率）と土地を知ることは別の価値なのに、効率が満たされればもう一方も満たされたと思い込まれている点を問題にしています。技術が不要だった、技術が未熟だ、必ず遠回りすべきだ、という主張はどれも本文にはありません。","m":"傍線部の直後で「問題」の中身が示される"},{"id":12,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・主旨（技術と二重の視線）","p":"道を調べるのに紙の地図を広げる人は少なくなった。行き先を入力すれば、画面上の矢印が曲がるべき角を一つずつ教えてくれる。おかげで私たちは迷わなくなったが、その代わりに、自分がいまどこにいるのかを知らないまま目的地に着くようになった。矢印に従って歩いた道は、あとで思い出そうとしても、①点と点を結ぶ線としてしか残っていない。\n迷うことには、無駄の一言では片づけられない働きがある。道に迷った人は、見覚えのある建物を探し、太陽の向きを確かめ、通りの傾きから川の方角を推し量る。そうした手探りのなかで、街は少しずつ一枚の広がりとして身体に刻まれていく。目的地へ最短でたどり着くことだけを考えるなら、こうした過程はすべて省いてよい。しかし省かれたのは、余分な時間だけではなかった。［　Ｃ　］もまた、いっしょに手放されたのである。\nもちろん、昔に戻るべきだと言いたいのではない。案内の技術が多くの人の移動を助けていることは疑えない。問題は、効率という物差しが、それ以外の価値を測る物差しをも押しのけてしまうことにある。②速く着くことと、その土地を知ることとは、本来は別々の事柄であった。それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている。便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること。技術とともに生きるとは、そのような二重の視線を保ち続けることなのだろう。","q":"次の文章の筆者の主張として、最も適切なものを選びなさい。","c":["技術の便利さを受け入れながらも、それによって見えにくくなったものにも目を向け続けるべきだ","案内の技術は人間の能力を衰えさせるので、紙の地図を使う生活に戻るべきだ","迷うことは時間の無駄なので、技術によって完全になくしていくべきだ","移動の効率こそが現代社会で最も重視されるべき価値である"],"e":"最終段落で「昔に戻るべきだと言いたいのではない」と断ったうえで、「便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること」を「二重の視線」と呼んでいます。紙の地図に戻るべきだという選択肢は筆者自身が否定しています。迷うことを無駄とする考えや効率を最重視する考えは、筆者が問題視している立場です。","m":"「〜と言いたいのではない」の後に本音"},{"id":13,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情の理由（言葉を飲みこむ）","p":"祖母の家を片づけに行ったのは、四十九日を終えた翌週のことだった。押し入れの奥から、角のすり切れた木の裁縫箱が出てきた。ふたを開けると、色とりどりの糸巻きが、まるで並べられた日のまま眠っていたかのように整然と収まっている。\n「それ、捨てるでしょ」と、段ボール箱を組み立てながら母が言った。私はとっさに「うん」と答えかけて、言葉を飲みこんだ。糸巻きの一つに、見覚えのある紺色の糸が巻かれていたのだ。小学生のころ、体操服のゼッケンを縫いつけてもらった、あの糸だった。祖母は老眼鏡を額に押し上げ、私が退屈しないようにと、ひと針ごとに数をかぞえてみせた。私は数をかぞえるのに飽きて、途中から祖母の指先ばかり見ていた。\n「……これ、もらってもいい？」\n母は手を止めて、少しのあいだ私の顔を見た。それから、何も言わずに裁縫箱のふたについた埃を、手のひらでそっと払った。①その手つきが、なぜか祖母に似ていると思った。\n帰りの電車で、膝の上の裁縫箱は思いのほか重かった。私は針に糸を通すことさえろくにできない。この箱を使う日が来るのかどうかも分からない。それでも、窓に映る自分の顔を見ながら、②重さを手放さずにいられることが、今はただうれしかった。","q":"次の文章で、「私」が「とっさに『うん』と答えかけて、言葉を飲みこんだ」のはなぜか。最も適切なものを選びなさい。","c":["紺色の糸を目にして、祖母にゼッケンを縫ってもらった思い出がよみがえり、裁縫箱を捨てる気になれなくなったから","母の言い方が冷たく感じられ、反発する気持ちから、わざと母に逆らおうと思ったから","裁縫箱が古い木製の品で、売れば高い値段がつくかもしれないと気づいたから","自分も裁縫を習いたいと前から考えており、ちょうどよい道具が見つかったと思ったから"],"e":"言葉を飲みこんだ直後に「見覚えのある紺色の糸が巻かれていた」「ゼッケンを縫いつけてもらった、あの糸だった」とあり、祖母との思い出が理由だと分かります。母への反発を示す描写はありません。値段の話も出てきません。後半で「針に糸を通すことさえろくにできない」「使う日が来るのか分からない」とあるので、裁縫を習いたかったという説明も合いません。","m":"心情の理由は直後の回想・具体物に"},{"id":14,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・人物の心情（母の手つき）","p":"祖母の家を片づけに行ったのは、四十九日を終えた翌週のことだった。押し入れの奥から、角のすり切れた木の裁縫箱が出てきた。ふたを開けると、色とりどりの糸巻きが、まるで並べられた日のまま眠っていたかのように整然と収まっている。\n「それ、捨てるでしょ」と、段ボール箱を組み立てながら母が言った。私はとっさに「うん」と答えかけて、言葉を飲みこんだ。糸巻きの一つに、見覚えのある紺色の糸が巻かれていたのだ。小学生のころ、体操服のゼッケンを縫いつけてもらった、あの糸だった。祖母は老眼鏡を額に押し上げ、私が退屈しないようにと、ひと針ごとに数をかぞえてみせた。私は数をかぞえるのに飽きて、途中から祖母の指先ばかり見ていた。\n「……これ、もらってもいい？」\n母は手を止めて、少しのあいだ私の顔を見た。それから、何も言わずに裁縫箱のふたについた埃を、手のひらでそっと払った。①その手つきが、なぜか祖母に似ていると思った。\n帰りの電車で、膝の上の裁縫箱は思いのほか重かった。私は針に糸を通すことさえろくにできない。この箱を使う日が来るのかどうかも分からない。それでも、窓に映る自分の顔を見ながら、②重さを手放さずにいられることが、今はただうれしかった。","q":"次の文章の傍線部①「その手つきが、なぜか祖母に似ていると思った」から読み取れる「私」の受け止め方として、最も適切なものを選びなさい。","c":["言葉にしないまま裁縫箱をいたわる母のしぐさに、祖母から母へと受け継がれた優しさのようなものを感じ取った","母が裁縫箱を早く処分したがっていることに気づき、祖母とは違って冷たい人だと感じた","母の手がすっかり年老いて見え、母もいずれいなくなるのだという不安にとらわれた","母が自分の願いを聞いて腹を立てており、黙って叱ろうとしているのだと感じた"],"e":"母は「何も言わずに」埃を「手のひらでそっと払」っています。これは「もらってもいい？」という願いを無言で受け入れ、祖母の品をいたわるしぐさです。その姿に祖母を重ねたのは、祖母と母のつながりや、祖母から受け継がれたやさしさを感じたからだと読めます。処分したがる、腹を立てるという読みは「そっと払った」と合いません。母の老いへの不安を示す描写もありません。","m":"しぐさの描写から無言の気持ちを読む"},{"id":15,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・表現の意味（重さ）","p":"祖母の家を片づけに行ったのは、四十九日を終えた翌週のことだった。押し入れの奥から、角のすり切れた木の裁縫箱が出てきた。ふたを開けると、色とりどりの糸巻きが、まるで並べられた日のまま眠っていたかのように整然と収まっている。\n「それ、捨てるでしょ」と、段ボール箱を組み立てながら母が言った。私はとっさに「うん」と答えかけて、言葉を飲みこんだ。糸巻きの一つに、見覚えのある紺色の糸が巻かれていたのだ。小学生のころ、体操服のゼッケンを縫いつけてもらった、あの糸だった。祖母は老眼鏡を額に押し上げ、私が退屈しないようにと、ひと針ごとに数をかぞえてみせた。私は数をかぞえるのに飽きて、途中から祖母の指先ばかり見ていた。\n「……これ、もらってもいい？」\n母は手を止めて、少しのあいだ私の顔を見た。それから、何も言わずに裁縫箱のふたについた埃を、手のひらでそっと払った。①その手つきが、なぜか祖母に似ていると思った。\n帰りの電車で、膝の上の裁縫箱は思いのほか重かった。私は針に糸を通すことさえろくにできない。この箱を使う日が来るのかどうかも分からない。それでも、窓に映る自分の顔を見ながら、②重さを手放さずにいられることが、今はただうれしかった。","q":"次の文章の傍線部②「重さを手放さずにいられること」の「重さ」が表しているものとして、最も適切なものを選びなさい。","c":["裁縫箱そのものの重みに重ねられた、祖母との思い出やそこから受け継いだもの","使い方の分からない道具を持ち帰ってしまったことへの後悔の気持ち","祖母の家を片づけなければならないという、家族としての重い責任","母に無理を言ってしまったことに対する申し訳なさ"],"e":"「膝の上の裁縫箱は思いのほか重かった」という実際の重さが、傍線部では比喩として使われています。使うかどうか分からなくても「今はただうれしかった」とあるので、重さは祖母との記憶やつながりを表していると読めます。後悔や申し訳なさは「うれしかった」と矛盾します。片づけの責任は、裁縫箱の重さとは結びついていません。","m":"物の重さ＝心の中の大切なものの比喩"},{"id":16,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・表現の特徴（回想と具体物）","p":"祖母の家を片づけに行ったのは、四十九日を終えた翌週のことだった。押し入れの奥から、角のすり切れた木の裁縫箱が出てきた。ふたを開けると、色とりどりの糸巻きが、まるで並べられた日のまま眠っていたかのように整然と収まっている。\n「それ、捨てるでしょ」と、段ボール箱を組み立てながら母が言った。私はとっさに「うん」と答えかけて、言葉を飲みこんだ。糸巻きの一つに、見覚えのある紺色の糸が巻かれていたのだ。小学生のころ、体操服のゼッケンを縫いつけてもらった、あの糸だった。祖母は老眼鏡を額に押し上げ、私が退屈しないようにと、ひと針ごとに数をかぞえてみせた。私は数をかぞえるのに飽きて、途中から祖母の指先ばかり見ていた。\n「……これ、もらってもいい？」\n母は手を止めて、少しのあいだ私の顔を見た。それから、何も言わずに裁縫箱のふたについた埃を、手のひらでそっと払った。①その手つきが、なぜか祖母に似ていると思った。\n帰りの電車で、膝の上の裁縫箱は思いのほか重かった。私は針に糸を通すことさえろくにできない。この箱を使う日が来るのかどうかも分からない。それでも、窓に映る自分の顔を見ながら、②重さを手放さずにいられることが、今はただうれしかった。","q":"次の文章の表現の特徴として、最も適切なものを選びなさい。","c":["現在の場面に過去の回想を差し挟み、紺色の糸などの具体的な物を通して人物の心情を間接的に表している","会話文を多く用い、人物が自分の気持ちを言葉ではっきり説明することで心情を伝えている","三人称の視点から、「私」と母の内面を交互に詳しく描き分けている","比喩をいっさい用いず、出来事を時間の順に淡々と記録している"],"e":"片づけの場面の途中に、ゼッケンを縫ってもらった回想が入り、紺色の糸や裁縫箱の重さといった物を通して気持ちが表されています。会話は短く、母は「何も言わずに」行動しているので、言葉で気持ちを説明するとは言えません。語り手は「私」なので一人称です。「眠っていたかのように」という比喩も使われています。","m":"小説の表現問題は視点・比喩・回想を確認"},{"id":17,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・傍線部説明（言葉を選ぶこと）","p":"手紙を書くとき、私はよく一つの言葉の前で立ち止まる。たとえば礼状に「うれしく思いました」と書くか、「ありがたく思いました」と書くか。どちらでも意味は通じる。しかし、その二つの言葉のあいだには、自分の気持ちのどこに光を当てるかという小さな、しかし確かな違いがある。前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる。\n若いころは、この迷いを時間の無駄だと思っていた。気持ちさえあれば、言葉はなんでもよい、と。けれども年を重ねるにつれて、①言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだと思うようになった。どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくるからである。\n［　Ｅ　］、言葉を選ぶのに時間をかけすぎると、手紙は出しそびれてしまう。結局、迷った末に選んだ一語が最善だったかどうかは、いつまでたっても分からない。それでも、迷ったという事実は、文面のどこかに残るような気がしている。②受け取った人がそれに気づくことはおそらくない。それでかまわないのだと、近ごろは思っている。","q":"次の文章の傍線部①「言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだ」とはどういうことか。最も適切なものを選びなさい。","c":["ふさわしい言葉を考える過程で、自分が本当は何に心を動かされたのかがはっきりしてくるということ","美しい言葉を選んで書けば、気持ちが多少足りなくても相手には十分に伝わるということ","気持ちさえあれば、どのような言葉を使っても相手には正しく伝わるということ","言葉を選ぶときには、相手に失礼のないよう形式を整えることが何より大切だということ"],"e":"直後に「どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくる」と理由が書かれています。これが「見きわめる」の中身です。美しい言葉で気持ちの不足を補うのは「飾る」ことで、筆者が否定している側です。「言葉はなんでもよい」は若いころの考えです。形式を整えることは話題にしていません。","m":"「AではなくB」はBの説明を直後から探す"},{"id":18,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・空所補充（接続語）","p":"手紙を書くとき、私はよく一つの言葉の前で立ち止まる。たとえば礼状に「うれしく思いました」と書くか、「ありがたく思いました」と書くか。どちらでも意味は通じる。しかし、その二つの言葉のあいだには、自分の気持ちのどこに光を当てるかという小さな、しかし確かな違いがある。前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる。\n若いころは、この迷いを時間の無駄だと思っていた。気持ちさえあれば、言葉はなんでもよい、と。けれども年を重ねるにつれて、①言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだと思うようになった。どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくるからである。\n［　Ｅ　］、言葉を選ぶのに時間をかけすぎると、手紙は出しそびれてしまう。結局、迷った末に選んだ一語が最善だったかどうかは、いつまでたっても分からない。それでも、迷ったという事実は、文面のどこかに残るような気がしている。②受け取った人がそれに気づくことはおそらくない。それでかまわないのだと、近ごろは思っている。","q":"次の文章の空所［　Ｅ　］に入る語として、最も適切なものを選びなさい。","c":["もっとも","したがって","すなわち","たとえば"],"e":"前の段落では言葉を選ぶことの意義を述べ、空所の後では「時間をかけすぎると手紙は出しそびれてしまう」と、その考えに対する例外や留保を付け加えています。前の内容を認めつつ補足的に制限を加える「もっとも」が適切です。「したがって」は前の内容から当然の結論を導く語、「すなわち」は言いかえ、「たとえば」は具体例を示す語なので、いずれも文脈に合いません。","m":"前を認めつつ但し書き→「もっとも」"},{"id":19,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・内容理解（二つの言葉の違い）","p":"手紙を書くとき、私はよく一つの言葉の前で立ち止まる。たとえば礼状に「うれしく思いました」と書くか、「ありがたく思いました」と書くか。どちらでも意味は通じる。しかし、その二つの言葉のあいだには、自分の気持ちのどこに光を当てるかという小さな、しかし確かな違いがある。前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる。\n若いころは、この迷いを時間の無駄だと思っていた。気持ちさえあれば、言葉はなんでもよい、と。けれども年を重ねるにつれて、①言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだと思うようになった。どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくるからである。\n［　Ｅ　］、言葉を選ぶのに時間をかけすぎると、手紙は出しそびれてしまう。結局、迷った末に選んだ一語が最善だったかどうかは、いつまでたっても分からない。それでも、迷ったという事実は、文面のどこかに残るような気がしている。②受け取った人がそれに気づくことはおそらくない。それでかまわないのだと、近ごろは思っている。","q":"次の文章で、筆者は「うれしく思いました」と「ありがたく思いました」の違いをどのように説明しているか。最も適切なものを選びなさい。","c":["前者は自分の心が弾んだことを伝え、後者は相手の厚意に感謝し敬う気持ちを表す","前者は目上の人に、後者は親しい友人に対して使うべき言葉である","前者は礼状にふさわしいが、後者は礼状には使うべきではない言葉である","二つの言葉の意味はまったく同じで、違いは文字の数だけである"],"e":"第一段落に「前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる」とあります。「頭を下げる」は、相手への感謝やへりくだる気持ちのたとえです。相手による使い分けや、礼状に使えるかどうかの区別は書かれていません。また「小さな、しかし確かな違いがある」と述べているので、まったく同じだという説明は誤りです。","m":"「前者」「後者」が何を指すか確認"},{"id":20,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・筆者の考え（伝わらなくてもよい）","p":"手紙を書くとき、私はよく一つの言葉の前で立ち止まる。たとえば礼状に「うれしく思いました」と書くか、「ありがたく思いました」と書くか。どちらでも意味は通じる。しかし、その二つの言葉のあいだには、自分の気持ちのどこに光を当てるかという小さな、しかし確かな違いがある。前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる。\n若いころは、この迷いを時間の無駄だと思っていた。気持ちさえあれば、言葉はなんでもよい、と。けれども年を重ねるにつれて、①言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだと思うようになった。どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくるからである。\n［　Ｅ　］、言葉を選ぶのに時間をかけすぎると、手紙は出しそびれてしまう。結局、迷った末に選んだ一語が最善だったかどうかは、いつまでたっても分からない。それでも、迷ったという事実は、文面のどこかに残るような気がしている。②受け取った人がそれに気づくことはおそらくない。それでかまわないのだと、近ごろは思っている。","q":"次の文章の傍線部②「受け取った人がそれに気づくことはおそらくない。それでかまわないのだ」から読み取れる筆者の考えとして、最も適切なものを選びなさい。","c":["言葉を迷って選んだことが相手に伝わらなくても、その過程自体に自分にとっての意味があると考えている","どうせ相手には伝わらないのだから、言葉を選ぶのに時間をかけるのはやめるべきだと考えている","相手が気づかないのは読む力が足りないからであり、それはしかたのないことだとあきらめている","手紙は形だけのものなので、内容を真剣に考える必要はないと考えている"],"e":"筆者は、言葉を選ぶことで自分の気持ちを見きわめられると述べ、迷った事実は文面のどこかに残ると感じています。相手が気づかなくても「かまわない」のは、迷う過程そのものに意義を認めているからです。時間をかけるのをやめるべきだ、という考えは若いころのものです。相手の読む力を責める記述や、手紙を形だけとする考えは本文にありません。","m":"随筆の結びは筆者の価値観のまとめ"},{"id":21,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情の理由（ひやりとする）","p":"対局が終わると、部室はしんと静まり返った。盤の上では、私の王将が、一年生の駒にぐるりと取り囲まれている。「負けました」と頭を下げると、向かいの佐伯は、困ったような顔で小さく礼を返した。\n佐伯が入部してきたのは春のことだ。駒の並べ方もおぼつかない彼に、定跡を一から教えたのは私だった。それがいまでは、私の得意な戦法の弱点を、私以上に正確に突いてくる。\n「先輩、ここで角を引かれていたら、たぶん僕が負けてました」\n佐伯は駒を一つ戻して、局面をさかのぼってみせた。その声には、勝ち誇る調子は少しもなかった。それがかえって、①胸の奥をひやりとさせた。彼はもう、私の見えていないところまで見えているのだ。\n私は黙って盤を見つめた。悔しさがないと言えばうそになる。けれども、彼の指先が示した一手を見ているうちに、悔しさとは別の、もっと静かな感情がゆっくりと広がってきた。あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていたのだった。\n「もう一局、お願いできるか」\nそう言った自分の声が、思いのほか明るいことに、②私は少し驚いた。","q":"次の文章の傍線部①「胸の奥をひやりとさせた」のはなぜか。最も適切なものを選びなさい。","c":["勝ち誇らずに冷静に局面を振り返る佐伯の様子から、彼が自分には見えていない先まで読んでいることを思い知らされたから","佐伯が先輩である自分をばかにしているように感じられ、強い怒りがこみ上げてきたから","佐伯が自分の指し手の誤りを部員の前で指摘し、恥をかかされたと感じたから","佐伯が実力を隠していたことに気づき、だまされていたと感じたから"],"e":"傍線部の直前に「勝ち誇る調子は少しもなかった」、直後に「彼はもう、私の見えていないところまで見えているのだ」とあります。後輩が淡々と敗因を示したことで、かえって実力の差がはっきり感じられたのです。佐伯は「困ったような顔」をしており、ばかにする様子はありません。部員の前での指摘や、実力を隠していたという描写もありません。","m":"傍線部の前後の文で理由をはさむ"},{"id":22,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情把握（静かな感情）","p":"対局が終わると、部室はしんと静まり返った。盤の上では、私の王将が、一年生の駒にぐるりと取り囲まれている。「負けました」と頭を下げると、向かいの佐伯は、困ったような顔で小さく礼を返した。\n佐伯が入部してきたのは春のことだ。駒の並べ方もおぼつかない彼に、定跡を一から教えたのは私だった。それがいまでは、私の得意な戦法の弱点を、私以上に正確に突いてくる。\n「先輩、ここで角を引かれていたら、たぶん僕が負けてました」\n佐伯は駒を一つ戻して、局面をさかのぼってみせた。その声には、勝ち誇る調子は少しもなかった。それがかえって、①胸の奥をひやりとさせた。彼はもう、私の見えていないところまで見えているのだ。\n私は黙って盤を見つめた。悔しさがないと言えばうそになる。けれども、彼の指先が示した一手を見ているうちに、悔しさとは別の、もっと静かな感情がゆっくりと広がってきた。あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていたのだった。\n「もう一局、お願いできるか」\nそう言った自分の声が、思いのほか明るいことに、②私は少し驚いた。","q":"次の文章の「悔しさとは別の、もっと静かな感情」の説明として、最も適切なものを選びなさい。","c":["自分が教えたことの先へと後輩が成長していったことを認め、受け入れようとする気持ち","後輩に負けた以上、もう将棋を続ける意味はないというあきらめの気持ち","何としても佐伯を打ち負かし、先輩としての面目を取り戻そうとする焦りの気持ち","佐伯に定跡を教えなければよかったという、自分の行動を悔やむ気持ち"],"e":"直後に「あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていた」とあり、自分が教えたものを土台に後輩がさらに先へ進んだことに気づいています。最後に明るく「もう一局」と言っていることから、あきらめや後悔ではなく、成長を認める穏やかな気持ちと考えられます。「焦り」は「静かな感情」という表現と合いません。","m":"「静かな」という形容から激しい感情を除く"},{"id":23,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情の理由（自分の声に驚く）","p":"対局が終わると、部室はしんと静まり返った。盤の上では、私の王将が、一年生の駒にぐるりと取り囲まれている。「負けました」と頭を下げると、向かいの佐伯は、困ったような顔で小さく礼を返した。\n佐伯が入部してきたのは春のことだ。駒の並べ方もおぼつかない彼に、定跡を一から教えたのは私だった。それがいまでは、私の得意な戦法の弱点を、私以上に正確に突いてくる。\n「先輩、ここで角を引かれていたら、たぶん僕が負けてました」\n佐伯は駒を一つ戻して、局面をさかのぼってみせた。その声には、勝ち誇る調子は少しもなかった。それがかえって、①胸の奥をひやりとさせた。彼はもう、私の見えていないところまで見えているのだ。\n私は黙って盤を見つめた。悔しさがないと言えばうそになる。けれども、彼の指先が示した一手を見ているうちに、悔しさとは別の、もっと静かな感情がゆっくりと広がってきた。あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていたのだった。\n「もう一局、お願いできるか」\nそう言った自分の声が、思いのほか明るいことに、②私は少し驚いた。","q":"次の文章の傍線部②で「私」が「少し驚いた」のはなぜか。最も適切なものを選びなさい。","c":["負けた直後で沈んでいるはずだと思っていたのに、後輩の成長を前向きに受け止め、もう一度指したいという気持ちが素直に声に出ていたから","部室が静まり返っていたため、自分の声が予想以上に大きく響いてしまったから","佐伯がもう一局を断るだろうと思っていたのに、すぐに承知してくれたから","負けたことがまったく悔しくない自分に気づき、将棋への情熱が冷めたと感じたから"],"e":"「思いのほか明るい」とあるので、本人は負けて落ちこんだ声になると思っていたことが分かります。静かな感情が広がった後の「もう一局」は、後輩の成長を受け入れて前向きになった気持ちの表れです。声の大きさの話ではなく、佐伯の返事も書かれていません。また本文に「悔しさがないと言えばうそになる」とあるので、まったく悔しくないという説明は誤りです。","m":"「思いのほか」＝予想とのずれに注目"},{"id":24,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・表現の特徴（一人称の語り）","p":"対局が終わると、部室はしんと静まり返った。盤の上では、私の王将が、一年生の駒にぐるりと取り囲まれている。「負けました」と頭を下げると、向かいの佐伯は、困ったような顔で小さく礼を返した。\n佐伯が入部してきたのは春のことだ。駒の並べ方もおぼつかない彼に、定跡を一から教えたのは私だった。それがいまでは、私の得意な戦法の弱点を、私以上に正確に突いてくる。\n「先輩、ここで角を引かれていたら、たぶん僕が負けてました」\n佐伯は駒を一つ戻して、局面をさかのぼってみせた。その声には、勝ち誇る調子は少しもなかった。それがかえって、①胸の奥をひやりとさせた。彼はもう、私の見えていないところまで見えているのだ。\n私は黙って盤を見つめた。悔しさがないと言えばうそになる。けれども、彼の指先が示した一手を見ているうちに、悔しさとは別の、もっと静かな感情がゆっくりと広がってきた。あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていたのだった。\n「もう一局、お願いできるか」\nそう言った自分の声が、思いのほか明るいことに、②私は少し驚いた。","q":"次の文章の表現の特徴として、最も適切なものを選びなさい。","c":["一人称の語り手「私」の視点から、対局後の出来事と心情の移り変わりが順を追って描かれている","佐伯の内面が地の文で詳しく語られ、二人の心情が交互に描き分けられている","全体が過去の回想だけで構成され、現在の場面はまったく描かれていない","擬音語や擬態語を多用して、対局の激しさをにぎやかに表現している"],"e":"語り手は「私」で、負けた直後のひやりとした感覚、悔しさ、静かな感情、明るい声への驚きという変化が、時間の流れに沿って描かれています。佐伯の内面は会話と表情からしか分からず、地の文では語られていません。春の回想は短く差し挟まれるだけで、中心は対局後の場面です。擬態語は「しんと」「ぐるりと」程度で、にぎやかな表現ではありません。","m":"視点人物の内面だけが直接描かれる"},{"id":25,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（承）","q":"次の文のカタカナ部分「ショウ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「伝統の技をケイショウする」","c":["申し出をリョウショウする","書類の内容をショウカイする","業者とコウショウする","努力をショウサンする"],"e":"ケイショウは「継承（受け継ぐこと）」で、「ショウ」は「承」です。同じ字を含むのは「了承（リョウショウ）」です。「照会（ショウカイ）」は問い合わせることで「照」、「交渉（コウショウ）」は話し合うことで「渉」、「称賛（ショウサン）」はほめることで「称」です。同じ音の字が多いので、熟語の意味から字を決めることが大切です。","m":"承＝うけたまわる（継承・了承・承認）"},{"id":26,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（糾）","q":"次の文のカタカナ部分「キュウ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「議論がフンキュウする」","c":["不正をキュウダンする","フキュウの名作","キュウキョクの選択","鉄道のフッキュウ工事"],"e":"フンキュウは「紛糾（もつれて乱れること）」で、「キュウ」は「糾」です。同じ字を含むのは、罪や責任を問いただして非難する「糾弾（キュウダン）」です。「不朽（フキュウ）」は価値が長く失われないことで「朽」、「究極（キュウキョク）」は「究」、「復旧（フッキュウ）」は元どおりに直すことで「旧」です。","m":"糾＝より合わせる・ただす（紛糾・糾弾）"},{"id":27,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（換）","q":"次の文のカタカナ部分「カン」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「カンゲンすれば、問題は費用ではなく時間にある」","c":["窓を開けてカンキする","サークルにカンユウする","カンダイな処置をとる","名画をカンショウする"],"e":"カンゲンは「換言（ほかの言葉で言いかえること）」で、「カン」は「換」です。同じ字を含むのは「換気（カンキ）」です。「勧誘（カンユウ）」は誘うことで「勧」、「寛大（カンダイ）」は心が広いことで「寛」、「鑑賞（カンショウ）」は芸術を味わうことで「鑑」です。評論では「換言すれば」が言いかえの合図としてよく使われます。","m":"換＝とりかえる（換言・換気・交換）"},{"id":28,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（範）","q":"次の文のカタカナ部分「ハン」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「社会のキハンに従う」","c":["後輩のモハンとなる","商売がハンエイする","ハンザツな手続き","規則にイハンする"],"e":"キハンは「規範（行動や判断のよりどころとなる決まり）」で、「ハン」は「範」です。同じ字を含むのは「模範（モハン）」です。「繁栄（ハンエイ）」は「繁」、「煩雑（ハンザツ）」は込み入って面倒なことで「煩」、「違反（イハン）」は「反」です。「規範」と「模範」はどちらも「手本・決まり」の意味でつながっています。","m":"範＝手本・のり（規範・模範・範囲）"},{"id":29,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（顕）","q":"次の文のカタカナ部分「ケン」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「両者の違いはケンチョである」","c":["ケンビキョウで観察する","ケンキョな態度","自動車のホケンに入る","ケンジツな経営"],"e":"ケンチョは「顕著（はっきりと目立つこと）」で、「ケン」は「顕」です。同じ字を含むのは「顕微鏡（ケンビキョウ）」です。「謙虚（ケンキョ）」はへりくだることで「謙」、「保険（ホケン）」は「険」、「堅実（ケンジツ）」は確かで危なげないことで「堅」です。「顕」は「あらわれる・あきらか」の意味をもちます。","m":"顕＝あらわ（顕著・顕微鏡・顕在）"},{"id":30,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（容）","q":"次の文のカタカナ部分「ヨウ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「異なる意見にもカンヨウである」","c":["手紙のナイヨウ","心がドウヨウする","人材をヨウセイする","ヨウチな考え方"],"e":"カンヨウは「寛容（心が広く、他を受け入れること）」で、「ヨウ」は「容」です。同じ字を含むのは「内容（ナイヨウ）」です。「動揺（ドウヨウ）」は「揺」、「養成（ヨウセイ）」は「養」、「幼稚（ヨウチ）」は考えや行動が子どもっぽいことで「幼」です。「容」は「入れる・受け入れる」の意味をもちます。","m":"容＝いれる（寛容・内容・許容）"},{"id":31,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（恣意的）","q":"「恣意的」という語の意味として、最も適切なものを選びなさい。","c":["はっきりした根拠がなく、その時々の思いつきや自分の都合で判断するさま","多くの人の意見を取り入れて、公平に判断するさま","細かな点まで注意を払い、慎重に判断するさま","感情を表に出さず、冷静に物事を見るさま"],"e":"「恣」は「ほしいまま」と読み、気ままにふるまうことを表します。「恣意的」は、客観的な根拠や一定の基準によらず、自分の考えや都合で勝手に決めるさまを言います。評論では「恣意的な線引き」のように、根拠のなさを批判する文脈で使われます。公平、慎重、冷静といった選択肢は、むしろ反対の性質です。","m":"恣＝ほしいまま→勝手気まま"},{"id":32,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（相対化）","q":"「相対化する」という語の意味として、最も適切なものを選びなさい。","c":["絶対的なものと見なされていたものを、他との関係や比較の中に置き直してとらえること","二つのものを向かい合わせて、どちらが正しいかを決めること","あいまいだったものに、唯一の正しい基準を与えること","異なる意見を一つにまとめて、対立をなくすこと"],"e":"「相対」は他との関係で成り立つことで、反対語は「絶対」です。「相対化する」は、当たり前・唯一と思われていた考えや価値を、ほかの可能性と比べられるものとして見直すことです。評論で「近代の価値観を相対化する」のように使われます。唯一の基準を与えるのは「絶対化」に近く、正しさを決めることや意見をまとめることとは違います。","m":"相対化＝「唯一」を「数ある一つ」に"},{"id":33,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"慣用句（枚挙にいとまがない）","q":"「枚挙にいとまがない」の意味として、最も適切なものを選びなさい。","c":["数えきれないほど多い","忙しくて休む時間がない","一つ一つ取り上げる価値がない","急いで数えなければならない"],"e":"「枚挙」は一つ一つ数え上げること、「いとま（暇）」はひまのことです。「数え上げるひまがない」から、数えきれないほどたくさんあることを表します。「このような例は枚挙にいとまがない」のように使います。「いとまがない」から「忙しい」と取り違えやすいので注意しましょう。価値がない、急いで数える、という意味はありません。","m":"枚挙＝数え上げる→数えきれないほど多い"},{"id":34,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"四字熟語（付和雷同）","q":"「付和雷同」の意味として、最も適切なものを選びなさい。","c":["自分の考えをもたず、むやみに他人の意見に同調すること","大勢の人が心を一つにして、力を合わせること","激しい勢いで周囲の反対を押し切ること","互いに意見を出し合って、よりよい結論を導くこと"],"e":"「付和」は他人の意見にたやすく従うこと、「雷同」は雷が鳴ると万物がそれに応じて響くように、むやみに他に同調することです。主体性のなさを批判する語です。力を合わせることは「一致団結」、勢いで押し切ることは「強行」などで表します。意見を出し合うことは肯定的な内容で、この語の否定的な意味と合いません。","m":"雷が鳴ると一斉に響く＝むやみに同調"},{"id":35,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（おもむろに）","q":"「彼はおもむろに立ち上がった」の「おもむろに」の意味として、最も適切なものを選びなさい。","c":["ゆっくりと落ち着いて","突然、思いがけなく","あわてて急いで","こっそりと人目を避けて"],"e":"「おもむろに（徐に）」は、動作が静かでゆっくりしているさまを表します。漢字の「徐」は「徐行」の「徐」で、ゆっくりの意味です。現代では「不意に・突然」の意味だと誤解されることが多いのですが、本来の意味とは逆です。あわてる様子やこっそりする様子を表す語でもありません。","m":"徐（おもむろ）＝徐行のゆっくり"},{"id":36,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（敷衍）","q":"「筆者は自らの主張を具体例によって敷衍している」の「敷衍」の意味として、最も適切なものを選びなさい。","c":["意味や趣旨をおし広げて、詳しく説明すること","前に述べたことを取り消すこと","要点だけを短くまとめること","他人の説を批判して退けること"],"e":"「敷衍（ふえん）」は、「敷く（広げる）」と「衍（のばす）」からなり、ある考えの趣旨をおし広げ、例などを加えて詳しく説明することです。要点を短くまとめるのは「要約」で、敷衍とは反対の方向です。取り消すことは「撤回」、批判して退けることは「論駁・反駁」などと言います。","m":"敷衍＝広げて詳しく（↔要約）"},{"id":37,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"「なむ」の識別（係助詞）","q":"次は『竹取物語』（群書類従本）の一節です。傍線部「なむ」の文法的説明として、最も適切なものを選びなさい。\n「名をばさぬきの宮つことなむいひける。」","c":["強意の係助詞","他に対する願望を表す終助詞","完了の助動詞「ぬ」の未然形＋推量の助動詞「む」","ナ行変格活用動詞の活用語尾＋推量の助動詞「む」"],"e":"この「なむ」は格助詞「と」に付いており、文末の「ける」（過去の助動詞「けり」の連体形）と係り結びをつくっているので、強意の係助詞です。願望の終助詞「なむ」は未然形に付き、文末に置かれます。「ぬ」＋「む」は連用形に付きます。ナ変動詞は「死ぬ・往（い）ぬ」だけです。「名を、さぬきのみやつこといった」という意味です。","m":"体言・助詞に付いて文末連体形→係助詞"},{"id":38,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"「ぬ」の識別（完了）","q":"次の和歌（『古今和歌集』藤原敏行）の傍線部「ぬ」の文法的説明として、最も適切なものを選びなさい。（本文は国際日本文化研究センター「和歌データベース」による。濁点を補った）\n「あききぬとめにはさやかに見えねども風のおとにぞおどろかれぬる」（傍線部は「あききぬ」の「ぬ」）","c":["完了の助動詞「ぬ」の終止形","打消の助動詞「ず」の連体形","打消の助動詞「ず」の終止形","ナ行変格活用動詞の活用語尾"],"e":"「き」はカ変動詞「来（く）」の連用形です（「秋来ぬ」と書けば「あききぬ」と読みます）。連用形に付く「ぬ」は完了の助動詞で、下に引用の「と」が続くので終止形です。「秋が来たと」という意味になります。打消の「ず」の連体形「ぬ」なら未然形「こ」に付き、「こぬ」と読みます。打消の「ず」の終止形は「ず」です。ナ変動詞は「死ぬ・往ぬ」だけです。","m":"連用形＋ぬ＝完了／未然形＋ぬ＝打消"},{"id":39,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「る」の意味（自発）","q":"次の和歌（『古今和歌集』藤原敏行）の傍線部「れ」の意味として、最も適切なものを選びなさい。（本文は国際日本文化研究センター「和歌データベース」による。濁点を補った）\n「あききぬとめにはさやかに見えねども風のおとにぞおどろかれぬる」（傍線部は「おどろかれ」の「れ」）","c":["自発","受身","可能","尊敬"],"e":"「る・らる」は、心の動きや知覚を表す動詞（思ふ・しのぶ・ながむ・おどろく など）に付くと自発の意味になりやすいです。ここでの「おどろく」は「はっと気づく」の意味で、「風の音で自然とはっと気づかされた」という歌です。受身なら「〜に…される」相手が必要ですが、風の音は気づかせる働きかけの主体ではありません。可能や尊敬では歌意が通りません。","m":"心情・知覚動詞＋る・らる＝自発"},{"id":40,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"係り結び（ぞ→連体形）","q":"次の和歌（『古今和歌集』藤原敏行）で、末尾が「おどろかれぬる」と連体形で結ばれている理由として、最も適切なものを選びなさい。（本文は国際日本文化研究センター「和歌データベース」による。濁点を補った）\n「あききぬとめにはさやかに見えねども風のおとにぞおどろかれぬる」","c":["上にある係助詞「ぞ」と係り結びをつくっているから","上にある係助詞「こそ」の結びだから","直後に体言「秋」が省略されているから","疑問の副詞「いかに」と呼応しているから"],"e":"「風のおとにぞ」の「ぞ」は強意の係助詞で、文末を連体形で結びます。そのため完了の助動詞「ぬ」が連体形「ぬる」になっています。「ぞ・なむ・や・か」は連体形、「こそ」は已然形で結ぶのが原則です。この歌に「こそ」や「いかに」はなく、体言の省略として読む根拠もありません。","m":"ぞ・なむ・や・か→連体、こそ→已然"},{"id":41,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「らむ」の意味（原因推量）","q":"次の和歌（『古今和歌集』紀友則）の傍線部「らむ」の意味として、最も適切なものを選びなさい。（本文は国際日本文化研究センター「和歌データベース」による。濁点を補った）\n「久方のひかりのどけき春の日にしづ心なく花のちるらむ」","c":["現在の原因推量（どうして〜しているのだろう）","過去の推量（〜しただろう）","完了の助動詞「り」の未然形＋推量の助動詞「む」","伝聞・婉曲（〜とかいう・〜ような）"],"e":"「らむ」は終止形（ラ変型は連体形）に付く現在推量の助動詞です。この歌では、目の前で花が散っている事実について、「光がのどかな春の日に、どうして落ち着いた心もなく花は散っているのだろう」と、その原因を推し量っています。過去の推量は「けむ」です。「り」はサ変の未然形・四段の已然形（「散れ」）に付くので、「ちる」に付いた「らむ」をそう分けることはできません。伝聞・婉曲は「らむ」の用法の一つですが、人から聞いたことや遠回しな言い方を表し、多く文中の連体形で使われるので、この歌には合いません。","m":"目の前の事実の理由を推す→原因推量"},{"id":42,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「じ」の意味（打消意志）","q":"次は『伊勢物語』（群書類従本、東下りの段）の一節です。傍線部「じ」の意味として、最も適切なものを選びなさい。\n「そのおとこ。身はようなきものに思ひなして。京にはをらじ。あづまのかたにすむべき所もとめにとてゆきけり。」（傍線部は「をらじ」の「じ」）","c":["打消意志","打消推量","打消当然","禁止"],"e":"「じ」は打消推量と打消意志の意味をもち、主語が一人称（話し手・書き手自身）のときは打消意志になりやすいです。ここは、男が自分を役に立たない者と思い込み、「京にはをらじ（京にはいるまい）」と自分の意志で決めている場面なので打消意志です。打消推量は三人称の事柄に多く使われます。打消当然や禁止は「まじ」の主な意味です。","m":"主語が自分→じ＝打消意志「〜まい」"},{"id":43,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「べし」の意味（可能）","q":"次は『方丈記』（元暦の大地震）の一節です。傍線部「べから」の意味として、最も適切なものを選びなさい。\n「羽なければ空へもあがるべからず。龍ならねば雲にのぼらむこと難し。」（傍線部は「あがるべからず」の「べから」）","c":["可能","推量","意志","当然"],"e":"「べし」は推量・意志・可能・当然・命令・適当などの意味をもちます。下に打消の「ず」が付いた「べからず」は可能の意味になることが多く、ここも「羽がないので、空へ上がることもできない」と、大地震の中で逃げ場のない人々の様子を述べています。次の文の「雲にのぼらむこと難し（雲に上ることは難しい）」とも対応しています。推量「上がらないだろう」、意志「上がるつもりはない」、当然「上がるべきではない」では文意が通りません。","m":"べし＋打消は可能「〜できない」が多い"},{"id":44,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"接続助詞「ば」（已然形＋ば）","q":"次は『方丈記』（元暦の大地震）の一節です。傍線部「なければ」の意味として、最も適切なものを選びなさい。\n「羽なければ空へもあがるべからず。龍ならねば雲にのぼらむこと難し。」（傍線部は「羽なければ」の「なければ」）","c":["羽がないので","羽がないならば","羽がないけれども","羽がないかどうか"],"e":"接続助詞「ば」は、未然形に付くと仮定条件（もし〜ならば）、已然形に付くと確定条件（〜ので・〜と）を表します。「なけれ」は形容詞「なし」の已然形なので、ここは確定条件で、「羽がないので」と原因・理由を表します。「ないならば」は未然形「なくは（なくば）」の場合です。「けれども」は逆接の「ど・ども」の訳です。","m":"未然形＋ば＝仮定、已然形＋ば＝確定"},{"id":45,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（うつくし）","q":"次は『竹取物語』（群書類従本）の一節です。傍線部「うつくしう」の意味として、最も適切なものを選びなさい。\n「それを見れば三寸ばかりなる人いとうつくしうてゐたり。」","c":["かわいらしい様子で","きれいに着飾った様子で","立派で堂々とした様子で","かわいそうな様子で"],"e":"古語の「うつくし」は、小さいものや幼いものに対して「かわいらしい・いとしい」と感じる気持ちを表すのが基本です。ここも、竹の中にいた三寸（約九センチ）ほどの小さな人の様子を「とてもかわいらしい様子で座っていた」と述べています。現代語の「美しい（きれい）」とは意味の中心が違います。「かわいそう」は「いとほし」などに当たります。","m":"うつくし＝小さいものがかわいい"},{"id":46,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（ゆかし）","q":"次は『徒然草』第五十二段の一節です。傍線部「ゆかしかり」の意味として、最も適切なものを選びなさい。\n「何事かありけむ、ゆかしかりしかど、神へまゐるこそ本意なれと思ひて、山までは見ず。」","c":["知りたい","奥ゆかしく上品だ","なつかしい","わずらわしい"],"e":"「ゆかし」は「行く」と関係のある語で、心がそちらへ引かれる、つまり「見たい・聞きたい・知りたい」という気持ちを表します。ここは仁和寺の法師が、参拝者が山へ登っていくのを見て「何があったのだろうか、知りたかったけれど」と思う場面です。現代語の「奥ゆかしい」の意味や、「なつかしい」「わずらわしい」の意味ではありません。","m":"ゆかし＝心が行く→見たい・知りたい"},{"id":47,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（ありがたし）","q":"次は『枕草子』の一節です。傍線部「ありがたき」の意味として、最も適切なものを選びなさい。\n「ありがたきもの　しうとに譽めらるゝむこ、又しうとめに思はるゝ嫁の君、……」","c":["めったにない","感謝したくなる","尊くおそれ多い","ありふれている"],"e":"古語の「ありがたし」は「有り難し」、つまり「存在することが難しい」から、「めったにない・珍しい」という意味が基本です。ここは「めったにないもの。妻の父にほめられる婿、また妻の母にかわいがられる嫁」と、珍しいものを挙げる章段です。現代語の「感謝したい」の意味は、めったにない好意を受けたことから後に生まれた意味です。「ありふれている」は正反対です。","m":"有り難し＝あるのが難しい→めったにない"},{"id":48,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「す」の意味（尊敬）","q":"次は『宇治拾遺物語』「児のかい餅するにそらねいりしたる事」（児のそら寝）の一節で、僧が寝ている児に呼びかける言葉です。傍線部「せ」の文法的説明として、最も適切なものを選びなさい。\n「物申さぶらはんおどろかせ給へ」（傍線部は「おどろかせ」の「せ」）","c":["尊敬の助動詞「す」の連用形","使役の助動詞「す」の連用形","サ行変格活用動詞「す」の未然形","過去の助動詞「き」の未然形"],"e":"「おどろか」は四段動詞「おどろく（目を覚ます）」の未然形で、そこに助動詞「す」の連用形「せ」が付き、さらに尊敬の補助動詞「給ふ」が続いています。「せ給ふ」の形では、「せ」は尊敬の意味になることが多く、ここも「お目覚めください」と児を敬って呼びかけています。誰かに起こさせるわけではないので使役ではありません。動詞「す」や過去「き」の未然形「せ」は、この位置に来ません。","m":"「せたまふ」の「せ」は多くの場合尊敬"},{"id":49,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・語句解釈（心寄せに）","p":"これも今はむかし。比叡の山にちごありけり。僧だちよひのつれづれにいざかひもちいせんといひけるを。このちご心よせにきゝけり。さりとてしいださんをまちてねざらんもわろかりなんと思て。かたがたによりてねたるよしにて出くるを待けるに。すでにしいだしたるさまにてひしめきあひたり。このちごさだめておどろかさんずらんとまちゐたるに。僧の物申さぶらはんおどろかせ給へといふを。うれしとはおもへども。たゞ一どにいらへんも。待けるかともぞおもふとて。いま一こゑよばれていらへんと念じてねたるほどに。や。なおこしたてまつりそ。おさなき人はね入給にけりといふこゑのしければ。あなわびしと思て。いま一どおこせかしとおもひねにきけば。ひしひしとたゞくひにくふをとのしければ。すべなくてむごの後にえいといらへたりければ。僧達わらふことかぎりなし。\n（『宇治拾遺物語』巻一「兒のかい餅するにそらねいりしたる事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章の「このちご心よせにきゝけり」の意味として、最も適切なものを選びなさい。","c":["この児は、期待して心待ちにしながら聞いていた","この児は、気にもとめずに聞き流していた","この児は、僧たちを気の毒に思いながら聞いていた","この児は、うるさく思って腹を立てながら聞いていた"],"e":"「心寄せ」は、心をそちらに寄せること、つまり期待することです。僧たちが「いざかひもちいせん（さあ、ぼたもちを作ろう）」と言うのを聞いて、児は食べられるのを楽しみにしていたのです。その後、できあがるのを寝たふりをして待つという行動からも、期待していたことが分かります。聞き流す、気の毒に思う、腹を立てるという内容は、後の行動と合いません。","m":"心寄せ＝心を寄せる→期待する"},{"id":50,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・理由説明（すぐに返事しない）","p":"これも今はむかし。比叡の山にちごありけり。僧だちよひのつれづれにいざかひもちいせんといひけるを。このちご心よせにきゝけり。さりとてしいださんをまちてねざらんもわろかりなんと思て。かたがたによりてねたるよしにて出くるを待けるに。すでにしいだしたるさまにてひしめきあひたり。このちごさだめておどろかさんずらんとまちゐたるに。僧の物申さぶらはんおどろかせ給へといふを。うれしとはおもへども。たゞ一どにいらへんも。待けるかともぞおもふとて。いま一こゑよばれていらへんと念じてねたるほどに。や。なおこしたてまつりそ。おさなき人はね入給にけりといふこゑのしければ。あなわびしと思て。いま一どおこせかしとおもひねにきけば。ひしひしとたゞくひにくふをとのしければ。すべなくてむごの後にえいといらへたりければ。僧達わらふことかぎりなし。\n（『宇治拾遺物語』巻一「兒のかい餅するにそらねいりしたる事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章で、僧に起こされたとき、児がすぐに返事をしなかったのはなぜか。最も適切なものを選びなさい。","c":["一度呼ばれただけで返事をすると、ぼたもちを待って起きていたと思われるのがきまり悪かったから","本当にぐっすり眠っていて、僧の呼ぶ声がまったく聞こえていなかったから","僧たちのぼたもちの作り方が気に入らず、食べたくないと思ったから","僧たちを驚かせるために、わざと寝たふりを続けようと考えたから"],"e":"本文に「たゞ一どにいらへんも。待けるかともぞおもふとて」とあります。「一回呼ばれただけで返事をするのも、（僧たちが）待っていたのかと思うといけない」と考え、「もう一声呼ばれてから返事をしよう」と我慢していたのです。児は呼びかけを「うれし」と思っているので、聞こえていなかったわけではありません。食べたくない、驚かせたい、という気持ちは書かれていません。","m":"「〜もぞ思ふ」＝〜と思われたら困る"},{"id":51,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・解釈（な〜そ）","p":"これも今はむかし。比叡の山にちごありけり。僧だちよひのつれづれにいざかひもちいせんといひけるを。このちご心よせにきゝけり。さりとてしいださんをまちてねざらんもわろかりなんと思て。かたがたによりてねたるよしにて出くるを待けるに。すでにしいだしたるさまにてひしめきあひたり。このちごさだめておどろかさんずらんとまちゐたるに。僧の物申さぶらはんおどろかせ給へといふを。うれしとはおもへども。たゞ一どにいらへんも。待けるかともぞおもふとて。いま一こゑよばれていらへんと念じてねたるほどに。や。なおこしたてまつりそ。おさなき人はね入給にけりといふこゑのしければ。あなわびしと思て。いま一どおこせかしとおもひねにきけば。ひしひしとたゞくひにくふをとのしければ。すべなくてむごの後にえいといらへたりければ。僧達わらふことかぎりなし。\n（『宇治拾遺物語』巻一「兒のかい餅するにそらねいりしたる事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章の「や。なおこしたてまつりそ」の意味として、最も適切なものを選びなさい。","c":["おい、お起こし申し上げるな","おい、お起こし申し上げよ","おい、お起こしにはならないだろう","おい、起こすことなどできない"],"e":"「な〜そ」は「〜するな」という禁止を表す呼応の形です。「たてまつり」は謙譲の補助動詞で、起こされる相手である児を敬っています。したがって「おい、（児を）お起こし申し上げるな」となります。この言葉を聞いた児は「あなわびし（ああ、困った）」と思っており、起こしてもらえなくなった状況とも合います。「起こせ」という命令や、推量・不可能の意味はありません。","m":"な＋連用形＋そ＝禁止「〜するな」"},{"id":52,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・内容理解（僧たちが笑う）","p":"これも今はむかし。比叡の山にちごありけり。僧だちよひのつれづれにいざかひもちいせんといひけるを。このちご心よせにきゝけり。さりとてしいださんをまちてねざらんもわろかりなんと思て。かたがたによりてねたるよしにて出くるを待けるに。すでにしいだしたるさまにてひしめきあひたり。このちごさだめておどろかさんずらんとまちゐたるに。僧の物申さぶらはんおどろかせ給へといふを。うれしとはおもへども。たゞ一どにいらへんも。待けるかともぞおもふとて。いま一こゑよばれていらへんと念じてねたるほどに。や。なおこしたてまつりそ。おさなき人はね入給にけりといふこゑのしければ。あなわびしと思て。いま一どおこせかしとおもひねにきけば。ひしひしとたゞくひにくふをとのしければ。すべなくてむごの後にえいといらへたりければ。僧達わらふことかぎりなし。\n（『宇治拾遺物語』巻一「兒のかい餅するにそらねいりしたる事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章で、最後に「僧達わらふことかぎりなし」となったのはなぜか。最も適切なものを選びなさい。","c":["寝たふりをしていた児が、ずいぶん時間がたってから返事をしたので、ずっと起きていたことが分かっておかしかったから","児が寝ぼけて意味の分からないことを言ったので、そのとんちんかんな様子がおかしかったから","児がぼたもちを一人でたくさん食べてしまい、僧たちの分がなくなったから","児が僧たちの話し声で目を覚まし、驚いて飛び起きた姿がおかしかったから"],"e":"児は起こしてもらえないまま、僧たちが「ひしひしと」食べる音を聞いて「すべなくて（どうしようもなくて）」、「むごの後に（ずいぶん時間がたってから）」、「えい」と返事をしました。呼ばれてからかなり経った後の返事だったので、寝たふりをしていたことがばれ、僧たちは大笑いしたのです。寝ぼけた言葉、食べ過ぎ、飛び起きた様子は本文にありません。","m":"むご（無期）の後＝ずっと後→そら寝がばれる"},{"id":53,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・理由説明（二つの矢）","p":"ある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度たゞ得失なく、この一箭（や）に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠（けだい）の心、みづから知らずといへども、師これを知る。このいましめ萬事にわたるべし。道を學する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期（ご）せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞたゞ今の一念において、直ちにすることの甚だ難き。\n（『徒然草』第九十二段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章で、師が「初心の人二つの矢を持つことなかれ」と言ったのはなぜか。最も適切なものを選びなさい。","c":["二本目の矢をあてにすると、最初の矢をいいかげんに射る気持ちが生じるから","初心者が二本の矢を持つと、重くて弓をうまく引くことができないから","二本の矢を続けて射るのは、弓の作法として礼儀に反するから","初心者は一本目の矢で必ず的に当てられるので、二本目は不要だから"],"e":"師の言葉の中に「後の矢を頼みて、初めの矢になほざりの心あり」とあります。「なほざり」はいいかげんなことです。二本目があると思うと、一本目をおろそかにする心が生まれるので、一本ごとに「この一矢で決めよう」と思え、と教えているのです。矢の重さや作法については述べていません。初心者が必ず当てられるという内容も本文と合いません。","m":"なほざり（等閑）＝いいかげん"},{"id":54,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・解釈（反語）","p":"ある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度たゞ得失なく、この一箭（や）に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠（けだい）の心、みづから知らずといへども、師これを知る。このいましめ萬事にわたるべし。道を學する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期（ご）せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞたゞ今の一念において、直ちにすることの甚だ難き。\n（『徒然草』第九十二段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の「わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや」の解釈として、最も適切なものを選びなさい。","c":["たった二本の矢なのに、師の前で一本をおろそかにしようと思うだろうか、いや、思いはしない","たった二本の矢しかないので、師の前では一本を大切にとっておこうと思うのだろうか","たった二本の矢でも、師の前では一本を捨てるつもりで射るべきだと思うだろう","たった二本の矢のうち、師の前でどちらの一本を先に射ようかと迷うだろうか"],"e":"文末の「や」は反語を表し、「〜だろうか、いや〜ない」と訳します。「おろそかに」は「いいかげんに」の意味です。弓を習う人は、師の前でわざと一本をいいかげんにしようとは思っていない、ということです。それでも次の文で「懈怠（けだい）の心、みづから知らずといへども、師これを知る」と、本人が気づかない怠け心を師は見抜くと続きます。","m":"文末「〜むや」は反語が多い"},{"id":55,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・内容理解（懈怠の心）","p":"ある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度たゞ得失なく、この一箭（や）に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠（けだい）の心、みづから知らずといへども、師これを知る。このいましめ萬事にわたるべし。道を學する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期（ご）せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞたゞ今の一念において、直ちにすることの甚だ難き。\n（『徒然草』第九十二段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の「懈怠の心、みづから知らずといへども、師これを知る」の意味として、最も適切なものを選びなさい。","c":["怠ける心は、自分では気づかなくても、師には見抜かれている","怠ける心は、自分ではよく分かっているが、師には隠しておける","怠ける心は誰にでもあるので、師もそれを責めることはない","怠ける心がないことを、自分は知らなくても師はよく分かっている"],"e":"「懈怠（けだい）」は怠けること、「といへども」は「〜けれども」という逆接です。本人は一本をおろそかにしようなどと思っていないつもりでも、心のどこかに怠けがひそんでおり、師にはそれが分かっている、という意味です。「師に隠せる」は反対の内容です。師が責めない、怠ける心がない、という説明は本文にありません。","m":"といへども＝〜けれども（逆接）"},{"id":56,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・主旨（ただ今の一念）","p":"ある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度たゞ得失なく、この一箭（や）に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠（けだい）の心、みづから知らずといへども、師これを知る。このいましめ萬事にわたるべし。道を學する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期（ご）せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞたゞ今の一念において、直ちにすることの甚だ難き。\n（『徒然草』第九十二段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の筆者の主張として、最も適切なものを選びなさい。","c":["後の機会をあてにする心を戒め、今この瞬間になすべきことを直ちに行うことの大切さと難しさを説いている","弓の道は特に難しいので、初心者は師のもとで長い年月修行を続けるべきだと説いている","朝と夕の二回に分けて、毎日ていねいに修行を重ねることが大切だと説いている","人間は怠ける心から逃れられないので、無理に努力しても意味がないと説いている"],"e":"弓の話を「このいましめ萬事にわたるべし」と一般化し、学問・修行の人も「夕方には翌朝がある、朝には夕方がある」と後をあてにしていると述べます。そして最後に「たゞ今の一念において、直ちにすることの甚だ難き（今この瞬間にすぐに行うことは、なんと難しいことか）」と結んでいます。朝夕の修行は筆者が批判する考え方の例です。努力が無意味だとは述べていません。","m":"最終文「何ぞ〜難き」が結論"},{"id":57,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・語句の意味（おきつ）","p":"高名の木のぼりといひし男（をのこ）、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるゝ時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るゝともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（『徒然草』第百九段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の「人を掟てて」（「掟て」は「おきて」と読む）の意味として、最も適切なものを選びなさい。","c":["人に指図して","人を後に残して","人を起こして","人を見守って"],"e":"「おきつ（掟つ）」は「指図する・命令する・取り決める」という意味の動詞で、名詞「おきて（掟）」と同じ語源です。木登りの名人が、人に指図して高い木に登らせ、梢を切らせたという場面です。漢字は「掟」ですが、読みの似た「置く」と混同して「後に残す」としたり、「起く」と混同したりしないように注意しましょう。「見守る」という意味もありません。","m":"おきつ＝掟（おきて）→指図する"},{"id":58,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・理由説明（高い所では黙る）","p":"高名の木のぼりといひし男（をのこ）、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるゝ時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るゝともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（『徒然草』第百九段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章で、木登りの名人が、弟子が高く危ない所にいる間は何も言わなかったのはなぜか。最も適切なものを選びなさい。","c":["目がくらみ枝も危ないような所では、本人が自分で恐れて用心するので、注意する必要がないから","高い所にいる人に声をかけると、驚いて落ちてしまうおそれがあるから","高い所で切る作業は弟子の腕を信頼しており、まったく心配していなかったから","遠くて声が届かないので、低い所まで降りてくるのを待っていたから"],"e":"名人自身が「目くるめき枝危きほどは、おのれがおそれ侍れば申さず」と説明しています。目がくらむほど高く枝も危ない所では、本人が自分で恐れて気をつけるので言わない、ということです。声をかけると驚く、声が届かないといった理由は本文にありません。また名人は弟子を全面的に信頼していたのではなく、油断する場面でこそ注意しています。","m":"危ない所では本人が自ら恐れる"},{"id":59,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・解釈（なん＝強意＋推量）","p":"高名の木のぼりといひし男（をのこ）、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるゝ時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るゝともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（『徒然草』第百九段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の「かばかりになりては、飛び降るゝともおりなむ」の解釈として、最も適切なものを選びなさい。","c":["これくらいの高さになったら、たとえ飛び降りても降りられるだろう","これくらいの高さになったら、飛び降りてでも降りてほしい","これくらいの高さになっても、飛び降りることはしないだろう","これくらいの高さになったので、もう飛び降りてしまった"],"e":"「かばかり」は「これほど」、「とも」は「たとえ〜ても」という逆接の仮定です。「おりなむ」の「な」は完了（強意）の助動詞「ぬ」の未然形、「む」は推量で、「きっと降りられるだろう」という意味になります。軒の高さほどまで降りてきたので、見ていた筆者が「なぜそんなことを言うのか」と尋ねたのです。「〜てほしい」の願望の「なむ」は未然形に付く終助詞で、ここは連用形「おり」に付いているので違います。","m":"連用形＋なむ＝強意＋推量「きっと〜だろう」"},{"id":60,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・主旨（易き所の過ち）","p":"高名の木のぼりといひし男（をのこ）、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるゝ時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るゝともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（『徒然草』第百九段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章で、筆者が名人の言葉を「聖人のいましめにかなへり」と評価し、さらに鞠の例を挙げて述べようとしていることとして、最も適切なものを選びなさい。","c":["失敗は、難しい所を越えて安心し、気がゆるんだ易しい所で起こるものだということ","身分の低い者の言葉は、聖人の言葉よりも役に立つことが多いということ","鞠も木登りも、難しい技ほど何度も練習しなければ上達しないということ","危険な仕事は、経験のある名人にすべて任せるべきだということ"],"e":"名人は「あやまちは安き所になりて、必ず仕ることに候」と言い、筆者はこれを聖人の教えにも合うと評価しています。さらに、鞠も難しい所を蹴り上げた後、易しいと思うと必ず落ちる、という例を挙げて同じ教訓を補強しています。「あやしき下臈（身分の低い者）なれども」とあるので、身分の低い者のほうが優れていると言っているわけではありません。練習の量や任せる相手の話でもありません。","m":"油断は易き所に→二つの例で同じ教訓"}];
var FIELDS=["現代文（評論）","現代文（随筆・小説）","漢字・語彙","古文（文法・語義）","古文（読解）"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="meiji-kokugo-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.k==="past"?"過去問ベース：明治大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（明治大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+"abcde".charAt(j)+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+KIND[q.k]+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+KIND[q.k]+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

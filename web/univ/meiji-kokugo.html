<title>明治 国語 10問テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 一枚の答案用紙。中央1カラム（最大640px）。問題文は試験冊子と同じ明朝、操作と数字はゴシック。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.passage{font-family:var(--f-exam);font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:50vh;overflow-y:auto}
.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}

@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

var QS=[{"id":1,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（市場と人間関係）","p":"市場経済は、見知らぬ者どうしが取引できる仕組みとして発達してきた。顔なじみの間でしか物をやりとりできない社会では、交換の範囲は村や親族の外へ広がりにくい。貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具であり、①人間関係の重みから取引を解き放つことで、交換を飛躍的に拡大させたのである。\nしかし、ここには見落とされやすい逆説がある。契約書がどれほど精密に作られていても、起こりうる事態のすべてを書き尽くすことはできない。予期しない出来事が起きたとき、当事者が条文の隙間をついて自分の利益だけを追い求めれば、取引はたちまち立ちゆかなくなる。実際の取引を支えているのは、書かれた条文そのものよりも、書かれていない部分で相手が誠実にふるまうだろうという見込みである。［　Ａ　］、市場は人格的な関係を切り離すことで成立しながら、その運営においては、切り離したはずの信頼にひそかに寄りかかっているのだ。\n近年、評価の数値化によってこの信頼を置き換えようとする動きが目立つ。取引相手の過去の実績を点数にして公開すれば、誰もが安心して見知らぬ相手と取引できるというわけである。たしかに点数は便利だ。だが、点数が高いことを目的として人がふるまいはじめると、②点数は信頼の目印であることをやめてしまう。評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出されるからである。\n信頼とは、相手がこちらの見ていないところでも約束を守るだろうと考えることにほかならない。そうだとすれば、すべてを監視し記録しようとする試みは、信頼を強めるどころか、信頼という態度そのものを不要にし、やがては掘り崩してしまうおそれがある。市場を支える最後の土台は、計測しきれない部分にこそ置かれている。","q":"次の文章を読んで、傍線部①「人間関係の重みから取引を解き放つ」とはどういうことか。最も適切なものを選びなさい。","c":["相手がどういう人物かを知らなくても、貨幣や契約を通じて取引できるようにしたということ","人間関係を断ち切ること自体を、取引の目的として位置づけたということ","親族や村の内部での物のやりとりを禁じ、外部との取引だけを認めたということ","取引の前に相手の人柄を慎重に調べ、信頼できる者とだけ取引するようにしたということ"],"e":"直前に「貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具」とあり、これを言いかえたのが傍線部です。顔なじみでなくても取引できるようになった、という内容をとらえた選択肢が正解です。人間関係を断つことが「目的」になったわけではなく、親族内の取引を禁じたとも書かれていません。相手の人柄を調べるという説明は、本文と正反対です。","m":"傍線部は直前の文の言いかえを探す"},{"id":2,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・空所補充（接続語）","p":"市場経済は、見知らぬ者どうしが取引できる仕組みとして発達してきた。顔なじみの間でしか物をやりとりできない社会では、交換の範囲は村や親族の外へ広がりにくい。貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具であり、①人間関係の重みから取引を解き放つことで、交換を飛躍的に拡大させたのである。\nしかし、ここには見落とされやすい逆説がある。契約書がどれほど精密に作られていても、起こりうる事態のすべてを書き尽くすことはできない。予期しない出来事が起きたとき、当事者が条文の隙間をついて自分の利益だけを追い求めれば、取引はたちまち立ちゆかなくなる。実際の取引を支えているのは、書かれた条文そのものよりも、書かれていない部分で相手が誠実にふるまうだろうという見込みである。［　Ａ　］、市場は人格的な関係を切り離すことで成立しながら、その運営においては、切り離したはずの信頼にひそかに寄りかかっているのだ。\n近年、評価の数値化によってこの信頼を置き換えようとする動きが目立つ。取引相手の過去の実績を点数にして公開すれば、誰もが安心して見知らぬ相手と取引できるというわけである。たしかに点数は便利だ。だが、点数が高いことを目的として人がふるまいはじめると、②点数は信頼の目印であることをやめてしまう。評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出されるからである。\n信頼とは、相手がこちらの見ていないところでも約束を守るだろうと考えることにほかならない。そうだとすれば、すべてを監視し記録しようとする試みは、信頼を強めるどころか、信頼という態度そのものを不要にし、やがては掘り崩してしまうおそれがある。市場を支える最後の土台は、計測しきれない部分にこそ置かれている。","q":"次の文章の空所［　Ａ　］に入る語として、最も適切なものを選びなさい。","c":["つまり","しかし","たとえば","なぜなら"],"e":"空所の前では「取引を支えているのは、書かれていない部分で相手が誠実にふるまうだろうという見込みだ」と述べ、空所の後で「市場は人間関係を切り離して成立しながら、運営では信頼に寄りかかっている」とまとめています。前の内容を要約・言いかえているので「つまり」が入ります。前後は対立していないので「しかし」は不適、具体例ではないので「たとえば」も不適です。後ろは理由ではなく結論なので「なぜなら」も合いません。","m":"後ろがまとめ・言いかえなら「つまり」"},{"id":3,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・理由説明（数値評価の限界）","p":"市場経済は、見知らぬ者どうしが取引できる仕組みとして発達してきた。顔なじみの間でしか物をやりとりできない社会では、交換の範囲は村や親族の外へ広がりにくい。貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具であり、①人間関係の重みから取引を解き放つことで、交換を飛躍的に拡大させたのである。\nしかし、ここには見落とされやすい逆説がある。契約書がどれほど精密に作られていても、起こりうる事態のすべてを書き尽くすことはできない。予期しない出来事が起きたとき、当事者が条文の隙間をついて自分の利益だけを追い求めれば、取引はたちまち立ちゆかなくなる。実際の取引を支えているのは、書かれた条文そのものよりも、書かれていない部分で相手が誠実にふるまうだろうという見込みである。［　Ａ　］、市場は人格的な関係を切り離すことで成立しながら、その運営においては、切り離したはずの信頼にひそかに寄りかかっているのだ。\n近年、評価の数値化によってこの信頼を置き換えようとする動きが目立つ。取引相手の過去の実績を点数にして公開すれば、誰もが安心して見知らぬ相手と取引できるというわけである。たしかに点数は便利だ。だが、点数が高いことを目的として人がふるまいはじめると、②点数は信頼の目印であることをやめてしまう。評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出されるからである。\n信頼とは、相手がこちらの見ていないところでも約束を守るだろうと考えることにほかならない。そうだとすれば、すべてを監視し記録しようとする試みは、信頼を強めるどころか、信頼という態度そのものを不要にし、やがては掘り崩してしまうおそれがある。市場を支える最後の土台は、計測しきれない部分にこそ置かれている。","q":"次の文章の傍線部②「点数は信頼の目印であることをやめてしまう」のはなぜか。最も適切なものを選びなさい。","c":["点数を得ること自体が目的になると、評価されない場面での誠実さは保証されず、点数が相手の本当の信頼性を示さなくなるから","点数の計算方法には誤りが多く、取引相手の実績を正確に数値に表すことができないから","点数が高い人ほど他人からねたまれ、かえって取引の相手として避けられるようになるから","点数は過去の取引をもとにしたものであり、将来の取引とはまったく関係がないから"],"e":"直後の「評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出される」が理由です。点数のための誠実さは見られていないところでは守られないので、点数が高くても信頼できるとは限らなくなる、ということです。計算方法の誤りやねたみは本文に書かれていません。過去と将来が無関係だという説明も、本文の理由とは違います。","m":"理由は傍線部の直後の「〜からである」に"},{"id":4,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・内容一致（市場と信頼）","p":"市場経済は、見知らぬ者どうしが取引できる仕組みとして発達してきた。顔なじみの間でしか物をやりとりできない社会では、交換の範囲は村や親族の外へ広がりにくい。貨幣と契約は、相手の人柄を知らなくても取引を成立させる道具であり、①人間関係の重みから取引を解き放つことで、交換を飛躍的に拡大させたのである。\nしかし、ここには見落とされやすい逆説がある。契約書がどれほど精密に作られていても、起こりうる事態のすべてを書き尽くすことはできない。予期しない出来事が起きたとき、当事者が条文の隙間をついて自分の利益だけを追い求めれば、取引はたちまち立ちゆかなくなる。実際の取引を支えているのは、書かれた条文そのものよりも、書かれていない部分で相手が誠実にふるまうだろうという見込みである。［　Ａ　］、市場は人格的な関係を切り離すことで成立しながら、その運営においては、切り離したはずの信頼にひそかに寄りかかっているのだ。\n近年、評価の数値化によってこの信頼を置き換えようとする動きが目立つ。取引相手の過去の実績を点数にして公開すれば、誰もが安心して見知らぬ相手と取引できるというわけである。たしかに点数は便利だ。だが、点数が高いことを目的として人がふるまいはじめると、②点数は信頼の目印であることをやめてしまう。評価を得るためだけの誠実さは、評価の目が届かない場面では簡単に投げ出されるからである。\n信頼とは、相手がこちらの見ていないところでも約束を守るだろうと考えることにほかならない。そうだとすれば、すべてを監視し記録しようとする試みは、信頼を強めるどころか、信頼という態度そのものを不要にし、やがては掘り崩してしまうおそれがある。市場を支える最後の土台は、計測しきれない部分にこそ置かれている。","q":"次の文章の内容と合致するものとして、最も適切なものを選びなさい。","c":["市場は人格的な関係を切り離して成り立ったが、実際の取引は、書かれていない部分での相手の誠実さへの期待に支えられている","契約書を十分に精密に作成すれば、予期しない事態にも対応でき、信頼に頼る必要はなくなる","評価の数値化は信頼を強めるはたらきをもつので、社会全体にさらに広げていくべきである","見知らぬ者どうしの取引には危険が多いので、顔なじみの間だけの取引に戻るべきである"],"e":"第二段落の「市場は人格的な関係を切り離すことで成立しながら、その運営においては…信頼にひそかに寄りかかっている」と合致します。契約書は「すべてを書き尽くすことはできない」とあるので二つ目は誤りです。数値化はむしろ信頼を「掘り崩してしまうおそれがある」と述べているので三つ目も誤りです。顔なじみの取引に戻れという主張は本文にありません。","m":"筆者の「逆説」の指摘が論旨の中心"},{"id":5,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（多数決と支配）","p":"民主主義といえば、まず多数決が思い浮かぶ。意見が分かれたとき、数の多いほうに従う。この手続きは単純で公平に見えるが、多数決が正当であるためには、いくつかの前提が満たされていなければならない。\nその第一は、少数派が次の機会には多数派になりうるということである。今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる。もし特定の集団が常に少数の側に固定されているなら、多数決は決定の方法ではなく、①一方による他方の支配を数の形で正当化する装置になってしまう。\n第二の前提は、投票の前に十分な話し合いがなされていることである。話し合いの意味は、単に互いの意見を表明し合うことにあるのではない。他者の理由に耳を傾けるうちに、自分の考えが変わるかもしれないという可能性に開かれていることにある。はじめから結論が決まっており、相手を説得することしか念頭にない議論は、［　Ｂ　］にすぎない。\nこう考えると、多数決は民主主義の中心ではなく、その末端に置かれた手続きだと言える。重要なのは票を数える瞬間ではなく、そこに至るまでの過程で、意見を異にする者どうしが互いを、ともに決める仲間として認め合っているかどうかである。②数えることは、数えられない営みに支えられてはじめて意味を持つ。","q":"次の文章の傍線部①「一方による他方の支配を数の形で正当化する装置」とはどういうことか。最も適切なものを選びなさい。","c":["多数の側が固定されたまま少数の側を従わせることを、数が多いという理由で正しいことのように見せかける仕組み","少数の側が巧みな話し合いによって、多数の側の意見を数の上で覆すことを可能にする仕組み","数を正確に数えることで、どちらの集団にも有利にならないように決定を下す公平な仕組み","勝ち負けが毎回入れ替わることで、すべての集団に順番に決定権を与える仕組み"],"e":"傍線部の前提は「特定の集団が常に少数の側に固定されている」場合です。そのとき多数決は、固定された多数派が少数派を従わせることを、「数が多い」という形式で正当なものに見せる道具になる、というのが傍線部の意味です。少数派が覆す、公平な決定、勝ち負けの入れ替わりは、いずれも「固定」という条件と合わず、「支配」の意味も含んでいません。","m":"傍線部は直前の条件（もし〜なら）と合わせて読む"},{"id":6,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・空所補充（語句）","p":"民主主義といえば、まず多数決が思い浮かぶ。意見が分かれたとき、数の多いほうに従う。この手続きは単純で公平に見えるが、多数決が正当であるためには、いくつかの前提が満たされていなければならない。\nその第一は、少数派が次の機会には多数派になりうるということである。今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる。もし特定の集団が常に少数の側に固定されているなら、多数決は決定の方法ではなく、①一方による他方の支配を数の形で正当化する装置になってしまう。\n第二の前提は、投票の前に十分な話し合いがなされていることである。話し合いの意味は、単に互いの意見を表明し合うことにあるのではない。他者の理由に耳を傾けるうちに、自分の考えが変わるかもしれないという可能性に開かれていることにある。はじめから結論が決まっており、相手を説得することしか念頭にない議論は、［　Ｂ　］にすぎない。\nこう考えると、多数決は民主主義の中心ではなく、その末端に置かれた手続きだと言える。重要なのは票を数える瞬間ではなく、そこに至るまでの過程で、意見を異にする者どうしが互いを、ともに決める仲間として認め合っているかどうかである。②数えることは、数えられない営みに支えられてはじめて意味を持つ。","q":"次の文章の空所［　Ｂ　］に入る語句として、最も適切なものを選びなさい。","c":["対話の体裁をとった独白","真剣な合意形成の試み","少数派への細やかな配慮","理性に基づく熟議"],"e":"空所の直前では、本当の話し合いとは「自分の考えが変わるかもしれない可能性に開かれていること」だと述べています。結論が決まっていて相手を説得することしか考えない議論は、形は話し合いでも、実際は一方的に自分の考えを述べているだけです。そこで「対話の体裁をとった独白」が入ります。ほかの三つは、筆者が評価する本来の話し合いの性質であり、「〜にすぎない」と低く評価する文脈に合いません。","m":"「〜にすぎない」は否定的評価の語が入る"},{"id":7,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（数えることの意味）","p":"民主主義といえば、まず多数決が思い浮かぶ。意見が分かれたとき、数の多いほうに従う。この手続きは単純で公平に見えるが、多数決が正当であるためには、いくつかの前提が満たされていなければならない。\nその第一は、少数派が次の機会には多数派になりうるということである。今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる。もし特定の集団が常に少数の側に固定されているなら、多数決は決定の方法ではなく、①一方による他方の支配を数の形で正当化する装置になってしまう。\n第二の前提は、投票の前に十分な話し合いがなされていることである。話し合いの意味は、単に互いの意見を表明し合うことにあるのではない。他者の理由に耳を傾けるうちに、自分の考えが変わるかもしれないという可能性に開かれていることにある。はじめから結論が決まっており、相手を説得することしか念頭にない議論は、［　Ｂ　］にすぎない。\nこう考えると、多数決は民主主義の中心ではなく、その末端に置かれた手続きだと言える。重要なのは票を数える瞬間ではなく、そこに至るまでの過程で、意見を異にする者どうしが互いを、ともに決める仲間として認め合っているかどうかである。②数えることは、数えられない営みに支えられてはじめて意味を持つ。","q":"次の文章の傍線部②「数えることは、数えられない営みに支えられてはじめて意味を持つ」とはどういうことか。最も適切なものを選びなさい。","c":["票を数えて決める手続きは、その前に意見の違う人々が互いを共に決める仲間と認め、話し合う過程があってこそ正当なものになるということ","票の数は不正確になりやすいので、最終的には指導者の判断によって決定を補う必要があるということ","多数決の結果は数字でしか表せないため、人々の感情とは無関係に受け入れなければならないということ","話し合いの内容を数値として記録することで、はじめて多数決が民主的なものになるということ"],"e":"「数えること」は投票・多数決、「数えられない営み」は直前に述べられた、互いを仲間として認め合い、話し合う過程を指します。多数決は「民主主義の末端に置かれた手続き」であり、それを支える過程があって初めて正当になる、という論旨です。指導者の判断、感情と無関係に受け入れる、話し合いの数値化は、いずれも本文にない内容です。","m":"比喩的表現は直前の段落で中身を特定する"},{"id":8,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・内容一致（民主主義の前提）","p":"民主主義といえば、まず多数決が思い浮かぶ。意見が分かれたとき、数の多いほうに従う。この手続きは単純で公平に見えるが、多数決が正当であるためには、いくつかの前提が満たされていなければならない。\nその第一は、少数派が次の機会には多数派になりうるということである。今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる。もし特定の集団が常に少数の側に固定されているなら、多数決は決定の方法ではなく、①一方による他方の支配を数の形で正当化する装置になってしまう。\n第二の前提は、投票の前に十分な話し合いがなされていることである。話し合いの意味は、単に互いの意見を表明し合うことにあるのではない。他者の理由に耳を傾けるうちに、自分の考えが変わるかもしれないという可能性に開かれていることにある。はじめから結論が決まっており、相手を説得することしか念頭にない議論は、［　Ｂ　］にすぎない。\nこう考えると、多数決は民主主義の中心ではなく、その末端に置かれた手続きだと言える。重要なのは票を数える瞬間ではなく、そこに至るまでの過程で、意見を異にする者どうしが互いを、ともに決める仲間として認め合っているかどうかである。②数えることは、数えられない営みに支えられてはじめて意味を持つ。","q":"次の文章の内容と合致するものとして、最も適切なものを選びなさい。","c":["今日の少数派が次には多数派になりうるという見込みは、人が不本意な決定にもひとまず従うことのできる理由の一つである","多数決は民主主義の中心にある手続きであり、票を数える瞬間こそが最も重要である","話し合いの目的は、相手を説得して自分の結論を受け入れさせることにある","少数派の意見は常に正しいので、どのような場合も多数派の意見より優先されるべきである"],"e":"第二段落の「今日の敗者が明日の勝者になる見込みがあるからこそ、人は不本意な決定にもひとまず従うことができる」と合致します。筆者は多数決を「中心ではなく、その末端に置かれた手続き」としているので二つ目は誤りです。相手を説得することしか考えない議論は否定されているので三つ目も誤りです。少数派が常に正しいとは述べていません。","m":"「〜こそ」「〜ではなく」の対比を押さえる"},{"id":9,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（点と線の記憶）","p":"道を調べるのに紙の地図を広げる人は少なくなった。行き先を入力すれば、画面上の矢印が曲がるべき角を一つずつ教えてくれる。おかげで私たちは迷わなくなったが、その代わりに、自分がいまどこにいるのかを知らないまま目的地に着くようになった。矢印に従って歩いた道は、あとで思い出そうとしても、①点と点を結ぶ線としてしか残っていない。\n迷うことには、無駄の一言では片づけられない働きがある。道に迷った人は、見覚えのある建物を探し、太陽の向きを確かめ、通りの傾きから川の方角を推し量る。そうした手探りのなかで、街は少しずつ一枚の広がりとして身体に刻まれていく。目的地へ最短でたどり着くことだけを考えるなら、こうした過程はすべて省いてよい。しかし省かれたのは、余分な時間だけではなかった。［　Ｃ　］もまた、いっしょに手放されたのである。\nもちろん、昔に戻るべきだと言いたいのではない。案内の技術が多くの人の移動を助けていることは疑えない。問題は、効率という物差しが、それ以外の価値を測る物差しをも押しのけてしまうことにある。②速く着くことと、その土地を知ることとは、本来は別々の事柄であった。それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている。便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること。技術とともに生きるとは、そのような二重の視線を保ち続けることなのだろう。","q":"次の文章の傍線部①「点と点を結ぶ線としてしか残っていない」とはどういうことか。最も適切なものを選びなさい。","c":["歩いた道が周囲の街の広がりとの関わりの中で記憶されず、出発地と目的地をつなぐだけのものとして残るということ","歩いた道が実際よりも短く感じられ、移動にかかった時間をまったく思い出せないということ","画面上の矢印の形だけがはっきりと記憶に残り、目的地の名前を忘れてしまうということ","道の途中で見た建物や景色が、写真のように細部まで正確に記憶されるということ"],"e":"第二段落で、迷う人は手探りする中で街を「一枚の広がり」として身体に刻むと述べています。これと対比すると、矢印に従った道は、周りの街との関係を持たず、出発点と到着点を結ぶだけの「線」として残る、という意味になります。時間を思い出せない、矢印の形が残る、景色が細部まで残るという説明は、「広がり」との対比をとらえていません。","m":"「線」と「広がり（面）」の対比"},{"id":10,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・空所補充（失われたもの）","p":"道を調べるのに紙の地図を広げる人は少なくなった。行き先を入力すれば、画面上の矢印が曲がるべき角を一つずつ教えてくれる。おかげで私たちは迷わなくなったが、その代わりに、自分がいまどこにいるのかを知らないまま目的地に着くようになった。矢印に従って歩いた道は、あとで思い出そうとしても、①点と点を結ぶ線としてしか残っていない。\n迷うことには、無駄の一言では片づけられない働きがある。道に迷った人は、見覚えのある建物を探し、太陽の向きを確かめ、通りの傾きから川の方角を推し量る。そうした手探りのなかで、街は少しずつ一枚の広がりとして身体に刻まれていく。目的地へ最短でたどり着くことだけを考えるなら、こうした過程はすべて省いてよい。しかし省かれたのは、余分な時間だけではなかった。［　Ｃ　］もまた、いっしょに手放されたのである。\nもちろん、昔に戻るべきだと言いたいのではない。案内の技術が多くの人の移動を助けていることは疑えない。問題は、効率という物差しが、それ以外の価値を測る物差しをも押しのけてしまうことにある。②速く着くことと、その土地を知ることとは、本来は別々の事柄であった。それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている。便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること。技術とともに生きるとは、そのような二重の視線を保ち続けることなのだろう。","q":"次の文章の空所［　Ｃ　］に入る語句として、最も適切なものを選びなさい。","c":["自分の力で街の全体をつかんでいく経験","目的地へ速く着くという成果","案内の技術がもたらす安心","無駄な時間を省くという効率"],"e":"空所には、最短経路をたどることで「余分な時間」とともに手放されたものが入ります。直前で、迷う中で手探りし、街を「一枚の広がりとして身体に刻」むことが述べられているので、「自分の力で街の全体をつかんでいく経験」が適切です。速く着く成果、技術の安心、時間を省く効率は、いずれも案内の技術によって得られたものであり、手放されたものではありません。","m":"「〜もまた手放された」→失ったものを入れる"},{"id":11,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・筆者の問題意識（効率と価値）","p":"道を調べるのに紙の地図を広げる人は少なくなった。行き先を入力すれば、画面上の矢印が曲がるべき角を一つずつ教えてくれる。おかげで私たちは迷わなくなったが、その代わりに、自分がいまどこにいるのかを知らないまま目的地に着くようになった。矢印に従って歩いた道は、あとで思い出そうとしても、①点と点を結ぶ線としてしか残っていない。\n迷うことには、無駄の一言では片づけられない働きがある。道に迷った人は、見覚えのある建物を探し、太陽の向きを確かめ、通りの傾きから川の方角を推し量る。そうした手探りのなかで、街は少しずつ一枚の広がりとして身体に刻まれていく。目的地へ最短でたどり着くことだけを考えるなら、こうした過程はすべて省いてよい。しかし省かれたのは、余分な時間だけではなかった。［　Ｃ　］もまた、いっしょに手放されたのである。\nもちろん、昔に戻るべきだと言いたいのではない。案内の技術が多くの人の移動を助けていることは疑えない。問題は、効率という物差しが、それ以外の価値を測る物差しをも押しのけてしまうことにある。②速く着くことと、その土地を知ることとは、本来は別々の事柄であった。それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている。便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること。技術とともに生きるとは、そのような二重の視線を保ち続けることなのだろう。","q":"次の文章で、筆者が傍線部②「速く着くことと、その土地を知ることとは、本来は別々の事柄であった」と述べて問題にしているのはどのようなことか。最も適切なものを選びなさい。","c":["効率よく目的地に着けることが、土地を理解することまで果たしたかのように取り違えられていること","土地をよく知る人ほど目的地に速く着けるので、案内の技術はもともと不要であったこと","速く着くための技術が未熟なため、土地を知ることがおろそかになっていること","土地を知るためには、必ず遠回りをして時間をかけなければならないこと"],"e":"傍線部の直後に「それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている」とあります。速く着くこと（効率）と土地を知ることは別の価値なのに、効率が満たされればもう一方も満たされたと思い込まれている点を問題にしています。技術が不要だった、技術が未熟だ、必ず遠回りすべきだ、という主張はどれも本文にはありません。","m":"傍線部の直後で「問題」の中身が示される"},{"id":12,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・主旨（技術と二重の視線）","p":"道を調べるのに紙の地図を広げる人は少なくなった。行き先を入力すれば、画面上の矢印が曲がるべき角を一つずつ教えてくれる。おかげで私たちは迷わなくなったが、その代わりに、自分がいまどこにいるのかを知らないまま目的地に着くようになった。矢印に従って歩いた道は、あとで思い出そうとしても、①点と点を結ぶ線としてしか残っていない。\n迷うことには、無駄の一言では片づけられない働きがある。道に迷った人は、見覚えのある建物を探し、太陽の向きを確かめ、通りの傾きから川の方角を推し量る。そうした手探りのなかで、街は少しずつ一枚の広がりとして身体に刻まれていく。目的地へ最短でたどり着くことだけを考えるなら、こうした過程はすべて省いてよい。しかし省かれたのは、余分な時間だけではなかった。［　Ｃ　］もまた、いっしょに手放されたのである。\nもちろん、昔に戻るべきだと言いたいのではない。案内の技術が多くの人の移動を助けていることは疑えない。問題は、効率という物差しが、それ以外の価値を測る物差しをも押しのけてしまうことにある。②速く着くことと、その土地を知ることとは、本来は別々の事柄であった。それがいつのまにか、前者が満たされれば後者も満たされたかのように思われている。便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること。技術とともに生きるとは、そのような二重の視線を保ち続けることなのだろう。","q":"次の文章の筆者の主張として、最も適切なものを選びなさい。","c":["技術の便利さを受け入れながらも、それによって見えにくくなったものにも目を向け続けるべきだ","案内の技術は人間の能力を衰えさせるので、紙の地図を使う生活に戻るべきだ","迷うことは時間の無駄なので、技術によって完全になくしていくべきだ","移動の効率こそが現代社会で最も重視されるべき価値である"],"e":"最終段落で「昔に戻るべきだと言いたいのではない」と断ったうえで、「便利さの恩恵を受けながら、それが何を代わりに引き受けているのかに目を向けること」を「二重の視線」と呼んでいます。紙の地図に戻るべきだという選択肢は筆者自身が否定しています。迷うことを無駄とする考えや効率を最重視する考えは、筆者が問題視している立場です。","m":"「〜と言いたいのではない」の後に本音"},{"id":13,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情の理由（言葉を飲みこむ）","p":"祖母の家を片づけに行ったのは、四十九日を終えた翌週のことだった。押し入れの奥から、角のすり切れた木の裁縫箱が出てきた。ふたを開けると、色とりどりの糸巻きが、まるで並べられた日のまま眠っていたかのように整然と収まっている。\n「それ、捨てるでしょ」と、段ボール箱を組み立てながら母が言った。私はとっさに「うん」と答えかけて、言葉を飲みこんだ。糸巻きの一つに、見覚えのある紺色の糸が巻かれていたのだ。小学生のころ、体操服のゼッケンを縫いつけてもらった、あの糸だった。祖母は老眼鏡を額に押し上げ、私が退屈しないようにと、ひと針ごとに数をかぞえてみせた。私は数をかぞえるのに飽きて、途中から祖母の指先ばかり見ていた。\n「……これ、もらってもいい？」\n母は手を止めて、少しのあいだ私の顔を見た。それから、何も言わずに裁縫箱のふたについた埃を、手のひらでそっと払った。①その手つきが、なぜか祖母に似ていると思った。\n帰りの電車で、膝の上の裁縫箱は思いのほか重かった。私は針に糸を通すことさえろくにできない。この箱を使う日が来るのかどうかも分からない。それでも、窓に映る自分の顔を見ながら、②重さを手放さずにいられることが、今はただうれしかった。","q":"次の文章で、「私」が「とっさに『うん』と答えかけて、言葉を飲みこんだ」のはなぜか。最も適切なものを選びなさい。","c":["紺色の糸を目にして、祖母にゼッケンを縫ってもらった思い出がよみがえり、裁縫箱を捨てる気になれなくなったから","母の言い方が冷たく感じられ、反発する気持ちから、わざと母に逆らおうと思ったから","裁縫箱が古い木製の品で、売れば高い値段がつくかもしれないと気づいたから","自分も裁縫を習いたいと前から考えており、ちょうどよい道具が見つかったと思ったから"],"e":"言葉を飲みこんだ直後に「見覚えのある紺色の糸が巻かれていた」「ゼッケンを縫いつけてもらった、あの糸だった」とあり、祖母との思い出が理由だと分かります。母への反発を示す描写はありません。値段の話も出てきません。後半で「針に糸を通すことさえろくにできない」「使う日が来るのか分からない」とあるので、裁縫を習いたかったという説明も合いません。","m":"心情の理由は直後の回想・具体物に"},{"id":14,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・人物の心情（母の手つき）","p":"祖母の家を片づけに行ったのは、四十九日を終えた翌週のことだった。押し入れの奥から、角のすり切れた木の裁縫箱が出てきた。ふたを開けると、色とりどりの糸巻きが、まるで並べられた日のまま眠っていたかのように整然と収まっている。\n「それ、捨てるでしょ」と、段ボール箱を組み立てながら母が言った。私はとっさに「うん」と答えかけて、言葉を飲みこんだ。糸巻きの一つに、見覚えのある紺色の糸が巻かれていたのだ。小学生のころ、体操服のゼッケンを縫いつけてもらった、あの糸だった。祖母は老眼鏡を額に押し上げ、私が退屈しないようにと、ひと針ごとに数をかぞえてみせた。私は数をかぞえるのに飽きて、途中から祖母の指先ばかり見ていた。\n「……これ、もらってもいい？」\n母は手を止めて、少しのあいだ私の顔を見た。それから、何も言わずに裁縫箱のふたについた埃を、手のひらでそっと払った。①その手つきが、なぜか祖母に似ていると思った。\n帰りの電車で、膝の上の裁縫箱は思いのほか重かった。私は針に糸を通すことさえろくにできない。この箱を使う日が来るのかどうかも分からない。それでも、窓に映る自分の顔を見ながら、②重さを手放さずにいられることが、今はただうれしかった。","q":"次の文章の傍線部①「その手つきが、なぜか祖母に似ていると思った」から読み取れる「私」の受け止め方として、最も適切なものを選びなさい。","c":["言葉にしないまま裁縫箱をいたわる母のしぐさに、祖母から母へと受け継がれた優しさのようなものを感じ取った","母が裁縫箱を早く処分したがっていることに気づき、祖母とは違って冷たい人だと感じた","母の手がすっかり年老いて見え、母もいずれいなくなるのだという不安にとらわれた","母が自分の願いを聞いて腹を立てており、黙って叱ろうとしているのだと感じた"],"e":"母は「何も言わずに」埃を「手のひらでそっと払」っています。これは「もらってもいい？」という願いを無言で受け入れ、祖母の品をいたわるしぐさです。その姿に祖母を重ねたのは、祖母と母のつながりや、祖母から受け継がれたやさしさを感じたからだと読めます。処分したがる、腹を立てるという読みは「そっと払った」と合いません。母の老いへの不安を示す描写もありません。","m":"しぐさの描写から無言の気持ちを読む"},{"id":15,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・表現の意味（重さ）","p":"祖母の家を片づけに行ったのは、四十九日を終えた翌週のことだった。押し入れの奥から、角のすり切れた木の裁縫箱が出てきた。ふたを開けると、色とりどりの糸巻きが、まるで並べられた日のまま眠っていたかのように整然と収まっている。\n「それ、捨てるでしょ」と、段ボール箱を組み立てながら母が言った。私はとっさに「うん」と答えかけて、言葉を飲みこんだ。糸巻きの一つに、見覚えのある紺色の糸が巻かれていたのだ。小学生のころ、体操服のゼッケンを縫いつけてもらった、あの糸だった。祖母は老眼鏡を額に押し上げ、私が退屈しないようにと、ひと針ごとに数をかぞえてみせた。私は数をかぞえるのに飽きて、途中から祖母の指先ばかり見ていた。\n「……これ、もらってもいい？」\n母は手を止めて、少しのあいだ私の顔を見た。それから、何も言わずに裁縫箱のふたについた埃を、手のひらでそっと払った。①その手つきが、なぜか祖母に似ていると思った。\n帰りの電車で、膝の上の裁縫箱は思いのほか重かった。私は針に糸を通すことさえろくにできない。この箱を使う日が来るのかどうかも分からない。それでも、窓に映る自分の顔を見ながら、②重さを手放さずにいられることが、今はただうれしかった。","q":"次の文章の傍線部②「重さを手放さずにいられること」の「重さ」が表しているものとして、最も適切なものを選びなさい。","c":["裁縫箱そのものの重みに重ねられた、祖母との思い出やそこから受け継いだもの","使い方の分からない道具を持ち帰ってしまったことへの後悔の気持ち","祖母の家を片づけなければならないという、家族としての重い責任","母に無理を言ってしまったことに対する申し訳なさ"],"e":"「膝の上の裁縫箱は思いのほか重かった」という実際の重さが、傍線部では比喩として使われています。使うかどうか分からなくても「今はただうれしかった」とあるので、重さは祖母との記憶やつながりを表していると読めます。後悔や申し訳なさは「うれしかった」と矛盾します。片づけの責任は、裁縫箱の重さとは結びついていません。","m":"物の重さ＝心の中の大切なものの比喩"},{"id":16,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・表現の特徴（回想と具体物）","p":"祖母の家を片づけに行ったのは、四十九日を終えた翌週のことだった。押し入れの奥から、角のすり切れた木の裁縫箱が出てきた。ふたを開けると、色とりどりの糸巻きが、まるで並べられた日のまま眠っていたかのように整然と収まっている。\n「それ、捨てるでしょ」と、段ボール箱を組み立てながら母が言った。私はとっさに「うん」と答えかけて、言葉を飲みこんだ。糸巻きの一つに、見覚えのある紺色の糸が巻かれていたのだ。小学生のころ、体操服のゼッケンを縫いつけてもらった、あの糸だった。祖母は老眼鏡を額に押し上げ、私が退屈しないようにと、ひと針ごとに数をかぞえてみせた。私は数をかぞえるのに飽きて、途中から祖母の指先ばかり見ていた。\n「……これ、もらってもいい？」\n母は手を止めて、少しのあいだ私の顔を見た。それから、何も言わずに裁縫箱のふたについた埃を、手のひらでそっと払った。①その手つきが、なぜか祖母に似ていると思った。\n帰りの電車で、膝の上の裁縫箱は思いのほか重かった。私は針に糸を通すことさえろくにできない。この箱を使う日が来るのかどうかも分からない。それでも、窓に映る自分の顔を見ながら、②重さを手放さずにいられることが、今はただうれしかった。","q":"次の文章の表現の特徴として、最も適切なものを選びなさい。","c":["現在の場面に過去の回想を差し挟み、紺色の糸などの具体的な物を通して人物の心情を間接的に表している","会話文を多く用い、人物が自分の気持ちを言葉ではっきり説明することで心情を伝えている","三人称の視点から、「私」と母の内面を交互に詳しく描き分けている","比喩をいっさい用いず、出来事を時間の順に淡々と記録している"],"e":"片づけの場面の途中に、ゼッケンを縫ってもらった回想が入り、紺色の糸や裁縫箱の重さといった物を通して気持ちが表されています。会話は短く、母は「何も言わずに」行動しているので、言葉で気持ちを説明するとは言えません。語り手は「私」なので一人称です。「眠っていたかのように」という比喩も使われています。","m":"小説の表現問題は視点・比喩・回想を確認"},{"id":17,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・傍線部説明（言葉を選ぶこと）","p":"手紙を書くとき、私はよく一つの言葉の前で立ち止まる。たとえば礼状に「うれしく思いました」と書くか、「ありがたく思いました」と書くか。どちらでも意味は通じる。しかし、その二つの言葉のあいだには、自分の気持ちのどこに光を当てるかという小さな、しかし確かな違いがある。前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる。\n若いころは、この迷いを時間の無駄だと思っていた。気持ちさえあれば、言葉はなんでもよい、と。けれども年を重ねるにつれて、①言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだと思うようになった。どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくるからである。\n［　Ｅ　］、言葉を選ぶのに時間をかけすぎると、手紙は出しそびれてしまう。結局、迷った末に選んだ一語が最善だったかどうかは、いつまでたっても分からない。それでも、迷ったという事実は、文面のどこかに残るような気がしている。②受け取った人がそれに気づくことはおそらくない。それでかまわないのだと、近ごろは思っている。","q":"次の文章の傍線部①「言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだ」とはどういうことか。最も適切なものを選びなさい。","c":["ふさわしい言葉を考える過程で、自分が本当は何に心を動かされたのかがはっきりしてくるということ","美しい言葉を選んで書けば、気持ちが多少足りなくても相手には十分に伝わるということ","気持ちさえあれば、どのような言葉を使っても相手には正しく伝わるということ","言葉を選ぶときには、相手に失礼のないよう形式を整えることが何より大切だということ"],"e":"直後に「どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくる」と理由が書かれています。これが「見きわめる」の中身です。美しい言葉で気持ちの不足を補うのは「飾る」ことで、筆者が否定している側です。「言葉はなんでもよい」は若いころの考えです。形式を整えることは話題にしていません。","m":"「AではなくB」はBの説明を直後から探す"},{"id":18,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・空所補充（接続語）","p":"手紙を書くとき、私はよく一つの言葉の前で立ち止まる。たとえば礼状に「うれしく思いました」と書くか、「ありがたく思いました」と書くか。どちらでも意味は通じる。しかし、その二つの言葉のあいだには、自分の気持ちのどこに光を当てるかという小さな、しかし確かな違いがある。前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる。\n若いころは、この迷いを時間の無駄だと思っていた。気持ちさえあれば、言葉はなんでもよい、と。けれども年を重ねるにつれて、①言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだと思うようになった。どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくるからである。\n［　Ｅ　］、言葉を選ぶのに時間をかけすぎると、手紙は出しそびれてしまう。結局、迷った末に選んだ一語が最善だったかどうかは、いつまでたっても分からない。それでも、迷ったという事実は、文面のどこかに残るような気がしている。②受け取った人がそれに気づくことはおそらくない。それでかまわないのだと、近ごろは思っている。","q":"次の文章の空所［　Ｅ　］に入る語として、最も適切なものを選びなさい。","c":["もっとも","したがって","すなわち","たとえば"],"e":"前の段落では言葉を選ぶことの意義を述べ、空所の後では「時間をかけすぎると手紙は出しそびれてしまう」と、その考えに対する例外や留保を付け加えています。前の内容を認めつつ補足的に制限を加える「もっとも」が適切です。「したがって」は前の内容から当然の結論を導く語、「すなわち」は言いかえ、「たとえば」は具体例を示す語なので、いずれも文脈に合いません。","m":"前を認めつつ但し書き→「もっとも」"},{"id":19,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・内容理解（二つの言葉の違い）","p":"手紙を書くとき、私はよく一つの言葉の前で立ち止まる。たとえば礼状に「うれしく思いました」と書くか、「ありがたく思いました」と書くか。どちらでも意味は通じる。しかし、その二つの言葉のあいだには、自分の気持ちのどこに光を当てるかという小さな、しかし確かな違いがある。前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる。\n若いころは、この迷いを時間の無駄だと思っていた。気持ちさえあれば、言葉はなんでもよい、と。けれども年を重ねるにつれて、①言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだと思うようになった。どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくるからである。\n［　Ｅ　］、言葉を選ぶのに時間をかけすぎると、手紙は出しそびれてしまう。結局、迷った末に選んだ一語が最善だったかどうかは、いつまでたっても分からない。それでも、迷ったという事実は、文面のどこかに残るような気がしている。②受け取った人がそれに気づくことはおそらくない。それでかまわないのだと、近ごろは思っている。","q":"次の文章で、筆者は「うれしく思いました」と「ありがたく思いました」の違いをどのように説明しているか。最も適切なものを選びなさい。","c":["前者は自分の心が弾んだことを伝え、後者は相手の厚意に感謝し敬う気持ちを表す","前者は目上の人に、後者は親しい友人に対して使うべき言葉である","前者は礼状にふさわしいが、後者は礼状には使うべきではない言葉である","二つの言葉の意味はまったく同じで、違いは文字の数だけである"],"e":"第一段落に「前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる」とあります。「頭を下げる」は、相手への感謝やへりくだる気持ちのたとえです。相手による使い分けや、礼状に使えるかどうかの区別は書かれていません。また「小さな、しかし確かな違いがある」と述べているので、まったく同じだという説明は誤りです。","m":"「前者」「後者」が何を指すか確認"},{"id":20,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・筆者の考え（伝わらなくてもよい）","p":"手紙を書くとき、私はよく一つの言葉の前で立ち止まる。たとえば礼状に「うれしく思いました」と書くか、「ありがたく思いました」と書くか。どちらでも意味は通じる。しかし、その二つの言葉のあいだには、自分の気持ちのどこに光を当てるかという小さな、しかし確かな違いがある。前者は自分の心の弾みを伝え、後者は相手の厚意に向かって頭を下げる。\n若いころは、この迷いを時間の無駄だと思っていた。気持ちさえあれば、言葉はなんでもよい、と。けれども年を重ねるにつれて、①言葉を選ぶことは、気持ちを飾ることではなく、気持ちを見きわめることなのだと思うようになった。どちらの言葉がしっくりくるかを考えているうちに、自分が本当は何に心を動かされたのかが、ようやく見えてくるからである。\n［　Ｅ　］、言葉を選ぶのに時間をかけすぎると、手紙は出しそびれてしまう。結局、迷った末に選んだ一語が最善だったかどうかは、いつまでたっても分からない。それでも、迷ったという事実は、文面のどこかに残るような気がしている。②受け取った人がそれに気づくことはおそらくない。それでかまわないのだと、近ごろは思っている。","q":"次の文章の傍線部②「受け取った人がそれに気づくことはおそらくない。それでかまわないのだ」から読み取れる筆者の考えとして、最も適切なものを選びなさい。","c":["言葉を迷って選んだことが相手に伝わらなくても、その過程自体に自分にとっての意味があると考えている","どうせ相手には伝わらないのだから、言葉を選ぶのに時間をかけるのはやめるべきだと考えている","相手が気づかないのは読む力が足りないからであり、それはしかたのないことだとあきらめている","手紙は形だけのものなので、内容を真剣に考える必要はないと考えている"],"e":"筆者は、言葉を選ぶことで自分の気持ちを見きわめられると述べ、迷った事実は文面のどこかに残ると感じています。相手が気づかなくても「かまわない」のは、迷う過程そのものに意義を認めているからです。時間をかけるのをやめるべきだ、という考えは若いころのものです。相手の読む力を責める記述や、手紙を形だけとする考えは本文にありません。","m":"随筆の結びは筆者の価値観のまとめ"},{"id":21,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情の理由（ひやりとする）","p":"対局が終わると、部室はしんと静まり返った。盤の上では、私の王将が、一年生の駒にぐるりと取り囲まれている。「負けました」と頭を下げると、向かいの佐伯は、困ったような顔で小さく礼を返した。\n佐伯が入部してきたのは春のことだ。駒の並べ方もおぼつかない彼に、定跡を一から教えたのは私だった。それがいまでは、私の得意な戦法の弱点を、私以上に正確に突いてくる。\n「先輩、ここで角を引かれていたら、たぶん僕が負けてました」\n佐伯は駒を一つ戻して、局面をさかのぼってみせた。その声には、勝ち誇る調子は少しもなかった。それがかえって、①胸の奥をひやりとさせた。彼はもう、私の見えていないところまで見えているのだ。\n私は黙って盤を見つめた。悔しさがないと言えばうそになる。けれども、彼の指先が示した一手を見ているうちに、悔しさとは別の、もっと静かな感情がゆっくりと広がってきた。あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていたのだった。\n「もう一局、お願いできるか」\nそう言った自分の声が、思いのほか明るいことに、②私は少し驚いた。","q":"次の文章の傍線部①「胸の奥をひやりとさせた」のはなぜか。最も適切なものを選びなさい。","c":["勝ち誇らずに冷静に局面を振り返る佐伯の様子から、彼が自分には見えていない先まで読んでいることを思い知らされたから","佐伯が先輩である自分をばかにしているように感じられ、強い怒りがこみ上げてきたから","佐伯が自分の指し手の誤りを部員の前で指摘し、恥をかかされたと感じたから","佐伯が実力を隠していたことに気づき、だまされていたと感じたから"],"e":"傍線部の直前に「勝ち誇る調子は少しもなかった」、直後に「彼はもう、私の見えていないところまで見えているのだ」とあります。後輩が淡々と敗因を示したことで、かえって実力の差がはっきり感じられたのです。佐伯は「困ったような顔」をしており、ばかにする様子はありません。部員の前での指摘や、実力を隠していたという描写もありません。","m":"傍線部の前後の文で理由をはさむ"},{"id":22,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情把握（静かな感情）","p":"対局が終わると、部室はしんと静まり返った。盤の上では、私の王将が、一年生の駒にぐるりと取り囲まれている。「負けました」と頭を下げると、向かいの佐伯は、困ったような顔で小さく礼を返した。\n佐伯が入部してきたのは春のことだ。駒の並べ方もおぼつかない彼に、定跡を一から教えたのは私だった。それがいまでは、私の得意な戦法の弱点を、私以上に正確に突いてくる。\n「先輩、ここで角を引かれていたら、たぶん僕が負けてました」\n佐伯は駒を一つ戻して、局面をさかのぼってみせた。その声には、勝ち誇る調子は少しもなかった。それがかえって、①胸の奥をひやりとさせた。彼はもう、私の見えていないところまで見えているのだ。\n私は黙って盤を見つめた。悔しさがないと言えばうそになる。けれども、彼の指先が示した一手を見ているうちに、悔しさとは別の、もっと静かな感情がゆっくりと広がってきた。あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていたのだった。\n「もう一局、お願いできるか」\nそう言った自分の声が、思いのほか明るいことに、②私は少し驚いた。","q":"次の文章の「悔しさとは別の、もっと静かな感情」の説明として、最も適切なものを選びなさい。","c":["自分が教えたことの先へと後輩が成長していったことを認め、受け入れようとする気持ち","後輩に負けた以上、もう将棋を続ける意味はないというあきらめの気持ち","何としても佐伯を打ち負かし、先輩としての面目を取り戻そうとする焦りの気持ち","佐伯に定跡を教えなければよかったという、自分の行動を悔やむ気持ち"],"e":"直後に「あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていた」とあり、自分が教えたものを土台に後輩がさらに先へ進んだことに気づいています。最後に明るく「もう一局」と言っていることから、あきらめや後悔ではなく、成長を認める穏やかな気持ちと考えられます。「焦り」は「静かな感情」という表現と合いません。","m":"「静かな」という形容から激しい感情を除く"},{"id":23,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情の理由（自分の声に驚く）","p":"対局が終わると、部室はしんと静まり返った。盤の上では、私の王将が、一年生の駒にぐるりと取り囲まれている。「負けました」と頭を下げると、向かいの佐伯は、困ったような顔で小さく礼を返した。\n佐伯が入部してきたのは春のことだ。駒の並べ方もおぼつかない彼に、定跡を一から教えたのは私だった。それがいまでは、私の得意な戦法の弱点を、私以上に正確に突いてくる。\n「先輩、ここで角を引かれていたら、たぶん僕が負けてました」\n佐伯は駒を一つ戻して、局面をさかのぼってみせた。その声には、勝ち誇る調子は少しもなかった。それがかえって、①胸の奥をひやりとさせた。彼はもう、私の見えていないところまで見えているのだ。\n私は黙って盤を見つめた。悔しさがないと言えばうそになる。けれども、彼の指先が示した一手を見ているうちに、悔しさとは別の、もっと静かな感情がゆっくりと広がってきた。あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていたのだった。\n「もう一局、お願いできるか」\nそう言った自分の声が、思いのほか明るいことに、②私は少し驚いた。","q":"次の文章の傍線部②で「私」が「少し驚いた」のはなぜか。最も適切なものを選びなさい。","c":["負けた直後で沈んでいるはずだと思っていたのに、後輩の成長を前向きに受け止め、もう一度指したいという気持ちが素直に声に出ていたから","部室が静まり返っていたため、自分の声が予想以上に大きく響いてしまったから","佐伯がもう一局を断るだろうと思っていたのに、すぐに承知してくれたから","負けたことがまったく悔しくない自分に気づき、将棋への情熱が冷めたと感じたから"],"e":"「思いのほか明るい」とあるので、本人は負けて落ちこんだ声になると思っていたことが分かります。静かな感情が広がった後の「もう一局」は、後輩の成長を受け入れて前向きになった気持ちの表れです。声の大きさの話ではなく、佐伯の返事も書かれていません。また本文に「悔しさがないと言えばうそになる」とあるので、まったく悔しくないという説明は誤りです。","m":"「思いのほか」＝予想とのずれに注目"},{"id":24,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・表現の特徴（一人称の語り）","p":"対局が終わると、部室はしんと静まり返った。盤の上では、私の王将が、一年生の駒にぐるりと取り囲まれている。「負けました」と頭を下げると、向かいの佐伯は、困ったような顔で小さく礼を返した。\n佐伯が入部してきたのは春のことだ。駒の並べ方もおぼつかない彼に、定跡を一から教えたのは私だった。それがいまでは、私の得意な戦法の弱点を、私以上に正確に突いてくる。\n「先輩、ここで角を引かれていたら、たぶん僕が負けてました」\n佐伯は駒を一つ戻して、局面をさかのぼってみせた。その声には、勝ち誇る調子は少しもなかった。それがかえって、①胸の奥をひやりとさせた。彼はもう、私の見えていないところまで見えているのだ。\n私は黙って盤を見つめた。悔しさがないと言えばうそになる。けれども、彼の指先が示した一手を見ているうちに、悔しさとは別の、もっと静かな感情がゆっくりと広がってきた。あの手を、私は春に彼に教えた定跡の、ずっと先で見落としていたのだった。\n「もう一局、お願いできるか」\nそう言った自分の声が、思いのほか明るいことに、②私は少し驚いた。","q":"次の文章の表現の特徴として、最も適切なものを選びなさい。","c":["一人称の語り手「私」の視点から、対局後の出来事と心情の移り変わりが順を追って描かれている","佐伯の内面が地の文で詳しく語られ、二人の心情が交互に描き分けられている","全体が過去の回想だけで構成され、現在の場面はまったく描かれていない","擬音語や擬態語を多用して、対局の激しさをにぎやかに表現している"],"e":"語り手は「私」で、負けた直後のひやりとした感覚、悔しさ、静かな感情、明るい声への驚きという変化が、時間の流れに沿って描かれています。佐伯の内面は会話と表情からしか分からず、地の文では語られていません。春の回想は短く差し挟まれるだけで、中心は対局後の場面です。擬態語は「しんと」「ぐるりと」程度で、にぎやかな表現ではありません。","m":"視点人物の内面だけが直接描かれる"},{"id":25,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（承）","q":"次の文のカタカナ部分「ショウ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「伝統の技をケイショウする」","c":["申し出をリョウショウする","書類の内容をショウカイする","業者とコウショウする","努力をショウサンする"],"e":"ケイショウは「継承（受け継ぐこと）」で、「ショウ」は「承」です。同じ字を含むのは「了承（リョウショウ）」です。「照会（ショウカイ）」は問い合わせることで「照」、「交渉（コウショウ）」は話し合うことで「渉」、「称賛（ショウサン）」はほめることで「称」です。同じ音の字が多いので、熟語の意味から字を決めることが大切です。","m":"承＝うけたまわる（継承・了承・承認）"},{"id":26,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（糾）","q":"次の文のカタカナ部分「キュウ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「議論がフンキュウする」","c":["不正をキュウダンする","フキュウの名作","キュウキョクの選択","鉄道のフッキュウ工事"],"e":"フンキュウは「紛糾（もつれて乱れること）」で、「キュウ」は「糾」です。同じ字を含むのは、罪や責任を問いただして非難する「糾弾（キュウダン）」です。「不朽（フキュウ）」は価値が長く失われないことで「朽」、「究極（キュウキョク）」は「究」、「復旧（フッキュウ）」は元どおりに直すことで「旧」です。","m":"糾＝より合わせる・ただす（紛糾・糾弾）"},{"id":27,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（換）","q":"次の文のカタカナ部分「カン」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「カンゲンすれば、問題は費用ではなく時間にある」","c":["窓を開けてカンキする","サークルにカンユウする","カンダイな処置をとる","名画をカンショウする"],"e":"カンゲンは「換言（ほかの言葉で言いかえること）」で、「カン」は「換」です。同じ字を含むのは「換気（カンキ）」です。「勧誘（カンユウ）」は誘うことで「勧」、「寛大（カンダイ）」は心が広いことで「寛」、「鑑賞（カンショウ）」は芸術を味わうことで「鑑」です。評論では「換言すれば」が言いかえの合図としてよく使われます。","m":"換＝とりかえる（換言・換気・交換）"},{"id":28,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（範）","q":"次の文のカタカナ部分「ハン」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「社会のキハンに従う」","c":["後輩のモハンとなる","商売がハンエイする","ハンザツな手続き","規則にイハンする"],"e":"キハンは「規範（行動や判断のよりどころとなる決まり）」で、「ハン」は「範」です。同じ字を含むのは「模範（モハン）」です。「繁栄（ハンエイ）」は「繁」、「煩雑（ハンザツ）」は込み入って面倒なことで「煩」、「違反（イハン）」は「反」です。「規範」と「模範」はどちらも「手本・決まり」の意味でつながっています。","m":"範＝手本・のり（規範・模範・範囲）"},{"id":29,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（顕）","q":"次の文のカタカナ部分「ケン」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「両者の違いはケンチョである」","c":["ケンビキョウで観察する","ケンキョな態度","自動車のホケンに入る","ケンジツな経営"],"e":"ケンチョは「顕著（はっきりと目立つこと）」で、「ケン」は「顕」です。同じ字を含むのは「顕微鏡（ケンビキョウ）」です。「謙虚（ケンキョ）」はへりくだることで「謙」、「保険（ホケン）」は「険」、「堅実（ケンジツ）」は確かで危なげないことで「堅」です。「顕」は「あらわれる・あきらか」の意味をもちます。","m":"顕＝あらわ（顕著・顕微鏡・顕在）"},{"id":30,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字の識別（容）","q":"次の文のカタカナ部分「ヨウ」を漢字に改めたとき、それと同じ漢字を含むものを選びなさい。\n「異なる意見にもカンヨウである」","c":["手紙のナイヨウ","心がドウヨウする","人材をヨウセイする","ヨウチな考え方"],"e":"カンヨウは「寛容（心が広く、他を受け入れること）」で、「ヨウ」は「容」です。同じ字を含むのは「内容（ナイヨウ）」です。「動揺（ドウヨウ）」は「揺」、「養成（ヨウセイ）」は「養」、「幼稚（ヨウチ）」は考えや行動が子どもっぽいことで「幼」です。「容」は「入れる・受け入れる」の意味をもちます。","m":"容＝いれる（寛容・内容・許容）"},{"id":31,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（恣意的）","q":"「恣意的」という語の意味として、最も適切なものを選びなさい。","c":["はっきりした根拠がなく、その時々の思いつきや自分の都合で判断するさま","多くの人の意見を取り入れて、公平に判断するさま","細かな点まで注意を払い、慎重に判断するさま","感情を表に出さず、冷静に物事を見るさま"],"e":"「恣」は「ほしいまま」と読み、気ままにふるまうことを表します。「恣意的」は、客観的な根拠や一定の基準によらず、自分の考えや都合で勝手に決めるさまを言います。評論では「恣意的な線引き」のように、根拠のなさを批判する文脈で使われます。公平、慎重、冷静といった選択肢は、むしろ反対の性質です。","m":"恣＝ほしいまま→勝手気まま"},{"id":32,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（相対化）","q":"「相対化する」という語の意味として、最も適切なものを選びなさい。","c":["絶対的なものと見なされていたものを、他との関係や比較の中に置き直してとらえること","二つのものを向かい合わせて、どちらが正しいかを決めること","あいまいだったものに、唯一の正しい基準を与えること","異なる意見を一つにまとめて、対立をなくすこと"],"e":"「相対」は他との関係で成り立つことで、反対語は「絶対」です。「相対化する」は、当たり前・唯一と思われていた考えや価値を、ほかの可能性と比べられるものとして見直すことです。評論で「近代の価値観を相対化する」のように使われます。唯一の基準を与えるのは「絶対化」に近く、正しさを決めることや意見をまとめることとは違います。","m":"相対化＝「唯一」を「数ある一つ」に"},{"id":33,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"慣用句（枚挙にいとまがない）","q":"「枚挙にいとまがない」の意味として、最も適切なものを選びなさい。","c":["数えきれないほど多い","忙しくて休む時間がない","一つ一つ取り上げる価値がない","急いで数えなければならない"],"e":"「枚挙」は一つ一つ数え上げること、「いとま（暇）」はひまのことです。「数え上げるひまがない」から、数えきれないほどたくさんあることを表します。「このような例は枚挙にいとまがない」のように使います。「いとまがない」から「忙しい」と取り違えやすいので注意しましょう。価値がない、急いで数える、という意味はありません。","m":"枚挙＝数え上げる→数えきれないほど多い"},{"id":34,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"四字熟語（付和雷同）","q":"「付和雷同」の意味として、最も適切なものを選びなさい。","c":["自分の考えをもたず、むやみに他人の意見に同調すること","大勢の人が心を一つにして、力を合わせること","激しい勢いで周囲の反対を押し切ること","互いに意見を出し合って、よりよい結論を導くこと"],"e":"「付和」は他人の意見にたやすく従うこと、「雷同」は雷が鳴ると万物がそれに応じて響くように、むやみに他に同調することです。主体性のなさを批判する語です。力を合わせることは「一致団結」、勢いで押し切ることは「強行」などで表します。意見を出し合うことは肯定的な内容で、この語の否定的な意味と合いません。","m":"雷が鳴ると一斉に響く＝むやみに同調"},{"id":35,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（おもむろに）","q":"「彼はおもむろに立ち上がった」の「おもむろに」の意味として、最も適切なものを選びなさい。","c":["ゆっくりと落ち着いて","突然、思いがけなく","あわてて急いで","こっそりと人目を避けて"],"e":"「おもむろに（徐に）」は、動作が静かでゆっくりしているさまを表します。漢字の「徐」は「徐行」の「徐」で、ゆっくりの意味です。現代では「不意に・突然」の意味だと誤解されることが多いのですが、本来の意味とは逆です。あわてる様子やこっそりする様子を表す語でもありません。","m":"徐（おもむろ）＝徐行のゆっくり"},{"id":36,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙・意味（敷衍）","q":"「筆者は自らの主張を具体例によって敷衍している」の「敷衍」の意味として、最も適切なものを選びなさい。","c":["意味や趣旨をおし広げて、詳しく説明すること","前に述べたことを取り消すこと","要点だけを短くまとめること","他人の説を批判して退けること"],"e":"「敷衍（ふえん）」は、「敷く（広げる）」と「衍（のばす）」からなり、ある考えの趣旨をおし広げ、例などを加えて詳しく説明することです。要点を短くまとめるのは「要約」で、敷衍とは反対の方向です。取り消すことは「撤回」、批判して退けることは「論駁・反駁」などと言います。","m":"敷衍＝広げて詳しく（↔要約）"},{"id":37,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"「なむ」の識別（係助詞）","q":"次は『竹取物語』（群書類従本）の一節です。傍線部「なむ」の文法的説明として、最も適切なものを選びなさい。\n「名をばさぬきの宮つことなむいひける。」","c":["強意の係助詞","他に対する願望を表す終助詞","完了の助動詞「ぬ」の未然形＋推量の助動詞「む」","ナ行変格活用動詞の活用語尾＋推量の助動詞「む」"],"e":"この「なむ」は格助詞「と」に付いており、文末の「ける」（過去の助動詞「けり」の連体形）と係り結びをつくっているので、強意の係助詞です。願望の終助詞「なむ」は未然形に付き、文末に置かれます。「ぬ」＋「む」は連用形に付きます。ナ変動詞は「死ぬ・往（い）ぬ」だけです。「名を、さぬきのみやつこといった」という意味です。","m":"体言・助詞に付いて文末連体形→係助詞"},{"id":38,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"「ぬ」の識別（完了）","q":"次の和歌（『古今和歌集』藤原敏行）の傍線部「ぬ」の文法的説明として、最も適切なものを選びなさい。（本文は国際日本文化研究センター「和歌データベース」による。濁点を補った）\n「あききぬとめにはさやかに見えねども風のおとにぞおどろかれぬる」（傍線部は「あききぬ」の「ぬ」）","c":["完了の助動詞「ぬ」の終止形","打消の助動詞「ず」の連体形","打消の助動詞「ず」の終止形","ナ行変格活用動詞の活用語尾"],"e":"「き」はカ変動詞「来（く）」の連用形です（「秋来ぬ」と書けば「あききぬ」と読みます）。連用形に付く「ぬ」は完了の助動詞で、下に引用の「と」が続くので終止形です。「秋が来たと」という意味になります。打消の「ず」の連体形「ぬ」なら未然形「こ」に付き、「こぬ」と読みます。打消の「ず」の終止形は「ず」です。ナ変動詞は「死ぬ・往ぬ」だけです。","m":"連用形＋ぬ＝完了／未然形＋ぬ＝打消"},{"id":39,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「る」の意味（自発）","q":"次の和歌（『古今和歌集』藤原敏行）の傍線部「れ」の意味として、最も適切なものを選びなさい。（本文は国際日本文化研究センター「和歌データベース」による。濁点を補った）\n「あききぬとめにはさやかに見えねども風のおとにぞおどろかれぬる」（傍線部は「おどろかれ」の「れ」）","c":["自発","受身","可能","尊敬"],"e":"「る・らる」は、心の動きや知覚を表す動詞（思ふ・しのぶ・ながむ・おどろく など）に付くと自発の意味になりやすいです。ここでの「おどろく」は「はっと気づく」の意味で、「風の音で自然とはっと気づかされた」という歌です。受身なら「〜に…される」相手が必要ですが、風の音は気づかせる働きかけの主体ではありません。可能や尊敬では歌意が通りません。","m":"心情・知覚動詞＋る・らる＝自発"},{"id":40,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"係り結び（ぞ→連体形）","q":"次の和歌（『古今和歌集』藤原敏行）で、末尾が「おどろかれぬる」と連体形で結ばれている理由として、最も適切なものを選びなさい。（本文は国際日本文化研究センター「和歌データベース」による。濁点を補った）\n「あききぬとめにはさやかに見えねども風のおとにぞおどろかれぬる」","c":["上にある係助詞「ぞ」と係り結びをつくっているから","上にある係助詞「こそ」の結びだから","直後に体言「秋」が省略されているから","疑問の副詞「いかに」と呼応しているから"],"e":"「風のおとにぞ」の「ぞ」は強意の係助詞で、文末を連体形で結びます。そのため完了の助動詞「ぬ」が連体形「ぬる」になっています。「ぞ・なむ・や・か」は連体形、「こそ」は已然形で結ぶのが原則です。この歌に「こそ」や「いかに」はなく、体言の省略として読む根拠もありません。","m":"ぞ・なむ・や・か→連体、こそ→已然"},{"id":41,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「らむ」の意味（原因推量）","q":"次の和歌（『古今和歌集』紀友則）の傍線部「らむ」の意味として、最も適切なものを選びなさい。（本文は国際日本文化研究センター「和歌データベース」による。濁点を補った）\n「久方のひかりのどけき春の日にしづ心なく花のちるらむ」","c":["現在の原因推量（どうして〜しているのだろう）","過去の推量（〜しただろう）","完了の助動詞「り」の未然形＋推量の助動詞「む」","伝聞・婉曲（〜とかいう・〜ような）"],"e":"「らむ」は終止形（ラ変型は連体形）に付く現在推量の助動詞です。この歌では、目の前で花が散っている事実について、「光がのどかな春の日に、どうして落ち着いた心もなく花は散っているのだろう」と、その原因を推し量っています。過去の推量は「けむ」です。「り」はサ変の未然形・四段の已然形（「散れ」）に付くので、「ちる」に付いた「らむ」をそう分けることはできません。伝聞・婉曲は「らむ」の用法の一つですが、人から聞いたことや遠回しな言い方を表し、多く文中の連体形で使われるので、この歌には合いません。","m":"目の前の事実の理由を推す→原因推量"},{"id":42,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「じ」の意味（打消意志）","q":"次は『伊勢物語』（群書類従本、東下りの段）の一節です。傍線部「じ」の意味として、最も適切なものを選びなさい。\n「そのおとこ。身はようなきものに思ひなして。京にはをらじ。あづまのかたにすむべき所もとめにとてゆきけり。」（傍線部は「をらじ」の「じ」）","c":["打消意志","打消推量","打消当然","禁止"],"e":"「じ」は打消推量と打消意志の意味をもち、主語が一人称（話し手・書き手自身）のときは打消意志になりやすいです。ここは、男が自分を役に立たない者と思い込み、「京にはをらじ（京にはいるまい）」と自分の意志で決めている場面なので打消意志です。打消推量は三人称の事柄に多く使われます。打消当然や禁止は「まじ」の主な意味です。","m":"主語が自分→じ＝打消意志「〜まい」"},{"id":43,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「べし」の意味（可能）","q":"次は『方丈記』（元暦の大地震）の一節です。傍線部「べから」の意味として、最も適切なものを選びなさい。\n「羽なければ空へもあがるべからず。龍ならねば雲にのぼらむこと難し。」（傍線部は「あがるべからず」の「べから」）","c":["可能","推量","意志","当然"],"e":"「べし」は推量・意志・可能・当然・命令・適当などの意味をもちます。下に打消の「ず」が付いた「べからず」は可能の意味になることが多く、ここも「羽がないので、空へ上がることもできない」と、大地震の中で逃げ場のない人々の様子を述べています。次の文の「雲にのぼらむこと難し（雲に上ることは難しい）」とも対応しています。推量「上がらないだろう」、意志「上がるつもりはない」、当然「上がるべきではない」では文意が通りません。","m":"べし＋打消は可能「〜できない」が多い"},{"id":44,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"接続助詞「ば」（已然形＋ば）","q":"次は『方丈記』（元暦の大地震）の一節です。傍線部「なければ」の意味として、最も適切なものを選びなさい。\n「羽なければ空へもあがるべからず。龍ならねば雲にのぼらむこと難し。」（傍線部は「羽なければ」の「なければ」）","c":["羽がないので","羽がないならば","羽がないけれども","羽がないかどうか"],"e":"接続助詞「ば」は、未然形に付くと仮定条件（もし〜ならば）、已然形に付くと確定条件（〜ので・〜と）を表します。「なけれ」は形容詞「なし」の已然形なので、ここは確定条件で、「羽がないので」と原因・理由を表します。「ないならば」は未然形「なくは（なくば）」の場合です。「けれども」は逆接の「ど・ども」の訳です。","m":"未然形＋ば＝仮定、已然形＋ば＝確定"},{"id":45,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（うつくし）","q":"次は『竹取物語』（群書類従本）の一節です。傍線部「うつくしう」の意味として、最も適切なものを選びなさい。\n「それを見れば三寸ばかりなる人いとうつくしうてゐたり。」","c":["かわいらしい様子で","きれいに着飾った様子で","立派で堂々とした様子で","かわいそうな様子で"],"e":"古語の「うつくし」は、小さいものや幼いものに対して「かわいらしい・いとしい」と感じる気持ちを表すのが基本です。ここも、竹の中にいた三寸（約九センチ）ほどの小さな人の様子を「とてもかわいらしい様子で座っていた」と述べています。現代語の「美しい（きれい）」とは意味の中心が違います。「かわいそう」は「いとほし」などに当たります。","m":"うつくし＝小さいものがかわいい"},{"id":46,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（ゆかし）","q":"次は『徒然草』第五十二段の一節です。傍線部「ゆかしかり」の意味として、最も適切なものを選びなさい。\n「何事かありけむ、ゆかしかりしかど、神へまゐるこそ本意なれと思ひて、山までは見ず。」","c":["知りたい","奥ゆかしく上品だ","なつかしい","わずらわしい"],"e":"「ゆかし」は「行く」と関係のある語で、心がそちらへ引かれる、つまり「見たい・聞きたい・知りたい」という気持ちを表します。ここは仁和寺の法師が、参拝者が山へ登っていくのを見て「何があったのだろうか、知りたかったけれど」と思う場面です。現代語の「奥ゆかしい」の意味や、「なつかしい」「わずらわしい」の意味ではありません。","m":"ゆかし＝心が行く→見たい・知りたい"},{"id":47,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"古語の意味（ありがたし）","q":"次は『枕草子』の一節です。傍線部「ありがたき」の意味として、最も適切なものを選びなさい。\n「ありがたきもの　しうとに譽めらるゝむこ、又しうとめに思はるゝ嫁の君、……」","c":["めったにない","感謝したくなる","尊くおそれ多い","ありふれている"],"e":"古語の「ありがたし」は「有り難し」、つまり「存在することが難しい」から、「めったにない・珍しい」という意味が基本です。ここは「めったにないもの。妻の父にほめられる婿、また妻の母にかわいがられる嫁」と、珍しいものを挙げる章段です。現代語の「感謝したい」の意味は、めったにない好意を受けたことから後に生まれた意味です。「ありふれている」は正反対です。","m":"有り難し＝あるのが難しい→めったにない"},{"id":48,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞「す」の意味（尊敬）","q":"次は『宇治拾遺物語』「児のかい餅するにそらねいりしたる事」（児のそら寝）の一節で、僧が寝ている児に呼びかける言葉です。傍線部「せ」の文法的説明として、最も適切なものを選びなさい。\n「物申さぶらはんおどろかせ給へ」（傍線部は「おどろかせ」の「せ」）","c":["尊敬の助動詞「す」の連用形","使役の助動詞「す」の連用形","サ行変格活用動詞「す」の未然形","過去の助動詞「き」の未然形"],"e":"「おどろか」は四段動詞「おどろく（目を覚ます）」の未然形で、そこに助動詞「す」の連用形「せ」が付き、さらに尊敬の補助動詞「給ふ」が続いています。「せ給ふ」の形では、「せ」は尊敬の意味になることが多く、ここも「お目覚めください」と児を敬って呼びかけています。誰かに起こさせるわけではないので使役ではありません。動詞「す」や過去「き」の未然形「せ」は、この位置に来ません。","m":"「せたまふ」の「せ」は多くの場合尊敬"},{"id":49,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・語句解釈（心寄せに）","p":"これも今はむかし。比叡の山にちごありけり。僧だちよひのつれづれにいざかひもちいせんといひけるを。このちご心よせにきゝけり。さりとてしいださんをまちてねざらんもわろかりなんと思て。かたがたによりてねたるよしにて出くるを待けるに。すでにしいだしたるさまにてひしめきあひたり。このちごさだめておどろかさんずらんとまちゐたるに。僧の物申さぶらはんおどろかせ給へといふを。うれしとはおもへども。たゞ一どにいらへんも。待けるかともぞおもふとて。いま一こゑよばれていらへんと念じてねたるほどに。や。なおこしたてまつりそ。おさなき人はね入給にけりといふこゑのしければ。あなわびしと思て。いま一どおこせかしとおもひねにきけば。ひしひしとたゞくひにくふをとのしければ。すべなくてむごの後にえいといらへたりければ。僧達わらふことかぎりなし。\n（『宇治拾遺物語』巻一「兒のかい餅するにそらねいりしたる事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章の「このちご心よせにきゝけり」の意味として、最も適切なものを選びなさい。","c":["この児は、期待して心待ちにしながら聞いていた","この児は、気にもとめずに聞き流していた","この児は、僧たちを気の毒に思いながら聞いていた","この児は、うるさく思って腹を立てながら聞いていた"],"e":"「心寄せ」は、心をそちらに寄せること、つまり期待することです。僧たちが「いざかひもちいせん（さあ、ぼたもちを作ろう）」と言うのを聞いて、児は食べられるのを楽しみにしていたのです。その後、できあがるのを寝たふりをして待つという行動からも、期待していたことが分かります。聞き流す、気の毒に思う、腹を立てるという内容は、後の行動と合いません。","m":"心寄せ＝心を寄せる→期待する"},{"id":50,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・理由説明（すぐに返事しない）","p":"これも今はむかし。比叡の山にちごありけり。僧だちよひのつれづれにいざかひもちいせんといひけるを。このちご心よせにきゝけり。さりとてしいださんをまちてねざらんもわろかりなんと思て。かたがたによりてねたるよしにて出くるを待けるに。すでにしいだしたるさまにてひしめきあひたり。このちごさだめておどろかさんずらんとまちゐたるに。僧の物申さぶらはんおどろかせ給へといふを。うれしとはおもへども。たゞ一どにいらへんも。待けるかともぞおもふとて。いま一こゑよばれていらへんと念じてねたるほどに。や。なおこしたてまつりそ。おさなき人はね入給にけりといふこゑのしければ。あなわびしと思て。いま一どおこせかしとおもひねにきけば。ひしひしとたゞくひにくふをとのしければ。すべなくてむごの後にえいといらへたりければ。僧達わらふことかぎりなし。\n（『宇治拾遺物語』巻一「兒のかい餅するにそらねいりしたる事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章で、僧に起こされたとき、児がすぐに返事をしなかったのはなぜか。最も適切なものを選びなさい。","c":["一度呼ばれただけで返事をすると、ぼたもちを待って起きていたと思われるのがきまり悪かったから","本当にぐっすり眠っていて、僧の呼ぶ声がまったく聞こえていなかったから","僧たちのぼたもちの作り方が気に入らず、食べたくないと思ったから","僧たちを驚かせるために、わざと寝たふりを続けようと考えたから"],"e":"本文に「たゞ一どにいらへんも。待けるかともぞおもふとて」とあります。「一回呼ばれただけで返事をするのも、（僧たちが）待っていたのかと思うといけない」と考え、「もう一声呼ばれてから返事をしよう」と我慢していたのです。児は呼びかけを「うれし」と思っているので、聞こえていなかったわけではありません。食べたくない、驚かせたい、という気持ちは書かれていません。","m":"「〜もぞ思ふ」＝〜と思われたら困る"},{"id":51,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・解釈（な〜そ）","p":"これも今はむかし。比叡の山にちごありけり。僧だちよひのつれづれにいざかひもちいせんといひけるを。このちご心よせにきゝけり。さりとてしいださんをまちてねざらんもわろかりなんと思て。かたがたによりてねたるよしにて出くるを待けるに。すでにしいだしたるさまにてひしめきあひたり。このちごさだめておどろかさんずらんとまちゐたるに。僧の物申さぶらはんおどろかせ給へといふを。うれしとはおもへども。たゞ一どにいらへんも。待けるかともぞおもふとて。いま一こゑよばれていらへんと念じてねたるほどに。や。なおこしたてまつりそ。おさなき人はね入給にけりといふこゑのしければ。あなわびしと思て。いま一どおこせかしとおもひねにきけば。ひしひしとたゞくひにくふをとのしければ。すべなくてむごの後にえいといらへたりければ。僧達わらふことかぎりなし。\n（『宇治拾遺物語』巻一「兒のかい餅するにそらねいりしたる事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章の「や。なおこしたてまつりそ」の意味として、最も適切なものを選びなさい。","c":["おい、お起こし申し上げるな","おい、お起こし申し上げよ","おい、お起こしにはならないだろう","おい、起こすことなどできない"],"e":"「な〜そ」は「〜するな」という禁止を表す呼応の形です。「たてまつり」は謙譲の補助動詞で、起こされる相手である児を敬っています。したがって「おい、（児を）お起こし申し上げるな」となります。この言葉を聞いた児は「あなわびし（ああ、困った）」と思っており、起こしてもらえなくなった状況とも合います。「起こせ」という命令や、推量・不可能の意味はありません。","m":"な＋連用形＋そ＝禁止「〜するな」"},{"id":52,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"宇治拾遺・内容理解（僧たちが笑う）","p":"これも今はむかし。比叡の山にちごありけり。僧だちよひのつれづれにいざかひもちいせんといひけるを。このちご心よせにきゝけり。さりとてしいださんをまちてねざらんもわろかりなんと思て。かたがたによりてねたるよしにて出くるを待けるに。すでにしいだしたるさまにてひしめきあひたり。このちごさだめておどろかさんずらんとまちゐたるに。僧の物申さぶらはんおどろかせ給へといふを。うれしとはおもへども。たゞ一どにいらへんも。待けるかともぞおもふとて。いま一こゑよばれていらへんと念じてねたるほどに。や。なおこしたてまつりそ。おさなき人はね入給にけりといふこゑのしければ。あなわびしと思て。いま一どおこせかしとおもひねにきけば。ひしひしとたゞくひにくふをとのしければ。すべなくてむごの後にえいといらへたりければ。僧達わらふことかぎりなし。\n（『宇治拾遺物語』巻一「兒のかい餅するにそらねいりしたる事」。国史大系本による。踊り字は仮名に直した）","q":"次の文章で、最後に「僧達わらふことかぎりなし」となったのはなぜか。最も適切なものを選びなさい。","c":["寝たふりをしていた児が、ずいぶん時間がたってから返事をしたので、ずっと起きていたことが分かっておかしかったから","児が寝ぼけて意味の分からないことを言ったので、そのとんちんかんな様子がおかしかったから","児がぼたもちを一人でたくさん食べてしまい、僧たちの分がなくなったから","児が僧たちの話し声で目を覚まし、驚いて飛び起きた姿がおかしかったから"],"e":"児は起こしてもらえないまま、僧たちが「ひしひしと」食べる音を聞いて「すべなくて（どうしようもなくて）」、「むごの後に（ずいぶん時間がたってから）」、「えい」と返事をしました。呼ばれてからかなり経った後の返事だったので、寝たふりをしていたことがばれ、僧たちは大笑いしたのです。寝ぼけた言葉、食べ過ぎ、飛び起きた様子は本文にありません。","m":"むご（無期）の後＝ずっと後→そら寝がばれる"},{"id":53,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・理由説明（二つの矢）","p":"ある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度たゞ得失なく、この一箭（や）に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠（けだい）の心、みづから知らずといへども、師これを知る。このいましめ萬事にわたるべし。道を學する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期（ご）せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞたゞ今の一念において、直ちにすることの甚だ難き。\n（『徒然草』第九十二段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章で、師が「初心の人二つの矢を持つことなかれ」と言ったのはなぜか。最も適切なものを選びなさい。","c":["二本目の矢をあてにすると、最初の矢をいいかげんに射る気持ちが生じるから","初心者が二本の矢を持つと、重くて弓をうまく引くことができないから","二本の矢を続けて射るのは、弓の作法として礼儀に反するから","初心者は一本目の矢で必ず的に当てられるので、二本目は不要だから"],"e":"師の言葉の中に「後の矢を頼みて、初めの矢になほざりの心あり」とあります。「なほざり」はいいかげんなことです。二本目があると思うと、一本目をおろそかにする心が生まれるので、一本ごとに「この一矢で決めよう」と思え、と教えているのです。矢の重さや作法については述べていません。初心者が必ず当てられるという内容も本文と合いません。","m":"なほざり（等閑）＝いいかげん"},{"id":54,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・解釈（反語）","p":"ある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度たゞ得失なく、この一箭（や）に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠（けだい）の心、みづから知らずといへども、師これを知る。このいましめ萬事にわたるべし。道を學する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期（ご）せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞたゞ今の一念において、直ちにすることの甚だ難き。\n（『徒然草』第九十二段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の「わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや」の解釈として、最も適切なものを選びなさい。","c":["たった二本の矢なのに、師の前で一本をおろそかにしようと思うだろうか、いや、思いはしない","たった二本の矢しかないので、師の前では一本を大切にとっておこうと思うのだろうか","たった二本の矢でも、師の前では一本を捨てるつもりで射るべきだと思うだろう","たった二本の矢のうち、師の前でどちらの一本を先に射ようかと迷うだろうか"],"e":"文末の「や」は反語を表し、「〜だろうか、いや〜ない」と訳します。「おろそかに」は「いいかげんに」の意味です。弓を習う人は、師の前でわざと一本をいいかげんにしようとは思っていない、ということです。それでも次の文で「懈怠（けだい）の心、みづから知らずといへども、師これを知る」と、本人が気づかない怠け心を師は見抜くと続きます。","m":"文末「〜むや」は反語が多い"},{"id":55,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・内容理解（懈怠の心）","p":"ある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度たゞ得失なく、この一箭（や）に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠（けだい）の心、みづから知らずといへども、師これを知る。このいましめ萬事にわたるべし。道を學する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期（ご）せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞたゞ今の一念において、直ちにすることの甚だ難き。\n（『徒然草』第九十二段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の「懈怠の心、みづから知らずといへども、師これを知る」の意味として、最も適切なものを選びなさい。","c":["怠ける心は、自分では気づかなくても、師には見抜かれている","怠ける心は、自分ではよく分かっているが、師には隠しておける","怠ける心は誰にでもあるので、師もそれを責めることはない","怠ける心がないことを、自分は知らなくても師はよく分かっている"],"e":"「懈怠（けだい）」は怠けること、「といへども」は「〜けれども」という逆接です。本人は一本をおろそかにしようなどと思っていないつもりでも、心のどこかに怠けがひそんでおり、師にはそれが分かっている、という意味です。「師に隠せる」は反対の内容です。師が責めない、怠ける心がない、という説明は本文にありません。","m":"といへども＝〜けれども（逆接）"},{"id":56,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・主旨（ただ今の一念）","p":"ある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度たゞ得失なく、この一箭（や）に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠（けだい）の心、みづから知らずといへども、師これを知る。このいましめ萬事にわたるべし。道を學する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期（ご）せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞたゞ今の一念において、直ちにすることの甚だ難き。\n（『徒然草』第九十二段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の筆者の主張として、最も適切なものを選びなさい。","c":["後の機会をあてにする心を戒め、今この瞬間になすべきことを直ちに行うことの大切さと難しさを説いている","弓の道は特に難しいので、初心者は師のもとで長い年月修行を続けるべきだと説いている","朝と夕の二回に分けて、毎日ていねいに修行を重ねることが大切だと説いている","人間は怠ける心から逃れられないので、無理に努力しても意味がないと説いている"],"e":"弓の話を「このいましめ萬事にわたるべし」と一般化し、学問・修行の人も「夕方には翌朝がある、朝には夕方がある」と後をあてにしていると述べます。そして最後に「たゞ今の一念において、直ちにすることの甚だ難き（今この瞬間にすぐに行うことは、なんと難しいことか）」と結んでいます。朝夕の修行は筆者が批判する考え方の例です。努力が無意味だとは述べていません。","m":"最終文「何ぞ〜難き」が結論"},{"id":57,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・語句の意味（おきつ）","p":"高名の木のぼりといひし男（をのこ）、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるゝ時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るゝともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（『徒然草』第百九段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の「人を掟てて」（「掟て」は「おきて」と読む）の意味として、最も適切なものを選びなさい。","c":["人に指図して","人を後に残して","人を起こして","人を見守って"],"e":"「おきつ（掟つ）」は「指図する・命令する・取り決める」という意味の動詞で、名詞「おきて（掟）」と同じ語源です。木登りの名人が、人に指図して高い木に登らせ、梢を切らせたという場面です。漢字は「掟」ですが、読みの似た「置く」と混同して「後に残す」としたり、「起く」と混同したりしないように注意しましょう。「見守る」という意味もありません。","m":"おきつ＝掟（おきて）→指図する"},{"id":58,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・理由説明（高い所では黙る）","p":"高名の木のぼりといひし男（をのこ）、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるゝ時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るゝともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（『徒然草』第百九段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章で、木登りの名人が、弟子が高く危ない所にいる間は何も言わなかったのはなぜか。最も適切なものを選びなさい。","c":["目がくらみ枝も危ないような所では、本人が自分で恐れて用心するので、注意する必要がないから","高い所にいる人に声をかけると、驚いて落ちてしまうおそれがあるから","高い所で切る作業は弟子の腕を信頼しており、まったく心配していなかったから","遠くて声が届かないので、低い所まで降りてくるのを待っていたから"],"e":"名人自身が「目くるめき枝危きほどは、おのれがおそれ侍れば申さず」と説明しています。目がくらむほど高く枝も危ない所では、本人が自分で恐れて気をつけるので言わない、ということです。声をかけると驚く、声が届かないといった理由は本文にありません。また名人は弟子を全面的に信頼していたのではなく、油断する場面でこそ注意しています。","m":"危ない所では本人が自ら恐れる"},{"id":59,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・解釈（なん＝強意＋推量）","p":"高名の木のぼりといひし男（をのこ）、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるゝ時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るゝともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（『徒然草』第百九段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章の「かばかりになりては、飛び降るゝともおりなむ」の解釈として、最も適切なものを選びなさい。","c":["これくらいの高さになったら、たとえ飛び降りても降りられるだろう","これくらいの高さになったら、飛び降りてでも降りてほしい","これくらいの高さになっても、飛び降りることはしないだろう","これくらいの高さになったので、もう飛び降りてしまった"],"e":"「かばかり」は「これほど」、「とも」は「たとえ〜ても」という逆接の仮定です。「おりなむ」の「な」は完了（強意）の助動詞「ぬ」の未然形、「む」は推量で、「きっと降りられるだろう」という意味になります。軒の高さほどまで降りてきたので、見ていた筆者が「なぜそんなことを言うのか」と尋ねたのです。「〜てほしい」の願望の「なむ」は未然形に付く終助詞で、ここは連用形「おり」に付いているので違います。","m":"連用形＋なむ＝強意＋推量「きっと〜だろう」"},{"id":60,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"徒然草・主旨（易き所の過ち）","p":"高名の木のぼりといひし男（をのこ）、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるゝ時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るゝともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（『徒然草』第百九段。校註日本文学大系本による。（　）内は原本の振り仮名）","q":"次の文章で、筆者が名人の言葉を「聖人のいましめにかなへり」と評価し、さらに鞠の例を挙げて述べようとしていることとして、最も適切なものを選びなさい。","c":["失敗は、難しい所を越えて安心し、気がゆるんだ易しい所で起こるものだということ","身分の低い者の言葉は、聖人の言葉よりも役に立つことが多いということ","鞠も木登りも、難しい技ほど何度も練習しなければ上達しないということ","危険な仕事は、経験のある名人にすべて任せるべきだということ"],"e":"名人は「あやまちは安き所になりて、必ず仕ることに候」と言い、筆者はこれを聖人の教えにも合うと評価しています。さらに、鞠も難しい所を蹴り上げた後、易しいと思うと必ず落ちる、という例を挙げて同じ教訓を補強しています。「あやしき下臈（身分の低い者）なれども」とあるので、身分の低い者のほうが優れていると言っているわけではありません。練習の量や任せる相手の話でもありません。","m":"油断は易き所に→二つの例で同じ教訓"},{"id":61,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・理由説明（辞書どおりの翻訳）","p":"翻訳とは、ある言語で書かれたものを別の言語に置きかえる作業だと一般には考えられている。辞書を引けば、一つの語にはたいてい対応する語が示されている。だが、少しでも翻訳を試みた人なら、①辞書の対応表どおりに語を並べても、文章にはならないことを知っているはずだ。言葉の意味は、その言葉が使われてきた暮らしの厚みと切り離せないからである。\nたとえば、ある言語に雪を表す語が何十通りもあるとしよう。それを一つの「雪」に訳してしまえば、原文の読者が感じとる細かな区別は消えてしまう。かといって、すべての区別を説明的に書き込めば、文章は注釈の山に埋もれ、原文のもつ軽やかさが失われる。翻訳者はつねに、何を残し何を手放すかという選択を迫られている。つまり、翻訳とは置きかえではなく、二つの言語のあいだで行われる判断の連続なのである。\nここで注意したいのは、この不自由さを翻訳の欠陥としてだけ見るべきではないということだ。訳しきれない語に出会ったとき、私たちははじめて、自分の言語が世界をどのように切り分けているかに気づく。母語の中にいるかぎり、その切り分け方はあまりに自然で、ほかのありようがあるとは思いもしない。②翻訳の困難は、自分の言葉を外から眺める窓を開くのである。\n異なる文化を理解するとは、相手を自分の言葉に完全に置きかえることではない。置きかえきれない部分が残ることを認め、その残りに目をこらしつづけることである。","q":"次の文章で、傍線部①「辞書の対応表どおりに語を並べても、文章にはならない」と筆者が述べるのはなぜか。最も適切なものを選びなさい。","c":["言葉の意味は、その言葉が使われてきた生活の積み重ねと結びついており、対応する語に置きかえるだけでは伝わらないから","辞書に示された対応語には誤りが多く、そのまま使うと原文とは違う意味になってしまうから","言語ごとに語順の規則が異なるため、語を並べ替える技術がなければ文が成り立たないから","翻訳者の多くは原文の言語を十分に読めず、辞書に頼りすぎてしまうから"],"e":"傍線部の直後に「言葉の意味は、その言葉が使われてきた暮らしの厚みと切り離せないからである」と理由が示されています。これを言いかえた選択肢が正解です。辞書の誤りや翻訳者の読解力不足は本文で述べられていません。語順の違いはありそうな理由ですが、筆者が問題にしているのは文法ではなく、語の意味が生活と結びついていることです。","m":"理由は「〜からである」の文を探す"},{"id":62,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（外から眺める窓）","p":"翻訳とは、ある言語で書かれたものを別の言語に置きかえる作業だと一般には考えられている。辞書を引けば、一つの語にはたいてい対応する語が示されている。だが、少しでも翻訳を試みた人なら、①辞書の対応表どおりに語を並べても、文章にはならないことを知っているはずだ。言葉の意味は、その言葉が使われてきた暮らしの厚みと切り離せないからである。\nたとえば、ある言語に雪を表す語が何十通りもあるとしよう。それを一つの「雪」に訳してしまえば、原文の読者が感じとる細かな区別は消えてしまう。かといって、すべての区別を説明的に書き込めば、文章は注釈の山に埋もれ、原文のもつ軽やかさが失われる。翻訳者はつねに、何を残し何を手放すかという選択を迫られている。つまり、翻訳とは置きかえではなく、二つの言語のあいだで行われる判断の連続なのである。\nここで注意したいのは、この不自由さを翻訳の欠陥としてだけ見るべきではないということだ。訳しきれない語に出会ったとき、私たちははじめて、自分の言語が世界をどのように切り分けているかに気づく。母語の中にいるかぎり、その切り分け方はあまりに自然で、ほかのありようがあるとは思いもしない。②翻訳の困難は、自分の言葉を外から眺める窓を開くのである。\n異なる文化を理解するとは、相手を自分の言葉に完全に置きかえることではない。置きかえきれない部分が残ることを認め、その残りに目をこらしつづけることである。","q":"次の文章の傍線部②「翻訳の困難は、自分の言葉を外から眺める窓を開く」とはどういうことか。最も適切なものを選びなさい。","c":["訳しきれない語に出会うことで、ふだん当然と思っている母語の世界の切り分け方に気づけるということ","翻訳が難しい作品ほど、外国の読者に広く読まれるようになるということ","翻訳の困難を乗りこえるには、母語を捨てて外国語だけで考える必要があるということ","外国語を学ぶと、母語よりも外国語のほうが優れていると分かるということ"],"e":"直前に「訳しきれない語に出会ったとき、私たちははじめて、自分の言語が世界をどのように切り分けているかに気づく」とあり、母語の中にいると「その切り分け方はあまりに自然」で気づけないと述べています。「外から眺める」とは、この気づきのことです。読者の広がりは話題になっていません。母語を捨てる、外国語のほうが優れている、という主張も本文にはありません。","m":"比喩は直前の具体的な説明で読み解く"},{"id":63,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・筆者の主張（異文化理解）","p":"翻訳とは、ある言語で書かれたものを別の言語に置きかえる作業だと一般には考えられている。辞書を引けば、一つの語にはたいてい対応する語が示されている。だが、少しでも翻訳を試みた人なら、①辞書の対応表どおりに語を並べても、文章にはならないことを知っているはずだ。言葉の意味は、その言葉が使われてきた暮らしの厚みと切り離せないからである。\nたとえば、ある言語に雪を表す語が何十通りもあるとしよう。それを一つの「雪」に訳してしまえば、原文の読者が感じとる細かな区別は消えてしまう。かといって、すべての区別を説明的に書き込めば、文章は注釈の山に埋もれ、原文のもつ軽やかさが失われる。翻訳者はつねに、何を残し何を手放すかという選択を迫られている。つまり、翻訳とは置きかえではなく、二つの言語のあいだで行われる判断の連続なのである。\nここで注意したいのは、この不自由さを翻訳の欠陥としてだけ見るべきではないということだ。訳しきれない語に出会ったとき、私たちははじめて、自分の言語が世界をどのように切り分けているかに気づく。母語の中にいるかぎり、その切り分け方はあまりに自然で、ほかのありようがあるとは思いもしない。②翻訳の困難は、自分の言葉を外から眺める窓を開くのである。\n異なる文化を理解するとは、相手を自分の言葉に完全に置きかえることではない。置きかえきれない部分が残ることを認め、その残りに目をこらしつづけることである。","q":"次の文章で、筆者は異なる文化を理解することをどのように考えているか。最も適切なものを選びなさい。","c":["相手を自分の言葉に完全に置きかえることはできないと認め、置きかえきれない部分に注意を向けつづけること","相手の言葉をできるだけ多く暗記し、自分の言葉を使わずに考えられるようになること","置きかえきれない部分は理解の妨げになるので、思い切って切り捨てること","語の違いを一つ残らず注釈で説明し、誤解の余地をまったくなくすこと"],"e":"最終段落に「置きかえきれない部分が残ることを認め、その残りに目をこらしつづけることである」とあります。これが筆者の考えです。切り捨てるのはこの考えと正反対です。注釈ですべて説明すると「原文のもつ軽やかさが失われる」と第二段落で述べているので、誤解をなくすために全部を書き込むという考えも筆者のものではありません。暗記の話は出てきません。","m":"主張は最終段落の「〜とは…である」に"},{"id":64,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・内容一致（母語の切り分け方）","p":"翻訳とは、ある言語で書かれたものを別の言語に置きかえる作業だと一般には考えられている。辞書を引けば、一つの語にはたいてい対応する語が示されている。だが、少しでも翻訳を試みた人なら、①辞書の対応表どおりに語を並べても、文章にはならないことを知っているはずだ。言葉の意味は、その言葉が使われてきた暮らしの厚みと切り離せないからである。\nたとえば、ある言語に雪を表す語が何十通りもあるとしよう。それを一つの「雪」に訳してしまえば、原文の読者が感じとる細かな区別は消えてしまう。かといって、すべての区別を説明的に書き込めば、文章は注釈の山に埋もれ、原文のもつ軽やかさが失われる。翻訳者はつねに、何を残し何を手放すかという選択を迫られている。つまり、翻訳とは置きかえではなく、二つの言語のあいだで行われる判断の連続なのである。\nここで注意したいのは、この不自由さを翻訳の欠陥としてだけ見るべきではないということだ。訳しきれない語に出会ったとき、私たちははじめて、自分の言語が世界をどのように切り分けているかに気づく。母語の中にいるかぎり、その切り分け方はあまりに自然で、ほかのありようがあるとは思いもしない。②翻訳の困難は、自分の言葉を外から眺める窓を開くのである。\n異なる文化を理解するとは、相手を自分の言葉に完全に置きかえることではない。置きかえきれない部分が残ることを認め、その残りに目をこらしつづけることである。","q":"次の文章の内容と合致するものとして、最も適切なものを選びなさい。","c":["母語の中にいると、その言語による世界の切り分け方は自然に思え、ほかのあり方に気づきにくい","雪を表す語が多い言語を訳すときは、区別をすべて説明的に書き込むのが最善である","翻訳の不自由さは翻訳という作業の欠陥であり、いずれは技術によって解消される","辞書は翻訳の役に立たないので、翻訳者は辞書を引くべきではない"],"e":"第三段落の「母語の中にいるかぎり、その切り分け方はあまりに自然で、ほかのありようがあるとは思いもしない」と合致します。区別をすべて書き込むと注釈の山に埋もれると述べているので、それを最善とする内容は誤りです。筆者は不自由さを「欠陥としてだけ見るべきではない」と述べています。辞書を引くなとは言っていません。","m":"内容一致は本文の一文と照らし合わせる"},{"id":65,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（まなざしの変化）","p":"古い建物を保存するかどうかが議論になるとき、しばしば「価値があるものは残し、価値のないものは壊す」という基準が持ち出される。一見もっともな基準だが、ここには一つの落とし穴がある。価値とは、ものそのものに最初から備わっている性質ではなく、それを見る人の関心や時代の要請によって見いだされるものだからである。\n明治期に建てられた工場の多くは、つい数十年前まで、ありふれた古い建物として次々に取り壊されていた。当時の人々にとって、それらは生産の場でしかなく、わざわざ守る理由は見当たらなかった。ところが今日では、同じ種類の建物が近代化の歩みを伝える遺産として大切にされている。建物が変わったのではない。①変わったのは、建物を見る私たちのまなざしのほうである。\nそうだとすれば、いま「価値がない」と判断して壊したものが、将来の人々にとってかけがえのない手がかりになる可能性はつねに残る。私たちは、未来の関心を前もって知ることができない。その意味で、保存の判断には、②現在の価値観で未来を縛ってしまうという危うさがつきまとっている。\nもちろん、すべてを残すことはできない。土地にも費用にも限りがあり、保存のために人々の暮らしが犠牲になってよいわけでもない。大切なのは、選ぶことをやめることではなく、自分たちの選択が一つの時代の見方にすぎないと自覚しておくことである。その自覚があれば、壊す前に記録を残す、すぐに結論を出さずに議論の場を開いておく、といった慎重さが生まれるだろう。","q":"次の文章の傍線部①「変わったのは、建物を見る私たちのまなざしのほうである」とはどういうことか。最も適切なものを選びなさい。","c":["建物そのものは同じでも、時代の関心が移ったことで、それが価値あるものとして見いだされるようになったということ","古い工場が修理され、外見が新しくなったことで、人々が美しいと感じるようになったということ","建物を見る人々の視力や観察の技術が、昔より向上したということ","工場の生産活動が盛んになり、建物の経済的な価値が高まったということ"],"e":"第一段落で、価値は「見る人の関心や時代の要請によって見いだされるもの」だと述べ、その例として、かつて壊された工場が今は遺産とされることを挙げています。「建物が変わったのではない」とあるので、修理で外見が新しくなった、経済的価値が高まったという選択肢は合いません。「まなざし」は視力のことではなく、ものの見方・評価のしかたの比喩です。","m":"具体例は前段の一般論を裏づける"},{"id":66,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（未来を縛る危うさ）","p":"古い建物を保存するかどうかが議論になるとき、しばしば「価値があるものは残し、価値のないものは壊す」という基準が持ち出される。一見もっともな基準だが、ここには一つの落とし穴がある。価値とは、ものそのものに最初から備わっている性質ではなく、それを見る人の関心や時代の要請によって見いだされるものだからである。\n明治期に建てられた工場の多くは、つい数十年前まで、ありふれた古い建物として次々に取り壊されていた。当時の人々にとって、それらは生産の場でしかなく、わざわざ守る理由は見当たらなかった。ところが今日では、同じ種類の建物が近代化の歩みを伝える遺産として大切にされている。建物が変わったのではない。①変わったのは、建物を見る私たちのまなざしのほうである。\nそうだとすれば、いま「価値がない」と判断して壊したものが、将来の人々にとってかけがえのない手がかりになる可能性はつねに残る。私たちは、未来の関心を前もって知ることができない。その意味で、保存の判断には、②現在の価値観で未来を縛ってしまうという危うさがつきまとっている。\nもちろん、すべてを残すことはできない。土地にも費用にも限りがあり、保存のために人々の暮らしが犠牲になってよいわけでもない。大切なのは、選ぶことをやめることではなく、自分たちの選択が一つの時代の見方にすぎないと自覚しておくことである。その自覚があれば、壊す前に記録を残す、すぐに結論を出さずに議論の場を開いておく、といった慎重さが生まれるだろう。","q":"次の文章の傍線部②「現在の価値観で未来を縛ってしまうという危うさ」の説明として、最も適切なものを選びなさい。","c":["いまの基準で不要と判断して壊すと、将来の人々がそこに見いだしたかもしれない価値の可能性を失わせてしまうこと","いまの人々が古い建物を残しすぎると、将来の人々が新しい建物を建てる土地がなくなってしまうこと","将来の人々の価値観に合わせて、いまの人々が自分の好みを我慢しなければならなくなること","保存のための規則をいま厳しく定めると、将来その規則を変えることができなくなること"],"e":"直前に「いま『価値がない』と判断して壊したものが、将来の人々にとってかけがえのない手がかりになる可能性はつねに残る」「未来の関心を前もって知ることができない」とあります。壊してしまえば、将来の人が価値を見いだす機会そのものがなくなる、というのが「未来を縛る」の意味です。土地不足や規則の固定化は本文で述べていません。将来に合わせて我慢するという内容も逆です。","m":"「そうだとすれば」の後は前段からの推論"},{"id":67,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・筆者の主張（選択の自覚）","p":"古い建物を保存するかどうかが議論になるとき、しばしば「価値があるものは残し、価値のないものは壊す」という基準が持ち出される。一見もっともな基準だが、ここには一つの落とし穴がある。価値とは、ものそのものに最初から備わっている性質ではなく、それを見る人の関心や時代の要請によって見いだされるものだからである。\n明治期に建てられた工場の多くは、つい数十年前まで、ありふれた古い建物として次々に取り壊されていた。当時の人々にとって、それらは生産の場でしかなく、わざわざ守る理由は見当たらなかった。ところが今日では、同じ種類の建物が近代化の歩みを伝える遺産として大切にされている。建物が変わったのではない。①変わったのは、建物を見る私たちのまなざしのほうである。\nそうだとすれば、いま「価値がない」と判断して壊したものが、将来の人々にとってかけがえのない手がかりになる可能性はつねに残る。私たちは、未来の関心を前もって知ることができない。その意味で、保存の判断には、②現在の価値観で未来を縛ってしまうという危うさがつきまとっている。\nもちろん、すべてを残すことはできない。土地にも費用にも限りがあり、保存のために人々の暮らしが犠牲になってよいわけでもない。大切なのは、選ぶことをやめることではなく、自分たちの選択が一つの時代の見方にすぎないと自覚しておくことである。その自覚があれば、壊す前に記録を残す、すぐに結論を出さずに議論の場を開いておく、といった慎重さが生まれるだろう。","q":"次の文章の筆者の主張として、最も適切なものを選びなさい。","c":["何もかも残すことはできないが、自分たちの選択が一つの時代の見方にすぎないと自覚し、慎重に判断すべきだ","将来の価値は予測できないので、古い建物は費用がかかってもすべて保存すべきだ","建物の価値は時代によって変わるので、保存するかどうかは専門家だけに任せるべきだ","人々の暮らしを優先し、価値の定まらない古い建物は早めに取り壊すべきだ"],"e":"最終段落で「すべてを残すことはできない」と認めたうえで、「大切なのは、選ぶことをやめることではなく、自分たちの選択が一つの時代の見方にすぎないと自覚しておくこと」と述べています。すべて保存すべきだという主張は「すべてを残すことはできない」と矛盾します。専門家に任せるという話はありません。早めに取り壊すべきだという主張は、慎重さを求める筆者の考えと反対です。","m":"「AではなくB」のBが筆者の主張"},{"id":68,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・語句の指す内容（落とし穴）","p":"古い建物を保存するかどうかが議論になるとき、しばしば「価値があるものは残し、価値のないものは壊す」という基準が持ち出される。一見もっともな基準だが、ここには一つの落とし穴がある。価値とは、ものそのものに最初から備わっている性質ではなく、それを見る人の関心や時代の要請によって見いだされるものだからである。\n明治期に建てられた工場の多くは、つい数十年前まで、ありふれた古い建物として次々に取り壊されていた。当時の人々にとって、それらは生産の場でしかなく、わざわざ守る理由は見当たらなかった。ところが今日では、同じ種類の建物が近代化の歩みを伝える遺産として大切にされている。建物が変わったのではない。①変わったのは、建物を見る私たちのまなざしのほうである。\nそうだとすれば、いま「価値がない」と判断して壊したものが、将来の人々にとってかけがえのない手がかりになる可能性はつねに残る。私たちは、未来の関心を前もって知ることができない。その意味で、保存の判断には、②現在の価値観で未来を縛ってしまうという危うさがつきまとっている。\nもちろん、すべてを残すことはできない。土地にも費用にも限りがあり、保存のために人々の暮らしが犠牲になってよいわけでもない。大切なのは、選ぶことをやめることではなく、自分たちの選択が一つの時代の見方にすぎないと自覚しておくことである。その自覚があれば、壊す前に記録を残す、すぐに結論を出さずに議論の場を開いておく、といった慎重さが生まれるだろう。","q":"次の文章で、筆者が「一つの落とし穴」と述べている内容として、最も適切なものを選びなさい。","c":["価値を、ものに最初から備わっている性質であるかのように見なしてしまうこと","古い建物の保存に、多くの土地と費用がかかってしまうこと","価値のある建物と価値のない建物を、区別せずに残してしまうこと","保存の議論に時間をかけすぎて、結論が出せなくなってしまうこと"],"e":"「落とし穴がある」の直後に「価値とは、ものそのものに最初から備わっている性質ではなく……見いだされるものだからである」と理由が続いています。つまり、「価値があるものは残す」という基準は、価値を固定したものとして扱う点に落とし穴があるのです。土地や費用の問題は最終段落で別に触れられているだけです。区別せずに残すことや、議論の長さを落とし穴としてはいません。","m":"指示内容は直後の「〜からである」で確かめる"},{"id":69,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（わかったという手ごたえ）","p":"近ごろ、どの分野でも「わかりやすさ」が求められる。難しい内容を短い言葉や図にまとめ、誰でもすぐに理解できるようにすることは、たしかに大切な技術である。専門家が閉じた言葉で語り合うだけでは、知識は社会に届かない。\nしかし、わかりやすさにはもう一つの顔がある。複雑な事柄を単純な形に整理するとき、整理からこぼれ落ちる部分が必ず生じる。例外や条件、まだ解明されていない点、専門家どうしでも意見が分かれる点などである。説明が明快であればあるほど、こうした部分は削られやすい。その結果、受け手は①わかったという手ごたえだけを手にして、実際には問題の半分しか見ていないということが起こりうる。\nさらに厄介なのは、わかったという感覚が、それ以上考えることを止めさせてしまう点である。疑問が残っていれば、人は調べたり人に尋ねたりする。だが、すっきりと理解できたと感じた人は、そこで立ち止まる理由を持たない。②わかりやすい説明は、ときに理解の入り口ではなく出口になってしまうのだ。\nだからといって、わざと難しく語ればよいわけではない。求められているのは、明快に語りながら、同時にその明快さが何を省いたうえで成り立っているのかを示すことである。「ここまではわかっている。ここから先はまだわかっていない」と境界を正直に示す説明こそが、受け手を考えることへと誘うだろう。","q":"次の文章の傍線部①「わかったという手ごたえだけを手にして、実際には問題の半分しか見ていない」とはどういうことか。最も適切なものを選びなさい。","c":["明快な説明で理解できたと感じても、例外や未解明の点など、説明から省かれた部分には気づいていないということ","説明を半分まで聞いたところで理解したつもりになり、最後まで聞かずに終えてしまうということ","専門家の説明が難しすぎるため、受け手は内容の半分ほどしか理解できないということ","受け手が説明の内容を疑ってかかるため、正しい部分まで受け入れられなくなるということ"],"e":"直前に、整理するときには「例外や条件、まだ解明されていない点」などがこぼれ落ち、「説明が明快であればあるほど、こうした部分は削られやすい」とあります。受け手は省かれた部分を知らないまま、わかった気になるのです。途中で聞くのをやめるという話ではありません。難しすぎて理解できないのは、わかりやすさとは逆の問題です。受け手が疑ってかかるという内容もありません。","m":"傍線部の前の「その結果」の原因を押さえる"},{"id":70,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・傍線部説明（入り口と出口）","p":"近ごろ、どの分野でも「わかりやすさ」が求められる。難しい内容を短い言葉や図にまとめ、誰でもすぐに理解できるようにすることは、たしかに大切な技術である。専門家が閉じた言葉で語り合うだけでは、知識は社会に届かない。\nしかし、わかりやすさにはもう一つの顔がある。複雑な事柄を単純な形に整理するとき、整理からこぼれ落ちる部分が必ず生じる。例外や条件、まだ解明されていない点、専門家どうしでも意見が分かれる点などである。説明が明快であればあるほど、こうした部分は削られやすい。その結果、受け手は①わかったという手ごたえだけを手にして、実際には問題の半分しか見ていないということが起こりうる。\nさらに厄介なのは、わかったという感覚が、それ以上考えることを止めさせてしまう点である。疑問が残っていれば、人は調べたり人に尋ねたりする。だが、すっきりと理解できたと感じた人は、そこで立ち止まる理由を持たない。②わかりやすい説明は、ときに理解の入り口ではなく出口になってしまうのだ。\nだからといって、わざと難しく語ればよいわけではない。求められているのは、明快に語りながら、同時にその明快さが何を省いたうえで成り立っているのかを示すことである。「ここまではわかっている。ここから先はまだわかっていない」と境界を正直に示す説明こそが、受け手を考えることへと誘うだろう。","q":"次の文章の傍線部②「わかりやすい説明は、ときに理解の入り口ではなく出口になってしまう」とはどういうことか。最も適切なものを選びなさい。","c":["理解できたと感じることで、さらに調べたり問うたりする意欲が失われ、考えることがそこで終わってしまうということ","わかりやすい説明は、理解を深めるための最初の手がかりとして、どこでも役に立つということ","わかりやすい説明を聞いた人は、内容をすぐに忘れて、説明の場から出ていってしまうということ","わかりやすい説明を重ねていけば、最後には誰もが完全な理解にたどり着けるということ"],"e":"同じ段落で「わかったという感覚が、それ以上考えることを止めさせてしまう」「すっきりと理解できたと感じた人は、そこで立ち止まる理由を持たない」と述べています。本来は考えはじめる「入り口」であるはずの説明が、考えを終わらせる「出口」になる、という意味です。入り口として役立つという選択肢は筆者の懸念の逆です。忘れる、完全な理解にたどり着く、という内容は本文にありません。","m":"対になる比喩は段落の説明と対応させる"},{"id":71,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・筆者の考え（望ましい説明）","p":"近ごろ、どの分野でも「わかりやすさ」が求められる。難しい内容を短い言葉や図にまとめ、誰でもすぐに理解できるようにすることは、たしかに大切な技術である。専門家が閉じた言葉で語り合うだけでは、知識は社会に届かない。\nしかし、わかりやすさにはもう一つの顔がある。複雑な事柄を単純な形に整理するとき、整理からこぼれ落ちる部分が必ず生じる。例外や条件、まだ解明されていない点、専門家どうしでも意見が分かれる点などである。説明が明快であればあるほど、こうした部分は削られやすい。その結果、受け手は①わかったという手ごたえだけを手にして、実際には問題の半分しか見ていないということが起こりうる。\nさらに厄介なのは、わかったという感覚が、それ以上考えることを止めさせてしまう点である。疑問が残っていれば、人は調べたり人に尋ねたりする。だが、すっきりと理解できたと感じた人は、そこで立ち止まる理由を持たない。②わかりやすい説明は、ときに理解の入り口ではなく出口になってしまうのだ。\nだからといって、わざと難しく語ればよいわけではない。求められているのは、明快に語りながら、同時にその明快さが何を省いたうえで成り立っているのかを示すことである。「ここまではわかっている。ここから先はまだわかっていない」と境界を正直に示す説明こそが、受け手を考えることへと誘うだろう。","q":"次の文章で、筆者が望ましいと考えている説明のあり方として、最も適切なものを選びなさい。","c":["明快に語りつつ、何がわかっていて何がまだわかっていないのか、その境界を正直に示す説明","受け手が自分で考えるように、あえて専門用語を多く使って難しく語る説明","例外や条件をすべて省き、結論だけを短い言葉で示す説明","専門家どうしの意見の違いには触れず、多数派の見解だけを示す説明"],"e":"最終段落に「わざと難しく語ればよいわけではない」と前置きしたうえで、「明快に語りながら、同時にその明快さが何を省いたうえで成り立っているのかを示すこと」「境界を正直に示す説明」が受け手を考えることへ誘うとあります。わざと難しく語る説明は筆者が否定しています。例外を省く説明や、意見の違いに触れない説明は、筆者が問題視している「こぼれ落ちる部分」を生む説明です。","m":"「だからといって〜ではない」の後に主張"},{"id":72,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"評論・論の展開（利点と問題点）","p":"近ごろ、どの分野でも「わかりやすさ」が求められる。難しい内容を短い言葉や図にまとめ、誰でもすぐに理解できるようにすることは、たしかに大切な技術である。専門家が閉じた言葉で語り合うだけでは、知識は社会に届かない。\nしかし、わかりやすさにはもう一つの顔がある。複雑な事柄を単純な形に整理するとき、整理からこぼれ落ちる部分が必ず生じる。例外や条件、まだ解明されていない点、専門家どうしでも意見が分かれる点などである。説明が明快であればあるほど、こうした部分は削られやすい。その結果、受け手は①わかったという手ごたえだけを手にして、実際には問題の半分しか見ていないということが起こりうる。\nさらに厄介なのは、わかったという感覚が、それ以上考えることを止めさせてしまう点である。疑問が残っていれば、人は調べたり人に尋ねたりする。だが、すっきりと理解できたと感じた人は、そこで立ち止まる理由を持たない。②わかりやすい説明は、ときに理解の入り口ではなく出口になってしまうのだ。\nだからといって、わざと難しく語ればよいわけではない。求められているのは、明快に語りながら、同時にその明快さが何を省いたうえで成り立っているのかを示すことである。「ここまではわかっている。ここから先はまだわかっていない」と境界を正直に示す説明こそが、受け手を考えることへと誘うだろう。","q":"次の文章の論の進め方の説明として、最も適切なものを選びなさい。","c":["わかりやすさの利点をまず認め、そのうえで問題点を二つ指摘し、最後に望ましい説明のあり方を示している","わかりやすさを全面的に否定し、専門家だけが知識を扱うべきだという結論を導いている","具体的な事例を時代順に並べ、わかりやすさの意味が変化してきた歴史をたどっている","対立する二人の論者の意見を紹介し、どちらが正しいかの判断を読者にゆだねている"],"e":"第一段落でわかりやすさを「大切な技術」と認め、第二段落で省かれる部分が生じること、第三段落で考えることを止めさせること（「さらに厄介なのは」）という二つの問題点を挙げ、最終段落で望ましいあり方を示しています。全面否定ではなく、専門家だけが扱うべきだとも述べていません。歴史をたどる構成でも、二人の論者を対比する構成でもありません。","m":"「しかし」「さらに」「だからといって」で段落の役割をつかむ"},{"id":73,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・人物の様子（音を聞く父）","p":"日曜の朝、物置の奥から引っぱり出した自転車は、思っていた以上にひどい有様だった。タイヤはぺしゃんこで、チェーンには赤茶けた錆が浮いている。中学に入ってからは一度も乗っていない。高校までの道のりが歩くには少し遠いと分かったのは、入学して一週間たってからだった。\n「新しいのを買えばいいだろう」と言うつもりで振り返ると、父はもう軍手をはめて、工具箱のふたを開けていた。\n「チェーンは油をさせばまだ動く。タイヤはチューブだけ替えればいい」\n父は自転車を逆さまにして、ペダルを手で回した。からからと乾いた音がして、途中で引っかかる。父は顔を近づけて、①しばらくのあいだ黙ってその音を聞いていた。私は手持ちぶさたに、横で空気入れを握っていた。\n作業は昼過ぎまでかかった。父の指は黒く汚れ、私の手も同じくらい汚れた。最後に父がペダルを回すと、チェーンはなめらかに、ほとんど音もなく回った。\n「乗ってみろ」\nまたがって家の前の坂を下りると、風が思いのほか冷たかった。振り返ると、父は門の前に立って、汚れた軍手のまま腕を組んでいた。②その姿が小さく見えたのは、坂を下りたせいだけではない気がした。","q":"次の文章の傍線部①「しばらくのあいだ黙ってその音を聞いていた」から読み取れる父の様子として、最も適切なものを選びなさい。","c":["ペダルを回したときの音から、自転車のどこが傷んでいるのかを確かめようと集中している様子","自転車があまりに傷んでいることにあきれ、修理をあきらめようとしている様子","息子が手伝おうとしないことに腹を立て、口をきかずにいる様子","昔この自転車に乗っていたころを思い出し、懐かしさにひたっている様子"],"e":"直前に「からからと乾いた音がして、途中で引っかかる」とあり、父は「顔を近づけて」その音を聞いています。音から不具合の箇所を探っていると読むのが自然です。その後、昼過ぎまで修理を続けているので、あきらめようとしていたとは言えません。「私」に腹を立てている描写はありません。父が昔この自転車に乗っていたことも書かれていません。","m":"動作の意味は前後の行動の流れで判断"},{"id":74,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・人物の考え（言いかけた言葉）","p":"日曜の朝、物置の奥から引っぱり出した自転車は、思っていた以上にひどい有様だった。タイヤはぺしゃんこで、チェーンには赤茶けた錆が浮いている。中学に入ってからは一度も乗っていない。高校までの道のりが歩くには少し遠いと分かったのは、入学して一週間たってからだった。\n「新しいのを買えばいいだろう」と言うつもりで振り返ると、父はもう軍手をはめて、工具箱のふたを開けていた。\n「チェーンは油をさせばまだ動く。タイヤはチューブだけ替えればいい」\n父は自転車を逆さまにして、ペダルを手で回した。からからと乾いた音がして、途中で引っかかる。父は顔を近づけて、①しばらくのあいだ黙ってその音を聞いていた。私は手持ちぶさたに、横で空気入れを握っていた。\n作業は昼過ぎまでかかった。父の指は黒く汚れ、私の手も同じくらい汚れた。最後に父がペダルを回すと、チェーンはなめらかに、ほとんど音もなく回った。\n「乗ってみろ」\nまたがって家の前の坂を下りると、風が思いのほか冷たかった。振り返ると、父は門の前に立って、汚れた軍手のまま腕を組んでいた。②その姿が小さく見えたのは、坂を下りたせいだけではない気がした。","q":"次の文章で、「私」が「新しいのを買えばいいだろう」と言うつもりだったことから読み取れる内容として、最も適切なものを選びなさい。","c":["「私」は、古い自転車を手間をかけて直すより、買いかえるほうが早いと考えていたが、父の様子を見て言わずに終わった","「私」は、新しい自転車を父に買ってもらえないことを最初から分かっていて、父を困らせようとした","「私」は、父がすでに新しい自転車を用意していることを知っていて、それを確かめようとした","「私」は、自転車にはもう乗らないと決めていたので、父に買いかえを勧めようとした"],"e":"錆びたチェーンやぺしゃんこのタイヤを見て「私」は買いかえを考えましたが、振り返ると父は「もう軍手をはめて、工具箱のふたを開けていた」ため、その言葉は口にされませんでした。父を困らせようとした、父が新しい自転車を用意していた、という内容は本文にありません。高校への道が遠いと分かって自転車を出したのですから、乗らないと決めていたという説明も誤りです。","m":"「言うつもりで」→実際には言っていない"},{"id":75,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・表現の意味（同じくらい汚れた手）","p":"日曜の朝、物置の奥から引っぱり出した自転車は、思っていた以上にひどい有様だった。タイヤはぺしゃんこで、チェーンには赤茶けた錆が浮いている。中学に入ってからは一度も乗っていない。高校までの道のりが歩くには少し遠いと分かったのは、入学して一週間たってからだった。\n「新しいのを買えばいいだろう」と言うつもりで振り返ると、父はもう軍手をはめて、工具箱のふたを開けていた。\n「チェーンは油をさせばまだ動く。タイヤはチューブだけ替えればいい」\n父は自転車を逆さまにして、ペダルを手で回した。からからと乾いた音がして、途中で引っかかる。父は顔を近づけて、①しばらくのあいだ黙ってその音を聞いていた。私は手持ちぶさたに、横で空気入れを握っていた。\n作業は昼過ぎまでかかった。父の指は黒く汚れ、私の手も同じくらい汚れた。最後に父がペダルを回すと、チェーンはなめらかに、ほとんど音もなく回った。\n「乗ってみろ」\nまたがって家の前の坂を下りると、風が思いのほか冷たかった。振り返ると、父は門の前に立って、汚れた軍手のまま腕を組んでいた。②その姿が小さく見えたのは、坂を下りたせいだけではない気がした。","q":"次の文章の「父の指は黒く汚れ、私の手も同じくらい汚れた」という表現から読み取れることとして、最も適切なものを選びなさい。","c":["初めは手持ちぶさただった「私」も、いつのまにか父と一緒に作業に加わり、同じ時間を過ごしたこと","父が修理のやり方を教えず、「私」に作業をすべて押しつけたこと","修理がうまくいかず、二人とも途中で作業を投げ出してしまったこと","父と「私」が、どちらが早く修理を終えるかを競い合っていたこと"],"e":"前の場面では「私は手持ちぶさたに、横で空気入れを握っていた」とあり、「私」は見ているだけでした。それが昼過ぎには父と「同じくらい」手が汚れていたことから、「私」も作業に加わり、父と時間を共有したことが分かります。父が作業を押しつけたのではなく、父が主に修理しています。最後にチェーンがなめらかに回るので、投げ出してはいません。競争の描写もありません。","m":"対照的な描写の変化に注目"},{"id":76,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情把握（小さく見えた姿）","p":"日曜の朝、物置の奥から引っぱり出した自転車は、思っていた以上にひどい有様だった。タイヤはぺしゃんこで、チェーンには赤茶けた錆が浮いている。中学に入ってからは一度も乗っていない。高校までの道のりが歩くには少し遠いと分かったのは、入学して一週間たってからだった。\n「新しいのを買えばいいだろう」と言うつもりで振り返ると、父はもう軍手をはめて、工具箱のふたを開けていた。\n「チェーンは油をさせばまだ動く。タイヤはチューブだけ替えればいい」\n父は自転車を逆さまにして、ペダルを手で回した。からからと乾いた音がして、途中で引っかかる。父は顔を近づけて、①しばらくのあいだ黙ってその音を聞いていた。私は手持ちぶさたに、横で空気入れを握っていた。\n作業は昼過ぎまでかかった。父の指は黒く汚れ、私の手も同じくらい汚れた。最後に父がペダルを回すと、チェーンはなめらかに、ほとんど音もなく回った。\n「乗ってみろ」\nまたがって家の前の坂を下りると、風が思いのほか冷たかった。振り返ると、父は門の前に立って、汚れた軍手のまま腕を組んでいた。②その姿が小さく見えたのは、坂を下りたせいだけではない気がした。","q":"次の文章の傍線部②「その姿が小さく見えたのは、坂を下りたせいだけではない気がした」から読み取れる「私」の思いとして、最も適切なものを選びなさい。","c":["距離が離れたためだけでなく、自分が成長して父のもとから少しずつ離れていくことを、ふと感じ取ったということ","父が修理で疲れ切ってしまい、実際に体を縮めて立っているのを見て心配になったということ","自転車を自分で直せなかった父に対して、尊敬する気持ちが薄れてしまったということ","坂の傾きのせいで父が小さく見えたことに驚き、目の錯覚について考えたということ"],"e":"坂を下りれば父は遠ざかるので小さく見えますが、「私」は「それだけではない」と感じています。高校に入り、自分の自転車で遠くへ出かけていこうとする場面であり、自分が父の手を離れていくことを感じ取ったと読むのが適切です。父が体を縮めていたという描写はありません。父は修理をやりとげているので、尊敬が薄れたは誤りです。目の錯覚の話は「だけではない」と打ち消されています。","m":"「〜だけではない」の後ろに心情の核心"},{"id":77,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・傍線部説明（空白ではない時間）","p":"バスを待つ時間が、昔はひどく嫌いだった。時刻表どおりに来ないバスを待ちながら、何度も腕時計を見ては、失われていく時間を数えていた。待つことは、何もしていない空白の時間であり、できるだけ短くすべき無駄だと思っていたのである。\nところが、ある冬の夕方、いつものようにバス停に立っていると、向かいの家の窓に明かりがともるのが見えた。続いて隣の窓にも、その奥の家にも。町が一軒ずつ夜を迎えていくのを、私はそのとき初めて見た気がした。毎日同じ場所に立っていながら、私は何も見ていなかったのだ。\nそれ以来、①待つ時間は私にとって空白ではなくなった。もちろん、バスが遅れれば今でもいらだつ。けれども、いらだちの合間に、電線にとまる鳥の数や、通り過ぎる人の歩く速さに目がいくようになった。目的地に着くことだけを考えていたころには、そうしたものは視界の端を流れ去るだけだった。\n考えてみれば、待つというのは、自分の思いどおりにならないものに時間をあずけることである。思いどおりにならないからこそ、私たちはふだん見過ごしているものに出会う余地を得る。②すべてが予定どおりに運ぶ一日は、たしかに快適だが、どこか窓のない部屋に似ている。","q":"次の文章の傍線部①「待つ時間は私にとって空白ではなくなった」とはどういうことか。最も適切なものを選びなさい。","c":["待つあいだに周りの風景や人の様子に目を向けるようになり、その時間が何かに気づく時間になったということ","待つあいだに本を読んだり仕事をしたりして、時間を有効に使えるようになったということ","バスが時刻表どおりに来るようになり、待つ時間そのものがなくなったということ","待つあいだのいらだちがすっかり消え、心が穏やかになったということ"],"e":"直後に「電線にとまる鳥の数や、通り過ぎる人の歩く速さに目がいくようになった」とあります。以前は「何もしていない空白の時間」だったものが、周囲に目を向け、気づきを得る時間に変わったのです。読書や仕事をするようになったとは書かれていません。バスが遅れることは今もあると述べています。「今でもいらだつ」とあるので、いらだちが消えたという説明も誤りです。","m":"「それ以来」の後の具体例で中身をつかむ"},{"id":78,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・筆者の考えの変化（待つこと）","p":"バスを待つ時間が、昔はひどく嫌いだった。時刻表どおりに来ないバスを待ちながら、何度も腕時計を見ては、失われていく時間を数えていた。待つことは、何もしていない空白の時間であり、できるだけ短くすべき無駄だと思っていたのである。\nところが、ある冬の夕方、いつものようにバス停に立っていると、向かいの家の窓に明かりがともるのが見えた。続いて隣の窓にも、その奥の家にも。町が一軒ずつ夜を迎えていくのを、私はそのとき初めて見た気がした。毎日同じ場所に立っていながら、私は何も見ていなかったのだ。\nそれ以来、①待つ時間は私にとって空白ではなくなった。もちろん、バスが遅れれば今でもいらだつ。けれども、いらだちの合間に、電線にとまる鳥の数や、通り過ぎる人の歩く速さに目がいくようになった。目的地に着くことだけを考えていたころには、そうしたものは視界の端を流れ去るだけだった。\n考えてみれば、待つというのは、自分の思いどおりにならないものに時間をあずけることである。思いどおりにならないからこそ、私たちはふだん見過ごしているものに出会う余地を得る。②すべてが予定どおりに運ぶ一日は、たしかに快適だが、どこか窓のない部屋に似ている。","q":"次の文章で、待つことについての筆者の考えはどのように変わったか。最も適切なものを選びなさい。","c":["できるだけ短くすべき無駄だと考えていたが、ふだん見過ごしているものに出会える時間だと考えるようになった","ふだん見過ごしているものに出会える時間だと考えていたが、できるだけ短くすべき無駄だと考えるようになった","思いどおりにならない不快な時間だと考えていたが、すべてが予定どおりに運ぶ快適な時間だと考えるようになった","他人と話をする社交の時間だと考えていたが、一人で考えごとをする時間だと考えるようになった"],"e":"第一段落で、かつては待つことを「できるだけ短くすべき無駄」と考えていたと述べ、最終段落では「思いどおりにならないからこそ、私たちはふだん見過ごしているものに出会う余地を得る」と述べています。変化の向きが逆の選択肢は誤りです。待つ時間を「予定どおりに運ぶ快適な時間」とは言っていません。他人と話す時間という内容も本文にありません。","m":"変化の問いは「昔」と「今」を両方押さえる"},{"id":79,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・比喩の意味（窓のない部屋）","p":"バスを待つ時間が、昔はひどく嫌いだった。時刻表どおりに来ないバスを待ちながら、何度も腕時計を見ては、失われていく時間を数えていた。待つことは、何もしていない空白の時間であり、できるだけ短くすべき無駄だと思っていたのである。\nところが、ある冬の夕方、いつものようにバス停に立っていると、向かいの家の窓に明かりがともるのが見えた。続いて隣の窓にも、その奥の家にも。町が一軒ずつ夜を迎えていくのを、私はそのとき初めて見た気がした。毎日同じ場所に立っていながら、私は何も見ていなかったのだ。\nそれ以来、①待つ時間は私にとって空白ではなくなった。もちろん、バスが遅れれば今でもいらだつ。けれども、いらだちの合間に、電線にとまる鳥の数や、通り過ぎる人の歩く速さに目がいくようになった。目的地に着くことだけを考えていたころには、そうしたものは視界の端を流れ去るだけだった。\n考えてみれば、待つというのは、自分の思いどおりにならないものに時間をあずけることである。思いどおりにならないからこそ、私たちはふだん見過ごしているものに出会う余地を得る。②すべてが予定どおりに運ぶ一日は、たしかに快適だが、どこか窓のない部屋に似ている。","q":"次の文章の傍線部②「すべてが予定どおりに運ぶ一日は、たしかに快適だが、どこか窓のない部屋に似ている」とはどういうことか。最も適切なものを選びなさい。","c":["予定どおりの一日は快適だが、予期しないものに出会う余地がなく、外の世界に対して閉じているということ","予定どおりの一日は快適なので、外に出かけずに部屋で過ごすのがよいということ","予定を詰めこみすぎると、部屋にこもって休む時間さえなくなってしまうということ","予定どおりに過ごせる人は少なく、多くの人は窓のない部屋のような不自由さを感じているということ"],"e":"直前で、思いどおりにならないからこそ「ふだん見過ごしているものに出会う余地を得る」と述べています。予定どおりの一日にはその余地がないので、外が見えない「窓のない部屋」にたとえているのです。部屋で過ごすのがよい、休む時間がなくなる、多くの人が不自由を感じている、という内容は、比喩の意味として本文から読み取れません。","m":"比喩は直前の文の対比から考える"},{"id":80,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"随筆・内容一致（いらだちの合間）","p":"バスを待つ時間が、昔はひどく嫌いだった。時刻表どおりに来ないバスを待ちながら、何度も腕時計を見ては、失われていく時間を数えていた。待つことは、何もしていない空白の時間であり、できるだけ短くすべき無駄だと思っていたのである。\nところが、ある冬の夕方、いつものようにバス停に立っていると、向かいの家の窓に明かりがともるのが見えた。続いて隣の窓にも、その奥の家にも。町が一軒ずつ夜を迎えていくのを、私はそのとき初めて見た気がした。毎日同じ場所に立っていながら、私は何も見ていなかったのだ。\nそれ以来、①待つ時間は私にとって空白ではなくなった。もちろん、バスが遅れれば今でもいらだつ。けれども、いらだちの合間に、電線にとまる鳥の数や、通り過ぎる人の歩く速さに目がいくようになった。目的地に着くことだけを考えていたころには、そうしたものは視界の端を流れ去るだけだった。\n考えてみれば、待つというのは、自分の思いどおりにならないものに時間をあずけることである。思いどおりにならないからこそ、私たちはふだん見過ごしているものに出会う余地を得る。②すべてが予定どおりに運ぶ一日は、たしかに快適だが、どこか窓のない部屋に似ている。","q":"次の文章の内容と合致するものとして、最も適切なものを選びなさい。","c":["筆者は、待つことの見方が変わった今でも、バスが遅れるといらだつことがある","筆者は、待つ時間を大切にするため、バス停では腕時計を外すことにしている","筆者は、冬の夕方になると毎日、向かいの家の明かりがともる順番を記録している","筆者は、目的地に早く着くことが何より大切だと、今でも考えている"],"e":"第三段落に「もちろん、バスが遅れれば今でもいらだつ」とあり、合致します。腕時計を外すことや、明かりの順番を記録することは書かれていません。「目的地に着くことだけを考えていたころ」は過去のこととして語られているので、今でもそう考えているという選択肢は誤りです。","m":"「もちろん〜」は筆者の留保に注意"},{"id":81,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・心情の理由（胸にこたえる）","p":"改札の前で、遥は大きなリュックを背負い直した。来週から、遥は父親の転勤で北の町の高校に移る。今日はその引っ越しの日だった。\n「見送りなんていいって言ったのに」\n遥はそう言って笑ったが、私が来たことを怒っているようには見えなかった。私たちは小学校からずっと同じクラスで、言いたいことはたいてい言い合ってきた。それなのに、今朝家を出るときから考えていた言葉が、一つも出てこない。\n「向こう、寒いんでしょ」\n「うん。マフラー三本買った」\n「三本もいらないでしょ」\n「一本、あげようか」\n遥は本当にリュックを下ろしかけたので、私はあわてて首を振った。①くだらないやりとりが、いつもと何も変わらないことが、かえって胸にこたえた。\n発車のベルが鳴りはじめた。遥は「じゃあね」とだけ言って、改札を抜けた。階段の手前で一度だけ振り返り、片手を上げた。私も手を上げた。言うはずだった言葉は、結局どれも言わなかった。\n帰り道、上着のポケットに手を入れると、指先にやわらかいものが触れた。引き出してみると、灰色の毛糸のマフラーが小さく丸めて押しこんであった。いつの間に入れたのだろう。②私は駅のほうを一度だけ振り返り、それから、マフラーを首に巻いて歩き出した。","q":"次の文章の傍線部①「くだらないやりとりが、いつもと何も変わらないことが、かえって胸にこたえた」のはなぜか。最も適切なものを選びなさい。","c":["いつもどおりの気軽な会話ができるほど親しい間柄だからこそ、それが今日で終わってしまうことを強く意識させられたから","遥が別れの日にも冗談ばかり言うので、自分との別れを何とも思っていないのだと感じて傷ついたから","マフラーを本当に渡されそうになり、遥の強引さにうんざりしてしまったから","大事な話をするつもりだったのに、遥が話をそらしてばかりいることに腹が立ったから"],"e":"二人は「言いたいことはたいてい言い合ってきた」間柄で、マフラーをめぐる会話もふだんどおりの軽いやりとりです。「かえって」とあるように、日常そのままの会話だからこそ、その日常が今日で終わることが身にしみたのです。遥が別れを何とも思っていないわけではないことは、最後のマフラーから分かります。うんざりした、腹が立ったという描写はありません。","m":"「かえって」は予想と逆の気持ちの動き"},{"id":82,"k":"plan","ref":"想定問題","f":"現代文（随筆・小説）","t":"小説・人物の心情（ポケットのマフラー）","p":"改札の前で、遥は大きなリュックを背負い直した。来週から、遥は父親の転勤で北の町の高校に移る。今日はその引っ越しの日だった。\n「見送りなんていいって言ったのに」\n遥はそう言って笑ったが、私が来たことを怒っているようには見えなかった。私たちは小学校からずっと同じクラスで、言いたいことはたいてい言い合ってきた。それなのに、今朝家を出るときから考えていた言葉が、一つも出てこない。\n「向こう、寒いんでしょ」\n「うん。マフラー三本買った」\n「三本もいらないでしょ」\n「一本、あげようか」\n遥は本当にリュックを下ろしかけたので、私はあわてて首を振った。①くだらないやりとりが、いつもと何も変わらないことが、かえって胸にこたえた。\n発車のベルが鳴りはじめた。遥は「じゃあね」とだけ言って、改札を抜けた。階段の手前で一度だけ振り返り、片手を上げた。私も手を上げた。言うはずだった言葉は、結局どれも言わなかった。\n帰り道、上着のポ

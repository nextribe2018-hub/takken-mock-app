<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>明治 世界史 10問テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 一枚の答案用紙。中央1カラム（最大640px）。問題文は試験冊子と同じ明朝、操作と数字はゴシック。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.passage{font-family:var(--f-exam);font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:50vh;overflow-y:auto}
.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){ .q{font-size:17px} .score b{font-size:44px} .fi{grid-template-columns:minmax(0,1fr)} .fi .btn{grid-column:1;grid-row:auto;justify-self:start} }
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

<script>
(function(){
"use strict";
var QS=[{"id":1,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"ハンムラビ法典","y":-1750,"q":"前18世紀ごろメソポタミアを統一し、「目には目を、歯には歯を」の同害復讐の原則で知られる法典を発布したバビロン第1王朝の王はだれですか。","c":["ハンムラビ王","ダレイオス1世","ネブカドネザル2世","ラメス2世"],"e":"ハンムラビ王はバビロン第1王朝（古バビロニア王国）の王で、メソポタミアを統一し、楔形文字で刻まれた法典を発布しました。この法典は同害復讐を原則としつつ、身分によって刑罰に差がありました。ダレイオス1世はアケメネス朝の王、ネブカドネザル2世は新バビロニアの王でバビロン捕囚を行った人物、ラメス2世はエジプト新王国の王です。","m":"ハンムラビ法典＝バビロン第1王朝・同害復讐＋身分差"},{"id":2,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"アメンホテプ4世の宗教改革","y":-1350,"q":"古代エジプト新王国で、テーベの神官勢力をおさえるため唯一神アトンの信仰を強制し、都をテル＝エル＝アマルナに移した王はだれですか。","c":["アメンホテプ4世","ラメス2世","クフ王","トトメス3世"],"e":"アメンホテプ4世（イクナートン）はアメン神官団の力をおさえるため、アトン神だけを崇拝させる改革を行い、テル＝エル＝アマルナに遷都しました。この時代には写実的なアマルナ美術が生まれました。ラメス2世はヒッタイトと戦った新王国の王、クフ王はギザの大ピラミッドで知られる古王国の王、トトメス3世は新王国の領土を最大にした王です。","m":"アトン一神教・アマルナ遷都＝アメンホテプ4世"},{"id":3,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"フェニキア人と地中海","y":-1000,"q":"古代の東地中海の民族について述べた文として正しいものはどれですか。","c":["フェニキア人は地中海交易で活躍し、北アフリカにカルタゴを建設した。","アラム人は海上交易で活躍し、その文字がラテン文字の直接の起源となった。","ヘブライ人はバビロン第1王朝を建て、メソポタミアを統一した。","ヒッタイト人は楔形文字を発明し、最古の都市国家を築いた。"],"e":"フェニキア人はシドン・ティルスを拠点に地中海交易を行い、カルタゴなどの植民市を建てました。彼らの表音文字がギリシアに伝わり、アルファベットのもとになりました。アラム人は海上ではなく内陸の中継交易で活躍しました。バビロン第1王朝はアムル人の国です。楔形文字を発明したのはシュメール人で、ヒッタイトは鉄器を早くから用いたことで知られます。","m":"海のフェニキア（カルタゴ）、陸のアラム"},{"id":4,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"アケメネス朝の統治","y":-500,"q":"アケメネス朝ペルシアについて述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）ダレイオス1世は全国をいくつもの州に分けてサトラップ（知事）に統治させ、「王の目」「王の耳」と呼ばれる監察官を派遣した。\n（イ）アケメネス朝は、ローマとの戦いに敗れて滅亡した。","c":["（ア）正（イ）誤","（ア）正（イ）正","（ア）誤（イ）正","（ア）誤（イ）誤"],"e":"（ア）は正しい文です。ダレイオス1世は中央集権体制を整え、サトラップ制や監察官の派遣、「王の道」と呼ばれる道路網と駅伝制の整備を行いました。（イ）は誤りです。アケメネス朝は前330年にマケドニアのアレクサンドロス大王によって滅ぼされました。ローマと戦ったのは、のちのパルティアやササン朝です。","m":"アケメネス朝＝サトラップ・王の道→アレクサンドロスが滅ぼす"},{"id":5,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"クレイステネスの改革","y":-508,"q":"前6世紀末のアテネで、血縁にもとづく旧来の4部族制を、居住地（デーモス）にもとづく10部族制に改め、陶片追放（オストラシズム）の制度をつくったとされる政治家はだれですか。","c":["クレイステネス","ペイシストラトス","ソロン","ペリクレス"],"e":"クレイステネスは僭主政の再来を防ぐため、地縁的な10部族制を導入し、僭主になるおそれのある人物を投票で国外追放する陶片追放を設けたとされ、アテネ民主政の基礎を築きました。ソロンは財産の額で市民の権利を決める財産政治と債務奴隷の禁止を行い、ペイシストラトスは僭主として平民を保護しました。ペリクレスは前5世紀に民主政を完成させた指導者です。","m":"ソロン（財産政治）→ペイシストラトス（僭主）→クレイステネス（陶片追放）"},{"id":6,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"ペルシア戦争","y":-480,"q":"ペルシア戦争について述べた文として正しいものはどれですか。","c":["サラミスの海戦では、テミストクレスの指揮するアテネ海軍がペルシア軍を破った。","マラトンの戦いでは、スパルタ軍が単独でペルシア軍を撃退した。","戦後、スパルタを盟主としてペルシアの再来に備えるデロス同盟が結成された。","ペルシア王ダレイオス1世は、クセルクセス1世の子である。"],"e":"前480年のサラミスの海戦で、テミストクレスが率いるアテネ海軍がペルシア艦隊を破りました。この戦いで三段櫂船のこぎ手となった無産市民の発言力が高まりました。マラトンの戦い（前490年）で勝利したのはアテネ重装歩兵が中心の軍です。デロス同盟の盟主はアテネで、スパルタはペロポネソス同盟の盟主です。クセルクセス1世がダレイオス1世の子で、親子関係が逆です。","m":"マラトン＝重装歩兵、サラミス＝三段櫂船の無産市民"},{"id":7,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"ヘレニズム時代の文化","y":-300,"q":"ヘレニズム時代の文化について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）エウクレイデス（ユークリッド）が平面幾何学を大成した。\n（イ）エピクロスが、理性によって欲望を抑え禁欲的に生きることを説くストア派を開いた。","c":["（ア）正（イ）誤","（ア）正（イ）正","（ア）誤（イ）正","（ア）誤（イ）誤"],"e":"（ア）は正しい文です。エウクレイデスはアレクサンドリアのムセイオンで活動し、平面幾何学を体系化しました。（イ）は誤りです。ストア派を開いたのはキプロス島出身のゼノンで、理性による禁欲を説きました。エピクロスは、心の平静（アタラクシア）を最高の快楽とするエピクロス派を開いた人物です。ヘレニズム期には、ポリスの枠を超えた世界市民主義（コスモポリタニズム）が広がりました。","m":"禁欲のストア派＝ゼノン、心の平静のエピクロス派"},{"id":8,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"ローマの身分闘争","y":-287,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　リキニウス・セクスティウス法が定められ、コンスルの1人を平民から選ぶことになった。\nイ　ホルテンシウス法が定められ、平民会の決議が元老院の承認なしに国法となった。\nウ　慣習法を成文化した十二表法が定められた。","c":["ウ→ア→イ","ア→ウ→イ","ウ→イ→ア","ア→イ→ウ"],"e":"十二表法は前5世紀半ば（前450年ごろ）にローマ最古の成文法として定められ、貴族による法の独占が崩れました。続いて前367年のリキニウス・セクスティウス法でコンスルの1人を平民から選ぶことが定められ、前287年のホルテンシウス法で平民会の決議が元老院の承認なしに国法となり、平民と貴族の法的な平等が達成されました。","m":"十二表法→リキニウス・セクスティウス法→ホルテンシウス法"},{"id":9,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"グラックス兄弟の改革","y":-133,"q":"前133年に護民官となり、大土地所有を制限して無産市民に土地を分配する改革を試みたが、反対派に殺害されたローマの政治家はだれですか。","c":["ティベリウス・グラックス","マリウス","スラ","クラッスス"],"e":"ティベリウス・グラックスは、ラティフンディア（奴隷を使った大土地経営）の広がりで中小農民が没落したことを受け、土地改革を行おうとしましたが、元老院の保守派に殺されました。弟のガイウスも改革を試み挫折しました。マリウスは平民派の軍人で兵制改革（志願兵制）を行い、スラは閥族派の指導者です。クラッススはカエサル・ポンペイウスと第1回三頭政治を行いました。","m":"グラックス兄弟の挫折→内乱の1世紀へ"},{"id":10,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"ローマの文学と学問","y":77,"q":"ローマ時代の人物とその著作の組合せとして正しいものはどれですか。","c":["プリニウス―『博物誌』","タキトゥス―『ガリア戦記』","リウィウス―『ゲルマニア』","プルタルコス―『ローマ建国史』"],"e":"プリニウスは自然界の知識を集めた百科全書的な『博物誌』を著しました。『ガリア戦記』はカエサルが自らのガリア遠征を記したもの、『ゲルマニア』はタキトゥスが古ゲルマン人の社会を記したものです。『ローマ建国史（ローマ建国以来の歴史）』はリウィウスの著作です。プルタルコスはギリシア人で、ギリシアとローマの英雄を比べた『対比列伝（英雄伝）』を書きました。","m":"ゲルマニア＝タキトゥス、ガリア戦記＝カエサル"},{"id":11,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"ゲルマン人の移動とフランク王国","y":476,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　ゲルマン人傭兵隊長オドアケルによって、西ローマ帝国が滅ぼされた。\nイ　フン人の圧迫を受けた西ゴート人が、ドナウ川を渡ってローマ領内に移動した。\nウ　フランク王クローヴィスが、アタナシウス派のキリスト教に改宗した。","c":["イ→ア→ウ","ア→イ→ウ","イ→ウ→ア","ウ→イ→ア"],"e":"375年、フン人が西進して東ゴート人を従えると、圧迫された西ゴート人が南下を始め、翌376年にドナウ川を渡ってローマ領内に入りました。これがゲルマン人の大移動の始まりとされます。その後476年に西ローマ帝国はオドアケルに滅ぼされました。メロヴィング朝のクローヴィスは496年ごろ正統派のアタナシウス派に改宗し、ローマ系住民や教会の支持を得ました。","m":"375〜376西ゴート南下・ドナウ渡河→476西ローマ滅亡→496ごろクローヴィス改宗"},{"id":12,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"カールの戴冠","y":800,"q":"800年、フランク王カール（カール大帝）にローマ皇帝の冠を与えた教皇はだれですか。","c":["レオ3世","グレゴリウス7世","インノケンティウス3世","ウルバヌス2世"],"e":"800年のクリスマスに、教皇レオ3世がカールにローマ皇帝の冠を与えました。これによりローマ＝カトリック教会はビザンツ皇帝から自立する保護者を得て、ローマ文化・キリスト教・ゲルマン的要素が融合した西ヨーロッパ世界が成立したとされます。グレゴリウス7世は叙任権闘争、インノケンティウス3世は教皇権の絶頂期、ウルバヌス2世は十字軍の提唱で知られる教皇です。","m":"800年カールの戴冠＝レオ3世"},{"id":13,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"ノルマン人の活動","y":911,"q":"ノルマン人の活動について述べた文として正しいものはどれですか。","c":["首長ロロが北フランスにノルマンディー公国を建てた。","首長リューリクの一派が、イングランドにデーン朝を開いた。","クヌートが南イタリアに渡り、シチリア王国を建てた。","ノルマンディー公ウィリアムがイングランドを征服し、プランタジネット朝を開いた。"],"e":"911年、ロロは西フランク王から領地を与えられ、ノルマンディー公国を建てました。リューリクはロシアのノヴゴロド国の建国者とされます。イングランドにデーン朝を開いたのはデンマークのクヌートで、シチリア王国（両シチリア王国）を建てたのはルッジェーロ2世です。ノルマンディー公ウィリアムが1066年のイングランド征服で開いたのはノルマン朝で、プランタジネット朝はヘンリ2世が開きました。","m":"ノルマンディー公国（911）→ノルマン朝（1066）"},{"id":14,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"ビザンツ帝国の歴史","y":534,"q":"ビザンツ帝国について述べた文として正しいものはどれですか。","c":["ユスティニアヌス帝は、トリボニアヌスらに『ローマ法大全』を編纂させた。","ユスティニアヌス帝は、イベリア半島の西ゴート王国を滅ぼした。","ヘラクレイオス1世が聖像禁止令を出し、ローマ教会との対立を深めた。","ビザンツ帝国は、1453年にセルジューク朝によって滅ぼされた。"],"e":"6世紀のユスティニアヌス帝は、法学者トリボニアヌスらに『ローマ法大全』を編纂させ、ハギア＝ソフィア聖堂を再建しました。彼が滅ぼしたのは北アフリカのヴァンダル王国とイタリアの東ゴート王国で、西ゴート王国は711年にウマイヤ朝に滅ぼされました。聖像禁止令（726年）を出したのはレオン3世です。1453年に帝国を滅ぼしたのはオスマン帝国のメフメト2世です。","m":"ユスティニアヌス＝ローマ法大全、聖像禁止令＝レオン3世"},{"id":15,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"叙任権闘争と十字軍","y":1095,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　皇帝ハインリヒ4世が、カノッサで教皇グレゴリウス7世に破門の解除を願った。\nイ　ヴォルムス協約が結ばれ、叙任権闘争が妥協により収まった。\nウ　クレルモン宗教会議で、教皇ウルバヌス2世が聖地回復の遠征を提唱した。","c":["ア→ウ→イ","ウ→ア→イ","ア→イ→ウ","イ→ア→ウ"],"e":"聖職叙任権をめぐって皇帝と教皇が対立し、1077年に破門されたハインリヒ4世がカノッサで許しを請いました（カノッサの屈辱）。1095年にはウルバヌス2世がクレルモン宗教会議で十字軍を提唱し、翌年第1回十字軍が出発しました。1122年のヴォルムス協約で、教皇が聖職叙任権をもつことが確認され、叙任権闘争は終わりました。","m":"1077カノッサ→1095クレルモン→1122ヴォルムス"},{"id":16,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"インノケンティウス3世","y":1209,"q":"13世紀初めに教皇権の絶頂期を築き、「教皇は太陽、皇帝は月」と述べたとされ、イギリス王ジョンを破門した教皇はだれですか。","c":["インノケンティウス3世","ボニファティウス8世","グレゴリウス7世","レオ10世"],"e":"インノケンティウス3世はイギリス王ジョンやフランス王フィリップ2世を屈服させ、第4回十字軍を提唱するなど、教皇権を最も強めた教皇です。ボニファティウス8世はフランス王と争いアナーニ事件で屈辱を受け、教皇権の衰退を示しました。グレゴリウス7世は叙任権闘争を進めた教皇、レオ10世は贖宥状を販売してルターの批判を招いた教皇です。","m":"教皇は太陽、皇帝は月＝インノケンティウス3世"},{"id":17,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"アナーニ事件と教皇権の衰退","y":1303,"q":"1303年のアナーニ事件で対立した、国王と教皇の組合せとして正しいものはどれですか。","c":["フランス王フィリップ4世―教皇ボニファティウス8世","フランス王フィリップ2世―教皇インノケンティウス3世","フランス王ルイ9世―教皇グレゴリウス7世","神聖ローマ皇帝ハインリヒ4世―教皇ボニファティウス8世"],"e":"聖職者への課税をめぐって教皇ボニファティウス8世と対立したフランス王フィリップ4世は、三部会を開いて国内の支持を集め、1303年に教皇をアナーニで捕らえました。その後、教皇庁は南フランスのアヴィニョンに移されました（教皇のバビロン捕囚）。フィリップ2世とインノケンティウス3世は13世紀初め、ハインリヒ4世とグレゴリウス7世は叙任権闘争の当事者です。","m":"アナーニ事件＝フィリップ4世vsボニファティウス8世"},{"id":18,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"ハンザ同盟と中世都市","y":1350,"q":"中世ヨーロッパで、北ドイツの諸都市が結成し、バルト海・北海交易を支配したハンザ同盟の盟主となった都市はどこですか。","c":["リューベック","ミラノ","ヴェネツィア","ノヴゴロド"],"e":"ハンザ同盟はリューベックを盟主とする北ドイツ諸都市の同盟で、ロンドン・ブリュージュ・ベルゲン・ノヴゴロドに在外商館を置き、海産物・木材・穀物などの北方交易を支配しました。ノヴゴロドは商館が置かれた都市で盟主ではありません。ミラノは北イタリアのロンバルディア同盟の中心、ヴェネツィアは東方貿易（レヴァント貿易）で栄えた都市です。","m":"ハンザ＝リューベック、ロンバルディア＝ミラノ"},{"id":19,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"百年戦争","y":1429,"q":"百年戦争について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）イギリス王エドワード3世がフランスの王位継承権を主張したことが、開戦のきっかけとなった。\n（イ）戦争の終結後、イギリスではばら戦争が起こり、その後テューダー朝が開かれた。","c":["（ア）正（イ）正","（ア）正（イ）誤","（ア）誤（イ）正","（ア）誤（イ）誤"],"e":"（ア）は正しい文です。カペー朝が断絶してヴァロワ朝が成立すると、エドワード3世が母方の血統を理由に王位を主張し、毛織物産地フランドルの支配権争いもからんで1339年に開戦しました。（イ）も正しい文です。戦争はジャンヌ＝ダルクの活躍などでフランスが勝利し、イギリスではランカスター家とヨーク家のばら戦争（1455〜85年）を経てヘンリ7世がテューダー朝を開きました。","m":"百年戦争→ばら戦争→テューダー朝"},{"id":20,"k":"plan","ref":"想定問題","f":"オリエント・ヨーロッパ 古代・中世","t":"中世ヨーロッパの文化","y":1270,"q":"中世ヨーロッパの文化について述べた文として正しいものはどれですか。","c":["トマス＝アクィナスが『神学大全』を著し、スコラ学を大成した。","ロジャー＝ベーコンが普遍論争で唯名論を唱え、スコラ学を大成した。","ピサ大聖堂は、尖頭アーチとステンドグラスを特徴とするゴシック様式の代表である。","『ローランの歌』は、ドイツの英雄を描いた騎士道物語である。"],"e":"トマス＝アクィナスは、アリストテレス哲学を取り入れて信仰と理性の調和をはかり、『神学大全』でスコラ学を大成しました。ロジャー＝ベーコンは観察と実験を重視した人物で、唯名論の代表はウィリアム＝オブ＝オッカムです。ピサ大聖堂は厚い壁と半円アーチのロマネスク様式です。『ローランの歌』はカール大帝時代のフランスの騎士を描いた物語で、ドイツの代表作は『ニーベルンゲンの歌』です。","m":"スコラ学大成＝トマス＝アクィナス『神学大全』"},{"id":21,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"ルネサンスの文学と思想","y":1513,"q":"ルネサンス期の人物とその著作の組合せとして正しいものはどれですか。","c":["マキァヴェリ―『君主論』","ボッカチオ―『神曲』","エラスムス―『ユートピア』","ペトラルカ―『デカメロン』"],"e":"マキァヴェリはフィレンツェの外交官で、『君主論』において宗教や道徳から切り離した現実的な政治のあり方を論じました。『神曲』はダンテがトスカナ語で書いた作品、『デカメロン』はボッカチオの作品です。『ユートピア』はイギリスのトマス＝モアが囲い込みを批判した作品で、エラスムスは『愚神礼賛』で教会の腐敗を風刺しました。ペトラルカは叙情詩で知られる人文主義者です。","m":"君主論＝マキァヴェリ、ユートピア＝モア、愚神礼賛＝エラスムス"},{"id":22,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"ルターの宗教改革","y":1517,"q":"ドイツの宗教改革について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）ルターは、贖宥状（免罪符）の販売を批判して「九十五か条の論題」を発表した。\n（イ）アウクスブルクの和議により、ルター派・カルヴァン派を問わず、個人に信仰の自由が認められた。","c":["（ア）正（イ）誤","（ア）正（イ）正","（ア）誤（イ）正","（ア）誤（イ）誤"],"e":"（ア）は正しい文です。1517年、ルターは教皇レオ10世の許可した贖宥状販売を批判し、信仰によってのみ救われると説きました。（イ）は誤りです。1555年のアウクスブルクの和議で認められたのは、諸侯がカトリックかルター派かを選ぶ権利であり、領民はその選択に従いました。個人の信仰の自由ではなく、カルヴァン派も公認されませんでした（カルヴァン派の公認は1648年のウェストファリア条約）。","m":"アウクスブルクの和議＝諸侯が選ぶ（ルター派のみ）"},{"id":23,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"カルヴァンの宗教改革","y":1541,"q":"予定説を唱え、16世紀半ばにスイスのある都市で神権政治をおこなったカルヴァンの活動拠点はどこですか。","c":["ジュネーヴ","チューリヒ","ヴィッテンベルク","アウクスブルク"],"e":"フランス出身のカルヴァンはジュネーヴで宗教改革を指導し、救われる人はあらかじめ神によって決められているとする予定説を唱えました。勤労と蓄財を肯定する考え方は商工業者に受け入れられ、フランスのユグノーやイギリスのピューリタンなどに広がりました。チューリヒはツヴィングリ、ヴィッテンベルクはルターの拠点で、アウクスブルクは1555年の和議が結ばれた都市です。","m":"カルヴァン＝ジュネーヴ・予定説"},{"id":24,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"大航海時代の航海者","y":1498,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　カブラルがブラジルに漂着し、ポルトガル領とした。\nイ　バルトロメウ＝ディアスがアフリカ南端の喜望峰に到達した。\nウ　ヴァスコ＝ダ＝ガマがインド西岸のカリカットに到達した。","c":["イ→ウ→ア","ウ→イ→ア","イ→ア→ウ","ア→イ→ウ"],"e":"ポルトガルはエンリケ航海王子以来アフリカ西岸の探検を進め、1488年にディアスが喜望峰に到達しました。1498年にはヴァスコ＝ダ＝ガマが喜望峰を回ってカリカットに着き、インド航路を開きました。続く1500年、インドへ向かったカブラルがブラジルに漂着し、ブラジルはポルトガル領となりました。なお、コロンブスのサンサルバドル島到達は1492年です。","m":"1488喜望峰→1498カリカット→1500ブラジル"},{"id":25,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"ウェストファリア条約","y":1648,"q":"三十年戦争を終わらせたウェストファリア条約について述べた文として正しいものはどれですか。","c":["オランダとスイスの独立が国際的に承認された。","神聖ローマ帝国の皇帝権が強まり、諸侯は主権を失った。","スウェーデンがアルザスの大部分を獲得した。","この戦争でフランスは旧教国として皇帝の側について参戦した。"],"e":"1648年のウェストファリア条約で、オランダ（ネーデルラント連邦共和国）とスイスの独立が正式に認められました。ドイツの諸侯はほぼ完全な主権を認められ、神聖ローマ帝国は有名無実化しました。アルザスを得たのはフランスで、スウェーデンは西ポンメルンを得ました。フランスはカトリック国でしたが、ハプスブルク家に対抗するため新教側に立って参戦しました。","m":"ウェストファリア条約＝蘭・瑞西の独立承認、帝国の形骸化"},{"id":26,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"イギリス革命","y":1651,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　共和政のもとで航海法が制定され、オランダの中継貿易に打撃を与えた。\nイ　議会が国王チャールズ1世に権利の請願を提出した。\nウ　名誉革命の結果、議会の権利を確認する権利の章典が制定された。","c":["イ→ア→ウ","ア→イ→ウ","イ→ウ→ア","ウ→イ→ア"],"e":"1628年、議会は課税や不当な逮捕に議会の同意を求める権利の請願をチャールズ1世に提出しました。その後ピューリタン革命で国王が処刑され、共和政のもとで1651年に航海法が出され、第1次英蘭戦争の原因となりました。王政復古を経て、1688〜89年の名誉革命でウィリアム3世とメアリ2世が即位し、権利の章典が制定されて立憲君主政の基礎が築かれました。","m":"権利の請願1628→航海法1651→権利の章典1689"},{"id":27,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"ルイ14世と重商主義","y":1665,"q":"フランス国王ルイ14世の財務総監として、王立マニュファクチュアの育成や東インド会社の再建など、重商主義政策を進めた人物はだれですか。","c":["コルベール","マザラン","リシュリュー","テュルゴー"],"e":"コルベールはルイ14世の財務総監として、輸出を増やし輸入をおさえる重商主義政策を進めました。マザランはルイ14世の幼少期の宰相で、フロンドの乱を鎮圧しました。リシュリューはルイ13世の宰相で、三部会の招集を停止し、三十年戦争に介入しました。テュルゴーはルイ16世の財務総監で、重農主義の立場から財政改革を試みた人物です。","m":"ルイ14世の重商主義＝コルベール"},{"id":28,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"プロイセンの啓蒙専制君主","y":1740,"q":"プロイセン王フリードリヒ2世について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）オーストリア継承戦争で、マリア＝テレジアと争ってシュレジエンを獲得した。\n（イ）「君主は国家第一の僕」と述べ、啓蒙専制君主として上からの近代化を進めた。","c":["（ア）正（イ）正","（ア）正（イ）誤","（ア）誤（イ）正","（ア）誤（イ）誤"],"e":"（ア）は正しい文です。1740年にマリア＝テレジアがハプスブルク家の領土を継ぐと、フリードリヒ2世はこれに異議を唱えてオーストリア継承戦争を起こし、資源の豊かなシュレジエンを獲得しました。（イ）も正しい文です。彼はヴォルテールと交流し、宗教寛容や産業育成を進めました。ポツダムにロココ様式のサンスーシ宮殿を建てたことでも知られます。","m":"フリードリヒ2世＝シュレジエン獲得・国家第一の僕"},{"id":29,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"ピョートル1世","y":1703,"q":"北方戦争でスウェーデンのカール12世を破り、バルト海沿岸に新しい都ペテルブルクを建設したロシアの君主はだれですか。","c":["ピョートル1世","エカチェリーナ2世","イヴァン4世","アレクサンドル1世"],"e":"ピョートル1世（大帝）は西欧化政策を進め、北方戦争でスウェーデンを破ってバルト海への出口を確保し、ペテルブルクを建設して遷都しました。また清とネルチンスク条約を結びました。エカチェリーナ2世は18世紀後半の女帝で、ポーランド分割やプガチョフの農民反乱の鎮圧で知られます。イヴァン4世は16世紀にツァーリの称号を正式に用いた君主、アレクサンドル1世はナポレオンと戦った皇帝です。","m":"ピョートル1世＝北方戦争・ペテルブルク建設"},{"id":30,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"アメリカ独立革命","y":1775,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　パリ条約が結ばれ、イギリスがアメリカ合衆国の独立を承認した。\nイ　レキシントンとコンコードで、植民地民兵とイギリス軍が衝突した。\nウ　イギリス本国が印紙法を定め、植民地の人々は「代表なくして課税なし」と反発した。","c":["ウ→イ→ア","イ→ウ→ア","ウ→ア→イ","イ→ア→ウ"],"e":"七年戦争後に財政難となったイギリスは、1765年に印紙法を制定して植民地に課税し、強い反発を受けました。1773年のボストン茶会事件を経て、1775年にレキシントン・コンコードの戦いで独立戦争が始まり、翌1776年に独立宣言が発表されました。ヨークタウンの戦いの後、1783年のパリ条約でイギリスは独立を承認し、ミシシッピ川以東のルイジアナを割譲しました。","m":"1765印紙法→1775開戦→1776独立宣言→1783パリ条約"},{"id":31,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"フランス革命の展開","y":1792,"q":"フランス革命について述べた文として誤っているものはどれですか。","c":["国民公会が1791年憲法を制定し、立憲君主政を定めた。","1789年8月、国民議会は人権宣言を採択した。","国民公会は王政を廃止し、共和政の樹立を宣言した。","テルミドールの反動（9日のクーデタ）により、ロベスピエールが処刑された。"],"e":"1791年憲法を制定したのは国民議会（憲法制定国民議会）で、制限選挙にもとづく立憲君主政を定めました。この憲法のもとで立法議会が開かれ、1792年に男性普通選挙で選ばれた国民公会が王政を廃止して共和政を宣言しました（第一共和政）。人権宣言は1789年8月に国民議会が採択したものです。ジャコバン派の恐怖政治は1794年のテルミドールの反動で終わり、ロベスピエールは処刑されました。","m":"国民議会→立法議会→国民公会（共和政）→総裁政府"},{"id":32,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"ナポレオンの大陸支配","y":1806,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　ナポレオンがベルリンで大陸封鎖令を出した。\nイ　ナポレオンのロシア遠征が失敗に終わった。\nウ　アウステルリッツの戦い（三帝会戦）で、フランス軍がオーストリア・ロシア連合軍を破った。","c":["ウ→ア→イ","ア→ウ→イ","ウ→イ→ア","ア→イ→ウ"],"e":"1804年に皇帝となったナポレオンは、1805年のアウステルリッツの戦いでオーストリア・ロシア連合軍に勝利し、翌1806年にライン同盟を結成させて神聖ローマ帝国を消滅させました。同年、プロイセンを破ってベルリンで大陸封鎖令を出し、イギリスとの通商を禁じました。これを破ったロシアに対して1812年に遠征しましたが失敗し、没落のきっかけとなりました。","m":"1805三帝会戦→1806大陸封鎖令→1812ロシア遠征"},{"id":33,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"ウィーン会議","y":1814,"q":"ウィーン会議で、フランス革命前の各国の王朝と領土を正統とする「正統主義」を唱えたフランス代表はだれですか。","c":["タレーラン","メッテルニヒ","カニング","カスルレー"],"e":"タレーランはフランス外相としてウィーン会議に参加し、正統主義を唱えて敗戦国フランスの立場を守りました。メッテルニヒはオーストリアの外相（のち宰相）で会議を主宰し、ウィーン体制の中心となった人物です。カスルレーはウィーン会議のイギリス代表、カニングはのちのイギリス外相で、ラテンアメリカ諸国の独立を支持してウィーン体制から距離をとりました。","m":"正統主義＝タレーラン、会議の主宰＝メッテルニヒ"},{"id":34,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"産業革命の技術革新","y":1769,"q":"イギリス産業革命期の人物とその発明・改良の組合せとして正しいものはどれですか。","c":["ワット―蒸気機関の改良","カートライト―ミュール紡績機","ハーグリーヴズ―水力紡績機","スティーヴンソン―飛び杼"],"e":"ワットはニューコメンの蒸気機関を改良し、その動力は紡績や機械工業に広く使われました。ミュール紡績機はクロンプトン、水力紡績機はアークライトの発明で、ハーグリーヴズはジェニー紡績機を発明しました。カートライトは力織機の発明者です。飛び杼は18世紀前半にジョン＝ケイが発明したもので、スティーヴンソンは蒸気機関車を実用化し、1825年に鉄道の営業運転を始めました。","m":"ケイ（飛び杼）→ハーグリーヴズ→アークライト→クロンプトン"},{"id":35,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"イギリスの自由主義改革","y":1832,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　穀物法が廃止され、自由貿易体制への転換が進んだ。\nイ　第1回選挙法改正が行われ、産業資本家などに選挙権が拡大した。\nウ　カトリック教徒解放法が制定された。","c":["ウ→イ→ア","イ→ウ→ア","ウ→ア→イ","イ→ア→ウ"],"e":"1829年にカトリック教徒解放法が成立し、カトリック教徒も公職につけるようになりました。1832年の第1回選挙法改正では腐敗選挙区が廃止され、産業資本家などの中産階級に選挙権が広がりましたが、労働者は除かれたためチャーティスト運動が起こりました。1846年にはコブデン・ブライトらの運動で穀物法が廃止され、1849年の航海法廃止とともに自由貿易体制が確立しました。","m":"1829カトリック解放→1832選挙法改正→1846穀物法廃止"},{"id":36,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"イタリアの統一","y":1860,"q":"イタリアの統一について述べた文として正しいものはどれですか。","c":["ガリバルディは両シチリア王国を占領し、その地をサルデーニャ王に献上した。","マッツィーニはサルデーニャ王国の首相として、フランスと結んでオーストリアと戦った。","イタリア王国は、成立した時点でヴェネツィアとローマを領土に含んでいた。","ヴィットーリオ＝エマヌエーレ2世は、共和主義をかかげる「青年イタリア」を結成した。"],"e":"1860年、ガリバルディは千人隊（赤シャツ隊）を率いて両シチリア王国を占領し、サルデーニャ王に献上しました。これにより1861年にイタリア王国が成立しました。フランスと結んでオーストリアと戦ったサルデーニャ首相はカヴールです。ヴェネツィアは1866年、ローマ教皇領は1870年に併合されました。「青年イタリア」を結成したのは共和主義者のマッツィーニです。","m":"カヴール（首相）＋ガリバルディ（南部献上）→1861王国"},{"id":37,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"ドイツの統一","y":1871,"q":"ドイツの統一について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）プロイセン＝オーストリア戦争の結果、オーストリアを盟主とする北ドイツ連邦が結成された。\n（イ）プロイセン＝フランス戦争のさなか、ヴェルサイユ宮殿でプロイセン王がドイツ皇帝に即位した。","c":["（ア）誤（イ）正","（ア）正（イ）正","（ア）正（イ）誤","（ア）誤（イ）誤"],"e":"（ア）は誤りです。1866年のプロイセン＝オーストリア戦争に勝ったプロイセンは、オーストリアを除いてプロイセンを盟主とする北ドイツ連邦を結成しました。（イ）は正しい文です。ビスマルクはプロイセン＝フランス戦争（1870〜71年）でナポレオン3世を降伏させ、1871年1月にヴェルサイユ宮殿の鏡の間でヴィルヘルム1世がドイツ皇帝に即位し、ドイツ帝国が成立しました。","m":"北ドイツ連邦の盟主はプロイセン、帝国成立はヴェルサイユ"},{"id":38,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"アメリカ南北戦争","y":1863,"q":"アメリカ南北戦争について述べた文として正しいものはどれですか。","c":["リンカン大統領は、戦争中に奴隷解放宣言を発表した。","南部は、自国の工業を守るため保護関税政策を強く求めた。","南部諸州はアメリカ連合国を結成し、首都をワシントンに置いた。","北部は、自由貿易と奴隷制の拡大を主張した。"],"e":"1863年、リンカンは奴隷解放宣言を出して内外の世論を味方につけ、同年のゲティスバーグの戦いの後、北部が優勢となりました。綿花をイギリスに輸出していた南部は自由貿易と奴隷制の維持・拡大を求め、工業化が進んでいた北部は保護関税政策と奴隷制の拡大反対を主張しました。南部のアメリカ連合国の首都はリッチモンドで、大統領はジェファソン＝デヴィスです。","m":"北部＝保護関税・反奴隷制拡大、南部＝自由貿易・奴隷制"},{"id":39,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"アメリカ合衆国の領土拡大","y":1848,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　スペインからフロリダを買収した。\nイ　アメリカ＝メキシコ戦争の結果、カリフォルニアを獲得した。\nウ　フランスからミシシッピ川以西のルイジアナを買収した。","c":["ウ→ア→イ","ア→ウ→イ","ウ→イ→ア","ア→イ→ウ"],"e":"1803年、ジェファソン大統領のときにナポレオンからルイジアナを買収しました。1819年にはスペインからフロリダを買収し、1845年にテキサスを併合しました。続く1846〜48年のアメリカ＝メキシコ戦争で勝利してカリフォルニアなどを獲得し、直後にゴールドラッシュが起こりました。1867年にはロシアからアラスカを買収しています。","m":"1803ルイジアナ→1819フロリダ→1845テキサス→1848カリフォルニア"},{"id":40,"k":"plan","ref":"想定問題","f":"ヨーロッパ・アメリカ 近世・近代","t":"19世紀の学問と芸術","y":1859,"q":"19世紀の人物とその業績の組合せとして正しいものはどれですか。","c":["ダーウィン―『種の起源』","マルクス―『諸国民の富（国富論）』","ランケ―『純粋理性批判』","ミレー―「民衆を導く自由の女神」"],"e":"ダーウィンは1859年に『種の起源』を著し、自然選択による進化論を唱えました。『諸国民の富』は18世紀のアダム＝スミスの著作で、マルクスは『資本論』を書きました。『純粋理性批判』は18世紀のカントの著作で、ランケは史料批判にもとづく近代歴史学を確立した人物です。「民衆を導く自由の女神」はロマン主義のドラクロワが七月革命を描いた作品で、ミレーは「落ち穂拾い」などで知られる自然主義の画家です。","m":"進化論＝ダーウィン、自由の女神＝ドラクロワ"},{"id":41,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"殷・周の社会","y":-1300,"q":"殷・周の時代について述べた文として正しいものはどれですか。","c":["殷では、神意を占った結果を亀甲や獣骨に甲骨文字で刻んだ。","周は、異民族の侵入を受けて都を洛邑から鎬京に移した。","周の封建制では、血縁と無関係に、能力によって諸侯が選ばれた。","春秋時代の末に、秦の始皇帝が中国を統一した。"],"e":"殷は祭政一致の神権政治を行い、王が占いで神意を問い、その結果を甲骨文字で記録しました。これが漢字の起源です。周は前770年に異民族の侵入を受けて都を鎬京から洛邑に移し（東周）、春秋時代が始まりました。周の封建制は一族や功臣に封土を与え、宗法という血縁の秩序で結びついたものです。秦の統一は戦国時代の末、前221年です。","m":"殷＝甲骨文字、周＝封建制と宗法、前770鎬京→洛邑"},{"id":42,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"諸子百家","y":-300,"q":"諸子百家の人物と、その思想・学派の組合せとして正しいものはどれですか。","c":["韓非―法家","孟子―性悪説","墨子―無為自然","荘子―兼愛・非攻"],"e":"韓非は荀子に学び、法による厳格な統治を説いた法家の大成者で、その思想は秦で採用されました。性悪説を唱えたのは荀子で、孟子は性善説と王道政治を説きました。無為自然は老子・荘子の道家の思想です。兼愛（無差別の愛）と非攻（侵略戦争の否定）を説いたのは墨子で、その学派は墨家と呼ばれます。","m":"性善＝孟子、性悪＝荀子→弟子の韓非が法家"},{"id":43,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"秦の始皇帝の政策","y":-221,"q":"秦の始皇帝が行った政策として誤っているものはどれですか。","c":["均田制を施行し、農民に土地を割り当てた。","郡県制を全国に施行した。","度量衡・貨幣・文字を統一した。","焚書・坑儒によって思想を統制した。"],"e":"始皇帝は前221年に中国を統一し、全国に郡県制をしいて中央から官吏を派遣しました。また度量衡・貨幣（半両銭）・文字を統一し、法家の思想にもとづいて焚書・坑儒による思想統制を行いました。均田制は5世紀末に北魏の孝文帝が始めた土地制度で、隋・唐に受け継がれました。始皇帝の急激な統一政策と土木工事は反発を招き、死後に陳勝・呉広の乱が起こりました。","m":"均田制は北魏孝文帝→隋唐へ"},{"id":44,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"漢の武帝","y":-139,"q":"前漢の武帝について述べた文として正しいものはどれですか。","c":["匈奴を挟み撃ちにするため、張騫を大月氏に派遣した。","財政を立て直すため均輸・平準を廃止した。","官吏登用のため九品中正を始めた。","朝鮮半島を支配するため安東都護府を置いた。"],"e":"武帝は匈奴への対抗策として張騫を大月氏に派遣し、その結果西域の事情が中国に伝わりました。また朝鮮に楽浪郡などの4郡を置き、南越を滅ぼして南海郡などを置きました。遠征による財政難には、塩・鉄・酒の専売や均輸・平準の実施で対応しました。九品中正は魏の文帝（曹丕）が始めた制度です。安東都護府は唐が高句麗を滅ぼしたのちに置いた機関です。","m":"武帝＝張騫派遣・楽浪郡・塩鉄専売・均輸平準"},{"id":45,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"魏晋南北朝の動乱","y":300,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　北魏の孝文帝が、都を平城から洛陽に移した。\nイ　西晋で帝位をめぐる八王の乱が起こった。\nウ　太平道の張角が指導する黄巾の乱が起こった。","c":["ウ→イ→ア","イ→ウ→ア","ウ→ア→イ","イ→ア→ウ"],"e":"184年、宗教結社の太平道を率いる張角が黄巾の乱を起こし、後漢は衰退して三国時代に入りました。三国を統一した西晋では、290年ごろから一族の諸王が争う八王の乱が起こり、これに乗じて五胡が台頭しました。華北を統一した鮮卑の北魏では、孝文帝が漢化政策を進め、494年に都を平城から洛陽に移しました。","m":"184黄巾の乱→八王の乱→494洛陽遷都"},{"id":46,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"唐の両税法","y":780,"q":"唐の中期、均田制の崩壊を受けて、780年に租調庸制にかえて、現住地で所有する土地や資産に応じて夏と秋に課税する両税法を採用させた宰相はだれですか。","c":["楊炎","王安石","張居正","安禄山"],"e":"安史の乱の後、均田制と租調庸制は維持できなくなり、宰相楊炎の献策により780年に両税法が施行されました。これは土地所有を事実上認める転換でした。王安石は北宋の神宗のもとで新法を行った宰相、張居正は明の万暦帝の初期に一条鞭法を全国に広めた政治家です。安禄山はソグド系の節度使で、755年に安史の乱を起こしました。","m":"両税法780＝楊炎（安史の乱の後）"},{"id":47,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"王安石の新法","y":1069,"q":"北宋の王安石の改革について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）青苗法では、中小農民に低利で穀物や資金を貸し付けた。\n（イ）王安石を宰相に登用して改革を進めさせたのは、神宗である。","c":["（ア）正（イ）正","（ア）正（イ）誤","（ア）誤（イ）正","（ア）誤（イ）誤"],"e":"（ア）は正しい文です。青苗法は端境期に農民へ低利で貸し付けて高利貸しから守る政策で、ほかに中小商人を保護する市易法、農民を兵として訓練する保甲法などがありました。（イ）も正しい文です。神宗が王安石を登用しましたが、大地主や大商人の利益を損なう新法には司馬光ら旧法党が反対し、新法党と旧法党の争いが長く続きました。","m":"神宗＋王安石の新法 vs 司馬光の旧法党"},{"id":48,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"宋代の商業と紙幣","y":1024,"q":"宋代には商業が発達し、銅銭の不足を補うために紙幣も使われました。北宋で発行された紙幣として正しいものはどれですか。","c":["交子","交鈔","大明宝鈔","開元通宝"],"e":"交子は北宋で発行された紙幣で、南宋では会子が使われました。交鈔は金や元で発行された紙幣で、とくに元では主要な通貨とされました。大明宝鈔は明の洪武帝の時代に発行された紙幣です。開元通宝は唐の初めに鋳造された銅銭です。宋代には草市や鎮といった商業の中心地が生まれ、行（商人の同業組合）や作（手工業者の同業組合）も結成されました。","m":"北宋＝交子、南宋＝会子、金・元＝交鈔"},{"id":49,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"元の支配と東西交流","y":1271,"q":"元について述べた文として正しいものはどれですか。","c":["フビライは国号を元と定め、都を大都においた。","元は中国を支配した期間、科挙を一度も実施しなかった。","元では、モンゴル人に次ぐ地位を漢人（旧金の支配下の人々）に与えた。","イブン＝バットゥータは、元に仕えた体験をもとに『世界の記述（東方見聞録）』を著した。"],"e":"フビライは1271年に国号を元とし、大都（現在の北京）を都としました。元は科挙を一時停止しましたが、1315年に再開しています。支配層のモンゴル人に次いで、中央アジア・西アジア出身の色目人が財務などで重用され、漢人・南人はその下に置かれました。『世界の記述』はヴェネツィア出身のマルコ＝ポーロの口述によるもので、イブン＝バットゥータは『三大陸周遊記』を残しました。","m":"モンゴル人→色目人→漢人→南人、都は大都"},{"id":50,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"永楽帝と鄭和の遠征","y":1405,"q":"ムスリムの宦官である鄭和に命じて、大艦隊による南海遠征を行わせた明の皇帝はだれですか。","c":["永楽帝","洪武帝","万暦帝","正統帝"],"e":"永楽帝は靖難の役で甥の建文帝から帝位を奪い、都を南京から北京に移しました。また鄭和に命じて東南アジア・インド洋沿岸に7回の遠征を行わせ、艦隊の一部はアフリカ東岸まで達し、多くの国に朝貢を促しました。洪武帝は明の建国者で、里甲制や六諭を定めました。万暦帝の時代には張居正の改革や豊臣秀吉の朝鮮侵攻があり、正統帝は土木の変でオイラトに捕らえられた皇帝です。","m":"永楽帝＝北京遷都・鄭和の南海遠征"},{"id":51,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"明の内外の危機","y":1449,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　オイラトのエセンが、土木の変で明の正統帝を捕らえた。\nイ　燕王が靖難の役を起こし、のちに永楽帝として即位した。\nウ　李自成の反乱軍が北京を占領し、明が滅亡した。","c":["イ→ア→ウ","ア→イ→ウ","イ→ウ→ア","ア→ウ→イ"],"e":"洪武帝の死後、燕王（のちの永楽帝）が1399年に靖難の役を起こし、甥の建文帝を倒して即位しました。1449年には、モンゴル系のオイラトのエセンが土木の変で正統帝を捕虜とし、明は北方の守りを固めて長城を修築しました。明末には財政難と重税から各地で反乱が起こり、1644年に李自成が北京を占領して明は滅亡しました。","m":"1399靖難の役→1449土木の変→1644明滅亡"},{"id":52,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"清の康熙帝・雍正帝","y":1689,"q":"清の皇帝について述べた文として正しいものはどれですか。","c":["康熙帝は、ロシアとネルチンスク条約を結び国境を定めた。","雍正帝は、呉三桂らが起こした三藩の乱を鎮圧した。","乾隆帝は、ロシアとキャフタ条約を結びモンゴル方面の国境を定めた。","康熙帝は、皇帝直属の諮問機関として軍機処を設置した。"],"e":"康熙帝は1689年にロシアのピョートル1世とネルチンスク条約を結び、アルグン川とスタノヴォイ山脈（外興安嶺）を国境としました。三藩の乱を鎮圧し、台湾の鄭氏を降したのも康熙帝です。キャフタ条約（1727年）を結び、軍機処を設置したのは雍正帝です。乾隆帝はジュンガルを滅ぼして東トルキスタンを新疆とし、清の最大領域を実現しました。","m":"康熙＝ネルチンスク・三藩、雍正＝キャフタ・軍機処"},{"id":53,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"清の税制","y":1720,"q":"清代に施行された、丁税（人頭税）を土地税に繰り込んで一本化した税制はどれですか。","c":["地丁銀制","一条鞭法","両税法","租調庸制"],"e":"地丁銀制は康熙帝の末期に始まり、雍正帝の時代に全国に広がった税制で、丁税を地税に組み込んで銀で納めさせました。これにより人頭税は事実上なくなり、人口が急増する一因となりました。一条鞭法は明代後半に各種の税を銀に一本化した制度、両税法は唐の780年に始まった税制、租調庸制は均田制とむすびついた隋・唐の税制です。","m":"唐＝両税法、明＝一条鞭法、清＝地丁銀制"},{"id":54,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"マウリヤ朝とクシャーナ朝","y":-260,"q":"古代インドの王朝について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）カニシカ王は、マウリヤ朝の最盛期の王である。\n（イ）アショーカ王は仏教を保護し、ダルマ（法）による統治を磨崖碑や石柱碑に刻ませた。","c":["（ア）誤（イ）正","（ア）正（イ）正","（ア）正（イ）誤","（ア）誤（イ）誤"],"e":"（ア）は誤りです。カニシカ王は1〜3世紀に栄えたクシャーナ朝の最盛期の王で、仏教を保護し、この時代にガンダーラ美術や大乗仏教が発展しました。（イ）は正しい文です。マウリヤ朝のアショーカ王はカリンガ国征服での惨禍を悔いて仏教に帰依し、ダルマにもとづく政治を説く詔勅を各地の磨崖碑・石柱碑に刻ませ、第3回仏典結集を行ったとされます。","m":"マウリヤ朝＝アショーカ、クシャーナ朝＝カニシカ"},{"id":55,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"グプタ朝の文化","y":400,"q":"グプタ朝時代のインドについて述べた文として正しいものはどれですか。","c":["カーリダーサが、サンスクリット語で戯曲『シャクンタラー』を著した。","唐から訪れた法顕が、帰国後に『大唐西域記』を著した。","叙事詩『マハーバーラタ』が、ムガル帝国の時代に初めて成立した。","仏教が国教とされ、ヒンドゥー教は厳しく禁止された。"],"e":"グプタ朝ではサンスクリット語が公用語化され、宮廷詩人カーリダーサが『シャクンタラー』を書きました。二大叙事詩『マハーバーラタ』『ラーマーヤナ』もこの頃までに現在の形にまとめられました。ヒンドゥー教が社会に定着した時代で、仏教も保護され、ナーランダー僧院が建てられました。法顕は東晋から訪れて『仏国記』を著した僧で、『大唐西域記』は唐の玄奘の著作です。","m":"法顕（東晋・仏国記）、玄奘（唐・大唐西域記）"},{"id":56,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"ムガル帝国の宗教政策","y":1564,"q":"ムガル帝国について述べた文として正しいものはどれですか。","c":["アクバルは、非ムスリムに課していたジズヤ（人頭税）を廃止した。","アウラングゼーブは、亡き妃のためにタージ＝マハルを建設した。","バーブルは、プラッシーの戦いに勝利して帝国を建てた。","シク教は、アクバルが創始した宗教である。"],"e":"第3代アクバルはヒンドゥー教徒との融和をはかってジズヤを廃止し、マンサブダール制で支配層を組織しました。タージ＝マハルを建てたのは第5代シャー＝ジャハーンで、第6代アウラングゼーブは厳格なスンナ派としてジズヤを復活させ、反発を招きました。バーブルは1526年のパーニーパットの戦いでロディー朝を破って帝国を建てました。シク教はナーナクが創始した宗教です。","m":"アクバル＝ジズヤ廃止、アウラングゼーブ＝ジズヤ復活"},{"id":57,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"東南アジアの遺跡と王朝","y":800,"q":"東南アジアの遺跡と、それを建設した王朝・国家の組合せとして正しいものはどれですか。","c":["ボロブドゥール―シャイレンドラ朝","アンコール＝ワット―マジャパヒト王国","ボロブドゥール―アユタヤ朝","アンコール＝ワット―李朝"],"e":"ボロブドゥールは8〜9世紀にジャワ島中部で栄えたシャイレンドラ朝が建てた大乗仏教の寺院です。アンコール＝ワットはカンボジアのアンコール朝（クメール人の国）が12世紀に建てたヒンドゥー教の寺院で、のちに仏教寺院となりました。マジャパヒト王国はジャワ島東部のヒンドゥー教国、アユタヤ朝はタイの王朝、李朝はベトナム北部の王朝です。","m":"ボロブドゥール＝ジャワ、アンコール＝ワット＝カンボジア"},{"id":58,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"朝鮮王朝と訓民正音","y":1446,"q":"1446年に、朝鮮の言葉を表す独自の文字である訓民正音（ハングル）を公布した朝鮮王朝の国王はだれですか。","c":["世宗","李成桂","王建","高宗"],"e":"世宗は朝鮮王朝の第4代国王で、訓民正音を制定・公布したほか、金属活字による出版や科学技術の振興を進めました。李成桂は倭寇の撃退で名をあげ、1392年に朝鮮王朝を建てた人物です。王建は10世紀に高麗を建てた人物です。高宗は19世紀後半の朝鮮国王で、のちに国号を大韓帝国と改めました。","m":"ハングル（1446）＝世宗、建国（1392）＝李成桂"},{"id":59,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"北方遊牧民の活動","y":-200,"q":"北方の遊牧民について述べた文として正しいものはどれですか。","c":["冒頓単于の時代、匈奴は漢の高祖（劉邦）の軍を破った。","突厥は独自の文字を持たず、記録はすべて漢字で残された。","ウイグルは、安史の乱で反乱軍の側について唐と戦った。","柔然は華北を統一して北魏を建てた。"],"e":"匈奴の冒頓単于は前200年に白登山で劉邦の軍を包囲して破り、漢は匈奴に貢ぎ物を贈る和親策をとりました。突厥は北方遊牧民として初めて独自の文字（突厥文字）を用いました。ウイグルは安史の乱で唐に援軍を送り、反乱の鎮圧を助けました。北魏を建てたのは鮮卑の拓跋氏で、柔然はモンゴル高原で北魏と対立した遊牧国家です。","m":"冒頓単于が劉邦を破る、突厥文字、ウイグルは唐を援助"},{"id":60,"k":"plan","ref":"想定問題","f":"アジア 古代〜近世","t":"明清の学問と文化","y":1650,"q":"明・清の時代の人物と、その業績の組合せとして正しいものはどれですか。","c":["顧炎武―考証学の基礎を築いた","朱熹―陽明学を確立した","司馬光―『史記』を著した","李時珍―『天工開物』を著した"],"e":"顧炎武は明末清初の学者で、実証的に古典を研究する考証学の基礎を築きました。陽明学は明の王守仁（王陽明）が知行合一を説いて確立したもので、朱熹は南宋で朱子学を大成した人物です。『史記』は前漢の司馬遷の著作で、北宋の司馬光は編年体の『資治通鑑』を著しました。李時珍は薬物学の書『本草綱目』を、宋応星が産業技術書『天工開物』を著しました。","m":"本草綱目＝李時珍、天工開物＝宋応星、考証学＝顧炎武"},{"id":61,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"ムハンマドとヒジュラ","y":622,"q":"預言者ムハンマドが、迫害を逃れてメッカからヤスリブ（のちのメディナ）に移住したヒジュラ（聖遷）は何年のできごとですか。","c":["622年","610年","632年","661年"],"e":"ムハンマドは610年ごろ神の啓示を受けたとして布教を始めましたが、メッカの大商人から迫害され、622年にメディナへ移住しました。この年はのちにイスラーム暦（ヒジュラ暦）の元年とされました。630年にメッカを征服し、632年に亡くなりました。661年は第4代カリフのアリーが暗殺され、ムアーウィヤがウマイヤ朝を開いた年です。","m":"610啓示→622ヒジュラ→630メッカ征服→632死去"},{"id":62,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"ウマイヤ朝とシーア派","y":661,"q":"初期のイスラーム世界について述べた文として正しいものはどれですか。","c":["ウマイヤ朝は、シリアのダマスクスを都とした。","アッバース朝は、トゥール・ポワティエ間の戦いでフランク王国を破った。","第4代カリフのアリーとその子孫だけを指導者と認める人々は、スンナ派と呼ばれる。","ウマイヤ朝は、改宗した非アラブ人のジズヤを免除して、アラブ人と完全に平等に扱った。"],"e":"ムアーウィヤが開いたウマイヤ朝はダマスクスを都としました。732年のトゥール・ポワティエ間の戦いでは、ウマイヤ朝軍がフランク王国の宮宰カール＝マルテルに敗れました。アリーとその子孫を指導者とする人々はシーア派です。ウマイヤ朝はアラブ人を優遇し、改宗した非アラブ人（マワーリー）にもジズヤやハラージュを課したため不満を招き、アッバース朝で税制上の平等が実現しました。","m":"ウマイヤ＝ダマスクス・アラブ帝国、アッバース＝バグダード"},{"id":63,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"タラス河畔の戦い","y":751,"q":"751年、アッバース朝の軍が唐の軍を破り、この際に捕虜を通じて製紙法がイスラーム世界に伝わったとされる戦いはどれですか。","c":["タラス河畔の戦い","ニハーヴァンドの戦い","トゥール・ポワティエ間の戦い","アンカラの戦い"],"e":"タラス河畔の戦いは中央アジアでアッバース朝と唐（高仙芝の軍）が戦ったもので、唐の捕虜の中の紙すき職人からサマルカンドに製紙法が伝わったとされます。紙はその後バグダードなどを経てヨーロッパに広まりました。ニハーヴァンドの戦い（642年）はアラブ軍がササン朝を破った戦い、トゥール・ポワティエ間の戦い（732年）はフランク王国がウマイヤ朝を破った戦い、アンカラの戦い（1402年）はティムールがオスマン朝を破った戦いです。","m":"751タラス河畔→製紙法が西へ"},{"id":64,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"イスラーム世界の分裂","y":969,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　セルジューク朝のトゥグリル＝ベクがバグダードに入城した。\nイ　イベリア半島に後ウマイヤ朝が建てられた。\nウ　ファーティマ朝がエジプトを征服し、新都カイロを建設した。","c":["イ→ウ→ア","ウ→イ→ア","イ→ア→ウ","ア→イ→ウ"],"e":"アッバース朝の成立後、ウマイヤ家の一族がイベリア半島に逃れて756年に後ウマイヤ朝を建てました。シーア派のファーティマ朝は北アフリカで建国し、969年にエジプトを征服してカイロを建設しました。トルコ系のセルジューク朝は1055年にバグダードに入城し、アッバース朝カリフからスルタンの称号を授けられました。","m":"756後ウマイヤ→969カイロ建設→1055セルジューク入城"},{"id":65,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"イスラームの学者","y":1180,"q":"イスラーム世界の学者とその業績の組合せとして正しいものはどれですか。","c":["イブン＝ルシュド―アリストテレスの著作の注釈","イブン＝シーナー―『世界史序説』","フワーリズミー―『医学典範』","ガザーリー―『三大陸周遊記』"],"e":"コルドバ出身のイブン＝ルシュド（ラテン名アヴェロエス）はアリストテレス哲学の注釈を著し、中世ヨーロッパのスコラ学に影響を与えました。『世界史序説』はイブン＝ハルドゥーンの著作で、『医学典範』はイブン＝シーナー（アヴィケンナ）がまとめた医学書です。フワーリズミーは代数学を発展させた数学者です。『三大陸周遊記』はイブン＝バットゥータの旅行記で、ガザーリーは神秘主義を理論づけた神学者です。","m":"医学典範＝イブン＝シーナー、アリストテレス注釈＝イブン＝ルシュド"},{"id":66,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"サラーフ＝アッディーン","y":1187,"q":"アイユーブ朝を建て、1187年に十字軍からイェルサレムを奪回し、第3回十字軍とも戦った人物はだれですか。","c":["サラーフ＝アッディーン（サラディン）","バイバルス","トゥグリル＝ベク","ティムール"],"e":"クルド系のサラーフ＝アッディーンはファーティマ朝を倒してアイユーブ朝を建て、1187年にイェルサレムを奪回しました。これに対しイギリス王リチャード1世らの第3回十字軍が起こりましたが、聖地は回復されませんでした。バイバルスはマムルーク朝のスルタンで、モンゴル軍や十字軍と戦いました。トゥグリル＝ベクはセルジューク朝の建国者、ティムールは14世紀後半に中央アジアに帝国を築いた人物です。","m":"アイユーブ朝＝サラディン、イェルサレム奪回1187"},{"id":67,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"マムルーク朝","y":1260,"q":"マムルーク朝について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）カイロを都とし、メッカ・メディナの両聖都を保護した。\n（イ）アンカラの戦いでオスマン軍に敗れ、滅亡した。","c":["（ア）正（イ）誤","（ア）正（イ）正","（ア）誤（イ）正","（ア）誤（イ）誤"],"e":"（ア）は正しい文です。トルコ系などの奴隷軍人（マムルーク）が建てたマムルーク朝はカイロを都とし、両聖都を保護しました。1260年にはモンゴル軍を撃退し、カーリミー商人による紅海・地中海交易で栄えました。（イ）は誤りです。マムルーク朝は1517年にオスマン帝国のセリム1世に滅ぼされました。アンカラの戦いは1402年にオスマン軍がティムール軍に敗れた戦いです。","m":"マムルーク朝はセリム1世が滅ぼす（1517）"},{"id":68,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"オスマン帝国の拡大","y":1529,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　スレイマン1世が、第1次ウィーン包囲を行った。\nイ　メフメト2世が、コンスタンティノープルを攻略した。\nウ　セリム1世が、マムルーク朝を滅ぼした。","c":["イ→ウ→ア","ウ→イ→ア","イ→ア→ウ","ア→イ→ウ"],"e":"1453年、メフメト2世はコンスタンティノープルを攻略してビザンツ帝国を滅ぼし、ここを首都（イスタンブル）としました。1517年にはセリム1世がマムルーク朝を滅ぼし、メッカ・メディナの保護権を得ました。続くスレイマン1世は1526年にモハーチの戦いでハンガリーを破り、1529年に第1次ウィーン包囲を行い、1538年にはプレヴェザの海戦で勝利しました。","m":"1453コンスタンティノープル→1517マムルーク→1529ウィーン"},{"id":69,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"オスマン帝国の統治制度","y":1400,"q":"オスマン帝国で、バルカン半島のキリスト教徒の子弟を強制的に徴集し、改宗・教育したうえで官僚や常備歩兵軍団に登用した制度を何といいますか。","c":["デヴシルメ","ティマール制","イクター制","ミッレト"],"e":"デヴシルメによって集められた若者は、スルタン直属の常備歩兵軍団イェニチェリや官僚となりました。ティマール制は騎士に徴税権を与えて軍役を課す制度、イクター制はブワイフ朝に始まり、軍人に土地からの徴税権を与えた制度です。ミッレトはオスマン帝国のキリスト教徒・ユダヤ教徒などの宗教共同体で、納税を条件に一定の自治が認められました。","m":"デヴシルメ→イェニチェリ、ミッレト＝宗教共同体の自治"},{"id":70,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"サファヴィー朝","y":1598,"q":"サファヴィー朝について述べた文として正しいものはどれですか。","c":["アッバース1世はイスファハーンに都を移し、「イスファハーンは世界の半分」と称されるほど繁栄した。","スンナ派を国教とし、シーア派を厳しく弾圧した。","君主はシャーの称号を用いず、スルタンの称号のみを用いた。","レパントの海戦でスペイン・ヴェネツィアなどの連合艦隊に敗れた。"],"e":"16世紀初めにイスマーイール1世が建てたサファヴィー朝は、シーア派の十二イマーム派を国教とし、君主はイラン古来のシャーの称号を用いました。最盛期のアッバース1世はイスファハーンに遷都し、イマームのモスクなどを建設して都は大いに栄えました。レパントの海戦（1571年）で敗れたのはオスマン帝国です。","m":"サファヴィー朝＝シーア派・シャー・イスファハーン"},{"id":71,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"ティムール朝","y":1370,"q":"14世紀後半に中央アジアで帝国を建て、アンカラの戦いでオスマン軍を破ったティムールが都とした都市はどこですか。","c":["サマルカンド","イスファハーン","タブリーズ","デリー"],"e":"ティムールはチャガタイ＝ハン国の分裂に乗じて自立し、サマルカンドを都として帝国を築きました。1402年のアンカラの戦いではオスマン帝国のバヤジット1世を捕虜にしました。サマルカンドには壮麗なモスクが建てられ、孫のウルグ＝ベクは天文台を建設しました。イスファハーンはサファヴィー朝、タブリーズはサファヴィー朝初期やイル＝ハン国の都、デリーはデリー＝スルタン朝などの都です。","m":"ティムール朝＝サマルカンド、ウルグ＝ベクの天文台"},{"id":72,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"クシュ王国","y":-730,"q":"ナイル川上流のヌビア地方に興り、前8世紀にエジプトを一時支配したのち、都をメロエに移して製鉄と商業で栄えた国はどれですか。","c":["クシュ王国","アクスム王国","ソンガイ王国","モノモタパ王国"],"e":"クシュ王国はアフリカ最古の黒人王国とされ、前8世紀にエジプトを征服しましたが、アッシリアに追われて南に退き、都をメロエに移して製鉄で栄え、独自のメロエ文字も用いました。アクスム王国はエチオピア高原の国で、4世紀にクシュ王国を滅ぼし、キリスト教を受け入れました。ソンガイ王国は西アフリカのニジェール川流域、モノモタパ王国は南部アフリカの国です。","m":"クシュ（メロエ・製鉄）→アクスムが滅ぼす"},{"id":73,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"西アフリカの諸王国","y":1324,"q":"アフリカの諸国家について述べた文として正しいものはどれですか。","c":["マリ王国のマンサ＝ムーサは、メッカ巡礼の際に大量の金を携えて各地で使った。","ガーナ王国は、インド洋交易で栄えた東アフリカ沿岸のスワヒリ都市国家である。","大ジンバブエ遺跡は、西アフリカのソンガイ王国の首都の遺跡である。","アクスム王国は、イスラーム教を国教として建国された。"],"e":"14世紀のマリ王国の王マンサ＝ムーサは、多量の金を携えてメッカに巡礼し、カイロで金の相場が下がったと伝えられます。ガーナ王国はサハラ縦断交易で金と岩塩を取引した西アフリカの国です。大ジンバブエ遺跡は南部アフリカのジンバブエにある石造遺跡で、11〜15世紀ごろにショナ人の国家が築いたとされ、インド洋交易との関わりを示します。アクスム王国は4世紀にキリスト教を受け入れました。","m":"金と塩の交易＝ガーナ→マリ（マンサ＝ムーサ）→ソンガイ"},{"id":74,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"スワヒリ語と東アフリカ交易","y":1300,"q":"東アフリカのマリンディ・モンバサ・キルワなどの港市で、ムスリム商人との交易を通じ、バントゥー系の言語にアラビア語の語彙が加わって成立し、共通語として広まった言語はどれですか。","c":["スワヒリ語","ウルドゥー語","ハウサ語","アフリカーンス語"],"e":"東アフリカの沿岸ではインド洋交易が盛んで、アラブ・イラン系のムスリム商人が来航しました。その結果、現地のバントゥー系言語にアラビア語の語彙が入ってスワヒリ語が成立し、イスラームとの融合によるスワヒリ文化が生まれました。ウルドゥー語はインドのムガル帝国期に成立した言語、ハウサ語は西アフリカの言語、アフリカーンス語は南アフリカでオランダ系移民の言葉から生まれた言語です。","m":"東アフリカ沿岸＝スワヒリ語・スワヒリ文化"},{"id":75,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"アフリカ分割","y":1884,"q":"列強によるアフリカ分割について述べた文として正しいものはどれですか。","c":["ベルリン会議（1884〜85年）で、ある地域を先に実効支配した国がその領有権を得るという原則が確認された。","ファショダ事件では、イギリスが譲歩し、フランスがスーダンを獲得した。","南アフリカ戦争は、イギリスとイタリアがケープ植民地をめぐって争った戦争である。","エチオピアは、アドワの戦いでイギリスに敗れて植民地となった。"],"e":"ビスマルクが主催したベルリン会議では、コンゴ自由国の設立が認められ、先に実効支配を行った国が領有できるという原則が確認され、アフリカ分割が加速しました。1898年のファショダ事件では、フランスが譲歩しイギリスがスーダンを確保しました。南アフリカ戦争はイギリスとブール人（アフリカーナー）の国との戦争です。エチオピアは1896年のアドワの戦いでイタリアを破り、独立を守りました。","m":"ファショダ＝仏が譲歩、アドワ＝エチオピアが伊に勝利"},{"id":76,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"アフリカ諸国の独立","y":1957,"q":"第二次世界大戦後のアフリカについて述べた文として正しいものはどれですか。","c":["1957年、エンクルマ（ンクルマ）の指導のもと、ガーナがイギリスから独立した。","1960年にはアルジェリアを含む17か国が独立し、「アフリカの年」と呼ばれた。","コンゴ動乱は、コンゴがポルトガルから独立した直後に起こった。","アフリカ統一機構（OAU）は、1963年にカイロで結成された。"],"e":"1957年、エンクルマに率いられたガーナがイギリスから独立しました。一般に、サハラ以南のアフリカで黒人が中心となって自力で独立を達成した最初の例とされます。1960年には17か国が独立しましたが、アルジェリアがフランスから独立したのは1962年です。コンゴ動乱はコンゴがベルギーから独立した1960年に始まりました。アフリカ統一機構は1963年にエチオピアのアディスアベバで結成され、2002年にアフリカ連合（AU）へ発展しました。","m":"1957ガーナ→1960アフリカの年→1962アルジェリア→1963OAU"},{"id":77,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"アメリカ大陸の古代文明","y":1450,"q":"アメリカ大陸の文明・国家と、その特色の組合せとして正しいものはどれですか。","c":["インカ帝国―縄の結び目で数量を記録するキープを用いた","アステカ王国―アンデス高地のクスコを都とした","マヤ文明―南アメリカのアンデス山中で栄えた","インカ帝国―湖上の都テノチティトランを築いた"],"e":"インカ帝国はアンデス高地のクスコを都とし、文字はもたず、キープ（結縄）によって数量などを記録しました。また道路網と駅伝制を整えました。アステカ王国はメキシコ高原に栄え、湖上の都テノチティトランを築きました。マヤ文明はユカタン半島などメソアメリカで栄え、マヤ文字や二十進法を用い、精密な暦をつくりました。","m":"インカ＝クスコ・キープ、アステカ＝テノチティトラン"},{"id":78,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"スペインの征服者","y":1521,"q":"16世紀にアメリカ大陸の国家を征服した人物と、その征服された国家の組合せとして正しいものはどれですか。","c":["コルテス―アステカ王国","ピサロ―アステカ王国","コルテス―インカ帝国","カブラル―インカ帝国"],"e":"スペインのコルテスは1521年にアステカ王国を滅ぼし、ピサロは1533年にインカ帝国を滅ぼしました。征服者たちは少人数でしたが、鉄製武器・馬・火器に加え、ヨーロッパから持ちこまれた天然痘などの感染症によって先住民社会は大きな打撃を受けました。カブラルはポルトガル人で、1500年にブラジルに漂着した航海者です。","m":"アステカ＝コルテス、インカ＝ピサロ"},{"id":79,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"ラテンアメリカの独立","y":1804,"q":"19世紀前半のラテンアメリカ諸国の独立について述べた文として正しいものはどれですか。","c":["ハイチはフランスから独立し、世界で最初の黒人共和国となった。","ブラジルはスペインから独立し、共和国となった。","メキシコの独立運動は、シモン＝ボリバルが最初に指導した。","アメリカ合衆国はモンロー教書を発表し、ヨーロッパ諸国の干渉を支持した。"],"e":"フランス領サン＝ドマングでは、トゥサン＝ルヴェルチュールらの指導で黒人奴隷が蜂起し、1804年にハイチとして独立しました。ブラジルはポルトガルの王子が皇帝となって、帝国として独立しました。メキシコの独立運動はイダルゴ神父が始めたもので、ボリバルは南アメリカ北部（大コロンビアなど）の独立を指導しました。1823年のモンロー教書はヨーロッパの干渉に反対するものでした。","m":"1804ハイチ（初の黒人共和国）、ブラジルは帝国として独立"},{"id":80,"k":"plan","ref":"想定問題","f":"イスラーム・アフリカ・ラテンアメリカ","t":"20世紀のラテンアメリカ","y":1959,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　カストロらが親米のバティスタ政権を倒し、キューバ革命が成功した。\nイ　ディアス独裁政権に対する反発からメキシコ革命が始まった。\nウ　チリで軍部のクーデタが起こり、アジェンデ政権が倒された。","c":["イ→ア→ウ","ア→イ→ウ","イ→ウ→ア","ウ→イ→ア"],"e":"メキシコ革命は1910年にマデロらがディアスの長期独裁に反対して始まり、1917年に土地改革などを定めた憲法が制定されました。キューバ革命は1959年にカストロらがバティスタ政権を倒して成功し、のちキューバは社会主義を宣言しました。チリでは1970年に選挙で社会主義のアジェンデ政権が成立しましたが、1973年にピノチェトらの軍事クーデタで倒されました。","m":"1910メキシコ革命→1959キューバ革命→1973チリのクーデタ"},{"id":81,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"アヘン戦争と南京条約","y":1842,"q":"アヘン戦争の講和条約である南京条約について述べた文として正しいものはどれですか。","c":["香港島がイギリスに割譲された。","外国公使の北京駐在が認められた。","天津をはじめとする華北の5港が開港された。","九竜半島の南部がイギリスに割譲された。"],"e":"1842年の南京条約では、香港島の割譲、広州・厦門・福州・寧波・上海の5港の開港、公行の廃止などが定められました。いずれも華中・華南の港です。外国公使の北京駐在は天津条約（1858年）で認められ、北京条約（1860年）で確定しました。九竜半島南部の割譲や天津の開港は北京条約で定められたものです。翌1843年には虎門寨追加条約で領事裁判権などが認められました。","m":"南京条約＝香港島・5港開港、北京条約＝九竜南部・天津"},{"id":82,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"太平天国","y":1851,"q":"太平天国について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）太平天国は「扶清滅洋」をスローガンに、外国人やキリスト教会を襲撃した。\n（イ）太平天国は、曽国藩の湘軍や李鴻章の淮軍などによって鎮圧された。","c":["（ア）誤（イ）正","（ア）正（イ）正","（ア）正（イ）誤","（ア）誤（イ）誤"],"e":"（ア）は誤りです。「扶清滅洋」は19世紀末の義和団のスローガンです。洪秀全はキリスト教の影響を受けて上帝会を組織し、1851年に太平天国を建てて「滅満興漢」を掲げ、天朝田畝制度や辮髪の廃止などを打ち出しました。（イ）は正しい文です。太平天国は、漢人官僚が組織した郷勇（湘軍・淮軍）や、外国人が指揮する常勝軍によって1864年に鎮圧されました。","m":"太平天国＝滅満興漢、義和団＝扶清滅洋"},{"id":83,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"清末の改革と列強","y":1898,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　康有為らの提案により、光緒帝が戊戌の変法を始めた。\nイ　義和団戦争の講和として、北京議定書（辛丑和約）が結ばれた。\nウ　ベトナムの宗主権をめぐって清仏戦争が起こった。","c":["ウ→ア→イ","ア→ウ→イ","ウ→イ→ア","ア→イ→ウ"],"e":"清仏戦争（1884〜85年）で清は敗れ、天津条約でベトナムに対する宗主権を放棄しました。日清戦争後の1898年、康有為らは日本の明治維新にならう立憲君主政をめざして戊戌の変法を進めましたが、西太后らの戊戌の政変で失敗しました。1900年の義和団戦争では8か国連合軍が北京を占領し、1901年の北京議定書で清は巨額の賠償金と外国軍の北京駐屯を認めました。","m":"1884清仏戦争→1898戊戌の変法→1901北京議定書"},{"id":84,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"インド大反乱とイギリスの支配","y":1858,"q":"インド大反乱（1857〜59年）とその後のインドについて述べた文として正しいものはどれですか。","c":["反乱の過程でムガル帝国は滅亡し、イギリスは東インド会社を解散してインドを直接統治した。","反乱の中心となったシパーヒーは、イギリス本国から派遣された正規軍の兵士であった。","1877年、エドワード7世がインド皇帝に即位してインド帝国が成立した。","ベンガル分割令は、ヒンドゥー教徒とムスリムの協力を促すために出された。"],"e":"東インド会社のインド人傭兵シパーヒーの反乱から始まった大反乱の過程で、1858年にムガル皇帝が流刑となって帝国は滅び、東インド会社は解散してイギリス政府の直接統治となりました。1877年にはヴィクトリア女王がインド皇帝を兼ね、インド帝国が成立しました。1905年のベンガル分割令は、ヒンドゥー教徒とムスリムを対立させて民族運動を分断するねらいで出されました。","m":"1858ムガル滅亡・会社解散→1877インド帝国（ヴィクトリア）"},{"id":85,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"日清戦争と下関条約","y":1895,"q":"日清戦争の講和条約である下関条約の内容として誤っているものはどれですか。","c":["清は山東半島の膠州湾を日本に割譲した。","清は朝鮮が独立国であることを認めた。","清は遼東半島・台湾・澎湖諸島を日本に割譲した。","清は日本に賠償金2億両を支払うことになった。"],"e":"1895年の下関条約では、朝鮮の独立承認、遼東半島・台湾・澎湖諸島の割譲、賠償金2億両の支払い、開港場での企業の設立などが定められました。遼東半島はロシア・ドイツ・フランスの三国干渉で清に返還されました。膠州湾は1898年にドイツが租借した地で、日本への割譲とは無関係です。この後、列強は中国で租借地や勢力範囲を広げていきました。","m":"下関条約＝朝鮮独立・遼東/台湾/澎湖・2億両"},{"id":86,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"辛亥革命","y":1911,"q":"辛亥革命とその前後について述べた文として正しいものはどれですか。","c":["孫文は東京で中国同盟会を結成し、三民主義を掲げた。","革命は、北京の軍隊が蜂起したことから始まった。","中華民国は北京で成立し、袁世凱が臨時大総統に就任した。","袁世凱は、中国国民党と中国共産党の提携（第1次国共合作）を推進した。"],"e":"1905年、孫文は東京で中国同盟会を結成し、民族・民権・民生の三民主義を掲げました。1911年、鉄道国有化への反対運動をきっかけに武昌で軍隊が蜂起して辛亥革命が始まり、1912年に孫文を臨時大総統として南京で中華民国が成立しました。その後、袁世凱が宣統帝を退位させて臨時大総統の地位を得ました。第1次国共合作（1924年）を進めたのは孫文です。","m":"1905中国同盟会（東京）→1911武昌蜂起→1912南京で建国"},{"id":87,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"第一次世界大戦の経過","y":1917,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　ドイツの無制限潜水艦作戦などを理由に、アメリカ合衆国が参戦した。\nイ　ソヴィエト政権がドイツとブレスト＝リトフスク条約を結んだ。\nウ　サライェヴォ事件で、オーストリアの帝位継承者夫妻が暗殺された。","c":["ウ→ア→イ","ア→ウ→イ","ウ→イ→ア","イ→ウ→ア"],"e":"1914年6月、ボスニアのサライェヴォでオーストリア帝位継承者夫妻がセルビア人青年に暗殺され、第一次世界大戦が始まりました。1917年2月にドイツが無制限潜水艦作戦を始めると、同年4月にアメリカが参戦しました。ロシアでは十月革命で成立したソヴィエト政権が、1918年3月にブレスト＝リトフスク条約を結んで戦争から離脱しました。","m":"1914サライェヴォ→1917米参戦→1918ブレスト＝リトフスク"},{"id":88,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"ヴェルサイユ・ワシントン体制","y":1922,"q":"第一次世界大戦後の国際秩序について述べた文として正しいものはどれですか。","c":["ワシントン会議の九か国条約で、中国の主権尊重・門戸開放・機会均等が確認された。","国際連盟には、アメリカ合衆国が設立当初から加盟した。","ヴェルサイユ条約で、ドイツはアルザス・ロレーヌを獲得した。","ロカルノ条約の締結を受けて、ドイツは国際連盟から脱退した。"],"e":"1921〜22年のワシントン会議では、九か国条約で中国の主権尊重・門戸開放などが定められ、四か国条約で日英同盟が解消され、海軍軍備制限条約も結ばれました。アメリカは上院の反対でヴェルサイユ条約を批准せず、国際連盟に加盟しませんでした。ドイツはヴェルサイユ条約でアルザス・ロレーヌをフランスに返還しました。1925年のロカルノ条約の後、ドイツは1926年に国際連盟に加盟しています。","m":"九か国条約＝中国の主権尊重、ロカルノ→独の連盟加盟"},{"id":89,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"ロシア革命とソ連の成立","y":1921,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　ソヴィエト政権が戦時共産主義をやめ、新経済政策（ネップ）を採用した。\nイ　レーニンらの政権が「平和に関する布告」を発表した。\nウ　ソヴィエト社会主義共和国連邦が成立した。","c":["イ→ア→ウ","ア→イ→ウ","イ→ウ→ア","ウ→イ→ア"],"e":"1917年の十月革命で権力を握ったレーニンらは、無併合・無償金・民族自決にもとづく即時講和を呼びかける「平和に関する布告」を発表しました。内戦と対ソ干渉戦争の時期には戦時共産主義がとられましたが、経済が混乱したため、1921年に小規模な私企業や農民の余剰穀物の販売を認める新経済政策に転換しました。1922年にはソヴィエト社会主義共和国連邦が成立しました。","m":"1917平和に関する布告→1921ネップ→1922ソ連成立"},{"id":90,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"世界恐慌への対応","y":1933,"q":"世界恐慌への各国の対応について述べた次の文（ア）・（イ）の正誤の組合せとして正しいものはどれですか。\n（ア）アメリカ合衆国のニューディールでは、テネシー川流域開発公社（TVA）による地域開発が行われた。\n（イ）イギリスは、オタワ連邦会議でイギリス連邦内の関税を優遇するブロック経済を形成した。","c":["（ア）正（イ）正","（ア）正（イ）誤","（ア）誤（イ）正","（ア）誤（イ）誤"],"e":"（ア）は正しい文です。フランクリン＝ローズヴェルト大統領はニューディールを進め、農業調整法（AAA）・全国産業復興法（NIRA）やTVAによる公共事業で雇用の回復をはかり、ワグナー法で労働者の団結権を認めました。（イ）も正しい文です。イギリスは金本位制を停止し、1932年のオタワ連邦会議で連邦内に特恵関税を設け、スターリング＝ブロックを形成しました。","m":"米＝ニューディール（TVA）、英＝オタワ会議でブロック経済"},{"id":91,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"ファシズムの台頭","y":1933,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　ドイツ・イギリス・フランス・イタリアの首脳がミュンヘン会談を開き、ズデーテン地方のドイツへの割譲を認めた。\nイ　ムッソリーニのファシスト党がローマ進軍を行い、政権を獲得した。\nウ　ドイツで全権委任法が成立し、ナチ党の一党独裁が進んだ。","c":["イ→ウ→ア","ウ→イ→ア","イ→ア→ウ","ア→イ→ウ"],"e":"1922年、ムッソリーニはローマ進軍によって国王から首相に任命され、ファシズム体制を築きました。ドイツでは1933年にヒトラーが首相となり、同年の全権委任法で政府が議会の承認なしに法律を制定できるようになりました。1938年のミュンヘン会談では、イギリスのネヴィル＝チェンバレンらが宥和政策をとり、ズデーテン地方の割譲を認めました。","m":"1922ローマ進軍→1933全権委任法→1938ミュンヘン会談"},{"id":92,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"第二次世界大戦","y":1939,"q":"第二次世界大戦について述べた文として正しいものはどれですか。","c":["独ソ不可侵条約が結ばれた直後、ドイツがポーランドに侵攻して大戦が始まった。","大西洋憲章は、チャーチルとスターリンが会談して発表した。","ヤルタ会談で、日本に無条件降伏を求めるポツダム宣言が発表された。","スターリングラードの戦いで、ドイツ軍がソ連軍に大勝した。"],"e":"1939年8月に独ソ不可侵条約が結ばれ、9月1日にドイツがポーランドに侵攻すると、イギリス・フランスが宣戦して大戦が始まりました。大西洋憲章（1941年）はローズヴェルトとチャーチルが発表したものです。ヤルタ会談（1945年2月）ではソ連の対日参戦などが秘密協定で決められ、ポツダム宣言は同年7月のポツダム会談の際に出されました。スターリングラードの戦い（1942〜43年）ではドイツ軍が降伏し、戦局の転換点となりました。","m":"大西洋憲章＝米英、ヤルタ＝ソ連対日参戦、ポツダム宣言"},{"id":93,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"国際連合の発足","y":1945,"q":"国際連合について述べた文として誤っているものはどれですか。","c":["総会では、大国に拒否権が認められた。","サンフランシスコ会議で国際連合憲章が採択された。","安全保障理事会の常任理事国は、アメリカ・イギリス・フランス・ソ連・中国の5か国とされた。","本部はニューヨークに置かれた。"],"e":"国際連合は1945年6月のサンフランシスコ会議で採択された国際連合憲章にもとづき、同年10月に発足しました。本部はニューヨークに置かれました。拒否権は安全保障理事会の常任理事国（米・英・仏・ソ・中）に認められたもので、総会は一国一票の多数決制です。国際連盟の反省から、安全保障理事会は経済制裁に加えて軍事的制裁も行えるとされました。","m":"拒否権は安保理の常任理事国、総会は一国一票"},{"id":94,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"冷戦の始まり","y":1948,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　ソ連と東欧諸国がワルシャワ条約機構を結成した。\nイ　ソ連が西ベルリンへの交通を遮断するベルリン封鎖を行った。\nウ　アメリカがトルーマン＝ドクトリンを発表し、ギリシア・トルコへの援助を表明した。","c":["ウ→イ→ア","イ→ウ→ア","ウ→ア→イ","イ→ア→ウ"],"e":"1947年、トルーマン大統領は共産主義の拡大を防ぐ「封じ込め政策」としてトルーマン＝ドクトリンを発表し、同年マーシャル＝プランも打ち出しました。1948年、西側占領地区の通貨改革に反発したソ連がベルリン封鎖を行い、翌1949年には北大西洋条約機構（NATO）が結成されました。西ドイツのNATO加盟を受け、1955年にワルシャワ条約機構が結成されました。","m":"1947トルーマン＝ドクトリン→1948ベルリン封鎖→1955WTO"},{"id":95,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"アジア諸国の独立","y":1954,"q":"第二次世界大戦後のアジアについて述べた文として正しいものはどれですか。","c":["ジュネーヴ休戦協定で、ベトナムは北緯17度線を暫定的な軍事境界線とした。","インドとパキスタンは、一つの連邦国家として独立した。","ディエンビエンフーの戦いで、ベトナム軍がアメリカ軍を破った。","インドネシアでは、スハルトが1945年に独立を宣言した。"],"e":"1954年、ディエンビエンフーの戦いでベトナム民主共和国軍がフランス軍を破り、同年のジュネーヴ休戦協定で北緯17度線が暫定的な境界とされました。インドは1947年に、ムスリムが多数を占めるパキスタンと分離して独立しました。インドネシアでは1945年にスカルノが独立を宣言し、オランダとの戦争を経て独立を達成しました。スハルトは1960年代にスカルノに代わって実権を握った軍人です。","m":"ディエンビエンフー＝対フランス、ジュネーヴ協定＝北緯17度"},{"id":96,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"アジア＝アフリカ会議","y":1955,"q":"1955年にインドネシアで開かれ、29か国が参加して反植民地主義・平和共存をうたう平和十原則を採択した会議はどれですか。","c":["アジア＝アフリカ会議（バンドン会議）","第1回非同盟諸国首脳会議","ジュネーヴ会議","コロンボ会議"],"e":"アジア＝アフリカ会議はインドネシアのバンドンで開かれ、前年に周恩来とネルーが確認した平和五原則をもとに、平和十原則が採択されました。第1回非同盟諸国首脳会議は1961年にユーゴスラヴィアのベオグラードで開かれました。ジュネーヴ会議（1954年）はインドシナ戦争の休戦などを話し合った会議です。コロンボ会議（1954年）は、バンドン会議開催を呼びかけた南アジア・東南アジアの首脳会議です。","m":"1954平和五原則→1955バンドン十原則→1961非同盟会議"},{"id":97,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"中東戦争とパレスチナ問題","y":1956,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　エジプトのナセル大統領がスエズ運河の国有化を宣言した。\nイ　第4次中東戦争の際、アラブ産油国が石油戦略をとり、石油危機が起こった。\nウ　イスラエルが建国を宣言し、パレスチナ戦争（第1次中東戦争）が起こった。","c":["ウ→ア→イ","ア→ウ→イ","ウ→イ→ア","ア→イ→ウ"],"e":"1948年、国連のパレスチナ分割案を受けてイスラエルが建国を宣言すると、アラブ諸国との間でパレスチナ戦争が起こり、多くのパレスチナ難民が生まれました。1956年にナセルがスエズ運河国有化を宣言すると、イギリス・フランス・イスラエルがエジプトに出兵しました（スエズ戦争）。1973年の第4次中東戦争では、アラブ石油輸出国機構（OAPEC）が石油戦略をとり、第1次石油危機が起こりました。","m":"1948イスラエル建国→1956スエズ→1973石油危機"},{"id":98,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"キューバ危機","y":1962,"q":"1962年、キューバにおけるソ連のミサイル基地建設をめぐって核戦争の危機が高まりました。このときのアメリカ合衆国大統領とソ連の最高指導者の組合せとして正しいものはどれですか。","c":["ケネディ―フルシチョフ","アイゼンハワー―フルシチョフ","ケネディ―ブレジネフ","ニクソン―ブレジネフ"],"e":"キューバ危機では、ケネディ大統領が海上封鎖を行ってミサイルの撤去を求め、フルシチョフが撤去に応じて危機が回避されました。翌1963年には米ソ間に直通通信回線（ホットライン）が設けられ、部分的核実験禁止条約が結ばれました。アイゼンハワーは1950年代の大統領で、フルシチョフと会談しました。ブレジネフはフルシチョフの失脚後の指導者で、ニクソンとは1970年代のデタントの時期に交渉しました。","m":"キューバ危機1962＝ケネディ×フルシチョフ"},{"id":99,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"冷戦の終結","y":1989,"q":"冷戦の終結について述べた文として正しいものはどれですか。","c":["1989年、地中海のマルタ島で米ソ首脳が会談し、冷戦の終結を宣言した。","東西ドイツは、ベルリンの壁が崩壊した1989年のうちに統一を果たした。","ソ連の解体後、ロシアなどの旧ソ連諸国はワルシャワ条約機構を結成した。","ゴルバチョフは、チェコスロヴァキアの「プラハの春」を指導した。"],"e":"1989年12月、アメリカのブッシュ（父）大統領とソ連のゴルバチョフ書記長がマルタ会談を行い、冷戦の終結を宣言しました。ベルリンの壁は1989年11月に崩壊し、東西ドイツの統一は1990年です。ワルシャワ条約機構は1991年に解体され、同年のソ連解体後、ロシアなどは独立国家共同体（CIS）を結成しました。「プラハの春」（1968年）を指導したのはドプチェクです。","m":"1989壁崩壊・マルタ会談→1990ドイツ統一→1991ソ連解体"},{"id":100,"k":"plan","ref":"想定問題","f":"近現代の世界（19〜20世紀）","t":"ヨーロッパ統合","y":1967,"q":"次のア〜ウのできごとを、古いものから年代順に正しく並べたものはどれですか。\nア　マーストリヒト条約が発効し、ヨーロッパ連合（EU）が発足した。\nイ　フランス・西ドイツなど6か国により、ヨーロッパ石炭鉄鋼共同体（ECSC）が発足した。\nウ　3つの共同体が統合され、ヨーロッパ共同体（EC）が発足した。","c":["イ→ウ→ア","ウ→イ→ア","イ→ア→ウ","ア→イ→ウ"],"e":"フランス外相シューマンの提案にもとづき、1952年にフランス・西ドイツ・イタリア・ベネルクス3国でECSCが発足しました。1958年にはヨーロッパ経済共同体（EEC）とヨーロッパ原子力共同体（EURATOM）が発足し、1967年にこれら3つの共同体が統合されてECとなりました。1993年にマーストリヒト条約が発効してEUが発足し、1999年には共通通貨ユーロが導入されました。","m":"1952ECSC→1958EEC→1967EC→1993EU"}];
var FIELDS=["オリエント・ヨーロッパ 古代・中世","アジア 古代〜近世","イスラーム・アフリカ・ラテンアメリカ","ヨーロッパ・アメリカ 近世・近代","近現代の世界（19〜20世紀）"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="meiji-sekaishi-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.k==="past"?"過去問ベース：明治大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（明治大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+"abcde".charAt(j)+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+KIND[q.k]+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+KIND[q.k]+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

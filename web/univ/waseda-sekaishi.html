<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>早稲田 世界史 10問テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 一枚の答案用紙。中央1カラム（最大640px）。問題文は試験冊子と同じ明朝、操作と数字はゴシック。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.passage{font-family:var(--f-exam);font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:50vh;overflow-y:auto}
.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){ .q{font-size:17px} .score b{font-size:44px} .fi{grid-template-columns:minmax(0,1fr)} .fi .btn{grid-column:1;grid-row:auto;justify-self:start} }
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

<script>
(function(){
"use strict";
var QS=[{"id":1,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"古代オリエントの諸国家","y":-586,"q":"古代オリエントの諸民族・諸国家について述べた次の文のうち、誤っているものはどれですか。","c":["新バビロニアのネブカドネザル2世は、イスラエル王国を滅ぼして住民をバビロンに連れ去った。","シュメール人は楔形文字を用い、六十進法を考案した。","ハンムラビ法典は同害復讐の原則に立つが、刑罰は身分によって異なっていた。","ヒッタイトは鉄器を用い、バビロン第1王朝を滅ぼしたほかエジプトとも抗争した。"],"e":"ネブカドネザル2世が滅ぼしたのはユダ王国で、住民をバビロンに連れ去りました（バビロン捕囚）。イスラエル王国は前722年にアッシリアに滅ぼされています。シュメール人の楔形文字・六十進法、ハンムラビ法典の同害復讐と身分差、ヒッタイトの鉄器使用とバビロン第1王朝の滅亡・エジプトとの抗争（カデシュの戦い）は、いずれも正しい内容です。","m":"イスラエル王国＝アッシリアが滅ぼす／ユダ王国＝新バビロニア"},{"id":2,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"アテネ民主政の形成","y":-508,"q":"古代アテネの民主政の発展について述べた次の文のうち、正しいものはどれですか。","c":["クレイステネスは血縁にもとづく4部族制を地縁にもとづく10部族制に改め、陶片追放の制度を設けた。","ドラコンは財産額に応じて市民の参政権と軍事上の義務を定めた。","ペイシストラトスは負債の帳消しを行い、債務奴隷を禁止した。","ペリクレスの時代には、将軍職を含むすべての官職が抽選で選ばれた。"],"e":"クレイステネスは前508年ころ、部族制を地縁的な10部族制に改め、僭主の出現を防ぐ陶片追放を設けました。財産額で参政権を定めた財産政治と、負債の帳消し・債務奴隷の禁止はいずれもソロンの改革です。ドラコンは慣習法を成文化した人物、ペイシストラトスは僭主です。ペリクレス時代も将軍職だけは選挙で選ばれました。","m":"ソロン＝財産政治・債務奴隷禁止／クレイステネス＝10部族・陶片追放"},{"id":3,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"ヘレニズム文化","y":-240,"q":"ヘレニズム時代の学問・思想について述べた次の文のうち、正しいものはどれですか。","c":["エラトステネスは、地球の周囲の長さをほぼ正確に測定した。","エウクレイデスは、浮体の原理やてこの原理を発見した。","アリスタルコスは、地球を中心とする天動説を体系化した。","ゼノンは、精神的快楽を重視するエピクロス派を開いた。"],"e":"アレクサンドリアのムセイオンで活躍したエラトステネスは、地球の周囲の長さを測定しました。浮体の原理はアルキメデスの業績で、エウクレイデスは平面幾何学を大成しました。アリスタルコスは太陽中心説（地動説）を唱えた人物で、天動説を体系化したのは2世紀のプトレマイオスです。ゼノンはストア派の祖で、エピクロス派の祖はエピクロスです。","m":"ムセイオン＝エラトステネス（地球測定）・アルキメデス（浮体）"},{"id":4,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"共和政ローマの身分闘争","y":-367,"q":"共和政ローマの身分闘争に関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　コンスルのうち1名を平民から選ぶことが定められた。\nイ　平民会の決議が元老院の承認なしに国法とされるようになった。\nウ　慣習法が成文化され、十二表法が定められた。","c":["ウ→ア→イ","ア→ウ→イ","ウ→イ→ア","イ→ウ→ア"],"e":"前5世紀半ばに十二表法が制定され（ウ）、前367年のリキニウス・セクスティウス法でコンスルの1名を平民から選ぶことが定められました（ア）。前287年のホルテンシウス法により、平民会の決議が元老院の承認なしに国法となり（イ）、身分闘争はひとまず終わりました。ただし実際には新貴族（ノビレス）が政治を握るようになりました。","m":"十二表法→リキニウス・セクスティウス法367→ホルテンシウス法287"},{"id":5,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"ローマ帝国後期の皇帝","y":325,"q":"ローマ帝国の皇帝について述べた次の文のうち、誤っているものはどれですか。","c":["テオドシウス帝はニケーア公会議を開き、アタナシウス派を正統とした。","カラカラ帝は、帝国内の全自由人にローマ市民権を与えた。","ディオクレティアヌス帝は四帝分治制をしき、専制君主政を始めた。","コンスタンティヌス帝はキリスト教を公認し、ソリドゥス金貨を発行した。"],"e":"ニケーア公会議（325年）を開いてアタナシウス派を正統としたのはコンスタンティヌス帝です。テオドシウス帝はキリスト教を国教とし（392年）、死に際して帝国を東西に分けて2子に与えました。カラカラ帝の市民権付与（212年）、ディオクレティアヌス帝の四帝分治制と専制君主政（ドミナトゥス）、コンスタンティヌス帝のミラノ勅令とソリドゥス金貨は正しい内容です。","m":"ニケーア325＝コンスタンティヌス／国教化392＝テオドシウス"},{"id":6,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"ビザンツ帝国","y":534,"q":"ビザンツ帝国について述べた次の文のうち、正しいものはどれですか。","c":["ユスティニアヌス帝は、トリボニアヌスらに『ローマ法大全』を編纂させた。","ヘラクレイオス1世は聖像禁止令を出し、ローマ教会との対立を深めた。","ビザンツ帝国は、第4回十字軍によってコンスタンティノープルを奪われて滅亡した。","ハギア＝ソフィア聖堂は、ゴシック様式を代表する建築である。"],"e":"ユスティニアヌス帝はトリボニアヌスらに『ローマ法大全』を編纂させ、ハギア＝ソフィア聖堂を再建しました。この聖堂は大ドームとモザイク壁画をもつビザンツ様式の代表です。聖像禁止令（726年）を出したのはレオン3世です。第4回十字軍のラテン帝国建国（1204年）後もビザンツ帝国は再興され、滅亡はオスマン帝国による1453年です。","m":"ローマ法大全＝ユスティニアヌス／聖像禁止令＝レオン3世"},{"id":7,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"カール大帝","y":800,"q":"カール大帝（シャルルマーニュ）について述べた次の文のうち、誤っているものはどれですか。","c":["トゥール・ポワティエ間の戦いで、イベリア半島から侵入したウマイヤ朝軍を破った。","東方から侵入したアヴァール人を撃退した。","北イタリアのランゴバルド王国を滅ぼした。","アルクインらを宮廷に招き、カロリング＝ルネサンスと呼ばれる文化の復興をもたらした。"],"e":"トゥール・ポワティエ間の戦い（732年）でウマイヤ朝軍を破ったのは、カール大帝の祖父にあたる宮宰カール＝マルテルです。カール大帝はランゴバルド王国を征服し、アヴァール人を撃退して西ヨーロッパの大半を統一しました。800年には教皇レオ3世からローマ皇帝の冠を受け、アルクインらを招いてラテン語の学芸を振興しました。","m":"732トゥール・ポワティエ＝カール＝マルテル（祖父）"},{"id":8,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"叙任権闘争","y":1077,"q":"1077年、聖職叙任権をめぐって教皇から破門された神聖ローマ皇帝が、北イタリアの城の前で教皇に許しを求める事件が起こりました。このときの教皇と皇帝の組合せとして正しいものはどれですか。","c":["グレゴリウス7世―ハインリヒ4世","インノケンティウス3世―ハインリヒ4世","グレゴリウス7世―フリードリヒ1世","ウルバヌス2世―オットー1世"],"e":"カノッサの屈辱では、教会改革を進めたグレゴリウス7世がハインリヒ4世を破門し、皇帝は許しを求めました。叙任権闘争は1122年のヴォルムス協約で妥協が成立します。インノケンティウス3世は13世紀初めに教皇権の絶頂期を築いた教皇、ウルバヌス2世は第1回十字軍を提唱した教皇、フリードリヒ1世はイタリア政策を進めた12世紀の皇帝、オットー1世は962年に戴冠した皇帝です。","m":"カノッサ1077＝グレゴリウス7世×ハインリヒ4世"},{"id":9,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"十字軍","y":1204,"q":"十字軍について述べた次の文のうち、誤っているものはどれですか。","c":["神聖ローマ皇帝フリードリヒ1世は、アイユーブ朝のスルタンとの交渉によってイェルサレムを一時回復した。","第1回十字軍は、教皇ウルバヌス2世がクレルモン宗教会議で提唱したことに始まる。","第3回十字軍は、アイユーブ朝のサラーフ＝アッディーンからイェルサレムを奪回できなかった。","第4回十字軍は、ヴェネツィア商人の意向によりコンスタンティノープルを占領し、ラテン帝国を建てた。"],"e":"アイユーブ朝のスルタンと交渉してイェルサレムを一時回復した（1229年）のは、フリードリヒ2世です。フリードリヒ1世（赤ひげ王）は第3回十字軍に参加し、小アジアで溺死しました。第1回十字軍のクレルモン宗教会議での提唱（1095年）、第3回十字軍がサラーフ＝アッディーンに阻まれたこと、第4回十字軍のラテン帝国建国（1204年）は正しい内容です。","m":"交渉で聖地回復＝フリードリヒ2世／1世は第3回で溺死"},{"id":10,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"イギリス議会の起源","y":1265,"q":"中世イギリスの政治について述べた次の文のうち、正しいものはどれですか。","c":["シモン＝ド＝モンフォールは国王に反乱を起こし、聖職者・貴族のほか州と都市の代表を加えた議会を開いた。","ジョン王はブーヴィーヌの戦いに勝ち、フランス内の領地を拡大した。","エドワード1世が招集した模範議会で、上院と下院からなる二院制が成立した。","リチャード1世は、フランス王フィリップ2世に大陸の領地の大半を奪われた。"],"e":"1265年、シモン＝ド＝モンフォールはヘンリ3世に反抗し、州の騎士と都市の市民の代表を加えた議会を開きました。これがイギリス議会の起源とされます。ジョン王はフィリップ2世に大陸領の大半を奪われ、ブーヴィーヌの戦い（1214年）にも敗れて大憲章を認めました。模範議会は1295年ですが、二院制が成立したのは14世紀のエドワード3世時代です。","m":"1215大憲章（ジョン）→1265モンフォール議会→1295模範議会"},{"id":11,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"中世末期のヨーロッパ","y":1381,"q":"中世末期のヨーロッパに関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　イギリスでワット＝タイラーの乱が起こった。\nイ　コンスタンツ公会議が開かれ、教会大分裂が終わった。\nウ　カール4世が金印勅書を発布し、皇帝選出の方法を定めた。","c":["ウ→ア→イ","ア→ウ→イ","ウ→イ→ア","ア→イ→ウ"],"e":"カール4世の金印勅書は1356年で、7人の選帝侯が皇帝を選ぶことを定めました（ウ）。ワット＝タイラーの乱は百年戦争中の1381年で、人頭税への反発から起こりました（ア）。コンスタンツ公会議（1414〜18年）は教会大分裂を終わらせ、フスを異端として処刑しました（イ）。","m":"金印勅書1356→ワット＝タイラー1381→コンスタンツ1414"},{"id":12,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"中世ヨーロッパの学問と建築","y":1270,"q":"中世ヨーロッパの文化について述べた次の文のうち、正しいものはどれですか。","c":["トマス＝アクィナスは『神学大全』を著し、信仰と理性の調和をはかった。","ロジャー＝ベーコンは普遍論争で唯名論を唱え、のちの近代思想を準備した。","アンセルムスは普遍は名前にすぎないと説く唯名論の代表である。","シャルトル大聖堂は、厚い壁と小さな窓をもつロマネスク様式の代表である。"],"e":"トマス＝アクィナスはアリストテレス哲学を取り入れて『神学大全』を著し、スコラ学を大成しました。唯名論を唱えたのはウィリアム＝オブ＝オッカムで、アンセルムスは実在論の代表です。ロジャー＝ベーコンは観察と実験を重んじた人物です。シャルトル大聖堂は尖頭アーチとステンドグラスで知られるゴシック様式の代表です。","m":"実在論＝アンセルムス／唯名論＝オッカム／大成＝トマス"},{"id":13,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"中世の都市と商業","y":1300,"q":"中世ヨーロッパの都市と商業について述べた次の文のうち、誤っているものはどれですか。","c":["シャンパーニュ地方の大市は、北ドイツの諸都市を結ぶバルト海沿岸で開かれた。","リューベックを盟主とするハンザ同盟は、北海・バルト海交易を担った。","ロンバルディア同盟は、神聖ローマ皇帝に対抗した北イタリア諸都市の同盟である。","フィレンツェは毛織物業と金融業で栄え、のちにメディチ家が実権を握った。"],"e":"シャンパーニュ地方はフランス北東部にあり、その大市は北イタリアとフランドルを結ぶ内陸の交易の中心として栄えました。バルト海沿岸ではありません。ハンザ同盟の盟主リューベック、皇帝のイタリア政策に対抗したロンバルディア同盟、毛織物業と金融業で栄えたフィレンツェとメディチ家は、いずれも正しい内容です。","m":"シャンパーニュ＝北東フランスの内陸、南北商業圏の結節点"},{"id":14,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"古代エジプト","y":-1350,"q":"古代エジプトについて述べた次の文のうち、正しいものはどれですか。","c":["アメンホテプ4世はアテン神の一神信仰を強制し、テル＝エル＝アマルナに都を移した。","古王国はテーベを中心に栄え、クフ王らが巨大なピラミッドを築いた。","エジプトでは太陰暦が用いられ、のちのユリウス暦のもとになった。","神聖文字（ヒエログリフ）は、シャンポリオンがベヒストゥーン碑文を用いて解読した。"],"e":"アメンホテプ4世（イクナートン）はアテン神の信仰を強制し、アマルナに遷都しました。この時代には写実的なアマルナ美術が生まれました。古王国の中心はメンフィスで、テーベは中王国・新王国の中心です。エジプトの暦は太陽暦で、ユリウス暦のもとになりました。シャンポリオンが用いたのはロゼッタ＝ストーンで、ベヒストゥーン碑文は楔形文字の解読に使われました。","m":"古王国＝メンフィス／新王国＝テーベ・アマルナ改革"},{"id":15,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"パルティアとササン朝","y":260,"q":"パルティアとササン朝ペルシアについて述べた次の文のうち、正しいものはどれですか。","c":["ササン朝のシャープール1世は、ローマ皇帝ウァレリアヌスを捕虜にした。","ササン朝はマニ教を国教とし、ゾロアスター教を弾圧した。","パルティアは、アルダシール1世がセレウコス朝から独立して建てた。","ササン朝は、ニハーヴァンドの戦いでウマイヤ朝の軍に敗れた。"],"e":"シャープール1世は260年、エデッサの戦いでローマ皇帝ウァレリアヌスを捕らえました。ササン朝の国教はゾロアスター教で、マニ教はのちに弾圧されました。パルティアを建てたのはアルサケスで、アルダシール1世はパルティアを倒してササン朝を開いた人物です。ニハーヴァンドの戦い（642年）でササン朝を破ったのは正統カリフ時代のイスラーム軍です。","m":"パルティア＝アルサケス／ササン朝＝アルダシール1世・国教ゾロアスター教"},{"id":16,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"ゲルマン人の移動","y":476,"q":"ゲルマン人の大移動について述べた次の文のうち、誤っているものはどれですか。","c":["東ゴート王テオドリックは、イベリア半島に王国を建てた。","西ゴート人はアラリックに率いられてローマ市を略奪した。","ヴァンダル人は北アフリカに渡り、カルタゴの故地に王国を建てた。","ゲルマン人傭兵隊長オドアケルは、西ローマ皇帝を退位させた。"],"e":"テオドリックが東ゴート王国を建てたのはイタリアです。イベリア半島に王国を建てたのは西ゴート人で、410年にアラリックがローマを略奪したのち、南ガリアからイベリア半島へ移りました。ヴァンダル人は北アフリカに王国を建て、476年にはオドアケルが西ローマ皇帝を退位させました。","m":"東ゴート＝イタリア／西ゴート＝イベリア／ヴァンダル＝北アフリカ"},{"id":17,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"ノルマン人の活動","y":862,"q":"ノルマン人の活動について述べた次の文のうち、正しいものはどれですか。","c":["リューリクに率いられたルーシが、ノヴゴロド国を建てたとされる。","ロロはシチリア島に渡り、両シチリア王国を建てた。","アルフレッド大王はノルマン人の侵入を撃退したのち、ノルマン朝を開いた。","ノルマンディー公ウィリアムはクレシーの戦いでイングランド軍を破り、王位についた。"],"e":"9世紀、リューリクの率いるルーシ（ノルマン人の一派）がノヴゴロド国を建てたとされ、のちキエフ公国が成立しました。ロロが建てたのはノルマンディー公国で、両シチリア王国はルッジェーロ2世が建てました。アルフレッド大王はデーン人と戦ったアングロ＝サクソンの王です。ウィリアムは1066年にヘースティングズの戦いで勝ち、ノルマン朝を開きました。クレシーの戦いは百年戦争の戦いです。","m":"ノヴゴロド＝リューリク／ノルマンディー＝ロロ／両シチリア＝ルッジェーロ2世"},{"id":18,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"レコンキスタ","y":1492,"q":"1492年、イベリア半島で最後に残ったイスラーム勢力の拠点グラナダが陥落し、レコンキスタ（国土回復運動）が完了しました。このときグラナダを都としていた王朝はどれですか。","c":["ナスル朝","後ウマイヤ朝","ムラービト朝","ムワッヒド朝"],"e":"グラナダを都としたナスル朝は、1492年にスペイン王国（カスティリャとアラゴンの統合で成立）に滅ぼされました。この朝の時代にアルハンブラ宮殿が築かれました。後ウマイヤ朝はコルドバを都とした王朝で、11世紀前半に滅亡しました。ムラービト朝とムワッヒド朝は、ともにマラケシュを都として北アフリカからイベリア半島南部に勢力を広げたベルベル人の王朝です。","m":"グラナダ＝ナスル朝・アルハンブラ宮殿"},{"id":19,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"ローマの文化","y":-19,"q":"古代ローマの文学・学問について述べた次の文のうち、正しいものはどれですか。","c":["ウェルギリウスは、ローマ建国の伝説を題材に叙事詩『アエネイス』を著した。","タキトゥスは、ガリア遠征の記録『ガリア戦記』を著した。","プルタルコスは、ローマの歴史を記した『ローマ建国史』を著した。","プトレマイオスは、自然界の知識を集大成した『博物誌』を著した。"],"e":"ウェルギリウスはアウグストゥス時代の詩人で『アエネイス』を著しました。『ガリア戦記』はカエサルの著作で、タキトゥスは『ゲルマニア』『年代記』を書きました。『ローマ建国史』はリウィウス、プルタルコスはギリシア人で『対比列伝』を著しました。『博物誌』はプリニウスで、プトレマイオスは天動説を説きました。","m":"ゲルマニア＝タキトゥス／建国史＝リウィウス／博物誌＝プリニウス"},{"id":20,"k":"plan","ref":"想定問題","f":"古代・中世のヨーロッパと地中海世界","t":"東ヨーロッパの諸民族","y":1386,"q":"中世の東ヨーロッパについて述べた次の文のうち、誤っているものはどれですか。","c":["ポーランド人やチェック人はギリシア正教を受け入れ、キリル文字を用いた。","ポーランドはリトアニアと連合し、ヤゲウォ（ヤゲロー）朝が成立した。","マジャール人はレヒフェルトの戦いでオットー1世に敗れ、のちハンガリー王国を建てた。","セルビア人はギリシア正教を受け入れた。"],"e":"西スラヴ人のポーランド人・チェック人はローマ＝カトリックを受け入れ、ラテン文字を用いました。ギリシア正教とキリル文字を受け入れたのは、ロシア人・セルビア人などです。1386年のポーランドとリトアニアの連合によるヤゲウォ朝の成立、955年のレヒフェルトの戦いとマジャール人のハンガリー王国建国は正しい内容です。","m":"西スラヴ＝カトリック／東・南スラヴ（セルビア）＝正教"},{"id":21,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"ルネサンス美術","y":1436,"q":"ルネサンスの美術について述べた次の文のうち、正しいものはどれですか。","c":["ブルネレスキは、フィレンツェ大聖堂の大円蓋（ドーム）を設計した。","ブラマンテは、システィナ礼拝堂の祭壇画「最後の審判」を描いた。","ボッティチェリは、ミラノの修道院に「最後の晩餐」を描いた。","ファン＝アイク兄弟は、「農民の踊り」など農民の生活を描いた。"],"e":"ブルネレスキはフィレンツェのサンタ＝マリア大聖堂の大円蓋を設計しました。「最後の審判」はミケランジェロ、「最後の晩餐」はレオナルド＝ダ＝ヴィンチの作品です。ブラマンテはサン＝ピエトロ大聖堂の最初の設計者、ボッティチェリは「ヴィーナスの誕生」の画家です。「農民の踊り」はブリューゲルで、ファン＝アイク兄弟は油絵の技法を改良したフランドルの画家です。","m":"大円蓋＝ブルネレスキ／サン＝ピエトロ＝ブラマンテ"},{"id":22,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"宗教改革","y":1555,"q":"宗教改革について述べた次の文のうち、誤っているものはどれですか。","c":["カルヴァンは予定説を説き、ジュネーヴで司教制度にもとづく教会組織を整えた。","ルターはヴォルムス帝国議会で自説の撤回を拒んだ。","アウクスブルクの和議では諸侯がカトリックかルター派かを選べるとされたが、カルヴァン派は認められなかった。","ツヴィングリはスイスのチューリヒで宗教改革を進めた。"],"e":"カルヴァンは司教制度を廃止し、信徒の中から選ばれた長老が牧師を補佐する長老主義をとりました。司教制度を残したのはイギリス国教会などです。ルターのヴォルムス帝国議会（1521年）での撤回拒否、アウクスブルクの和議（1555年）で個人ではなく諸侯が宗派を選び、カルヴァン派が除外されたこと、ツヴィングリのチューリヒでの改革は正しい内容です。","m":"カルヴァン＝予定説・長老主義／和議1555でカルヴァン派は対象外"},{"id":23,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"大航海時代","y":1498,"q":"大航海時代のポルトガルの航海に関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　バルトロメウ＝ディアスがアフリカ南端の喜望峰に到達した。\nイ　カブラルがブラジルに漂着し、ポルトガル領とした。\nウ　ヴァスコ＝ダ＝ガマがインド西岸のカリカットに到達した。","c":["ア→ウ→イ","ウ→ア→イ","ア→イ→ウ","イ→ア→ウ"],"e":"ディアスの喜望峰到達は1488年（ア）、ヴァスコ＝ダ＝ガマのカリカット到達は1498年（ウ）、カブラルのブラジル漂着は1500年（イ）です。カブラルはガマに続くインド航海の途中で大西洋を西に流されてブラジルに着きました。トルデシリャス条約（1494年）の境界線の東側にあたったため、ブラジルはポルトガル領となりました。","m":"1488ディアス→1498ガマ→1500カブラル"},{"id":24,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"スペインとオランダ独立","y":1580,"q":"16世紀のスペインとオランダについて述べた次の文のうち、正しいものはどれですか。","c":["フェリペ2世はポルトガルの王位を兼ね、スペインは「太陽の沈まぬ国」と呼ばれた。","カルロス1世は、レパントの海戦でオスマン帝国の艦隊を破った。","ネーデルラント北部7州はアラス同盟を結び、独立を宣言した。","スペインの無敵艦隊は、エリザベス1世時代のイギリス海軍に勝利した。"],"e":"フェリペ2世は1580年にポルトガル王位を兼ね、その植民地もあわせて支配しました。レパントの海戦（1571年）に勝ったのもフェリペ2世の時代です。北部7州が結んだのはユトレヒト同盟（1579年）で、1581年に独立を宣言しました。アラス同盟は南部10州がスペインと和解した同盟です。無敵艦隊は1588年にイギリスに敗れました。","m":"北部＝ユトレヒト同盟→1581独立宣言／南部＝アラス同盟"},{"id":25,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"三十年戦争","y":1648,"q":"三十年戦争とウェストファリア条約について述べた次の文のうち、誤っているものはどれですか。","c":["ウェストファリア条約では、スイスとオランダの独立は認められなかった。","戦争は、ベーメン（ボヘミア）の新教徒の反乱から始まった。","スウェーデン王グスタフ＝アドルフは、新教側に立って参戦した。","カトリック国のフランスは、ハプスブルク家に対抗して新教側に立って参戦した。"],"e":"ウェストファリア条約（1648年）では、スイスとオランダの独立が国際的に承認されました。またフランスはアルザスの一部、スウェーデンは西ポンメルンを得て、ドイツの諸邦はほぼ完全な主権を認められました。ベーメンの反乱に始まり、グスタフ＝アドルフやフランスが新教側で介入したことは正しい内容です。","m":"1648ウェストファリア＝スイス・オランダ独立承認、帝国の形骸化"},{"id":26,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"イギリス革命","y":1651,"q":"17世紀のイギリスに関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　議会が国王に権利の請願を提出した。\nイ　オランダの中継貿易に打撃を与える航海法が制定された。\nウ　公職就任者を国教徒に限る審査法が制定された。","c":["ア→イ→ウ","イ→ア→ウ","ア→ウ→イ","ウ→ア→イ"],"e":"権利の請願はチャールズ1世に対して1628年に出されました（ア）。航海法はクロムウェルの共和政期の1651年に定められ、第1次イギリス＝オランダ戦争の原因となりました（イ）。審査法は王政復古後、カトリック寄りのチャールズ2世に対抗して議会が1673年に定めました（ウ）。","m":"1628権利の請願→1651航海法→1673審査法→1679人身保護法"},{"id":27,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"ルイ14世の時代","y":1664,"q":"ルイ14世の時代のフランスについて述べた次の文のうち、正しいものはどれですか。","c":["財務総監コルベールは重商主義政策をとり、東インド会社を再建した。","ルイ14世はナントの王令を発布し、ユグノーに信仰の自由を認めた。","ルイ14世は幼少期に宰相リシュリューの補佐を受け、フロンドの乱を鎮圧した。","スペイン継承戦争の結果、フランスはユトレヒト条約でジブラルタルを獲得した。"],"e":"コルベールは王立マニュファクチュアの育成や東インド会社の再建を進めました。ナントの王令はアンリ4世が1598年に出したもので、ルイ14世は1685年にこれを廃止しました。ルイ14世の幼少期の宰相はマザランで、リシュリューはルイ13世の宰相です。ユトレヒト条約でジブラルタルを得たのはイギリスです。","m":"ルイ13世＝リシュリュー／ルイ14世＝マザラン・コルベール"},{"id":28,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"プロイセンとオーストリア","y":1763,"q":"18世紀のプロイセンとオーストリアについて述べた次の文のうち、誤っているものはどれですか。","c":["七年戦争の結果、フベルトゥスブルク条約でオーストリアはシュレジエンを奪回した。","フリードリヒ2世は、オーストリア継承戦争でシュレジエンを獲得した。","マリア＝テレジアは、長年の敵であったフランスと同盟を結んだ。","ヨーゼフ2世は宗教寛容令を出し、農奴解放を試みた。"],"e":"七年戦争（1756〜63年）でマリア＝テレジアはシュレジエン奪回をめざしましたが、フベルトゥスブルク条約でプロイセンの領有が確定しました。オーストリア継承戦争によるシュレジエン獲得、ブルボン家との同盟（外交革命）、ヨーゼフ2世の啓蒙改革は正しい内容です。","m":"シュレジエン＝継承戦争で獲得→七年戦争でも保持"},{"id":29,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"近世ロシア","y":1773,"q":"近世のロシアについて述べた次の文のうち、正しいものはどれですか。","c":["エカチェリーナ2世は、プガチョフの農民反乱を鎮圧したのち、農奴制を強化した。","ピョートル1世は北方戦争でポーランドを破り、バルト海沿岸にペテルブルクを建設した。","ミハイル＝ロマノフはキプチャク＝ハン国の支配から脱し、初めてツァーリの称号を用いた。","エカチェリーナ2世はラクスマンを根室に派遣し、日本との国交を開いた。"],"e":"エカチェリーナ2世はプガチョフの乱（1773〜75年）の後、貴族と結んで農奴制を強化しました。ピョートル1世が北方戦争で破ったのはスウェーデンです。モンゴル支配から自立したのはイヴァン3世で、ツァーリの称号を正式に用いたのはイヴァン4世です。ラクスマンは1792年に根室に来航しましたが、江戸幕府は通商を拒み、国交は開かれませんでした。","m":"北方戦争の相手＝スウェーデン／ラクスマン根室＝通商拒否"},{"id":30,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"啓蒙思想","y":1758,"q":"17〜18世紀の思想家と著作について述べた次の文のうち、正しいものはどれですか。","c":["ケネーは『経済表』を著し、農業を富の源泉とする重農主義を説いた。","ロックは『リヴァイアサン』を著し、抵抗権を認めた。","モンテスキューは『社会契約論』を著し、人民主権を説いた。","ディドロとダランベールは『哲学書簡』を編纂した。"],"e":"ケネーは『経済表』で重農主義を説き、テュルゴーがこれを継ぎました。『リヴァイアサン』はホッブズの著作で、ロックは『統治二論』で抵抗権を認めました。『社会契約論』はルソーの著作で、モンテスキューは『法の精神』で三権分立を説きました。ディドロとダランベールが編纂したのは『百科全書』で、『哲学書簡』はヴォルテールの著作です。","m":"経済表＝ケネー／法の精神＝モンテスキュー／百科全書＝ディドロ"},{"id":31,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"アメリカ独立革命","y":1783,"q":"アメリカ独立革命について述べた次の文のうち、誤っているものはどれですか。","c":["パリ条約で、イギリスはミシシッピ川以西のルイジアナをアメリカ合衆国に割譲した。","印紙法に対し、植民地側は「代表なくして課税なし」と主張して反対した。","ボストン茶会事件は、茶法に反発した急進派が起こした。","独立戦争ではフランス・スペインが植民地側で参戦し、ロシアは武装中立同盟を提唱した。"],"e":"1783年のパリ条約でイギリスがアメリカに割譲したのは、ミシシッピ川以東のルイジアナです。以西のルイジアナは1803年にフランスから買収しました。印紙法（1765年）への反対、茶法（1773年）とボストン茶会事件、フランス・スペインの参戦とエカチェリーナ2世の武装中立同盟は正しい内容です。","m":"1783パリ条約＝ミシシッピ以東／1803以西をフランスから買収"},{"id":32,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"フランス革命の展開","y":1791,"q":"フランス革命に関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　民衆と義勇兵がテュイルリー宮殿を襲い、王権が停止された。\nイ　第三身分の議員が、憲法制定まで解散しないことを誓った。\nウ　国王一家が国外逃亡をはかり、国境近くで捕らえられた。","c":["イ→ウ→ア","ウ→イ→ア","イ→ア→ウ","ア→イ→ウ"],"e":"球戯場（テニスコート）の誓いは1789年6月（イ）、ヴァレンヌ逃亡事件は1791年6月（ウ）、8月10日事件は1792年（ア）です。ヴァレンヌ逃亡で国王への信頼は失われ、オーストリアとの戦争が始まると、8月10日事件で王権が停止されました。その後、男性普通選挙による国民公会が成立し、王政廃止と共和政が宣言されました。","m":"1789球戯場→1791ヴァレンヌ→1792八月十日→第一共和政"},{"id":33,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"ナポレオン","y":1802,"q":"ナポレオン＝ボナパルトについて述べた次の文のうち、正しいものはどれですか。","c":["第一統領として、イギリスとアミアンの和約を結んだ。","トラファルガーの海戦で、ネルソンの率いるイギリス艦隊を破った。","アウステルリッツの戦い（三帝会戦）で、イギリス・プロイセン連合軍に敗れた。","ライプツィヒの戦いに敗れた後、ただちにセントヘレナ島に流された。"],"e":"ナポレオンは1802年にアミアンの和約でイギリスと講和しました。トラファルガーの海戦（1805年）ではネルソンに敗れています。アウステルリッツの戦いではオーストリア・ロシア軍に勝利しました。ライプツィヒの戦い（1813年）の後に流されたのはエルバ島で、セントヘレナ島はワーテルローの戦い（1815年）の後です。","m":"トラファルガー敗北・アウステルリッツ勝利／エルバ→セントヘレナ"},{"id":34,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"ウィーン体制の動揺","y":1848,"q":"ウィーン体制期のヨーロッパについて述べた次の文のうち、誤っているものはどれですか。","c":["フランクフルト国民議会でプロイセン王がドイツ皇帝に推され、ドイツ統一が実現した。","ギリシアは、イギリス・フランス・ロシアの支援を受けてオスマン帝国から独立した。","フランスの七月革命の結果、ルイ＝フィリップが国王となった。","七月革命の影響で、ベルギーがオランダから独立した。"],"e":"1848年のフランクフルト国民議会は小ドイツ主義の憲法を作り、プロイセン王を皇帝に推しましたが、王は拒否して統一は失敗しました。ギリシア独立の国際承認（1830年）、七月革命によるルイ＝フィリップの即位、ベルギーの独立は正しい内容です。","m":"フランクフルト国民議会＝プロイセン王が帝冠を拒否し失敗"},{"id":35,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"イタリア・ドイツの統一","y":1858,"q":"イタリアとドイツの統一について述べた次の文のうち、正しいものはどれですか。","c":["サルデーニャ王国はクリミア戦争に参戦し、プロンビエール密約でナポレオン3世の支援を得た。","ガリバルディは赤シャツ隊を率いてヴェネツィアを占領した。","イタリア王国はプロイセン＝フランス戦争に乗じてヴェネツィアを併合した。","北ドイツ連邦は、プロイセン＝フランス戦争の勝利後に結成された。"],"e":"サルデーニャ首相カヴールはクリミア戦争に参戦して国際的地位を高め、1858年にプロンビエール密約を結びました。ガリバルディが占領したのは両シチリア王国です。ヴェネツィアの併合はプロイセン＝オーストリア戦争（1866年）の際で、普仏戦争（1870年）の際に併合したのは教皇領です。北ドイツ連邦は普墺戦争後の1867年に結成されました。","m":"1866普墺→ヴェネツィア・北ドイツ連邦／1870普仏→教皇領"},{"id":36,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"19世紀イギリスの改革","y":1846,"q":"19世紀のイギリスの自由主義的改革について述べた次の文のうち、誤っているものはどれですか。","c":["チャーティスト運動の結果、1840年代に男性普通選挙が実現した。","第1回選挙法改正で、産業資本家などに選挙権が広がった。","穀物法が廃止され、自由貿易体制へ向かった。","審査法が廃止され、カトリック教徒解放法も制定された。"],"e":"チャーティスト運動は人民憲章を掲げて男性普通選挙などを求めましたが、当時は実現しませんでした。男性の普通選挙に近づくのは第3回・第4回選挙法改正以降です。第1回選挙法改正（1832年）、穀物法廃止（1846年）、審査法廃止（1828年）とカトリック教徒解放法（1829年）は正しい内容です。","m":"チャーティスト運動＝当時は失敗、要求は後に実現"},{"id":37,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"アメリカ合衆国の領土拡大","y":1848,"q":"アメリカ合衆国の領土拡大について述べた次の文のうち、正しいものはどれですか。","c":["アメリカ＝メキシコ戦争の結果、カリフォルニアを獲得した。","ルイジアナをスペインから買収した。","フロリダをフランスから買収した。","アラスカをイギリスから買収した。"],"e":"アメリカは1848年、アメリカ＝メキシコ戦争に勝ってカリフォルニアなどを獲得し、直後に金鉱が発見されてゴールドラッシュが起こりました。ルイジアナは1803年にフランス（ナポレオン）から、フロリダは1819年にスペインから、アラスカは1867年にロシアから買収しました。","m":"ルイジアナ＝仏／フロリダ＝西／カリフォルニア＝墨／アラスカ＝露"},{"id":38,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"南北戦争","y":1862,"q":"アメリカ南北戦争の時期について述べた次の文のうち、誤っているものはどれですか。","c":["南部は保護関税政策を求め、北部は自由貿易を主張した。","カンザス・ネブラスカ法は、奴隷制の可否を住民の決定にゆだねた。","戦争中に、公有地に5年間定住した者に土地を与えるホームステッド法が制定された。","リンカンは戦争中に奴隷解放宣言を出した。"],"e":"綿花を輸出する南部は自由貿易を、工業化を進める北部は保護関税を求めました。対立が逆になっています。カンザス・ネブラスカ法（1854年）の住民主権、ホームステッド法（1862年）による西部農民の支持獲得、奴隷解放宣言（1863年）は正しい内容です。","m":"北部＝保護関税・奴隷制反対／南部＝自由貿易・奴隷制"},{"id":39,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"19世紀の文化","y":1830,"q":"19世紀ヨーロッパの文化について述べた次の文のうち、正しいものはどれですか。","c":["ドラクロワは、七月革命を題材に「民衆を導く自由の女神」を描いた。","ミレーは、光の変化をとらえる印象派の代表的な画家である。","ゾラは、ナポレオンのロシア遠征を背景に『戦争と平和』を著した。","ランケは、史的唯物論を唱えて近代歴史学を確立した。"],"e":"ドラクロワはロマン主義の画家で、七月革命を題材に作品を描きました。ミレーは「落ち穂拾い」などで知られる自然主義の画家で、印象派ではありません。『戦争と平和』はトルストイの作品で、ゾラは自然主義文学の作家です。ランケは史料批判にもとづく近代歴史学を確立しました。史的唯物論はマルクスの考え方です。","m":"ロマン主義＝ドラクロワ／自然主義＝ミレー・ゾラ"},{"id":40,"k":"plan","ref":"想定問題","f":"近世・近代の欧米","t":"19世紀の科学","y":1859,"q":"19世紀の自然科学について述べた次の文のうち、誤っているものはどれですか。","c":["コッホは、放射性元素のラジウムを発見した。","ダーウィンは『種の起源』を著し、進化論を唱えた。","パストゥールは、狂犬病の予防接種法を開発した。","レントゲンは、X線を発見した。"],"e":"ラジウムを発見したのはキュリー夫妻です。コッホは結核菌やコレラ菌を発見したドイツの細菌学者です。ダーウィンの『種の起源』（1859年）、パストゥールの狂犬病予防接種法、レントゲンのX線発見はいずれも正しい内容です。","m":"ラジウム＝キュリー夫妻／結核菌＝コッホ"},{"id":41,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"殷・周と春秋時代","y":-1100,"q":"古代中国の殷・周と春秋時代について述べた次の文のうち、誤っているものはどれですか。","c":["殷は鎬京を都とし、王が神意を占って政治を行った。","殷では、占いの内容が甲骨文字で記録された。","周は一族や功臣に封土を与えて諸侯とし、世襲させた。","春秋時代には、斉の桓公や晋の文公が覇者として諸侯を率いた。"],"e":"鎬京は周の都で、殷の後期の都の遺跡は河南省安陽の殷墟です。殷は神権政治を行い、亀甲や獣骨に甲骨文字で占いを記録しました。周の封建制、春秋時代の覇者（斉の桓公・晋の文公など）は正しい内容です。周は前770年に東の洛邑へ遷都しました。","m":"殷＝殷墟（安陽）／周＝鎬京→洛邑"},{"id":42,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"諸子百家","y":-300,"q":"諸子百家について述べた次の文のうち、正しいものはどれですか。","c":["孟子は性善説を唱え、徳を失った君主を交代させる易姓革命を認めた。","荀子は血縁を超えた無差別の愛（兼愛）を説いた。","韓非は無為自然を説き、作為を退けた。","鄒衍は、名家の代表として論理学を発展させた。"],"e":"孟子は性善説と王道政治を説き、易姓革命を正当化しました。兼愛は墨子の主張で、荀子は性悪説に立って礼による秩序を説きました。無為自然は老子・荘子の道家の思想で、韓非は法家を大成しました。鄒衍は陰陽五行説を唱えた陰陽家で、名家の代表は公孫竜です。","m":"孟子＝性善／荀子＝性悪・礼／墨子＝兼愛／韓非＝法家"},{"id":43,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"漢の政治","y":-139,"q":"漢の政治について述べた次の文のうち、誤っているものはどれですか。","c":["前漢の武帝のとき、宦官が官僚を弾圧する党錮の禁が起こった。","前漢の武帝は、大月氏と結ぶために張騫を西方に派遣した。","前漢の武帝は、財政再建のため均輸法・平準法を実施した。","劉秀（光武帝）は、赤眉の乱などで新が滅んだのち漢を再興した。"],"e":"党錮の禁は後漢末の2世紀後半に起こり、宦官が反対派の官僚・学者を弾圧しました。前漢の武帝は匈奴を挟撃するため張騫を大月氏に派遣し、塩・鉄・酒の専売や均輸・平準法で財政を立て直しました。王莽の新が赤眉の乱で倒れた後、劉秀が漢を再興しました（後漢、都は洛陽）。","m":"党錮の禁＝後漢末（宦官vs官僚）"},{"id":44,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"魏晋南北朝","y":220,"q":"魏晋南北朝時代について述べた次の文のうち、正しいものはどれですか。","c":["魏は、九品中正（九品官人法）を始めた。","北魏の孝文帝は均田制を始め、鮮卑の風習を奨励した。","東晋の王羲之は、「女史箴図」を描いた。","西晋は、八王の乱ののち鮮卑によって滅ぼされた。"],"e":"魏の曹丕は九品中正を始めましたが、豪族の官職独占を招きました。北魏の孝文帝は均田制を始めたほか、鮮卑の服装・言語を禁じる漢化政策を進めました。「女史箴図」は東晋の顧愷之の作とされ、王羲之は書家です。西晋は八王の乱後、匈奴の攻撃（永嘉の乱）で滅びました。","m":"九品中正＝魏／均田制・漢化＝孝文帝／女史箴図＝顧愷之"},{"id":45,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"唐と朝鮮半島","y":668,"q":"唐の時代について述べた次の文のうち、誤っているものはどれですか。","c":["唐は高句麗と結び、新羅と百済を滅ぼした。","唐の中央には、三省・六部などの官制が置かれた。","780年、宰相楊炎の献策により両税法が施行された。","節度使の安禄山らが反乱を起こし、唐は混乱した。"],"e":"唐は新羅と結んで百済（660年）と高句麗（668年）を滅ぼし、その後、新羅が朝鮮半島を統一しました。中書・門下・尚書の三省と六部の官制、楊炎による両税法、安禄山と史思明による安史の乱（755〜763年）は正しい内容です。","m":"唐＋新羅→百済660・高句麗668滅亡→新羅統一"},{"id":46,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"宋の政治と社会","y":1069,"q":"宋の時代について述べた次の文のうち、正しいものはどれですか。","c":["王安石は青苗法や募役法などの新法を実施した。","北宋は澶淵の盟を結び、金に毎年銀や絹を贈った。","南宋は臨安を都としたが、靖康の変によって滅んだ。","朱熹は知行合一を説く陽明学を大成した。"],"e":"神宗に登用された王安石は、青苗法・募役法・市易法などの新法で財政再建と富国強兵をはかりました。澶淵の盟（1004年）は遼との和約です。靖康の変（1126〜27年）で滅んだのは北宋で、その後、南宋が臨安を都としました。朱熹は朱子学を大成し、陽明学は明の王守仁（王陽明）が説きました。","m":"澶淵の盟＝遼／靖康の変＝金が北宋を滅ぼす"},{"id":47,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"モンゴル帝国の拡大","y":1241,"q":"モンゴル帝国の拡大に関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　フレグ（フラグ）がバグダードを攻略し、アッバース朝を滅ぼした。\nイ　バトゥの遠征軍がワールシュタット（リーグニッツ）の戦いでドイツ・ポーランド軍を破った。\nウ　オゴデイ（オゴタイ）が金を滅ぼした。","c":["ウ→イ→ア","イ→ウ→ア","ウ→ア→イ","ア→ウ→イ"],"e":"オゴデイは1234年に金を滅ぼしました（ウ）。バトゥの西征軍は1241年にワールシュタットの戦いで勝利しました（イ）。フレグは1258年にバグダードを攻略してアッバース朝を滅ぼし、イル＝ハン国を建てました（ア）。南宋の滅亡は1276年（首都臨安の陥落）で、フビライの時代です。","m":"1234金滅亡→1241ワールシュタット→1258アッバース朝滅亡"},{"id":48,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"元代の東西交流","y":1294,"q":"元の時代の東西交流について述べた次の文のうち、正しいものはどれですか。","c":["モンテ＝コルヴィノは大都でカトリックを布教した。","プラノ＝カルピニは、フランス王ルイ9世の命でカラコルムを訪れた。","イブン＝バットゥータは、旅行記『世界の記述』を口述した。","元は交鈔の発行をやめ、銀だけを通貨とした。"],"e":"モンテ＝コルヴィノは教皇の命で大都に至り、初めてカトリックを布教しました。プラノ＝カルピニを派遣したのは教皇インノケンティウス4世で、ルイ9世が派遣したのはルブルックです。『世界の記述』（東方見聞録）はマルコ＝ポーロの旅行記で、イブン＝バットゥータは『三大陸周遊記』を残しました。元は紙幣の交鈔を主要な通貨としました。","m":"カルピニ＝教皇／ルブルック＝ルイ9世／モンテ＝コルヴィノ＝大都"},{"id":49,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"明の政治","y":1449,"q":"明の時代について述べた次の文のうち、誤っているものはどれですか。","c":["正統帝は、土木の変でタタールのアルタン＝ハンに捕らえられた。","洪武帝は里甲制をしき、租税台帳や土地台帳をつくらせた。","永楽帝は靖難の役で帝位につき、北京に都を移した。","万暦帝の時代、張居正が一条鞭法を全国に広めた。"],"e":"土木の変（1449年）で正統帝を捕らえたのは、オイラトのエセンです。タタールのアルタン＝ハンは16世紀に北京を包囲した人物です。洪武帝の里甲制・賦役黄冊・魚鱗図冊、永楽帝の靖難の役と北京遷都、張居正による一条鞭法の全国実施は正しい内容です。","m":"土木の変1449＝オイラトのエセン／北虜＝アルタン＝ハン"},{"id":50,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"清の皇帝","y":1729,"q":"清の皇帝について述べた次の文のうち、正しいものはどれですか。","c":["雍正帝は軍機処を設置し、皇帝の独裁体制を強めた。","乾隆帝は、三藩の乱を鎮圧した。","康熙帝はジュンガルを滅ぼし、その地を新疆と名づけた。","順治帝はロシアとネルチンスク条約を結んだ。"],"e":"雍正帝は軍事・政治の最高機関として軍機処を設け、キャフタ条約も結びました。三藩の乱の鎮圧（1681年）とネルチンスク条約（1689年）は康熙帝の時代です。ジュンガルを滅ぼして新疆と名づけたのは乾隆帝です。順治帝は北京に入城した最初の皇帝です。","m":"康熙＝三藩・ネルチンスク／雍正＝軍機処・キャフタ／乾隆＝新疆"},{"id":51,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"朝鮮半島の王朝","y":1446,"q":"朝鮮半島の王朝について述べた次の文のうち、正しいものはどれですか。","c":["朝鮮王朝の世宗は、訓民正音（ハングル）を制定した。","高麗では、骨品制という身分制度がしかれた。","高麗は、倭寇を撃退した李成桂によって建国された。","朝鮮王朝は開城を都とした。"],"e":"朝鮮王朝第4代の世宗は1446年に訓民正音を公布し、金属活字の印刷も進めました。骨品制は新羅の身分制度です。高麗は王建が建国し、開城を都としました。李成桂は高麗を倒して朝鮮王朝を建て、漢城（現在のソウル）を都としました。","m":"高麗＝王建・開城／朝鮮＝李成桂・漢城・世宗の訓民正音"},{"id":52,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"北方遊牧民","y":840,"q":"モンゴル高原の遊牧国家について述べた次の文のうち、誤っているものはどれですか。","c":["匈奴の冒頓単于は、前漢の武帝を白登山で包囲した。","突厥は、独自の突厥文字を用いた。","ウイグルは、安史の乱の際に唐を援助した。","ウイグルは、840年にキルギスの攻撃を受けて崩壊した。"],"e":"冒頓単于が白登山で包囲したのは前漢の高祖（劉邦）です。この後、漢は匈奴に対して和親策をとり、武帝の時代に攻勢に転じました。突厥文字の使用、ウイグルの唐への援軍と安史の乱、840年のキルギスによるウイグル崩壊は正しい内容です。","m":"白登山＝高祖が冒頓に包囲される→和親策→武帝が反撃"},{"id":53,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"周辺民族の国家","y":630,"q":"中国周辺の諸民族の国家について述べた次の文のうち、正しいものはどれですか。","c":["吐蕃はソンツェン＝ガンポが建国し、インド系の文字をもとにチベット文字がつくられた。","西夏は李元昊が建国し、契丹文字を用いた。","遼は、燕雲十六州を金から獲得した。","金は、漢人を猛安・謀克の制度で統治した。"],"e":"吐蕃はソンツェン＝ガンポが7世紀に建て、インド系文字をもとにチベット文字がつくられました。西夏が用いたのは西夏文字で、契丹文字は遼の文字です。遼が燕雲十六州を得たのは五代の後晋からです。金は女真人を猛安・謀克で、漢人を州県制で治める二重統治を行いました。","m":"燕雲十六州＝後晋→遼／金＝猛安謀克（女真）＋州県制（漢人）"},{"id":54,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"アヘン戦争と不平等条約","y":1842,"q":"アヘン戦争とその後の条約について述べた次の文のうち、誤っているものはどれですか。","c":["清は、フランスと望厦条約、アメリカと黄埔条約を結んだ。","林則徐は広州でアヘンを没収・廃棄した。","南京条約で、清は香港島を割譲し、5港を開き、公行を廃止した。","虎門寨追加条約で、イギリスは領事裁判権や最恵国待遇を認めさせた。"],"e":"1844年、清はアメリカと望厦条約、フランスと黄埔条約を結びました。組合せが逆です。林則徐のアヘン没収（1839年）、南京条約（1842年）による香港島割譲・上海など5港の開港・公行廃止、虎門寨追加条約（1843年）での領事裁判権・協定関税・最恵国待遇は正しい内容です。","m":"望厦＝米・黄埔＝仏（1844）"},{"id":55,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"清末の改革と列強","y":1898,"q":"清末の出来事に関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　康有為らが光緒帝のもとで政治改革（変法）を進めた。\nイ　日清戦争の講和条約で、清は朝鮮の独立を認めた。\nウ　義和団事件の講和として、北京議定書が結ばれた。","c":["イ→ア→ウ","ア→イ→ウ","イ→ウ→ア","ア→ウ→イ"],"e":"下関条約は1895年で、清は朝鮮の独立、遼東半島・台湾などの割譲を認めました（イ）。その後の列強の中国分割に危機感を強めた康有為らが1898年に戊戌の変法を進めましたが、西太后らの戊戌の政変で失敗しました（ア）。義和団事件後の1901年、北京議定書で巨額の賠償金と外国軍の北京駐屯が認められました（ウ）。","m":"1895下関→1898戊戌の変法→1901北京議定書"},{"id":56,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"中国革命と国共関係","y":1905,"q":"20世紀前半の中国について述べた次の文のうち、正しいものはどれですか。","c":["孫文は東京で中国同盟会を結成し、三民主義を掲げた。","辛亥革命の後、袁世凱が臨時大総統となって南京で中華民国の建国を宣言した。","五・四運動の結果、日本の二十一か条要求はすべて撤回された。","第1次国共合作は、西安事件をきっかけに成立した。"],"e":"孫文は1905年に東京で中国同盟会を結成し、民族・民権・民生の三民主義を掲げました。1912年に南京で中華民国の成立を宣言し、臨時大総統に就いたのは孫文で、袁世凱はその後に地位を譲られました。五・四運動（1919年）の結果、中国はヴェルサイユ条約の調印を拒否しましたが、要求の全面撤回ではありません。西安事件（1936年）から生まれたのは第2次国共合作です。","m":"1905中国同盟会（東京）／第1次合作1924・第2次合作1937"},{"id":57,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"中国の編纂事業","y":1407,"q":"明・清の大規模な編纂事業について述べた次の文のうち、正しいものはどれですか。","c":["『永楽大典』は、明の永楽帝の命で編纂された。","『四庫全書』は、清の康熙帝の命で編纂された。","『康熙字典』は、清の雍正帝の命で編纂された。","『古今図書集成』は、清の乾隆帝の時代に編纂が始まり完成した。"],"e":"明の永楽帝は『永楽大典』や『四書大全』『五経大全』を編纂させました。『四庫全書』は乾隆帝の命による叢書です。『康熙字典』は康熙帝の命による字書です。『古今図書集成』は康熙帝の時代に編纂が始まり、雍正帝の時代に完成しました。こうした編纂事業は、学者を懐柔する一方で、禁書や文字の獄による思想統制とともに行われました。","m":"永楽大典＝永楽帝／康熙字典＝康熙帝／四庫全書＝乾隆帝"},{"id":58,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"イエズス会宣教師","y":1602,"q":"明・清で活動したイエズス会宣教師について述べた次の文のうち、誤っているものはどれですか。","c":["フェルビーストは、徐光啓と協力してエウクレイデスの幾何学を『幾何原本』として漢訳した。","マテオ＝リッチは、世界地図「坤輿万国全図」を作成した。","アダム＝シャールは、徐光啓らとともに『崇禎暦書』の作成に関わった。","カスティリオーネは、円明園の西洋風建築の設計に参加した。"],"e":"徐光啓とともに『幾何原本』を漢訳したのはマテオ＝リッチです。フェルビースト（南懐仁）は清の康熙帝に仕え、暦法の改定や大砲の鋳造に関わりました。リッチの「坤輿万国全図」、アダム＝シャールの『崇禎暦書』、カスティリオーネの円明園設計は正しい内容です。","m":"幾何原本・坤輿万国全図＝マテオ＝リッチ"},{"id":59,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"日明貿易","y":1404,"q":"15世紀初め、室町幕府の将軍は明の皇帝から「日本国王」に封じられ、勘合を用いた朝貢形式の貿易を始めました。勘合貿易が始まった時期の将軍と明の皇帝の組合せとして正しいものはどれですか。","c":["足利義満―永楽帝","足利義満―洪武帝","足利義政―永楽帝","足利義教―万暦帝"],"e":"足利義満は明に使いを送って「日本国王」に封じられ、1404年から永楽帝のもとで勘合貿易を始めました。洪武帝は明の建国者で海禁政策をとりましたが、勘合貿易開始時の皇帝ではありません。足利義政は応仁の乱のころの将軍、万暦帝は16世紀後半から17世紀初めの皇帝で、勘合貿易はその前の16世紀半ばに途絶えています。","m":"勘合貿易1404＝義満×永楽帝（海禁下の朝貢貿易）"},{"id":60,"k":"plan","ref":"想定問題","f":"東アジア・内陸アジア","t":"中華人民共和国の歩み","y":1966,"q":"中華人民共和国の歩みについて述べた次の文のうち、誤っているものはどれですか。","c":["1972年のニクソン大統領の訪中の翌年、日中平和友好条約が結ばれた。","1958年から大躍進政策が進められ、人民公社が組織された。","1966年に文化大革命が始まり、紅衛兵が動員された。","1978年以降、鄧小平の指導のもとで改革開放政策が進められた。"],"e":"ニクソン訪中と同じ1972年には、田中角栄首相が訪中して日中共同声明を出し、国交を正常化しました。日中平和友好条約は1978年の締結です。大躍進政策と人民公社（1958年）、文化大革命（1966年）、鄧小平による改革開放は正しい内容です。","m":"1972ニクソン訪中・日中共同声明→1978日中平和友好条約"},{"id":61,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"イスラーム国家の成立","y":751,"q":"イスラーム世界の成立と拡大について述べた次の文のうち、誤っているものはどれですか。","c":["アッバース朝は第2代カリフのマンスールのもとで、ダマスクスに新都を建設した。","ムハンマドは622年にメッカからメディナに移住した。","ムハンマドの死後、アブー＝バクルが初代の正統カリフに選ばれた。","ウマイヤ朝は、ムアーウィヤがダマスクスを都として開いた。"],"e":"マンスールが建設した新都はティグリス川沿いのバグダードです。ダマスクスはウマイヤ朝の都でした。ヒジュラ（622年）、アブー＝バクルの初代正統カリフ就任、ムアーウィヤのウマイヤ朝創始（661年）は正しい内容です。アッバース朝は751年、タラス河畔の戦いで唐軍を破りました。","m":"ウマイヤ朝＝ダマスクス／アッバース朝＝バグダード（マンスール）"},{"id":62,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"イスラーム諸王朝の統治","y":762,"q":"イスラーム諸王朝について述べた次の文のうち、正しいものはどれですか。","c":["アッバース朝では、イスラーム教徒であればアラブ人でなくてもジズヤ（人頭税）を課されなくなった。","ウマイヤ朝では、改宗した非アラブ人（マワーリー）もジズヤを免除された。","ファーティマ朝はスンナ派の王朝で、カイロにアズハル学院を建てた。","セルジューク朝の君主は、バグダードに入城してカリフからカリフの称号を授けられた。"],"e":"アッバース朝ではムスリム間の平等がはかられ、ムスリムであればジズヤは課されず、土地をもつ者はアラブ人でもハラージュ（地租）を納めました。ウマイヤ朝ではマワーリーにもジズヤが課され、不満を招きました。ファーティマ朝はシーア派（イスマーイール派）です。セルジューク朝のトゥグリル＝ベクはカリフからスルタンの称号を授けられました。","m":"アッバース革命＝ムスリム平等／セルジューク＝スルタン称号"},{"id":63,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"イスラーム文化","y":1020,"q":"イスラーム世界の学者・文人と業績について述べた次の文のうち、正しいものはどれですか。","c":["イブン＝シーナーは、『医学典範』を著した。","イブン＝ルシュドは、『世界史序説』を著した。","フワーリズミーは、四行詩集『ルバイヤート』を著した。","ガザーリーは、叙事詩『シャー＝ナーメ』を著した。"],"e":"イブン＝シーナー（アヴィケンナ）の『医学典範』はラテン語に訳され、ヨーロッパの医学教育で長く使われました。『世界史序説』はイブン＝ハルドゥーンの著作で、イブン＝ルシュドはアリストテレスの注釈で知られます。『ルバイヤート』はウマル＝ハイヤーム、『シャー＝ナーメ』はフィルドゥシーの作品です。フワーリズミーは代数学、ガザーリーは神秘主義を取り入れた神学者です。","m":"医学典範＝イブン＝シーナー／世界史序説＝イブン＝ハルドゥーン"},{"id":64,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"13〜14世紀のイスラーム世界","y":1295,"q":"13〜14世紀のイスラーム世界について述べた次の文のうち、誤っているものはどれですか。","c":["イル＝ハン国のガザン＝ハンは、仏教を国教とした。","サラーフ＝アッディーンは、ファーティマ朝を倒してアイユーブ朝を開いた。","マムルーク朝のもとでは、カーリミー商人が香辛料などの交易で活躍した。","ムラービト朝は、西アフリカのガーナ王国を攻撃した。"],"e":"イル＝ハン国のガザン＝ハンはイスラームに改宗し、これを国教としました。宰相ラシード＝アッディーンに『集史』を編纂させたことでも知られます。サラーフ＝アッディーンのアイユーブ朝建国（1169年）、マムルーク朝のカーリミー商人、ムラービト朝のガーナ攻撃（1076年）は正しい内容です。","m":"ガザン＝ハン＝イスラーム化・集史（ラシード＝アッディーン）"},{"id":65,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"オスマン帝国の最盛期","y":1538,"q":"オスマン帝国について述べた次の文のうち、正しいものはどれですか。","c":["スレイマン1世はウィーンを包囲し、プレヴェザの海戦でスペインやヴェネツィアなどの連合艦隊を破った。","セリム1世は、モハーチの戦いでハンガリー軍を破った。","バヤジット1世は、アンカラの戦いでティムール軍を破った。","オスマン帝国はレパントの海戦に勝利し、地中海の制海権を確立した。"],"e":"スレイマン1世は1529年に第1次ウィーン包囲を行い、1538年のプレヴェザの海戦に勝利しました。モハーチの戦い（1526年）もスレイマン1世の時代で、セリム1世はマムルーク朝を滅ぼしました（1517年）。バヤジット1世はアンカラの戦い（1402年）でティムールに敗れ、捕虜となりました。レパントの海戦（1571年）ではスペインなどに敗れています。","m":"プレヴェザ1538勝利／レパント1571敗北"},{"id":66,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"サファヴィー朝とムガル帝国","y":1564,"q":"サファヴィー朝とムガル帝国について述べた次の文のうち、誤っているものはどれですか。","c":["ムガル帝国のアクバルはジズヤを復活し、ヒンドゥー教徒を圧迫した。","サファヴィー朝はイスマーイール1世が建て、シーア派の十二イマーム派を国教とした。","サファヴィー朝のアッバース1世は、イスファハーンに都を移した。","バーブルはパーニーパットの戦いでロディー朝を破り、ムガル帝国を開いた。"],"e":"アクバルは非ムスリムへのジズヤを廃止し、ヒンドゥー教徒との融和をはかりました。ジズヤを復活してヒンドゥー教徒の反発を招いたのはアウラングゼーブです。サファヴィー朝の建国と十二イマーム派の国教化、アッバース1世のイスファハーン遷都、バーブルのパーニーパットの戦い（1526年）は正しい内容です。","m":"アクバル＝ジズヤ廃止／アウラングゼーブ＝ジズヤ復活"},{"id":67,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"古代インドの王朝","y":-250,"q":"古代インドの王朝について述べた次の文のうち、正しいものはどれですか。","c":["マウリヤ朝のアショーカ王はダルマにもとづく政治を行い、仏典の結集を行ったとされる。","クシャーナ朝のカニシカ王は、パータリプトラを都とした。","グプタ朝のチャンドラグプタ2世の時代に、ガンダーラ美術が成立した。","サータヴァーハナ朝は、ガンジス川流域の北インドを統一した。"],"e":"アショーカ王はダルマ（法）による統治を掲げ、第3回仏典結集を行ったとされます。カニシカ王の都はプルシャプラで、パータリプトラはマウリヤ朝やグプタ朝の都です。ガンダーラ美術はクシャーナ朝期に栄え、グプタ朝期には純インド的なグプタ様式が生まれました。サータヴァーハナ朝はデカン高原の王朝で、ローマとの季節風交易で栄えました。","m":"カニシカ＝プルシャプラ・ガンダーラ／グプタ＝グプタ様式"},{"id":68,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"グプタ朝の文化","y":400,"q":"グプタ朝時代を中心とするインドの文化について述べた次の文のうち、誤っているものはどれですか。","c":["ゼロの概念は、グプタ朝の時代にギリシアからインドに伝わった。","ナーランダー僧院は仏教教学の中心となり、唐の玄奘もここで学んだ。","カーリダーサは、サンスクリット語で戯曲『シャクンタラー』を書いた。","『マヌ法典』は、このころまでに現在の形にまとめられた。"],"e":"ゼロの概念や十進法の位取りはインドで発達し、のちにイスラーム世界を経てヨーロッパに伝わりました。ギリシアから伝わったのではありません。ナーランダー僧院と玄奘、カーリダーサの『シャクンタラー』、『マヌ法典』の成立は正しい内容です。グプタ朝ではサンスクリット語が公用語化され、ヒンドゥー教が定着しました。","m":"ゼロ＝インド発→イスラーム→ヨーロッパ"},{"id":69,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"デリー＝スルタン朝","y":1206,"q":"インドのイスラーム化について述べた次の文のうち、正しいものはどれですか。","c":["デリー＝スルタン朝の最初の王朝である奴隷王朝は、アイバクが建てた。","ハルジー朝は、デリー＝スルタン朝の最後の王朝である。","南インドのヴィジャヤナガル王国は、イスラーム教徒の王朝である。","トゥグルク朝は、バーブルに滅ぼされた。"],"e":"1206年、ゴール朝の武将アイバクがデリーで奴隷王朝を開きました。その後ハルジー朝・トゥグルク朝・サイイド朝・ロディー朝と続き、最後のロディー朝がバーブルに滅ぼされました。ヴィジャヤナガル王国は南インドのヒンドゥー教国で、イスラーム勢力と抗争しました。","m":"奴隷→ハルジー→トゥグルク→サイイド→ロディー"},{"id":70,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"イギリスのインド支配","y":1905,"q":"イギリスのインド支配に関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　ベンガル分割令が出された。\nイ　ヴィクトリア女王を皇帝とするインド帝国が成立した。\nウ　イギリスの支援のもとで全インド＝ムスリム連盟が結成された。","c":["イ→ア→ウ","ア→イ→ウ","イ→ウ→ア","ア→ウ→イ"],"e":"インド大反乱後、1877年にインド帝国が成立しました（イ）。1905年、総督カーゾンはヒンドゥー教徒とムスリムの対立を利用してベンガル分割令を出し（ア）、国民会議派は反発して翌年のカルカッタ大会で4綱領を採択しました。同じ1906年、イギリスの支援で全インド＝ムスリム連盟が結成されました（ウ）。","m":"1877インド帝国→1905ベンガル分割→1906カルカッタ大会・ムスリム連盟"},{"id":71,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"インドの民族運動","y":1929,"q":"インドの民族運動について述べた次の文のうち、誤っているものはどれですか。","c":["1947年のインド独立法により、インドとパキスタンは一つの連邦国家として独立した。","1906年、国民会議派はスワラージ（自治）やスワデーシ（国産品愛用）などの4綱領を掲げた。","1919年、イギリスは令状なしの逮捕などを認めるローラット法を制定した。","1929年、国民会議派はラホール大会でプールナ＝スワラージ（完全独立）を決議した。"],"e":"1947年のインド独立法によって、ヒンドゥー教徒が多数のインド連邦と、ムスリムが多数のパキスタンが分離して独立しました。カルカッタ大会の4綱領（1906年）、ローラット法（1919年）、ネルーらが主導したラホール大会のプールナ＝スワラージ決議（1929年）は正しい内容です。","m":"1947インド・パキスタン分離独立"},{"id":72,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"古代・中世の東南アジア","y":690,"q":"東南アジアの諸国家について述べた次の文のうち、正しいものはどれですか。","c":["スマトラ島のシュリーヴィジャヤは海上交易で栄え、唐の義浄が滞在して仏教を学んだ。","ボロブドゥールは、カンボジアのアンコール朝が建てた仏教遺跡である。","チャンパーは、ベトナム北部でキン人（ベト人）が建てた国である。","パガン朝は、タイ人が建てた最初の王朝である。"],"e":"シュリーヴィジャヤはパレンバンを中心にマラッカ海峡の交易を握り、義浄は『南海寄帰内法伝』を著しました。ボロブドゥールはジャワ島のシャイレンドラ朝が建てました。チャンパーはベトナム中部のチャム人の国です。パガン朝はビルマ人の王朝で、タイ人の最初の本格的な王朝はスコータイ朝です。","m":"ボロブドゥール＝シャイレンドラ朝／パガン＝ビルマ人"},{"id":73,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"近世の東南アジア","y":1511,"q":"15〜17世紀の東南アジアについて述べた次の文のうち、誤っているものはどれですか。","c":["1511年、オランダがマラッカを占領した。","マラッカ王国は鄭和の艦隊の寄港地となり、のちにイスラームを受け入れた。","黎朝は明の支配を脱して、ベトナムに成立した。","タイのアユタヤ朝は、米などの交易で栄えた。"],"e":"1511年にマラッカを占領したのはポルトガルです。オランダがポルトガルからマラッカを奪ったのは1641年です。マラッカ王国が明の朝貢国となり鄭和の拠点になったことと、15世紀にイスラームを受け入れたこと、黎朝の成立（1428年）、アユタヤ朝の交易は正しい内容です。アユタヤには日本町もつくられました。","m":"1511ポルトガル→1641オランダがマラッカ占領"},{"id":74,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"東南アジアの植民地化","y":1887,"q":"19世紀以降の東南アジアの植民地化について述べた次の文のうち、正しいものはどれですか。","c":["フランスは清仏戦争後にベトナムの保護権を清に認めさせ、フランス領インドシナ連邦を成立させた。","スペインは、アメリカ＝スペイン戦争の後、フィリピンをイギリスに譲った。","タイのラタナコーシン朝は近代化を進めたが、イギリスの植民地となった。","ホセ＝リサールは、インドネシアの独立運動を指導した。"],"e":"フランスは清仏戦争後の天津条約（1885年）で保護権を認めさせ、1887年にフランス領インドシナ連邦をつくりました。フィリピンはアメリカ＝スペイン戦争の後、アメリカ領となりました。タイはラーマ5世（チュラロンコン）の近代化と英仏の緩衝地帯という条件で独立を守りました。ホセ＝リサールはフィリピンの民族運動の指導者です。","m":"インドシナ連邦1887／タイ＝独立維持／リサール＝フィリピン"},{"id":75,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"古代・中世のアフリカ","y":350,"q":"アフリカの諸国家について述べた次の文のうち、正しいものはどれですか。","c":["クシュ王国はメロエに都を移し、製鉄で栄えた。","エチオピアのアクスム王国は、イスラームを受け入れてクシュ王国を滅ぼした。","ソンガイ王国のマンサ＝ムーサは、メッカ巡礼の際に大量の金を用いた。","大ジンバブエ遺跡は、西アフリカのニジェール川流域にある。"],"e":"クシュ王国は都をメロエに移し、製鉄とメロエ文字で知られます。アクスム王国は4世紀にクシュを滅ぼし、キリスト教を受け入れました。メッカ巡礼で知られるマンサ＝ムーサはマリ王国の王です。大ジンバブエ遺跡は南部アフリカにあり、モノモタパ王国などショナ人の国家と結びつけられます。","m":"メロエ＝クシュ／マンサ＝ムーサ＝マリ／大ジンバブエ＝南部"},{"id":76,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"インド洋交易","y":1498,"q":"インド洋交易と東アフリカについて述べた次の文のうち、誤っているものはどれですか。","c":["スワヒリ語は、アラビア語とラテン語がまじり合って成立した。","ムスリム商人は、三角帆をもつダウ船を用いて交易を行った。","マリンディ・モンバサ・キルワなどの港市が、海上交易で栄えた。","ヴァスコ＝ダ＝ガマは、マリンディでムスリムの水先案内人を得てインドに向かった。"],"e":"スワヒリ語は、東アフリカのバントゥー系の言語にアラビア語の語彙が多く取り入れられて成立しました。ラテン語は関係ありません。ダウ船による交易、マリンディなどの港市の繁栄、ヴァスコ＝ダ＝ガマがマリンディで水先案内人を得たことは正しい内容です。東アフリカ沿岸には明の鄭和の艦隊の一部も到達しました。","m":"スワヒリ語＝バントゥー系言語＋アラビア語"},{"id":77,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"アフリカ分割","y":1885,"q":"列強のアフリカ分割について述べた次の文のうち、正しいものはどれですか。","c":["ビスマルクの提唱で開かれたベルリン会議（ベルリン＝コンゴ会議）で、先占権の原則が確認された。","ファショダ事件は、イギリスとドイツの軍が衝突しかけた事件である。","南アフリカ戦争で、イギリスはズールー人の国家を征服した。","エチオピアは、アドワの戦いでドイツ軍を破った。"],"e":"1884〜85年のベルリン会議では、コンゴ自由国がベルギー王の私有地とされ、先に実効支配した国が領有できる先占権が確認されました。ファショダ事件（1898年）は縦断政策のイギリスと横断政策のフランスの衝突です。南アフリカ戦争（1899〜1902年）の相手はブール人のトランスヴァール共和国とオレンジ自由国です。アドワの戦い（1896年）でエチオピアが破ったのはイタリアです。","m":"ファショダ＝英×仏／アドワ＝エチオピア×イタリア"},{"id":78,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"アフリカ諸国の独立","y":1960,"q":"第二次世界大戦後のアフリカについて述べた次の文のうち、誤っているものはどれですか。","c":["アルジェリアは、長い独立戦争を経て1950年代にイギリスから独立した。","1957年、エンクルマの指導のもとガーナが独立した。","1960年には多数の国が独立し、「アフリカの年」と呼ばれた。","1963年、アフリカ諸国の連帯をめざしてアフリカ統一機構（OAU）が結成された。"],"e":"アルジェリアはフランスとの独立戦争を経て、ド＝ゴール政権のもとで1962年に独立しました。イギリスからではありません。エンクルマの指導によるガーナの独立（1957年）、17か国が独立した「アフリカの年」（1960年）、OAUの結成（1963年）は正しい内容です。","m":"アルジェリア1962＝仏から独立／ガーナ1957エンクルマ"},{"id":79,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"オスマン帝国の近代化","y":1876,"q":"オスマン帝国の近代化に関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　宰相ミドハト＝パシャが起草した憲法が発布された。\nイ　ギュルハネ勅令が出され、タンジマートが始まった。\nウ　「統一と進歩団」が蜂起し、停止されていた憲法が復活した。","c":["イ→ア→ウ","ア→イ→ウ","イ→ウ→ア","ア→ウ→イ"],"e":"アブデュルメジト1世のギュルハネ勅令（1839年）でタンジマートが始まりました（イ）。1876年にミドハト憲法が発布されました（ア）が、アブデュルハミト2世はロシア＝トルコ戦争を理由に1878年に憲法を停止しました。1908年、「統一と進歩団」による青年トルコ革命で憲法が復活しました（ウ）。","m":"1839タンジマート→1876ミドハト憲法→1908青年トルコ革命"},{"id":80,"k":"plan","ref":"想定問題","f":"イスラーム・南アジア・東南アジア・アフリカ","t":"近現代のイラン","y":1891,"q":"19〜20世紀のイランについて述べた次の文のうち、正しいものはどれですか。","c":["タバコ＝ボイコット運動は、イギリス人へのタバコの独占的利権の譲渡に反対して起こった。","トルコマンチャーイ条約で、イランはイギリスに治外法権を認めた。","1951年、モサッデグ首相はフランス資本の石油会社を国有化した。","1979年のイラン革命で、パフレヴィー朝はホメイニを国王に迎えた。"],"e":"1891年、カージャール朝がイギリス人にタバコの独占利権を与えたことに対し、ウラマーと商人を中心にタバコ＝ボイコット運動が起こりました。トルコマンチャーイ条約（1828年）の相手はロシアです。モサッデグが国有化したのはイギリス系のアングロ＝イラニアン石油会社です。イラン革命ではパフレヴィー朝が倒れ、ホメイニを指導者とするイスラーム共和国が成立しました。","m":"トルコマンチャーイ＝露／石油国有化＝英系会社"},{"id":81,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"アメリカ大陸の古代文明","y":1533,"q":"アメリカ大陸の先住民の文明について述べた次の文のうち、正しいものはどれですか。","c":["インカ帝国はクスコを都とし、縄の結び目で数量などを記録するキープを用いた。","アステカ王国はユカタン半島で栄え、ピサロに滅ぼされた。","マヤ文明では、鉄器と車輪が広く用いられた。","インカ帝国は、コルテスに滅ぼされた。"],"e":"インカ帝国はアンデス高地のクスコを都とし、文字のかわりにキープで情報を記録し、道路網を整えました。1533年にピサロに滅ぼされています。アステカ王国はメキシコ高原のテノチティトランを都とし、1521年にコルテスに滅ぼされました。ユカタン半島はマヤ文明の地域です。アメリカ大陸の古代文明は鉄器や車輪をもたず、マヤ文明では二十進法やゼロの記号が用いられました。","m":"アステカ＝テノチティトラン・コルテス／インカ＝クスコ・ピサロ"},{"id":82,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"スペインのアメリカ支配","y":1545,"q":"16世紀のスペイン・ポルトガルのアメリカ進出について述べた次の文のうち、誤っているものはどれですか。","c":["トルデシリャス条約で、ブラジルはスペインの勢力範囲とされた。","スペインは入植者に先住民の統治とキリスト教化を委ね、労働力として使わせるエンコミエンダ制をとった。","ラス＝カサスは、先住民の酷使を告発した。","ポトシ銀山などから大量の銀がヨーロッパに流入し、価格革命の一因となった。"],"e":"1494年のトルデシリャス条約で定めた境界線の東側はポルトガルの勢力範囲とされ、のちにブラジルはポルトガル領となりました。エンコミエンダ制、ドミニコ会士ラス＝カサスの告発、ポトシ銀山（1545年発見）の銀による価格革命は正しい内容です。アメリカ大陸の銀はアカプルコ貿易によってマニラを経て中国にも流れ込みました。","m":"トルデシリャス1494→ブラジル＝ポルトガル"},{"id":83,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"ラテンアメリカ諸国の独立","y":1804,"q":"ラテンアメリカ諸国の独立について述べた次の文のうち、正しいものはどれですか。","c":["ハイチはトゥサン＝ルヴェルチュールらの指導で独立運動を進め、1804年に独立した。","シモン＝ボリバルは、アルゼンチン・チリの独立を指導した。","ブラジルは、スペインから独立して帝国となった。","アメリカのモンロー大統領は、ラテンアメリカの独立運動へのヨーロッパ諸国の干渉を支持した。"],"e":"フランス領サン＝ドマングでは黒人奴隷の反乱からトゥサン＝ルヴェルチュールが独立運動を指導し、1804年にハイチが最初の黒人共和国として独立しました。ボリバルは大コロンビアなど北部の独立を指導し、アルゼンチン・チリの独立はサン＝マルティンが進めました。ブラジルはポルトガルから独立しました（1822年）。モンロー宣言（1823年）はヨーロッパの干渉に反対したものです。","m":"ハイチ1804／北部＝ボリバル／南部＝サン＝マルティン"},{"id":84,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"メキシコ革命","y":1910,"q":"メキシコの近代史について述べた次の文のうち、誤っているものはどれですか。","c":["フランスのナポレオン3世は、メキシコ革命に干渉してマクシミリアンを皇帝に立てた。","メキシコ革命は、ディアスの長期独裁に対するマデロらの反乱から始まった。","メキシコ革命では、サパタやビリャが農民を率いて戦った。","1917年、メキシコでは土地改革などを定めた民主的な憲法が制定された。"],"e":"ナポレオン3世のメキシコ出兵は1860年代のことで、フアレス政権に介入してオーストリア皇帝の弟マクシミリアンを皇帝に立てましたが失敗しました。メキシコ革命（1910年〜）より半世紀ほど前の出来事です。ディアス独裁に対するマデロの反乱、サパタ・ビリャの農民運動、1917年憲法の制定は正しい内容です。","m":"メキシコ出兵1861〜67（フアレス）／メキシコ革命1910"},{"id":85,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"アメリカのカリブ海政策","y":1901,"q":"20世紀前半のアメリカ合衆国の対ラテンアメリカ政策について述べた次の文のうち、正しいものはどれですか。","c":["アメリカ＝スペイン戦争の後、アメリカはキューバの憲法にプラット条項を加えさせ、事実上の保護国とした。","セオドア＝ローズヴェルトは、内政干渉を控える善隣外交を進めた。","ウィルソンは、経済進出を重んじるドル外交を進めた。","フランクリン＝ローズヴェルトは、武力を背景にカリブ海に干渉する棍棒外交を進めた。"],"e":"1901年、アメリカはプラット条項によってキューバを事実上の保護国としました。棍棒外交（カリブ海政策）はセオドア＝ローズヴェルト、ドル外交はタフト、善隣外交はフランクリン＝ローズヴェルトの政策です。ウィルソンは民主主義の理念を掲げる宣教師外交を唱えながら、メキシコ革命に干渉しました。","m":"棍棒＝T.ローズヴェルト／ドル＝タフト／善隣＝F.ローズヴェルト"},{"id":86,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"冷戦期のラテンアメリカ","y":1973,"q":"第二次世界大戦後のラテンアメリカについて述べた次の文のうち、誤っているものはどれですか。","c":["アルゼンチンはフォークランド戦争でイギリスに勝ち、その後に民政へ移行した。","キューバでは、1959年にカストロらがバティスタ政権を倒した。","チリでは選挙でアジェンデの社会主義政権が成立したが、1973年に軍部のクーデタで倒された。","アルゼンチンでは、ペロンが労働者の支持を得て大統領となった。"],"e":"1982年のフォークランド戦争でアルゼンチンの軍事政権はイギリスに敗れ、その後に民政へ移行しました。キューバ革命（1959年）、アジェンデ政権の成立と1973年のピノチェトらによるクーデタ、ペロンの民衆主義的な政権は正しい内容です。","m":"フォークランド1982＝アルゼンチン敗北→民政移管"},{"id":87,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"オセアニアの探検","y":1770,"q":"オセアニアの探検と植民地化について述べた次の文のうち、正しいものはどれですか。","c":["クックはオーストラリア東岸を探検し、イギリスの領有を宣言した。","タスマンはスペインの航海者で、タスマニア島やニュージーランドに到達した。","ニュージーランドは、ワイタンギ条約によってフランス領となった。","オーストラリアの諸植民地は、19世紀前半に連邦を結成して自治領となった。"],"e":"イギリスのクックは1770年にオーストラリア東岸を探検し、領有を宣言しました。その後、流刑植民地として入植が始まりました。タスマンは17世紀のオランダの航海者です。ニュージーランドは1840年のワイタンギ条約でイギリス領となりました。オーストラリア連邦の成立は1901年、ニュージーランドの自治領化は1907年です。","m":"クック1770／ワイタンギ1840英領／オーストラリア連邦1901"},{"id":88,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"オセアニアの近代","y":1893,"q":"19世紀後半〜20世紀初めのオセアニアについて述べた次の文のうち、誤っているものはどれですか。","c":["アボリジニーは、ニュージーランドの先住民である。","オーストラリアでは金鉱の発見をきっかけに移民が増え、のちに白豪主義がとられた。","ニュージーランドでは、1893年に女性の参政権が認められた。","ハワイは、1898年にアメリカ合衆国に併合された。"],"e":"アボリジニーはオーストラリアの先住民で、ニュージーランドの先住民はマオリです。マオリはイギリスの植民に抵抗してマオリ戦争を戦いました。オーストラリアのゴールドラッシュと白豪主義、ニュージーランドの女性参政権（世界初の国政レベル）、ハワイ併合（1898年）は正しい内容です。","m":"アボリジニー＝豪／マオリ＝NZ"},{"id":89,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"第一次世界大戦の展開","y":1917,"q":"第一次世界大戦に関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　ソヴィエト政権がドイツなどとブレスト＝リトフスク条約を結んだ。\nイ　ドイツが無制限潜水艦作戦を宣言した。\nウ　イタリアが「未回収のイタリア」の獲得を約束されて協商国側で参戦した。","c":["ウ→イ→ア","イ→ウ→ア","ウ→ア→イ","イ→ア→ウ"],"e":"イタリアはロンドン秘密条約で領土を約束され、1915年に三国同盟を離れて協商国側で参戦しました（ウ）。ドイツは1917年2月に無制限潜水艦作戦を宣言し、これを理由にアメリカが4月に参戦しました（イ）。ロシアでは十月革命後のソヴィエト政権が1918年3月にブレスト＝リトフスク条約を結び、戦争から離脱しました（ア）。","m":"1915イタリア参戦→1917無制限潜水艦・米参戦→1918ブレスト"},{"id":90,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"ロシア革命とソ連","y":1921,"q":"ロシア革命とソ連の成立について述べた次の文のうち、正しいものはどれですか。","c":["1921年からの新経済政策（ネップ）では、小規模な私企業や余剰農産物の自由販売が認められた。","二月革命では、ボリシェヴィキがただちに臨時政府を樹立した。","レーニンは「平和に関する布告」で、領土の併合と賠償金を求める講和を呼びかけた。","スターリンは、第1次五か年計画を進めるにあたって一国社会主義論を否定した。"],"e":"戦時共産主義による混乱を受け、1921年に新経済政策が採用されました。二月革命（1917年）後の臨時政府は自由主義者が中心で、のちケレンスキーが率いました。ボリシェヴィキが政権を握ったのは十月革命です。「平和に関する布告」は無併合・無償金・民族自決の講和を訴えました。スターリンは一国社会主義論を唱え、世界革命論のトロツキーと対立しました。","m":"平和に関する布告＝無併合・無償金・民族自決"},{"id":91,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"1920年代の国際関係","y":1923,"q":"1920年代の国際関係について述べた次の文のうち、誤っているものはどれですか。","c":["ドイツの賠償支払いの遅れを理由に、イギリスとフランスが共同でルール地方を占領した。","国際連盟の本部はジュネーヴに置かれたが、アメリカは参加しなかった。","ワシントン会議で四か国条約が結ばれ、日英同盟は解消された。","ロカルノ条約の締結後、ドイツは国際連盟に加盟した。"],"e":"1923年にルール地方を占領したのはフランスとベルギーです。イギリスはこれに加わりませんでした。この占領でドイツではインフレーションが激化し、その後、ドーズ案でアメリカ資本による復興がはかられました。国際連盟本部とアメリカの不参加、四か国条約と日英同盟の解消、ロカルノ条約（1925年）とドイツの連盟加盟（1926年）は正しい内容です。","m":"ルール占領1923＝フランス・ベルギー"},{"id":92,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"世界恐慌への対応","y":1933,"q":"世界恐慌と各国の対応について述べた次の文のうち、正しいものはどれですか。","c":["フランクリン＝ローズヴェルト政権は、テネシー川流域開発公社（TVA）を設立し、ワグナー法で労働者の団結権を認めた。","フーヴァー大統領は、ニューディールと呼ばれる一連の政策を実施した。","ソ連は世界恐慌によって深刻な打撃を受け、五か年計画を中止した。","フランスはブロック経済をとらず、自由貿易を守り続けた。"],"e":"フランクリン＝ローズヴェルトはニューディールとしてTVAなどの公共事業を進め、ワグナー法（1935年）で労働者の権利を保護しました。フーヴァーは賠償・戦債の支払いを1年猶予するフーヴァー＝モラトリアムを出した大統領です。ソ連は計画経済のため恐慌の影響をほとんど受けず、五か年計画を続けました。フランスはフラン＝ブロックを形成しました。","m":"ニューディール＝F.ローズヴェルト／フーヴァー＝モラトリアム"},{"id":93,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"第二次世界大戦の首脳会談","y":1945,"q":"第二次世界大戦中の連合国の会談について述べた次の文のうち、誤っているものはどれですか。","c":["1945年2月のポツダム会談で、ソ連の対日参戦が秘密協定として取り決められた。","1941年、ローズヴェルトとチャーチルは大西洋憲章を発表した。","1943年のカイロ会談には、ローズヴェルト・チャーチル・蔣介石が参加した。","1943年のテヘラン会談では、北フランス上陸作戦（第二戦線）について話し合われた。"],"e":"ソ連の対日参戦を秘密協定で定めたのは、1945年2月のヤルタ会談です。ポツダム会談は同年7〜8月に開かれ、日本に無条件降伏を求めるポツダム宣言が出されました。大西洋憲章（1941年）、カイロ会談（1943年）、テヘラン会談での第二戦線の協議は正しい内容です。","m":"ヤルタ1945.2＝ソ連対日参戦の密約／ポツダム1945.7"},{"id":94,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"冷戦の緊張","y":1961,"q":"冷戦期の出来事に関する次のア〜ウを、古いものから年代順に正しく並べたものはどれですか。\nア　キューバへのソ連のミサイル配備をめぐって米ソの緊張が高まった。\nイ　ハンガリーで反ソ暴動が起こり、ソ連軍に鎮圧された。\nウ　東ドイツが東西ベルリンの境界に壁を築いた。","c":["イ→ウ→ア","ウ→イ→ア","イ→ア→ウ","ア→イ→ウ"],"e":"1956年、スターリン批判の影響でハンガリーで反ソ暴動が起こり、ソ連軍が鎮圧しました（イ）。東ドイツは住民の西側への流出を防ぐため、1961年にベルリンの壁を築きました（ウ）。1962年にはキューバ危機が起こりましたが、ソ連がミサイルを撤去して回避されました（ア）。","m":"1956ハンガリー→1961ベルリンの壁→1962キューバ危機"},{"id":95,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"アジア・アフリカ諸国の連帯","y":1955,"q":"第二次世界大戦後のアジアの国際関係について述べた次の文のうち、正しいものはどれですか。","c":["1955年、インドネシアのバンドンでアジア＝アフリカ会議が開かれ、平和十原則が採択された。","ネルーと周恩来が平和五原則を発表した同じ年に、ベオグラードで非同盟諸国首脳会議が開かれた。","インドシナ戦争のジュネーヴ休戦協定で、ベトナムは北緯38度線を境に南北に分けられた。","東南アジア諸国連合（ASEAN）は、ベトナムなどの社会主義国によって結成された。"],"e":"アジア＝アフリカ会議（1955年）では、平和五原則をもとに平和十原則が採択されました。平和五原則は1954年、ベオグラードの非同盟諸国首脳会議は1961年です。ジュネーヴ休戦協定（1954年）の暫定軍事境界線は北緯17度線で、38度線は朝鮮半島です。ASEANは1967年、インドネシアなど反共的な5か国で結成されました。","m":"1954平和五原則→1955バンドン十原則→1961ベオグラード"},{"id":96,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"中東戦争","y":1967,"q":"中東戦争とパレスチナ問題について述べた次の文のうち、誤っているものはどれですか。","c":["第3次中東戦争で、エジプトがイスラエルのシナイ半島を占領した。","1948年のイスラエル建国に対し、アラブ諸国が戦争を起こした。","エジプトのナセルがスエズ運河の国有化を宣言すると、英・仏・イスラエルが出兵した。","1993年、イスラエルとパレスチナ解放機構（PLO）の間でパレスチナ暫定自治協定が結ばれた。"],"e":"第3次中東戦争（1967年）ではイスラエルが圧勝し、エジプトのシナイ半島、ヨルダン川西岸、ガザ地区、ゴラン高原などを占領しました。シナイ半島はもともとエジプト領で、1979年のエジプト＝イスラエル平和条約にもとづいて返還されました。第1次中東戦争（1948年）、スエズ戦争（1956年）、オスロ合意（1993年）は正しい内容です。","m":"第3次1967＝イスラエルがシナイ・西岸・ガザ・ゴランを占領"},{"id":97,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"20世紀の文化","y":1937,"q":"20世紀の文化について述べた次の文のうち、正しいものはどれですか。","c":["ピカソは、スペイン内戦中の都市への爆撃に抗議して「ゲルニカ」を描いた。","アインシュタインは量子力学を、ハイゼンベルクは相対性理論を確立した。","フロイトは、実存主義の哲学を体系化した。","ケインズは、政府による経済への介入を否定し、自由放任を主張した。"],"e":"「ゲルニカ」は1937年、フランコ側を支援したドイツ空軍による爆撃に抗議して描かれました。相対性理論はアインシュタイン、量子力学の確立に貢献したのはハイゼンベルクらです。フロイトは精神分析学の創始者で、実存主義はサルトルらが唱えました。ケインズは有効需要の理論を唱え、政府の積極的な介入を主張しました。","m":"ゲルニカ1937＝ピカソ／ケインズ＝政府介入"},{"id":98,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"緊張緩和と軍縮","y":1979,"q":"冷戦期の軍縮と緊張緩和について述べた次の文のうち、誤っているものはどれですか。","c":["ソ連のアフガニスタン侵攻を受けて、米ソは第1次戦略兵器制限交渉（SALT I）に調印した。","1968年、核拡散防止条約（NPT）が調印された。","1975年、全欧安全保障協力会議でヘルシンキ宣言が採択された。","1987年、レーガンとゴルバチョフは中距離核戦力（INF）全廃条約に調印した。"],"e":"SALT Iは1972年に調印されたもので、デタントの成果です。1979年のソ連のアフガニスタン侵攻は、むしろデタントを終わらせて「新冷戦」を招きました。NPT（1968年）、ヘルシンキ宣言（1975年）、INF全廃条約（1987年）は正しい内容です。","m":"SALT I 1972（デタント）→1979アフガン侵攻で新冷戦"},{"id":99,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"東欧革命","y":1989,"q":"1980年代の東ヨーロッパについて述べた次の文のうち、正しいものはどれですか。","c":["ポーランドでは、ワレサの指導する自主管理労組「連帯」が民主化運動の中心となった。","ルーマニアでは、チャウシェスク政権がビロード革命によって平和的に退陣した。","ユーゴスラヴィアは、ティトーの死後も分裂せず、一つの連邦国家として存続した。","東西ドイツは、ベルリンの壁が開かれた1989年のうちに統一された。"],"e":"ポーランドでは「連帯」が1989年の選挙で勝利し、東欧革命の先駆けとなりました。ルーマニアではチャウシェスクが処刑される流血の革命となり、ビロード革命はチェコスロヴァキアの無血の民主化を指します。ユーゴスラヴィアは1991年以降に解体し、内戦が起こりました。東西ドイツの統一は1990年です。","m":"ビロード革命＝チェコスロヴァキア／ルーマニア＝流血"},{"id":100,"k":"plan","ref":"想定問題","f":"20世紀の世界とアメリカ大陸・オセアニア","t":"大陸間の作物の移動","y":1550,"q":"大航海時代以降の大陸間の動植物の移動について述べた次の文のうち、正しいものはどれですか。","c":["ジャガイモ・トウモロコシ・トウガラシ・タバコは、アメリカ大陸からほかの大陸に広まった。","サトウキビはアメリカ大陸原産で、16世紀にヨーロッパに伝わった。","小麦や馬は、アメリカ大陸からヨーロッパにもたらされた。","トマトやコーヒーは、ともにアメリカ大陸原産である。"],"e":"ジャガイモ・トウモロコシ・トウガラシ・タバコ・トマトなどはアメリカ大陸原産で、16世紀以降に世界へ広まり、ヨーロッパやアジアの食生活を変えました。サトウキビは東南アジア・南アジア方面の原産で、アメリカ大陸に持ち込まれて黒人奴隷を使う大農園で栽培されました。小麦や馬は旧大陸からアメリカ大陸へ渡りました。コーヒーはエチオピアなどアフリカ原産です。","m":"新大陸原産＝ジャガイモ・トウモロコシ・トマト・タバコ"}];
var FIELDS=["古代・中世のヨーロッパと地中海世界","東アジア・内陸アジア","イスラーム・南アジア・東南アジア・アフリカ","近世・近代の欧米","20世紀の世界とアメリカ大陸・オセアニア"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="waseda-sekaishi-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.k==="past"?"過去問ベース：早稲田大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（早稲田大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+"abcde".charAt(j)+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+KIND[q.k]+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+KIND[q.k]+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

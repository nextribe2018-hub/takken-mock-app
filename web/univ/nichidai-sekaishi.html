最高価格令を出して物価を統制した","革命暦を定め、キリスト教の否定を進めた","5人の総裁からなる総裁政府を発足させた"],"e":"国民議会は1789年8月、封建的特権の廃止を決議し、ラ＝ファイエットらが起草した人権宣言を採択して、自由・平等や国民主権、私有財産の不可侵をうたいました。最高価格令や革命暦の制定は、1793年以降の国民公会のもとでジャコバン派が行った政策です。総裁政府は1795年憲法にもとづいて成立した政府で、国民議会のしたことではありません。","m":"1789.8 国民議会＝封建的特権廃止＋人権宣言"},{"id":165,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"大陸封鎖令","y":1806,"q":"1806年、ナポレオンがベルリンで発した大陸封鎖令のねらいとして最も適当なものはどれですか。","c":["ヨーロッパ大陸諸国とイギリスとの通商を禁じ、イギリスに経済的な打撃を与えること","ロシアの南下を防ぐため、黒海から地中海への出口を閉ざすこと","オーストリアの勢力を排除するため、ドイツ諸邦との貿易を禁じること","アメリカ合衆国との貿易を独占するため、大西洋の港を封鎖すること"],"e":"トラファルガーの海戦でイギリス上陸をあきらめたナポレオンは、大陸封鎖令によってヨーロッパ大陸とイギリスの通商を禁じ、イギリスを経済的に追いつめようとしました。しかし穀物をイギリスに輸出できなくなったロシアがこれを守らなかったため、ナポレオンは1812年にロシア遠征を行い、大敗しました。ロシアの南下阻止、オーストリアの排除、対米貿易の独占はいずれも大陸封鎖令の目的ではありません。","m":"大陸封鎖令→ロシアが破る→1812ロシア遠征"},{"id":166,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ウィーン会議の原則","y":1815,"q":"ウィーン会議でフランス代表タレーランが唱え、フランス革命前の王朝と領土を正しいものとして復活させようとした原則を何といいますか。","c":["正統主義","民族自決","門戸開放","栄光ある孤立"],"e":"ウィーン会議はオーストリアのメッテルニヒが主導し、タレーランの唱えた正統主義と大国間の勢力均衡を柱にウィーン体制がつくられました。民族自決は第一次世界大戦末期にウィルソンの十四か条などで掲げられた原則、門戸開放は19世紀末にアメリカのジョン＝ヘイが中国について唱えた原則、栄光ある孤立は19世紀後半のイギリスの外交方針です。","m":"タレーラン＝正統主義（ウィーン体制）"},{"id":167,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"フランス二月革命","y":1848,"q":"1848年、パリで選挙権の拡大を求める民衆が蜂起した二月革命によって退位し、亡命した国王は誰ですか。","c":["ルイ＝フィリップ","シャルル10世","ルイ18世","ナポレオン3世"],"e":"七月革命（1830年）で即位したルイ＝フィリップの七月王政は、有力な銀行家など一部の富裕層だけが選挙権をもつ体制でした。1848年の二月革命で王政は倒れ、第二共和政が成立しました。シャルル10世は七月革命で倒された国王、ルイ18世はナポレオン没落後の復古王政の国王、ナポレオン3世は1852年に第二帝政を始めた皇帝です。","m":"七月革命→ルイ＝フィリップ→二月革命で退位"},{"id":168,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"クリミア戦争の結果","y":1854,"q":"クリミア戦争の講和条約である1856年のパリ条約の内容、またはその結果として最も適当なものはどれですか。","c":["黒海の中立化が決められ、ロシアの南下政策はいったん阻まれた","ロシアの保護下に大ブルガリアをつくることが認められた","イギリスがキプロス島の行政権を手に入れた","ロシアが清からイリ地方の一部と通商上の権利を得た"],"e":"クリミア戦争ではオスマン帝国をイギリス・フランス・サルデーニャが支援してロシアと戦い、ロシアは敗れました。パリ条約で黒海の中立化が決まり、南下は一時阻止されました。大ブルガリアの創設は1878年のサン＝ステファノ条約、キプロス島の行政権はベルリン会議（1878年）でイギリスが得たもの、イリ地方はイリ条約（1881年）にかかわる地域です。","m":"クリミア戦争→1856パリ条約＝黒海中立化"},{"id":169,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ロシアの農奴解放令","y":1861,"q":"クリミア戦争の敗北で国の遅れを痛感し、1861年に農奴解放令を出したロシア皇帝は誰ですか。","c":["アレクサンドル2世","ニコライ1世","ピョートル1世","エカチェリーナ2世"],"e":"アレクサンドル2世は農奴解放令によって農奴に人格的な自由を与えましたが、土地の取得は有償だったため、多くの農民は貧しいままでした。ニコライ1世はクリミア戦争を始めた皇帝で、戦争中に死去しました。ピョートル1世は18世紀初めに西欧化を進めペテルブルクを建設した皇帝、エカチェリーナ2世は18世紀後半の啓蒙専制君主です。","m":"農奴解放令（1861）＝アレクサンドル2世"},{"id":170,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ベルリン会議","y":1878,"q":"1878年にビスマルクが「誠実な仲買人」として開いたベルリン会議について述べた次の文ⅰ・ⅱの正誤の組み合わせとして正しいものはどれですか。\nⅰ セルビア・モンテネグロ・ルーマニアの独立が認められた。\nⅱ オーストリアがボスニア・ヘルツェゴヴィナを併合することが認められた。","c":["ⅰ 正　ⅱ 誤","ⅰ 正　ⅱ 正","ⅰ 誤　ⅱ 正","ⅰ 誤　ⅱ 誤"],"e":"ロシア＝トルコ戦争後のサン＝ステファノ条約に英墺が反発したため、ベルリン会議が開かれました。セルビア・モンテネグロ・ルーマニアの独立は承認されたのでⅰは正しい文です。オーストリアが認められたのはボスニア・ヘルツェゴヴィナの行政権（管理権）で、併合したのは青年トルコ革命の混乱に乗じた1908年なので、ⅱは誤りです。","m":"1878 行政権→1908 併合（ボスニア）"},{"id":171,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"モンロー宣言","y":1823,"q":"1823年にアメリカ合衆国大統領モンローが発表した宣言の内容として最も適当なものはどれですか。","c":["ヨーロッパとアメリカ大陸の相互不干渉を唱えた","中国の門戸開放・機会均等・領土保全を唱えた","西部の準州が奴隷州になるかどうかを住民の判断にゆだねた","南部連合に加わった州の奴隷を解放すると宣言した"],"e":"モンロー宣言は、ラテンアメリカ諸国の独立に対してヨーロッパ諸国が干渉することに反対し、あわせてアメリカもヨーロッパに干渉しないという相互不干渉を示したもので、のちのアメリカ外交の基本となりました。門戸開放は1899年以降のジョン＝ヘイの通牒、住民の判断にゆだねたのは1854年のカンザス・ネブラスカ法、奴隷の解放は1863年のリンカンの奴隷解放宣言です。","m":"1823 モンロー宣言＝欧米の相互不干渉"},{"id":172,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"南北戦争の経過","y":1863,"q":"アメリカの南北戦争について述べた文として正しいものはどれですか。","c":["リンカンが戦争中に奴隷解放宣言を発し、内外の世論を北部支持へと導いた","南部は保護関税政策を求め、北部は自由貿易を主張した","ゲティスバーグの戦いで南軍が勝利し、戦争の流れが決まった","南部連合の大統領には、南軍の司令官リーが就任した"],"e":"1861年、奴隷制の拡大に反対する共和党のリンカンが大統領になると南部諸州は南部連合（アメリカ連合国）をつくり、南北戦争が始まりました。リンカンは1863年に奴隷解放宣言を出し、同年のゲティスバーグの戦いで北軍が勝利して優位に立ちました。保護関税を求めたのは工業の北部で、南部は綿花輸出のため自由貿易を求めました。南部連合の大統領はジェファソン＝デヴィスです。","m":"1863 奴隷解放宣言＋ゲティスバーグ（北軍勝利）"},{"id":173,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"戊戌の変法","y":1898,"q":"日清戦争の敗北後、光緒帝に登用されて立憲君主制をめざす改革（変法）を進めたものの、西太后ら保守派の政変で失敗した人物は誰ですか。","c":["康有為","李鴻章","袁世凱","孫文"],"e":"康有為は梁啓超らとともに、日本の明治維新にならって議会政治をとり入れる改革を進めましたが、1898年に西太后らの戊戌の政変で光緒帝は幽閉され、改革は約100日で終わりました。李鴻章は洋務運動を進めた官僚、袁世凱は新軍を率いてのちに中華民国の大総統となった人物、孫文は清を倒す革命を唱えた人物です。","m":"変法＝康有為・光緒帝→戊戌の政変（西太后）"},{"id":174,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"北京議定書","y":1901,"q":"「扶清滅洋」を唱えた義和団の蜂起ののち、1901年に清が列国と結んだ北京議定書（辛丑和約）の内容として最も適当なものはどれですか。","c":["巨額の賠償金の支払いと、北京などへの外国軍隊の駐兵を認めた","香港島をイギリスに割譲した","外国公使が北京に常駐することを初めて認めた","九竜半島の南部をイギリスに割譲した"],"e":"義和団が北京の公使館地域を包囲すると、日本とロシアを中心とする8か国が共同出兵して鎮圧し、清は北京議定書で巨額の賠償金と北京・天津などへの外国軍隊の駐兵を認めました。香港島の割譲は南京条約（1842年）、外国公使の北京常駐はアロー戦争の際の天津条約・北京条約、九竜半島南部の割譲は北京条約（1860年）の内容です。","m":"義和団→北京議定書＝賠償金＋外国軍の駐兵"},{"id":175,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"辛亥革命","y":1911,"q":"辛亥革命について述べた文として正しいものはどれですか。","c":["武昌での新軍の蜂起をきっかけに多くの省が独立を宣言し、翌年南京で中華民国が成立した","鉄道の国有化に賛成する民衆の運動が、革命の直接のきっかけとなった","孫文が北京で中華民国の初代正式大総統に就任した","光緒帝が退位して、清は滅亡した"],"e":"1911年、清が幹線鉄道の国有化を打ち出すと四川などで反対運動がおこり、10月に武昌で新軍が蜂起して辛亥革命が始まりました。1912年1月に南京で中華民国が成立し、孫文が臨時大総統となりました。その後、袁世凱が宣統帝（溥儀）を退位させて清は滅び、袁世凱が臨時大総統をついで、のち正式な大総統になりました。光緒帝は1908年に亡くなっています。","m":"武昌蜂起→南京で中華民国（臨時大総統孫文）"},{"id":176,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"世界恐慌期のイギリス","y":1931,"q":"世界恐慌期のイギリスについて述べた文として正しいものはどれですか。","c":["マクドナルドの挙国一致内閣が金本位制を停止した","ブルムを首相とする人民戦線内閣が成立した","全国産業復興法（NIRA）を制定して企業の生産を調整した","四か年計画を立てて軍需産業を中心に経済を立て直した"],"e":"1931年、労働党を除名されたマクドナルドは保守党などの協力を得て挙国一致内閣をつくり、失業保険の削減などで財政を引き締めるとともに金本位制を停止しました。人民戦線内閣はフランス（1936年）、全国産業復興法はアメリカのニューディールの政策、四か年計画はナチス＝ドイツが1936年に始めた経済計画です。","m":"1931 英＝マクドナルド挙国一致内閣・金本位制停止"},{"id":177,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"善隣外交","y":1933,"q":"フランクリン＝ローズヴェルト政権がラテンアメリカ諸国に対してとった、内政干渉をひかえて関係改善を図る外交政策を何といいますか。","c":["善隣外交","棍棒外交","ドル外交","宣教師外交"],"e":"ローズヴェルトは善隣外交をとり、1934年にはキューバの独立を制限していたプラット条項を廃止しました。ラテンアメリカとの関係改善は、恐慌下でのアメリカの市場確保にもつながりました。棍棒外交はセオドア＝ローズヴェルト、ドル外交はタフト、宣教師外交はウィルソンの政策で、いずれも20世紀初めのカリブ海・中南米への積極的な介入を表す言葉です。","m":"F.ローズヴェルト＝善隣外交（プラット条項廃止）"},{"id":178,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"フランスの人民戦線内閣","y":1936,"q":"1936年にフランスで成立した、反ファシズムをかかげる人民戦線内閣の首相は誰ですか。","c":["ブルム","ド＝ゴール","クレマンソー","ポワンカレ"],"e":"1935年のコミンテルン第7回大会は、ファシズムに対抗するため社会主義者や自由主義者とも手を結ぶ人民戦線戦術を打ち出しました。フランスでは1936年に社会党のブルムを首相とする人民戦線内閣が成立しました。ド＝ゴールは第二次世界大戦中に自由フランスを率いた軍人、クレマンソーは第一次世界大戦末期からパリ講和会議の首相、ポワンカレは1923年のルール占領を行った首相です。","m":"1936 仏人民戦線内閣＝ブルム"},{"id":179,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"スペイン内戦","y":1936,"q":"1936年に始まったスペイン内戦について述べた文として正しいものはどれですか。","c":["フランコの反乱軍をドイツとイタリアが支援し、イギリスとフランスは不干渉政策をとった","ソ連がフランコの反乱軍に武器を送り、人民戦線政府と戦わせた","アメリカが人民戦線政府を支援するため、正規の軍隊を送った","人民戦線政府が反乱軍に勝利し、共和政が守られた"],"e":"スペインで人民戦線政府が成立すると、フランコ将軍が反乱をおこしました。ドイツ・イタリアは反乱軍を支援し、ドイツ空軍のゲルニカ爆撃はピカソの作品で知られます。政府側はソ連の支援や各国の義勇兵（国際旅団）の参加を得ましたが、英仏は不干渉政策をとり、アメリカも中立を守りました。1939年に反乱軍が勝利し、フランコの独裁体制ができました。","m":"スペイン内戦＝独伊がフランコ支援、英仏は不干渉"},{"id":180,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ミュンヘン会談","y":1938,"q":"1938年のミュンヘン会談で、ドイツへの割譲が認められたチェコスロヴァキアの地域はどこですか。","c":["ズデーテン地方","ラインラント","ザール地方","ダンツィヒ"],"e":"ヒトラーはドイツ系住民が多いことを理由にズデーテン地方の割譲を要求し、イギリスのネヴィル＝チェンバレン、フランスのダラディエ、イタリアのムッソリーニ、ヒトラーによるミュンヘン会談でこれが認められました。英仏の宥和政策の典型とされます。ラインラントは1936年にドイツ軍が進駐した地域、ザール地方は1935年の住民投票でドイツに復帰した地域、ダンツィヒは1939年にドイツが返還を要求した都市です。","m":"ミュンヘン会談＝ズデーテン割譲（宥和政策）"},{"id":181,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"独ソ不可侵条約","y":1939,"q":"1939年8月、ドイツがポーランド侵攻の直前にソ連と結び、世界に大きな衝撃を与えた条約はどれですか。","c":["独ソ不可侵条約","日独伊三国同盟","日独防共協定","ロカルノ条約"],"e":"それまで激しく対立していたドイツとソ連が独ソ不可侵条約を結び、秘密議定書で東ヨーロッパでの勢力範囲を分けました。9月1日にドイツがポーランドに侵攻すると英仏がドイツに宣戦し、第二次世界大戦が始まりました。日独伊三国同盟は1940年、日独防共協定は1936年に結ばれました。ロカルノ条約は1925年に西欧の国境の現状維持などを定めた条約です。","m":"1939.8 独ソ不可侵→9.1 ポーランド侵攻"},{"id":182,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"大西洋憲章","y":1941,"q":"1941年に発表された大西洋憲章について述べた文として正しいものはどれですか。","c":["ローズヴェルトとチャーチルが会談して、戦後の平和構想の原則を示した","スターリンも加わった会談で、ソ連の対日参戦が約束された","日本に対して無条件降伏を求める内容であった","日本が奪った満洲・台湾を中国に返すことを定めた"],"e":"1941年8月、アメリカのフランクリン＝ローズヴェルトとイギリスのチャーチルは大西洋上で会談し、領土不拡大や民族自決、安全保障の仕組みづくりなどの原則を大西洋憲章として発表しました。これがのちの国際連合の理念につながります。ソ連の対日参戦はヤルタ会談（1945年）、無条件降伏の要求はポツダム宣言（1945年）、満洲・台湾の返還はカイロ宣言（1943年）の内容です。","m":"大西洋憲章（1941）＝米英首脳・戦後の原則"},{"id":183,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"第二次世界大戦の経過","y":1942,"q":"第二次世界大戦中のヨーロッパの出来事ア〜エを古い順に並べたものとして正しいものはどれですか。\nア ドイツがソ連に侵攻し、独ソ戦が始まった。\nイ スターリングラードでドイツ軍が降伏した。\nウ 連合軍がノルマンディーに上陸した。\nエ ドイツ軍がパリを占領し、フランスが降伏した。","c":["エ→ア→イ→ウ","ア→エ→イ→ウ","エ→ア→ウ→イ","ア→イ→エ→ウ"],"e":"ドイツは1940年6月にパリを占領してフランスを降伏させ、フランス南部にはペタンのヴィシー政府ができました。1941年6月には独ソ不可侵条約を破ってソ連に侵攻しましたが、1943年2月にスターリングラードで降伏し、戦局が転換しました。1944年6月に連合軍がノルマンディーに上陸し、8月にパリが解放されました。","m":"パリ占領40→独ソ戦41→スターリングラード43→ノルマンディー44"},{"id":184,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"国際連合の特色","y":1945,"q":"国際連合について述べた文として正しいものはどれですか。","c":["安全保障理事会の常任理事国5か国には拒否権が認められた","アメリカは上院の反対で加盟しなかった","本部をスイスのジュネーヴに置いた","総会の議決は全会一致を原則とした"],"e":"国際連合はサンフランシスコ会議で国際連合憲章が採択され、1945年10月に発足しました。本部はニューヨークに置かれ、総会は多数決を原則とし、安全保障理事会では米・英・仏・ソ・中の常任理事国が拒否権をもちます。アメリカの不参加、ジュネーヴの本部、総会の全会一致は、いずれも第一次世界大戦後の国際連盟の特色です。","m":"国連＝NY・多数決・拒否権／連盟＝ジュネーヴ・全会一致"},{"id":185,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ブレトン＝ウッズ会議","y":1944,"q":"1944年にアメリカで開かれたブレトン＝ウッズ会議で、国際復興開発銀行（IBRD）とともに設立が決められた機関はどれですか。","c":["国際通貨基金（IMF）","関税と貿易に関する一般協定（GATT）","経済協力開発機構（OECD）","世界貿易機関（WTO）"],"e":"ブレトン＝ウッズ会議では、為替の安定をめざす国際通貨基金（IMF）と、戦後の復興を助ける国際復興開発銀行（IBRD）の設立が決まり、ドルを金と結びつけて基軸通貨とする固定相場制がつくられました。GATTは1947年に結ばれた貿易自由化のための協定、OECDは1961年に発足した先進国中心の機関、WTOはGATTを引きついで1995年に発足した機関です。","m":"ブレトン＝ウッズ＝IMF＋IBRD（ドル基軸）"},{"id":186,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"トルーマン＝ドクトリン","y":1947,"q":"1947年にトルーマン大統領が共産主義勢力の拡大を防ぐ「封じ込め政策」を打ち出したとき、軍事・経済援助の対象として示した国の組み合わせはどれですか。","c":["ギリシアとトルコ","ポーランドとチェコスロヴァキア","イランとイラク","西ドイツとオーストリア"],"e":"イギリスがギリシアやトルコへの援助を続けられなくなったため、トルーマンは両国への援助を議会に求め、共産主義の拡大を食い止める姿勢を示しました（トルーマン＝ドクトリン）。同じ年にはヨーロッパの経済復興を援助するマーシャル＝プランも発表されました。ポーランドとチェコスロヴァキアはソ連の影響下に入った国、イラン・イラクや西ドイツ・オーストリアはこの宣言の援助対象ではありません。","m":"トルーマン＝ドクトリン（1947）＝ギリシア・トルコ援助"},{"id":187,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"コメコン","y":1949,"q":"マーシャル＝プランに対抗して、1949年にソ連と東ヨーロッパ諸国が結成した経済協力の組織はどれですか。","c":["経済相互援助会議（コメコン）","共産党情報局（コミンフォルム）","ワルシャワ条約機構","独立国家共同体（CIS）"],"e":"コメコンはソ連を中心とする社会主義国の経済協力機構で、1991年に解散しました。コミンフォルムは1947年に各国共産党の連絡・情報交換のためにつくられた組織、ワルシャワ条約機構は1955年に西ドイツのNATO加盟に対抗して結成された軍事同盟、CISは1991年のソ連解体後に旧ソ連の共和国の多くがつくった共同体です。","m":"マーシャル＝プラン⇔コメコン（1949）"},{"id":188,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"中華人民共和国の成立","y":1949,"q":"1949年の中華人民共和国の成立について述べた文として正しいものはどれですか。","c":["毛沢東を主席、周恩来を首相として北京で成立が宣言された","敗れた蔣介石の国民党政府は朝鮮半島に逃れた","アメリカがただちに新政府を承認し、国交を結んだ","成立と同時に国際連合の中国代表権を得た"],"e":"国共内戦に勝った共産党は1949年10月、毛沢東を主席、周恩来を首相として中華人民共和国の成立を宣言し、翌年ソ連と中ソ友好同盟相互援助条約を結びました。蔣介石の国民党政府は台湾に逃れました。イギリスは1950年に新政府を承認しましたが、アメリカとの国交は1979年まで結ばれず、国連の代表権も1971年に台湾の中華民国から移されました。","m":"1949 中華人民共和国（毛沢東・周恩来）、国民党は台湾へ"},{"id":189,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"スターリン批判とハンガリー","y":1956,"q":"1956年のフルシチョフによるスターリン批判の影響を受けて同年におこり、ソ連軍によって鎮圧された東ヨーロッパの事件はどれですか。","c":["ハンガリー反ソ暴動（ハンガリー事件）","プラハの春","ベルリン封鎖","自主管理労組「連帯」の結成"],"e":"フルシチョフはソ連共産党第20回大会でスターリンの個人崇拝や粛清を批判し、平和共存を打ち出しました。これを受けてポーランドのポズナニで暴動がおこり、ハンガリーではナジ＝イムレ政権がワルシャワ条約機構からの離脱を表明しましたが、ソ連軍に鎮圧されました。プラハの春は1968年、ベルリン封鎖は1948年、「連帯」の結成は1980年のポーランドの出来事です。","m":"1956 スターリン批判→ハンガリー事件（ソ連軍鎮圧）"},{"id":190,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ジュネーヴ休戦協定","y":1954,"q":"1954年のジュネーヴ休戦協定で、インドシナ戦争の休戦にあたってベトナムに設けられた暫定的な軍事境界線はどれですか。","c":["北緯17度線","北緯38度線","北緯30度線","北緯49度線"],"e":"ディエンビエンフーの戦いでフランス軍が敗れると、ジュネーヴ休戦協定が結ばれ、北緯17度線を境界として、2年後に統一選挙を行うことが決められました。しかしアメリカは協定に調印せず、南部にゴ＝ディン＝ジエムのベトナム共和国を支援しました。北緯38度線は朝鮮半島の分断線、北緯49度線はアメリカ・カナダ国境の多くの部分にあたる線です。","m":"ベトナム＝17度線、朝鮮＝38度線"},{"id":191,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ベトナム戦争の推移","y":1965,"q":"ベトナム戦争について述べた次の文ⅰ・ⅱの正誤の組み合わせとして正しいものはどれですか。\nⅰ アイゼンハワー政権が、トンキン湾事件を口実に北ベトナムへの爆撃（北爆）を始めた。\nⅱ パリ和平協定でアメリカ軍が撤退したのち、1975年にサイゴンが陥落した。","c":["ⅰ 誤　ⅱ 正","ⅰ 正　ⅱ 正","ⅰ 正　ⅱ 誤","ⅰ 誤　ⅱ 誤"],"e":"1964年のトンキン湾事件を口実に、ジョンソン政権が1965年から北爆を始め、地上軍を大規模に送りこんだので、ⅰは政権が誤りです。戦争は長期化し、世界で反戦運動が広がりました。ニクソン政権は1973年にパリ和平協定を結んでアメリカ軍を撤退させ、1975年にサイゴンが陥落し、翌年ベトナム社会主義共和国が成立したので、ⅱは正しい文です。","m":"北爆＝ジョンソン（1965）→1973撤退→1975サイゴン陥落"},{"id":192,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"部分的核実験禁止条約","y":1963,"q":"キューバ危機の翌年の1963年に、アメリカ・イギリス・ソ連が調印し、地下を除く大気圏内・宇宙空間・水中での核実験を禁止した条約はどれですか。","c":["部分的核実験禁止条約","核拡散防止条約（NPT）","第1次戦略兵器制限交渉（SALTⅠ）の協定","中距離核戦力（INF）全廃条約"],"e":"キューバ危機で核戦争の危険を経験した米ソは、ホットライン（直通電話）を設け、1963年にイギリスとともに部分的核実験禁止条約を結びました。核保有をめざしていたフランスと中国は参加しませんでした。核拡散防止条約は1968年、SALTⅠの協定は1972年、INF全廃条約はレーガンとゴルバチョフが1987年に調印したものです。","m":"1963 部分的核実験禁止（地下は除く）"},{"id":193,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ニクソン訪中","y":1972,"q":"1972年、アメリカの大統領として初めて中華人民共和国を訪問し、米中関係の転換をもたらしたのは誰ですか。","c":["ニクソン","ケネディ","カーター","レーガン"],"e":"ベトナム戦争からの撤退をめざしていたニクソン大統領は、中ソ対立を背景に中国に接近し、1971年の訪中予告ののち1972年に北京を訪れました。1971年には国連の中国代表権が台湾から中華人民共和国に移されています。正式な国交樹立はカーター政権期の1979年です。ケネディはキューバ危機のときの大統領、レーガンは1980年代の大統領です。","m":"1972 ニクソン訪中→1979 国交（カーター）"},{"id":194,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ドル＝ショック","y":1971,"q":"1971年、ニクソン大統領が発表して「ドル＝ショック」と呼ばれた政策の内容として最も適当なものはどれですか。","c":["ドルと金の交換を停止した","国際通貨基金の設立を各国に呼びかけた","主要国が変動相場制をやめ、固定相場制に戻ることを決めた","石油輸出国機構（OPEC）の結成を呼びかけた"],"e":"ベトナム戦争の戦費などで国際収支が悪化し、ドルの信用が低下したため、ニクソンはドルと金の交換を停止しました。これによりブレトン＝ウッズ体制はゆらぎ、1973年には主要国が固定相場制から変動相場制に移りました。IMFの設立は1944年のブレトン＝ウッズ会議で決まりました。OPECは1960年に産油国自身が結成した組織です。","m":"1971 ドル＝ショック（金とドルの交換停止）"},{"id":195,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"プロレタリア文化大革命","y":1966,"q":"1966年に毛沢東が始めた運動で、紅衛兵が動員され、劉少奇や鄧小平らが「実権派」として批判・失脚させられたものを何といいますか。","c":["プロレタリア文化大革命","大躍進","百花斉放・百家争鳴","改革・開放"],"e":"大躍進政策の失敗で毛沢東は国家主席を退き、劉少奇・鄧小平が経済の立て直しを進めました。毛沢東は権力の回復をめざして文化大革命を始め、社会は大きく混乱しました。大躍進は1958年に始まった急激な工業化・人民公社化の政策、百花斉放・百家争鳴は1956年に言論の自由を呼びかけた運動、改革・開放は文化大革命後に鄧小平が進めた経済政策です。","m":"大躍進（1958）の失敗→文化大革命（1966）"},{"id":196,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ヨーロッパ統合の歩み","y":1967,"q":"ヨーロッパ統合の歩みを示すア〜エを古い順に並べたものとして正しいものはどれですか。\nア マーストリヒト条約にもとづいてヨーロッパ連合（EU）が発足した。\nイ ヨーロッパ石炭鉄鋼共同体（ECSC）が発足した。\nウ 3つの共同体が統合されて、ヨーロッパ共同体（EC）が発足した。\nエ ローマ条約にもとづいてヨーロッパ経済共同体（EEC）が発足した。","c":["イ→エ→ウ→ア","エ→イ→ウ→ア","イ→ウ→エ→ア","エ→ウ→イ→ア"],"e":"フランス外相シューマンの提案から1952年にECSCが発足し、1958年にはローマ条約にもとづいてEECとヨーロッパ原子力共同体（EURATOM）が発足しました。1967年にこの3つが統合されてECとなり、1973年にはイギリスなどが加盟しました。冷戦終結後の1993年、マーストリヒト条約によってEUが発足しました。","m":"ECSC52→EEC58→EC67→EU93"},{"id":197,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"グラスノスチ","y":1986,"q":"ソ連のゴルバチョフが、1986年のチョルノービリ（チェルノブイリ）原子力発電所事故をきっかけに本格的に進めた、情報公開を意味する政策を何といいますか。","c":["グラスノスチ","ペレストロイカ","デタント","新思考外交"],"e":"ゴルバチョフは1985年に共産党書記長となり、ペレストロイカ（建て直し・改革）をかかげました。原発事故で情報を隠す体質が問題となったことから、グラスノスチ（情報公開）を進めて言論の自由化を図りました。ペレストロイカは改革全体を指す言葉、デタントは1970年代の米ソの緊張緩和、新思考外交は軍縮や東欧への不干渉などを進めた外交方針で、情報公開そのものを指す語ではありません。","m":"グラスノスチ＝情報公開、ペレストロイカ＝改革"},{"id":198,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"1989年の東欧革命","y":1989,"q":"1989年の東ヨーロッパの変革について述べた文として誤っているものはどれですか。","c":["ルーマニアでは、ドプチェクのもとで無血のうちに共産党政権が倒された","ポーランドでは、ワレサの率いる自主管理労組「連帯」が選挙で勝利し、連帯中心の政権ができた","東ドイツでは、ホネカーが退陣したのち、ベルリンの壁が開放された","チェコスロヴァキアでは、ビロード革命で共産党政権が倒れ、ハヴェルが大統領となった"],"e":"ルーマニアでは独裁を続けたチャウシェスクが民衆の蜂起と軍の離反で倒され、処刑されました。流血をともなった変革で、ドプチェクはチェコスロヴァキアの「プラハの春」の指導者なので、この文が誤りです。ポーランドの「連帯」の選挙勝利、東ドイツのホネカー退陣とベルリンの壁の開放、チェコスロヴァキアのビロード革命とハヴェルの大統領就任は、いずれも1989年の出来事として正しい内容です。","m":"ルーマニア＝チャウシェスク処刑（流血の革命）"},{"id":199,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"独立国家共同体","y":1991,"q":"1991年12月、ソ連が解体したのち、ロシアをはじめ旧ソ連を構成していた共和国の多くが結成したゆるやかな結びつきの組織はどれですか。","c":["独立国家共同体（CIS）","経済相互援助会議（コメコン）","ワルシャワ条約機構","全欧安全保障協力会議（CSCE）"],"e":"1991年8月の保守派のクーデタが失敗すると共産党は解散し、バルト3国の独立に続いて、12月にロシア・ウクライナ・ベラルーシなどがCISを結成し、ソ連は消滅しました。ロシアの大統領はエリツィンでした。コメコンとワルシャワ条約機構は1991年に解散した東側の組織、CSCEは1975年に東西の国々が参加してヘルシンキ宣言を採択した会議です。","m":"1991 ソ連解体→CIS（エリツィン）"},{"id":200,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"東西ドイツ統一の時期","y":1990,"q":"年表「1985年 ゴルバチョフがソ連共産党書記長に就任する／1989年 ベルリンの壁が開放される／1991年 ソ連が解体する」について、東西ドイツが統一された時期として正しいものはどれですか。","c":["ベルリンの壁の開放とソ連の解体の間","ゴルバチョフの書記長就任より前","ゴルバチョフの書記長就任とベルリンの壁の開放の間","ソ連の解体より後"],"e":"1989年11月にベルリンの壁が開放されたのち、東ドイツでは自由選挙が行われ、1990年10月に西ドイツが東ドイツを吸収する形で統一が実現しました。統一時の西ドイツ首相はコールです。統一ドイツはNATOにとどまりました。ソ連の解体は翌1991年12月のことなので、統一はベルリンの壁の開放とソ連の解体の間にあたります。","m":"壁開放89.11→ドイツ統一90.10→ソ連解体91.12"}];

function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.k==="past"?"過去問ベース：日本大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（日本大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+"abcde".charAt(j)+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+KIND[q.k]+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+KIND[q.k]+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

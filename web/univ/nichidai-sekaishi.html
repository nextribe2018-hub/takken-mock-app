ら離脱しました。ラパロ条約は1922年のソ連とドイツの国交回復、ロカルノ条約は1925年の西欧の集団安全保障、トリアノン条約は第一次世界大戦後のハンガリーとの講和条約です。","m":"ブレスト＝リトフスク（1918）＝ソ連が戦線離脱"},{"id":165,"k":"past","ref":"2025年度 経済学部A個別第2期 Ⅲ 問31","f":"20世紀の世界（恐慌・冷戦）","t":"国際連盟","y":1920,"q":"1920年に発足した国際連盟について、正しいものはどれですか。","c":["本部はジュネーヴにおかれ、日本は常任理事国となった","提唱国のアメリカは、原加盟国として常任理事国になった","ドイツは、発足当初から加盟して常任理事国になった","ソ連は、発足当初から加盟して常任理事国になった"],"e":"国際連盟は、ウィルソンの十四か条を基礎として、本部はスイスのジュネーヴにおかれました。日本はイギリス・フランス・イタリアと並ぶ常任理事国でした。アメリカは上院の反対で加盟せず、ドイツは1926年、ソ連は1934年に加盟しました。","m":"国際連盟＝ジュネーヴ・米は不参加"},{"id":166,"k":"past","ref":"2026年度 経済学部A個別第2期 Ⅳ 問38","f":"20世紀の世界（恐慌・冷戦）","t":"ルール占領","y":1923,"q":"1923年、ドイツの賠償金の支払いが滞ったことを理由に、ドイツのルール工業地帯を占領した国はどれですか。","c":["フランス","イギリス","アメリカ合衆国","ソ連"],"e":"フランスはベルギーとともに、1923年にルール地方を占領しました。ドイツは消極的抵抗で応じ、ハイパーインフレが発生し、のちにシュトレーゼマン内閣が事態の収拾をはかり、アメリカの資本によるドーズ案（1924年）が実施されました。イギリスやアメリカ、ソ連は占領には加わっていません。","m":"ルール占領（1923）＝仏・ベルギー"},{"id":167,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅰ 問2","f":"20世紀の世界（恐慌・冷戦）","t":"55年体制","y":1955,"q":"日本の55年体制について、正しい説明はどれですか。","c":["1955年に保守合同で自由民主党が結成され、社会党も統一された","1955年に社会党が政権を握り、自由民主党は長く野党にとどまった","冷戦の終結前の1989年に崩壊して、自民党以外の連立政権が成立した","福田赳夫内閣のもとで日中国交が正常化し、台湾との国交を断絶した","あてはまるものがない"],"e":"1955年に日本民主党と自由党が合同して自由民主党が結成され、右派と左派に分かれていた社会党も統一されました。自民党が政権を担い、社会党が野党第一党という構図が続きました。この体制は冷戦終結後の1993年に崩壊しました。日中国交正常化は1972年の田中角栄内閣のときです。","m":"55年体制＝自民党と社会党（1955〜93）","last":true},{"id":168,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅰ 問7","f":"20世紀の世界（恐慌・冷戦）","t":"ヨーロッパ石炭鉄鋼共同体","y":1952,"q":"1952年、フランスのシューマン外相の提案にもとづいて、石炭・鉄鋼業の共同管理をめざして西欧6か国が発足させた機構はどれですか。","c":["ECSC（石炭鉄鋼共同体）","EEC（経済共同体）","EFTA（自由貿易連合）","コメコン（経済相互援助会議）"],"e":"ECSCはフランス・西ドイツ・イタリア・ベネルクス3国が発足させ、石炭と鉄鋼を共同管理して、戦争の原因となる資源をめぐる対立を防ぐことをねらいました。EECは1958年に発足し、のちにECさらにEUへと発展していきます。EFTAは1960年にイギリスが中心となった自由貿易連合で、コメコンは東側諸国の経済機構です。","m":"シューマン＝プラン→ECSC（1952）"},{"id":169,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅰ 問8","f":"20世紀の世界（恐慌・冷戦）","t":"GATT","y":1947,"q":"ブロック経済で世界経済が分断されたことへの反省から、関税引き下げなど貿易の自由化を進めるために、1947年に調印された協定はどれですか。","c":["GATT（関税貿易一般協定）","IMF（国際通貨基金）","IBRD（国際復興開発銀行）","WTO（世界貿易機関）"],"e":"GATTは、1930年代の保護貿易や関税の引き上げの反省から、自由・無差別・多角的な貿易を掲げて結ばれた協定です。IMFは為替の安定、IBRDは戦後復興や開発の融資を目的とした機関です。WTOは1995年にGATTを発展させて設立された組織で、1947年にはまだありません。","m":"GATT（1947）＝自由貿易の協定"},{"id":170,"k":"past","ref":"2026年度 商学部A個別第2期 Ⅰ 問4","f":"20世紀の世界（恐慌・冷戦）","t":"アメリカの移民法","y":1924,"q":"アメリカで1882年と1924年に成立した移民法が、それぞれ新たに移民を禁止した対象の組み合わせとして、正しいものはどれですか。","c":["1882年は中国人、1924年は日本人","1882年は日本人、1924年は中国人","1882年は黒人、1924年はヒスパニック系","1882年はアイルランド系、1924年はドイツ系"],"e":"1882年の移民法（中国人移民法）は、鉄道建設などで増えた中国人労働者の流入を禁止し、のちに恒久化されました。1924年の移民法は国別の割当制を定め、日本人を含むアジアからの移民を事実上禁止しました。黒人やヒスパニック系の移民、アイルランド系やドイツ系の移民を禁止したわけではありません。","m":"1882 中国人移民法、1924 日本人移民も禁止"},{"id":171,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅴ 問37","f":"20世紀の世界（恐慌・冷戦）","t":"四カ国条約","y":1921,"q":"1921〜22年のワシントン会議で結ばれ、太平洋の島々の領土と権益の相互尊重・現状維持を定めて、日英同盟の廃棄につながった条約はどれですか。","c":["四カ国条約","九カ国条約","ロカルノ条約","ローザンヌ条約"],"e":"四カ国条約は、日本・アメリカ・イギリス・フランスが太平洋の島々の現状維持を約束した条約で、これにより日英同盟は廃棄されました。九カ国条約は中国の主権尊重と門戸開放を定めた条約です。ロカルノ条約は1925年の西欧の安全保障条約、ローザンヌ条約は1923年のトルコとの講和条約です。","m":"四カ国条約（1921）＝太平洋の現状維持"},{"id":172,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅴ 問38","f":"20世紀の世界（恐慌・冷戦）","t":"太平洋戦争の戦局の順序","y":1943,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア アメリカ軍がサイパン島を占領した。\nイ ミッドウェー海戦がおこった。\nウ アメリカ軍が沖縄に上陸した。\nエ ガダルカナル島をめぐる攻防戦がおこった。","c":["イ→エ→ア→ウ","エ→イ→ア→ウ","イ→ア→エ→ウ","イ→エ→ウ→ア"],"e":"1942年6月のミッドウェー海戦で日本は主力空母を失い、同年8月から翌年2月にガダルカナル島をめぐる戦いが続きました。1944年にアメリカ軍がサイパン島を占領し、日本本土への空襲が可能になりました。1945年4月にアメリカ軍が沖縄に上陸し、地上戦となりました。","m":"ミッドウェー→ガダルカナル→サイパン→沖縄"},{"id":173,"k":"past","ref":"2026年度 商学部A個別第1期 Ⅳ 問31","f":"20世紀の世界（恐慌・冷戦）","t":"フォークランド戦争","y":1982,"q":"1982年、フォークランド諸島の領有をめぐってイギリスと戦い、敗れた南米の国はどれですか。","c":["アルゼンチン","ベネズエラ","ウルグアイ","コロンビア"],"e":"アルゼンチンは、イギリスが領有するフォークランド諸島（アルゼンチン名はマルビナス諸島）の領有を主張し、1982年に軍事行動をおこしましたが敗れました。この敗北で軍事政権は信頼を失い、1983年に民政へ移管しました。ベネズエラ・ウルグアイ・コロンビアはこの戦争の当事国ではありません。","m":"フォークランド（1982）＝英 vs アルゼンチン"},{"id":174,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"北魏の孝文帝の改革","y":494,"q":"北魏の孝文帝が行った政策として、正しいものはどれですか。","c":["都を洛陽に移し、胡服や鮮卑語を禁じて漢化政策を進めた","寇謙之を重用して道教を国教とし、仏教を弾圧して華北を統一した","均田制を廃止して、すべての土地を豪族の私有地として認めた","府兵制を新たに導入し、兵役と土地の給付を結びつけた"],"e":"孝文帝は5世紀末に洛陽へ遷都し、鮮卑の風俗を禁じて姓を漢風に改めさせるなど漢化政策を進めました。均田制は485年に実施した土地制度です。仏教を弾圧し華北を統一したのは太武帝で、府兵制は西魏から隋・唐に受け継がれた兵制です。","m":"孝文帝＝洛陽遷都・漢化・均田制"},{"id":175,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"王安石の新法","y":1070,"q":"北宋の神宗に登用された王安石が行った新法の内容として、正しいものはどれですか。","c":["青苗法や市易法を行い、中小農民・商人の保護をはかった","募兵制を廃止して府兵制を復活させ、軍事費の削減をはかった","両税法を廃止して、人頭税を中心とする租調庸制に戻した","九品中正の制を復活させ、有力な家柄の人々を官僚に採用した"],"e":"王安石は1069年から、農民に低利で貸し付ける青苗法、中小商人を助ける市易法、軍制を整える保甲法などの新法を実施しました。保守的な官僚（旧法党）の反発を受けて政争が続き、北宋の政治は混乱しました。府兵制の復活や租調庸制・九品中正の復活は行っていません。","m":"王安石＝青苗法・市易法（新法）"},{"id":176,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"朱子学の大成","y":1170,"q":"南宋の朱熹が大成した、宇宙や人間の本質を理と気によって説明した儒学の新しい学問はどれですか。","c":["朱子学","陽明学","考証学","訓詁学"],"e":"朱熹は北宋の周敦頤・程顥・程頤らの学問をまとめ、理と気で世界を説明し、人間の本性を重んじる朱子学を大成しました。陽明学は明の王陽明、考証学は清の学問で、訓詁学は漢代の学者が経典の字句に注をつけた学問です。朱子学は朝鮮や日本の学問にも影響しました。","m":"朱子学＝朱熹・理気二元・南宋"},{"id":177,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"聖像禁止令","y":726,"q":"726年、ビザンツ皇帝レオン3世が出し、ローマ教会との対立を深めた法令はどれですか。","c":["聖像禁止令","ミラノ勅令","アントニヌス勅令","金印勅書"],"e":"聖像禁止令は、偶像崇拝を禁じるイスラーム教徒の批判に応じる目的などで出され、聖像を用いて布教してきたローマ教会が強く反発しました。ミラノ勅令はコンスタンティヌス帝によるキリスト教の公認、アントニヌス勅令は全自由人にローマ市民権を与えた勅令です。金印勅書は1356年に神聖ローマ皇帝カール4世が出した法令です。","m":"聖像禁止令（726）→ローマ教会と対立"},{"id":178,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"カノッサの屈辱","y":1077,"q":"1077年、破門された神聖ローマ皇帝ハインリヒ4世が、教皇グレゴリウス7世に赦しを願った事件はどれですか。","c":["カノッサの屈辱","アナーニ事件","教会大分裂（大シスマ）","ヴォルムス協約の締結"],"e":"叙任権闘争の中で、聖職者の任免権をめぐって教皇と対立した皇帝ハインリヒ4世は、破門を受けて諸侯の離反を恐れ、カノッサで教皇に謝罪しました。アナーニ事件は1303年の教皇とフランス王の事件、大シスマは14世紀後半の教会分裂、ヴォルムス協約は1122年に叙任権闘争を終わらせた取り決めです。","m":"カノッサ（1077）＝皇帝が教皇に屈服"},{"id":179,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"フランク王国の分裂","y":870,"q":"9世紀、フランク王国が分かれ、のちのドイツ・フランス・イタリアの原型となる契機となった条約の組み合わせはどれですか。","c":["ヴェルダン条約とメルセン条約","ウェストファリア条約とカルロヴィッツ条約","ヴォルムス協約とアウクスブルクの和議","トルデシリャス条約とユトレヒト条約"],"e":"カール大帝の孫たちが843年のヴェルダン条約で王国を3分し、870年のメルセン条約で中部の北部を東西に分けた結果、のちのドイツ・フランス・イタリアの原型ができました。ほかの組み合わせは、いずれも近世以降または叙任権闘争や宗教改革に関する取り決めです。","m":"ヴェルダン（843）とメルセン（870）"},{"id":180,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"大憲章（マグナ＝カルタ）","y":1215,"q":"1215年、イングランドの貴族がジョン王に認めさせた、王権が法によって制限されることを定めた文書はどれですか。","c":["大憲章","権利の請願","権利章典","人身保護法"],"e":"大憲章は、ジョン王がフランスとの戦争に敗れ、重税を課したことへの貴族の反発から認められた文書で、王でも法に従うべきだという考え方の出発点になりました。権利の請願（1628年）、人身保護法（1679年）、権利章典（1689年）は、いずれも17世紀に議会が王権を制限した文書です。","m":"大憲章（1215）＝ジョン王と貴族"},{"id":181,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ファーティマ朝","y":969,"q":"10世紀にエジプトを征服してカイロを建設し、カリフを称したシーア派（イスマーイール派）の王朝はどれですか。","c":["ファーティマ朝","ブワイフ朝","セルジューク朝","後ウマイヤ朝"],"e":"ファーティマ朝は北アフリカで成立し、969年にエジプトを征服してカイロを建設しました。バグダードのアッバース朝カリフに対抗してカリフを称しました。ブワイフ朝は同じシーア派でもバグダードに入った王朝、セルジューク朝は11世紀にバグダードに入ってスルタンの称号を得たスンナ派のトルコ人王朝、後ウマイヤ朝はイベリア半島のスンナ派の王朝です。","m":"ファーティマ朝＝カイロ・シーア派のカリフ"},{"id":182,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"アクバルの融和政策","y":1579,"q":"ムガル帝国のアクバル帝が、ヒンドゥー教徒との融和をはかるために廃止した税はどれですか。","c":["ジズヤ","ハラージュ","ザカート","ウシュル"],"e":"ジズヤは、イスラーム国家で非ムスリムが納める人頭税で、アクバルは1579年にこれを廃止して、ヒンドゥー教徒の支持を得ようとしました。ラージプートの有力者を高官にとり立てたことも融和策でした。ハラージュは地租、ザカートはムスリムの義務としての喜捨、ウシュルはムスリムの土地にかかる税で、アクバルが廃止したものではありません。","m":"アクバル＝ジズヤ廃止・宗教融和"},{"id":183,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ティムール朝","y":1400,"q":"14世紀末にサマルカンドを都として西アジアに領土を広げ、アンカラの戦いでオスマン帝国のバヤジット1世を破った人物はだれですか。","c":["ティムール","バーブル","ウルグ＝ベク","チンギス＝ハン"],"e":"ティムールは中央アジアのサマルカンドを都とするティムール朝を建て、1402年のアンカラの戦いでバヤジット1世を捕らえました。バーブルはティムールの子孫でムガル帝国の初代皇帝、ウルグ＝ベクはティムールの孫で天文学者でもあった王、チンギス＝ハンはモンゴル帝国の建国者で時代が違います。","m":"ティムール＝サマルカンド・アンカラの戦い"},{"id":184,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"コロンブスの航海","y":1492,"q":"1492年、スペイン女王イサベルの援助を受けて大西洋を横断し、現在のバハマ諸島のサンサルバドル島に到達した航海者はだれですか。","c":["コロンブス","マゼラン","ヴェスプッチ","バルボア"],"e":"コロンブスは地球球体説を信じて、西回りでアジアに到達しようと試み、カリブ海の島々に到達しました。彼はそこをインドの一部と考え、住民を「インディオ」とよびました。マゼランは世界周航の船団を率いた人物（本人は途中で死亡）、ヴェスプッチは南米を探検して新大陸だと唱え「アメリカ」の名の由来となった人物、バルボアはパナマ地峡を横断して太平洋に到達した人物です。","m":"1492 コロンブス＝サンサルバドル島"},{"id":185,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ルイ14世とナントの王令廃止","y":1685,"q":"「太陽王」とよばれたフランスのルイ14世が、1685年に廃止して多くの商工業者の国外流出を招いた王令はどれですか。","c":["ナントの王令","ヴォルムス勅令","アウクスブルクの和議","ミラノ勅令"],"e":"ナントの王令はアンリ4世が1598年に出した、ユグノーに信仰の自由を認めた王令です。ルイ14世は1685年にこれを廃止し、商工業にたずさわるユグノーが国外に流出して、フランスの経済に打撃を与えました。ヴォルムス勅令は1521年にルターを帝国から追放した勅令、アウクスブルクの和議は1555年の宗教和議、ミラノ勅令は313年のキリスト教公認です。","m":"ナントの王令（1598）廃止（1685）"},{"id":186,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"名誉革命と権利章典","y":1689,"q":"1688〜89年のイギリスの名誉革命で、新しい王夫妻が即位に際して承認し、議会の権利を確認した文書はどれですか。","c":["権利章典","大憲章（マグナ＝カルタ）","権利の請願","人身保護法"],"e":"名誉革命では、ジェームズ2世が亡命し、議会がオランダ総督のウィレム（ウィリアム3世）と妻のメアリ2世を王に迎えました。二人は1689年に権利章典を承認し、立憲王政と議会主権が確立しました。大憲章は1215年、権利の請願は1628年、人身保護法は1679年の文書です。","m":"名誉革命→権利章典（1689）"},{"id":187,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ウェストファリア条約","y":1648,"q":"1648年に結ばれ、三十年戦争を終わらせて、ドイツ諸侯の主権を認めた条約はどれですか。","c":["ウェストファリア条約","ユトレヒト条約","カルロヴィッツ条約","アウクスブルクの和議"],"e":"ウェストファリア条約では、フランスがアルザスの一部を得て、スイスとオランダの独立が正式に認められました。ドイツでは諸侯の主権が認められて、神聖ローマ帝国は事実上解体しました。ユトレヒト条約は1713年、カルロヴィッツ条約は1699年、アウクスブルクの和議は1555年の取り決めです。","m":"ウェストファリア（1648）＝三十年戦争の終結"},{"id":188,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"人権宣言","y":1789,"q":"1789年8月、フランスの国民議会が採択した、自由・平等や国民主権をうたった宣言はどれですか。","c":["人権宣言","独立宣言","権利章典","ギュルハネ勅令"],"e":"人権宣言（人間と市民の権利の宣言）は、バスティーユ襲撃を経て国民議会が採択し、人間の自由と平等、国民主権、所有権の不可侵などを掲げました。独立宣言は1776年のアメリカ、権利章典は1689年のイギリスの文書です。ギュルハネ勅令は1839年のオスマン帝国のタンジマート開始の勅令です。","m":"人権宣言（1789）＝国民議会・自由と平等"},{"id":189,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"大陸封鎖令","y":1806,"q":"1806年、ナポレオン1世がイギリスの経済を封じるために出した命令はどれですか。","c":["大陸封鎖令","航海法","穀物法","奴隷解放宣言"],"e":"ナポレオン1世は、1806年にベルリン勅令（大陸封鎖令）を出して、ヨーロッパ大陸諸国にイギリスとの通商を禁じました。しかしロシアが従わなかったため、1812年にロシア遠征が行われ、遠征の失敗がナポレオンの没落につながりました。航海法はイギリス、穀物法は穀物輸入を制限した19世紀のイギリスの法律、奴隷解放宣言は1863年にリンカンが出した宣言です。","m":"大陸封鎖令（1806）＝英への通商禁止"},{"id":190,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"産業革命","y":1769,"q":"18世紀後半のイギリスで、産業革命の中心となった工業と、動力の改良で大きな役割を果たした人物の組み合わせとして、正しいものはどれですか。","c":["綿工業 ― ワット（蒸気機関の改良）","製鉄業 ― アークライト（蒸気機関の改良）","毛織物工業 ― ワット（水力紡績機）","綿工業 ― スティーヴンソン（飛び杼）"],"e":"イギリスの産業革命は綿工業から始まり、ワットが1769年に蒸気機関を改良して動力が大きく変わりました。アークライトは水力紡績機の発明者、スティーヴンソンは蒸気機関車の実用化に成功した人物、飛び杼はジョン＝ケイが発明しました。人物と発明の組み合わせを整理しましょう。","m":"産業革命＝綿工業・ワットの蒸気機関"},{"id":191,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"辛亥革命と三民主義","y":1911,"q":"1911年に始まった辛亥革命で、臨時大総統に就任し、民族・民権・民生からなる三民主義を唱えた人物はだれですか。","c":["孫文","袁世凱","康有為","蔣介石"],"e":"孫文は中国同盟会を結成して三民主義を掲げ、辛亥革命ののち1912年に中華民国の臨時大総統となりました。のちに実権を握った袁世凱に地位を譲りました。康有為は戊戌の変法を進めた改革派、蔣介石は孫文の死後に国民党を率いて北伐を完成した人物です。","m":"孫文＝三民主義・中華民国臨時大総統"},{"id":192,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ヴェルサイユ条約","y":1919,"q":"1919年のヴェルサイユ条約でドイツに課された内容として正しいものがあれば選び、なければ「あてはまるものがない」を選びなさい。","c":["オーストリアとの合併の承認と、軍備の大幅な拡張","ポーランド回廊の保持と、ラインラントへの軍隊の自由な駐留","植民地の保持と、賠償金の免除","あてはまるものがない"],"e":"ヴェルサイユ条約でドイツは、アルザス・ロレーヌをフランスに返還し、海外の植民地をすべて失い、巨額の賠償金を課され、軍備も厳しく制限されました。ラインラントは非武装化され、ポーランド回廊はポーランドに与えられ、オーストリアとの合併も禁じられました。3つの選択肢はどれも条約の内容と逆なので、正解は「あてはまるものがない」です。","m":"ヴェルサイユ条約＝ドイツに厳しい（逆の内容は誤り）","last":true,"a":3},{"id":193,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ローマ進軍","y":1922,"q":"1922年、イタリアでファシスト党を率いるムッソリーニが、首都ローマに向けて行進し、政権を獲得した事件はどれですか。","c":["ローマ進軍","ミュンヘン一揆","ヴァレンヌ逃亡事件","三月革命"],"e":"ムッソリーニは1922年にファシストが首都に進軍すると圧力をかけ、国王に首相に任命され、のちに一党独裁を築きました。ミュンヘン一揆は1923年のヒトラーの蜂起の失敗、ヴァレンヌ逃亡事件はフランス革命期の国王一家の逃亡未遂、三月革命は1848年のドイツ・オーストリアの革命です。","m":"ローマ進軍（1922）＝ムッソリーニ政権へ"},{"id":194,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"スペイン内戦","y":1936,"q":"1936年にスペインで人民戦線政府に対して反乱をおこし、ドイツとイタリアの支援を受けて勝利した軍人はだれですか。","c":["フランコ","ペタン","ティトー","サラザール"],"e":"スペイン内戦では、フランコ将軍が人民戦線内閣に反乱をおこし、独伊の支援を受けて勝利し、独裁体制を築きました。人民政府は国際義勇軍の支援を受けましたが、英仏は不干渉政策をとりました。ペタンはフランスのヴィシー政府の首班、ティトーはユーゴスラヴィアの指導者、サラザールはポルトガルの独裁者です。","m":"スペイン内戦＝フランコ（独伊が支援）"},{"id":195,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ブレトン＝ウッズ体制","y":1944,"q":"1944年のブレトン＝ウッズ会議にもとづいて発足した、第二次世界大戦後の国際経済の枠組みについて、正しいものはどれですか。","c":["IMFとIBRDが設立され、ドルを基軸とする固定為替相場制がとられた","WTOが設立され、加盟したすべての国の間で関税が完全に撤廃された","マーシャル＝プランが発表され、アメリカが西欧諸国の復興を援助した","ECSCが設立され、西欧6か国が石炭と鉄鋼を共同で管理することになった"],"e":"ブレトン＝ウッズ体制では、国際通貨基金（IMF）と国際復興開発銀行（IBRD）が設立されました。アメリカが金とドルの交換を保証し、各国の通貨をドルと一定の比率で結ぶ固定為替相場制（金・ドル本位制）がとられました。WTOは1995年の設立で、関税が全面的に撤廃されたわけではありません。マーシャル＝プランは1947年、ECSCは1952年です。","m":"ブレトン＝ウッズ＝IMF・IBRD・ドル基軸"},{"id":196,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"国際連合の成立","y":1945,"q":"1945年に発足した国際連合について正しいものがあれば選び、なければ「あてはまるものがない」を選びなさい。","c":["本部はジュネーヴにおかれ、常任理事国は日本を含む5か国となった","発足時の決議は全会一致でなければならず、大国の拒否権は認められなかった","国際連盟の解散後に発足し、アメリカは参加しなかった","あてはまるものがない"],"e":"国際連合は1945年のサンフランシスコ会議で憲章が採択され、本部はニューヨークにおかれました。安全保障理事会の常任理事国は米・英・仏・ソ・中の5か国で、日本は含まれず、大国は拒否権をもちます。アメリカは原加盟国として参加し、国際連盟の解散（1946年）より前に発足しました。3つとも誤りなので、正解は「あてはまるものがない」です。","m":"国連＝ニューヨーク・五大国の拒否権・米も参加","last":true,"a":3},{"id":197,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ベトナム和平協定","y":1973,"q":"1973年、ベトナム戦争に関して結ばれ、アメリカ軍がベトナムから撤退する契機となった協定はどれですか。","c":["パリ協定","ジュネーヴ休戦協定","ヴェルサイユ条約","ポーツマス条約"],"e":"ベトナム（パリ）和平協定によってアメリカ軍は撤退し、1975年に北ベトナムが南ベトナムのサイゴンを陥落させて、翌年にベトナムが統一されました。ジュネーヴ休戦協定は1954年にインドシナ戦争を終わらせた協定、ヴェルサイユ条約は第一次世界大戦の講和、ポーツマス条約は日露戦争の講和条約です。","m":"パリ協定（1973）→米軍撤退→75年サイゴン陥落"},{"id":198,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"湾岸戦争","y":1991,"q":"1990年にイラクがクウェートに侵攻したことを受けて、1991年にアメリカを中心とする多国籍軍が派遣された戦争はどれですか。","c":["湾岸戦争","イラン＝イラク戦争","第4次中東戦争","朝鮮戦争"],"e":"湾岸戦争は、国連の決議にもとづき、アメリカを中心とする多国籍軍がイラクを攻撃してクウェートを解放した戦争です。イラン＝イラク戦争は1980〜88年の両国の戦争、第4次中東戦争は1973年のイスラエルとアラブ諸国の戦争、朝鮮戦争は1950年に始まった戦争です。","m":"湾岸戦争（1991）＝多国籍軍がクウェート解放"},{"id":199,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ソ連の解体","y":1991,"q":"1991年にソ連が解体し、ロシアなど旧ソ連の共和国の多くが結成した共同体はどれですか。","c":["独立国家共同体（CIS）","ヨーロッパ連合（EU）","東南アジア諸国連合（ASEAN）","経済相互援助会議（コメコン）"],"e":"1991年、保守派のクーデタが失敗して共産党の権威が失墜し、ソ連は解体してロシアなどの共和国が独立国家共同体（CIS）を結成しました。EUは1993年発足の西欧中心の組織、ASEANは東南アジアの組織、コメコンは冷戦期に東側が結成した経済機構で、1991年に解散しました。","m":"1991 ソ連解体→CIS"},{"id":200,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"マーストリヒト条約","y":1993,"q":"1992年に調印され、翌年に発効して、ヨーロッパ連合（EU）の発足を定めた条約はどれですか。","c":["マーストリヒト条約","ローマ条約","リスボン条約","ウェストファリア条約"],"e":"マーストリヒト条約は、ヨーロッパ共同体（EC）を発展させて、通貨統合や共通の外交・安全保障政策をめざすヨーロッパ連合（EU）の発足を定めました。ローマ条約は1957年にEEC設立を定めた条約、リスボン条約は2007年に調印されたEUの基本条約の改正、ウェストファリア条約は1648年の三十年戦争の講和条約です。","m":"マーストリヒト条約（1992）→EU発足"},{"id":201,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"武帝の財政政策","y":-115,"q":"前漢の武帝は、匈奴との戦争や大規模な土木工事で苦しくなった財政を立て直そうとしました。そのために行った政策として最も適当なものはどれですか。","c":["塩・鉄を専売とし、均輸・平準を行って物価の調整と財源の確保をはかった","所有する土地や資産に応じて、夏と秋の2回に課税する両税法を施行した","各種の税や労役を銀でまとめて納めさせる一条鞭法を導入した","農民に低い利子で資金や穀物を貸し付ける青苗法を実施した"],"e":"武帝は塩・鉄（のちに酒も）を国家の専売とし、物資を各地に移して売る均輸、物価が安いときに買い高いときに売る平準を行って財源を確保しました。両税法は唐の楊炎（780年）、一条鞭法は明代、青苗法は北宋の王安石の新法で、いずれも時代が異なります。","m":"武帝の財政＝塩・鉄専売＋均輸・平準"},{"id":202,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"張騫の派遣","y":-139,"q":"前漢の武帝は、匈奴をはさみうちにする同盟を結ぶため、中央アジアの大月氏に使者を送りました。同盟は実現しませんでしたが、この使者の旅によって西域の事情が中国に伝わりました。この使者は誰ですか。","c":["張騫","班超","甘英","衛青"],"e":"大月氏に派遣されたのは張騫です。同盟は成立しませんでしたが、西域の情報がもたらされ、のちの西域経営の基礎となりました。班超は後漢の西域都護、甘英は班超が大秦（ローマ）に派遣した部下、衛青は武帝の時代に匈奴と戦った将軍で、いずれも大月氏への使者ではありません。","m":"大月氏へ＝張騫（前漢・武帝）、西域都護＝班超（後漢）"},{"id":203,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"王莽と新","y":8,"q":"前漢の外戚であった王莽が帝位を奪って建てた新について述べた文として最も適当なものはどれですか。","c":["周の時代の制度を理想とする復古的な政治を行ったが、社会が混乱し、赤眉の乱などの反乱のなかで短い期間で滅んだ","劉秀（光武帝）が建てた王朝で、洛陽を都とした","宦官と外戚の争いが激しく、党錮の禁によって多くの官僚が弾圧された","太平道の張角が率いた黄巾の乱によって滅亡した"],"e":"王莽は8年に新を建て、周の制度を理想とする復古的な政策を進めましたが、現実に合わず社会が混乱し、赤眉の乱などの反乱がおこって23年に滅びました。その後、劉秀（光武帝）が漢を再興して洛陽に都をおきました（後漢）。党錮の禁と黄巾の乱は、いずれも後漢の出来事です。","m":"新（王莽）＝周を理想の復古政治→赤眉の乱で滅亡"},{"id":204,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"黄巾の乱","y":184,"q":"後漢の末期の184年におこった黄巾の乱は、ある宗教結社の指導者が率いた農民反乱でした。この宗教結社として最も適当なものはどれですか。","c":["太平道","五斗米道","白蓮教","拝上帝会"],"e":"黄巾の乱は、張角が始めた太平道の信徒が黄色い頭巾を目印に蜂起した反乱で、後漢が衰えるきっかけとなりました。五斗米道は同じころ張陵が始めた宗教結社で、のちの道教のもとの一つです。白蓮教は元末の紅巾の乱や清代の反乱、拝上帝会は清末の太平天国にかかわる結社です。","m":"黄巾の乱（184）＝張角の太平道"},{"id":205,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"『史記』","y":-91,"q":"前漢の司馬遷が著した『史記』について述べた文として最も適当なものはどれですか。","c":["伝説上の帝王から武帝の時代までを、本紀・列伝などに分けて記す紀伝体で書かれた","出来事を年代順に記す編年体で書かれ、北宋の時代にまとめられた","前漢一代の歴史だけを扱う断代史として書かれた","唐の太宗の命令により、国家事業として編纂された"],"e":"『史記』は、伝説上の黄帝から前漢の武帝の時代までを、帝王の記録である本紀や人物の伝記である列伝などに分けて記した紀伝体の歴史書で、のちの正史の形式の手本となりました。編年体で北宋にまとめられたのは司馬光の『資治通鑑』、前漢一代の断代史は後漢の班固の『漢書』です。","m":"史記＝司馬遷・紀伝体／漢書＝班固・断代史"},{"id":206,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"九品中正","y":220,"q":"三国の魏で始められた官吏登用法で、地方におかれた中正官が人物を9等級に評定して中央に推薦するしくみを何といいますか。","c":["九品中正","郷挙里選","科挙","屯田制"],"e":"魏の文帝（曹丕）が始めた九品中正は、中正官が人材を9等級に分けて推薦する制度でしたが、実際には有力な豪族の子弟が高い等級を独占し、門閥貴族が形成される原因となりました。郷挙里選は前漢の、地方長官が人材を推薦する制度、科挙は隋で始まった試験による登用法、屯田制は魏が行った土地制度です。","m":"九品中正（魏）→豪族が上位独占→門閥貴族"},{"id":207,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"北魏の孝文帝","y":494,"q":"5世紀後半、北魏の孝文帝が行った政策として最も適当なものはどれですか。","c":["均田制を施行し、また平城から洛陽に都を移して漢化政策を進めた","陳を滅ぼして南北を統一し、学科試験による官吏登用を始めた","大運河を完成させて、華北と江南を結んだ","租調庸制と府兵制を整え、律令にもとづく国家体制を完成させた"],"e":"鮮卑の拓跋氏が建てた北魏では、孝文帝が485年に均田制を施行し、494年には平城から洛陽へ遷都して、鮮卑の服装や言語を改める漢化政策を進めました。陳を滅ぼして統一し科挙を始めたのは隋の文帝、大運河を完成させたのは隋の煬帝、租調庸制・府兵制を整えて律令国家を完成させたのは唐です。","m":"孝文帝＝均田制＋洛陽遷都＋漢化政策"},{"id":208,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"六朝文化の人物","y":350,"q":"東晋・南朝を中心に栄えた六朝文化の人物と、その活躍した分野・作品の組み合わせとして正しいものはどれですか。","c":["王羲之 ― 書道","顧愷之 ― 詩文（「帰去来辞」）","陶淵明 ― 絵画（「女史箴図」）","昭明太子 ― 書道"],"e":"東晋の王羲之は書道で名高く「書聖」と呼ばれます。「女史箴図」の作者とされるのは東晋の画家顧愷之、「帰去来辞」を書いたのは田園詩人の陶淵明です。梁の昭明太子は、古今の名文を集めた『文選』を編集した人物です。人物と分野が入れかわっていないかに注意しましょう。","m":"書＝王羲之、画＝顧愷之、詩＝陶淵明、文選＝昭明太子"},{"id":209,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"鳩摩羅什","y":401,"q":"西域の亀茲（クチャ）出身の僧で、5世紀初めに長安に迎えられ、多くの仏典を漢語に翻訳した人物は誰ですか。","c":["鳩摩羅什","仏図澄","法顕","義浄"],"e":"鳩摩羅什は亀茲出身の僧で、401年に後秦の長安に迎えられ、多くの大乗仏典を漢訳して中国の仏教の発展に大きな役割を果たしました。仏図澄は4世紀に華北（後趙）で布教した西域出身の僧で、仏典の翻訳者としては知られていません。法顕は東晋の僧でグプタ朝のインドを訪れ、義浄は唐の僧で海路でインドに赴きました。","m":"亀茲出身・長安で仏典漢訳＝鳩摩羅什"},{"id":210,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"隋の煬帝","y":610,"q":"隋の第2代皇帝である煬帝について述べた文として最も適当なものはどれですか。","c":["大運河を完成させて華北と江南を結んだが、高句麗遠征の失敗などから各地で反乱がおこった","陳を滅ぼして南北朝を統一し、学科試験による官吏登用（科挙）を始めた","突厥の援助を受けて挙兵し、長安を都とする新しい王朝を開いた","均田制を初めて施行し、都を平城から洛陽に移した"],"e":"煬帝は父の文帝のあとを継ぎ、華北と江南を結ぶ大運河を完成させましたが、土木工事や3度にわたる高句麗遠征の失敗で民衆の負担が重くなり、各地で反乱がおこって隋は滅びました。南北統一と科挙の開始は文帝、突厥の援助で挙兵して唐を建てたのは李淵（高祖）、均田制の施行と洛陽遷都は北魏の孝文帝です。","m":"煬帝＝大運河完成・高句麗遠征失敗→隋滅亡"},{"id":211,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"唐の三省","y":630,"q":"唐の中央官制の三省のうち、中書省が起草した詔勅を審議し、不適当と判断すれば差し戻すこともできた機関はどれですか。","c":["門下省","尚書省","御史台","枢密院"],"e":"唐の三省では、中書省が詔勅を起草し、門下省がそれを審議し、尚書省が六部（吏・戸・礼・兵・刑・工）を通じて執行しました。門下省には有力な貴族が多く、詔勅を差し戻す権限は貴族の力の表れでもありました。御史台は官吏を監察する機関、枢密院は五代・宋で軍事を担当した機関です。","m":"中書＝起草、門下＝審議、尚書＝執行（六部）"},{"id":212,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"両税法","y":780,"q":"唐の中期、均田制と租調庸制がくずれたため、780年に宰相楊炎の意見で新しい税制が採用されました。この税制の内容として最も適当なものはどれですか。","c":["現住地で、所有する土地や資産に応じて夏と秋の2回に課税した","成年男子に土地を均等に支給し、穀物・布・労役を負担させた","各種の税や労役を銀にまとめて納めさせた","人頭税にあたる丁税を土地税に組みこんで一本化した"],"e":"780年に施行された両税法は、本籍地ではなく現住地で、土地や資産の多さに応じて夏と秋の2回課税するもので、土地の私有を認める方向に転換したものでした。土地を支給して租調庸を負担させるのは均田制・租調庸制、銀でまとめて納めるのは明の一条鞭法、丁税を地税に組みこむのは清の地丁銀制です。","m":"両税法（780・楊炎）＝現住地・資産に応じ夏秋2回"},{"id":213,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"景教","y":781,"q":"唐の時代に中国に伝わり、「景教」と呼ばれた宗教はどれですか。","c":["キリスト教のネストリウス派","ゾロアスター教","マニ教","イスラーム"],"e":"景教はキリスト教のネストリウス派のことで、唐の長安には寺院が建てられ、781年には布教のようすを記した「大秦景教流行中国碑」が建てられました。唐ではほかに、ゾロアスター教が「祆教」、マニ教が「摩尼教」と呼ばれ、イラン系の人々などに信仰されました。イスラームは中国では「回教」「清真教」などと呼ばれました。","m":"景教＝ネストリウス派、祆教＝ゾロアスター教"},{"id":214,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"サータヴァーハナ朝","y":100,"q":"前1世紀ごろからデカン高原を中心に栄えたドラヴィダ系の王朝で、季節風を利用したローマとの海上交易によって繁栄した王朝はどれですか。","c":["サータヴァーハナ朝","チョーラ朝","ヴァルダナ朝","パーラ朝"],"e":"サータヴァーハナ朝はデカン高原を中心に栄えたドラヴィダ系の王朝で、季節風（モンスーン）を利用したローマとの交易で栄え、インド各地からはローマの金貨が出土しています。チョーラ朝は南インドで9〜13世紀に栄え、東南アジアに遠征した王朝、ヴァルダナ朝は7世紀にハルシャ王が北インドに建てた王朝、パーラ朝はベンガル地方の仏教を保護した王朝です。","m":"デカン高原・ローマと季節風交易＝サータヴァーハナ朝"},{"id":215,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"ナーランダー僧院","y":450,"q":"グプタ朝の時代に北インドに建てられた仏教の教学の中心で、7世紀には唐の玄奘や義浄も訪れて学んだ僧院はどれですか。","c":["ナーランダー僧院","サーンチーのストゥーパ","アジャンター石窟寺院","エローラ石窟寺院"],"e":"ナーランダー僧院はグプタ朝の5世紀に建てられ、仏教教学の最高学府として栄えました。玄奘や義浄もここで学んでいます。サーンチーのストゥーパ（仏塔）はマウリヤ朝のアショーカ王の時代に起源をもつ遺跡、アジャンター石窟寺院はグプタ様式の壁画で知られる石窟、エローラは仏教・ヒンドゥー教・ジャイナ教の石窟が並ぶ遺跡です。","m":"玄奘・義浄が学んだ＝ナーランダー僧院"},{"id":216,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"マウリヤ朝の創始","y":-317,"q":"アレクサンドロス大王が西北インドに侵入したのち、ガンジス川流域におこったマウリヤ朝の創始者と、その都の組み合わせとして正しいものはどれですか。","c":["チャンドラグプタ ― パータリプトラ","チャンドラグプタ ― プルシャプラ","カニシカ王 ― パータリプトラ","カニシカ王 ― プルシャプラ"],"e":"マウリヤ朝は前4世紀末にチャンドラグプタがナンダ朝を倒して建てた王朝で、都はガンジス川流域のパータリプトラです。カニシカ王は1〜2世紀に栄えたクシャーナ朝の最盛期の王で、都はガンダーラ地方のプルシャプラでした。王朝ごとに創始者・代表的な王と都をセットで覚えましょう。","m":"マウリヤ朝＝チャンドラグプタ・パータリプトラ"},{"id":217,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"漢〜南北朝の出来事の順序","y":100,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア 太平道の信徒が黄巾の乱をおこした。\nイ 北魏が華北を統一した。\nウ 張騫が大月氏に派遣された。\nエ 王莽が新を建てた。","c":["ウ→エ→ア→イ","エ→ウ→ア→イ","ウ→エ→イ→ア","ウ→ア→エ→イ"],"e":"ウの張騫の派遣は前漢の武帝の時代（前139年ごろ）、エの新の建国は8年、アの黄巾の乱は後漢末の184年、イの北魏による華北統一は439年です。前漢→新→後漢→魏晋南北朝という王朝の流れに出来事を当てはめると、順序を確実に判断できます。","m":"前漢（張騫）→新（王莽）→後漢末（黄巾）→北魏統一"},{"id":218,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"リキニウス・セクスティウス法","y":-367,"q":"共和政ローマで前367年に定められたリキニウス・セクスティウス法の内容として最も適当なものはどれですか。","c":["2人のコンスル（執政官）のうち1人を平民から選ぶことを定めた","平民会の決議が元老院の承認なしに国法となることを定めた","それまでの慣習法を成文化し、貴族による法の独占を改めた","平民の権利を守るために、護民官と平民会を新たに設けた"],"e":"リキニウス・セクスティウス法は、コンスルの1人を平民から選ぶことや公有地の占有を制限することを定め、平民が最高官職につく道を開きました。平民会の決議を国法とするのは前287年のホルテンシウス法、慣習法の成文化は前5世紀半ばの十二表法、護民官と平民会の設置は前5世紀初めのことです。","m":"前367リキニウス・セクスティウス法＝コンスル1人を平民から"},{"id":219,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"独裁官","y":-500,"q":"共和政ローマで、戦争などの非常事態に任命され、半年を限度に全権をゆだねられた官職を何といいますか。","c":["独裁官（ディクタトル）","護民官","執政官（コンスル）","元首（プリンケプス）"],"e":"独裁官は非常時に元老院の求めでコンスルが任命し、任期は半年に限られていました。権力の集中を一時的なものにとどめるくふうです。護民官は平民を守るために設けられた官職、執政官（コンスル）は定員2名・任期1年の最高官職、元首（プリンケプス）は帝政初期の皇帝の呼び名です。のちにカエサルは終身の独裁官となり、共和政の伝統を破ったとして暗殺されました。","m":"非常時・任期半年の全権＝独裁官"},{"id":220,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"同盟市戦争","y":-89,"q":"前1世紀初め、ローマ市民権を求めるイタリア半島の同盟市が反乱をおこしました（同盟市戦争）。この戦争の結果として最も適当なものはどれですか。","c":["イタリア半島の自由民にローマ市民権が認められた","帝国内のすべての自由人にローマ市民権が与えられた","平民会の決議が国法と認められ、身分闘争が終わった","ガリアが征服され、ローマの属州となった"],"e":"同盟市戦争（前91〜前88年）の結果、ローマはイタリア半島の自由民に市民権を認めました。帝国内の全自由人に市民権を与えたのは212年のカラカラ帝、平民会の決議を国法としたのは前287年のホルテンシウス法、ガリアを征服したのは前1世紀半ばのカエサルです。「イタリア半島」と「帝国全体」の区別がポイントです。","m":"同盟市戦争→イタリア自由民に市民権、212年→帝国全自由人"},{"id":221,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"アクティウムの海戦","y":-31,"q":"前31年、オクタウィアヌスが、アントニウスとエジプトのクレオパトラの連合軍を破った戦いはどれですか。","c":["アクティウムの海戦","ザマの戦い","カンネーの戦い","サラミスの海戦"],"e":"アクティウムの海戦でオクタウィアヌスがアントニウスとクレオパトラを破り、翌年にはプトレマイオス朝エジプトが滅んで、内乱の1世紀が終わりました。ザマの戦いは第2回ポエニ戦争でスキピオがハンニバルを破った戦い、カンネーの戦いはハンニバルがローマ軍を破った戦い、サラミスの海戦はペルシア戦争でアテネなどがペルシアを破った戦いです。","m":"前31アクティウム→前30プトレマイオス朝滅亡"},{"id":222,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"元首政","y":-27,"q":"前27年に元老院からアウグストゥスの称号を受けたオクタウィアヌスが始めた統治のしかたの説明として最も適当なものはどれですか。","c":["元老院など共和政の制度を尊重し、自らは「市民のなかの第一人者（プリンケプス）」と称した","皇帝を神として崇拝させ、専制君主として統治するドミナトゥスを始めた","終身の独裁官となって権力を独占した","帝国を東西に分け、2人の子に分けて継がせた"],"e":"オクタウィアヌスは共和政の形を残しつつ、実際には多くの権限を一身に集めました。この統治を元首政（プリンキパトゥス）といいます。専制君主政（ドミナトゥス）は3世紀末のディオクレティアヌス帝が始めたもの、終身独裁官となったのはカエサル、帝国を東西に分けて2子に継がせたのは395年に没したテオドシウス帝です。","m":"元首政（アウグストゥス）→専制君主政（ディオクレティアヌス）"},{"id":223,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"カラカラ帝","y":212,"q":"212年、帝国内のすべての自由人にローマ市民権を与えた皇帝は誰ですか。","c":["カラカラ","トラヤヌス","ハドリアヌス","ネロ"],"e":"212年のカラカラ帝の勅令（アントニヌス勅令）により、帝国内の全自由人にローマ市民権が与えられ、ローマ市民と属州民の区別が法的にはなくなりました。トラヤヌス帝は帝国の領土を最大にした五賢帝の一人、ハドリアヌス帝はブリタニアに長城を築いた皇帝、ネロ帝はキリスト教徒を迫害した1世紀の皇帝です。","m":"212年・全自由人に市民権＝カラカラ帝"},{"id":224,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"ウァレリアヌス帝","y":260,"q":"3世紀の軍人皇帝時代、ササン朝のシャープール1世との戦いに敗れて捕虜となったローマ皇帝は誰ですか。","c":["ウァレリアヌス","ユリアヌス","ディオクレティアヌス","マルクス＝アウレリウス＝アントニヌス"],"e":"260年、ウァレリアヌス帝はエデッサの戦いでササン朝のシャープール1世に敗れて捕らえられ、ローマ帝国の混乱を象徴する出来事となりました。ユリアヌス帝は4世紀に伝統的な神々の信仰の復興をはかった皇帝で、ササン朝への遠征中に戦死しましたが捕虜にはなっていません。ディオクレティアヌス帝は軍人皇帝時代を収拾した皇帝、マルクス＝アウレリウス＝アントニヌスは五賢帝最後の皇帝です。","m":"シャープール1世に捕らえられた皇帝＝ウァレリアヌス"},{"id":225,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"コンスタンティノープル遷都","y":330,"q":"コンスタンティヌス帝が行ったこととして最も適当なものはどれですか。","c":["ビザンティウムに都を移してコンスタンティノープルと改め、ソリドゥス金貨を発行した","キリスト教を国教とし、ほかの宗教の信仰を禁止した","ブリタニアに長城を築き、北方からの侵入に備えた","キリスト教を捨てて、古来の神々の信仰の復興をはかった"],"e":"コンスタンティヌス帝は330年にビザンティウムへ遷都してコンスタンティノープルと改称し、ソリドゥス金貨を発行しました。キリスト教を国教とし異教を禁じたのは4世紀末のテオドシウス帝、ブリタニアに長城を築いたのは2世紀のハドリアヌス帝、古来の神々の信仰の復興をはかったのは「背教者」と呼ばれたユリアヌス帝です。","m":"コンスタンティヌス＝遷都（330）・ソリドゥス金貨"},{"id":226,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"アウグスティヌス","y":426,"q":"北アフリカのヒッポの司教で最大の教父とされ、『告白』を著したアウグスティヌスが、西ゴート人のローマ略奪をきっかけに書いた著作はどれですか。","c":["『神の国』","『神学大全』","『自省録』","『愚神礼賛』"],"e":"アウグスティヌスは、410年の西ゴート人によるローマ略奪をキリスト教のせいとする非難に反論するため『神の国』を著し、のちの西ヨーロッパの神学に大きな影響を与えました。『神学大全』は13世紀のトマス＝アクィナス、『自省録』はストア派の皇帝マルクス＝アウレリウス＝アントニヌス、『愚神礼賛』は16世紀の人文主義者エラスムスの著作です。","m":"最大の教父アウグスティヌス＝『告白』『神の国』"},{"id":227,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"フン人の西進","y":375,"q":"4世紀後半、西方へ移動してきたある民族に圧迫されて、西ゴート人がドナウ川を渡りローマ帝国領内に移住しました。この民族はどれですか。","c":["フン人","マジャール人","アヴァール人","ノルマン人"],"e":"アジア系のフン人が黒海北岸に進出して東ゴート人を支配し、圧迫を受けた西ゴート人が376年にドナウ川を渡ってローマ帝国領内に入りました。これがゲルマン人の大移動の始まりとされます。マジャール人は9〜10世紀に中部ヨーロッパに侵入し、アヴァール人は6〜8世紀に東ヨーロッパで勢力をふるい、ノルマン人は8世紀以降に海から各地に進出しました。","m":"フン人の西進（375ごろ）→西ゴート移動→大移動開始"},{"id":228,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"ビザンツ様式","y":537,"q":"コンスタンティノープルのハギア＝ソフィア聖堂などに見られるビザンツ様式の建築の特徴として最も適当なものはどれですか。","c":["大きなドーム（円屋根）と、内部をかざるモザイク壁画","高くそびえる尖塔と尖頭アーチ、色ガラスのステンドグラス","半円アーチと厚い石の壁、小さな窓","列柱と三角形の破風をもつ神殿風の正面"],"e":"ビザンツ様式は、大きなドームとモザイク壁画を特色とし、6世紀に再建されたハギア＝ソフィア聖堂やイタリアのラヴェンナのサン＝ヴィターレ聖堂が代表例です。尖塔・尖頭アーチ・ステンドグラスはゴシック様式、半円アーチと厚い壁・小さな窓はロマネスク様式、列柱と三角破風は古代ギリシアの神殿建築の特徴です。","m":"ビザンツ様式＝ドーム＋モザイク"},{"id":229,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"東西教会の分裂","y":1054,"q":"1054年におこった出来事として最も適当なものはどれですか。","c":["ローマ教皇とコンスタンティノープル総主教がたがいに破門し、キリスト教会が東西に分裂した","ビザンツ皇帝が聖像の崇拝を禁じる命令を出し、ローマ教会との対立が始まった","教皇ウルバヌス2世がクレルモン宗教会議で十字軍の派遣を提唱した","フランク王国のカールがローマ教皇から西ローマ皇帝の冠を受けた"],"e":"1054年、ローマ教皇とコンスタンティノープル総主教が相互に破門し、ローマ＝カトリック教会とギリシア正教会の分裂が決定的になりました。聖像禁止令は726年、クレルモン宗教会議は1095年、カールの戴冠は800年の出来事です。年代の近い出来事を、8世紀・9世紀・11世紀と整理しておくとよいでしょう。","m":"1054年＝東西教会の分裂（相互破門）"},{"id":230,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"ウラディミル1世","y":988,"q":"10世紀末、ギリシア正教に改宗してこれを国教とし、ビザンツ文化を取り入れたキエフ公国の君主は誰ですか。","c":["ウラディミル1世","リューリク","イヴァン3世","イヴァン4世"],"e":"キエフ公国のウラディミル1世は、988年ごろビザンツ皇帝の妹と結婚してギリシア正教に改宗し、これを国教としました。これ以後、ロシアにはビザンツ文化が広まりました。リューリクは9世紀にノヴゴロド国を建てたとされるノルマン人の首長、イヴァン3世とイヴァン4世はモスクワ大公国の君主です。","m":"キエフ公国の正教改宗＝ウラディミル1世"},{"id":231,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"スラヴ人の宗教","y":900,"q":"スラヴ人の民族と、おもに受け入れたキリスト教の宗派の組み合わせとして正しいものはどれですか。","c":["セルビア人 ― ギリシア正教","ポーランド人 ― ギリシア正教","ロシア人 ― ローマ＝カトリック","クロアティア人 ― ギリシア正教"],"e":"ビザンツ帝国の影響を強く受けたロシア人やセルビア人はギリシア正教を受け入れました。一方、西ヨーロッパに近いポーランド人・チェック人・クロアティア人などはローマ＝カトリックを受け入れました。同じ南スラヴ人でも、セルビア人は正教、クロアティア人はカトリックと異なる点に注意しましょう。","m":"正教＝ロシア・セルビア／カトリック＝ポーランド・チェック・クロアティア"},{"id":232,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"イヴァン3世","y":1480,"q":"15世紀後半、キプチャク＝ハン国の支配から自立し、ビザンツ帝国最後の皇帝の姪と結婚して、ツァーリ（皇帝）の称号を用いはじめたモスクワ大公は誰ですか。","c":["イヴァン3世","イヴァン4世","ウラディミル1世","ピョートル1世"],"e":"イヴァン3世は1480年にキプチャク＝ハン国の支配から脱し、ビザンツ最後の皇帝の姪と結婚して、ビザンツ帝国の後継者としてツァーリの称号を用いました。イヴァン4世（雷帝）は16世紀に正式にツァーリとして戴冠し専制政治を進めた君主、ウラディミル1世は10世紀のキエフ公国の君主、ピョートル1世は18世紀初めに西欧化を進めた皇帝です。","m":"モンゴル自立・ビザンツ皇帝の姪と結婚＝イヴァン3世"},{"id":233,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"4〜5世紀のローマ帝国の順序","y":380,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア 西ゴート人がドナウ川を渡り、帝国領内に移住した。\nイ テオドシウス帝の死後、帝国が東西に分かれた。\nウ 都がコンスタンティノープルに移された。\nエ 西ゴート人がローマ市を略奪した。","c":["ウ→ア→イ→エ","ア→ウ→イ→エ","ウ→イ→ア→エ","ウ→ア→エ→イ"],"e":"ウのコンスタンティノープル遷都は330年、アの西ゴート人の移動は376年、イの帝国の東西分裂は395年、エの西ゴート人（アラリック）によるローマ略奪は410年です。ゲルマン人の大移動が始まったのち帝国が東西に分かれ、その後に西方でゲルマン人の侵入が深刻になった、という流れで押さえましょう。","m":"遷都330→西ゴート移動376→東西分裂395→ローマ略奪410"},{"id":234,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ヒジュラ","y":622,"q":"622年のヒジュラ（聖遷）の説明として最も適当なものはどれですか。","c":["ムハンマドが迫害を逃れてメッカからメディナへ移り、この年がのちにイスラーム暦の元年とされた","ムハンマドがメディナからメッカへ移り、カーバ神殿を中心に布教を始めた","ムハンマドがメッカを征服し、カーバ神殿の偶像を破壊した","ムハンマドの死後、信徒たちが後継者としてカリフを選んだ"],"e":"ムハンマドはメッカで唯一神アッラーの教えを説きましたが、大商人らに迫害され、622年にメディナへ移りました。これをヒジュラといい、この年がイスラーム暦の元年とされます。移住の方向は「メッカからメディナへ」です。メッカ征服とカーバ神殿の偶像破壊は630年、カリフの選出はムハンマドが死去した632年の出来事です。","m":"622ヒジュラ＝メッカ→メディナ、イスラーム暦元年"},{"id":235,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"アブー＝バクル","y":632,"q":"632年にムハンマドが死去したのち、信徒の合意によって初代カリフ（ムハンマドの後継者）に選ばれた人物は誰ですか。","c":["アブー＝バクル","ウマル","ウスマーン","アリー"],"e":"初代の正統カリフはムハンマドの古くからの信徒であったアブー＝バクルで、アラビア半島の統一を進めました。第2代ウマルの時代にシリア・エジプトの征服やササン朝への勝利が進み、第3代ウスマーンの時代にコーランが現在の形にまとめられました。第4代アリーはムハンマドのいとこで娘婿にあたり、シーア派から特に重んじられます。","m":"正統カリフ＝アブー＝バクル→ウマル→ウスマーン→アリー"},{"id":236,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ウマイヤ朝の支配体制","y":700,"q":"ウマイヤ朝の支配のしくみについて述べた文として最も適当なものはどれですか。","c":["征服地の非アラブ人は、イスラームに改宗してもジズヤ（人頭税）を課されることがあり、不満を強めた","ムスリムであれば民族を問わず平等とされ、改宗者はジズヤを免除された","シーア派を保護し、アリーの子孫をカリフとして迎えた","都をバグダードにおき、イラン人の官僚を多く用いた"],"e":"ウマイヤ朝はアラブ人が支配者層として特権をもつ体制で、イスラームに改宗した非アラブ人（マワーリー）もジズヤを課されることがあり、不満が高まりました。改宗者のジズヤ免除と、バグダードを都にイラン人官僚を重用したのはアッバース朝です。ウマイヤ朝はアリーの子孫をカリフとする立場のシーア派とは対立しました。","m":"ウマイヤ朝＝アラブ人の特権・改宗者にも課税"},{"id":237,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"アッバース朝の体制","y":786,"q":"アッバース朝について述べた文として正しくないものはどれですか。","c":["シリアのダマスクスを都とし、アラブ人の特権を維持した","ムスリムであれば、アラブ人以外もジズヤ（人頭税）を免除された","アラブ人であっても、征服地に土地をもてばハラージュ（地租）を納めることとなった","ハールーン＝アッラシードの時代に最盛期を迎えた"],"e":"750年に成立したアッバース朝は、都をバグダードにおき、アラブ人の特権を廃して、ムスリムの平等を原則としました。改宗者のジズヤは免除され、アラブ人も土地をもてばハラージュを納めました。8世紀末〜9世紀初めのハールーン＝アッラシードの時代が最盛期です。ダマスクスを都としアラブ人の特権を維持したのはウマイヤ朝なので、これが正しくない文です。","m":"アッバース朝＝ムスリム平等の「イスラーム帝国」"},{"id":238,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"トゥール・ポワティエ間の戦い","y":732,"q":"732年、イベリア半島からピレネー山脈を越えてフランク王国に侵入したウマイヤ朝の軍を、トゥール・ポワティエ間の戦いで破ったフランク王国の宮宰は誰ですか。","c":["カール＝マルテル","ピピン","カール大帝","クローヴィス"],"e":"メロヴィング朝の宮宰カール＝マルテルがウマイヤ朝の軍を撃退し、イスラーム勢力の西ヨーロッパへの進出を食い止めました。その子ピピンはカロリング朝を開き、孫のカール大帝は800年に西ローマ皇帝の冠を受けました。クローヴィスは5世紀末にフランク王国を統一し、アタナシウス派に改宗した国王です。","m":"732トゥール・ポワティエ間＝宮宰カール＝マルテル"},{"id":239,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"タラス河畔の戦い","y":751,"q":"751年、アッバース朝の軍が唐の軍を中央アジアで破った戦いで、このときの捕虜を通じて製紙法がイスラーム世界に伝わったといわれます。この戦いはどれですか。","c":["タラス河畔の戦い","ニハーヴァンドの戦い","アイン＝ジャールートの戦い","アンカラの戦い"],"e":"タラス河畔の戦いで唐軍が敗れ、捕虜となった紙すき職人からサマルカンドに製紙法が伝わり、やがてバグダードなどイスラーム世界に広まったとされます。ニハーヴァンドの戦いは642年にアラブ軍がササン朝を破った戦い、アイン＝ジャールートの戦いは1260年にマムルーク朝がモンゴル軍を破った戦い、アンカラの戦いは1402年にティムールがオスマン軍を破った戦いです。","m":"751タラス河畔→製紙法が西へ"},{"id":240,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ファーティマ朝","y":969,"q":"ファーティマ朝について述べた文として最も適当なものはどれですか。","c":["エジプトを征服して新都カイロを建設し、アズハル学院を設けた","スンナ派の王朝で、アッバース朝カリフからスルタンの称号を受けた","イベリア半島に建てられ、コルドバを都とした","第3回十字軍と戦い、イェルサレムを守り抜いた"],"e":"ファーティマ朝はシーア派（イスマーイール派）の王朝で、10世紀初めにチュニジアでおこり、君主はカリフを称しました。969年にエジプトを征服して新都カイロを建て、アズハル学院を設けました。スルタンの称号を受けたのはセルジューク朝、コルドバを都としたのは後ウマイヤ朝、第3回十字軍と戦ったのはアイユーブ朝のサラーフ＝アッディーンです。","m":"ファーティマ朝＝シーア派・カリフ称号・カイロ建設"},{"id":241,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"イクター制","y":946,"q":"ブワイフ朝が始め、セルジューク朝などに受け継がれた、軍人や官僚に俸給のかわりに一定の土地からの徴税権を与える制度を何といいますか。","c":["イクター制","ティマール制","プロノイア制","マンサブダール制"],"e":"イクター制はブワイフ朝で始まり、セルジューク朝で広く行われて、その後のイスラーム諸王朝の軍事制度の基本となりました。ティマール制はオスマン帝国の騎士に徴税権を与えた制度、プロノイア制はビザンツ帝国で貴族に土地の管理をまかせた制度、マンサブダール制はムガル帝国で官僚を位階で序列化した制度です。","m":"ブワイフ朝→セルジューク朝＝イクター制"},{"id":242,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"奴隷王朝","y":1206,"q":"1206年、ゴール朝の将軍で奴隷出身の人物が、デリーを都としてインド最初のイスラーム王朝を建てました。この人物は誰ですか。","c":["アイバク","バーブル","マフムード","アクバル"],"e":"アイバクがデリーに建てた王朝は、建国者が奴隷（マムルーク）出身であったことから奴隷王朝と呼ばれ、以後約300年続くデリー＝スルタン朝の最初の王朝です。バーブルは1526年にムガル帝国を建てた人物、マフムードは11世紀に北インドへの侵入をくり返したガズナ朝の君主、アクバルはムガル帝国の第3代皇帝です。","m":"1206奴隷王朝＝アイバク（デリー＝スルタン朝の始まり）"},{"id":243,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ムラービト朝","y":1076,"q":"11世紀、北アフリカのベルベル人がおこし、マラケシュを都として、西アフリカのガーナ王国を攻撃した王朝はどれですか。","c":["ムラービト朝","ムワッヒド朝","ナスル朝","ファーティマ朝"],"e":"ムラービト朝はベルベル人の王朝で、11世紀後半にガーナ王国を攻撃し、これを機に西アフリカのイスラーム化が進みました。イベリア半島にも進出しています。ムワッヒド朝は12世紀にムラービト朝を倒したベルベル人の王朝、ナスル朝はグラナダを都としたイベリア半島最後のイスラーム王朝、ファーティマ朝はチュニジアでおこりエジプトに移ったシーア派の王朝です。","m":"ガーナ王国を攻撃＝ムラービト朝（ベルベル人）"},{"id":244,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"マリ王国","y":1324,"q":"14世紀、大量の金を携えてメッカ巡礼を行ったことで知られる、西アフリカのマリ王国の王は誰ですか。","c":["マンサ＝ムーサ","ソンニ＝アリ","アイバク","ムハンマド＝アリー"],"e":"マリ王国はニジェール川流域で金の交易によって栄えたイスラーム国家で、マンサ＝ムーサ王のメッカ巡礼のさいには大量の金がカイロで使われ、金の相場が下がったと伝えられます。交易都市トンブクトゥも繁栄しました。ソンニ＝アリは15世紀にソンガイ王国を強大にした王、アイバクはインドの奴隷王朝の建国者、ムハンマド＝アリーは19世紀のエジプトの支配者です。","m":"メッカ巡礼で金を大量に使った王＝マンサ＝ムーサ"},{"id":245,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"イスラームの学者と著作","y":1377,"q":"イスラーム世界の学者と、その著作の組み合わせとして正しいものはどれですか。","c":["イブン＝ハルドゥーン ― 『世界史序説』","イブン＝シーナー ― 『三大陸周遊記』","イブン＝バットゥータ ― 『医学典範』","イブン＝ルシュド ― 『集史』"],"e":"14世紀の歴史家イブン＝ハルドゥーンは『世界史序説』で、都市と遊牧民の関係から王朝の興亡を論じました。『医学典範』はイブン＝シーナー、『三大陸周遊記』は旅行家イブン＝バットゥータ、『集史』はイル＝ハン国の宰相ラシード＝アッディーンの著作です。イブン＝ルシュドはアリストテレスの注釈で知られるコルドバ出身の哲学者です。","m":"世界史序説＝イブン＝ハルドゥーン、医学典範＝イブン＝シーナー"},{"id":246,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"スーフィズム","y":1100,"q":"形式的な儀礼や法の学問よりも、修行を通じて神との一体感を得ることを重んじたイスラームの神秘主義を何といいますか。","c":["スーフィズム","ワッハーブ派","イスマーイール派","スンナ派"],"e":"スーフィズムは修行によって神との合一をめざす神秘主義で、12世紀ごろから教団が組織され、民衆に広まり、イスラームが各地に広がる力にもなりました。ガザーリーはスーフィズムをスンナ派の神学に位置づけました。ワッハーブ派は18世紀にコーランへの回帰を説いた改革運動で、スーフィズムを批判しました。イスマーイール派はシーア派の一派、スンナ派はムスリムの多数派です。","m":"神との一体感を求める神秘主義＝スーフィズム"},{"id":247,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"シャリーアとウラマー","y":900,"q":"イスラーム社会について述べた次の文ⅰ・ⅱの正誤の組み合わせとして正しいものはどれですか。\nⅰ イスラーム法（シャリーア）は、コーランやムハンマドの言行（スンナ）にもとづいてまとめられた。\nⅱ イスラーム法を学んだ学者（ウラマー）は、ローマ教会のように教皇を頂点とする聖職者の組織をつくった。","c":["ⅰ 正　ⅱ 誤","ⅰ 正　ⅱ 正","ⅰ 誤　ⅱ 正","ⅰ 誤　ⅱ 誤"],"e":"シャリーアはコーランとムハンマドの言行（スンナ）などをもとに体系化され、信仰だけでなく結婚・相続・商業など生活全体を定めたので、ⅰは正しい文です。ウラマーは法や神学を学んだ知識人で、裁判官や教師などとして社会を支えましたが、教皇を頂点とするような聖職者の階層組織はイスラームにはないので、ⅱは誤りです。","m":"シャリーア＝コーラン＋スンナ、ウラマー＝学者（聖職者組織なし）"},{"id":248,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ガザン＝ハン","y":1295,"q":"13世紀末にイスラームに改宗してこれを国教とし、宰相ラシード＝アッディーンを登用して税制改革などを行ったイル＝ハン国の君主は誰ですか。","c":["ガザン＝ハン","フラグ","バトゥ","オゴタイ"],"e":"イル＝ハン国の第7代君主ガザン＝ハンはイスラームに改宗して国教とし、宰相ラシード＝アッディーンを用いて国家の立て直しをはかりました。ラシード＝アッディーンはペルシア語の歴史書『集史』も編纂しています。フラグはバグダードを攻略してアッバース朝を滅ぼし、イル＝ハン国を建てた人物、バトゥはキプチャク＝ハン国を建てた人物、オゴタイはモンゴル帝国の第2代皇帝です。","m":"イル＝ハン国のイスラーム化＝ガザン＝ハン"},{"id":249,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"アンカラの戦い","y":1402,"q":"1402年、ティムールがオスマン帝国のバヤジット1世を破って捕虜とした戦いはどれですか。","c":["アンカラの戦い","ニコポリスの戦い","モハーチの戦い","コソヴォの戦い"],"e":"サマルカンドを都に大帝国を築いたティムールは、アンカラの戦いでバヤジット1世を破り、オスマン帝国は一時崩壊の危機に陥りました。ニコポリスの戦い（1396年）はバヤジット1世がハンガリー王らのヨーロッパ連合軍を破った戦い、モハーチの戦い（1526年）はスレイマン1世がハンガリーを破った戦い、コソヴォの戦い（1389年）はオスマン軍がセルビアなどを破った戦いです。","m":"1402アンカラ＝ティムールがバヤジット1世を捕らえる"},{"id":250,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"イスラーム諸勢力の出来事の順序","y":1000,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア デリーに奴隷王朝が成立した。\nイ ブワイフ朝がバグダードに入城した。\nウ タラス河畔の戦いがおこった。\nエ イル＝ハン国のガザン＝ハンがイスラームに改宗した。","c":["ウ→イ→ア→エ","イ→ウ→ア→エ","ウ→ア→イ→エ","ウ→イ→エ→ア"],"e":"ウのタラス河畔の戦いは751年、イのブワイフ朝のバグダード入城は946年、アの奴隷王朝の成立は1206年、エのガザン＝ハンの改宗は1295年です。8世紀のアッバース朝の拡大、10世紀のイラン系軍事政権の台頭、13世紀のインドのイスラーム化とモンゴル勢力のイスラーム化、という流れで整理しましょう。","m":"751タラス→946ブワイフ→1206奴隷王朝→1295ガザン"},{"id":251,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"鄭和の南海遠征","y":1405,"q":"明の永楽帝の命を受けて大艦隊を率いて南海遠征を行い、その分遣隊がアフリカ東岸にまで達した人物は誰ですか。","c":["鄭和","王直","張騫","玄奘"],"e":"鄭和はイスラーム教徒の宦官で、1405年から永楽帝の命で計7回の南海遠征を行い、東南アジア・インド洋各地の国々に朝貢をうながしました。王直は16世紀の後期倭寇の頭目、張騫は前漢の武帝の命で大月氏に派遣された人物、玄奘は唐代にインドへ渡って仏典を持ち帰った僧です。","m":"永楽帝の大艦隊＝鄭和（アフリカ東岸まで）"},{"id":252,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"北虜南倭","y":1550,"q":"16世紀の明を苦しめた「北虜南倭」のうち、「北虜」にあたる勢力として最も適当なものはどれですか。","c":["アルタン＝ハーンが率いたモンゴル","倭寇と呼ばれた海上の密貿易集団","ヌルハチが統合した女真","ガルダン＝ハンのもとで強大になったジュンガル"],"e":"北虜南倭とは、北方のモンゴルと南方沿岸の倭寇が明を同時に脅かした状況を指します。モンゴルのアルタン＝ハーンは1550年に北京を包囲しました。倭寇は「南倭」にあたります。女真のヌルハチが後金を建てたのは1616年、ジュンガルが強大になったのは17世紀後半で、いずれも16世紀半ばの「北虜」ではありません。","m":"北虜＝モンゴル（アルタン）、南倭＝倭寇"},{"id":253,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"李自成の乱と明の滅亡","y":1644,"q":"1644年、農民反乱軍を率いて北京を攻め落とし、明を滅亡させた人物は誰ですか。","c":["李自成","呉三桂","黄巣","洪秀全"],"e":"明末には重税と飢饉で各地に反乱がおこり、李自成の軍が1644年に北京を占領して崇禎帝は自殺し、明は滅びました。山海関を守っていた明の武将呉三桂は清軍を導き入れ、清は李自成を追って北京に入りました。黄巣は唐末に黄巣の乱をおこした人物、洪秀全は19世紀に太平天国をおこした人物です。","m":"1644 李自成が明を滅ぼす→呉三桂が清を招く"},{"id":254,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"軍機処","y":1729,"q":"清の雍正帝がジュンガルとの戦いに備えて設け、のちに皇帝を補佐する政治の最高機関となった機関はどれですか。","c":["軍機処","理藩院","総理各国事務衙門","市舶司"],"e":"軍機処は雍正帝の時代に軍事上の機密を処理するために設けられ、やがて内閣にかわって政務の中心となりました。理藩院はモンゴル・チベット・新疆などの藩部を管理した役所です。総理各国事務衙門（総理衙門）はアロー戦争後の1861年に設けられた外交担当の役所、市舶司は唐代以降に海上貿易を管理した役所です。","m":"雍正帝＝軍機処（＋地丁銀・典礼問題）"},{"id":255,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"マテオ＝リッチ","y":1602,"q":"明代末期に中国に来て布教を行い、世界地図「坤輿万国全図」を作製したイエズス会宣教師は誰ですか。","c":["マテオ＝リッチ","アダム＝シャール","カスティリオーネ","フランシスコ＝ザビエル"],"e":"マテオ＝リッチは16世紀末に中国に入り、中国の習慣を尊重しながら布教し、「坤輿万国全図」を作ったほか、徐光啓とともにエウクレイデスの幾何学を『幾何原本』として漢訳しました。アダム＝シャールは明末清初に暦の改訂にたずさわった宣教師、カスティリオーネは清で円明園の設計に加わった宣教師、ザビエルは日本に布教した人物です。","m":"坤輿万国全図＝マテオ＝リッチ（明末）"},{"id":256,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"キリスト教布教の全面禁止","y":1724,"q":"中国の伝統的な儀礼を信者に認めるかどうかをめぐる典礼問題をきっかけに、1724年にキリスト教の布教を全面的に禁止した清の皇帝は誰ですか。","c":["雍正帝","康熙帝","乾隆帝","順治帝"],"e":"イエズス会は孔子の崇拝や祖先の祭祀を信者に認めて布教しましたが、ほかの会派がこれを批判して典礼問題がおこりました。ローマ教皇がイエズス会の方式を否定したため、康熙帝はイエズス会以外の布教を禁じ、続く雍正帝が1724年に布教を全面的に禁止しました。乾隆帝は雍正帝の次、順治帝は康熙帝の前の皇帝です。","m":"康熙＝イエズス会以外を禁止→雍正＝全面禁止"},{"id":257,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"公行と広州一港制限","y":1757,"q":"清の乾隆帝が1757年にヨーロッパ船の来航を広州一港に限ったとき、外国との貿易を独占的に取り扱った特許商人の組合を何といいますか。","c":["公行","会館","市舶司","東インド会社"],"e":"乾隆帝はヨーロッパ船の来航を広州だけに限り、公行と呼ばれる特許商人の組合に貿易を独占させました。会館は同郷・同業の商人が各地の都市に設けた互助のための施設です。市舶司は唐代以降に海上貿易を管理した役所で、商人の組合ではありません。東インド会社はイギリスなどヨーロッパ側の貿易会社です。","m":"1757 広州一港＋公行の独占"},{"id":258,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"マカートニーの派遣","y":1793,"q":"18世紀末、貿易の制限の撤廃や自由貿易を求めてイギリスから清に派遣され、乾隆帝に謁見したものの要求を拒否された使節は誰ですか。","c":["マカートニー","アマースト","エリオット","パークス"],"e":"イギリスは広州一港での制限貿易の改善を求め、1793年にマカートニーを乾隆帝のもとに派遣しましたが要求は拒否されました。1816年には嘉慶帝のもとにアマーストを送りましたが、儀礼をめぐって対立し皇帝に会えませんでした。エリオットはアヘン戦争のころのイギリス側の貿易監督官、パークスは幕末の日本に駐在したイギリス公使です。","m":"乾隆帝にマカートニー（1793）、嘉慶帝にアマースト"},{"id":259,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"アクバルの宗教融和策","y":1564,"q":"ムガル帝国で、非ムスリムに課していた人頭税（ジズヤ）を廃止し、ヒンドゥー教徒との融和を図った皇帝は誰ですか。","c":["アクバル","アウラングゼーブ","バーブル","シャー＝ジャハーン"],"e":"第3代のアクバルは都をアグラに移し、ジズヤを廃止してヒンドゥー教徒の協力を得るなど、帝国の支配を固めました。アウラングゼーブは厳格なスンナ派の立場からジズヤを復活させ、ヒンドゥー教徒などの反発を招きました。バーブルは1526年のパーニーパットの戦いに勝って帝国を建てた初代、シャー＝ジャハーンはタージ＝マハルを建てた皇帝です。","m":"アクバル＝ジズヤ廃止、アウラングゼーブ＝復活"},{"id":260,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"プラッシーの戦い","y":1757,"q":"1757年、クライヴの率いるイギリス東インド会社の軍が、フランスと結んだベンガル太守の軍を破った戦いはどれですか。","c":["プラッシーの戦い","マイソール戦争","マラーター戦争","シク戦争"],"e":"プラッシーの戦いの勝利によってイギリスはフランスの勢力をインドから後退させ、1765年にはベンガルなどの徴税権（ディーワーニー）を得て、領土の支配へと進みました。マイソール戦争は南インドのマイソール王国との戦争、マラーター戦争はデカン高原のマラーター同盟との戦争、シク戦争は西北部パンジャーブのシク王国との戦争です。","m":"1757 プラッシー＝英がベンガルで仏を圧倒"},{"id":261,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ジャワの強制栽培制度","y":1830,"q":"19世紀前半、オランダがジャワで住民にコーヒー・サトウキビ・藍などの商品作物を栽培させ、安い価格で買い上げた制度を何といいますか。","c":["強制栽培制度（政府栽培制度）","ザミンダーリー制","ライヤットワーリー制","アシエンダ制"],"e":"ジャワ戦争などで財政が苦しくなったオランダは、1830年ごろから総督ファン＝デン＝ボスのもとで強制栽培制度を始め、大きな利益をあげる一方で住民を飢饉に苦しめました。ザミンダーリー制とライヤットワーリー制は、イギリスがインドで行った地税徴収の制度です。アシエンダ制はスペイン領ラテンアメリカで広がった大農園制です。","m":"オランダ領ジャワ＝強制栽培制度（1830〜）"},{"id":262,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"イギリス産業革命の技術革新","y":1780,"q":"イギリスの産業革命期の技術革新ア〜エを古い順に並べたものとして正しいものはどれですか。\nア ジョン＝ケイが飛び杼を発明した。\nイ カートライトが力織機を発明した。\nウ アークライトが水力紡績機を発明した。\nエ スティーヴンソンの蒸気機関車が実用化された。","c":["ア→ウ→イ→エ","ウ→ア→イ→エ","ア→イ→ウ→エ","ウ→イ→ア→エ"],"e":"飛び杼（1733年）で織布の速度が上がると糸が足りなくなり、ハーグリーヴズの多軸紡績機やアークライトの水力紡績機（1769年）など紡績の機械が生まれました。今度は糸が余るようになり、カートライトが力織機（1785年）を発明しました。スティーヴンソンの蒸気機関車は1825年に実用化され、1830年にはリヴァプール・マンチェスター間に鉄道が開通しました。","m":"飛び杼→紡績機→力織機→蒸気機関車"},{"id":263,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"フランス革命の経過","y":1791,"q":"フランス革命の出来事ア〜エを古い順に並べたものとして正しいものはどれですか。\nア 国王一家が国外に逃げようとして、ヴァレンヌで連れ戻された。\nイ テルミドールの反動でロベスピエールが処刑された。\nウ 第三身分の議員らが憲法制定まで解散しないことを誓った。\nエ 国民公会が王政の廃止と共和政の樹立を宣言した。","c":["ウ→ア→エ→イ","ウ→エ→ア→イ","ア→ウ→エ→イ","ウ→ア→イ→エ"],"e":"1789年6月、第三身分の議員らが国民議会を名のり、球戯場（テニスコート）の誓いを行いました。1791年6月にはヴァレンヌ逃亡事件で国王への信頼が失われ、1792年9月に国民公会が王政を廃止して第一共和政が始まりました。ジャコバン派の恐怖政治は1794年7月のテルミドールの反動で終わり、ロベスピエールは処刑されました。","m":"球戯場の誓い→ヴァレンヌ→共和政→テルミドール"},{"id":264,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"国民議会の改革","y":1789,"q":"フランス革命の初期に、国民議会が1789年に行ったこととして正しいものはどれですか。","c":["封建的特権の廃止を決め、続いて人権宣言を採択した","最高価格令を出して物価を統制した","革命暦を定め、キリスト教の否定を進めた","5人の総裁からなる総裁政府を発足させた"],"e":"国民議会は1789年8月、封建的特権の廃止を決議し、ラ＝ファイエットらが起草した人権宣言を採択して、自由・平等や国民主権、私有財産の不可侵をうたいました。最高価格令や革命暦の制定は、1793年以降の国民公会のもとでジャコバン派が行った政策です。総裁政府は1795年憲法にもとづいて成立した政府で、国民議会のしたことではありません。","m":"1789.8 国民議会＝封建的特権廃止＋人権宣言"},{"id":265,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"大陸封鎖令","y":1806,"q":"1806年、ナポレオンがベルリンで発した大陸封鎖令のねらいとして最も適当なものはどれですか。","c":["ヨーロッパ大陸諸国とイギリスとの通商を禁じ、イギリスに経済的な打撃を与えること","ロシアの南下を防ぐため、黒海から地中海への出口を閉ざすこと","オーストリアの勢力を排除するため、ドイツ諸邦との貿易を禁じること","アメリカ合衆国との貿易を独占するため、大西洋の港を封鎖すること"],"e":"トラファルガーの海戦でイギリス上陸をあきらめたナポレオンは、大陸封鎖令によってヨーロッパ大陸とイギリスの通商を禁じ、イギリスを経済的に追いつめようとしました。しかし穀物をイギリスに輸出できなくなったロシアがこれを守らなかったため、ナポレオンは1812年にロシア遠征を行い、大敗しました。ロシアの南下阻止、オーストリアの排除、対米貿易の独占はいずれも大陸封鎖令の目的ではありません。","m":"大陸封鎖令→ロシアが破る→1812ロシア遠征"},{"id":266,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ウィーン会議の原則","y":1815,"q":"ウィーン会議でフランス代表タレーランが唱え、フランス革命前の王朝と領土を正しいものとして復活させようとした原則を何といいますか。","c":["正統主義","民族自決","門戸開放","栄光ある孤立"],"e":"ウィーン会議はオーストリアのメッテルニヒが主導し、タレーランの唱えた正統主義と大国間の勢力均衡を柱にウィーン体制がつくられました。民族自決は第一次世界大戦末期にウィルソンの十四か条などで掲げられた原則、門戸開放は19世紀末にアメリカのジョン＝ヘイが中国について唱えた原則、栄光ある孤立は19世紀後半のイギリスの外交方針です。","m":"タレーラン＝正統主義（ウィーン体制）"},{"id":267,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"フランス二月革命","y":1848,"q":"1848年、パリで選挙権の拡大を求める民衆が蜂起した二月革命によって退位し、亡命した国王は誰ですか。","c":["ルイ＝フィリップ","シャルル10世","ルイ18世","ナポレオン3世"],"e":"七月革命（1830年）で即位したルイ＝フィリップの七月王政は、有力な銀行家など一部の富裕層だけが選挙権をもつ体制でした。1848年の二月革命で王政は倒れ、第二共和政が成立しました。シャルル10世は七月革命で倒された国王、ルイ18世はナポレオン没落後の復古王政の国王、ナポレオン3世は1852年に第二帝政を始めた皇帝です。","m":"七月革命→ルイ＝フィリップ→二月革命で退位"},{"id":268,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"クリミア戦争の結果","y":1854,"q":"クリミア戦争の講和条約である1856年のパリ条約の内容、またはその結果として最も適当なものはどれですか。","c":["黒海の中立化が決められ、ロシアの南下政策はいったん阻まれた","ロシアの保護下に大ブルガリアをつくることが認められた","イギリスがキプロス島の行政権を手に入れた","ロシアが清からイリ地方の一部と通商上の権利を得た"],"e":"クリミア戦争ではオスマン帝国をイギリス・フランス・サルデーニャが支援してロシアと戦い、ロシアは敗れました。パリ条約で黒海の中立化が決まり、南下は一時阻止されました。大ブルガリアの創設は1878年のサン＝ステファノ条約、キプロス島の行政権はベルリン会議（1878年）でイギリスが得たもの、イリ地方はイリ条約（1881年）にかかわる地域です。","m":"クリミア戦争→1856パリ条約＝黒海中立化"},{"id":269,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ロシアの農奴解放令","y":1861,"q":"クリミア戦争の敗北で国の遅れを痛感し、1861年に農奴解放令を出したロシア皇帝は誰ですか。","c":["アレクサンドル2世","ニコライ1世","ピョートル1世","エカチェリーナ2世"],"e":"アレクサンドル2世は農奴解放令によって農奴に人格的な自由を与えましたが、土地の取得は有償だったため、多くの農民は貧しいままでした。ニコライ1世はクリミア戦争を始めた皇帝で、戦争中に死去しました。ピョートル1世は18世紀初めに西欧化を進めペテルブルクを建設した皇帝、エカチェリーナ2世は18世紀後半の啓蒙専制君主です。","m":"農奴解放令（1861）＝アレクサンドル2世"},{"id":270,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ベルリン会議","y":1878,"q":"1878年にビスマルクが「誠実な仲買人」として開いたベルリン会議について述べた次の文ⅰ・ⅱの正誤の組み合わせとして正しいものはどれですか。\nⅰ セルビア・モンテネグロ・ルーマニアの独立が認められた。\nⅱ オーストリアがボスニア・ヘルツェゴヴィナを併合することが認められた。","c":["ⅰ 正　ⅱ 誤","ⅰ 正　ⅱ 正","ⅰ 誤　ⅱ 正","ⅰ 誤　ⅱ 誤"],"e":"ロシア＝トルコ戦争後のサン＝ステファノ条約に英墺が反発したため、ベルリン会議が開かれました。セルビア・モンテネグロ・ルーマニアの独立は承認されたのでⅰは正しい文です。オーストリアが認められたのはボスニア・ヘルツェゴヴィナの行政権（管理権）で、併合したのは青年トルコ革命の混乱に乗じた1908年なので、ⅱは誤りです。","m":"1878 行政権→1908 併合（ボスニア）"},{"id":271,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"モンロー宣言","y":1823,"q":"1823年にアメリカ合衆国大統領モンローが発表した宣言の内容として最も適当なものはどれですか。","c":["ヨーロッパとアメリカ大陸の相互不干渉を唱えた","中国の門戸開放・機会均等・領土保全を唱えた","西部の準州が奴隷州になるかどうかを住民の判断にゆだねた","南部連合に加わった州の奴隷を解放すると宣言した"],"e":"モンロー宣言は、ラテンアメリカ諸国の独立に対してヨーロッパ諸国が干渉することに反対し、あわせてアメリカもヨーロッパに干渉しないという相互不干渉を示したもので、のちのアメリカ外交の基本となりました。門戸開放は1899年以降のジョン＝ヘイの通牒、住民の判断にゆだねたのは1854年のカンザス・ネブラスカ法、奴隷の解放は1863年のリンカンの奴隷解放宣言です。","m":"1823 モンロー宣言＝欧米の相互不干渉"},{"id":272,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"南北戦争の経過","y":1863,"q":"アメリカの南北戦争について述べた文として正しいものはどれですか。","c":["リンカンが戦争中に奴隷解放宣言を発し、内外の世論を北部支持へと導いた","南部は保護関税政策を求め、北部は自由貿易を主張した","ゲティスバーグの戦いで南軍が勝利し、戦争の流れが決まった","南部連合の大統領には、南軍の司令官リーが就任した"],"e":"1861年、奴隷制の拡大に反対する共和党のリンカンが大統領になると南部諸州は南部連合（アメリカ連合国）をつくり、南北戦争が始まりました。リンカンは1863年に奴隷解放宣言を出し、同年のゲティスバーグの戦いで北軍が勝利して優位に立ちました。保護関税を求めたのは工業の北部で、南部は綿花輸出のため自由貿易を求めました。南部連合の大統領はジェファソン＝デヴィスです。","m":"1863 奴隷解放宣言＋ゲティスバーグ（北軍勝利）"},{"id":273,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"戊戌の変法","y":1898,"q":"日清戦争の敗北後、光緒帝に登用されて立憲君主制をめざす改革（変法）を進めたものの、西太后ら保守派の政変で失敗した人物は誰ですか。","c":["康有為","李鴻章","袁世凱","孫文"],"e":"康有為は梁啓超らとともに、日本の明治維新にならって議会政治をとり入れる改革を進めましたが、1898年に西太后らの戊戌の政変で光緒帝は幽閉され、改革は約100日で終わりました。李鴻章は洋務運動を進めた官僚、袁世凱は新軍を率いてのちに中華民国の大総統となった人物、孫文は清を倒す革命を唱えた人物です。","m":"変法＝康有為・光緒帝→戊戌の政変（西太后）"},{"id":274,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"北京議定書","y":1901,"q":"「扶清滅洋」を唱えた義和団の蜂起ののち、1901年に清が列国と結んだ北京議定書（辛丑和約）の内容として最も適当なものはどれですか。","c":["巨額の賠償金の支払いと、北京などへの外国軍隊の駐兵を認めた","香港島をイギリスに割譲した","外国公使が北京に常駐することを初めて認めた","九竜半島の南部をイギリスに割譲した"],"e":"義和団が北京の公使館地域を包囲すると、日本とロシアを中心とする8か国が共同出兵して鎮圧し、清は北京議定書で巨額の賠償金と北京・天津などへの外国軍隊の駐兵を認めました。香港島の割譲は南京条約（1842年）、外国公使の北京常駐はアロー戦争の際の天津条約・北京条約、九竜半島南部の割譲は北京条約（1860年）の内容です。","m":"義和団→北京議定書＝賠償金＋外国軍の駐兵"},{"id":275,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"辛亥革命","y":1911,"q":"辛亥革命について述べた文として正しいものはどれですか。","c":["武昌での新軍の蜂起をきっかけに多くの省が独立を宣言し、翌年南京で中華民国が成立した","鉄道の国有化に賛成する民衆の運動が、革命の直接のきっかけとなった","孫文が北京で中華民国の初代正式大総統に就任した","光緒帝が退位して、清は滅亡した"],"e":"1911年、清が幹線鉄道の国有化を打ち出すと四川などで反対運動がおこり、10月に武昌で新軍が蜂起して辛亥革命が始まりました。1912年1月に南京で中華民国が成立し、孫文が臨時大総統となりました。その後、袁世凱が宣統帝（溥儀）を退位させて清は滅び、袁世凱が臨時大総統をついで、のち正式な大総統になりました。光緒帝は1908年に亡くなっています。","m":"武昌蜂起→南京で中華民国（臨時大総統孫文）"},{"id":276,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"世界恐慌期のイギリス","y":1931,"q":"世界恐慌期のイギリスについて述べた文として正しいものはどれですか。","c":["マクドナルドの挙国一致内閣が金本位制を停止した","ブルムを首相とする人民戦線内閣が成立した","全国産業復興法（NIRA）を制定して企業の生産を調整した","四か年計画を立てて軍需産業を中心に経済を立て直した"],"e":"1931年、労働党を除名されたマクドナルドは保守党などの協力を得て挙国一致内閣をつくり、失業保険の削減などで財政を引き締めるとともに金本位制を停止しました。人民戦線内閣はフランス（1936年）、全国産業復興法はアメリカのニューディールの政策、四か年計画はナチス＝ドイツが1936年に始めた経済計画です。","m":"1931 英＝マクドナルド挙国一致内閣・金本位制停止"},{"id":277,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"善隣外交","y":1933,"q":"フランクリン＝ローズヴェルト政権がラテンアメリカ諸国に対してとった、内政干渉をひかえて関係改善を図る外交政策を何といいますか。","c":["善隣外交","棍棒外交","ドル外交","宣教師外交"],"e":"ローズヴェルトは善隣外交をとり、1934年にはキューバの独立を制限していたプラット条項を廃止しました。ラテンアメリカとの関係改善は、恐慌下でのアメリカの市場確保にもつながりました。棍棒外交はセオドア＝ローズヴェルト、ドル外交はタフト、宣教師外交はウィルソンの政策で、いずれも20世紀初めのカリブ海・中南米への積極的な介入を表す言葉です。","m":"F.ローズヴェルト＝善隣外交（プラット条項廃止）"},{"id":278,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"フランスの人民戦線内閣","y":1936,"q":"1936年にフランスで成立した、反ファシズムをかかげる人民戦線内閣の首相は誰ですか。","c":["ブルム","ド＝ゴール","クレマンソー","ポワンカレ"],"e":"1935年のコミンテルン第7回大会は、ファシズムに対抗するため社会主義者や自由主義者とも手を結ぶ人民戦線戦術を打ち出しました。フランスでは1936年に社会党のブルムを首相とする人民戦線内閣が成立しました。ド＝ゴールは第二次世界大戦中に自由フランスを率いた軍人、クレマンソーは第一次世界大戦末期からパリ講和会議の首相、ポワンカレは1923年のルール占領を行った首相です。","m":"1936 仏人民戦線内閣＝ブルム"},{"id":279,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"スペイン内戦","y":1936,"q":"1936年に始まったスペイン内戦について述べた文として正しいものはどれですか。","c":["フランコの反乱軍をドイツとイタリアが支援し、イギリスとフランスは不干渉政策をとった","ソ連がフランコの反乱軍に武器を送り、人民戦線政府と戦わせた","アメリカが人民戦線政府を支援するため、正規の軍隊を送った","人民戦線政府が反乱軍に勝利し、共和政が守られた"],"e":"スペインで人民戦線政府が成立すると、フランコ将軍が反乱をおこしました。ドイツ・イタリアは反乱軍を支援し、ドイツ空軍のゲルニカ爆撃はピカソの作品で知られます。政府側はソ連の支援や各国の義勇兵（国際旅団）の参加を得ましたが、英仏は不干渉政策をとり、アメリカも中立を守りました。1939年に反乱軍が勝利し、フランコの独裁体制ができました。","m":"スペイン内戦＝独伊がフランコ支援、英仏は不干渉"},{"id":280,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ミュンヘン会談","y":1938,"q":"1938年のミュンヘン会談で、ドイツへの割譲が認められたチェコスロヴァキアの地域はどこですか。","c":["ズデーテン地方","ラインラント","ザール地方","ダンツィヒ"],"e":"ヒトラーはドイツ系住民が多いことを理由にズデーテン地方の割譲を要求し、イギリスのネヴィル＝チェンバレン、フランスのダラディエ、イタリアのムッソリーニ、ヒトラーによるミュンヘン会談でこれが認められました。英仏の宥和政策の典型とされます。ラインラントは1936年にドイツ軍が進駐した地域、ザール地方は1935年の住民投票でドイツに復帰した地域、ダンツィヒは1939年にドイツが返還を要求した都市です。","m":"ミュンヘン会談＝ズデーテン割譲（宥和政策）"},{"id":281,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"独ソ不可侵条約","y":1939,"q":"1939年8月、ドイツがポーランド侵攻の直前にソ連と結び、世界に大きな衝撃を与えた条約はどれですか。","c":["独ソ不可侵条約","日独伊三国同盟","日独防共協定","ロカルノ条約"],"e":"それまで激しく対立していたドイツとソ連が独ソ不可侵条約を結び、秘密議定書で東ヨーロッパでの勢力範囲を分けました。9月1日にドイツがポーランドに侵攻すると英仏がドイツに宣戦し、第二次世界大戦が始まりました。日独伊三国同盟は1940年、日独防共協定は1936年に結ばれました。ロカルノ条約は1925年に西欧の国境の現状維持などを定めた条約です。","m":"1939.8 独ソ不可侵→9.1 ポーランド侵攻"},{"id":282,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"大西洋憲章","y":1941,"q":"1941年に発表された大西洋憲章について述べた文として正しいものはどれですか。","c":["ローズヴェルトとチャーチルが会談して、戦後の平和構想の原則を示した","スターリンも加わった会談で、ソ連の対日参戦が約束された","日本に対して無条件降伏を求める内容であった","日本が奪った満洲・台湾を中国に返すことを定めた"],"e":"1941年8月、アメリカのフランクリン＝ローズヴェルトとイギリスのチャーチルは大西洋上で会談し、領土不拡大や民族自決、安全保障の仕組みづくりなどの原則を大西洋憲章として発表しました。これがのちの国際連合の理念につながります。ソ連の対日参戦はヤルタ会談（1945年）、無条件降伏の要求はポツダム宣言（1945年）、満洲・台湾の返還はカイロ宣言（1943年）の内容です。","m":"大西洋憲章（1941）＝米英首脳・戦後の原則"},{"id":283,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"第二次世界大戦の経過","y":1942,"q":"第二次世界大戦中のヨーロッパの出来事ア〜エを古い順に並べたものとして正しいものはどれですか。\nア ドイツがソ連に侵攻し、独ソ戦が始まった。\nイ スターリングラードでドイツ軍が降伏した。\nウ 連合軍がノルマンディーに上陸した。\nエ ドイツ軍がパリを占領し、フランスが降伏した。","c":["エ→ア→イ→ウ","ア→エ→イ→ウ","エ→ア→ウ→イ","ア→イ→エ→ウ"],"e":"ドイツは1940年6月にパリを占領してフランスを降伏させ、フランス南部にはペタンのヴィシー政府ができました。1941年6月には独ソ不可侵条約を破ってソ連に侵攻しましたが、1943年2月にスターリングラードで降伏し、戦局が転換しました。1944年6月に連合軍がノルマンディーに上陸し、8月にパリが解放されました。","m":"パリ占領40→独ソ戦41→スターリングラード43→ノルマンディー44"},{"id":284,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"国際連合の特色","y":1945,"q":"国際連合について述べた文として正しいものはどれですか。","c":["安全保障理事会の常任理事国5か国には拒否権が認められた","アメリカは上院の反対で加盟しなかった","本部をスイスのジュネーヴに置いた","総会の議決は全会一致を原則とした"],"e":"国際連合はサンフランシスコ会議で国際連合憲章が採択され、1945年10月に発足しました。本部はニューヨークに置かれ、総会は多数決を原則とし、安全保障理事会では米・英・仏・ソ・中の常任理事国が拒否権をもちます。アメリカの不参加、ジュネーヴの本部、総会の全会一致は、いずれも第一次世界大戦後の国際連盟の特色です。","m":"国連＝NY・多数決・拒否権／連盟＝ジュネーヴ・全会一致"},{"id":285,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ブレトン＝ウッズ会議","y":1944,"q":"1944年にアメリカで開かれたブレトン＝ウッズ会議で、国際復興開発銀行（IBRD）とともに設立が決められた機関はどれですか。","c":["国際通貨基金（IMF）","関税と貿易に関する一般協定（GATT）","経済協力開発機構（OECD）","世界貿易機関（WTO）"],"e":"ブレトン＝ウッズ会議では、為替の安定をめざす国際通貨基金（IMF）と、戦後の復興を助ける国際復興開発銀行（IBRD）の設立が決まり、ドルを金と結びつけて基軸通貨とする固定相場制がつくられました。GATTは1947年に結ばれた貿易自由化のための協定、OECDは1961年に発足した先進国中心の機関、WTOはGATTを引きついで1995年に発足した機関です。","m":"ブレトン＝ウッズ＝IMF＋IBRD（ドル基軸）"},{"id":286,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"トルーマン＝ドクトリン","y":1947,"q":"1947年にトルーマン大統領が共産主義勢力の拡大を防ぐ「封じ込め政策」を打ち出したとき、軍事・経済援助の対象として示した国の組み合わせはどれですか。","c":["ギリシアとトルコ","ポーランドとチェコスロヴァキア","イランとイラク","西ドイツとオーストリア"],"e":"イギリスがギリシアやトルコへの援助を続けられなくなったため、トルーマンは両国への援助を議会に求め、共産主義の拡大を食い止める姿勢を示しました（トルーマン＝ドクトリン）。同じ年にはヨーロッパの経済復興を援助するマーシャル＝プランも発表されました。ポーランドとチェコスロヴァキアはソ連の影響下に入った国、イラン・イラクや西ドイツ・オーストリアはこの宣言の援助対象ではありません。","m":"トルーマン＝ドクトリン（1947）＝ギリシア・トルコ援助"},{"id":287,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"コメコン","y":1949,"q":"マーシャル＝プランに対抗して、1949年にソ連と東ヨーロッパ諸国が結成した経済協力の組織はどれですか。","c":["経済相互援助会議（コメコン）","共産党情報局（コミンフォルム）","ワルシャワ条約機構","独立国家共同体（CIS）"],"e":"コメコンはソ連を中心とする社会主義国の経済協力機構で、1991年に解散しました。コミンフォルムは1947年に各国共産党の連絡・情報交換のためにつくられた組織、ワルシャワ条約機構は1955年に西ドイツのNATO加盟に対抗して結成された軍事同盟、CISは1991年のソ連解体後に旧ソ連の共和国の多くがつくった共同体です。","m":"マーシャル＝プラン⇔コメコン（1949）"},{"id":288,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"中華人民共和国の成立","y":1949,"q":"1949年の中華人民共和国の成立について述べた文として正しいものはどれですか。","c":["毛沢東を主席、周恩来を首相として北京で成立が宣言された","敗れた蔣介石の国民党政府は朝鮮半島に逃れた","アメリカがただちに新政府を承認し、国交を結んだ","成立と同時に国際連合の中国代表権を得た"],"e":"国共内戦に勝った共産党は1949年10月、毛沢東を主席、周恩来を首相として中華人民共和国の成立を宣言し、翌年ソ連と中ソ友好同盟相互援助条約を結びました。蔣介石の国民党政府は台湾に逃れました。イギリスは1950年に新政府を承認しましたが、アメリカとの国交は1979年まで結ばれず、国連の代表権も1971年に台湾の中華民国から移されました。","m":"1949 中華人民共和国（毛沢東・周恩来）、国民党は台湾へ"},{"id":289,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"スターリン批判とハンガリー","y":1956,"q":"1956年のフルシチョフによるスターリン批判の影響を受けて同年におこり、ソ連軍によって鎮圧された東ヨーロッパの事件はどれですか。","c":["ハンガリー反ソ暴動（ハンガリー事件）","プラハの春","ベルリン封鎖","自主管理労組「連帯」の結成"],"e":"フルシチョフはソ連共産党第20回大会でスターリンの個人崇拝や粛清を批判し、平和共存を打ち出しました。これを受けてポーランドのポズナニで暴動がおこり、ハンガリーではナジ＝イムレ政権がワルシャワ条約機構からの離脱を表明しましたが、ソ連軍に鎮圧されました。プラハの春は1968年、ベルリン封鎖は1948年、「連帯」の結成は1980年のポーランドの出来事です。","m":"1956 スターリン批判→ハンガリー事件（ソ連軍鎮圧）"},{"id":290,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ジュネーヴ休戦協定","y":1954,"q":"1954年のジュネーヴ休戦協定で、インドシナ戦争の休戦にあたってベトナムに設けられた暫定的な軍事境界線はどれですか。","c":["北緯17度線","北緯38度線","北緯30度線","北緯49度線"],"e":"ディエンビエンフーの戦いでフランス軍が敗れると、ジュネーヴ休戦協定が結ばれ、北緯17度線を境界として、2年後に統一選挙を行うことが決められました。しかしアメリカは協定に調印せず、南部にゴ＝ディン＝ジエムのベトナム共和国を支援しました。北緯38度線は朝鮮半島の分断線、北緯49度線はアメリカ・カナダ国境の多くの部分にあたる線です。","m":"ベトナム＝17度線、朝鮮＝38度線"},{"id":291,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ベトナム戦争の推移","y":1965,"q":"ベトナム戦争について述べた次の文ⅰ・ⅱの正誤の組み合わせとして正しいものはどれですか。\nⅰ アイゼンハワー政権が、トンキン湾事件を口実に北ベトナムへの爆撃（北爆）を始めた。\nⅱ パリ和平協定でアメリカ軍が撤退したのち、1975年にサイゴンが陥落した。","c":["ⅰ 誤　ⅱ 正","ⅰ 正　ⅱ 正","ⅰ 正　ⅱ 誤","ⅰ 誤　ⅱ 誤"],"e":"1964年のトンキン湾事件を口実に、ジョンソン政権が1965年から北爆を始め、地上軍を大規模に送りこんだので、ⅰは政権が誤りです。戦争は長期化し、世界で反戦運動が広がりました。ニクソン政権は1973年にパリ和平協定を結んでアメリカ軍を撤退させ、1975年にサイゴンが陥落し、翌年ベトナム社会主義共和国が成立したので、ⅱは正しい文です。","m":"北爆＝ジョンソン（1965）→1973撤退→1975サイゴン陥落"},{"id":292,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"部分的核実験禁止条約","y":1963,"q":"キューバ危機の翌年の1963年に、アメリカ・イギリス・ソ連が調印し、地下を除く大気圏内・宇宙空間・水中での核実験を禁止した条約はどれですか。","c":["部分的核実験禁止条約","核拡散防止条約（NPT）","第1次戦略兵器制限交渉（SALTⅠ）の協定","中距離核戦力（INF）全廃条約"],"e":"キューバ危機で核戦争の危険を経験した米ソは、ホットライン（直通電話）を設け、1963年にイギリスとともに部分的核実験禁止条約を結びました。核保有をめざしていたフランスと中国は参加しませんでした。核拡散防止条約は1968年、SALTⅠの協定は1972年、INF全廃条約はレーガンとゴルバチョフが1987年に調印したものです。","m":"1963 部分的核実験禁止（地下は除く）"},{"id":293,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ニクソン訪中","y":1972,"q":"1972年、アメリカの大統領として初めて中華人民共和国を訪問し、米中関係の転換をもたらしたのは誰ですか。","c":["ニクソン","ケネディ","カーター","レーガン"],"e":"ベトナム戦争からの撤退をめざしていたニクソン大統領は、中ソ対立を背景に中国に接近し、1971年の訪中予告ののち1972年に北京を訪れました。1971年には国連の中国代表権が台湾から中華人民共和国に移されています。正式な国交樹立はカーター政権期の1979年です。ケネディはキューバ危機のときの大統領、レーガンは1980年代の大統領です。","m":"1972 ニクソン訪中→1979 国交（カーター）"},{"id":294,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ドル＝ショック","y":1971,"q":"1971年、ニクソン大統領が発表して「ドル＝ショック」と呼ばれた政策の内容として最も適当なものはどれですか。","c":["ドルと金の交換を停止した","国際通貨基金の設立を各国に呼びかけた","主要国が変動相場制をやめ、固定相場制に戻ることを決めた","石油輸出国機構（OPEC）の結成を呼びかけた"],"e":"ベトナム戦争の戦費などで国際収支が悪化し、ドルの信用が低下したため、ニクソンはドルと金の交換を停止しました。これによりブレトン＝ウッズ体制はゆらぎ、1973年には主要国が固定相場制から変動相場制に移りました。IMFの設立は1944年のブレトン＝ウッズ会議で決まりました。OPECは1960年に産油国自身が結成した組織です。","m":"1971 ドル＝ショック（金とドルの交換停止）"},{"id":295,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"プロレタリア文化大革命","y":1966,"q":"1966年に毛沢東が始めた運動で、紅衛兵が動員され、劉少奇や鄧小平らが「実権派」として批判・失脚させられたものを何といいますか。","c":["プロレタリア文化大革命","大躍進","百花斉放・百家争鳴","改革・開放"],"e":"大躍進政策の失敗で毛沢東は国家主席を退き、劉少奇・鄧小平が経済の立て直しを進めました。毛沢東は権力の回復をめざして文化大革命を始め、社会は大きく混乱しました。大躍進は1958年に始まった急激な工業化・人民公社化の政策、百花斉放・百家争鳴は1956年に言論の自由を呼びかけた運動、改革・開放は文化大革命後に鄧小平が進めた経済政策です。","m":"大躍進（1958）の失敗→文化大革命（1966）"},{"id":296,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ヨーロッパ統合の歩み","y":1967,"q":"ヨーロッパ統合の歩みを示すア〜エを古い順に並べたものとして正しいものはどれですか。\nア マーストリヒト条約にもとづいてヨーロッパ連合（EU）が発足した。\nイ ヨーロッパ石炭鉄鋼共同体（ECSC）が発足した。\nウ 3つの共同体が統合されて、ヨーロッパ共同体（EC）が発足した。\nエ ローマ条約にもとづいてヨーロッパ経済共同体（EEC）が発足した。","c":["イ→エ→ウ→ア","エ→イ→ウ→ア","イ→ウ→エ→ア","エ→ウ→イ→ア"],"e":"フランス外相シューマンの提案から1952年にECSCが発足し、1958年にはローマ条約にもとづいてEECとヨーロッパ原子力共同体（EURATOM）が発足しました。1967年にこの3つが統合されてECとなり、1973年にはイギリスなどが加盟しました。冷戦終結後の1993年、マーストリヒト条約によってEUが発足しました。","m":"ECSC52→EEC58→EC67→EU93"},{"id":297,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"グラスノスチ","y":1986,"q":"ソ連のゴルバチョフが、1986年のチョルノービリ（チェルノブイリ）原子力発電所事故をきっかけに本格的に進めた、情報公開を意味する政策を何といいますか。","c":["グラスノスチ","ペレストロイカ","デタント","新思考外交"],"e":"ゴルバチョフは1985年に共産党書記長となり、ペレストロイカ（建て直し・改革）をかかげました。原発事故で情報を隠す体質が問題となったことから、グラスノスチ（情報公開）を進めて言論の自由化を図りました。ペレストロイカは改革全体を指す言葉、デタントは1970年代の米ソの緊張緩和、新思考外交は軍縮や東欧への不干渉などを進めた外交方針で、情報公開そのものを指す語ではありません。","m":"グラスノスチ＝情報公開、ペレストロイカ＝改革"},{"id":298,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"1989年の東欧革命","y":1989,"q":"1989年の東ヨーロッパの変革について述べた文として誤っているものはどれですか。","c":["ルーマニアでは、ドプチェクのもとで無血のうちに共産党政権が倒された","ポーランドでは、ワレサの率いる自主管理労組「連帯」が選挙で勝利し、連帯中心の政権ができた","東ドイツでは、ホネカーが退陣したのち、ベルリンの壁が開放された","チェコスロヴァキアでは、ビロード革命で共産党政権が倒れ、ハヴェルが大統領となった"],"e":"ルーマニアでは独裁を続けたチャウシェスクが民衆の蜂起と軍の離反で倒され、処刑されました。流血をともなった変革で、ドプチェクはチェコスロヴァキアの「プラハの春」の指導者なので、この文が誤りです。ポーランドの「連帯」の選挙勝利、東ドイツのホネカー退陣とベルリンの壁の開放、チェコスロヴァキアのビロード革命とハヴェルの大統領就任は、いずれも1989年の出来事として正しい内容です。","m":"ルーマニア＝チャウシェスク処刑（流血の革命）"},{"id":299,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"独立国家共同体","y":1991,"q":"1991年12月、ソ連が解体したのち、ロシアをはじめ旧ソ連を構成していた共和国の多くが結成したゆるやかな結びつきの組織はどれですか。","c":["独立国家共同体（CIS）","経済相互援助会議（コメコン）","ワルシャワ条約機構","全欧安全保障協力会議（CSCE）"],"e":"1991年8月の保守派のクーデタが失敗すると共産党は解散し、バルト3国の独立に続いて、12月にロシア・ウクライナ・ベラルーシなどがCISを結成し、ソ連は消滅しました。ロシアの大統領はエリツィンでした。コメコンとワルシャワ条約機構は1991年に解散した東側の組織、CSCEは1975年に東西の国々が参加してヘルシンキ宣言を採択した会議です。","m":"1991 ソ連解体→CIS（エリツィン）"},{"id":300,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"東西ドイツ統一の時期","y":1990,"q":"年表「1985年 ゴルバチョフがソ連共産党書記長に就任する／1989年 ベルリンの壁が開放される／1991年 ソ連が解体する」について、東西ドイツが統一された時期として正しいものはどれですか。","c":["ベルリンの壁の開放とソ連の解体の間","ゴルバチョフの書記長就任より前","ゴルバチョフの書記長就任とベルリンの壁の開放の間","ソ連の解体より後"],"e":"1989年11月にベルリンの壁が開放されたのち、東ドイツでは自由選挙が行われ、1990年10月に西ドイツが東ドイツを吸収する形で統一が実現しました。統一時の西ドイツ首相はコールです。統一ドイツはNATOにとどまりました。ソ連の解体は翌1991年12月のことなので、統一はベルリンの壁の開放とソ連の解体の間にあたります。","m":"壁開放89.11→ドイツ統一90.10→ソ連解体91.12"}];
var FIELDS=["古代の中国・インド","ローマとビザンツ世界","イスラーム世界","近世・近代のアジアと欧米","20世紀の世界（恐慌・冷戦）"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="nichidai-sekaishi-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);if(!q.fix)a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.fix?"出典：日本大学 "+esc(q.ref)+"（試験問題を原文のまま掲載。解説・覚え方は独自に作成したもので、試験実施団体とは関係ありません）":q.k==="past"?"過去問ベース：日本大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（日本大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+(q.fix?String(ci+1):"abcde".charAt(j))+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+(q.fix?"過去問題（原文）":KIND[q.k])+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+(q.fix?"過去問題（原文）":KIND[q.k])+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>

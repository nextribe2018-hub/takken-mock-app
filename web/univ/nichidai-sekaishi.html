<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>日大 世界史 10問テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 一枚の答案用紙。中央1カラム（最大640px）。問題文は試験冊子と同じ明朝、操作と数字はゴシック。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.passage{font-family:var(--f-exam);font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:50vh;overflow-y:auto}
.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){ .q{font-size:17px} .score b{font-size:44px} .fi{grid-template-columns:minmax(0,1fr)} .fi .btn{grid-column:1;grid-row:auto;justify-self:start} }
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

"use strict";
var QS=[{"id":1,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問1","f":"古代の中国・インド","t":"仰韶文化の地域","y":-4500,"q":"中国の新石器時代に、彩文土器（彩陶）を特色とする仰韶文化が栄えた中心地域として最も適当なものはどれですか。","c":["黄河中流域","長江下流域","黒竜江流域","淮河流域"],"e":"仰韶文化は前5000〜前3000年ごろ、黄河中流域（現在の河南省・陝西省あたり）を中心に栄えた農耕文化で、赤地に黒などで文様を描いた彩文土器が特色です。長江下流域では稲作をともなう河姆渡文化などが知られ、黄河の文化とは別系統の長江文明として扱われます。黒竜江（アムール川）流域や淮河流域は仰韶文化の中心ではありません。","m":"仰韶＝黄河中流・彩陶（色つき土器）"},{"id":2,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問2","f":"古代の中国・インド","t":"仰韶文化と竜山文化","y":-2500,"q":"中国の新石器文化とその特色の組み合わせとして最も適当なものはどれですか。","c":["竜山文化 ― 薄手で光沢のある黒陶","竜山文化 ― 赤地に文様を描いた彩文土器","仰韶文化 ― 薄手で光沢のある黒陶","仰韶文化 ― 亀甲や獣骨に刻んだ甲骨文字"],"e":"竜山文化（前3000〜前2000年ごろ）は黄河中・下流域に広がった文化で、ろくろを使った薄手の黒陶や灰陶が特色です。彩文土器（彩陶）は仰韶文化の特色なので、2つ目と3つ目は文化と土器が入れ替わっています。甲骨文字は殷の時代の文字で、新石器時代の仰韶文化には当てはまりません。","m":"仰韶＝彩陶、竜山＝黒陶・灰陶"},{"id":3,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問3","f":"古代の中国・インド","t":"殷の文字","y":-1300,"q":"黄河流域におこった殷王朝で用いられ、のちの漢字のもとになった文字として最も適当なものはどれですか。","c":["甲骨文字","楔形文字","神聖文字（ヒエログリフ）","インダス文字"],"e":"殷では王が神意を占って政治を行う神権政治が行われ、占いの内容を亀の甲羅や牛の骨に刻んだ甲骨文字が使われました。これが漢字の起源です。楔形文字はメソポタミアのシュメール人が始めて粘土板に刻んだ文字、神聖文字は古代エジプトの文字、インダス文字はインダス文明の印章などに見られる文字で、今も解読されていません。","m":"殷＝占い＋甲骨文字（漢字の祖先）"},{"id":4,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問4","f":"古代の中国・インド","t":"周の封建","y":-1000,"q":"周王が一族や功臣に領地を与えて世襲の諸侯とし、そのかわりに貢納や軍役を義務づけた統治のしくみを何といいますか。","c":["封建","郡県制","骨品制","両班"],"e":"周は鎬京（現在の西安付近）を都とし、王が諸侯に封土を与え、諸侯は貢納と軍役で王に仕える封建の制度をとりました。その結びつきは血縁にもとづく宗法で支えられていました。郡県制は中央から官僚を派遣して直接治める制度で、秦が全国に施行しました。骨品制は新羅の身分制度、両班は朝鮮王朝の特権的な支配階層です。","m":"周＝封建（宗法で諸侯をまとめる）"},{"id":5,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問6","f":"古代の中国・インド","t":"古代中国の文化と王朝の順序","y":-2000,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア 殷王朝が黄河流域におこった。\nイ 黒陶などを特色とする竜山文化が広がった。\nウ 周が鎬京に都をおいた。\nエ 彩文土器を特色とする仰韶文化が広がった。","c":["エ→イ→ア→ウ","イ→エ→ア→ウ","エ→イ→ウ→ア","イ→エ→ウ→ア"],"e":"仰韶文化（前5000年ごろ〜）→竜山文化（前3000年ごろ〜）→殷（前16世紀ごろ〜）→周（前11世紀ごろ、鎬京に都）の順です。新石器文化は彩陶の仰韶が先、黒陶の竜山が後と覚えましょう。殷を滅ぼして成立したのが周なので、殷と周の順が逆になることもありません。","m":"彩陶→黒陶→殷→周（鎬京）"},{"id":6,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問7","f":"古代の中国・インド","t":"秦の統一政策","y":-221,"q":"戦国時代に商鞅を登用して国力を強めた国は、のちに中国を統一しました。この国が統一後に行った政策として最も適当なものはどれですか。","c":["度量衡・貨幣・文字を統一した","郡県制と封建制を併用する郡国制をしいた","儒学を官学とし、五経博士をおいた","朝鮮半島に楽浪郡など4郡をおいた"],"e":"商鞅を登用したのは秦の孝公で、のちに秦王政（始皇帝）が前221年に中国を統一し、全国に郡県制をしき、度量衡・貨幣・文字を統一しました。郡国制は前漢の高祖（劉邦）、儒学の官学化と楽浪郡などの設置は前漢の武帝の政策です。秦と漢の政策を区別することがポイントです。","m":"秦＝郡県制＋度量衡・貨幣・文字の統一"},{"id":7,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問8","f":"古代の中国・インド","t":"商鞅と法家","y":-350,"q":"秦で改革を行った商鞅が属した学派として最も適当なものはどれですか。","c":["法家","墨家","兵家","縦横家"],"e":"商鞅は法による厳格な統治（信賞必罰）を説く法家の政治家で、秦で什伍の制や県制などの改革を進めました。法家にはのちに韓非や、始皇帝に仕えた李斯もいます。墨家は墨子が兼愛・非攻を説いた学派、兵家は孫子らの兵法の学派、縦横家は蘇秦・張儀ら外交策を説いた学派です。","m":"商鞅・韓非・李斯＝法家"},{"id":8,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問9","f":"古代の中国・インド","t":"春秋の覇者","y":-650,"q":"春秋時代に斉の桓公らが「覇者」と呼ばれました。覇者の説明として正しいものはどれですか。正しいものがない場合は「あてはまるものがない」を選びなさい。","c":["天命を受けて天下を治める者の呼び名","徳を失った王朝を倒し、新たな王朝を開いた者の呼び名","諸国の王を従える、王より格上の君主の称号","あてはまるものがない"],"e":"覇者は、周王の権威が衰えた春秋時代に「尊王攘夷」をかかげ、諸侯の会盟を主導した有力諸侯のことで、斉の桓公や晋の文公が代表です。天命を受けて天下を治める者は「天子」、徳を失った王朝を倒して新王朝を開くことは「易姓革命」、王より上位の君主は秦王政が名乗った「皇帝」の説明で、いずれも覇者ではありません。","m":"覇者＝尊王攘夷で諸侯を束ねた実力者","last":true,"a":3},{"id":9,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問10","f":"古代の中国・インド","t":"晋の分裂","y":-403,"q":"前403年、ある国が韓・魏・趙の三国に分裂し、これ以降を戦国時代とする見方が一般的です。分裂した国として最も適当なものはどれですか。","c":["晋","楚","燕","斉"],"e":"春秋時代の大国晋は、有力な家臣である韓・魏・趙の三氏に実権を奪われ、前403年に周王が三氏を諸侯と認めたことで分裂しました。これを戦国時代の始まりとするのが一般的です。楚・燕・斉は分裂せず、秦・韓・魏・趙とともに「戦国の七雄」に数えられます。戦国時代には鉄製農具の普及で生産力が高まり、諸子百家が活躍しました。","m":"晋が韓・魏・趙に三分→戦国時代へ"},{"id":10,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問11","f":"古代の中国・インド","t":"孔子の思想","y":-500,"q":"魯の歴史書『春秋』を編纂したとされる孔子の思想として最も適当なものはどれですか。","c":["仁を重んじ、親子・兄弟などの家族道徳を社会秩序の基本とした","人は生まれつき悪に傾くので、礼で正すべきだと説いた","作為を捨て、自然の道に身をゆだねる生き方を理想とした","身内か他人かを区別せずに広く愛し合い、侵略戦争をやめるよう説いた"],"e":"孔子は春秋時代末期の魯の人で、仁（人を愛する心）と礼を重んじ、家族道徳を土台に徳による政治を説いて儒家の祖となりました。性悪説は荀子、無為自然は老子・荘子の道家、兼愛・非攻は墨子の思想です。なお、性善説を説いたのは孟子です。","m":"孔子＝仁と礼、孟子＝性善、荀子＝性悪"},{"id":11,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅰ 問12","f":"古代の中国・インド","t":"春秋・戦国の出来事の順序","y":-500,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア 秦の孝公が商鞅を用いて改革を進めた。\nイ 晋が韓・魏・趙に分裂した。\nウ 斉の桓公が覇者となった。\nエ 孔子が活動し、儒家の祖となった。","c":["ウ→エ→イ→ア","ウ→イ→エ→ア","エ→ウ→イ→ア","ウ→エ→ア→イ"],"e":"斉の桓公が覇者となったのは前7世紀、孔子（前551ごろ〜前479）の活動は前6〜前5世紀、晋の分裂は前403年、商鞅の改革は前4世紀半ばです。春秋時代（覇者・孔子）から戦国時代（晋の分裂・商鞅）へという流れに当てはめると判断しやすくなります。","m":"桓公→孔子→晋三分→商鞅"},{"id":12,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問2","f":"ローマとビザンツ世界","t":"ポエニ戦争","y":-218,"q":"ローマとカルタゴが戦ったポエニ戦争について述べた文として正しいものはどれですか。","c":["第2回の戦争で、カルタゴのハンニバルがアルプスを越えてイタリアに侵入した","第1回の戦争は、コルシカ島をどちらが押さえるかで争ったことが発端となった","第2回の戦争で、剣奴スパルタクスがローマ軍を率いて活躍した","第3回の戦争で、大スキピオがザマの戦いでハンニバルを破った"],"e":"第2回ポエニ戦争（前218〜前201）では、ハンニバルがアルプスを越えてイタリアに攻め込み、カンネーの戦いでローマ軍を破りましたが、最後はザマの戦いで大スキピオに敗れました。第1回はシチリア島をめぐる争いから始まりました。スパルタクスは前1世紀に反乱をおこした剣奴です。第3回（前149〜前146）でカルタゴは滅ぼされました。","m":"1回シチリア、2回ハンニバル、3回滅亡"},{"id":13,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問3","f":"ローマとビザンツ世界","t":"ラティフンディア","y":-150,"q":"ポエニ戦争などで獲得した属州や捕虜を背景に、ローマの有力者が奴隷を使って経営した大土地所有を何といいますか。","c":["ラティフンディア","コロナトゥス","クレーロス","プロノイア"],"e":"ラティフンディア（ラティフンディウム）は、有力者が征服地などを集め、戦争捕虜の奴隷を使ってオリーブやぶどうなどを生産した大所領です。コロナトゥスは帝政後期に広がった、コロヌス（小作人）を使う経営です。クレーロスはギリシアの市民の持ち分地、プロノイアはビザンツ帝国の軍役と引きかえの土地管理制度です。","m":"共和政＝奴隷のラティフンディア→帝政後期＝コロナトゥス"},{"id":14,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問4","f":"ローマとビザンツ世界","t":"グラックス兄弟の改革","y":-133,"q":"前2世紀後半、護民官となったグラックス兄弟が行おうとした改革として最も適当なものはどれですか。","c":["一部の有力者が囲い込んだ公有地に上限を設け、余った土地を貧しい市民に分けようとした","平民だけで構成する平民会を新たに設けた","財産のない市民を給料で集めて兵士とする軍制改革を行った","平民会の決議が元老院の承認なしに国法となることを定めた"],"e":"グラックス兄弟は、中小農民の没落によって重装歩兵となる市民が減ったことを憂え、公有地の占有を制限して農民に再分配しようとしましたが、元老院の反対にあい失敗しました。平民会の設置は前5世紀の身分闘争の成果、志願兵制の軍制改革はマリウス、平民会の決議を国法とするのは前287年のホルテンシウス法です。","m":"グラックス＝公有地再分配で自作農再建"},{"id":15,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問5","f":"ローマとビザンツ世界","t":"カエサル","y":-46,"q":"ローマのカエサルについて述べた文として正しいものはどれですか。","c":["エジプトの太陽暦をもとにユリウス暦を定めた","『ゲルマニア』を著して、ゲルマン人の社会を記録した","元老院から「アウグストゥス」の称号を受け、帝政を始めた","オクタウィアヌス・アントニウスとともに第1回三頭政治を行った"],"e":"カエサルはガリア遠征（『ガリア戦記』を著述）で名声を得て独裁官となり、エジプトの太陽暦をもとにユリウス暦を制定しましたが、前44年に暗殺されました。『ゲルマニア』はタキトゥスの著作、「アウグストゥス」の称号を受けたのはオクタウィアヌスです。第1回三頭政治の相手はポンペイウスとクラッススで、オクタウィアヌス・アントニウス・レピドゥスは第2回三頭政治です。","m":"カエサル＝ガリア戦記・ユリウス暦"},{"id":16,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問6","f":"ローマとビザンツ世界","t":"パクス＝ロマーナ","y":64,"q":"前1世紀末から約200年続いた「パクス＝ロマーナ（ローマの平和）」の時期の出来事として最も適当なものはどれですか。","c":["ネロ帝がローマの大火を機にキリスト教徒を迫害した","ハドリアヌス帝がダキアを征服し、帝国の領土が最大となった","アントニヌス＝ピウス帝がストア派の哲学書『自省録』を著した","コンスタンティヌス帝がミラノ勅令でキリスト教を公認した"],"e":"ネロ帝による迫害は64年で、パクス＝ロマーナの時期にあたります。ダキアを征服して最大版図を実現したのはトラヤヌス帝、『自省録』は五賢帝最後のマルクス＝アウレリウス＝アントニヌスの著作です。ミラノ勅令は313年で、3世紀の混乱を経たあとの出来事なのでパクス＝ロマーナの時期にはあたりません。","m":"最大版図＝トラヤヌス、自省録＝マルクス"},{"id":17,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問7","f":"ローマとビザンツ世界","t":"オドアケル","y":476,"q":"476年、西ローマ帝国の皇帝を退位させ、帝国を滅亡させたゲルマン人の傭兵隊長は誰ですか。","c":["オドアケル","テオドリック","アラリック","クローヴィス"],"e":"476年、ゲルマン人傭兵隊長オドアケルが西ローマ皇帝を退位させ、西ローマ帝国は滅びました。テオドリックはそのオドアケルを倒してイタリアに東ゴート王国を建てた王、アラリックは410年にローマを略奪した西ゴートの王、クローヴィスはフランク王国を建ててアタナシウス派に改宗した王です。","m":"476年 オドアケル→493年 テオドリック"},{"id":18,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問8","f":"ローマとビザンツ世界","t":"ディオクレティアヌス","y":293,"q":"3世紀の軍人皇帝時代の混乱をおさめ、2人の正帝と2人の副帝で帝国を分担統治する四帝分治制（テトラルキア）を始めた皇帝は誰ですか。","c":["ディオクレティアヌス","コンスタンティヌス","テオドシウス","ネルウァ"],"e":"ディオクレティアヌス帝（位284〜305）は四帝分治制を始め、皇帝を神として崇拝させる専制君主政（ドミナトゥス）を確立し、キリスト教徒を大迫害しました。コンスタンティヌス帝はキリスト教公認とコンスタンティノープル遷都、テオドシウス帝はキリスト教の国教化と帝国の東西分割、ネルウァは五賢帝の最初の皇帝です。","m":"ディオクレティアヌス＝四帝分治・専制君主政"},{"id":19,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問10","f":"ローマとビザンツ世界","t":"ローマの著述家と著作","y":100,"q":"ローマ時代の著述家と著作の組み合わせとして正しいものはどれですか。","c":["プルタルコス ― 『対比列伝（英雄伝）』","リウィウス ― 『ガリア戦記』","タキトゥス ― 『神統記』","ウェルギリウス ― 『ローマ建国史』"],"e":"プルタルコスはローマ時代のギリシア人著述家で、ギリシアとローマの人物を対にして描いた『対比列伝』を著しました。『ガリア戦記』はカエサル、『神統記』はギリシアのヘシオドス、『ローマ建国史（ローマ建国以来の歴史）』はリウィウスの著作です。ウェルギリウスはローマ建国の叙事詩『アエネイス』で知られます。","m":"対比列伝＝プルタルコス、建国史＝リウィウス"},{"id":20,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅰ 問12","f":"ローマとビザンツ世界","t":"キリスト教の公認","y":313,"q":"ローマ帝国とキリスト教の関係について述べた文として正しいものはどれですか。","c":["コンスタンティヌス帝はミラノ勅令でキリスト教を公認した","ペテロやパウロら初期の伝道者は「教父」と呼ばれる","ニケーア公会議でネストリウス派が異端とされた","テオドシウス帝はキリスト教を禁じ、伝統的な神々の信仰を国教とした"],"e":"キリスト教は313年のミラノ勅令で公認され、392年にテオドシウス帝のもとで国教となり、ほかの宗教は禁止されました。ペテロやパウロは「使徒」と呼ばれ、「教父」は教義の確立に貢献したアウグスティヌスらの神学者を指します。ニケーア公会議（325年）ではアタナシウス派が正統、アリウス派が異端とされ、ネストリウス派が異端とされたのはエフェソス公会議（431年）です。","m":"313ミラノ勅令（公認）→392国教化"},{"id":21,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問13","f":"ローマとビザンツ世界","t":"ユスティニアヌス帝","y":534,"q":"6世紀、法学者たちに命じてローマ法を集大成させ、のちに『ローマ法大全』と総称される法典をまとめさせたビザンツ皇帝は誰ですか。","c":["ユスティニアヌス","レオン3世","ヘラクレイオス1世","コンスタンティヌス"],"e":"ユスティニアヌス帝（位527〜565）は法学者トリボニアヌスらに命じて『ローマ法大全』を編纂させ、ハギア＝ソフィア聖堂を再建し、ヴァンダル王国や東ゴート王国を滅ぼして地中海のほぼ全域の支配を一時回復しました。レオン3世は聖像禁止令を出した8世紀の皇帝、ヘラクレイオス1世はイスラーム勢力の進出に直面した7世紀の皇帝、コンスタンティヌスはキリスト教を公認した皇帝です。","m":"ユスティニアヌス＝ローマ法大全（トリボニアヌス）"},{"id":22,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問14","f":"ローマとビザンツ世界","t":"ローマ教会とフランク王国","y":756,"q":"8世紀、ビザンツ皇帝の聖像禁止令に反発し、フランク王国と結びつくことでビザンツ帝国からの自立を進めた教会はどれですか。","c":["ローマ＝カトリック教会","ギリシア正教会","ネストリウス派","アリウス派"],"e":"726年のレオン3世の聖像禁止令に対し、ゲルマン人への布教に聖像を用いていたローマ教会は反発しました。ローマ教皇はフランク王国のピピンの王位継承を認め、ピピンはラヴェンナ地方を教皇に寄進し、800年には教皇レオ3世がカールに西ローマ皇帝の冠を与えました。ギリシア正教会はビザンツ皇帝の保護下にある教会、ネストリウス派とアリウス派は異端とされた宗派です。","m":"聖像禁止令→ローマ教会はフランクと提携"},{"id":23,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問16","f":"ローマとビザンツ世界","t":"ユスティニアヌスの事業","y":537,"q":"ビザンツ皇帝ユスティニアヌスの事業として正しいものはどれですか。正しいものがない場合は「あてはまるものがない」を選びなさい。","c":["キリル文字をつくらせ、スラヴ人への布教を進めた","聖像の崇拝を禁じる命令を出し、ローマ教会と対立した","ローマ教皇にはたらきかけ、カールの皇帝戴冠を実現させた","あてはまるものがない"],"e":"ユスティニアヌス帝の事業としては『ローマ法大全』の編纂、ハギア＝ソフィア聖堂の再建、中国からの養蚕技術の導入などが知られます。キリル文字は9世紀のスラヴ人布教で用いられたグラゴール文字をもとにつくられた文字、聖像禁止令は726年のレオン3世、カールの戴冠（800年）は教皇レオ3世が行ったもので、いずれも彼の事業ではありません。","m":"ユスティニアヌス＝法典・ハギア＝ソフィア・養蚕","last":true,"a":3},{"id":24,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問17","f":"ローマとビザンツ世界","t":"東ゴート王国の滅亡","y":555,"q":"ユスティニアヌス帝が地中海支配の回復をめざして滅ぼした、イタリア半島のゲルマン人国家はどれですか。","c":["東ゴート王国","西ゴート王国","ブルグンド王国","ランゴバルド王国"],"e":"ユスティニアヌス帝は北アフリカのヴァンダル王国（534年）とイタリアの東ゴート王国（6世紀半ば）を滅ぼしました。西ゴート王国はイベリア半島に残り、711年にイスラーム勢力に滅ぼされます。ブルグンド王国はガリア東南部の王国でフランク王国に併合され、ランゴバルド王国はユスティニアヌスの死後の568年に北イタリアに建てられた国です。","m":"ユスティニアヌスが滅ぼした＝ヴァンダル・東ゴート"},{"id":25,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問19","f":"ローマとビザンツ世界","t":"テマ制","y":650,"q":"ビザンツ帝国が7世紀以降に整えたテマ制（軍管区制）の説明として最も適当なものはどれですか。","c":["帝国をいくつかの軍管区に分け、その長官に軍事と行政の権限をあわせて与えた","貴族が皇帝に軍事奉仕を約束し、見返りに国有地の管理をまかされた","兵士に俸給を払うかわりに、決められた土地から税を取り立てる権利を与えた","地方の民政は文官の総督に任せ、軍事は首都の中央軍だけが担った"],"e":"テマ制は、イスラーム勢力やスラヴ人などの侵入に対応するため、帝国をテマ（軍管区）に分け、司令官に軍事と行政の両方を任せた制度です。農民に土地を与えて兵役を課す屯田兵制と結びつき、自由農民が兵力の基盤となりました。軍役と引きかえの国有地管理権はのちのプロノイア制、徴税権の授与はイスラーム世界のイクター制です。4つ目はテマ制とは逆の、軍事と民政を分ける仕組みです。","m":"テマ制＝軍管区＋屯田兵、後にプロノイア制"},{"id":26,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問22","f":"ローマとビザンツ世界","t":"第4回十字軍","y":1204,"q":"ヴェネツィア商人の要望で進路を変え、1204年にコンスタンティノープルを占領してラテン帝国を建てた十字軍はどれですか。","c":["第4回十字軍","第1回十字軍","第2回十字軍","第3回十字軍"],"e":"教皇インノケンティウス3世が提唱した第4回十字軍は、輸送を担ったヴェネツィアの意向でコンスタンティノープルを攻略し、ラテン帝国を建てました。ビザンツ帝国は1261年に首都を奪回しますが、勢力は回復しませんでした。第1回はイェルサレム王国を建てた十字軍、第3回はサラーフ＝アッディーンと戦い、イギリスのリチャード1世らが参加した十字軍です。","m":"第4回＝ヴェネツィア主導でラテン帝国"},{"id":27,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問23","f":"イスラーム世界","t":"セルジューク朝の小アジア進出","y":1071,"q":"11世紀後半に小アジアに進出し、ビザンツ皇帝がローマ教皇に救援を求めるきっかけをつくった王朝はどれですか。","c":["セルジューク朝","ブワイフ朝","サーマーン朝","アッバース朝"],"e":"トルコ系のセルジューク朝は1071年のマンジケルトの戦いでビザンツ軍を破って小アジアに進出し、聖地イェルサレムも支配下におきました。ビザンツ皇帝の救援要請を受け、教皇ウルバヌス2世が1095年のクレルモン宗教会議で十字軍を提唱しました。ブワイフ朝はイラン系シーア派の王朝、サーマーン朝は中央アジアのイラン系王朝、アッバース朝はカリフの王朝です。","m":"1071マンジケルト→1095クレルモン→十字軍"},{"id":28,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅱ 問24","f":"イスラーム世界","t":"ビザンツ帝国の滅亡","y":1453,"q":"1453年にコンスタンティノープルを攻略し、ビザンツ帝国を滅ぼした国家はどれですか。","c":["オスマン帝国","マムルーク朝","サファヴィー朝","ムガル帝国"],"e":"オスマン帝国のメフメト2世は1453年にコンスタンティノープルを攻略してビザンツ帝国を滅ぼし、この都市をイスタンブルとして新たな首都としました。マムルーク朝はエジプトの王朝で、1517年にオスマン帝国に滅ぼされます。サファヴィー朝はイランのシーア派王朝、ムガル帝国はインドのイスラーム王朝です。","m":"1453 メフメト2世がコンスタンティノープル攻略"},{"id":29,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問13","f":"イスラーム世界","t":"ササン朝","y":400,"q":"3世紀にイランにおこり、7世紀にイスラーム勢力に滅ぼされた王朝について述べた文として正しいものはどれですか。正しいものがない場合は「あてはまるものがない」を選びなさい。","c":["ゾロアスター教を国教とし、教典『アヴェスター』が編纂された","マニ教を国教とし、ほかの宗教を厳しく禁じた","ダレイオス1世のもとでペルセポリスが都として造営された","あてはまるものがない"],"e":"ササン朝（224〜651）はゾロアスター教を国教とし、その教典『アヴェスター』を編纂しました。マニ教はササン朝の時代に生まれましたが、国教とはされず弾圧されました。ダレイオス1世がペルセポリスを建設したのは前6世紀のアケメネス朝のことです。よって正しい文があり、「あてはまるものがない」は誤りです。","m":"ササン朝＝ゾロアスター教国教・アヴェスター","last":true},{"id":30,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問14","f":"イスラーム世界","t":"ニハーヴァンドの戦い","y":642,"q":"正統カリフ時代のアラブ軍が、642年にササン朝の軍を破り、イラン支配への道を開いた戦いはどれですか。","c":["ニハーヴァンドの戦い","タラス河畔の戦い","ニコポリスの戦い","トゥール・ポワティエ間の戦い"],"e":"第2代正統カリフのウマルの時代、アラブ軍はニハーヴァンドの戦いでササン朝を破り、ササン朝は651年に滅びました。タラス河畔の戦い（751年）はアッバース朝が唐を破った戦い、ニコポリスの戦い（1396年）はオスマン帝国がハンガリー王らの連合軍を破った戦い、トゥール・ポワティエ間の戦い（732年）はフランク王国がウマイヤ朝軍を退けた戦いです。","m":"642ニハーヴァンド→651ササン朝滅亡"},{"id":31,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問15","f":"イスラーム世界","t":"バグダードの建設","y":762,"q":"アッバース朝のマンスールが建設した新都バグダードについて述べた文として正しいものはどれですか。","c":["城壁を三重にめぐらせた円形の計画都市としてつくられた","ユーフラテス川中流域に、ウマイヤ朝の都として建設された","13世紀、ヨーロッパに遠征したバトゥの軍に攻め落とされた","地中海に面した港湾都市で、イタリア商人の拠点となった"],"e":"バグダードはティグリス川のほとりに建設された円形都市で、「平安の都」と呼ばれ、国際的な大都市に発展しました。ウマイヤ朝の都はダマスクスです。1258年にバグダードを攻略してアッバース朝を滅ぼしたのはフラグで、バトゥはヨーロッパに遠征してキプチャク＝ハン国を建てた人物です。バグダードは内陸の都市で、地中海には面していません。","m":"バグダード＝ティグリス河畔の円形都市"},{"id":32,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問16","f":"イスラーム世界","t":"西ゴート王国の滅亡","y":711,"q":"711年、ウマイヤ朝の軍がイベリア半島に進出して滅ぼした王国はどれですか。","c":["西ゴート王国","東ゴート王国","ヴァンダル王国","ブルグンド王国"],"e":"ウマイヤ朝は711年に北アフリカからジブラルタル海峡を渡り、イベリア半島の西ゴート王国を滅ぼしました。さらにピレネー山脈を越えてフランク王国領に入りましたが、732年のトゥール・ポワティエ間の戦いで敗れました。東ゴート王国とヴァンダル王国は6世紀にビザンツ帝国に、ブルグンド王国はフランク王国に滅ぼされています。","m":"711 西ゴート滅亡→732 トゥール・ポワティエ"},{"id":33,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問17","f":"イスラーム世界","t":"ムアーウィヤ","y":661,"q":"第4代正統カリフのアリーが暗殺されたのち政権を握った、シリア総督ムアーウィヤについて述べた文として正しいものはどれですか。","c":["ウマイヤ朝を創始し、シリアのダマスクスに都をおいた","正統カリフの一人として、アラブの大征服を指導した","アッバース朝を創始し、バグダードに都をおいた","シーア派から初代イマームとして崇敬された"],"e":"ムアーウィヤは661年にウマイヤ朝を開き、ダマスクスを都としてカリフ位を世襲としました。正統カリフはアブー＝バクル、ウマル、ウスマーン、アリーの4人で、ムアーウィヤは含まれません。アッバース朝は750年にアブー＝アルアッバースが開いた王朝で、バグダードはその後マンスールが建設した都です。シーア派が初代イマームとするのはアリーです。","m":"661 ムアーウィヤ＝ウマイヤ朝（ダマスクス）"},{"id":34,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問18","f":"イスラーム世界","t":"初期イスラーム史の順序","y":700,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア マンスールがバグダードを建設した。\nイ ウマイヤ朝が西ゴート王国を滅ぼした。\nウ ムアーウィヤがウマイヤ朝を開いた。\nエ アラブ軍がニハーヴァンドの戦いでササン朝を破った。","c":["エ→ウ→イ→ア","ウ→エ→イ→ア","エ→ウ→ア→イ","エ→イ→ウ→ア"],"e":"ニハーヴァンドの戦い（642年、正統カリフ時代）→ウマイヤ朝の成立（661年）→西ゴート王国の滅亡（711年）→バグダードの建設（762年、アッバース朝）の順です。正統カリフ時代→ウマイヤ朝→アッバース朝という王朝の流れに当てはめると整理しやすくなります。","m":"642→661→711→762"},{"id":35,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問19","f":"イスラーム世界","t":"後ウマイヤ朝","y":929,"q":"ウマイヤ家の一族がイベリア半島に建てた後ウマイヤ朝について述べた文として正しいものはどれですか。","c":["10世紀、カリフを称したアブド＝アッラフマーン3世のもとで全盛となった","都をグラナダにおき、アルハンブラ宮殿を建てた","君主はアッバース朝に遠慮し、最後までカリフを名乗らなかった","アッバース家の一族が、ウマイヤ朝の滅亡後に建てた王朝である"],"e":"後ウマイヤ朝（756〜1031）はコルドバを都とし、10世紀のアブド＝アッラフマーン3世のときにカリフを称して最盛期をむかえました。グラナダとアルハンブラ宮殿はナスル朝のものです。ウマイヤ朝がアッバース家に倒されたあと、逃れたウマイヤ家の一族が建てたのが後ウマイヤ朝です。","m":"後ウマイヤ朝＝コルドバ、ナスル朝＝グラナダ"},{"id":36,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問20","f":"イスラーム世界","t":"サラーフ＝アッディーン","y":1187,"q":"エジプトにアイユーブ朝を建てたサラーフ＝アッディーン（サラディン）について述べた文として正しいものはどれですか。","c":["1187年に聖地イェルサレムを十字軍の手から取り戻した","ファーティマ朝を倒したのち、エジプトにシーア派の信仰を広めた","セルジューク朝の宰相として、ニザーミーヤ学院を各地に設けた","アイン＝ジャールートの戦いでモンゴル軍を破った"],"e":"サラーフ＝アッディーンはシーア派のファーティマ朝を廃してスンナ派を復活させ、1169年にアイユーブ朝を開きました。1187年にはイェルサレムを奪回し、第3回十字軍と戦いました。2つ目はファーティマ朝がシーア派で、彼はスンナ派を復活させたので誤りです。ニザーミーヤ学院を各地に建てたのはセルジューク朝の宰相ニザーム＝アルムルク、アイン＝ジャールートの戦い（1260年）はマムルーク朝の勝利です。","m":"サラディン＝アイユーブ朝・イェルサレム奪回"},{"id":37,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問22","f":"イスラーム世界","t":"トゥグリル＝ベク","y":1055,"q":"1055年にバグダードに入城し、アッバース朝カリフから「スルタン」の称号を授けられたセルジューク朝の建国者は誰ですか。","c":["トゥグリル＝ベク","ニザーム＝アルムルク","セリム1世","メフメト2世"],"e":"トゥグリル＝ベクはブワイフ朝を追ってバグダードに入り、カリフからスルタンの称号を受けました。これによりカリフは宗教的権威、スルタンは政治・軍事の実権を担うという役割分担が生まれました。ニザーム＝アルムルクはセルジューク朝の宰相、セリム1世はマムルーク朝を滅ぼしたオスマン帝国のスルタン、メフメト2世はビザンツ帝国を滅ぼしたスルタンです。","m":"1055 トゥグリル＝ベクがスルタンの称号"},{"id":38,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問23","f":"イスラーム世界","t":"マムルーク朝","y":1250,"q":"1250年にエジプトに成立したマムルーク朝について述べた文として正しいものはどれですか。","c":["アイユーブ朝に仕えた奴隷身分出身の軍人たちが建て、カイロを都とした","10世紀半ばにバグダードを占領し、カリフから大アミールに任じられた","11世紀半ばにバグダードを追われ、セルジューク朝に取って代わられた","シーア派の王朝で、君主は自らカリフを名乗った"],"e":"マムルーク朝はアイユーブ朝に仕えたマムルーク（奴隷軍人）たちが建てた政権で、カイロを都とし、モンゴル軍を退け、十字軍の最後の拠点も攻略しました。2つ目と3つ目はイラン系シーア派のブワイフ朝の説明、4つ目はファーティマ朝の説明です。マムルーク朝は1517年にオスマン帝国のセリム1世に滅ぼされました。","m":"マムルーク朝＝奴隷軍人・カイロ・1517滅亡"},{"id":39,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅱ 問24","f":"イスラーム世界","t":"イスラーム諸王朝の順序","y":1100,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア マムルーク朝が成立した。\nイ サラーフ＝アッディーンがアイユーブ朝を開いた。\nウ イベリア半島に後ウマイヤ朝が建てられた。\nエ トゥグリル＝ベクがスルタンの称号を受けた。","c":["ウ→エ→イ→ア","ウ→イ→エ→ア","エ→ウ→イ→ア","ウ→エ→ア→イ"],"e":"後ウマイヤ朝の成立（756年）→トゥグリル＝ベクのバグダード入城（1055年）→アイユーブ朝の成立（1169年）→マムルーク朝の成立（1250年）の順です。アイユーブ朝のマムルークがマムルーク朝を建てたという関係を押さえておけば、イとアの順で迷うことはありません。","m":"756→1055→1169→1250"},{"id":40,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問25","f":"近世・近代のアジアと欧米","t":"地丁銀制","y":1720,"q":"18世紀前半の清で、人口の増加にともなう丁税逃れを背景に、丁税を土地税に繰り込んで一本化した税制はどれですか。","c":["地丁銀制","一条鞭法","両税法","租調庸制"],"e":"地丁銀制は康熙帝の末期に始まり、雍正帝の時代に全国に広がった税制で、丁税（人頭税）を地税に組み込んだため人頭税は事実上なくなりました。一条鞭法は明代後期に諸税と労役を一括して銀納とした税制、両税法は唐の中期に夏・秋の2回、資産に応じて課税した税制、租調庸制は均田制と結びついた唐の前期の税制です。","m":"唐 租調庸→両税法、明 一条鞭法、清 地丁銀制"},{"id":41,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問26","f":"近世・近代のアジアと欧米","t":"景徳鎮","y":1550,"q":"明代に海外へ大量に輸出された陶磁器の代表的な生産地で、江西省にある都市はどれですか。","c":["景徳鎮","広州","北京","南京"],"e":"景徳鎮は宋代から陶磁器の生産で栄え、明代には官営工場がおかれて染付（青花）や赤絵が生産され、生糸とともに重要な輸出品となりました。その対価としてメキシコ銀や日本銀が中国に大量に流入しました。広州は清代にヨーロッパとの貿易が限定された港、北京は明の永楽帝以降の都、南京は明初の都です。","m":"景徳鎮＝陶磁器（染付・赤絵）、輸出で銀が流入"},{"id":42,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問27","f":"近世・近代のアジアと欧米","t":"張居正","y":1580,"q":"明代後期の16世紀、政治の実権を握って財政の立て直しを進め、一条鞭法を全国に広めた人物は誰ですか。","c":["張居正","王安石","永楽帝","洪武帝"],"e":"万暦帝の初期に政治を主導した張居正は、全国的な土地の調査を行い、一条鞭法を全国に施行して財政を立て直しました。王安石は北宋の神宗のもとで新法を行った宰相、永楽帝は鄭和の南海遠征を命じた明の皇帝、洪武帝は明を建国し、里甲制や魚鱗図冊・賦役黄冊を整えた皇帝です。","m":"一条鞭法の全国化＝張居正（万暦帝期）"},{"id":43,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問28","f":"近世・近代のアジアと欧米","t":"明代の社会経済","y":1550,"q":"明代後期の社会経済について述べた文として最も適当なものはどれですか。","c":["湖広（長江中流域）が新たな穀倉地帯となり、「湖広熟すれば天下足る」と言われた","東南アジアが原産地のトウモロコシやサツマイモが伝わり、山地の開発が進んだ","四川で紅巾の乱がおこり、その鎮圧費用で明の財政が大きく悪化した","海外貿易が途絶え、中国には銀がほとんど流入しなかった"],"e":"明代には長江下流域で綿織物や生糸などの手工業が発達して綿花や桑の栽培が広がり、米の主産地は湖広（長江中流域）に移って「湖広熟すれば天下足る」と言われました。トウモロコシやサツマイモはアメリカ大陸原産です。紅巾の乱は元末におこった白蓮教徒の反乱で、明の建国につながりました。明代には日本銀やメキシコ銀が大量に流入しました。","m":"宋「蘇湖熟すれば」→明「湖広熟すれば」"},{"id":44,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問29","f":"近世・近代のアジアと欧米","t":"清の盛期の出来事の順序","y":1720,"q":"清の出来事ア〜ウを古い順に並べたものとして正しいものはどれですか。\nア 乾隆帝がジュンガルを滅ぼした。\nイ 呉三桂らが三藩の乱をおこした。\nウ 雍正帝の時代に地丁銀制が全国に広がった。","c":["イ→ウ→ア","ウ→イ→ア","イ→ア→ウ","ア→イ→ウ"],"e":"三藩の乱は康熙帝の時代の1673年におこり、1681年に鎮圧されました。雍正帝（位1722〜35）の時代に地丁銀制が全国に広がり、乾隆帝の時代の1758年ごろにジュンガルが滅ぼされ、東トルキスタンは「新疆」とされました。康熙→雍正→乾隆という皇帝の順に当てはめると解けます。","m":"康熙（三藩）→雍正（地丁銀）→乾隆（新疆）"},{"id":45,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅲ 問35","f":"近世・近代のアジアと欧米","t":"康熙帝","y":1689,"q":"清の康熙帝の事績として最も適当なものはどれですか。","c":["ロシアとネルチンスク条約を結び、国境を定めた","満洲文字を制定し、八旗を編制した","軍機処を設置し、皇帝の権力を強めた","ロシアとキャフタ条約を結び、モンゴル方面の国境を定めた"],"e":"康熙帝は三藩の乱を鎮め、台湾の鄭氏を降伏させ、1689年にロシアのピョートル1世とネルチンスク条約を結んでアルグン川と外興安嶺（スタノヴォイ山脈）を国境としました。満洲文字の制定と八旗の編制はヌルハチ、軍機処の設置とキャフタ条約（1727年）は雍正帝の事績です。","m":"ネルチンスク＝康熙、キャフタ＝雍正"},{"id":46,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問37","f":"近世・近代のアジアと欧米","t":"イタリア・ドイツの統一","y":1871,"q":"1850年代から1870年代にかけて、イタリアとドイツでおこったこととして最も適当なものはどれですか。","c":["分立していた諸国がまとまり、統一国家が誕生した","1848年に自由主義・民族主義の革命が各地で連鎖的におこった","恐慌を乗り切るため、本国と勢力圏で排他的な経済圏を築いた","独裁者のもとで反対派を弾圧する全体主義体制が成立した"],"e":"イタリアでは1861年にサルデーニャ王ヴィットーリオ＝エマヌエーレ2世のもとでイタリア王国が成立し、ドイツではビスマルクの指導するプロイセンが普墺戦争・普仏戦争に勝って1871年にドイツ帝国が成立しました。「諸国民の春」は1848年の革命、ブロック経済とファシズムの台頭は1930年代の出来事です。","m":"1861イタリア王国、1871ドイツ帝国"},{"id":47,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問38","f":"近世・近代のアジアと欧米","t":"19世紀半ばのアメリカの出来事の順序","y":1854,"q":"次のア〜ウを古い順に並べたものとして正しいものはどれですか。\nア 日米和親条約が結ばれた。\nイ アメリカで南北戦争が始まった。\nウ アメリカがメキシコとの戦争に勝ち、カリフォルニアを獲得した。","c":["ウ→ア→イ","ア→ウ→イ","ウ→イ→ア","イ→ウ→ア"],"e":"アメリカはアメリカ＝メキシコ戦争に勝ち、1848年にカリフォルニアを獲得しました。太平洋岸に達したアメリカは太平洋航路の寄港地を求め、ペリーの来航を経て1854年に日米和親条約を結びました。南北戦争は1861年に始まり、1865年に北部の勝利で終わりました。","m":"1848カリフォルニア→1854和親→1861南北戦争"},{"id":48,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問39","f":"近世・近代のアジアと欧米","t":"インド大反乱の結果","y":1858,"q":"1857年におこったインド大反乱が、インドの歴史上重要とされる理由として最も適当なものはどれですか。","c":["反乱後に東インド会社が解散し、イギリス政府による直接統治が始まったから","反乱が成功し、インドがイギリスの支配から抜け出したから","反乱の結果、イスラーム教徒の国としてパキスタンが分かれたから","反乱を機に、ガンディーが非暴力・不服従の運動を始めたから"],"e":"インド大反乱を鎮圧したイギリスは、1858年にムガル帝国を滅ぼし、東インド会社を解散してインドを直接統治下におきました。1877年にはヴィクトリア女王を皇帝とするインド帝国が成立します。インドの独立とパキスタンの分離は1947年、ガンディーの非暴力・不服従運動は第一次世界大戦後の1919年以降のことです。","m":"1857大反乱→1858直接統治→1877インド帝国"},{"id":49,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問40","f":"近世・近代のアジアと欧米","t":"1850〜70年代の各地の改革","y":1865,"q":"1850年代から1870年代におこった出来事として誤っているものはどれですか。","c":["日本で、政党内閣が続く「憲政の常道」が始まった","ロシアで、アレクサンドル2世が農奴解放令を出した","清で、李鴻章らが西洋の技術を導入する洋務運動を進めた","オスマン帝国で、ミドハト憲法が発布された"],"e":"「憲政の常道」は1924年の加藤高明内閣から1932年の五・一五事件まで政党内閣が続いた慣行で、1920年代の出来事です。農奴解放令は1861年、洋務運動は1860年代から、ミドハト憲法は1876年の発布で、いずれも19世紀後半に各国が近代化を模索した動きです。","m":"19世紀後半＝農奴解放・洋務運動・ミドハト憲法"},{"id":50,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問41","f":"近世・近代のアジアと欧米","t":"佐賀の乱の時期","y":1874,"q":"年表「1868年 戊辰戦争の開始／1873年 明治六年の政変／1877年 西南戦争の開始」について、江藤新平を指導者とする佐賀の乱がおこった時期として正しいものはどれですか。","c":["明治六年の政変と西南戦争の開始の間","戊辰戦争の開始より前","戊辰戦争の開始と明治六年の政変の間","西南戦争の開始より後"],"e":"明治六年の政変（征韓論争）で下野した江藤新平は、板垣退助らと民撰議院設立建白書に署名したのち、1874年に郷里で佐賀の乱をおこしました。同じく下野した西郷隆盛が鹿児島の士族とともにおこしたのが1877年の西南戦争で、これが最大で最後の士族反乱となりました。","m":"1873政変→1874佐賀の乱・建白書→1877西南戦争"},{"id":51,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問42","f":"近世・近代のアジアと欧米","t":"廃藩置県の時期","y":1871,"q":"年表「1868年 戊辰戦争の開始／1873年 明治六年の政変／1877年 西南戦争の開始」について、藩を廃止して府県をおいた廃藩置県が行われた時期として正しいものはどれですか。","c":["戊辰戦争の開始と明治六年の政変の間","戊辰戦争の開始より前","明治六年の政変と西南戦争の開始の間","西南戦争の開始より後"],"e":"明治政府は1869年の版籍奉還で藩主に土地と人民を天皇へ返上させ、1871年に廃藩置県を断行して、府知事・県令を中央から派遣しました。これにより中央集権体制が整いました。同じ1871年にはドイツ帝国が成立しており、国民国家形成の動きが世界各地で並行して進んでいたことが分かります。","m":"1869版籍奉還→1871廃藩置県"},{"id":52,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問43","f":"近世・近代のアジアと欧米","t":"朝鮮の近代化をめぐる対立","y":1884,"q":"19世紀後半の朝鮮で近代化をめぐっておこった対立について、人物と出来事の組み合わせとして正しいものはどれですか。","c":["金玉均 ― 日本の支援を得て甲申政変をおこした","金玉均 ― 大院君を支持する兵士とともに壬午軍乱をおこした","洪秀全 ― 朝鮮に渡り甲申政変を指導した","康有為 ― 朝鮮に渡り甲午農民戦争を指導した"],"e":"金玉均ら急進開化派（独立党）は1884年、日本の支援を受けて甲申政変をおこしましたが、清軍の介入で失敗しました。1882年の壬午軍乱は、閔氏政権に不満をもつ兵士が大院君を担いでおこした反乱です。洪秀全は太平天国の指導者、康有為は清で戊戌の変法を進めた人物で、甲午農民戦争（1894年）は東学の全琫準らが指導しました。","m":"1882壬午軍乱（大院君）→1884甲申政変（金玉均）"},{"id":53,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅳ 問50","f":"近世・近代のアジアと欧米","t":"アジアの近代化改革","y":1870,"q":"19世紀のアジアの近代化政策について述べた次の文ⅰ・ⅱの正誤の組み合わせとして正しいものはどれですか。\nⅰ タイのチュラロンコン（ラーマ5世）は、行政や教育の改革を進め、近代化を図った。\nⅱ オスマン帝国のタンジマートは、エジプト総督ムハンマド＝アリーが始めた改革である。","c":["ⅰ 正　ⅱ 誤","ⅰ 正　ⅱ 正","ⅰ 誤　ⅱ 正","ⅰ 誤　ⅱ 誤"],"e":"タイのチュラロンコンは19世紀後半に奴隷制の廃止や行政・教育の改革を進め、英仏の緩衝地帯という立場も生かして独立を維持しました。タンジマートは1839年にスルタンのアブデュルメジト1世がギュルハネ勅令を出して始めた西欧化改革です。ムハンマド＝アリーはオスマン帝国から事実上自立し、エジプトの近代化を進めた人物です。","m":"タンジマート＝1839ギュルハネ勅令"},{"id":54,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問25","f":"20世紀の世界（恐慌・冷戦）","t":"ヤルタ会談","y":1945,"q":"1945年2月のヤルタ会談に出席した連合国首脳の組み合わせとして正しいものはどれですか。","c":["フランクリン＝ローズヴェルト・チャーチル・スターリン","フランクリン＝ローズヴェルト・チャーチル・蔣介石","トルーマン・チャーチル・スターリン","トルーマン・アトリー・スターリン"],"e":"ヤルタ会談ではアメリカのフランクリン＝ローズヴェルト、イギリスのチャーチル、ソ連のスターリンが戦後処理を話し合い、秘密協定でソ連の対日参戦を決めました。蔣介石が参加したのは1943年のカイロ会談です。トルーマンが参加したのは1945年7〜8月のポツダム会談で、イギリス代表は途中でチャーチルからアトリーに交代しました。","m":"カイロ＝蔣介石、ヤルタ＝FDR、ポツダム＝トルーマン"},{"id":55,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問26","f":"20世紀の世界（恐慌・冷戦）","t":"北大西洋条約機構","y":1949,"q":"1949年、アメリカや西ヨーロッパ諸国などがソ連に対抗して結成した軍事同盟はどれですか。","c":["北大西洋条約機構（NATO）","ワルシャワ条約機構","東南アジア条約機構（SEATO）","中東条約機構（METO）"],"e":"北大西洋条約機構は1949年、アメリカ・カナダと西ヨーロッパ諸国が結成した集団防衛の同盟です。ワルシャワ条約機構は1955年、西ドイツのNATO加盟に対抗してソ連と東欧諸国が結成しました。東南アジア条約機構は1954年、中東条約機構（バグダード条約機構）は1955年に結成された、反共の地域的な同盟です。","m":"1949 NATO → 1955 ワルシャワ条約機構"},{"id":56,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問27","f":"20世紀の世界（恐慌・冷戦）","t":"第五福竜丸事件","y":1954,"q":"1954年、日本の漁船第五福竜丸が被ばくする事件がおこりました。その原因となったアメリカの水爆実験が行われた場所はどこですか。","c":["マーシャル諸島のビキニ環礁","パラオ諸島","カロリン諸島","ビスマルク諸島"],"e":"1954年3月、アメリカが太平洋のマーシャル諸島ビキニ環礁で行った水爆実験で、第五福竜丸が放射性降下物（「死の灰」）を浴び、無線長の久保山愛吉が亡くなりました。これをきっかけに日本で原水爆禁止運動が広がり、1955年に広島で第1回原水爆禁止世界大会が開かれました。同じ1955年にはラッセル・アインシュタイン宣言も出されています。","m":"1954 ビキニ水爆→原水爆禁止運動"},{"id":57,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問28","f":"20世紀の世界（恐慌・冷戦）","t":"キューバ危機の指導者","y":1962,"q":"1962年のキューバ危機のときの、キューバ・アメリカ・ソ連の指導者の組み合わせとして正しいものはどれですか。","c":["カストロ ― ケネディ ― フルシチョフ","カストロ ― ジョンソン ― フルシチョフ","ゲバラ ― ケネディ ― ブレジネフ","カストロ ― アイゼンハワー ― ブレジネフ"],"e":"1959年のキューバ革命で政権を握ったカストロのもとでソ連がミサイル基地を建設し、アメリカのケネディ大統領は海上封鎖で対抗しました。ソ連のフルシチョフがミサイルの撤去に応じ、核戦争は回避されました。ゲバラはカストロとともに革命を戦った人物、ジョンソンはケネディ暗殺後の大統領、ブレジネフはフルシチョフ失脚後のソ連の指導者です。","m":"キューバ危機＝カストロ・ケネディ・フルシチョフ"},{"id":58,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問29","f":"20世紀の世界（恐慌・冷戦）","t":"ASEANの原加盟国","y":1967,"q":"1967年に東南アジア諸国連合（ASEAN）が結成されたとき、原加盟国だった国はどれですか。","c":["インドネシア","ベトナム","カンボジア","ビルマ（ミャンマー）"],"e":"ASEANはインドネシア・マレーシア・フィリピン・シンガポール・タイの5か国で結成されました。当初は反共的な性格が強く、ベトナム（1995年）、ミャンマー（1997年）、カンボジア（1999年）などは冷戦終結後に加盟しました。現在では東南アジアのほぼ全域をふくむ地域協力機構となっています。","m":"原加盟5か国＝インドネシア・マレーシア・フィリピン・シンガポール・タイ"},{"id":59,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問30","f":"20世紀の世界（恐慌・冷戦）","t":"第4次中東戦争の当事国","y":1973,"q":"1973年、エジプトとともにイスラエルを奇襲し、第4次中東戦争を始めた国はどれですか。","c":["シリア","イラク","サウジアラビア","ヨルダン"],"e":"第4次中東戦争は1973年10月、第3次中東戦争で失った領土の奪回をめざして、エジプトとシリアがイスラエルを奇襲して始まりました。シリアはゴラン高原の奪回をめざしました。イラクやヨルダンは開戦後に部隊を送って加わりましたが、奇襲を始めた当事国ではありません。サウジアラビアなどアラブ産油国はOAPEC（アラブ石油輸出国機構）を通じて石油戦略をとり、アラブ側を支援しました。","m":"第4次中東戦争＝エジプト・シリアが奇襲"},{"id":60,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問31","f":"20世紀の世界（恐慌・冷戦）","t":"第1次石油危機","y":1973,"q":"1973年の第4次中東戦争について述べた文として正しいものはどれですか。","c":["アラブ産油国の石油戦略により、第1次石油危機がおこった","この戦争の結果として、イスラエルが建国された","戦争後、エジプトのナセル大統領がイスラエルと平和条約を結んだ","この戦争をきっかけに、パレスチナ解放機構（PLO）が結成された"],"e":"第4次中東戦争ではOAPECが原油の生産削減や親イスラエル国への輸出制限を行い、OPECも原油価格を大幅に引き上げたため、先進国経済が打撃を受けました（第1次石油危機）。イスラエルの建国は1948年、PLOの結成は1964年です。1979年にイスラエルと平和条約を結んだのは、ナセルの後継者のサダト大統領です。","m":"1973第4次中東戦争→第1次石油危機"},{"id":61,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問35","f":"20世紀の世界（恐慌・冷戦）","t":"朝鮮戦争の時期","y":1950,"q":"年表「1949年 NATO結成／1954年 第五福竜丸事件／1962年 キューバ危機」について、朝鮮戦争が始まった時期として正しいものはどれですか。","c":["NATO結成と第五福竜丸事件の間","NATO結成より前","第五福竜丸事件とキューバ危機の間","キューバ危機より後"],"e":"朝鮮戦争は1950年6月、北朝鮮軍が北緯38度線をこえて南下して始まりました。国連安全保障理事会はソ連が欠席するなか国連軍の派遣を決め、中国は人民義勇軍を送りました。1953年に板門店で休戦協定が結ばれています。日本ではこの戦争を機に警察予備隊が創設され、特需景気がおこりました。","m":"1950朝鮮戦争→1953休戦（板門店）"},{"id":62,"k":"past","ref":"2026年度 経済学部A個別第1期 Ⅲ 問34","f":"20世紀の世界（恐慌・冷戦）","t":"バンドン会議の時期","y":1955,"q":"年表「1949年 NATO結成／1954年 第五福竜丸事件／1962年 キューバ危機」について、アジア＝アフリカ会議（バンドン会議）が開かれた時期として正しいものはどれですか。","c":["第五福竜丸事件とキューバ危機の間","NATO結成より前","NATO結成と第五福竜丸事件の間","キューバ危機より後"],"e":"アジア＝アフリカ会議は1955年にインドネシアのバンドンで開かれ、29か国が参加して平和十原則を採択しました。前年の1954年には中国の周恩来とインドのネルーが平和五原則を確認しています。1961年にはユーゴスラヴィアのベオグラードで第1回非同盟諸国首脳会議が開かれ、第三世界の連帯が広がりました。","m":"1954平和五原則→1955平和十原則（バンドン）"},{"id":63,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問37","f":"20世紀の世界（恐慌・冷戦）","t":"ベルリンをめぐる出来事の順序","y":1955,"q":"次のア〜ウを古い順に並べたものとして正しいものはどれですか。\nア ベルリンの壁が築かれた。\nイ ソ連がベルリン封鎖を行った。\nウ ドイツ民主共和国（東ドイツ）が成立した。","c":["イ→ウ→ア","ウ→イ→ア","イ→ア→ウ","ウ→ア→イ"],"e":"西側占領地区での通貨改革に反発したソ連は1948年にベルリン封鎖を行い、1949年に西側でドイツ連邦共和国、続いてソ連占領地区でドイツ民主共和国が成立しました。東から西への人口流出が続いたため、東ドイツは1961年にベルリンの壁を築きました。壁は1989年に開放されました。","m":"1948封鎖→1949東西ドイツ成立→1961壁"},{"id":64,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問39","f":"20世紀の世界（恐慌・冷戦）","t":"新冷戦の始まり","y":1979,"q":"1970年代末におこり、米ソのデタント（緊張緩和）を終わらせて「新冷戦」と呼ばれる対立を招いた出来事はどれですか。","c":["ソ連のアフガニスタン侵攻","アメリカによる北ベトナム爆撃（北爆）の開始","マーシャル＝プランの発表","フルシチョフによるスターリン批判"],"e":"1979年末、ソ連は親ソ政権を支えるためアフガニスタンに侵攻しました。アメリカなど西側諸国は1980年のモスクワオリンピックをボイコットし、レーガン政権は軍備拡張を進めて新冷戦となりました。北爆の開始は1965年、マーシャル＝プランの発表は1947年、スターリン批判は1956年の出来事です。","m":"1979アフガン侵攻→新冷戦→モスクワ五輪ボイコット"},{"id":65,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問40","f":"20世紀の世界（恐慌・冷戦）","t":"マルタ会談","y":1989,"q":"1989年、アメリカのブッシュ（父）大統領とソ連のゴルバチョフ書記長が会談し、冷戦の終結を宣言した会談はどれですか。","c":["マルタ会談","ヤルタ会談","ジュネーヴ4巨頭会談","ポツダム会談"],"e":"1989年12月、地中海のマルタ島でブッシュとゴルバチョフが会談し、冷戦の終結を宣言しました。その前月にはベルリンの壁が開放されています。1987年には両国の間でINF（中距離核戦力）全廃条約が結ばれていました。ヤルタ会談とポツダム会談は第二次世界大戦末期、ジュネーヴ4巨頭会談は1955年の米英仏ソ首脳会談です。","m":"ヤルタからマルタへ（1945→1989）"},{"id":66,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問41","f":"20世紀の世界（恐慌・冷戦）","t":"プラハの春","y":1968,"q":"1968年の「プラハの春」とその結末について述べた文として正しいものはどれですか。","c":["チェコスロヴァキアのドプチェク政権の自由化を、ワルシャワ条約機構の軍隊がおさえこんだ","ポーランドのワレサらの「連帯」の運動を、ワルシャワ条約機構の軍隊がおさえこんだ","チェコスロヴァキアのドプチェク政権の自由化を、NATOの軍隊がおさえこんだ","ハンガリーのナジ＝イムレの改革を、ソ連軍がおさえこんだ"],"e":"チェコスロヴァキアでは1968年、ドプチェクが「人間の顔をした社会主義」をかかげて改革を進めましたが、ソ連はブレジネフ＝ドクトリン（制限主権論）を唱え、ワルシャワ条約機構軍が介入して改革を押しつぶしました。ワレサの「連帯」は1980年代のポーランド、ナジ＝イムレの改革とソ連の介入は1956年のハンガリーの出来事です。","m":"1956ハンガリー（ナジ）、1968チェコ（ドプチェク）"},{"id":67,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問42","f":"20世紀の世界（恐慌・冷戦）","t":"中越戦争","y":1979,"q":"社会主義国どうしが戦った戦争として最も適当なものはどれですか。","c":["中越戦争","印パ戦争","フォークランド戦争","湾岸戦争"],"e":"1979年、ベトナムのカンボジア侵攻に反発した中国がベトナムに侵攻し、中越戦争がおこりました。中ソ対立のなかでベトナムはソ連に近づいていました。印パ戦争はインドとパキスタン、フォークランド戦争（1982年）はイギリスとアルゼンチン、湾岸戦争（1991年）はイラクと多国籍軍の戦争で、いずれも社会主義国どうしの戦争ではありません。","m":"中ソ対立の延長＝1979中越戦争"},{"id":68,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問43","f":"20世紀の世界（恐慌・冷戦）","t":"ユーゴスラヴィアの独自路線","y":1961,"q":"1948年にコミンフォルムから除名され、ソ連とは異なる独自の社会主義路線を歩んだユーゴスラヴィアについて述べた文として正しいものはどれですか。","c":["1961年、非同盟諸国の首脳が初めて集まる会議の開催地となった","敗戦国として、戦後に米英仏ソの4か国の占領下におかれた","首相ブラントのもとで、東欧諸国との関係改善を進めた","1956年、ソ連軍の介入でナジの改革政権が崩壊した"],"e":"ユーゴスラヴィアはティトーの指導のもとでパルチザン闘争により自力で解放を果たし、ソ連と対立してコミンフォルムを除名されました。その後は非同盟主義をとり、1961年に首都ベオグラードで第1回非同盟諸国首脳会議を開きました。4か国による分割占領はドイツとオーストリア、ブラントの東方外交は西ドイツ、ナジ政権の崩壊はハンガリーの出来事です。","m":"ティトー＝独自路線・非同盟（ベオグラード1961）"},{"id":69,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問47","f":"20世紀の世界（恐慌・冷戦）","t":"第3次中東戦争の時期","y":1967,"q":"年表「1952年 エジプト革命／1958年 イラク革命／1979年 イラン＝イスラーム革命」について、第3次中東戦争がおこった時期として正しいものはどれですか。","c":["イラク革命とイラン＝イスラーム革命の間","エジプト革命より前","エジプト革命とイラク革命の間","イラン＝イスラーム革命より後"],"e":"第3次中東戦争は1967年、イスラエルが先制攻撃してわずか6日間で勝利し、シナイ半島・ガザ地区・ヨルダン川西岸・ゴラン高原などを占領しました。エジプト革命（1952年）とイラク革命（1958年）はいずれも軍人らが王政を倒した革命、イラン＝イスラーム革命（1979年）はホメイニの指導で王政を倒した革命です。","m":"1967第3次中東戦争（六日戦争）"},{"id":70,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問48","f":"20世紀の世界（恐慌・冷戦）","t":"ナセル","y":1956,"q":"1952年のエジプト革命で自由将校団を実質的に率い、初代大統領ナギブを退けて1956年に大統領となったナセルについて述べた文として正しいものはどれですか。","c":["運河会社を国のものにすると宣言し、続く戦争で英仏の撤兵を勝ち取った","石油産業の国営化をはかったが、アメリカが後押ししたクーデタで政権を追われた","PLOを率いて武装闘争を進め、のちにイスラエルとオスロ合意を結んだ","共和国の初代大統領として、カリフ制の廃止やローマ字の採用を進めた"],"e":"自由将校団はナギブを表の指導者として1952年に王政を倒し、翌年ナギブが初代大統領となりましたが、実権を握ったナセルが彼を退け、1956年に大統領となりました。ナセルは同年スエズ運河の国有化を宣言し、英・仏・イスラエルが出兵した第2次中東戦争（スエズ戦争）では、米ソや国際世論の非難で3国が撤退したため、政治的に勝利しました。石油国有化はイランのモサッデグ、オスロ合意はPLOのアラファト、カリフ制廃止と文字改革はトルコのムスタファ＝ケマルです。","m":"ナセル＝スエズ運河国有化（1956）"},{"id":71,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問49","f":"20世紀の世界（恐慌・冷戦）","t":"イラン＝イスラーム革命","y":1979,"q":"1979年のイラン＝イスラーム革命によって倒された王朝はどれですか。","c":["パフレヴィー朝","カージャール朝","サファヴィー朝","ムハンマド＝アリー朝"],"e":"パフレヴィー朝は1925年にレザー＝ハーンが開いた王朝で、国王パフレヴィー2世は「白色革命」と呼ばれる上からの近代化を進めましたが、1979年にホメイニを指導者とする革命で倒されました。この革命は第2次石油危機を招きました。カージャール朝はパフレヴィー朝の前のイランの王朝、サファヴィー朝は16〜18世紀のイランの王朝、ムハンマド＝アリー朝はエジプトの王朝です。","m":"1979ホメイニ革命→パフレヴィー朝滅亡"},{"id":72,"k":"past","ref":"2025年度 経済学部A個別第1期 Ⅳ 問50","f":"20世紀の世界（恐慌・冷戦）","t":"冷戦期の各国の動き","y":1970,"q":"冷戦期について述べた次の文ⅰ〜ⅲのうち、誤っているものをすべて選んだものはどれですか。\nⅰ ルーマニアはワルシャワ条約機構の一員だったが、1968年のチェコスロヴァキアへの出兵には兵を出さなかった。\nⅱ 韓国は、北ベトナム（ベトナム民主共和国）の側に立ってベトナム戦争に部隊を送った。\nⅲ イランとイラクの戦争の際、アメリカはイラク側に肩入れした。","c":["ⅱのみ","ⅰのみ","ⅲのみ","ⅰとⅲ"],"e":"韓国は朴正煕政権のもとで、アメリカが支援する南ベトナム（ベトナム共和国）側に立って派兵したので、ⅱが誤りです。ルーマニアのチャウシェスクはソ連と距離をおく独自路線をとり、1968年の軍事介入に参加しませんでした。イラン＝イラク戦争（1980〜88年）では、革命後のイランと対立したアメリカがイラクのフセイン政権を支援しました。","m":"韓国は南ベトナム側で派兵"},{"id":73,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"インダス文明","y":-2300,"q":"前2600年ごろからインダス川流域で栄えたインダス文明について述べた文として正しいものはどれですか。","c":["焼き煉瓦を使った計画的な都市がつくられ、排水溝などが整備された","インダス文字は解読され、王の名や系譜が明らかになっている","鉄製の農具が普及し、その生産力をもとに都市が発達した","ガンジス川流域を中心に栄え、ハラッパーがその代表的な遺跡である"],"e":"インダス文明（前2600〜前1800年ごろ）はインダス川流域で栄え、モエンジョ＝ダーロやハラッパーでは焼き煉瓦の建物や沐浴場、排水溝を備えた計画都市がつくられました。印章に刻まれたインダス文字は未解読です。青銅器の文明で、鉄器が広まるのはアーリヤ人がガンジス川流域へ進出した前1000年ごろ以降です。","m":"インダス＝計画都市・焼き煉瓦・未解読文字"},{"id":74,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"アーリヤ人の社会","y":-1000,"q":"前1500年ごろからインドに進出したアーリヤ人の社会について述べた文として正しいものはどれですか。正しいものがない場合は「あてはまるものがない」を選びなさい。","c":["ヴァルナ制では、王侯・武士のクシャトリヤが最上位におかれた","アーリヤ人はデカン高原から北上して、パンジャーブ地方に定住した","最古のヴェーダは『マハーバーラタ』で、神々への讃歌を集めたものである","あてはまるものがない"],"e":"アーリヤ人は中央アジアから北西部のパンジャーブ地方に進入し、のちにガンジス川流域へ移りました。ヴァルナ制ではバラモン（司祭）が最上位で、クシャトリヤ（王侯・武士）、ヴァイシャ（農牧民・商人）、シュードラ（隷属民）と続きます。最古のヴェーダは『リグ＝ヴェーダ』で、『マハーバーラタ』は後代の叙事詩です。したがって正しい文はありません。","m":"バラモン＞クシャトリヤ＞ヴァイシャ＞シュードラ","last":true,"a":3},{"id":75,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"仏教とジャイナ教","y":-500,"q":"前6〜前5世紀ごろのインドの宗教について述べた次の文ⅰ・ⅱの正誤の組み合わせとして正しいものはどれですか。\nⅰ ヴァルダマーナはジャイナ教を開き、不殺生や苦行を重んじた。\nⅱ 仏教やジャイナ教は、バラモンの権威を支える教えとして司祭階層に広く支持された。","c":["ⅰ 正　ⅱ 誤","ⅰ 正　ⅱ 正","ⅰ 誤　ⅱ 正","ⅰ 誤　ⅱ 誤"],"e":"都市国家が成長したこの時代、ガウタマ＝シッダールタ（ブッダ）が仏教を、ヴァルダマーナがジャイナ教を開きました。どちらもヴァルナ制やバラモンの祭式中心の教えを否定したため、ⅱは誤りです。仏教はクシャトリヤに、ジャイナ教は不殺生の教えから特にヴァイシャ（商人）に支持されました。","m":"仏教・ジャイナ教＝バラモン否定、クシャトリヤ・ヴァイシャが支持"},{"id":76,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"アショーカ王","y":-260,"q":"マウリヤ朝のアショーカ王について述べた文として正しいものはどれですか。","c":["ダルマ（法）による統治をめざし、その理念を磨崖碑や石柱碑に刻ませた","プルシャプラを都とし、大乗仏教を保護した","ヒンドゥー教を国教とし、仏教を厳しく弾圧した","イラン系の人々を率いて、北西インドにクシャーナ朝を建てた"],"e":"アショーカ王（前3世紀）はカリンガ征服の悲惨さを機に仏教に帰依し、ダルマにもとづく政治を行い、仏典の結集やスリランカへの布教も行ったと伝えられます。プルシャプラを都として大乗仏教を保護したのはクシャーナ朝のカニシカ王です。アショーカ王は仏教を保護した王で、弾圧はしていません。クシャーナ朝は1世紀にイラン系のクシャーン人が建てた王朝です。","m":"アショーカ＝ダルマ・磨崖碑・石柱碑"},{"id":77,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"ガンダーラ美術","y":150,"q":"クシャーナ朝の時代に栄えたガンダーラ美術について述べた文として正しいものはどれですか。","c":["ヘレニズムの影響を受け、ギリシア彫刻風の仏像が多くつくられた","純インド的な様式が完成し、アジャンター石窟寺院の壁画が描かれた","仏陀の姿は表されず、法輪や菩提樹などで象徴的に示された","イスラーム建築の影響を受け、ドームとミナレットをもつ寺院が建てられた"],"e":"ガンダーラ地方（現在のパキスタン北西部）では、アレクサンドロス大王の遠征以来のヘレニズム文化の影響を受け、ギリシア風の容貌や衣のひだをもつ仏像がつくられました。純インド的なグプタ様式やアジャンター石窟の壁画はグプタ朝時代のものです。仏陀を象徴で表したのはガンダーラ美術より前の初期の仏教美術です。イスラーム建築はずっと後の時代です。","m":"ガンダーラ＝ヘレニズム風の仏像（クシャーナ朝）"},{"id":78,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"上座部仏教の伝播","y":100,"q":"インドで生まれた仏教のうち、上座部仏教がおもに広まった地域として最も適当なものはどれですか。","c":["スリランカ・ビルマ（ミャンマー）・タイ","中央アジア・中国・朝鮮・日本","チベット・モンゴル","アラビア半島・北アフリカ"],"e":"上座部仏教は出家者自身の修行による解脱を重んじる教えで、アショーカ王の時代にスリランカに伝わり、そこからビルマやタイなど東南アジア大陸部に広まりました。大乗仏教は菩薩信仰を中心に広く人々の救済を説き、中央アジアを経て中国・朝鮮・日本へ伝わりました。チベットやモンゴルにはチベット仏教が広まりました。","m":"南伝＝上座部（スリランカ・東南ア）、北伝＝大乗"},{"id":79,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"グプタ朝の文化","y":400,"q":"4世紀に成立したグプタ朝の時代の文化について述べた文として正しいものはどれですか。","c":["カーリダーサがサンスクリット語で戯曲『シャクンタラー』を著した","ヘレニズムの影響を受けたガンダーラ美術が生まれた","ペルシア語とインドの言語が混ざったウルドゥー語が成立した","王が仏教を保護し、第3回の仏典結集が行われた"],"e":"グプタ朝ではサンスクリット語が公用語とされ、宮廷詩人カーリダーサが『シャクンタラー』を著しました。『マハーバーラタ』『ラーマーヤナ』の二大叙事詩がほぼ現在の形にまとまり、ヒンドゥー教が定着しました。ガンダーラ美術はクシャーナ朝、ウルドゥー語はムガル帝国の時代、第3回仏典結集はアショーカ王の時代とされます。","m":"グプタ＝サンスクリット・シャクンタラー・ヒンドゥー教"},{"id":80,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"ハルシャ王と玄奘","y":630,"q":"7世紀前半に北インドを統一したハルシャ王（ハルシャ＝ヴァルダナ）の時代にインドを訪れた中国の僧と、その旅行記の組み合わせとして正しいものはどれですか。","c":["玄奘 ― 『大唐西域記』","法顕 ― 『大唐西域記』","義浄 ― 『仏国記』","法顕 ― 『南海寄帰内法伝』"],"e":"唐の玄奘は陸路でインドに行き、ナーランダー僧院で学んでハルシャ王の厚遇を受け、帰国後に『大唐西域記』を著しました。東晋の法顕はグプタ朝時代に訪れて『仏国記』を、唐の義浄は7世紀後半に海路で訪れて『南海寄帰内法伝』を著しました。僧と書名、訪れた時代の対応を整理しておきましょう。","m":"法顕＝仏国記、玄奘＝大唐西域記、義浄＝南海寄帰内法伝"},{"id":81,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"七年戦争と植民地課税","y":1763,"q":"1763年のパリ条約で終結し、イギリスが北アメリカのフランス領を獲得した一方、戦費による財政難から植民地への課税強化を招いた戦争はどれですか。","c":["フレンチ＝インディアン戦争","スペイン継承戦争","オーストリア継承戦争","アメリカ＝イギリス戦争（米英戦争）"],"e":"ヨーロッパの七年戦争と並行して北アメリカで戦われたフレンチ＝インディアン戦争に勝ったイギリスは、1763年のパリ条約でカナダやミシシッピ川以東のルイジアナを獲得しました。しかし巨額の戦費で財政が悪化し、本国は植民地への課税や統制を強め、独立運動の背景となりました。スペイン継承戦争とオーストリア継承戦争はそれ以前、米英戦争は独立後の1812年に始まった戦争です。","m":"七年戦争の勝利→財政難→植民地課税"},{"id":82,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"印紙法への反発","y":1765,"q":"1765年、イギリス本国が北アメリカ植民地に印紙法を課したとき、植民地側が反対のよりどころとして掲げた主張はどれですか。","c":["代表なくして課税なし","自由・平等・友愛","万国の労働者よ、団結せよ","国王は君臨すれども統治せず"],"e":"植民地はイギリス議会に代表を送っていなかったため、本国議会が一方的に課税するのは不当だとして「代表なくして課税なし」と主張し、印紙法は翌年撤廃されました。「自由・平等・友愛」はフランス革命に由来する標語、「万国の労働者よ、団結せよ」は『共産党宣言』の言葉、「国王は君臨すれども統治せず」はイギリスの議院内閣制を表す言葉です。","m":"印紙法→「代表なくして課税なし」"},{"id":83,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"アメリカ独立戦争の経過","y":1778,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア ヨークタウンの戦いで植民地側が勝利した。\nイ 大陸会議が独立宣言を発表した。\nウ レキシントン・コンコードで本国軍と植民地民兵が衝突した。\nエ パリ条約でイギリスがアメリカの独立を承認した。","c":["ウ→イ→ア→エ","イ→ウ→ア→エ","ウ→ア→イ→エ","イ→ア→ウ→エ"],"e":"1773年のボストン茶会事件のあと、1775年にレキシントン・コンコードの戦いで独立戦争が始まり、ワシントンが植民地軍の総司令官となりました。1776年7月4日に独立宣言が発表され、1781年のヨークタウンの戦いで植民地側の勝利が決定的となり、1783年のパリ条約でイギリスは独立を承認しました。","m":"1775開戦→1776宣言→1781ヨークタウン→1783承認"},{"id":84,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"独立戦争と国際情勢","y":1780,"q":"アメリカ独立戦争中の国際情勢について述べた文として正しいものはどれですか。","c":["ロシアのエカチェリーナ2世が武装中立同盟を提唱し、イギリスを外交的に孤立させた","フランスはイギリスと同盟し、植民地側と戦った","スペインはイギリス側に立って参戦し、フロリダを失った","プロイセン王が派遣したラ＝ファイエットが植民地側で戦った"],"e":"フランス（1778年）とスペイン（1779年）は植民地側に立って参戦し、ロシアのエカチェリーナ2世は1780年に武装中立同盟を提唱してイギリスの海上封鎖に対抗し、イギリスは国際的に孤立しました。フランスのラ＝ファイエットやポーランドのコシューシコらは義勇兵として植民地側で戦いました。スペインはこの戦争の結果フロリダを獲得しています。","m":"仏・西が参戦、露が武装中立同盟"},{"id":85,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"独立宣言と合衆国憲法","y":1787,"q":"アメリカ合衆国の建国について述べた次の文ⅰ・ⅱの正誤の組み合わせとして正しいものはどれですか。\nⅰ 独立宣言はトマス＝ジェファソンらが起草し、ロックの思想の影響を受けて基本的人権や抵抗権をうたった。\nⅱ 1787年に制定された合衆国憲法のもとで、フランクリンが初代大統領に就任した。","c":["ⅰ 正　ⅱ 誤","ⅰ 正　ⅱ 正","ⅰ 誤　ⅱ 正","ⅰ 誤　ⅱ 誤"],"e":"独立宣言はジェファソンらが起草し、ロックの社会契約説の影響のもと、生命・自由・幸福追求の権利と圧政への抵抗権をうたいました。1787年の合衆国憲法は人民主権・連邦主義・三権分立を原則とし、1789年にワシントンが初代大統領に就任しました。フランクリンは独立宣言の起草委員の一人で、フランスとの同盟締結に尽力した人物なので、ⅱは誤りです。","m":"宣言＝ジェファソン、初代大統領＝ワシントン"},{"id":86,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ラテンアメリカの独立","y":1810,"q":"アメリカ独立やフランス革命の影響を受けたラテンアメリカの独立について述べた文として正しいものはどれですか。","c":["フランス領サン＝ドマングで黒人奴隷が蜂起し、ハイチが最初の黒人共和国として独立した","ブラジルはスペインから独立し、当初から共和政をとった","シモン＝ボリバルはメキシコの独立運動を指導した","アメリカのモンロー大統領は、ヨーロッパ諸国による独立運動への干渉を支持した"],"e":"トゥサン＝ルヴェルチュールらの指導した反乱を経て、ハイチは1804年に独立しました。ブラジルはポルトガルの王子を皇帝として1822年に帝国として独立しました。シモン＝ボリバルはベネズエラやコロンビアなど南アメリカ北部の独立を指導し、メキシコの独立運動は司祭イダルゴが始めました。1823年のモンロー宣言は、ヨーロッパとアメリカ大陸の相互不干渉を唱え、ヨーロッパの干渉に反対したものです。","m":"1804ハイチ（トゥサン）、1823モンロー宣言"},{"id":87,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"南京条約の開港地","y":1842,"q":"アヘン戦争後の1842年に結ばれた南京条約で開港された5港に含まれない都市はどれですか。","c":["天津","上海","寧波","厦門"],"e":"南京条約では香港島の割譲と、広州・厦門・福州・寧波・上海の5港の開港、公行の廃止などが定められました。いずれも華南・華中の沿岸の港です。天津は北京に近い華北の港で、アロー戦争後の1860年の北京条約で開港されました。上海は長江の河口近くに位置し、のちに租界がおかれて中国最大の貿易港に成長しました。","m":"南京条約の5港＝広州・厦門・福州・寧波・上海"},{"id":88,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"北京条約とロシア","y":1860,"q":"アロー戦争の講和を仲介した見返りとして、ロシアが1860年の北京条約で清から獲得した地域はどれですか。","c":["ウスリー川以東の沿海州","アムール川（黒竜江）以北の地","イリ地方","遼東半島南部の旅順・大連"],"e":"ロシアは1858年のアイグン条約でアムール川以北を獲得し、1860年の北京条約で沿海州を得て、ウラジヴォストークを建設して太平洋進出の拠点としました。イリ地方は1881年のイリ条約で大部分が清に返還され、旅順・大連は1898年にロシアが租借しました。地名と条約を地図上の位置とあわせて押さえることが大切です。","m":"1858アイグン（アムール以北）→1860北京（沿海州）"},{"id":89,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"太平天国","y":1853,"q":"19世紀半ばの清でおこった太平天国について述べた文として正しいものはどれですか。","c":["洪秀全が上帝会を組織して挙兵し、南京を天京と改めて都とした","北京を占領して、清朝を一時滅亡させた","白蓮教の教えをもとに「扶清滅洋」をかかげた","清の正規軍である八旗が中心となって鎮圧した"],"e":"洪秀全はキリスト教の影響を受けて上帝会を組織し、1851年に挙兵して太平天国を建て、1853年に南京を占領して天京と名づけました。「滅満興漢」を唱え、天朝田畝制度を発表しました。北京は占領していません。鎮圧の主力は曾国藩の湘軍や李鴻章の淮軍などの郷勇と、ゴードンらの常勝軍でした。「扶清滅洋」は義和団のスローガンです。","m":"太平天国＝洪秀全・天京・滅満興漢、鎮圧は郷勇"},{"id":90,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"洋務運動","y":1870,"q":"太平天国の鎮圧で活躍した曾国藩や李鴻章らが進めた洋務運動の考え方を表す言葉はどれですか。","c":["中体西用","扶清滅洋","滅満興漢","三民主義"],"e":"洋務運動は、中国の伝統的な制度や儒教道徳（中体）を守りつつ、西洋の軍事技術や工業（西用）を取り入れる改革で、兵器工場や造船所の建設、鉱山の開発などが進められました。しかし政治制度の改革は行われず、清仏戦争や日清戦争の敗北で限界が明らかになりました。扶清滅洋は義和団、滅満興漢は太平天国、三民主義は孫文の主張です。","m":"洋務運動＝中体西用（技術だけ取り入れる）"},{"id":91,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"日清修好条規","y":1871,"q":"1871年に日本と清の間で結ばれた日清修好条規について述べた文として正しいものはどれですか。","c":["互いに領事裁判権を認め合う、対等な内容の条約であった","清が日本に一方的に領事裁判権を認めた不平等条約であった","清はこの条約で、琉球が日本に帰属することを認めた","清はこの条約で、朝鮮が独立国であることを認めた"],"e":"日清修好条規は、相互に開港し領事裁判権を認め合う対等条約で、日本が近代に結んだ最初の対等条約とされます。琉球については、日本が1874年に台湾出兵を行い、1879年に沖縄県を設置しました（琉球処分）が、清は承認しませんでした。清が朝鮮の独立を認めたのは、日清戦争後の1895年の下関条約です。","m":"日清修好条規＝相互に領事裁判権を認める対等条約"},{"id":92,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"東アジア国際関係の順序","y":1880,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア 朝鮮で甲午農民戦争がおこった。\nイ 日本が台湾に出兵した。\nウ 江華島事件がおこった。\nエ 清とロシアがイリ条約を結んだ。","c":["イ→ウ→エ→ア","ウ→イ→エ→ア","イ→エ→ウ→ア","ウ→エ→イ→ア"],"e":"台湾出兵は1874年、江華島事件は1875年（翌年に日朝修好条規）、イリ条約は1881年、甲午農民戦争は1894年で、これが日清戦争のきっかけとなりました。1870〜90年代の東アジアでは、日本の進出、ロシアの南下、清の宗主権の後退が並行して進んだことを押さえましょう。","m":"1874台湾出兵→1875江華島→1881イリ→1894甲午"},{"id":93,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"三国干渉","y":1895,"q":"日清戦争の講和条約である下関条約の調印後、日本に遼東半島の返還を求めた三国干渉を行った国の組み合わせとして正しいものはどれですか。","c":["ロシア・フランス・ドイツ","ロシア・イギリス・ドイツ","ロシア・フランス・アメリカ","イギリス・フランス・ドイツ"],"e":"1895年の下関条約で清は朝鮮の独立を認め、遼東半島・台湾・澎湖諸島を日本に割譲し、賠償金2億両を支払うことになりました。しかし南下政策を進めるロシアがフランス・ドイツを誘って遼東半島の返還を求め、日本はこれを受け入れました。その後ロシアは旅順・大連を租借し、列強による中国分割が進みました。","m":"三国干渉＝露・仏・独"},{"id":94,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"世界恐慌の発端","y":1929,"q":"1929年10月、世界恐慌の発端となった株価の大暴落がおこった場所はどこですか。","c":["ニューヨークのウォール街","ロンドンのシティ","ウィーン","ベルリン"],"e":"1929年10月24日（「暗黒の木曜日」）、ニューヨークのウォール街にある証券取引所で株価が暴落し、アメリカの恐慌が始まりました。アメリカ資本の引き揚げによって恐慌はヨーロッパにも広がり、1931年にはウィーンの大銀行クレディト＝アンシュタルトが破綻して、ドイツなど中欧の金融危機が深刻化しました。","m":"1929暗黒の木曜日＝ウォール街"},{"id":95,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"フーヴァー＝モラトリアム","y":1931,"q":"1931年、ドイツの賠償と連合国の戦債の支払いを1年間停止する措置を発表したアメリカ大統領は誰ですか。","c":["フーヴァー","フランクリン＝ローズヴェルト","クーリッジ","ウィルソン"],"e":"1931年、共和党のフーヴァー大統領は、賠償と戦債の支払いを1年間停止するフーヴァー＝モラトリアムを発表しましたが、恐慌を食い止めることはできませんでした。フランクリン＝ローズヴェルトは1933年に大統領となりニューディールを進めた人物、クーリッジは1920年代の繁栄期の大統領、ウィルソンは第一次世界大戦期の大統領です。","m":"1931フーヴァー＝モラトリアム（支払い1年猶予）"},{"id":96,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ニューディール","y":1933,"q":"アメリカのフランクリン＝ローズヴェルト政権が進めたニューディールについて述べた文として正しいものはどれですか。","c":["テネシー川流域開発公社（TVA）を設立し、公共事業で雇用を生み出した","農業調整法（AAA）で農産物の増産を奨励し、価格を引き下げた","ワグナー法で労働者の団結権・団体交渉権を否定した","金本位制を強化し、通貨の発行量を厳しく制限した"],"e":"ニューディールでは、TVAなどの公共事業による失業者の救済、農業調整法による生産制限と農産物価格の引き上げ、全国産業復興法による産業統制が行われました。1935年のワグナー法は、労働者の団結権と団体交渉権を認めたものです。アメリカは1933年に金本位制から離脱し、管理通貨制度に移りました。","m":"ニューディール＝TVA・AAA・NIRA・ワグナー法"},{"id":97,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"オタワ連邦会議","y":1932,"q":"1932年にイギリスがオタワで開いたイギリス連邦経済会議で決められた内容として最も適当なものはどれですか。","c":["連邦内の関税を低くし、連邦外の国の商品には高い関税をかける特恵関税制度をつくった","金本位制に復帰し、ポンドの価値を戦前の水準に戻した","関税を全廃し、世界的な自由貿易の拡大を主導した","ドイツの賠償金を大幅に減額することを決めた"],"e":"イギリスはマクドナルドの挙国一致内閣のもとで1931年に金本位制を停止し、1932年のオタワ連邦会議で連邦内に特恵関税制度を設けて、スターリング＝ブロック（ポンド＝ブロック）を形成しました。金本位制への復帰は1925年のことです。賠償金の大幅な減額は、同じ1932年のローザンヌ会議で決まりました。","m":"オタワ会議＝特恵関税→スターリング＝ブロック"},{"id":98,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ソ連の国際連盟加盟の時期","y":1934,"q":"年表「1929年 世界恐慌が始まる／1931年 満洲事変がおこる／1933年 ヒトラーが首相に就任する／1935年 イタリアがエチオピアに侵攻する」について、ソ連が国際連盟に加盟した時期として正しいものはどれですか。","c":["ヒトラーの首相就任とイタリアのエチオピア侵攻の間","世界恐慌の開始と満洲事変の間","満洲事変とヒトラーの首相就任の間","イタリアのエチオピア侵攻より後"],"e":"日本とドイツが1933年に国際連盟からの脱退を通告したのち、ソ連は1934年に国際連盟に加盟して常任理事国となりました。ナチス＝ドイツの台頭に対抗するため、コミンテルンも1935年に人民戦線戦術を採用しています。イタリアは1935年にエチオピアに侵攻して翌年併合しましたが、国際連盟の経済制裁は効果をあげませんでした。","m":"1933日独脱退→1934ソ連加盟"},{"id":99,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"ナチス＝ドイツの膨張の順序","y":1936,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア ドイツがオーストリアを併合した。\nイ ドイツが再軍備を宣言した。\nウ ドイツが国際連盟を脱退した。\nエ ドイツ軍がラインラントに進駐した。","c":["ウ→イ→エ→ア","イ→ウ→エ→ア","ウ→エ→イ→ア","ウ→イ→ア→エ"],"e":"ナチス＝ドイツは1933年に国際連盟を脱退し、1935年にザール地方を編入して再軍備を宣言、1936年にロカルノ条約を破棄してラインラントに進駐しました。1938年にはオーストリアを併合し、同年のミュンヘン会談でズデーテン地方を獲得しました。イギリス・フランスはこの時期、宥和政策をとっていました。","m":"33脱退→35再軍備→36ラインラント→38墺併合"},{"id":100,"k":"plan","ref":"想定問題","f":"20世紀の世界（恐慌・冷戦）","t":"世界恐慌期のソ連","y":1930,"q":"世界恐慌期のソ連について述べた文として正しいものはどれですか。正しいものがない場合は「あてはまるものがない」を選びなさい。","c":["スターリンの指導のもとで五か年計画が進められ、恐慌の影響をあまり受けなかった","恐慌への対策として、市場経済を一部認める新経済政策（ネップ）を始めた","ドーズ案によってアメリカ資本を受け入れ、経済を立て直した","あてはまるものがない"],"e":"ソ連は1928年から第1次五か年計画を実施し、重工業化と農業の集団化を強引に進めました。資本主義国との経済的な結びつきが小さかったため恐慌の影響をあまり受けず、計画経済は各国の注目を集めました。ネップはレーニンの時代の1921年に始まった政策、ドーズ案（1924年）はドイツの賠償支払いを助けるための案です。","m":"恐慌期のソ連＝五か年計画で影響小","last":true},{"id":101,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"武帝の財政政策","y":-115,"q":"前漢の武帝は、匈奴との戦争や大規模な土木工事で苦しくなった財政を立て直そうとしました。そのために行った政策として最も適当なものはどれですか。","c":["塩・鉄を専売とし、均輸・平準を行って物価の調整と財源の確保をはかった","所有する土地や資産に応じて、夏と秋の2回に課税する両税法を施行した","各種の税や労役を銀でまとめて納めさせる一条鞭法を導入した","農民に低い利子で資金や穀物を貸し付ける青苗法を実施した"],"e":"武帝は塩・鉄（のちに酒も）を国家の専売とし、物資を各地に移して売る均輸、物価が安いときに買い高いときに売る平準を行って財源を確保しました。両税法は唐の楊炎（780年）、一条鞭法は明代、青苗法は北宋の王安石の新法で、いずれも時代が異なります。","m":"武帝の財政＝塩・鉄専売＋均輸・平準"},{"id":102,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"張騫の派遣","y":-139,"q":"前漢の武帝は、匈奴をはさみうちにする同盟を結ぶため、中央アジアの大月氏に使者を送りました。同盟は実現しませんでしたが、この使者の旅によって西域の事情が中国に伝わりました。この使者は誰ですか。","c":["張騫","班超","甘英","衛青"],"e":"大月氏に派遣されたのは張騫です。同盟は成立しませんでしたが、西域の情報がもたらされ、のちの西域経営の基礎となりました。班超は後漢の西域都護、甘英は班超が大秦（ローマ）に派遣した部下、衛青は武帝の時代に匈奴と戦った将軍で、いずれも大月氏への使者ではありません。","m":"大月氏へ＝張騫（前漢・武帝）、西域都護＝班超（後漢）"},{"id":103,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"王莽と新","y":8,"q":"前漢の外戚であった王莽が帝位を奪って建てた新について述べた文として最も適当なものはどれですか。","c":["周の時代の制度を理想とする復古的な政治を行ったが、社会が混乱し、赤眉の乱などの反乱のなかで短い期間で滅んだ","劉秀（光武帝）が建てた王朝で、洛陽を都とした","宦官と外戚の争いが激しく、党錮の禁によって多くの官僚が弾圧された","太平道の張角が率いた黄巾の乱によって滅亡した"],"e":"王莽は8年に新を建て、周の制度を理想とする復古的な政策を進めましたが、現実に合わず社会が混乱し、赤眉の乱などの反乱がおこって23年に滅びました。その後、劉秀（光武帝）が漢を再興して洛陽に都をおきました（後漢）。党錮の禁と黄巾の乱は、いずれも後漢の出来事です。","m":"新（王莽）＝周を理想の復古政治→赤眉の乱で滅亡"},{"id":104,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"黄巾の乱","y":184,"q":"後漢の末期の184年におこった黄巾の乱は、ある宗教結社の指導者が率いた農民反乱でした。この宗教結社として最も適当なものはどれですか。","c":["太平道","五斗米道","白蓮教","拝上帝会"],"e":"黄巾の乱は、張角が始めた太平道の信徒が黄色い頭巾を目印に蜂起した反乱で、後漢が衰えるきっかけとなりました。五斗米道は同じころ張陵が始めた宗教結社で、のちの道教のもとの一つです。白蓮教は元末の紅巾の乱や清代の反乱、拝上帝会は清末の太平天国にかかわる結社です。","m":"黄巾の乱（184）＝張角の太平道"},{"id":105,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"『史記』","y":-91,"q":"前漢の司馬遷が著した『史記』について述べた文として最も適当なものはどれですか。","c":["伝説上の帝王から武帝の時代までを、本紀・列伝などに分けて記す紀伝体で書かれた","出来事を年代順に記す編年体で書かれ、北宋の時代にまとめられた","前漢一代の歴史だけを扱う断代史として書かれた","唐の太宗の命令により、国家事業として編纂された"],"e":"『史記』は、伝説上の黄帝から前漢の武帝の時代までを、帝王の記録である本紀や人物の伝記である列伝などに分けて記した紀伝体の歴史書で、のちの正史の形式の手本となりました。編年体で北宋にまとめられたのは司馬光の『資治通鑑』、前漢一代の断代史は後漢の班固の『漢書』です。","m":"史記＝司馬遷・紀伝体／漢書＝班固・断代史"},{"id":106,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"九品中正","y":220,"q":"三国の魏で始められた官吏登用法で、地方におかれた中正官が人物を9等級に評定して中央に推薦するしくみを何といいますか。","c":["九品中正","郷挙里選","科挙","屯田制"],"e":"魏の文帝（曹丕）が始めた九品中正は、中正官が人材を9等級に分けて推薦する制度でしたが、実際には有力な豪族の子弟が高い等級を独占し、門閥貴族が形成される原因となりました。郷挙里選は前漢の、地方長官が人材を推薦する制度、科挙は隋で始まった試験による登用法、屯田制は魏が行った土地制度です。","m":"九品中正（魏）→豪族が上位独占→門閥貴族"},{"id":107,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"北魏の孝文帝","y":494,"q":"5世紀後半、北魏の孝文帝が行った政策として最も適当なものはどれですか。","c":["均田制を施行し、また平城から洛陽に都を移して漢化政策を進めた","陳を滅ぼして南北を統一し、学科試験による官吏登用を始めた","大運河を完成させて、華北と江南を結んだ","租調庸制と府兵制を整え、律令にもとづく国家体制を完成させた"],"e":"鮮卑の拓跋氏が建てた北魏では、孝文帝が485年に均田制を施行し、494年には平城から洛陽へ遷都して、鮮卑の服装や言語を改める漢化政策を進めました。陳を滅ぼして統一し科挙を始めたのは隋の文帝、大運河を完成させたのは隋の煬帝、租調庸制・府兵制を整えて律令国家を完成させたのは唐です。","m":"孝文帝＝均田制＋洛陽遷都＋漢化政策"},{"id":108,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"六朝文化の人物","y":350,"q":"東晋・南朝を中心に栄えた六朝文化の人物と、その活躍した分野・作品の組み合わせとして正しいものはどれですか。","c":["王羲之 ― 書道","顧愷之 ― 詩文（「帰去来辞」）","陶淵明 ― 絵画（「女史箴図」）","昭明太子 ― 書道"],"e":"東晋の王羲之は書道で名高く「書聖」と呼ばれます。「女史箴図」の作者とされるのは東晋の画家顧愷之、「帰去来辞」を書いたのは田園詩人の陶淵明です。梁の昭明太子は、古今の名文を集めた『文選』を編集した人物です。人物と分野が入れかわっていないかに注意しましょう。","m":"書＝王羲之、画＝顧愷之、詩＝陶淵明、文選＝昭明太子"},{"id":109,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"鳩摩羅什","y":401,"q":"西域の亀茲（クチャ）出身の僧で、5世紀初めに長安に迎えられ、多くの仏典を漢語に翻訳した人物は誰ですか。","c":["鳩摩羅什","仏図澄","法顕","義浄"],"e":"鳩摩羅什は亀茲出身の僧で、401年に後秦の長安に迎えられ、多くの大乗仏典を漢訳して中国の仏教の発展に大きな役割を果たしました。仏図澄は4世紀に華北（後趙）で布教した西域出身の僧で、仏典の翻訳者としては知られていません。法顕は東晋の僧でグプタ朝のインドを訪れ、義浄は唐の僧で海路でインドに赴きました。","m":"亀茲出身・長安で仏典漢訳＝鳩摩羅什"},{"id":110,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"隋の煬帝","y":610,"q":"隋の第2代皇帝である煬帝について述べた文として最も適当なものはどれですか。","c":["大運河を完成させて華北と江南を結んだが、高句麗遠征の失敗などから各地で反乱がおこった","陳を滅ぼして南北朝を統一し、学科試験による官吏登用（科挙）を始めた","突厥の援助を受けて挙兵し、長安を都とする新しい王朝を開いた","均田制を初めて施行し、都を平城から洛陽に移した"],"e":"煬帝は父の文帝のあとを継ぎ、華北と江南を結ぶ大運河を完成させましたが、土木工事や3度にわたる高句麗遠征の失敗で民衆の負担が重くなり、各地で反乱がおこって隋は滅びました。南北統一と科挙の開始は文帝、突厥の援助で挙兵して唐を建てたのは李淵（高祖）、均田制の施行と洛陽遷都は北魏の孝文帝です。","m":"煬帝＝大運河完成・高句麗遠征失敗→隋滅亡"},{"id":111,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"唐の三省","y":630,"q":"唐の中央官制の三省のうち、中書省が起草した詔勅を審議し、不適当と判断すれば差し戻すこともできた機関はどれですか。","c":["門下省","尚書省","御史台","枢密院"],"e":"唐の三省では、中書省が詔勅を起草し、門下省がそれを審議し、尚書省が六部（吏・戸・礼・兵・刑・工）を通じて執行しました。門下省には有力な貴族が多く、詔勅を差し戻す権限は貴族の力の表れでもありました。御史台は官吏を監察する機関、枢密院は五代・宋で軍事を担当した機関です。","m":"中書＝起草、門下＝審議、尚書＝執行（六部）"},{"id":112,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"両税法","y":780,"q":"唐の中期、均田制と租調庸制がくずれたため、780年に宰相楊炎の意見で新しい税制が採用されました。この税制の内容として最も適当なものはどれですか。","c":["現住地で、所有する土地や資産に応じて夏と秋の2回に課税した","成年男子に土地を均等に支給し、穀物・布・労役を負担させた","各種の税や労役を銀にまとめて納めさせた","人頭税にあたる丁税を土地税に組みこんで一本化した"],"e":"780年に施行された両税法は、本籍地ではなく現住地で、土地や資産の多さに応じて夏と秋の2回課税するもので、土地の私有を認める方向に転換したものでした。土地を支給して租調庸を負担させるのは均田制・租調庸制、銀でまとめて納めるのは明の一条鞭法、丁税を地税に組みこむのは清の地丁銀制です。","m":"両税法（780・楊炎）＝現住地・資産に応じ夏秋2回"},{"id":113,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"景教","y":781,"q":"唐の時代に中国に伝わり、「景教」と呼ばれた宗教はどれですか。","c":["キリスト教のネストリウス派","ゾロアスター教","マニ教","イスラーム"],"e":"景教はキリスト教のネストリウス派のことで、唐の長安には寺院が建てられ、781年には布教のようすを記した「大秦景教流行中国碑」が建てられました。唐ではほかに、ゾロアスター教が「祆教」、マニ教が「摩尼教」と呼ばれ、イラン系の人々などに信仰されました。イスラームは中国では「回教」「清真教」などと呼ばれました。","m":"景教＝ネストリウス派、祆教＝ゾロアスター教"},{"id":114,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"サータヴァーハナ朝","y":100,"q":"前1世紀ごろからデカン高原を中心に栄えたドラヴィダ系の王朝で、季節風を利用したローマとの海上交易によって繁栄した王朝はどれですか。","c":["サータヴァーハナ朝","チョーラ朝","ヴァルダナ朝","パーラ朝"],"e":"サータヴァーハナ朝はデカン高原を中心に栄えたドラヴィダ系の王朝で、季節風（モンスーン）を利用したローマとの交易で栄え、インド各地からはローマの金貨が出土しています。チョーラ朝は南インドで9〜13世紀に栄え、東南アジアに遠征した王朝、ヴァルダナ朝は7世紀にハルシャ王が北インドに建てた王朝、パーラ朝はベンガル地方の仏教を保護した王朝です。","m":"デカン高原・ローマと季節風交易＝サータヴァーハナ朝"},{"id":115,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"ナーランダー僧院","y":450,"q":"グプタ朝の時代に北インドに建てられた仏教の教学の中心で、7世紀には唐の玄奘や義浄も訪れて学んだ僧院はどれですか。","c":["ナーランダー僧院","サーンチーのストゥーパ","アジャンター石窟寺院","エローラ石窟寺院"],"e":"ナーランダー僧院はグプタ朝の5世紀に建てられ、仏教教学の最高学府として栄えました。玄奘や義浄もここで学んでいます。サーンチーのストゥーパ（仏塔）はマウリヤ朝のアショーカ王の時代に起源をもつ遺跡、アジャンター石窟寺院はグプタ様式の壁画で知られる石窟、エローラは仏教・ヒンドゥー教・ジャイナ教の石窟が並ぶ遺跡です。","m":"玄奘・義浄が学んだ＝ナーランダー僧院"},{"id":116,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"マウリヤ朝の創始","y":-317,"q":"アレクサンドロス大王が西北インドに侵入したのち、ガンジス川流域におこったマウリヤ朝の創始者と、その都の組み合わせとして正しいものはどれですか。","c":["チャンドラグプタ ― パータリプトラ","チャンドラグプタ ― プルシャプラ","カニシカ王 ― パータリプトラ","カニシカ王 ― プルシャプラ"],"e":"マウリヤ朝は前4世紀末にチャンドラグプタがナンダ朝を倒して建てた王朝で、都はガンジス川流域のパータリプトラです。カニシカ王は1〜2世紀に栄えたクシャーナ朝の最盛期の王で、都はガンダーラ地方のプルシャプラでした。王朝ごとに創始者・代表的な王と都をセットで覚えましょう。","m":"マウリヤ朝＝チャンドラグプタ・パータリプトラ"},{"id":117,"k":"plan","ref":"想定問題","f":"古代の中国・インド","t":"漢〜南北朝の出来事の順序","y":100,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア 太平道の信徒が黄巾の乱をおこした。\nイ 北魏が華北を統一した。\nウ 張騫が大月氏に派遣された。\nエ 王莽が新を建てた。","c":["ウ→エ→ア→イ","エ→ウ→ア→イ","ウ→エ→イ→ア","ウ→ア→エ→イ"],"e":"ウの張騫の派遣は前漢の武帝の時代（前139年ごろ）、エの新の建国は8年、アの黄巾の乱は後漢末の184年、イの北魏による華北統一は439年です。前漢→新→後漢→魏晋南北朝という王朝の流れに出来事を当てはめると、順序を確実に判断できます。","m":"前漢（張騫）→新（王莽）→後漢末（黄巾）→北魏統一"},{"id":118,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"リキニウス・セクスティウス法","y":-367,"q":"共和政ローマで前367年に定められたリキニウス・セクスティウス法の内容として最も適当なものはどれですか。","c":["2人のコンスル（執政官）のうち1人を平民から選ぶことを定めた","平民会の決議が元老院の承認なしに国法となることを定めた","それまでの慣習法を成文化し、貴族による法の独占を改めた","平民の権利を守るために、護民官と平民会を新たに設けた"],"e":"リキニウス・セクスティウス法は、コンスルの1人を平民から選ぶことや公有地の占有を制限することを定め、平民が最高官職につく道を開きました。平民会の決議を国法とするのは前287年のホルテンシウス法、慣習法の成文化は前5世紀半ばの十二表法、護民官と平民会の設置は前5世紀初めのことです。","m":"前367リキニウス・セクスティウス法＝コンスル1人を平民から"},{"id":119,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"独裁官","y":-500,"q":"共和政ローマで、戦争などの非常事態に任命され、半年を限度に全権をゆだねられた官職を何といいますか。","c":["独裁官（ディクタトル）","護民官","執政官（コンスル）","元首（プリンケプス）"],"e":"独裁官は非常時に元老院の求めでコンスルが任命し、任期は半年に限られていました。権力の集中を一時的なものにとどめるくふうです。護民官は平民を守るために設けられた官職、執政官（コンスル）は定員2名・任期1年の最高官職、元首（プリンケプス）は帝政初期の皇帝の呼び名です。のちにカエサルは終身の独裁官となり、共和政の伝統を破ったとして暗殺されました。","m":"非常時・任期半年の全権＝独裁官"},{"id":120,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"同盟市戦争","y":-89,"q":"前1世紀初め、ローマ市民権を求めるイタリア半島の同盟市が反乱をおこしました（同盟市戦争）。この戦争の結果として最も適当なものはどれですか。","c":["イタリア半島の自由民にローマ市民権が認められた","帝国内のすべての自由人にローマ市民権が与えられた","平民会の決議が国法と認められ、身分闘争が終わった","ガリアが征服され、ローマの属州となった"],"e":"同盟市戦争（前91〜前88年）の結果、ローマはイタリア半島の自由民に市民権を認めました。帝国内の全自由人に市民権を与えたのは212年のカラカラ帝、平民会の決議を国法としたのは前287年のホルテンシウス法、ガリアを征服したのは前1世紀半ばのカエサルです。「イタリア半島」と「帝国全体」の区別がポイントです。","m":"同盟市戦争→イタリア自由民に市民権、212年→帝国全自由人"},{"id":121,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"アクティウムの海戦","y":-31,"q":"前31年、オクタウィアヌスが、アントニウスとエジプトのクレオパトラの連合軍を破った戦いはどれですか。","c":["アクティウムの海戦","ザマの戦い","カンネーの戦い","サラミスの海戦"],"e":"アクティウムの海戦でオクタウィアヌスがアントニウスとクレオパトラを破り、翌年にはプトレマイオス朝エジプトが滅んで、内乱の1世紀が終わりました。ザマの戦いは第2回ポエニ戦争でスキピオがハンニバルを破った戦い、カンネーの戦いはハンニバルがローマ軍を破った戦い、サラミスの海戦はペルシア戦争でアテネなどがペルシアを破った戦いです。","m":"前31アクティウム→前30プトレマイオス朝滅亡"},{"id":122,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"元首政","y":-27,"q":"前27年に元老院からアウグストゥスの称号を受けたオクタウィアヌスが始めた統治のしかたの説明として最も適当なものはどれですか。","c":["元老院など共和政の制度を尊重し、自らは「市民のなかの第一人者（プリンケプス）」と称した","皇帝を神として崇拝させ、専制君主として統治するドミナトゥスを始めた","終身の独裁官となって権力を独占した","帝国を東西に分け、2人の子に分けて継がせた"],"e":"オクタウィアヌスは共和政の形を残しつつ、実際には多くの権限を一身に集めました。この統治を元首政（プリンキパトゥス）といいます。専制君主政（ドミナトゥス）は3世紀末のディオクレティアヌス帝が始めたもの、終身独裁官となったのはカエサル、帝国を東西に分けて2子に継がせたのは395年に没したテオドシウス帝です。","m":"元首政（アウグストゥス）→専制君主政（ディオクレティアヌス）"},{"id":123,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"カラカラ帝","y":212,"q":"212年、帝国内のすべての自由人にローマ市民権を与えた皇帝は誰ですか。","c":["カラカラ","トラヤヌス","ハドリアヌス","ネロ"],"e":"212年のカラカラ帝の勅令（アントニヌス勅令）により、帝国内の全自由人にローマ市民権が与えられ、ローマ市民と属州民の区別が法的にはなくなりました。トラヤヌス帝は帝国の領土を最大にした五賢帝の一人、ハドリアヌス帝はブリタニアに長城を築いた皇帝、ネロ帝はキリスト教徒を迫害した1世紀の皇帝です。","m":"212年・全自由人に市民権＝カラカラ帝"},{"id":124,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"ウァレリアヌス帝","y":260,"q":"3世紀の軍人皇帝時代、ササン朝のシャープール1世との戦いに敗れて捕虜となったローマ皇帝は誰ですか。","c":["ウァレリアヌス","ユリアヌス","ディオクレティアヌス","マルクス＝アウレリウス＝アントニヌス"],"e":"260年、ウァレリアヌス帝はエデッサの戦いでササン朝のシャープール1世に敗れて捕らえられ、ローマ帝国の混乱を象徴する出来事となりました。ユリアヌス帝は4世紀に伝統的な神々の信仰の復興をはかった皇帝で、ササン朝への遠征中に戦死しましたが捕虜にはなっていません。ディオクレティアヌス帝は軍人皇帝時代を収拾した皇帝、マルクス＝アウレリウス＝アントニヌスは五賢帝最後の皇帝です。","m":"シャープール1世に捕らえられた皇帝＝ウァレリアヌス"},{"id":125,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"コンスタンティノープル遷都","y":330,"q":"コンスタンティヌス帝が行ったこととして最も適当なものはどれですか。","c":["ビザンティウムに都を移してコンスタンティノープルと改め、ソリドゥス金貨を発行した","キリスト教を国教とし、ほかの宗教の信仰を禁止した","ブリタニアに長城を築き、北方からの侵入に備えた","キリスト教を捨てて、古来の神々の信仰の復興をはかった"],"e":"コンスタンティヌス帝は330年にビザンティウムへ遷都してコンスタンティノープルと改称し、ソリドゥス金貨を発行しました。キリスト教を国教とし異教を禁じたのは4世紀末のテオドシウス帝、ブリタニアに長城を築いたのは2世紀のハドリアヌス帝、古来の神々の信仰の復興をはかったのは「背教者」と呼ばれたユリアヌス帝です。","m":"コンスタンティヌス＝遷都（330）・ソリドゥス金貨"},{"id":126,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"アウグスティヌス","y":426,"q":"北アフリカのヒッポの司教で最大の教父とされ、『告白』を著したアウグスティヌスが、西ゴート人のローマ略奪をきっかけに書いた著作はどれですか。","c":["『神の国』","『神学大全』","『自省録』","『愚神礼賛』"],"e":"アウグスティヌスは、410年の西ゴート人によるローマ略奪をキリスト教のせいとする非難に反論するため『神の国』を著し、のちの西ヨーロッパの神学に大きな影響を与えました。『神学大全』は13世紀のトマス＝アクィナス、『自省録』はストア派の皇帝マルクス＝アウレリウス＝アントニヌス、『愚神礼賛』は16世紀の人文主義者エラスムスの著作です。","m":"最大の教父アウグスティヌス＝『告白』『神の国』"},{"id":127,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"フン人の西進","y":375,"q":"4世紀後半、西方へ移動してきたある民族に圧迫されて、西ゴート人がドナウ川を渡りローマ帝国領内に移住しました。この民族はどれですか。","c":["フン人","マジャール人","アヴァール人","ノルマン人"],"e":"アジア系のフン人が黒海北岸に進出して東ゴート人を支配し、圧迫を受けた西ゴート人が376年にドナウ川を渡ってローマ帝国領内に入りました。これがゲルマン人の大移動の始まりとされます。マジャール人は9〜10世紀に中部ヨーロッパに侵入し、アヴァール人は6〜8世紀に東ヨーロッパで勢力をふるい、ノルマン人は8世紀以降に海から各地に進出しました。","m":"フン人の西進（375ごろ）→西ゴート移動→大移動開始"},{"id":128,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"ビザンツ様式","y":537,"q":"コンスタンティノープルのハギア＝ソフィア聖堂などに見られるビザンツ様式の建築の特徴として最も適当なものはどれですか。","c":["大きなドーム（円屋根）と、内部をかざるモザイク壁画","高くそびえる尖塔と尖頭アーチ、色ガラスのステンドグラス","半円アーチと厚い石の壁、小さな窓","列柱と三角形の破風をもつ神殿風の正面"],"e":"ビザンツ様式は、大きなドームとモザイク壁画を特色とし、6世紀に再建されたハギア＝ソフィア聖堂やイタリアのラヴェンナのサン＝ヴィターレ聖堂が代表例です。尖塔・尖頭アーチ・ステンドグラスはゴシック様式、半円アーチと厚い壁・小さな窓はロマネスク様式、列柱と三角破風は古代ギリシアの神殿建築の特徴です。","m":"ビザンツ様式＝ドーム＋モザイク"},{"id":129,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"東西教会の分裂","y":1054,"q":"1054年におこった出来事として最も適当なものはどれですか。","c":["ローマ教皇とコンスタンティノープル総主教がたがいに破門し、キリスト教会が東西に分裂した","ビザンツ皇帝が聖像の崇拝を禁じる命令を出し、ローマ教会との対立が始まった","教皇ウルバヌス2世がクレルモン宗教会議で十字軍の派遣を提唱した","フランク王国のカールがローマ教皇から西ローマ皇帝の冠を受けた"],"e":"1054年、ローマ教皇とコンスタンティノープル総主教が相互に破門し、ローマ＝カトリック教会とギリシア正教会の分裂が決定的になりました。聖像禁止令は726年、クレルモン宗教会議は1095年、カールの戴冠は800年の出来事です。年代の近い出来事を、8世紀・9世紀・11世紀と整理しておくとよいでしょう。","m":"1054年＝東西教会の分裂（相互破門）"},{"id":130,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"ウラディミル1世","y":988,"q":"10世紀末、ギリシア正教に改宗してこれを国教とし、ビザンツ文化を取り入れたキエフ公国の君主は誰ですか。","c":["ウラディミル1世","リューリク","イヴァン3世","イヴァン4世"],"e":"キエフ公国のウラディミル1世は、988年ごろビザンツ皇帝の妹と結婚してギリシア正教に改宗し、これを国教としました。これ以後、ロシアにはビザンツ文化が広まりました。リューリクは9世紀にノヴゴロド国を建てたとされるノルマン人の首長、イヴァン3世とイヴァン4世はモスクワ大公国の君主です。","m":"キエフ公国の正教改宗＝ウラディミル1世"},{"id":131,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"スラヴ人の宗教","y":900,"q":"スラヴ人の民族と、おもに受け入れたキリスト教の宗派の組み合わせとして正しいものはどれですか。","c":["セルビア人 ― ギリシア正教","ポーランド人 ― ギリシア正教","ロシア人 ― ローマ＝カトリック","クロアティア人 ― ギリシア正教"],"e":"ビザンツ帝国の影響を強く受けたロシア人やセルビア人はギリシア正教を受け入れました。一方、西ヨーロッパに近いポーランド人・チェック人・クロアティア人などはローマ＝カトリックを受け入れました。同じ南スラヴ人でも、セルビア人は正教、クロアティア人はカトリックと異なる点に注意しましょう。","m":"正教＝ロシア・セルビア／カトリック＝ポーランド・チェック・クロアティア"},{"id":132,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"イヴァン3世","y":1480,"q":"15世紀後半、キプチャク＝ハン国の支配から自立し、ビザンツ帝国最後の皇帝の姪と結婚して、ツァーリ（皇帝）の称号を用いはじめたモスクワ大公は誰ですか。","c":["イヴァン3世","イヴァン4世","ウラディミル1世","ピョートル1世"],"e":"イヴァン3世は1480年にキプチャク＝ハン国の支配から脱し、ビザンツ最後の皇帝の姪と結婚して、ビザンツ帝国の後継者としてツァーリの称号を用いました。イヴァン4世（雷帝）は16世紀に正式にツァーリとして戴冠し専制政治を進めた君主、ウラディミル1世は10世紀のキエフ公国の君主、ピョートル1世は18世紀初めに西欧化を進めた皇帝です。","m":"モンゴル自立・ビザンツ皇帝の姪と結婚＝イヴァン3世"},{"id":133,"k":"plan","ref":"想定問題","f":"ローマとビザンツ世界","t":"4〜5世紀のローマ帝国の順序","y":380,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア 西ゴート人がドナウ川を渡り、帝国領内に移住した。\nイ テオドシウス帝の死後、帝国が東西に分かれた。\nウ 都がコンスタンティノープルに移された。\nエ 西ゴート人がローマ市を略奪した。","c":["ウ→ア→イ→エ","ア→ウ→イ→エ","ウ→イ→ア→エ","ウ→ア→エ→イ"],"e":"ウのコンスタンティノープル遷都は330年、アの西ゴート人の移動は376年、イの帝国の東西分裂は395年、エの西ゴート人（アラリック）によるローマ略奪は410年です。ゲルマン人の大移動が始まったのち帝国が東西に分かれ、その後に西方でゲルマン人の侵入が深刻になった、という流れで押さえましょう。","m":"遷都330→西ゴート移動376→東西分裂395→ローマ略奪410"},{"id":134,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ヒジュラ","y":622,"q":"622年のヒジュラ（聖遷）の説明として最も適当なものはどれですか。","c":["ムハンマドが迫害を逃れてメッカからメディナへ移り、この年がのちにイスラーム暦の元年とされた","ムハンマドがメディナからメッカへ移り、カーバ神殿を中心に布教を始めた","ムハンマドがメッカを征服し、カーバ神殿の偶像を破壊した","ムハンマドの死後、信徒たちが後継者としてカリフを選んだ"],"e":"ムハンマドはメッカで唯一神アッラーの教えを説きましたが、大商人らに迫害され、622年にメディナへ移りました。これをヒジュラといい、この年がイスラーム暦の元年とされます。移住の方向は「メッカからメディナへ」です。メッカ征服とカーバ神殿の偶像破壊は630年、カリフの選出はムハンマドが死去した632年の出来事です。","m":"622ヒジュラ＝メッカ→メディナ、イスラーム暦元年"},{"id":135,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"アブー＝バクル","y":632,"q":"632年にムハンマドが死去したのち、信徒の合意によって初代カリフ（ムハンマドの後継者）に選ばれた人物は誰ですか。","c":["アブー＝バクル","ウマル","ウスマーン","アリー"],"e":"初代の正統カリフはムハンマドの古くからの信徒であったアブー＝バクルで、アラビア半島の統一を進めました。第2代ウマルの時代にシリア・エジプトの征服やササン朝への勝利が進み、第3代ウスマーンの時代にコーランが現在の形にまとめられました。第4代アリーはムハンマドのいとこで娘婿にあたり、シーア派から特に重んじられます。","m":"正統カリフ＝アブー＝バクル→ウマル→ウスマーン→アリー"},{"id":136,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ウマイヤ朝の支配体制","y":700,"q":"ウマイヤ朝の支配のしくみについて述べた文として最も適当なものはどれですか。","c":["征服地の非アラブ人は、イスラームに改宗してもジズヤ（人頭税）を課されることがあり、不満を強めた","ムスリムであれば民族を問わず平等とされ、改宗者はジズヤを免除された","シーア派を保護し、アリーの子孫をカリフとして迎えた","都をバグダードにおき、イラン人の官僚を多く用いた"],"e":"ウマイヤ朝はアラブ人が支配者層として特権をもつ体制で、イスラームに改宗した非アラブ人（マワーリー）もジズヤを課されることがあり、不満が高まりました。改宗者のジズヤ免除と、バグダードを都にイラン人官僚を重用したのはアッバース朝です。ウマイヤ朝はアリーの子孫をカリフとする立場のシーア派とは対立しました。","m":"ウマイヤ朝＝アラブ人の特権・改宗者にも課税"},{"id":137,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"アッバース朝の体制","y":786,"q":"アッバース朝について述べた文として正しくないものはどれですか。","c":["シリアのダマスクスを都とし、アラブ人の特権を維持した","ムスリムであれば、アラブ人以外もジズヤ（人頭税）を免除された","アラブ人であっても、征服地に土地をもてばハラージュ（地租）を納めることとなった","ハールーン＝アッラシードの時代に最盛期を迎えた"],"e":"750年に成立したアッバース朝は、都をバグダードにおき、アラブ人の特権を廃して、ムスリムの平等を原則としました。改宗者のジズヤは免除され、アラブ人も土地をもてばハラージュを納めました。8世紀末〜9世紀初めのハールーン＝アッラシードの時代が最盛期です。ダマスクスを都としアラブ人の特権を維持したのはウマイヤ朝なので、これが正しくない文です。","m":"アッバース朝＝ムスリム平等の「イスラーム帝国」"},{"id":138,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"トゥール・ポワティエ間の戦い","y":732,"q":"732年、イベリア半島からピレネー山脈を越えてフランク王国に侵入したウマイヤ朝の軍を、トゥール・ポワティエ間の戦いで破ったフランク王国の宮宰は誰ですか。","c":["カール＝マルテル","ピピン","カール大帝","クローヴィス"],"e":"メロヴィング朝の宮宰カール＝マルテルがウマイヤ朝の軍を撃退し、イスラーム勢力の西ヨーロッパへの進出を食い止めました。その子ピピンはカロリング朝を開き、孫のカール大帝は800年に西ローマ皇帝の冠を受けました。クローヴィスは5世紀末にフランク王国を統一し、アタナシウス派に改宗した国王です。","m":"732トゥール・ポワティエ間＝宮宰カール＝マルテル"},{"id":139,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"タラス河畔の戦い","y":751,"q":"751年、アッバース朝の軍が唐の軍を中央アジアで破った戦いで、このときの捕虜を通じて製紙法がイスラーム世界に伝わったといわれます。この戦いはどれですか。","c":["タラス河畔の戦い","ニハーヴァンドの戦い","アイン＝ジャールートの戦い","アンカラの戦い"],"e":"タラス河畔の戦いで唐軍が敗れ、捕虜となった紙すき職人からサマルカンドに製紙法が伝わり、やがてバグダードなどイスラーム世界に広まったとされます。ニハーヴァンドの戦いは642年にアラブ軍がササン朝を破った戦い、アイン＝ジャールートの戦いは1260年にマムルーク朝がモンゴル軍を破った戦い、アンカラの戦いは1402年にティムールがオスマン軍を破った戦いです。","m":"751タラス河畔→製紙法が西へ"},{"id":140,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ファーティマ朝","y":969,"q":"ファーティマ朝について述べた文として最も適当なものはどれですか。","c":["エジプトを征服して新都カイロを建設し、アズハル学院を設けた","スンナ派の王朝で、アッバース朝カリフからスルタンの称号を受けた","イベリア半島に建てられ、コルドバを都とした","第3回十字軍と戦い、イェルサレムを守り抜いた"],"e":"ファーティマ朝はシーア派（イスマーイール派）の王朝で、10世紀初めにチュニジアでおこり、君主はカリフを称しました。969年にエジプトを征服して新都カイロを建て、アズハル学院を設けました。スルタンの称号を受けたのはセルジューク朝、コルドバを都としたのは後ウマイヤ朝、第3回十字軍と戦ったのはアイユーブ朝のサラーフ＝アッディーンです。","m":"ファーティマ朝＝シーア派・カリフ称号・カイロ建設"},{"id":141,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"イクター制","y":946,"q":"ブワイフ朝が始め、セルジューク朝などに受け継がれた、軍人や官僚に俸給のかわりに一定の土地からの徴税権を与える制度を何といいますか。","c":["イクター制","ティマール制","プロノイア制","マンサブダール制"],"e":"イクター制はブワイフ朝で始まり、セルジューク朝で広く行われて、その後のイスラーム諸王朝の軍事制度の基本となりました。ティマール制はオスマン帝国の騎士に徴税権を与えた制度、プロノイア制はビザンツ帝国で貴族に土地の管理をまかせた制度、マンサブダール制はムガル帝国で官僚を位階で序列化した制度です。","m":"ブワイフ朝→セルジューク朝＝イクター制"},{"id":142,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"奴隷王朝","y":1206,"q":"1206年、ゴール朝の将軍で奴隷出身の人物が、デリーを都としてインド最初のイスラーム王朝を建てました。この人物は誰ですか。","c":["アイバク","バーブル","マフムード","アクバル"],"e":"アイバクがデリーに建てた王朝は、建国者が奴隷（マムルーク）出身であったことから奴隷王朝と呼ばれ、以後約300年続くデリー＝スルタン朝の最初の王朝です。バーブルは1526年にムガル帝国を建てた人物、マフムードは11世紀に北インドへの侵入をくり返したガズナ朝の君主、アクバルはムガル帝国の第3代皇帝です。","m":"1206奴隷王朝＝アイバク（デリー＝スルタン朝の始まり）"},{"id":143,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ムラービト朝","y":1076,"q":"11世紀、北アフリカのベルベル人がおこし、マラケシュを都として、西アフリカのガーナ王国を攻撃した王朝はどれですか。","c":["ムラービト朝","ムワッヒド朝","ナスル朝","ファーティマ朝"],"e":"ムラービト朝はベルベル人の王朝で、11世紀後半にガーナ王国を攻撃し、これを機に西アフリカのイスラーム化が進みました。イベリア半島にも進出しています。ムワッヒド朝は12世紀にムラービト朝を倒したベルベル人の王朝、ナスル朝はグラナダを都としたイベリア半島最後のイスラーム王朝、ファーティマ朝はチュニジアでおこりエジプトに移ったシーア派の王朝です。","m":"ガーナ王国を攻撃＝ムラービト朝（ベルベル人）"},{"id":144,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"マリ王国","y":1324,"q":"14世紀、大量の金を携えてメッカ巡礼を行ったことで知られる、西アフリカのマリ王国の王は誰ですか。","c":["マンサ＝ムーサ","ソンニ＝アリ","アイバク","ムハンマド＝アリー"],"e":"マリ王国はニジェール川流域で金の交易によって栄えたイスラーム国家で、マンサ＝ムーサ王のメッカ巡礼のさいには大量の金がカイロで使われ、金の相場が下がったと伝えられます。交易都市トンブクトゥも繁栄しました。ソンニ＝アリは15世紀にソンガイ王国を強大にした王、アイバクはインドの奴隷王朝の建国者、ムハンマド＝アリーは19世紀のエジプトの支配者です。","m":"メッカ巡礼で金を大量に使った王＝マンサ＝ムーサ"},{"id":145,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"イスラームの学者と著作","y":1377,"q":"イスラーム世界の学者と、その著作の組み合わせとして正しいものはどれですか。","c":["イブン＝ハルドゥーン ― 『世界史序説』","イブン＝シーナー ― 『三大陸周遊記』","イブン＝バットゥータ ― 『医学典範』","イブン＝ルシュド ― 『集史』"],"e":"14世紀の歴史家イブン＝ハルドゥーンは『世界史序説』で、都市と遊牧民の関係から王朝の興亡を論じました。『医学典範』はイブン＝シーナー、『三大陸周遊記』は旅行家イブン＝バットゥータ、『集史』はイル＝ハン国の宰相ラシード＝アッディーンの著作です。イブン＝ルシュドはアリストテレスの注釈で知られるコルドバ出身の哲学者です。","m":"世界史序説＝イブン＝ハルドゥーン、医学典範＝イブン＝シーナー"},{"id":146,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"スーフィズム","y":1100,"q":"形式的な儀礼や法の学問よりも、修行を通じて神との一体感を得ることを重んじたイスラームの神秘主義を何といいますか。","c":["スーフィズム","ワッハーブ派","イスマーイール派","スンナ派"],"e":"スーフィズムは修行によって神との合一をめざす神秘主義で、12世紀ごろから教団が組織され、民衆に広まり、イスラームが各地に広がる力にもなりました。ガザーリーはスーフィズムをスンナ派の神学に位置づけました。ワッハーブ派は18世紀にコーランへの回帰を説いた改革運動で、スーフィズムを批判しました。イスマーイール派はシーア派の一派、スンナ派はムスリムの多数派です。","m":"神との一体感を求める神秘主義＝スーフィズム"},{"id":147,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"シャリーアとウラマー","y":900,"q":"イスラーム社会について述べた次の文ⅰ・ⅱの正誤の組み合わせとして正しいものはどれですか。\nⅰ イスラーム法（シャリーア）は、コーランやムハンマドの言行（スンナ）にもとづいてまとめられた。\nⅱ イスラーム法を学んだ学者（ウラマー）は、ローマ教会のように教皇を頂点とする聖職者の組織をつくった。","c":["ⅰ 正　ⅱ 誤","ⅰ 正　ⅱ 正","ⅰ 誤　ⅱ 正","ⅰ 誤　ⅱ 誤"],"e":"シャリーアはコーランとムハンマドの言行（スンナ）などをもとに体系化され、信仰だけでなく結婚・相続・商業など生活全体を定めたので、ⅰは正しい文です。ウラマーは法や神学を学んだ知識人で、裁判官や教師などとして社会を支えましたが、教皇を頂点とするような聖職者の階層組織はイスラームにはないので、ⅱは誤りです。","m":"シャリーア＝コーラン＋スンナ、ウラマー＝学者（聖職者組織なし）"},{"id":148,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"ガザン＝ハン","y":1295,"q":"13世紀末にイスラームに改宗してこれを国教とし、宰相ラシード＝アッディーンを登用して税制改革などを行ったイル＝ハン国の君主は誰ですか。","c":["ガザン＝ハン","フラグ","バトゥ","オゴタイ"],"e":"イル＝ハン国の第7代君主ガザン＝ハンはイスラームに改宗して国教とし、宰相ラシード＝アッディーンを用いて国家の立て直しをはかりました。ラシード＝アッディーンはペルシア語の歴史書『集史』も編纂しています。フラグはバグダードを攻略してアッバース朝を滅ぼし、イル＝ハン国を建てた人物、バトゥはキプチャク＝ハン国を建てた人物、オゴタイはモンゴル帝国の第2代皇帝です。","m":"イル＝ハン国のイスラーム化＝ガザン＝ハン"},{"id":149,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"アンカラの戦い","y":1402,"q":"1402年、ティムールがオスマン帝国のバヤジット1世を破って捕虜とした戦いはどれですか。","c":["アンカラの戦い","ニコポリスの戦い","モハーチの戦い","コソヴォの戦い"],"e":"サマルカンドを都に大帝国を築いたティムールは、アンカラの戦いでバヤジット1世を破り、オスマン帝国は一時崩壊の危機に陥りました。ニコポリスの戦い（1396年）はバヤジット1世がハンガリー王らのヨーロッパ連合軍を破った戦い、モハーチの戦い（1526年）はスレイマン1世がハンガリーを破った戦い、コソヴォの戦い（1389年）はオスマン軍がセルビアなどを破った戦いです。","m":"1402アンカラ＝ティムールがバヤジット1世を捕らえる"},{"id":150,"k":"plan","ref":"想定問題","f":"イスラーム世界","t":"イスラーム諸勢力の出来事の順序","y":1000,"q":"次のア〜エを古い順に並べたものとして正しいものはどれですか。\nア デリーに奴隷王朝が成立した。\nイ ブワイフ朝がバグダードに入城した。\nウ タラス河畔の戦いがおこった。\nエ イル＝ハン国のガザン＝ハンがイスラームに改宗した。","c":["ウ→イ→ア→エ","イ→ウ→ア→エ","ウ→ア→イ→エ","ウ→イ→エ→ア"],"e":"ウのタラス河畔の戦いは751年、イのブワイフ朝のバグダード入城は946年、アの奴隷王朝の成立は1206年、エのガザン＝ハンの改宗は1295年です。8世紀のアッバース朝の拡大、10世紀のイラン系軍事政権の台頭、13世紀のインドのイスラーム化とモンゴル勢力のイスラーム化、という流れで整理しましょう。","m":"751タラス→946ブワイフ→1206奴隷王朝→1295ガザン"},{"id":151,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"鄭和の南海遠征","y":1405,"q":"明の永楽帝の命を受けて大艦隊を率いて南海遠征を行い、その分遣隊がアフリカ東岸にまで達した人物は誰ですか。","c":["鄭和","王直","張騫","玄奘"],"e":"鄭和はイスラーム教徒の宦官で、1405年から永楽帝の命で計7回の南海遠征を行い、東南アジア・インド洋各地の国々に朝貢をうながしました。王直は16世紀の後期倭寇の頭目、張騫は前漢の武帝の命で大月氏に派遣された人物、玄奘は唐代にインドへ渡って仏典を持ち帰った僧です。","m":"永楽帝の大艦隊＝鄭和（アフリカ東岸まで）"},{"id":152,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"北虜南倭","y":1550,"q":"16世紀の明を苦しめた「北虜南倭」のうち、「北虜」にあたる勢力として最も適当なものはどれですか。","c":["アルタン＝ハーンが率いたモンゴル","倭寇と呼ばれた海上の密貿易集団","ヌルハチが統合した女真","ガルダン＝ハンのもとで強大になったジュンガル"],"e":"北虜南倭とは、北方のモンゴルと南方沿岸の倭寇が明を同時に脅かした状況を指します。モンゴルのアルタン＝ハーンは1550年に北京を包囲しました。倭寇は「南倭」にあたります。女真のヌルハチが後金を建てたのは1616年、ジュンガルが強大になったのは17世紀後半で、いずれも16世紀半ばの「北虜」ではありません。","m":"北虜＝モンゴル（アルタン）、南倭＝倭寇"},{"id":153,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"李自成の乱と明の滅亡","y":1644,"q":"1644年、農民反乱軍を率いて北京を攻め落とし、明を滅亡させた人物は誰ですか。","c":["李自成","呉三桂","黄巣","洪秀全"],"e":"明末には重税と飢饉で各地に反乱がおこり、李自成の軍が1644年に北京を占領して崇禎帝は自殺し、明は滅びました。山海関を守っていた明の武将呉三桂は清軍を導き入れ、清は李自成を追って北京に入りました。黄巣は唐末に黄巣の乱をおこした人物、洪秀全は19世紀に太平天国をおこした人物です。","m":"1644 李自成が明を滅ぼす→呉三桂が清を招く"},{"id":154,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"軍機処","y":1729,"q":"清の雍正帝がジュンガルとの戦いに備えて設け、のちに皇帝を補佐する政治の最高機関となった機関はどれですか。","c":["軍機処","理藩院","総理各国事務衙門","市舶司"],"e":"軍機処は雍正帝の時代に軍事上の機密を処理するために設けられ、やがて内閣にかわって政務の中心となりました。理藩院はモンゴル・チベット・新疆などの藩部を管理した役所です。総理各国事務衙門（総理衙門）はアロー戦争後の1861年に設けられた外交担当の役所、市舶司は唐代以降に海上貿易を管理した役所です。","m":"雍正帝＝軍機処（＋地丁銀・典礼問題）"},{"id":155,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"マテオ＝リッチ","y":1602,"q":"明代末期に中国に来て布教を行い、世界地図「坤輿万国全図」を作製したイエズス会宣教師は誰ですか。","c":["マテオ＝リッチ","アダム＝シャール","カスティリオーネ","フランシスコ＝ザビエル"],"e":"マテオ＝リッチは16世紀末に中国に入り、中国の習慣を尊重しながら布教し、「坤輿万国全図」を作ったほか、徐光啓とともにエウクレイデスの幾何学を『幾何原本』として漢訳しました。アダム＝シャールは明末清初に暦の改訂にたずさわった宣教師、カスティリオーネは清で円明園の設計に加わった宣教師、ザビエルは日本に布教した人物です。","m":"坤輿万国全図＝マテオ＝リッチ（明末）"},{"id":156,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"キリスト教布教の全面禁止","y":1724,"q":"中国の伝統的な儀礼を信者に認めるかどうかをめぐる典礼問題をきっかけに、1724年にキリスト教の布教を全面的に禁止した清の皇帝は誰ですか。","c":["雍正帝","康熙帝","乾隆帝","順治帝"],"e":"イエズス会は孔子の崇拝や祖先の祭祀を信者に認めて布教しましたが、ほかの会派がこれを批判して典礼問題がおこりました。ローマ教皇がイエズス会の方式を否定したため、康熙帝はイエズス会以外の布教を禁じ、続く雍正帝が1724年に布教を全面的に禁止しました。乾隆帝は雍正帝の次、順治帝は康熙帝の前の皇帝です。","m":"康熙＝イエズス会以外を禁止→雍正＝全面禁止"},{"id":157,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"公行と広州一港制限","y":1757,"q":"清の乾隆帝が1757年にヨーロッパ船の来航を広州一港に限ったとき、外国との貿易を独占的に取り扱った特許商人の組合を何といいますか。","c":["公行","会館","市舶司","東インド会社"],"e":"乾隆帝はヨーロッパ船の来航を広州だけに限り、公行と呼ばれる特許商人の組合に貿易を独占させました。会館は同郷・同業の商人が各地の都市に設けた互助のための施設です。市舶司は唐代以降に海上貿易を管理した役所で、商人の組合ではありません。東インド会社はイギリスなどヨーロッパ側の貿易会社です。","m":"1757 広州一港＋公行の独占"},{"id":158,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"マカートニーの派遣","y":1793,"q":"18世紀末、貿易の制限の撤廃や自由貿易を求めてイギリスから清に派遣され、乾隆帝に謁見したものの要求を拒否された使節は誰ですか。","c":["マカートニー","アマースト","エリオット","パークス"],"e":"イギリスは広州一港での制限貿易の改善を求め、1793年にマカートニーを乾隆帝のもとに派遣しましたが要求は拒否されました。1816年には嘉慶帝のもとにアマーストを送りましたが、儀礼をめぐって対立し皇帝に会えませんでした。エリオットはアヘン戦争のころのイギリス側の貿易監督官、パークスは幕末の日本に駐在したイギリス公使です。","m":"乾隆帝にマカートニー（1793）、嘉慶帝にアマースト"},{"id":159,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"アクバルの宗教融和策","y":1564,"q":"ムガル帝国で、非ムスリムに課していた人頭税（ジズヤ）を廃止し、ヒンドゥー教徒との融和を図った皇帝は誰ですか。","c":["アクバル","アウラングゼーブ","バーブル","シャー＝ジャハーン"],"e":"第3代のアクバルは都をアグラに移し、ジズヤを廃止してヒンドゥー教徒の協力を得るなど、帝国の支配を固めました。アウラングゼーブは厳格なスンナ派の立場からジズヤを復活させ、ヒンドゥー教徒などの反発を招きました。バーブルは1526年のパーニーパットの戦いに勝って帝国を建てた初代、シャー＝ジャハーンはタージ＝マハルを建てた皇帝です。","m":"アクバル＝ジズヤ廃止、アウラングゼーブ＝復活"},{"id":160,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"プラッシーの戦い","y":1757,"q":"1757年、クライヴの率いるイギリス東インド会社の軍が、フランスと結んだベンガル太守の軍を破った戦いはどれですか。","c":["プラッシーの戦い","マイソール戦争","マラーター戦争","シク戦争"],"e":"プラッシーの戦いの勝利によってイギリスはフランスの勢力をインドから後退させ、1765年にはベンガルなどの徴税権（ディーワーニー）を得て、領土の支配へと進みました。マイソール戦争は南インドのマイソール王国との戦争、マラーター戦争はデカン高原のマラーター同盟との戦争、シク戦争は西北部パンジャーブのシク王国との戦争です。","m":"1757 プラッシー＝英がベンガルで仏を圧倒"},{"id":161,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"ジャワの強制栽培制度","y":1830,"q":"19世紀前半、オランダがジャワで住民にコーヒー・サトウキビ・藍などの商品作物を栽培させ、安い価格で買い上げた制度を何といいますか。","c":["強制栽培制度（政府栽培制度）","ザミンダーリー制","ライヤットワーリー制","アシエンダ制"],"e":"ジャワ戦争などで財政が苦しくなったオランダは、1830年ごろから総督ファン＝デン＝ボスのもとで強制栽培制度を始め、大きな利益をあげる一方で住民を飢饉に苦しめました。ザミンダーリー制とライヤットワーリー制は、イギリスがインドで行った地税徴収の制度です。アシエンダ制はスペイン領ラテンアメリカで広がった大農園制です。","m":"オランダ領ジャワ＝強制栽培制度（1830〜）"},{"id":162,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"イギリス産業革命の技術革新","y":1780,"q":"イギリスの産業革命期の技術革新ア〜エを古い順に並べたものとして正しいものはどれですか。\nア ジョン＝ケイが飛び杼を発明した。\nイ カートライトが力織機を発明した。\nウ アークライトが水力紡績機を発明した。\nエ スティーヴンソンの蒸気機関車が実用化された。","c":["ア→ウ→イ→エ","ウ→ア→イ→エ","ア→イ→ウ→エ","ウ→イ→ア→エ"],"e":"飛び杼（1733年）で織布の速度が上がると糸が足りなくなり、ハーグリーヴズの多軸紡績機やアークライトの水力紡績機（1769年）など紡績の機械が生まれました。今度は糸が余るようになり、カートライトが力織機（1785年）を発明しました。スティーヴンソンの蒸気機関車は1825年に実用化され、1830年にはリヴァプール・マンチェスター間に鉄道が開通しました。","m":"飛び杼→紡績機→力織機→蒸気機関車"},{"id":163,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"フランス革命の経過","y":1791,"q":"フランス革命の出来事ア〜エを古い順に並べたものとして正しいものはどれですか。\nア 国王一家が国外に逃げようとして、ヴァレンヌで連れ戻された。\nイ テルミドールの反動でロベスピエールが処刑された。\nウ 第三身分の議員らが憲法制定まで解散しないことを誓った。\nエ 国民公会が王政の廃止と共和政の樹立を宣言した。","c":["ウ→ア→エ→イ","ウ→エ→ア→イ","ア→ウ→エ→イ","ウ→ア→イ→エ"],"e":"1789年6月、第三身分の議員らが国民議会を名のり、球戯場（テニスコート）の誓いを行いました。1791年6月にはヴァレンヌ逃亡事件で国王への信頼が失われ、1792年9月に国民公会が王政を廃止して第一共和政が始まりました。ジャコバン派の恐怖政治は1794年7月のテルミドールの反動で終わり、ロベスピエールは処刑されました。","m":"球戯場の誓い→ヴァレンヌ→共和政→テルミドール"},{"id":164,"k":"plan","ref":"想定問題","f":"近世・近代のアジアと欧米","t":"国民議会の改革","y":1789,"q":"フランス革命の初期に、国民議会が1789年に行ったこととして正しいものはどれですか。","c":["封建的特権の廃止を決め、続いて人権宣言を採択した","

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 一枚の答案用紙。中央1カラム（最大640px）。問題文は試験冊子と同じ明朝、操作と数字はゴシック。 */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --ink:#1d1a26; --muted:#676276; --line:#dbd8e4;
  --accent:#4b2e83; --accent-ink:#ffffff; --accent-soft:#ebe5f6;
  --ok:#1b7447; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#faefd8;
  --f-exam:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
    --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
    --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121c; --surface:#1f1b2a; --ink:#ece9f4; --muted:#a49eb5; --line:#352f46;
  --accent:#bba6ee; --accent-ink:#1a1328; --accent-soft:#2c2442;
  --ok:#74d6a4; --ok-soft:#163326; --ng:#ff8f85; --ng-soft:#3c1b19; --warn:#f0c46c; --warn-soft:#382c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.head h1{font-family:var(--f-exam);font-weight:700;font-size:26px;line-height:1.3;text-wrap:balance}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.start{border-color:var(--accent)}
.start h2{font-family:var(--f-exam);font-size:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.segb small{color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.segb[aria-pressed="true"] small{color:var(--accent)}
.spec{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:0;margin:0;list-style:none}
.spec b{color:var(--ink);font-variant-numeric:tabular-nums}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:flex;flex-direction:column;gap:0;min-width:0}
.num b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.num small{font-size:12px;color:var(--muted)}
.num span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 9px;background:var(--warn-soft);color:var(--warn)}
.sc.good{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--ng-soft);color:var(--ng)}

.fl{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.fi .nm{font-weight:500;min-width:0}
.fi .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{grid-column:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.w{background:var(--ng)}
.fi .btn{grid-column:2;grid-row:1 / span 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--line)}
.legend i.g{background:var(--ok)} .legend i.w{background:var(--ng)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:baseline;gap:12px}
.bar-title{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:400}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--ng-soft);color:var(--ng)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:0}
.dot.done{background:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chip{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.passage{font-family:var(--f-exam);font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:50vh;overflow-y:auto}
.passage[lang=en]{font-family:Georgia,"Times New Roman",var(--f-exam);line-height:1.7}
.q{font-family:var(--f-exam);font-weight:500;font-size:18px;line-height:1.85;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);line-height:1}
.opt .txt{min-width:0;overflow-wrap:anywhere;font-family:var(--f-exam);font-size:16px;line-height:1.6;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .mark{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.ask{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .btn{color:var(--ink)}

.exp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp p{overflow-wrap:anywhere}
.memo{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.memo span{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.src{font-size:12px;color:var(--muted)}

.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-exam);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.judge{font-weight:700}
.judge.good{color:var(--ok)} .judge.mid{color:var(--warn)} .judge.bad{color:var(--ng)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:8px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:12px 14px}
details.it summary::-webkit-details-marker{display:none}
.ox{flex:none;font-weight:700;width:1.2em;text-align:center}
.ox.ok{color:var(--ok)} .ox.ng{color:var(--ng)}
.sm-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm-t small{display:block;color:var(--muted);font-size:12px}
.it-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.it-body .q{font-size:16px}
.it-body .exp{border-top:0;padding-top:0}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding:4px 0}
.tl li{list-style:none;display:grid;grid-template-columns:5.2em 1.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0 7px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:1.05em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl{margin-block:0;padding-inline-start:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl .ev{min-width:0;overflow-wrap:anywhere}
.tl .ev small{display:block;color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:420px){ .q{font-size:17px} .score b{font-size:44px} .fi{grid-template-columns:minmax(0,1fr)} .fi .btn{grid-column:1;grid-row:auto;justify-self:start} }
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.dot{transition:background-color .12s,border-color .12s} }
</style>

var QS=[{"id":1,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の理由（翻訳論）","p":"　翻訳とは、ある言語で書かれた意味を、別の言語の等しい表現に置き換える作業だと考えられがちである。この理解の背後には、言語の違いを越えて共有される意味の在庫が、あらかじめどこかに保管されているという想定がある。言葉はその在庫から品物を取り出すための札にすぎず、札の形が国ごとに異なるだけだ、というわけである。\n　だが、実際に翻訳に携わった者なら、ある語に対応する語が見つからないという経験よりも、対応する語が見つかりすぎるという経験のほうに悩まされるはずだ。辞書を引けば候補はいくらでも並ぶ。困難は、そのどれもが少しずつ正しく、少しずつ誤っているところにある。【ア】訳者が直面しているのは欠如ではなく過剰なのである。\n　この過剰は、原文の語が孤立した意味の単位ではなく、それが置かれてきた無数の文脈の記憶を引きずっていることから生じる。ある語が詩の中で用いられ、法廷で用いられ、台所で用いられてきた歴史が、一語の背後に厚い層をなしている。訳語の側もまた、別の層を背負っている。翻訳とは、二つの異なる層を重ね合わせ、どこが重なりどこがずれるかを測る作業にほかならない。\n　そうであれば、翻訳の「誤差」は取り除くべき雑音ではない。むしろそのずれによって、原文の側にもともと潜んでいた含意が、初めて輪郭を与えられることがある。母語の話者には透明すぎて見えなかったものが、翻訳という〔　Ｘ　〕を通ることで、かえって手触りをもって現れるのだ。【イ】翻訳は原文を写す鏡である以上に、原文を読み直すための装置なのである。\n　もちろん、このことは翻訳がどれも等しく価値をもつという相対主義を意味しない。ずれを測るには、ずれを自覚させるだけの精密さが要る。安易な意訳は、ずれそのものを覆い隠してしまうという点で、直訳以上に原文から遠ざかることがある。翻訳の倫理とは、等価を装うことではなく、等価が成り立たない地点を読者の前に差し出す誠実さのうちにあるだろう。","q":"傍線部【ア】「訳者が直面しているのは欠如ではなく過剰なのである」とあるが、筆者がそのように述べる理由として最も適当なものを選びなさい。","c":["原文の語も訳語も、それぞれ異なる文脈の歴史を背負っているため、どの訳語も原文の語と部分的にしか重ならず、候補が絞りきれないから。","辞書には一つの語に対応する訳語が一つしか載っていないため、訳者は自分で別の訳語を大量に作り出さなければならないから。","言語の違いを越えて共有される意味の在庫が豊富なので、どの訳語を選んでも原文の意味を過不足なく伝えられるから。","訳者の語彙が豊かであればあるほど訳語の候補が増え、原文の意味から自由に離れた創作が可能になるから。"],"e":"第三段落で、過剰は「原文の語が…無数の文脈の記憶を引きずっていること」から生じ、訳語も「別の層を背負っている」と説明されています。だから候補はどれも「少しずつ正しく、少しずつ誤っている」のです。二つ目は「候補はいくらでも並ぶ」という本文と逆です。三つ目は筆者が疑っている「意味の在庫」の考え方そのものです。四つ目は訳者個人の語彙の問題にすり替えています。","m":"過剰の原因＝語が背負う文脈の層のずれ"},{"id":2,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"空所補充（翻訳論）","p":"　翻訳とは、ある言語で書かれた意味を、別の言語の等しい表現に置き換える作業だと考えられがちである。この理解の背後には、言語の違いを越えて共有される意味の在庫が、あらかじめどこかに保管されているという想定がある。言葉はその在庫から品物を取り出すための札にすぎず、札の形が国ごとに異なるだけだ、というわけである。\n　だが、実際に翻訳に携わった者なら、ある語に対応する語が見つからないという経験よりも、対応する語が見つかりすぎるという経験のほうに悩まされるはずだ。辞書を引けば候補はいくらでも並ぶ。困難は、そのどれもが少しずつ正しく、少しずつ誤っているところにある。【ア】訳者が直面しているのは欠如ではなく過剰なのである。\n　この過剰は、原文の語が孤立した意味の単位ではなく、それが置かれてきた無数の文脈の記憶を引きずっていることから生じる。ある語が詩の中で用いられ、法廷で用いられ、台所で用いられてきた歴史が、一語の背後に厚い層をなしている。訳語の側もまた、別の層を背負っている。翻訳とは、二つの異なる層を重ね合わせ、どこが重なりどこがずれるかを測る作業にほかならない。\n　そうであれば、翻訳の「誤差」は取り除くべき雑音ではない。むしろそのずれによって、原文の側にもともと潜んでいた含意が、初めて輪郭を与えられることがある。母語の話者には透明すぎて見えなかったものが、翻訳という〔　Ｘ　〕を通ることで、かえって手触りをもって現れるのだ。【イ】翻訳は原文を写す鏡である以上に、原文を読み直すための装置なのである。\n　もちろん、このことは翻訳がどれも等しく価値をもつという相対主義を意味しない。ずれを測るには、ずれを自覚させるだけの精密さが要る。安易な意訳は、ずれそのものを覆い隠してしまうという点で、直訳以上に原文から遠ざかることがある。翻訳の倫理とは、等価を装うことではなく、等価が成り立たない地点を読者の前に差し出す誠実さのうちにあるだろう。","q":"空所〔　Ｘ　〕に入る語として最も適当なものを選びなさい。","c":["屈折","鏡像","複製","透明化"],"e":"空所の前後は「透明すぎて見えなかったもの」が、翻訳を通ることで「かえって手触りをもって現れる」という内容です。光がまっすぐ通り抜けず、曲がることで初めて存在が見えるという「屈折」の比喩が合います。「鏡像」「複製」は、直後の「原文を写す鏡である以上に」という筆者の主張と逆の、そのまま写すイメージです。「透明化」は見えなくなる方向で、文意と正反対です。","m":"見えないもの→ずれ（屈折）で見える"},{"id":3,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の内容（翻訳論）","p":"　翻訳とは、ある言語で書かれた意味を、別の言語の等しい表現に置き換える作業だと考えられがちである。この理解の背後には、言語の違いを越えて共有される意味の在庫が、あらかじめどこかに保管されているという想定がある。言葉はその在庫から品物を取り出すための札にすぎず、札の形が国ごとに異なるだけだ、というわけである。\n　だが、実際に翻訳に携わった者なら、ある語に対応する語が見つからないという経験よりも、対応する語が見つかりすぎるという経験のほうに悩まされるはずだ。辞書を引けば候補はいくらでも並ぶ。困難は、そのどれもが少しずつ正しく、少しずつ誤っているところにある。【ア】訳者が直面しているのは欠如ではなく過剰なのである。\n　この過剰は、原文の語が孤立した意味の単位ではなく、それが置かれてきた無数の文脈の記憶を引きずっていることから生じる。ある語が詩の中で用いられ、法廷で用いられ、台所で用いられてきた歴史が、一語の背後に厚い層をなしている。訳語の側もまた、別の層を背負っている。翻訳とは、二つの異なる層を重ね合わせ、どこが重なりどこがずれるかを測る作業にほかならない。\n　そうであれば、翻訳の「誤差」は取り除くべき雑音ではない。むしろそのずれによって、原文の側にもともと潜んでいた含意が、初めて輪郭を与えられることがある。母語の話者には透明すぎて見えなかったものが、翻訳という〔　Ｘ　〕を通ることで、かえって手触りをもって現れるのだ。【イ】翻訳は原文を写す鏡である以上に、原文を読み直すための装置なのである。\n　もちろん、このことは翻訳がどれも等しく価値をもつという相対主義を意味しない。ずれを測るには、ずれを自覚させるだけの精密さが要る。安易な意訳は、ずれそのものを覆い隠してしまうという点で、直訳以上に原文から遠ざかることがある。翻訳の倫理とは、等価を装うことではなく、等価が成り立たない地点を読者の前に差し出す誠実さのうちにあるだろう。","q":"傍線部【イ】「翻訳は原文を写す鏡である以上に、原文を読み直すための装置なのである」の説明として最も適当なものを選びなさい。","c":["翻訳によって生じる原文とのずれが、原文に潜んでいながら母語話者には意識されなかった含意を浮かび上がらせる、ということ。","翻訳は原文の意味を正確に写し取ることを目的とし、そのために訳者は原文を何度も読み直さなければならない、ということ。","翻訳では原文の意味を写すことはできないので、訳者は原文を自由に書き換えて新しい作品を作るべきだ、ということ。","翻訳を読むと母語の話者も原文の誤りに気づくことができ、原文を正しく修正するきっかけになる、ということ。"],"e":"直前で、翻訳のずれによって「原文の側にもともと潜んでいた含意が、初めて輪郭を与えられる」と述べています。これを「読み直すための装置」と言い換えています。二つ目は正確に写す「鏡」の側の説明にとどまっています。三つ目は最終段落の「相対主義を意味しない」や「安易な意訳」への批判と合いません。四つ目は原文の「誤り」を正すという話にすり替えています。","m":"ずれ→原文の隠れた含意が見える"},{"id":4,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"内容合致（翻訳論）","p":"　翻訳とは、ある言語で書かれた意味を、別の言語の等しい表現に置き換える作業だと考えられがちである。この理解の背後には、言語の違いを越えて共有される意味の在庫が、あらかじめどこかに保管されているという想定がある。言葉はその在庫から品物を取り出すための札にすぎず、札の形が国ごとに異なるだけだ、というわけである。\n　だが、実際に翻訳に携わった者なら、ある語に対応する語が見つからないという経験よりも、対応する語が見つかりすぎるという経験のほうに悩まされるはずだ。辞書を引けば候補はいくらでも並ぶ。困難は、そのどれもが少しずつ正しく、少しずつ誤っているところにある。【ア】訳者が直面しているのは欠如ではなく過剰なのである。\n　この過剰は、原文の語が孤立した意味の単位ではなく、それが置かれてきた無数の文脈の記憶を引きずっていることから生じる。ある語が詩の中で用いられ、法廷で用いられ、台所で用いられてきた歴史が、一語の背後に厚い層をなしている。訳語の側もまた、別の層を背負っている。翻訳とは、二つの異なる層を重ね合わせ、どこが重なりどこがずれるかを測る作業にほかならない。\n　そうであれば、翻訳の「誤差」は取り除くべき雑音ではない。むしろそのずれによって、原文の側にもともと潜んでいた含意が、初めて輪郭を与えられることがある。母語の話者には透明すぎて見えなかったものが、翻訳という〔　Ｘ　〕を通ることで、かえって手触りをもって現れるのだ。【イ】翻訳は原文を写す鏡である以上に、原文を読み直すための装置なのである。\n　もちろん、このことは翻訳がどれも等しく価値をもつという相対主義を意味しない。ずれを測るには、ずれを自覚させるだけの精密さが要る。安易な意訳は、ずれそのものを覆い隠してしまうという点で、直訳以上に原文から遠ざかることがある。翻訳の倫理とは、等価を装うことではなく、等価が成り立たない地点を読者の前に差し出す誠実さのうちにあるだろう。","q":"本文の内容と合致するものを一つ選びなさい。","c":["安易な意訳は、原文とのずれを見えなくしてしまうため、直訳よりもかえって原文から遠ざかる場合がある。","翻訳の誤差は雑音にすぎないので、訳者は精密な作業によってそれを最小限に抑えることを目指すべきである。","ずれから原文の含意が見えてくる以上、どのような翻訳もそれぞれ等しい価値をもつと考えるべきである。","言語の違いを越えて共有される意味の在庫が存在することは、翻訳の経験によって裏づけられている。"],"e":"最終段落に「安易な意訳は、ずれそのものを覆い隠してしまうという点で、直訳以上に原文から遠ざかることがある」とあり、一つ目が合致します。二つ目は「誤差は取り除くべき雑音ではない」と逆です。三つ目は「どれも等しく価値をもつという相対主義を意味しない」と否定されています。四つ目の「意味の在庫」は、筆者が疑問視している前提です。","m":"合致問題は否定された主張を見抜く"},{"id":5,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"筆者の主張（翻訳論）","p":"　翻訳とは、ある言語で書かれた意味を、別の言語の等しい表現に置き換える作業だと考えられがちである。この理解の背後には、言語の違いを越えて共有される意味の在庫が、あらかじめどこかに保管されているという想定がある。言葉はその在庫から品物を取り出すための札にすぎず、札の形が国ごとに異なるだけだ、というわけである。\n　だが、実際に翻訳に携わった者なら、ある語に対応する語が見つからないという経験よりも、対応する語が見つかりすぎるという経験のほうに悩まされるはずだ。辞書を引けば候補はいくらでも並ぶ。困難は、そのどれもが少しずつ正しく、少しずつ誤っているところにある。【ア】訳者が直面しているのは欠如ではなく過剰なのである。\n　この過剰は、原文の語が孤立した意味の単位ではなく、それが置かれてきた無数の文脈の記憶を引きずっていることから生じる。ある語が詩の中で用いられ、法廷で用いられ、台所で用いられてきた歴史が、一語の背後に厚い層をなしている。訳語の側もまた、別の層を背負っている。翻訳とは、二つの異なる層を重ね合わせ、どこが重なりどこがずれるかを測る作業にほかならない。\n　そうであれば、翻訳の「誤差」は取り除くべき雑音ではない。むしろそのずれによって、原文の側にもともと潜んでいた含意が、初めて輪郭を与えられることがある。母語の話者には透明すぎて見えなかったものが、翻訳という〔　Ｘ　〕を通ることで、かえって手触りをもって現れるのだ。【イ】翻訳は原文を写す鏡である以上に、原文を読み直すための装置なのである。\n　もちろん、このことは翻訳がどれも等しく価値をもつという相対主義を意味しない。ずれを測るには、ずれを自覚させるだけの精密さが要る。安易な意訳は、ずれそのものを覆い隠してしまうという点で、直訳以上に原文から遠ざかることがある。翻訳の倫理とは、等価を装うことではなく、等価が成り立たない地点を読者の前に差し出す誠実さのうちにあるだろう。","q":"筆者のいう「翻訳の倫理」の説明として最も適当なものを選びなさい。","c":["二つの言語が完全には対応しない地点を隠さず、そのずれを読者が自覚できる形で示そうとする誠実さ。","原文と訳文が完全に等しい意味をもつように、訳語の候補を一つに絞り込むまで推敲を重ねる誠実さ。","読者が読みやすいように、原文と訳文のずれを目立たない表現で整え、違和感をなくそうとする誠実さ。","原文の語が背負う文脈の歴史を調べ上げ、それを注釈としてすべて訳文に書き添えようとする誠実さ。"],"e":"最終文で、倫理は「等価を装うことではなく、等価が成り立たない地点を読者の前に差し出す誠実さ」とされています。一つ目がその言い換えです。二つ目は「等価を装う」側です。三つ目はずれを覆い隠す「安易な意訳」の態度です。四つ目は本文が求める「ずれを自覚させるだけの精密さ」を、注釈を網羅することにすり替えていて、本文に根拠がありません。","m":"倫理＝等価でない所を差し出す"},{"id":6,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の内容（記録論）","p":"　記録は忘却に抗うための技術だと考えられている。たしかに、書き留められたものは、人の記憶が薄れたあとも残り続ける。しかし記録の歴史を振り返ると、それが同時に、安心して忘れるための技術でもあったことに気づかされる。書いておけば、覚えておく必要はない。【ア】記録は記憶を補うと同時に、記憶を手放すことを許可してきたのである。\n　この二重性は、記録の量が爆発的に増えた現代において、いっそう際立っている。私たちは日々の出来事を写真や文字で絶えず保存しているが、保存したものを見返すことはまれである。保存の行為そのものが、出来事を経験し終えたという感覚を与え、経験を消化する手間の代わりをしてしまう。記録が完全になればなるほど想起は不要になり、出来事は「どこかにある」という安心の中で、【ウ】誰の内にも住まなくなる。\n　さらに見落とされがちなのは、何かを記録するという行為が、記録されなかったものを決定するという点である。文書館に収められた資料は、収集し分類した者の関心によって選ばれている。そこに残らなかった声は、単に失われたのではなく、記録の体系そのものによって〔　Ｙ　〕されたのだ。だから文書館を読むとは、そこにあるものを読むことであると同時に、そこにないものの輪郭を読むことでもある。\n　とすれば、記憶とは、記録の不足を埋める補助的な能力ではない。記憶は、ある出来事を繰り返し呼び出し、そのたびに現在との関係の中で意味を組み替える営みである。【イ】記録が過去を固定するのに対し、記憶は過去を動かし続ける。記録に頼りきることは過去を守ることのように見えて、実は過去を現在から切り離し、凍結することになりかねない。必要なのは記録を捨てることではなく、記録を想起のきっかけとして用い直すことだろう。","q":"傍線部【ア】「記録は記憶を補うと同時に、記憶を手放すことを許可してきた」の説明として最も適当なものを選びなさい。","c":["記録は記憶が薄れたあとも内容を残す一方で、書き留めてあるという安心から、人が自分で覚えておく必要をなくしてきた、ということ。","記録は記憶の誤りを正す役割を果たしてきたが、記録そのものも時がたてば失われるので、いずれ忘れられてしまう、ということ。","記録は記憶を補うものとして発明されたが、実際には人の記憶力を衰えさせるだけで、何の役にも立たなかった、ということ。","記録を残すことは、忘れたい出来事を意図的に消し去るために権力者が用いてきた手段であった、ということ。"],"e":"直前の「書いておけば、覚えておく必要はない」が根拠です。記録は記憶を補う（残り続ける）と同時に、忘れても大丈夫という安心を与えます。二つ目の「記録も失われる」は本文にありません。三つ目は「補う」という面を否定しすぎです。四つ目は第三段落の「記録されなかったもの」の話と混同しており、意図的に消すとは述べていません。","m":"記録の二重性＝補う／忘れてよいと許す"},{"id":7,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"空所補充（記録論）","p":"　記録は忘却に抗うための技術だと考えられている。たしかに、書き留められたものは、人の記憶が薄れたあとも残り続ける。しかし記録の歴史を振り返ると、それが同時に、安心して忘れるための技術でもあったことに気づかされる。書いておけば、覚えておく必要はない。【ア】記録は記憶を補うと同時に、記憶を手放すことを許可してきたのである。\n　この二重性は、記録の量が爆発的に増えた現代において、いっそう際立っている。私たちは日々の出来事を写真や文字で絶えず保存しているが、保存したものを見返すことはまれである。保存の行為そのものが、出来事を経験し終えたという感覚を与え、経験を消化する手間の代わりをしてしまう。記録が完全になればなるほど想起は不要になり、出来事は「どこかにある」という安心の中で、【ウ】誰の内にも住まなくなる。\n　さらに見落とされがちなのは、何かを記録するという行為が、記録されなかったものを決定するという点である。文書館に収められた資料は、収集し分類した者の関心によって選ばれている。そこに残らなかった声は、単に失われたのではなく、記録の体系そのものによって〔　Ｙ　〕されたのだ。だから文書館を読むとは、そこにあるものを読むことであると同時に、そこにないものの輪郭を読むことでもある。\n　とすれば、記憶とは、記録の不足を埋める補助的な能力ではない。記憶は、ある出来事を繰り返し呼び出し、そのたびに現在との関係の中で意味を組み替える営みである。【イ】記録が過去を固定するのに対し、記憶は過去を動かし続ける。記録に頼りきることは過去を守ることのように見えて、実は過去を現在から切り離し、凍結することになりかねない。必要なのは記録を捨てることではなく、記録を想起のきっかけとして用い直すことだろう。","q":"空所〔　Ｙ　〕に入る語として最も適当なものを選びなさい。","c":["排除","保存","発見","再生"],"e":"空所の前に「単に失われたのではなく、記録の体系そのものによって」とあります。自然に消えたのではなく、何を残すかを決める体系が、残らなかった声を外へはじき出した、という意味になる「排除」が入ります。「保存」「再生」は残る側の語で、「残らなかった声」と矛盾します。「発見」も、失われたものの説明として逆の方向です。","m":"記録すること＝記録しないものを決める"},{"id":8,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の内容（記録論）","p":"　記録は忘却に抗うための技術だと考えられている。たしかに、書き留められたものは、人の記憶が薄れたあとも残り続ける。しかし記録の歴史を振り返ると、それが同時に、安心して忘れるための技術でもあったことに気づかされる。書いておけば、覚えておく必要はない。【ア】記録は記憶を補うと同時に、記憶を手放すことを許可してきたのである。\n　この二重性は、記録の量が爆発的に増えた現代において、いっそう際立っている。私たちは日々の出来事を写真や文字で絶えず保存しているが、保存したものを見返すことはまれである。保存の行為そのものが、出来事を経験し終えたという感覚を与え、経験を消化する手間の代わりをしてしまう。記録が完全になればなるほど想起は不要になり、出来事は「どこかにある」という安心の中で、【ウ】誰の内にも住まなくなる。\n　さらに見落とされがちなのは、何かを記録するという行為が、記録されなかったものを決定するという点である。文書館に収められた資料は、収集し分類した者の関心によって選ばれている。そこに残らなかった声は、単に失われたのではなく、記録の体系そのものによって〔　Ｙ　〕されたのだ。だから文書館を読むとは、そこにあるものを読むことであると同時に、そこにないものの輪郭を読むことでもある。\n　とすれば、記憶とは、記録の不足を埋める補助的な能力ではない。記憶は、ある出来事を繰り返し呼び出し、そのたびに現在との関係の中で意味を組み替える営みである。【イ】記録が過去を固定するのに対し、記憶は過去を動かし続ける。記録に頼りきることは過去を守ることのように見えて、実は過去を現在から切り離し、凍結することになりかねない。必要なのは記録を捨てることではなく、記録を想起のきっかけとして用い直すことだろう。","q":"傍線部【ウ】「誰の内にも住まなくなる」とはどういうことか。最も適当なものを選びなさい。","c":["出来事が保存されたという安心から思い出されなくなり、誰かの経験として内面で受けとめ直されることがなくなる、ということ。","保存された記録が膨大になったため、どこに何があるかが分からなくなり、記録そのものが失われてしまう、ということ。","記録の量が増えた結果、出来事は個人の所有物ではなくなり、社会全体で共有される財産になる、ということ。","出来事を記録した本人がいなくなったあと、その記録を読み解ける人が誰もいなくなってしまう、ということ。"],"e":"同じ段落で、保存の行為が「経験を消化する手間の代わり」をし、「記録が完全になればなるほど想起は不要に」なると述べています。つまり出来事は記録の中にあるだけで、誰の心にも思い出として生きていない状態です。二つ目は記録の紛失、四つ目は読み手の不在という別の問題です。三つ目は「共有財産」という肯定的な意味にすり替えています。","m":"保存＝想起されない→誰の内にもない"},{"id":9,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の理由（記録論）","p":"　記録は忘却に抗うための技術だと考えられている。たしかに、書き留められたものは、人の記憶が薄れたあとも残り続ける。しかし記録の歴史を振り返ると、それが同時に、安心して忘れるための技術でもあったことに気づかされる。書いておけば、覚えておく必要はない。【ア】記録は記憶を補うと同時に、記憶を手放すことを許可してきたのである。\n　この二重性は、記録の量が爆発的に増えた現代において、いっそう際立っている。私たちは日々の出来事を写真や文字で絶えず保存しているが、保存したものを見返すことはまれである。保存の行為そのものが、出来事を経験し終えたという感覚を与え、経験を消化する手間の代わりをしてしまう。記録が完全になればなるほど想起は不要になり、出来事は「どこかにある」という安心の中で、【ウ】誰の内にも住まなくなる。\n　さらに見落とされがちなのは、何かを記録するという行為が、記録されなかったものを決定するという点である。文書館に収められた資料は、収集し分類した者の関心によって選ばれている。そこに残らなかった声は、単に失われたのではなく、記録の体系そのものによって〔　Ｙ　〕されたのだ。だから文書館を読むとは、そこにあるものを読むことであると同時に、そこにないものの輪郭を読むことでもある。\n　とすれば、記憶とは、記録の不足を埋める補助的な能力ではない。記憶は、ある出来事を繰り返し呼び出し、そのたびに現在との関係の中で意味を組み替える営みである。【イ】記録が過去を固定するのに対し、記憶は過去を動かし続ける。記録に頼りきることは過去を守ることのように見えて、実は過去を現在から切り離し、凍結することになりかねない。必要なのは記録を捨てることではなく、記録を想起のきっかけとして用い直すことだろう。","q":"傍線部【イ】「記録が過去を固定するのに対し、記憶は過去を動かし続ける」とあるが、記憶が「過去を動かし続ける」といえるのはなぜか。最も適当なものを選びなさい。","c":["記憶は出来事を何度も呼び出し、そのたびに現在とのかかわりの中で意味をとらえ直すものだから。","記憶は時間がたつにつれて薄れていくので、過去の出来事は正確には思い出せなくなるものだから。","記憶は記録の不足を補う能力であり、記録に残らなかった出来事を新たに付け加えていくものだから。","記憶は個人の都合のよいように過去をつくりかえるので、事実とは異なる過去が生まれるものだから。"],"e":"直前に「記憶は、ある出来事を繰り返し呼び出し、そのたびに現在との関係の中で意味を組み替える営み」とあり、これが理由です。二つ目は記憶の衰えという否定的な面にずらしています。三つ目は「記録の不足を埋める補助的な能力ではない」と本文が否定しています。四つ目は「都合のよい改変」「事実と異なる」という、本文にない価値判断を加えています。","m":"記憶＝呼び出すたびに意味を組み替える"},{"id":10,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"内容合致（記録論）","p":"　記録は忘却に抗うための技術だと考えられている。たしかに、書き留められたものは、人の記憶が薄れたあとも残り続ける。しかし記録の歴史を振り返ると、それが同時に、安心して忘れるための技術でもあったことに気づかされる。書いておけば、覚えておく必要はない。【ア】記録は記憶を補うと同時に、記憶を手放すことを許可してきたのである。\n　この二重性は、記録の量が爆発的に増えた現代において、いっそう際立っている。私たちは日々の出来事を写真や文字で絶えず保存しているが、保存したものを見返すことはまれである。保存の行為そのものが、出来事を経験し終えたという感覚を与え、経験を消化する手間の代わりをしてしまう。記録が完全になればなるほど想起は不要になり、出来事は「どこかにある」という安心の中で、【ウ】誰の内にも住まなくなる。\n　さらに見落とされがちなのは、何かを記録するという行為が、記録されなかったものを決定するという点である。文書館に収められた資料は、収集し分類した者の関心によって選ばれている。そこに残らなかった声は、単に失われたのではなく、記録の体系そのものによって〔　Ｙ　〕されたのだ。だから文書館を読むとは、そこにあるものを読むことであると同時に、そこにないものの輪郭を読むことでもある。\n　とすれば、記憶とは、記録の不足を埋める補助的な能力ではない。記憶は、ある出来事を繰り返し呼び出し、そのたびに現在との関係の中で意味を組み替える営みである。【イ】記録が過去を固定するのに対し、記憶は過去を動かし続ける。記録に頼りきることは過去を守ることのように見えて、実は過去を現在から切り離し、凍結することになりかねない。必要なのは記録を捨てることではなく、記録を想起のきっかけとして用い直すことだろう。","q":"本文の内容と合致するものを一つ選びなさい。","c":["文書館の資料を読むことは、そこに収められなかったものがどのような形で欠けているかを読むことでもある。","記録に頼ることは過去を損なうので、私たちはできるかぎり記録を捨て、記憶だけで過去と向き合うべきである。","記録の量が増えるほど、保存したものを見返す機会も増えるため、出来事を思い出すことが容易になる。","記憶は記録の不足を埋めるための補助的な能力であり、記録が完全になれば記憶は必要でなくなる。"],"e":"第三段落末に「文書館を読むとは…そこにないものの輪郭を読むことでもある」とあり、一つ目が合致します。二つ目は最終文「必要なのは記録を捨てることではなく」と矛盾します。三つ目は「保存したものを見返すことはまれ」と逆です。四つ目は「記憶とは、記録の不足を埋める補助的な能力ではない」と否定されています。","m":"ないものの輪郭を読む＝文書館の読み方"},{"id":11,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の内容（遊び論）","p":"　機械の部品には「遊び」と呼ばれるわずかな隙間が設けられている。ハンドルを少し回しても車輪がすぐには向きを変えない、あの余裕である。設計の観点からは無駄に見えるこの隙間がなければ、部品は熱による膨張や小さな衝撃を受け止められず、かえって全体が壊れやすくなる。遊びは効率の欠如ではなく、効率を長く保つための条件なのだ。\n　このことは、人間がつくる制度や組織にもあてはまる。あらゆる手順を細かく規定し、時間の使い方を隅々まで最適化した組織は、想定どおりの状況では高い成果を上げる。しかし想定外の事態が生じたとき、そこには判断を差しはさむ余地も、互いに融通し合う余裕も残されていない。【ア】最適化の徹底は、変化への脆さと引き換えに達成されている。\n　ところが現代の社会は、遊びを無駄として削り取る方向へ進みがちである。数値化された指標は、隙間を「改善の余地」として可視化し、それを埋めることを正しさとして示す。指標に照らせば、遊びは常に説明を求められる対象であり、説明できないものは削られてゆく。こうして、〔　Ｚ　〕ことが、それ自体として目的化される。\n　遊びの価値が見えにくいのは、それが働くのがまさに予期しない場面だからである。平時には何の役にも立たないように見える隙間が、危機において初めて意味をもつ。したがって遊びを守るためには、効用をあらかじめ証明できないものを、証明できないまま保持するという態度が必要になる。【イ】それは計算の放棄ではなく、計算の限界を計算に組み込むことである。","q":"傍線部【ア】「最適化の徹底は、変化への脆さと引き換えに達成されている」の説明として最も適当なものを選びなさい。","c":["手順や時間を隅々まで効率化した組織は、想定内では成果を上げるが、その分、想定外の事態に対応する余地を失っている、ということ。","最適化を徹底した組織は、変化を恐れるあまり新しい手順を導入できず、結局は成果を上げられなくなる、ということ。","組織を最適化するには、まず変化に弱い部分を見つけ出し、それを取り除く作業を先に済ませる必要がある、ということ。","想定外の事態はめったに起こらないので、変化への脆さを多少犠牲にしても最適化を進めるのは合理的だ、ということ。"],"e":"直前で、最適化した組織は「想定どおりの状況では高い成果を上げる」が、想定外の事態では「判断を差しはさむ余地も…余裕も残されていない」と述べています。成果と脆さが交換関係にあるという一つ目が正解です。二つ目は想定内でも成果が出ないとしており本文と逆です。三つ目は手順の話にずれています。四つ目は筆者の立場と反対の評価を加えています。","m":"最適化の代償＝想定外への弱さ"},{"id":12,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"空所補充（遊び論）","p":"　機械の部品には「遊び」と呼ばれるわずかな隙間が設けられている。ハンドルを少し回しても車輪がすぐには向きを変えない、あの余裕である。設計の観点からは無駄に見えるこの隙間がなければ、部品は熱による膨張や小さな衝撃を受け止められず、かえって全体が壊れやすくなる。遊びは効率の欠如ではなく、効率を長く保つための条件なのだ。\n　このことは、人間がつくる制度や組織にもあてはまる。あらゆる手順を細かく規定し、時間の使い方を隅々まで最適化した組織は、想定どおりの状況では高い成果を上げる。しかし想定外の事態が生じたとき、そこには判断を差しはさむ余地も、互いに融通し合う余裕も残されていない。【ア】最適化の徹底は、変化への脆さと引き換えに達成されている。\n　ところが現代の社会は、遊びを無駄として削り取る方向へ進みがちである。数値化された指標は、隙間を「改善の余地」として可視化し、それを埋めることを正しさとして示す。指標に照らせば、遊びは常に説明を求められる対象であり、説明できないものは削られてゆく。こうして、〔　Ｚ　〕ことが、それ自体として目的化される。\n　遊びの価値が見えにくいのは、それが働くのがまさに予期しない場面だからである。平時には何の役にも立たないように見える隙間が、危機において初めて意味をもつ。したがって遊びを守るためには、効用をあらかじめ証明できないものを、証明できないまま保持するという態度が必要になる。【イ】それは計算の放棄ではなく、計算の限界を計算に組み込むことである。","q":"空所〔　Ｚ　〕に入る表現として最も適当なものを選びなさい。","c":["隙間をなくす","遊びを守る","予期しない事態に備える","指標そのものを疑う"],"e":"空所を含む段落は、指標が隙間を「改善の余地」として見せ、「それを埋めることを正しさとして示す」結果、説明できないものが「削られてゆく」流れです。その行き着く先として「隙間をなくす」こと自体が目的になる、が入ります。「遊びを守る」「予期しない事態に備える」は筆者が最終段落で求める態度で、ここでの現代社会の傾向とは逆です。「指標そのものを疑う」も現代社会の傾向ではありません。","m":"指標→隙間を埋めることが目的化"},{"id":13,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の内容（遊び論）","p":"　機械の部品には「遊び」と呼ばれるわずかな隙間が設けられている。ハンドルを少し回しても車輪がすぐには向きを変えない、あの余裕である。設計の観点からは無駄に見えるこの隙間がなければ、部品は熱による膨張や小さな衝撃を受け止められず、かえって全体が壊れやすくなる。遊びは効率の欠如ではなく、効率を長く保つための条件なのだ。\n　このことは、人間がつくる制度や組織にもあてはまる。あらゆる手順を細かく規定し、時間の使い方を隅々まで最適化した組織は、想定どおりの状況では高い成果を上げる。しかし想定外の事態が生じたとき、そこには判断を差しはさむ余地も、互いに融通し合う余裕も残されていない。【ア】最適化の徹底は、変化への脆さと引き換えに達成されている。\n　ところが現代の社会は、遊びを無駄として削り取る方向へ進みがちである。数値化された指標は、隙間を「改善の余地」として可視化し、それを埋めることを正しさとして示す。指標に照らせば、遊びは常に説明を求められる対象であり、説明できないものは削られてゆく。こうして、〔　Ｚ　〕ことが、それ自体として目的化される。\n　遊びの価値が見えにくいのは、それが働くのがまさに予期しない場面だからである。平時には何の役にも立たないように見える隙間が、危機において初めて意味をもつ。したがって遊びを守るためには、効用をあらかじめ証明できないものを、証明できないまま保持するという態度が必要になる。【イ】それは計算の放棄ではなく、計算の限界を計算に組み込むことである。","q":"傍線部【イ】「それは計算の放棄ではなく、計算の限界を計算に組み込むことである」の説明として最も適当なものを選びなさい。","c":["予測にはおのずと限界があることを前提として、効用を前もって証明できない余裕も、あらかじめ設計の中に残しておくこと。","効用を証明できないものは計算の対象外なので、計算をやめて、直観だけに従って組織を運営すること。","計算の精度を限界まで高めることで、予期しない場面も含めたすべての事態を前もって予測しておくこと。","計算によって説明できないものを一つずつ取り除き、計算で扱える範囲だけで組織を組み立て直すこと。"],"e":"「それ」は「効用をあらかじめ証明できないものを、証明できないまま保持する」態度を指します。計算をやめるのではなく、計算が予期しない場面を見通せないことを最初から織り込み、余裕を残す、という意味です。二つ目は「計算の放棄」そのものです。三つ目は限界を認めず、すべてを予測できるとしています。四つ目は筆者が批判する「説明できないものは削られてゆく」傾向です。","m":"限界を織り込む＝証明できない余裕を残す"},{"id":14,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"筆者の主張（遊び論）","p":"　機械の部品には「遊び」と呼ばれるわずかな隙間が設けられている。ハンドルを少し回しても車輪がすぐには向きを変えない、あの余裕である。設計の観点からは無駄に見えるこの隙間がなければ、部品は熱による膨張や小さな衝撃を受け止められず、かえって全体が壊れやすくなる。遊びは効率の欠如ではなく、効率を長く保つための条件なのだ。\n　このことは、人間がつくる制度や組織にもあてはまる。あらゆる手順を細かく規定し、時間の使い方を隅々まで最適化した組織は、想定どおりの状況では高い成果を上げる。しかし想定外の事態が生じたとき、そこには判断を差しはさむ余地も、互いに融通し合う余裕も残されていない。【ア】最適化の徹底は、変化への脆さと引き換えに達成されている。\n　ところが現代の社会は、遊びを無駄として削り取る方向へ進みがちである。数値化された指標は、隙間を「改善の余地」として可視化し、それを埋めることを正しさとして示す。指標に照らせば、遊びは常に説明を求められる対象であり、説明できないものは削られてゆく。こうして、〔　Ｚ　〕ことが、それ自体として目的化される。\n　遊びの価値が見えにくいのは、それが働くのがまさに予期しない場面だからである。平時には何の役にも立たないように見える隙間が、危機において初めて意味をもつ。したがって遊びを守るためには、効用をあらかじめ証明できないものを、証明できないまま保持するという態度が必要になる。【イ】それは計算の放棄ではなく、計算の限界を計算に組み込むことである。","q":"本文における筆者の考えとして最も適当なものを選びなさい。","c":["遊びは平時には無駄に見えるが、予期しない事態を受けとめることで、効率を長く保つための条件となっている。","遊びは効率を損なう無駄であるが、人間らしい組織をつくるためには、効率を犠牲にしてでも守るべきである。","遊びの効用は数値化された指標によって初めて明らかになるので、指標をより精密にすることが必要である。","遊びは機械の設計では欠かせないが、人間の制度や組織には当てはまらない独自の原理である。"],"e":"第一段落で遊びは「効率の欠如ではなく、効率を長く保つための条件」とされ、最終段落で「危機において初めて意味をもつ」と述べています。一つ目が正解です。二つ目は遊びを「無駄」と認めており、本文と逆です。三つ目は、指標が遊びを削る原因だとする第三段落と矛盾します。四つ目は「制度や組織にもあてはまる」とする第二段落と矛盾します。","m":"遊び＝効率を長く保つ条件"},{"id":15,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（掌握）","q":"「軍の指揮権をショウアクする」の傍線部「ショウアク」を漢字に直したとき、その「ショウ」と同じ漢字を用いるものを選びなさい。","c":["ガッショウ造りの民家","隣国とのコウショウが続く","無実をショウメイする","読書をスイショウする"],"e":"「ショウアク」は「掌握（手のひらに握る＝自分の思いどおりに支配する）」です。「ガッショウ造り」は「合掌造り」で、同じ「掌」を使います。「コウショウ」は「交渉」の「渉」、「ショウメイ」は「証明」の「証」、「スイショウ」は「推奨」の「奨」で、いずれも別の字です。「掌」は「てのひら」の意味をもつ字だと覚えると、合掌・車掌・掌中などと結びつきます。","m":"掌＝てのひら（掌握・合掌・掌中）"},{"id":16,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（紛糾）","q":"「審議がフンキュウする」の傍線部「フンキュウ」を漢字に直したとき、その「フン」と同じ漢字を用いるものを選びなさい。","c":["駅でフンシツ物を届け出る","不正にフンガイする","選手たちがフンキする","決算をフンショクする"],"e":"「フンキュウ」は「紛糾（意見がもつれて、まとまらないこと）」で、「紛」は「入りまじって乱れる」意味です。「フンシツ」は「紛失（まぎれてなくなる）」で同じ字です。「フンガイ」は「憤慨」の「憤」、「フンキ」は「奮起」の「奮」、「フンショク」は「粉飾」の「粉」です。「粉飾」は形が似ていてまぎらわしいので注意しましょう。","m":"紛＝まぎれる（紛糾・紛失・紛争）"},{"id":17,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（顕著）","q":"「近年その傾向がケンチョである」の傍線部「ケンチョ」を漢字に直したとき、その「ケン」と同じ漢字を用いるものを選びなさい。","c":["ケンビ鏡で細胞を観察する","ケンヤクして暮らす","ホケンに加入する","ケンジツな経営を続ける"],"e":"「ケンチョ」は「顕著（際立って目につくさま）」で、「顕」は「あらわれる・明らかにする」意味です。「ケンビ鏡」は「顕微鏡（微小なものを明らかに見せる）」で同じ字です。「ケンヤク」は「倹約」の「倹」、「ホケン」は「保険」の「険」、「ケンジツ」は「堅実」の「堅」です。「顕在・顕彰」も同じ字です。","m":"顕＝あらわす（顕著・顕微鏡・顕在）"},{"id":18,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（逸脱）","q":"「本来の目的からイツダツする」の傍線部「イツダツ」を漢字に直したとき、その「イツ」と同じ漢字を用いるものを選びなさい。","c":["旅先でのイツワを披露する","活力がオウイツする","意見のトウイツを図る","イッカツして処理する"],"e":"「イツダツ」は「逸脱（本筋からそれること）」で、「逸」は「それる・抜け出る・すぐれる」意味です。「イツワ」は「逸話（世に知られていない話）」で同じ字です。「オウイツ」は「横溢（あふれるほど盛んなこと）」で「溢」、「トウイツ」は「統一」、「イッカツ」は「一括」でどちらも「一」です。「横溢」は字形が似ていて間違えやすい語です。","m":"逸＝それる（逸脱・逸話・逸材）"},{"id":19,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（収斂）","q":"「議論が一つの結論にシュウレンする」の傍線部「シュウレン」を漢字に直したとき、その「シュウ」と同じ漢字を用いるものを選びなさい。","c":["秋にシュウカクを祝う","シュウチの事実である","財布をシュウトクする","シュウジン環視の中"],"e":"「シュウレン」は「収斂（一つにまとまっていくこと）」で、評論でよく使われる語です。「シュウカク」は「収穫」で同じ「収」です。「シュウチ」は「周知」の「周」、「シュウトク」は「拾得（落とし物を拾うこと）」の「拾」、「シュウジン環視」は「衆人環視」の「衆」です。「収斂」の反対の方向を表す語として「拡散」を合わせて覚えるとよいでしょう。","m":"収斂＝一点にまとまる（⇔拡散）"},{"id":20,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙（敷衍）","q":"「先生の説を敷衍して述べる」の「敷衍」の意味として最も適当なものを選びなさい。","c":["意味をおし広げて、くわしく説明すること","要点だけを取り出して、短くまとめること","事実を大げさにふくらませて述べること","他人の説をそのまま引き写して述べること"],"e":"「敷衍（ふえん）」は、「敷（しく）」「衍（ひろげる）」の字のとおり、もとの考えをおし広げ、例を加えるなどしてくわしく説明することです。二つ目は「要約」で、方向が逆です。三つ目は「誇張」で、事実をゆがめる意味は「敷衍」にはありません。四つ目は「引用」「剽窃」に近い意味です。評論の「前述の議論を敷衍すれば」のような使い方に慣れておきましょう。","m":"敷衍＝おし広げてくわしく説く（⇔要約）"},{"id":21,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙（換骨奪胎）","q":"「換骨奪胎」の本来の意味として最も適当なものを選びなさい。","c":["先人の作品の発想や形式を借りながら、工夫を加えて独自の新しいものを作り出すこと","古いものを完全に捨て去り、まったく前例のない新しいものを一から作り出すこと","人や物事の外見はそのままにして、中身だけを根本から入れ替えてしまうこと","他人の作品の外見だけを少し変えて、自分の作品として発表してしまうこと"],"e":"「換骨奪胎」は、骨を取りかえ胎（子宮）を奪うという字の意味から、古人の詩文の発想や表現を生かしつつ新しい趣を加えて独自の作品にすることを言います。二つ目は先人の作品を「借りる」要素がなく誤りです。三つ目は「外見そのまま・中身を入れ替え」で意味が違います。四つ目は単なる焼き直し・盗用の意味で、本来の意味ではない誤用として注意されるものです。","m":"換骨奪胎＝先人を生かして新しく"},{"id":22,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙（捨象）","q":"「個々の事例の違いを捨象して法則を立てる」の「捨象」の意味として最も適当なものを選びなさい。","c":["共通する性質を取り出すために、それ以外の性質を考察の対象から切り捨てること","抽象的な考えを、目に見える具体的な形に置きかえて表すこと","対立する二つの考えを、より高い次元で一つにまとめること","物事の本質を、論理によらずに直接につかみとること"],"e":"「捨象」は「抽象」と表裏をなす語で、共通点を引き出す（抽象）ときに、それ以外の個別の性質を切り捨てることです。二つ目は「具象（具体化）」です。三つ目はヘーゲル哲学の「止揚（アウフヘーベン）」の説明です。四つ目は「直観」の説明です。評論では「抽象」「捨象」「具象」をセットで押さえておくと、論の流れが読みやすくなります。","m":"抽象（取り出す）と捨象（切り捨てる）"},{"id":23,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"読み（漸次）","q":"「制度は漸次改められていった」の「漸次」の読みと意味の組み合わせとして正しいものを選びなさい。","c":["ぜんじ ― だんだんと、しだいに","ざんじ ― しばらくのあいだ","ぜんじ ― いっせいに、すべて同時に","ざんじ ― 少しずつ順を追って"],"e":"「漸次」は「ぜんじ」と読み、「漸」は「ようやく・しだいに進む」意味なので、「だんだんと、しだいに」という意味になります。「ざんじ」は「暫時（しばらくのあいだ）」の読みで、字も意味も別の語です。三つ目は読みは正しいものの意味が正反対です。四つ目は意味は近いものの、読みが誤りです。「漸進的」「漸増」も同じ字です。","m":"漸＝しだいに（漸次・漸進・漸増）"},{"id":24,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙（恣意的）","q":"「資料の解釈が恣意的である」の「恣意的」の意味として最も適当なものを選びなさい。","c":["自分の思うままで、筋道立った必然性に欠けるさま","はっきりした目的をもち、計画どおりに行うさま","他人の気持ちを細かく推しはかって配慮するさま","根拠を一つずつ確かめながら、慎重に進めるさま"],"e":"「恣」は「ほしいまま」と読み、「恣意的」は自分の勝手な考えのままで、客観的な根拠や論理的な必然性がないさまを表します。二つ目は「意図的・計画的」で、「意」の字に引かれた誤りです。三つ目は「忖度」に近い意味です。四つ目は「恣意的」と反対の性質です。言語学の「言語記号の恣意性」（音と意味の結びつきに必然性がないこと）も評論で頻出です。","m":"恣＝ほしいまま→恣意的＝勝手で根拠なし"},{"id":25,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞の識別（けり）","p":"【『徒然草』第五十二段】\n仁和寺にある法師、年よるまで石清水を拝まざりければ、心憂く覚えて、ある時思ひたちて、ただ一人かちより詣でけり。極楽寺・高良などを拝みて、かばかりと心得て帰りにけり。さて、傍の人に逢ひて、「年ごろ思ひつる事果たし侍りぬ。聞きしにも過ぎて尊くこそおはしけれ。そも、参りたる人ごとに山へのぼりしは、何事かありけむ、ゆかしかりしかど、神へまゐるこそ本意なれと思ひて、山までは見ず。」とぞいひける。すこしの事にも先達はあらまほしきことなり。\n（注）石清水＝石清水八幡宮。男山の山上にある。極楽寺・高良＝男山のふもとにある寺と社。","q":"傍線部「拝まざりければ」の「けれ」の文法的説明として正しいものを選びなさい。","c":["過去の助動詞「けり」の已然形","詠嘆の助動詞「けり」の連体形","完了の助動詞「り」の已然形に「け」が付いたもの","形容詞の活用語尾"],"e":"「拝まざりければ」は「拝ま（未然形）＋ざり（打消「ず」の連用形）＋けれ＋ば」です。連用形に付き、「ば」が続いて已然形となるので、過去の助動詞「けり」の已然形です。已然形＋「ば」は確定条件（〜ので）を表し、「年をとるまで参拝しなかったので」と訳します。連体形なら「ける」になるので二つ目は誤りです。完了「り」はサ変の未然形・四段の已然形に付き、「ざり」には付きません。形容詞は「拝む」が動詞なので無関係です。","m":"連用形＋けれ＋ば＝過去けり已然形・確定条件"},{"id":26,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"敬語（おはす）","p":"【『徒然草』第五十二段】\n仁和寺にある法師、年よるまで石清水を拝まざりければ、心憂く覚えて、ある時思ひたちて、ただ一人かちより詣でけり。極楽寺・高良などを拝みて、かばかりと心得て帰りにけり。さて、傍の人に逢ひて、「年ごろ思ひつる事果たし侍りぬ。聞きしにも過ぎて尊くこそおはしけれ。そも、参りたる人ごとに山へのぼりしは、何事かありけむ、ゆかしかりしかど、神へまゐるこそ本意なれと思ひて、山までは見ず。」とぞいひける。すこしの事にも先達はあらまほしきことなり。\n（注）石清水＝石清水八幡宮。男山の山上にある。極楽寺・高良＝男山のふもとにある寺と社。","q":"傍線部「尊くこそおはしけれ」の「おはし」について、敬語の種類と、誰から誰への敬意かの組み合わせとして最も適当なものを選びなさい。","c":["尊敬語・法師から（法師が石清水八幡宮だと思っている）神仏への敬意","謙譲語・法師から傍の人への敬意","丁寧語・法師から傍の人への敬意","尊敬語・作者から仁和寺の法師への敬意"],"e":"「おはす」は「あり・居り」の尊敬語です。会話文の中なので敬意の主体は話し手の法師で、尊いと述べている対象、つまり参拝した神仏に対する敬意です。実際には法師が拝んだのはふもとの極楽寺・高良ですが、法師はそれを石清水八幡宮と思い込んでいます。謙譲語・丁寧語ではないので二つ目・三つ目は誤りです。会話文中なので、作者からの敬意とする四つ目も誤りです。直前の「侍り」は丁寧語で、こちらが傍の人への敬意です。","m":"会話文の敬語は話し手から。おはす＝尊敬"},{"id":27,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"語句の解釈（かばかりと心得て）","p":"【『徒然草』第五十二段】\n仁和寺にある法師、年よるまで石清水を拝まざりければ、心憂く覚えて、ある時思ひたちて、ただ一人かちより詣でけり。極楽寺・高良などを拝みて、かばかりと心得て帰りにけり。さて、傍の人に逢ひて、「年ごろ思ひつる事果たし侍りぬ。聞きしにも過ぎて尊くこそおはしけれ。そも、参りたる人ごとに山へのぼりしは、何事かありけむ、ゆかしかりしかど、神へまゐるこそ本意なれと思ひて、山までは見ず。」とぞいひける。すこしの事にも先達はあらまほしきことなり。\n（注）石清水＝石清水八幡宮。男山の山上にある。極楽寺・高良＝男山のふもとにある寺と社。","q":"傍線部「かばかりと心得て帰りにけり」の解釈として最も適当なものを選びなさい。","c":["石清水八幡宮の参拝はこれだけのものだと思い込んで帰ってしまった。","これほど立派な社だとは思わなかったと感心して帰ってしまった。","これくらいの参拝では足りないと反省して、いったん帰ってしまった。","山の上まで行くのはこれほど大変なのかと驚いて帰ってしまった。"],"e":"「かばかり」は「これほど・これだけ」の意味で、「心得」は「理解する・思い込む」です。法師はふもとの極楽寺・高良を拝んだだけで、それが石清水八幡宮のすべてだと思い込み、山上の本社に参らずに帰りました。後の「山までは見ず」がその証拠です。二つ目の感心、三つ目の反省、四つ目の驚きは、いずれも本文の状況と合いません。「帰りにけり」の「に」は完了の助動詞「ぬ」の連用形です。","m":"かばかり＝これだけ→ふもとで満足した失敗"},{"id":28,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"主題（先達はあらまほし）","p":"【『徒然草』第五十二段】\n仁和寺にある法師、年よるまで石清水を拝まざりければ、心憂く覚えて、ある時思ひたちて、ただ一人かちより詣でけり。極楽寺・高良などを拝みて、かばかりと心得て帰りにけり。さて、傍の人に逢ひて、「年ごろ思ひつる事果たし侍りぬ。聞きしにも過ぎて尊くこそおはしけれ。そも、参りたる人ごとに山へのぼりしは、何事かありけむ、ゆかしかりしかど、神へまゐるこそ本意なれと思ひて、山までは見ず。」とぞいひける。すこしの事にも先達はあらまほしきことなり。\n（注）石清水＝石清水八幡宮。男山の山上にある。極楽寺・高良＝男山のふもとにある寺と社。","q":"最終文「すこしの事にも先達はあらまほしきことなり」に込められた作者の考えとして最も適当なものを選びなさい。","c":["ささいなことであっても、その道に通じた案内者がいてほしいものだ。","ささいなことであれば、案内者に頼らず自分で判断するのがよい。","どんなことでも先輩に従っていれば、まちがいを犯すことはない。","先達の言うことであっても、ささいなことは聞き流してよい。"],"e":"「あらまほし」は「あってほしい・望ましい」という意味の形容詞です。法師は他の参拝者がなぜ山へ登るのか気になりながら、だれにも尋ねず、肝心の本社を拝み損ねました。そこで作者は、ちょっとしたことにも案内者（先達）がいてほしいと結んでいます。二つ目と四つ目は先達を不要とする点で逆です。三つ目の「先輩に従えば必ず失敗しない」という断定は、本文の言い方を言いすぎています。","m":"あらまほし＝あってほしい（望ましい）"},{"id":29,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"品詞の識別（なかれ）","p":"【『徒然草』第九十二段】\nある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度ただ得失なく、この一箭に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠の心、みづから知らずといへども、師これを知る。このいましめ万事にわたるべし。道を学する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞただ今の一念において、直ちにすることの甚だ難き。\n（注）もろ矢＝甲矢と乙矢の二本一組の矢。一箭＝一本の矢。懈怠＝なまけること。","q":"傍線部「持つことなかれ」の「なかれ」の文法的説明として正しいものを選びなさい。","c":["形容詞「なし」の命令形で、禁止の意味を表している。","断定の助動詞「なり」の命令形で、強い命令を表している。","終助詞「な」に係助詞が付いたもので、詠嘆を表している。","打消の助動詞「ず」の命令形で、禁止の意味を表している。"],"e":"「なかれ」は形容詞「なし」（ク活用）の命令形です。「〜ことなかれ」で「〜してはならない」という禁止を表し、漢文訓読の「勿かれ」からきた言い方です。断定の助動詞「なり」の命令形は「なれ」なので二つ目は誤りです。三つ目の終助詞「な」も禁止を表しますが、「持つな」のように文末で使います。打消「ず」の命令形は「ざれ」で、四つ目も誤りです。","m":"〜ことなかれ＝形容詞なしの命令形・禁止"},{"id":30,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"反語（思はむや）","p":"【『徒然草』第九十二段】\nある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度ただ得失なく、この一箭に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠の心、みづから知らずといへども、師これを知る。このいましめ万事にわたるべし。道を学する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞただ今の一念において、直ちにすることの甚だ難き。\n（注）もろ矢＝甲矢と乙矢の二本一組の矢。一箭＝一本の矢。懈怠＝なまけること。","q":"傍線部「一つをおろそかにせむと思はむや」の解釈として最も適当なものを選びなさい。","c":["一本をいいかげんに扱おうと思うだろうか、いや思いはしない。","一本をいいかげんに扱おうと思っているにちがいない。","一本をいいかげんに扱ってもよいと思ってほしい。","一本をいいかげんに扱おうと思っていたのだろうか。"],"e":"「せむ」の「む」は意志（〜しよう）、「思はむや」の「む」は推量、「や」は係助詞で、ここでは反語です。わずか二本の矢で、しかも師の前で一本を粗末にしようとは思わないだろう、と述べ、それでも無意識の怠け心がある、と続く文脈です。二つ目は「や」を無視して断定しています。三つ目は「む」を相手への願望と取り違えています。四つ目は単なる過去の疑問で、反語になっていません。","m":"む＋や（文末）→反語「〜だろうか、いや〜ない」"},{"id":31,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"内容説明（懈怠の心）","p":"【『徒然草』第九十二段】\nある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度ただ得失なく、この一箭に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠の心、みづから知らずといへども、師これを知る。このいましめ万事にわたるべし。道を学する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞただ今の一念において、直ちにすることの甚だ難き。\n（注）もろ矢＝甲矢と乙矢の二本一組の矢。一箭＝一本の矢。懈怠＝なまけること。","q":"傍線部「懈怠の心、みづから知らずといへども、師これを知る」の説明として最も適当なものを選びなさい。","c":["弓を習う本人は自分の怠け心に気づかなくても、師はそれを見抜いている。","弓を習う本人は怠けていると自覚しているが、師はそれに気づいていない。","師は自分の怠け心に気づかないが、弟子のほうはそれを見抜いている。","怠け心は本人にも師にも見えないので、矢の数で防ぐしかない。"],"e":"「みづから知らず」の主語は弓を習う本人、「師これを知る」の主語は師です。二本目の矢をあてにする気持ちは、本人には自覚されないほど小さなものですが、熟練した師には分かる、という意味です。そのため師は二本の矢を持つことを禁じたのです。二つ目は本人と師の立場が逆、三つ目は怠け心の持ち主を師にしています。四つ目は「師これを知る」と矛盾します。","m":"本人は気づかぬ怠け心を師は見抜く"},{"id":32,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"主旨（ただ今の一念）","p":"【『徒然草』第九十二段】\nある人弓射る事を習ふに、もろ矢をたばさみて的に向ふ。師の曰く、「初心の人二つの矢を持つことなかれ。後の矢を頼みて、初めの矢になほざりの心あり、毎度ただ得失なく、この一箭に定むべしと思へ。」といふ。わづかに二つの矢、師の前にて一つをおろそかにせむと思はむや。懈怠の心、みづから知らずといへども、師これを知る。このいましめ万事にわたるべし。道を学する人、夕には朝あらむことを思ひ、朝には夕あらむことを思ひて、重ねて懇に修せむことを期せり。況んや一刹那のうちにおいて、懈怠の心あることを知らむや。何ぞただ今の一念において、直ちにすることの甚だ難き。\n（注）もろ矢＝甲矢と乙矢の二本一組の矢。一箭＝一本の矢。懈怠＝なまけること。","q":"最終文「何ぞただ今の一念において、直ちにすることの甚だ難き」に込められた作者の考えとして最も適当なものを選びなさい。","c":["今この瞬間に、すぐさま実行することが、どうしてこれほど難しいのだろうか。","今この瞬間に考えたことを、すぐ実行するのは軽率なので避けるべきだ。","今この瞬間の思いつきで行動しても、何の成果も得られないものだ。","今この瞬間にすぐ実行することは、修行を積んだ人には簡単なことだ。"],"e":"「何ぞ〜難き」は「どうして〜難しいのか」という詠嘆を含む疑問です（連体形で結ぶ）。直前で、修行者は「後でまたていねいにやろう」と先をあてにしてしまい、一瞬の中にある怠け心にはなおさら気づかないと述べています。そこから、今すぐ実行することの難しさを嘆いています。二つ目・三つ目は、すぐ実行することを否定していて逆です。四つ目は「甚だ難き」と矛盾します。","m":"何ぞ〜難き＝今すぐ行う難しさを嘆く"},{"id":33,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"識別（おりなむ）","p":"【『徒然草』第百九段】\n高名の木のぼりといひし男、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるる時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るるともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（注）掟てて＝指図して。","q":"傍線部「飛び降るるともおりなむ」の「なむ」の文法的説明として最も適当なものを選びなさい。","c":["強意（完了）の助動詞「ぬ」の未然形＋推量の助動詞「む」の終止形","他にあつらえ望む意味の終助詞「なむ」","強調を表す係助詞「なむ」","ナ行変格活用動詞の活用語尾＋推量の助動詞「む」"],"e":"「おり」は上二段動詞「おる」で、未然形と連用形が同じ形なので、形だけでは決まりません。文脈は「この高さなら飛び降りても降りられるだろう」なので、連用形に付く強意の「ぬ」の未然形「な」＋推量の「む」で、「きっと降りられるだろう」と訳します（「られる」は訳を補ったもので、「む」に可能の意味があるわけではありません）。終助詞「なむ」（〜してほしい）は未然形に付きますが、「降りてほしい」では、なぜ注意するのかと問い返す文脈に合いません。係助詞なら結びが必要で、文末にあるのも不自然です。「おる」はナ変ではありません。","m":"連用形＋なむ＝強意ぬ＋推量む（きっと〜だろう）"},{"id":34,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"敬語（侍り）","p":"【『徒然草』第百九段】\n高名の木のぼりといひし男、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるる時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るるともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（注）掟てて＝指図して。","q":"傍線部「言葉をかけ侍りしを」の「侍り」について、敬語の種類と敬意の方向の説明として最も適当なものを選びなさい。","c":["丁寧語の補助動詞で、作者から読者への敬意を表す。","謙譲語の本動詞で、木登りの男から作者への敬意を表す。","尊敬語の補助動詞で、作者から木登りの男への敬意を表す。","丁寧語の補助動詞で、木登りの男から作者への敬意を表す。"],"e":"「侍り」は動詞「かけ」に付いた補助動詞で、丁寧語です。会話文ではなく地の文なので、敬意の主体は書き手の作者（兼好）で、対象は読者です。作者が見聞きしたことを読者に丁寧に語る言い方になっています。本動詞ではないので二つ目は誤りです。「侍り」に尊敬語の用法はないので三つ目も誤りです。地の文なので話し手は男ではなく、四つ目も誤りです。","m":"地の文の丁寧語＝作者から読者へ"},{"id":35,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"発言の意図（その事に候）","p":"【『徒然草』第百九段】\n高名の木のぼりといひし男、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるる時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るるともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（注）掟てて＝指図して。","q":"木登りの男の「その事に候。…あやまちは安き所になりて、必ず仕ることに候」という発言の趣旨として最も適当なものを選びなさい。","c":["危険な所では本人が用心するが、失敗は安全だと思って気がゆるむ所で必ず起こるので、そこで注意した。","低い所から落ちるとかえって大けがをしやすいので、高い所よりも用心する必要がある。","高い所では恐ろしくて声も出せなかったので、低い所まで来てようやく声をかけることができた。","軒の高さまで降りれば失敗しても師の責任ではないので、そこで初めて声をかけた。"],"e":"作者の「なぜ今そんなことを言うのか」という問いに、男は「まさにその点です」と答えています。目がくらむほど危ない所では本人が自分で恐れて用心するから言わない、失敗は安全な所になってから必ずするものだ、という趣旨です。二つ目は落ちたときのけがの大きさの話にすり替えています。三つ目は男自身の恐怖の話にしています。四つ目の責任逃れは本文にありません。","m":"失敗は安心した所で起こる"},{"id":36,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"作者の評価（聖人のいましめ）","p":"【『徒然草』第百九段】\n高名の木のぼりといひし男、人を掟てて、高き木にのぼせて梢をきらせしに、いと危く見えしほどはいふこともなくて、おるる時に、軒だけばかりになりて、「あやまちすな。心しておりよ。」と言葉をかけ侍りしを、「かばかりになりては、飛び降るるともおりなむ。如何にかくいふぞ。」と申し侍りしかば、「その事に候。目くるめき枝危きほどは、おのれがおそれ侍れば申さず。あやまちは安き所になりて、必ず仕ることに候。」といふ。あやしき下臈なれども、聖人のいましめにかなへり。鞠もかたき所を蹴出して後、やすくおもへば、必ずおつと侍るやらむ。\n（注）掟てて＝指図して。","q":"傍線部「あやしき下臈なれども、聖人のいましめにかなへり」の説明として最も適当なものを選びなさい。","c":["身分の低い者ではあるが、その言葉は聖人の教えと一致していると、作者は感心している。","身分の低い者なので、聖人の教えを知っているはずがないと、作者はいぶかしんでいる。","身分の低い者でありながら聖人の教えをまねているのは身のほど知らずだと、作者は批判している。","身分の低い者は、聖人の教えを守らなければ出世できないと、作者は戒めている。"],"e":"「あやしき」はここでは「身分が低い・いやしい」、「下臈」は身分の低い者、「かなへり」は「かなふ（合う）」の已然形＋存続「り」で「一致している」の意味です。経験から出た男の言葉が、油断を戒める聖人の教えと合っていると、作者は感心しています。続けて蹴鞠の例を挙げて一般化しているのもその表れです。二つ目のいぶかしむ、三つ目の批判、四つ目の出世の戒めは、いずれも本文から読み取れません。","m":"あやし＝身分が低い／かなへり＝一致している"},{"id":37,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"識別（あらそへる）","p":"【『方丈記』冒頭】\n行く川のながれは絶えずして、しかも本の水にあらず。よどみに浮ぶうたかたは、かつ消えかつ結びて久しくとどまることなし。世の中にある人とすみかと、またかくの如し。玉しきの都の中にむねをならべいらかをあらそへる、たかきいやしき人のすまひは、代々を経て尽きせぬものなれど、これをまことかと尋ぬれば、昔ありし家はまれなり。或はこぞ破れてことしは造り、あるは大家ほろびて小家となる。住む人もこれにおなじ。所もかはらず、人も多かれど、いにしへ見し人は、二三十人が中に、わづかにひとりふたりなり。あしたに死し、ゆふべに生るるならひ、ただ水の泡にぞ似たりける。知らず、生れ死ぬる人、いづかたより来りて、いづかたへか去る。又知らず、かりのやどり、誰が為に心を悩まし、何によりてか目をよろこばしむる。そのあるじとすみかと、無常をあらそひ去るさま、いはば朝顔の露にことならず。或は露おちて花のこれり。のこるといへども朝日に枯れぬ。或は花はしぼみて、露なほ消えず。消えずといへども、ゆふべを待つことなし。","q":"傍線部「いらかをあらそへる」の「る」の文法的説明として正しいものを選びなさい。","c":["存続（完了）の助動詞「り」の連体形","受身の助動詞「る」の終止形","自発の助動詞「る」の連体形","四段活用動詞「あらそふ」の活用語尾"],"e":"「あらそへ」は四段動詞「あらそふ」の已然形（命令形と同形）です。四段の已然形に付く「る」は、存続・完了の助動詞「り」の連体形で、下の「たかきいやしき人のすまひ」を修飾しています。受身・自発の「る」は四段の未然形に付くので、「あらそはる」という形になります。「あらそふ」の活用に「あらそへる」という形はありません。同じ文章の「花のこれり」の「り」も同じ助動詞です。","m":"サ変未然・四段已然（エ段）＋る＝存続・完了「り」"},{"id":38,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"語句の意味（かつ…かつ…）","p":"【『方丈記』冒頭】\n行く川のながれは絶えずして、しかも本の水にあらず。よどみに浮ぶうたかたは、かつ消えかつ結びて久しくとどまることなし。世の中にある人とすみかと、またかくの如し。玉しきの都の中にむねをならべいらかをあらそへる、たかきいやしき人のすまひは、代々を経て尽きせぬものなれど、これをまことかと尋ぬれば、昔ありし家はまれなり。或はこぞ破れてことしは造り、あるは大家ほろびて小家となる。住む人もこれにおなじ。所もかはらず、人も多かれど、いにしへ見し人は、二三十人が中に、わづかにひとりふたりなり。あしたに死し、ゆふべに生るるならひ、ただ水の泡にぞ似たりける。知らず、生れ死ぬる人、いづかたより来りて、いづかたへか去る。又知らず、かりのやどり、誰が為に心を悩まし、何によりてか目をよろこばしむる。そのあるじとすみかと、無常をあらそひ去るさま、いはば朝顔の露にことならず。或は露おちて花のこれり。のこるといへども朝日に枯れぬ。或は花はしぼみて、露なほ消えず。消えずといへども、ゆふべを待つことなし。","q":"傍線部「かつ消えかつ結びて」の意味として最も適当なものを選びなさい。","c":["一方では消え、一方では新たにできて","すっかり消えてしまってから、また結びついて","消えたり結びついたりすることが、まったくなく","ようやく消えかけたが、かろうじて形を保って"],"e":"副詞「かつ」は「〜かつ〜」と重ねて用い、「一方では〜、他方では〜」と二つのことが同時に並んで起こるさまを表します。「結ぶ」は泡が「形をなす・生じる」ことです。よどみの泡が、消えるそばから新たに生まれ、同じ泡が長くとどまることはない、という無常の比喩です。二つ目は「消えた後で」という順序の意味にしており誤りです。三つ目は直後の「久しくとどまることなし」と矛盾します。四つ目は「結ぶ」を形を保つ意味に取り違えています。","m":"かつ〜かつ〜＝一方では〜一方では〜"},{"id":39,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"比喩の内容（朝顔の露）","p":"【『方丈記』冒頭】\n行く川のながれは絶えずして、しかも本の水にあらず。よどみに浮ぶうたかたは、かつ消えかつ結びて久しくとどまることなし。世の中にある人とすみかと、またかくの如し。玉しきの都の中にむねをならべいらかをあらそへる、たかきいやしき人のすまひは、代々を経て尽きせぬものなれど、これをまことかと尋ぬれば、昔ありし家はまれなり。或はこぞ破れてことしは造り、あるは大家ほろびて小家となる。住む人もこれにおなじ。所もかはらず、人も多かれど、いにしへ見し人は、二三十人が中に、わづかにひとりふたりなり。あしたに死し、ゆふべに生るるならひ、ただ水の泡にぞ似たりける。知らず、生れ死ぬる人、いづかたより来りて、いづかたへか去る。又知らず、かりのやどり、誰が為に心を悩まし、何によりてか目をよろこばしむる。そのあるじとすみかと、無常をあらそひ去るさま、いはば朝顔の露にことならず。或は露おちて花のこれり。のこるといへども朝日に枯れぬ。或は花はしぼみて、露なほ消えず。消えずといへども、ゆふべを待つことなし。","q":"傍線部「いはば朝顔の露にことならず」とあるが、ここでの比喩の説明として最も適当なものを選びなさい。","c":["住む人を露に、住まいを朝顔の花にたとえ、どちらが先に消えても、いずれはともに消えるはかなさを示している。","住む人を朝顔の花に、住まいを露にたとえ、人は長く生きるが住まいはすぐに失われることを示している。","朝顔の露のように美しい都の家々が、人々の努力によって長く保たれていることを示している。","朝の露が昼には消えるように、悲しみもいずれは消えてなくなることを示している。"],"e":"「そのあるじとすみかと、無常をあらそひ去るさま」をたとえています。続く文で「露おちて花のこれり」「花はしぼみて、露なほ消えず」とあるので、あるじ（住む人）を露、すみか（住まい）を朝顔の花にたとえています。どちらかが残っても、花は朝日に枯れ、露は夕方まで残らない、つまり両方ともはかないのです。二つ目はたとえの対応が逆です。三つ目・四つ目は「無常をあらそひ去る」という主題からずれています。","m":"あるじ＝露、すみか＝花、ともにはかない"},{"id":40,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"内容説明（これをまことかと尋ぬれば）","p":"【『方丈記』冒頭】\n行く川のながれは絶えずして、しかも本の水にあらず。よどみに浮ぶうたかたは、かつ消えかつ結びて久しくとどまることなし。世の中にある人とすみかと、またかくの如し。玉しきの都の中にむねをならべいらかをあらそへる、たかきいやしき人のすまひは、代々を経て尽きせぬものなれど、これをまことかと尋ぬれば、昔ありし家はまれなり。或はこぞ破れてことしは造り、あるは大家ほろびて小家となる。住む人もこれにおなじ。所もかはらず、人も多かれど、いにしへ見し人は、二三十人が中に、わづかにひとりふたりなり。あしたに死し、ゆふべに生るるならひ、ただ水の泡にぞ似たりける。知らず、生れ死ぬる人、いづかたより来りて、いづかたへか去る。又知らず、かりのやどり、誰が為に心を悩まし、何によりてか目をよろこばしむる。そのあるじとすみかと、無常をあらそひ去るさま、いはば朝顔の露にことならず。或は露おちて花のこれり。のこるといへども朝日に枯れぬ。或は花はしぼみて、露なほ消えず。消えずといへども、ゆふべを待つことなし。","q":"傍線部「代々を経て尽きせぬものなれど、これをまことかと尋ぬれば、昔ありし家はまれなり」の説明として最も適当なものを選びなさい。","c":["都の家々はいつの時代も絶えずあるように見えるが、本当にそうかと調べてみると、昔からある家はほとんどない。","都の家々はたびたび焼けてなくなったが、調べてみると昔の家の多くが今も残っている。","都の家々は代々大切に受け継がれ、本当に昔のままの家ばかりが今も並んでいる。","都の家々が昔からあるという話は、調べてみるとまったくのうそだと分かった。"],"e":"「尽きせぬものなれど」は「なくならないものであるが」、「まことかと尋ぬれば」は「本当かと調べてみると」です。家並みは一見ずっと続いているようでも、実は建て替わっていて、昔からの家はまれだという、川の水と同じ構造を述べています。二つ目と三つ目は「昔ありし家はまれなり」と逆です。四つ目は「まったくのうそ」と言いすぎで、本文は「まれ（少ない）」としか言っていません。","m":"見かけは続くが中身は入れかわる（川と同じ）"},{"id":41,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"識別（泣かせ給ふ）","p":"【『宇治拾遺物語』「田舎の児、桜の散るを見て泣く事」】\nこれも今は昔、田舎の児の比叡の山へ登りたりけるが、桜のめでたく咲きたりけるに、風のはげしく吹きけるを見て、この児さめざめと泣きけるを見て、僧のやはら寄りて、「などかうは泣かせ給ふぞ。この花の散るを惜しうおぼえさせ給ふか。桜ははかなき物にて、かくほどなくうつろひ候なり。されども、さのみぞさぶらふ。」と慰めければ、「桜の散らんは、あながちにいかがせん、苦しからず。我てての作りたる麦の花散りて、実の入らざらん思ふがわびしき。」と言ひて、さくりあげて、よよと泣きける。うたてしやな。\n（注）児＝寺で修行や雑用をする少年。てて＝父。さくりあげて＝しゃくりあげて。","q":"傍線部「などかうは泣かせ給ふぞ」の「せ」の文法的説明として最も適当なものを選びなさい。","c":["尊敬の助動詞「す」の連用形","使役の助動詞「す」の連用形","サ行変格活用動詞「す」の未然形","過去の助動詞「き」の未然形"],"e":"「せ給ふ」の形で、下に尊敬の「給ふ」があり、使役の対象（だれに泣かせるのか）も示されていないので、「せ」は尊敬の助動詞「す」の連用形です。「せ給ふ」は二重尊敬（最高敬語）で、ここでは僧が児に対して高い敬意を示しています。寺の児は大切に扱われる存在だったので、会話でこうした敬語が使われます。使役なら「人に泣かせる」意味になり文脈に合いません。サ変は動詞「泣く」に続かず、過去「き」の未然形「せ」は「せば」の形で使います。","m":"せ給ふ（使役の相手なし）＝尊敬す＋給ふ"},{"id":42,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞の意味（散らん）","p":"【『宇治拾遺物語』「田舎の児、桜の散るを見て泣く事」】\nこれも今は昔、田舎の児の比叡の山へ登りたりけるが、桜のめでたく咲きたりけるに、風のはげしく吹きけるを見て、この児さめざめと泣きけるを見て、僧のやはら寄りて、「などかうは泣かせ給ふぞ。この花の散るを惜しうおぼえさせ給ふか。桜ははかなき物にて、かくほどなくうつろひ候なり。されども、さのみぞさぶらふ。」と慰めければ、「桜の散らんは、あながちにいかがせん、苦しからず。我てての作りたる麦の花散りて、実の入らざらん思ふがわびしき。」と言ひて、さくりあげて、よよと泣きける。うたてしやな。\n（注）児＝寺で修行や雑用をする少年。てて＝父。さくりあげて＝しゃくりあげて。","q":"傍線部「桜の散らんは」の「ん」の意味として最も適当なものを選びなさい。","c":["婉曲（〜ような）","意志（〜しよう）","勧誘（〜するのがよい）","打消（〜ない）"],"e":"「ん（む）」は「散ら（未然形）」に付いており、下に助詞「は」が続くので連体形です。文中で連体形の「む」は、仮定（〜としたら）・婉曲（〜ような）の意味になり、ここでは「桜が散るようなことは」と訳します。主語が桜なので意志は不自然です。勧誘は主に「〜こそ〜め」や二人称が主語の場合です。「ん」を打消と取るのは、「む」と打消「ぬ」の取り違えです。","m":"文中の連体形む（＋体言・助詞）＝仮定・婉曲"},{"id":43,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"理由（児が泣いた理由）","p":"【『宇治拾遺物語』「田舎の児、桜の散るを見て泣く事」】\nこれも今は昔、田舎の児の比叡の山へ登りたりけるが、桜のめでたく咲きたりけるに、風のはげしく吹きけるを見て、この児さめざめと泣きけるを見て、僧のやはら寄りて、「などかうは泣かせ給ふぞ。この花の散るを惜しうおぼえさせ給ふか。桜ははかなき物にて、かくほどなくうつろひ候なり。されども、さのみぞさぶらふ。」と慰めければ、「桜の散らんは、あながちにいかがせん、苦しからず。我てての作りたる麦の花散りて、実の入らざらん思ふがわびしき。」と言ひて、さくりあげて、よよと泣きける。うたてしやな。\n（注）児＝寺で修行や雑用をする少年。てて＝父。さくりあげて＝しゃくりあげて。","q":"児がさめざめと泣いた本当の理由として最も適当なものを選びなさい。","c":["風で父の作った麦の花が散り、実が入らなくなるだろうと思うと、つらかったから。","美しく咲いた桜が風で散ってしまうのが惜しくて、悲しくなったから。","僧に慰められたことで、ふるさとの父のことを思い出し、恋しくなったから。","桜が散るのはどうしようもないと言われ、自分の気持ちが分かってもらえなかったから。"],"e":"児は「桜の散らんは、あながちにいかがせん、苦しからず（桜が散るのはどうしようもないので構わない）」と言い、「我てての作りたる麦の花散りて、実の入らざらん思ふがわびしき」と続けています。つまり強い風で故郷の父の麦の花が散り、実らないことを心配して泣いたのです。二つ目は僧の誤解です。三つ目の父への恋しさ、四つ目の分かってもらえない悔しさは本文にありません。","m":"児の涙＝桜ではなく父の麦の心配"},{"id":44,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"語り手の評（うたてしやな）","p":"【『宇治拾遺物語』「田舎の児、桜の散るを見て泣く事」】\nこれも今は昔、田舎の児の比叡の山へ登りたりけるが、桜のめでたく咲きたりけるに、風のはげしく吹きけるを見て、この児さめざめと泣きけるを見て、僧のやはら寄りて、「などかうは泣かせ給ふぞ。この花の散るを惜しうおぼえさせ給ふか。桜ははかなき物にて、かくほどなくうつろひ候なり。されども、さのみぞさぶらふ。」と慰めければ、「桜の散らんは、あながちにいかがせん、苦しからず。我てての作りたる麦の花散りて、実の入らざらん思ふがわびしき。」と言ひて、さくりあげて、よよと泣きける。うたてしやな。\n（注）児＝寺で修行や雑用をする少年。てて＝父。さくりあげて＝しゃくりあげて。","q":"末尾の「うたてしやな」に込められた語り手の気持ちの説明として最も適当なものを選びなさい。","c":["桜を惜しむ風流な涙かと思ったら、麦の心配だったと分かり、興ざめして情けなく思う気持ち。","親を思う児の孝行な心に深く感動し、ほめたたえる気持ち。","児をうまく慰められなかった僧のふがいなさを、厳しく責める気持ち。","強い風で桜も麦も散ってしまう自然の厳しさを、恐ろしく思う気持ち。"],"e":"「うたてし」は「いやだ・情けない・興ざめだ」という意味の形容詞で、「や」「な」は詠嘆です。僧も読み手も、児が散る桜を惜しんで泣く風流な場面を期待していたのに、実は家の麦の実りという現実的な心配だったので、がっかりした気持ちを表しています。二つ目の感動・賞賛は「うたてし」の意味と合いません。三つ目は僧への非難、四つ目は自然への恐れで、いずれも本文の焦点からずれています。","m":"うたてし＝いやだ・興ざめだ"},{"id":45,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"終助詞（てしがな）","p":"【『竹取物語』「貴公子たちの求婚」の冒頭】\n世界の男、貴なるも賤しきも、「いかでこのかぐや姫を得てしがな、見てしがな。」と、音に聞きめでて惑ふ。その傍の垣にも家のとにも居る人だに、たはやすく見るまじきものを、夜は安きいもねず、闇の夜に出でても穴をくじり、ここかしこより覗き垣間見惑ひあへり。さる時よりなんよばひとはいひける。人の物ともせぬ処に惑ひありけども、何のしるしあるべくも見えず。家の人どもに物をだに言はんとていひかくれども、ことともせず。\n（注）家のと＝家の外。くじり＝えぐって。","q":"傍線部「いかでこのかぐや姫を得てしがな」の「てしがな」の意味として最も適当なものを選びなさい。","c":["自己の願望（〜したいものだ）","他者への願望（〜してほしい）","完了と過去（〜してしまった）","詠嘆（〜だなあ）"],"e":"「てしがな」は連用形に付いて「〜したいものだ」と話し手自身の願望を表す終助詞です（「てしか」「にしがな」も同じ）。「いかで」と呼応して「なんとかしてこのかぐや姫を手に入れたいものだ」となります。他者への願望は「なむ」です。「て（完了つ）＋し（過去き）」と分解して完了・過去と取るのは誤りです。詠嘆の「かな」と形が似ていますが、意味は願望です。","m":"てしがな・にしがな＝自己の願望"},{"id":46,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"副助詞（だに）","p":"【『竹取物語』「貴公子たちの求婚」の冒頭】\n世界の男、貴なるも賤しきも、「いかでこのかぐや姫を得てしがな、見てしがな。」と、音に聞きめでて惑ふ。その傍の垣にも家のとにも居る人だに、たはやすく見るまじきものを、夜は安きいもねず、闇の夜に出でても穴をくじり、ここかしこより覗き垣間見惑ひあへり。さる時よりなんよばひとはいひける。人の物ともせぬ処に惑ひありけども、何のしるしあるべくも見えず。家の人どもに物をだに言はんとていひかくれども、ことともせず。\n（注）家のと＝家の外。くじり＝えぐって。","q":"傍線部「その傍の垣にも家のとにも居る人だに、たはやすく見るまじきものを」の「だに」の意味として最も適当なものを選びなさい。","c":["類推（〜さえ）","限定（〜だけ）","添加（〜までも）","強調（〜こそ）"],"e":"「だに」は、程度の軽いものを挙げて、より重いものを推し量らせる類推の副助詞です。家の垣根や外にいる身近な人でさえ簡単には見られないのだから、まして遠くの者は…という文脈です。後の「物をだに言はん」の「だに」は「せめて〜だけでも」という最小限の希望の用法で、区別が必要です。限定は「のみ」、添加は「さへ」の用法です。強調の「こそ」は係助詞です。","m":"だに＝類推（〜さえ）／最小限の希望"},{"id":47,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"語源説話（よばひ）","p":"【『竹取物語』「貴公子たちの求婚」の冒頭】\n世界の男、貴なるも賤しきも、「いかでこのかぐや姫を得てしがな、見てしがな。」と、音に聞きめでて惑ふ。その傍の垣にも家のとにも居る人だに、たはやすく見るまじきものを、夜は安きいもねず、闇の夜に出でても穴をくじり、ここかしこより覗き垣間見惑ひあへり。さる時よりなんよばひとはいひける。人の物ともせぬ処に惑ひありけども、何のしるしあるべくも見えず。家の人どもに物をだに言はんとていひかくれども、ことともせず。\n（注）家のと＝家の外。くじり＝えぐって。","q":"傍線部「さる時よりなんよばひとはいひける」は、どのようなことを述べているか。最も適当なものを選びなさい。","c":["男たちが夜も眠らずに姫の家の周りをうろついたこのときから、求婚することを「よばひ」と言うようになった、という語源の説明。","男たちが大声で姫の名を呼び続けたので、近所の人々が迷惑して彼らを「よばひ」と呼んだ、という逸話。","姫が男たちを夜ごと呼び寄せたことから、姫のことを「よばひ」と呼ぶようになった、という由来。","このころから男たちは姫に会うことをあきらめ、遠くから眺めるだけになった、という変化。"],"e":"「さる時より」は「その時から」、「なん（なむ）〜ける」は係り結びです。男たちが夜の闇の中で穴をあけてのぞき見し、うろつき回ったことに、「夜這ひ（夜に這いまわる）」の字を当て、求婚を意味する「よばひ」という言葉ができたのだ、というしゃれを含んだ語源の説明です。本来「よばふ」は「呼ばふ（呼び続ける・求婚する）」ですが、作者はわざと結びつけています。二つ目〜四つ目は本文と合いません。","m":"よばひ＝求婚。夜這ひとかけた語源説明"},{"id":48,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"語句の解釈（安きいもねず）","p":"【『竹取物語』「貴公子たちの求婚」の冒頭】\n世界の男、貴なるも賤しきも、「いかでこのかぐや姫を得てしがな、見てしがな。」と、音に聞きめでて惑ふ。その傍の垣にも家のとにも居る人だに、たはやすく見るまじきものを、夜は安きいもねず、闇の夜に出でても穴をくじり、ここかしこより覗き垣間見惑ひあへり。さる時よりなんよばひとはいひける。人の物ともせぬ処に惑ひありけども、何のしるしあるべくも見えず。家の人どもに物をだに言はんとていひかくれども、ことともせず。\n（注）家のと＝家の外。くじり＝えぐって。","q":"傍線部「夜は安きいもねず」の解釈として最も適当なものを選びなさい。","c":["夜は安らかに眠ることもせず","夜は安い家にも泊まらず","夜は気楽な遊びにもふけらず","夜は休む暇もなく働きもせず"],"e":"「い」は「眠り」を表す名詞で、「いを寝（ぬ）」の形で「眠る」という意味になります。「安きいも寝ず」は「安らかな眠りも眠らず」です。「も」は係助詞、「ね」は下二段動詞「寝（ぬ）」の未然形、「ず」は打消です。姫を一目見ようと男たちが夜も眠らずにうろつく様子を描いています。二つ目は「い」を「家」と取り違えています。三つ目・四つ目は「い」の意味を取れていません。","m":"い（寝）を寝（ぬ）＝眠る"},{"id":49,"k":"plan","ref":"想定問題","f":"漢文","t":"返り点（守株）","p":"【『韓非子』五蠹】\n宋人有耕田者。田中有株。兎走触株、折頸而死。因釈其耒而守株、冀復得兎。兎不可復得、而身為宋国笑。今欲以先王之政、治当世之民、皆守株之類也。\n（注）株＝切り株。耒＝すき（田を耕す農具）。冀＝願う。先王＝古代の聖王。","q":"傍線部「因釈其耒而守株」を「因りて其の耒を釈てて株を守り」と読むとき、返り点の付け方として正しいものを選びなさい（返り点は、その字の直後に「レ」「一」「二」で示す）。","c":["因釈二其耒一而守レ株","因レ釈二其耒一而守レ株","因釈レ其耒而守レ株","因釈二其耒一而守株"],"e":"書き下し文の読む順は「因→其→耒→釈→而（置き字）→株→守」です。「釈」は二字以上へだてた「其耒」の後に読むので一・二点を使い、「釈二其耒一」とします。「守」は一字下の「株」から返るのでレ点で「守レ株」です。二つ目は「其の耒を釈つるに因りて」と、「因」まで後から読む形になります。三つ目は「其」の直後に「釈」を読むことになり不成立です。四つ目は「守株」を上から読むことになり、「株を守る」と読めません。","m":"二字以上へだてて返る＝一二点、一字＝レ点"},{"id":50,"k":"plan","ref":"想定問題","f":"漢文","t":"主旨（守株）","p":"【『韓非子』五蠹】\n宋人有耕田者。田中有株。兎走触株、折頸而死。因釈其耒而守株、冀復得兎。兎不可復得、而身為宋国笑。今欲以先王之政、治当世之民、皆守株之類也。\n（注）株＝切り株。耒＝すき（田を耕す農具）。冀＝願う。先王＝古代の聖王。","q":"この文章で、韓非が「守株」の話を通して述べようとしていることとして最も適当なものを選びなさい。","c":["時代が変わったのに、昔の聖王の政治をそのまま当世の民に用いようとするのは、愚かなことだ。","たまたま得た幸運に満足せず、農業にこつこつと励むことこそが、国を富ませる道である。","古代の聖王の政治は優れているので、当世の民を治めるにもそのまま用いるべきである。","一度成功した方法は何度でも通用するので、根気よく同じことを続けるのがよい。"],"e":"最後の「今欲以先王之政、治当世之民、皆守株之類也（今、先王の政治で当世の民を治めようとするのは、みな株を守る類である）」が結論です。一度うさぎが切り株にぶつかった偶然を当てにし続ける農夫と同じく、昔の方法に固執して時代の変化を見ない態度を批判しています。二つ目は勤労の勧めにずらしています。三つ目は韓非が批判している立場そのもので、四つ目は寓話の教訓と逆です。","m":"守株＝古いやり方に固執する愚（韓非子）"},{"id":51,"k":"plan","ref":"想定問題","f":"漢文","t":"句法（累加）","p":"【『孟子』公孫丑上】\n宋人有閔其苗之不長而揠之者。芒芒然帰、謂其人曰、「今日病矣。予助苗長矣。」其子趨而往視之、苗則槁矣。天下之不助苗長者寡矣。以為無益而舎之者、不耘苗者也。助之長者、揠苗者也。非徒無益、而又害之。\n（注）閔＝心配する。揠＝引っぱる。芒芒然＝ぐったりと疲れたさま。病＝疲れる。槁＝枯れる。舎＝捨てておく。耘＝草を取る。","q":"傍線部「非徒無益、而又害之」の解釈として最も適当なものを選びなさい。","c":["ただ役に立たないだけでなく、そのうえ害を与えてしまう。","役に立たないものではなく、むしろ害を取り除くものである。","決して無益なのではないが、それでもやはり害を与えることがある。","役に立たないからといって、すぐに害があるとは限らない。"],"e":"「非徒〜、而又…」は「徒（た）だに〜のみに非ず、而も又…」と読む累加の句法で、「ただ〜だけでなく、そのうえ…」という意味です。苗を引っぱって伸ばそうとするのは、成長の助けにならないだけでなく、苗を枯らして害を与える、ということです。二つ目は「非」を「無益」だけの否定と取り違えています。三つ目・四つ目は累加の形を読み取れていません。「不唯〜」「豈唯〜」も同じ累加の形です。","m":"非徒〜而又…＝ただ〜だけでなく…も"},{"id":52,"k":"plan","ref":"想定問題","f":"漢文","t":"主旨（助長）","p":"【『孟子』公孫丑上】\n宋人有閔其苗之不長而揠之者。芒芒然帰、謂其人曰、「今日病矣。予助苗長矣。」其子趨而往視之、苗則槁矣。天下之不助苗長者寡矣。以為無益而舎之者、不耘苗者也。助之長者、揠苗者也。非徒無益、而又害之。\n（注）閔＝心配する。揠＝引っぱる。芒芒然＝ぐったりと疲れたさま。病＝疲れる。槁＝枯れる。舎＝捨てておく。耘＝草を取る。","q":"この文章で孟子が述べようとしていることとして最も適当なものを選びなさい。","c":["物事の成長を放っておくのもいけないが、無理に早めようと手を加えるのはかえって害になる。","苗はすぐに枯れるので、毎日見回って少しずつ引っぱり、成長を助けてやるのがよい。","世の中には苗の成長を気にかける人が少ないので、もっと農業に関心をもつべきである。","苗の世話は家族に任せず、自分の手で行わなければ、思うような成果は得られない。"],"e":"孟子は二種類の失敗を挙げています。「無益として捨てておく者」は草取りもしない者で、「成長を助ける者」は苗を引っぱる者です。後者は役に立たないうえに害を与えると述べています。つまり、怠って放置するのもいけないが、無理に成長を急がせるのはもっと悪い、ということです（「助長」の語源）。二つ目は宋人の誤りそのものです。三つ目は「天下之不助苗長者寡矣（苗を引っぱらない者は少ない）」の読み違いです。四つ目は本文と無関係です。","m":"助長＝無理に伸ばして害する（放置もだめ）"},{"id":53,"k":"plan","ref":"想定問題","f":"漢文","t":"二重否定（無不）","p":"【『韓非子』難一】\n楚人有鬻楯与矛者。誉之曰、「吾楯之堅、物莫能陥也。」又誉其矛曰、「吾矛之利、於物無不陥也。」或曰、「以子之矛陥子之楯、何如。」其人弗能応也。夫不可陥之楯与無不陥之矛、不可同世而立。今堯舜之不可両誉、矛楯之説也。\n（注）鬻＝売る。陥＝突き通す。この話の直前で韓非は、儒者が聖王の堯の政治の明察と、その治世で人々を感化した舜の徳とを、ともにほめたたえることを批判している。","q":"傍線部「吾矛之利、於物無不陥也」の解釈として最も適当なものを選びなさい。","c":["わたしの矛の鋭さといったら、どんなものでも突き通さないものはない。","わたしの矛は鋭いが、どんなものでも突き通せるわけではない。","わたしの矛の鋭さでは、突き通すことのできるものは何もない。","わたしの矛は、ものを突き通さないように鋭さを抑えてある。"],"e":"「無不〜」は「〜ざる（は）無し」と読む二重否定で、「〜しないものはない」、つまり「すべて〜する」という強い肯定を表します。書き下しは「吾が矛の利なること、物に於いて陥さざる無きなり」です。二つ目は「不必〜（必ずしも〜ず）」のような部分否定の意味にしています。三つ目は「無不」の「不」を読み落とした全否定です。四つ目は本文と無関係です。楯の「物莫能陥也（物の能く陥すもの莫きなり）」と対になっています。","m":"無不〜＝〜ざるは無し（すべて〜する）"},{"id":54,"k":"plan","ref":"想定問題","f":"漢文","t":"主旨（矛盾）","p":"【『韓非子』難一】\n楚人有鬻楯与矛者。誉之曰、「吾楯之堅、物莫能陥也。」又誉其矛曰、「吾矛之利、於物無不陥也。」或曰、「以子之矛陥子之楯、何如。」其人弗能応也。夫不可陥之楯与無不陥之矛、不可同世而立。今堯舜之不可両誉、矛楯之説也。\n（注）鬻＝売る。陥＝突き通す。この話の直前で韓非は、儒者が聖王の堯の政治の明察と、その治世で人々を感化した舜の徳とを、ともにほめたたえることを批判している。","q":"傍線部「今堯舜之不可両誉、矛楯之説也」で韓非が言おうとしていることとして最も適当なものを選びなさい。","c":["堯の政治が完全なら舜が人々を感化する必要はなく、舜をたたえれば堯の政治は不完全だったことになるので、二人を同時にほめるのは矛と楯の話と同じく成り立たない。","堯と舜はどちらも優れた聖王なので、矛と楯のように、どちらが上かを比べてはならない。","堯と舜をほめたたえるのは、矛と楯を売る商人のように、自分の利益のためにすぎない。","堯と舜は武力によって天下を治めたので、矛と楯のたとえで二人の功績を説明できる。"],"e":"「不可両誉」は「両（ふた）つながら誉むべからず（二つ同時にほめることはできない）」と読みます。注にあるように、儒者は堯の明察と舜の徳による感化をともに称賛しますが、堯の治世が完全なら舜が乱れを正す必要はなかったはずです。どちらかをたたえると他方が否定されるので、「どんな物も通さない楯」と「どんな物も通す矛」が同時に成り立たないのと同じ論理だ、というのです。二つ目〜四つ目は、両立しないという論点を外しています。","m":"両立しない二つをともにほめる＝矛盾"},{"id":55,"k":"plan","ref":"想定問題","f":"漢文","t":"句法（選択疑問）","p":"【『荘子』斉物論】\n昔者荘周夢為胡蝶。栩栩然胡蝶也。自喩適志与、不知周也。俄然覚、則蘧蘧然周也。不知周之夢為胡蝶与、胡蝶之夢為周与。周与胡蝶、則必有分矣。此之謂物化。\n（注）荘周＝荘子の名。栩栩然＝ひらひらと楽しげに舞うさま。自喩適志＝自分で楽しんで心にかなう。俄然＝にわかに。蘧蘧然＝はっと驚くさま。","q":"傍線部「不知周之夢為胡蝶与、胡蝶之夢為周与」の解釈として最も適当なものを選びなさい。","c":["荘周が夢で胡蝶になったのか、それとも胡蝶が夢で荘周になっているのか、分からない。","荘周も胡蝶も、自分が夢を見ていることに気づいていない。","荘周が夢で胡蝶になったことを、胡蝶は知らないままである。","荘周は胡蝶の夢を見たが、胡蝶は荘周の夢を見ることはない。"],"e":"「与（か・や）」は文末の疑問の助字で、二つの「〜与」を並べて「〜か、…か」という選択の疑問を作っています。書き下しは「知らず、周の夢に胡蝶と為れるか、胡蝶の夢に周と為れるかを」です。目覚めた今の自分が、胡蝶の見ている夢かもしれないという問いかけです。二つ目・三つ目は「不知」の目的語を取り違えています。四つ目は一方を否定しており、選択の疑問になっていません。","m":"A与、B与＝Aか、Bか（選択疑問）"},{"id":56,"k":"plan","ref":"想定問題","f":"漢文","t":"主旨（物化）","p":"【『荘子』斉物論】\n昔者荘周夢為胡蝶。栩栩然胡蝶也。自喩適志与、不知周也。俄然覚、則蘧蘧然周也。不知周之夢為胡蝶与、胡蝶之夢為周与。周与胡蝶、則必有分矣。此之謂物化。\n（注）荘周＝荘子の名。栩栩然＝ひらひらと楽しげに舞うさま。自喩適志＝自分で楽しんで心にかなう。俄然＝にわかに。蘧蘧然＝はっと驚くさま。","q":"文章末の「周与胡蝶、則必有分矣。此之謂物化」の説明として最も適当なものを選びなさい。","c":["荘周と胡蝶には確かに区別があるが、その区別ある物どうしの間を移り変わっていくことを「物化」と呼んでいる。","荘周と胡蝶には区別がまったくないので、夢と現実も同じものであり、それを「物化」と呼んでいる。","荘周と胡蝶は区別されるべきなので、夢の世界に心を奪われないように戒めることを「物化」と呼んでいる。","荘周が修行によって胡蝶の姿に変身する術を身につけたことを「物化」と呼んでいる。"],"e":"「必有分矣」は「必ず分有り（きっと区別がある）」と読みます。荘子は荘周と胡蝶の区別を否定してはおらず、区別ある物が互いに入れかわり変化していく万物のあり方を「物化」と呼んでいます。二つ目は「必有分」と矛盾します。三つ目は夢への戒めという本文にない教訓です。四つ目は変身の術という俗な解釈で、本文の思想とは無関係です。","m":"物化＝区別ある物が移り変わること"},{"id":57,"k":"plan","ref":"想定問題","f":"漢文","t":"再読文字（将）","p":"【『孟子』公孫丑上】\n所以謂人皆有不忍人之心者、今人乍見孺子将入於井、皆有怵惕惻隠之心。非所以内交於孺子之父母也。非所以要誉於郷党朋友也。非悪其声而然也。由是観之、無惻隠之心、非人也。無羞悪之心、非人也。無辞譲之心、非人也。無是非之心、非人也。惻隠之心、仁之端也。羞悪之心、義之端也。辞譲之心、礼之端也。是非之心、智之端也。\n（注）不忍人之心＝他人の不幸を見過ごせない心。孺子＝幼児。怵惕＝はっと驚き恐れる。惻隠＝あわれみいたむ。内交＝交際を結ぶ。要＝求める。","q":"傍線部「孺子将入於井」の読みと意味の組み合わせとして正しいものを選びなさい。","c":["孺子の将に井に入らんとするを ― 幼児が今にも井戸に落ちそうになっているのを","孺子の将に井に入るべきを ― 幼児が当然井戸に落ちるはずなのを","孺子の将ゐて井に入るを ― 幼児が人を連れて井戸に入っていくのを","孺子の猶ほ井に入るがごときを ― 幼児がまるで井戸に入るようであるのを"],"e":"「将」は再読文字で、「将（まさ）に〜んとす」と読み、「今にも〜しようとする」という意味です。「於」は置き字で読みません。人が井戸に落ちかけた幼児を見ると、だれでもはっとしてあわれむ心が起こる、という孟子の有名な例です。二つ目の「当（まさ）に〜べし」は当然、四つ目の「猶ほ〜ごとし」は比況を表す別の再読文字です。三つ目は「将」を「ひきいる」と読んでおり、文意に合いません。","m":"将・且＝まさに〜んとす（今にも〜する）"},{"id":58,"k":"plan","ref":"想定問題","f":"漢文","t":"主旨（四端）","p":"【『孟子』公孫丑上】\n所以謂人皆有不忍人之心者、今人乍見孺子将入於井、皆有怵惕惻隠之心。非所以内交於孺子之父母也。非所以要誉於郷党朋友也。非悪其声而然也。由是観之、無惻隠之心、非人也。無羞悪之心、非人也。無辞譲之心、非人也。無是非之心、非人也。惻隠之心、仁之端也。羞悪之心、義之端也。辞譲之心、礼之端也。是非之心、智之端也。\n（注）不忍人之心＝他人の不幸を見過ごせない心。孺子＝幼児。怵惕＝はっと驚き恐れる。惻隠＝あわれみいたむ。内交＝交際を結ぶ。要＝求める。","q":"この文章の内容の説明として最も適当なものを選びなさい。","c":["幼児を救いたいと思う心は、利益や評判を考えて起こるものではなく、人に本来そなわっていて、仁の芽ばえとなる。","幼児を救うのは、その親と親しくなったり、村で評判を得たりするためであり、それも人の自然な心である。","惻隠・羞悪・辞譲・是非の心は、学問によって後から身につけるものであり、学ばない者にはそなわらない。","惻隠の心は智の芽ばえ、是非の心は仁の芽ばえであり、四つの心はすべて同じ一つの心である。"],"e":"孟子は、幼児が井戸に落ちかけるのを見て思わず起こるあわれみの心は、親と交際するためでも、評判を求めるためでも、非難の声を嫌うためでもないと三つの否定を重ね、それが人に生まれつきある心だと示します。そして惻隠は仁、羞悪は義、辞譲は礼、是非は智の「端（芽ばえ）」だとします（性善説・四端説）。二つ目は本文が否定する動機です。三つ目は「無〜之心、非人也」と矛盾します。四つ目は仁と智の対応が逆です。","m":"惻隠→仁・羞悪→義・辞譲→礼・是非→智"},{"id":59,"k":"plan","ref":"想定問題","f":"漢文","t":"解釈（学而不思）","p":"【『論語』為政】\n子曰、「吾十有五而志于学。三十而立。四十而不惑。五十而知天命。六十而耳順。七十而従心所欲、不踰矩。」\n子曰、「学而不思則罔、思而不学則殆。」\n子曰、「由、誨女知之乎。知之為知之、不知為不知。是知也。」\n（注）矩＝さしがね。転じて、人として守るべき規範。罔＝道理にくらい。殆＝あやうい。由＝弟子の子路の名。女＝なんぢ。","q":"傍線部「学而不思則罔、思而不学則殆」の解釈として最も適当なものを選びなさい。","c":["学ぶだけで自分で考えなければ物事の道理にくらく、考えるだけで学ばなければ独断に陥って危うい。","学んだことはすぐに忘れてしまうので、考えることよりも、繰り返し学ぶことのほうが大切である。","学ぶことと考えることは、どちらか一方に集中して取り組めば、もう一方は必要なくなる。","学ぶことも考えることもせずにいると、道理にくらくなり、身を危うくすることになる。"],"e":"「〜則…」は「〜ならば…」の条件を表し、二つの句が対になっています。前半は「学びて思はざれば則ち罔（くら）し」で、知識を取り入れても自分で考えなければ本当には分からないこと、後半は「思ひて学ばざれば則ち殆（あやふ）し」で、自分で考えるだけで学ばなければ独りよがりで危ういことを言います。学と思の両立を説いており、二つ目・三つ目は一方を重視しすぎています。四つ目は二つの条件を一つにまとめてしまっています。","m":"学（知識）と思（思索）は両方必要"},{"id":60,"k":"plan","ref":"想定問題","f":"漢文","t":"書き下し（従心所欲）","p":"【『論語』為政】\n子曰、「吾十有五而志于学。三十而立。四十而不惑。五十而知天命。六十而耳順。七十而従心所欲、不踰矩。」\n子曰、「学而不思則罔、思而不学則殆。」\n子曰、「由、誨女知之乎。知之為知之、不知為不知。是知也。」\n（注）矩＝さしがね。転じて、人として守るべき規範。罔＝道理にくらい。殆＝あやうい。由＝弟子の子路の名。女＝なんぢ。","q":"傍線部「七十而従心所欲、不踰矩」の書き下し文として正しいものを選びなさい。","c":["七十にして心の欲する所に従へども、矩を踰えず。","七十にして心を従へ欲する所、矩を踰えず。","七十にして欲する所の心に従ひ、踰えざるの矩なり。","七十にして心に従ひて欲す、所は矩を踰えず。"],"e":"「所」は下の動詞から返って「〜所」と読み、「心所欲」は「心の欲する所（心が望むこと）」となります。全体は「心の欲するままに行動しても、人としての規範を越えることがない」という意味で、孔子が七十歳で到達した境地です。「心の欲する所に従ひて」と読む本もありますが、どちらも「所」を下から返して読みます。二つ目は「従」と「心」の関係を誤っています。三つ目・四つ目は「所」の返読を誤っています。この章から、十五歳を「志学」、三十歳を「而立」、四十歳を「不惑」、五十歳を「知命」、六十歳を「耳順」、七十歳を「従心」と言います。","m":"所＋動詞＝〜する所（返読）。七十＝従心"},{"id":61,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の内容（予報論）","p":"　明日の降水確率は三十パーセント、と予報は告げる。傘を持って出るべきかどうか、私たちはこの数字を前にして迷う。そして、雨が降らなければ予報が外れたと言い、降れば当たったと言う。だが、三十パーセントという予報は、雨が降っても降らなくても、それだけで外れたことにはならない。それは、三十パーセントという予報が百回出されたとき、そのうちおよそ三十回は雨が降る、という意味の数字だからである。\n　【ア】予報の数字は、明日という一回きりの日について語りながら、実は数多くの予報の集まりについて語っている。私たちが知りたいのは明日の空のことなのに、予報が差し出せるのは、似た条件のもとでの傾向だけなのだ。予報を受け取る者のとまどいは、ここに根をもっている。\n　それでも予報が役に立つのは、それが判断を代わりに下してくれるからではない。三十パーセントで傘を持つ人もいれば、持たない人もいる。濡らしてはならない書類を抱えて出かける日と、近所へ散歩に出る日とでは、同じ数字の重みが違ってくる。数字は〔　Ｘ　〕であって、どう備えるかを決めるのは、それぞれの事情を知っている受け手のほうである。\n　もし予報が「晴れ」「雨」と言い切る形だけで伝えられるとしたらどうだろう。言い切りは分かりやすいが、外れたときには予報する側だけが責められることになる。確率で語る予報は、不確かさを隠さずに差し出すことで、判断の責任の一部を受け手に返している。【イ】確率で語ることは、知らないことを認めることであると同時に、未来に向き合う仕事を、予報する者と受け取る者とで分け合うことなのである。","q":"傍線部【ア】「予報の数字は、明日という一回きりの日について語りながら、実は数多くの予報の集まりについて語っている」とはどういうことか。最も適当なものを選びなさい。","c":["降水確率は、明日一日に雨が降るかどうかを直接言い当てるものではなく、同じ数値の予報がくり返し出されたときに雨が降る割合を示すものなので、一回きりの明日については傾向しか示せないということ。","予報の数字は、明日の天気だけでなく、明後日以降の数日分の天気もまとめて見積もったものなので、一日ごとの天気は分からないということ。","予報の数字は、過去の同じ日付に雨が降った回数を数えたものなので、その年の空模様とは関係なく決まっているということ。","予報の数字は、多くの予報官が話し合って多数決で決めたものなので、一人の判断よりも信頼できるということ。"],"e":"第一段落によれば、降水確率三十パーセントとは「そういう予報が百回出されたとき、およそ三十回は雨が降る」という意味です。数字が語っているのは多くの予報の集まりにおける割合であり、知りたい明日一日については「傾向」しか差し出せません。「明後日以降の数日分」は、一日と複数日の話にすり替えています。「過去の同じ日付」は、本文の説明と異なる根拠を持ち出しています。「多数決」は本文にない内容です。","m":"確率＝多くの予報の集まりでの割合"},{"id":62,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"空所補充（予報論）","p":"　明日の降水確率は三十パーセント、と予報は告げる。傘を持って出るべきかどうか、私たちはこの数字を前にして迷う。そして、雨が降らなければ予報が外れたと言い、降れば当たったと言う。だが、三十パーセントという予報は、雨が降っても降らなくても、それだけで外れたことにはならない。それは、三十パーセントという予報が百回出されたとき、そのうちおよそ三十回は雨が降る、という意味の数字だからである。\n　【ア】予報の数字は、明日という一回きりの日について語りながら、実は数多くの予報の集まりについて語っている。私たちが知りたいのは明日の空のことなのに、予報が差し出せるのは、似た条件のもとでの傾向だけなのだ。予報を受け取る者のとまどいは、ここに根をもっている。\n　それでも予報が役に立つのは、それが判断を代わりに下してくれるからではない。三十パーセントで傘を持つ人もいれば、持たない人もいる。濡らしてはならない書類を抱えて出かける日と、近所へ散歩に出る日とでは、同じ数字の重みが違ってくる。数字は〔　Ｘ　〕であって、どう備えるかを決めるのは、それぞれの事情を知っている受け手のほうである。\n　もし予報が「晴れ」「雨」と言い切る形だけで伝えられるとしたらどうだろう。言い切りは分かりやすいが、外れたときには予報する側だけが責められることになる。確率で語る予報は、不確かさを隠さずに差し出すことで、判断の責任の一部を受け手に返している。【イ】確率で語ることは、知らないことを認めることであると同時に、未来に向き合う仕事を、予報する者と受け取る者とで分け合うことなのである。","q":"空所〔　Ｘ　〕に入る語として最も適当なものを選びなさい。","c":["材料","結論","命令","保証"],"e":"直前で、同じ三十パーセントでも傘を持つ人と持たない人がいて、用事によって数字の重みが変わると述べ、直後で「どう備えるかを決めるのは…受け手のほうである」と続けています。数字は判断を下すための「材料」にすぎないという文意です。「結論」「命令」は、判断を受け手が決めるという直後の内容と逆です。「保証」は、雨が降るかどうかを確約するものではないという本文の主旨に反します。","m":"数字は判断の材料、決めるのは受け手"},{"id":63,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の説明（予報論）","p":"　明日の降水確率は三十パーセント、と予報は告げる。傘を持って出るべきかどうか、私たちはこの数字を前にして迷う。そして、雨が降らなければ予報が外れたと言い、降れば当たったと言う。だが、三十パーセントという予報は、雨が降っても降らなくても、それだけで外れたことにはならない。それは、三十パーセントという予報が百回出されたとき、そのうちおよそ三十回は雨が降る、という意味の数字だからである。\n　【ア】予報の数字は、明日という一回きりの日について語りながら、実は数多くの予報の集まりについて語っている。私たちが知りたいのは明日の空のことなのに、予報が差し出せるのは、似た条件のもとでの傾向だけなのだ。予報を受け取る者のとまどいは、ここに根をもっている。\n　それでも予報が役に立つのは、それが判断を代わりに下してくれるからではない。三十パーセントで傘を持つ人もいれば、持たない人もいる。濡らしてはならない書類を抱えて出かける日と、近所へ散歩に出る日とでは、同じ数字の重みが違ってくる。数字は〔　Ｘ　〕であって、どう備えるかを決めるのは、それぞれの事情を知っている受け手のほうである。\n　もし予報が「晴れ」「雨」と言い切る形だけで伝えられるとしたらどうだろう。言い切りは分かりやすいが、外れたときには予報する側だけが責められることになる。確率で語る予報は、不確かさを隠さずに差し出すことで、判断の責任の一部を受け手に返している。【イ】確率で語ることは、知らないことを認めることであると同時に、未来に向き合う仕事を、予報する者と受け取る者とで分け合うことなのである。","q":"傍線部【イ】「確率で語ることは、知らないことを認めることであると同時に、未来に向き合う仕事を、予報する者と受け取る者とで分け合うことなのである」の説明として最も適当なものを選びなさい。","c":["確率で語る予報は、未来が確実には分からないことを率直に示すとともに、その不確かさを踏まえてどう備えるかの判断を受け手にもゆだね、未来への対処を両者で分担する形をとっているということ。","確率で語る予報は、外れたときに予報する側が責任を逃れるための言い訳にすぎず、受け手に不必要な迷いを押しつけているということ。","確率で語ることを重ねていけば、予報はやがて未来を完全に言い当てられるようになり、受け手は判断に迷わなくなるということ。","確率で語る予報は分かりにくいので、受け手は数字の意味を考えず、予報する者の判断にすべてを任せるべきだということ。"],"e":"直前で、言い切る予報は外れたとき予報する側だけが責められるのに対し、確率で語る予報は「不確かさを隠さずに差し出すことで、判断の責任の一部を受け手に返している」と述べています。傍線部はこれを、知らないことを認めつつ、未来への備えを両者で分担することだとまとめています。「言い訳にすぎず」は、筆者の肯定的な評価を否定的にすり替えています。「完全に言い当てられる」は本文にありません。「すべてを任せるべき」は分担と逆です。","m":"確率予報＝不確かさを認め、判断を分け合う"},{"id":64,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"内容合致（予報論）","p":"　明日の降水確率は三十パーセント、と予報は告げる。傘を持って出るべきかどうか、私たちはこの数字を前にして迷う。そして、雨が降らなければ予報が外れたと言い、降れば当たったと言う。だが、三十パーセントという予報は、雨が降っても降らなくても、それだけで外れたことにはならない。それは、三十パーセントという予報が百回出されたとき、そのうちおよそ三十回は雨が降る、という意味の数字だからである。\n　【ア】予報の数字は、明日という一回きりの日について語りながら、実は数多くの予報の集まりについて語っている。私たちが知りたいのは明日の空のことなのに、予報が差し出せるのは、似た条件のもとでの傾向だけなのだ。予報を受け取る者のとまどいは、ここに根をもっている。\n　それでも予報が役に立つのは、それが判断を代わりに下してくれるからではない。三十パーセントで傘を持つ人もいれば、持たない人もいる。濡らしてはならない書類を抱えて出かける日と、近所へ散歩に出る日とでは、同じ数字の重みが違ってくる。数字は〔　Ｘ　〕であって、どう備えるかを決めるのは、それぞれの事情を知っている受け手のほうである。\n　もし予報が「晴れ」「雨」と言い切る形だけで伝えられるとしたらどうだろう。言い切りは分かりやすいが、外れたときには予報する側だけが責められることになる。確率で語る予報は、不確かさを隠さずに差し出すことで、判断の責任の一部を受け手に返している。【イ】確率で語ることは、知らないことを認めることであると同時に、未来に向き合う仕事を、予報する者と受け取る者とで分け合うことなのである。","q":"本文の内容と合致するものを一つ選びなさい。","c":["降水確率三十パーセントと予報された日に雨が降らなかったとしても、それだけで予報が外れたことにはならない。","同じ降水確率であれば、どのような用事で出かける人にとっても、傘を持つべきかどうかの答えは一つに決まる。","確率で語る予報は不確かさを隠しているので、言い切る予報よりも受け手に不親切だと筆者は述べている。","予報が当たったかどうかは、その日に雨が降ったかどうかだけを見れば判断できると筆者は考えている。"],"e":"第一段落に、三十パーセントという予報は「雨が降っても降らなくても、それだけで外れたことにはならない」とあり、合致します。「答えは一つに決まる」は、用事によって同じ数字の重みが違うという第三段落に反します。「不確かさを隠している」は、「不確かさを隠さずに差し出す」という第四段落と逆です。「雨が降ったかどうかだけを見れば判断できる」は、筆者が問題にしている受け取り方そのものです。","m":"一回の結果で確率予報の当否は決まらない"},{"id":65,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の内容（標本論）","p":"　博物館の収蔵庫には、針で留められた昆虫や、薬液に浸された魚が、数えきれないほど眠っている。標本の多くは、採集した生きものを腐らないように処理し、ラベルを付けて保存したものである。ラベルには、いつ、どこで、誰が採ったのかが書き込まれる。\n　標本の価値は、それが変わらないことにある。生きた蝶は飛び去り、季節が変われば姿を消すが、標本の蝶は百年後にも同じ翅を広げている。だからこそ、遠く離れた土地で、異なる年に採られた個体どうしを並べ、翅の模様のわずかな違いを確かめることができる。【ア】比較という知の営みは、対象を時間の流れから取り出すことによって可能になった。\n　しかし、取り出されたものは、取り出される前のすべてを保っているわけではない。その蝶がどの花を好み、どんな風の日に飛び、何に食べられていたのかは、針で留められた翅からは読み取れない。標本が語るのは、生きものの〔　Ｙ　〕であって、その暮らしではない。\n　ところが近年、標本に残された組織から遺伝子を調べたり、ラベルの記録をつなぎ合わせて分布の移り変わりをたどったりする研究が進んでいる。採集した人が思いもしなかった問いに、古い標本が答えはじめているのである。標本は過去を閉じ込めた箱ではなく、後の時代の問いを待つ記録でもある。【イ】ものを保存するとは、それを今の目的のために使い切ることではなく、まだ誰も立てていない問いのために、余地を残しておくことなのだ。","q":"傍線部【ア】「比較という知の営みは、対象を時間の流れから取り出すことによって可能になった」とはどういうことか。最も適当なものを選びなさい。","c":["生きものを変化しない状態にして保存することで、異なる場所や年に採られた個体を同じ条件で並べ、そのわずかな違いを確かめられるようになったということ。","生きものを長く飼育し続けることで、季節ごとの姿の変化を一つの個体で観察できるようになったということ。","標本を作る技術が進んだことで、生きものの好む花や天敵といった暮らしの様子まで、一つの標本から読み取れるようになったということ。","長い時間をかけて多くの標本を集めた研究者ほど、ほかの研究者よりも正しい結論を出せるようになったということ。"],"e":"直前で、生きた蝶は飛び去り姿を消すが、標本の蝶は百年後も同じ翅を広げているので、離れた土地や異なる年の個体を並べて違いを確かめられると述べています。変わらない状態に固定することが比較を可能にしたのです。「長く飼育し続ける」は、時間の流れの中に置いたままの観察で逆です。「暮らしの様子まで読み取れる」は、翅からは読み取れないという第三段落に反します。「研究者ほど正しい」は本文にない内容です。","m":"時間から取り出す＝固定するから比べられる"},{"id":66,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"空所補充（標本論）","p":"　博物館の収蔵庫には、針で留められた昆虫や、薬液に浸された魚が、数えきれないほど眠っている。標本の多くは、採集した生きものを腐らないように処理し、ラベルを付けて保存したものである。ラベルには、いつ、どこで、誰が採ったのかが書き込まれる。\n　標本の価値は、それが変わらないことにある。生きた蝶は飛び去り、季節が変われば姿を消すが、標本の蝶は百年後にも同じ翅を広げている。だからこそ、遠く離れた土地で、異なる年に採られた個体どうしを並べ、翅の模様のわずかな違いを確かめることができる。【ア】比較という知の営みは、対象を時間の流れから取り出すことによって可能になった。\n　しかし、取り出されたものは、取り出される前のすべてを保っているわけではない。その蝶がどの花を好み、どんな風の日に飛び、何に食べられていたのかは、針で留められた翅からは読み取れない。標本が語るのは、生きものの〔　Ｙ　〕であって、その暮らしではない。\n　ところが近年、標本に残された組織から遺伝子を調べたり、ラベルの記録をつなぎ合わせて分布の移り変わりをたどったりする研究が進んでいる。採集した人が思いもしなかった問いに、古い標本が答えはじめているのである。標本は過去を閉じ込めた箱ではなく、後の時代の問いを待つ記録でもある。【イ】ものを保存するとは、それを今の目的のために使い切ることではなく、まだ誰も立てていない問いのために、余地を残しておくことなのだ。","q":"空所〔　Ｙ　〕に入る語として最も適当なものを選びなさい。","c":["形","生態","価値","未来"],"e":"直前で、蝶が好む花や飛ぶ日の風、天敵は「針で留められた翅からは読み取れない」と述べ、第二段落では標本で「翅の模様」を比べられると述べています。標本が伝えるのは目に見える姿、つまり「形」であって暮らしではない、という対比です。「生態」は暮らしとほぼ同じ意味で、「暮らしではない」と打ち消す文と矛盾します。「価値」「未来」は、翅から読み取れることと暮らしとを対比する文脈に合いません。","m":"標本が語るのは形、暮らしではない"},{"id":67,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の説明（標本論）","p":"　博物館の収蔵庫には、針で留められた昆虫や、薬液に浸された魚が、数えきれないほど眠っている。標本の多くは、採集した生きものを腐らないように処理し、ラベルを付けて保存したものである。ラベルには、いつ、どこで、誰が採ったのかが書き込まれる。\n　標本の価値は、それが変わらないことにある。生きた蝶は飛び去り、季節が変われば姿を消すが、標本の蝶は百年後にも同じ翅を広げている。だからこそ、遠く離れた土地で、異なる年に採られた個体どうしを並べ、翅の模様のわずかな違いを確かめることができる。【ア】比較という知の営みは、対象を時間の流れから取り出すことによって可能になった。\n　しかし、取り出されたものは、取り出される前のすべてを保っているわけではない。その蝶がどの花を好み、どんな風の日に飛び、何に食べられていたのかは、針で留められた翅からは読み取れない。標本が語るのは、生きものの〔　Ｙ　〕であって、その暮らしではない。\n　ところが近年、標本に残された組織から遺伝子を調べたり、ラベルの記録をつなぎ合わせて分布の移り変わりをたどったりする研究が進んでいる。採集した人が思いもしなかった問いに、古い標本が答えはじめているのである。標本は過去を閉じ込めた箱ではなく、後の時代の問いを待つ記録でもある。【イ】ものを保存するとは、それを今の目的のために使い切ることではなく、まだ誰も立てていない問いのために、余地を残しておくことなのだ。","q":"傍線部【イ】「ものを保存するとは、それを今の目的のために使い切ることではなく、まだ誰も立てていない問いのために、余地を残しておくことなのだ」の説明として最も適当なものを選びなさい。","c":["ものを保存することの意味は、作った人の目的に役立てて終わりにすることにあるのではなく、後の時代の人が新しい問いを立てて調べられるよう、可能性を開いたままにしておくことにあるということ。","保存したものは傷みやすいので、今の研究には使わず、収蔵庫にしまったまま手を触れずにおくべきだということ。","保存されたものはいずれ使い切られてしまうので、同じ標本を何度も作り直して数を確保しておく必要があるということ。","ものを保存するとは、採集した人が立てた問いとその答えを、後の時代にそのまま正確に伝えることだということ。"],"e":"直前で、標本の組織から遺伝子を調べたり、ラベルの記録から分布の移り変わりをたどったりして、「採集した人が思いもしなかった問いに、古い標本が答えはじめている」と述べ、標本は「後の時代の問いを待つ記録」だとしています。傍線部はこれを保存一般の意味として述べたものです。「手を触れずにおく」は、標本が新しい研究に使われているという本文と合いません。「作り直して数を確保」は本文にありません。「採集した人の問いをそのまま伝える」は、思いもしなかった問いという主旨と逆です。","m":"保存＝未来の問いのための余地"},{"id":68,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"内容合致（標本論）","p":"　博物館の収蔵庫には、針で留められた昆虫や、薬液に浸された魚が、数えきれないほど眠っている。標本の多くは、採集した生きものを腐らないように処理し、ラベルを付けて保存したものである。ラベルには、いつ、どこで、誰が採ったのかが書き込まれる。\n　標本の価値は、それが変わらないことにある。生きた蝶は飛び去り、季節が変われば姿を消すが、標本の蝶は百年後にも同じ翅を広げている。だからこそ、遠く離れた土地で、異なる年に採られた個体どうしを並べ、翅の模様のわずかな違いを確かめることができる。【ア】比較という知の営みは、対象を時間の流れから取り出すことによって可能になった。\n　しかし、取り出されたものは、取り出される前のすべてを保っているわけではない。その蝶がどの花を好み、どんな風の日に飛び、何に食べられていたのかは、針で留められた翅からは読み取れない。標本が語るのは、生きものの〔　Ｙ　〕であって、その暮らしではない。\n　ところが近年、標本に残された組織から遺伝子を調べたり、ラベルの記録をつなぎ合わせて分布の移り変わりをたどったりする研究が進んでいる。採集した人が思いもしなかった問いに、古い標本が答えはじめているのである。標本は過去を閉じ込めた箱ではなく、後の時代の問いを待つ記録でもある。【イ】ものを保存するとは、それを今の目的のために使い切ることではなく、まだ誰も立てていない問いのために、余地を残しておくことなのだ。","q":"本文の内容と合致するものを一つ選びなさい。","c":["針で留められた蝶の標本からは、その蝶がどの花を好んだかといった暮らしの様子を読み取ることは難しい。","標本の価値は、生きていたときと同じように動く姿を、百年後まで残しておける点にあると筆者は述べている。","古い標本は、採集した人が立てた問いにしか答えられないので、新しい研究には役立たないとされている。","標本のラベルには、その生きものが何を食べていたかが必ず書き込まれていると説明されている。"],"e":"第三段落に、蝶がどの花を好み、どんな日に飛び、何に食べられていたのかは「針で留められた翅からは読み取れない」とあり、合致します。「動く姿を残しておける」は、標本の価値は「変わらないこと」にあるという第二段落と合いません。「新しい研究には役立たない」は、採集者が思いもしなかった問いに答えはじめているという第四段落に反します。ラベルに書かれるのは、いつ、どこで、誰が採ったかであり、食べ物ではありません。","m":"標本は形を残すが暮らしは残さない"},{"id":69,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の内容（引用論）","p":"　他人の言葉を引くことは、自分の考えを補強するための手軽な方法だと思われている。権威ある人物の一文を添えれば、主張はそれだけで重みを増したように見える。しかし引用とは、ある言葉をもとの文脈から切り離し、別の文脈へと移し植える行為である。移し植えられた言葉は、もとの場所にあったときと同じ意味を保っているとは限らない。\n　ある文章の中で慎重な留保とともに述べられた一文が、引用されると断定として響くことがある。前後に置かれていた但し書きが落ちるからである。反対に、もとは何気ない感想にすぎなかった言葉が、論文の冒頭に掲げられることで、思いがけない深さを帯びることもある。【ア】引用された言葉は、引用する者の文章によって読み直されているのだ。\n　だとすれば、引用する者は、他人の言葉を借りているようでいて、実はその言葉に新しい意味を与える〔　Ｚ　〕を負っていることになる。正確に書き写したからといって、それで責任を果たしたことにはならない。文字が一字一句同じでも、置かれる文脈が変われば、言葉の働きは変わりうるからである。\n　引用を避ければよいという話ではない。私たちの言葉は、そもそも他人の言葉の引き写しから成り立っている。誰もが、かつてどこかで聞いた言い回しを組み合わせて話している。重要なのは、借りた言葉がもとの場所で何をしていたのかを想像し、それを新しい場所でどう働かせるかを自覚することである。【イ】引用とは他人の言葉への寄りかかりではなく、他人の言葉との対話なのである。","q":"傍線部【ア】「引用された言葉は、引用する者の文章によって読み直されているのだ」とはどういうことか。最も適当なものを選びなさい。","c":["引用された言葉の意味は、もとの文脈ではなく、それが置かれた新しい文章の前後関係によって左右され、もとの意味とは異なる響きを帯びることがあるということ。","引用する者は、引用した言葉を自分の文章に合わせて書きかえるので、引用された言葉はもとの文とは異なる文字になってしまうということ。","引用された言葉は、読者が引用元の文章を読み直すきっかけとなり、もとの文章の正しい意味を広く知らせる役割を果たすということ。","引用する者は、引用する前に必ず引用元の文章を何度も読み直して、言葉の意味を正確に理解しなければならないということ。"],"e":"直前の例では、留保つきの一文が「断定として響く」こと、何気ない感想が「思いがけない深さを帯びる」ことが挙げられています。どちらも文字は変わらず、置かれた文脈によって意味が変わる例です。「異なる文字になってしまう」は、第三段落の「文字が一字一句同じでも」と食い違います。「正しい意味を広く知らせる」は、意味がずれるという主旨と逆です。「何度も読み直さなければならない」は、引用する者の心得にすり替えています。","m":"文字は同じでも文脈が意味を変える"},{"id":70,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"空所補充（引用論）","p":"　他人の言葉を引くことは、自分の考えを補強するための手軽な方法だと思われている。権威ある人物の一文を添えれば、主張はそれだけで重みを増したように見える。しかし引用とは、ある言葉をもとの文脈から切り離し、別の文脈へと移し植える行為である。移し植えられた言葉は、もとの場所にあったときと同じ意味を保っているとは限らない。\n　ある文章の中で慎重な留保とともに述べられた一文が、引用されると断定として響くことがある。前後に置かれていた但し書きが落ちるからである。反対に、もとは何気ない感想にすぎなかった言葉が、論文の冒頭に掲げられることで、思いがけない深さを帯びることもある。【ア】引用された言葉は、引用する者の文章によって読み直されているのだ。\n　だとすれば、引用する者は、他人の言葉を借りているようでいて、実はその言葉に新しい意味を与える〔　Ｚ　〕を負っていることになる。正確に書き写したからといって、それで責任を果たしたことにはならない。文字が一字一句同じでも、置かれる文脈が変われば、言葉の働きは変わりうるからである。\n　引用を避ければよいという話ではない。私たちの言葉は、そもそも他人の言葉の引き写しから成り立っている。誰もが、かつてどこかで聞いた言い回しを組み合わせて話している。重要なのは、借りた言葉がもとの場所で何をしていたのかを想像し、それを新しい場所でどう働かせるかを自覚することである。【イ】引用とは他人の言葉への寄りかかりではなく、他人の言葉との対話なのである。","q":"空所〔　Ｚ　〕に入る語として最も適当なものを選びなさい。","c":["責任","権利","義理","名誉"],"e":"直後に「正確に書き写したからといって、それで責任を果たしたことにはならない」とあり、空所の語を受けています。言葉に新しい意味を与えてしまう以上、その結果を引き受ける「責任」を負うという文意です。「権利」は「負う」と結びつかず、直後の文ともつながりません。「義理」は人間関係上の恩義のことで文脈に合いません。「名誉」はたたえられる側の語で、引用する者が引き受ける重さを表しません。","m":"意味を与える者は責任を負う"},{"id":71,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"傍線部の説明（引用論）","p":"　他人の言葉を引くことは、自分の考えを補強するための手軽な方法だと思われている。権威ある人物の一文を添えれば、主張はそれだけで重みを増したように見える。しかし引用とは、ある言葉をもとの文脈から切り離し、別の文脈へと移し植える行為である。移し植えられた言葉は、もとの場所にあったときと同じ意味を保っているとは限らない。\n　ある文章の中で慎重な留保とともに述べられた一文が、引用されると断定として響くことがある。前後に置かれていた但し書きが落ちるからである。反対に、もとは何気ない感想にすぎなかった言葉が、論文の冒頭に掲げられることで、思いがけない深さを帯びることもある。【ア】引用された言葉は、引用する者の文章によって読み直されているのだ。\n　だとすれば、引用する者は、他人の言葉を借りているようでいて、実はその言葉に新しい意味を与える〔　Ｚ　〕を負っていることになる。正確に書き写したからといって、それで責任を果たしたことにはならない。文字が一字一句同じでも、置かれる文脈が変われば、言葉の働きは変わりうるからである。\n　引用を避ければよいという話ではない。私たちの言葉は、そもそも他人の言葉の引き写しから成り立っている。誰もが、かつてどこかで聞いた言い回しを組み合わせて話している。重要なのは、借りた言葉がもとの場所で何をしていたのかを想像し、それを新しい場所でどう働かせるかを自覚することである。【イ】引用とは他人の言葉への寄りかかりではなく、他人の言葉との対話なのである。","q":"傍線部【イ】「引用とは他人の言葉への寄りかかりではなく、他人の言葉との対話なのである」の説明として最も適当なものを選びなさい。","c":["引用とは、権威ある言葉に頼って自分の主張を飾ることではなく、その言葉がもとの場所で果たしていた働きを想像しながら、新しい文脈でどう生かすかを自覚的に考える営みだということ。","引用とは、他人の言葉を自分の考えと比べて、どちらが正しいかを議論し、相手の誤りを指摘する営みだということ。","引用とは、他人の言葉に頼らず、自分だけの独創的な言葉で考えを表現するために、他人の言葉を批判的に退ける営みだということ。","引用とは、引用元の書き手に直接連絡をとり、言葉の真意を確かめてから使う営みだということ。"],"e":"直前で、重要なのは「借りた言葉がもとの場所で何をしていたのかを想像し、それを新しい場所でどう働かせるかを自覚すること」だと述べられています。「寄りかかり」は第一段落の、権威の一文で主張に重みを加える使い方を指します。「どちらが正しいかを議論」は「対話」を論争と取り違えています。「他人の言葉に頼らず」は、言葉は他人の言葉の引き写しから成り立つという第四段落に反します。「書き手に連絡」は比喩を字義どおりに取っています。","m":"引用＝借りた言葉の働きを想像し生かす"},{"id":72,"k":"plan","ref":"想定問題","f":"現代文（評論）","t":"内容合致（引用論）","p":"　他人の言葉を引くことは、自分の考えを補強するための手軽な方法だと思われている。権威ある人物の一文を添えれば、主張はそれだけで重みを増したように見える。しかし引用とは、ある言葉をもとの文脈から切り離し、別の文脈へと移し植える行為である。移し植えられた言葉は、もとの場所にあったときと同じ意味を保っているとは限らない。\n　ある文章の中で慎重な留保とともに述べられた一文が、引用されると断定として響くことがある。前後に置かれていた但し書きが落ちるからである。反対に、もとは何気ない感想にすぎなかった言葉が、論文の冒頭に掲げられることで、思いがけない深さを帯びることもある。【ア】引用された言葉は、引用する者の文章によって読み直されているのだ。\n　だとすれば、引用する者は、他人の言葉を借りているようでいて、実はその言葉に新しい意味を与える〔　Ｚ　〕を負っていることになる。正確に書き写したからといって、それで責任を果たしたことにはならない。文字が一字一句同じでも、置かれる文脈が変われば、言葉の働きは変わりうるからである。\n　引用を避ければよいという話ではない。私たちの言葉は、そもそも他人の言葉の引き写しから成り立っている。誰もが、かつてどこかで聞いた言い回しを組み合わせて話している。重要なのは、借りた言葉がもとの場所で何をしていたのかを想像し、それを新しい場所でどう働かせるかを自覚することである。【イ】引用とは他人の言葉への寄りかかりではなく、他人の言葉との対話なのである。","q":"本文の内容と合致するものを一つ選びなさい。","c":["私たちがふだん話す言葉も、かつてどこかで聞いた言い回しの組み合わせから成り立っていると筆者は考えている。","引用によって言葉の意味が変わるのを防ぐため、引用はできるかぎり避けるべきだと筆者は主張している。","引用元の文章を一字一句正確に書き写せば、引用する者としての責任は十分に果たされると筆者は述べている。","何気ない感想にすぎない言葉は、どのような文脈に置かれても、深い意味を帯びることはないとされている。"],"e":"第四段落に「私たちの言葉は、そもそも他人の言葉の引き写しから成り立っている。誰もが、かつてどこかで聞いた言い回しを組み合わせて話している」とあり、合致します。「引用は避けるべき」は「引用を避ければよいという話ではない」に反します。「書き写せば責任は果たされる」は第三段落の内容と逆です。「深い意味を帯びることはない」は、第二段落の、何気ない感想が「思いがけない深さを帯びる」という例に反します。","m":"言葉はそもそも他人の言葉の引き写し"},{"id":73,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（喚起）","q":"「世論の関心をカンキする」の傍線部「カンキ」を漢字に直したとき、その「カン」と同じ漢字を用いるものを選びなさい。","c":["証人を法廷にショウカンする","カンダイな処置をとる","カンゲンすれば次のようになる","地域のカンシュウに従う"],"e":"「カンキ」は「喚起（呼び起こすこと）」で、「カン」は「喚」です。「ショウカン」は「召喚（裁判所などが人を呼び出すこと）」で、同じ「喚」を使います。「カンダイ」は「寛大」の「寛」、「カンゲン」は「換言（言いかえること）」の「換」、「カンシュウ」は「慣習」の「慣」です。「喚」は口へんで「よぶ・さけぶ」の意味をもち、「換（手へん・かえる）」と字形が似ているので区別しましょう。","m":"喚＝よぶ（喚起・召喚）／換＝かえる"},{"id":74,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（奇跡）","q":"「キセキ的に回復する」の傍線部「キセキ」を漢字に直したとき、その「キ」と同じ漢字を用いるものを選びなさい。","c":["コウキシンが強い","キセイ概念にとらわれる","キチョウな体験をする","盆にキセイする"],"e":"「キセキ」は「奇跡（常識では考えられない不思議なできごと）」で、「キ」は「奇」です。「コウキシン」は「好奇心」で同じ「奇」を使います。「キセイ概念」は「既成」の「既」、「キチョウ」は「貴重」の「貴」、「盆にキセイ」は「帰省」の「帰」です。「既成（すでにできあがっている）」は「既製（既製服）」との書き分けもよく問われます。","m":"奇＝めずらしい（奇跡・好奇心）"},{"id":75,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（啓発）","q":"「環境問題へのケイハツ活動」の傍線部「ケイハツ」を漢字に直したとき、その「ケイ」と同じ漢字を用いるものを選びなさい。","c":["ハイケイで始まる手紙","業者とケイヤクを結ぶ","雑誌に記事をケイサイする","伝統をケイショウする"],"e":"「ケイハツ」は「啓発（気づかせて理解を深めさせること）」で、「ケイ」は「啓」です。「ハイケイ」は手紙の書き出しの「拝啓」で、同じ「啓」を使います。「ケイヤク」は「契約」の「契」、「ケイサイ」は「掲載」の「掲」、「ケイショウ」は「継承」の「継」です。「啓」は「ひらく・申し上げる」の意味をもち、「啓蒙」「拝啓」などに使われます。","m":"啓＝ひらく・申す（啓発・拝啓）"},{"id":76,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（感傷）","q":"「秋の夕暮れにカンショウにひたる」の傍線部「カンショウ」を漢字に直したとき、その「ショウ」と同じ漢字を用いるものを選びなさい。","c":["他人をチュウショウする","内政にカンショウする","計画にシショウをきたす","ショウソウにかられる"],"e":"「カンショウにひたる」は「感傷（物事に感じて心をいためること）」で、「ショウ」は「傷」です。「チュウショウ」は「中傷」で同じ「傷」を使います。「内政にカンショウ」は「干渉」の「渉」、「シショウ」は「支障」の「障」、「ショウソウ」は「焦燥」の「焦」です。同音の「鑑賞」「観賞」「干渉」との書き分けにも注意しましょう。","m":"感傷・中傷＝傷つく心"},{"id":77,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（冒頭）","q":"「演説のボウトウで謝意を述べる」の傍線部「ボウトウ」を漢字に直したとき、その「ボウ」と同じ漢字を用いるものを選びなさい。","c":["未知の土地をボウケンする","海外とのボウエキが盛んだ","通行をボウガイする","過去をボウキャクする"],"e":"「ボウトウ」は「冒頭（文章や話のはじめ）」で、「ボウ」は「冒」です。「ボウケン」は「冒険」で同じ「冒」を使います。「ボウエキ」は「貿易」の「貿」、「ボウガイ」は「妨害」の「妨」、「ボウキャク」は「忘却」の「忘」です。「冒」は「おかす・おおう」の意味で、「冒険」「冒涜」「感冒」などに使われます。","m":"冒＝おかす・おおう（冒頭・冒険）"},{"id":78,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"漢字（弊害）","q":"「制度のヘイガイが表面化する」の傍線部「ヘイガイ」を漢字に直したとき、その「ヘイ」と同じ漢字を用いるものを選びなさい。","c":["長引く不況で地方がヒヘイする","ヘイソク感がただよう","ヘイオンな日々が続く","古代のカヘイが出土する"],"e":"「ヘイガイ」は「弊害（害になる悪いこと）」で、「ヘイ」は「弊」です。「ヒヘイ」は「疲弊（疲れて弱ること）」で同じ「弊」を使います。「ヘイソク」は「閉塞」の「閉」、「ヘイオン」は「平穏」の「平」です。「カヘイ」は「貨幣」で、「弊」とよく似た「幣」を使うので誤りです。「弊（やぶれる・悪い）」と「幣（ぬさ・お金）」は字形も区別しましょう。","m":"弊＝やぶれる（弊害・疲弊）／幣＝お金"},{"id":79,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙（蓋然性）","q":"「その説には高い蓋然性がある」の「蓋然性」の意味として最も適当なものを選びなさい。","c":["ある事柄が実際に起こる、または真実であるという確からしさの度合い","ある事柄が必ずそうなり、ほかの結果になりえないという性質","ある事柄が原因もなく、たまたま起こるという性質","ある事柄が表面に現れず、内部に潜んでいるという性質"],"e":"「蓋然性」は「おそらくそうであろうという確からしさ」のことで、確率の高さを論じる文脈で使われます。「蓋然性が高い」は「たぶんそうだろう」という意味です。「必ずそうなる」は「必然性」、「たまたま起こる」は「偶然性」、「内部に潜んでいる」は「潜在性」の説明です。特に「必然性」とは、確実かどうかという点で区別されます。","m":"蓋然性＝確からしさ（必然性とは別）"},{"id":80,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙（畢竟）","q":"「畢竟、人は一人では生きられない」の「畢竟」の意味として最も適当なものを選びなさい。","c":["つまるところ、結局","意外なことに","ほとんど、おおかた","突然、にわかに"],"e":"「畢竟（ひっきょう）」は「畢（おわる）」と「竟（きわまる）」から成る語で、「いろいろ考えても最後には」「つまるところ」の意味です。評論でまとめや結論を導くときに使われます。「意外なことに」「ほとんど」「突然」はいずれも別の副詞の意味で、結論を示す働きがありません。同じ意味の語に「所詮」「詮ずるところ」があります。","m":"畢竟＝つまるところ（所詮）"},{"id":81,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙（矜持）","q":"「職人としての矜持を失わない」の「矜持」の意味として最も適当なものを選びなさい。","c":["自分の能力や立場に誇りをもち、それを保とうとする気持ち","自分より劣る者を見下して、いばる態度","自分の失敗を恥じて、人前に出られなくなる気持ち","相手を立てて、自分を低く見せようとする態度"],"e":"「矜持（きょうじ）」は「誇り・自負」のことで、「矜持を保つ」「矜持をもつ」のように肯定的に使います。「見下していばる」は「傲慢」の意味で、誇りが他人への態度として悪く出たものです。「恥じて人前に出られない」は誇りとは逆の気持ちです。「自分を低く見せる」は「謙遜」の意味です。","m":"矜持＝誇り・自負（傲慢とは別）"},{"id":82,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"四字熟語（付和雷同）","q":"「付和雷同」の意味として最も適当なものを選びなさい。","c":["自分にしっかりした考えがなく、他人の意見に軽々しく同調すること","多くの人が心を一つにして、力を合わせて物事にあたること","他人の意見に激しく反発して、大声で言い争うこと","その場の状況に応じて、柔軟に適切な手段をとること"],"e":"「付和」は自分の考えなしに他人に従うこと、「雷同」は雷が鳴ると万物がそれに応じて響くように、むやみに他に同調することです。合わせて「主体性がなく他人の説に軽々しく賛成する」という否定的な意味になります。「心を一つにして力を合わせる」は「一致団結」、「状況に応じて柔軟に」は「臨機応変」の意味です。「激しく反発」は同調とは逆です。","m":"付和雷同＝考えなく他に同調"},{"id":83,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"慣用句（木で鼻をくくる）","q":"「木で鼻をくくる」の意味として最も適当なものを選びなさい。","c":["ひどく無愛想に、そっけなく応対する","細かいことにまで、手間を惜しまずに取り組む","失敗を、その場しのぎでたくみに取りつくろう","長い年月の努力が実って、ようやく成功する"],"e":"「木で鼻をくくる」は、もとは「木で鼻をこくる（こする）」で、思いやりなく冷淡に応じるさまを表します。「木で鼻をくくったような返事」のように使います。「手間を惜しまずに取り組む」「その場しのぎで取りつくろう」「努力が実る」は、いずれもこの句の意味ではありません。「くくる」から「まとめる」「しめくくる」を連想しないよう注意が必要です。","m":"木で鼻をくくる＝冷淡でそっけない"},{"id":84,"k":"plan","ref":"想定問題","f":"漢字・語彙","t":"語彙（おもむろに）","q":"「彼はおもむろに立ち上がった」の「おもむろに」の本来の意味として最も適当なものを選びなさい。","c":["ゆっくりと、落ち着いて","不意に、いきなり","いかにもわざとらしく","人目を避けて、こっそりと"],"e":"「おもむろに」は「徐に」と書き、「ゆっくりと落ち着いて動作を始めるさま」を表します。近年は「不意に・いきなり」の意味で使う人が多いと言われますが、これは本来の意味とは逆の誤用です。「わざとらしく」「こっそりと」も本来の意味ではありません。「徐行」の「徐」と同じ字だと覚えると、ゆっくりという意味と結びつきます。","m":"おもむろに＝徐に（ゆっくり）"},{"id":85,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"呼応の副詞（つゆ…なし）","p":"【『徒然草』第十一段】\n神無月のころ栗栖野といふ所を過ぎて、ある山里にたづね入ること侍りしに、遥なる苔の細道をふみわけて、心ぼそく住みなしたる庵あり。木の葉にうづもるるかけひのしづくならでは、つゆおとなふものなし。閼伽棚に菊紅葉など折りちらしたるさすがに住む人のあればなるべし。かくてもあられけるよと、あはれに見るほどに、かなたの庭に大きなる柑子の木の、枝もたわわになりたるが、まはりをきびしくかこひたりしこそすこしことさめて、この木なからましかばと覚えしか。\n（注）栗栖野＝京都の東南の地名。かけひ＝竹などで水を引く樋。閼伽棚＝仏に供える水や花を置く棚。柑子＝みかんの一種。\n（『徒然草』第十一段。ウィキソース『徒然草（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改めた。）","q":"傍線部「かけひのしづくならでは、つゆおとなふものなし」の解釈として最も適当なものを選びなさい。","c":["かけひから落ちるしずくの音のほかには、まったく音を立てるものがない。","かけひのしずくでなければ、露が落ちる音さえ聞こえてこない。","かけひのしずくのように、露もかすかな音を立てて落ちている。","かけひのしずくの音がしないので、訪れてくる者が一人もいない。"],"e":"「ならでは」は断定「なり」の未然形＋接続助詞「で」＋係助詞「は」で、「〜以外には」の意味です。「つゆ」は打消の語（ここでは「なし」）と呼応して「少しも・まったく（〜ない）」を表す副詞です。

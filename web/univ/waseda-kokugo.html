「おとなふ」は「音を立てる」の意味です。「露が落ちる」「露も音を立てて」は「つゆ」を名詞と取り、打消との呼応を見落としています。「訪れてくる者」は「おとなふ」の別の意味を当て、本文にない因果を加えています。","m":"つゆ＋打消＝少しも〜ない"},{"id":86,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"識別（覚えしか）","p":"【『徒然草』第十一段】\n神無月のころ栗栖野といふ所を過ぎて、ある山里にたづね入ること侍りしに、遥なる苔の細道をふみわけて、心ぼそく住みなしたる庵あり。木の葉にうづもるるかけひのしづくならでは、つゆおとなふものなし。閼伽棚に菊紅葉など折りちらしたるさすがに住む人のあればなるべし。かくてもあられけるよと、あはれに見るほどに、かなたの庭に大きなる柑子の木の、枝もたわわになりたるが、まはりをきびしくかこひたりしこそすこしことさめて、この木なからましかばと覚えしか。\n（注）栗栖野＝京都の東南の地名。かけひ＝竹などで水を引く樋。閼伽棚＝仏に供える水や花を置く棚。柑子＝みかんの一種。\n（『徒然草』第十一段。ウィキソース『徒然草（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改めた。）","q":"傍線部「この木なからましかばと覚えしか」の「しか」の文法的説明として正しいものを選びなさい。","c":["過去の助動詞「き」の已然形で、係助詞「こそ」の結びになっている。","過去の助動詞「き」の連体形で、文を連体止めにしている。","自己の願望を表す終助詞「しか」である。","反実仮想の助動詞「まし」の已然形の一部である。"],"e":"前に「まはりをきびしくかこひたりしこそ」と係助詞「こそ」があるので、文末は已然形で結びます。過去の助動詞「き」は「（せ）・○・き・し・しか・○」と活用し、「しか」は已然形です。連体形なら「し」になります。願望の終助詞「しか」は「てしか」「にしか」の形をとり「〜したい」の意味ですが、ここは「思われた」という過去の事実を述べているので当たりません。反実仮想の「まし」は直前の「ましかば」のほうで、「覚えしか」の「しか」とは別の語です。","m":"こそ〜しか＝過去「き」已然形の結び"},{"id":87,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"解釈（さすがに住む人の）","p":"【『徒然草』第十一段】\n神無月のころ栗栖野といふ所を過ぎて、ある山里にたづね入ること侍りしに、遥なる苔の細道をふみわけて、心ぼそく住みなしたる庵あり。木の葉にうづもるるかけひのしづくならでは、つゆおとなふものなし。閼伽棚に菊紅葉など折りちらしたるさすがに住む人のあればなるべし。かくてもあられけるよと、あはれに見るほどに、かなたの庭に大きなる柑子の木の、枝もたわわになりたるが、まはりをきびしくかこひたりしこそすこしことさめて、この木なからましかばと覚えしか。\n（注）栗栖野＝京都の東南の地名。かけひ＝竹などで水を引く樋。閼伽棚＝仏に供える水や花を置く棚。柑子＝みかんの一種。\n（『徒然草』第十一段。ウィキソース『徒然草（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改めた。）","q":"傍線部「閼伽棚に菊紅葉など折りちらしたるさすがに住む人のあればなるべし」の解釈として最も適当なものを選びなさい。","c":["閼伽棚に菊や紅葉などが折って散らしてあるのは、こんなにさびしい所でも、やはり住んでいる人がいるからなのだろう。","閼伽棚に菊や紅葉などが散らかっているのは、住んでいる人がいなくなって、手入れをする者がいないからなのだろう。","閼伽棚に菊や紅葉などを折って供えたのは、住む人として仏を敬う心が深いからにちがいない。","閼伽棚に菊や紅葉などを折って散らしたのは、訪ねてきた作者に見せるためだったのだろう。"],"e":"「さすがに」は「そうはいってもやはり」の意味で、木の葉に埋もれた心細い庵の様子を受けて「それでもやはり」と続けています。「あれば」は「あり」の已然形＋「ば」で「いるので」、「なるべし」は断定「なり」＋推量「べし」で「〜なのだろう」です。仏に供える花があることから、人が住んでいると推し量っているのです。「住む人がいなくなって」は逆です。「仏を敬う心が深い」は「さすがに」と「あれば」の訳が合いません。「作者に見せるため」は本文にない推測です。","m":"さすがに＝そうはいってもやはり"},{"id":88,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"心情の理由（ことさめて）","p":"【『徒然草』第十一段】\n神無月のころ栗栖野といふ所を過ぎて、ある山里にたづね入ること侍りしに、遥なる苔の細道をふみわけて、心ぼそく住みなしたる庵あり。木の葉にうづもるるかけひのしづくならでは、つゆおとなふものなし。閼伽棚に菊紅葉など折りちらしたるさすがに住む人のあればなるべし。かくてもあられけるよと、あはれに見るほどに、かなたの庭に大きなる柑子の木の、枝もたわわになりたるが、まはりをきびしくかこひたりしこそすこしことさめて、この木なからましかばと覚えしか。\n（注）栗栖野＝京都の東南の地名。かけひ＝竹などで水を引く樋。閼伽棚＝仏に供える水や花を置く棚。柑子＝みかんの一種。\n（『徒然草』第十一段。ウィキソース『徒然草（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改めた。）","q":"作者が「すこしことさめて」と感じたのはなぜか。最も適当なものを選びなさい。","c":["世間を離れて静かに暮らす住まいに心ひかれていたのに、実のなった柑子の木を厳しく囲って守る様子に、住む人の物惜しみする俗っぽさが見えたから。","静かな山里の庵を訪ねたのに、庭の柑子の木が大きく茂りすぎていて、せっかくの風情ある景色が見えなくなっていたから。","住む人に会えると思って訪ねたのに、まわりを厳しく囲われていて、庵の中に入ることができなかったから。","柑子の実をもらえると期待していたのに、木のまわりが囲ってあって、実を取ることができなかったから。"],"e":"作者は、苔の細道やかけひのしずくの音、閼伽棚の花などに世を離れた人のつつましい暮らしを感じ、「あはれに」見ていました。ところが実のたわわになった柑子の木の「まはりをきびしくかこひたりし」様子に、実を取られまいとする欲が見えて興ざめし、「この木がなかったならばよかったのに」と思ったのです。「景色が見えなくなっていた」は囲いの意味を取り違えています。囲われていたのは庵ではなく木です。「実をもらえると期待」は本文にない心情です。","m":"閑寂な庵に物惜しみの囲い→興ざめ"},{"id":89,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"敬語（仰せられ）","p":"【『枕草子』（雪いと高く降りたるを）】\n（作者清少納言が仕えた中宮定子の御前でのできごとである。）\n雪いと高く降りたるを例ならず御格子まゐらせて、す櫃に火起して物語などして集まり侍ふに「少納言よ香炉峰の雪はいかならむ」と仰せられければ、御格子あげさせて、御簾高く巻き上げたれば、笑はせたまふ。人々も皆さる事は知り、歌などにさへうたへど、思ひこそよらざりつれ。「なほこの宮の人にはさるべきなめり」といふ。\n（注）御格子まゐらせて＝格子をお下ろし申し上げて。す櫃＝炭櫃。いろりのこと。香炉峰＝中国の廬山の峰の名。\n（『枕草子』。ウィキソース『枕草紙（國文大觀）』による。旧字体を新字体に改めた。）","q":"傍線部「仰せられければ」の「仰せ」と「られ」について、敬語の種類と敬意の方向の説明として最も適当なものを選びなさい。","c":["どちらも尊敬を表し、作者から中宮定子への敬意を示している。","どちらも謙譲を表し、作者から中宮定子への敬意を示している。","「仰せ」は尊敬、「られ」は受身を表し、作者から女房たちへの敬意を示している。","どちらも尊敬を表し、中宮定子から作者への敬意を示している。"],"e":"「仰す」は「言ふ」の尊敬語で、「られ」は尊敬の助動詞「らる」の連用形です。尊敬語を重ねた形で、地の文で用いられているので、敬意は書き手である作者から、「言う」動作の主体である中宮定子に向かいます。謙譲語は動作の受け手を高めるもので、動作の主を高めるここには当たりません。「られ」を受身と取ると意味が通らず、女房たちへの敬意も誤りです。中宮から作者への敬意は、方向が逆です。","m":"地の文の尊敬語＝作者→動作の主体"},{"id":90,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"識別（なめり）","p":"【『枕草子』（雪いと高く降りたるを）】\n（作者清少納言が仕えた中宮定子の御前でのできごとである。）\n雪いと高く降りたるを例ならず御格子まゐらせて、す櫃に火起して物語などして集まり侍ふに「少納言よ香炉峰の雪はいかならむ」と仰せられければ、御格子あげさせて、御簾高く巻き上げたれば、笑はせたまふ。人々も皆さる事は知り、歌などにさへうたへど、思ひこそよらざりつれ。「なほこの宮の人にはさるべきなめり」といふ。\n（注）御格子まゐらせて＝格子をお下ろし申し上げて。す櫃＝炭櫃。いろりのこと。香炉峰＝中国の廬山の峰の名。\n（『枕草子』。ウィキソース『枕草紙（國文大觀）』による。旧字体を新字体に改めた。）","q":"傍線部「さるべきなめり」の「なめり」の文法的説明として正しいものを選びなさい。","c":["断定の助動詞「なり」の連体形「なる」が撥音便化し、「ん」が表記されない形に、推定の助動詞「めり」が付いたもの。","完了の助動詞「ぬ」の未然形「な」に、推定の助動詞「めり」が付いたもの。","形容詞「なし」の語幹「な」に、推定の助動詞「めり」が付いたもの。","伝聞推定の助動詞「なり」の連用形に、推定の助動詞「めり」が付いたもの。"],"e":"「めり」はラ変型に活用する語には連体形に付きます。断定の「なり」の連体形「なる」に「めり」が付くと「なるめり→なんめり」と撥音便化し、「ん」を書かずに「なめり」と表記されます。意味は「〜であるようだ」です。完了「ぬ」に「めり」が付くなら終止形に付いて「ぬめり」となります。形容詞「なし」なら「なかめり」の形になります。伝聞推定の「なり」の連用形は「なり」で、「な」にはなりません。","m":"なめり＝なるめり→なんめり→なめり"},{"id":91,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"行動の理由（御簾を巻き上げる）","p":"【『枕草子』（雪いと高く降りたるを）】\n（作者清少納言が仕えた中宮定子の御前でのできごとである。）\n雪いと高く降りたるを例ならず御格子まゐらせて、す櫃に火起して物語などして集まり侍ふに「少納言よ香炉峰の雪はいかならむ」と仰せられければ、御格子あげさせて、御簾高く巻き上げたれば、笑はせたまふ。人々も皆さる事は知り、歌などにさへうたへど、思ひこそよらざりつれ。「なほこの宮の人にはさるべきなめり」といふ。\n（注）御格子まゐらせて＝格子をお下ろし申し上げて。す櫃＝炭櫃。いろりのこと。香炉峰＝中国の廬山の峰の名。\n（『枕草子』。ウィキソース『枕草紙（國文大觀）』による。旧字体を新字体に改めた。）","q":"中宮の「香炉峰の雪はいかならむ」という問いかけに対し、作者が御簾を高く巻き上げたのはなぜか。最も適当なものを選びなさい。","c":["白居易の詩の「香炉峰の雪は簾をかかげて看る」という句を踏まえた問いだと気づき、言葉で答える代わりに、実際に簾を上げて外の雪景色を中宮にお見せしたから。","中国の香炉峰の雪がどのようなものか分からなかったので、外の雪を中宮に見ていただき、その様子から想像していただこうとしたから。","部屋の中が炭櫃の火で暑くなりすぎたので、中宮の体を気づかって、外の冷たい空気を入れようとしたから。","中宮が外の雪を見たいとはっきり命じられたので、ほかの女房に先んじて、すぐに命令に従ってみせたから。"],"e":"「香炉峰の雪は簾をかかげて看る」は白居易の詩の一句で、宮中の人々もよく知っていました。中宮の問いはその句を踏まえた謎かけで、作者は詩句を口にする代わりに簾を巻き上げてみせ、中宮は笑って満足を示しました。「香炉峰の雪が分からなかった」は逆で、句を知っていたからこそ応じられたのです。「暑くなりすぎた」は本文にない理由です。中宮は問いの形で遠回しに求めているので、「はっきり命じられた」は誤りです。","m":"香炉峰の雪は簾をかかげて看る（白居易）"},{"id":92,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"発言の趣旨（この宮の人には）","p":"【『枕草子』（雪いと高く降りたるを）】\n（作者清少納言が仕えた中宮定子の御前でのできごとである。）\n雪いと高く降りたるを例ならず御格子まゐらせて、す櫃に火起して物語などして集まり侍ふに「少納言よ香炉峰の雪はいかならむ」と仰せられければ、御格子あげさせて、御簾高く巻き上げたれば、笑はせたまふ。人々も皆さる事は知り、歌などにさへうたへど、思ひこそよらざりつれ。「なほこの宮の人にはさるべきなめり」といふ。\n（注）御格子まゐらせて＝格子をお下ろし申し上げて。す櫃＝炭櫃。いろりのこと。香炉峰＝中国の廬山の峰の名。\n（『枕草子』。ウィキソース『枕草紙（國文大觀）』による。旧字体を新字体に改めた。）","q":"傍線部「なほこの宮の人にはさるべきなめり」という人々の言葉の趣旨として最も適当なものを選びなさい。","c":["詩句を知っているだけでなく、とっさにそれを行動で示した作者は、やはりこの中宮にお仕えする人としてふさわしいようだと感心している。","詩句は誰でも知っているのだから、作者のふるまいは特別なことではなく、この中宮の女房なら当然のことだと冷ややかに見ている。","中宮の問いに言葉で答えなかった作者は、やはりこの中宮にお仕えする人として礼儀に欠けるようだと非難している。","中宮が作者ばかりに問いかけるので、やはりこの中宮は作者を特別にひいきしているようだと不満を述べている。"],"e":"直前に「人々も皆さる事は知り、歌などにさへうたへど、思ひこそよらざりつれ」とあり、女房たちもその詩句は知っていて歌にまで詠むのに、思いつきもしなかったのです。知識をその場で行動に生かした作者の機転に感心し、「やはりこの中宮にお仕えする人としては、そうあるのがふさわしいようだ」とほめているのです。「冷ややかに見ている」は、思いつかなかったという言葉と合いません。「礼儀に欠ける」は、中宮が笑って喜んだことと矛盾します。「ひいき」への不満は本文にありません。","m":"思ひこそよらざりつれ→作者の機転に感心"},{"id":93,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"識別（給ふなる）","p":"【『更級日記』】\n（上総から京に戻った作者は、『源氏物語』を読みたいと願っていた。）\n叔母なる人の田舎よりのぼりたる所に渡いたれば、「いと美しうおひなりにけり」など、あはれがり珍しがりて、かへるに、「何をか奉らむ。まめまめしきものは、まさなかりなむ。ゆかしくし給ふなる物を奉らむ」とて、源氏の五十余巻、櫃に入りながら、在中将、とほぎみ、せり川、しらら、あさうづなどいふ物語ども、一袋とり入れてえて帰る心地の嬉しさぞいみじきや。はしるはしる僅に見つつ、心もえず、心もとなく思ひ、源氏を一の巻よりして、人も交らず、几帳のうちにうち臥して、ひき出でつつ見る心地、后の位も何にかはせむ。昼は日ぐらし、夜は目の覚めたるかぎり、火を近くともして、これを見るより外の事なければ、おのづから名などはそらにおぼえ浮ぶを、いみじき事に思ふに、夢にいと清げなる僧の、黄なる地の袈裟著たるが来て、「法華経五巻を疾く習へ」といふと見れど、人にもかたらず、習はむとも思ひかけず、物語のことをのみ心にしめて、我はこの比わろきぞかし。さかりにならば、かたちも限なくよく、髪もいみじく長くなりなむ。光源氏の夕顔、宇治の大将の浮舟の女君のやうにこそあらめ、と思ひける心、まづいとはかなく浅まし。\n（注）まさなかりなむ＝よくないだろう。在中将・とほぎみ・せり川・しらら・あさうづ＝いずれも物語の名。はしるはしる＝胸をどきどきさせながら。夕顔・浮舟＝『源氏物語』の女君。\n（『更級日記』。ウィキソース『更級日記（有朋堂文庫）』による。旧字体を新字体に、踊り字を仮名に改め、振り仮名と〔　〕内の注記を省いた。）","q":"傍線部「ゆかしくし給ふなる物を奉らむ」の「なる」の文法的説明として最も適当なものを選びなさい。","c":["伝聞の助動詞「なり」の連体形","断定の助動詞「なり」の連体形","四段活用動詞「なる」の連体形","形容動詞の連体形活用語尾"],"e":"「給ふ」は四段活用で終止形と連体形が同じ形なので、接続だけでは断定（連体形接続）か伝聞・推定（終止形接続）かを決められません。そこで意味から判断します。田舎から上京してきた叔母は、作者が物語を読みたがっていることを人づてに聞いて知っているので、「欲しがっていらっしゃると聞く物を差し上げよう」と伝聞で訳すのが適当です。断定では意味が通りにくくなります。動詞「なる（成る）」や形容動詞の活用語尾は、「給ふ」の後に付く形として成り立ちません。","m":"終止＝連体の語＋なり→意味で判断"},{"id":94,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"係り結び（こそあらめ）","p":"【『更級日記』】\n（上総から京に戻った作者は、『源氏物語』を読みたいと願っていた。）\n叔母なる人の田舎よりのぼりたる所に渡いたれば、「いと美しうおひなりにけり」など、あはれがり珍しがりて、かへるに、「何をか奉らむ。まめまめしきものは、まさなかりなむ。ゆかしくし給ふなる物を奉らむ」とて、源氏の五十余巻、櫃に入りながら、在中将、とほぎみ、せり川、しらら、あさうづなどいふ物語ども、一袋とり入れてえて帰る心地の嬉しさぞいみじきや。はしるはしる僅に見つつ、心もえず、心もとなく思ひ、源氏を一の巻よりして、人も交らず、几帳のうちにうち臥して、ひき出でつつ見る心地、后の位も何にかはせむ。昼は日ぐらし、夜は目の覚めたるかぎり、火を近くともして、これを見るより外の事なければ、おのづから名などはそらにおぼえ浮ぶを、いみじき事に思ふに、夢にいと清げなる僧の、黄なる地の袈裟著たるが来て、「法華経五巻を疾く習へ」といふと見れど、人にもかたらず、習はむとも思ひかけず、物語のことをのみ心にしめて、我はこの比わろきぞかし。さかりにならば、かたちも限なくよく、髪もいみじく長くなりなむ。光源氏の夕顔、宇治の大将の浮舟の女君のやうにこそあらめ、と思ひける心、まづいとはかなく浅まし。\n（注）まさなかりなむ＝よくないだろう。在中将・とほぎみ・せり川・しらら・あさうづ＝いずれも物語の名。はしるはしる＝胸をどきどきさせながら。夕顔・浮舟＝『源氏物語』の女君。\n（『更級日記』。ウィキソース『更級日記（有朋堂文庫）』による。旧字体を新字体に、踊り字を仮名に改め、振り仮名と〔　〕内の注記を省いた。）","q":"傍線部「浮舟の女君のやうにこそあらめ」の「め」の文法的説明として正しいものを選びなさい。","c":["推量の助動詞「む」の已然形で、係助詞「こそ」の結びになっている。","推量の助動詞「む」の連体形で、係助詞「こそ」の結びになっている。","推定の助動詞「めり」の一部が省略された形で、断定を和らげている。","意志の助動詞「む」の命令形で、自分に言い聞かせている。"],"e":"係助詞「こそ」を受ける結びは已然形になります。推量の助動詞「む」は「○・○・む・む・め・○」と活用し、已然形は「め」です。したがって「浮舟の女君のようにきっとなるだろう」と、物語の女君と同じようになると思い込んでいた作者の推量を表します。「こそ」の結びは連体形ではありません。「めり」の已然形なら「めれ」となり、一部を省いて「め」とする用法はありません。「む」に命令形はありません。","m":"こそ〜め＝推量「む」已然形"},{"id":95,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"心情（后の位も何にかはせむ）","p":"【『更級日記』】\n（上総から京に戻った作者は、『源氏物語』を読みたいと願っていた。）\n叔母なる人の田舎よりのぼりたる所に渡いたれば、「いと美しうおひなりにけり」など、あはれがり珍しがりて、かへるに、「何をか奉らむ。まめまめしきものは、まさなかりなむ。ゆかしくし給ふなる物を奉らむ」とて、源氏の五十余巻、櫃に入りながら、在中将、とほぎみ、せり川、しらら、あさうづなどいふ物語ども、一袋とり入れてえて帰る心地の嬉しさぞいみじきや。はしるはしる僅に見つつ、心もえず、心もとなく思ひ、源氏を一の巻よりして、人も交らず、几帳のうちにうち臥して、ひき出でつつ見る心地、后の位も何にかはせむ。昼は日ぐらし、夜は目の覚めたるかぎり、火を近くともして、これを見るより外の事なければ、おのづから名などはそらにおぼえ浮ぶを、いみじき事に思ふに、夢にいと清げなる僧の、黄なる地の袈裟著たるが来て、「法華経五巻を疾く習へ」といふと見れど、人にもかたらず、習はむとも思ひかけず、物語のことをのみ心にしめて、我はこの比わろきぞかし。さかりにならば、かたちも限なくよく、髪もいみじく長くなりなむ。光源氏の夕顔、宇治の大将の浮舟の女君のやうにこそあらめ、と思ひける心、まづいとはかなく浅まし。\n（注）まさなかりなむ＝よくないだろう。在中将・とほぎみ・せり川・しらら・あさうづ＝いずれも物語の名。はしるはしる＝胸をどきどきさせながら。夕顔・浮舟＝『源氏物語』の女君。\n（『更級日記』。ウィキソース『更級日記（有朋堂文庫）』による。旧字体を新字体に、踊り字を仮名に改め、振り仮名と〔　〕内の注記を省いた。）","q":"傍線部「后の位も何にかはせむ」に表れた作者の気持ちとして最も適当なものを選びなさい。","c":["源氏物語を一巻から思う存分読みふける喜びに比べれば、后の位でさえ問題にならないほどだという気持ち。","源氏物語の女君のように后の位に就きたいが、どうすればよいか分からず途方に暮れている気持ち。","后の位に就くことができないなら、源氏物語を読んでも何の意味もないとあきらめる気持ち。","后の位にある人でさえ源氏物語を全巻は読んでいないだろうと、誇らしく思う気持ち。"],"e":"「何にかはせむ」は「何にしようか、いや何にもならない」という反語です。物語の続きを読みたいと長く願っていた作者が、源氏物語五十余巻を手に入れ、几帳の中で一巻から誰にも邪魔されずに読む喜びを、女性として最高の地位である后の位さえ問題にならないと表しています。「后の位に就きたい」「后の位に就けないなら」は反語を正しく理解していません。「后でさえ読んでいない」は本文にない比較です。","m":"何にかはせむ＝反語「何になろうか」"},{"id":96,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"回想の評価（はかなく浅まし）","p":"【『更級日記』】\n（上総から京に戻った作者は、『源氏物語』を読みたいと願っていた。）\n叔母なる人の田舎よりのぼりたる所に渡いたれば、「いと美しうおひなりにけり」など、あはれがり珍しがりて、かへるに、「何をか奉らむ。まめまめしきものは、まさなかりなむ。ゆかしくし給ふなる物を奉らむ」とて、源氏の五十余巻、櫃に入りながら、在中将、とほぎみ、せり川、しらら、あさうづなどいふ物語ども、一袋とり入れてえて帰る心地の嬉しさぞいみじきや。はしるはしる僅に見つつ、心もえず、心もとなく思ひ、源氏を一の巻よりして、人も交らず、几帳のうちにうち臥して、ひき出でつつ見る心地、后の位も何にかはせむ。昼は日ぐらし、夜は目の覚めたるかぎり、火を近くともして、これを見るより外の事なければ、おのづから名などはそらにおぼえ浮ぶを、いみじき事に思ふに、夢にいと清げなる僧の、黄なる地の袈裟著たるが来て、「法華経五巻を疾く習へ」といふと見れど、人にもかたらず、習はむとも思ひかけず、物語のことをのみ心にしめて、我はこの比わろきぞかし。さかりにならば、かたちも限なくよく、髪もいみじく長くなりなむ。光源氏の夕顔、宇治の大将の浮舟の女君のやうにこそあらめ、と思ひける心、まづいとはかなく浅まし。\n（注）まさなかりなむ＝よくないだろう。在中将・とほぎみ・せり川・しらら・あさうづ＝いずれも物語の名。はしるはしる＝胸をどきどきさせながら。夕顔・浮舟＝『源氏物語』の女君。\n（『更級日記』。ウィキソース『更級日記（有朋堂文庫）』による。旧字体を新字体に、踊り字を仮名に改め、振り仮名と〔　〕内の注記を省いた。）","q":"最後の「と思ひける心、まづいとはかなく浅まし」とあるが、作者はどのようなことを「はかなく浅まし」と言っているのか。最も適当なものを選びなさい。","c":["年ごろになれば物語の女君のように美しくなれると思い込み、夢のお告げも気にかけずに物語に夢中になっていた当時の自分の考えが、頼りなくあきれたものだったということ。","物語に夢中になっているうちに容貌が衰えてしまい、夕顔や浮舟のような美しい女性にはなれなかったことが、悲しく情けないということ。","夢に現れた僧の言葉どおりに法華経を習ったのに、少しも御利益がなかったことが、むなしくあきれたことだということ。","叔母からもらった物語がすぐに読み終わってしまい、もっと読みたいのにかなわないことが、物足りなく残念だということ。"],"e":"作者は、夢の僧に「法華経五巻を疾く習へ」と言われても「習はむとも思ひかけず」、物語のことばかり考え、成長すれば夕顔や浮舟のようになるだろうと思っていました。「思ひける心」はその当時の思いを指し、後年の作者がそれを「まことに頼りなくあきれたことだ」と振り返っているのです。「容貌が衰えた」は本文にありません。「法華経を習った」は、習おうとも思わなかったという本文と逆です。「読み終わって物足りない」は本文にない内容です。","m":"夢見がちな少女時代を後年から反省"},{"id":97,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"逆接の係り結び（中垣こそあれ）","p":"【『土佐日記』】\n（国司の任期を終えた作者一行は、土佐から京の家に帰り着いた。）\n京に入り立ちてうれし。家にいたりて門に入るに、月あかければいとよくありさま見ゆ。聞きしよりもましていふかひなくぞこぼれ破れたる。家を預けたりつる人の心も荒れたるなりけり。中垣こそあれ、ひとつ家のやうなればのぞみて預れるなり。さるはたよりごとに物も絶えず得させたり。こよひかかることと声高にものもいはせず、いとはつらく見ゆれど志をばせむとす。さて池めいてくぼまり水づける所あり。ほとりに松もありき。五年六年のうちに千年や過ぎにけむ、かた枝はなくなりにけり。いま生ひたるぞまじれる。大かたの皆あれにたれば、「あはれ」とぞ人々いふ。思ひ出でぬ事なく思ひ恋しきがうちに、この家にて生れし女子のもろともに帰らねばいかがはかなしき。船人も皆子だかりてののしる。かかるうちに猶かなしきに堪へずして密に心知れる人といへりけるうた、\n「うまれしもかへらぬものを我がやどに小松のあるを見るがかなしさ」\nとぞいへる。猶あかずやあらむ、またかくなむ、\n「見し人の松のちとせにみましかばとほくかなしきわかれせましや」。\n（注）家を預けたりつる人＝留守の間、家の管理を頼んでおいた隣人。たより＝機会、ついで。志＝お礼の品。子だかりて＝子どもたちが集まって。\n（『土佐日記』。ウィキソース『土佐日記（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改め、異本注記を省いた。）","q":"傍線部「中垣こそあれ、ひとつ家のやうなればのぞみて預れるなり」の解釈として最も適当なものを選びなさい。","c":["間を隔てる垣根はあるけれども、一軒の家のようなものなので、隣人は自分から望んで家を預かったのである。","間を隔てる垣根こそあるべきなのに、一軒の家のようにしてしまったので、隣人は家をのぞき見て荒らしたのである。","間を隔てる垣根があるからこそ、別々の家だと思って、隣人は家を預かるのをいやがったのである。","間を隔てる垣根もないので、一軒の家のようになってしまい、隣人は家の中まで入りこんで預かったのである。"],"e":"「こそ＋已然形」で文が終わらずに下に続くとき、「〜けれども」という逆接の意味になります。「中垣こそあれ」は「中垣はあるけれども」です。「のぞみて」は「望んで」、「預れる」は「預かる」に存続（完了）の助動詞「り」の連体形が付いた形です。隣人は自分から望んで家の管理を引き受けたのに、家を荒れさせていたので、作者は恨めしく思っているのです。「あるべきなのに」「あるからこそ」は逆接の訳になっていません。「垣根もない」は「あれ」を打消と取り違えています。","m":"こそ＋已然形で続く＝逆接「〜けれども」"},{"id":98,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"反実仮想（ましかば…まし）","p":"【『土佐日記』】\n（国司の任期を終えた作者一行は、土佐から京の家に帰り着いた。）\n京に入り立ちてうれし。家にいたりて門に入るに、月あかければいとよくありさま見ゆ。聞きしよりもましていふかひなくぞこぼれ破れたる。家を預けたりつる人の心も荒れたるなりけり。中垣こそあれ、ひとつ家のやうなればのぞみて預れるなり。さるはたよりごとに物も絶えず得させたり。こよひかかることと声高にものもいはせず、いとはつらく見ゆれど志をばせむとす。さて池めいてくぼまり水づける所あり。ほとりに松もありき。五年六年のうちに千年や過ぎにけむ、かた枝はなくなりにけり。いま生ひたるぞまじれる。大かたの皆あれにたれば、「あはれ」とぞ人々いふ。思ひ出でぬ事なく思ひ恋しきがうちに、この家にて生れし女子のもろともに帰らねばいかがはかなしき。船人も皆子だかりてののしる。かかるうちに猶かなしきに堪へずして密に心知れる人といへりけるうた、\n「うまれしもかへらぬものを我がやどに小松のあるを見るがかなしさ」\nとぞいへる。猶あかずやあらむ、またかくなむ、\n「見し人の松のちとせにみましかばとほくかなしきわかれせましや」。\n（注）家を預けたりつる人＝留守の間、家の管理を頼んでおいた隣人。たより＝機会、ついで。志＝お礼の品。子だかりて＝子どもたちが集まって。\n（『土佐日記』。ウィキソース『土佐日記（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改め、異本注記を省いた。）","q":"和歌「見し人の松のちとせにみましかばとほくかなしきわかれせましや」の解釈として最も適当なものを選びなさい。","c":["亡くなった子を、千年も生きる松のようにいつまでも見ていられたのなら、遠く隔てられる悲しい別れをすることがあっただろうか、いや、なかっただろうに。","亡くなった子が千年も生きる松を見ていたので、遠い土地での悲しい別れも乗り越えることができたのだろう。","亡くなった子と一緒に千年も生きる松を見られるように、遠い土地で悲しい別れをしないでほしい。","亡くなった子を、千年も生きる松のように長く見ていたので、遠い土地での別れがいっそう悲しかった。"],"e":"「ましかば…まし」は反実仮想で、「もし〜だったならば…だっただろうに」と事実に反することを想定します。「せましや」の「や」は反語で、「悲しい別れをしただろうか、いやしなかっただろうに」となります。「とほく」は、遠い任国での別れとも、永遠の別れとも解されます。実際には子は土佐で亡くなり、松のように長く見守ることはできなかったのです。「見ていたので」は「ましかば」を確定条件と取り違えています。「しないでほしい」は願望の訳で、「まし」と合いません。","m":"ましかば…まし＝反実仮想"},{"id":99,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"心情（いとはつらく見ゆれど）","p":"【『土佐日記』】\n（国司の任期を終えた作者一行は、土佐から京の家に帰り着いた。）\n京に入り立ちてうれし。家にいたりて門に入るに、月あかければいとよくありさま見ゆ。聞きしよりもましていふかひなくぞこぼれ破れたる。家を預けたりつる人の心も荒れたるなりけり。中垣こそあれ、ひとつ家のやうなればのぞみて預れるなり。さるはたよりごとに物も絶えず得させたり。こよひかかることと声高にものもいはせず、いとはつらく見ゆれど志をばせむとす。さて池めいてくぼまり水づける所あり。ほとりに松もありき。五年六年のうちに千年や過ぎにけむ、かた枝はなくなりにけり。いま生ひたるぞまじれる。大かたの皆あれにたれば、「あはれ」とぞ人々いふ。思ひ出でぬ事なく思ひ恋しきがうちに、この家にて生れし女子のもろともに帰らねばいかがはかなしき。船人も皆子だかりてののしる。かかるうちに猶かなしきに堪へずして密に心知れる人といへりけるうた、\n「うまれしもかへらぬものを我がやどに小松のあるを見るがかなしさ」\nとぞいへる。猶あかずやあらむ、またかくなむ、\n「見し人の松のちとせにみましかばとほくかなしきわかれせましや」。\n（注）家を預けたりつる人＝留守の間、家の管理を頼んでおいた隣人。たより＝機会、ついで。志＝お礼の品。子だかりて＝子どもたちが集まって。\n（『土佐日記』。ウィキソース『土佐日記（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改め、異本注記を省いた。）","q":"傍線部「いとはつらく見ゆれど志をばせむとす」から読み取れる作者の態度として最も適当なものを選びなさい。","c":["家を荒れたままにした隣人の薄情さを恨めしく思いながらも、事を荒立てず、お礼の品はきちんと贈ろうとしている。","隣人の薄情さに腹を立て、それまで贈っていた品物の代金をすべて返してもらおうとしている。","家を守ってくれた隣人の誠実さに感激し、これまで以上に心をこめてお礼をしようとしている。","隣人の薄情さは恨めしいが、供の者に大声で文句を言わせて、気持ちを晴らそうとしている。"],"e":"「つらし」は「薄情だ・恨めしい」の意味です。「さるはたよりごとに物も絶えず得させたり（そのくせ、こちらは機会のあるごとに品物も絶えず与えていた）」とあるので、恨めしさはいっそう強いのですが、作者は今夜は従者に「声高にものもいはせず」、お礼の品（志）は贈ろうとしています。「代金を返してもらう」は本文にありません。「誠実さに感激」は「つらし」と逆です。「大声で文句を言わせて」は「声高にものもいはせず」と反対です。","m":"つらし＝薄情だ・恨めしい"},{"id":100,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"和歌の心情（小松）","p":"【『土佐日記』】\n（国司の任期を終えた作者一行は、土佐から京の家に帰り着いた。）\n京に入り立ちてうれし。家にいたりて門に入るに、月あかければいとよくありさま見ゆ。聞きしよりもましていふかひなくぞこぼれ破れたる。家を預けたりつる人の心も荒れたるなりけり。中垣こそあれ、ひとつ家のやうなればのぞみて預れるなり。さるはたよりごとに物も絶えず得させたり。こよひかかることと声高にものもいはせず、いとはつらく見ゆれど志をばせむとす。さて池めいてくぼまり水づける所あり。ほとりに松もありき。五年六年のうちに千年や過ぎにけむ、かた枝はなくなりにけり。いま生ひたるぞまじれる。大かたの皆あれにたれば、「あはれ」とぞ人々いふ。思ひ出でぬ事なく思ひ恋しきがうちに、この家にて生れし女子のもろともに帰らねばいかがはかなしき。船人も皆子だかりてののしる。かかるうちに猶かなしきに堪へずして密に心知れる人といへりけるうた、\n「うまれしもかへらぬものを我がやどに小松のあるを見るがかなしさ」\nとぞいへる。猶あかずやあらむ、またかくなむ、\n「見し人の松のちとせにみましかばとほくかなしきわかれせましや」。\n（注）家を預けたりつる人＝留守の間、家の管理を頼んでおいた隣人。たより＝機会、ついで。志＝お礼の品。子だかりて＝子どもたちが集まって。\n（『土佐日記』。ウィキソース『土佐日記（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改め、異本注記を省いた。）","q":"和歌「うまれしもかへらぬものを我がやどに小松のあるを見るがかなしさ」に込められた心情として最も適当なものを選びなさい。","c":["この家で生まれた娘さえ一緒に帰ってこないのに、留守の間に新しく生えた小松が庭にあるのを見ると、いっそう悲しくなる。","この家で生まれた娘は帰ってこないが、庭に小松が生えて家が守られていたことに、悲しみが少しなぐさめられる。","この家で生まれた小松はもう生えてこないので、庭が荒れてしまったことが何より悲しい。","この家で生まれた娘が庭に植えた小松を見ると、娘が戻ってくる日が待ち遠しく思われる。"],"e":"地の文に「この家にて生れし女子のもろともに帰らねば」とあり、作者は任国の土佐で娘を亡くしています。また庭には「いま生ひたるぞまじれる」と、留守の間に新しく生えた松がありました。歌は、この家で生まれた娘が帰らないのに、新しく生まれ育った小松があることを対比し、悲しみを深めています。「なぐさめられる」は「かなしさ」と合いません。「小松はもう生えてこない」は、小松があると詠む歌と逆です。「戻ってくる日が待ち遠しい」は、娘の死という事実と合いません。","m":"帰らぬ娘と新しく生えた小松の対比"},{"id":101,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"助動詞の意味（乗らるべき）","p":"【『大鏡』（三舟の才）】\n一とせ入道殿大井川の逍遥せさせ給ひしに、作文の船、管弦の船、和歌の船と分たせ給ひて、その道にたへなる人々をのせさせ給ひしに、この大納言殿の参り給へるを、入道殿、「かの大納言いづれの船にか乗らるべき」とのたまはすれば「和歌の船にのり侍らむ」とのたまひてよみたまへるぞかし。\n「をぐら山あらしの風のさむければもみぢのにしききぬ人ぞなき」。\n申しうけ給へるかひありてあそばしたりな。御みづからものたまふなるは「作文の船にぞ乗るべかりける。さてかばかりの詩を作りたらましかば名のあがらむこともまさりなまし。口をしかりけるわざかな。さても殿いづれにとか思ふとのたまはせしなむ、我ながら心おごりせられし」とのたまふなる。ひと事のすぐるるだにあるに、ましてかくいづれの道もぬけ出でたまひけむはいにしへも侍らぬことなり。\n（注）入道殿＝藤原道長。この大納言＝藤原公任。逍遥＝遊覧。作文＝漢詩を作ること。管弦＝音楽の演奏。たへなる＝すぐれている。申しうけ＝願い出て引き受け。あそばし＝お詠みになり。\n（『大鏡』。ウィキソース『大鏡（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改めた。）","q":"傍線部「いづれの船にか乗らるべき」の「らる」の意味として最も適当なものを選びなさい。","c":["尊敬","受身","可能","自発"],"e":"「らる」には受身・尊敬・可能・自発の四つの意味があります。ここは入道殿（藤原道長）が、大納言（藤原公任）について「どの船にお乗りになるのだろうか」と言っている場面で、高い地位にある公任の動作に敬意を添えた尊敬の用法です。「乗せられる」という受身では、自分で船を選んで乗る公任の動作と合いません。可能は中古では多く打消を伴い、ここに打消はありません。自発は「思ふ」「しのぶ」など心情や知覚の動詞に付くのが普通です。","m":"る・らる＝受身・尊敬・可能・自発"},{"id":102,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"解釈（乗るべかりける）","p":"【『大鏡』（三舟の才）】\n一とせ入道殿大井川の逍遥せさせ給ひしに、作文の船、管弦の船、和歌の船と分たせ給ひて、その道にたへなる人々をのせさせ給ひしに、この大納言殿の参り給へるを、入道殿、「かの大納言いづれの船にか乗らるべき」とのたまはすれば「和歌の船にのり侍らむ」とのたまひてよみたまへるぞかし。\n「をぐら山あらしの風のさむければもみぢのにしききぬ人ぞなき」。\n申しうけ給へるかひありてあそばしたりな。御みづからものたまふなるは「作文の船にぞ乗るべかりける。さてかばかりの詩を作りたらましかば名のあがらむこともまさりなまし。口をしかりけるわざかな。さても殿いづれにとか思ふとのたまはせしなむ、我ながら心おごりせられし」とのたまふなる。ひと事のすぐるるだにあるに、ましてかくいづれの道もぬけ出でたまひけむはいにしへも侍らぬことなり。\n（注）入道殿＝藤原道長。この大納言＝藤原公任。逍遥＝遊覧。作文＝漢詩を作ること。管弦＝音楽の演奏。たへなる＝すぐれている。申しうけ＝願い出て引き受け。あそばし＝お詠みになり。\n（『大鏡』。ウィキソース『大鏡（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改めた。）","q":"傍線部「作文の船にぞ乗るべかりける」の解釈として最も適当なものを選びなさい。","c":["漢詩の船に乗るべきだったなあ。","漢詩の船に乗ることができたのだなあ。","漢詩の船に乗るつもりだったそうだ。","漢詩の船に乗ってはならなかったのだ。"],"e":"「べかり」は当然・適当の助動詞「べし」の連用形、「ける」は詠嘆の助動詞「けり」の連体形（係助詞「ぞ」の結び）で、「乗るべきだったなあ」と、実際には和歌の船に乗ったことを惜しむ気持ちを表します。続く「かばかりの詩を作りたらましかば名のあがらむこともまさりなまし（これほどの詩を作っていたら、もっと名声が上がっただろうに）」とも対応します。「乗ることができた」は乗らなかった事実と合いません。「〜そうだ」は伝聞の訳です。「乗ってはならなかった」は打消を補っています。","m":"べかりけり＝〜すべきだったなあ"},{"id":103,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"心情の理由（心おごり）","p":"【『大鏡』（三舟の才）】\n一とせ入道殿大井川の逍遥せさせ給ひしに、作文の船、管弦の船、和歌の船と分たせ給ひて、その道にたへなる人々をのせさせ給ひしに、この大納言殿の参り給へるを、入道殿、「かの大納言いづれの船にか乗らるべき」とのたまはすれば「和歌の船にのり侍らむ」とのたまひてよみたまへるぞかし。\n「をぐら山あらしの風のさむければもみぢのにしききぬ人ぞなき」。\n申しうけ給へるかひありてあそばしたりな。御みづからものたまふなるは「作文の船にぞ乗るべかりける。さてかばかりの詩を作りたらましかば名のあがらむこともまさりなまし。口をしかりけるわざかな。さても殿いづれにとか思ふとのたまはせしなむ、我ながら心おごりせられし」とのたまふなる。ひと事のすぐるるだにあるに、ましてかくいづれの道もぬけ出でたまひけむはいにしへも侍らぬことなり。\n（注）入道殿＝藤原道長。この大納言＝藤原公任。逍遥＝遊覧。作文＝漢詩を作ること。管弦＝音楽の演奏。たへなる＝すぐれている。申しうけ＝願い出て引き受け。あそばし＝お詠みになり。\n（『大鏡』。ウィキソース『大鏡（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改めた。）","q":"傍線部「さても殿いづれにとか思ふとのたまはせしなむ、我ながら心おごりせられし」とあるが、公任が得意な気持ちになったのはなぜか。最も適当なものを選びなさい。","c":["道長が乗る船を本人に選ばせたのは、公任が漢詩・音楽・和歌のどの道にも優れていると認めていたからだと思われたから。","道長が公任だけを和歌の船に乗せたのは、公任の和歌がほかの誰よりも優れていると認めていたからだと思われたから。","公任の詠んだ和歌を道長がほめたたえ、漢詩の船に乗るよりもかえって名声が上がったから。","道長が大井川での遊覧に、ほかの貴族をさしおいて公任一人だけを招いたから。"],"e":"船は漢詩・管弦・和歌の三つに分けられ、それぞれ「その道にたへなる人々」が乗せられました。ところが公任については、道長が「どの船に乗るのか」と本人に尋ねています。どの道でも通用すると認められていたからこそだと受け取り、公任は自分ながら得意になったのです。「公任だけを和歌の船に乗せた」は、和歌の船を選んだのが公任自身である本文と合いません。「かえって名声が上がった」は、漢詩の船に乗れば名声がもっと上がったのにと惜しむ発言と逆です。「一人だけを招いた」は本文にありません。","m":"どの船に？と問われた＝万能と認められた"},{"id":104,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"語り手の評価（いづれの道も）","p":"【『大鏡』（三舟の才）】\n一とせ入道殿大井川の逍遥せさせ給ひしに、作文の船、管弦の船、和歌の船と分たせ給ひて、その道にたへなる人々をのせさせ給ひしに、この大納言殿の参り給へるを、入道殿、「かの大納言いづれの船にか乗らるべき」とのたまはすれば「和歌の船にのり侍らむ」とのたまひてよみたまへるぞかし。\n「をぐら山あらしの風のさむければもみぢのにしききぬ人ぞなき」。\n申しうけ給へるかひありてあそばしたりな。御みづからものたまふなるは「作文の船にぞ乗るべかりける。さてかばかりの詩を作りたらましかば名のあがらむこともまさりなまし。口をしかりけるわざかな。さても殿いづれにとか思ふとのたまはせしなむ、我ながら心おごりせられし」とのたまふなる。ひと事のすぐるるだにあるに、ましてかくいづれの道もぬけ出でたまひけむはいにしへも侍らぬことなり。\n（注）入道殿＝藤原道長。この大納言＝藤原公任。逍遥＝遊覧。作文＝漢詩を作ること。管弦＝音楽の演奏。たへなる＝すぐれている。申しうけ＝願い出て引き受け。あそばし＝お詠みになり。\n（『大鏡』。ウィキソース『大鏡（國文大觀）』による。旧字体を新字体に、踊り字を仮名に改めた。）","q":"傍線部「ひと事のすぐるるだにあるに、ましてかくいづれの道もぬけ出でたまひけむはいにしへも侍らぬことなり」の説明として最も適当なものを選びなさい。","c":["一つの道に優れているだけでもすばらしいのに、まして公任のようにどの道にも抜きんでていたのは昔にも例がないと、語り手が感嘆している。","一つの道に優れていれば十分なのに、公任がどの道にも手を出したのは欲張りで、昔の人はそうしなかったと、語り手が批判している。","一つの道に優れた人は多いが、どの道にも抜きんでた人も昔からたくさんいたので、公任も特別ではないと、語り手が評している。","一つの道にさえ優れていない人々が、公任のまねをしてどの道にも手を出すのは昔からよくないことだと、語り手が戒めている。"],"e":"「だに…まして」は、程度の軽いものを挙げて重いものを導く形で、「〜でさえ…なのに、まして〜は」の意味です。「ひと事のすぐるるだにあるに」は「一つのことに優れているのでさえ（たいしたことで）あるのに」、「ぬけ出で」は「抜きんでる」、「いにしへも侍らぬこと」は「昔にもないことです」で、公任の多才をたたえています。「欲張り」「戒め」は、ほめる文脈を非難にすり替えています。「昔からたくさんいた」は「いにしへも侍らぬ」と逆です。","m":"だに…まして＝〜でさえ…まして"},{"id":105,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"不可能の表現（えあふまじ）","p":"【『伊勢物語』第六段】\n昔男有けり。女のえあふまじかりけるを。年をへていひわたりけるに。からうじて女のこころあはせて。ぬすみて出にけり。あくた河といふ河をゐていきければ。草のうへにをきたる露を。かれはなにぞとなん男にとひける。ゆくさきはいととほく。夜も更ければ。おにある所ともしらで。雨いたうふり。神さへいといみじうなりければ。あばらなるくらの有けるに。女をばおくにおしいれて。男は弓やなぐひをおひて。とぐちに。はや夜もあけなむとおもひつつゐたりけるほどに。鬼はや女をばひとくちにくひてけり。ああやといひけれど。神のなるさはぎにえきかざりけり。やうやう夜の明行を見れば。ゐてこし女なし。あしずりしてなけどかひなし。\n　白玉か何そと人のとひし時露とこたへてけなましものを\n（注）句読点は底本のまま。ゐて＝連れて。神＝雷。あばらなる＝荒れはてた。やなぐひ＝矢を入れて背負う道具。あしずり＝じだんだを踏むこと。\n（『伊勢物語』第六段。ウィキソース『伊勢物語（群書類從）』による。踊り字を仮名に改めた。）","q":"傍線部「女のえあふまじかりけるを」の解釈として最も適当なものを選びなさい。","c":["妻として結婚することができそうになかった女を","決して会ってはならないと命じられていた女を","会うことをまったく望んでいなかった女を","会えばきっと不幸になるはずだった女を"],"e":"「え」は下に打消の語を伴って「〜できない」という不可能を表す副詞で、ここでは打消推量の「まじ」と呼応して「〜できそうにない」となります。「あふ」は男女が契りを結ぶ、結婚するの意味です。身分が高く、男が手に入れることのできそうにない相手だったことを示します。「会ってはならない」は禁止の訳で、「え」の不可能の意味が出ていません。「望んでいなかった」は女の意志の話にすり替えています。「不幸になるはず」は「まじ」を当然と取り違え、「え」も訳していません。","m":"え＋打消＝〜できない"},{"id":106,"k":"plan","ref":"想定問題","f":"古文（文法・語義）","t":"副助詞（さへ）","p":"【『伊勢物語』第六段】\n昔男有けり。女のえあふまじかりけるを。年をへていひわたりけるに。からうじて女のこころあはせて。ぬすみて出にけり。あくた河といふ河をゐていきければ。草のうへにをきたる露を。かれはなにぞとなん男にとひける。ゆくさきはいととほく。夜も更ければ。おにある所ともしらで。雨いたうふり。神さへいといみじうなりければ。あばらなるくらの有けるに。女をばおくにおしいれて。男は弓やなぐひをおひて。とぐちに。はや夜もあけなむとおもひつつゐたりけるほどに。鬼はや女をばひとくちにくひてけり。ああやといひけれど。神のなるさはぎにえきかざりけり。やうやう夜の明行を見れば。ゐてこし女なし。あしずりしてなけどかひなし。\n　白玉か何そと人のとひし時露とこたへてけなましものを\n（注）句読点は底本のまま。ゐて＝連れて。神＝雷。あばらなる＝荒れはてた。やなぐひ＝矢を入れて背負う道具。あしずり＝じだんだを踏むこと。\n（『伊勢物語』第六段。ウィキソース『伊勢物語（群書類從）』による。踊り字を仮名に改めた。）","q":"傍線部「神さへいといみじうなりければ」の「さへ」の意味として最も適当なものを選びなさい。","c":["添加（〜までも）","類推（〜さえ）","限定（〜だけ）","強意（〜こそ）"],"e":"古文の「さへ」は、すでにある事柄にさらに別の事柄が加わる「添加」を表し、「〜までも」と訳します。ここでは「雨いたうふり」に加えて「雷までもひどく鳴ったので」となります。「〜さえ」と訳す類推は、中古では主に「だに」が担う用法で、現代語の「さえ」に引かれて類推と取らないよう注意が必要です。限定は「のみ」「ばかり」など、強意は「こそ」などの係助詞の働きです。","m":"さへ＝添加「〜までも」"},{"id":107,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"人物像（かれはなにぞ）","p":"【『伊勢物語』第六段】\n昔男有けり。女のえあふまじかりけるを。年をへていひわたりけるに。からうじて女のこころあはせて。ぬすみて出にけり。あくた河といふ河をゐていきければ。草のうへにをきたる露を。かれはなにぞとなん男にとひける。ゆくさきはいととほく。夜も更ければ。おにある所ともしらで。雨いたうふり。神さへいといみじうなりければ。あばらなるくらの有けるに。女をばおくにおしいれて。男は弓やなぐひをおひて。とぐちに。はや夜もあけなむとおもひつつゐたりけるほどに。鬼はや女をばひとくちにくひてけり。ああやといひけれど。神のなるさはぎにえきかざりけり。やうやう夜の明行を見れば。ゐてこし女なし。あしずりしてなけどかひなし。\n　白玉か何そと人のとひし時露とこたへてけなましものを\n（注）句読点は底本のまま。ゐて＝連れて。神＝雷。あばらなる＝荒れはてた。やなぐひ＝矢を入れて背負う道具。あしずり＝じだんだを踏むこと。\n（『伊勢物語』第六段。ウィキソース『伊勢物語（群書類從）』による。踊り字を仮名に改めた。）","q":"傍線部「草のうへにをきたる露を。かれはなにぞとなん男にとひける」から読み取れる女の人物像として最も適当なものを選びなさい。","c":["屋敷の奥で大切に育てられ、草の上の露さえ見たことがないほど、外の世界を知らない高貴な女性。","自然の美しさに深く心を動かされ、どんなときにも風流な問いかけを忘れない教養豊かな女性。","男と逃げることに不安を感じ、わざと答えにくい問いを投げかけて男を試そうとする用心深い女性。","露が何であるかを知りながら、男を退屈させないように話しかける気配りの細やかな女性。"],"e":"露はありふれたものですが、女はそれを「あれは何か」と尋ねています。冒頭の「えあふまじかりける（結婚できそうになかった）」とあわせると、身分の高い家の奥深くで育ち、屋外の自然に触れたこともない姫君であることが分かります。この無邪気な問いは、最後の歌で「露とこたへて」と回想され、男の悲しみを深める伏線にもなっています。「風流な問いかけ」「男を試す」「知りながら」は、いずれも露を知らないという素朴さを読み取っていません。","m":"露を知らぬ姫＝深窓の高貴な女性"},{"id":108,"k":"plan","ref":"想定問題","f":"古文（読解）","t":"和歌の心情（白玉か何ぞ）","p":"【『伊勢物語』第六段】\n昔男有けり。女のえあふまじかりけるを。年をへていひわたりけるに。からうじて女のこころあはせて。ぬすみて出にけり。あくた河といふ河をゐていきければ。草のうへにをきたる露を。かれはなにぞとなん男にとひける。ゆくさきはいととほく。夜も更ければ。おにある所ともしらで。雨いたうふり。神さへいといみじうなりければ。あばらなるくらの有けるに。女をばおくにおしいれて。男は弓やなぐひをおひて。とぐちに。はや夜もあけなむとおもひつつゐたりけるほどに。鬼はや女をばひとくちにくひてけり。ああやといひけれど。神のなるさはぎにえきかざりけり。やうやう夜の明行を見れば。ゐてこし女なし。あしずりしてなけどかひなし。\n　白玉か何そと人のとひし時露とこたへてけなましものを\n（注）句読点は底本のまま。ゐて＝連れて。神＝雷。あばらなる＝荒れはてた。やなぐひ＝矢を入れて背負う道具。あしずり＝じだんだを踏むこと。\n（『伊勢物語』第六段。ウィキソース『伊勢物語（群書類從）』による。踊り字を仮名に改めた。）","q":"和歌「白玉か何そと人のとひし時露とこたへてけなましものを」に込められた男の心情として最も適当なものを選びなさい。","c":["あの人が「白玉か何か」と尋ねたときに「露だよ」と答えて、自分も露のように消えてしまえばよかったのに、そうすればこんな悲しみを味わわずにすんだという嘆き。","あの人が「白玉か何か」と尋ねたときに「露だよ」と答えたので、あの人は露のようにはかなく消えてしまったのだという後悔。","あの人が「白玉か何か」と尋ねたとき、露が白玉のように美しく見えたことを、今もなつかしく思い出す喜び。","あの人が「白玉か何か」と尋ねたときに「露だよ」と答えなかったので、あの人が怒って去ってしまったことへの恨み。"],"e":"「けなまし」は下二段動詞「消（く）」の連用形「け」＋強意の助動詞「ぬ」の未然形「な」＋反実仮想の助動詞「まし」で、「消えてしまえばよかったのに」と、実現しなかったことを願う気持ちを表します。「ものを」は逆接的な詠嘆です。女を鬼に食われて失った男が、あのとき露のように自分が消えていれば、この悲しみを知らずにすんだのにと嘆いているのです。「答えたので消えた」は「まし」を事実と取り違えています。「喜び」は場面に合いません。「怒って去った」は、女が鬼に食われたという本文と合いません。","m":"なまし＝〜てしまえばよかったのに"},{"id":109,"k":"plan","ref":"想定問題","f":"漢文","t":"禁止（無敢）","p":"【『戦国策』楚策】\n荊宣王問群臣曰、「吾聞北方之畏昭奚恤也、果誠何如。」群臣莫対。江一対曰、「虎求百獣而食之、得狐。狐曰、『子無敢食我也。天帝使我長百獣。今子食我、是逆天帝命也。子以我為不信、吾為子先行。子随我後、観百獣之見我而敢不走乎。』虎以為然、故遂与之行。獣見之皆走。虎不知獣畏己而走也、以為畏狐也。今王之地方五千里、帯甲百万、而専属之昭奚恤。故北方之畏奚恤也、其実畏王之甲兵也、猶百獣之畏虎也。」\n（注）荊宣王＝楚の宣王。昭奚恤＝楚の宰相。江一＝楚の臣。長＝かしらとする。帯甲＝武装した兵士。\n（『戦国策』楚策一。中国語版ウィキソース『戰國策（士禮居叢書本）』による。漢字を新字体に改め、注を省き、句読点を改めた。）","q":"傍線部「子無敢食我也」の解釈として最も適当なものを選びなさい。","c":["あなたは決して私を食べてはいけない。","あなたには私を食べる勇気はないだろう。","あなたは私を食べないわけにはいかない。","あなたがあえて私を食べる必要はない。"],"e":"「無」は「勿・毋」と同じく「〜（する）なかれ」と読んで禁止を表します。「敢」が加わった「無敢〜」は「敢へて〜する無かれ」と読み、「決して〜するな」という強い禁止になります。「子」はここでは「あなた」の意味です。続けて狐は、天帝が自分を百獣のかしらにしたので、食べれば天帝の命令に背くと理由を述べています。「勇気はないだろう」は推量、「ないわけにはいかない」は二重否定、「必要はない」は不必要の意味に取り違えたものです。","m":"無敢〜＝敢へて〜する無かれ"},{"id":110,"k":"plan","ref":"想定問題","f":"漢文","t":"主旨（虎の威を借る狐）","p":"【『戦国策』楚策】\n荊宣王問群臣曰、「吾聞北方之畏昭奚恤也、果誠何如。」群臣莫対。江一対曰、「虎求百獣而食之、得狐。狐曰、『子無敢食我也。天帝使我長百獣。今子食我、是逆天帝命也。子以我為不信、吾為子先行。子随我後、観百獣之見我而敢不走乎。』虎以為然、故遂与之行。獣見之皆走。虎不知獣畏己而走也、以為畏狐也。今王之地方五千里、帯甲百万、而専属之昭奚恤。故北方之畏奚恤也、其実畏王之甲兵也、猶百獣之畏虎也。」\n（注）荊宣王＝楚の宣王。昭奚恤＝楚の宰相。江一＝楚の臣。長＝かしらとする。帯甲＝武装した兵士。\n（『戦国策』楚策一。中国語版ウィキソース『戰國策（士禮居叢書本）』による。漢字を新字体に改め、注を省き、句読点を改めた。）","q":"江一がこの話を通して宣王に伝えようとしたこととして最も適当なものを選びなさい。","c":["北方の国々が昭奚恤を恐れているのは、実は昭奚恤に任されている王の強大な軍隊を恐れているのだということ。","昭奚恤は狐のように知恵がはたらくので、北方の国々は昭奚恤その人の才能を恐れているのだということ。","王は虎のように強いが、狐のような家臣を信じすぎると、いずれ天帝の命令に背くことになるということ。","北方の国々が王を恐れないのは、昭奚恤が王の軍隊を勝手に動かして力を弱めているからだということ。"],"e":"話の後半で江一は、王の領土が五千里、兵が百万で、それを昭奚恤にすっかり任せていると述べ、「北方之畏奚恤也、其実畏王之甲兵也」（北方が昭奚恤を恐れるのは、実は王の軍隊を恐れているのだ）と結論づけています。百獣が恐れたのは狐ではなく後ろの虎だったという寓話と対応しています。「昭奚恤その人の才能を恐れる」は結論と逆です。「天帝の命令に背く」は狐の口実を取り違えています。「王を恐れない」は本文に反します。","m":"狐が借りたのは虎の威＝臣が借りたのは王の兵"},{"id":111,"k":"plan","ref":"想定問題","f":"漢文","t":"反語（安能）","p":"【『戦国策』斉策】\n（楚の将軍昭陽が魏を破り、さらに斉を攻めようとしたとき、斉のために遣わされた陳軫は、昭陽に次の話をした。）\n楚有祠者、賜其舎人巵酒。舎人相謂曰、「数人飲之不足、一人飲之有余。請画地為蛇、先成者飲酒。」一人蛇先成、引酒且飲之。乃左手持巵、右手画蛇曰、「吾能為之足。」未成、一人之蛇成、奪其巵曰、「蛇固無足。子安能為之足。」遂飲其酒。為蛇足者、終亡其酒。\n（注）祠＝祭りをする。舎人＝家来。巵＝さかずき。\n（『戦国策』斉策二。中国語版ウィキソース『戰國策（士禮居叢書本）』による。漢字を新字体に改め、注と話の後半を省き、句読点を改めた。）","q":"傍線部「子安能為之足」の解釈として最も適当なものを選びなさい。","c":["あなたはどうして蛇に足を描くことができようか、いや、できはしない。","あなたはどうやって蛇に足を描くことができたのか。","あなたはたやすく蛇に足を描くことができる。","あなたはどこで蛇の足を見たことがあるのか。"],"e":"「安」は「いづくんぞ」と読む疑問・反語の副詞で、文末を「〜ん」と結ぶと反語になります。「子安能為之足」は「子安くんぞ能く之が足を為らん」と読み、「蛇にはもともと足がないのに、どうして足を描けようか、いや描けない」という意味です。直前の「蛇固無足（蛇にはもともと足がない）」が根拠です。「どうやって描けたのか」は疑問として訳しており、相手を言い負かす場面に合いません。「たやすく」は「安」を「やすし」と読み誤ったものです。「どこで見たのか」は場所の疑問に取り違えています。","m":"安くんぞ〜ん＝どうして〜か（反語）"},{"id":112,"k":"plan","ref":"想定問題","f":"漢文","t":"主旨（蛇足）","p":"【『戦国策』斉策】\n（楚の将軍昭陽が魏を破り、さらに斉を攻めようとしたとき、斉のために遣わされた陳軫は、昭陽に次の話をした。）\n楚有祠者、賜其舎人巵酒。舎人相謂曰、「数人飲之不足、一人飲之有余。請画地為蛇、先成者飲酒。」一人蛇先成、引酒且飲之。乃左手持巵、右手画蛇曰、「吾能為之足。」未成、一人之蛇成、奪其巵曰、「蛇固無足。子安能為之足。」遂飲其酒。為蛇足者、終亡其酒。\n（注）祠＝祭りをする。舎人＝家来。巵＝さかずき。\n（『戦国策』斉策二。中国語版ウィキソース『戰國策（士禮居叢書本）』による。漢字を新字体に改め、注と話の後半を省き、句読点を改めた。）","q":"陳軫がこの話によって昭陽に伝えようとしたこととして最も適当なものを選びなさい。","c":["すでに魏を破って十分な功績を挙げたのに、さらに斉を攻めるのは余計なことで、かえってそれまでに得たものまで失いかねないということ。","戦いでは先に勝った者がすべてを得るのだから、ためらわずにすぐさま斉を攻めて功績を独り占めするべきだということ。","家来たちに十分な褒美を与えないと、酒を奪い合うように内輪もめが起こり、戦いに勝てなくなるということ。","戦いに勝つためには、蛇に足を描くような工夫を重ね、相手が予想しない策を用いることが大切だということ。"],"e":"蛇の絵を最初に描き上げた者は、余裕を見せて足まで描き加えたために、手にしかけた酒を失いました。陳軫は、魏を破って大功を立てた昭陽を、勝負のついた絵に足を描き足す者になぞらえ、さらに斉を攻めるのは不要であるうえ、すべてを失う危険があると説いています。「すぐさま斉を攻めよ」は話の教訓と逆です。「褒美」「内輪もめ」は話の要点ではありません。「足を描くような工夫が大切」は、余計なことをして失敗したという寓話の意味を取り違えています。","m":"蛇足＝余計なことをして全部失う"},{"id":113,"k":"plan","ref":"想定問題","f":"漢文","t":"否定（不肯）","p":"【『戦国策』燕策】\n趙且伐燕。蘇代為燕謂恵王曰、「今者臣来、過易水。蚌方出曝、而鷸啄其肉。蚌合而拑其喙。鷸曰、『今日不雨、明日不雨、即有死蚌。』蚌亦謂鷸曰、『今日不出、明日不出、即有死鷸。』両者不肯相舎。漁者得而并禽之。今趙且伐燕。燕趙久相支、以弊大衆。臣恐強秦之為漁父也。故願王之熟計之也。」恵王曰、「善。」乃止。\n（注）蘇代＝遊説家。恵王＝趙の恵文王。易水＝川の名。蚌＝どぶがい。曝＝日にあたる。鷸＝しぎ（鳥の名）。拑＝はさむ。喙＝くちばし。禽＝とらえる。支＝対抗する。\n（『戦国策』燕策二。中国語版ウィキソース『戰國策（士禮居叢書本）』による。漢字を新字体に改め、注を省き、句読点を改めた。）","q":"傍線部「両者不肯相舎」の解釈として最も適当なものを選びなさい。","c":["両者とも、相手を放そうとはしなかった。","両者とも、相手の家に泊まろうとはしなかった。","両者とも、相手を放すことができなかった。","両者とも、相手を許すべきではなかった。"],"e":"「肯」は「がへんず」と読み、「承知して〜する」の意味で、「不肯〜」は「肯へて〜せず」と読んで「〜しようとしない」と、意志をもって拒むことを表します。「舎」は「捨」に通じて「放す」の意味です。鷸と蚌は、どちらも相手が先に死ぬと言い張って譲らなかったのです。「泊まろうとしない」は「舎」を宿の意味に取ったものです。「放すことができなかった」は不可能の訳で、意志を表す「不肯」と合いません。「許すべきではなかった」は当然の意味に取り違えています。","m":"不肯〜＝肯へて〜せず（〜しようとしない）"},{"id":114,"k":"plan","ref":"想定問題","f":"漢文","t":"主旨（漁父の利）","p":"【『戦国策』燕策】\n趙且伐燕。蘇代為燕謂恵王曰、「今者臣来、過易水。蚌方出曝、而鷸啄其肉。蚌合而拑其喙。鷸曰、『今日不雨、明日不雨、即有死蚌。』蚌亦謂鷸曰、『今日不出、明日不出、即有死鷸。』両者不肯相舎。漁者得而并禽之。今趙且伐燕。燕趙久相支、以弊大衆。臣恐強秦之為漁父也。故願王之熟計之也。」恵王曰、「善。」乃止。\n（注）蘇代＝遊説家。恵王＝趙の恵文王。易水＝川の名。蚌＝どぶがい。曝＝日にあたる。鷸＝しぎ（鳥の名）。拑＝はさむ。喙＝くちばし。禽＝とらえる。支＝対抗する。\n（『戦国策』燕策二。中国語版ウィキソース『戰國策（士禮居叢書本）』による。漢字を新字体に改め、注を省き、句読点を改めた。）","q":"蘇代が「臣恐強秦之為漁父也」と述べて恵王に伝えようとしたこととして最も適当なものを選びなさい。","c":["趙と燕が長く争って互いに疲れきれば、強国の秦が漁師のように両国をまとめて手に入れてしまうおそれがあるということ。","秦は漁業で栄えた国なので、趙が燕を攻めれば、秦が易水の漁場を奪いに来るおそれがあるということ。","趙と燕が手を結べば、強国の秦も漁師のように両国の言いなりになるだろうということ。","趙が燕を攻めるなら、漁師が鷸と蚌をとらえたように、すばやく一気に攻め落とすべきだということ。"],"e":"鷸と蚌が互いに譲らずに争っているうちに、漁師が両方をまとめてとらえました。蘇代は、趙と燕を鷸と蚌に、強国の秦を漁師になぞらえ、両国が長く対抗して民衆を疲れさせれば、秦が利益を得てしまうと説いたのです。恵王はこれを聞いて攻撃をやめました。「漁業で栄えた国」はたとえを字義どおりに取ったものです。「秦が言いなりになる」は、秦を漁師にたとえた意味と逆です。「一気に攻め落とすべき」は攻撃をやめさせようとした主旨に反します。","m":"漁父の利＝争う両者のすきに第三者が得る"},{"id":115,"k":"plan","ref":"想定問題","f":"漢文","t":"比較（於）","p":"【『荀子』勧学篇】\n君子曰、学不可以已。青取之於藍、而青於藍。氷水為之、而寒於水。木直中縄、輮以為輪、其曲中規。雖有槁暴、不復挺者、輮使之然也。故木受縄則直、金就礪則利。君子博学而日参省乎己、則知明而行無過矣。\n（注）已＝やめる。藍＝青色の染料をとる草。縄＝墨縄（まっすぐな線を引く道具）。輮＝曲げる。規＝円を描く道具。槁暴＝枯れて乾く。挺＝まっすぐになる。礪＝砥石。参省＝反省する。知＝知恵。\n（『荀子』勧学篇の冒頭。中国語版ウィキソース『荀子』勸學篇による。漢字を新字体に改め、楊倞注を省き、句読点を改めた。）","q":"傍線部「青取之於藍、而青於藍」の書き下し文として正しいものを選びなさい。","c":["青は之を藍より取りて、藍よりも青し。","青は之を藍に取りて、藍に於いて青し。","青は藍より之を取るも、藍を青くす。","青は之を取りて藍に於き、而して藍を青くす。"],"e":"「於」は置き字で、前の「取之於藍」では起点を表して「藍より」と読み、後の「青於藍」では形容詞「青」の後に置かれて比較を表し「藍よりも青し」と読みます。全体で「青色の染料は藍から取るが、もとの藍よりも青い」という意味になり、学問によって人はもとの性質を超えられるというたとえです。「藍に於いて青し」は置き字を読んでしまい、比較の意味が出ません。「藍を青くす」「藍に於き」は、文の構造を誤っています。","m":"形容詞＋於＋名詞＝比較「〜よりも」"},{"id":116,"k":"plan","ref":"想定問題","f":"漢文","t":"主旨（学不可以已）","p":"【『荀子』勧学篇】\n君子曰、学不可以已。青取之於藍、而青於藍。氷水為之、而寒於水。木直中縄、輮以為輪、其曲中規。雖有槁暴、不復挺者、輮使之然也。故木受縄則直、金就礪則利。君子博学而日参省乎己、則知明而行無過矣。\n（注）已＝やめる。藍＝青色の染料をとる草。縄＝墨縄（まっすぐな線を引く道具）。輮＝曲げる。規＝円を描く道具。槁暴＝枯れて乾く。挺＝まっすぐになる。礪＝砥石。参省＝反省する。知＝知恵。\n（『荀子』勧学篇の冒頭。中国語版ウィキソース『荀子』勸學篇による。漢字を新字体に改め、楊倞注を省き、句読点を改めた。）","q":"この文章で筆者が述べていることとして最も適当なものを選びなさい。","c":["曲げた木がもとに戻らないように、人も学問によって本来の性質を変えることができるので、学問は途中でやめてはならない。","青や氷が藍や水から生まれるように、人の才能は生まれつき決まっているので、学問によって変えることはできない。","まっすぐな木を曲げて車輪にするのは自然に逆らうことなので、人も無理に学問をして性質を変えるべきではない。","君子は広く学ぶよりも、毎日自分を反省することのほうが大切なので、学問は必要な分だけにとどめるべきである。"],"e":"冒頭の「学不可以已（学問はやめてはならない）」が主張です。青は藍より青く、氷は水より冷たいという例や、まっすぐな木も曲げれば車輪となり、乾いても元に戻らないという例は、人が学問という働きかけによってもとの性質を超え、変わりうることのたとえです。最後に、広く学び毎日自分を反省すれば知恵は明らかで行いに過ちがないと結んでいます。「生まれつき決まっている」「性質を変えるべきではない」は主張と逆です。「広く学ぶよりも反省」は、博学と反省の両方を挙げる本文と合いません。","m":"学は以て已むべからず＝学問で人は変わる"},{"id":117,"k":"plan","ref":"想定問題","f":"漢文","t":"書き下し（有朋自遠方来）","p":"【『論語』学而篇】\n子曰、「学而時習之、不亦説乎。有朋自遠方来、不亦楽乎。人不知而不慍、不亦君子乎。」\n子曰、「巧言令色、鮮矣仁。」\n子曰、「不患人之不己知、患不知人也。」\n（注）説＝よろこぶ。慍＝不満に思う。巧言令色＝言葉を飾り顔色をとりつくろうこと。患＝気にかける。\n（『論語』学而第一の第一・三・十六章を抄出。中国語版ウィキソース『論語』學而第一による。漢字を新字体に改め、句読点を改めた。）","q":"傍線部「有朋自遠方来、不亦楽乎」の書き下し文として正しいものを選びなさい。","c":["朋有り遠方より来たる、亦た楽しからずや。","朋の遠方に有りて自ら来たる、亦た楽しまずや。","遠方より来たる朋有らば、亦た楽しむべけんや。","朋は遠方より自ら来たる有り、亦た楽しきか。"],"e":"「自」は「より」と読んで起点を表し、「自遠方」は「遠方より」となります。「有朋」は「朋有り」と読みます。「不亦〜乎」は「亦た〜ずや」と読み、「なんと〜ではないか」という詠嘆の意味になるので、「亦た楽しからずや」です。「自ら」と読むと「自分から」の意味になり、「遠方」と結びつきません。「楽しむべけんや」は反語の形で、「楽しむことができようか、いやできない」と逆の意味になります。「楽しきか」は単なる疑問で、「不亦〜乎」の形を読めていません。","m":"不亦〜乎＝亦た〜ずや（なんと〜ではないか）"},{"id":118,"k":"plan","ref":"想定問題","f":"漢文","t":"語順（不己知）","p":"【『論語』学而篇】\n子曰、「学而時習之、不亦説乎。有朋自遠方来、不亦楽乎。人不知而不慍、不亦君子乎。」\n子曰、「巧言令色、鮮矣仁。」\n子曰、「不患人之不己知、患不知人也。」\n（注）説＝よろこぶ。慍＝不満に思う。巧言令色＝言葉を飾り顔色をとりつくろうこと。患＝気にかける。\n（『論語』学而第一の第一・三・十六章を抄出。中国語版ウィキソース『論語』學而第一による。漢字を新字体に改め、句読点を改めた。）","q":"傍線部「不患人之不己知、患不知人也」の解釈として最も適当なものを選びなさい。","c":["他人が自分を認めてくれないことを気にかけず、自分が他人を理解していないことを気にかけるべきだ。","他人が自分の知らないことを知っていても気にかけず、自分が他人に知られていないことを気にかけるべきだ。","他人が自分を知らないことを気にかけるのは、自分が他人を知らないからである。","他人が自分を知らないことを気にかけて、他人に自分を知ってもらうよう努めるべきだ。"],"e":"「不己知」は「己を知らず」と読みます。否定文では目的語の代名詞「己」が動詞「知」の前に出ることがあり、「人之不己知」は「人の己を知らざる」、つまり「他人が自分を知らない（認めない）こと」です。全体は「人の己を知らざるを患へず、人を知らざるを患ふるなり」で、他人の評価よりも自分が人を理解できているかを気にかけよという教えです。「自分の知らないことを知っていても」は主客を取り違えています。「知らないからである」は因果関係にすり替えています。「気にかけて…努めるべき」は「患へず」を逆に訳しています。","m":"人の己を知らざるを患へず"},{"id":119,"k":"plan","ref":"想定問題","f":"漢文","t":"詩形と押韻（春望）","p":"【杜甫「春望」】\n国破山河在\n城春草木深\n感時花濺涙\n恨別鳥驚心\n烽火連三月\n家書抵万金\n白頭掻更短\n渾欲不勝簪\n（注）城＝城壁に囲まれた町（ここでは長安）。濺＝そそぐ。烽火＝のろし。転じて戦乱。家書＝家族からの手紙。抵＝あたる。渾＝まったく。簪＝冠をとめるかんざし。\n（杜甫「春望」。中国語版ウィキソース『春望』（全唐詩巻二二四）による。漢字を新字体に改め、異文注記を省いた。）","q":"この詩の形式と、押韻している字の組み合わせとして正しいものを選びなさい。","c":["五言律詩 ― 深・心・金・簪","五言絶句 ― 深・心・金・簪","五言律詩 ― 在・深・心・金・簪","五言律詩 ― 在・涙・月・短"],"e":"一句が五字で八句から成るので五言律詩です（四句なら絶句）。五言詩では原則として偶数句の末字で韻を踏むので、第二・四・六・八句の末字「深・心・金・簪」が韻字です（音読みはシン・シン・キン・シンで、響きがそろっています）。第一句の「在」は五言詩では原則として押韻せず、ここでも韻が合いません。「在・涙・月・短」は奇数句の末字を並べたもので、押韻の位置を誤っています。","m":"五言は偶数句末で押韻、八句＝律詩"},{"id":120,"k":"plan","ref":"想定問題","f":"漢文","t":"解釈（感時花濺涙）","p":"【杜甫「春望」】\n国破山河在\n城春草木深\n感時花濺涙\n恨別鳥驚心\n烽火連三月\n家書抵万金\n白頭掻更短\n渾欲不勝簪\n（注）城＝城壁に囲まれた町（ここでは長安）。濺＝そそぐ。烽火＝のろし。転じて戦乱。家書＝家族からの手紙。抵＝あたる。渾＝まったく。簪＝冠をとめるかんざし。\n（杜甫「春望」。中国語版ウィキソース『春望』（全唐詩巻二二四）による。漢字を新字体に改め、異文注記を省いた。）","q":"第三・四句「感時花濺涙、恨別鳥驚心」の解釈として最も適当なものを選びなさい。","c":["時勢の乱れに心を痛めては、花を見ても涙を流し、家族との別れを嘆いては、鳥の声にも心をはっとさせられる。","春の訪れに感動しては、花の美しさにうれし涙を流し、家族と別れたことを恨んでは、鳥の声で心を慰める。","時の過ぎるのを忘れて花に見入り、涙を流すことも忘れ、別れを恨む心も、鳥の声を聞いて消えていく。","時勢に感じて花に水をそそぎ、別れを恨んで鳥を心の中から追い払う。"],"e":"「感時」は戦乱で国が荒れた時勢に心を痛めること、「恨別」は家族との別れを嘆くことです。「濺涙」は涙をそそぐ、「驚心」は心をはっとさせる意味で、本来なら楽しいはずの春の花や鳥の声さえ悲しみを誘うという対句です（花や鳥を主語として擬人的に読む説もありますが、悲しみを表す点は同じです）。「うれし涙」「心を慰める」「恨む心も消えていく」は、乱世を嘆く詩全体の調子と逆です。「花に水をそそぐ」は「濺涙」の「涙」を読み落としています。","m":"春の花鳥さえ悲しみを誘う（対句）"}];
var FIELDS=["現代文（評論）","漢字・語彙","古文（文法・語義）","古文（読解）","漢文"];
var KIND={past:"過去問ベース",plan:"想定問題"};
var LS="waseda-kokugo-v1";
var scope="all";
try{var sc0=localStorage.getItem(LS+"-scope");if(sc0==="past"||sc0==="plan")scope=sc0}catch(e){}
function P(){return scope==="all"?QS:QS.filter(function(q){return q.k===scope})}
var app=document.getElementById("app");
var byId={};QS.forEach(function(q){byId[q.id]=q});
var S={v:1,rev:0,at:0,stats:{},hist:[]};
var view="home",X=null,tick=null,tab="exp",armed="";
var ref=null,busy=false,dirty=false,deb=null,fails=0,syncState="local";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function st(id){return S.stats[id]||null}
function A(q){return q.a||0}
function ord(q){var n=q.c.length,i,a=[];for(i=0;i<(q.last?n-1:n);i++)a.push(i);if(!q.fix)a=shuffle(a);if(q.last)a.push(n-1);return a}
function yearLabel(y){return y<0?"前"+(-y)+"年":y+"年"}

/* ---- 記録 ---- */
function norm(d){d=d||{};return {v:1,rev:+d.rev||0,at:+d.at||0,stats:(d.stats&&typeof d.stats==="object")?JSON.parse(JSON.stringify(d.stats)):{},hist:Array.isArray(d.hist)?JSON.parse(JSON.stringify(d.hist)):[]}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);if(d&&d.v===1)S=norm(d)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=s==="account"?"記録の保存先：アカウント（ほかの端末でも続きから使えます）":"記録の保存先：この端末のブラウザ"}
function save(){S.rev++;S.at=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(deb);deb=setTimeout(push,1200)}}
function push(){
  if(!ref||busy||!dirty)return;
  busy=true;dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;setSync("account")},function(e){
    dirty=true;fails++;
    if(!e||e.code!=="unavailable"||fails>=2){if(e&&e.code!=="unavailable"){ref=null}setSync("local")}
  }).then(function(){busy=false;if(dirty&&ref&&fails<2){clearTimeout(deb);deb=setTimeout(push,3000)}});
}
function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        var d=db.doc("data/users/"+uid+"/progress");
        return d.get().then(function(snap){
          ref=d;
          var remote=snap.exists?norm(snap.data()):null;
          if(remote&&remote.rev>S.rev){S=remote;saveLocal();if(view==="home")home()}
          else if(S.rev>(remote?remote.rev:0)){dirty=true;push()}
          setSync("account");
        });
      });
    }).catch(function(){ref=null;setSync("local")});
  }catch(e){}
}

/* ---- 出題 ---- */
function rank(q){var s=st(q.id);if(!s||!s.n)return 0;return s.last===0?1:2}
function pick(pool,n,ex){
  var c=shuffle(pool.filter(function(q){return !ex||!ex[q.id]}));
  c.sort(function(a,b){return rank(a)-rank(b)||((st(a.id)||{}).t||0)-((st(b.id)||{}).t||0)});
  return c.slice(0,n);
}
function quotas(n){
  var raw=FIELDS.map(function(f){return P().filter(function(q){return q.f===f}).length*n/P().length});
  var base=raw.map(Math.floor),rest=n-base.reduce(function(a,b){return a+b},0);
  var ord=raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]});
  for(var k=0;k<rest;k++)base[ord[k%ord.length][1]]++;
  return base;
}
function buildFull(){
  var n=Math.min(10,P().length),qt=quotas(n),out=[],used={};
  FIELDS.forEach(function(f,i){pick(P().filter(function(q){return q.f===f}),qt[i]).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length<n)pick(P(),n-out.length,used).forEach(function(q){out.push(q)});
  return shuffle(out);
}
function begin(kind,f,ex){
  var list,mode="exam",title="";
  if(kind==="full"){list=buildFull();title="10問テスト"}
  else if(kind==="field"){list=pick(P().filter(function(q){return q.f===f}),10);title=f+"のテスト"}
  else if(kind==="similar"){list=pick(P().filter(function(q){return q.f===f}),5,ex);mode="drill";title=f+"をもう5問"}
  else{list=shuffle(QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0})).slice(0,10);mode="drill";title="まちがえた問題の復習"}
  if(!list.length){home();return}
  var now=Date.now(),limit=list.length*60;
  X={mode:mode,kind:kind,f:f||"",title:title,k:0,start:now,limit:limit,deadline:now+limit*1000,done:false,
     items:list.map(function(q){return {id:q.id,order:ord(q),pick:null,ok:null}})};
  view="exam";tab="exp";armed="";run();
}
function run(){exam();startTick();window.scrollTo(0,0)}
function startTick(){stopTick();if(!X||X.mode!=="exam"||X.done)return;paintClock();tick=setInterval(function(){if(!X||X.done){stopTick();return}if(Date.now()>=X.deadline){grade(true)}else paintClock()},500)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function paintClock(){var el=document.getElementById("clock");if(!el||!X)return;var s=Math.max(0,Math.ceil((X.deadline-Date.now())/1000));el.textContent="残り "+Math.floor(s/60)+":"+("0"+s%60).slice(-2);el.className="clock"+(s<=60?" low":"")}
function rec(id,ok,now){var s=S.stats[id]||(S.stats[id]={n:0,ok:0,last:0,t:0});s.n++;if(ok)s.ok++;s.last=ok?1:0;s.t=now}
function grade(auto){
  stopTick();var now=Date.now(),score=0;
  X.items.forEach(function(it){it.ok=it.pick===A(byId[it.id]);if(it.ok)score++;rec(it.id,it.ok,now)});
  X.score=score;X.sec=Math.min(Math.round((now-X.start)/1000),X.limit);X.auto=!!auto;X.done=true;
  S.hist.push({ts:now,kind:X.kind,f:X.f,score:score,total:X.items.length,sec:X.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  save();view="result";result();window.scrollTo(0,0);
}
function finishDrill(){X.done=true;X.score=X.items.filter(function(it){return it.ok}).length;view="result";result();window.scrollTo(0,0)}

/* ---- 画面：ホーム ---- */
function home(){
  view="home";stopTick();armed="";
  var seen=P().filter(function(q){var s=st(q.id);return s&&s.n}).length;
  var wrong=QS.filter(function(q){var s=st(q.id);return s&&s.n&&s.last===0}).length;
  var ex=S.hist.filter(function(h){return h.kind==="full"});
  var avg=ex.length?(ex.reduce(function(a,h){return a+h.score/h.total*10},0)/ex.length).toFixed(1):"–";
  var qt=quotas(Math.min(10,P().length));
  var h='<section class="panel start"><h2>第'+(ex.length+1)+'回　10問テスト</h2>'+
    '<div class="seg" role="group" aria-label="出題範囲">'+[["all","すべて"],["past","過去問ベース"],["plan","想定問題"]].map(function(x){var n=x[0]==="all"?QS["length"]:QS.filter(function(q){return q.k===x[0]}).length;return '<button class="segb" data-act="scope" data-s="'+x[0]+'" aria-pressed="'+(scope===x[0])+'">'+x[1]+' <small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<ul class="spec"><li>問題数 <b>10問</b></li><li>制限時間 <b>10分</b></li><li>形式 <b>選択式</b></li><li>目標 <b>8問正解</b></li></ul>'+
    '<p class="lead">'+FIELDS.map(function(f,i){return esc(f)+" "+qt[i]+"問"}).join("、")+"。まだ解いていない問題と、前回まちがえた問題から先に出します。</p>"+
    '<div class="row"><button class="btn pri" data-act="full">10問テストを始める</button>'+
    (wrong?'<button class="btn" data-act="wrong">まちがえた問題を復習（'+wrong+'問）</button>':'')+'</div></section>';
  h+='<section class="panel"><h2>これまでの成績</h2><div class="nums">'+
    '<div class="num"><span>テスト回数</span><b>'+ex.length+'<small> 回</small></b></div>'+
    '<div class="num"><span>平均点</span><b>'+avg+'<small> /10</small></b></div>'+
    '<div class="num"><span>解いた問題</span><b>'+seen+'<small> /'+P().length+'問</small></b></div></div>'+
    (ex.length?'<div class="chips" aria-label="最近のテストの得点">'+ex.slice(-8).map(function(x){var r=x.score/x.total;return '<span class="sc '+(r>=.8?"good":r<.6?"bad":"")+'">'+x.score+"/"+x.total+"</span>"}).join("")+"</div>":'<p class="lead">1回目のテストを終えると、得点と分野別の定着度がここに出ます。</p>')+
    "</section>";
  h+='<section class="panel"><h2>分野別の定着度</h2><div class="fl">'+FIELDS.map(function(f,i){
    var pool=P().filter(function(q){return q.f===f}),ok=0,ng=0;
    pool.forEach(function(q){var s=st(q.id);if(s&&s.n){if(s.last)ok++;else ng++}});
    return '<div class="fi"><span class="nm">'+esc(f)+'</span><div class="meter" role="img" aria-label="正解 '+ok+'問、要復習 '+ng+'問、全'+pool.length+'問"><i style="width:'+(ok/pool.length*100)+'%"></i><i class="w" style="width:'+(ng/pool.length*100)+'%"></i></div>'+
      '<span class="meta">正解 '+ok+'　要復習 '+ng+'　未出題 '+(pool.length-ok-ng)+'（全'+pool.length+'問）</span>'+
      '<button class="btn sm" data-act="field" data-f="'+i+'">この分野を解く</button></div>';
  }).join("")+'</div><p class="legend"><span><i class="g"></i>直近で正解</span><span><i class="w"></i>直近で不正解</span><span><i></i>未出題</span></p></section>';
  if(seen)h+='<div class="row end"><button class="btn ghost sm" data-act="reset">'+(armed==="reset"?"本当に消す（もう一度押す）":"記録をすべて消す")+"</button></div>";
  app.innerHTML=h;
}

/* ---- 画面：解答 ---- */
function passHtml(q){return q.p?'<div class="passage"'+(/^[\x00-\x7F\s]+$/.test(q.p.slice(0,200))?' lang="en"':"")+'>'+esc(q.p)+"</div>":""}
function expHtml(q,it){
  var ok=it.pick===A(q),mine=it.pick===null?"未回答":q.c[it.pick];
  return '<div class="exp"><p class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+"　答えは「"+esc(q.c[A(q)])+"」"+(ok?"":'<br><span class="src">あなたの答え：'+esc(mine)+"</span>")+"</p>"+
    "<p>"+esc(q.e)+"</p>"+
    '<p class="memo"><span>覚え方</span>'+esc(q.m)+"</p>"+
    '<p class="src">'+(q.fix?"出典：早稲田大学 "+esc(q.ref)+"（試験問題を原文のまま掲載。解説・覚え方は独自に作成したもので、試験実施団体とは関係ありません）":q.k==="past"?"過去問ベース：早稲田大学 "+esc(q.ref)+"（問われた知識をもとに作り直した問題です）":"想定問題（早稲田大学の出題傾向に合わせて作成した問題で、実際の出題ではありません）")+"</p></div>";
}
function optsHtml(q,it,reveal){
  return '<div class="opts">'+it.order.map(function(ci,j){
    var cls="";
    if(reveal){cls=ci===A(q)?" right":(it.pick===ci?" wrong":"")}else if(it.pick===ci)cls=" sel";
    return '<button class="opt'+cls+'" data-act="pick" data-c="'+ci+'"'+(reveal?" disabled":"")+'><span class="mark">'+(q.fix?String(ci+1):"abcde".charAt(j))+'</span><span class="txt">'+esc(q.c[ci])+"</span></button>";
  }).join("")+"</div>";
}
function exam(){
  var N=X.items.length,it=X.items[X.k],q=byId[it.id],drill=X.mode==="drill",answered=it.pick!==null,last=X.k===N-1;
  var h='<div class="bar"><div class="bar-row"><span class="bar-title">'+esc(X.title)+'</span><span class="count">問 '+(X.k+1)+"<small> /"+N+"</small></span>"+(drill?"":'<span class="clock" id="clock"></span>')+"</div>"+
    '<div class="dots">'+X.items.map(function(x,i){
      var c=drill?(x.pick===null?"":(x.ok?" ok":" ng")):(x.pick===null?"":" done");
      return '<button class="dot'+c+(i===X.k?" cur":"")+'" data-act="go" data-i="'+i+'" aria-label="問'+(i+1)+'へ"'+(drill&&x.pick===null&&i!==X.k?" disabled":"")+"></button>";
    }).join("")+"</div></div>";
  h+='<article class="sheet"><p class="chip">'+esc(q.f)+"｜"+(q.fix?"過去問題（原文）":KIND[q.k])+'</p>'+passHtml(q)+'<h2 class="q">'+esc(q.q)+"</h2>"+optsHtml(q,it,drill&&answered)+(drill&&answered?expHtml(q,it):"")+"</article>";
  if(armed==="grade"){
    var un=X.items.filter(function(x){return x.pick===null}).length;
    h+='<div class="ask"><p>未回答が'+un+'問あります。未回答は不正解になります。</p><div class="row"><button class="btn sm" data-act="unans">未回答の問題へ</button><button class="btn sm" data-act="grade2">このまま採点する</button></div></div>';
  }
  h+='<div class="row split"><button class="btn ghost sm" data-act="quit">'+(armed==="quit"?(drill?"ホームへ戻る（もう一度押す）":"記録せずにやめる（もう一度押す）"):"やめる")+"</button><div class=\"row\">"+
    '<button class="btn" data-act="prev"'+(X.k===0?" disabled":"")+">前へ</button>"+
    (drill
      ? (last?'<button class="btn pri" data-act="fin"'+(answered?"":" disabled")+">結果を見る</button>":'<button class="btn pri" data-act="next"'+(answered?"":" disabled")+">次へ</button>")
      : (last?'<button class="btn pri" data-act="grade">採点する</button>':'<button class="btn pri" data-act="next">次へ</button>'))+
    "</div></div>";
  app.innerHTML=h;paintClock();
}

/* ---- 画面：結果 ---- */
function result(){
  var N=X.items.length,r=X.score/N,drill=X.mode==="drill";
  var j=r>=.8?["good","目標クリアです。この調子で次の回へ進みましょう。"]:r>=.7?["mid","あと1問で目標の8割です。まちがえた問題の解説を読んでから次へ。"]:["bad","解説と覚え方を確認して、同じ分野をもう5問解いてみましょう。"];
  var h='<section class="panel"><h2>'+esc(X.title)+"の結果</h2>"+
    '<div class="score"><b>'+X.score+"</b><span>/ "+N+"問"+(drill?"":"　解答時間 "+Math.floor(X.sec/60)+"分"+("0"+X.sec%60).slice(-2)+"秒"+(X.auto?"（時間切れ）":""))+"</span></div>"+
    '<p class="judge '+j[0]+'">'+j[1]+"</p>";
  var wf=[];X.items.forEach(function(it){var f=byId[it.id].f;if(!it.ok&&wf.indexOf(f)<0)wf.push(f)});
  h+='<div class="row">'+wf.map(function(f){return '<button class="btn sm" data-act="similar" data-f="'+FIELDS.indexOf(f)+'">'+esc(f)+"をもう5問</button>"}).join("")+
    '<button class="btn sm pri" data-act="full">次の10問テスト</button><button class="btn sm" data-act="home">ホームへ</button></div></section>';
  var hasY=X.items.every(function(it){return typeof byId[it.id].y==="number"});
  if(hasY)h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(tab==="exp")+'" data-act="tab" data-t="exp">解説</button><button class="tab" role="tab" aria-selected="'+(tab==="tl")+'" data-act="tab" data-t="tl">年表で流れを見る</button></div>';
  if(tab==="tl"&&hasY){
    var s=X.items.slice().sort(function(a,b){return byId[a.id].y-byId[b.id].y});
    h+='<section class="panel"><p class="lead">今回の'+N+'問を古い順に並べました。出来事の時期と順序をあわせて確かめましょう。</p><ol class="tl">'+s.map(function(it){var q=byId[it.id];
      return '<li><span class="yr">'+yearLabel(q.y)+'</span><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="ev">'+esc(q.t)+"<small>"+esc(q.f)+"</small></span></li>"}).join("")+"</ol></section>";
  }else{
    h+='<div class="rev">'+X.items.map(function(it,i){var q=byId[it.id];
      return '<details class="it"'+(it.ok?"":" open")+'><summary><span class="ox '+(it.ok?"ok":"ng")+'">'+(it.ok?"○":"×")+'</span><span class="sm-t">問'+(i+1)+"　"+esc(q.t)+"<small>"+esc(q.f)+"｜"+(q.fix?"過去問題（原文）":KIND[q.k])+"</small></span></summary>"+
        '<div class="it-body">'+passHtml(q)+'<p class="q">'+esc(q.q)+"</p>"+optsHtml(q,it,true)+expHtml(q,it)+"</div></details>"}).join("")+"</div>";
  }
  app.innerHTML=h;
}

/* ---- 操作 ---- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a!=="quit"&&a!=="reset"&&a!=="grade"&&armed){var was=armed;armed="";if(was==="grade"&&a!=="grade2"&&a!=="unans"){/* 確認を閉じる */}}
  if(a==="full")begin("full");
  else if(a==="field")begin("field",FIELDS[+b.getAttribute("data-f")]);
  else if(a==="wrong")begin("wrong");
  else if(a==="similar"){var ex={};if(X)X.items.forEach(function(it){ex[it.id]=1});begin("similar",FIELDS[+b.getAttribute("data-f")],ex)}
  else if(a==="scope"){scope=b.getAttribute("data-s");try{localStorage.setItem(LS+"-scope",scope)}catch(e){}home()}
  else if(a==="home")home();
  else if(a==="reset"){if(armed==="reset"){S.stats={};S.hist=[];armed="";save();home()}else{armed="reset";home()}}
  else if(a==="tab"){tab=b.getAttribute("data-t");result()}
  else if(!X)return;
  else if(a==="pick"){
    var it=X.items[X.k],ci=+b.getAttribute("data-c");
    if(X.mode==="drill"){if(it.pick!==null)return;it.pick=ci;it.ok=ci===A(byId[it.id]);rec(it.id,it.ok,Date.now());save()}else{it.pick=ci}
    exam();
  }
  else if(a==="go"){X.k=+b.getAttribute("data-i");exam()}
  else if(a==="prev"){if(X.k>0)X.k--;exam();window.scrollTo(0,0)}
  else if(a==="next"){if(X.k<X.items.length-1)X.k++;exam();window.scrollTo(0,0)}
  else if(a==="grade"){if(X.items.some(function(x){return x.pick===null})){armed="grade";exam()}else grade(false)}
  else if(a==="grade2")grade(false);
  else if(a==="unans"){for(var i=0;i<X.items.length;i++){if(X.items[i].pick===null){X.k=i;break}}exam();window.scrollTo(0,0)}
  else if(a==="fin")finishDrill();
  else if(a==="quit"){if(armed==="quit"){X=null;home();window.scrollTo(0,0)}else{armed="quit";exam()}}
});

/* ---- 起動 ---- */
function start(data){
  loadLocal();setSync("local");
  if(data&&data.X&&data.X.items&&data.X.items.every(function(it){return byId[it.id]})){X=data.X;view=data.view||"exam";tab=data.tab||"exp";if(view==="result"){result()}else{view="exam";exam();startTick()}}
  else home();
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return (view==="home"||!X)?{}:{view:view,tab:tab,X:X}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body></html>
